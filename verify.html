          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f8fafc');
        } catch (_) {}
      })();
    </script>

        }

        function extractCertCode(rawInput) {
            if (!rawInput) return '';
            const trimmed = String(rawInput).trim();
            try {
                if (trimmed.includes('http://') || trimmed.includes('https://') || trimmed.includes('code=')) {
                    const urlObj = new URL(trimmed.startsWith('http') ? trimmed : `https://example.com/${trimmed}`);
                    const fromParam = urlObj.searchParams.get('code');
                    if (fromParam) return fromParam.trim().toUpperCase();
                }
            } catch (_) {
                const match = trimmed.match(/code=([A-Za-z0-9\-_]+)/i);
                if (match && match[1]) return match[1].trim().toUpperCase();
            }
            return trimmed.toUpperCase();
        }

        function formatThaiDate(isoStr) {
            try {
                const date = isoStr ? new Date(isoStr) : new Date();
                if (isNaN(date.getTime())) return '—';
                return date.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (_) {
                return '—';
            }
        }

        function maskLicense(val) {
            const s = String(val || '').trim();
            if (!s) return '—';
            if (s.length <= 5) return s;
            return `${s.slice(0, 3)}${'•'.repeat(Math.max(2, s.length - 6))}${s.slice(-3)}`;
        }

        /**
         * สร้างลายนิ้วมือยืนยันดิจิทัล (Anti-Forgery Fingerprint) จากรหัสประกาศนียบัตรและชื่อผู้ได้รับ
         */
        function buildDigitalSealHash(code = '', name = '') {
            const str = `${code}|${name}|RJCLOUD2030`;
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return `SEAL-${(h >>> 0).toString(16).toUpperCase().padStart(8, '0')}`;
        }

        function copyTextFallback(text) {
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'fixed';
            el.style.opacity = '0';
            document.body.appendChild(el);
            el.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
            document.body.removeChild(el);
            return ok;
        }

        function findLocalCertificate(code) {
            try {
                const savedCerts = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                if (savedCerts[code]) {
                    return {
                        ...savedCerts[code],
                        userType: normalizeUserType(savedCerts[code].userType),
                        source: 'local'
                    };
                }

                const possibleKeys = ['rjcloud_organ_state_v2027', 'rjcloud_user_v2027'];
                for (const key of possibleKeys) {
                    const raw = localStorage.getItem(key);
                    if (!raw) continue;
                    const parsed = JSON.parse(raw);
                    const u = parsed?.user || parsed;
                    if (u && String(u.certificateCode || '').toUpperCase() === code) {
                        const hist = Array.isArray(u.skillLabHistory) ? u.skillLabHistory : [];
                        const bestLab = typeof u.skillLabBestScore === 'number'
                            ? u.skillLabBestScore
                            : (hist.length > 0 ? Math.max(...hist.map(h => h.score || 0)) : null);
                        return {
                            code,
                            name: u.name || 'ผู้สำเร็จการอบรม',
                            license: u.license || u.licenseId || u.id || '',
                            position: u.position || 'บุคลากรทางการแพทย์',
                            hospital: u.hospital || 'เครือข่าย rjcloud.organ',
                            department: u.department || '',
                            province: u.province || '',
                            userType: normalizeUserType(u.userType),
                            courseTitleTH: DEFAULT_CERT.courseTitleTH,
                            orgTitleTH: DEFAULT_CERT.orgTitleTH,
                            signerName: DEFAULT_CERT.signerName,
                            signerPosition: DEFAULT_CERT.signerPosition,
                            posttestScore: u.posttest || 'ผ่านเกณฑ์ (≥ 80%)',
                            skillLabBestScore: bestLab,
                            issuedAt: u.certificateIssuedAt || new Date().toISOString(),
                            status: 'valid',
                            source: 'local'
                        };
                    }
                }
            } catch (err) {
                console.warn('Local lookup error:', err);
            }
            return null;
        }

                setTilt({

                        setIsStarting(false);
                        return;
                    }
                    try {
                        const html5Qr = new window.Html5Qrcode('qr-reader');
                        scannerRef.current = html5Qr;
                        await html5Qr.start(
                            { facingMode: 'environment' },
                            { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 },
                            (decodedText) => {
                                if (hasScannedRef.current) return;
                                hasScannedRef.current = true;
                                onScanSuccess(extractCertCode(decodedText));
                            },
                            () => {}

        // ============================================================================
        // 5. MAIN 2030 VERIFICATION APPLICATION
        // ============================================================================
        function Verify2030App() {
            const isAdminPreview = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') === '1'; }
                catch (_) { return false; }
            }, []);

            // Adaptive Theme synced across all 2030 pages
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f8fafc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => {
                setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            const [inputCode, setInputCode] = useState('');
            const [status, setStatus] = useState('idle'); // idle | loading | verified | not_found
            const [record, setRecord] = useState(null);
            const [lastSearched, setLastSearched] = useState('');
            const [scannerOpen, setScannerOpen] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3200);
            }, []);

            useEffect(() => {
                const el = document.getElementById('verify-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            const verifyCode = useCallback(async (rawCode) => {
                const code = extractCertCode(rawCode);
                if (!code) {
                    showToast('กรุณากรอกรหัสประกาศนียบัตรก่อนตรวจสอบค่ะ', 'error');
                    return;
                }

                setInputCode(code);
                setLastSearched(code);
                setStatus('loading');
                setRecord(null);

                try {
                    const url = new URL(window.location.href);
                    url.searchParams.set('code', code);
                    window.history.replaceState({}, '', url.toString());
                } catch (_) {}

                // 1. ตรวจจากชุดตัวอย่าง Demo / Preview
                if (SAMPLE_DEMO_CERTS[code]) {
                    await new Promise(r => setTimeout(r, 340));
                    setRecord(SAMPLE_DEMO_CERTS[code]);
                    setStatus('verified');
                    return;
                }

                // 2. ตรวจจาก Cloud Firestore (Public Read-Only — ป้องกันทับสิทธิ์ Admin 2 ชั้น)
                if (isCloudConfigured && fbDb) {
                    try {
                        if (fbAuth && !isAdminPreview) {
                            if (typeof fbAuth.authStateReady === 'function') {
                                await fbAuth.authStateReady().catch(() => {});
                            }
                            if (!fbAuth.currentUser) {
                                await signInAnonymously(fbAuth).catch(() => {});
                            }
                        }
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code));
                        if (snap.exists()) {
                            const data = snap.data();
                            setRecord({
                                code: data.code || code,
                                name: data.name || 'ผู้สำเร็จการอบรม',
                                license: data.license || data.licenseId || '',
                                position: data.position || 'บุคลากรทางการแพทย์',
                                hospital: data.hospital || 'เครือข่าย rjcloud.organ',
                                department: data.department || '',
                                province: data.province || '',
                                userType: normalizeUserType(data.userType),
                                courseTitleTH: data.courseTitleTH || DEFAULT_CERT.courseTitleTH,
                                orgTitleTH: data.orgTitleTH || DEFAULT_CERT.orgTitleTH,
                                signerName: data.signerName || DEFAULT_CERT.signerName,
                                signerPosition: data.signerPosition || DEFAULT_CERT.signerPosition,
                                posttestScore: data.posttestScore || data.posttest || 'ผ่านเกณฑ์ (≥ 80%)',
                                skillLabBestScore: typeof data.skillLabBestScore === 'number' ? data.skillLabBestScore : null,
                                issuedAt: data.issuedAt || data.certificateIssuedAt || '',
                                status: data.status || 'valid',
                                source: 'cloud'
                            });
                            setStatus('verified');
                            return;
                        }
                    } catch (err) {
                        console.warn('Firestore verify fallback:', err);
                    }
                }

                // 3. ตรวจจาก Local Cache บนเครื่องเดียวกัน
                const localHit = findLocalCertificate(code);
                if (localHit) {
                    setRecord(localHit);
                    setStatus('verified');
                    return;
                }

                // 4. ไม่พบข้อมูล
                await new Promise(r => setTimeout(r, 260));
                setStatus('not_found');
            }, [showToast, isAdminPreview]);

            useEffect(() => {
                try {
                    const initialCode = new URLSearchParams(window.location.search).get('code');
                    if (initialCode) verifyCode(initialCode);
                } catch (_) {}
            }, [verifyCode]);

            const handleScanResult = useCallback((scannedCode) => {
                setScannerOpen(false);
                if (scannedCode) {
                    showToast(`สแกนพบรหัส ${scannedCode} กำลังตรวจสอบ...`);
                    verifyCode(scannedCode);
                }
            }, [verifyCode, showToast]);

            const handleShareOrCopy = async () => {
                const verifyUrl = `${window.location.origin}${window.location.pathname}?code=${encodeURIComponent(record?.code || lastSearched)}`;
                try {
                    if (navigator.share) {
                        await navigator.share({
                            title: `ผลการรับรองประกาศนียบัตร ${record?.code || ''}`,
                            text: `ยืนยันความถูกต้องประกาศนียบัตร rjcloud.organ ของ ${record?.name || ''}`,
                            url: verifyUrl
                        });
                        return;
                    }
                } catch (err) {
                    if (err?.name === 'AbortError') return;
                }
                const copied = copyTextFallback(verifyUrl);
                if (copied) showToast('คัดลอกลิงก์ยืนยันความถูกต้องแล้วค่ะ');
                else showToast('ไม่สามารถคัดลอกลิงก์ได้ในขณะนี้ค่ะ', 'error');
            };

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* Top Spatial Header */}
                    <header className="sticky top-0 z-20 spatial-header no-print">
                        <div className="max-w-3xl mx-auto px-4 h-14 md:h-16 flex items-center justify-between gap-2">
                            <a href="./index.html" className="flex items-center gap-2.5 min-w-0">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-md shrink-0">
                                    <Icon name="ShieldCheck" size={19} />
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5">
                                        <span className="font-display font-extrabold text-base text-primary-adaptive leading-none truncate">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="px-1.5 py-0.5 rounded bg-aurora-500/20 text-accent-adaptive font-mono text-[9px] font-bold">
                                            2030
                                        </span>
                                    </div>
                                    <span className="text-[10px] font-mono text-muted-adaptive uppercase">Holographic Verify Portal</span>
                                </div>
                            </a>

                            <div className="flex items-center gap-2 shrink-0">
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                <a
                                    href="./index.html"
                                    className="spatial-soft px-3.5 py-2 rounded-xl text-primary-adaptive font-bold text-xs inline-flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={14} /> <span className="hidden sm:inline">หน้าผู้เรียน</span>
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* Main Verification Workspace */}
                    <main className="relative z-10 flex-1 w-full max-w-2xl mx-auto px-3.5 sm:px-6 py-6 md:py-10 space-y-5">
                        {/* Search & Laser QR Scan Card */}
                        <section className="spatial-card rounded-[1.75rem] p-5 sm:p-7 no-print">
                            <div className="flex items-start justify-between gap-3 mb-4">
                                <div>
                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-aurora-500/15 border border-aurora-400/35 text-accent-adaptive font-mono text-[10px] font-bold">
                                        <span className="w-1.5 h-1.5 rounded-full bg-aurora-400 animate-pulse" />
                                        {isCloudConfigured ? 'CLOUD ANTI-FORGERY ACTIVE' : 'SANDBOX & DEMO READY'}
                                    </span>
                                    <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive mt-2 leading-tight">
                                        ตรวจสอบประกาศนียบัตรตราโฮโลแกรม 2030
                                    </h1>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">
                                        สแกน QR Code จากใบประกาศนียบัตร หรือกรอกรหัสอ้างอิงเพื่อยืนยันคุณวุฒิแบบ Real-time
                                    </p>
                                </div>
                                <div className="w-11 h-11 rounded-2xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center shrink-0">
                                    <Icon name="QrCode" size={23} />
                                </div>
                            </div>

                            <form onSubmit={(e) => { e.preventDefault(); verifyCode(inputCode); }} className="space-y-3">
                                <div className="relative">
                                    <Icon name="Search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-muted-adaptive" />
                                    <input
                                        type="text"
                                        value={inputCode}
                                        onChange={e => setInputCode(e.target.value)}
                                        placeholder="กรอกรหัส เช่น RJC-2027-XXXXXX"
                                        autoComplete="off"
                                        className="touch-target spatial-input w-full pl-11 pr-11 py-3.5 rounded-2xl font-mono text-base font-bold uppercase tracking-wide"
                                    />
                                    {inputCode && (
                                        <button
                                            type="button"
                                            onClick={() => { setInputCode(''); setStatus('idle'); setRecord(null); }}
                                            className="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full text-muted-adaptive hover:text-primary-adaptive flex items-center justify-center"
                                        >
                                            <Icon name="X" size={16} />
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    <button
                                        type="submit"
                                        disabled={status === 'loading' || !inputCode.trim()}
                                        className="touch-target w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm sm:text-base shadow-[0_12px_28px_-6px_rgba(16,185,129,0.4)] flex items-center justify-center gap-2 transition-all active:scale-[0.98]"
                                    >
                                        <Icon name="CheckCircle2" size={18} />
                                        {status === 'loading' ? 'กำลังตรวจสอบ...' : 'ตรวจสอบรหัสทันที'}
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setScannerOpen(true)}
                                        className="touch-target spatial-soft w-full py-3.5 px-5 rounded-2xl text-primary-adaptive font-display font-bold text-sm sm:text-base flex items-center justify-center gap-2 transition-all active:scale-[0.98]"
                                    >
                                        <Icon name="ScanLine" size={18} className="text-accent-adaptive" />
                                        เปิดกล้องสแกน QR เลเซอร์
                                    </button>
                                </div>
                            </form>

                            {/* Quick Demo Test Codes */}
                            <div className="mt-4 pt-3.5 border-t border-white/10 flex flex-wrap items-center justify-between gap-2 text-xs">
                                <span className="text-muted-adaptive">ทดสอบดูบัตรรับรองตราโฮโลแกรม 3 มิติ:</span>
                                <div className="flex flex-wrap gap-1.5">
                                    <button
                                        type="button"
                                        onClick={() => verifyCode('RJC-2027-DEMO01')}
                                        className="font-mono font-bold text-accent-adaptive bg-aurora-500/15 hover:bg-aurora-500/25 border border-aurora-400/30 px-3 py-1.5 rounded-xl transition-colors"
                                    >
                                        RJC-2027-DEMO01
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => verifyCode('RJC-2027-PREVIEW')}
                                        className="font-mono font-bold text-prism-adaptive bg-prism-500/15 hover:bg-prism-500/25 border border-prism-400/30 px-3 py-1.5 rounded-xl transition-colors"
                                    >
                                        RJC-2027-PREVIEW
                                    </button>
                                </div>
                            </div>
                        </section>

                        {/* Loading State */}
                        {status === 'loading' && (
                            <div className="spatial-card rounded-[1.75rem] p-10 text-center flex flex-col items-center justify-center gap-3">
                                <div className="w-11 h-11 border-4 border-aurora-400 border-t-transparent rounded-full animate-spin" />
                                <p className="font-display font-bold text-primary-adaptive">กำลังตรวจสอบรหัสรับรองบน Cloud 2030...</p>
                                <p className="font-mono text-xs text-prism-adaptive">{lastSearched}</p>
                            </div>
                        )}

                        {/* Verified 3D Holographic Result */}
                        {status === 'verified' && record && (
                            <HolographicVerifiedCard record={record} onShareOrCopy={handleShareOrCopy} />
                        )}

                        {/* Not Found State */}
                        {status === 'not_found' && (
                            <section className="spatial-card rounded-[1.75rem] p-6 sm:p-8 text-center border-rose-400/40">
                                <div className="w-14 h-14 rounded-2xl bg-rose-500/15 text-rose-400 flex items-center justify-center mx-auto mb-3.5">
                                    <Icon name="FileWarning" size={28} />
                                </div>
                                <h2 className="font-display text-lg sm:text-xl font-extrabold text-primary-adaptive">
                                    ไม่พบข้อมูลประกาศนียบัตรนี้ในระบบ
                                </h2>
                                <p className="text-sm text-secondary-adaptive mt-1.5 max-w-md mx-auto leading-relaxed">
                                    รหัส <span className="font-mono font-bold text-rose-400">{lastSearched}</span> ไม่ตรงกับรายการที่ได้รับการรับรอง กรุณาตรวจสอบตัวอักษรอีกครั้ง หรือติดต่อผู้ดูแลระบบที่{' '}
                                    <a href={`mailto:${CONFIG.contactEmail}`} className="font-bold text-accent-adaptive underline">
                                        {CONFIG.contactEmail}
                                    </a>
                                </p>
                                <button
                                    type="button"
                                    onClick={() => setScannerOpen(true)}
                                    className="touch-target mt-5 px-6 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm inline-flex items-center gap-2"
                                >
                                    <Icon name="ScanLine" size={17} /> ลองสแกน QR Code ใหม่อีกครั้ง
                                </button>
                            </section>
                        )}

                        {/* Idle Helper Features */}
                        {status === 'idle' && (
                            <section className="grid grid-cols-1 sm:grid-cols-3 gap-3 no-print">
                                {[
                                    { icon: 'ScanLine', title: 'สแกนเลเซอร์ทันที', desc: 'ใช้กล้องมือถือสแกน QR มุมขวาล่างใบประกาศนียบัตรได้ทันทีไม่ต้องลงแอป' },
                                    { icon: 'Sparkles', title: 'ตราโฮโลแกรม 3 มิติ', desc: 'แสดงบัตรรับรองพร้อมรหัสลายนิ้วมือดิจิทัล ผล Post-test และดัชนี Empathy' },
                                    { icon: 'Lock', title: 'คุ้มครองข้อมูล PDPA', desc: 'แสดงเฉพาะข้อมูลยืนยันคุณวุฒิ ปกปิดอีเมล เบอร์โทร และเลขใบอนุญาตบางส่วน' }
                                ].map((item, i) => (
                                    <div key={i} className="spatial-card rounded-2xl p-4 flex sm:flex-col items-start gap-3 sm:gap-2">
                                        <div className="w-9 h-9 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center shrink-0">
                                            <Icon name={item.icon} size={18} />
                                        </div>
                                        <div>
                                            <h3 className="font-display font-bold text-sm text-primary-adaptive">{item.title}</h3>
                                            <p className="text-xs text-muted-adaptive mt-0.5 leading-relaxed">{item.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </section>
                        )}
                    </main>

                    <footer className="relative z-10 text-center px-4 py-5 text-[11px] text-muted-adaptive font-medium no-print">
                        <p>{CONFIG.appName} • {CONFIG.edition}</p>
                        <p className="mt-0.5">ศูนย์ประสานงานและสนับสนุนระบบ: {CONFIG.contactEmail}</p>
                    </footer>

                    <QrScannerModal
                        isOpen={scannerOpen}
                        onClose={() => setScannerOpen(false)}
                        onScanSuccess={handleScanResult}
                    />

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('verify-root'));
        root.render(<VerifyErrorBoundary><Verify2030App /></VerifyErrorBoundary>);
    </script>
</body>
</html>
