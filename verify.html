    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

         * - แพทย์: ไม่แสดงคำว่า CNEU แสดงชั่วโมงการฝึกอบรมวิชาการทางการแพทย์ (หรือ CME หากระบุ)
         * - บุคลากรสหวิชาชีพ: ไม่แสดงคำว่า CNEU แสดงชั่วโมงการพัฒนาสมรรถนะวิชาชีพ
         */
        function resolveVerifyCreditMeta(rec) {
            if (!rec) return null;
            if (typeof CERT.getCertificateCreditMeta === 'function') {
                return CERT.getCertificateCreditMeta(rec, rec, {
                    activityCode: rec.cneuActivityCode,
                    cneuCredits: rec.cneuCredits,
                    cmeActivityCode: rec.cmeActivityCode,
                    cmeCredits: rec.cmeCredits,
                    trainingHours: rec.trainingHours || '8'
                });
            }

            const explicit = String(rec.professionGroup || '').trim();
            const txt = `${rec.name || ''} ${rec.position || ''}`;
            const professionGroup = (explicit === 'พยาบาล' || explicit === 'แพทย์' || explicit === 'บุคลากรสหวิชาชีพ')
                ? explicit
                : (/(นพ\.|พญ\.|แพทย์|หมอ|doctor|\bm\.?d\.?\b)/i.test(txt) && !/พยาบาล/.test(txt)
                    ? 'แพทย์'
                    : (/(พว\.|พยาบาล|nurse|\brn\b)/i.test(txt) ? 'พยาบาล' : 'บุคลากรสหวิชาชีพ'));

            const isNurseCneu = typeof rec.cneuEligible === 'boolean'
                ? rec.cneuEligible
                : (professionGroup === 'พยาบาล');
            const trainingHours = String(rec.trainingHours || '8').trim() || '8';

            if (isNurseCneu) {
                const rawCode = String(rec.cneuActivityCode || '').trim();
                const rawCredits = String(rec.cneuCredits || '').trim();
                const lineTextTH = (rawCode || rawCredits)
                    ? [rawCode ? `รหัสกิจกรรม ${rawCode}` : '', rawCredits ? `จำนวน ${rawCredits} หน่วยคะแนน` : ''].filter(Boolean).join(' • ')
                    : `จำนวน ${trainingHours} ชั่วโมงการฝึกอบรมมาตรฐานวิชาชีพ`;
                return {
                    professionGroup: 'พยาบาล',
                    isNurseCneu: true,
                    creditType: 'CNEU',
                    badgeLabelTH: 'หน่วยคะแนนการศึกษาต่อเนื่องทางการพยาบาล (CNEU • สภาการพยาบาล)',
                    licenseLabelTH: 'เลขที่ใบอนุญาตประกอบวิชาชีพการพยาบาล',
                    lineTextTH,
                    trainingHours
                };
            }

            if (professionGroup === 'แพทย์') {
                const cmeCode = String(rec.cmeActivityCode || '').trim();
                const cmeCredits = String(rec.cmeCredits || '').trim();
                const hasCme = Boolean(cmeCode || cmeCredits);
                const lineTextTH = hasCme
                    ? [cmeCode ? `รหัสกิจกรรม CME ${cmeCode}` : '', cmeCredits ? `จำนวน ${cmeCredits} หน่วยคะแนน` : ''].filter(Boolean).join(' • ')
                    : `จำนวน ${trainingHours} ชั่วโมงการฝึกอบรมวิชาการทางการแพทย์`;
                return {
                    professionGroup: 'แพทย์',
                    isNurseCneu: false,
                    creditType: hasCme ? 'CME' : 'HOURS',
                    badgeLabelTH: hasCme ? 'หน่วยคะแนนการศึกษาต่อเนื่องแพทย์ (CME)' : 'การรับรองชั่วโมงการฝึกอบรมวิชาการทางการแพทย์',
                    licenseLabelTH: 'เลขที่ใบอนุญาตประกอบวิชาชีพเวชกรรม',
                    lineTextTH,
                    trainingHours
                };
            }

            return {
                professionGroup: 'บุคลากรสหวิชาชีพ',
                isNurseCneu: false,
                creditType: 'HOURS',
                badgeLabelTH: 'การรับรองชั่วโมงการพัฒนาสมรรถนะบุคลากรทางการแพทย์',
                licenseLabelTH: 'เลขที่ใบอนุญาตวิชาชีพ / รหัสประจำตัวบุคลากร',
                lineTextTH: `จำนวน ${trainingHours} ชั่วโมงการพัฒนาสมรรถนะวิชาชีพ`,
                trainingHours
            };
        }

        let fbApp = null, fbAuth = null, fbDb = null;
        const isCloudConfigured = Boolean(CONFIG.firebaseConfig?.apiKey && CONFIG.firebaseConfig?.projectId);
        if (isCloudConfigured) {
            try {
                fbApp = getApps().length === 0 ? initializeApp(CONFIG.firebaseConfig) : getApp();
                fbAuth = getAuth(fbApp);
                fbDb = getFirestore(fbApp);
            } catch (err) { console.warn('Firebase init warning:', err); }
        }

        function formatThaiDateSafe(isoStr) {
            try {
                const d = isoStr ? new Date(isoStr) : new Date();
                return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (_) { return '-'; }
        }

        function copyTextSafe(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = String(text || '');
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (ok) return true;
            } catch (_) {}
            return false;
        }

        // ============================================================================
        // 2. UI PRIMITIVES & MINI QR CANVAS
        // ============================================================================
        class VerifyErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, err: null }; }
            static getDerivedStateFromError(err) { return { hasError: true, err }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6 bg-void-950 text-white">
                            <div className="spatial-card max-w-md w-full rounded-3xl p-6 text-center space-y-4 border-rose-500/40">
                                <h2 className="font-display font-bold text-lg text-rose-400">พบข้อผิดพลาดในการตรวจสอบเอกสาร</h2>
                                <p className="text-xs font-mono bg-rose-500/10 text-rose-200 p-3 rounded-xl overflow-auto">{String(this.state.err?.message || this.state.err)}</p>
                                <button type="button" onClick={() => window.location.reload()} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-bold text-sm">โหลดหน้าใหม่</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function Icon({ name, size = 18, className = '' }) {
            const Comp = LucideIcons[name] || LucideIcons.ShieldCheck || LucideIcons.QrCode;
            return Comp ? <Comp size={size} className={className} /> : null;
        }

        function ThemeToggleButton({ theme, onToggle }) {
            const isDark = theme === 'dark';
            return (
                <button type="button" onClick={onToggle} aria-label="สลับโหมดมืดหรือสว่าง" className="spatial-soft px-2.5 sm:px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 text-primary-adaptive shrink-0">
                    <Icon name={isDark ? 'Sun' : 'Moon'} size={15} className={isDark ? 'text-amber-300' : 'text-indigo-600'} />
                    <span className="hidden sm:inline">{isDark ? 'โหมดสว่าง' : 'โหมดมืด'}</span>
                </button>
            );
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="no-print fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[160] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-2xl flex items-center gap-2 text-xs sm:text-sm font-bold text-white ${
                        toast.type === 'error' ? 'bg-rose-700/95 border-rose-400/60' : 'bg-emerald-700/95 border-emerald-400/60'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : 'CheckCircle2'} size={16} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function MiniQrCanvas({ url, size = 92 }) {
            const ref = useRef(null);
            useEffect(() => {
                const canvas = ref.current;
                if (!canvas || !url || typeof window.qrcode !== 'function') return;
                try {
                    const qr = window.qrcode(0, 'M');
                    qr.addData(url);
                    qr.make();
                    const count = qr.getModuleCount();
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, size, size);
                    const cell = size / count;
                    ctx.fillStyle = '#0f172a';
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                ctx.fillRect(Math.floor(c * cell), Math.floor(r * cell), Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    }
                } catch (_) {}
            }, [url, size]);
            return <canvas ref={ref} width={size} height={size} className="rounded-xl bg-white p-1.5 shadow" />;
        }

        // ============================================================================
        // 3. MAIN CERTIFICATE VERIFICATION APPLICATION (PROFESSION-AWARE • EQUAL HONOR)
        // ============================================================================
        function VerifyApp() {
            const initialCode = useMemo(() => {
                try { return String(new URLSearchParams(window.location.search).get('code') || '').trim().toUpperCase(); }
                catch (_) { return ''; }
            }, []);

            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020612' : '#edf6fd');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            const [authReady, setAuthReady] = useState(!isCloudConfigured);
            const [codeInput, setCodeInput] = useState(initialCode);
            const [lookupStatus, setLookupStatus] = useState(initialCode ? 'loading' : 'idle'); // idle | loading | valid | not_found
            const [certRecord, setCertRecord] = useState(null);
            const [tiltStyle, setTiltStyle] = useState({ transform: 'rotateX(0deg) rotateY(0deg)', '--mx': '50%', '--my': '35%' });
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3000);
            }, []);

            useEffect(() => {
                const el = document.getElementById('verify-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Firebase Anonymous Auth (พร้อม Safety Timeout 5 วินาทีป้องกันโหลดค้าง)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth) { setAuthReady(true); return; }
                let active = true;
                let anonTried = false;
                const safety = setTimeout(() => { if (active) setAuthReady(true); }, 5000);
                let unsub = () => {};
                try {
                    unsub = onAuthStateChanged(
                        fbAuth,
                        async (fbUser) => {
                            if (!active) return;
                            if (!fbUser && !anonTried) {
                                anonTried = true;
                                try { await signInAnonymously(fbAuth); } catch (_) { if (active) setAuthReady(true); }
                                return;
                            }
                            setAuthReady(true);
                        },
                        () => { if (active) setAuthReady(true); }
                    );
                } catch (_) {
                    if (active) setAuthReady(true);
                }
                return () => { active = false; clearTimeout(safety); try { unsub(); } catch (_) {} };
            }, []);

            const performVerify = useCallback(async (rawCode) => {
                const cleanCode = String(rawCode || '').trim().toUpperCase();
                if (!cleanCode) {
                    setLookupStatus('idle');
                    setCertRecord(null);
                    return;
                }
                setCodeInput(cleanCode);
                setLookupStatus('loading');

                // อัปเดต URL query parameter โดยไม่รีโหลดหน้า
                try {
                    const nextUrl = new URL(window.location.href);
                    nextUrl.searchParams.set('code', cleanCode);
                    window.history.replaceState({}, '', nextUrl.toString());
                } catch (_) {}

                // รหัสตัวอย่างพรีวิวครบทั้ง 3 กลุ่มวิชาชีพ
                if (DEMO_CERT_RECORDS[cleanCode]) {
                    setCertRecord(DEMO_CERT_RECORDS[cleanCode]);
                    setLookupStatus('valid');
                    return;
                }

                // ค้นหาจากทะเบียนสาธารณะ certificates/{code} บน Firebase Firestore
                if (fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', cleanCode));
                        if (snap.exists()) {
                            const data = snap.data() || {};
                            // ล้างฟิลด์ประเภทการเรียนและ PII ออกเสมอ เพื่อคุ้มครอง PDPA และคงมาตรฐานสิทธิ์/เกียรติเท่าเทียมกัน 100%
                            const sanitized = { ...data, code: data.code || cleanCode };
                            delete sanitized.userType;
                            delete sanitized.email;
                            delete sanitized.phone;
                            setCertRecord(sanitized);
                            setLookupStatus(sanitized.status === 'revoked' ? 'not_found' : 'valid');
                            return;
                        }
                    } catch (err) {
                        console.warn('Certificate verify query warning:', err);
                    }
                }

                setCertRecord(null);
                setLookupStatus('not_found');
            }, []);

            // ค้นหาอัตโนมัติเมื่อเปิดลิงก์จาก QR Code (?code=...)
            useEffect(() => {
                if (authReady && initialCode) {
                    performVerify(initialCode);
                }
            }, [authReady, initialCode, performVerify]);

            const creditMeta = useMemo(() => resolveVerifyCreditMeta(certRecord), [certRecord]);

            const handleCardPointerMove = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const clientX = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
                const px = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
                const py = Math.max(0, Math.min(1, (clientY - rect.top) / Math.max(1, rect.height)));
                const rotY = (px - 0.5) * 10;
                const rotX = (0.5 - py) * 8;
                setTiltStyle({
                    transform: `rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg)`,
                    '--mx': `${(px * 100).toFixed(1)}%`,
                    '--my': `${(py * 100).toFixed(1)}%`
                });
            };

            const handleCardPointerLeave = () => {
                setTiltStyle({ transform: 'rotateX(0deg) rotateY(0deg)', '--mx': '50%', '--my': '35%' });
            };

            const currentShareUrl = useMemo(() => {
                try {
                    const u = new URL(window.location.href);
                    if (certRecord?.code) u.searchParams.set('code', certRecord.code);
                    return u.toString();
                } catch (_) {
                    return `https://learn.coerj.com/verify.html?code=${encodeURIComponent(certRecord?.code || 'RJC-2027-DEMO01')}`;
                }
            }, [certRecord?.code]);

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* Top Header */}
                    <header className="no-print sticky top-0 z-30 spatial-header">
                        <div className="max-w-4xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <a href="./index.html" aria-label="กลับหน้าแรก" className="w-9 h-9 rounded-xl spatial-soft text-primary-adaptive flex items-center justify-center shrink-0">
                                    <Icon name="ArrowLeft" size={18} />
                                </a>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">VERIFY</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        Public Digital Certificate Verification • 3D Hologram Seal
                                    </span>
                                </div>
                            </div>
                            <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                        </div>
                    </header>

                    <main className="relative z-10 max-w-3xl w-full mx-auto px-3.5 sm:px-6 py-6 sm:py-9 space-y-6 flex-1">
                        {/* Search Bar Section */}
                        <section className="no-print spatial-card rounded-[2rem] p-5 sm:p-6 space-y-4">
                            <div className="text-center space-y-1">
                                <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">ORGAN TRANSPLANTATION CENTER OF RAJAVITHI HOSPITAL</span>
                                <h1 className="font-display font-extrabold text-xl sm:text-2xl text-primary-adaptive">ตรวจสอบความถูกต้องประกาศนียบัตรดิจิทัล</h1>
                                <p className="text-xs text-secondary-adaptive">สแกน QR Code จากใบประกาศนียบัตร หรือกรอกรหัสอ้างอิงเพื่อยืนยันความถูกต้องกับฐานข้อมูลกลาง</p>
                            </div>

                            <form onSubmit={(e) => { e.preventDefault(); performVerify(codeInput); }} className="flex flex-col sm:flex-row gap-2">
                                <input
                                    type="text"
                                    value={codeInput}
                                    onChange={e => setCodeInput(e.target.value.toUpperCase())}
                                    placeholder="กรอกรหัสประกาศนียบัตร เช่น RJC-2027-XXXXXX"
                                    className="touch-target spatial-input flex-1 px-4 py-3 rounded-2xl font-mono text-sm sm:text-base font-bold uppercase tracking-wider"
                                />
                                <button type="submit" className="rjc2-pill-btn touch-target px-6 py-3 rounded-2xl font-display font-extrabold text-sm shrink-0 inline-flex items-center justify-center gap-1.5">
                                    <Icon name="Search" size={16} /> ตรวจสอบรหัส
                                </button>
                            </form>

                            {/* ปุ่มทดลองเทียบใบรับรองครบทั้ง 3 กลุ่มวิชาชีพทันทีใน Preview */}
                            <div className="space-y-1.5 pt-1 text-center">
                                <p className="text-[11px] font-mono text-muted-adaptive">ทดลองตรวจสอบตัวอย่างแยกตามวิชาชีพ (Preview Mode):</p>
                                <div className="flex flex-wrap items-center justify-center gap-1.5 text-xs">
                                    <button type="button" onClick={() => performVerify('RJC-2027-DEMO01')} className="spatial-soft px-3 py-1.5 rounded-full text-accent-adaptive font-bold hover:border-aurora-400">
                                        พยาบาล • CNEU (DEMO01)
                                    </button>
                                    <button type="button" onClick={() => performVerify('RJC-2027-MD0002')} className="spatial-soft px-3 py-1.5 rounded-full text-prism-adaptive font-bold hover:border-prism-400">
                                        แพทย์ • ชม.อบรม (MD0002)
                                    </button>
                                    <button type="button" onClick={() => performVerify('RJC-2027-ALLIED4')} className="spatial-soft px-3 py-1.5 rounded-full text-secondary-adaptive font-bold hover:border-indigo-400">
                                        สหวิชาชีพ • ชม.พัฒนา (ALLIED4)
                                    </button>
                                </div>
                            </div>
                        </section>

                        {/* State: Loading */}
                        {lookupStatus === 'loading' && (
                            <section className="spatial-card rounded-[2rem] p-10 text-center space-y-3">
                                <div className="w-10 h-10 border-4 border-aurora-400 border-t-transparent rounded-full animate-spin mx-auto" />
                                <p className="font-display font-bold text-sm text-primary-adaptive">กำลังตรวจสอบรหัสประกาศนียบัตรกับฐานข้อมูล Cloud...</p>
                            </section>
                        )}

                        {/* State: Valid Certificate (3D Hologram Seal Card — Profession-Aware & Equal Honor 100%) */}
                        {lookupStatus === 'valid' && certRecord && creditMeta && (
                            <div className="holo-card-wrapper">
                                <article
                                    onMouseMove={handleCardPointerMove}
                                    onMouseLeave={handleCardPointerLeave}
                                    onTouchMove={handleCardPointerMove}
                                    onTouchEnd={handleCardPointerLeave}
                                    style={tiltStyle}
                                    className="holo-cert-card spatial-card rounded-[2rem] p-5 sm:p-8 space-y-6 border-aurora-400/50"
                                >
                                    <div className="holo-foil-overlay" aria-hidden="true" />

                                    {/* Verified Top Banner + 3D Hologram Seal */}
                                    <div className="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/15 pb-5">
                                        <div className="space-y-1.5">
                                            <div className="flex flex-wrap items-center gap-1.5">
                                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-aurora-500/20 border border-aurora-400/55 text-accent-adaptive font-display font-extrabold text-xs">
                                                    <Icon name="BadgeCheck" size={16} /> เอกสารรับรองของแท้ (VERIFIED AUTHENTIC)
                                                </span>
                                                <span className="inline-flex items-center px-2.5 py-1 rounded-full spatial-soft text-[11px] font-bold text-prism-adaptive">
                                                    กลุ่มวิชาชีพ: {creditMeta.professionGroup}
                                                </span>
                                            </div>
                                            <p className="font-mono text-xs font-bold text-prism-adaptive">
                                                CERTIFICATE NO: {certRecord.code}
                                                {certRecord.isDemoSample && <span className="ml-2 text-amber-400">(ตัวอย่างพรีวิว)</span>}
                                            </p>
                                        </div>

                                        {/* 3D Iridescent Hologram Seal */}
                                        <div className="flex items-center gap-3 shrink-0">
                                            <div className="holo-seal-disc w-16 h-16 rounded-full flex items-center justify-center p-1">
                                                <div className="w-full h-full rounded-full bg-void-950/85 border border-white/50 flex flex-col items-center justify-center text-center relative">
                                                    <div className="holo-seal-orbit absolute inset-1 rounded-full border border-dashed border-emerald-300/70" />
                                                    <Icon name="ShieldCheck" size={20} className="text-emerald-300" />
                                                    <span className="font-mono text-[8px] font-extrabold text-amber-200 tracking-wider">2027</span>
                                                </div>
                                            </div>
                                            <div className="text-left text-[11px] leading-tight">
                                                <span className="font-mono font-extrabold text-accent-adaptive block">3D HOLOGRAM SEAL</span>
                                                <span className="text-muted-adaptive block">ขยับเมาส์หรือเอียงจอ</span>
                                                <span className="text-muted-adaptive block">เพื่อตรวจแสงโฮโลแกรม</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Holder Identity & Course Info (มาตรฐานและเกียรติเท่าเทียมกันทุกวิชาชีพ) */}
                                    <div className="relative z-10 text-center space-y-1.5 py-1">
                                        <p className="text-xs font-semibold text-muted-adaptive">รับรองว่าบุคคลดังต่อไปนี้ได้สำเร็จการอบรมตามเกณฑ์มาตรฐานหลักสูตร</p>
                                        <h2 className="font-display font-extrabold text-2xl sm:text-3xl text-primary-adaptive">{certRecord.name}</h2>
                                        {certRecord.nameEN && <p className="font-display font-semibold text-sm sm:text-base text-prism-adaptive">{certRecord.nameEN}</p>}
                                        <p className="text-xs sm:text-sm text-secondary-adaptive">
                                            {certRecord.position || 'บุคลากรทางการแพทย์'} • {certRecord.hospital || '-'}
                                            {certRecord.province ? ` (${certRecord.province})` : ''}
                                        </p>
                                    </div>

                                    <div className="relative z-10 grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                        <div className="spatial-soft p-3.5 rounded-2xl space-y-1">
                                            <span className="font-mono text-[10px] text-muted-adaptive block">{creditMeta.licenseLabelTH}</span>
                                            <span className="font-mono font-extrabold text-sm text-prism-adaptive">{certRecord.license || '-'}</span>
                                        </div>
                                        <div className="spatial-soft p-3.5 rounded-2xl space-y-1">
                                            <span className="font-mono text-[10px] text-muted-adaptive block">วันที่ออกประกาศนียบัตร</span>
                                            <span className="font-bold text-sm text-primary-adaptive">{formatThaiDateSafe(certRecord.issuedAt)}</span>
                                        </div>
                                        <div className="spatial-soft p-3.5 rounded-2xl space-y-1 sm:col-span-2">
                                            <span className="font-mono text-[10px] text-muted-adaptive block">หลักสูตรที่สำเร็จการอบรม</span>
                                            <span className="font-display font-bold text-sm text-primary-adaptive block">{certRecord.courseTitleTH}</span>
                                            {certRecord.courseTitleEN && <span className="text-[11px] text-muted-adaptive block">{certRecord.courseTitleEN}</span>}
                                        </div>

                                        {/* กล่องการรับรองตรงตามกลุ่มวิชาชีพ (แสดง CNEU เฉพาะพยาบาล • แพทย์/สหวิชาชีพแสดงชั่วโมงอบรมมาตรฐาน) */}
                                        <div className={`spatial-soft p-3.5 rounded-2xl space-y-1 sm:col-span-2 ${creditMeta.isNurseCneu ? 'border-aurora-400/50 bg-aurora-500/10' : 'border-prism-400/45 bg-prism-500/10'}`}>
                                            <span className={`font-mono text-[10px] font-bold block ${creditMeta.isNurseCneu ? 'text-accent-adaptive' : 'text-prism-adaptive'}`}>
                                                {creditMeta.badgeLabelTH}
                                            </span>
                                            <span className={`font-display font-extrabold text-sm block ${creditMeta.isNurseCneu ? 'text-accent-adaptive' : 'text-primary-adaptive'}`}>
                                                {creditMeta.lineTextTH}
                                            </span>
                                        </div>

                                        <div className="spatial-soft p-3.5 rounded-2xl space-y-1">
                                            <span className="font-mono text-[10px] text-muted-adaptive block">หน่วยงานผู้ออกเอกสาร</span>
                                            <span className="font-bold text-primary-adaptive">{certRecord.orgTitleTH || 'ศูนย์ความเป็นเลิศทางการแพทย์ฯ โรงพยาบาลราชวิถี'}</span>
                                        </div>
                                        <div className="spatial-soft p-3.5 rounded-2xl space-y-1">
                                            <span className="font-mono text-[10px] text-muted-adaptive block">ผู้ลงนามรับรอง</span>
                                            <span className="font-bold text-primary-adaptive block">{certRecord.signerName || '-'}</span>
                                            <span className="text-[11px] text-muted-adaptive block">{certRecord.signerPosition || ''}</span>
                                        </div>
                                    </div>

                                    {/* Bottom QR + Actions */}
                                    <div className="relative z-10 pt-3 border-t border-white/15 flex flex-col sm:flex-row items-center justify-between gap-4">
                                        <div className="flex items-center gap-3">
                                            <MiniQrCanvas url={currentShareUrl} size={86} />
                                            <div className="text-[11px] text-muted-adaptive space-y-0.5">
                                                <p className="font-bold text-primary-adaptive">ตรวจสอบผ่านทะเบียนสาธารณะ rjcloud.organ 2.0</p>
                                                <p>คุ้มครอง PDPA: ไม่เปิดเผยอีเมลหรือหมายเลขโทรศัพท์</p>
                                                <p>มอบสิทธิ์และเกียรติมาตรฐานเดียวกันทุกประเภทผู้เรียน</p>
                                            </div>
                                        </div>

                                        <div className="no-print flex flex-wrap gap-2 w-full sm:w-auto">
                                            <button
                                                type="button"
                                                onClick={() => { copyTextSafe(currentShareUrl); showToast('คัดลอกลิงก์หน้าตรวจสอบประกาศนียบัตรแล้วค่ะ'); }}
                                                className="spatial-soft touch-target flex-1 sm:flex-initial px-4 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center justify-center gap-1.5"
                                            >
                                                <Icon name="Copy" size={14} /> คัดลอกลิงก์
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => window.print()}
                                                className="rjc2-pill-btn touch-target flex-1 sm:flex-initial px-4 py-2 rounded-xl font-display font-extrabold text-xs inline-flex items-center justify-center gap-1.5"
                                            >
                                                <Icon name="Printer" size={14} /> พิมพ์หลักฐาน
                                            </button>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        )}

                        {/* State: Not Found */}
                        {lookupStatus === 'not_found' && (
                            <section className="spatial-card rounded-[2rem] p-7 text-center space-y-3 border-rose-500/40">
                                <div className="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
                                    <Icon name="ShieldAlert" size={24} />
                                </div>
                                <h2 className="font-display font-extrabold text-lg text-rose-300">ไม่พบรหัสประกาศนียบัตรนี้ในฐานข้อมูล</h2>
                                <p className="text-xs text-secondary-adaptive max-w-md mx-auto leading-relaxed">
                                    กรุณาตรวจสอบตัวอักษรและขีดคั่นของรหัส <b className="font-mono text-primary-adaptive">{codeInput}</b> ให้ตรงกับบนใบประกาศนียบัตรอีกครั้งค่ะ
                                </p>
                            </section>
                        )}
                    </main>

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('verify-root'));
        root.render(<VerifyErrorBoundary><VerifyApp /></VerifyErrorBoundary>);
    </script>
    <!-- โหลด Babel ท้ายสุดหลังสคริปต์ทั้งหมด เพื่อให้แน่ใจว่าโค้ดครบ 100% ก่อนคอมไพล์ -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
