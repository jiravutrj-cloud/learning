            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const freqs = isSuccess ? [587.33, 880] : [311.13, 233.08];
                freqs.forEach((f, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    const start = ctx.currentTime + idx * 0.08;
                    osc.frequency.setValueAtTime(f, start);
                    gain.gain.setValueAtTime(0.0001, start);
                    gain.gain.exponentialRampToValueAtTime(0.045, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.24);
                });
            } catch (_) {}
        }

        function loadImgSafe(src) {
            return new Promise((resolve) => {
                if (!src) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function buildVerifiedCardPng(record, sealHash, verifyUrl) {
            const W = 1400, H = 880;
            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            // พื้นหลังเมทัลลิกเข้ม + แสงออโรร่า (rjcloud.organ 2.0 Atmospheric Cobalt)
            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#020818');
            bg.addColorStop(0.55, '#072052');
            bg.addColorStop(1, '#08326d');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            const glow1 = ctx.createRadialGradient(220, 160, 20, 220, 160, 440);
            glow1.addColorStop(0, 'rgba(52, 211, 153, 0.24)');
            glow1.addColorStop(1, 'transparent');
            ctx.fillStyle = glow1;
            ctx.fillRect(0, 0, W, H);

            const glow2 = ctx.createRadialGradient(1180, 720, 20, 1180, 720, 440);
            glow2.addColorStop(0, 'rgba(56, 189, 248, 0.26)');
            glow2.addColorStop(1, 'transparent');
            ctx.fillStyle = glow2;
            ctx.fillRect(0, 0, W, H);

            // กรอบเส้นกันปลอม 2 ชั้น
            const frameGrad = ctx.createLinearGradient(0, 0, W, H);
            frameGrad.addColorStop(0, '#fde68a');
            frameGrad.addColorStop(0.5, '#6ee7b7');
            frameGrad.addColorStop(1, '#38bdf8');
            ctx.strokeStyle = frameGrad;
            ctx.lineWidth = 4;
            ctx.strokeRect(28, 28, W - 56, H - 56);
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(42, 42, W - 84, H - 84);

            // ป้าย OFFICIAL VERIFIED
            ctx.fillStyle = 'rgba(16, 185, 129, 0.22)';
            ctx.fillRect(76, 78, 336, 38);
            ctx.strokeStyle = 'rgba(110, 231, 183, 0.65)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(76, 78, 336, 38);
            ctx.fillStyle = '#a7f3d0';
            ctx.font = '700 18px "JetBrains Mono", monospace';
            ctx.fillText('● OFFICIAL VERIFIED • VALID', 94, 104);

            if (record.cneuActivityCode || record.cneuCredits) {
                const cneuBadge = [record.cneuActivityCode, record.cneuCredits ? `${record.cneuCredits} CNEU` : ''].filter(Boolean).join(' • ');
                ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
                ctx.fillRect(428, 78, 350, 38);
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)';
                ctx.strokeRect(428, 78, 350, 38);
                ctx.fillStyle = '#fde68a';
                ctx.font = '700 18px "JetBrains Mono", monospace';
                ctx.fillText(cneuBadge, 446, 104, 315);
            }

            // ชื่อ-ตำแหน่ง-โรงพยาบาล
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 46px "Prompt", sans-serif';
            ctx.fillText(record.name || 'ผู้สำเร็จการอบรม', 76, 184, 900);

            ctx.fillStyle = '#dbeafe';
            ctx.font = '600 24px "Sarabun", sans-serif';
            const subLine = [record.position, record.hospital, record.department ? `(${record.department})` : ''].filter(Boolean).join(' • ');
            ctx.fillText(subLine, 76, 228, 910);

            // กล่องคะแนน Post-test มุมขวาบน
            ctx.fillStyle = 'rgba(2, 8, 24, 0.78)';
            ctx.fillRect(1020, 76, 304, 146);
            ctx.strokeStyle = 'rgba(110, 231, 183, 0.55)';
            ctx.strokeRect(1020, 76, 304, 146);
            ctx.fillStyle = '#93b4d8';
            ctx.font = '700 16px "JetBrains Mono", monospace';
            ctx.fillText('POST-TEST RESULT', 1046, 112);
            ctx.fillStyle = '#6ee7b7';
            ctx.font = '800 34px "JetBrains Mono", monospace';
            ctx.fillText(String(record.posttestScore || 'ผ่านเกณฑ์'), 1046, 162, 256);
            ctx.fillStyle = '#7dd3fc';
            ctx.font = '700 18px "Sarabun", sans-serif';
            ctx.fillText('ผ่านเกณฑ์มาตรฐาน ✓', 1046, 200);

            // เส้นคั่น
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.moveTo(76, 268);
            ctx.lineTo(W - 76, 268);
            ctx.stroke();

            // 4 กล่องข้อมูลยืนยันตัวตน (PDPA-Safe)
            const boxes = [
                { k: 'CERTIFICATE CODE', v: record.code || '-', col: '#7dd3fc' },
                { k: 'LICENSE (PDPA MASK)', v: maskLicensePdpa(record.license), col: '#ffffff' },
                { k: 'AI SKILL LAB EMPATHY', v: typeof record.skillLabBestScore === 'number' ? `${record.skillLabBestScore} / 100` : 'ผ่านการฝึก ✓', col: '#6ee7b7' },
                { k: 'CNEU CREDITS', v: record.cneuCredits ? `${record.cneuCredits} หน่วยคะแนน` : (record.userType || 'เรียนใหม่'), col: '#fde68a' }
            ];
            boxes.forEach((b, i) => {
                const bx = 76 + i * 316;
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.fillRect(bx, 300, 296, 112);
                ctx.strokeStyle = 'rgba(186,230,253,0.22)';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(bx, 300, 296, 112);
                ctx.fillStyle = '#93b4d8';
                ctx.font = '700 14px "JetBrains Mono", monospace';
                ctx.fillText(b.k, bx + 18, 334);
                ctx.fillStyle = b.col;
                ctx.font = '700 24px "JetBrains Mono", sans-serif';
                ctx.fillText(b.v, bx + 18, 382, 260);
            });

            // กล่องข้อมูลหลักสูตร (ซ้ายล่าง)
            ctx.fillStyle = 'rgba(2, 8, 24, 0.52)';
            ctx.fillRect(76, 458, 932, 280);
            ctx.strokeStyle = 'rgba(186,230,253,0.2)';
            ctx.strokeRect(76, 458, 932, 280);
            ctx.fillStyle = '#7dd3fc';
            ctx.font = '700 15px "JetBrains Mono", monospace';
            ctx.fillText('CERTIFIED PROGRAM & ISSUER', 104, 502);
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 26px "Prompt", sans-serif';
            ctx.fillText(record.courseTitleTH || 'หลักสูตรการพยาบาลและการประสานงานการรับบริจาคและปลูกถ่ายอวัยวะ', 104, 550, 876);
            ctx.fillStyle = '#dbeafe';
            ctx.font = '500 21px "Sarabun", sans-serif';
            ctx.fillText(record.orgTitleTH || 'ศูนย์ความเป็นเลิศทางการแพทย์ด้านการรับบริจาคและปลูกถ่ายอวัยวะ', 104, 594, 876);
            ctx.fillText(`วันที่ออกเอกสาร: ${formatThaiDate(record.issuedAt)} • ผู้ลงนาม: ${record.signerName || '-'}`, 104, 640, 876);
            ctx.fillStyle = '#6ee7b7';
            ctx.font = '600 19px "Sarabun", sans-serif';
            ctx.fillText('ข้อมูลส่วนบุคคลได้รับการคุ้มครองตามหลัก PDPA (ไม่แสดงอีเมลและเบอร์โทรศัพท์)', 104, 696, 876);

            // กล่อง QR Code จริง (ขวาล่าง)
            const qrX = 1044, qrY = 458, qrBox = 280;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(qrX, qrY, qrBox, qrBox);
            ctx.strokeStyle = 'rgba(110, 231, 183, 0.78)';
            ctx.lineWidth = 3;
            ctx.strokeRect(qrX, qrY, qrBox, qrBox);

            let qrRendered = false;
            try {
                if (typeof window.qrcode === 'function') {
                    const qr = window.qrcode(0, 'M');
                    qr.addData(verifyUrl);
                    qr.make();
                    const count = qr.getModuleCount();
                    const drawArea = 224;
                    const cell = drawArea / count;
                    const startX = qrX + (qrBox - drawArea) / 2;
                    const startY = qrY + 14;
                    ctx.fillStyle = '#0f172a';
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                ctx.fillRect(Math.floor(startX + c * cell), Math.floor(startY + r * cell), Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    }
                    qrRendered = true;
                }
            } catch (_) {}

            if (!qrRendered) {
                const fallbackQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=1&data=${encodeURIComponent(verifyUrl)}`;
                const qrImg = await loadImgSafe(fallbackQrUrl);
                if (qrImg) {
                    ctx.drawImage(qrImg, qrX + 28, qrY + 14, 224, 224);
                    qrRendered = true;
                }
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#0f172a';
            ctx.font = '700 15px "JetBrains Mono", monospace';
            ctx.fillText(qrRendered ? 'SCAN TO VERIFY' : (record.code || 'VERIFIED'), qrX + qrBox / 2, qrY + qrBox - 16);
            ctx.textAlign = 'left';

            // แถบ Footer ลายนิ้วมือดิจิทัล
            ctx.fillStyle = '#93b4d8';
            ctx.font = '700 17px "JetBrains Mono", monospace';
            ctx.fillText(`DIGITAL SEAL: ${sealHash} • CLOUD FIRESTORE VERIFIED • RJCLOUD.ORGAN 2.0`, 76, 804);

            const dataUrl = canvas.toDataURL('image/png', 1.0);
            const blob = await new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/png', 1.0));
            return { dataUrl, blob };
        }

        function QrScannerModal({ open, onClose, onDetected, showToast }) {

            useEffect(() => {
                if (!open) return;
                setCamError('');
                if (typeof window.Html5Qrcode !== 'function') {
                    setCamError('ไม่พบไลบรารีสแกน QR บนอุปกรณ์นี้ กรุณากรอกรหัสประกาศนียบัตรด้วยตนเองแทนค่ะ');

                let mounted = true;
                const qrInst = new window.Html5Qrcode('rjc-qr-reader');

                qrInst.start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    (decodedText) => {

                        const code = extractCodeFromInput(decodedText);
                        if (code) {
                            qrInst.stop().catch(() => {});
                            onDetected(code);
                            onClose();
                        }
                    },
                    () => {}

                    if (!mounted) return;

        function HolographicVerifiedCard({ record, verifyUrl, showToast }) {
            const [tilt, setTilt] = useState({ rx: 0, ry: 0, mx: 50, my: 50 });
            const [autoTilt, setAutoTilt] = useState(true);
            const [isBuildingPng, setIsBuildingPng] = useState(false);
            const [saveModal, setSaveModal] = useState({ open: false, dataUrl: '', blob: null });

            const interactingRef = useRef(false);
            const cardRef = useRef(null);
            const sealHash = useMemo(() => computeDigitalSealHash(record), [record]);

            // โหมดเอียงอัตโนมัติเบาๆ เพื่อแสดงฟอยล์โฮโลแกรมกันปลอม
            useEffect(() => {
                if (!autoTilt) return;
                let rafId = null;
                const tick = (now) => {
                    rafId = requestAnimationFrame(tick);
                    if (interactingRef.current) return;
                    const t = now * 0.0011;
                    const rx = Math.sin(t) * 6.5;
                    const ry = Math.cos(t * 0.85) * 9.5;
                    setTilt({ rx, ry, mx: 50 + Math.cos(t * 0.85) * 32, my: 50 - Math.sin(t) * 26 });
                };
                rafId = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(rafId);
            }, [autoTilt]);

            // รองรับเซ็นเซอร์ Gyroscope บนมือถือ
            useEffect(() => {
                const onOrient = (e) => {
                    if (interactingRef.current || typeof e.beta !== 'number' || typeof e.gamma !== 'number') return;
                    const rx = Math.max(-12, Math.min(12, (e.beta - 45) * 0.24));
                    const ry = Math.max(-14, Math.min(14, e.gamma * 0.3));
                    setTilt({ rx, ry, mx: 50 + ry * 2.4, my: 50 - rx * 2.4 });
                };
                window.addEventListener('deviceorientation', onOrient);
                return () => window.removeEventListener('deviceorientation', onOrient);
            }, []);

            const handlePointerMove = (clientX, clientY) => {
                const el = cardRef.current;
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const px = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const py = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
                setTilt({ rx: (0.5 - py) * 16, ry: (px - 0.5) * 20, mx: px * 100, my: py * 100 });
            };

            const ensurePngBuilt = async () => {
                if (saveModal.dataUrl && saveModal.blob) return { dataUrl: saveModal.dataUrl, blob: saveModal.blob };
                setIsBuildingPng(true);
                const out = await buildVerifiedCardPng(record, sealHash, verifyUrl);
                setIsBuildingPng(false);
                return out;
            };

            const handleOpenSavePhoneModal = async () => {
                const { dataUrl, blob } = await ensurePngBuilt();
                setSaveModal({ open: true, dataUrl, blob });
            };

            const handleDownloadPngFile = async () => {
                const { dataUrl } = await ensurePngBuilt();
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `Verified_Card_${record.code || 'rjcloud'}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('ดาวน์โหลดรูปบัตรรับรอง PNG เรียบร้อยแล้วค่ะ');
            };

            const handleShareCardToPhone = async () => {
                const { dataUrl, blob } = await ensurePngBuilt();
                try {
                    if (blob && navigator.share && typeof File !== 'undefined') {
                        const file = new File([blob], `Verified_Card_${record.code || 'rjcloud'}.png`, { type: 'image/png' });
                        if (!navigator.canShare || navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: 'บัตรรับรองประกาศนียบัตร rjcloud.organ 2.0',
                                text: `ตรวจสอบคุณวุฒิ ${record.name} (${record.code})`,
                                files: [file]
                            });
                            showToast('แชร์หรือบันทึกเข้าอัลบั้มเรียบร้อยค่ะ');
                            return;
                        }
                    }
                } catch (err) {
                    if (err && err.name === 'AbortError') return;
                }
                setSaveModal({ open: true, dataUrl, blob });
                showToast('แตะค้างที่รูปภาพเพื่อบันทึกลงอัลบั้ม หรือกดดาวน์โหลด PNG ค่ะ');
            };

            const handleCopyVerifyLink = async () => {
                try {
                    await navigator.clipboard.writeText(verifyUrl);
                    showToast('คัดลอกลิงก์ยืนยันคุณวุฒิเรียบร้อยแล้วค่ะ');
                } catch (_) {
                    showToast('ไม่สามารถคัดลอกอัตโนมัติได้ กรุณาคัดลอก URL จากแถบด้านบนค่ะ', 'error');
                }
            };

            return (
                <section className="space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2 text-xs no-print">
                        <span className="text-muted-adaptive">เลื่อนเมาส์หรือเอียงมือถือเพื่อตรวจแสงฟอยล์โฮโลแกรม 3 มิติกันปลอม</span>
                        <button
                            type="button"
                            onClick={() => setAutoTilt(v => !v)}
                            className="spatial-soft px-3 py-1 rounded-full text-[11px] font-bold text-prism-adaptive"
                        >
                            เอียงอัตโนมัติ: {autoTilt ? 'เปิด' : 'ปิด'}
                        </button>
                    </div>

                    <div className="holo-stage w-full">
                        <div
                            ref={cardRef}
                            onMouseEnter={() => { interactingRef.current = true; }}
                            onMouseMove={(e) => { interactingRef.current = true; handlePointerMove(e.clientX, e.clientY); }}
                            onMouseLeave={() => { interactingRef.current = false; if (!autoTilt) setTilt({ rx: 0, ry: 0, mx: 50, my: 50 }); }}
                            onTouchStart={(e) => { interactingRef.current = true; if (e.touches[0]) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY); }}
                            onTouchMove={(e) => { if (e.touches[0]) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY); }}

                                        {sealHash} • CLOUD VERIFIED • RJCLOUD.ORGAN 2.0

                        >

                    {/* Save to Phone PNG Modal */}
                    {saveModal.open && (

        // ============================================================================
        // 4. MAIN VERIFY APPLICATION
        // ============================================================================
        function VerifyApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const isAdminPreview = urlParams.get('admin_preview') === '1';
            const initialCode = extractCodeFromInput(urlParams.get('code') || (isAdminPreview ? ADMIN_PREVIEW_RECORD.code : ''));

            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020612' : '#edf6fd');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            const [codeInput, setCodeInput] = useState(initialCode);
            const [status, setStatus] = useState(isAdminPreview ? 'valid' : (initialCode ? 'loading' : 'idle')); // idle | loading | valid | invalid
            const [record, setRecord] = useState(isAdminPreview ? ADMIN_PREVIEW_RECORD : null);
            const [lastCheckedCode, setLastCheckedCode] = useState(initialCode);
            const [scannerOpen, setScannerOpen] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3200);
            }, []);

            useEffect(() => {
                const el = document.getElementById('verify-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            const verifyCode = useCallback(async (rawCode, silent = false) => {
                const clean = extractCodeFromInput(rawCode);
                if (!clean) {
                    showToast('กรุณากรอกรหัสประกาศนียบัตรก่อนตรวจสอบค่ะ', 'error');
                    return;
                }
                setCodeInput(clean);
                setLastCheckedCode(clean);
                setStatus('loading');

                if (clean === ADMIN_PREVIEW_RECORD.code && isAdminPreview) {
                    setRecord(ADMIN_PREVIEW_RECORD);
                    setStatus('valid');
                    if (!silent) playVerifyChime(true);
                    return;
                }

                // 1. ค้นหาจาก Cloud Firestore
                let found = null;
                if (fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', clean));
                        if (snap.exists()) {
                            found = { code: snap.id, ...snap.data() };
                        }
                    } catch (err) {
                        console.warn('Firestore verify warning:', err);
                    }
                }

                // 2. สำรอง: ค้นหาจากแคชในเครื่องกรณีออฟไลน์หรือเพิ่งออกเอกสารบนเครื่องเดียวกัน
                if (!found) {
                    try {
                        const localMap = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                        if (localMap[clean]) found = localMap[clean];
                    } catch (_) {}
                }

                if (found && found.status !== 'revoked') {
                    setRecord(found);
                    setStatus('valid');
                    if (!silent) playVerifyChime(true);
                } else {
                    setRecord(null);
                    setStatus('invalid');
                    if (!silent) playVerifyChime(false);
                }
            }, [isAdminPreview, showToast]);

            // Firebase Anonymous Auth + Auto-Verify ?code=...
            useEffect(() => {
                if (isAdminPreview) return;
                if (!isCloudConfigured || !fbAuth) {
                    if (initialCode) verifyCode(initialCode, true);
                    return;
                }
                let active = true;
                let ranInitial = false;
                const unsub = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        try { await signInAnonymously(fbAuth); }
                        catch (_) {
                            if (initialCode && !ranInitial) { ranInitial = true; verifyCode(initialCode, true); }
                        }
                        return;
                    }
                    if (initialCode && !ranInitial) {
                        ranInitial = true;
                        verifyCode(initialCode, true);
                    }
                });
                return () => { active = false; unsub(); };
            }, [initialCode, isAdminPreview, verifyCode]);

            const activeVerifyUrl = useMemo(() => {
                const code = record?.code || lastCheckedCode || 'RJC-2027-DEMO01';
                try {
                    const base = window.location.href.split('?')[0].split('#')[0];
                    return `${base}?code=${encodeURIComponent(code)}`;
                } catch (_) {
                    return `https://learn.coerj.com/verify.html?code=${encodeURIComponent(code)}`;
                }
            }, [record?.code, lastCheckedCode]);

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* Top Header */}
                    <header className="sticky top-0 z-30 spatial-header no-print">
                        <div className="max-w-3xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <a
                                    href="./index.html"
                                    aria-label="กลับหน้าหลัก"
                                    className="w-9 h-9 rounded-xl spatial-soft text-primary-adaptive flex items-center justify-center shrink-0"
                                >
                                    <Icon name="ArrowLeft" size={18} />
                                </a>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        rjcloud<span className="text-accent-adaptive">.organ</span> <span className="text-[10px] font-mono text-prism-adaptive">2.0</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        Anti-Forgery 3D Seal &amp; CNEU Registry
                                    </span>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                <button
                                    type="button"
                                    onClick={() => setScannerOpen(true)}
                                    className="rjc2-pill-btn px-3.5 py-2 rounded-full font-display font-bold text-xs flex items-center gap-1.5"
                                >
                                    <Icon name="ScanLine" size={15} />
                                    <span>สแกน QR</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="relative z-10 flex-1 w-full max-w-3xl mx-auto px-3.5 sm:px-6 py-6 sm:py-8 space-y-6">
                        {/* Search & Scan Card */}
                        <section className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4 no-print">
                            <div className="text-center space-y-1">
                                <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-aurora-500/15 border border-aurora-400/35 text-accent-adaptive font-mono text-[10px] font-bold">
                                    <Icon name="ShieldCheck" size={12} /> RJCLOUD.ORGAN 2.0 • PDPA-SAFE CREDENTIAL CHECK
                                </span>
                                <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                    ตรวจสอบใบประกาศนียบัตรและหน่วยคะแนน CNEU
                                </h1>
                                <p className="text-xs sm:text-sm text-secondary-adaptive">
                                    กรอกรหัสประกาศนียบัตร (เช่น <span className="font-mono text-prism-adaptive">RJC-2027-XXXXXX</span>) หรือกดสแกน QR Code จากเอกสาร
                                </p>
                            </div>

                            <form
                                onSubmit={(e) => { e.preventDefault(); verifyCode(codeInput); }}
                                className="flex flex-col sm:flex-row gap-2.5"
                            >
                                <input
                                    type="text"
                                    value={codeInput}
                                    onChange={(e) => setCodeInput(e.target.value.toUpperCase())}
                                    placeholder="กรอกรหัสประกาศนียบัตร เช่น RJC-2027-A8K92M"
                                    className="touch-target spatial-input flex-1 px-4 py-3 rounded-2xl font-mono text-sm font-bold uppercase"
                                />
                                <div className="grid grid-cols-2 sm:flex gap-2 shrink-0">
                                    <button
                                        type="submit"
                                        disabled={status === 'loading'}
                                        className="rjc2-pill-btn touch-target px-5 py-3 rounded-full font-display font-bold text-sm flex items-center justify-center gap-1.5"
                                    >
                                        <Icon name="Search" size={16} /> ตรวจสอบ
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setScannerOpen(true)}
                                        className="touch-target spatial-soft px-4 py-3 rounded-full text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-1.5"
                                    >
                                        <Icon name="QrCode" size={16} className="text-prism-adaptive" /> กล้องสแกน
                                    </button>
                                </div>
                            </form>
                        </section>

                        {/* Result Area */}
                        {status === 'loading' && (
                            <div className="spatial-card rounded-[2rem] p-10 text-center space-y-3">
                                <div className="w-10 h-10 border-4 border-aurora-400 border-t-transparent rounded-full animate-spin mx-auto" />
                                <p className="font-display font-bold text-sm text-primary-adaptive">กำลังตรวจสอบข้อมูลกับฐานข้อมูล Cloud Firestore...</p>
                            </div>
                        )}

                        {status === 'valid' && record && (
                            <HolographicVerifiedCard record={record} verifyUrl={activeVerifyUrl} showToast={showToast} />
                        )}

                        {status === 'invalid' && (
                            <section className="spatial-card rounded-[2rem] p-7 sm:p-9 text-center border-rose-500/50 space-y-4">
                                <div className="w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-400/40 text-rose-400 flex items-center justify-center mx-auto">
                                    <Icon name="AlertTriangle" size={30} />
                                </div>
                                <span className="inline-block px-3 py-1 rounded-full bg-rose-500/20 border border-rose-400/40 text-rose-300 font-mono text-[11px] font-bold">
                                    VERIFICATION FAILED • UNRECOGNIZED CODE
                                </span>
                                <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                    ไม่พบข้อมูลประกาศนียบัตรนี้ในระบบ
                                </h2>
                                <p className="text-sm text-secondary-adaptive max-w-md mx-auto leading-relaxed">
                                    รหัส <span className="font-mono font-bold text-rose-400">{lastCheckedCode}</span> ไม่ตรงกับทะเบียนที่ได้รับการรับรองบน Cloud Firestore ของ <b className="text-accent-adaptive">rjcloud.organ</b> กรุณาตรวจสอบตัวสะกดหรือติดต่อ <span className="underline">{CONFIG.contactEmail}</span>
                                </p>
                            </section>
                        )}

                        {status === 'idle' && (
                            <section className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs no-print">
                                <div className="spatial-card rounded-2xl p-4 space-y-1">
                                    <p className="font-display font-bold text-accent-adaptive">1. ตราโฮโลแกรม 3 มิติกันปลอม</p>
                                    <p className="text-muted-adaptive leading-relaxed">ฟอยล์แสงขยับตามมุมเอียงมือถือ ภาพแคปหน้าจอปลอมจะไม่สามารถขยับตามมือได้</p>
                                </div>
                                <div className="spatial-card rounded-2xl p-4 space-y-1">
                                    <p className="font-display font-bold text-prism-adaptive">2. ยืนยันหน่วยคะแนน CNEU</p>
                                    <p className="text-muted-adaptive leading-relaxed">แสดงรหัสกิจกรรมและหน่วยคะแนน CNEU ตรงจากทะเบียน Cloud Firestore แบบ Real-time</p>
                                </div>
                                <div className="spatial-card rounded-2xl p-4 space-y-1">
                                    <p className="font-display font-bold text-amber-400">3. ปกปิดข้อมูลตามหลัก PDPA</p>
                                    <p className="text-muted-adaptive leading-relaxed">ปกปิดเลขใบอนุญาตบางส่วนและไม่แสดงอีเมลหรือเบอร์โทรศัพท์สู่สาธารณะ</p>
                                </div>
                            </section>
                        )}
                    </main>

                    <QrScannerModal
                        open={scannerOpen}
                        onClose={() => setScannerOpen(false)}
                        onDetected={(code) => verifyCode(code)}
                        showToast={showToast}
                    />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('verify-root'));
        root.render(<VerifyErrorBoundary><VerifyApp /></VerifyErrorBoundary>);
    </script>
</body>
</html>
