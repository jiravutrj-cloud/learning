    <script>
      (function () {
        try {
          const saved = localStorage.getItem('rjcloud_theme') || 'dark';
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030611' : '#edf5fc');
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&
            loc.origin !== 'null' &&
            !/(googleusercontent|webcontainer|stackblitz|sandbox|srcdoc|blob:)/i.test(loc.href);
          if (isRealHost) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            ['./data.js', './learning-core.js?v=202705'].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

            return `${PORTAL_DISPLAY_URL}/?${params.toString()}`;
        }

        function copyTextSafe(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = String(text || '');
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (_) { return false; }
        }

        function escapeCsvCell(val) {
            const s = val === null || val === undefined ? '' : String(val);
            return `"${s.replace(/"/g, '""')}"`;
        }

        function downloadCsv(filename, headers, rows) {
            const csv = '\ufeff' + [headers.map(escapeCsvCell).join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // วาดข้อความตัดบรรทัดอัตโนมัติบน Canvas (รองรับภาษาไทยความยาวไม่แน่นอน)
        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 2) {
            const str = String(text || '').trim();
            if (!str) return y;
            if (ctx.measureText(str).width <= maxWidth) {
                ctx.fillText(str, x, y, maxWidth);
                return y + lineHeight;
            }
            const chars = Array.from(str);
            let line = '';
            let curY = y;
            let lineCount = 0;
            for (let i = 0; i < chars.length; i++) {
                const test = line + chars[i];
                if (ctx.measureText(test).width > maxWidth && line.length > 0) {
                    lineCount += 1;
                    if (lineCount >= maxLines) {
                        ctx.fillText(line.slice(0, Math.max(1, line.length - 1)) + '…', x, curY, maxWidth);
                        return curY + lineHeight;
                    }
                    ctx.fillText(line, x, curY, maxWidth);
                    line = chars[i];
                    curY += lineHeight;
                } else {
                    line = test;
                }
            }
            if (line) {
                ctx.fillText(line, x, curY, maxWidth);
                curY += lineHeight;
            }
            return curY;
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            const rad = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + rad, y);
            ctx.lineTo(x + w - rad, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
            ctx.lineTo(x + w, y + h - rad);
            ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
            ctx.lineTo(x + rad, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
            ctx.lineTo(x, y + rad);
            ctx.quadraticCurveTo(x, y, x + rad, y);
            ctx.closePath();
        }

        function drawQrOnCanvas(ctx, url, x, y, size, darkHex = '#0f172a') {
            if (!ctx || !url || typeof window.qrcode !== 'function') return false;
            try {
                const qr = window.qrcode(0, 'M');
                qr.addData(String(url));
                qr.make();
                const count = qr.getModuleCount();
                const cell = size / count;
                ctx.fillStyle = darkHex;
                for (let r = 0; r < count; r++) {
                    const py = Math.floor(y + r * cell);
                    const ph = Math.ceil(y + (r + 1) * cell) - py;
                    for (let c = 0; c < count; c++) {
                        if (qr.isDark(r, c)) {
                            const px = Math.floor(x + c * cell);
                            const pw = Math.ceil(x + (c + 1) * cell) - px;
                            ctx.fillRect(px, py, pw, ph);
                        }
                    }
                }
                return true;
            } catch (_) { return false; }
        }

        /**
         * สร้างภาพ "บัตรเข้าสอบดิจิทัล (Digital Onsite Pass Card)" ความละเอียดสูง 1080×1560 px
         * รวม: ข้อมูลผู้ลงทะเบียน + เวลาเปิดระบบ (เช่น 16:00 น.) + QR Code ส่วนตัว + ข้อความ https://learn.coerj.com ชัดเจน
         */
        function renderDigitalPassDataUrl({ reg, onsiteCfg, cneuCfg, courseTitle }) {
            const canvas = document.createElement('canvas');
            const W = 1080, H = 1560;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';

            const unlockIso = reg.onsiteUnlockAt || onsiteCfg.unlockAt;
            const unlockText = onsiteCfg.forceUnlocked ? 'เปิดให้เข้าสู่ระบบได้ทันที' : formatThaiDateTime(unlockIso);
            const personalQrUrl = buildPersonalPortalUrl(reg.license, reg.targetCourseId || onsiteCfg.targetCourseId || DEFAULT_COURSE_ID);
            const isNurse = reg.professionGroup === 'พยาบาล' || reg.cneuEligible === true;
            const creditText = isNurse && (cneuCfg.activityCode || cneuCfg.cneuCredits)
                ? `สิทธิ์ CNEU: ${cneuCfg.activityCode || '-'} (${cneuCfg.cneuCredits || '-'} หน่วยคะแนน)`
                : `รับรองชั่วโมงอบรมมาตรฐาน ${cneuCfg.trainingHours || 8} ชั่วโมง`;

            // 1. พื้นหลังบัตรสีขาวครีมละมุน + ขอบหรู
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#f8fbff');
            bgGrad.addColorStop(1, '#ffffff');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // 2. แถบหัวบัตรสีกรมท่าลึก + แถบแสงชมพูดอกท้อ-มรกต
            const hdrGrad = ctx.createLinearGradient(0, 0, W, 260);
            hdrGrad.addColorStop(0, '#040b1d');
            hdrGrad.addColorStop(0.55, '#0b2248');
            hdrGrad.addColorStop(1, '#142c57');
            ctx.fillStyle = hdrGrad;
            ctx.fillRect(0, 0, W, 255);

            const stripeGrad = ctx.createLinearGradient(0, 255, W, 255);
            stripeGrad.addColorStop(0, '#fda4af');
            stripeGrad.addColorStop(0.5, '#34d399');
            stripeGrad.addColorStop(1, '#38bdf8');
            ctx.fillStyle = stripeGrad;
            ctx.fillRect(0, 255, W, 10);

            // ข้อความหัวบัตร
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fbcfe8';
            ctx.font = '700 22px "JetBrains Mono", monospace';
            ctx.fillText('DIGITAL ONSITE PASS  •  RJCLOUD.ORGAN 2.0', W / 2, 74);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 44px "Prompt", sans-serif';
            ctx.fillText('บัตรเข้าสู่ระบบหลังการอบรม', W / 2, 138);

            ctx.fillStyle = '#bae6fd';
            ctx.font = '600 24px "Sarabun", sans-serif';
            ctx.fillText('ศูนย์ความเป็นเลิศทางการแพทย์ด้านการรับบริจาคและปลูกถ่ายอวัยวะ โรงพยาบาลราชวิถี', W / 2, 192, W - 90);

            ctx.fillStyle = '#6ee7b7';
            ctx.font = '700 22px "JetBrains Mono", monospace';
            ctx.fillText(`EVENT ID: ${reg.eventId || onsiteCfg.eventId || '-'}   •   เทียบโอนชั่วโมงเรียน 100%`, W / 2, 232);

            // 3. กล่องกำหนดเวลาเปิดระบบ (เด่นสะดุดตา เช่น 16:00 น.)
            drawRoundedRect(ctx, 56, 296, W - 112, 158, 28);
            ctx.fillStyle = '#ecfdf5';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#10b981';
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = '#047857';
            ctx.font = '700 23px "Prompt", sans-serif';
            ctx.fillText('เวลาเปิดให้เข้าสู่ระบบ rjcloud.organ 2.0 (ทำแบบทดสอบ & รับใบประกาศฯ)', W / 2, 344, W - 150);

            ctx.fillStyle = '#064e3b';
            ctx.font = '800 36px "Prompt", sans-serif';
            ctx.fillText(unlockText, W / 2, 404, W - 150);

            ctx.fillStyle = '#0f766e';
            ctx.font = '600 21px "Sarabun", sans-serif';
            ctx.fillText(`กิจกรรม: ${reg.activityTitle || onsiteCfg.activityTitle}`, W / 2, 438, W - 160);

            // 4. กล่องข้อมูลผู้ลงทะเบียน
            drawRoundedRect(ctx, 56, 482, W - 112, 304, 28);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            ctx.textAlign = 'left';
            const lx = 94;
            ctx.fillStyle = '#64748b';
            ctx.font = '700 20px "Prompt", sans-serif';
            ctx.fillText('ผู้ลงทะเบียน (REGISTRANT)', lx, 526);

            ctx.fillStyle = '#0f172a';
            ctx.font = '800 38px "Prompt", sans-serif';
            ctx.fillText(reg.name || '-', lx, 574, W - 190);

            ctx.fillStyle = '#0284c7';
            ctx.font = '700 26px "JetBrains Mono", monospace';
            ctx.fillText(`เลขใบอนุญาตฯ: ${reg.license || '-'}`, lx, 620);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#047857';
            ctx.font = '700 24px "Prompt", sans-serif';
            ctx.fillText(`กลุ่มวิชาชีพ: ${reg.professionGroup || '-'}`, W - 94, 620);

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(lx, 644);
            ctx.lineTo(W - 94, 644);
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.fillStyle = '#334155';
            ctx.font = '600 23px "Sarabun", sans-serif';
            ctx.fillText(`หน่วยงาน: ${reg.hospital || '-'}${reg.province ? ' จ.' + reg.province : ''}`, lx, 682, W - 190);

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 22px "Prompt", sans-serif';
            drawWrappedText(ctx, `หลักสูตรเทียบโอน: ${courseTitle || '-'}`, lx, 720, W - 190, 30, 1);

            ctx.fillStyle = isNurse ? '#047857' : '#0369a1';
            ctx.font = '700 22px "Prompt", sans-serif';
            ctx.fillText(`✓ ${creditText}`, lx, 760, W - 190);

            // 5. โซนสแกน QR Code + ลิงก์พิมพ์เข้าคอมพิวเตอร์ https://learn.coerj.com
            drawRoundedRect(ctx, 56, 814, W - 112, 572, 30);
            ctx.fillStyle = '#f1f5f9';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();

            const qrSize = 336;
            const qrX = (W - qrSize) / 2;
            const qrY = 852;
            drawRoundedRect(ctx, qrX - 20, qrY - 20, qrSize + 40, qrSize + 40, 24);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            drawQrOnCanvas(ctx, personalQrUrl, qrX, qrY, qrSize, '#0f172a');

            ctx.textAlign = 'center';
            ctx.fillStyle = '#0f172a';
            ctx.font = '700 24px "Prompt", sans-serif';
            ctx.fillText('สแกน QR Code จากโทรศัพท์ (ดึงหลักสูตร & เลขใบอนุญาตอัตโนมัติ)', W / 2, 1244, W - 150);

            // กล่องข้อความ https://learn.coerj.com ตัวใหญ่ชัดสำหรับพิมพ์เข้าคอมพิวเตอร์
            drawRoundedRect(ctx, 110, 1266, W - 220, 96, 22);
            ctx.fillStyle = '#061229';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#fda4af';
            ctx.stroke();

            ctx.fillStyle = '#bae6fd';
            ctx.font = '600 19px "Prompt", sans-serif';
            ctx.fillText('หรือพิมพ์ลิงก์นี้บนคอมพิวเตอร์ / โทรศัพท์:', W / 2, 1300);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 36px "JetBrains Mono", monospace';
            ctx.fillText(PORTAL_DISPLAY_URL, W / 2, 1344);

            // 6. ขั้นตอนสั้นท้ายบัตร
            ctx.fillStyle = '#475569';
            ctx.font = '600 21px "Sarabun", sans-serif';
            ctx.fillText('ขั้นตอนเข้าใช้งาน:  1) สแกน QR หรือเข้า https://learn.coerj.com   2) กรอกเลขใบอนุญาต & ยืนยัน OTP ทางอีเมล', W / 2, 1442, W - 90);
            ctx.fillText('3) ระบบปลดล็อกสิทธิ์เทียบโอนชั่วโมง 100% อัตโนมัติ   4) ทำแบบทดสอบ & ดาวน์โหลดใบประกาศนียบัตรทันที', W / 2, 1478, W - 90);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 18px "JetBrains Mono", monospace';
            ctx.fillText('SAVE THIS CARD TO YOUR PHONE GALLERY  •  PDPA PROTECTED', W / 2, 1524);

            try { return canvas.toDataURL('image/png', 1.0); }
            catch (_) { return ''; }
        }

        // Firebase Init
        let fbApp = null, fbAuth = null, fbDb = null;
        const isCloudConfigured = Boolean(CONFIG.firebaseConfig?.apiKey && CONFIG.firebaseConfig?.projectId);
        if (isCloudConfigured) {
            try {
                fbApp = getApps().length === 0 ? initializeApp(CONFIG.firebaseConfig) : getApp();
                fbAuth = getAuth(fbApp);
                fbDb = getFirestore(fbApp);
            } catch (_) {}
        }

        // ============================================================================
        // 2. UI PRIMITIVES & DIGITAL ONSITE PASS CARD DISPLAY COMPONENT
        // ============================================================================

                            </div>

        // คอมโพเนนต์แสดงและดาวน์โหลด "บัตรเข้าสอบดิจิทัล (Digital Onsite Pass Card)"
        function DigitalPassCardPanel({ reg, onsiteCfg, cneuCfg, courseTitle, onCopyUrl, onToast, onRegisterAnother, isModal = false, onClose }) {
            const [passImgUrl, setPassImgUrl] = useState('');
            const [nowMs, setNowMs] = useState(Date.now());

            const personalUrl = useMemo(
                () => buildPersonalPortalUrl(reg.license, reg.targetCourseId || onsiteCfg.targetCourseId || DEFAULT_COURSE_ID),
                [reg.license, reg.targetCourseId, onsiteCfg.targetCourseId]
            );

            const unlockIso = reg.onsiteUnlockAt || onsiteCfg.unlockAt;
            const unlockMs = useMemo(() => {
                const t = new Date(unlockIso || '').getTime();
                return isNaN(t) ? 0 : t;
            }, [unlockIso]);
            const isUnlockedNow = Boolean(onsiteCfg.forceUnlocked) || (unlockMs > 0 && nowMs >= unlockMs);

            useEffect(() => {
                const iv = setInterval(() => setNowMs(Date.now()), 30000);
                return () => clearInterval(iv);
            }, []);

            useEffect(() => {
                let alive = true;
                const draw = () => {
                    if (!alive) return;
                    const dataUrl = renderDigitalPassDataUrl({ reg, onsiteCfg, cneuCfg, courseTitle });

                };
                draw();
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(draw).catch(() => {});

                return () => { alive = false; };
            }, [reg, onsiteCfg, cneuCfg, courseTitle]);

            const handleDownloadPng = () => {
                const url = passImgUrl || renderDigitalPassDataUrl({ reg, onsiteCfg, cneuCfg, courseTitle });
                if (!url) { onToast('ไม่สามารถสร้างภาพบัตรได้ในขณะนี้ค่ะ', 'error'); return; }

                    const a = document.createElement('a');

                                ✓ DIGITAL ONSITE PASS • บันทึกลงโทรศัพท์ได้เลย
                            </span>

                            </h2>

                                    ? 'ขณะนี้ระบบเปิดให้เข้าใช้งานแล้ว สามารถสแกน QR Code หรือกดปุ่มเข้าสู่ระบบด้านล่างได้ทันทีค่ะ'
                                    : `เปิดให้เข้าสู่ระบบอัตโนมัติ: ${formatThaiDateTime(unlockIso)} — เก็บภาพบัตรนี้ไว้สแกนเข้าทำแบบทดสอบได้เลยค่ะ`}
                            </p>
                        </div>
                        {isModal && onClose && (
                            <button type="button" onClick={onClose} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive shrink-0 cursor-pointer">
                                <Icon name="X" size={16} />
                            </button>
                        )}
                    </div>

                    {/* ภาพบัตร Digital Onsite Pass Card ความละเอียดสูง (รองรับกดดาวน์โหลด & แตะค้างเซฟลง iPhone Photos) */}
                    <div className="max-w-[400px] mx-auto space-y-2">
                        <div className="rounded-3xl overflow-hidden shadow-2xl border-2 border-pink-300/50 bg-white">
                            {passImgUrl ? (
                                <img
                                    src={passImgUrl}
                                    alt={`Digital Onsite Pass สำหรับ ${reg.name}`}
                                    className="w-full h-auto block select-auto"
                                />
                            ) : (
                                <div className="p-10 text-center text-slate-600 text-xs font-bold">กำลังสร้างบัตรเข้าสอบดิจิทัลพร้อม QR Code...</div>
                            )}
                        </div>
                        <p className="text-[11px] text-center text-muted-adaptive">
                            💡 เคล็ดลับมือถือ: กดปุ่ม <b>“บันทึกรูปบัตรลงโทรศัพท์”</b> ด้านล่าง หรือ <b>แตะค้างที่รูปบัตรด้านบน</b> เพื่อบันทึกลงอัลบั้มภาพได้ทันทีค่ะ
                        </p>
                    </div>

                    {/* กล่องลิงก์ https://learn.coerj.com สำหรับพิมพ์เข้าคอมพิวเตอร์ + ปุ่มคัดลอก */}
                    <div className="spatial-soft rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                        <div className="min-w-0">
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase block">สำหรับพิมพ์เข้าผ่านคอมพิวเตอร์ / โน้ตบุ๊ก</span>
                            <span className="font-mono font-extrabold text-sm sm:text-base text-primary-adaptive block truncate">{PORTAL_DISPLAY_URL}</span>
                        </div>
                        <button
                            type="button"
                            onClick={() => onCopyUrl(PORTAL_DISPLAY_URL)}
                            className="spatial-soft touch-target px-4 py-2 rounded-xl text-xs font-bold text-accent-adaptive border-aurora-400/45 inline-flex items-center justify-center gap-1.5 shrink-0 cursor-pointer"
                        >
                            <Icon name="Copy" size={14} /> คัดลอกลิงก์เว็บ
                        </button>
                    </div>

                    {/* ปุ่มหลัก: Save PNG / เข้าสู่ระบบทันที / ลงทะเบียนเพิ่ม */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <button type="button" onClick={handleDownloadPng} className="btn-peach-ambient touch-target py-3.5 px-5 font-display font-extrabold text-xs sm:text-sm">
                            <Icon name="Download" size={16} /> บันทึกรูปบัตรลงโทรศัพท์ (PNG)
                        </button>
                        <a href={personalUrl} className="rjc2-pill-btn touch-target py-3.5 px-5 rounded-full font-display font-extrabold text-xs sm:text-sm inline-flex items-center justify-center gap-1.5">
                            <Icon name="LogIn" size={16} /> เข้า rjcloud.organ 2.0 →
                        </a>
                    </div>

                    {!isModal && onRegisterAnother && (
                        <div className="text-center pt-1">
                            <button type="button" onClick={onRegisterAnother} className="text-xs font-bold text-prism-adaptive hover:underline cursor-pointer">
                                + ลงทะเบียนให้บุคลากรท่านอื่นเพิ่ม
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================================
        // 3. MAIN ONSITE REGISTRATION & HISTORICAL EVENT ARCHIVE APPLICATION
        // ============================================================================
        function OnsiteApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const initialMode = urlParams.get('mode') === 'organizer' ? 'organizer' : (urlParams.get('tab') === 'check' ? 'check' : 'register');
            const urlEventId = urlParams.get('event') || '';

            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030611' : '#edf5fc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // Cloud & Auth States
            const [authReady, setAuthReady] = useState(!isCloudConfigured);
            const [courseList, setCourseList] = useState(() => normalizeCourseList(CORE.DEFAULT_COURSE_CATALOG));
            const [onsiteConfig, setOnsiteConfig] = useState(() => ({ ...DEFAULT_ONSITE_CONFIG }));
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [eventsArchive, setEventsArchive] = useState([]);
            const [allRegistrations, setAllRegistrations] = useState([]);

            // Navigation & Registration Form States
            const [activeTab, setActiveTab] = useState(initialMode); // register | check | organizer
            const [submitting, setSubmitting] = useState(false);
            const [regSuccess, setRegSuccess] = useState(null);
            const [passModalReg, setPassModalReg] = useState(null);
            const [form, setForm] = useState({
                license: '', professionGroup: '', name: '', nameEN: '', position: '',
                region: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', hospital: '', province: '',
                email: '', phone: '', pdpaAccepted: true
            });

            // Self-Service Check / Edit / Withdraw States (PDPA)
            const [checkLicense, setCheckLicense] = useState('');
            const [checkSearched, setCheckSearched] = useState(false);
            const [editingReg, setEditingReg] = useState(null);

            // Organizer Historical Event Archive & A4 Print States
            const [selectedEventId, setSelectedEventId] = useState(urlEventId || '');
            const [orgSearch, setOrgSearch] = useState('');
            const [orgProfFilter, setOrgProfFilter] = useState('ALL');
            const [showRevoked, setShowRevoked] = useState(false);
            const [printBlankRows, setPrintBlankRows] = useState(5);

            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            const askConfirm = useCallback((opts) => {
                setConfirmDialog({ open: true, danger: false, confirmText: 'ยืนยัน', ...opts });
            }, []);

            useEffect(() => {
                const el = document.getElementById('onsite-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Step 1: Firebase Anonymous Auth Before Firestore Query
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth) { setAuthReady(true); return; }
                let active = true;
                const safetyTimer = setTimeout(() => { if (active) setAuthReady(true); }, 5000);
                let unsub = () => {};
                try {
                    unsub = onAuthStateChanged(fbAuth, async (fbUser) => {
                        if (!active) return;
                        if (!fbUser) {
                            try { await signInAnonymously(fbAuth); } catch (_) { if (active) setAuthReady(true); }
                            return;
                        }
                        setAuthReady(true);
                    }, () => { if (active) setAuthReady(true); });
                } catch (_) {
                    if (active) setAuthReady(true);
                }
                return () => { active = false; clearTimeout(safetyTimer); try { unsub(); } catch (_) {} };
            }, []);

            // Step 2: Subscribe to Settings (including Dynamic Course Catalog), Events Archive & All Registrations
            useEffect(() => {
                if (!authReady || !fbDb) return;
                const unsubSettings = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                    (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (Array.isArray(d.courseCatalog) && d.courseCatalog.length > 0) {
                            setCourseList(normalizeCourseList(d.courseCatalog));
                        }
                        if (d.onsiteConfig) {
                            const merged = { ...DEFAULT_ONSITE_CONFIG, ...d.onsiteConfig };
                            setOnsiteConfig(merged);
                            setSelectedEventId(prev => prev || merged.eventId);
                        }
                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                    },
                    () => {}
                );

                const unsubEvents = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_events'),
                    (snap) => {
                        const list = [];
                        snap.forEach(d => list.push({ eventId: d.id, ...d.data() }));
                        setEventsArchive(list);
                    },
                    () => {}
                );

                const unsubRegs = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations'),
                    (snap) => {
                        const list = [];
                        snap.forEach(d => {
                            const data = d.data() || {};
                            list.push({
                                docId: d.id,
                                ...data,
                                eventId: data.eventId || DEFAULT_ONSITE_CONFIG.eventId,
                                license: String(data.license || d.id.split('_').pop() || '').trim()
                            });
                        });
                        setAllRegistrations(list);
                    },
                    () => {}
                );

                return () => { unsubSettings(); unsubEvents(); unsubRegs(); };
            }, [authReady]);

            const getCourseTitleById = useCallback((cid) => {
                const found = courseList.find(c => c.id === cid);
                return found?.titleTH || courseList[0]?.titleTH || 'หลักสูตรการรับบริจาคและปลูกถ่ายอวัยวะ';
            }, [courseList]);

            // รายการกิจกรรมทั้งหมด (ปัจจุบัน + ย้อนหลัง)
            const mergedEventsList = useMemo(() => {
                const map = new Map();
                map.set(onsiteConfig.eventId, {
                    eventId: onsiteConfig.eventId,
                    activityTitle: onsiteConfig.activityTitle,
                    eventDate: onsiteConfig.eventDate,
                    venueAndOrganizer: onsiteConfig.venueAndOrganizer,
                    targetCourseId: onsiteConfig.targetCourseId || DEFAULT_COURSE_ID,
                    isCurrent: true
                });
                eventsArchive.forEach(ev => {
                    const id = ev.eventId || ev.id;
                    if (!id) return;
                    const prev = map.get(id) || {};
                    map.set(id, { ...prev, ...ev, eventId: id, targetCourseId: ev.targetCourseId || prev.targetCourseId || DEFAULT_COURSE_ID, isCurrent: id === onsiteConfig.eventId });
                });
                allRegistrations.forEach(r => {
                    const id = r.eventId || onsiteConfig.eventId;
                    if (!map.has(id)) {
                        map.set(id, {
                            eventId: id,
                            activityTitle: r.activityTitle || r.eventName || `กิจกรรมรหัส ${id}`,
                            eventDate: r.eventDate || '-',
                            venueAndOrganizer: r.venueAndOrganizer || '-',
                            targetCourseId: r.targetCourseId || DEFAULT_COURSE_ID,
                            isCurrent: id === onsiteConfig.eventId
                        });
                    }
                });
                return Array.from(map.values()).sort((a, b) => (b.isCurrent ? 1 : 0) - (a.isCurrent ? 1 : 0) || String(b.eventId).localeCompare(String(a.eventId)));
            }, [onsiteConfig, eventsArchive, allRegistrations]);

            const activeArchiveEventId = selectedEventId || onsiteConfig.eventId;
            const activeArchiveEvent = useMemo(
                () => mergedEventsList.find(e => e.eventId === activeArchiveEventId) || mergedEventsList[0] || onsiteConfig,
                [mergedEventsList, activeArchiveEventId, onsiteConfig]
            );
            const targetCourseTitle = getCourseTitleById(onsiteConfig.targetCourseId || DEFAULT_COURSE_ID);

            // ============================================================================
            // 4. REGISTRATION & SELF-SERVICE HANDLERS
            // ============================================================================
            const handlePrefillFromExisting = async () => {
                const cleanLic = form.license.replace(/[^a-zA-Z0-9_-]/g, '').toUpperCase().trim();
                if (cleanLic.length < 4 || !fbDb) return;
                try {
                    const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                    if (snap.exists()) {
                        const u = snap.data() || {};
                        setForm(p => ({
                            ...p,
                            license: cleanLic,
                            professionGroup: p.professionGroup || u.professionGroup || '',
                            name: p.name || u.name || '',
                            nameEN: p.nameEN || u.nameEN || '',
                            position: p.position || u.position || '',
                            region: u.department || p.region,
                            hospital: p.hospital || u.hospital || '',
                            province: p.province || u.province || '',
                            email: p.email || u.email || '',
                            phone: p.phone || u.phone || ''
                        }));
                        showToast('พบข้อมูลเดิมในศูนย์กลาง Data Center ดึงมาเติมให้อัตโนมัติแล้วค่ะ', 'info');
                    }
                } catch (_) {}
            };

            const handleSubmitRegistration = async (e) => {
                e.preventDefault();
                if (!onsiteConfig.registrationOpen) { showToast('ขณะนี้ปิดรับสมัครกิจกรรมรอบนี้แล้วค่ะ', 'error'); return; }
                const cleanLic = form.license.replace(/[^a-zA-Z0-9_-]/g, '').toUpperCase().trim();
                if (cleanLic.length < 4) { showToast('กรุณากรอกเลขที่ใบอนุญาตฯ อย่างน้อย 4 หลักค่ะ', 'error'); return; }
                if (!form.professionGroup) { showToast('กรุณาเลือกกลุ่มวิชาชีพของท่านค่ะ', 'error'); return; }
                if (!form.name.trim() || !form.hospital.trim()) { showToast('กรุณากรอกชื่อ–นามสกุลและโรงพยาบาลให้ครบถ้วนค่ะ', 'error'); return; }

                setSubmitting(true);
                const eventId = onsiteConfig.eventId || DEFAULT_ONSITE_CONFIG.eventId;
                const targetCourseId = onsiteConfig.targetCourseId || DEFAULT_COURSE_ID;
                const docKey = buildOnsiteKeySafe(eventId, cleanLic);
                const isNurse = form.professionGroup === 'พยาบาล';
                const nowIso = new Date().toISOString();

                const regPayload = {
                    id: docKey, docId: docKey, eventId,
                    eventName: onsiteConfig.activityTitle,
                    activityTitle: onsiteConfig.activityTitle,
                    eventDate: onsiteConfig.eventDate,
                    venueAndOrganizer: onsiteConfig.venueAndOrganizer,
                    targetCourseId,
                    license: cleanLic,
                    professionGroup: form.professionGroup,
                    cneuEligible: isNurse,
                    name: form.name.trim(),
                    nameEN: form.nameEN.trim(),
                    position: form.position.trim() || form.professionGroup,
                    region: form.region,
                    hospital: form.hospital.trim(),
                    province: form.province.trim(),
                    email: form.email.trim(),
                    phone: form.phone.trim(),
                    onsiteUnlockAt: onsiteConfig.unlockAt,
                    revoked: false, cancelled: false, status: 'confirmed',
                    pdpaAccepted: true,
                    registeredAt: nowIso, updatedAt: nowIso
                };

                try {
                    if (fbDb) {
                        // 1. บันทึกลงคลังรายชื่อแยกตามกิจกรรม ({eventId}_{license}) ไม่ทับรุ่นเก่า 100%
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', docKey), regPayload, { merge: true });

                        // 2. อัปเดตทะเบียนกิจกรรมใน onsite_events/{eventId}
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_events', eventId), {
                            eventId,
                            activityTitle: onsiteConfig.activityTitle,
                            eventDate: onsiteConfig.eventDate,
                            venueAndOrganizer: onsiteConfig.venueAndOrganizer,
                            targetCourseId,
                            unlockAt: onsiteConfig.unlockAt,
                            updatedAt: nowIso
                        }, { merge: true });

                        // 3. ซิงค์สิทธิ์ "เทียบโอน" (CREDIT_TRANSFER) เข้าศูนย์กลาง Data Center (elearning_users/{license})
                        const userRef = doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic);
                        let existingUser = null;
                        try {
                            const existingSnap = await getDoc(userRef);
                            if (existingSnap.exists()) existingUser = existingSnap.data();
                        } catch (_) {}

                        const enrollmentRec = typeof CORE.buildCourseEnrollmentRecord === 'function'
                            ? CORE.buildCourseEnrollmentRecord(existingUser, targetCourseId, {
                                code: 'CREDIT_TRANSFER',
                                userType: 'เทียบโอน',
                                studyHoursExempt: true,
                                matchedEventId: eventId,
                                matchedEventName: onsiteConfig.activityTitle
                            })
                            : {
                                courseId: targetCourseId,
                                classificationCode: 'CREDIT_TRANSFER',
                                userType: 'เทียบโอน',
                                studyHoursExempt: true,
                                matchedOnsiteEventId: eventId,
                                matchedOnsiteEventName: onsiteConfig.activityTitle,
                                updatedAt: nowIso
                            };

                        const prevCourses = (existingUser && typeof existingUser.courses === 'object') ? existingUser.courses : {};
                        const syncedUser = {
                            ...(existingUser || {}),
                            id: cleanLic, license: cleanLic,
                            activeCourseId: targetCourseId,
                            name: regPayload.name,
                            nameEN: regPayload.nameEN || existingUser?.nameEN || '',
                            professionGroup: regPayload.professionGroup,
                            cneuEligible: isNurse,
                            position: regPayload.position,
                            department: regPayload.region,
                            hospital: regPayload.hospital,
                            province: regPayload.province,
                            email: regPayload.email || existingUser?.email || '',
                            phone: regPayload.phone || existingUser?.phone || '',
                            classificationCode: 'CREDIT_TRANSFER',
                            userType: 'เทียบโอน',
                            studyHoursExempt: true,
                            progress: 100,
                            hoursStatusLabel: 'เทียบโอน (ยกเว้นชั่วโมง 100%)',
                            hoursActivityName: onsiteConfig.activityTitle,
                            hoursActivityDate: onsiteConfig.eventDate,
                            hoursActivityVenue: onsiteConfig.venueAndOrganizer,
                            onsiteEventId: eventId,
                            onsiteUnlockAt: onsiteConfig.unlockAt,
                            onsiteForceUnlocked: Boolean(onsiteConfig.forceUnlocked),
                            courses: { ...prevCourses, [targetCourseId]: enrollmentRec },
                            updatedAt: nowIso
                        };

                        await setDoc(userRef, syncedUser, { merge: true });
                    }

                    setRegSuccess(regPayload);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    showToast('ลงทะเบียนเรียบร้อยแล้วค่ะ! กรุณาบันทึกบัตร Digital Onsite Pass ด้านบนลงโทรศัพท์นะคะ');
                } catch (err) {
                    showToast('ไม่สามารถบันทึกข้อมูลได้: ' + (err?.message || err), 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            const matchedCheckRecords = useMemo(() => {
                const clean = checkLicense.replace(/[^a-zA-Z0-9_-]/g, '').trim().toLowerCase();
                if (!clean) return [];
                return allRegistrations
                    .filter(r => String(r.license || '').toLowerCase() === clean)
                    .sort((a, b) => String(b.registeredAt || '').localeCompare(String(a.registeredAt || '')));
            }, [allRegistrations, checkLicense]);

            const handleSaveSelfEdit = async (e) => {
                e.preventDefault();
                if (!editingReg || !fbDb) return;
                const isNurse = editingReg.professionGroup === 'พยาบาล';
                const updated = { ...editingReg, cneuEligible: isNurse, updatedAt: new Date().toISOString() };
                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', editingReg.docId), updated, { merge: true });
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', editingReg.license), {
                        name: updated.name, professionGroup: updated.professionGroup, cneuEligible: isNurse,
                        position: updated.position, hospital: updated.hospital, province: updated.province,
                        department: updated.region, email: updated.email, phone: updated.phone
                    }, { merge: true });
                    setEditingReg(null);
                    showToast('อัปเดตข้อมูลการลงทะเบียนของท่านเรียบร้อยค่ะ');
                } catch (err) {
                    showToast('แก้ไขข้อมูลไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const handleWithdrawSelf = (rec) => {
                askConfirm({
                    title: 'ยืนยันการยกเลิกการลงทะเบียน (PDPA Self-Service)',
                    message: `ต้องการลบรายชื่อของท่าน (${rec.name}) ออกจากกิจกรรม "${rec.activityTitle || rec.eventId}" หรือไม่?`,
                    danger: true,
                    confirmText: 'ยืนยันลบรายชื่อ',
                    onConfirm: async () => {
                        if (!fbDb) return;
                        try {
                            await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', rec.docId));
                            showToast('ยกเลิกการลงทะเบียนของท่านเรียบร้อยแล้วค่ะ');
                        } catch (err) {
                            showToast('ยกเลิกไม่สำเร็จ: ' + err.message, 'error');
                        }
                    }
                });
            };

            // ============================================================================
            // 5. ORGANIZER ARCHIVE ROSTER COMPUTATIONS (แยกตามกิจกรรมที่เลือก 100%)
            // ============================================================================
            const selectedEventRoster = useMemo(() => {
                const q = orgSearch.trim().toLowerCase();
                return allRegistrations
                    .filter(r => {
                        if (r.eventId !== activeArchiveEventId) return false;
                        const isCancel = Boolean(r.revoked || r.cancelled);
                        if (!showRevoked && isCancel) return false;
                        if (orgProfFilter !== 'ALL' && r.professionGroup !== orgProfFilter) return false;
                        if (q) {
                            const hay = `${r.name} ${r.license} ${r.hospital} ${r.province} ${r.region} ${r.professionGroup}`.toLowerCase();
                            if (!hay.includes(q)) return false;
                        }
                        return true;
                    })
                    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'th'));
            }, [allRegistrations, activeArchiveEventId, showRevoked, orgProfFilter, orgSearch]);

            const selectedEventStats = useMemo(() => {
                const inEvent = allRegistrations.filter(r => r.eventId === activeArchiveEventId);

                                </div>

                                {editingReg && (
                                    <form onSubmit={handleSaveSelfEdit} className="spatial-card rounded-[2rem] p-5 sm:p-6 space-y-3 border-prism-400/45 text-xs">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-display font-bold text-base text-primary-adaptive">แก้ไขข้อมูล ({editingReg.eventId})</h3>
                                            <button type="button" onClick={() => setEditingReg(null)} className="spatial-soft px-2.5 py-1 rounded-lg text-muted-adaptive cursor-pointer">ปิด</button>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <input required value={editingReg.name || ''} onChange={e => setEditingReg(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ-นามสกุล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <select value={editingReg.professionGroup || 'พยาบาล'} onChange={e => setEditingReg(p => ({ ...p, professionGroup: e.target.value }))} className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm">
                                                {PROFESSION_OPTIONS.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                                            </select>
                                            <input value={editingReg.hospital || ''} onChange={e => setEditingReg(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <input value={editingReg.province || ''} onChange={e => setEditingReg(p => ({ ...p, province: e.target.value }))} placeholder="จังหวัด" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <input type="email" value={editingReg.email || ''} onChange={e => setEditingReg(p => ({ ...p, email: e.target.value }))} placeholder="อีเมล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <input value={editingReg.phone || ''} onChange={e => setEditingReg(p => ({ ...p, phone: e.target.value }))} placeholder="เบอร์โทร" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                        </div>
                                        <button type="submit" className="rjc2-pill-btn touch-target px-6 py-2.5 rounded-full font-display font-extrabold text-xs">บันทึกการแก้ไข ✓</button>
                                    </form>
                                )}
                            </section>
                        )}

                        {/* ==================== TAB 3: HISTORICAL EVENT ARCHIVE & A4 SIGN-IN STUDIO ==================== */}
                        {activeTab === 'organizer' && (
                            <div className="space-y-5">
                                <section className="no-print spatial-card rounded-[1.75rem] p-5 space-y-4 border-prism-400/35">
                                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">HISTORICAL EVENT ARCHIVE • ตรวจสอบรายชื่อย้อนหลังแยกตามกิจกรรม</span>
                                            <h2 className="font-display font-extrabold text-lg sm:text-xl text-primary-adaptive mt-0.5">
                                                คลังรายชื่อผู้เข้าร่วมอบรม &amp; สตูดิโอพิมพ์ใบเซ็นชื่อราชการ (A4 PDF)
                                            </h2>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            <button type="button" onClick={handleExportEventCsv} className="spatial-soft touch-target px-4 py-2 rounded-full text-xs font-bold text-accent-adaptive inline-flex items-center gap-1.5 cursor-pointer">
                                                <Icon name="FileSpreadsheet" size={15} /> ส่งออก CSV ({selectedEventRoster.length})
                                            </button>
                                            <button type="button" onClick={() => window.print()} className="rjc2-pill-btn touch-target px-5 py-2 rounded-full font-display font-extrabold text-xs inline-flex items-center gap-1.5">
                                                <Icon name="Printer" size={15} /> พิมพ์ใบเซ็นชื่อ A4 (PDF)
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 items-end text-xs">
                                        <div className="lg:col-span-6">
                                            <label className="block font-bold text-prism-adaptive mb-1 ml-1">เลือกกิจกรรมที่ต้องการตรวจสอบรายชื่อย้อนหลัง ({mergedEventsList.length} กิจกรรม):</label>
                                            <select value={activeArchiveEventId} onChange={e => setSelectedEventId(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm font-bold">
                                                {mergedEventsList.map(ev => (
                                                    <option key={ev.eventId} value={ev.eventId}>
                                                        {ev.isCurrent ? '★ [ปัจจุบัน] ' : '[ย้อนหลัง] '}{ev.eventId} — {ev.activityTitle}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="lg:col-span-4">
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ค้นหาชื่อ / เลขใบอนุญาต / โรงพยาบาล:</label>
                                            <input value={orgSearch} onChange={e => setOrgSearch(e.target.value)} placeholder="พิมพ์คำค้นหา..." className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                        </div>
                                        <div className="lg:col-span-2">
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">แถวว่าง Walk-in:</label>
                                            <input type="number" min="0" max="25" value={printBlankRows} onChange={e => setPrintBlankRows(Math.max(0, Math.min(25, Number(e.target.value) || 0)))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl font-mono text-sm font-bold text-center" />
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-white/10">
                                        <div className="flex flex-wrap gap-1.5 text-xs">
                                            {[
                                                { id: 'ALL', label: `ทั้งหมด (${selectedEventStats.total})` },
                                                { id: 'พยาบาล', label: `พยาบาล • CNEU (${selectedEventStats.nurse})` },
                                                { id: 'แพทย์', label: `แพทย์ (${selectedEventStats.doctor})` },
                                                { id: 'บุคลากรสหวิชาชีพ', label: `สหวิชาชีพ (${selectedEventStats.allied})` }
                                            ].map(f => (
                                                <button key={f.id} type="button" onClick={() => setOrgProfFilter(f.id)} className={`px-3 py-1.5 rounded-xl font-bold cursor-pointer ${orgProfFilter === f.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                    {f.label}
                                                </button>
                                            ))}
                                        </div>
                                        <label className="text-xs font-bold text-muted-adaptive inline-flex items-center gap-1.5 cursor-pointer">
                                            <input type="checkbox" checked={showRevoked} onChange={e => setShowRevoked(e.target.checked)} className="accent-aurora-500" />
                                            <span>แสดงผู้ยกเลิกสิทธิ์ ({selectedEventStats.revoked})</span>
                                        </label>
                                    </div>
                                </section>

                                {/* Printable Official A4 Sign-In Sheet */}
                                <article id="onsite-print-root" className="a4-sheet rounded-2xl p-6 sm:p-10 space-y-4 max-w-4xl mx-auto">
                                    <div className="text-center border-b-2 border-slate-800 pb-3.5 space-y-1">
                                        <p className="text-xs font-bold text-emerald-800 uppercase m-0">
                                            แบบลงทะเบียนเข้าร่วมการอบรมและรับรองสิทธิ์เทียบโอนชั่วโมง (rjcloud.organ 2.0)
                                        </p>
                                        <h2 className="font-display text-lg font-extrabold text-slate-900 m-0">
                                            {activeArchiveEvent.activityTitle}
                                        </h2>
                                        <p className="text-xs text-slate-700 m-0">
                                            รหัสกิจกรรม: <b className="font-mono">{activeArchiveEvent.eventId}</b> • วันที่จัด: <b>{activeArchiveEvent.eventDate}</b> • สถานที่: {activeArchiveEvent.venueAndOrganizer}
                                        </p>
                                        <p className="text-xs font-bold text-slate-800 m-0">
                                            กลุ่มรายชื่อ: {orgProfFilter === 'ALL' ? 'รวมทุกกลุ่มวิชาชีพ' : `เฉพาะกลุ่ม${orgProfFilter}`} ({selectedEventRoster.length} ราย)
                                            {orgProfFilter === 'พยาบาล' && cneuConfig.activityCode ? ` • รหัสกิจกรรม CNEU: ${cneuConfig.activityCode} (${cneuConfig.cneuCredits} หน่วยคะแนน)` : ''}
                                        </p>
                                    </div>

                                    <table className="a4-table">
                                        <thead>
                                            <tr>
                                                <th style={{ width: '36px' }}>ลำดับ</th>
                                                <th>ชื่อ – นามสกุล</th>
                                                <th style={{ width: '96px' }}>กลุ่มวิชาชีพ</th>
                                                <th style={{ width: '104px' }}>เลขใบอนุญาตฯ</th>
                                                <th>โรงพยาบาล / หน่วยงาน</th>
                                                <th style={{ width: '92px' }}>ลายมือชื่อ (เช้า)</th>
                                                <th style={{ width: '92px' }}>ลายมือชื่อ (บ่าย)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {selectedEventRoster.map((r, idx) => (
                                                <tr key={r.docId || idx} className={(r.revoked || r.cancelled) ? 'opacity-50 line-through' : ''}>
                                                    <td className="text-center font-mono font-bold">{idx + 1}</td>
                                                    <td className="font-bold">{r.name}</td>
                                                    <td className="text-center text-[11px]">{r.professionGroup || '-'}</td>
                                                    <td className="text-center font-mono text-[11px]">{r.license}</td>
                                                    <td className="text-[11px]">{r.hospital}{r.province ? ` (${r.province})` : ''}</td>
                                                    <td></td>
                                                    <td></td>
                                                </tr>
                                            ))}
                                            {Array.from({ length: printBlankRows }).map((_, bi) => (
                                                <tr key={`blank-${bi}`}>
                                                    <td className="text-center font-mono text-slate-400">{selectedEventRoster.length + bi + 1}</td>
                                                    <td style={{ height: '28px' }}></td>
                                                    <td></td><td></td><td></td><td></td><td></td>
                                                </tr>
                                            ))}
                                            {selectedEventRoster.length === 0 && printBlankRows === 0 && (
                                                <tr><td colSpan="7" className="text-center py-6 text-slate-500">ยังไม่มีรายชื่อผู้ลงทะเบียนในกิจกรรม {activeArchiveEvent.eventId} ตามเงื่อนไขที่เลือก</td></tr>
                                            )}
                                        </tbody>
                                    </table>

                                    <div className="signature-block pt-4 grid grid-cols-2 gap-8 text-center text-xs">
                                        <div className="space-y-1">
                                            <p>ลงชื่อ ...............................................................</p>
                                            <p className="font-bold">({cneuConfig.reporterName || 'ผู้ประสานงานโครงการ'})</p>
                                            <p className="text-slate-600">ผู้รับลงทะเบียนและตรวจสอบรายชื่อ</p>
                                        </div>
                                        <div className="space-y-1">
                                            <p>ลงชื่อ ...............................................................</p>
                                            <p className="font-bold">({cneuConfig.approverName || 'ผู้อำนวยการศูนย์ความเป็นเลิศทางการแพทย์'})</p>
                                            <p className="text-slate-600">ผู้รับรองการจัดกิจกรรมอบรม</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        )}
                    </main>

                    {/* Modal เปิดดูและบันทึกรูปบัตร Digital Onsite Pass ย้อนหลัง */}
                    {passModalReg && (
                        <div className="no-print fixed inset-0 z-[168] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-5">
                            <DigitalPassCardPanel
                                reg={passModalReg}
                                onsiteCfg={onsiteConfig}
                                cneuCfg={cneuConfig}
                                courseTitle={getCourseTitleById(passModalReg.targetCourseId || onsiteConfig.targetCourseId)}
                                onCopyUrl={handleCopyPortalUrl}
                                onToast={showToast}
                                isModal
                                onClose={() => setPassModalReg(null)}
                            />
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('onsite-root'));
        root.render(<OnsiteErrorBoundary><OnsiteApp /></OnsiteErrorBoundary>);
    </script>

    <!-- @babel/standalone พร้อม CDN สำรอง (cdnjs) ป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
