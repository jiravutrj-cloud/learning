    <script>
      (function () {
        try {
          const saved = localStorage.getItem('rjcloud_theme') || 'dark';
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030611' : '#edf5fc');
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&
            loc.origin !== 'null' &&
            !/(googleusercontent|webcontainer|stackblitz|sandbox|srcdoc|blob:)/i.test(loc.href);
          if (isRealHost) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './styles.css';
            document.head.appendChild(css);

            ['./data.js', './learning-core.js'].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

                        <div className="min-h-dvh flex items-center justify-center p-6 bg-void-950 text-white">

                                <h2 className="font-display font-bold text-lg text-rose-400">พบข้อผิดพลาดในหน้าลงทะเบียน Onsite</h2>
                                <p className="text-xs font-mono bg-rose-500/10 text-rose-200 p-3 rounded-xl overflow-auto">{String(this.state.err?.message || this.state.err)}</p>
                                <button type="button" onClick={() => window.location.reload()} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-bold text-sm">โหลดหน้าใหม่</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function Icon({ name, size = 18, className = '' }) {
            const Comp = LucideIcons[name] || LucideIcons.ClipboardList || LucideIcons.Activity;
            return Comp ? <Comp size={size} className={className} /> : null;
        }

        function ThemeToggleButton({ theme, onToggle }) {
            const isDark = theme === 'dark';
            return (
                <button type="button" onClick={onToggle} aria-label="สลับโหมดมืดหรือสว่าง" className="spatial-soft px-2.5 sm:px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 text-primary-adaptive shrink-0 cursor-pointer">
                    <Icon name={isDark ? 'Sun' : 'Moon'} size={15} className={isDark ? 'text-amber-300' : 'text-indigo-600'} />
                    <span className="hidden sm:inline">{isDark ? 'โหมดสว่าง' : 'โหมดมืด'}</span>
                </button>
            );
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="no-print fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[170] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-2xl flex items-center gap-2 text-xs sm:text-sm font-bold text-white ${
                        toast.type === 'error' ? 'bg-rose-700/95 border-rose-400/60'
                            : toast.type === 'info' ? 'bg-sky-700/95 border-sky-400/60'
                                : 'bg-emerald-700/95 border-emerald-400/60'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Sparkles' : 'CheckCircle2'} size={16} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="no-print fixed inset-0 z-[165] bg-slate-950/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="spatial-card w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 space-y-4">
                        <h3 className="font-display font-bold text-lg text-primary-adaptive">{dialog.title}</h3>
                        <p className="text-sm text-secondary-adaptive leading-relaxed">{dialog.message}</p>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button type="button" onClick={onClose} className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-bold text-sm cursor-pointer">ยกเลิก</button>
                            <button type="button" onClick={() => { const fn = dialog.onConfirm; onClose(); if (fn) fn(); }} className={`touch-target py-3 rounded-2xl font-display font-bold text-sm cursor-pointer ${dialog.danger ? 'bg-rose-600 text-white' : 'rjc2-pill-btn'}`}>
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 3. MAIN ONSITE REGISTRATION & HISTORICAL EVENT ARCHIVE APPLICATION
        // ============================================================================
        function OnsiteApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const initialMode = urlParams.get('mode') === 'organizer' ? 'organizer' : (urlParams.get('tab') === 'check' ? 'check' : 'register');
            const urlEventId = urlParams.get('event') || '';

            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030611' : '#edf5fc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // Cloud & Auth States
            const [authReady, setAuthReady] = useState(!isCloudConfigured);
            const [onsiteConfig, setOnsiteConfig] = useState(() => ({ ...DEFAULT_ONSITE_CONFIG }));
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [eventsArchive, setEventsArchive] = useState([]);
            const [allRegistrations, setAllRegistrations] = useState([]);

            // Navigation & Registration Form States
            const [activeTab, setActiveTab] = useState(initialMode); // register | check | organizer
            const [submitting, setSubmitting] = useState(false);
            const [regSuccess, setRegSuccess] = useState(null);
            const [form, setForm] = useState({
                license: '', professionGroup: '', name: '', nameEN: '', position: '',
                region: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', hospital: '', province: '',
                email: '', phone: '', pdpaAccepted: true
            });

            // Self-Service Check / Edit / Withdraw States (PDPA)
            const [checkLicense, setCheckLicense] = useState('');
            const [checkSearched, setCheckSearched] = useState(false);
            const [editingReg, setEditingReg] = useState(null);

            // Organizer Historical Event Archive & A4 Print States
            const [selectedEventId, setSelectedEventId] = useState(urlEventId || '');
            const [orgSearch, setOrgSearch] = useState('');
            const [orgProfFilter, setOrgProfFilter] = useState('ALL');
            const [showRevoked, setShowRevoked] = useState(false);
            const [printBlankRows, setPrintBlankRows] = useState(5);

            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            const askConfirm = useCallback((opts) => {
                setConfirmDialog({ open: true, danger: false, confirmText: 'ยืนยัน', ...opts });
            }, []);

            useEffect(() => {
                const el = document.getElementById('onsite-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Step 1: Firebase Anonymous Auth Before Any Firestore Query (Rule 3)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth) { setAuthReady(true); return; }
                let active = true;
                const safetyTimer = setTimeout(() => { if (active) setAuthReady(true); }, 5000);
                let unsub = () => {};
                try {
                    unsub = onAuthStateChanged(fbAuth, async (fbUser) => {
                        if (!active) return;
                        if (!fbUser) {
                            try { await signInAnonymously(fbAuth); } catch (_) { if (active) setAuthReady(true); }
                            return;
                        }
                        setAuthReady(true);
                    }, () => { if (active) setAuthReady(true); });
                } catch (_) {
                    if (active) setAuthReady(true);
                }
                return () => { active = false; clearTimeout(safetyTimer); try { unsub(); } catch (_) {} };
            }, []);

            // Step 2: Subscribe to Settings, Historical Events Archive & All Registrations (Rule 1 & 2)
            useEffect(() => {
                if (!authReady || !fbDb) return;
                const unsubSettings = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                    (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (d.onsiteConfig) {
                            const merged = { ...DEFAULT_ONSITE_CONFIG, ...d.onsiteConfig };
                            setOnsiteConfig(merged);
                            setSelectedEventId(prev => prev || merged.eventId);
                        }
                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                    },
                    () => {}
                );

                const unsubEvents = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_events'),
                    (snap) => {
                        const list = [];
                        snap.forEach(d => list.push({ eventId: d.id, ...d.data() }));
                        setEventsArchive(list);
                    },
                    () => {}
                );

                const unsubRegs = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations'),
                    (snap) => {
                        const list = [];
                        snap.forEach(d => {
                            const data = d.data() || {};
                            list.push({
                                docId: d.id,
                                ...data,
                                eventId: data.eventId || DEFAULT_ONSITE_CONFIG.eventId,
                                license: String(data.license || d.id.split('_').pop() || '').trim()
                            });
                        });
                        setAllRegistrations(list);
                    },
                    () => {}
                );

                return () => { unsubSettings(); unsubEvents(); unsubRegs(); };
            }, [authReady]);

            // สร้างรายการกิจกรรมทั้งหมด (รวมกิจกรรมปัจจุบัน + คลังกิจกรรมย้อนหลัง + กิจกรรมที่พบในรายชื่อเก่า)
            const mergedEventsList = useMemo(() => {
                const map = new Map();
                // 1) กิจกรรมปัจจุบันจาก onsiteConfig
                map.set(onsiteConfig.eventId, {
                    eventId: onsiteConfig.eventId,
                    activityTitle: onsiteConfig.activityTitle,
                    eventDate: onsiteConfig.eventDate,
                    venueAndOrganizer: onsiteConfig.venueAndOrganizer,
                    targetCourseId: onsiteConfig.targetCourseId || DEFAULT_COURSE_ID,
                    isCurrent: true
                });
                // 2) กิจกรรมใน onsite_events archive
                eventsArchive.forEach(ev => {
                    const id = ev.eventId || ev.id;
                    if (!id) return;
                    const prev = map.get(id) || {};
                    map.set(id, {
                        ...prev,
                        ...ev,
                        eventId: id,
                        targetCourseId: ev.targetCourseId || prev.targetCourseId || DEFAULT_COURSE_ID,
                        isCurrent: id === onsiteConfig.eventId
                    });
                });
                // 3) กิจกรรมที่ปรากฏใน onsite_registrations (รองรับรายชื่อย้อนหลังอัตโนมัติ)
                allRegistrations.forEach(r => {
                    const id = r.eventId || onsiteConfig.eventId;
                    if (!map.has(id)) {
                        map.set(id, {
                            eventId: id,
                            activityTitle: r.activityTitle || `กิจกรรมรหัส ${id}`,
                            eventDate: r.eventDate || '-',
                            venueAndOrganizer: r.venueAndOrganizer || '-',
                            targetCourseId: r.targetCourseId || DEFAULT_COURSE_ID,
                            isCurrent: id === onsiteConfig.eventId
                        });
                    }
                });
                return Array.from(map.values()).sort((a, b) => (b.isCurrent ? 1 : 0) - (a.isCurrent ? 1 : 0) || String(b.eventId).localeCompare(String(a.eventId)));
            }, [onsiteConfig, eventsArchive, allRegistrations]);

            const activeArchiveEventId = selectedEventId || onsiteConfig.eventId;
            const activeArchiveEvent = useMemo(
                () => mergedEventsList.find(e => e.eventId === activeArchiveEventId) || mergedEventsList[0] || onsiteConfig,
                [mergedEventsList, activeArchiveEventId, onsiteConfig]
            );

            const targetCourseMeta = COURSE_CATALOG[onsiteConfig.targetCourseId || DEFAULT_COURSE_ID] || COURSE_CATALOG[DEFAULT_COURSE_ID];

            // ============================================================================
            // 4. REGISTRATION & SELF-SERVICE HANDLERS (EVENT-SCOPED KEYS + DATA CENTER SYNC)
            // ============================================================================
            const handlePrefillFromExisting = async () => {
                const cleanLic = form.license.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (cleanLic.length < 4 || !fbDb) return;
                try {
                    const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                    if (snap.exists()) {
                        const u = snap.data() || {};
                        setForm(p => ({
                            ...p,
                            professionGroup: p.professionGroup || u.professionGroup || '',
                            name: p.name || u.name || '',
                            nameEN: p.nameEN || u.nameEN || '',
                            position: p.position || u.position || '',
                            region: u.department || p.region,
                            hospital: p.hospital || u.hospital || '',
                            province: p.province || u.province || '',
                            email: p.email || u.email || '',
                            phone: p.phone || u.phone || ''
                        }));
                        showToast('พบข้อมูลเดิมในศูนย์กลาง Data Center ดึงมาเติมให้อัตโนมัติแล้วค่ะ', 'info');
                    }
                } catch (_) {}
            };

            const handleSubmitRegistration = async (e) => {
                e.preventDefault();
                if (!onsiteConfig.registrationOpen) {
                    showToast('ขณะนี้ปิดรับสมัครกิจกรรมรอบนี้แล้วค่ะ', 'error');
                    return;
                }
                const cleanLic = form.license.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (cleanLic.length < 4) { showToast('กรุณากรอกเลขที่ใบอนุญาตฯ อย่างน้อย 4 หลักค่ะ', 'error'); return; }
                if (!form.professionGroup) { showToast('กรุณาเลือกกลุ่มวิชาชีพของท่านค่ะ', 'error'); return; }
                if (!form.name.trim() || !form.hospital.trim()) { showToast('กรุณากรอกชื่อ–นามสกุลและโรงพยาบาลให้ครบถ้วนค่ะ', 'error'); return; }

                setSubmitting(true);
                const eventId = onsiteConfig.eventId || DEFAULT_ONSITE_CONFIG.eventId;
                const targetCourseId = onsiteConfig.targetCourseId || DEFAULT_COURSE_ID;
                const docKey = buildOnsiteKeySafe(eventId, cleanLic);
                const isNurse = form.professionGroup === 'พยาบาล';
                const nowIso = new Date().toISOString();

                const regPayload = {
                    id: docKey,
                    docId: docKey,
                    eventId,
                    activityTitle: onsiteConfig.activityTitle,
                    eventDate: onsiteConfig.eventDate,
                    venueAndOrganizer: onsiteConfig.venueAndOrganizer,
                    targetCourseId,
                    license: cleanLic,
                    professionGroup: form.professionGroup,
                    cneuEligible: isNurse,
                    name: form.name.trim(),
                    nameEN: form.nameEN.trim(),
                    position: form.position.trim() || form.professionGroup,
                    region: form.region,
                    hospital: form.hospital.trim(),
                    province: form.province.trim(),
                    email: form.email.trim(),
                    phone: form.phone.trim(),
                    onsiteUnlockAt: onsiteConfig.unlockAt,
                    revoked: false,
                    pdpaAccepted: true,
                    registeredAt: nowIso,
                    updatedAt: nowIso
                };

                try {
                    if (fbDb) {
                        // 1. บันทึกลงคลังรายชื่อแยกตามกิจกรรม ({eventId}_{license}) ไม่ทับรุ่นเก่า 100%
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', docKey), regPayload, { merge: true });

                        // 2. อัปเดตทะเบียนกิจกรรมใน onsite_events/{eventId} สำหรับตรวจสอบย้อนหลัง
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_events', eventId), {
                            eventId,
                            activityTitle: onsiteConfig.activityTitle,
                            eventDate: onsiteConfig.eventDate,
                            venueAndOrganizer: onsiteConfig.venueAndOrganizer,
                            targetCourseId,
                            unlockAt: onsiteConfig.unlockAt,
                            updatedAt: nowIso
                        }, { merge: true });

                        // 3. ซิงค์สิทธิ์ "เทียบโอน" (CREDIT_TRANSFER) เข้าศูนย์กลาง Data Center (elearning_users/{license})
                        const userRef = doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic);
                        let existingUser = null;
                        try {
                            const existingSnap = await getDoc(userRef);
                            if (existingSnap.exists()) existingUser = existingSnap.data();
                        } catch (_) {}

                        const baseProfile = {
                            ...(existingUser || {}),
                            id: cleanLic,
                            license: cleanLic,
                            name: regPayload.name,
                            nameEN: regPayload.nameEN || existingUser?.nameEN || '',
                            professionGroup: regPayload.professionGroup,
                            cneuEligible: isNurse,
                            position: regPayload.position,
                            department: regPayload.region,
                            hospital: regPayload.hospital,
                            province: regPayload.province,
                            email: regPayload.email || existingUser?.email || '',
                            phone: regPayload.phone || existingUser?.phone || '',
                            onsiteEventId: eventId,
                            onsiteUnlockAt: onsiteConfig.unlockAt,
                            onsiteForceUnlocked: Boolean(onsiteConfig.forceUnlocked),
                            hoursActivityDate: onsiteConfig.eventDate,
                            hoursActivityVenue: onsiteConfig.venueAndOrganizer
                        };

                        const syncedUser = typeof CORE.buildCourseEnrollmentRecord === 'function'
                            ? CORE.buildCourseEnrollmentRecord({
                                existingUser: baseProfile,
                                courseId: targetCourseId,
                                classification: {
                                    courseId: targetCourseId,
                                    learningTypeCode: 'CREDIT_TRANSFER',
                                    learningTypeLabel: 'เทียบโอน',
                                    subType: 'ONSITE_VERIFIED',
                                    studyHoursExempt: true,
                                    sourceEventId: eventId,
                                    sourceActivityTitle: onsiteConfig.activityTitle
                                }
                            })
                            : {
                                ...baseProfile,
                                learningTypeCode: 'CREDIT_TRANSFER',
                                learningTypeLabel: 'เทียบโอน',
                                userType: 'เทียบโอน',
                                studyHoursExempt: true,
                                progress: 100,
                                hoursActivityName: onsiteConfig.activityTitle
                            };

                        await setDoc(userRef, syncedUser, { merge: true });
                    }

                    setRegSuccess(regPayload);
                    showToast('ลงทะเบียน Onsite และผูกสิทธิ์เทียบโอนชั่วโมงเข้าศูนย์กลางเรียบร้อยแล้วค่ะ');
                } catch (err) {
                    showToast('ไม่สามารถบันทึกข้อมูลได้: ' + (err?.message || err), 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            const matchedCheckRecords = useMemo(() => {
                const clean = checkLicense.replace(/[^a-zA-Z0-9]/g, '').trim().toLowerCase();
                if (!clean) return [];
                return allRegistrations
                    .filter(r => String(r.license || '').toLowerCase() === clean)
                    .sort((a, b) => String(b.registeredAt || '').localeCompare(String(a.registeredAt || '')));
            }, [allRegistrations, checkLicense]);

            const handleSaveSelfEdit = async (e) => {
                e.preventDefault();
                if (!editingReg || !fbDb) return;
                const isNurse = editingReg.professionGroup === 'พยาบาล';
                const updated = {
                    ...editingReg,
                    cneuEligible: isNurse,
                    updatedAt: new Date().toISOString()
                };
                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', editingReg.docId), updated, { merge: true });
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', editingReg.license), {
                        name: updated.name,
                        professionGroup: updated.professionGroup,
                        cneuEligible: isNurse,
                        position: updated.position,
                        hospital: updated.hospital,
                        province: updated.province,
                        department: updated.region,
                        email: updated.email,
                        phone: updated.phone
                    }, { merge: true });
                    setEditingReg(null);
                    showToast('อัปเดตข้อมูลการลงทะเบียนของท่านเรียบร้อยค่ะ');
                } catch (err) {
                    showToast('แก้ไขข้อมูลไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const handleWithdrawSelf = (rec) => {
                askConfirm({
                    title: 'ยืนยันการยกเลิกการลงทะเบียน (PDPA Self-Service)',
                    message: `ต้องการลบรายชื่อของท่าน (${rec.name}) ออกจากกิจกรรม "${rec.activityTitle || rec.eventId}" หรือไม่?`,
                    danger: true,
                    confirmText: 'ยืนยันลบรายชื่อ',
                    onConfirm: async () => {
                        if (!fbDb) return;
                        try {
                            await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', rec.docId));
                            showToast('ยกเลิกการลงทะเบียนของท่านเรียบร้อยแล้วค่ะ');
                        } catch (err) {
                            showToast('ยกเลิกไม่สำเร็จ: ' + err.message, 'error');
                        }
                    }
                });
            };

            // ============================================================================
            // 5. ORGANIZER ARCHIVE ROSTER COMPUTATIONS (แยกตามกิจกรรมที่เลือก 100%)
            // ============================================================================
            const selectedEventRoster = useMemo(() => {
                const q = orgSearch.trim().toLowerCase();
                return allRegistrations
                    .filter(r => {
                        if (r.eventId !== activeArchiveEventId) return false;
                        if (!showRevoked && r.revoked) return false;
                        if (orgProfFilter !== 'ALL' && r.professionGroup !== orgProfFilter) return false;
                        if (q) {
                            const hay = `${r.name} ${r.license} ${r.hospital} ${r.province} ${r.region} ${r.professionGroup}`.toLowerCase();
                            if (!hay.includes(q)) return false;
                        }
                        return true;
                    })
                    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'th'));
            }, [allRegistrations, activeArchiveEventId, showRevoked, orgProfFilter, orgSearch]);

            const selectedEventStats = useMemo(() => {
                const inEvent = allRegistrations.filter(r => r.eventId === activeArchiveEventId);
                const active = inEvent.filter(r => !r.revoked);
                return {
                    total: active.length,
                    nurse: active.filter(r => r.professionGroup === 'พยาบาล').length,
                    doctor: active.filter(r => r.professionGroup === 'แพทย์').length,
                    allied: active.filter(r => r.professionGroup === 'บุคลากรสหวิชาชีพ').length,
                    revoked: inEvent.length - active.length
                };
            }, [allRegistrations, activeArchiveEventId]);

            const handleExportEventCsv = () => {
                const headers = [
                    'ลำดับ', 'รหัสกิจกรรม', 'ชื่อกิจกรรม', 'หลักสูตรปลายทาง',
                    'คำนำหน้า ชื่อ-นามสกุล', 'กลุ่มวิชาชีพ', 'สิทธิ์ CNEU',
                    'เลขที่ใบอนุญาตฯ', 'ตำแหน่ง', 'โรงพยาบาล/หน่วยงาน', 'จังหวัด',

                                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive">{rec.eventId} • {rec.professionGroup}</span>
                                                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${rec.revoked ? 'bg-rose-500/20 text-rose-300' : 'bg-aurora-500/20 text-accent-adaptive'}`}>
                                                            {rec.revoked ? 'ยกเลิกสิทธิ์แล้ว' : 'เทียบโอนชั่วโมง (100%)'}
                                                        </span>
                                                    </div>
                                                    <p className="font-display font-bold text-sm text-primary-adaptive m-0">{rec.activityTitle || rec.eventId}</p>
                                                    <p className="text-secondary-adaptive m-0">{rec.name} • {rec.hospital} ({rec.province || '-'}) • {rec.email || '-'}</p>
                                                    <p className="text-[11px] text-muted-adaptive m-0">ลงทะเบียนเมื่อ: {formatThaiDateTime(rec.registeredAt)}</p>
                                                    <div className="flex flex-wrap gap-2 pt-2">
                                                        <button type="button" onClick={() => setEditingReg({ ...rec })} className="spatial-soft px-3.5 py-1.5 rounded-xl font-bold text-prism-adaptive cursor-pointer">แก้ไขข้อมูล</button>
                                                        <button type="button" onClick={() => handleWithdrawSelf(rec)} className="px-3.5 py-1.5 rounded-xl bg-rose-500/15 text-rose-400 font-bold cursor-pointer">ยกเลิกการลงทะเบียน</button>
                                                        <a href={`./index.html?license=${encodeURIComponent(rec.license)}`} className="rjc2-pill-btn px-3.5 py-1.5 rounded-xl font-extrabold text-[11px]">เข้าสู่ระบบเรียน →</a>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {editingReg && (
                                    <form onSubmit={handleSaveSelfEdit} className="spatial-card rounded-[2rem] p-5 sm:p-6 space-y-3 border-prism-400/45 text-xs">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-display font-bold text-base text-primary-adaptive">แก้ไขข้อมูล ({editingReg.eventId})</h3>
                                            <button type="button" onClick={() => setEditingReg(null)} className="spatial-soft px-2.5 py-1 rounded-lg text-muted-adaptive cursor-pointer">ปิด</button>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <input required value={editingReg.name || ''} onChange={e => setEditingReg(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ-นามสกุล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <select value={editingReg.professionGroup || 'พยาบาล'} onChange={e => setEditingReg(p => ({ ...p, professionGroup: e.target.value }))} className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm">
                                                {PROFESSION_OPTIONS.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
                                            </select>
                                            <input value={editingReg.hospital || ''} onChange={e => setEditingReg(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <input value={editingReg.province || ''} onChange={e => setEditingReg(p => ({ ...p, province: e.target.value }))} placeholder="จังหวัด" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <input type="email" value={editingReg.email || ''} onChange={e => setEditingReg(p => ({ ...p, email: e.target.value }))} placeholder="อีเมล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            <input value={editingReg.phone || ''} onChange={e => setEditingReg(p => ({ ...p, phone: e.target.value }))} placeholder="เบอร์โทร" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                        </div>
                                        <button type="submit" className="rjc2-pill-btn touch-target px-6 py-2.5 rounded-full font-display font-extrabold text-xs">บันทึกการแก้ไข ✓</button>
                                    </form>
                                )}
                            </section>
                        )}

                        {/* ==================== TAB 3: HISTORICAL EVENT ARCHIVE & A4 SIGN-IN STUDIO ==================== */}
                        {activeTab === 'organizer' && (
                            <div className="space-y-5">
                                {/* Control Bar (No-Print) */}
                                <section className="no-print spatial-card rounded-[1.75rem] p-5 space-y-4 border-prism-400/35">
                                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">HISTORICAL EVENT ARCHIVE • ตรวจสอบรายชื่อย้อนหลังแยกตามกิจกรรม</span>
                                            <h2 className="font-display font-extrabold text-lg sm:text-xl text-primary-adaptive mt-0.5">
                                                คลังรายชื่อผู้เข้าร่วมอบรม &amp; สตูดิโอพิมพ์ใบเซ็นชื่อราชการ (A4 PDF)
                                            </h2>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            <button type="button" onClick={handleExportEventCsv} className="spatial-soft touch-target px-4 py-2 rounded-full text-xs font-bold text-accent-adaptive inline-flex items-center gap-1.5 cursor-pointer">
                                                <Icon name="FileSpreadsheet" size={15} /> ส่งออก CSV ({selectedEventRoster.length})
                                            </button>
                                            <button type="button" onClick={() => window.print()} className="rjc2-pill-btn touch-target px-5 py-2 rounded-full font-display font-extrabold text-xs inline-flex items-center gap-1.5">
                                                <Icon name="Printer" size={15} /> พิมพ์ใบเซ็นชื่อ A4 (PDF)
                                            </button>
                                        </div>
                                    </div>

                                    {/* เลือกกิจกรรมที่ต้องการตรวจสอบย้อนหลัง */}
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 items-end text-xs">
                                        <div className="lg:col-span-6">
                                            <label className="block font-bold text-prism-adaptive mb-1 ml-1">เลือกกิจกรรมที่ต้องการตรวจสอบรายชื่อย้อนหลัง ({mergedEventsList.length} กิจกรรม):</label>
                                            <select
                                                value={activeArchiveEventId}
                                                onChange={e => setSelectedEventId(e.target.value)}
                                                className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm font-bold"
                                            >
                                                {mergedEventsList.map(ev => (
                                                    <option key={ev.eventId} value={ev.eventId}>
                                                        {ev.isCurrent ? '★ [ปัจจุบัน] ' : '[ย้อนหลัง] '}{ev.eventId} — {ev.activityTitle}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="lg:col-span-4">
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ค้นหาชื่อ / เลขใบอนุญาต / โรงพยาบาล:</label>
                                            <input
                                                value={orgSearch}
                                                onChange={e => setOrgSearch(e.target.value)}
                                                placeholder="พิมพ์คำค้นหา..."
                                                className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                            />
                                        </div>
                                        <div className="lg:col-span-2">
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">แถวว่าง Walk-in:</label>
                                            <input
                                                type="number"
                                                min="0"
                                                max="25"
                                                value={printBlankRows}
                                                onChange={e => setPrintBlankRows(Math.max(0, Math.min(25, Number(e.target.value) || 0)))}
                                                className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl font-mono text-sm font-bold text-center"
                                            />
                                        </div>
                                    </div>

                                    {/* KPI Strip & Profession Filter */}
                                    <div className="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-white/10">
                                        <div className="flex flex-wrap gap-1.5 text-xs">
                                            {[
                                                { id: 'ALL', label: `ทั้งหมด (${selectedEventStats.total})` },
                                                { id: 'พยาบาล', label: `พยาบาล • CNEU (${selectedEventStats.nurse})` },
                                                { id: 'แพทย์', label: `แพทย์ (${selectedEventStats.doctor})` },
                                                { id: 'บุคลากรสหวิชาชีพ', label: `สหวิชาชีพ (${selectedEventStats.allied})` }
                                            ].map(f => (
                                                <button
                                                    key={f.id}
                                                    type="button"
                                                    onClick={() => setOrgProfFilter(f.id)}
                                                    className={`px-3 py-1.5 rounded-xl font-bold cursor-pointer ${
                                                        orgProfFilter === f.id
                                                            ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                            : 'spatial-soft text-secondary-adaptive'
                                                    }`}
                                                >
                                                    {f.label}
                                                </button>
                                            ))}
                                        </div>
                                        <label className="text-xs font-bold text-muted-adaptive inline-flex items-center gap-1.5 cursor-pointer">
                                            <input type="checkbox" checked={showRevoked} onChange={e => setShowRevoked(e.target.checked)} className="accent-aurora-500" />
                                            <span>แสดงผู้ยกเลิกสิทธิ์ ({selectedEventStats.revoked})</span>
                                        </label>
                                    </div>
                                </section>

                                {/* Printable Official A4 Sign-In Sheet (ใบเซ็นชื่อราชการพร้อมพิมพ์ / PDF) */}
                                <article id="onsite-print-root" className="a4-sheet rounded-2xl p-6 sm:p-10 space-y-4 max-w-4xl mx-auto">
                                    <div className="text-center border-b-2 border-slate-800 pb-3.5 space-y-1">
                                        <p className="text-xs font-bold text-emerald-800 uppercase m-0">
                                            แบบลงทะเบียนเข้าร่วมการอบรมและรับรองสิทธิ์เทียบโอนชั่วโมง (rjcloud.organ 2.0)
                                        </p>
                                        <h2 className="font-display text-lg font-extrabold text-slate-900 m-0">
                                            {activeArchiveEvent.activityTitle}
                                        </h2>
                                        <p className="text-xs text-slate-700 m-0">
                                            รหัสกิจกรรม: <b className="font-mono">{activeArchiveEvent.eventId}</b> • วันที่จัด: <b>{activeArchiveEvent.eventDate}</b> • สถานที่: {activeArchiveEvent.venueAndOrganizer}
                                        </p>
                                        <p className="text-xs font-bold text-slate-800 m-0">
                                            กลุ่มรายชื่อ: {orgProfFilter === 'ALL' ? 'รวมทุกกลุ่มวิชาชีพ' : `เฉพาะกลุ่ม${orgProfFilter}`} ({selectedEventRoster.length} ราย)
                                            {orgProfFilter === 'พยาบาล' && cneuConfig.activityCode ? ` • รหัสกิจกรรม CNEU: ${cneuConfig.activityCode} (${cneuConfig.cneuCredits} หน่วยคะแนน)` : ''}
                                        </p>
                                    </div>

                                    <table className="a4-table">
                                        <thead>
                                            <tr>
                                                <th style={{ width: '36px' }}>ลำดับ</th>
                                                <th>ชื่อ – นามสกุล</th>
                                                <th style={{ width: '96px' }}>กลุ่มวิชาชีพ</th>
                                                <th style={{ width: '104px' }}>เลขใบอนุญาตฯ</th>
                                                <th>โรงพยาบาล / หน่วยงาน</th>
                                                <th style={{ width: '92px' }}>ลายมือชื่อ (เช้า)</th>
                                                <th style={{ width: '92px' }}>ลายมือชื่อ (บ่าย)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {selectedEventRoster.map((r, idx) => (
                                                <tr key={r.docId || idx} className={r.revoked ? 'opacity-50 line-through' : ''}>
                                                    <td className="text-center font-mono font-bold">{idx + 1}</td>
                                                    <td className="font-bold">{r.name}</td>
                                                    <td className="text-center text-[11px]">{r.professionGroup || '-'}</td>
                                                    <td className="text-center font-mono text-[11px]">{r.license}</td>
                                                    <td className="text-[11px]">{r.hospital}{r.province ? ` (${r.province})` : ''}</td>
                                                    <td></td>
                                                    <td></td>
                                                </tr>
                                            ))}
                                            {Array.from({ length: printBlankRows }).map((_, bi) => (
                                                <tr key={`blank-${bi}`}>
                                                    <td className="text-center font-mono text-slate-400">{selectedEventRoster.length + bi + 1}</td>
                                                    <td style={{ height: '28px' }}></td>
                                                    <td></td>
                                                    <td></td>
                                                    <td></td>
                                                    <td></td>
                                                    <td></td>
                                                </tr>
                                            ))}
                                            {selectedEventRoster.length === 0 && printBlankRows === 0 && (
                                                <tr>
                                                    <td colSpan="7" className="text-center py-6 text-slate-500">
                                                        ยังไม่มีรายชื่อผู้ลงทะเบียนในกิจกรรม {activeArchiveEvent.eventId} ตามเงื่อนไขที่เลือก
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>

                                    <div className="signature-block pt-4 grid grid-cols-2 gap-8 text-center text-xs">
                                        <div className="space-y-1">
                                            <p>ลงชื่อ ...............................................................</p>
                                            <p className="font-bold">({cneuConfig.reporterName || 'ผู้ประสานงานโครงการ'})</p>
                                            <p className="text-slate-600">ผู้รับลงทะเบียนและตรวจสอบรายชื่อ</p>
                                        </div>
                                        <div className="space-y-1">
                                            <p>ลงชื่อ ...............................................................</p>
                                            <p className="font-bold">({cneuConfig.approverName || 'ผู้อำนวยการศูนย์ความเป็นเลิศทางการแพทย์'})</p>
                                            <p className="text-slate-600">ผู้รับรองการจัดกิจกรรมอบรม</p>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        )}
                    </main>

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('onsite-root'));
        root.render(<OnsiteErrorBoundary><OnsiteApp /></OnsiteErrorBoundary>);
    </script>

    <!-- โหลด Babel ท้ายสุดพร้อม CDN สำรองป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
