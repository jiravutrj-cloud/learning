    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

                const timePart = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
                return `${datePart} เวลา ${timePart} น.`;

        function QrCodeBox({ url, size = 148 }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !url || typeof window.qrcode !== 'function') return;
                try {
                    const qr = window.qrcode(0, 'M');
                    qr.addData(url);
                    qr.make();
                    const count = qr.getModuleCount();
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, size, size);
                    const cell = size / count;
                    ctx.fillStyle = '#0f172a';
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                ctx.fillRect(Math.floor(c * cell), Math.floor(r * cell), Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    }
                } catch (_) {}
            }, [url, size]);
            return <canvas ref={canvasRef} width={size} height={size} className="rounded-xl bg-white p-2 shadow-md" />;
        }

            // Firebase Auth + Real-Time Settings Subscription
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) {
                    setAuthReady(true);
                    return;
                }
                let active = true;
                let unsubSettings = null;
                let anonTried = false;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (!anonTried) {
                            anonTried = true;
                            try { await signInAnonymously(fbAuth); } catch (_) { setAuthReady(true); }
                        }
                        return;
                    }
                    setAuthReady(true);

                    // หากล็อกอินด้วยอีเมลผู้ดูแลระบบไว้แล้ว เปิดสิทธิ์ศูนย์ผู้จัดอัตโนมัติ
                    if (fbUser.email) {
                        const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => x.toLowerCase());
                        if (allowed.includes(fbUser.email.toLowerCase())) {
                            setOrganizerSession({ email: fbUser.email, isDemo: false });
                        }
                    }

                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (snap.exists() && snap.data()?.onsiteConfig) {
                                const merged = { ...DEFAULT_ONSITE_CONFIG, ...snap.data().onsiteConfig };
                                merged.unlockAtLocal = isoToLocalInputValue(merged.unlockAt);
                                setActivityConfig(merged);
                                setConfigDraft(merged);
                            }
                        },
                        () => {}
                    );
                }, () => { setAuthReady(true); });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                };
            }, []);

            // Real-Time Registrants Subscription (เฉพาะผู้จัดที่ยืนยันตัวตนแล้ว เพื่อคุ้มครอง PDPA)
            useEffect(() => {
                if (!organizerSession) return;
                if (organizerSession.isDemo) {
                    setRegistrants(buildPreviewSampleRegistrants(activityConfig));
                    return;
                }
                if (!fbDb) return;
                const unsub = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        setRegistrants(arr);
                    },
                    (err) => console.warn('Onsite registrants snapshot error:', err)
                );
                return () => { try { unsub(); } catch (_) {} };
            }, [organizerSession, activityConfig.unlockAt]);

            // ============================================================================
            // 5. COMPUTED UNLOCK COUNTDOWN & PUBLIC REGISTRATION HANDLERS
            // ============================================================================
            const effectiveUnlockMs = useMemo(() => {
                const iso = confirmedRecord?.onsiteUnlockAt || activityConfig.unlockAt;
                const t = new Date(iso).getTime();
                return isNaN(t) ? nowMs : t;
            }, [confirmedRecord?.onsiteUnlockAt, activityConfig.unlockAt, nowMs]);

            const isUnlockedNow = Boolean(activityConfig.forceUnlocked || nowMs >= effectiveUnlockMs);

            const countdownText = useMemo(() => {
                if (isUnlockedNow) return 'เปิดสิทธิ์ให้เข้าสู่ระบบแล้ว';
                const diffSec = Math.max(0, Math.floor((effectiveUnlockMs - nowMs) / 1000));
                const d = Math.floor(diffSec / 86400);
                const h = Math.floor((diffSec % 86400) / 3600);
                const m = Math.floor((diffSec % 3600) / 60);
                const s = diffSec % 60;
                if (d > 0) return `อีก ${d} วัน ${h} ชม. ${m} นาที ${s} วินาที`;
                return `อีก ${h} ชม. ${String(m).padStart(2, '0')} นาที ${String(s).padStart(2, '0')} วินาที`;
            }, [isUnlockedNow, effectiveUnlockMs, nowMs]);

            const handleLookupLicense = async (e) => {
                e.preventDefault();
                const clean = lookupLicense.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (clean.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบอนุญาตประกอบวิชาชีพ หรือรหัสประจำตัวบุคลากรอย่างน้อย 4 หลักค่ะ', 'error');
                    return;
                }
                setLookingUp(true);
                let foundOnsite = null;
                let foundUser = null;

                if (fbDb && authReady && !isAdminPreview) {
                    try {
                        const osSnap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', clean));
                        if (osSnap.exists()) foundOnsite = { id: osSnap.id, ...osSnap.data() };
                    } catch (_) {}
                    try {
                        const uSnap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', clean));
                        if (uSnap.exists()) foundUser = { id: uSnap.id, ...uSnap.data() };
                    } catch (_) {}
                }

                if (foundOnsite && !foundOnsite.revoked && foundOnsite.eventId === activityConfig.eventId) {
                    setConfirmedRecord(foundOnsite);
                    setRegStep(3);
                    setLookingUp(false);
                    showToast('พบข้อมูลการลงทะเบียนกิจกรรมนี้ของท่านแล้วค่ะ', 'info');
                    return;
                }

                const src = foundOnsite || foundUser;
                if (src) {
                    const regKey = normalizeRegionLabel(src.region || src.department);
                    const mappedList = HOSPITAL_MAPPING[regKey] || [];
                    const hasInList = mappedList.some(h => h.name === src.hospital);
                    setForm(prev => ({
                        ...prev,
                        professionGroup: src.professionGroup || prev.professionGroup,
                        name: src.name || '',
                        position: src.position || prev.position,
                        region: HOSPITAL_MAPPING[regKey] ? regKey : prev.region,
                        hospital: hasInList ? src.hospital : (src.hospital ? '__CUSTOM__' : prev.hospital),
                        customHospital: hasInList ? '' : (src.hospital || ''),
                        province: src.province || prev.province,
                        email: src.email || '',
                        phone: src.phone || ''
                    }));
                    showToast('ดึงข้อมูลเดิมจากฐานข้อมูล rjcloud.organ มาเติมให้อัตโนมัติแล้วค่ะ');
                } else {
                    showToast('กรุณากรอกข้อมูลเพื่อลงทะเบียนเข้าร่วมอบรมค่ะ', 'info');
                }
                setLookingUp(false);
                setRegStep(2);
            };

            const handleSubmitRegistration = async (e) => {
                e.preventDefault();
                const cleanLic = lookupLicense.replace(/[^a-zA-Z0-9]/g, '').trim();
                const finalHospital = form.hospital === '__CUSTOM__' ? form.customHospital.trim() : form.hospital.trim();

                if (!cleanLic || !form.name.trim() || !finalHospital || !form.province.trim()) {
                    showToast('กรุณากรอกชื่อ–นามสกุล โรงพยาบาล และจังหวัดให้ครบถ้วนค่ะ', 'error');
                    return;
                }
                if (!form.email.includes('@')) {
                    showToast('กรุณาระบุอีเมลที่ถูกต้องสำหรับรับรหัส OTP เข้าสู่ระบบ rjcloud.organ 2.0 ค่ะ', 'error');
                    return;
                }
                if (!form.pdpaAccepted) {
                    showToast('กรุณายอมรับนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ก่อนยืนยันค่ะ', 'error');
                    return;
                }

                setSubmitting(true);
                const nowIso = new Date().toISOString();

                const regPayload = {
                    id: cleanLic,
                    license: cleanLic,
                    eventId: activityConfig.eventId,
                    activityTitle: activityConfig.activityTitle,
                    eventDate: activityConfig.eventDate,
                    venueAndOrganizer: activityConfig.venueAndOrganizer,
                    professionGroup: form.professionGroup,
                    name: form.name.trim(),
                    position: form.position.trim() || form.professionGroup,
                    region: form.region,
                    province: form.province.trim(),
                    hospital: finalHospital,
                    email: form.email.trim(),
                    phone: form.phone.trim(),
                    registeredAt: nowIso,
                    onsiteUnlockAt: activityConfig.unlockAt,
                    revoked: false
                };

                // ข้อมูลที่ซิงค์เข้า elearning_users/{license} อัตโนมัติ (กำหนดวัน-เวลาเปิดสิทธิ์ + ชั่งโมงครบเทียบโอน)
                const learnerSyncPayload = {
                    id: cleanLic,
                    license: cleanLic,
                    name: regPayload.name,
                    email: regPayload.email,
                    phone: regPayload.phone,
                    position: regPayload.position,
                    professionGroup: regPayload.professionGroup,
                    department: regPayload.region,
                    hospital: regPayload.hospital,
                    province: regPayload.province,
                    userType: 'เรียนต่อเนื่อง',
                    studyHoursExempt: true,
                    progress: 100,
                    hoursStatusLabel: 'ชั่วโมงครบ (เทียบโอน)',
                    hoursActivityName: activityConfig.activityTitle,
                    hoursActivityDate: activityConfig.eventDate,
                    hoursActivityVenue: activityConfig.venueAndOrganizer,
                    onsiteEventId: activityConfig.eventId,
                    onsiteRegisteredAt: nowIso,
                    onsiteUnlockAt: activityConfig.unlockAt,
                    onsiteForceUnlocked: Boolean(activityConfig.forceUnlocked),
                    status: 'กำลังเรียน'
                };

                if (fbDb && authReady && !isAdminPreview) {
                    try {
                        // 1) บันทึกใบสมัครลงทะเบียน Onsite
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', cleanLic),
                            regPayload,
                            { merge: true }
                        );
                        // 2) ดึงและซิงค์เข้า rjcloud.organ 2.0 (รักษาสถานะเดิมหากผู้เรียนเคยสอบผ่านแล้ว)
                        const existingSnap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (existingSnap.exists()) {
                            const ex = existingSnap.data();
                            if (ex.status === 'ผ่าน') learnerSyncPayload.status = 'ผ่าน';
                            if (ex.pretest && ex.pretest !== '-') learnerSyncPayload.pretest = ex.pretest;
                            if (ex.posttest && ex.posttest !== '-') learnerSyncPayload.posttest = ex.posttest;
                        }
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic),
                            learnerSyncPayload,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Onsite cloud save warning:', err);
                        showToast('บันทึกข้อมูลบางส่วนติดขัด กรุณาลองใหม่อีกครั้งค่ะ', 'error');
                        setSubmitting(false);
                        return;
                    }
                } else {
                    // โหมดพรีวิวเดี่ยว เพิ่มเข้าใน state ทันทีเพื่อให้กดดูในหน้า Export PDF ได้เลย
                    setRegistrants(prev => [regPayload, ...prev.filter(x => x.license !== cleanLic)]);
                }

                setConfirmedRecord(regPayload);
                setRegStep(3);
                setSubmitting(false);
                showToast('ลงทะเบียนเรียบร้อยแล้ว! ซิงค์สิทธิ์เข้า rjcloud.organ 2.0 ตามกำหนดเวลาแล้วค่ะ');
            };

            // ============================================================================
            // 6. ORGANIZER AUTH, ACTIVITY SETTINGS & BATCH SYNC TO RJCLOUD.ORGAN 2.0
            // ============================================================================
            const handleOrganizerLogin = async (e) => {
                e.preventDefault();
                if (!isCloudConfigured || !fbAuth) {
                    showToast('ไม่พบการเชื่อมต่อ Firebase กรุณาใช้โหมดทดสอบตัวอย่างแทนค่ะ', 'error');
                    return;
                }
                const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => x.toLowerCase());
                if (!allowed.includes(adminEmail.trim().toLowerCase())) {
                    showToast(`อนุญาตเฉพาะบัญชีผู้ดูแลระบบ (${CONFIG.contactEmail}) เท่านั้นค่ะ`, 'error');
                    return;
                }
                setLoggingIn(true);
                try {
                    await signInWithEmailAndPassword(fbAuth, adminEmail.trim(), adminPassword);
                    setOrganizerSession({ email: adminEmail.trim(), isDemo: false });
                    setViewMode('organizer');
                    setOrganizerTab('pdf');
                    showToast('เข้าสู่ศูนย์ผู้จัดงาน Onsite สำเร็จค่ะ');
                } catch (_) {
                    showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบใน Firebase Auth ค่ะ', 'error');
                } finally {
                    setLoggingIn(false);
                }
            };

            const handleEnterDemoOrganizer = () => {
                setOrganizerSession({ email: 'demo-preview@rjcloud.organ', isDemo: true });
                setRegistrants(buildPreviewSampleRegistrants(activityConfig));
                setViewMode('organizer');
                setOrganizerTab('pdf');
                showToast('เปิดโหมดตัวอย่างผู้จัดงานพร้อมรายชื่อจำลอง 12 ราย (ทดสอบคัดกรอง & พิมพ์ PDF ได้ทันที)', 'info');
            };

            const handleSaveActivityConfig = async (overrideForce = null) => {
                const unlockDateObj = new Date(configDraft.unlockAtLocal || buildDefaultUnlockLocal());
                const unlockIso = isNaN(unlockDateObj.getTime()) ? new Date().toISOString() : unlockDateObj.toISOString();
                const nextCfg = {
                    ...configDraft,
                    unlockAt: unlockIso,
                    forceUnlocked: overrideForce !== null ? Boolean(overrideForce) : Boolean(configDraft.forceUnlocked)
                };
                setActivityConfig(nextCfg);
                setConfigDraft(nextCfg);

                if (organizerSession?.isDemo || !fbDb) {
                    showToast('อัปเดตข้อมูลกิจกรรมและเวลาเปิดสิทธิ์ (โหมดตัวอย่าง) เรียบร้อยค่ะ');
                    return;
                }
                try {
                    await setDoc(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        { onsiteConfig: nextCfg },
                        { merge: true }
                    );
                    showToast('บันทึกหัวข้อกิจกรรมและกำหนดวัน–เวลาเปิดสิทธิ์ขึ้น Cloud เรียบร้อยค่ะ');
                } catch (err) {
                    showToast('บันทึกการตั้งค่าไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            // ซิงค์อัปเดตวัน–เวลาเปิดสิทธิ์ & ข้อมูลกิจกรรมเข้า elearning_users ของผู้สมัครทุกคนที่ยังไม่ถูกยกเลิก
            const handleBatchSyncUnlockToLearners = async () => {
                const activeList = registrants.filter(r => !r.revoked);
                if (activeList.length === 0) {
                    showToast('ยังไม่มีรายชื่อผู้สมัครที่พร้อมซิงค์ค่ะ', 'info');
                    return;
                }
                if (organizerSession?.isDemo || !fbDb) {
                    showToast(`จำลองซิงค์สิทธิ์และเวลาเปิดระบบให้ผู้สมัคร ${activeList.length} รายเรียบร้อยค่ะ`);
                    return;
                }
                setSyncingBatch(true);
                let okCount = 0;
                try {
                    for (const r of activeList) {
                        const lic = String(r.license || r.id || '').trim();
                        if (!lic) continue;
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', lic),
                            {
                                id: lic,
                                license: lic,
                                name: r.name,
                                email: r.email || '',
                                phone: r.phone || '',
                                position: r.position || r.professionGroup,
                                professionGroup: r.professionGroup || 'พยาบาล',
                                department: r.region,
                                hospital: r.hospital,
                                province: r.province,
                                userType: 'เรียนต่อเนื่อง',
                                studyHoursExempt: true,
                                progress: 100,
                                hoursStatusLabel: 'ชั่วโมงครบ (เทียบโอน)',
                                hoursActivityName: activityConfig.activityTitle,
                                hoursActivityDate: activityConfig.eventDate,
                                hoursActivityVenue: activityConfig.venueAndOrganizer,
                                onsiteEventId: activityConfig.eventId,
                                onsiteUnlockAt: activityConfig.unlockAt,
                                onsiteForceUnlocked: Boolean(activityConfig.forceUnlocked)
                            },
                            { merge: true }
                        );
                        okCount += 1;
                    }
                    showToast(`ซิงค์สิทธิ์และเวลาเปิดระบบ rjcloud.organ 2.0 ครบ ${okCount} รายเรียบร้อยค่ะ`);
                } catch (err) {
                    showToast('ซิงค์บางรายการไม่สำเร็จ: ' + err.message, 'error');
                } finally {
                    setSyncingBatch(false);
                }
            };

            // ยกเลิกหรือคืนสิทธิ์เทียบโอน (กรณีผู้สมัครไม่ได้มาเซ็นชื่อเข้าร่วมอบรมจริง — No-show)
            const handleToggleRevoke = (reg) => {
                const nextRevoked = !reg.revoked;
                setConfirmDialog({
                    open: true,
                    title: nextRevoked ? 'ยกเลิกสิทธิ์เทียบโอน (ไม่มาเข้าร่วมอบรมจริง)' : 'คืนสิทธิ์เทียบโอน Onsite',
                    message: nextRevoked
                        ? `ต้องการยกเลิกสิทธิ์เทียบโอนของ "${reg.name}" (${reg.license}) หรือไม่? ผู้เรียนจะถูกปรับกลับเป็นสิทธิ์ผู้เรียนใหม่ตามปกติ`
                        : `ต้องการคืนสิทธิ์เทียบโอนชั่วโมงและเปิดสิทธิ์ตามกำหนดเวลาให้ "${reg.name}" หรือไม่?`,
                    danger: nextRevoked,
                    confirmText: nextRevoked ? 'ยกเลิกสิทธิ์เทียบโอน' : 'คืนสิทธิ์เทียบโอน',
                    onConfirm: async () => {
                        setRegistrants(prev => prev.map(x => (x.license === reg.license ? { ...x, revoked: nextRevoked } : x)));
                        if (organizerSession?.isDemo || !fbDb) {
                            showToast(nextRevoked ? 'ยกเลิกสิทธิ์เทียบโอนแล้วค่ะ (โหมดตัวอย่าง)' : 'คืนสิทธิ์เทียบโอนแล้วค่ะ');
                            return;
                        }
                        try {
                            const lic = String(reg.license || reg.id);
                            await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', lic), { revoked: nextRevoked }, { merge: true });
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', lic),
                                nextRevoked
                                    ? { studyHoursExempt: false, userType: 'เรียนใหม่', hoursStatusLabel: 'กำลังสะสมชั่วโมง', progress: 0 }
                                    : {
                                        studyHoursExempt: true,
                                        userType: 'เรียนต่อเนื่อง',
                                        progress: 100,
                                        hoursStatusLabel: 'ชั่วโมงครบ (เทียบโอน)',
                                        hoursActivityName: activityConfig.activityTitle,
                                        onsiteUnlockAt: activityConfig.unlockAt,
                                        onsiteForceUnlocked: Boolean(activityConfig.forceUnlocked)
                                    },
                                { merge: true }
                            );
                            showToast(nextRevoked ? 'ยกเลิกสิทธิ์เทียบโอนเรียบร้อยค่ะ' : 'คืนสิทธิ์เทียบโอนเรียบร้อยค่ะ');
                        } catch (err) {
                            showToast('อัปเดตสิทธิ์ไม่สำเร็จ: ' + err.message, 'error');
                        }
                    }
                });
            };

            // ============================================================================
            // 7. SMART MULTI-FILTER & GROUPING ENGINE FOR ON-SITE SIGN-IN PDF
            // ============================================================================
            const activeRegistrantsBase = useMemo(() => {
                return registrants.filter(r => (includeRevoked ? true : !r.revoked));
            }, [registrants, includeRevoked]);

            // รายการตัวเลือกตัวกรองแบบ Cascading (เขตสุขภาพ -> จังหวัด -> โรงพยาบาล)
            const filterOptions = useMemo(() => {
                const regions = Array.from(new Set(activeRegistrantsBase.map(r => r.region).filter(Boolean)))
                    .sort((a, b) => getRegionSortOrder(a) - getRegionSortOrder(b));

                const byReg = filterRegion === 'ALL' ? activeRegistrantsBase : activeRegistrantsBase.filter(r => r.region === filterRegion);
                const provinces = Array.from(new Set(byReg.map(r => r.province).filter(Boolean)))
                    .sort((a, b) => a.localeCompare(b, 'th'));

                const byProv = filterProvince === 'ALL' ? byReg : byReg.filter(r => r.province === filterProvince);
                const hospitals = Array.from(new Set(byProv.map(r => r.hospital).filter(Boolean)))
                    .sort((a, b) => a.localeCompare(b, 'th'));

                return { regions, provinces, hospitals };
            }, [activeRegistrantsBase, filterRegion, filterProvince]);

            // รีเซ็ตตัวกรองลูกเมื่อตัวกรองแม่เปลี่ยน
            useEffect(() => {
                if (filterProvince !== 'ALL' && !filterOptions.provinces.includes(filterProvince)) setFilterProvince('ALL');
            }, [filterOptions.provinces, filterProvince]);
            useEffect(() => {
                if (filterHospital !== 'ALL' && !filterOptions.hospitals.includes(filterHospital)) setFilterHospital('ALL');
            }, [filterOptions.hospitals, filterHospital]);

            // กรองและเรียงลำดับรายชื่ออย่างเป็นระบบ (เขตสุขภาพ -> จังหวัด -> โรงพยาบาล -> กลุ่มวิชาชีพ -> ชื่อ ก-ฮ)
            const filteredSortedRegistrants = useMemo(() => {
                const q = filterSearch.trim().toLowerCase();
                return activeRegistrantsBase
                    .filter(r => {
                        if (filterProfession !== 'ALL' && r.professionGroup !== filterProfession) return false;
                        if (filterRegion !== 'ALL' && r.region !== filterRegion) return false;
                        if (filterProvince !== 'ALL' && r.province !== filterProvince) return false;
                        if (filterHospital !== 'ALL' && r.hospital !== filterHospital) return false;
                        if (q) {
                            const hay = `${r.name} ${r.license} ${r.hospital} ${r.province} ${r.region} ${r.professionGroup}`.toLowerCase();
                            if (!hay.includes(q)) return false;
                        }
                        return true;
                    })
                    .sort((a, b) => {
                        const rDiff = getRegionSortOrder(a.region) - getRegionSortOrder(b.region);
                        if (rDiff !== 0) return rDiff;
                        const pDiff = String(a.province || '').localeCompare(String(b.province || ''), 'th');
                        if (pDiff !== 0) return pDiff;
                        const hDiff = String(a.hospital || '').localeCompare(String(b.hospital || ''), 'th');
                        if (hDiff !== 0) return hDiff;
                        const profDiff = getProfessionSortOrder(a.professionGroup) - getProfessionSortOrder(b.professionGroup);
                        if (profDiff !== 0) return profDiff;
                        return String(a.name || '').localeCompare(String(b.name || ''), 'th');
                    });

                                                    className="text-prism-adaptive font-bold hover:underline"
                                                >
                                                    ล้างตัวกรองทั้งหมด
                                                </button>
                                            )}
                                        </div>
                                    </section>

                                    {/* แสดงตัวอย่างกระดาษ A4 สำหรับพิมพ์ / ส่งออก PDF (แยกชุดขึ้นหน้าใหม่อัตโนมัติ) */}
                                    <div className="w-full overflow-x-auto custom-scrollbar pb-6 flex flex-col items-center gap-6">
                                        {groupedSignInSheets.length === 0 ? (
                                            <div className="no-print spatial-card rounded-3xl p-10 text-center text-sm text-muted-adaptive max-w-lg w-full">
                                                ไม่พบรายชื่อผู้สมัครตามตัวกรองที่เลือกค่ะ
                                            </div>
                                        ) : (
                                            groupedSignInSheets.map((sheet, sIdx) => (
                                                <article
                                                    key={sheet.key}
                                                    className={`a4-signin-sheet rounded-xl p-6 sm:p-9 space-y-4 ${pdfOrientation === 'landscape' ? 'a4-landscape' : 'a4-portrait'} ${sIdx > 0 ? 'sheet-page-break' : ''}`}
                                                >
                                                    {/* หัวเอกสารลงทะเบียนหน้างานมาตรฐานราชการ */}
                                                    <div className="border-b-2 border-slate-800 pb-3.5 flex items-start justify-between gap-4">
                                                        <div className="space-y-0.5">
                                                            <p className="text-[11px] font-bold tracking-wider text-emerald-800 uppercase">
                                                                บัญชีลงทะเบียนเข้าร่วมอบรมหน้างาน (OFFICIAL ON-SITE SIGN-IN SHEET)
                                                            </p>
                                                            <h1 className="font-display text-lg sm:text-xl font-extrabold text-slate-900 leading-snug">
                                                                {activityConfig.activityTitle}
                                                            </h1>
                                                            <p className="text-xs sm:text-[13px] text-slate-700 font-semibold">
                                                                วันที่จัดกิจกรรม: {activityConfig.eventDate} &nbsp;|&nbsp; สถานที่/หน่วยงานผู้จัด: {activityConfig.venueAndOrganizer}
                                                            </p>
                                                        </div>
                                                        <div className="text-right shrink-0 border-2 border-slate-800 rounded-lg px-3 py-1.5 bg-slate-50">
                                                            <p className="text-[10px] font-bold text-slate-500 uppercase">ชุดที่ {sIdx + 1} / {groupedSignInSheets.length}</p>
                                                            <p className="font-mono text-base font-extrabold text-slate-900">{sheet.rows.length} ราย</p>
                                                        </div>
                                                    </div>

                                                    {/* แถบป้ายโต๊ะลงทะเบียนขนาดใหญ่อ่านชัดหน้างาน */}
                                                    <div className="bg-slate-100 border border-slate-300 rounded-lg px-3.5 py-2 flex flex-wrap items-center justify-between gap-2">
                                                        <div>
                                                            <p className="font-display font-extrabold text-sm sm:text-base text-slate-900">{sheet.deskTitle}</p>
                                                            <p className="text-[11px] text-slate-600">{sheet.subtitle}</p>
                                                        </div>
                                                        <span className="text-[11px] font-mono font-bold text-emerald-800">
                                                            เปิดสิทธิ์ rjcloud.organ 2.0: {formatThaiDateTime(activityConfig.unlockAt)}
                                                        </span>
                                                    </div>

                                                    {/* ตารางเซ็นชื่อหน้างาน */}
                                                    <table className="signin-table">
                                                        <thead>
                                                            <tr>
                                                                <th style={{ width: '40px' }}>ลำดับ</th>
                                                                <th>คำนำหน้า ชื่อ – นามสกุล<br /><span className="font-normal text-[10px] text-slate-500">(เรียงตามเขต • รพ. • ก–ฮ)</span></th>
                                                                <th style={{ width: '92px' }}>กลุ่มวิชาชีพ</th>
                                                                <th>โรงพยาบาล / หน่วยงาน<br /><span className="font-normal text-[10px] text-slate-500">(จังหวัด • เขตสุขภาพ)</span></th>
                                                                <th style={{ width: '104px' }}>เลขใบอนุญาตฯ</th>
                                                                {signColumnsMode === 'day1_single' && <th style={{ width: '150px' }}>ลงลายมือชื่อ</th>}
                                                                {signColumnsMode === 'day1_am_pm' && (
                                                                    <>
                                                                        <th style={{ width: '115px' }}>ลงชื่อ (เช้า)</th>
                                                                        <th style={{ width: '115px' }}>ลงชื่อ (บ่าย)</th>
                                                                    </>
                                                                )}
                                                                {signColumnsMode === 'day2_am_pm' && (
                                                                    <>
                                                                        <th style={{ width: '78px' }}>วันที่ 1<br /><span className="font-normal text-[10px]">เช้า</span></th>
                                                                        <th style={{ width: '78px' }}>วันที่ 1<br /><span className="font-normal text-[10px]">บ่าย</span></th>
                                                                        <th style={{ width: '78px' }}>วันที่ 2<br /><span className="font-normal text-[10px]">เช้า</span></th>
                                                                        <th style={{ width: '78px' }}>วันที่ 2<br /><span className="font-normal text-[10px]">บ่าย</span></th>
                                                                    </>
                                                                )}
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {sheet.rows.map((r, rIdx) => (
                                                                <tr key={r.id || r.license || rIdx}>
                                                                    <td className="text-center font-mono font-bold text-slate-700">{rIdx + 1}</td>
                                                                    <td>
                                                                        <div className="font-bold text-slate-900">{r.name}</div>
                                                                        <div className="text-[11px] text-slate-500">{r.position || '-'}</div>
                                                                    </td>
                                                                    <td className="text-center font-semibold text-slate-800">{r.professionGroup}</td>
                                                                    <td>
                                                                        <div className="font-semibold text-slate-900">{r.hospital}</div>
                                                                        <div className="text-[11px] text-slate-500">จ.{r.province} • {r.region}</div>
                                                                    </td>
                                                                    <td className="text-center font-mono text-[11px] font-bold text-slate-800">{r.license}</td>
                                                                    {signColumnsMode === 'day1_single' && <td />}
                                                                    {signColumnsMode === 'day1_am_pm' && (<><td /><td /></>)}
                                                                    {signColumnsMode === 'day2_am_pm' && (<><td /><td /><td /><td /></>)}
                                                                </tr>
                                                            ))}
                                                            {/* แถวว่างสำรองสำหรับ Walk-in หน้างาน */}
                                                            {Array.from({ length: extraBlankRows }).map((_, bIdx) => (
                                                                <tr key={`blank-${bIdx}`}>
                                                                    <td className="text-center font-mono text-slate-400">{sheet.rows.length + bIdx + 1}</td>
                                                                    <td /><td /><td /><td />
                                                                    {signColumnsMode === 'day1_single' && <td />}
                                                                    {signColumnsMode === 'day1_am_pm' && (<><td /><td /></>)}
                                                                    {signColumnsMode === 'day2_am_pm' && (<><td /><td /><td /><td /></>)}
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>

                                                    {/* ท้ายกระดาษ */}
                                                    <div className="sheet-footer-block pt-2 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 text-[10px] font-mono text-slate-500">
                                                        <span>RJCLOUD.ORGAN 2.0 • {activityConfig.eventId} • {sheet.deskTitle}</span>
                                                        <span>พิมพ์เมื่อ: {new Date().toLocaleString('th-TH')}</span>
                                                    </div>
                                                </article>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* ==================== ORG TAB 2: STANDARDIZED ACTIVITY SETTINGS & SCHEDULED UNLOCK ==================== */}
                            {organizerTab === 'settings' && (
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                    <div className="lg:col-span-8 spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">STANDARDIZED ACTIVITY REFERENCE &amp; AUTO-UNLOCK</span>
                                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive">ตั้งค่าข้อมูลมาตรฐานกิจกรรม &amp; วัน–เวลาเปิดสิทธิ์เข้า rjcloud.organ 2.0</h2>
                                            <p className="text-xs text-secondary-adaptive mt-0.5">ข้อมูลทั้ง 3 หัวข้อหลักจะถูกนำไปอ้างอิงในโปรไฟล์ผู้เรียนและหัวเอกสารเซ็นชื่อหน้างานโดยอัตโนมัติ</p>
                                        </div>

                                        <div className="space-y-3 text-xs">
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">รหัสกิจกรรม / รุ่น (Event ID)</label>
                                                <input value={configDraft.eventId} onChange={e => setConfigDraft(p => ({ ...p, eventId: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl font-mono text-sm font-bold" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">1. ชื่อกิจกรรม (แสดงคู่กับสถานะชั่วโมงครบ เทียบโอน)</label>
                                                <input value={configDraft.activityTitle} onChange={e => setConfigDraft(p => ({ ...p, activityTitle: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm font-semibold" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">2. วัน/เดือน/ปี ที่จัดกิจกรรม</label>
                                                <input value={configDraft.eventDate} onChange={e => setConfigDraft(p => ({ ...p, eventDate: e.target.value }))} placeholder="เช่น 15 – 16 มกราคม 2570" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">3. สถานที่ / หน่วยงานที่จัด</label>
                                                <input value={configDraft.venueAndOrganizer} onChange={e => setConfigDraft(p => ({ ...p, venueAndOrganizer: e.target.value }))} placeholder="เช่น ห้องประชุมพิบูลสงคราม โรงพยาบาลราชวิถี" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div className="p-4 rounded-2xl bg-prism-500/15 border border-prism-400/35 space-y-2.5">
                                                <label className="block font-bold text-prism-adaptive">4. กำหนดวันและเวลาที่เปิดสิทธิ์ให้ผู้เข้าอบรมเข้า rjcloud.organ 2.0 อัตโนมัติ</label>
                                                <input
                                                    type="datetime-local"
                                                    value={configDraft.unlockAtLocal}
                                                    onChange={e => setConfigDraft(p => ({ ...p, unlockAtLocal: e.target.value }))}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl font-mono text-sm font-bold"
                                                />
                                                <p className="text-[11px] text-secondary-adaptive">
                                                    เมื่อถึงเวลาที่กำหนด ผู้สมัครทุกคนจะเข้าทำ Pre-test → AI Skill Lab 3 มิติ → Post-test ≥ 80% → รับประกาศนียบัตรได้ทันทีโดยไม่ต้องนั่งสะสมชั่วโมงวิดีโอซ้ำ
                                                </p>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                                <label className="spatial-soft p-3.5 rounded-2xl flex items-center justify-between gap-2 cursor-pointer">
                                                    <span className="font-bold text-primary-adaptive">เปิดรับสมัครออนไลน์อยู่</span>
                                                    <input type="checkbox" checked={Boolean(configDraft.registrationOpen)} onChange={e => setConfigDraft(p => ({ ...p, registrationOpen: e.target.checked }))} className="w-5 h-5 accent-aurora-500" />
                                                </label>
                                                <label className="spatial-soft p-3.5 rounded-2xl flex items-center justify-between gap-2 cursor-pointer">
                                                    <span className="font-bold text-accent-adaptive">เปิดสิทธิ์เข้า rjcloud 2.0 ทันที (ข้ามเวลารอ)</span>
                                                    <input type="checkbox" checked={Boolean(configDraft.forceUnlocked)} onChange={e => setConfigDraft(p => ({ ...p, forceUnlocked: e.target.checked }))} className="w-5 h-5 accent-aurora-500" />
                                                </label>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
                                            <button type="button" onClick={() => handleSaveActivityConfig()} className="rjc2-pill-btn touch-target py-3.5 rounded-full font-display font-extrabold text-xs sm:text-sm">
                                                บันทึกหัวข้อและกำหนดเวลาขึ้น Cloud
                                            </button>
                                            <button type="button" disabled={syncingBatch} onClick={handleBatchSyncUnlockToLearners} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-accent-adaptive border-aurora-400/45">
                                                {syncingBatch ? 'กำลังซิงค์ให้ทุกคน...' : `ซิงค์กำหนดเวลาให้ผู้สมัครทุกคน (${activeRegistrantsBase.length} ราย)`}
                                            </button>
                                        </div>
                                    </div>

                                    {/* QR & ลิงก์สำหรับแนบในหนังสือเชิญประชุมราชการ */}
                                    <div className="lg:col-span-4 spatial-card rounded-[1.75rem] p-5 space-y-4 text-center">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">INVITATION LETTER QR CODE</span>
                                            <h3 className="font-display font-bold text-sm text-primary-adaptive mt-0.5">QR รับสมัครล่วงหน้า (แนบหนังสือเชิญประชุม)</h3>
                                        </div>
                                        <div className="flex justify-center">
                                            <QrCodeBox url={shareRegistrationUrl} size={168} />
                                        </div>
                                        <p className="text-[11px] font-mono text-muted-adaptive break-all spatial-soft p-2.5 rounded-xl">{shareRegistrationUrl}</p>
                                        <button
                                            type="button"
                                            onClick={() => { copyTextSafe(shareRegistrationUrl); showToast('คัดลอกลิงก์รับสมัครสำหรับแนบหนังสือเชิญประชุมแล้วค่ะ'); }}
                                            className="spatial-soft touch-target w-full py-2.5 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center justify-center gap-1.5"
                                        >
                                            <Icon name="Copy" size={14} /> คัดลอกลิงก์หน้ารับสมัคร
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* ==================== ORG TAB 3: REGISTRANT LIST & NO-SHOW REVOKE ==================== */}
                            {organizerTab === 'list' && (
                                <section className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <h2 className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive">
                                                ตรวจสอบรายชื่อผู้สมัคร &amp; จัดการสิทธิ์กรณีไม่มางานจริง (No-show)
                                            </h2>
                                            <p className="text-xs text-muted-adaptive">หากตรวจใบเซ็นชื่อกระดาษหน้างานแล้วพบว่าผู้สมัครรายใดไม่ได้มาอบรมจริง สามารถกด “ยกเลิกสิทธิ์เทียบโอน” ได้ทันที</p>
                                        </div>
                                        <label className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold inline-flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={includeRevoked} onChange={e => setIncludeRevoked(e.target.checked)} className="accent-aurora-500" />
                                            <span>แสดงรายชื่อที่ยกเลิกสิทธิ์แล้ว</span>
                                        </label>
                                    </div>

                                    <div className="overflow-x-auto custom-scrollbar">
                                        <table className="w-full text-left border-collapse text-xs">
                                            <thead>
                                                <tr className="border-b border-white/15 font-mono text-[10px] uppercase text-muted-adaptive">
                                                    <th className="py-2.5 px-3">ชื่อ – นามสกุล / เลขใบอนุญาต</th>
                                                    <th className="py-2.5 px-3">กลุ่มวิชาชีพ</th>
                                                    <th className="py-2.5 px-3">โรงพยาบาล / จังหวัด / เขตสุขภาพ</th>
                                                    <th className="py-2.5 px-3">สถานะใน rjcloud.organ 2.0</th>
                                                    <th className="py-2.5 px-3 text-right">จัดการสิทธิ์</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/10">
                                                {filteredSortedRegistrants.map(r => (
                                                    <tr key={r.id || r.license} className={r.revoked ? 'opacity-55' : ''}>
                                                        <td className="py-3 px-3">
                                                            <p className="font-bold text-primary-adaptive">{r.name}</p>
                                                            <p className="font-mono text-[11px] text-prism-adaptive">{r.license}</p>
                                                        </td>
                                                        <td className="py-3 px-3 font-bold text-secondary-adaptive">{r.professionGroup}</td>
                                                        <td className="py-3 px-3">
                                                            <p className="font-semibold text-primary-adaptive">{r.hospital}</p>
                                                            <p className="text-[11px] text-muted-adaptive">จ.{r.province} • {r.region}</p>
                                                        </td>
                                                        <td className="py-3 px-3">
                                                            <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${
                                                                r.revoked
                                                                    ? 'bg-rose-500/20 text-rose-300'
                                                                    : 'bg-aurora-500/20 text-accent-adaptive'
                                                            }`}>
                                                                {r.revoked ? 'ยกเลิกสิทธิ์เทียบโอน' : 'ชั่วโมงครบ (เทียบโอน)'}
                                                            </span>
                                                        </td>
                                                        <td className="py-3 px-3 text-right">
                                                            <button
                                                                type="button"
                                                                onClick={() => handleToggleRevoke(r)}
                                                                className={`px-3 py-1.5 rounded-xl font-bold text-[11px] ${
                                                                    r.revoked
                                                                        ? 'bg-aurora-500/20 text-accent-adaptive'
                                                                        : 'bg-rose-500/15 border border-rose-400/35 text-rose-300 hover:bg-rose-500/25'
                                                                }`}
                                                            >
                                                                {r.revoked ? 'คืนสิทธิ์เทียบโอน' : 'ยกเลิกสิทธิ์ (ไม่มางาน)'}
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            )}
                        </main>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('onsite-root'));
        root.render(<OnsiteErrorBoundary><OnsiteApp /></OnsiteErrorBoundary>);
    </script>
</body>
</html>
