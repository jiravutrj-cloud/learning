    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        function parsePosttestScorePct(posttestStr) {
            const s = String(posttestStr || '');
            const m = s.match(/(\d+)\s*\/\s*(\d+)/);
            if (!m) return 0;
            const total = Number(m[2]) || 40;
            return Math.round((Number(m[1]) / total) * 100);
        }

        function parsePosttestPassed(u) {
            if (!u) return false;
            if (u.status === 'ผ่าน') return true;
            return parsePosttestScorePct(u.posttest) >= MIN_POSTTEST_PERCENT;
        }

        function isHoursExemptUser(u) {
            if (!u) return false;

         */
        function resolveLearnerStatusInfo(u) {
            if (!u) {
                return { statusLabel: 'ลงทะเบียนแล้ว', hoursLabel: 'กำลังสะสมชั่วโมง', activityName: '', activityMeta: '', isExempt: false, isStudyEnough: false };
            }
            const exempt = isHoursExemptUser(u);
            const studyEnough = exempt || Number(u.progress || 0) >= MIN_STUDY_PERCENT;
            const labDone = Boolean(u.skillLabPassed || (Array.isArray(u.skillLabHistory) && u.skillLabHistory.length > 0));
            const bestLab = Number(u.skillLabBestScore || 0);
            const passed = parsePosttestPassed(u) || Boolean(u.certificateCode);
            const hasPre = Boolean(u.pretest && u.pretest !== '-');

            const activityName = exempt
                ? (u.hoursActivityName || 'ผู้เรียนต่อเนื่อง / ผ่านการอบรมมาตรฐานมาก่อนแล้ว')
                : (studyEnough ? (u.hoursActivityName || DEFAULT_ONLINE_COURSE_NAME) : '');
            const activityMeta = [u.hoursActivityDate, u.hoursActivityVenue].filter(Boolean).join(' • ');

            const hoursLabel = exempt
                ? 'ชั่วโมงครบ (เทียบโอน)'
                : (studyEnough ? 'ชั่วโมงครบ' : `กำลังสะสมชั่วโมง (${Math.round(Number(u.progress || 0))}%)`);

            let statusLabel = 'ลงทะเบียนแล้ว';
            if (passed && bestLab >= 85) statusLabel = 'ผู้เชี่ยวชาญคลินิก';
            else if (passed) statusLabel = 'สำเร็จหลักสูตร';
            else if (labDone) statusLabel = 'ผ่าน AI Skill Lab 3D';
            else if (exempt) statusLabel = 'ชั่วโมงครบ (เทียบโอน)';
            else if (studyEnough) statusLabel = 'ชั่วโมงครบ';
            else if (hasPre || Number(u.progress || 0) > 0) statusLabel = 'กำลังสะสมชั่วโมง';

            return { statusLabel, hoursLabel, activityName, activityMeta, isExempt: exempt, isStudyEnough: studyEnough };
        }

        function getUserFiveStepStatus(u) {
            const step1Pre = Boolean(u?.pretest && u.pretest !== '-');
            const step2Hours = isHoursExemptUser(u) || Number(u?.progress || 0) >= MIN_STUDY_PERCENT;
            const step3Lab = Boolean(u?.skillLabPassed || (Array.isArray(u?.skillLabHistory) && u.skillLabHistory.length > 0));
            const step4Post = parsePosttestPassed(u);
            const step5Cert = Boolean(u?.certificateClaimed || u?.certificateCode);
            const hist = Array.isArray(u?.skillLabHistory) ? u.skillLabHistory : [];
            const bestLab = typeof u?.skillLabBestScore === 'number'
                ? u.skillLabBestScore
                : (hist.length > 0 ? Math.max(...hist.map(h => h.score || 0)) : null);
            return { step1Pre, step2Hours, step3Lab, step4Post, step5Cert, bestLab };
        }

        function formatThaiDateTimeFull(isoStr) {
            if (!isoStr) return '-';
            try {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return '-';
                return `${d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' })} เวลา ${d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.`;
            } catch (_) { return '-'; }
        }

        function formatThaiDateOnly(isoStr) {
            try {
                const d = isoStr ? new Date(isoStr) : new Date();
                return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
            } catch (_) { return '-'; }
        }

        function isoToLocalInputValue(isoStr) {
            if (!isoStr) return buildDefaultOnsiteUnlockLocal();
            try {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return buildDefaultOnsiteUnlockLocal();
                const pad = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            } catch (_) { return buildDefaultOnsiteUnlockLocal(); }
        }

        function parseRawExams(raw) {
            if (typeof CORE.parseRawExams === 'function') return CORE.parseRawExams(raw);
            return (Array.isArray(raw) ? raw : []).map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    domain: 'policy_ethics',
                    question: (parts[0] || '').replace(/^[0-9]+\.\s*/, ''),
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(window.QUIZ_QUESTIONS_RAW || [])];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets).sort((a, b) => Number(a) - Number(b)).map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [parseRawExams(window.QUIZ_QUESTIONS_RAW || [])];
        }

        function resolveRegionId(department = '') {
            if (typeof CORE.resolveRegionId === 'function') return CORE.resolveRegionId(department);
            const d = String(department || '').trim();
            if (d.startsWith('เขตสุขภาพที่')) {
                const num = d.replace(/[^0-9]/g, '');
                if (num && Number(num) >= 1 && Number(num) <= 12) return `R${num}`;
            }
            if (['กรมการแพทย์', 'สำนักการแพทย์ กรุงเทพฯ', 'สำนักอนามัย กรุงเทพฯ', 'กรุงเทพมหานคร'].some(k => d.includes(k))) return 'BKK';
            return 'OTHER';
        }

        function escapeCsvCell(val) {
            const s = val === null || val === undefined ? '' : String(val);
            return `"${s.replace(/"/g, '""')}"`;
        }

        function triggerCsvDownload(filename, headers, rows) {
            const csv = '\ufeff' + [headers.map(escapeCsvCell).join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3300);
            }, []);

            const askConfirm = useCallback((opts) => {
                setConfirmDialog({ open: true, danger: false, confirmText: 'ยืนยัน', ...opts });
            }, []);

            useEffect(() => {
                const el = document.getElementById('admin-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Check Existing Firebase Admin Session
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth) return;
                const unsub = onAuthStateChanged(fbAuth, (fbUser) => {
                    if (fbUser && fbUser.email) {
                        const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => x.toLowerCase());
                        if (allowed.includes(fbUser.email.toLowerCase())) {
                            setAdminSession({ email: fbUser.email, isDemo: false });
                        }
                    }
                });
                return () => unsub();
            }, []);

            // Live Firestore Subscriptions (Active only after Admin Authentication)
            useEffect(() => {
                if (!adminSession || adminSession.isDemo || !fbDb) return;

                const unsubUsers = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        setUsersList(arr);
                    },
                    (err) => console.warn('Users snapshot error:', err)
                );

                const unsubOnsite = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        setOnsiteRegistrants(arr);
                    },
                    (err) => console.warn('Onsite snapshot warning:', err)
                );

                const unsubSettings = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                    (snap) => {
                        if (!snap.exists()) return;
                        const data = snap.data();
                        if (data.liveConfig) setLiveConfig(p => ({ ...p, ...data.liveConfig }));
                        if (data.certTemplate) setCertTemplate(p => ({ ...p, ...data.certTemplate }));
                        if (data.cneuConfig) setCneuConfig(p => ({ ...p, ...data.cneuConfig }));
                        if (data.onsiteConfig) {
                            const merged = {
                                ...DEFAULT_ONSITE_CONFIG,
                                ...data.onsiteConfig,
                                unlockAtLocal: isoToLocalInputValue(data.onsiteConfig.unlockAt)
                            };
                            setOnsiteConfig(merged);
                            setOnsiteDraft(merged);
                        }
                        setSystemConfig(p => ({
                            ...p,
                            appsScriptUrl: data.appsScriptUrl ?? p.appsScriptUrl,
                            masterCsvUrl: data.masterCsvUrl ?? p.masterCsvUrl,
                            autoSyncFromSheet: data.autoSyncFromSheet ?? p.autoSyncFromSheet
                        }));
                    },
                    (err) => console.warn('Settings snapshot error:', err)
                );

                const unsubContent = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                    (snap) => {
                        if (!snap.exists()) return;
                        const data = snap.data();
                        setContentConfig(p => ({
                            lessons: Array.isArray(data.lessons) && data.lessons.length > 0 ? data.lessons : p.lessons,
                            questionSets: data.questionSets ? normalizeQuestionSets(data.questionSets) : p.questionSets
                        }));
                    },
                    (err) => console.warn('Content snapshot error:', err)
                );

                return () => {
                    unsubUsers();
                    unsubOnsite();
                    unsubSettings();
                    unsubContent();
                };
            }, [adminSession]);

            // Redraw Certificate Preview Canvas
            useEffect(() => {
                if (activeTab !== 'cert' || certSubTab !== 'designer' || !certPreviewCanvasRef.current) return;
                const sampleUser = {
                    name: 'พว.กัญญารัตน์ วัฒนากูล',
                    nameEN: 'Kanyarat Wattanakul, RN',
                    hospital: 'โรงพยาบาลราชวิถี',
                    license: '4511128901',
                    certificateCode: `${certTemplate.certPrefix || 'RJC-2027'}-DEMO01`,
                    certificateIssuedAt: new Date().toISOString()
                };
                const mergedTpl = { ...certTemplate, cneuActivityCode: cneuConfig.activityCode, cneuCredits: cneuConfig.cneuCredits };
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certPreviewCanvasRef.current, mergedTpl, sampleUser, `${window.location.origin}/verify.html?code=${sampleUser.certificateCode}`);
                } else {
                    const canvas = certPreviewCanvasRef.current;
                    canvas.width = 1200; canvas.height = 848;
                    const ctx = canvas.getContext('2d');
                    if (ctx) {
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1200, 848);
                        ctx.strokeStyle = '#c5a059'; ctx.lineWidth = 4; ctx.strokeRect(32, 32, 1136, 784);
                        ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'center';
                        ctx.font = '700 28px Prompt, sans-serif'; ctx.fillText(mergedTpl.orgTitleTH || '', 600, 140);
                        ctx.font = '700 44px Prompt, sans-serif'; ctx.fillText('ประกาศนียบัตร', 600, 250);
                        ctx.font = '700 42px Prompt, sans-serif'; ctx.fillText(sampleUser.name, 600, 360);
                        ctx.fillStyle = '#475569'; ctx.font = '500 22px Sarabun, sans-serif'; ctx.fillText(mergedTpl.courseTitleTH || '', 600, 450);
                        ctx.fillStyle = '#047857'; ctx.font = '700 20px Prompt, sans-serif'; ctx.fillText(`รหัสกิจกรรม CNEU: ${cneuConfig.activityCode} • ${cneuConfig.cneuCredits} หน่วยคะแนน`, 600, 510);
                        ctx.fillStyle = '#1d1d1f'; ctx.font = '600 22px Prompt, sans-serif'; ctx.fillText(mergedTpl.signerName || '', 600, 690);
                    }
                }
            }, [activeTab, certSubTab, certTemplate, cneuConfig]);

            // ============================================================================
            // 5. ACTION HANDLERS (AUTH, USERS, ONSITE, CERT, CONTENT, R2R EXPORTS)
            // ============================================================================
            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if (!isCloudConfigured || !fbAuth) {
                    showToast('ไม่พบการเชื่อมต่อ Firebase กรุณาใช้ปุ่มทดลองเปิดโหมดตัวอย่างด้านล่างค่ะ', 'error');
                    return;
                }
                const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => x.toLowerCase());
                if (!allowed.includes(loginEmail.trim().toLowerCase())) {
                    showToast(`อนุญาตเฉพาะบัญชีผู้ดูแลระบบ (${CONFIG.contactEmail}) เท่านั้นค่ะ`, 'error');
                    return;
                }
                setLoginBusy(true);
                try {
                    await signInWithEmailAndPassword(fbAuth, loginEmail.trim(), loginPassword);
                    setAdminSession({ email: loginEmail.trim(), isDemo: false });
                    showToast('เข้าสู่ศูนย์ควบคุม Admin Mission Control สำเร็จค่ะ');
                } catch (_) {
                    showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบใน Firebase Auth ค่ะ', 'error');
                } finally {
                    setLoginBusy(false);
                }
            };

            const handleEnterDemoMode = () => {
                setAdminSession({ email: 'demo-preview@rjcloud.organ', isDemo: true });
                setUsersList(buildDemoUsers(onsiteConfig));
                setOnsiteRegistrants(buildDemoOnsiteRegistrants(onsiteConfig));
                showToast('เข้าสู่โหมดพรีวิวตัวอย่างครบทั้ง 7 แท็บเรียบร้อยค่ะ', 'info');
            };

            const handleAdminLogout = () => {
                if (!adminSession?.isDemo && fbAuth) signOut(fbAuth).catch(() => {});
                setAdminSession(null);
                setUsersList([]);
                setOnsiteRegistrants([]);
                showToast('ออกจากระบบผู้ดูแลแล้วค่ะ');
            };

            const persistSettings = async (patchObj) => {
                if (adminSession?.isDemo || !fbDb) {
                    showToast('บันทึกการตั้งค่า (โหมดตัวอย่าง) เรียบร้อยค่ะ');
                    return;
                }
                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), patchObj, { merge: true });
                    showToast('บันทึกการตั้งค่าขึ้น Cloud เรียบร้อยค่ะ');
                } catch (err) {
                    showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const persistContent = async (nextContent) => {
                setContentConfig(nextContent);
                if (adminSession?.isDemo || !fbDb) {
                    showToast('บันทึกบทเรียนและข้อสอบ (โหมดตัวอย่าง) เรียบร้อยค่ะ');
                    return;
                }
                try {
                    const setsMap = {};
                    (nextContent.questionSets || []).forEach((arr, idx) => { setsMap[String(idx)] = arr; });
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'), {
                        lessons: nextContent.lessons,
                        questionSets: setsMap
                    }, { merge: true });
                    showToast('บันทึกบทเรียนและคลังข้อสอบขึ้น Cloud เรียบร้อยค่ะ');
                } catch (err) {
                    showToast('บันทึกเนื้อหาไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const handleUpdateUser = async (u, changes) => {
                const uid = u.id || getUserLicense(u);
                const merged = { ...u, ...changes, license: getUserLicense(u) };
                setUsersList(prev => prev.map(x => ((x.id || getUserLicense(x)) === uid ? merged : x)));
                if (adminSession?.isDemo || !fbDb) {
                    showToast('อัปเดตข้อมูลผู้เรียนเรียบร้อยแล้วค่ะ');
                    return;
                }
                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', uid), merged, { merge: true });
                    showToast('อัปเดตข้อมูลผู้เรียนเรียบร้อยแล้วค่ะ');
                } catch (err) {
                    showToast('อัปเดตไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const handleDeleteUser = (u) => {
                const uid = u.id || getUserLicense(u);
                askConfirm({
                    title: 'ยืนยันการลบข้อมูลผู้เรียน',
                    message: `ต้องการลบข้อมูลของ "${u.name || uid}" (${uid}) ออกจากฐานข้อมูลหรือไม่?`,
                    danger: true,
                    confirmText: 'ลบผู้เรียน',
                    onConfirm: async () => {
                        setUsersList(prev => prev.filter(x => (x.id || getUserLicense(x)) !== uid));
                        if (!adminSession?.isDemo && fbDb) {
                            try { await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', uid)); } catch (_) {}
                        }
                        showToast('ลบข้อมูลผู้เรียนเรียบร้อยค่ะ');
                    }
                });
            };

            const handleAddManualUser = async (e) => {
                e.preventDefault();
                const cleanLic = manualForm.license.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (!cleanLic || !manualForm.name.trim()) {
                    showToast('กรุณากรอกชื่อ–นามสกุล และเลขที่ใบอนุญาตให้ครบถ้วนค่ะ', 'error');
                    return;
                }
                const isExempt = manualForm.userType === 'เรียนต่อเนื่อง';
                const newUser = {
                    id: cleanLic,
                    license: cleanLic,
                    name: manualForm.name.trim(),
                    email: manualForm.email.trim(),
                    phone: manualForm.phone.trim(),
                    department: manualForm.department.trim(),
                    hospital: manualForm.hospital.trim(),
                    userType: isExempt ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    studyHoursExempt: isExempt,
                    hoursStatusLabel: isExempt ? 'ชั่วโมงครบ (เทียบโอน)' : 'กำลังสะสมชั่วโมง',
                    hoursActivityName: isExempt ? (manualForm.hoursActivityName.trim() || onsiteConfig.activityTitle || 'ผู้เรียนต่อเนื่อง / ผ่านการอบรมมาตรฐานมาก่อนแล้ว') : '',
                    hoursActivityDate: isExempt ? (onsiteConfig.eventDate || '') : '',
                    hoursActivityVenue: isExempt ? (onsiteConfig.venueAndOrganizer || '') : '',
                    status: 'กำลังเรียน',
                    progress: isExempt ? 100 : 0,
                    studySeconds: 0,
                    pretest: '-',
                    posttest: '-',
                    skillLabPassed: false,
                    skillLabHistory: [],
                    lastVideoId: 1
                };
                setUsersList(prev => [newUser, ...prev.filter(x => (x.id || getUserLicense(x)) !== cleanLic)]);
                if (!adminSession?.isDemo && fbDb) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic), newUser, { merge: true });
                    } catch (err) {
                        showToast('เพิ่มผู้เรียนไม่สำเร็จ: ' + err.message, 'error');
                        return;
                    }
                }
                showToast('เพิ่มผู้เรียนใหม่เข้าฐานข้อมูลเรียบร้อยแล้วค่ะ');
                setManualForm({ name: '', license: '', userType: 'เรียนใหม่', hospital: 'รพ.ราชวิถี', department: 'กรมการแพทย์', email: '', phone: '', hoursActivityName: '' });
                setShowAddUser(false);
            };

            const handleOpenTransferModal = (u) => {
                setTransferModal({
                    open: true,
                    user: u,
                    studyHoursExempt: true,
                    hoursActivityName: u.hoursActivityName || onsiteConfig.activityTitle || 'ผู้เรียนต่อเนื่อง / ผ่านการอบรมมาตรฐานมาก่อนแล้ว',
                    hoursActivityDate: u.hoursActivityDate || onsiteConfig.eventDate || '',
                    hoursActivityVenue: u.hoursActivityVenue || onsiteConfig.venueAndOrganizer || ''
                });
            };

            const handleSaveTransferModal = async (e) => {
                e.preventDefault();
                const target = transferModal.user;
                if (!target) return;
                const exempt = Boolean(transferModal.studyHoursExempt);
                await handleUpdateUser(target, {
                    userType: exempt ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    studyHoursExempt: exempt,
                    progress: exempt ? 100 : Number(target.progress || 0),
                    hoursStatusLabel: exempt ? 'ชั่วโมงครบ (เทียบโอน)' : (Number(target.progress || 0) >= MIN_STUDY_PERCENT ? 'ชั่วโมงครบ' : 'กำลังสะสมชั่วโมง'),
                    hoursActivityName: exempt ? (transferModal.hoursActivityName.trim() || 'ผู้เรียนต่อเนื่อง / ผ่านการอบรมมาตรฐานมาก่อนแล้ว') : '',
                    hoursActivityDate: exempt ? transferModal.hoursActivityDate.trim() : '',
                    hoursActivityVenue: exempt ? transferModal.hoursActivityVenue.trim() : ''
                });
                setTransferModal(p => ({ ...p, open: false, user: null }));
            };

            const handleSaveOnsiteConfig = async () => {
                const dt = new Date(onsiteDraft.unlockAtLocal || buildDefaultOnsiteUnlockLocal());
                const unlockIso = isNaN(dt.getTime()) ? new Date().toISOString() : dt.toISOString();
                const nextCfg = { ...onsiteDraft, unlockAt: unlockIso, forceUnlocked: Boolean(onsiteDraft.forceUnlocked) };
                setOnsiteConfig(nextCfg);
                setOnsiteDraft(nextCfg);
                await persistSettings({ onsiteConfig: nextCfg });
            };

            const handleBatchSyncOnsiteToLearners = async () => {
                const activeList = onsiteRegistrants.filter(r => !r.revoked);
                if (activeList.length === 0) { showToast('ยังไม่มีผู้สมัคร Onsite ที่พร้อมซิงค์ค่ะ', 'info'); return; }
                if (adminSession?.isDemo || !fbDb) {
                    showToast(`จำลองซิงค์กำหนดเวลาและสิทธิ์เทียบโอนครบ ${activeList.length} รายเรียบร้อยค่ะ`);
                    return;
                }
                setOnsiteSyncing(true);
                let okCount = 0;
                try {
                    for (const r of activeList) {
                        const lic = String(r.license || r.id || '').trim();
                        if (!lic) continue;
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', lic), {
                            id: lic, license: lic, name: r.name, email: r.email || '', phone: r.phone || '',
                            position: r.position || r.professionGroup || 'บุคลากรทางการแพทย์',
                            professionGroup: r.professionGroup || 'พยาบาล',
                            department: r.region || 'กรมการแพทย์', hospital: r.hospital || '', province: r.province || '',
                            userType: 'เรียนต่อเนื่อง', studyHoursExempt: true, progress: 100,
                            hoursStatusLabel: 'ชั่วโมงครบ (เทียบโอน)',
                            hoursActivityName: onsiteConfig.activityTitle,
                            hoursActivityDate: onsiteConfig.eventDate,
                            hoursActivityVenue: onsiteConfig.venueAndOrganizer,
                            onsiteEventId: onsiteConfig.eventId,
                            onsiteUnlockAt: onsiteConfig.unlockAt,
                            onsiteForceUnlocked: Boolean(onsiteConfig.forceUnlocked)
                        }, { merge: true });
                        okCount += 1;
                    }
                    showToast(`ซิงค์กำหนดเวลาและสิทธิ์เทียบโอนเข้า rjcloud.organ 2.0 ครบ ${okCount} รายเรียบร้อยค่ะ`);
                } catch (err) {
                    showToast('ซิงค์ไม่สำเร็จบางรายการ: ' + err.message, 'error');
                } finally {
                    setOnsiteSyncing(false);
                }
            };

            const handleToggleOnsiteRevoke = (reg) => {
                const nextRevoked = !reg.revoked;
                askConfirm({
                    title: nextRevoked ? 'ยกเลิกสิทธิ์เทียบโอน (ไม่มาเซ็นชื่อหน้างาน)' : 'คืนสิทธิ์เทียบโอน Onsite',
                    message: nextRevoked
                        ? `ต้องการยกเลิกสิทธิ์เทียบโอนของ "${reg.name}" (${reg.license}) หรือไม่? ผู้เรียนจะกลับไปสะสมชั่วโมงตามปกติ`
                        : `ต้องการคืนสิทธิ์ "ชั่วโมงครบ (เทียบโอน)" พร้อมกำหนดเวลาเปิดระบบให้ "${reg.name}" หรือไม่?`,
                    danger: nextRevoked,
                    confirmText: nextRevoked ? 'ยกเลิกสิทธิ์เทียบโอน' : 'คืนสิทธิ์เทียบโอน',
                    onConfirm: async () => {
                        const lic = String(reg.license || reg.id || '').trim();
                        setOnsiteRegistrants(prev => prev.map(x => ((x.license || x.id) === lic ? { ...x, revoked: nextRevoked } : x)));
                        if (!adminSession?.isDemo && fbDb) {
                            try {
                                await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', lic), { revoked: nextRevoked }, { merge: true });
                                await setDoc(
                                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', lic),
                                    nextRevoked
                                        ? { studyHoursExempt: false, userType: 'เรียนใหม่', hoursStatusLabel: 'กำลังสะสมชั่วโมง', progress: 0 }
                                        : {
                                            studyHoursExempt: true, userType: 'เรียนต่อเนื่อง', progress: 100,
                                            hoursStatusLabel: 'ชั่วโมงครบ (เทียบโอน)',
                                            hoursActivityName: onsiteConfig.activityTitle,
                                            hoursActivityDate: onsiteConfig.eventDate,
                                            hoursActivityVenue: onsiteConfig.venueAndOrganizer,
                                            onsiteEventId: onsiteConfig.eventId,
                                            onsiteUnlockAt: onsiteConfig.unlockAt,
                                            onsiteForceUnlocked: Boolean(onsiteConfig.forceUnlocked)
                                        },
                                    { merge: true }
                                );
                            } catch (err) { showToast('อัปเดตไม่สำเร็จ: ' + err.message, 'error'); return; }
                        }
                        showToast(nextRevoked ? 'ยกเลิกสิทธิ์เทียบโอนเรียบร้อยค่ะ' : 'คืนสิทธิ์เทียบโอนเรียบร้อยค่ะ');
                    }
                });
            };

            const handleRebuildGlobalSummary = async () => {
                if (adminSession?.isDemo || !fbDb) { showToast('จำลองรีเฟรชเอกสาร executive_summary/global สำเร็จค่ะ'); return; }
                setRebuildingSummary(true);
                try {
                    const summary = {
                        totalUsers: usersList.length, passedUsers: 0, labUsers: 0,
                        csatSum: 0, csatCount: 0, skillScoreSum: 0, skillScoreCount: 0,
                        susSum: 0, susCount: 0, preEffSum: 0, preEffCount: 0, postEffSum: 0, postEffCount: 0,
                        updatedAt: new Date().toISOString()
                    };
                    usersList.forEach(u => {
                        const rId = resolveRegionId(u.department);
                        summary[`region_${rId}`] = (summary[`region_${rId}`] || 0) + 1;
                        if (parsePosttestPassed(u)) {
                            summary.passedUsers += 1;
                            summary[`region_${rId}_passed`] = (summary[`region_${rId}_passed`] || 0) + 1;
                        }
                        const st = getUserFiveStepStatus(u);
                        if (st.step3Lab) summary.labUsers += 1;
                        if (st.bestLab !== null) { summary.skillScoreSum += st.bestLab; summary.skillScoreCount += 1; }
                        if (typeof u.satisfactionScore === 'number' && u.satisfactionScore > 0) { summary.csatSum += u.satisfactionScore; summary.csatCount += 1; }
                        if (typeof u.susScore === 'number' && u.susScore >= 0) { summary.susSum += u.susScore; summary.susCount += 1; }
                        if (typeof u.preSelfEfficacyAvg === 'number' && u.preSelfEfficacyAvg > 0) { summary.preEffSum += u.preSelfEfficacyAvg; summary.preEffCount += 1; }
                        if (typeof u.postSelfEfficacyAvg === 'number' && u.postSelfEfficacyAvg > 0) { summary.postEffSum += u.postSelfEfficacyAvg; summary.postEffCount += 1; }
                    });
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_summary', 'global'), summary);
                    showToast('คำนวณและบันทึกเอกสารสรุป 1-Read (executive_summary/global) เรียบร้อยค่ะ');
                } catch (err) {
                    showToast('สร้างเอกสารสรุปไม่สำเร็จ: ' + err.message, 'error');
                } finally {
                    setRebuildingSummary(false);
                }
            };

            // CSV Exports (Learners + R2R Blind Transcript for Expert TC Raters)
            const handleExportCSV = () => {
                const headers = [
                    'ชื่อ-สกุล', 'เลขใบประกอบวิชาชีพ', 'กลุ่มวิชาชีพ', 'อีเมล', 'เบอร์โทร',
                    'ตำแหน่ง', 'สังกัด', 'หน่วยงาน/โรงพยาบาล', 'สิทธิ์การเรียน',
                    'สถานะปัจจุบัน', 'สถานะชั่วโมงอบรม', 'กิจกรรมอ้างอิงชั่วโมง',
                    'สถานะสอบ', 'Pretest', 'Posttest', 'ความคืบหน้า (%)',
                    'Empathy Index (AI Lab)', 'ความมั่นใจก่อนฝึก (Pre 1-5)', 'ความมั่นใจหลังฝึก (Post 1-5)',
                    'SUS Score (0-100)', 'CSAT เฉลี่ย', 'รหัสประกาศนียบัตร'
                ];
                const rows = usersList.map(u => {
                    const st = getUserFiveStepStatus(u);
                    const info = resolveLearnerStatusInfo(u);
                    return [
                        u.name, getUserLicense(u), u.professionGroup || '-', u.email, u.phone,
                        u.position, u.department, u.hospital, isHoursExemptUser(u) ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                        info.statusLabel, info.hoursLabel, info.activityName || '-',
                        u.status, u.pretest, u.posttest, isHoursExemptUser(u) ? 100 : (u.progress || 0),
                        st.bestLab ?? '-',
                        typeof u.preSelfEfficacyAvg === 'number' ? u.preSelfEfficacyAvg : '-',
                        typeof u.postSelfEfficacyAvg === 'number' ? u.postSelfEfficacyAvg : '-',
                        typeof u.susScore === 'number' ? u.susScore : '-',
                        u.satisfactionScore || '-', u.certificateCode || '-'
                    ].map(escapeCsvCell).join(',');
                });
                triggerCsvDownload(`rjcloud_learners_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                showToast(`ส่งออกไฟล์ CSV ผู้เรียน ${usersList.length} รายเรียบร้อยค่ะ`);
            };

            const handleExportBlindTranscriptCsv = () => {
                const headers = [
                    'Blind_Case_ID', 'Persona', 'Difficulty', 'AI_Supervisor_Score', 'Silence_2_5s_Count',
                    'Trigger_Words', 'Vocal_Calm_Score', 'Pre_SelfEfficacy', 'Post_SelfEfficacy',
                    'Blind_Transcript_ZeroPII', 'Expert_Rater_1_Score', 'Expert_Rater_2_Score', 'Expert_Notes'
                ];
                const rows = [];
                let caseNo = 0;
                usersList.forEach(u => {
                    const hist = Array.isArray(u.skillLabHistory) ? u.skillLabHistory : [];
                    hist.forEach(h => {
                        if (!Array.isArray(h?.blindTranscript) || h.blindTranscript.length === 0) return;
                        caseNo += 1;
                        const transcriptText = h.blindTranscript.map(t => `[T${t.turn} ${t.role}]: ${t.text}`).join(' | ');
                        rows.push([
                            `CASE-${String(caseNo).padStart(3, '0')}`, h.personaId || '-', h.difficultyId || 'normal',
                            h.score ?? '-', h.silenceCount ?? 0, h.triggerTotal ?? 0, h.avgVocalCalm ?? '-',
                            h.preSelfEfficacyAvg ?? u.preSelfEfficacyAvg ?? '-', h.postSelfEfficacyAvg ?? u.postSelfEfficacyAvg ?? '-',
                            transcriptText, '', '', ''
                        ].map(escapeCsvCell).join(','));
                    });
                });
                if (rows.length === 0) { showToast('ยังไม่มีบทสนทนา AI Skill Lab สำหรับส่งออก Blind Transcript ค่ะ', 'info'); return; }
                triggerCsvDownload(`rjcloud_R2R_Blind_Transcript_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                showToast(`ส่งออก Blind Transcript (${rows.length} เคส • Zero-PII) สำหรับพยาบาล TC ประเมินเทียบ AI แล้วค่ะ`);
            };

            // ============================================================================
            // 6. COMPUTED STATS & FILTERS
            // ============================================================================
            const quickStats = useMemo(() => {
                let passed = 0, lab = 0, exempt = 0, csatSum = 0, csatN = 0, susSum = 0, susN = 0;
                let preEffSum = 0, preEffN = 0, postEffSum = 0, postEffN = 0;
                usersList.forEach(u => {
                    if (parsePosttestPassed(u)) passed += 1;
                    if (getUserFiveStepStatus(u).step3Lab) lab += 1;
                    if (isHoursExemptUser(u)) exempt += 1;
                    if (typeof u.satisfactionScore === 'number' && u.satisfactionScore > 0) { csatSum += u.satisfactionScore; csatN += 1; }
                    if (typeof u.susScore === 'number' && u.susScore >= 0) { susSum += u.susScore; susN += 1; }
                    if (typeof u.preSelfEfficacyAvg === 'number' && u.preSelfEfficacyAvg > 0) { preEffSum += u.preSelfEfficacyAvg; preEffN += 1; }
                    if (typeof u.postSelfEfficacyAvg === 'number' && u.postSelfEfficacyAvg > 0) { postEffSum += u.postSelfEfficacyAvg; postEffN += 1; }
                });
                return {
                    total: usersList.length, passed, lab, exempt,
                    avgCsat: csatN > 0 ? (csatSum / csatN).toFixed(1) : '-',
                    avgSus: susN > 0 ? Math.round(susSum / susN) : '-',
                    preEff: preEffN > 0 ? (preEffSum / preEffN).toFixed(2) : '-',
                    postEff: postEffN > 0 ? (postEffSum / postEffN).toFixed(2) : '-'
                };
            }, [usersList]);

            const visibleUsers = useMemo(() => {
                const q = searchTerm.trim().toLowerCase();
                return usersList.filter(u => {
                    const exempt = isHoursExemptUser(u);
                    const matchFilter =
                        filterType === 'ALL' ||
                        (filterType === 'เรียนใหม่' && !exempt) ||
                        (filterType === 'EXEMPT' && exempt) ||
                        (filterType === 'PASSED' && parsePosttestPassed(u));
                    if (!matchFilter) return false;
                    if (!q) return true;
                    return (
                        String(u.name || '').toLowerCase().includes(q) ||
                        String(u.hospital || '').toLowerCase().includes(q) ||
                        String(u.hoursActivityName || '').toLowerCase().includes(q) ||
                        getUserLicense(u).toLowerCase().includes(q)
                    );
                });
            }, [usersList, searchTerm, filterType]);

            const filteredOnsiteRegistrants = useMemo(() => {
                const q = onsiteSearch.trim().toLowerCase();
                return onsiteRegistrants
                    .filter(r => {
                        if (onsiteFilterProf !== 'ALL' && r.professionGroup !== onsiteFilterProf) return false;
                        if (q) {
                            const hay = `${r.name} ${r.license} ${r.hospital} ${r.province} ${r.region} ${r.professionGroup}`.toLowerCase();
                            if (!hay.includes(q)) return false;
                        }
                        return true;
                    })
                    .sort((a, b) => String(b.registeredAt || '').localeCompare(String(a.registeredAt || '')));
            }, [onsiteRegistrants, onsiteSearch, onsiteFilterProf]);

            const onsiteStats = useMemo(() => {
                const active = onsiteRegistrants.filter(r => !r.revoked);
                return {
                    total: active.length,
                    revoked: onsiteRegistrants.length - active.length,
                    doctor: active.filter(r => r.professionGroup === 'แพทย์').length,
                    nurse: active.filter(r => r.professionGroup === 'พยาบาล').length,
                    allied: active.filter(r => r.professionGroup === 'บุคลากรสหวิชาชีพ').length
                };
            }, [onsiteRegistrants]);

            const cneuPassedUsers = useMemo(() => usersList.filter(parsePosttestPassed), [usersList]);

            const inspectorGroups = useMemo(() => ([
                {
                    groupTitle: '1. หน้าแรก & ระบบลงทะเบียน (Auth Wizard 3 ขั้น + Onsite)',
                    items: [
                        { id: 'landing', title: 'หน้าแรกผู้เรียน (Landing 2.0)', desc: 'กรอบกระจก Liquid Glass, ต้นไม้มีชีวิตออร่า และเส้นทาง 5 ขั้นตอน', url: './index.html?admin_preview=landing', icon: 'Home' },
                        { id: 'onsite', title: 'รับสมัครอบรม Onsite & พิมพ์ใบเซ็นชื่อ PDF', desc: 'รับสมัครล่วงหน้า, หัวข้อกิจกรรมมาตรฐาน และตัวคัดกรอง PDF ใบเซ็นชื่อหน้างาน', url: './onsite.html?admin_preview=1', icon: 'ClipboardList' },
                        { id: 'auth1', title: 'ลงทะเบียน ขั้นที่ 1/3', desc: 'หน้ากรอกและตรวจสอบเลขที่ใบประกอบวิชาชีพ', url: './index.html?admin_preview=auth1', icon: 'UserCheck' },
                        { id: 'auth2', title: 'ลงทะเบียน ขั้นที่ 2/3', desc: 'หน้ายืนยันข้อมูลผู้เรียนและเลือกกลุ่มการเรียน', url: './index.html?admin_preview=auth2', icon: 'FileText' },
                        { id: 'auth3', title: 'ลงทะเบียน ขั้นที่ 3/3 (OTP)', desc: 'หน้ากรอกรหัสยืนยันตัวตน OTP 6 หลัก', url: './index.html?admin_preview=auth3', icon: 'ShieldCheck' }
                    ]
                },
                {
                    groupTitle: '2. ห้องเรียนผู้เรียน, AI Skill Lab 3 มิติ และใบประกาศนียบัตร',
                    items: [
                        { id: 'pretest', title: 'แบบทดสอบก่อนเรียน (Pre-test)', desc: 'วัดพื้นฐาน 4 หมวดคลินิก + AI Roadmap', url: './index.html?admin_preview=pretest', icon: 'ClipboardCheck' },
                        { id: 'dashboard', title: 'ห้องเรียน 20 บท + AI Study Companion', desc: 'วิดีโอ, สรุปเสียง AI สตูดิโอ และ Fast-Track เทียบโอน', url: './index.html?admin_preview=dashboard', icon: 'MonitorPlay' },
                        { id: 'live', title: 'ห้องถ่ายทอดสด (Live Stream)', desc: 'หน้ารับชมบรรยายสดและดาวน์โหลดเอกสาร', url: './index.html?admin_preview=live', icon: 'Radio' },
                        { id: 'profile', title: 'โปรไฟล์ผู้เรียน & PDPA Self-Service', desc: 'สถานะภาษาไทย, กิจกรรมอ้างอิง, Phrasebook & แก้ไข/ลบข้อมูลเอง', url: './index.html?admin_preview=profile', icon: 'User' },
                        { id: 'skilllab', title: 'ห้องฝึกสื่อสาร 3 มิติ AI Skill Lab', desc: 'Hologram 3 มิติ 6 สไตล์, 6 เคสคลินิก + เสียง AI สตูดิโอ', url: './aiskilllab.html?admin_preview=1', icon: 'Bot' },
                        { id: 'posttest', title: 'แบบทดสอบหลังเรียน (Post-test ≥ 80%)', desc: 'วัดผลหลังเรียนพร้อมวิเคราะห์จุดอ่อน', url: './index.html?admin_preview=posttest', icon: 'FileCheck2' },
                        { id: 'cert_confirm', title: 'ประเมินผล CNEU & SUS Score (R2R)', desc: 'ยืนยันชื่อและทำแบบประเมินความพึงพอใจ + SUS', url: './index.html?admin_preview=cert_confirm', icon: 'Star' },
                        { id: 'certificate', title: 'ประกาศนียบัตรดิจิทัล & หนังสือรับรอง CNEU', desc: 'Canvas PDF/PNG + หนังสือรับรองสิทธิ์เท่าเทียมทุกประเภท', url: './index.html?admin_preview=certificate', icon: 'Award' }
                    ]
                },
                {
                    groupTitle: '3. ระบบตรวจสอบสาธารณะ & Dashboard ผู้บริหาร',
                    items: [
                        { id: 'verify', title: 'หน้าตรวจสอบใบประกาศฯ QR 3 มิติ', desc: 'ตรวจรหัสประกาศนียบัตรจากทะเบียนสาธารณะ certificates', url: './verify.html?code=RJC-2027-DEMO01', icon: 'QrCode' },
                        { id: 'executive', title: 'Dashboard 13 เขตสุขภาพ (Zero-PII)', desc: 'สถิติภาพรวม 13 เขต, Eco 1-Read, SUS & Self-Efficacy', url: './executive.html?admin_preview=1', icon: 'BarChart3' }
                    ]
                }
            ]), []);

            const navItems = [
                { id: 'users', label: 'ผู้เรียน', fullLabel: 'ผู้เรียน 5 ขั้นตอน', icon: 'Users' },
                { id: 'onsite', label: 'Onsite', fullLabel: 'รุ่นอบรม Onsite', icon: 'ClipboardList' },
                { id: 'cert', label: 'ประกาศฯ', fullLabel: 'ประกาศฯ & CNEU', icon: 'Award' },
                { id: 'live', label: 'Live สด', fullLabel: 'ควบคุม Live สด', icon: 'Radio' },
                { id: 'content', label: 'บทเรียน', fullLabel: 'บทเรียน & ข้อสอบ', icon: 'BookOpen' },
                { id: 'sync', label: 'Cloud', fullLabel: 'Cloud & Summary', icon: 'Database' },
                { id: 'overview', label: 'ตรวจหน้า', fullLabel: 'ตรวจครบ 15 หน้า', icon: 'Eye' }
            ];

            // ============================================================================
            // 7. LOGIN GATE (PDPA PROTECTION)
            // ============================================================================
            if (!adminSession) {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <div className="spatial-card relative z-10 max-w-md w-full rounded-[2rem] p-6 sm:p-8 space-y-5">
                            <div className="flex items-center justify-between">
                                <a href="./index.html" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1">
                                    <Icon name="ArrowLeft" size={14} /> หน้าแรก
                                </a>
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                            </div>
                            <div className="text-center space-y-2">
                                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center mx-auto">
                                    <Icon name="ShieldCheck" size={24} />
                                </div>
                                <h1 className="font-display font-extrabold text-xl text-primary-adaptive">Admin Mission Control</h1>
                                <p className="text-xs text-secondary-adaptive">rjcloud.organ 2.0 • จัดการผู้เรียน รุ่นอบรม Onsite ประกาศนียบัตร และข้อมูลวิจัย R2R</p>
                            </div>
                            <form onSubmit={handleAdminLogin} className="space-y-3.5">
                                <FieldInput label="อีเมลผู้ดูแลระบบ (Firebase Auth)" type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} />
                                <FieldInput label="รหัสผ่าน" type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="รหัสผ่านผู้ดูแลระบบ" />
                                <button type="submit" disabled={loginBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                    {loginBusy ? 'กำลังยืนยันตัวตน...' : 'เข้าสู่ระบบหลังบ้าน (ข้อมูลจริง Cloud)'}
                                </button>
                            </form>
                            <div className="pt-3 border-t border-white/10 text-center">
                                <button type="button" onClick={handleEnterDemoMode} className="spatial-soft touch-target w-full py-2.5 rounded-2xl text-xs font-bold text-prism-adaptive">
                                    ทดลองเปิดศูนย์ควบคุมด้วยข้อมูลตัวอย่าง (Preview Mode)
                                </button>
                            </div>
                        </div>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // ============================================================================
            // 8. MAIN ADMIN MISSION CONTROL WORKSPACE
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-dock-safe lg:pb-10">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* Top Navigation Bar */}
                    <header className="no-print sticky top-0 z-30 spatial-header">
                        <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center font-display font-extrabold text-xs shrink-0">AD</div>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">ADMIN</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        {adminSession.isDemo ? 'DEMO PREVIEW MODE' : adminSession.email}
                                    </span>
                                </div>
                            </div>

                            <div className="hidden lg:flex items-center gap-1">
                                {navItems.map(item => (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => setActiveTab(item.id)}
                                        className={`px-3 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 transition-all ${
                                            activeTab === item.id
                                                ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                : 'text-secondary-adaptive hover:bg-white/10'
                                        }`}
                                    >
                                        <Icon name={item.icon} size={14} /> {item.label}
                                    </button>
                                ))}
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                <button type="button" onClick={handleAdminLogout} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-rose-400 hover:bg-rose-600 hover:text-white inline-flex items-center gap-1">
                                    <Icon name="LogOut" size={14} /> <span className="hidden sm:inline">ออก</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="relative z-10 max-w-7xl w-full mx-auto px-3.5 sm:px-6 pt-5 space-y-5">

                        {/* ==================== TAB 1: USERS 5-STEP TELEMETRY & FAST-TRACK ==================== */}
                        {activeTab === 'users' && (
                            <div className="space-y-5">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">5-STEP TELEMETRY • FAST-TRACK &amp; R2R EXPORTS</span>
                                        <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">จัดการผู้เรียน สิทธิ์เทียบโอนชั่วโมง และข้อมูลวิจัย R2R</h2>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => setShowAddUser(v => !v)} className="rjc2-pill-btn touch-target px-4 py-2 rounded-full font-display font-extrabold text-xs inline-flex items-center gap-1.5">
                                            <Icon name="UserPlus" size={15} /> เพิ่มผู้เรียน
                                        </button>
                                        <button type="button" onClick={handleExportCSV} className="spatial-soft touch-target px-3.5 py-2 rounded-full text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5">
                                            <Icon name="FileSpreadsheet" size={15} className="text-accent-adaptive" /> ส่งออก CSV ผู้เรียน
                                        </button>
                                        <button type="button" onClick={handleExportBlindTranscriptCsv} className="spatial-soft touch-target px-3.5 py-2 rounded-full text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5">
                                            <Icon name="Microscope" size={15} /> Blind Transcript (R2R)
                                        </button>
                                    </div>
                                </div>

                                {/* KPI Summary Cards */}
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 text-center text-xs">
                                    <div className="spatial-card rounded-2xl p-3.5"><span className="text-muted-adaptive block">ผู้เรียนทั้งหมด</span><span className="font-mono text-2xl font-extrabold text-primary-adaptive">{quickStats.total}</span></div>
                                    <div className="spatial-card rounded-2xl p-3.5"><span className="text-muted-adaptive block">เทียบโอน 100%</span><span className="font-mono text-2xl font-extrabold text-prism-adaptive">{quickStats.exempt}</span></div>
                                    <div className="spatial-card rounded-2xl p-3.5"><span className="text-muted-adaptive block">ผ่าน AI Lab 3D</span><span className="font-mono text-2xl font-extrabold text-violet-400">{quickStats.lab}</span></div>
                                    <div className="spatial-card rounded-2xl p-3.5"><span className="text-muted-adaptive block">สำเร็จหลักสูตร</span><span className="font-mono text-2xl font-extrabold text-accent-adaptive">{quickStats.passed}</span></div>
                                    <div className="spatial-card rounded-2xl p-3.5"><span className="text-muted-adaptive block">SUS / CSAT</span><span className="font-mono text-lg font-extrabold text-amber-400">{quickStats.avgSus} / {quickStats.avgCsat}</span></div>
                                    <div className="spatial-card rounded-2xl p-3.5"><span className="text-muted-adaptive block">ความมั่นใจ Pre→Post</span><span className="font-mono text-lg font-extrabold text-accent-adaptive">{quickStats.preEff}→{quickStats.postEff}</span></div>
                                </div>

                                {/* Add Manual User Form */}
                                {showAddUser && (
                                    <form onSubmit={handleAddManualUser} className="spatial-card rounded-[1.75rem] p-5 space-y-3 border-aurora-400/40">
                                        <h3 className="font-display font-bold text-sm text-accent-adaptive">เพิ่มผู้เรียนรายบุคคล</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            <FieldInput label="คำนำหน้า ชื่อ–นามสกุล *" required value={manualForm.name} onChange={e => setManualForm(p => ({ ...p, name: e.target.value }))} />
                                            <FieldInput label="เลขที่ใบอนุญาตประกอบวิชาชีพ *" required value={manualForm.license} onChange={e => setManualForm(p => ({ ...p, license: e.target.value }))} />
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">สิทธิ์การเรียน</label>

                                        <button type="button" onClick={() => setCertSubTab('designer')} className={`px-4 py-2 rounded-xl text-xs font-bold ${certSubTab === 'designer' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>ออกแบบประกาศนียบัตร</button>
                                        <button type="button" onClick={() => setCertSubTab('cneu')} className={`px-4 py-2 rounded-xl text-xs font-bold ${certSubTab === 'cneu' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>รายงาน CNEU สภาการพยาบาล (PDF)</button>
                                    </div>
                                    {certSubTab === 'cneu' && (
                                        <button type="button" onClick={() => window.print()} className="rjc2-pill-btn px-5 py-2.5 rounded-full font-display font-extrabold text-xs inline-flex items-center gap-1.5">
                                            <Icon name="Printer" size={15} /> พิมพ์ / Export PDF รายงาน CNEU ({cneuPassedUsers.length} ราย)
                                        </button>
