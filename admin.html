      .aura-canvas {

        position: fixed;
        inset: 0;
        z-index: 0;

        let fbApp = null, fbAuth = null, fbDb = null;

        // ============================================================================
        // 2. HELPERS & CSV UTILITIES
        // ============================================================================
        function Icon({ name, size = 20, className = "", strokeWidth = 2 }) {
            const Comp = LucideIcons[name] || LucideIcons.Activity;
            return <Comp size={size} className={className} strokeWidth={strokeWidth} />;
        }

        function parseRawExams(raw) {
            if (!raw || !Array.isArray(raw)) return [];
            return raw.map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    question: parts[0] ? parts[0].replace(/^[0-9]+\.\s*/, '') : '',
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        /**
         * แปลงค่า CSV หนึ่งช่องตามมาตรฐาน RFC-4180 (แก้บั๊กคอลัมน์เลื่อนเมื่อชื่อมีเครื่องหมายจุลภาค)
         */
        function escapeCsvCell(val) {
            const str = val === null || val === undefined ? '' : String(val);
            return `"${str.replace(/"/g, '""')}"`;
        }

        /**
         * อ่านเลขใบประกอบวิชาชีพมาตรฐานเดียว (รองรับทั้งข้อมูลใหม่ license และข้อมูลเก่า licenseId/id)
         */
        function getUserLicense(u) {
            return String(u?.license || u?.licenseId || u?.id || '').trim();
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(window.QUIZ_QUESTIONS_RAW || [])];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [[]];
        }

        /**
         * วาดตัวอย่างใบประกาศนียบัตรแบบย่อบน Canvas ในหน้า Admin ทันทีที่แก้ข้อความ
         */
        function drawMiniCertPreview(canvas, tpl) {
            if (!canvas) return;
            const W = 1200, H = 848;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#ffffff');
            bg.addColorStop(0.6, '#f8fafc');
            bg.addColorStop(1, '#ecfdf5');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // Aura glow
            const glow1 = ctx.createRadialGradient(140, 120, 10, 140, 120, 360);
            glow1.addColorStop(0, 'rgba(16, 185, 129, 0.16)');
            glow1.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = glow1;
            ctx.fillRect(0, 0, W, H);

            const glow2 = ctx.createRadialGradient(W - 140, H - 120, 10, W - 140, H - 120, 380);
            glow2.addColorStop(0, 'rgba(14, 165, 233, 0.14)');
            glow2.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = glow2;
            ctx.fillRect(0, 0, W, H);

            // Borders
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 5;
            ctx.strokeRect(36, 36, W - 72, H - 72);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(48, 48, W - 96, H - 96);

            // Top Ribbon
            ctx.fillStyle = '#059669';
            ctx.fillRect(W / 2 - 140, 36, 280, 10);

            // Texts
            ctx.textAlign = 'center';
            ctx.fillStyle = '#047857';
            ctx.font = '700 22px "Prompt", sans-serif';
            ctx.fillText(tpl.orgTitleTH || '', W / 2, 130);

            ctx.fillStyle = '#64748b';
            ctx.font = '600 15px "JetBrains Mono", monospace';
            ctx.fillText(tpl.orgTitleEN || '', W / 2, 162);

            ctx.fillStyle = '#0f172a';
            ctx.font = '800 44px "Prompt", sans-serif';
            ctx.fillText('ประกาศนียบัตร', W / 2, 245);

            ctx.fillStyle = '#475569';
            ctx.font = '500 20px "Sarabun", sans-serif';
            ctx.fillText(tpl.subtitleTH || '', W / 2, 295);

            ctx.fillStyle = '#064e3b';
            ctx.font = '800 46px "Prompt", sans-serif';
            ctx.fillText('พว.ใจดี มีเมตตา (ชื่อผู้เรียน)', W / 2, 375);

            ctx.fillStyle = '#64748b';
            ctx.font = '600 18px "Sarabun", sans-serif';
            ctx.fillText('โรงพยาบาลราชวิถี • เลขใบอนุญาต 65012345', W / 2, 415);

            ctx.fillStyle = '#334155';
            ctx.font = '500 20px "Sarabun", sans-serif';
            ctx.fillText(tpl.completionTextTH || '', W / 2, 475);

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 24px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleTH || '', W / 2, 525);

            ctx.fillStyle = '#0284c7';
            ctx.font = '600 16px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleEN || '', W / 2, 558);

            // Signer
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 150, 690);
            ctx.lineTo(W / 2 + 150, 690);
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 20px "Prompt", sans-serif';
            ctx.fillText(tpl.signerName || '', W / 2, 725);

            ctx.fillStyle = '#64748b';
            ctx.font = '500 16px "Sarabun", sans-serif';
            ctx.fillText(tpl.signerPosition || '', W / 2, 755);

            // Mock QR Box
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.fillRect(W - 190, H - 195, 110, 110);
            ctx.strokeRect(W - 190, H - 195, 110, 110);
            ctx.fillStyle = '#059669';
            ctx.font = '700 14px "JetBrains Mono", monospace';
            ctx.fillText('QR VERIFY', W - 135, H - 135);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#64748b';
            ctx.font = '600 14px "JetBrains Mono", monospace';
            ctx.fillText(`REF: ${tpl.certPrefix || 'RJC-2027'}-XXXXXX`, 75, H - 90);
        }

        // ============================================================================
        // 3. SHARED UI COMPONENTS (NO alert() / confirm())
        // ============================================================================
        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[120] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-xl flex items-center gap-2.5 text-sm font-bold ${
                        toast.type === 'error'
                            ? 'bg-rose-50/95 border-rose-200 text-rose-700'
                            : toast.type === 'info'
                                ? 'bg-medical-50/95 border-medical-200 text-medical-700'
                                : 'bg-clinical-50/95 border-clinical-200 text-clinical-800'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Info' : 'CheckCircle2'} size={18} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="fixed inset-0 z-[110] bg-slate-900/55 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="w-full sm:max-w-md bg-white rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] shadow-2xl border border-slate-100 space-y-4">
                        <div className="flex items-start gap-3.5">
                            <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${
                                dialog.danger ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600'
                            }`}>
                                <Icon name={dialog.danger ? 'AlertTriangle' : 'HelpCircle'} size={22} />
                            </div>
                            <div>
                                <h3 className="font-display font-bold text-lg text-slate-900">{dialog.title}</h3>
                                <p className="text-sm text-slate-600 mt-1 leading-relaxed">{dialog.message}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="touch-target py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-display font-semibold text-sm transition-colors"
                            >
                                ยกเลิก
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    const fn = dialog.onConfirm;
                                    onClose();
                                    if (fn) fn();
                                }}
                                className={`touch-target py-3 rounded-2xl text-white font-display font-semibold text-sm transition-colors ${
                                    dialog.danger
                                        ? 'bg-rose-600 hover:bg-rose-700'
                                        : 'bg-clinical-600 hover:bg-clinical-700'
                                }`}
                            >
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function FieldInput({ label, className = "", ...props }) {
            return (
                <div className={`w-full ${className}`}>
                    {label && <label className="block text-xs font-bold text-slate-600 mb-1.5 ml-1">{label}</label>}
                    <input
                        className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-clinical-500 focus:ring-4 focus:ring-clinical-500/10 text-sm font-medium transition-all"
                        {...props}
                    />
                </div>
            );
        }

        // ============================================================================
        // 4. MAIN ADMIN APPLICATION
        // ============================================================================
        function AdminApp() {
            // Auth State
            const [authChecked, setAuthChecked] = useState(!isCloudConfigured);
            const [adminSession, setAdminSession] = useState(null); // { email, mode: 'cloud' | 'demo' }
            const [loginEmail, setLoginEmail] = useState(CONFIG.contactEmail || 'rjcloud.organ@gmail.com');
            const [loginPassword, setLoginPassword] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            // Navigation State
            const [activeTab, setActiveTab] = useState('users'); // users | cert | sync | live | content | overview
            const [contentSubTab, setContentSubTab] = useState('lessons'); // lessons | quiz

            // Core Data States
            const [usersList, setUsersList] = useState(() => (isCloudConfigured ? [] : DEMO_ADMIN_USERS));
            const [certTemplate, setCertTemplate] = useState(() => {
                try {
                    const saved = localStorage.getItem('rjcloud_cert_template_v2027');
                    if (saved) return { ...DEFAULT_CERT_TEMPLATE, ...JSON.parse(saved) };
                } catch (_) {}
                return { ...DEFAULT_CERT_TEMPLATE };
            });
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 10,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });
            const [systemConfig, setSystemConfig] = useState({
                appsScriptUrl: CONFIG.appsScriptUrl || '',
                masterCsvUrl: '',
                autoSyncFromSheet: false
            });
            const [contentConfig, setContentConfig] = useState({
                lessons: window.INITIAL_LESSONS || [],
                questionSets: [parseRawExams(window.QUIZ_QUESTIONS_RAW || [])]
            });

            // UI Controls
            const [searchTerm, setSearchTerm] = useState('');
            const [filterType, setFilterType] = useState('ALL');
            const [showAddUser, setShowAddUser] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastSyncTime, setLastSyncTime] = useState('');
            const [manualForm, setManualForm] = useState({
                name: '',
                license: '',
                userType: 'เรียนใหม่',
                hospital: 'รพ.ราชวิถี',
                department: 'กรมการแพทย์',
                email: '',
                phone: ''
            });

            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            const certCanvasRef = useRef(null);
            // ใช้ Ref เก็บรายชื่อล่าสุดเพื่อไม่ให้ Auto-Sync useEffect รีเซ็ต Loop ทุกครั้งที่ข้อมูลอัปเดต
            const usersListRef = useRef(usersList);
            useEffect(() => { usersListRef.current = usersList; }, [usersList]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text, type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            const askConfirm = useCallback(({ title, message, danger = false, confirmText = 'ยืนยัน', onConfirm }) => {
                setConfirmDialog({ open: true, title, message, danger, confirmText, onConfirm });
            }, []);

            // 1. ตรวจสอบสถานะ Firebase Auth (Production Mode)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth) {
                    setAuthChecked(true);
                    return;
                }
                const unsub = onAuthStateChanged(fbAuth, (fbUser) => {
                    if (fbUser && fbUser.email) {
                        const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(e => e.toLowerCase());
                        if (allowed.includes(fbUser.email.toLowerCase())) {
                            setAdminSession({ email: fbUser.email, mode: 'cloud' });
                        } else {
                            setAdminSession(null);
                        }
                    } else {
                        setAdminSession(null);
                    }
                    setAuthChecked(true);
                });
                return () => unsub();
            }, []);

            // 2. Real-time Firestore Subscriptions (เมื่อล็อกอินในโหมด Cloud)
            useEffect(() => {
                if (!adminSession || adminSession.mode !== 'cloud' || !fbDb) return;

                const unsubUsers = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        setUsersList(arr);
                    },
                    (err) => console.error('Users snapshot error:', err)
                );

                const unsubSettings = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                    (docSnap) => {
                        if (!docSnap.exists()) return;
                        const data = docSnap.data();
                        if (data.liveConfig) setLiveConfig(prev => ({ ...prev, ...data.liveConfig }));
                        if (data.certTemplate) setCertTemplate(prev => ({ ...prev, ...data.certTemplate }));
                        setSystemConfig(prev => ({
                            ...prev,
                            appsScriptUrl: data.appsScriptUrl ?? prev.appsScriptUrl,
                            masterCsvUrl: data.masterCsvUrl ?? prev.masterCsvUrl,
                            autoSyncFromSheet: data.autoSyncFromSheet ?? prev.autoSyncFromSheet
                        }));
                    },
                    (err) => console.error('Settings snapshot error:', err)
                );

                const unsubContent = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                    (docSnap) => {
                        if (!docSnap.exists()) return;
                        const data = docSnap.data();
                        setContentConfig(prev => ({
                            lessons: Array.isArray(data.lessons) ? data.lessons : prev.lessons,
                            questionSets: data.questionSets ? normalizeQuestionSets(data.questionSets) : prev.questionSets
                        }));
                    },
                    (err) => console.error('Content snapshot error:', err)
                );

                return () => {
                    unsubUsers();
                    unsubSettings();
                    unsubContent();
                };
            }, [adminSession]);

            // 3. วาดตัวอย่างใบประกาศนียบัตรแบบ Real-time เมื่ออยู่ในแท็บ Certificate Studio
            useEffect(() => {
                if (activeTab === 'cert' && certCanvasRef.current) {
                    drawMiniCertPreview(certCanvasRef.current, certTemplate);
                }
            }, [activeTab, certTemplate]);

            // 4. ระบบ Login (Firebase Email/Password จริงเมื่อต่อ Cloud, หรือโหมด Sandbox เมื่อยังไม่ใส่คีย์)
            const handleCloudLogin = async (e) => {
                e.preventDefault();
                if (!isCloudConfigured || !fbAuth) {
                    setAdminSession({ email: CONFIG.contactEmail, mode: 'demo' });
                    showToast('เข้าสู่ระบบโหมด Sandbox (ยังไม่เชื่อมต่อ Firebase จริง)', 'info');
                    return;
                }
                const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => x.toLowerCase());
                if (!allowed.includes(loginEmail.trim().toLowerCase())) {
                    showToast(`อีเมลนี้ไม่มีสิทธิ์ผู้ดูแลระบบ (อนุญาตเฉพาะ ${CONFIG.contactEmail})`, 'error');
                    return;
                }
                setIsLoggingIn(true);
                try {
                    await signInWithEmailAndPassword(fbAuth, loginEmail.trim(), loginPassword);
                    showToast('เข้าสู่ระบบผู้ดูแล rjcloud.organ สำเร็จค่ะ');
                } catch (err) {
                    console.error('Admin login error:', err);
                    showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบใน Firebase Auth ค่ะ', 'error');
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleAdminLogout = async () => {
                if (adminSession?.mode === 'cloud' && fbAuth) {
                    await signOut(fbAuth).catch(() => {});
                }
                setAdminSession(null);
                setLoginPassword('');
                showToast('ออกจากระบบหลังบ้านแล้วค่ะ');
            };

            // 5. Google Sheets CSV Auto-Sync (แก้บั๊ก Loop รีเซ็ต + คอลัมน์ตรงกับคำแนะนำ)
            const syncFromGoogleSheet = useCallback(async (isManual = false) => {
                if (!systemConfig.masterCsvUrl) {
                    if (isManual) showToast('กรุณาระบุลิงก์ Google Sheets (CSV) ก่อนดึงข้อมูลค่ะ', 'error');
                    return;
                }
                setIsSyncing(true);
                if (isManual) showToast('กำลังดึงรายชื่อและสิทธิ์ผู้เรียนจาก Google Sheets...', 'info');
                try {
                    const sep = systemConfig.masterCsvUrl.includes('?') ? '&' : '?';
                    const res = await fetch(`${systemConfig.masterCsvUrl}${sep}t=${Date.now()}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error('ไม่สามารถโหลดไฟล์ CSV ได้');
                    const text = await res.text();
                    const rows = text.split(/\r?\n/).filter(r => r.trim());
                    if (rows.length <= 1) {
                        if (isManual) showToast('ไม่พบข้อมูลผู้เรียนในตาราง CSV ค่ะ', 'error');
                        return;
                    }

                    const currentUsers = usersListRef.current;
                    let added = 0, updated = 0;
                    const updatedLocalMap = new Map(currentUsers.map(u => [getUserLicense(u), u]));

                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i]
                            .split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                            .map(c => c.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));

                        // รูปแบบตารางมาตรฐาน (0:Timestamp, 1:ชื่อ-สกุล, 2:ใบอนุญาต, 3:อีเมล, 4:ตำแหน่ง, 5:สังกัด, 6:รพ., 7:จังหวัด, 8:สิทธิ์, 16:เบอร์โทร)
                        const license = String(cols[2] || '').replace(/[^a-zA-Z0-9]/g, '');
                        if (!license) continue;

                        const rawType = String(cols[8] || '').trim();
                        const existing = updatedLocalMap.get(license);
                        const userType = (existing || rawType.includes('ต่อเนื่อง')) ? 'เรียนต่อเนื่อง' : 'เรียนใหม่';

                        const payload = {
                            id: license,
                            license,
                            name: cols[1] || existing?.name || 'ผู้เรียน',
                            email: cols[3] || existing?.email || '',
                            position: cols[4] || existing?.position || '',
                            department: cols[5] || existing?.department || '',
                            hospital: cols[6] || existing?.hospital || '',
                            province: cols[7] || existing?.province || '',
                            phone: String(cols[16] || existing?.phone || '').replace(/[^0-9]/g, ''),
                            userType,
                            status: existing?.status || 'กำลังเรียน',
                            pretest: existing?.pretest || '-',
                            posttest: existing?.posttest || '-',
                            lastVideoId: existing?.lastVideoId || 1,
                            progress: existing?.progress ?? 0,
                            studySeconds: existing?.studySeconds ?? 0,
                            skillLabPassed: existing?.skillLabPassed ?? false
                        };

                        if (adminSession?.mode === 'cloud' && fbDb) {
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', license),
                                payload,
                                { merge: true }
                            );
                        } else {
                            updatedLocalMap.set(license, { ...existing, ...payload });
                        }

                        if (existing) updated++;
                        else added++;
                    }

                    if (adminSession?.mode !== 'cloud') {
                        setUsersList(Array.from(updatedLocalMap.values()));
                    }
                    setLastSyncTime(new Date().toLocaleTimeString('th-TH'));
                    if (isManual) showToast(`ซิงค์สำเร็จ! เพิ่มใหม่ ${added} ราย, อัปเดต ${updated} ราย`);
                } catch (err) {
                    console.error('CSV Sync Error:', err);
                    if (isManual) showToast('ดึงข้อมูล CSV ไม่สำเร็จ กรุณาตรวจสอบการเผยแพร่ลิงก์ Google Sheets ค่ะ', 'error');
                } finally {
                    setIsSyncing(false);
                }
            }, [systemConfig.masterCsvUrl, adminSession?.mode, showToast]);

            // Auto-Sync Timer (ไม่ใส่ usersList ใน dependency เพื่อป้องกัน Loop รีเซ็ตถี่เกินไป)
            useEffect(() => {
                if (!adminSession || !systemConfig.autoSyncFromSheet || !systemConfig.masterCsvUrl) return;
                const timer = setInterval(() => syncFromGoogleSheet(false), 30000);
                return () => clearInterval(timer);
            }, [adminSession, systemConfig.autoSyncFromSheet, systemConfig.masterCsvUrl, syncFromGoogleSheet]);

            // 6. CRUD Operations
            const persistSettings = async (partial) => {
                try {
                    if (adminSession?.mode === 'cloud' && fbDb) {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                            partial,
                            { merge: true }
                        );
                    }
                    if (partial.certTemplate) {
                        localStorage.setItem('rjcloud_cert_template_v2027', JSON.stringify(partial.certTemplate));
                    }
                    showToast('บันทึกการตั้งค่าเรียบร้อยแล้วค่ะ');
                } catch (err) {
                    showToast('บันทึกข้อมูลไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const handleUpdateUser = async (u, changes) => {
                const uid = u.id || getUserLicense(u);
                const merged = { ...u, ...changes, license: getUserLicense(u) };
                if (adminSession?.mode === 'cloud' && fbDb) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', uid), merged, { merge: true });
                        showToast('อัปเดตข้อมูลผู้เรียนแล้วค่ะ');
                    } catch (err) {
                        showToast('อัปเดตไม่สำเร็จ: ' + err.message, 'error');
                    }
                } else {
                    setUsersList(prev => prev.map(x => (x.id === uid ? merged : x)));
                    showToast('อัปเดตข้อมูลผู้เรียน (Sandbox) แล้วค่ะ');
                }
            };

            const handleDeleteUser = (u) => {
                const uid = u.id || getUserLicense(u);
                askConfirm({
                    title: 'ยืนยันการลบผู้เรียน',
                    message: `ต้องการลบ "${u.name}" (${getUserLicense(u)}) ออกจากระบบหรือไม่? ข้อมูลการเรียนจะถูกลบถาวร`,
                    danger: true,
                    confirmText: 'ลบผู้เรียน',
                    onConfirm: async () => {
                        if (adminSession?.mode === 'cloud' && fbDb) {
                            try {
                                await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', uid));
                                showToast('ลบผู้เรียนเรียบร้อยแล้วค่ะ');
                            } catch (err) {
                                showToast('ลบข้อมูลไม่สำเร็จ: ' + err.message, 'error');
                            }
                        } else {
                            setUsersList(prev => prev.filter(x => x.id !== uid));
                            showToast('ลบผู้เรียนเรียบร้อยแล้วค่ะ');
                        }
                    }
                });
            };

            const handleAddManualUser = async (e) => {
                e.preventDefault();
                const cleanLic = manualForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (!cleanLic || !manualForm.name.trim()) {
                    showToast('กรุณากรอกชื่อ-สกุล และเลขใบอนุญาตให้ครบค่ะ', 'error');
                    return;
                }
                const newUser = {
                    id: cleanLic,
                    license: cleanLic,
                    name: manualForm.name.trim(),
                    email: manualForm.email.trim(),
                    phone: manualForm.phone.trim(),
                    department: manualForm.department.trim(),
                    hospital: manualForm.hospital.trim(),
                    userType: manualForm.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    status: 'กำลังเรียน',
                    progress: 0,
                    studySeconds: 0,
                    pretest: '-',
                    posttest: '-',
                    skillLabPassed: false,
                    skillLabHistory: [],
                    lastVideoId: 1
                };
                if (adminSession?.mode === 'cloud' && fbDb) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic), newUser, { merge: true });
                        showToast('เพิ่มผู้เรียนใหม่เข้าฐานข้อมูลแล้วค่ะ');
                    } catch (err) {
                        showToast('เพิ่มผู้เรียนไม่สำเร็จ: ' + err.message, 'error');
                        return;
                    }
                } else {
                    setUsersList(prev => [newUser, ...prev.filter(x => x.id !== cleanLic)]);
                    showToast('เพิ่มผู้เรียนใหม่ (Sandbox) แล้วค่ะ');
                }
                setManualForm({ name: '', license: '', userType: 'เรียนใหม่', hospital: 'รพ.ราชวิถี', department: 'กรมการแพทย์', email: '', phone: '' });
                setShowAddUser(false);
            };

            const handleAutoRefillVip = () => {
                askConfirm({
                    title: 'Auto-Refill สิทธิ์ Onsite / Masterclass',
                    message: 'ระบบจะเติมเวลาเรียนเป็น 100% (10 ชม.) ให้กับผู้เรียนที่มีสิทธิ์ Onsite และ Masterclass ทุกรายในระบบ ยืนยันหรือไม่?',
                    confirmText: 'ดำเนินการเลย',
                    onConfirm: async () => {
                        let count = 0;
                        const updated = [];
                        for (const u of usersList) {
                            const isVip = ['onsite', 'masterclass'].includes(String(u.userType || '').toLowerCase());
                            if (isVip && (u.progress || 0) < 100) {
                                const nextU = { ...u, progress: 100, studySeconds: 36000 };
                                if (adminSession?.mode === 'cloud' && fbDb) {
                                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', u.id), { progress: 100, studySeconds: 36000 }, { merge: true });
                                }
                                updated.push(nextU);
                                count++;
                            } else {
                                updated.push(u);
                            }
                        }
                        if (adminSession?.mode !== 'cloud') setUsersList(updated);
                        showToast(`เติมเวลาเรียนสำเร็จทั้งหมด ${count} รายการค่ะ`);
                    }
                });
            };

            const handleExportCSV = () => {
                const headers = [
                    'ชื่อ-สกุล', 'เลขใบประกอบวิชาชีพ', 'อีเมล', 'เบอร์โทร',
                    'ตำแหน่ง', 'ลักษณะงาน', 'สังกัด', 'หน่วยงาน/โรงพยาบาล',
                    'สิทธิ์การเรียน', 'สถานะ', 'Pretest', 'Posttest',
                    'ความคืบหน้า (%)', 'คะแนนเจรจาเฉลี่ย', 'ความพึงพอใจ (CSAT)', 'รหัสประกาศนียบัตร'
                ];
                const rows = usersList.map(u => {
                    const hist = Array.isArray(u.skillLabHistory) ? u.skillLabHistory : [];
                    const avgSkill = hist.length > 0 ? Math.round(hist.reduce((s, r) => s + (r.score || 0), 0) / hist.length) : 0;
                    return [
                        u.name, getUserLicense(u), u.email, u.phone,
                        u.position, u.workContext, u.department, u.hospital,
                        u.userType, u.status, u.pretest, u.posttest,
                        u.progress || 0, avgSkill, u.satisfactionScore || '-', u.certificateCode || '-'
                    ].map(escapeCsvCell).join(',');
                });
                const csvText = '\ufeff' + [headers.map(escapeCsvCell).join(','), ...rows].join('\n');
                const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `rjcloud_organ_users_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast('ส่งออกไฟล์ CSV (รองรับภาษาไทยใน Excel) เรียบร้อยแล้วค่ะ');
            };

            const handleSaveContent = async () => {
                try {
                    if (adminSession?.mode === 'cloud' && fbDb) {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                            {
                                lessons: contentConfig.lessons,
                                questionSets: Object.assign({}, contentConfig.questionSets)
                            },
                            { merge: true }
                        );
                    }
                    showToast('เผยแพร่บทเรียนและข้อสอบขึ้นระบบเรียบร้อยแล้วค่ะ');
                } catch (err) {
                    showToast('บันทึกเนื้อหาไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const handleRestoreDefaultContent = () => {
                askConfirm({
                    title: 'กู้คืนบทเรียนและข้อสอบเริ่มต้น',
                    message: 'ระบบจะดึง 20 บทเรียน และ 40 ข้อสอบมาตรฐานจาก data.js กลับมาแทนที่ข้อมูลปัจจุบัน ยืนยันหรือไม่?',
                    danger: true,
                    confirmText: 'กู้คืนข้อมูล',
                    onConfirm: async () => {
                        const restored = {
                            lessons: window.INITIAL_LESSONS || [],
                            questionSets: [parseRawExams(window.QUIZ_QUESTIONS_RAW || [])]
                        };
                        setContentConfig(restored);
                        if (adminSession?.mode === 'cloud' && fbDb) {
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                                { lessons: restored.lessons, questionSets: Object.assign({}, restored.questionSets) },
                                { merge: true }
                            );
                        }
                        showToast('กู้คืนบทเรียนและข้อสอบมาตรฐานเรียบร้อยแล้วค่ะ');
                    }
                });
            };

            // Filtered Users
            const filteredUsers = useMemo(() => {
                const q = searchTerm.trim().toLowerCase();
                return usersList.filter(u => {
                    const matchType = filterType === 'ALL' || u.userType === filterType || (filterType === 'PASSED' && u.status === 'ผ่าน');
                    if (!matchType) return false;
                    if (!q) return true;
                    return (
                        String(u.name || '').toLowerCase().includes(q) ||
                        getUserLicense(u).toLowerCase().includes(q) ||
                        String(u.hospital || '').toLowerCase().includes(q)
                    );
                });
            }, [usersList, searchTerm, filterType]);

            const quickStats = useMemo(() => {
                const passed = usersList.filter(u => u.status === 'ผ่าน').length;
                const continuing = usersList.filter(u => u.userType === 'เรียนต่อเนื่อง').length;
                const csatUsers = usersList.filter(u => typeof u.satisfactionScore === 'number' && u.satisfactionScore > 0);
                const avgCsat = csatUsers.length
                    ? (csatUsers.reduce((s, u) => s + u.satisfactionScore, 0) / csatUsers.length).toFixed(1)
                    : '0.0';
                return { total: usersList.length, passed, continuing, avgCsat };
            }, [usersList]);

            // ============================================================================
            // 5. LOGIN GATE (ปลอดภัย ไม่มี Hardcode Password ในโค้ด!)
            // ============================================================================
            if (!authChecked) {
                return (
                    <div className="min-h-dvh flex items-center justify-center bg-slate-50">
                        <div className="w-10 h-10 border-4 border-clinical-500 border-t-transparent rounded-full animate-spin" />
                    </div>
                );
            }

            if (!adminSession) {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <div className="bento-glass relative z-10 w-full max-w-md rounded-[2rem] p-6 sm:p-8 space-y-6">
                            <div className="text-center space-y-2">
                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center mx-auto shadow-lg shadow-clinical-500/25">
                                    <Icon name="ShieldCheck" size={28} />
                                </div>
                                <span className="inline-block px-2.5 py-0.5 rounded-full bg-clinical-50 text-clinical-700 font-mono text-[10px] font-bold">
                                    ADMIN STUDIO • 2027
                                </span>
                                <h1 className="font-display text-2xl font-extrabold text-slate-900">rjcloud.organ Backend</h1>
                                <p className="text-xs text-slate-500">
                                    ยืนยันตัวตนผู้ดูแลระบบด้วยบัญชี <b className="text-slate-700">{CONFIG.contactEmail}</b>
                                </p>
                            </div>

                            {isCloudConfigured ? (
                                <form onSubmit={handleCloudLogin} className="space-y-4">
                                    <FieldInput
                                        label="อีเมลผู้ดูแลระบบ (Firebase Auth)"
                                        type="email"
                                        required
                                        value={loginEmail}
                                        onChange={e => setLoginEmail(e.target.value)}
                                        placeholder="rjcloud.organ@gmail.com"
                                    />
                                    <FieldInput
                                        label="รหัสผ่าน"
                                        type="password"
                                        required
                                        value={loginPassword}
                                        onChange={e => setLoginPassword(e.target.value)}
                                        placeholder="ระบุรหัสผ่านบัญชีผู้ดูแล"
                                    />
                                    <button
                                        type="submit"
                                        disabled={isLoggingIn}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 hover:from-clinical-600 hover:to-teal-700 text-white font-display font-bold text-base shadow-lg shadow-clinical-500/25 transition-all active:scale-[0.98]"
                                    >
                                        {isLoggingIn ? 'กำลังยืนยันตัวตน...' : 'เข้าสู่ระบบหลังบ้าน'}
                                    </button>
                                </form>
                            ) : (
                                <div className="space-y-4">
                                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 leading-relaxed space-y-1.5">
                                        <p className="font-bold flex items-center gap-1.5">
                                            <Icon name="Info" size={15} className="text-amber-600 shrink-0" />
                                            โหมดทดลองใช้งาน (Sandbox Mode)
                                        </p>
                                        <p>
                                            ยังไม่ได้วางค่า Firebase Config ในไฟล์ <code className="font-mono font-bold">data.js</code> คุณสามารถเข้าสู่ระบบเพื่อทดลองจัดการผู้เรียน ออกแบบใบประกาศฯ และตั้งค่าต่างๆ ได้ทันทีค่ะ (เมื่อวางค่า Firebase ของ <b>{CONFIG.contactEmail}</b> แล้ว ระบบจะสลับเป็นล็อกอินด้วย Email/Password อัตโนมัติ)
                                        </p>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setAdminSession({ email: CONFIG.contactEmail, mode: 'demo' });
                                            showToast('เข้าสู่ระบบหลังบ้าน (โหมด Sandbox) เรียบร้อยค่ะ');
                                        }}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 hover:from-clinical-600 hover:to-teal-700 text-white font-display font-bold text-base shadow-lg shadow-clinical-500/25 flex items-center justify-center gap-2 transition-all active:scale-[0.98]"
                                    >
                                        <Icon name="Sparkles" size={18} /> เข้าจัดการระบบหลังบ้าน (Sandbox)
                                    </button>
                                </div>
                            )}

                            <div className="text-center pt-2 border-t border-slate-100">
                                <a href="./index.html" className="text-xs font-bold text-slate-500 hover:text-clinical-700 inline-flex items-center gap-1">
                                    <Icon name="ArrowLeft" size={14} /> กลับหน้าหลักผู้เรียน
                                </a>
                            </div>
                        </div>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // ============================================================================
            // 6. MAIN ADMIN WORKSPACE (100% SMARTPHONE-FIRST + DESKTOP SIDEBAR)
            // ============================================================================
            const navItems = [
                { id: 'users', label: 'ผู้เรียน', fullLabel: 'จัดการสิทธิ์ผู้เรียน', icon: 'Users' },
                { id: 'cert', label: 'ประกาศฯ', fullLabel: 'ออกแบบประกาศนียบัตร', icon: 'Award' },
                { id: 'live', label: 'Live สด', fullLabel: 'ควบคุม Live สด', icon: 'Radio' },
                { id: 'content', label: 'บทเรียน', fullLabel: 'บทเรียน & ข้อสอบ', icon: 'BookOpen' },
                { id: 'sync', label: 'Sync', fullLabel: 'Auto-Sync & Cloud', icon: 'Database' },
                { id: 'overview', label: 'ภาพรวม', fullLabel: 'ลิงก์ระบบ & สรุป', icon: 'LayoutDashboard' }
            ];

            return (
                <div className="min-h-dvh relative flex flex-col lg:flex-row pt-safe">
                    <div className="aura-canvas" /><div className="aura-grid" />

                    {/* Desktop Sidebar */}
                    <aside className="hidden lg:flex w-64 shrink-0 flex-col bg-white/85 backdrop-blur-2xl border-r border-slate-200/80 z-20 sticky top-0 h-screen">
                        <div className="p-5 border-b border-slate-100">
                            <div className="flex items-center gap-2.5">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shadow-sm">
                                    <Icon name="ShieldCheck" size={20} />
                                </div>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-base text-slate-900 block leading-none">
                                        rjcloud<span className="text-clinical-600">.organ</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-slate-500">Admin Studio 2027</span>
                                </div>
                            </div>
                            <div className="mt-3 px-2.5 py-1.5 rounded-xl bg-slate-50 border border-slate-200/70 text-[11px] font-mono text-slate-600 truncate">
                                {adminSession.email}
                            </div>
                        </div>

                        <nav className="flex-1 p-3 space-y-1.5 overflow-y-auto custom-scrollbar">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    type="button"
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold transition-all ${
                                        activeTab === item.id
                                            ? 'bg-clinical-600 text-white shadow-md shadow-clinical-600/20'
                                            : 'text-slate-600 hover:bg-slate-100/90 hover:text-slate-900'
                                    }`}
                                >
                                    <Icon name={item.icon} size={18} />
                                    <span>{item.fullLabel}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-3 border-t border-slate-100 space-y-1.5">
                            <a href="./index.html" className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors">
                                <Icon name="ExternalLink" size={15} /> ไปหน้าผู้เรียน
                            </a>
                            <button onClick={handleAdminLogout} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold transition-colors">
                                <Icon name="LogOut" size={15} /> ออกจากระบบ
                            </button>
                        </div>
                    </aside>

                    {/* Mobile Top Header */}
                    <header className="lg:hidden sticky top-0 z-30 backdrop-blur-xl bg-white/85 border-b border-slate-200/70">
                        <div className="px-3.5 h-14 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2 min-w-0">
                                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shrink-0">
                                    <Icon name="ShieldCheck" size={17} />
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5">
                                        <span className="font-display font-extrabold text-sm text-slate-900 truncate">Admin Studio</span>
                                        <span className={`px-1.5 py-0.5 rounded-full text-[9px] font-mono font-bold ${adminSession.mode === 'cloud' ? 'bg-clinical-100 text-clinical-700' : 'bg-amber-100 text-amber-800'}`}>
                                            {adminSession.mode === 'cloud' ? 'LIVE' : 'DEMO'}
                                        </span>
                                    </div>
                                    <span className="text-[10px] font-mono text-slate-500 block truncate">{adminSession.email}</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                                <a href="./index.html" className="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center" title="หน้าผู้เรียน">
                                    <Icon name="Home" size={17} />
                                </a>
                                <button onClick={handleAdminLogout} className="w-9 h-9 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center" title="ออกจากระบบ">
                                    <Icon name="LogOut" size={17} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="relative z-10 flex-1 w-full max-w-6xl mx-auto px-3.5 sm:px-6 lg:px-8 py-4 md:py-7 pb-dock-safe lg:pb-10">

                        {/* ==================== TAB 1: USERS ==================== */}
                        {activeTab === 'users' && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <h2 className="font-display text-xl sm:text-2xl font-extrabold text-slate-900">จัดการสิทธิ์ผู้เรียน</h2>
                                        <p className="text-xs sm:text-sm text-slate-500">ทั้งหมด {usersList.length} ราย • สอบผ่านแล้ว {quickStats.passed} ราย</p>
                                    </div>
                                    <div className="grid grid-cols-2 sm:flex flex-wrap gap-2">
                                        <button onClick={() => setShowAddUser(v => !v)} className="touch-target px-3.5 py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="UserPlus" size={15} /> เพิ่มผู้เรียน
                                        </button>
                                        <button onClick={() => syncFromGoogleSheet(true)} disabled={isSyncing} className="touch-target px-3.5 py-2.5 rounded-2xl bg-medical-600 hover:bg-medical-700 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="RefreshCw" size={15} className={isSyncing ? 'animate-spin' : ''} /> ดึงจาก Sheet
                                        </button>
                                        <button onClick={handleAutoRefillVip} className="touch-target px-3.5 py-2.5 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="Zap" size={15} /> เติมเวลา VIP
                                        </button>
                                        <button onClick={handleExportCSV} className="touch-target px-3.5 py-2.5 rounded-2xl bg-clinical-600 hover:bg-clinical-700 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="Download" size={15} /> ส่งออก CSV
                                        </button>
                                    </div>
                                </div>

                                {/* Add User Form Drawer */}
                                {showAddUser && (
                                    <form onSubmit={handleAddManualUser} className="bento-glass rounded-[1.5rem] p-4 sm:p-5 space-y-3 border-clinical-200">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-display font-bold text-sm text-clinical-700">เพิ่มรายชื่อผู้เรียนด้วยตนเอง</h3>
                                            <button type="button" onClick={() => setShowAddUser(false)} className="text-slate-400 hover:text-slate-700">
                                                <Icon name="X" size={18} />
                                            </button>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            <FieldInput label="ชื่อ - นามสกุล *" required value={manualForm.name} onChange={e => setManualForm({ ...manualForm, name: e.target.value })} placeholder="พว.ใจดี มีเมตตา" />
                                            <FieldInput label="เลขใบประกอบวิชาชีพ *" required value={manualForm.license} onChange={e => setManualForm({ ...manualForm, license: e.target.value })} placeholder="65012345" />
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 mb-1.5 ml-1">ประเภทสิทธิ์</label>
                                                <select value={manualForm.userType} onChange={e => setManualForm({ ...manualForm, userType: e.target.value })} className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm font-medium">
                                                    <option value="เรียนใหม่">เรียนใหม่</option>
                                                    <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                </select>
                                            </div>
                                            <FieldInput label="โรงพยาบาล" value={manualForm.hospital} onChange={e => setManualForm({ ...manualForm, hospital: e.target.value })} />
                                            <FieldInput label="สังกัด / เขตสุขภาพ" value={manualForm.department} onChange={e => setManualForm({ ...manualForm, department: e.target.value })} />
                                            <FieldInput label="อีเมล" type="email" value={manualForm.email} onChange={e => setManualForm({ ...manualForm, email: e.target.value })} />
                                        </div>
                                        <button type="submit" className="touch-target w-full sm:w-auto px-6 py-2.5 rounded-2xl bg-clinical-600 hover:bg-clinical-700 text-white font-display font-bold text-sm">
                                            บันทึกผู้เรียนใหม่
                                        </button>
                                    </form>
                                )}

                                {/* Search & Filter Bar */}
                                <div className="bento-glass rounded-2xl p-3 flex flex-col sm:flex-row gap-2.5">
                                    <div className="relative flex-1">
                                        <Icon name="Search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input
                                            type="text"
                                            value={searchTerm}
                                            onChange={e => setSearchTerm(e.target.value)}
                                            placeholder="ค้นหาชื่อ, เลขใบอนุญาต หรือโรงพยาบาล..."
                                            className="touch-target w-full pl-10 pr-3 py-2 rounded-xl bg-white border border-slate-200 text-sm outline-none focus:border-clinical-500"
                                        />
                                    </div>
                                    <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-0.5">
                                        {[
                                            { k: 'ALL', l: 'ทั้งหมด' },
                                            { k: 'เรียนใหม่', l: 'เรียนใหม่' },
                                            { k: 'เรียนต่อเนื่อง', l: 'เรียนต่อเนื่อง' },
                                            { k: 'PASSED', l: 'สอบผ่านแล้ว' }
                                        ].map(f => (
                                            <button
                                                key={f.k}
                                                type="button"
                                                onClick={() => setFilterType(f.k)}
                                                className={`shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                                                    filterType === f.k
                                                        ? 'bg-clinical-600 text-white'
                                                        : 'bg-white border border-slate-200 text-slate-600'
                                                }`}
                                            >
                                                {f.l}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Mobile Card List (100% Smartphone Friendly — ไม่ต้องเลื่อนตารางแนวนอน) */}
                                <div className="space-y-3 md:hidden">
                                    {filteredUsers.map(u => (
                                        <div key={u.id} className="bento-glass rounded-2xl p-4 space-y-3">
                                            <div className="flex items-start justify-between gap-2">
                                                <div className="min-w-0">
                                                    <h3 className="font-display font-bold text-base text-slate-900 truncate">{u.name}</h3>
                                                    <p className="text-xs text-slate-500 truncate">{u.hospital || 'ไม่ระบุหน่วยงาน'} • <span className="font-mono">{getUserLicense(u)}</span></p>
                                                </div>
                                                <button onClick={() => handleDeleteUser(u)} className="w-9 h-9 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center shrink-0">
                                                    <Icon name="Trash2" size={16} />
                                                </button>
                                            </div>

                                            <div className="flex items-center gap-2">
                                                <div className="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                                                    <div className="h-full bg-clinical-500 rounded-full" style={{ width: `${u.progress || 0}%` }} />
                                                </div>
                                                <span className="font-mono text-xs font-bold text-clinical-700">{u.progress || 0}%</span>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2">
                                                <select
                                                    value={u.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'}
                                                    onChange={e => handleUpdateUser(u, { userType: e.target.value })}
                                                    className="touch-target px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-700"
                                                >
                                                    <option value="เรียนใหม่">เรียนใหม่</option>
                                                    <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                </select>
                                                <select
                                                    value={u.status || 'กำลังเรียน'}
                                                    onChange={e => handleUpdateUser(u, { status: e.target.value })}
                                                    className={`touch-target px-3 py-2 rounded-xl border text-xs font-bold ${
                                                        u.status === 'ผ่าน'
                                                            ? 'bg-clinical-50 border-clinical-200 text-clinical-700'
                                                            : 'bg-amber-50 border-amber-200 text-amber-700'
                                                    }`}
                                                >
                                                    <option value="กำลังเรียน">กำลังเรียน</option>
                                                    <option value="ผ่าน">ผ่านเกณฑ์</option>
                                                    <option value="ไม่ผ่าน">ไม่ผ่าน</option>
                                                </select>
                                            </div>
                                        </div>
                                    ))}
                                    {filteredUsers.length === 0 && (
                                        <div className="bento-glass rounded-2xl p-8 text-center text-sm text-slate-400">ไม่พบรายชื่อผู้เรียนที่ค้นหาค่ะ</div>
                                    )}
                                </div>

                                {/* Desktop Data Table */}
                                <div className="hidden md:block bento-glass rounded-[1.5rem] overflow-hidden">
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-50/90 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase">
                                                <tr>
                                                    <th className="p-4">ชื่อผู้เรียน / หน่วยงาน</th>
                                                    <th className="p-4">ใบอนุญาต</th>
                                                    <th className="p-4">สิทธิ์การเรียน</th>
                                                    <th className="p-4">ความคืบหน้า</th>
                                                    <th className="p-4">สถานะ</th>
                                                    <th className="p-4 text-center">จัดการ</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 bg-white/60">
                                                {filteredUsers.map(u => (
                                                    <tr key={u.id} className="hover:bg-clinical-50/40 transition-colors">
                                                        <td className="p-4">
                                                            <p className="font-bold text-slate-900">{u.name}</p>
                                                            <p className="text-xs text-slate-500">{u.hospital || '-'}</p>
                                                        </td>
                                                        <td className="p-4 font-mono text-xs text-slate-600">{getUserLicense(u)}</td>
                                                        <td className="p-4">
                                                            <select
                                                                value={u.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'}
                                                                onChange={e => handleUpdateUser(u, { userType: e.target.value })}
                                                                className="px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-xs font-bold"
                                                            >
                                                                <option value="เรียนใหม่">เรียนใหม่</option>
                                                                <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                            </select>
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-20 h-2 bg-slate-100 rounded-full overflow-hidden">
                                                                    <div className="h-full bg-clinical-500" style={{ width: `${u.progress || 0}%` }} />
                                                                </div>
                                                                <span className="font-mono text-xs font-bold text-slate-600">{u.progress || 0}%</span>
                                                            </div>
                                                        </td>
                                                        <td className="p-4">
                                                            <select
                                                                value={u.status || 'กำลังเรียน'}
                                                                onChange={e => handleUpdateUser(u, { status: e.target.value })}
                                                                className={`px-2.5 py-1.5 rounded-xl border text-xs font-bold ${
                                                                    u.status === 'ผ่าน'
                                                                        ? 'bg-clinical-50 border-clinical-200 text-clinical-700'
                                                                        : 'bg-amber-50 border-amber-200 text-amber-700'
                                                                }`}
                                                            >
                                                                <option value="กำลังเรียน">กำลังเรียน</option>
                                                                <option value="ผ่าน">ผ่านเกณฑ์</option>
                                                                <option value="ไม่ผ่าน">ไม่ผ่าน</option>
                                                            </select>
                                                        </td>
                                                        <td className="p-4 text-center">
                                                            <button onClick={() => handleDeleteUser(u)} className="p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors">
                                                                <Icon name="Trash2" size={17} />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {filteredUsers.length === 0 && (
                                                    <tr><td colSpan="6" className="p-10 text-center text-slate-400">ไม่พบข้อมูลผู้เรียน</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ==================== TAB 2: CERTIFICATE DESIGNER (NEW 2027) ==================== */}
                        {activeTab === 'cert' && (
                            <div className="space-y-5">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <span className="px-2.5 py-0.5 rounded-full bg-clinical-100 text-clinical-700 font-mono text-[10px] font-bold">IN-APP CERTIFICATE STUDIO</span>

                                        <Icon name="Save" size={18} /> บันทึกและเผยแพร่สถานะ Live
                                    </button>
                                </div>
                            </div>

                                                            next.splice(qIdx, 1);

                                                        <Icon name="Trash2" size={16} />
                                                    </button>
                                                </div>
                                                <textarea
                                                    value={q.question}
                                                    onChange={e => {
                                                        const next = [...(contentConfig.questionSets[0] || [])];
                                                        next[qIdx] = { ...next[qIdx], question: e.target.value };
                                                        setContentConfig(p => ({ ...p, questionSets: [next] }));
                                                    }}

                                            <Icon name="Plus" size={18} /> เพิ่มข้อสอบใหม่

                                    <div className="bento-glass rounded-2xl p-4">
                                        <p className="text-xs font-bold text-slate-500">CSAT เฉลี่ย</p>
                                        <p className="font-mono text-2xl font-extrabold text-amber-600 mt-1">{quickStats.avgCsat}/5</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                    {[
                                        { href: './executive.html', title: 'AI Policy Intelligence', desc: 'แดชบอร์ดผู้บริหาร แผนที่ 13 เขต และ Fah AI', icon: 'Globe', color: 'bg-medical-50 text-medical-600' },
                                        { href: './verify.html', title: 'QR Verify Portal', desc: 'หน้าสแกนตรวจสอบความถูกต้องประกาศนียบัตร', icon: 'QrCode', color: 'bg-clinical-50 text-clinical-600' },
                                        { href: './aiskilllab.html', title: 'AI Skill Lab 2027', desc: 'ห้องจำลองสถานการณ์ฝึกเจรจาญาติผู้ป่วย', icon: 'Bot', color: 'bg-violet-50 text-violet-600' },
                                        { href: './index.html', title: 'หน้าหลักผู้เรียน (Student App)', desc: 'สลับไปดูมุมมองผู้เรียนบนสมาร์ทโฟน', icon: 'Smartphone', color: 'bg-amber-50 text-amber-600' }
                                    ].map(card => (
                                        <a key={card.href} href={card.href} target="_blank" rel="noreferrer" className="bento-glass rounded-2xl p-5 flex items-center gap-4 hover:border-clinical-300 transition-all active:scale-[0.99]">
                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${card.color}`}>
                                                <Icon name={card.icon} size={24} />
                                            </div>
                                            <div className="min-w-0 flex-1">
                                                <h3 className="font-display font-bold text-base text-slate-900">{card.title}</h3>
                                                <p className="text-xs text-slate-500 mt-0.5">{card.desc}</p>
                                            </div>
                                            <Icon name="ExternalLink" size={16} className="text-slate-400 shrink-0" />
                                        </a>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Smartphone Bottom Dock (ครบทั้ง 6 เมนู กดง่ายบนมือถือ) */}
                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/94 backdrop-blur-2xl border-t border-slate-200/80 px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] shadow-[0_-8px_30px_rgba(15,23,42,0.08)]">
                        <div className="grid grid-cols-6 gap-1 max-w-xl mx-auto">
                            {navItems.map(item => {
                                const active = activeTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => { setActiveTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all active:scale-95 ${
                                            active ? 'bg-clinical-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                                        }`}
                                    >
                                        <Icon name={item.icon} size={17} />
                                        <span className="truncate max-w-full px-0.5">{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('admin-root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
