          const mode = saved === 'dark' ? 'dark' : 'light';

          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#1c222b' : '#e6ebf0');
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&

            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            ['./data.js', './learning-core.js?v=202719', './cert-engine.js'].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

      .spatial-aura, .spatial-grid { display: none; }

      .spatial-card {
        background: var(--neu-bg);
        border: 1px solid var(--neu-border);
        box-shadow: var(--shadow-raised-lg);
        transition: background-color 0.32s ease, box-shadow 0.25s ease, border-color 0.25s ease;

      .spatial-header {

        backdrop-filter: blur(14px);

      .spatial-dock {
        background: var(--dock-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--neu-border-soft);
      }
      .spatial-soft {
        background: var(--neu-bg);
        border: 1px solid var(--neu-border);
        box-shadow: var(--shadow-raised-sm);
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, color 0.2s ease, border-color 0.2s ease;

        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

        transform: translateY(-1.5px);
        color: var(--neu-teal);
      }
      button.spatial-soft:active:not(:disabled),
      button.spatial-soft.is-tapping:not(:disabled),

        transform: translateY(1.5px) scale(0.978);
        box-shadow: var(--shadow-pressed-deep);
        border-color: var(--neu-teal-soft);
        color: var(--neu-teal);

        box-shadow: var(--shadow-pressed);

    <!-- Global Error Guard + Global Tactile Sinking Press Feedback -->
    <script>
      window.addEventListener('error', function (ev) {
        const src = String(ev.filename || (ev.target && ev.target.src) || '');
        if (/(data|learning-core|cert-engine)\.js|styles\.css|qrcode/i.test(src)) return;
        const root = document.getElementById('admin-root');
        if (root && !root.dataset.mounted && ev.message) {
          const safeMsg = String(ev.message || 'Unknown error').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#e6ebf0;color:#1f2b38;font-family:Sarabun,sans-serif;">' +
            '<div style="max-width:440px;width:100%;background:#e6ebf0;border:1px solid rgba(255,255,255,0.75);border-radius:28px;padding:24px;text-align:center;box-shadow:12px 12px 26px #c5ced9,-12px -12px 26px #ffffff;">' +
            '<h2 style="color:#d9486b;font-weight:700;margin:0 0 8px;">ไม่สามารถเปิดระบบหลังบ้านได้ชั่วคราว</h2>' +
            '<p style="font-size:13px;color:#47586b;margin:0 0 16px;">' + safeMsg + '</p>' +
            '<button onclick="window.location.reload()" style="padding:12px 24px;border:none;border-radius:9999px;background:#247870;color:#ffffff;font-weight:700;cursor:pointer;">โหลดหน้าใหม่</button>' +
            '</div></div>';
        }
      });

      document.addEventListener('pointerdown', function (e) {
        const el = e.target && e.target.closest ? e.target.closest('.neu-btn, .rjc2-pill-btn, .btn-peach-ambient, button.spatial-soft, a.spatial-soft') : null;
        if (!el || el.disabled) return;
        el.classList.add('is-tapping');
        const release = function () {
          setTimeout(function () { el.classList.remove('is-tapping'); }, 110);
        };
        window.addEventListener('pointerup', release, { once: true });
        window.addEventListener('pointercancel', release, { once: true });
      });
    </script>

        function drawQrToCanvas(ctx, url, x, y, size, darkHex = '#0f172a') {
            if (!ctx || !url || typeof window.qrcode !== 'function') return false;
            try {
                const qr = window.qrcode(0, 'M');
                qr.addData(String(url));
                qr.make();
                const count = qr.getModuleCount();
                const cell = size / count;
                ctx.fillStyle = darkHex;
                for (let r = 0; r < count; r++) {
                    const py = Math.floor(y + r * cell);
                    const ph = Math.ceil(y + (r + 1) * cell) - py;
                    for (let c = 0; c < count; c++) {
                        if (qr.isDark(r, c)) {
                            const px = Math.floor(x + c * cell);
                            const pw = Math.ceil(x + (c + 1) * cell) - px;
                            ctx.fillRect(px, py, pw, ph);
                        }
                    }
                }
                return true;
            } catch (_) { return false; }
        }

        function downloadOnsiteQrPng({ url, onsiteCfg, mode = 'poster' }) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) return false;
            const safeEventId = String(onsiteCfg?.eventId || 'ONSITE').replace(/[^a-zA-Z0-9_-]/g, '');

            if (mode === 'raw') {
                canvas.width = 900; canvas.height = 900;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 900, 900);
                if (!drawQrToCanvas(ctx, url, 70, 70, 760, '#0f172a')) return false;
            } else {
                canvas.width = 1000; canvas.height = 1240;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1000, 1240);
                ctx.strokeStyle = '#0f766e'; ctx.lineWidth = 6; ctx.strokeRect(28, 28, 944, 1184);
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.strokeRect(42, 42, 916, 1156);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#047857'; ctx.font = '700 22px "Prompt", sans-serif';
                ctx.fillText('สแกน QR CODE เพื่อลงทะเบียนอบรม ONSITE', 500, 104);

                ctx.fillStyle = '#0f172a'; ctx.font = '700 28px "Prompt", sans-serif';
                const title = String(onsiteCfg?.activityTitle || 'ลงทะเบียนอบรม Onsite (organ cloud 2.0)');
                if (title.length > 42) {
                    const mid = title.lastIndexOf(' ', Math.floor(title.length / 2));
                    const cut = mid > 15 ? mid : Math.floor(title.length / 2);
                    ctx.fillText(title.slice(0, cut).trim(), 500, 152, 860);
                    ctx.fillText(title.slice(cut).trim(), 500, 190, 860);
                } else {
                    ctx.fillText(title, 500, 162, 860);
                }
                ctx.fillStyle = '#475569'; ctx.font = '600 21px "Sarabun", sans-serif';
                ctx.fillText(`วันที่จัดกิจกรรม: ${onsiteCfg?.eventDate || '-'}`, 500, 234, 860);

                const qrSize = 680, qrX = 160, qrY = 274;
                ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3;
                ctx.fillRect(qrX - 24, qrY - 24, qrSize + 48, qrSize + 48);
                ctx.strokeRect(qrX - 24, qrY - 24, qrSize + 48, qrSize + 48);
                if (!drawQrToCanvas(ctx, url, qrX, qrY, qrSize, '#0f172a')) return false;

                ctx.fillStyle = '#0f172a'; ctx.font = '700 22px "JetBrains Mono", monospace';
                ctx.fillText(url, 500, 1042, 860);
                ctx.fillStyle = '#0369a1'; ctx.font = '600 20px "Sarabun", sans-serif';
                ctx.fillText(`เปิดสิทธิ์เข้า organ cloud 2.0: ${formatThaiDateTimeFull(onsiteCfg?.unlockAt)}`, 500, 1094, 860);
                ctx.fillStyle = '#64748b'; ctx.font = '600 18px "Prompt", sans-serif';
                ctx.fillText('ORGAN TRANSPLANTATION CENTER OF RAJAVITHI HOSPITAL', 500, 1148, 860);
            }
            try {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png', 1.0);
                a.download = mode === 'raw' ? `QR_Onsite_Raw_${safeEventId}.png` : `QR_Onsite_Poster_${safeEventId}.png`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                return true;
            } catch (_) { return false; }
        }

            const exempt = isHoursExemptUser(u);

            const labDone = Boolean(u.skillLabPassed || (Array.isArray(u.skillLabHistory) && u.skillLabHistory.length > 0));

                <button type="button" onClick={onToggle} aria-label="สลับโหมดมืดหรือสว่าง" className="neu-btn px-3 py-2 font-display font-bold text-xs shrink-0">
                    <span>{isDark ? '☀️' : '🌙'}</span>
                    {!compact && <span className="hidden sm:inline">{isDark ? 'โหมดสว่าง' : 'โหมดมืด'}</span>}
                </button>
            );
        }

        function FieldInput({ label, className = '', ...props }) {
            return (
                <div className={className}>
                    {label && <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">{label}</label>}
                    <input {...props} className="touch-target spatial-input w-full px-3.5 py-2 rounded-2xl text-sm" />
                </div>
            );
        }

        function LiveQrCanvas({ url, size = 168 }) {
            const ref = useRef(null);
            useEffect(() => {
                const canvas = ref.current;
                if (!canvas || !url) return;
                canvas.width = size; canvas.height = size;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
                drawQrToCanvas(ctx, url, 10, 10, size - 20, '#0f172a');
            }, [url, size]);
            return <canvas ref={ref} width={size} height={size} className="rounded-2xl bg-white shadow-lg border border-white/80 block" />;
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="no-print fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 z-[180] w-[92vw] max-w-md pointer-events-none">
                    <div className="spatial-card px-5 py-3.5 rounded-full flex items-center gap-2.5 text-xs sm:text-sm font-display font-bold text-primary-adaptive border-[var(--neu-teal-soft)]">
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Sparkles' : 'CheckCircle2'} size={17} className={toast.type === 'error' ? 'text-rose-adaptive shrink-0' : 'text-accent-adaptive shrink-0'} />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="no-print fixed inset-0 z-[165] bg-slate-950/70 backdrop-blur-md flex items-end sm:items-center justify-center p-3 sm:p-4">
                    <div className="spatial-card w-full sm:max-w-md rounded-[28px] p-6 space-y-4">
                        <h3 className="font-display font-bold text-lg text-primary-adaptive">{dialog.title}</h3>
                        <p className="text-sm text-secondary-adaptive leading-relaxed">{dialog.message}</p>
                        <div className="grid grid-cols-2 gap-3 pt-2">
                            <button type="button" onClick={onClose} className="neu-btn touch-target py-3 font-bold text-sm">ยกเลิก</button>
                            <button type="button" onClick={() => { const fn = dialog.onConfirm; onClose(); if (fn) fn(); }} className={`${dialog.danger ? 'neu-btn text-rose-adaptive font-extrabold' : 'rjc2-pill-btn font-bold'} touch-target py-3 font-display text-sm`}>
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function FiveStepTelemetryPills({ u, onToggleLab }) {
            const st = getUserFiveStepStatus(u);
            const info = resolveLearnerStatusInfo(u);
            const pills = [
                { key: 'pre', label: 'Pre', done: st.step1Pre, title: `Pre-test: ${u.pretest || '-'}` },
                { key: 'hr', label: info.isExempt ? 'เทียบโอน' : `${u.progress || 0}%`, done: st.step2Hours, title: info.activityName ? `${info.hoursLabel} — ${info.activityName}` : `เวลาเรียนสะสม (เกณฑ์ ≥${MIN_STUDY_PERCENT}%)` },
                { key: 'lab', label: st.bestLab ? `Lab ${st.bestLab}` : 'Lab', done: st.step3Lab, clickable: true, title: 'คลิกเพื่อสลับสถานะการผ่าน AI Skill Lab' },
                { key: 'post', label: 'Post', done: st.step4Post, title: `Post-test: ${u.posttest || '-'}` },
                { key: 'cert', label: 'Cert', done: st.step5Cert, title: u.certificateCode ? `รหัส: ${u.certificateCode}` : 'ยังไม่ออกใบประกาศฯ' }
            ];
            return (
                <div className="flex flex-wrap gap-1.5">
                    {pills.map(p => (
                        <button
                            key={p.key}
                            type="button"
                            title={p.title}
                            onClick={p.clickable ? onToggleLab : undefined}
                            className={`px-2.5 py-0.5 rounded-full font-mono text-[10px] font-bold border transition-all ${
                                p.done
                                    ? 'bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] border-[var(--neu-teal-soft)] text-accent-adaptive'
                                    : 'bg-[var(--neu-bg)] shadow-[var(--shadow-raised-sm)] border-[var(--neu-border)] text-muted-adaptive'
                            } ${p.clickable ? 'cursor-pointer hover:text-prism-adaptive' : 'cursor-default'}`}
                        >
                            {p.done ? '✓ ' : ''}{p.label}
                        </button>
                    ))}
                </div>
            );
        }

        // ============================================================================
        // 4. MAIN PRODUCTION ADMIN MISSION CONTROL APPLICATION
        // ============================================================================
        function AdminApp() {
            const [theme, setTheme] = useState(() => {

            });
            useEffect(() => {
                if (typeof CORE.applyPreferredTheme === 'function') {

                    document.documentElement.setAttribute('data-theme', theme);
                    const meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', theme === 'dark' ? '#1c222b' : '#e6ebf0');
                    try {
                        localStorage.setItem(THEME_KEY, theme);
                        localStorage.setItem('rjcloud_theme', theme);
                    } catch (_) {}

            const [reportMode, setReportMode] = useState('nurse_cneu');

            // Cloud Data States
            const [usersList, setUsersList] = useState([]);
            const [courseCatalog, setCourseCatalog] = useState(() => DEFAULT_COURSE_CATALOG);
            const [newCourseForm, setNewCourseForm] = useState({

            const [showAddCourseForm, setShowAddCourseForm] = useState(false);

            const [onsiteConfig, setOnsiteConfig] = useState(() => ({ ...DEFAULT_ONSITE_CONFIG }));

            const [onsiteRegistrants, setOnsiteRegistrants] = useState([]);
            const [onsiteEventFilter, setOnsiteEventFilter] = useState('ALL');

            const [certTemplate, setCertTemplate] = useState(() => ({ ...DEFAULT_CERT_TEMPLATE }));
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [liveConfig, setLiveConfig] = useState(() => ({ ...DEFAULT_LIVE_CONFIG }));
            const [systemConfig, setSystemConfig] = useState({
                appsScriptUrl: CONFIG.appsScriptUrl || '',
                masterCsvUrl: '',
                autoSyncFromSheet: false
            });
            const [contentConfig, setContentConfig] = useState(() => ({
                lessons: Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0

                    : [{ id: 1, title: 'บทที่ 1: นโยบายและมาตรฐานการรับบริจาคอวัยวะ 2027', videoId: '', documentUrl: '' }],
                questionSets: [parseRawExams(window.QUIZ_QUESTIONS_RAW || [])]
            }));

            // Filters & Modals State
            const [searchTerm, setSearchTerm] = useState('');
            const [filterType, setFilterType] = useState('ALL');
            const [filterProf, setFilterProf] = useState('ALL');
            const [showAddUser, setShowAddUser] = useState(false);
            const [manualForm, setManualForm] = useState({
                name: '', license: '', professionGroup: 'พยาบาล', userType: 'เรียนใหม่',
                hospital: 'รพ.ราชวิถี', department: 'กรมการแพทย์', email: '', phone: '', hoursActivityName: ''
            });
            const [transferModal, setTransferModal] = useState({
                open: false, user: null, studyHoursExempt: true,
                hoursActivityName: '', hoursActivityDate: '', hoursActivityVenue: ''
            });

            const [onsiteSearch, setOnsiteSearch] = useState('');
            const [onsiteFilterProf, setOnsiteFilterProf] = useState('ALL');
            const [onsiteSyncing, setOnsiteSyncing] = useState(false);
            const [cneuIncludeScores, setCneuIncludeScores] = useState(true);
            const [rebuildingSummary, setRebuildingSummary] = useState(false);

            // Live Multi-Page Inspector & Preview Studio States (Admin Only)
            const [previewPageId, setPreviewPageId] = useState('elearn_home');
            const [previewViewport, setPreviewViewport] = useState('desktop'); // desktop | tablet | mobile
            const [previewReloadKey, setPreviewReloadKey] = useState(0);
            const [adminPreviewSessionActive, setAdminPreviewSessionActive] = useState(() => {
                try {
                    const parsed = JSON.parse(localStorage.getItem('rjcloud_organ_state_v2027') || 'null');
                    return Boolean(parsed?.user?.isAdminPreviewSession);
                } catch (_) { return false; }
            });

            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });
            const certPreviewCanvasRef = useRef(null);
            const onsitePublicUrl = useMemo(() => resolveOnsitePublicUrl(), []);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            const askConfirm = useCallback((opts) => {
                setConfirmDialog({ open: true, danger: false, confirmText: 'ยืนยัน', ...opts });
            }, []);

            useEffect(() => {
                const el = document.getElementById('admin-root');
                if (el) el.dataset.mounted = 'true';
                if (typeof CORE.initSmoothTransitions === 'function') CORE.initSmoothTransitions();
            }, []);

            // Check Existing Firebase Admin Session
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth) return;
                const unsub = onAuthStateChanged(fbAuth, (fbUser) => {
                    if (fbUser && fbUser.email) {
                        const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => x.toLowerCase());
                        if (allowed.includes(fbUser.email.toLowerCase())) {
                            setAdminSession({ email: fbUser.email });
                        }
                    }
                });
                return () => unsub();
            }, []);

            // Live Firestore Subscriptions (Active only after Verified Admin Login)
            useEffect(() => {
                if (!adminSession || !fbDb) return;

                const unsubUsers = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        setUsersList(arr);
                    },
                    (err) => console.warn('Users snapshot error:', err)
                );

                const unsubOnsite = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        setOnsiteRegistrants(arr);
                    },
                    (err) => console.warn('Onsite snapshot warning:', err)
                );

                const unsubSettings = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                    (snap) => {
                        if (!snap.exists()) return;
                        const data = snap.data();
                        if (data.liveConfig) setLiveConfig(p => ({ ...p, ...data.liveConfig }));
                        if (data.certTemplate) setCertTemplate(p => ({ ...p, ...data.certTemplate }));
                        if (data.cneuConfig) setCneuConfig(p => ({ ...p, ...data.cneuConfig }));
                        if (Array.isArray(data.courseCatalog) && data.courseCatalog.length > 0) {
                            setCourseCatalog(data.courseCatalog);
                        }
                        if (data.onsiteConfig) {
                            const merged = {
                                ...DEFAULT_ONSITE_CONFIG,
                                ...data.onsiteConfig,
                                unlockAtLocal: isoToLocalInputValue(data.onsiteConfig.unlockAt)
                            };
                            setOnsiteConfig(merged);
                            setOnsiteDraft(merged);
                        }
                        setSystemConfig(p => ({
                            ...p,
                            appsScriptUrl: data.appsScriptUrl ?? p.appsScriptUrl,
                            masterCsvUrl: data.masterCsvUrl ?? p.masterCsvUrl,
                            autoSyncFromSheet: data.autoSyncFromSheet ?? p.autoSyncFromSheet
                        }));
                    },
                    (err) => console.warn('Settings snapshot error:', err)
                );

                const unsubContent = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                    (snap) => {
                        if (!snap.exists()) return;
                        const data = snap.data();
                        setContentConfig(p => ({
                            lessons: Array.isArray(data.lessons) && data.lessons.length > 0 ? data.lessons : p.lessons,
                            questionSets: data.questionSets ? normalizeQuestionSets(data.questionSets) : p.questionSets
                        }));
                    },
                    (err) => console.warn('Content snapshot error:', err)
                );

                return () => { unsubUsers(); unsubOnsite(); unsubSettings(); unsubContent(); };
            }, [adminSession]);

            // Redraw Profession-Aware Certificate Preview Canvas
            useEffect(() => {
                if (activeTab !== 'cert' || certSubTab !== 'designer' || !certPreviewCanvasRef.current) return;
                const isNurse = certPreviewProf === 'พยาบาล';
                const sampleUser = {
                    name: isNurse ? 'พว.กัญญารัตน์ วัฒนากูล' : (certPreviewProf === 'แพทย์' ? 'นพ.กิตติพงษ์ สุวรรณภูมิ' : 'ภญ.ปิยะนุช ศรีสวัสดิ์'),
                    nameEN: isNurse ? 'Kanyarat Wattanakul, RN' : (certPreviewProf === 'แพทย์' ? 'Kittipong Suwannaphum, MD' : 'Piyanuch Srisawat, PharmD'),
                    professionGroup: certPreviewProf,
                    cneuEligible: isNurse,
                    hospital: 'โรงพยาบาลราชวิถี',
                    license: isNurse ? '4511128901' : (certPreviewProf === 'แพทย์' ? '1100123456' : '7700128904'),
                    certificateCode: `${certTemplate.certPrefix || 'RJC-2027'}-${isNurse ? 'NURSE01' : (certPreviewProf === 'แพทย์' ? 'MD0001' : 'ALLIED1')}`,
                    certificateIssuedAt: new Date().toISOString()
                };
                const mergedTpl = {
                    ...certTemplate,
                    cneuActivityCode: cneuConfig.activityCode,
                    cneuCredits: cneuConfig.cneuCredits,
                    cmeActivityCode: cneuConfig.cmeActivityCode,
                    cmeCredits: cneuConfig.cmeCredits,
                    trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8)
                };
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certPreviewCanvasRef.current, mergedTpl, sampleUser, `${window.location.origin}/verify.html?code=${sampleUser.certificateCode}`);
                } else {
                    const canvas = certPreviewCanvasRef.current;
                    canvas.width = 1200; canvas.height = 848;
                    const ctx = canvas.getContext('2d');
                    if (ctx) {
                        const creditLine = resolveCreditLineForAdmin(sampleUser, cneuConfig);
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1200, 848);
                        ctx.strokeStyle = '#c5a059'; ctx.lineWidth = 4; ctx.strokeRect(32, 32, 1136, 784);
                        ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'center';
                        ctx.font = '700 26px Prompt, sans-serif'; ctx.fillText(mergedTpl.orgTitleTH || '', 600, 130);
                        ctx.font = '700 44px Prompt, sans-serif'; ctx.fillText('ประกาศนียบัตร', 600, 240);
                        ctx.font = '700 42px Prompt, sans-serif'; ctx.fillText(sampleUser.name, 600, 350);
                        ctx.fillStyle = '#475569'; ctx.font = '500 22px Sarabun, sans-serif'; ctx.fillText(mergedTpl.courseTitleTH || '', 600, 440);
                        ctx.fillStyle = isNurse ? '#047857' : '#0369a1';
                        ctx.font = '700 20px Prompt, sans-serif';
                        ctx.fillText(creditLine, 600, 500);
                        ctx.fillStyle = '#1d1d1f'; ctx.font = '600 22px Prompt, sans-serif'; ctx.fillText(mergedTpl.signerName || '', 600, 690);
                    }
                }
            }, [activeTab, certSubTab, certPreviewProf, certTemplate, cneuConfig, liveConfig.hours]);

            // ============================================================================
            // 5. ACTION HANDLERS (AUTH, COURSE CATALOG, USERS, ONSITE, CERT, REPORTS, R2R)
            // ============================================================================
            const handleCopyOnsiteLink = () => {
                copyTextSafe(onsitePublicUrl);
                setOnsiteLinkCopied(true);
                showToast('คัดลอกลิงก์รับสมัคร Onsite สำหรับแนบหนังสือเชิญประชุมเรียบร้อยค่ะ');
                setTimeout(() => setOnsiteLinkCopied(false), 2400);
            };

            const handleDownloadOnsiteQr = (mode = 'poster') => {
                const ok = downloadOnsiteQrPng({ url: onsitePublicUrl, onsiteCfg: onsiteConfig, mode });
                showToast(
                    ok ? (mode === 'raw' ? 'ดาวน์โหลดไฟล์ QR Code ล้วน (PNG) เรียบร้อยค่ะ' : 'ดาวน์โหลดการ์ด QR Code พร้อมหัวข้อกิจกรรม (PNG) เรียบร้อยค่ะ') : 'ไม่สามารถสร้างไฟล์ QR Code ได้ในขณะนี้ค่ะ',
                    ok ? 'success' : 'error'
                );
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if (!isCloudConfigured || !fbAuth) {
                    showToast('ไม่พบการเชื่อมต่อฐานข้อมูล Firebase กรุณาตรวจสอบอินเทอร์เน็ตค่ะ', 'error');
                    return;
                }
                const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => x.toLowerCase());
                if (!allowed.includes(loginEmail.trim().toLowerCase())) {
                    showToast(`อนุญาตเฉพาะบัญชีผู้ดูแลระบบ (${CONFIG.contactEmail}) เท่านั้นค่ะ`, 'error');
                    return;
                }
                setLoginBusy(true);
                try {
                    await signInWithEmailAndPassword(fbAuth, loginEmail.trim(), loginPassword);
                    setAdminSession({ email: loginEmail.trim() });
                    showToast('เข้าสู่ศูนย์ควบคุม Admin Mission Control สำเร็จค่ะ');
                } catch (_) {
                    showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบใน Firebase Auth ค่ะ', 'error');
                } finally {
                    setLoginBusy(false);
                }
            };

            const handleAdminLogout = () => {
                if (fbAuth) signOut(fbAuth).catch(() => {});
                setAdminSession(null); setUsersList([]); setOnsiteRegistrants([]);
                showToast('ออกจากระบบผู้ดูแลแล้วค่ะ');
            };

            const persistSettings = async (patchObj, customMsg = 'บันทึกการตั้งค่าขึ้น Cloud เรียบร้อยค่ะ') => {
                if (!fbDb) { showToast('ไม่พบการเชื่อมต่อ Firestore ค่ะ', 'error'); return false; }
                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), patchObj, { merge: true });
                    showToast(customMsg);
                    return true;
                } catch (err) {
                    showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
                    return false;
                }
            };

            // Course Catalog Handlers (เพิ่ม / แก้ไข / เปิด-ปิด / ลบ ซิงค์สดไปหน้า index.html)
            const handleUpdateCourseField = (idx, field, val) => {
                setCourseCatalog(prev => prev.map((c, i) => (i === idx ? { ...c, [field]: val } : c)));
            };

            const handleToggleCourseActive = async (idx) => {
                const target = courseCatalog[idx];
                if (!target) return;
                const activeCount = courseCatalog.filter(c => c.active !== false).length;
                if (target.active !== false && activeCount <= 1) {
                    showToast('ต้องเปิดแสดงผลอย่างน้อย 1 หลักสูตรในระบบค่ะ', 'error');
                    return;
                }
                const nextCatalog = courseCatalog.map((c, i) => (i === idx ? { ...c, active: c.active === false } : c));
                setCourseCatalog(nextCatalog);
                await persistSettings(
                    { courseCatalog: nextCatalog },
                    nextCatalog[idx].active ? `เปิดแสดงหลักสูตร "${target.titleTH}" หน้าเว็บแล้วค่ะ` : `ซ่อนหลักสูตร "${target.titleTH}" จากหน้าลงทะเบียนแล้วค่ะ`
                );
            };

            const handleAddCourse = async (e) => {
                e.preventDefault();
                if (!newCourseForm.titleTH.trim()) {
                    showToast('กรุณากรอกชื่อหลักสูตร (ภาษาไทย) ค่ะ', 'error');
                    return;
                }
                const rawId = newCourseForm.id.trim() || `course_${Date.now().toString(36)}`;
                const cleanId = rawId.toLowerCase().replace(/[^a-z0-9_-]/g, '_');
                if (courseCatalog.some(c => c.id === cleanId)) {
                    showToast(`รหัส ID หลักสูตร "${cleanId}" ซ้ำกับหลักสูตรที่มีอยู่แล้วค่ะ`, 'error');
                    return;
                }
                const newItem = {
                    id: cleanId,
                    code: newCourseForm.code.trim().toUpperCase() || `RJC-${String(courseCatalog.length + 1).padStart(2, '0')}`,
                    titleTH: newCourseForm.titleTH.trim(),
                    titleEN: newCourseForm.titleEN.trim(),
                    subtitleTH: newCourseForm.subtitleTH.trim(),
                    trainingHours: Number(newCourseForm.trainingHours) || 8,
                    cneuCredits: String(newCourseForm.cneuCredits || '8.0').trim(),
                    active: Boolean(newCourseForm.active)
                };
                const nextCatalog = [...courseCatalog, newItem];
                setCourseCatalog(nextCatalog);

            const handleBatchSyncOnsiteToLearners = async () => {
                const activeList = filteredOnsiteRegistrants.filter(r => !r.revoked && !r.cancelled);
                if (activeList.length === 0) { showToast('ยังไม่มีผู้สมัคร Onsite ที่พร้อมซิงค์ในรายการนี้ค่ะ', 'info'); return; }

            const handleToggleOnsiteRevoke = (reg) => {
                const isCurrentlyCancelled = Boolean(reg.revoked || reg.cancelled);
                const nextCancelled = !isCurrentlyCancelled;
                const docKey = String(reg.id || reg.license || '').trim();
                const lic = String(reg.license || reg.id || '').trim().toUpperCase();
                askConfirm({
                    title: nextCancelled ? 'ยกเลิกสิทธิ์เทียบโอน (ไม่มาเซ็นชื่อหน้างาน)' : 'คืนสิทธิ์เทียบโอน Onsite',
                    message: nextCancelled
                        ? `ต้องการยกเลิกสิทธิ์เทียบโอนของ "${reg.name}" (${lic}) หรือไม่?`
                        : `ต้องการคืนสิทธิ์ "เทียบโอน (ยกเว้นชั่วโมง 100%)" ให้ "${reg.name}" หรือไม่?`,
                    danger: nextCancelled,
                    confirmText: nextCancelled ? 'ยกเลิกสิทธิ์เทียบโอน' : 'คืนสิทธิ์เทียบโอน',
                    onConfirm: async () => {
                        setOnsiteRegistrants(prev => prev.map(x => ((x.id || x.license) === docKey ? { ...x, revoked: nextCancelled, cancelled: nextCancelled, status: nextCancelled ? 'cancelled' : 'confirmed' } : x)));

                                    revoked: nextCancelled, cancelled: nextCancelled, status: nextCancelled ? 'cancelled' : 'confirmed'
                                }, { merge: true });
                                await setDoc(
                                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', lic),
                                    nextCancelled
                                        ? { studyHoursExempt: false, userType: 'เรียนใหม่', classificationCode: 'NEW_LEARNER', hoursStatusLabel: 'กำลังสะสมชั่วโมง', progress: 0 }
                                        : { studyHoursExempt: true, userType: 'เทียบโอน', classificationCode: 'CREDIT_TRANSFER', progress: 100, hoursStatusLabel: 'เทียบโอน (ยกเว้นชั่วโมง 100%)', hoursActivityName: reg.eventName || onsiteConfig.activityTitle, onsiteUnlockAt: onsiteConfig.unlockAt, onsiteForceUnlocked: Boolean(onsiteConfig.forceUnlocked) },
                                    { merge: true }
                                );
                            } catch (err) { showToast('อัปเดตไม่สำเร็จ: ' + err.message, 'error'); return; }
                        }
                        showToast(nextCancelled ? 'ยกเลิกสิทธิ์เทียบโอนเรียบร้อยค่ะ' : 'คืนสิทธิ์เทียบโอนเรียบร้อยค่ะ');
                    }
                });
            };

            const handleRebuildGlobalSummary = async () => {
                if (!fbDb) return;
                setRebuildingSummary(true);
                try {
                    const summary = {
                        totalUsers: usersList.length, passedUsers: 0, labUsers: 0,
                        csatSum: 0, csatCount: 0, skillScoreSum: 0, skillScoreCount: 0,
                        susSum: 0, susCount: 0, preEffSum: 0, preEffCount: 0, postEffSum: 0, postEffCount: 0,
                        updatedAt: new Date().toISOString()
                    };
                    usersList.forEach(u => {
                        const rId = resolveRegionId(u.department);
                        summary[`region_${rId}`] = (summary[`region_${rId}`] || 0) + 1;
                        if (parsePosttestPassed(u)) {
                            summary.passedUsers += 1;
                            summary[`region_${rId}_passed`] = (summary[`region_${rId}_passed`] || 0) + 1;
                        }
                        const st = getUserFiveStepStatus(u);
                        if (st.step3Lab) summary.labUsers += 1;
                        if (st.bestLab !== null) { summary.skillScoreSum += st.bestLab; summary.skillScoreCount += 1; }
                        if (typeof u.satisfactionScore === 'number' && u.satisfactionScore > 0) { summary.csatSum += u.satisfactionScore; summary.csatCount += 1; }
                        if (typeof u.susScore === 'number' && u.susScore >= 0) { summary.susSum += u.susScore; summary.susCount += 1; }
                        if (typeof u.preSelfEfficacyAvg === 'number' && u.preSelfEfficacyAvg > 0) { summary.preEffSum += u.preSelfEfficacyAvg; summary.preEffCount += 1; }
                        if (typeof u.postSelfEfficacyAvg === 'number' && u.postSelfEfficacyAvg > 0) { summary.postEffSum += u.postSelfEfficacyAvg; summary.postEffCount += 1; }
                    });
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_summary', 'global'), summary);
                    showToast('คำนวณและบันทึกเอกสารสรุป 1-Read (executive_summary/global) เรียบร้อยค่ะ');
                } catch (err) {
                    showToast('สร้างเอกสารสรุปไม่สำเร็จ: ' + err.message, 'error');
                } finally {

            const handleExportCSV = () => {

                    'ตำแหน่ง', 'สังกัด', 'หน่วยงาน/โรงพยาบาล', 'ประเภทผู้เรียน',
                    'สถานะปัจจุบัน', 'สถานะชั่วโมงอบรม', 'กิจกรรมอ้างอิงชั่วโมง',
                    'สถานะสอบ', 'Pretest', 'Posttest', 'ความคืบหน้า (%)',
                    'AI Skill Lab Score', 'ความมั่นใจก่อนฝึก (1-5)', 'ความมั่นใจหลังฝึก (1-5)',

                ];

                    const st = getUserFiveStepStatus(u);

                        u.name, prof, isNurseCneuUser(u) ? 'ใช่ (พยาบาล)' : 'ไม่ใช่', getUserLicense(u), u.email, u.phone,

                        info.statusLabel, info.hoursLabel, info.activityName || '-',

                        u.susScore ?? '-', u.satisfactionScore || '-', u.certificateCode || '-'
                    ].map(escapeCsvCell).join(',');
                });
                triggerCsvDownload(`organ_cloud_learners_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                showToast(`ส่งออกไฟล์ CSV ผู้เรียน ${usersList.length} รายเรียบร้อยค่ะ`);
            };

            const handleExportBlindTranscriptCsv = () => {
                const headers = ['Blind_Case_ID', 'Case_ID', 'Difficulty', 'AI_Supervisor_Score', 'Decision', 'Silence_2_5s_Count', 'Trigger_Words', 'Pre_SelfEfficacy', 'Post_SelfEfficacy', 'Blind_Transcript_ZeroPII'];
                const rows = [];

                    (Array.isArray(u.skillLabHistory) ? u.skillLabHistory : []).forEach(h => {

                            `CASE-${String(caseNo).padStart(3, '0')}`, h.caseId || h.personaId || '-', h.difficultyId || 'normal',
                            h.score ?? '-', h.decisionCode || '-', h.silenceCount ?? 0, h.triggerTotal ?? 0,
                            h.preSelfEfficacyAvg ?? u.preSelfEfficacyAvg ?? '-', h.postSelfEfficacyAvg ?? u.postSelfEfficacyAvg ?? '-',
                            Array.isArray(h.blindTranscript) ? h.blindTranscript.map(t => `[T${t.turn} ${t.role}]: ${t.text}`).join(' | ') : '-'
                        ].map(escapeCsvCell).join(','));

                triggerCsvDownload(`organ_cloud_R2R_SkillLab_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                showToast(`ส่งออกข้อมูลวิจัย R2R (${rows.length} รอบฝึก • Zero-PII) เรียบร้อยแล้วค่ะ`);
            };

            // ============================================================================
            // 6. COMPUTED STATS, ONSITE ARCHIVE & PROFESSION-FILTERED CNEU REPORTS
            // ============================================================================
            const quickStats = useMemo(() => {
                let passed = 0, lab = 0, exempt = 0, csatSum = 0, csatN = 0, susSum = 0, susN = 0;
                let preEffSum = 0, preEffN = 0, postEffSum = 0, postEffN = 0;
                usersList.forEach(u => {
                    if (parsePosttestPassed(u)) passed += 1;
                    if (getUserFiveStepStatus(u).step3Lab) lab += 1;
                    if (isHoursExemptUser(u)) exempt += 1;
                    if (typeof u.satisfactionScore === 'number' && u.satisfactionScore > 0) { csatSum += u.satisfactionScore; csatN += 1; }
                    if (typeof u.susScore === 'number' && u.susScore >= 0) { susSum += u.susScore; susN += 1; }
                    if (typeof u.preSelfEfficacyAvg === 'number' && u.preSelfEfficacyAvg > 0) { preEffSum += u.preSelfEfficacyAvg; preEffN += 1; }
                    if (typeof u.postSelfEfficacyAvg === 'number' && u.postSelfEfficacyAvg > 0) { postEffSum += u.postSelfEfficacyAvg; postEffN += 1; }
                });
                return {
                    total: usersList.length, passed, lab, exempt,
                    avgCsat: csatN > 0 ? (csatSum / csatN).toFixed(1) : '-',
                    avgSus: susN > 0 ? Math.round(susSum / susN) : '-',
                    preEff: preEffN > 0 ? (preEffSum / preEffN).toFixed(2) : '-',
                    postEff: postEffN > 0 ? (postEffSum / postEffN).toFixed(2) : '-'
                };
            }, [usersList]);

            const visibleUsers = useMemo(() => {
                const q = searchTerm.trim().toLowerCase();
                return usersList.filter(u => {
                    const exempt = isHoursExemptUser(u);
                    const prof = resolveProfessionGroupSafe(u);
                    if (filterProf !== 'ALL' && prof !== filterProf) return false;
                    const matchFilter =
                        filterType === 'ALL' ||
                        (filterType === 'เรียนใหม่' && !exempt) ||
                        (filterType === 'EXEMPT' && exempt) ||
                        (filterType === 'PASSED' && parsePosttestPassed(u));
                    if (!matchFilter) return false;
                    if (!q) return true;
                    return (
                        String(u.name || '').toLowerCase().includes(q) ||
                        String(u.hospital || '').toLowerCase().includes(q) ||
                        String(u.hoursActivityName || '').toLowerCase().includes(q) ||
                        prof.toLowerCase().includes(q) ||
                        getUserLicense(u).toLowerCase().includes(q)
                    );
                });
            }, [usersList, searchTerm, filterType, filterProf]);

            const onsiteEventIds = useMemo(() => {
                const set = new Set();
                if (onsiteConfig.eventId) set.add(onsiteConfig.eventId);
                onsiteRegistrants.forEach(r => { if (r.eventId) set.add(r.eventId); });
                return Array.from(set);
            }, [onsiteConfig.eventId, onsiteRegistrants]);

            const filteredOnsiteRegistrants = useMemo(() => {
                const q = onsiteSearch.trim().toLowerCase();
                return onsiteRegistrants
                    .filter(r => {
                        if (onsiteEventFilter !== 'ALL' && String(r.eventId || '') !== onsiteEventFilter) return false;
                        if (onsiteFilterProf !== 'ALL' && r.professionGroup !== onsiteFilterProf) return false;
                        if (q) {
                            const hay = `${r.name} ${r.license} ${r.hospital} ${r.province} ${r.region} ${r.professionGroup} ${r.eventId || ''}`.toLowerCase();
                            if (!hay.includes(q)) return false;
                        }
                        return true;

                                    <div className="spatial-card rounded-2xl p-4"><span className="text-muted-adaptive block">สำเร็จหลักสูตร</span><span className="font-mono text-2xl font-extrabold text-accent-adaptive">{quickStats.passed}</span></div>
                                    <div className="spatial-card rounded-2xl p-4"><span className="text-muted-adaptive block">SUS / CSAT</span><span className="font-mono text-lg font-extrabold text-amber-adaptive">{quickStats.avgSus} / {quickStats.avgCsat}</span></div>
                                    <div className="spatial-card rounded-2xl p-4"><span className="text-muted-adaptive block">ความมั่นใจ Pre→Post</span><span className="font-mono text-lg font-extrabold text-accent-adaptive">{quickStats.preEff}→{quickStats.postEff}</span></div>

                                {showAddUser && (

                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            <FieldInput label="คำนำหน้า ชื่อ–นามสกุล *" required value={manualForm.name} onChange={e => setManualForm(p => ({ ...p, name: e.target.value }))} />
                                            <FieldInput label="เลขที่ใบอนุญาตประกอบวิชาชีพ *" required value={manualForm.license} onChange={e => setManualForm(p => ({ ...p, license: e.target.value }))} />
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">กลุ่มวิชาชีพ *</label>
                                                <select value={manualForm.professionGroup} onChange={e => setManualForm(p => ({ ...p, professionGroup: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm font-bold">

                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">สิทธิ์ชั่วโมงการเรียน</label>
                                                <select value={manualForm.userType} onChange={e => setManualForm(p => ({ ...p, userType: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm">
                                                    <option value="เรียนใหม่">เรียนใหม่ (สะสมชั่วโมง ≥ 80%)</option>
                                                    <option value="เทียบโอน">เทียบโอน (ยกเว้นชั่วโมง 100%)</option>
                                                </select>
                                            </div>
                                            <FieldInput label="โรงพยาบาล / หน่วยงาน" value={manualForm.hospital} onChange={e => setManualForm(p => ({ ...p, hospital: e.target.value }))} />

                                            <FieldInput label="อีเมล" type="email" value={manualForm.email} onChange={e => setManualForm(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" />

                                            )}
                                        </div>
                                        <div className="flex justify-end gap-2 pt-1">
                                            <button type="button" onClick={() => setShowAddUser(false)} className="spatial-soft px-4 py-2 rounded-xl text-xs font-bold text-secondary-adaptive">ยกเลิก</button>

                                        </div>
                                    </form>
                                )}

                                <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-4">
                                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-2.5">

                                            <Icon name="Search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-adaptive" />
                                            <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="ค้นหาชื่อ, เลขใบอนุญาต, กลุ่มวิชาชีพ, โรงพยาบาล หรือชื่อกิจกรรม..." className="touch-target spatial-input w-full pl-10 pr-4 py-2 rounded-2xl text-sm" />

                                                {PROFESSION_LIST.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                            {[
                                                { id: 'ALL', label: `ทั้งหมด (${usersList.length})` },
                                                { id: 'EXEMPT', label: `เทียบโอน (${quickStats.exempt})` },
                                                { id: 'PASSED', label: `ผ่าน (${quickStats.passed})` }

                                                <button key={f.id} type="button" onClick={() => setFilterType(f.id)} className={`neu-btn px-3.5 py-2 text-xs font-bold shrink-0 ${filterType === f.id ? 'is-pressed' : ''}`}>

                                                </button>

                                                    <th className="py-3 px-3">ความคืบหน้า 5 ขั้นตอน</th>

                                                </tr>
                                            </thead>
                                            <tbody className="neu-divide text-xs">
                                                {visibleUsers.map(u => {
                                                    const lic = getUserLicense(u);
                                                    const st = getUserFiveStepStatus(u);
                                                    const info = resolveLearnerStatusInfo(u);
                                                    const clsBadge = resolveClassificationBadge(u);
                                                    const prof = resolveProfessionGroupSafe(u);
                                                    const isNurse = isNurseCneuUser(u);
                                                    return (
                                                        <tr key={u.id || lic} className="transition-colors">
                                                            <td className="py-3.5 px-4">
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    <p className="font-display font-bold text-sm text-primary-adaptive">{u.name || 'ไม่ระบุชื่อ'}</p>
                                                                    <span className={`px-2.5 py-0.5 rounded-full border font-mono text-[10px] font-bold ${clsBadge.cls}`}>{clsBadge.label}</span>
                                                                </div>
                                                                <p className="text-[11px] text-muted-adaptive">
                                                                    <span className="font-mono text-prism-adaptive">{lic}</span> • {u.hospital || '-'} • <span className="text-accent-adaptive font-semibold">{info.statusLabel}</span>
                                                                </p>
                                                                {info.activityName && (
                                                                    <p className="text-[10.5px] text-secondary-adaptive mt-0.5 truncate max-w-xs" title={info.activityName}>
                                                                        {info.hoursLabel} — {info.activityName}

                                                                )}
                                                            </td>
                                                            <td className="py-3.5 px-3">
                                                                <select
                                                                    value={prof}
                                                                    onChange={e => {
                                                                        const nextProf = e.target.value;
                                                                        handleUpdateUser(u, { professionGroup: nextProf, cneuEligible: nextProf === 'พยาบาล' });
                                                                    }}
                                                                    className="spatial-input px-2.5 py-1.5 rounded-xl text-xs font-bold block"
                                                                >
                                                                    {PROFESSION_LIST.map(p => <option key={p} value={p}>{p}</option>)}
                                                                </select>
                                                                <span className={`font-mono text-[10px] font-bold block mt-1 ${isNurse ? 'text-accent-adaptive' : 'text-muted-adaptive'}`}>
                                                                    {isNurse ? '● รับสิทธิ์ CNEU' : '○ ชั่วโมงอบรมมาตรฐาน'}
                                                                </span>
                                                            </td>
                                                            <td className="py-3.5 px-3">
                                                                <FiveStepTelemetryPills u={u} onToggleLab={() => handleUpdateUser(u, { skillLabPassed: !st.step3Lab })} />
                                                            </td>
                                                            <td className="py-3.5 px-3 font-mono font-bold text-secondary-adaptive">
                                                                <span>{u.pretest || '-'}</span><span className="mx-1 text-muted-adaptive">/</span><span className={st.step4Post ? 'text-accent-adaptive' : ''}>{u.posttest || '-'}</span>
                                                            </td>
                                                            <td className="py-3.5 px-4 text-right">
                                                                <div className="inline-flex items-center gap-1.5">
                                                                    <button type="button" onClick={() => handleOpenTransferModal(u)} className="neu-btn px-3 py-1.5 text-prism-adaptive font-bold text-[11px]">เทียบโอน</button>
                                                                    <button type="button" onClick={() => handleUpdateUser(u, { status: u.status === 'ผ่าน' ? 'กำลังเรียน' : 'ผ่าน' })} className={`neu-btn px-3 py-1.5 font-bold text-[11px] ${u.status === 'ผ่าน' ? 'is-pressed' : ''}`}>
                                                                        {u.status === 'ผ่าน' ? 'ผ่านแล้ว ✓' : 'กำลังเรียน'}
                                                                    </button>
                                                                    <button type="button" onClick={() => handleDeleteUser(u)} className="neu-btn w-8 h-8 text-rose-adaptive" title="ลบผู้เรียน">
                                                                        <Icon name="Trash2" size={14} />
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {visibleUsers.length === 0 && (
                                                    <tr><td colSpan="5" className="py-10 text-center text-muted-adaptive">ไม่พบรายชื่อผู้เรียนตามเงื่อนไขที่ค้นหาค่ะ</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>

                                    <div className="md:hidden neu-divide">
                                        {visibleUsers.map(u => {
                                            const lic = getUserLicense(u);
                                            const st = getUserFiveStepStatus(u);
                                            const info = resolveLearnerStatusInfo(u);
                                            const clsBadge = resolveClassificationBadge(u);
                                            const prof = resolveProfessionGroupSafe(u);
                                            return (
                                                <div key={u.id || lic} className="py-3.5 space-y-2.5">
                                                    <div className="flex items-start justify-between gap-2">
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                <p className="font-display font-bold text-sm text-primary-adaptive truncate">{u.name || 'ไม่ระบุชื่อ'}</p>
                                                                <span className={`px-2 py-0.5 rounded-full border font-mono text-[10px] font-bold ${clsBadge.cls}`}>{clsBadge.label}</span>
                                                            </div>
                                                            <p className="text-xs text-muted-adaptive truncate"><span className="font-mono text-prism-adaptive">{lic}</span> • {prof} • {u.hospital || '-'}</p>
                                                            <p className="text-[11px] font-semibold text-accent-adaptive truncate">สถานะ: {info.statusLabel}</p>
                                                        </div>
                                                        <button type="button" onClick={() => handleDeleteUser(u)} className="neu-btn w-9 h-9 text-rose-adaptive shrink-0"><Icon name="Trash2" size={14} /></button>
                                                    </div>
                                                    <FiveStepTelemetryPills u={u} onToggleLab={() => handleUpdateUser(u, { skillLabPassed: !st.step3Lab })} />
                                                    <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                                                        <button type="button" onClick={() => handleOpenTransferModal(u)} className="neu-btn px-3 py-1.5 text-prism-adaptive font-bold text-xs">กิจกรรม/เทียบโอน</button>
                                                        <button type="button" onClick={() => handleUpdateUser(u, { status: u.status === 'ผ่าน' ? 'กำลังเรียน' : 'ผ่าน' })} className={`neu-btn px-3.5 py-1.5 font-bold text-xs ${u.status === 'ผ่าน' ? 'is-pressed' : ''}`}>
                                                            {u.status === 'ผ่าน' ? 'ผ่านแล้ว ✓' : 'กำลังเรียน'}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ==================== TAB 2: ONSITE REGISTRATION HUB (TARGET COURSE + 16:00 UNLOCK + ARCHIVE) ==================== */}
                        {activeTab === 'onsite' && (
                            <div key="tab_onsite" className="oc-screen-enter space-y-5">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <span className="px-3 py-1 rounded-full bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] text-accent-adaptive font-mono text-[10px] font-bold">CENTRAL ONSITE HUB • MULTI-COURSE LINKING</span>

                                        <a href="./onsite.html" target="_blank" rel="noreferrer" className="neu-btn touch-target px-4 py-2.5 font-display font-bold text-xs">

                                    <div className="lg:col-span-8 space-y-3.5">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">INVITATION QR &amp; DIGITAL ONSITE PASS</span>

                                            </p>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <input readOnly value={onsitePublicUrl} onFocus={e => e.target.select()} className="touch-target spatial-input flex-1 px-3.5 py-2.5 rounded-2xl font-mono text-xs sm:text-sm font-bold text-prism-adaptive" />
                                            <button type="button" onClick={handleCopyOnsiteLink} className="rjc2-pill-btn touch-target px-5 py-2.5 font-display font-extrabold text-xs inline-flex items-center justify-center gap-1.5 shrink-0">
                                                <Icon name={onsiteLinkCopied ? 'Check' : 'Copy'} size={15} />
                                                <span>{onsiteLinkCopied ? 'คัดลอกลิงก์แล้ว ✓' : 'Copy Link รับสมัคร'}</span>
                                            </button>
                                        </div>

                                                <Icon name="Download" size={15} /> ดาวน์โหลดโปสเตอร์ QR (PNG)
                                            </button>
                                            <button type="button" onClick={() => handleDownloadOnsiteQr('raw')} className="neu-btn touch-target px-4 py-2.5 font-display font-bold text-xs text-prism-adaptive">

                                    </div>

                                    <div className="spatial-card rounded-2xl p-4"><span className="text-muted-adaptive block">แพทย์</span><span className="font-mono text-2xl font-extrabold text-prism-adaptive">{onsiteStats.doctor}</span></div>
                                    <div className="spatial-card rounded-2xl p-4"><span className="text-muted-adaptive block">พยาบาล</span><span className="font-mono text-2xl font-extrabold text-accent-adaptive">{onsiteStats.nurse}</span></div>
                                    <div className="spatial-card rounded-2xl p-4"><span className="text-muted-adaptive block">สหวิชาชีพ</span><span className="font-mono text-2xl font-extrabold text-amber-adaptive">{onsiteStats.allied}</span></div>
                                    <div className="col-span-2 sm:col-span-1 spatial-card rounded-2xl p-4"><span className="text-muted-adaptive block">ยกเลิก (No-show)</span><span className="font-mono text-2xl font-extrabold text-rose-adaptive">{onsiteStats.revoked}</span></div>
