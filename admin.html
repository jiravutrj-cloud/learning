    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Anuphan', 'Sarabun', sans-serif;
        font-size: 16px;

        background-color: var(--bg-page);
        color: var(--text-main);
        margin: 0;
        overflow-x: hidden;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.28s ease, color 0.28s ease;

      /* ยกระดับขนาดฟอนต์ภาษาไทยส่วนคำอธิบายย่อยให้อ่านสบายตา */

      @media (max-width: 768px) {
        input, select, textarea { font-size: 16px !important; }
      }

      /* Atmospheric Horizon Ambient Backdrop */
      .spatial-aura {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(ellipse 90% 55% at 50% 108%, var(--aura-1) 0%, transparent 66%),
          radial-gradient(circle at 86% 14%, var(--aura-2) 0%, transparent 48%),
          radial-gradient(circle at 14% 28%, var(--aura-3) 0%, transparent 46%);
        pointer-events: none;
      }
      .spatial-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at center, black 42%, transparent 94%);
        pointer-events: none;
      }

      /* Semantic Spatial Glass Utilities */
      .spatial-card {
        background: var(--glass-bg);
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      .spatial-sidebar {
        background: var(--sidebar-bg);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border-right: 1px solid var(--surface-border);
      }
      .spatial-header {
        background: var(--header-bg);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border-bottom: 1px solid var(--surface-border);
      }
      .spatial-dock {
        background: var(--dock-bg);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border-top: 1px solid var(--surface-border);
      }
      .spatial-soft {
        background: var(--surface-soft);
        border: 1px solid var(--surface-border);
      }
      .spatial-soft:hover {
        background: var(--surface-soft-hover);
      }
      .spatial-input {
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--input-text);
      }
      .spatial-input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
      }
      .spatial-thead {
        background: var(--table-head-bg);

      }

        function parseRawExams(raw) {
            if (!raw || !Array.isArray(raw)) return [];
            const domMap = Array.isArray(window.QUESTION_DOMAIN_MAP) ? window.QUESTION_DOMAIN_MAP : [];
            return raw.map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    origIdx: idx,
                    domain: domMap[idx] || 'policy_ethics',
                    question: parts[0] ? parts[0].replace(/^[0-9]+\.\s*/, '') : '',
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW)];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [parseRawExams(FALLBACK_QUIZ_RAW)];
        }

        function escapeCsvCell(val) {
            const str = val === null || val === undefined ? '' : String(val);
            return `"${str.replace(/"/g, '""')}"`;
        }

        function getUserLicense(u) {
            return String(u?.license || u?.licenseId || u?.id || '').trim();
        }

        function parsePosttestPassed(u) {
            if (u?.status === 'ผ่าน') return true;
            const m = String(u?.posttest || '').match(/(\d+)\s*\/\s*(\d+)/);
            if (!m) return false;
            const score = parseInt(m[1], 10);
            const total = parseInt(m[2], 10) || 1;
            return (score / total) >= (MIN_POSTTEST_PERCENT / 100);
        }

        function parsePosttestPercent(u) {
            const m = String(u?.posttest || '').match(/(\d+)\s*\/\s*(\d+)/);
            if (!m) return u?.status === 'ผ่าน' ? MIN_POSTTEST_PERCENT : 0;
            const score = parseInt(m[1], 10);
            const total = parseInt(m[2], 10) || 1;
            return Math.round((score / total) * 100);
        }

        function formatStudyHoursShort(seconds) {
            const sec = Math.max(0, Math.floor(Number(seconds || 0)));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            if (h > 0) return `${h} ชม. ${m} น.`;
            return `${m} น.`;
        }

        function formatThaiShortDate(isoStr) {
            if (!isoStr) return '-';
            try {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return '-';
                return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });
            } catch (_) {
                return '-';
            }
        }

        function formatThaiFullDate(dateObj = new Date()) {
            return dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function getUserFiveStepStatus(u) {
            const step1Pre = Boolean(u?.pretest && u.pretest !== '-');
            const step2Hours = Number(u?.progress || 0) >= MIN_STUDY_PERCENT;
            const step3Lab = Boolean(u?.skillLabPassed || (Array.isArray(u?.skillLabHistory) && u.skillLabHistory.length > 0));
            const step4Post = parsePosttestPassed(u);
            const step5Cert = Boolean(u?.certificateClaimed || u?.certificateCode);
            const hist = Array.isArray(u?.skillLabHistory) ? u.skillLabHistory : [];
            const bestLab = typeof u?.skillLabBestScore === 'number'
                ? u.skillLabBestScore
                : (hist.length > 0 ? Math.max(...hist.map(h => h.score || 0)) : null);
            return { step1Pre, step2Hours, step3Lab, step4Post, step5Cert, bestLab };
        }

        function loadImageSafe(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        /**
         * วาดพรีวิวใบประกาศนียบัตรสไตล์มินิมอลเรียบหรู (Apple Minimalist — พื้นสีขาว ตัดเส้นสายสีทองบางเฉียบ)
         * ตรงกับต้นแบบประกาศนียบัตรจริงในหน้า index.html 100%
         */
        async function drawMiniCertPreview(canvas, tpl) {
            if (!canvas) return;
            const W = 1200, H = 848;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const [logoImg, sigImg] = await Promise.all([
                loadImageSafe(tpl.logoUrl),
                loadImageSafe(tpl.signatureUrl)
            ]);

            // 1. พื้นหลังสีขาวบริสุทธิ์
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            // 2. เส้นกรอบสีทองเมทัลลิกแบบบางเฉียบ (Double Hairline Gold Frame)
            const goldGrad = ctx.createLinearGradient(0, 0, W, H);
            goldGrad.addColorStop(0, '#b89242');
            goldGrad.addColorStop(0.35, '#e2c785');
            goldGrad.addColorStop(0.7, '#c5a059');
            goldGrad.addColorStop(1, '#a67f32');

            ctx.strokeStyle = goldGrad;
            ctx.lineWidth = 1.8;
            ctx.strokeRect(32, 32, W - 64, H - 64);

            ctx.strokeStyle = 'rgba(197, 160, 89, 0.42)';
            ctx.lineWidth = 0.9;
            ctx.strokeRect(44, 44, W - 88, H - 88);

            // 3. เส้นมุมเรขาคณิตสีทองบางเฉียบ 4 มุม
            const cLen = 28, inset = 56;
            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 1.5;
            [
                [inset, inset, 1, 1],
                [W - inset, inset, -1, 1],
                [inset, H - inset, 1, -1],
                [W - inset, H - inset, -1, -1]
            ].forEach(([cx, cy, dx, dy]) => {
                ctx.beginPath();
                ctx.moveTo(cx + dx * cLen, cy);
                ctx.lineTo(cx, cy);
                ctx.lineTo(cx, cy + dy * cLen);
                ctx.stroke();
            });

            // 4. แถบเส้นทองบางด้านบน หรือ โลโก้หน่วยงาน
            let topY = 108;
            if (logoImg) {
                const maxH = 54;
                const drawW = maxH * (logoImg.width / (logoImg.height || 1));
                ctx.drawImage(logoImg, W / 2 - drawW / 2, 62, drawW, maxH);
                topY = 144;
            } else {
                const barGrad = ctx.createLinearGradient(W / 2 - 44, 0, W / 2 + 44, 0);
                barGrad.addColorStop(0, 'rgba(197, 160, 89, 0.15)');
                barGrad.addColorStop(0.5, '#c5a059');
                barGrad.addColorStop(1, 'rgba(197, 160, 89, 0.15)');
                ctx.fillStyle = barGrad;
                ctx.fillRect(W / 2 - 44, 74, 88, 1.8);
            }

            ctx.textAlign = 'center';

            // 5. ชื่อหน่วยงาน
            ctx.fillStyle = '#1d1d1f';
            ctx.font = '600 17px "Prompt", sans-serif';
            ctx.fillText(tpl.orgTitleTH || '', W / 2, topY);

            ctx.fillStyle = '#86868b';
            ctx.font = '500 11px "JetBrains Mono", monospace';
            ctx.fillText(tpl.orgTitleEN || '', W / 2, topY + 23);

            // 6. หัวข้อประกาศนียบัตร
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 12px "JetBrains Mono", monospace';
            ctx.fillText('C E R T I F I C A T E   O F   C O M P L E T I O N', W / 2, topY + 64);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 41px "Prompt", sans-serif';
            ctx.fillText('ประกาศนียบัตร', W / 2, topY + 112);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 17px "Sarabun", sans-serif';
            ctx.fillText(tpl.subtitleTH || '', W / 2, topY + 148);

            // 7. พื้นที่แสดงชื่อผู้สำเร็จการอบรม + เส้นทองบางคั่นด้านล่าง
            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 42px "Prompt", sans-serif';
            ctx.fillText('ชื่อ - นามสกุล ผู้สำเร็จการอบรม', W / 2, topY + 206);

            const nameRule = ctx.createLinearGradient(W / 2 - 126, 0, W / 2 + 126, 0);
            nameRule.addColorStop(0, 'rgba(197, 160, 89, 0)');
            nameRule.addColorStop(0.25, '#c5a059');
            nameRule.addColorStop(0.75, '#e2c785');
            nameRule.addColorStop(1, 'rgba(197, 160, 89, 0)');
            ctx.fillStyle = nameRule;
            ctx.fillRect(W / 2 - 126, topY + 222, 252, 1.4);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 15px "Sarabun", sans-serif';
            ctx.fillText('โรงพยาบาล / หน่วยงานต้นสังกัด   •   เลขที่ใบอนุญาตวิชาชีพ', W / 2, topY + 252);

            // 8. ข้อความรับรองและชื่อหลักสูตร
            ctx.fillStyle = '#424245';
            ctx.font = '500 17px "Sarabun", sans-serif';
            ctx.fillText(tpl.completionTextTH || '', W / 2, topY + 294);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 21px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleTH || '', W / 2, topY + 332);

            ctx.fillStyle = '#a8843b';
            ctx.font = '500 13px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleEN || '', W / 2, topY + 358);

            // 9. ส่วนลายเซ็นกึ่งกลาง (เส้นทองบาง)
            const sigBaseY = H - 142;
            if (sigImg) {
                const sigH = 52;
                const sigW = sigH * (sigImg.width / (sigImg.height || 1));
                ctx.drawImage(sigImg, W / 2 - sigW / 2, sigBaseY - 58, sigW, sigH);
            }

            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 120, sigBaseY);
            ctx.lineTo(W / 2 + 120, sigBaseY);
            ctx.stroke();

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '600 17px "Prompt", sans-serif';
            ctx.fillText(tpl.signerName || '', W / 2, sigBaseY + 28);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 13px "Sarabun", sans-serif';
            ctx.fillText(tpl.signerPosition || '', W / 2, sigBaseY + 50);

            // 10. รหัสอ้างอิงมุมซ้ายล่าง (ตัดเส้นทองแนวตั้งบางเฉียบ)
            ctx.fillStyle = '#c5a059';
            ctx.fillRect(74, H - 130, 1.8, 46);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 10px "JetBrains Mono", monospace';
            ctx.fillText('CERTIFICATE NO.', 86, H - 118);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 13px "JetBrains Mono", monospace';
            ctx.fillText(`${tpl.certPrefix || 'RJC-2027'}-XXXXXX`, 86, H - 100);

            ctx.fillStyle = '#86868b';
            ctx.font = '500 11px "Sarabun", sans-serif';
            ctx.fillText('ตรวจสอบความถูกต้องผ่าน QR Code ที่ rjcloud.organ', 86, H - 82);

            // 11. กล่อง QR Code มุมขวาล่าง (กรอบเส้นทองบางมินิมอล)
            const qrSize = 104;
            const qrX = W - 76 - qrSize;
            const qrY = H - 92 - qrSize;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = 'rgba(197, 160, 89, 0.65)';
            ctx.lineWidth = 1.2;
            ctx.fillRect(qrX - 8, qrY - 8, qrSize + 16, qrSize + 16);
            ctx.strokeRect(qrX - 8, qrY - 8, qrSize + 16, qrSize + 16);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 11px "JetBrains Mono", monospace';
            ctx.fillText('QR VERIFY', qrX + qrSize / 2, qrY + qrSize / 2 + 4);

            ctx.font = '600 9px "JetBrains Mono", monospace';
            ctx.fillText('SCAN TO VERIFY', qrX + qrSize / 2, qrY + qrSize + 22);
        }

        function FiveStepTelemetryPills({ u, onToggleLab }) {
            const st = getUserFiveStepStatus(u);
            const pills = [
                { key: 'pre', label: 'Pre', done: st.step1Pre, title: `Pre-test: ${u.pretest || '-'}` },
                { key: 'hr', label: `${u.progress || 0}%`, done: st.step2Hours, title: `เวลาเรียนสะสม (เกณฑ์ ≥${MIN_STUDY_PERCENT}%)` },
                { key: 'lab', label: st.bestLab ? `Lab ${st.bestLab}` : 'Lab', done: st.step3Lab, clickable: true, title: 'คลิกเพื่อสลับสถานะการผ่าน AI Skill Lab' },
                { key: 'post', label: 'Post', done: st.step4Post, title: `Post-test: ${u.posttest || '-'}` },
                { key: 'cert', label: 'Cert', done: st.step5Cert, title: u.certificateCode ? `รหัส: ${u.certificateCode}` : 'ยังไม่ออกใบประกาศฯ' }
            ];
            return (
                <div className="flex flex-wrap items-center gap-1">
                    {pills.map(p => {
                        const cls = `px-2 py-1 rounded-lg font-mono text-[10px] font-bold border transition-all inline-flex items-center gap-1 ${
                            p.done
                                ? 'bg-aurora-500/20 border-aurora-400/45 text-accent-adaptive'
                                : 'spatial-soft text-muted-adaptive'
                        }`;
                        if (p.clickable && onToggleLab) {
                            return (
                                <button key={p.key} type="button" onClick={onToggleLab} title={p.title} className={`${cls} hover:border-violet-400 cursor-pointer`}>
                                    <span>{p.done ? '✓' : '○'}</span>
                                    <span>{p.label}</span>
                                </button>
                            );
                        }
                        return (
                            <span key={p.key} title={p.title} className={cls}>
                                <span>{p.done ? '✓' : '○'}</span>
                                <span>{p.label}</span>
                            </span>
                        );
                    })}
                </div>
            );
        }

                }
                if (!fbDb) {
                    if (isManual) showToast('ไม่พบการเชื่อมต่อฐานข้อมูล Firestore ค่ะ', 'error');
                    return;
                }
                setIsSyncing(true);
                if (isManual) showToast('กำลังดึงรายชื่อและสิทธิ์ผู้เรียนจาก Google Sheets...', 'info');
                try {
                    const sep = systemConfig.masterCsvUrl.includes('?') ? '&' : '?';
                    const res = await fetch(`${systemConfig.masterCsvUrl}${sep}t=${Date.now()}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error('ไม่สามารถโหลดไฟล์ CSV ได้');
                    const text = await res.text();
                    const rows = text.split(/\r?\n/).filter(r => r.trim());
                    if (rows.length <= 1) {
                        if (isManual) showToast('ไม่พบข้อมูลผู้เรียนในตาราง CSV ค่ะ', 'error');
                        return;
                    }

                    const currentUsers = usersListRef.current;
                    let added = 0, updated = 0;
                    const existingMap = new Map(currentUsers.map(u => [getUserLicense(u), u]));

                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i]
                            .split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                            .map(c => c.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));

                        const license = String(cols[2] || '').replace(/[^a-zA-Z0-9]/g, '');
                        if (!license) continue;

                        const rawType = String(cols[8] || '').trim();
                        const existing = existingMap.get(license);
                        const userType = (existing || rawType.includes('ต่อเนื่อง')) ? 'เรียนต่อเนื่อง' : 'เรียนใหม่';

                        const payload = {
                            id: license,
                            license,
                            name: cols[1] || existing?.name || 'ผู้เรียน',
                            email: cols[3] || existing?.email || '',
                            position: cols[4] || existing?.position || '',
                            department: cols[5] || existing?.department || '',
                            hospital: cols[6] || existing?.hospital || '',
                            province: cols[7] || existing?.province || '',
                            phone: String(cols[16] || existing?.phone || '').replace(/[^0-9]/g, ''),
                            userType,
                            status: existing?.status || 'กำลังเรียน',
                            pretest: existing?.pretest || '-',
                            posttest: existing?.posttest || '-',
                            lastVideoId: existing?.lastVideoId || 1,
                            progress: existing?.progress ?? 0,
                            studySeconds: existing?.studySeconds ?? 0,
                            skillLabPassed: existing?.skillLabPassed ?? false
                        };

                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', license),
                            payload,
                            { merge: true }
                        );

                        if (existing) updated++;
                        else added++;
                    }

                    setLastSyncTime(new Date().toLocaleTimeString('th-TH'));
                    if (isManual) showToast(`ซิงค์สำเร็จ! เพิ่มใหม่ ${added} ราย, อัปเดต ${updated} ราย`);
                } catch (err) {
                    console.error('CSV Sync Error:', err);
                    if (isManual) showToast('ดึงข้อมูล CSV ไม่สำเร็จ กรุณาตรวจสอบการเผยแพร่ลิงก์ Google Sheets ค่ะ', 'error');
                } finally {

                }

                return usersList.filter(u => {
                    const normalizedType = u.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่';

                    if (!matchType) return false;
                    return (
                        String(u.name || '').toLowerCase().includes(q) ||
                        String(u.hospital || '').toLowerCase().includes(q) ||
                        getUserLicense(u).toLowerCase().includes(q)

            }, [usersList, searchTerm, filterType]);

            const visibleUsers = useMemo(
                () => filteredUsers.slice(0, displayLimit),

                const criteriaMeta = [

                const rows = cneuFilteredUsers.map((u, idx) => [

                const csv = '\ufeff' + [headers.map(escapeCsvCell).join(','), ...rows].join('\n');

                                        >
                                            <Icon name="FileCheck2" size={15} /> รายงาน CNEU (PDF)
                                        </button>
                                        <button type="button" onClick={handleExportCSV} className="rjc2-pill-btn touch-target px-4 py-2.5 rounded-full font-display font-extrabold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="Download" size={15} /> ส่งออก CSV
                                        </button>
                                    </div>
                                </div>

                                {/* ฟอร์มเพิ่มผู้เรียนด้วยตนเอง */}
                                {showAddUser && (
                                    <form onSubmit={handleAddManualUser} className="spatial-card rounded-[1.75rem] p-4 sm:p-6 space-y-4 border-aurora-400/35">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive flex items-center gap-2">
                                                <Icon name="UserPlus" size={17} className="text-accent-adaptive" /> เพิ่มรายชื่อผู้เรียนใหม่เข้าสู่ระบบ
                                            </h3>
                                            <button type="button" onClick={() => setShowAddUser(false)} className="text-muted-adaptive hover:text-primary-adaptive p-1">
                                                <Icon name="X" size={18} />
                                            </button>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            <FieldInput label="ชื่อ - นามสกุล *" required value={manualForm.name} onChange={e => setManualForm(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา" />
                                            <FieldInput label="เลขใบประกอบวิชาชีพ *" required value={manualForm.license} onChange={e => setManualForm(p => ({ ...p, license: e.target.value }))} placeholder="เช่น 6501234567" />
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1.5 ml-1">สิทธิ์การเรียน</label>
                                                <select
                                                    value={manualForm.userType}
                                                    onChange={e => setManualForm(p => ({ ...p, userType: e.target.value }))}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm font-medium"
                                                >
                                                    <option value="เรียนใหม่">เรียนใหม่</option>
                                                    <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                </select>
                                            </div>
                                            <FieldInput label="โรงพยาบาล / หน่วยงาน" value={manualForm.hospital} onChange={e => setManualForm(p => ({ ...p, hospital: e.target.value }))} />
                                            <FieldInput label="สังกัด / เขตสุขภาพ" value={manualForm.department} onChange={e => setManualForm(p => ({ ...p, department: e.target.value }))} />
                                            <FieldInput label="อีเมล" type="email" value={manualForm.email} onChange={e => setManualForm(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" />
                                        </div>
                                        <div className="flex justify-end gap-2">
                                            <button type="button" onClick={() => setShowAddUser(false)} className="touch-target spatial-soft px-4 py-2.5 rounded-2xl text-xs font-bold text-secondary-adaptive">
                                                ยกเลิก
                                            </button>
                                            <button type="submit" className="touch-target px-5 py-2.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs">
                                                บันทึกผู้เรียนเข้า Cloud
                                            </button>
                                        </div>
                                    </form>
                                )}

                                {/* ช่องค้นหาและตัวกรองผู้เรียน */}
                                <div className="spatial-card rounded-[1.5rem] p-3.5 sm:p-4 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                                    <div className="relative flex-1">
                                        <Icon name="Search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-adaptive" />
                                        <input
                                            type="text"
                                            value={searchTerm}
                                            onChange={e => setSearchTerm(e.target.value)}
                                            placeholder="พิมพ์ค้นหาชื่อผู้เรียน, โรงพยาบาล หรือเลขใบอนุญาต..."
                                            className="touch-target spatial-input w-full pl-10 pr-10 py-2.5 rounded-2xl text-sm"
                                        />
                                        {hasSearchQuery && (
                                            <button
                                                type="button"
                                                onClick={() => setSearchTerm('')}
                                                aria-label="ล้างคำค้นหา"
                                                className="absolute right-2.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-xl spatial-soft text-muted-adaptive hover:text-primary-adaptive flex items-center justify-center"
                                            >
                                                <Icon name="X" size={14} />
                                            </button>
                                        )}
                                    </div>
                                    <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-0.5">
                                        {[
                                            { id: 'ALL', label: `ทั้งหมด (${usersList.length})` },
                                            { id: 'เรียนใหม่', label: 'เรียนใหม่' },
                                            { id: 'เรียนต่อเนื่อง', label: 'เรียนต่อเนื่อง' },
                                            { id: 'PASSED', label: `ผ่าน (${quickStats.passed})` }
                                        ].map(f => (
                                            <button
                                                key={f.id}
                                                type="button"
                                                onClick={() => setFilterType(f.id)}
                                                className={`shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                                                    filterType === f.id
                                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                        : 'spatial-soft text-secondary-adaptive'
                                                }`}
                                            >
                                                {f.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* รายชื่อผู้เรียน: แสดงเฉพาะเมื่อค้นหาด้วยชื่อ โรงพยาบาล หรือเลขใบอนุญาต */}
                                <div className="spatial-card rounded-[1.75rem] overflow-hidden">
                                    {!hasSearchQuery ? (
                                        <div className="py-14 px-6 text-center space-y-2.5">
                                            <div className="w-12 h-12 rounded-2xl spatial-soft text-prism-adaptive flex items-center justify-center mx-auto">
                                                <Icon name="Search" size={22} />
                                            </div>
                                            <h3 className="font-display font-bold text-base text-primary-adaptive">
                                                พิมพ์ “ชื่อ” หรือ “โรงพยาบาล” เพื่อค้นหาผู้เรียน
                                            </h3>
                                            <p className="text-xs sm:text-sm text-muted-adaptive max-w-md mx-auto leading-relaxed">
                                                ระบบจะไม่แสดงรายชื่อทั้งหมดในคราวเดียวเพื่อความรวดเร็วและลดการเปิดเผยข้อมูลส่วนตัว (PDPA)
                                                • มีผู้เรียนในฐานข้อมูลทั้งหมด <b className="text-primary-adaptive">{usersList.length}</b> ราย (ส่งออก CSV และรายงาน CNEU ได้ครบทุกคนตามปกติ)
                                            </p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="px-4 py-2.5 border-b border-white/10 flex flex-wrap items-center justify-between gap-2 text-xs">
                                                <span className="text-secondary-adaptive">
                                                    พบผลลัพธ์ <b className="font-mono text-accent-adaptive">{filteredUsers.length}</b> ราย สำหรับคำค้นหา <b className="text-primary-adaptive">“{searchTerm.trim()}”</b>
                                                </span>
                                                <button
                                                    type="button"
                                                    onClick={() => setSearchTerm('')}
                                                    className="text-prism-adaptive hover:underline font-bold"
                                                >
                                                    ล้างการค้นหา
                                                </button>
                                            </div>

                                            <div className="hidden md:block overflow-x-auto custom-scrollbar">
                                                <table className="w-full text-left border-collapse">
                                                    <thead className="spatial-thead text-[11px] font-mono uppercase text-muted-adaptive">
                                                        <tr>
                                                            <th className="py-3.5 px-4">ผู้เรียน / หน่วยงาน</th>
                                                            <th className="py-3.5 px-3">สิทธิ์การเรียน</th>
                                                            <th className="py-3.5 px-3">ความคืบหน้า 5 ขั้นตอน</th>
                                                            <th className="py-3.5 px-3">Pre / Post</th>
                                                            <th className="py-3.5 px-4 text-right">จัดการ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-white/10 text-xs">
                                                        {visibleUsers.map(u => {
                                                            const lic = getUserLicense(u);
                                                            const st = getUserFiveStepStatus(u);
                                                            return (
                                                                <tr key={u.id || lic} className="hover:bg-white/[0.03] transition-colors">
                                                                    <td className="py-3.5 px-4">
                                                                        <p className="font-display font-bold text-sm text-primary-adaptive">{u.name || 'ไม่ระบุชื่อ'}</p>
                                                                        <p className="text-[11px] text-muted-adaptive">
                                                                            <span className="font-mono text-prism-adaptive">{lic}</span> • {u.hospital || '-'}
                                                                        </p>
                                                                    </td>
                                                                    <td className="py-3.5 px-3">
                                                                        <select
                                                                            value={u.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'}
                                                                            onChange={e => handleUpdateUser(u, { userType: e.target.value })}
                                                                            className="spatial-input px-2.5 py-1.5 rounded-xl text-xs font-bold"
                                                                        >
                                                                            <option value="เรียนใหม่">เรียนใหม่</option>
                                                                            <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                                        </select>
                                                                    </td>
                                                                    <td className="py-3.5 px-3">
                                                                        <FiveStepTelemetryPills
                                                                            u={u}
                                                                            onToggleLab={() => handleUpdateUser(u, { skillLabPassed: !st.step3Lab })}
                                                                        />
                                                                    </td>
                                                                    <td className="py-3.5 px-3 font-mono font-bold text-secondary-adaptive">
                                                                        <span>{u.pretest || '-'}</span>
                                                                        <span className="mx-1 text-muted-adaptive">/</span>
                                                                        <span className={st.step4Post ? 'text-accent-adaptive' : ''}>{u.posttest || '-'}</span>
                                                                    </td>
                                                                    <td className="py-3.5 px-4 text-right">
                                                                        <div className="inline-flex items-center gap-1.5">
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => handleUpdateUser(u, { status: u.status === 'ผ่าน' ? 'กำลังเรียน' : 'ผ่าน' })}
                                                                                className={`px-2.5 py-1.5 rounded-xl font-bold text-[11px] border ${
                                                                                    u.status === 'ผ่าน'
                                                                                        ? 'bg-aurora-500/20 border-aurora-400/40 text-accent-adaptive'
                                                                                        : 'spatial-soft text-secondary-adaptive'
                                                                                }`}
                                                                            >
                                                                                {u.status === 'ผ่าน' ? 'ผ่านแล้ว ✓' : 'กำลังเรียน'}
                                                                            </button>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => handleDeleteUser(u)}
                                                                                className="p-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400"
                                                                                title="ลบผู้เรียน"
                                                                            >
                                                                                <Icon name="Trash2" size={14} />
                                                                            </button>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                        {filteredUsers.length === 0 && (
                                                            <tr>
                                                                <td colSpan="5" className="py-10 text-center text-sm text-muted-adaptive">
                                                                    ไม่พบรายชื่อผู้เรียนตามเงื่อนไขที่ค้นหาค่ะ
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>

                                            {/* Mobile Cards */}
                                            <div className="md:hidden divide-y divide-white/10">
                                                {visibleUsers.map(u => {
                                                    const lic = getUserLicense(u);
                                                    const st = getUserFiveStepStatus(u);
                                                    return (
                                                        <div key={u.id || lic} className="p-4 space-y-3">
                                                            <div className="flex items-start justify-between gap-2">
                                                                <div className="min-w-0">
                                                                    <p className="font-display font-bold text-sm text-primary-adaptive truncate">{u.name || 'ไม่ระบุชื่อ'}</p>
                                                                    <p className="text-xs text-muted-adaptive truncate">
                                                                        <span className="font-mono text-prism-adaptive">{lic}</span> • {u.hospital || '-'}
                                                                    </p>
                                                                </div>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleDeleteUser(u)}
                                                                    className="p-2 rounded-xl bg-rose-500/15 text-rose-400 shrink-0"
                                                                >
                                                                    <Icon name="Trash2" size={14} />
                                                                </button>
                                                            </div>
                                                            <FiveStepTelemetryPills
                                                                u={u}
                                                                onToggleLab={() => handleUpdateUser(u, { skillLabPassed: !st.step3Lab })}
                                                            />
                                                            <div className="flex items-center justify-between gap-2 pt-1">
                                                                <select
                                                                    value={u.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'}
                                                                    onChange={e => handleUpdateUser(u, { userType: e.target.value })}
                                                                    className="spatial-input px-2.5 py-1.5 rounded-xl text-xs font-bold"
                                                                >
                                                                    <option value="เรียนใหม่">เรียนใหม่</option>
                                                                    <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                                </select>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleUpdateUser(u, { status: u.status === 'ผ่าน' ? 'กำลังเรียน' : 'ผ่าน' })}
                                                                    className={`px-3 py-1.5 rounded-xl font-bold text-xs border ${
                                                                        u.status === 'ผ่าน'
                                                                            ? 'bg-aurora-500/20 border-aurora-400/40 text-accent-adaptive'
                                                                            : 'spatial-soft text-secondary-adaptive'
                                                                    }`}
                                                                >
                                                                    {u.status === 'ผ่าน' ? 'ผ่านแล้ว ✓' : 'กำลังเรียน'}
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                                {filteredUsers.length === 0 && (
                                                    <p className="py-10 text-center text-sm text-muted-adaptive">ไม่พบรายชื่อผู้เรียนตามเงื่อนไขที่ค้นหาค่ะ</p>
                                                )}
                                            </div>

                                            {/* ปุ่มแสดงเพิ่มเติมกรณีผลการค้นหามีมากกว่า 50 ราย */}
                                            {filteredUsers.length > displayLimit && (
                                                <div className="p-3.5 border-t border-white/10 text-center">
                                                    <button
                                                        type="button"
                                                        onClick={() => setDisplayLimit(prev => prev + 50)}
                                                        className="touch-target spatial-soft px-5 py-2.5 rounded-2xl text-xs font-bold text-prism-adaptive"
                                                    >
                                                        แสดงเพิ่มเติม ({visibleUsers.length} / {filteredUsers.length} ราย)
                                                    </button>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ==================== TAB 2: CERTIFICATE DESIGNER & CNEU REPORT STUDIO ==================== */}
                        {activeTab === 'cert' && (
                            <div className="space-y-5">
                                {/* Sub-tab Switcher: ออกแบบใบประกาศฯ vs รายงานส่งสภาฯ (CNEU) */}
                                <div className="no-print flex flex-wrap items-center justify-between gap-3">
                                    <div className="inline-flex p-1 rounded-2xl spatial-soft">
                                        <button
                                            type="button"
                                            onClick={() => setCertSubTab('designer')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                certSubTab === 'designer'
                                                    ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                    : 'text-secondary-adaptive'
                                            }`}
                                        >
                                            <Icon name="Award" size={15} /> ออกแบบใบประกาศนียบัตร
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setCertSubTab('cneu')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                certSubTab === 'cneu'
                                                    ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                    : 'text-secondary-adaptive'
                                            }`}
                                        >
                                            <Icon name="FileCheck2" size={15} /> รายงานส่งสภาฯ (CNEU PDF)
                                            <span className={`px-1.5 py-0.5 rounded-full font-mono text-[10px] ${
                                                certSubTab === 'cneu' ? 'bg-void-950/20 text-void-950' : 'bg-aurora-500/20 text-accent-adaptive'
                                            }`}>
                                                {cneuAllCertified.length}
                                            </span>
                                        </button>
                                    </div>
                                </div>

                                {certSubTab === 'designer' ? (
                                    <div className="space-y-5">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <span className="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 font-mono text-[10px] font-bold">IN-APP CERTIFICATE STUDIO • MINIMALIST GOLD</span>
                                                <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive mt-1">ออกแบบประกาศนียบัตรในระบบ</h2>
                                                <p className="text-xs sm:text-sm text-secondary-adaptive">พื้นสีขาวบริสุทธิ์ ตัดเส้นสายสีทองบางเรียบหรู แก้ไขข้อความ โลโก้ และลายเซ็นได้ทันที</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button type="button" onClick={() => setCertTemplate({ ...DEFAULT_CERT_TEMPLATE })} className="touch-target spatial-soft px-4 py-2.5 rounded-2xl text-primary-adaptive font-bold text-xs">
                                                    คืนค่าเริ่มต้น
                                                </button>
                                                <button type="button" onClick={() => persistSettings({ certTemplate })} className="touch-target px-5 py-2.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs flex items-center gap-1.5 shadow-md">
                                                    <Icon name="Save" size={16} /> บันทึกและเผยแพร่
                                                </button>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                            <div className="lg:col-span-7 spatial-card rounded-[1.75rem] p-3 sm:p-5 space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <span className="text-xs font-bold text-secondary-adaptive flex items-center gap-1.5">
                                                        <Icon name="Eye" size={15} className="text-amber-400" /> พรีวิวรูปแบบใบประกาศนียบัตร (Live Preview)
                                                    </span>
                                                    <span className="font-mono text-[10px] text-muted-adaptive">A4 LANDSCAPE • 300 DPI</span>
                                                </div>
                                                <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-amber-500/35 shadow-xl">
                                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                                </div>
                                            </div>

                                            <div className="lg:col-span-5 spatial-card rounded-[1.75rem] p-4 sm:p-6 space-y-3.5">
                                                <FieldInput label="รหัสนำหน้าใบประกาศฯ (Prefix)" value={certTemplate.certPrefix} onChange={e => setCertTemplate(p => ({ ...p, certPrefix: e.target.value }))} />
                                                <FieldInput label="ชื่อหน่วยงานหลัก (ไทย)" value={certTemplate.orgTitleTH} onChange={e => setCertTemplate(p => ({ ...p, orgTitleTH: e.target.value }))} />
                                                <FieldInput label="ชื่อหน่วยงาน (อังกฤษ)" value={certTemplate.orgTitleEN} onChange={e => setCertTemplate(p => ({ ...p, orgTitleEN: e.target.value }))} />
                                                <FieldInput label="ชื่อหลักสูตร (ไทย)" value={certTemplate.courseTitleTH} onChange={e => setCertTemplate(p => ({ ...p, courseTitleTH: e.target.value }))} />
                                                <FieldInput label="ชื่อหลักสูตร (อังกฤษ)" value={certTemplate.courseTitleEN} onChange={e => setCertTemplate(p => ({ ...p, courseTitleEN: e.target.value }))} />
                                                <FieldInput label="ข้อความรับรองการผ่านหลักสูตร" value={certTemplate.completionTextTH} onChange={e => setCertTemplate(p => ({ ...p, completionTextTH: e.target.value }))} />
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    <FieldInput label="ชื่อผู้ลงนาม" value={certTemplate.signerName} onChange={e => setCertTemplate(p => ({ ...p, signerName: e.target.value }))} />
                                                    <FieldInput label="ตำแหน่งผู้ลงนาม" value={certTemplate.signerPosition} onChange={e => setCertTemplate(p => ({ ...p, signerPosition: e.target.value }))} />

                                        ADMIN PAGE INSPECTOR • BYPASS LOCK MODE
                                    </span>
                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive mt-1">
                                        ศูนย์ตรวจสอบทุกหน้าจอในระบบ (ครบทั้ง 14 หน้า)
                                    </h2>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive">
                                        คลิก <b>“พรีวิวที่นี่”</b> เพื่อตรวจจอมือถือ/คอมพิวเตอร์ทันที หรือ <b>“แท็บใหม่”</b> โดยไม่ติดล็อกเงื่อนไขและไม่บันทึกทับข้อมูลผู้เรียนจริง
                                    </p>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <div className="spatial-card rounded-2xl p-4">
                                        <p className="text-xs font-bold text-muted-adaptive">ผู้เรียนทั้งหมด</p>
                                        <p className="font-mono text-2xl font-extrabold text-primary-adaptive mt-1">{quickStats.total}</p>
                                    </div>
                                    <div className="spatial-card rounded-2xl p-4">
                                        <p className="text-xs font-bold text-muted-adaptive">สอบผ่านรับประกาศฯ</p>
                                        <p className="font-mono text-2xl font-extrabold text-accent-adaptive mt-1">{quickStats.passed}</p>
                                    </div>
                                    <div className="spatial-card rounded-2xl p-4">
                                        <p className="text-xs font-bold text-muted-adaptive">ผ่าน AI Skill Lab</p>
                                        <p className="font-mono text-2xl font-extrabold text-violet-400 mt-1">{quickStats.labDone}</p>
                                    </div>
                                    <div className="spatial-card rounded-2xl p-4">
                                        <p className="text-xs font-bold text-muted-adaptive">CSAT เฉลี่ย</p>
                                        <p className="font-mono text-2xl font-extrabold text-amber-400 mt-1">{quickStats.avgCsat}/5</p>
                                    </div>
                                </div>

                                {/* สรุปผลประเมินความพึงพอใจรายด้าน 5 มิติ (มาตรฐาน CNEU) */}
                                <div className="spatial-card rounded-2xl p-4 sm:p-5 space-y-3">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">CNEU 5-DIMENSION SATISFACTION SUMMARY</span>
                                            <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">
                                                สรุปคะแนนประเมินความพึงพอใจรายด้าน ({quickStats.csatCount} ผู้ประเมิน)
                                            </h3>
                                        </div>
                                        <span className="px-3 py-1 rounded-full bg-amber-500/15 text-amber-400 font-mono text-xs font-bold">
                                            เฉลี่ยรวม {quickStats.avgCsat} / 5.00
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                                        {quickStats.criteriaAvg.map(c => (
                                            <div key={c.key} className="spatial-soft p-3 rounded-xl space-y-1">
                                                <p className="text-[11px] font-bold text-secondary-adaptive leading-snug">{c.label}</p>
                                                <p className="font-mono text-lg font-extrabold text-accent-adaptive">
                                                    {c.avg}<span className="text-[11px] text-muted-adaptive font-normal"> / 5</span>
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    {inspectorGroups.map(group => (
                                        <div key={group.badge} className="space-y-3">
                                            <div className="flex items-center justify-between gap-2">
                                                <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">{group.groupTitle}</h3>
                                                <span className="px-2.5 py-0.5 rounded-full spatial-soft text-prism-adaptive font-mono text-[10px] font-bold">
                                                    {group.badge}
                                                </span>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                                {group.items.map(item => (
                                                    <div key={item.id} className="spatial-card rounded-2xl p-4 flex flex-col justify-between gap-3.5 hover:border-aurora-400/50 transition-all">
                                                        <div className="flex items-start gap-3">
                                                            <div className="w-11 h-11 rounded-2xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center shrink-0">
                                                                <Icon name={item.icon} size={21} />
                                                            </div>
                                                            <div className="min-w-0">
                                                                <h4 className="font-display font-bold text-sm text-primary-adaptive leading-snug">{item.title}</h4>
                                                                <p className="text-[11px] text-muted-adaptive mt-0.5 leading-relaxed">{item.desc}</p>
                                                            </div>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-2 pt-2 border-t border-white/10">
                                                            <button
                                                                type="button"
                                                                onClick={() => openInspectorPreview(item)}
                                                                className="touch-target py-2 px-3 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs flex items-center justify-center gap-1.5 active:scale-95"
                                                            >
                                                                <Icon name="Eye" size={14} /> พรีวิวที่นี่
                                                            </button>
                                                            <a
                                                                href={item.url}
                                                                target="_blank"
                                                                rel="noreferrer"
                                                                className="touch-target spatial-soft py-2 px-3 rounded-xl text-primary-adaptive font-bold text-xs flex items-center justify-center gap-1.5 active:scale-95"
                                                            >
                                                                <Icon name="ExternalLink" size={14} className="text-prism-adaptive" /> แท็บใหม่
                                                            </a>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* ==================== LIVE PAGE INSPECTOR MODAL (DESKTOP / MOBILE 390px) ==================== */}
                    {inspectorModal.open && inspectorModal.item && (
                        <div className="fixed inset-0 z-[105] bg-slate-950/80 backdrop-blur-md flex flex-col p-2 sm:p-4">
                            <div className="w-full max-w-7xl mx-auto flex-1 flex flex-col bg-void-900 rounded-[1.5rem] sm:rounded-[2rem] overflow-hidden shadow-2xl border border-white/15">
                                <div className="px-3.5 sm:px-5 py-3 bg-void-950 text-white flex flex-wrap items-center justify-between gap-2.5 shrink-0 border-b border-white/10">
                                    <div className="flex items-center gap-2 min-w-0 flex-1">
                                        <span className="px-2 py-0.5 rounded-md bg-aurora-500/20 border border-aurora-400/40 text-aurora-300 font-mono text-[10px] font-bold shrink-0">
                                            INSPECTOR
                                        </span>
                                        <select
                                            value={inspectorModal.item.id}
                                            onChange={e => {
                                                const next = allInspectorItems.find(x => x.id === e.target.value);
                                                if (next) setInspectorModal(p => ({ ...p, item: next, reloadKey: Date.now() }));
                                            }}
                                            className="max-w-full sm:max-w-xs px-3 py-1.5 rounded-xl bg-void-800 border border-white/15 text-white text-xs sm:text-sm font-bold outline-none focus:border-aurora-400"
                                        >
                                            {allInspectorItems.map(opt => (
                                                <option key={opt.id} value={opt.id}>{opt.title}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <div className="hidden sm:inline-flex p-0.5 rounded-xl bg-void-800 border border-white/15">
                                            <button
                                                type="button"
                                                onClick={() => setInspectorModal(p => ({ ...p, viewport: 'desktop' }))}
                                                className={`px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 ${inspectorModal.viewport === 'desktop' ? 'bg-aurora-400 text-void-950' : 'text-slate-300 hover:text-white'}`}
                                            >
                                                <Icon name="Monitor" size={14} /> จอคอมฯ
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setInspectorModal(p => ({ ...p, viewport: 'mobile' }))}
                                                className={`px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 ${inspectorModal.viewport === 'mobile' ? 'bg-aurora-400 text-void-950' : 'text-slate-300 hover:text-white'}`}
                                            >
                                                <Icon name="Smartphone" size={14} /> มือถือ
                                            </button>
                                        </div>

                                        <button
                                            type="button"
                                            onClick={() => setInspectorModal(p => ({ ...p, reloadKey: Date.now() }))}
                                            className="w-9 h-9 rounded-xl bg-void-800 hover:bg-void-700 text-slate-200 flex items-center justify-center"
                                            title="รีโหลดหน้าพรีวิว"
                                        >
                                            <Icon name="RefreshCw" size={15} />
                                        </button>
                                        <a
                                            href={inspectorModal.item.url}
                                            target="_blank"
                                            rel="noreferrer"
                                            className="px-3 h-9 rounded-xl bg-aurora-400 hover:bg-aurora-300 text-void-950 text-xs font-extrabold inline-flex items-center gap-1.5"
                                        >
                                            <Icon name="ExternalLink" size={14} /> <span className="hidden sm:inline">แท็บใหม่</span>
                                        </a>
                                        <button
                                            type="button"
                                            onClick={() => setInspectorModal(p => ({ ...p, open: false }))}
                                            className="w-9 h-9 rounded-xl bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center"
                                            title="ปิดหน้าต่างพรีวิว"
                                        >
                                            <Icon name="X" size={18} />
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-1 bg-void-950/90 overflow-auto flex items-center justify-center p-0 sm:p-4">
                                    <div
                                        className={`bg-void-950 transition-all duration-300 overflow-hidden shadow-2xl ${
                                            inspectorModal.viewport === 'mobile'
                                                ? 'w-[390px] max-w-full h-full max-h-[820px] rounded-[2rem] border-[6px] border-slate-700'
                                                : 'w-full h-full sm:rounded-2xl border border-white/15'
                                        }`}
                                    >
                                        <iframe
                                            key={`${inspectorModal.item.id}-${inspectorModal.reloadKey}`}
                                            src={buildInspectorUrl(inspectorModal.item.url, inspectorModal.reloadKey)}
                                            className="w-full h-full border-0 block"
                                            title={inspectorModal.item.title}
                                            allow="microphone; camera; autoplay; fullscreen"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Smartphone Bottom Spatial Dock (ครบทั้ง 6 เมนู) */}
                    <nav className="no-print lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]">
                        <div className="grid grid-cols-6 gap-1 max-w-xl mx-auto">
                            {navItems.map(item => {
                                const active = activeTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => { setActiveTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all active:scale-95 ${
                                            active
                                                ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-sm'
                                                : 'text-secondary-adaptive'
                                        }`}
                                    >
                                        <Icon name={item.icon} size={17} />
                                        <span className="truncate max-w-full px-0.5">{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('admin-root'));
        root.render(<AdminErrorBoundary><AdminApp /></AdminErrorBoundary>);
    </script>
</body>
</html>
