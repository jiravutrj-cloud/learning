          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030611' : '#edf5fc');
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&
            loc.origin !== 'null' &&
            !/(googleusercontent|webcontainer|stackblitz|sandbox|srcdoc|blob:)/i.test(loc.href);
          if (isRealHost) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            ['./data.js', './learning-core.js'].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

            return 'บุคลากรสหวิชาชีพ';
        }

        function resolveRegionId(dept = '') {
            if (typeof CORE.resolveRegionId === 'function') return CORE.resolveRegionId(dept);
            const d = String(dept || '');
            if (d.includes('เขตสุขภาพที่ 13') || d.includes('กรมการแพทย์') || d.includes('ราชวิถี')) return 'BKK';
            const m = d.match(/เขตสุขภาพที่\s*(\d+)/);
            if (m && Number(m[1]) >= 1 && Number(m[1]) <= 12) return `R${m[1]}`;
            return 'OTHER';
        }

        function escapeCsvCell(val) {
            const s = val === null || val === undefined ? '' : String(val);
            return `"${s.replace(/"/g, '""')}"`;
        }

        function triggerCsvDownload(filename, headers, rows) {
            const csv = '\ufeff' + [headers.map(escapeCsvCell).join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // Firebase Init
        let fbApp = null, fbAuth = null, fbDb = null;
        const isCloudConfigured = Boolean(CONFIG.firebaseConfig?.apiKey && CONFIG.firebaseConfig?.projectId);
        if (isCloudConfigured) {
            try {
                fbApp = getApps().length === 0 ? initializeApp(CONFIG.firebaseConfig) : getApp();
                fbAuth = getAuth(fbApp);
                fbDb = getFirestore(fbApp);
            } catch (_) {}
        }

        // ============================================================================
        // 2. UI PRIMITIVES
        // ============================================================================
        class AdminErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, err: null }; }
            static getDerivedStateFromError(err) { return { hasError: true, err }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6 bg-void-950 text-white">
                            <div className="spatial-card max-w-md w-full rounded-3xl p-6 text-center space-y-4 border-rose-500/40">
                                <h2 className="font-display font-bold text-lg text-rose-400">พบข้อผิดพลาดในศูนย์ควบคุม Admin</h2>
                                <p className="text-xs font-mono bg-rose-500/10 text-rose-200 p-3 rounded-xl overflow-auto">{String(this.state.err?.message || this.state.err)}</p>
                                <button type="button" onClick={() => window.location.reload()} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-bold text-sm">โหลดหน้าใหม่</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function Icon({ name, size = 18, className = '' }) {
            const Comp = LucideIcons[name] || LucideIcons.ShieldCheck || LucideIcons.Activity;
            return Comp ? <Comp size={size} className={className} /> : null;
        }

        function ThemeToggleButton({ theme, onToggle }) {
            const isDark = theme === 'dark';
            return (
                <button type="button" onClick={onToggle} aria-label="สลับโหมดมืดหรือสว่าง" className="spatial-soft px-2.5 sm:px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 text-primary-adaptive shrink-0 cursor-pointer">
                    <Icon name={isDark ? 'Sun' : 'Moon'} size={15} className={isDark ? 'text-amber-300' : 'text-indigo-600'} />
                    <span className="hidden sm:inline">{isDark ? 'โหมดสว่าง' : 'โหมดมืด'}</span>
                </button>
            );
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[170] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-2xl flex items-center gap-2 text-xs sm:text-sm font-bold text-white ${
                        toast.type === 'error' ? 'bg-rose-700/95 border-rose-400/60'
                            : toast.type === 'info' ? 'bg-sky-700/95 border-sky-400/60'
                                : 'bg-emerald-700/95 border-emerald-400/60'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Sparkles' : 'CheckCircle2'} size={16} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 3. MAIN ADMIN MISSION CONTROL APPLICATION
        // ============================================================================
        function AdminApp() {
            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030611' : '#edf5fc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // Auth States
            const [adminSession, setAdminSession] = useState(null); // { email, isDemo }
            const [loginEmail, setLoginEmail] = useState(CONFIG.contactEmail || 'rjcloud.organ@gmail.com');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginBusy, setLoginBusy] = useState(false);

            // Navigation & Cloud Data
            const [activeTab, setActiveTab] = useState('overview'); // overview | learners | onsite | cneu | live
            const [usersList, setUsersList] = useState([]);
            const [onsiteEvents, setOnsiteEvents] = useState([]);
            const [onsiteRegs, setOnsiteRegs] = useState([]);
            const [onsiteConfig, setOnsiteConfig] = useState(() => ({ ...DEFAULT_ONSITE_CONFIG }));
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคอวัยวะ', url: '', documentUrl: '' });
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');

            // Filters & Action Busy Flags
            const [searchTerm, setSearchTerm] = useState('');
            const [filterProf, setFilterProf] = useState('ALL');
            const [filterLearnType, setFilterLearnType] = useState('ALL');
            const [onsiteEventFilter, setOnsiteEventFilter] = useState('');
            const [onsiteSearch, setOnsiteSearch] = useState('');
            const [savingConfig, setSavingConfig] = useState(false);
            const [rebuildingSummary, setRebuildingSummary] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            useEffect(() => {
                const el = document.getElementById('admin-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Check Existing Firebase Admin Session
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth) return;
                const unsub = onAuthStateChanged(fbAuth, (fbUser) => {
                    if (fbUser && fbUser.email) {
                        const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => String(x).toLowerCase());
                        if (allowed.includes(fbUser.email.toLowerCase())) {
                            setAdminSession({ email: fbUser.email, isDemo: false });
                        }
                    }
                });
                return () => unsub();
            }, []);

            // Real-Time Cloud Sync (Users, Historical Onsite Events, Onsite Registrations, Settings)
            useEffect(() => {
                if (!adminSession || adminSession.isDemo || !fbDb) return;

                const unsubUsers = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                        setUsersList(arr);
                    },
                    (err) => console.warn('Users snapshot warning:', err)
                );

                const unsubEvents = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_events'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => arr.push({ eventId: d.id, ...d.data() }));
                        setOnsiteEvents(arr);
                    },
                    () => {}
                );

                const unsubRegs = onSnapshot(
                    collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations'),
                    (snap) => {
                        const arr = [];
                        snap.forEach(d => {
                            const data = d.data() || {};
                            arr.push({
                                docId: d.id,
                                ...data,
                                eventId: data.eventId || DEFAULT_ONSITE_CONFIG.eventId,
                                license: String(data.license || d.id.split('_').pop() || '').trim()
                            });
                        });
                        setOnsiteRegs(arr);
                    },
                    () => {}
                );

                const unsubSettings = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                    (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (d.onsiteConfig) {
                            const merged = { ...DEFAULT_ONSITE_CONFIG, ...d.onsiteConfig };
                            setOnsiteConfig(merged);
                            setOnsiteEventFilter(prev => prev || merged.eventId);
                        }
                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                        if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                        if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                    },
                    () => {}
                );

                return () => { unsubUsers(); unsubEvents(); unsubRegs(); unsubSettings(); };
            }, [adminSession]);

            // ============================================================================
            // 4. AUTH & ADMIN ACTION HANDLERS
            // ============================================================================
            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if (!isCloudConfigured || !fbAuth) {
                    showToast('ไม่ได้เชื่อมต่อ Firebase Auth กรุณาใช้โหมดตัวอย่างค่ะ', 'error');
                    return;
                }
                setLoginBusy(true);
                try {
                    const cred = await signInWithEmailAndPassword(fbAuth, loginEmail.trim(), loginPassword);
                    const allowed = (CONFIG.adminEmails || [CONFIG.contactEmail]).map(x => String(x).toLowerCase());
                    if (!allowed.includes(String(cred.user?.email || '').toLowerCase())) {
                        await signOut(fbAuth);
                        showToast('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลระบบ rjcloud.organ 2.0 ค่ะ', 'error');
                    } else {
                        setAdminSession({ email: cred.user.email, isDemo: false });
                        showToast('เข้าสู่ศูนย์ควบคุมผู้ดูแลระบบเรียบร้อยค่ะ');
                    }
                } catch (err) {
                    showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง: ' + (err?.code || err?.message), 'error');
                } finally {
                    setLoginBusy(false);
                }
            };

            const handleEnterDemoMode = () => {
                setUsersList(DEMO_USERS);
                setOnsiteEvents(DEMO_ONSITE_EVENTS);
                setOnsiteRegs(DEMO_ONSITE_REGS);
                setOnsiteEventFilter(DEFAULT_ONSITE_CONFIG.eventId);
                setAdminSession({ email: 'demo-admin@rjcloud.organ', isDemo: true });
                showToast('เข้าสู่โหมดตัวอย่าง Admin Mission Control แล้วค่ะ', 'info');
            };

            const handleAdminLogout = async () => {
                if (fbAuth && !adminSession?.isDemo) { try { await signOut(fbAuth); } catch (_) {} }
                setAdminSession(null);
                setUsersList([]);
                setOnsiteRegs([]);
                showToast('ออกจากระบบผู้ดูแลแล้วค่ะ');
            };

            const handleSaveAllSettings = async (e) => {
                if (e) e.preventDefault();
                setSavingConfig(true);
                const nowIso = new Date().toISOString();
                try {
                    if (!adminSession?.isDemo && fbDb) {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), {
                            onsiteConfig,
                            cneuConfig,
                            liveConfig,
                            appsScriptUrl: appsScriptUrl.trim(),
                            updatedAt: nowIso
                        }, { merge: true });

                        // จดทะเบียนกิจกรรม Onsite ปัจจุบันลงคลังประวัติ onsite_events/{eventId} อัตโนมัติ
                        if (onsiteConfig.eventId) {
                            await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_events', onsiteConfig.eventId), {
                                eventId: onsiteConfig.eventId,
                                activityTitle: onsiteConfig.activityTitle,
                                eventDate: onsiteConfig.eventDate,
                                venueAndOrganizer: onsiteConfig.venueAndOrganizer,
                                targetCourseId: onsiteConfig.targetCourseId || DEFAULT_COURSE_ID,
                                updatedAt: nowIso
                            }, { merge: true });
                        }
                    } else {
                        setOnsiteEvents(prev => {
                            const exists = prev.some(x => x.eventId === onsiteConfig.eventId);
                            return exists
                                ? prev.map(x => x.eventId === onsiteConfig.eventId ? { ...x, ...onsiteConfig } : x)
                                : [{ ...onsiteConfig }, ...prev];
                        });
                    }
                    showToast('บันทึกการตั้งค่าและจดทะเบียนกิจกรรมลงศูนย์กลางเรียบร้อยแล้วค่ะ');
                } catch (err) {
                    showToast('บันทึกไม่สำเร็จ: ' + (err?.message || err), 'error');
                } finally {
                    setSavingConfig(false);
                }
            };

            const handleToggleOnsiteRevoke = async (reg) => {
                const nextRevoked = !reg.revoked;
                if (adminSession?.isDemo) {
                    setOnsiteRegs(prev => prev.map(r => r.docId === reg.docId ? { ...r, revoked: nextRevoked } : r));
                    showToast(nextRevoked ? `ยกเลิกสิทธิ์ No-show (${reg.name}) ในโหมดตัวอย่างแล้วค่ะ` : `คืนสิทธิ์เทียบโอน (${reg.name}) แล้วค่ะ`, 'info');
                    return;
                }
                if (!fbDb) return;
                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations', reg.docId), {
                        revoked: nextRevoked,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });

                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', reg.license), {
                        studyHoursExempt: !nextRevoked,
                        learningTypeCode: nextRevoked ? 'CONTINUING' : 'CREDIT_TRANSFER',
                        learningTypeLabel: nextRevoked ? 'เรียนต่อเนื่อง' : 'เทียบโอน',
                        progress: nextRevoked ? 0 : 100
                    }, { merge: true });

                    showToast(nextRevoked ? `ยกเลิกสิทธิ์เทียบโอนของ ${reg.name} แล้วค่ะ` : `คืนสิทธิ์เทียบโอนให้ ${reg.name} เรียบร้อยค่ะ`);
                } catch (err) {
                    showToast('อัปเดตสถานะไม่สำเร็จ: ' + err.message, 'error');
                }
            };

            const handleRebuildGlobalSummary = async () => {
                setRebuildingSummary(true);
                try {
                    const summary = {
                        totalUsers: usersList.length,
                        passedUsers: 0,
                        labUsers: 0,
                        skillScoreSum: 0,
                        skillScoreCount: 0,
                        csatSum: 0,
                        csatCount: 0,
                        susSum: 0,
                        susCount: 0,
                        preEffSum: 0,
                        preEffCount: 0,
                        postEffSum: 0,
                        postEffCount: 0,
                        updatedAt: new Date().toISOString()
                    };

                    usersList.forEach(u => {
                        const rId = resolveRegionId(u.department);
                        summary[`region_${rId}`] = (summary[`region_${rId}`] || 0) + 1;
                        if (u.status === 'ผ่าน') {
                            summary.passedUsers += 1;
                            summary[`region_${rId}_passed`] = (summary[`region_${rId}_passed`] || 0) + 1;
                        }
                        if (u.skillLabPassed || (Array.isArray(u.skillLabHistory) && u.skillLabHistory.length > 0)) {
                            summary.labUsers += 1;
                            if (typeof u.skillLabBestScore === 'number' && u.skillLabBestScore > 0) {
                                summary.skillScoreSum += u.skillLabBestScore;
                                summary.skillScoreCount += 1;
                            }
                        }
                        if (typeof u.satisfactionScore === 'number' && u.satisfactionScore > 0) {
                            summary.csatSum += u.satisfactionScore;
                            summary.csatCount += 1;
                        }
                        if (typeof u.susScore === 'number' && u.susScore >= 0) {
                            summary.susSum += u.susScore;
                            summary.susCount += 1;
                        }
                    });

                    if (!adminSession?.isDemo && fbDb) {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_summary', 'global'), summary, { merge: true });
                    }
                    showToast(`อัปเดตเอกสาร Eco 1-Read (${summary.totalUsers} ราย) สำหรับ Dashboard 13 เขตเรียบร้อยค่ะ`);
                } catch (err) {
                    showToast('อัปเดตสรุป 1-Read ไม่สำเร็จ: ' + (err?.message || err), 'error');
                } finally {
                    setRebuildingSummary(false);
                }
            };

            // ============================================================================
            // 5. DERIVED ANALYTICS & ARCHIVE ROSTER COMPUTATIONS
            // ============================================================================
            const enrichedUsers = useMemo(() => {
                return usersList.map(u => {
                    const prof = resolveProfessionSafe(u);
                    const isNurse = typeof u.cneuEligible === 'boolean' ? u.cneuEligible : prof === 'พยาบาล';
                    const isExempt = Boolean(u.studyHoursExempt || u.learningTypeCode === 'CREDIT_TRANSFER');
                    const learnCode = u.learningTypeCode || (isExempt ? 'CREDIT_TRANSFER' : (u.userType === 'เรียนต่อเนื่อง' ? 'CONTINUING' : 'NEW_LEARNER'));
                    const learnLabel = u.learningTypeLabel || (learnCode === 'CREDIT_TRANSFER' ? 'เทียบโอน' : (learnCode === 'CONTINUING' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'));
                    return { ...u, _prof: prof, _isNurse: isNurse, _isExempt: isExempt, _learnCode: learnCode, _learnLabel: learnLabel };
                });
            }, [usersList]);

            const filteredUsers = useMemo(() => {
                const q = searchTerm.trim().toLowerCase();
                return enrichedUsers.filter(u => {
                    if (filterProf !== 'ALL' && u._prof !== filterProf) return false;
                    if (filterLearnType !== 'ALL' && u._learnCode !== filterLearnType) return false;
                    if (q) {
                        const hay = `${u.name || ''} ${u.license || u.id || ''} ${u.hospital || ''} ${u.department || ''} ${u.hoursActivityName || ''}`.toLowerCase();
                        if (!hay.includes(q)) return false;
                    }
                    return true;
                });
            }, [enrichedUsers, searchTerm, filterProf, filterLearnType]);

            const kpi = useMemo(() => {
                const passed = enrichedUsers.filter(u => u.status === 'ผ่าน');
                return {
                    total: enrichedUsers.length,
                    passed: passed.length,
                    passedNurseCneu: passed.filter(u => u._isNurse).length,
                    passedDoctor: passed.filter(u => u._prof === 'แพทย์').length,
                    passedAllied: passed.filter(u => u._prof === 'บุคลากรสหวิชาชีพ').length,
                    transferCount: enrichedUsers.filter(u => u._learnCode === 'CREDIT_TRANSFER').length,
                    continuingCount: enrichedUsers.filter(u => u._learnCode === 'CONTINUING').length,
                    newCount: enrichedUsers.filter(u => u._learnCode === 'NEW_LEARNER').length
                };
            }, [enrichedUsers]);

            // รายการกิจกรรม Onsite ทั้งหมด (รวมปัจจุบัน + คลังย้อนหลัง)
            const mergedOnsiteEvents = useMemo(() => {
                const map = new Map();
                map.set(onsiteConfig.eventId, { ...onsiteConfig, isCurrent: true });
                onsiteEvents.forEach(ev => {
                    const id = ev.eventId || ev.id;
                    if (!id) return;
                    map.set(id, { ...(map.get(id) || {}), ...ev, eventId: id, isCurrent: id === onsiteConfig.eventId });
                });
                onsiteRegs.forEach(r => {
                    const id = r.eventId || onsiteConfig.eventId;
                    if (!map.has(id)) {
                        map.set(id, { eventId: id, activityTitle: r.activityTitle || `กิจกรรม ${id}`, targetCourseId: r.targetCourseId || DEFAULT_COURSE_ID, isCurrent: id === onsiteConfig.eventId });
                    }
                });
                return Array.from(map.values()).sort((a, b) => (b.isCurrent ? 1 : 0) - (a.isCurrent ? 1 : 0) || String(b.eventId).localeCompare(String(a.eventId)));
            }, [onsiteConfig, onsiteEvents, onsiteRegs]);

            const activeOnsiteEventFilter = onsiteEventFilter || onsiteConfig.eventId;
            const filteredOnsiteRegistrants = useMemo(() => {
                const q = onsiteSearch.trim().toLowerCase();
                return onsiteRegs.filter(r => {
                    if (activeOnsiteEventFilter !== 'ALL' && r.eventId !== activeOnsiteEventFilter) return false;
                    if (q) {
                        const hay = `${r.name || ''} ${r.license || ''} ${r.hospital || ''} ${r.professionGroup || ''}`.toLowerCase();
                        if (!hay.includes(q)) return false;
                    }
                    return true;
                });
            }, [onsiteRegs, activeOnsiteEventFilter, onsiteSearch]);

            // CSV Exporters
            const handleExportUsersCsv = (mode) => {
                const list = mode === 'cneu'
                    ? enrichedUsers.filter(u => u.status === 'ผ่าน' && u._isNurse)
                    : mode === 'non_cneu'
                        ? enrichedUsers.filter(u => u.status === 'ผ่าน' && !u._isNurse)
                        : filteredUsers;
                const headers = ['ลำดับ', 'เลขใบอนุญาตฯ', 'ชื่อ-นามสกุล', 'กลุ่มวิชาชีพ', 'ประเภทการเรียน', 'สิทธิ์ CNEU', 'โรงพยาบาล', 'เขตสุขภาพ', 'Pre-test', 'Post-test', 'AI Skill Lab', 'สถานะ', 'รหัสประกาศฯ'];
                const rows = list.map((u, i) => [
                    i + 1, u.license || u.id, u.name || '-', u._prof, u._learnLabel,
                    u._isNurse ? `CNEU ${cneuConfig.activityCode} (${cneuConfig.cneuCredits})` : `${cneuConfig.trainingHours || 8} ชม.อบรม`,
                    u.hospital || '-', u.department || '-', u.pretest || '-', u.posttest || '-',
                    u.skillLabBestScore || 0, u.status || 'กำลังเรียน', u.certificateCode || '-'
                ].map(escapeCsvCell).join(','));
                triggerCsvDownload(`rjcloud_${mode}_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                showToast(`ส่งออกไฟล์ CSV (${list.length} ราย) เรียบร้อยค่ะ`);
            };

            const handleExportOnsiteArchiveCsv = () => {
                const headers = ['ลำดับ', 'รหัสกิจกรรม', 'ชื่อกิจกรรม', 'หลักสูตรปลายทาง', 'ชื่อ-นามสกุล', 'กลุ่มวิชาชีพ', 'เลขใบอนุญาตฯ', 'โรงพยาบาล', 'จังหวัด', 'เขตสุขภาพ', 'อีเมล', 'เบอร์โทร', 'สถานะ', 'เวลาลงทะเบียน'];
                const rows = filteredOnsiteRegistrants.map((r, i) => [
                    i + 1, r.eventId, r.activityTitle || onsiteConfig.activityTitle, r.targetCourseId || DEFAULT_COURSE_ID,
                    r.name, r.professionGroup || '-', r.license, r.hospital || '-', r.province || '-', r.region || '-',
                    r.email || '-', r.phone || '-', r.revoked ? 'ยกเลิกสิทธิ์' : 'เทียบโอนชั่วโมง (100%)', r.registeredAt || '-'
                ].map(escapeCsvCell).join(','));
                triggerCsvDownload(`onsite_archive_${activeOnsiteEventFilter}_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                showToast(`ส่งออกรายชื่อกิจกรรม ${activeOnsiteEventFilter} (${filteredOnsiteRegistrants.length} ราย) เรียบร้อยค่ะ`);
            };

            // ============================================================================
            // 6. RENDER LOGIN GATE OR ADMIN MISSION CONTROL
            // ============================================================================
            if (!adminSession) {
                return (
                    <div className="min-h-dvh relative flex flex-col items-center justify-center p-4">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <div className="relative z-10 w-full max-w-md spatial-card rounded-[2rem] p-6 sm:p-7 space-y-5">
                            <div className="flex items-center justify-between">
                                <a href="./index.html" className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive no-underline">← กลับหน้าหลัก</a>
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                            </div>
                            <div className="text-center space-y-1">
                                <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">RJCLOUD.ORGAN 2.0 • DATA CENTER</span>
                                <h1 className="font-display font-extrabold text-xl text-primary-adaptive m-0">ศูนย์ควบคุมผู้ดูแลระบบ (Admin)</h1>
                                <p className="text-xs text-muted-adaptive m-0">เข้าสู่ระบบด้วยบัญชีผู้ดูแลเพื่อจัดการหลักสูตร คลังรายชื่อย้อนหลัง และ CNEU</p>
                            </div>
                            <form onSubmit={handleAdminLogin} className="space-y-3 text-xs">
                                <div>
                                    <label className="block font-bold text-secondary-adaptive mb-1 ml-1">อีเมลผู้ดูแลระบบ</label>
                                    <input required type="email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="touch-target spatial-input w-full px-4 py-2.5 rounded-2xl text-sm" />
                                </div>
                                <div>
                                    <label className="block font-bold text-secondary-adaptive mb-1 ml-1">รหัสผ่าน</label>
                                    <input required type="password" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="••••••••" className="touch-target spatial-input w-full px-4 py-2.5 rounded-2xl text-sm" />
                                </div>
                                <button type="submit" disabled={loginBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                    {loginBusy ? 'กำลังตรวจสอบสิทธิ์...' : 'เข้าสู่ศูนย์ควบคุมผู้ดูแลระบบ →'}
                                </button>
                            </form>
                            <div className="pt-3 border-t border-white/10 text-center">
                                <button type="button" onClick={handleEnterDemoMode} className="spatial-soft w-full py-2.5 rounded-xl text-xs font-bold text-prism-adaptive cursor-pointer">
                                    เปิดโหมดตัวอย่าง Admin (ทดสอบทุกแท็บทันที)
                                </button>
                            </div>
                        </div>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* Top Header */}
                    <header className="sticky top-0 z-30 spatial-header">
                        <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <a href="./index.html" className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive shrink-0">
                                    <Icon name="Home" size={17} />
                                </a>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        Admin <span className="text-accent-adaptive">Mission Control</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        {adminSession.email} {adminSession.isDemo ? '• DEMO PREVIEW' : '• CLOUD LIVE'}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                <button type="button" onClick={handleAdminLogout} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-rose-400 cursor-pointer">
                                    ออกจากระบบ
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="relative z-10 max-w-7xl w-full mx-auto px-3.5 sm:px-6 py-5 space-y-5 flex-1">
                        {/* Navigation Tabs */}
                        <div className="flex flex-wrap gap-1.5">
                            {[
                                { id: 'overview', label: '1. ภาพรวม Data Center', icon: 'LayoutDashboard' },
                                { id: 'learners', label: `2. ผู้เรียน & CNEU (${kpi.total})`, icon: 'Users' },
                                { id: 'onsite', label: `3. คลังกิจกรรม Onsite (${mergedOnsiteEvents.length})`, icon: 'FolderArchive' },
                                { id: 'cneu', label: '4. ตั้งค่า CNEU & AI', icon: 'Settings' },
                                { id: 'live', label: '5. Live สด', icon: 'Radio' }
                            ].map(t => (
                                <button
                                    key={t.id}
                                    type="button"
                                    onClick={() => setActiveTab(t.id)}
                                    className={`px-3.5 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 transition-all cursor-pointer ${
                                        activeTab === t.id
                                            ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold shadow'
                                            : 'spatial-soft text-secondary-adaptive'
                                    }`}
                                >
                                    <Icon name={t.icon} size={14} /> {t.label}
                                </button>
                            ))}
                        </div>

                        {/* ==================== TAB 1: OVERVIEW ==================== */}
                        {activeTab === 'overview' && (
                            <div className="space-y-4">
                                <section className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase block">บุคลากรในระบบทั้งหมด</span>
                                        <p className="font-mono text-3xl font-extrabold text-primary-adaptive mt-1 mb-0">{kpi.total}</p>
                                        <p className="text-[11px] text-muted-adaptive mt-1 mb-0">เทียบโอน {kpi.transferCount} • ต่อเนื่อง {kpi.continuingCount} • ใหม่ {kpi.newCount}</p>
                                    </div>
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase block">สอบผ่านเกณฑ์ (≥80%)</span>
                                        <p className="font-mono text-3xl font-extrabold text-accent-adaptive mt-1 mb-0">{kpi.passed}</p>
                                        <p className="text-[11px] text-secondary-adaptive mt-1 mb-0">พยาบาล (CNEU): <b>{kpi.passedNurseCneu}</b> ราย</p>
                                    </div>
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-indigo-400 uppercase block">แพทย์ &amp; สหวิชาชีพ (ผ่าน)</span>
                                        <p className="font-mono text-3xl font-extrabold text-primary-adaptive mt-1 mb-0">{kpi.passedDoctor + kpi.passedAllied}</p>
                                        <p className="text-[11px] text-secondary-adaptive mt-1 mb-0">แพทย์ {kpi.passedDoctor} • สหวิชาชีพ {kpi.passedAllied}</p>
                                    </div>
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-amber-400 uppercase block">คลังกิจกรรม ONSITE</span>
                                        <p className="font-mono text-3xl font-extrabold text-amber-400 mt-1 mb-0">{mergedOnsiteEvents.length}</p>
                                        <p className="text-[11px] text-secondary-adaptive mt-1 mb-0">รายชื่อสะสม {onsiteRegs.length} รายการ</p>
                                    </div>
                                </section>

                                <section className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                                    <div className="lg:col-span-7 spatial-card rounded-[1.75rem] p-5 space-y-3">
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">ECO 1-READ SCALABILITY ENGINE</span>
                                        <h2 className="font-display font-extrabold text-lg text-primary-adaptive m-0">อัปเดตสรุปสถิติ 13 เขตสุขภาพ (1-Read Summary)</h2>
                                        <p className="text-xs text-secondary-adaptive m-0 leading-relaxed">
                                            กดปุ่มด้านล่างเพื่อรวมยอดผู้เรียนล่าสุดลงเอกสารเดียว (<span className="font-mono">executive_summary/global</span>) ช่วยให้หน้า <span className="font-mono">executive.html</span> โหลดเร็วและประหยัดโควต้าอ่าน Firebase ฟรีมากกว่า 99% ค่ะ
                                        </p>
                                        <div className="flex flex-wrap gap-2 pt-1">
                                            <button type="button" disabled={rebuildingSummary} onClick={handleRebuildGlobalSummary} className="rjc2-pill-btn touch-target px-5 py-2.5 rounded-full font-display font-extrabold text-xs">
                                                {rebuildingSummary ? 'กำลังประมวลผล...' : '⚡ อัปเดตเอกสารสรุป 13 เขตทันที'}
                                            </button>
                                            <a href="./executive.html" target="_blank" rel="noreferrer" className="spatial-soft touch-target px-4 py-2.5 rounded-full text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5 no-underline">
                                                <Icon name="BarChart3" size={14} /> เปิด Dashboard 13 เขต
                                            </a>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-5 spatial-card rounded-[1.75rem] p-5 space-y-3">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">MULTI-COURSE CATALOG • สารบัญหลักสูตร</span>
                                        <h2 className="font-display font-extrabold text-lg text-primary-adaptive m-0">หลักสูตรที่เชื่อมต่อ Data Center</h2>
                                        <div className="space-y-2 text-xs">
                                            {Object.values(COURSE_CATALOG).map(c => (
                                                <div key={c.courseId} className="spatial-soft rounded-2xl p-3">
                                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive block">{c.courseId}</span>
                                                    <span className="font-bold text-primary-adaptive block">{c.titleTH}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {/* ==================== TAB 2: LEARNERS & CNEU ==================== */}
                        {activeTab === 'learners' && (
                            <section className="spatial-card rounded-[1.75rem] p-5 space-y-4">
                                <div className="flex flex-wrap items-center justify-between gap-2.5">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">CENTRAL REGISTRY • แยกประเภทการเรียนอัตโนมัติ &amp; คัดกรอง CNEU เฉพาะพยาบาล</span>
                                        <h2 className="font-display font-extrabold text-lg text-primary-adaptive m-0">ทะเบียนผู้เรียนทั้งหมด ({filteredUsers.length} ราย)</h2>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => handleExportUsersCsv('cneu')} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs">
                                            ส่งออก CNEU เฉพาะพยาบาล ({kpi.passedNurseCneu})
                                        </button>
                                        <button type="button" onClick={() => handleExportUsersCsv('non_cneu')} className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-prism-adaptive cursor-pointer">
                                            ส่งออกแพทย์/สหวิชาชีพ ({kpi.passedDoctor + kpi.passedAllied})
                                        </button>
                                        <button type="button" onClick={() => handleExportUsersCsv('all')} className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-secondary-adaptive cursor-pointer">
                                            CSV ทั้งหมด
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-12 gap-2.5 text-xs">
                                    <input value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="ค้นหาชื่อ / เลขใบอนุญาตฯ / โรงพยาบาล / ชื่อกิจกรรม..." className="md:col-span-6 touch-target spatial-input px-4 py-2 rounded-xl text-sm" />
                                    <select value={filterProf} onChange={e => setFilterProf(e.target.value)} className="md:col-span-3 touch-target spatial-input px-3 py-2 rounded-xl text-sm font-semibold">
                                        <option value="ALL">ทุกกลุ่มวิชาชีพ</option>
                                        <option value="พยาบาล">เฉพาะพยาบาล (CNEU)</option>
                                        <option value="แพทย์">เฉพาะแพทย์</option>
                                        <option value="บุคลากรสหวิชาชีพ">เฉพาะสหวิชาชีพ</option>
                                    </select>
                                    <select value={filterLearnType} onChange={e => setFilterLearnType(e.target.value)} className="md:col-span-3 touch-target spatial-input px-3 py-2 rounded-xl text-sm font-semibold">
                                        <option value="ALL">ทุกประเภทการเรียน</option>
                                        <option value="CREDIT_TRANSFER">เทียบโอน (100%)</option>
                                        <option value="CONTINUING">เรียนต่อเนื่อง</option>
                                        <option value="NEW_LEARNER">เรียนใหม่</option>
                                    </select>
                                </div>

                                <div className="overflow-x-auto custom-scrollbar rounded-2xl border border-white/10">
                                    <table className="w-full text-left border-collapse text-xs">
                                        <thead className="spatial-thead text-secondary-adaptive">
                                            <tr>
                                                <th className="py-3 px-4">ผู้เรียน &amp; ประเภทการเรียน</th>
                                                <th className="py-3 px-3">กลุ่มวิชาชีพ</th>
                                                <th className="py-3 px-3">ความคืบหน้า</th>
                                                <th className="py-3 px-3">Pre / Post</th>
                                                <th className="py-3 px-3">Skill Lab</th>
                                                <th className="py-3 px-3">สถานะ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-white/10">
                                            {filteredUsers.map((u, idx) => (
                                                <tr key={u.id || idx} className="hover:bg-white/[0.03]">
                                                    <td className="py-3 px-4">
                                                        <div className="flex flex-wrap items-center gap-1.5">
                                                            <span className="font-display font-bold text-sm text-primary-adaptive">{u.name || 'ไม่ระบุชื่อ'}</span>
                                                            <span className={`px-2 py-0.5 rounded-full font-mono text-[9.5px] font-bold ${
                                                                u._learnCode === 'CREDIT_TRANSFER'
                                                                    ? 'bg-aurora-500/20 text-accent-adaptive border border-aurora-400/35'
                                                                    : u._learnCode === 'CONTINUING'
                                                                        ? 'bg-prism-500/20 text-prism-adaptive border border-prism-400/35'
                                                                        : 'spatial-soft text-muted-adaptive'
                                                            }`}>
                                                                {u._learnLabel}
                                                            </span>
                                                        </div>
                                                        <p className="text-[11px] text-muted-adaptive m-0 mt-0.5">
                                                            <span className="font-mono text-prism-adaptive">{u.license || u.id}</span> • {u.hospital || '-'}
                                                            {u.hoursActivityName ? ` • ${u.hoursActivityName}` : ''}
                                                        </p>
                                                    </td>
                                                    <td className="py-3 px-3">
                                                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${u._isNurse ? 'bg-aurora-500/20 text-accent-adaptive' : 'bg-prism-500/20 text-prism-adaptive'}`}>
                                                            {u._prof}{u._isNurse ? ' • CNEU' : ''}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-3 font-mono font-bold text-primary-adaptive">{u._isExempt ? '100%' : `${u.progress || 0}%`}</td>
                                                    <td className="py-3 px-3 font-mono text-secondary-adaptive">{u.pretest || '-'} / <b>{u.posttest || '-'}</b></td>
                                                    <td className="py-3 px-3 font-mono text-prism-adaptive">{u.skillLabBestScore || '-'}</td>
                                                    <td className="py-3 px-3">
                                                        <span className={`px-2.5 py-0.5 rounded-full font-bold text-[10px] ${u.status === 'ผ่าน' ? 'bg-emerald-500/25 text-emerald-300' : 'spatial-soft text-muted-adaptive'}`}>
                                                            {u.status || 'กำลังเรียน'}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredUsers.length === 0 && (
                                                <tr><td colSpan="6" className="py-8 text-center text-muted-adaptive">ไม่พบข้อมูลผู้เรียนตามเงื่อนไขที่เลือก</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        )}

                        {/* ==================== TAB 3: ONSITE HUB & HISTORICAL ARCHIVE ==================== */}
                        {activeTab === 'onsite' && (
                            <div className="space-y-5">
                                {/* ตั้งค่ากิจกรรม Onsite ปัจจุบัน + ผูกหลักสูตรปลายทาง */}
                                <form onSubmit={handleSaveAllSettings} className="spatial-card rounded-[1.75rem] p-5 space-y-4 border-aurora-400/35">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">SINGLE ONSITE REGISTRATION HUB • ผูกสิทธิ์เทียบโอนหลายหลักสูตร</span>
                                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive m-0">ตั้งค่ากิจกรรมที่กำลังเปิดรับสมัครใน onsite.html</h2>
                                        </div>
                                        <a href="./onsite.html" target="_blank" rel="noreferrer" className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-prism-adaptive no-underline">
                                            เปิดหน้าลงทะเบียน onsite.html ↗
                                        </a>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">รหัสกิจกรรม (Event ID • แยกรุ่นไม่ทับของเก่า)</label>
                                            <input required value={onsiteConfig.eventId} onChange={e => setOnsiteConfig(p => ({ ...p, eventId: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl font-mono text-sm font-bold" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-accent-adaptive mb-1 ml-1">หลักสูตรปลายทางที่จะได้รับสิทธิ์เทียบโอน (Target Course)</label>
                                            <select value={onsiteConfig.targetCourseId || DEFAULT_COURSE_ID} onChange={e => setOnsiteConfig(p => ({ ...p, targetCourseId: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm font-semibold">
                                                {Object.values(COURSE_CATALOG).map(c => (
                                                    <option key={c.courseId} value={c.courseId}>{c.titleTH}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ชื่อกิจกรรมอบรม Onsite</label>
                                            <input required value={onsiteConfig.activityTitle} onChange={e => setOnsiteConfig(p => ({ ...p, activityTitle: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">วันที่จัดกิจกรรม</label>
                                            <input value={onsiteConfig.eventDate} onChange={e => setOnsiteConfig(p => ({ ...p, eventDate: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-secondary-adaptive mb-1 ml-1">สถานที่และผู้จัด</label>
                                            <input value={onsiteConfig.venueAndOrganizer} onChange={e => setOnsiteConfig(p => ({ ...p, venueAndOrganizer: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm" />
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
                                        <label className="text-xs font-bold text-primary-adaptive inline-flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={Boolean(onsiteConfig.registrationOpen)} onChange={e => setOnsiteConfig(p => ({ ...p, registrationOpen: e.target.checked }))} className="w-4 h-4 accent-aurora-500" />
                                            <span>เปิดรับลงทะเบียนออนไลน์ใน onsite.html</span>
                                        </label>
                                        <button type="submit" disabled={savingConfig} className="rjc2-pill-btn touch-target px-6 py-2.5 rounded-full font-display font-extrabold text-xs">
                                            {savingConfig ? 'กำลังบันทึก...' : 'บันทึกกิจกรรม & จดทะเบียนลงคลังย้อนหลัง ✓'}
                                        </button>
                                    </div>
                                </form>

                                {/* คลังรายชื่อย้อนหลังแยกตามกิจกรรม */}
                                <section className="spatial-card rounded-[1.75rem] p-5 space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-2.5">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">HISTORICAL ROSTER ARCHIVE • ตรวจสอบรายชื่อย้อนหลังทุกรุ่น</span>
                                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive m-0">รายชื่อผู้ลงทะเบียน ({filteredOnsiteRegistrants.length} ราย)</h2>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            <button type="button" onClick={handleExportOnsiteArchiveCsv} className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-accent-adaptive cursor-pointer">
                                                ส่งออก CSV รุ่นนี้
                                            </button>
                                            <a href={`./onsite.html?mode=organizer&event=${encodeURIComponent(activeOnsiteEventFilter)}`} target="_blank" rel="noreferrer" className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs no-underline">
                                                พิมพ์ใบเซ็นชื่อ A4 (PDF) ↗
                                            </a>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-12 gap-2.5 text-xs">
                                        <select value={activeOnsiteEventFilter} onChange={e => setOnsiteEventFilter(e.target.value)} className="md:col-span-7 touch-target spatial-input px-3.5 py-2 rounded-xl text-sm font-bold">
                                            <option value="ALL">แสดงทุกกิจกรรมรวมกัน ({onsiteRegs.length} ราย)</option>
                                            {mergedOnsiteEvents.map(ev => (
                                                <option key={ev.eventId} value={ev.eventId}>
                                                    {ev.isCurrent ? '★ [ปัจจุบัน] ' : '[ย้อนหลัง] '}{ev.eventId} — {ev.activityTitle}
                                                </option>
                                            ))}
                                        </select>
                                        <input value={onsiteSearch} onChange={e => setOnsiteSearch(e.target.value)} placeholder="ค้นหาชื่อ / เลขใบอนุญาต / โรงพยาบาล..." className="md:col-span-5 touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                    </div>

                                    <div className="overflow-x-auto custom-scrollbar rounded-2xl border border-white/10">
                                        <table className="w-full text-left border-collapse text-xs">
                                            <thead className="spatial-thead text-secondary-adaptive">
                                                <tr>
                                                    <th className="py-3 px-4">ผู้ลงทะเบียน &amp; กิจกรรม</th>
                                                    <th className="py-3 px-3">วิชาชีพ</th>
                                                    <th className="py-3 px-3">โรงพยาบาล</th>
                                                    <th className="py-3 px-3">สถานะสิทธิ์เทียบโอน</th>
                                                    <th className="py-3 px-3 text-right">จัดการ (No-show)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/10">
                                                {filteredOnsiteRegistrants.map((r, i) => (
                                                    <tr key={r.docId || i} className={r.revoked ? 'opacity-55' : ''}>
                                                        <td className="py-3 px-4">
                                                            <p className="font-display font-bold text-sm text-primary-adaptive m-0">{r.name}</p>
                                                            <p className="text-[11px] text-muted-adaptive m-0"><span className="font-mono text-prism-adaptive">{r.license}</span> • <span className="font-mono">{r.eventId}</span></p>
                                                        </td>
                                                        <td className="py-3 px-3">{r.professionGroup || '-'}</td>
                                                        <td className="py-3 px-3">{r.hospital || '-'}</td>
                                                        <td className="py-3 px-3">
                                                            <span className={`px-2.5 py-0.5 rounded-full font-bold text-[10px] ${r.revoked ? 'bg-rose-500/20 text-rose-300' : 'bg-aurora-500/20 text-accent-adaptive'}`}>
                                                                {r.revoked ? 'ยกเลิก (No-show)' : 'เทียบโอน 100%'}
                                                            </span>
                                                        </td>
                                                        <td className="py-3 px-3 text-right">
                                                            <button type="button" onClick={() => handleToggleOnsiteRevoke(r)} className="spatial-soft px-3 py-1 rounded-lg font-bold text-[11px] text-amber-300 cursor-pointer">
                                                                {r.revoked ? 'คืนสิทธิ์' : 'ยกเลิก No-show'}
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {filteredOnsiteRegistrants.length === 0 && (
                                                    <tr><td colSpan="5" className="py-8 text-center text-muted-adaptive">ยังไม่มีรายชื่อในกิจกรรมที่เลือก</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            </div>
                        )}

                        {/* ==================== TAB 4: CNEU & AI SETTINGS ==================== */}
                        {activeTab === 'cneu' && (
                            <form onSubmit={handleSaveAllSettings} className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4 max-w-3xl">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">CNEU (NURSES ONLY) &amp; APPS SCRIPT GATEWAY</span>
                                    <h2 className="font-display font-extrabold text-lg text-primary-adaptive m-0">ตั้งค่าหน่วยคะแนน CNEU และลิงก์หลังบ้าน Code.gs</h2>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-accent-adaptive mb-1 ml-1">รหัสกิจกรรม CNEU (เฉพาะพยาบาล)</label>
                                        <input value={cneuConfig.activityCode} onChange={e => setCneuConfig(p => ({ ...p, activityCode: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl font-mono text-sm" />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-accent-adaptive mb-1 ml-1">จำนวนหน่วยคะแนน CNEU</label>
                                        <input value={cneuConfig.cneuCredits} onChange={e => setCneuConfig(p => ({ ...p, cneuCredits: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl font-mono text-sm" />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-prism-adaptive mb-1 ml-1">จำนวนชั่วโมงอบรม (แพทย์ &amp; สหวิชาชีพ)</label>
                                        <input value={cneuConfig.trainingHours} onChange={e => setCneuConfig(p => ({ ...p, trainingHours: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl font-mono text-sm" />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ชื่อผู้อนุมัติ / ผู้อำนวยการศูนย์ฯ</label>
                                        <input value={cneuConfig.approverName} onChange={e => setCneuConfig(p => ({ ...p, approverName: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm" />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">Google Apps Script Gateway URL (Code.gs /exec)</label>
                                        <input value={appsScriptUrl} onChange={e => setAppsScriptUrl(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl font-mono text-xs" />
                                    </div>
                                </div>
                                <button type="submit" disabled={savingConfig} className="rjc2-pill-btn touch-target px-6 py-3 rounded-full font-display font-extrabold text-xs">
                                    {savingConfig ? 'กำลังบันทึก...' : 'บันทึกการตั้งค่า CNEU & ระบบ AI ✓'}
                                </button>
                            </form>
                        )}

                        {/* ==================== TAB 5: LIVE STREAM CONTROL ==================== */}
                        {activeTab === 'live' && (
                            <form onSubmit={handleSaveAllSettings} className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4 max-w-3xl">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-rose-400 uppercase">LIVE BROADCAST CONTROL</span>
                                    <h2 className="font-display font-extrabold text-lg text-primary-adaptive m-0">ควบคุมห้องถ่ายทอดสดและเอกสารประกอบการบรรยาย</h2>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">สถานะการถ่ายทอดสด</label>
                                        <select value={liveConfig.status} onChange={e => setLiveConfig(p => ({ ...p, status: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm font-bold">
                                            <option value="offline">OFFLINE (ปิดการถ่ายทอดสด)</option>
                                            <option value="live">● ON AIR (กำลังถ่ายทอดสด)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">หัวข้อการบรรยายสด</label>
                                        <input value={liveConfig.topic} onChange={e => setLiveConfig(p => ({ ...p, topic: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm" />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ลิงก์ฝังวิดีโอถ่ายทอดสด (YouTube / Embed URL)</label>
                                        <input value={liveConfig.url} onChange={e => setLiveConfig(p => ({ ...p, url: e.target.value }))} placeholder="https://www.youtube.com/embed/..." className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl font-mono text-xs" />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ลิงก์เอกสารประกอบการบรรยายสด (PDF)</label>
                                        <input value={liveConfig.documentUrl} onChange={e => setLiveConfig(p => ({ ...p, documentUrl: e.target.value }))} placeholder="https://drive.google.com/..." className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl font-mono text-xs" />
                                    </div>
                                </div>
                                <button type="submit" disabled={savingConfig} className="rjc2-pill-btn touch-target px-6 py-3 rounded-full font-display font-extrabold text-xs">
                                    {savingConfig ? 'กำลังบันทึก...' : 'บันทึกการตั้งค่าห้อง Live สด ✓'}
                                </button>
                            </form>
                        )}
                    </main>

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('admin-root'));
        root.render(<AdminErrorBoundary><AdminApp /></AdminErrorBoundary>);
    </script>

    <!-- โหลด Babel ท้ายสุดพร้อม CDN สำรองป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
