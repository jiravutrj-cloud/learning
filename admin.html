                                </div>

                                {certSubTab === 'designer' && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        <div className="lg:col-span-5 spatial-card rounded-[1.75rem] p-5 space-y-3">
                                            <h3 className="font-display font-bold text-base text-primary-adaptive">ตั้งค่าข้อความประกาศนียบัตร (มาตรฐานเท่าเทียมทุกประเภท)</h3>
                                            <FieldInput label="รหัสนำหน้า (Prefix)" value={certTemplate.certPrefix} onChange={e => setCertTemplate(p => ({ ...p, certPrefix: e.target.value }))} />
                                            <FieldInput label="ชื่อหน่วยงาน (ไทย)" value={certTemplate.orgTitleTH} onChange={e => setCertTemplate(p => ({ ...p, orgTitleTH: e.target.value }))} />
                                            <FieldInput label="ชื่อหลักสูตร (ไทย)" value={certTemplate.courseTitleTH} onChange={e => setCertTemplate(p => ({ ...p, courseTitleTH: e.target.value }))} />
                                            <FieldInput label="ชื่อหลักสูตร (อังกฤษ)" value={certTemplate.courseTitleEN} onChange={e => setCertTemplate(p => ({ ...p, courseTitleEN: e.target.value }))} />
                                            <FieldInput label="ชื่อผู้ลงนาม" value={certTemplate.signerName} onChange={e => setCertTemplate(p => ({ ...p, signerName: e.target.value }))} />
                                            <FieldInput label="ตำแหน่งผู้ลงนาม" value={certTemplate.signerPosition} onChange={e => setCertTemplate(p => ({ ...p, signerPosition: e.target.value }))} />
                                            <FieldInput label="URL รูปโลโก้ (PNG พื้นใส)" value={certTemplate.logoUrl} onChange={e => setCertTemplate(p => ({ ...p, logoUrl: e.target.value }))} placeholder="https://..." />
                                            <FieldInput label="URL รูปลายเซ็น (PNG พื้นใส)" value={certTemplate.signatureUrl} onChange={e => setCertTemplate(p => ({ ...p, signatureUrl: e.target.value }))} placeholder="https://..." />
                                            <button type="button" onClick={() => persistSettings({ certTemplate })} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-sm">
                                                บันทึกแม่แบบประกาศนียบัตรขึ้น Cloud
                                            </button>
                                        </div>
                                        <div className="lg:col-span-7 spatial-card rounded-[1.75rem] p-4 space-y-2">
                                            <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">LIVE CERTIFICATE PREVIEW</p>
                                            <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-xl">
                                                <canvas ref={certPreviewCanvasRef} className="w-full h-full object-contain block" />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {certSubTab === 'cneu' && (
                                    <div className="space-y-5">
                                        <div className="no-print spatial-card rounded-[1.75rem] p-5 space-y-3">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                                <FieldInput label="รหัสกิจกรรม CNEU" value={cneuConfig.activityCode} onChange={e => setCneuConfig(p => ({ ...p, activityCode: e.target.value }))} />
                                                <FieldInput label="หน่วยคะแนน (Credits)" value={cneuConfig.cneuCredits} onChange={e => setCneuConfig(p => ({ ...p, cneuCredits: e.target.value }))} />
                                                <FieldInput label="รุ่น / ปีงบประมาณ" value={cneuConfig.batchLabel} onChange={e => setCneuConfig(p => ({ ...p, batchLabel: e.target.value }))} />
                                                <FieldInput className="sm:col-span-2" label="ชื่อหลักสูตร" value={cneuConfig.courseName} onChange={e => setCneuConfig(p => ({ ...p, courseName: e.target.value }))} />
                                                <FieldInput label="ช่วงวันที่จัดอบรม" value={cneuConfig.dateRange} onChange={e => setCneuConfig(p => ({ ...p, dateRange: e.target.value }))} />
                                            </div>
                                            <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                                                <label className="text-xs font-bold text-secondary-adaptive inline-flex items-center gap-2 cursor-pointer">
                                                    <input type="checkbox" checked={cneuIncludeScores} onChange={e => setCneuIncludeScores(e.target.checked)} className="accent-aurora-500" />
                                                    <span>แสดงคอลัมน์ผลประเมิน (ชั่วโมง • Post-test • AI Lab)</span>
                                                </label>
                                                <button type="button" onClick={() => persistSettings({ cneuConfig })} className="rjc2-pill-btn px-5 py-2 rounded-full font-display font-extrabold text-xs">บันทึกข้อมูล CNEU ขึ้น Cloud</button>
                                            </div>
                                        </div>

                                        {/* A4 CNEU Report Printable Area */}
                                        <article id="cneu-print-root" className="cneu-paper rounded-2xl p-6 sm:p-10 space-y-5 max-w-4xl mx-auto">
                                            <div className="text-center border-b-2 border-slate-800 pb-4 space-y-1">
                                                <p className="text-xs font-bold text-emerald-800 uppercase">รายงานสรุปรายชื่อผู้สำเร็จการอบรมเพื่อขอรับรองหน่วยคะแนนการศึกษาต่อเนื่อง (CNEU)</p>
                                                <h2 className="font-display text-lg font-extrabold text-slate-900">{cneuConfig.orgName}</h2>
                                                <p className="text-sm font-bold text-slate-800">{cneuConfig.courseName}</p>
                                                <p className="text-xs text-slate-600">
                                                    รหัสกิจกรรม: <b>{cneuConfig.activityCode}</b> • จำนวน <b>{cneuConfig.cneuCredits} หน่วยคะแนน</b> • {cneuConfig.batchLabel} • {cneuConfig.dateRange}
                                                </p>
                                            </div>

                                            <table className="cneu-table">
                                                <thead>
                                                    <tr>
                                                        <th style={{ width: '42px' }}>ลำดับ</th>
                                                        <th>ชื่อ – นามสกุล</th>
                                                        <th>เลขที่ใบอนุญาตฯ</th>
                                                        <th>หน่วยงาน / โรงพยาบาล</th>
                                                        {cneuIncludeScores && <th>ผลการประเมิน</th>}
                                                        <th>รหัสประกาศนียบัตร</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {cneuPassedUsers.map((u, idx) => {
                                                        const st = getUserFiveStepStatus(u);
                                                        const postPct = parsePosttestScorePct(u.posttest);
                                                        return (
                                                            <tr key={u.id || idx}>
                                                                <td className="text-center font-mono font-bold">{idx + 1}</td>
                                                                <td className="font-bold">{u.name}</td>
                                                                <td className="text-center font-mono">{getUserLicense(u)}</td>
                                                                <td>{u.hospital || '-'}</td>
                                                                {cneuIncludeScores && (
                                                                    <td className="text-center">
                                                                        <div className="font-mono text-[11px] font-bold text-emerald-800">
                                                                            {isHoursExemptUser(u) ? 100 : (u.progress || 0)}% • {u.posttest || '-'} ({postPct}%)
                                                                        </div>
                                                                        <div className="text-[10px] text-slate-500 font-mono">
                                                                            Lab {st.bestLab !== null ? `${st.bestLab}/100` : (st.step3Lab ? 'ผ่าน' : '-')}
                                                                        </div>
                                                                    </td>
                                                                )}
                                                                <td className="text-center font-mono text-[11px]">{u.certificateCode || '-'}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                    {cneuPassedUsers.length === 0 && (
                                                        <tr><td colSpan={cneuIncludeScores ? 6 : 5} className="text-center py-6 text-slate-500">ยังไม่มีรายชื่อผู้สอบผ่านเกณฑ์ ≥80%</td></tr>
                                                    )}
                                                </tbody>
                                            </table>

                                            <div className="signature-block pt-3 space-y-6">
                                                <div className="p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-700 leading-relaxed">
                                                    <b>คำรับรองความถูกต้องของข้อมูล:</b> ข้าพเจ้าขอรับรองว่ารายชื่อผู้สำเร็จการอบรมจำนวน <b>{cneuPassedUsers.length} ราย</b> ข้างต้น เป็นผู้ผ่านการยืนยันตัวตนด้วยรหัส OTP ผ่านเกณฑ์ชั่วโมงการอบรมตามมาตรฐานหลักสูตร ผ่านการฝึกปฏิบัติการสื่อสารใน AI Skill Lab และสอบวัดผลหลังเรียน (Post-test) ได้คะแนนไม่น้อยกว่าร้อยละ 80 ถูกต้องตรงตามฐานข้อมูลระบบ <span className="font-mono font-bold">rjcloud.organ</span> โดยมอบสิทธิ์และเกียรติเท่าเทียมกันทุกราย และสามารถตรวจสอบรหัสประกาศนียบัตรย้อนกลับได้ผ่าน <span className="font-mono">verify.html</span>
                                                </div>
                                                <div className="grid grid-cols-2 gap-8 text-center text-xs pt-4">
                                                    <div className="space-y-1">
                                                        <p>ลงชื่อ ...............................................................</p>
                                                        <p className="font-bold">({cneuConfig.reporterName})</p>
                                                        <p className="text-slate-600">{cneuConfig.reporterPosition}</p>
                                                    </div>
                                                    <div className="space-y-1">
                                                        <p>ลงชื่อ ...............................................................</p>
                                                        <p className="font-bold">({cneuConfig.approverName})</p>
                                                        <p className="text-slate-600">{cneuConfig.approverPosition}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </article>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ==================== TAB 4: LIVE STREAM CONTROL ==================== */}
                        {activeTab === 'live' && (
                            <div className="spatial-card max-w-2xl rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-rose-400 uppercase">LIVE BROADCAST CONTROL</span>
                                    <h2 className="font-display text-xl font-extrabold text-primary-adaptive">ควบคุมห้องถ่ายทอดสด &amp; เกณฑ์ชั่วโมงเรียน</h2>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">สถานะการถ่ายทอดสด</label>
                                        <select value={liveConfig.status} onChange={e => setLiveConfig(p => ({ ...p, status: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2 rounded-xl text-sm">
                                            <option value="offline">ปิดถ่ายทอดสด (Offline)</option>
                                            <option value="live">กำลังถ่ายทอดสด (ON AIR)</option>
                                        </select>
                                    </div>
                                    <FieldInput label="ชั่วโมงเรียนเป้าหมาย (ชม.)" type="number" min="1" max="40" value={liveConfig.hours} onChange={e => setLiveConfig(p => ({ ...p, hours: Number(e.target.value) || 8 }))} />
                                    <FieldInput className="sm:col-span-2" label="หัวข้อการบรรยายสด" value={liveConfig.topic} onChange={e => setLiveConfig(p => ({ ...p, topic: e.target.value }))} />
                                    <FieldInput className="sm:col-span-2" label="URL วิดีโอ Embed (YouTube Live / Zoom Web)" value={liveConfig.url} onChange={e => setLiveConfig(p => ({ ...p, url: e.target.value }))} placeholder="https://www.youtube.com/embed/..." />
                                    <FieldInput className="sm:col-span-2" label="URL เอกสารประกอบการบรรยาย" value={liveConfig.documentUrl} onChange={e => setLiveConfig(p => ({ ...p, documentUrl: e.target.value }))} placeholder="https://..." />
                                </div>
                                <label className="spatial-soft p-3.5 rounded-2xl flex items-center justify-between gap-2 text-xs cursor-pointer">
                                    <span className="font-bold text-accent-adaptive">เปิดสิทธิ์ทำ Post-test ชั่วคราวให้ผู้เรียนทุกคน (Override)</span>
                                    <input type="checkbox" checked={Boolean(liveConfig.allowPosttest)} onChange={e => setLiveConfig(p => ({ ...p, allowPosttest: e.target.checked }))} className="w-5 h-5 accent-aurora-500" />
                                </label>
                                <button type="button" onClick={() => persistSettings({ liveConfig })} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                    บันทึกการตั้งค่า Live สดขึ้น Cloud
                                </button>
                            </div>
                        )}

                        {/* ==================== TAB 5: LESSONS & QUIZ CONTENT MANAGER ==================== */}
                        {activeTab === 'content' && (
                            <div className="space-y-4">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div className="inline-flex p-1 rounded-2xl spatial-soft gap-1">
                                        <button type="button" onClick={() => setContentSubTab('lessons')} className={`px-4 py-2 rounded-xl text-xs font-bold ${contentSubTab === 'lessons' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>บทเรียน ({contentConfig.lessons.length})</button>
                                        <button type="button" onClick={() => setContentSubTab('quiz')} className={`px-4 py-2 rounded-xl text-xs font-bold ${contentSubTab === 'quiz' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>คลังข้อสอบ ({(contentConfig.questionSets[0] || []).length})</button>
                                    </div>
                                    <button type="button" onClick={() => persistContent(contentConfig)} className="rjc2-pill-btn px-5 py-2.5 rounded-full font-display font-extrabold text-xs">
                                        บันทึกเนื้อหาทั้งหมดขึ้น Cloud
                                    </button>
                                </div>

                                {contentSubTab === 'lessons' && (
                                    <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                        {contentConfig.lessons.map((l, idx) => (
                                            <div key={l.id || idx} className="spatial-soft p-3.5 rounded-2xl grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center text-xs">
                                                <span className="sm:col-span-1 font-mono font-bold text-prism-adaptive">#{l.id}</span>
                                                <input value={l.title || ''} onChange={e => { const next = [...contentConfig.lessons]; next[idx] = { ...l, title: e.target.value }; setContentConfig(p => ({ ...p, lessons: next })); }} placeholder="ชื่อบทเรียน" className="sm:col-span-5 spatial-input px-3 py-2 rounded-xl" />
                                                <input value={l.videoId || ''} onChange={e => { const next = [...contentConfig.lessons]; next[idx] = { ...l, videoId: e.target.value }; setContentConfig(p => ({ ...p, lessons: next })); }} placeholder="Google Drive Video ID" className="sm:col-span-3 spatial-input px-3 py-2 rounded-xl font-mono" />
                                                <input value={l.documentUrl || ''} onChange={e => { const next = [...contentConfig.lessons]; next[idx] = { ...l, documentUrl: e.target.value }; setContentConfig(p => ({ ...p, lessons: next })); }} placeholder="URL เอกสาร PDF" className="sm:col-span-3 spatial-input px-3 py-2 rounded-xl" />
                                            </div>
                                        ))}
                                        <button type="button" onClick={() => setContentConfig(p => ({ ...p, lessons: [...p.lessons, { id: p.lessons.length + 1, title: `บทเรียนที่ ${p.lessons.length + 1}`, videoId: '', documentUrl: '' }] }))} className="spatial-soft px-4 py-2 rounded-xl text-xs font-bold text-accent-adaptive">
                                            + เพิ่มบทเรียนใหม่
                                        </button>
                                    </div>
                                )}

                                {contentSubTab === 'quiz' && (
                                    <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3 max-h-[600px] overflow-y-auto custom-scrollbar">
                                        {(contentConfig.questionSets[0] || []).map((q, idx) => (
                                            <div key={q.id || idx} className="spatial-soft p-3.5 rounded-2xl space-y-2 text-xs">
                                                <p className="font-bold text-primary-adaptive"><span className="font-mono text-prism-adaptive mr-1.5">{idx + 1}.</span>{q.question}</p>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                                    {(q.options || []).map((op, oi) => (
                                                        <div key={oi} className={`px-2.5 py-1.5 rounded-lg ${Number(q.answer) === oi ? 'bg-aurora-500/20 text-accent-adaptive font-bold' : 'text-secondary-adaptive'}`}>
                                                            {Number(q.answer) === oi ? '✓ ' : ''}{op}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ==================== TAB 6: CLOUD & ECO 1-READ SUMMARY GUARD ==================== */}
                        {activeTab === 'sync' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <div className="spatial-card rounded-[1.75rem] p-5 space-y-4">
                                    <h2 className="font-display font-extrabold text-lg text-primary-adaptive">เชื่อมต่อ Google Apps Script (OTP &amp; Gemini AI)</h2>
                                    <FieldInput label="Google Apps Script Web App URL" value={systemConfig.appsScriptUrl} onChange={e => setSystemConfig(p => ({ ...p, appsScriptUrl: e.target.value }))} placeholder="https://script.google.com/macros/s/.../exec" />
                                    <FieldInput label="Master CSV URL (สำรอง)" value={systemConfig.masterCsvUrl} onChange={e => setSystemConfig(p => ({ ...p, masterCsvUrl: e.target.value }))} placeholder="https://docs.google.com/spreadsheets/..." />
                                    <button type="button" onClick={() => persistSettings(systemConfig)} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-sm">
                                        บันทึกการเชื่อมต่อ Cloud
                                    </button>
                                </div>

                                <div className="spatial-card rounded-[1.75rem] p-5 space-y-4 border-aurora-400/35">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">ZERO-COST SCALABILITY GUARD</span>
                                        <h2 className="font-display font-extrabold text-lg text-primary-adaptive">รีเฟรชเอกสารสรุป 1-Read (`executive_summary/global`)</h2>
                                        <p className="text-xs text-secondary-adaptive mt-1 leading-relaxed">
                                            รวมยอดผู้เรียนทั้งหมด, 13 เขตสุขภาพ, CSAT, SUS Score และ Pre/Post Self-Efficacy ลงเอกสารใบเดียว เพื่อให้หน้า <b>executive.html</b> อ่านเพียง 1 ครั้ง ประหยัดโควต้า Firebase ฟรีมากกว่า 99% ค่ะ
                                        </p>
                                    </div>
                                    <button type="button" disabled={rebuildingSummary} onClick={handleRebuildGlobalSummary} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm disabled:opacity-50">
                                        {rebuildingSummary ? 'กำลังคำนวณยอดสรุประดับประเทศ...' : `คำนวณยอดสรุปใหม่จากผู้เรียน ${usersList.length} ราย`}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ==================== TAB 7: PAGE INSPECTOR (15 SCREENS) ==================== */}
                        {activeTab === 'overview' && (
                            <div className="space-y-5">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">SYSTEM QUALITY ASSURANCE</span>
                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive mt-1">
                                        ศูนย์ตรวจสอบทุกหน้าจอในระบบ (ครบทั้ง 15 หน้า)
                                    </h2>
                                </div>
                                {inspectorGroups.map(grp => (
                                    <div key={grp.groupTitle} className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                        <h3 className="font-display font-bold text-sm text-accent-adaptive">{grp.groupTitle}</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                                            {grp.items.map(it => (
                                                <a key={it.id} href={it.url} target="_blank" rel="noreferrer" className="spatial-soft hover:border-aurora-400 p-3.5 rounded-2xl flex items-start gap-3 transition-all">
                                                    <div className="w-9 h-9 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center shrink-0"><Icon name={it.icon} size={17} /></div>
                                                    <div className="min-w-0">
                                                        <p className="font-display font-bold text-xs sm:text-sm text-primary-adaptive">{it.title}</p>
                                                        <p className="text-[11px] text-muted-adaptive mt-0.5 leading-snug">{it.desc}</p>
                                                    </div>
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Mobile Bottom Spatial Dock (ครบทั้ง 7 เมนู) */}
                    <nav className="no-print lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-1.5 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]">
                        <div className="grid grid-cols-7 gap-0.5 max-w-xl mx-auto">
                            {navItems.map(item => {
                                const active = activeTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => { setActiveTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[9px] font-bold transition-all active:scale-95 ${
                                            active ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-sm' : 'text-secondary-adaptive'
                                        }`}
                                    >
                                        <Icon name={item.icon} size={16} />
                                        <span className="truncate max-w-full px-0.5">{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    {/* Modal มอบสิทธิ์ ชั่วโมงครบ (เทียบโอน) และระบุชื่อกิจกรรมมาตรฐานรายบุคคล */}
                    {transferModal.open && transferModal.user && (
                        <div className="no-print fixed inset-0 z-[132] bg-slate-950/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <form onSubmit={handleSaveTransferModal} className="spatial-card w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-6 space-y-4">
                                <div className="flex items-start justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">FAST-TRACK HOURS &amp; ACTIVITY REFERENCE</span>
                                        <h3 className="font-display font-extrabold text-lg text-primary-adaptive">จัดการสิทธิ์ชั่วโมงอบรม &amp; กิจกรรมอ้างอิง</h3>
                                        <p className="text-xs text-secondary-adaptive">{transferModal.user.name} ({getUserLicense(transferModal.user)})</p>
                                    </div>
                                    <button type="button" onClick={() => setTransferModal(p => ({ ...p, open: false, user: null }))} className="spatial-soft w-8 h-8 rounded-xl flex items-center justify-center text-muted-adaptive">
                                        <Icon name="X" size={16} />
                                    </button>
                                </div>

                                <label className="spatial-soft p-3.5 rounded-2xl flex items-center justify-between gap-3 cursor-pointer">
                                    <div>
                                        <p className="text-sm font-bold text-accent-adaptive">มอบสิทธิ์ “ชั่วโมงครบ (เทียบโอน)” 100%</p>
                                        <p className="text-xs text-muted-adaptive">ผู้เรียนสามารถทำ Pre-test → AI Skill Lab 3D → Post-test ≥ 80% ได้ทันทีโดยไม่ต้องสะสมเวลาวิดีโอซ้ำ</p>
                                    </div>
                                    <input type="checkbox" checked={Boolean(transferModal.studyHoursExempt)} onChange={e => setTransferModal(p => ({ ...p, studyHoursExempt: e.target.checked }))} className="w-5 h-5 accent-aurora-500 shrink-0" />
                                </label>

                                {transferModal.studyHoursExempt && (
                                    <div className="space-y-3">
                                        <FieldInput label="ชื่อกิจกรรมอ้างอิง *" required value={transferModal.hoursActivityName} onChange={e => setTransferModal(p => ({ ...p, hoursActivityName: e.target.value }))} placeholder="เช่น การอบรมเชิงปฏิบัติการรับบริจาคอวัยวะ รุ่นที่ 1/2570" />
                                        <FieldInput label="วัน/เดือน/ปี ที่จัดกิจกรรม" value={transferModal.hoursActivityDate} onChange={e => setTransferModal(p => ({ ...p, hoursActivityDate: e.target.value }))} placeholder="เช่น 15 – 16 มกราคม 2570" />
                                        <FieldInput label="สถานที่ / หน่วยงานที่จัด" value={transferModal.hoursActivityVenue} onChange={e => setTransferModal(p => ({ ...p, hoursActivityVenue: e.target.value }))} placeholder="เช่น ห้องประชุมพิบูลสงคราม โรงพยาบาลราชวิถี" />
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-2.5 pt-2">
                                    <button type="button" onClick={() => setTransferModal(p => ({ ...p, open: false, user: null }))} className="touch-target spatial-soft py-3 rounded-2xl font-bold text-sm text-primary-adaptive">ยกเลิก</button>
                                    <button type="submit" className="rjc2-pill-btn touch-target py-3 rounded-2xl font-display font-extrabold text-sm">บันทึกสิทธิ์ขึ้น Cloud</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('admin-root'));
        root.render(<AdminErrorBoundary><AdminApp /></AdminErrorBoundary>);
    </script>
</body>
</html>
