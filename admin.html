                                        <div className="sm:col-span-2 neu-inset p-4 space-y-2">
                                            <label className="block text-xs font-bold text-prism-adaptive">วันและเวลาที่เปิดให้เข้า organ cloud 2.0 (แสดงบนบัตร Digital Onsite Pass เช่น 16:00 น.)</label>
                                            <input type="datetime-local" value={onsiteDraft.unlockAtLocal} onChange={e => setOnsiteDraft(p => ({ ...p, unlockAtLocal: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl font-mono text-sm font-bold" />
                                            <p className="text-[11px] text-secondary-adaptive">เวลาเปิดระบบปัจจุบัน: <b className="text-accent-adaptive">{formatThaiDateTimeFull(onsiteConfig.unlockAt)}</b></p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                                        <label className="neu-inset p-3.5 flex items-center justify-between gap-2 cursor-pointer">
                                            <span className="font-bold text-primary-adaptive">เปิดรับสมัครออนไลน์บน onsite.html</span>
                                            <input type="checkbox" checked={Boolean(onsiteDraft.registrationOpen)} onChange={e => setOnsiteDraft(p => ({ ...p, registrationOpen: e.target.checked }))} className="w-5 h-5 accent-emerald-600" />
                                        </label>
                                        <label className="neu-inset p-3.5 flex items-center justify-between gap-2 cursor-pointer">
                                            <span className="font-bold text-accent-adaptive">เปิดสิทธิ์ทันที (ข้ามเวลานับถอยหลัง)</span>
                                            <input type="checkbox" checked={Boolean(onsiteDraft.forceUnlocked)} onChange={e => setOnsiteDraft(p => ({ ...p, forceUnlocked: e.target.checked }))} className="w-5 h-5 accent-emerald-600" />
                                        </label>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <button type="button" onClick={handleSaveOnsiteConfig} className="rjc2-pill-btn touch-target py-3.5 font-display font-extrabold text-xs sm:text-sm">บันทึกกิจกรรม &amp; เวลาเปิดระบบขึ้น Cloud</button>
                                        <button type="button" disabled={onsiteSyncing} onClick={handleBatchSyncOnsiteToLearners} className="neu-btn touch-target py-3.5 font-display font-bold text-xs sm:text-sm text-accent-adaptive">
                                            {onsiteSyncing ? 'กำลังซิงค์...' : `ซิงค์สิทธิ์เทียบโอนให้ผู้สมัคร (${onsiteStats.total} ราย)`}
                                        </button>
                                    </div>
                                </div>

                                <div className="spatial-card rounded-[28px] p-4 sm:p-5 space-y-3.5">
                                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-2.5">
                                        <div className="relative flex-1">
                                            <Icon name="Search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-adaptive" />
                                            <input value={onsiteSearch} onChange={e => setOnsiteSearch(e.target.value)} placeholder="ค้นหารายชื่อผู้สมัคร Onsite, เลขใบอนุญาต, โรงพยาบาล..." className="touch-target spatial-input w-full pl-10 pr-4 py-2 rounded-2xl text-xs sm:text-sm" />
                                        </div>
                                        <div className="flex flex-wrap gap-1.5">
                                            <select value={onsiteEventFilter} onChange={e => setOnsiteEventFilter(e.target.value)} className="spatial-input px-3 py-2 rounded-full text-xs font-bold">
                                                <option value="ALL">ทุกรุ่นกิจกรรม ({onsiteRegistrants.length})</option>
                                                {onsiteEventIds.map(evId => <option key={evId} value={evId}>รุ่น {evId}</option>)}
                                            </select>
                                            {['ALL', 'แพทย์', 'พยาบาล', 'บุคลากรสหวิชาชีพ'].map(pg => (
                                                <button key={pg} type="button" onClick={() => setOnsiteFilterProf(pg)} className={`neu-btn px-3.5 py-2 text-xs font-bold shrink-0 ${onsiteFilterProf === pg ? 'is-pressed' : ''}`}>
                                                    {pg === 'ALL' ? 'ทุกวิชาชีพ' : pg}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto custom-scrollbar">
                                        <table className="w-full text-left border-collapse text-xs">
                                            <thead className="spatial-thead font-mono text-[10px] uppercase text-muted-adaptive">
                                                <tr>
                                                    <th className="py-3 px-3 rounded-l-xl">ผู้สมัคร / เลขใบอนุญาต / รุ่น</th>
                                                    <th className="py-3 px-3">กลุ่มวิชาชีพ</th>
                                                    <th className="py-3 px-3">โรงพยาบาล / จังหวัด / เขตสุขภาพ</th>
                                                    <th className="py-3 px-3">สถานะเทียบโอน</th>
                                                    <th className="py-3 px-3 text-right rounded-r-xl">จัดการ (No-show)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="neu-divide">
                                                {filteredOnsiteRegistrants.map(r => {
                                                    const isCancel = Boolean(r.revoked || r.cancelled);
                                                    return (
                                                        <tr key={r.id || r.license} className={isCancel ? 'opacity-55' : ''}>
                                                            <td className="py-3 px-3">
                                                                <p className="font-bold text-primary-adaptive">{r.name}</p>
                                                                <p className="font-mono text-[11px] text-prism-adaptive">{r.license} {r.eventId ? `• ${r.eventId}` : ''}</p>
                                                            </td>
                                                            <td className="py-3 px-3 font-semibold text-secondary-adaptive">{r.professionGroup || '-'}</td>
                                                            <td className="py-3 px-3"><p className="font-semibold text-primary-adaptive">{r.hospital}</p><p className="text-[11px] text-muted-adaptive">จ.{r.province || '-'} • {r.region || '-'}</p></td>
                                                            <td className="py-3 px-3">
                                                                <span className={`px-3 py-1 rounded-full text-[11px] font-bold bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] ${isCancel ? 'text-rose-adaptive' : 'text-accent-adaptive'}`}>
                                                                    {isCancel ? 'ยกเลิกสิทธิ์แล้ว' : 'เทียบโอน 100%'}
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-3 text-right">
                                                                <button type="button" onClick={() => handleToggleOnsiteRevoke(r)} className={`neu-btn px-3.5 py-1.5 font-bold text-[11px] ${isCancel ? 'text-accent-adaptive' : 'text-rose-adaptive'}`}>
                                                                    {isCancel ? 'คืนสิทธิ์เทียบโอน' : 'ยกเลิกสิทธิ์ (ไม่มางาน)'}
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {filteredOnsiteRegistrants.length === 0 && (
                                                    <tr><td colSpan="5" className="py-8 text-center text-muted-adaptive">ยังไม่มีรายชื่อผู้ลงทะเบียน Onsite ในตัวกรองนี้ค่ะ</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ==================== TAB 3: COURSE CATALOG MANAGER, LESSONS & QUIZ ==================== */}
                        {activeTab === 'content' && (
                            <div key="tab_content" className="oc-screen-enter space-y-4">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => setContentSubTab('courses')} className={`neu-btn px-4 py-2 text-xs font-display font-bold ${contentSubTab === 'courses' ? 'is-pressed' : ''}`}>
                                            จัดการหลักสูตร ({courseCatalog.length})
                                        </button>
                                        <button type="button" onClick={() => setContentSubTab('lessons')} className={`neu-btn px-4 py-2 text-xs font-display font-bold ${contentSubTab === 'lessons' ? 'is-pressed' : ''}`}>
                                            บทเรียน ({contentConfig.lessons.length})
                                        </button>
                                        <button type="button" onClick={() => setContentSubTab('quiz')} className={`neu-btn px-4 py-2 text-xs font-display font-bold ${contentSubTab === 'quiz' ? 'is-pressed' : ''}`}>
                                            คลังข้อสอบ ({(contentConfig.questionSets[0] || []).length})
                                        </button>
                                    </div>

                                    {contentSubTab === 'courses' ? (
                                        <div className="flex flex-wrap gap-2">
                                            <button type="button" onClick={() => setShowAddCourseForm(v => !v)} className="neu-btn px-4 py-2.5 text-xs font-bold text-rose-adaptive">
                                                <Icon name="Plus" size={14} /> เพิ่มหลักสูตรใหม่
                                            </button>
                                            <button type="button" onClick={() => persistSettings({ courseCatalog }, 'บันทึกรายการหลักสูตรทั้งหมดขึ้น Cloud และอัปเดตหน้าเว็บแล้วค่ะ')} className="rjc2-pill-btn px-5 py-2.5 font-display font-extrabold text-xs inline-flex items-center gap-1.5">
                                                <Icon name="Save" size={14} /> บันทึกการแก้ไขหลักสูตรขึ้น Cloud
                                            </button>
                                        </div>
                                    ) : (
                                        <button type="button" onClick={() => persistContent(contentConfig)} className="rjc2-pill-btn px-5 py-2.5 font-display font-extrabold text-xs">
                                            บันทึกบทเรียนและข้อสอบขึ้น Cloud
                                        </button>
                                    )}
                                </div>

                                {/* SUB-TAB A: COURSE CATALOG MANAGEMENT */}
                                {contentSubTab === 'courses' && (
                                    <div key="sub_courses" className="oc-step-enter space-y-4">
                                        <div className="spatial-card rounded-[28px] p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-rose-adaptive uppercase">MULTI-COURSE HUB • REAL-TIME SYNC TO INDEX.HTML &amp; ONSITE.HTML</span>
                                                <h3 className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive mt-0.5">ควบคุมหลักสูตรที่แสดงหน้ายืนยันตัวตนบุคลากร</h3>
                                                <p className="text-xs text-secondary-adaptive mt-0.5">หลักสูตรที่เปิดสถานะ <b>“เปิดแสดงผล”</b> จะปรากฏเป็นการ์ดเลือกหลักสูตรบนหน้าแรกทันที และหากกด <b>“ปิดซ่อนไว้”</b> จะไม่แสดงให้ผู้เรียนเลือกค่ะ</p>
                                            </div>
                                            <div className="flex gap-2 text-xs font-mono shrink-0">
                                                <span className="px-3.5 py-1.5 rounded-full bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] text-accent-adaptive font-bold">เปิดสอน {courseCatalog.filter(c => c.active !== false).length}</span>
                                                <span className="px-3.5 py-1.5 rounded-full bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] text-muted-adaptive font-bold">ซ่อนไว้ {courseCatalog.filter(c => c.active === false).length}</span>
                                            </div>
                                        </div>

                                        {showAddCourseForm && (
                                            <form onSubmit={handleAddCourse} className="spatial-card rounded-[1.75rem] p-5 space-y-3.5 border-aurora-400/45">
                                                <div className="flex items-center justify-between">
                                                    <h4 className="font-display font-bold text-sm text-accent-adaptive">เพิ่มหลักสูตรใหม่เข้าศูนย์กลางข้อมูล</h4>
                                                    <button type="button" onClick={() => setShowAddCourseForm(false)} className="text-muted-adaptive hover:text-primary-adaptive"><Icon name="X" size={16} /></button>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                                    <FieldInput className="sm:col-span-2" label="ชื่อหลักสูตร (ภาษาไทย) *" required value={newCourseForm.titleTH} onChange={e => setNewCourseForm(p => ({ ...p, titleTH: e.target.value }))} placeholder="เช่น หลักสูตรการดูแลผู้ป่วยปลูกถ่ายตับ 2027" />
                                                    <FieldInput label="รหัสหลักสูตร (Code)" value={newCourseForm.code} onChange={e => setNewCourseForm(p => ({ ...p, code: e.target.value }))} placeholder="เช่น LTX-2027" />
                                                    <FieldInput label="Course ID (ภาษาอังกฤษ ไม่มีเว้นวรรค)" value={newCourseForm.id} onChange={e => setNewCourseForm(p => ({ ...p, id: e.target.value }))} placeholder="เว้นว่าง = สร้างอัตโนมัติ" />
                                                    <FieldInput className="sm:col-span-2" label="คำอธิบายสั้น / ชื่ออังกฤษ (แสดงใต้ชื่อหลักสูตร)" value={newCourseForm.subtitleTH} onChange={e => setNewCourseForm(p => ({ ...p, subtitleTH: e.target.value }))} placeholder="เช่น สำหรับแพทย์ พยาบาล ICU และห้องผ่าตัด" />
                                                    <FieldInput label="จำนวนชั่วโมงอบรม" type="number" min="1" max="100" value={newCourseForm.trainingHours} onChange={e => setNewCourseForm(p => ({ ...p, trainingHours: e.target.value }))} />
                                                    <FieldInput label="หน่วยคะแนน CNEU (พยาบาล)" value={newCourseForm.cneuCredits} onChange={e => setNewCourseForm(p => ({ ...p, cneuCredits: e.target.value }))} placeholder="8.0" />
                                                </div>
                                                <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                                                    <label className="inline-flex items-center gap-2 text-xs font-bold text-primary-adaptive cursor-pointer">
                                                        <input type="checkbox" checked={Boolean(newCourseForm.active)} onChange={e => setNewCourseForm(p => ({ ...p, active: e.target.checked }))} className="w-4 h-4 accent-aurora-500" />
                                                        <span>เปิดแสดงผลบนหน้าลงทะเบียนทันที</span>
                                                    </label>
                                                    <div className="flex gap-2">
                                                        <button type="button" onClick={() => setShowAddCourseForm(false)} className="spatial-soft px-4 py-2 rounded-xl text-xs font-bold text-secondary-adaptive">ยกเลิก</button>
                                                        <button type="submit" className="rjc2-pill-btn px-5 py-2 rounded-xl font-display font-extrabold text-xs">+ เพิ่มและบันทึกขึ้น Cloud</button>
                                                    </div>
                                                </div>
                                            </form>
                                        )}

                                        <div className="space-y-3">
                                            {courseCatalog.map((c, idx) => {
                                                const isActive = c.active !== false;
                                                return (
                                                    <div key={c.id || idx} className={`spatial-card rounded-[24px] p-4 sm:p-5 space-y-3 transition-all ${isActive ? '' : 'opacity-70'}`}>
                                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <span className="px-3 py-0.5 rounded-full bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] font-mono text-[11px] font-bold text-prism-adaptive">ID: {c.id}</span>
                                                                <span className={`px-3 py-0.5 rounded-full text-[11px] font-bold bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] ${isActive ? 'text-accent-adaptive' : 'text-muted-adaptive'}`}>
                                                                    {isActive ? '● เปิดแสดงผลหน้าเว็บ' : '○ ปิดซ่อนไว้'}
                                                                </span>
                                                            </div>
                                                            <div className="flex items-center gap-2">
                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleToggleCourseActive(idx)}
                                                                    className={`neu-btn px-3.5 py-1.5 text-xs font-bold ${isActive ? 'text-amber-adaptive' : 'text-accent-adaptive'}`}
                                                                >
                                                                    {isActive ? 'ปิดซ่อนหลักสูตร' : 'เปิดแสดงผล'}
                                                                </button>
                                                                <button type="button" onClick={() => handleDeleteCourse(c)} className="neu-btn w-8 h-8 text-rose-adaptive" title="ลบหลักสูตร">
                                                                    <Icon name="Trash2" size={15} />
                                                                </button>
                                                            </div>
                                                        </div>

                                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-2.5 text-xs">
                                                            <div className="lg:col-span-5">
                                                                <label className="block text-[11px] text-muted-adaptive mb-1">ชื่อหลักสูตร (ไทย)</label>
                                                                <input value={c.titleTH || ''} onChange={e => handleUpdateCourseField(idx, 'titleTH', e.target.value)} className="spatial-input w-full px-3 py-2 rounded-xl font-bold" />
                                                            </div>
                                                            <div className="lg:col-span-3">
                                                                <label className="block text-[11px] text-muted-adaptive mb-1">คำอธิบายสั้น / ชื่ออังกฤษ</label>
                                                                <input value={c.subtitleTH || c.titleEN || ''} onChange={e => handleUpdateCourseField(idx, 'subtitleTH', e.target.value)} className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                            </div>
                                                            <div className="lg:col-span-2">
                                                                <label className="block text-[11px] text-muted-adaptive mb-1">รหัส (Code)</label>
                                                                <input value={c.code || ''} onChange={e => handleUpdateCourseField(idx, 'code', e.target.value)} className="spatial-input w-full px-3 py-2 rounded-xl font-mono" />
                                                            </div>
                                                            <div className="lg:col-span-1">
                                                                <label className="block text-[11px] text-muted-adaptive mb-1">ชั่วโมง</label>
                                                                <input type="number" min="1" max="100" value={c.trainingHours || 8} onChange={e => handleUpdateCourseField(idx, 'trainingHours', Number(e.target.value) || 8)} className="spatial-input w-full px-2.5 py-2 rounded-xl font-mono text-center" />
                                                            </div>
                                                            <div className="lg:col-span-1">
                                                                <label className="block text-[11px] text-muted-adaptive mb-1">CNEU</label>
                                                                <input value={c.cneuCredits || ''} onChange={e => handleUpdateCourseField(idx, 'cneuCredits', e.target.value)} className="spatial-input w-full px-2.5 py-2 rounded-xl font-mono text-center" />
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* SUB-TAB B: LESSONS */}
                                {contentSubTab === 'lessons' && (
                                    <div key="sub_lessons" className="oc-step-enter spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                        {contentConfig.lessons.map((l, idx) => (
                                            <div key={l.id || idx} className="spatial-soft p-3.5 rounded-2xl grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center text-xs">
                                                <span className="sm:col-span-1 font-mono font-bold text-prism-adaptive">#{l.id}</span>
                                                <input value={l.title || ''} onChange={e => { const next = [...contentConfig.lessons]; next[idx] = { ...l, title: e.target.value }; setContentConfig(p => ({ ...p, lessons: next })); }} placeholder="ชื่อบทเรียน" className="sm:col-span-5 spatial-input px-3 py-2 rounded-xl" />
                                                <input value={l.videoId || ''} onChange={e => { const next = [...contentConfig.lessons]; next[idx] = { ...l, videoId: e.target.value }; setContentConfig(p => ({ ...p, lessons: next })); }} placeholder="Google Drive Video ID" className="sm:col-span-3 spatial-input px-3 py-2 rounded-xl font-mono" />
                                                <input value={l.documentUrl || ''} onChange={e => { const next = [...contentConfig.lessons]; next[idx] = { ...l, documentUrl: e.target.value }; setContentConfig(p => ({ ...p, lessons: next })); }} placeholder="URL เอกสาร PDF" className="sm:col-span-3 spatial-input px-3 py-2 rounded-xl" />
                                            </div>
                                        ))}
                                        <button type="button" onClick={() => setContentConfig(p => ({ ...p, lessons: [...p.lessons, { id: p.lessons.length + 1, title: `บทเรียนที่ ${p.lessons.length + 1}`, videoId: '', documentUrl: '' }] }))} className="spatial-soft px-4 py-2 rounded-xl text-xs font-bold text-accent-adaptive">
                                            + เพิ่มบทเรียนใหม่
                                        </button>
                                    </div>
                                )}

                                {/* SUB-TAB C: QUIZ */}
                                {contentSubTab === 'quiz' && (
                                    <div key="sub_quiz" className="oc-step-enter spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3 max-h-[600px] overflow-y-auto custom-scrollbar">
                                        {(contentConfig.questionSets[0] || []).map((q, idx) => (
                                            <div key={q.id || idx} className="spatial-soft p-3.5 rounded-2xl space-y-2 text-xs">
                                                <p className="font-bold text-primary-adaptive"><span className="font-mono text-prism-adaptive mr-1.5">{idx + 1}.</span>{q.question}</p>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                                    {(q.options || []).map((op, oi) => (
                                                        <div key={oi} className={`px-2.5 py-1.5 rounded-lg ${Number(q.answer) === oi ? 'bg-aurora-500/20 text-accent-adaptive font-bold' : 'text-secondary-adaptive'}`}>
                                                            {Number(q.answer) === oi ? '✓ ' : ''}{op}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ==================== TAB 4: CERTIFICATE DESIGNER & CNEU REPORT STUDIO ==================== */}
                        {activeTab === 'cert' && (
                            <div key="tab_cert" className="oc-screen-enter space-y-5">
                                <div className="no-print flex flex-wrap items-center justify-between gap-2">
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={() => setCertSubTab('cneu')} className={`neu-btn px-4 py-2 text-xs font-display font-bold ${certSubTab === 'cneu' ? 'is-pressed' : ''}`}>
                                            รายงาน CNEU (เฉพาะพยาบาล) &amp; แยกวิชาชีพ
                                        </button>
                                        <button type="button" onClick={() => setCertSubTab('designer')} className={`neu-btn px-4 py-2 text-xs font-display font-bold ${certSubTab === 'designer' ? 'is-pressed' : ''}`}>
                                            ออกแบบประกาศนียบัตร
                                        </button>
                                    </div>

                                    {certSubTab === 'cneu' && (
                                        <div className="flex flex-wrap gap-2">

                                            disabled={rebuildingSummary}
                                            onClick={handleRebuildGlobalSummary}
                                            className="neu-btn touch-target px-5 py-3 text-xs font-display font-bold text-accent-adaptive shrink-0"
                                        >
                                            <Icon name="RefreshCw" size={15} className={rebuildingSummary ? 'animate-spin' : ''} />
                                            <span>{rebuildingSummary ? 'กำลังประมวลผล...' : 'อัปเดตสรุป 1-Read ทันที'}</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ==================== TAB 7: LIVE MULTI-PAGE PREVIEW & SYSTEM INSPECTOR ==================== */}
                        {activeTab === 'overview' && (
                            <div key="tab_overview" className="oc-screen-enter space-y-5">
                                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">ADMIN LIVE PREVIEW STUDIO • ALL ECOSYSTEM PAGES</span>
                                        <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive mt-0.5">ตรวจสอบตัวอย่างจริงได้ครบทุกหน้า (e-Learning &amp; Website)</h2>
                                        <p className="text-xs text-secondary-adaptive mt-0.5">เลือกหน้าที่ต้องการตรวจสอบด้านซ้าย แล้วสลับขนาดหน้าจอ Desktop / Tablet / Mobile เพื่อตรวจความสมบูรณ์จริงแบบเรียลไทม์ค่ะ</p>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-2 shrink-0">
                                        <button
                                            type="button"
                                            onClick={handleToggleAdminPreviewSession}
                                            className={`neu-btn touch-target px-4 py-2 text-xs font-display font-bold ${adminPreviewSessionActive ? 'is-pressed text-accent-adaptive' : 'text-rose-adaptive'}`}
                                        >
                                            <Icon name={adminPreviewSessionActive ? 'ShieldCheck' : 'KeyRound'} size={15} />
                                            <span>{adminPreviewSessionActive ? 'โหมด Admin Preview: เปิดอยู่ (คลิกเพื่อล้าง)' : 'เปิด Admin Preview (ตรวจห้องเรียน/Skill Lab)'}</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                    {/* Left Page Selector Rail (Col 4) */}
                                    <aside className="lg:col-span-4 spatial-card rounded-[28px] p-4 space-y-4 max-h-[760px] overflow-y-auto custom-scrollbar">
                                        {['e-Learning (learn.coerj.com)', 'Website Portal (coerj.com)'].map(groupName => (
                                            <div key={groupName} className="space-y-2">
                                                <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase block px-1">
                                                    {groupName}
                                                </span>
                                                <div className="space-y-2">
                                                    {inspectorLinks.filter(x => x.group === groupName).map(it => {
                                                        const active = activePreviewPage?.id === it.id;
                                                        return (
                                                            <button
                                                                key={it.id}
                                                                type="button"
                                                                onClick={() => {
                                                                    setPreviewPageId(it.id);
                                                                    if (it.requiresSession && !adminPreviewSessionActive) {
                                                                        showToast('แนะนำกดปุ่ม “เปิด Admin Preview” ด้านบน เพื่อข้ามหน้า OTP เข้าตรวจดูด้านในได้ทันทีค่ะ', 'info');
                                                                    }
                                                                }}
                                                                className={`w-full text-left p-3.5 rounded-2xl flex items-start gap-3 transition-all ${active ? 'neu-nav-active' : 'spatial-soft'}`}
                                                            >
                                                                <div className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 ${active ? 'bg-emerald-500/20 text-accent-adaptive' : 'bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] text-secondary-adaptive'}`}>
                                                                    <Icon name={it.icon} size={16} />
                                                                </div>
                                                                <div className="min-w-0 flex-1">
                                                                    <div className="flex items-center justify-between gap-1.5">
                                                                        <p className="font-display font-bold text-xs sm:text-[13px] text-primary-adaptive truncate m-0">{it.title}</p>
                                                                        {it.requiresSession && (
                                                                            <span className="font-mono text-[9px] px-1.5 py-0.5 rounded-full bg-rose-500/15 text-rose-adaptive shrink-0">AUTH</span>
                                                                        )}
                                                                    </div>
                                                                    <p className="text-[11px] text-muted-adaptive mt-0.5 leading-snug m-0">{it.desc}</p>
                                                                </div>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </aside>

                                    {/* Right Live Interactive Iframe Preview Stage (Col 8) */}
                                    <section className="lg:col-span-8 spatial-card rounded-[28px] p-4 sm:p-5 space-y-4">
                                        {/* Stage Toolbar */}
                                        <div className="flex flex-wrap items-center justify-between gap-2.5 pb-3 border-b border-[var(--neu-divider)]">
                                            <div className="min-w-0">
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase block">LIVE PREVIEWING</span>
                                                <h3 className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive truncate m-0">
                                                    {activePreviewPage?.title}
                                                </h3>
                                            </div>

                                            <div className="flex flex-wrap items-center gap-1.5">
                                                {[
                                                    { id: 'desktop', label: 'Desktop', icon: 'Monitor' },
                                                    { id: 'tablet', label: 'Tablet', icon: 'Tablet' },
                                                    { id: 'mobile', label: 'Mobile', icon: 'Smartphone' }
                                                ].map(vp => (
                                                    <button
                                                        key={vp.id}
                                                        type="button"
                                                        onClick={() => setPreviewViewport(vp.id)}
                                                        className={`neu-btn px-3 py-1.5 text-[11px] font-display font-bold ${previewViewport === vp.id ? 'is-pressed' : ''}`}
                                                    >
                                                        <Icon name={vp.icon} size={13} />
                                                        <span className="hidden sm:inline">{vp.label}</span>
                                                    </button>
                                                ))}
                                                <button
                                                    type="button"
                                                    onClick={() => setPreviewReloadKey(k => k + 1)}
                                                    className="neu-btn w-9 h-9 text-accent-adaptive"
                                                    title="โหลดหน้าตัวอย่างใหม่"
                                                >
                                                    <Icon name="RefreshCw" size={14} />
                                                </button>
                                                <a
                                                    href={activePreviewPage?.url || './index.html'}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="rjc2-pill-btn px-3.5 py-2 text-[11px] font-display font-bold inline-flex items-center gap-1"
                                                >
                                                    <span>เปิดเต็มจอ</span>
                                                    <Icon name="ExternalLink" size={13} />
                                                </a>
                                            </div>
                                        </div>

                                        {/* Responsive Viewport Frame */}
                                        <div className="neu-inset p-3 sm:p-4 flex flex-col items-center justify-center overflow-x-auto">
                                            <div
                                                className="w-full rounded-2xl overflow-hidden bg-[var(--neu-bg)] shadow-2xl border border-[var(--neu-border)] transition-all duration-500"
                                                style={{
                                                    maxWidth: previewViewport === 'mobile' ? '390px' : previewViewport === 'tablet' ? '768px' : '100%',
                                                    height: previewViewport === 'mobile' ? '680px' : '640px'
                                                }}
                                            >
                                                <iframe
                                                    key={`${activePreviewPage?.id}_${previewReloadKey}`}
                                                    title={`Admin Live Preview: ${activePreviewPage?.title}`}
                                                    src={activePreviewPage?.url}
                                                    className="w-full h-full border-0 block bg-[var(--neu-bg)]"
                                                    allow="autoplay; fullscreen; picture-in-picture; microphone"
                                                />
                                            </div>
                                            <p className="text-[11px] font-mono text-muted-adaptive mt-2.5 text-center m-0">
                                                URL: <span className="text-prism-adaptive">{activePreviewPage?.url}</span> • หากเว็บปลายทางไม่อนุญาตแสดงในกรอบ ให้กดปุ่ม <b>“เปิดเต็มจอ ↗”</b> ด้านบนได้เลยค่ะ
                                            </p>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Mobile Bottom Neumorphic Dock (ครบทั้ง 7 เมนู) */}
                    <nav className="no-print lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-1.5 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]">
                        <div className="grid grid-cols-7 gap-1 max-w-xl mx-auto">
                            {navItems.map(item => {
                                const active = activeTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => goTab(item.id)}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-2xl text-[9px] font-bold transition-all active:scale-95 ${
                                            active ? 'neu-nav-active' : 'text-secondary-adaptive'
                                        }`}
                                    >
                                        <Icon name={item.icon} size={16} />
                                        <span className="truncate max-w-full px-0.5">{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    {/* Modal มอบสิทธิ์เทียบโอนรายบุคคล */}
                    {transferModal.open && transferModal.user && (
                        <div className="no-print fixed inset-0 z-[132] bg-slate-950/70 backdrop-blur-md flex items-end sm:items-center justify-center p-3 sm:p-4">
                            <form onSubmit={handleSaveTransferModal} className="spatial-card w-full sm:max-w-lg rounded-[28px] p-6 space-y-4">
                                <div className="flex items-start justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">CREDIT TRANSFER &amp; ACTIVITY REFERENCE</span>
                                        <h3 className="font-display font-extrabold text-lg text-primary-adaptive">จัดการสิทธิ์เทียบโอนชั่วโมงอบรม</h3>
                                        <p className="text-xs text-secondary-adaptive">{transferModal.user.name} ({getUserLicense(transferModal.user)})</p>
                                    </div>
                                    <button type="button" onClick={() => setTransferModal(p => ({ ...p, open: false, user: null }))} className="neu-btn w-9 h-9">
                                        <Icon name="X" size={16} />
                                    </button>
                                </div>

                                <label className="neu-inset p-4 flex items-center justify-between gap-3 cursor-pointer">
                                    <div>
                                        <p className="text-sm font-bold text-accent-adaptive">มอบสิทธิ์ “เทียบโอน (ยกเว้นชั่วโมง 100%)”</p>
                                        <p className="text-xs text-muted-adaptive">ผู้เรียนสามารถทำ Pre-test → AI Skill Lab 3D → Post-test ≥ 80% ได้ทันทีโดยไม่ต้องสะสมเวลาวิดีโอซ้ำ</p>
                                    </div>
                                    <input type="checkbox" checked={Boolean(transferModal.studyHoursExempt)} onChange={e => setTransferModal(p => ({ ...p, studyHoursExempt: e.target.checked }))} className="w-5 h-5 accent-emerald-600 shrink-0" />
                                </label>

                                {transferModal.studyHoursExempt && (
                                    <div className="space-y-3">
                                        <FieldInput label="ชื่อกิจกรรมอ้างอิง *" required value={transferModal.hoursActivityName} onChange={e => setTransferModal(p => ({ ...p, hoursActivityName: e.target.value }))} placeholder="เช่น การอบรมเชิงปฏิบัติการรับบริจาคอวัยวะ รุ่นที่ 1/2570" />
                                        <FieldInput label="วัน/เดือน/ปี ที่จัดกิจกรรม" value={transferModal.hoursActivityDate} onChange={e => setTransferModal(p => ({ ...p, hoursActivityDate: e.target.value }))} placeholder="เช่น 15 มกราคม 2570" />
                                        <FieldInput label="สถานที่ / หน่วยงานที่จัด" value={transferModal.hoursActivityVenue} onChange={e => setTransferModal(p => ({ ...p, hoursActivityVenue: e.target.value }))} placeholder="เช่น ห้องประชุมพิบูลสงคราม โรงพยาบาลราชวิถี" />
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button type="button" onClick={() => setTransferModal(p => ({ ...p, open: false, user: null }))} className="neu-btn touch-target py-3 font-bold text-sm">ยกเลิก</button>
                                    <button type="submit" className="rjc2-pill-btn touch-target py-3 font-display font-extrabold text-sm">บันทึกสิทธิ์ขึ้น Cloud</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('admin-root'));
        root.render(<AdminErrorBoundary><AdminApp /></AdminErrorBoundary>);
    </script>

    <!-- @babel/standalone พร้อม CDN สำรอง (cdnjs) ป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
