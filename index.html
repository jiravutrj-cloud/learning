          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f4f9fb');
        } catch (_) {}
      })();
    </script>

        const computeDomainDiagnosis = (qs, ans) => {

            (qs || []).forEach((q, idx) => {
                const domId = bucket[q.domain] ? q.domain : 'policy_ethics';
                bucket[domId].total += 1;
                if (ans && ans[idx] === q.answer) bucket[domId].correct += 1;
            });
            const domains = Object.values(bucket).map(d => ({ ...d, percent: d.total > 0 ? Math.round((d.correct / d.total) * 100) : 100 }));
            const weakDomains = domains.filter(d => d.percent < MIN_POSTTEST_PERCENT).sort((a, b) => a.percent - b.percent);
            const recommendedLessonIds = Array.from(new Set((weakDomains.length ? weakDomains : domains.slice(0, 1)).flatMap(d => d.lessonIds || [])));

        async function drawQrSafe(ctx, urlText, x, y, size, darkColor = '#0f172a') {
            if (typeof CERT.drawRealQrOnCanvas === 'function') {
                return CERT.drawRealQrOnCanvas(ctx, urlText, x, y, size, darkColor);
            }
            if (!ctx || !urlText) return false;
            try {
                if (typeof window.qrcode === 'function') {
                    const qr = window.qrcode(0, 'M');
                    qr.addData(String(urlText));
                    qr.make();
                    const count = qr.getModuleCount();
                    const cell = size / count;
                    ctx.fillStyle = darkColor;
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) ctx.fillRect(x + c * cell, y + r * cell, Math.ceil(cell), Math.ceil(cell));
                        }
                    }
                    return true;
                }
            } catch (_) {}
            return false;
        }

                            <p>• <b>การปกปิดข้อมูล:</b> หน้าตรวจสอบ QR Code (verify.html) ปกปิดเลขใบอนุญาตบางส่วนและไม่แสดงอีเมล/เบอร์โทร และหน้าผู้บริหาร (executive.html) ใช้เฉพาะข้อมูลสถิติไม่ระบุตัวตน</p>
                            <p>• <b>สิทธิของเจ้าของข้อมูล:</b> สามารถติดต่อขอแก้ไขหรือลบข้อมูลได้ที่ <b className="text-prism-adaptive">{CONFIG.contactEmail}</b></p>
                        </div>
                        <button type="button" onClick={onClose} className="touch-target w-full py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm">
                            รับทราบและปิดหน้าต่าง
                        </button>
                    </div>
                </div>
            );
        }

        function QrCodeCanvas({ value, size = 112 }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                let active = true;
                const render = async () => {
                    const canvas = canvasRef.current;
                    if (!canvas || !value) return;
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, size, size);
                    if (active) await drawQrSafe(ctx, value, 6, 6, size - 12, '#0f172a');
                };
                render();
                return () => { active = false; };
            }, [value, size]);
            return <canvas ref={canvasRef} width={size} height={size} className="block rounded-lg border border-slate-300 bg-white" />;
        }

        // ============================================================================
        // 3. LEARNING WIDGETS (QUIZ, AI COMPANION, CASES, FLASHCARDS, CNEU LETTER)
        // ============================================================================
        function QuizEngine({ mode, questions, onComplete, onExit, onJumpToLesson }) {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [result, setResult] = useState(null);

            const total = questions.length || 1;
            const answeredCount = Object.keys(answers).length;
            const isPost = mode === 'posttest';

            const handleSubmit = () => {
                if (answeredCount < total) return;
                let correct = 0;
                questions.forEach((q, i) => { if (answers[i] === q.answer) correct += 1; });
                const pct = Math.round((correct / total) * 100);
                const passed = !isPost || pct >= MIN_POSTTEST_PERCENT;
                const diagnosis = computeDomainDiagnosis(questions, answers);
                const res = { correct, total, pct, passed, scoreText: `${correct}/${total}`, diagnosis };
                setResult(res);
                setSubmitted(true);
                if (onComplete) onComplete(res);
            };

            return (
                <div className="max-w-3xl mx-auto space-y-5">
                    <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                {isPost ? `STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)` : 'STEP 01 • PRE-TEST + AI DIAGNOSTIC ROADMAP'}
                            </span>
                            <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                {isPost ? 'แบบทดสอบหลังเรียน (Post-test)' : 'แบบทดสอบวัดพื้นฐานก่อนเรียน (Pre-test)'}
                            </h2>
                        </div>
                        {onExit && (
                            <button type="button" onClick={onExit} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1.5">
                                <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                            </button>
                        )}
                    </div>

                    {submitted && result ? (
                        <div className="spatial-card rounded-[1.75rem] p-5 sm:p-7 space-y-5 border-aurora-400/40">
                            <div className="text-center space-y-2">
                                <span className={`inline-block px-3 py-1 rounded-full font-mono text-xs font-bold ${result.passed ? 'bg-aurora-500/20 text-accent-adaptive' : 'bg-amber-500/20 text-amber-400'}`}>
                                    {isPost ? (result.passed ? 'PASSED • ปลดล็อกประกาศนียบัตรแล้ว' : `ยังไม่ถึงเกณฑ์ ${MIN_POSTTEST_PERCENT}%`) : 'PRE-TEST COMPLETED'}
                                </span>
                                <h3 className="font-mono text-4xl font-extrabold text-primary-adaptive">{result.scoreText} <span className="text-xl text-accent-adaptive">({result.pct}%)</span></h3>
                                <p className="text-sm text-secondary-adaptive max-w-xl mx-auto">{result.diagnosis.summaryText}</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {result.diagnosis.domains.map(d => (
                                    <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1.5">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span className="text-primary-adaptive">{d.shortName}</span>
                                            <span className="font-mono" style={{ color: d.color }}>{d.percent}%</span>
                                        </div>
                                        <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                            <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                        </div>
                                        {isPost && !result.passed && d.percent < MIN_POSTTEST_PERCENT && (
                                            <p className="text-[11px] text-secondary-adaptive pt-1 leading-relaxed">{d.remediationGuide}</p>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-2.5 pt-2">
                                {isPost && !result.passed ? (
                                    <>
                                        <button type="button" onClick={() => { setAnswers({}); setSubmitted(false); setResult(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="touch-target flex-1 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm">
                                            ทำแบบทดสอบ Post-test ใหม่อีกครั้ง
                                        </button>
                                        {onJumpToLesson && result.diagnosis.recommendedLessonIds[0] && (
                                            <button type="button" onClick={() => onJumpToLesson(result.diagnosis.recommendedLessonIds[0])} className="touch-target spatial-soft flex-1 py-3 rounded-2xl text-primary-adaptive font-display font-bold text-sm">
                                                ทบทวนบทที่ {result.diagnosis.recommendedLessonIds[0]} ที่แนะนำ
                                            </button>
                                        )}
                                    </>
                                ) : (
                                    <button type="button" onClick={() => onComplete && onComplete({ ...result, proceed: true })} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2">
                                        {isPost ? 'ไปยืนยันชื่อ & รับประกาศนียบัตร + CNEU →' : 'เข้าสู่ห้องเรียน 20 บทเรียนทันที →'}
                                    </button>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {questions.map((q, qIdx) => (
                                <div key={q.id || qIdx} className="spatial-card rounded-2xl p-4 sm:p-5 space-y-3">
                                    <p className="font-display font-bold text-sm sm:text-base text-primary-adaptive">
                                        <span className="font-mono text-prism-adaptive mr-1.5">{qIdx + 1}.</span>{q.question}
                                    </p>
                                    <div className="space-y-2">
                                        {(q.options || []).map((opt, oIdx) => {
                                            const picked = answers[qIdx] === oIdx;
                                            return (
                                                <button
                                                    key={oIdx}
                                                    type="button"
                                                    onClick={() => setAnswers(p => ({ ...p, [qIdx]: oIdx }))}
                                                    className={`touch-target w-full text-left px-4 py-2.5 rounded-xl border text-xs sm:text-sm font-medium transition-all ${
                                                        picked ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'
                                                    }`}
                                                >
                                                    <span className="font-mono mr-2 text-accent-adaptive">{String.fromCharCode(65 + oIdx)}.</span>{opt}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}

                            <div className="spatial-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 sticky bottom-3 z-20">
                                <span className="text-xs font-mono font-bold text-secondary-adaptive">ตอบแล้ว {answeredCount} / {total} ข้อ</span>
                                <button
                                    type="button"
                                    disabled={answeredCount < total}
                                    onClick={handleSubmit}
                                    className="touch-target px-6 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 font-display font-extrabold text-sm"
                                >
                                    ส่งคำตอบและวิเคราะห์ผล ({answeredCount}/{total})
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AiStudyCompanion({ lesson, user, appsScriptUrl, onToast }) {
            const guide = (window.LESSON_AI_GUIDES && window.LESSON_AI_GUIDES[lesson?.id]) || {
                keyPoints: ['ทบทวนหลักการสำคัญจากวิดีโอบทเรียนและเชื่อมโยงสู่มาตรฐานศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC)'],
                microCheck: null
            };
            const roleProfile = resolveRoleProfile(user);
            const [microAns, setMicroAns] = useState(null);
            const [question, setQuestion] = useState('');
            const [chat, setChat] = useState([]);
            const [loadingChat, setLoadingChat] = useState(false);
            const [audioPhase, setAudioPhase] = useState('idle');
            const audioElRef = useRef(null);

            useEffect(() => {
                setMicroAns(null);
                setAudioPhase('idle');
                if (audioElRef.current) { try { audioElRef.current.pause(); } catch (_) {} }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
            }, [lesson?.id]);

            const stopBrief = () => {
                if (audioElRef.current) { try { audioElRef.current.pause(); } catch (_) {} audioElRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setAudioPhase('idle');
            };

            const playAudioBrief = async () => {
                if (audioPhase !== 'idle') { stopBrief(); return; }
                const scriptText = `สรุปบทที่ ${lesson?.id || 1} เรื่อง ${lesson?.title || ''} ค่ะ ${guide.keyPoints.join(' ')}`;
                setAudioPhase('loading');
                const cacheKey = `brief_v1_${lesson?.id}_${scriptText.slice(0, 24)}`;

                try {
                    let wavBlob = typeof CORE.getCachedAudio === 'function' ? await CORE.getCachedAudio(cacheKey) : null;
                    if (!wavBlob && appsScriptUrl) {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'callGeminiTTS', text: scriptText, voiceName: 'Aoede' })
                        }).then(r => r.json());
                        if (res?.status === 'success' && res.inlineData?.data && typeof CORE.pcm16ToWavBlob === 'function') {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            wavBlob = CORE.pcm16ToWavBlob(res.inlineData.data, rate);
                            if (typeof CORE.setCachedAudio === 'function') await CORE.setCachedAudio(cacheKey, wavBlob);
                        }
                    }
                    if (wavBlob) {
                        const url = URL.createObjectURL(wavBlob);
                        const audio = new Audio(url);
                        audioElRef.current = audio;
                        setAudioPhase('playing');
                        audio.onended = () => { URL.revokeObjectURL(url); setAudioPhase('idle'); };
                        audio.onerror = () => { URL.revokeObjectURL(url); setAudioPhase('idle'); };
                        await audio.play();
                        return;
                    }
                } catch (_) {}

                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(scriptText);
                    u.lang = 'th-TH';
                    u.onstart = () => setAudioPhase('playing');
                    u.onend = () => setAudioPhase('idle');
                    u.onerror = () => setAudioPhase('idle');
                    window.speechSynthesis.speak(u);
                } else {
                    setAudioPhase('idle');
                    onToast && onToast('อุปกรณ์นี้ไม่รองรับการเล่นเสียงอัตโนมัติค่ะ', 'info');
                }
            };

            const askAi = async (e) => {
                e.preventDefault();
                const q = question.trim();
                if (!q || loadingChat) return;
                setQuestion('');
                setChat(p => [...p, { role: 'user', text: q }]);
                setLoadingChat(true);

                let reply = '';
                if (appsScriptUrl) {
                    try {
                        const sys = `คุณคือ AI Study Companion ประจำหลักสูตร rjcloud.organ บทที่ ${lesson?.id}: ${lesson?.title}\n${roleProfile.aiPromptAddon || ''}\nอ้างอิงฐานความรู้:\n${window.CLINICAL_KNOWLEDGE_BASE || ''}\nตอบสั้น กระชับ สุภาพ เป็นภาษาไทย และยึดหลักปลอดภัยทางคลินิก`;
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'callGemini', prompt: q, systemInstruction: sys })
                        }).then(r => r.json());
                        if (res?.status === 'success' && res.text) reply = res.text;
                    } catch (_) {}
                }
                if (!reply) {
                    reply = `สรุปแนวทางสำหรับบทที่ ${lesson?.id}: ${guide.keyPoints[0]} (หากต้องการคำตอบเชิงลึกสามารถตรวจสอบการเชื่อมต่อ AI ในระบบ Cloud ค่ะ)`;
                }
                setChat(p => [...p, { role: 'ai', text: reply }]);
                setLoadingChat(false);
            };

            return (
                <div className={`spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-4 overflow-hidden ${audioPhase === 'loading' ? 'ambient-loading-card' : audioPhase === 'playing' ? 'ambient-playing-card' : ''}`}>
                    {audioPhase !== 'idle' && <div className={`ambient-ribbon ${audioPhase === 'loading' ? 'ambient-ribbon-loading' : 'ambient-ribbon-playing'}`} />}
                    <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">AI STUDY COMPANION • {roleProfile.badgeTH}</span>
                            <h3 className="font-display font-bold text-base text-primary-adaptive">สรุป 1 นาที &amp; ถาม AI ประจำบทที่ {lesson?.id}</h3>
                        </div>
                        <button
                            type="button"
                            onClick={playAudioBrief}
                            className={`px-3.5 py-2 rounded-xl font-display font-bold text-xs flex items-center gap-1.5 transition-all ${
                                audioPhase === 'loading' ? 'ambient-btn-runner' : audioPhase === 'playing' ? 'bg-rose-500 text-white' : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950'
                            }`}
                        >
                            <Icon name={audioPhase === 'playing' ? 'Square' : 'Volume2'} size={14} />
                            {audioPhase === 'loading' ? 'กำลังเตรียมเสียง...' : audioPhase === 'playing' ? 'หยุดฟังสรุป' : 'ฟังสรุปเสียง'}
                        </button>
                    </div>

                    <ul className="space-y-1.5 text-xs sm:text-sm text-secondary-adaptive leading-relaxed">
                        {guide.keyPoints.map((kp, idx) => (
                            <li key={idx} className="spatial-soft px-3.5 py-2 rounded-xl">• {kp}</li>
                        ))}
                    </ul>

                    {guide.microCheck && (
                        <div className="spatial-soft p-3.5 rounded-2xl space-y-2 border-prism-400/30">
                            <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">MICRO-CHECK ท้ายบท</p>
                            <p className="text-xs sm:text-sm font-bold text-primary-adaptive">{guide.microCheck.q}</p>
                            <div className="grid grid-cols-1 gap-1.5">
                                {guide.microCheck.options.map((opt, idx) => (
                                    <button
                                        key={idx}
                                        type="button"
                                        onClick={() => setMicroAns(idx)}
                                        className={`text-left px-3 py-2 rounded-xl border text-xs font-semibold transition-all ${
                                            microAns === idx
                                                ? idx === guide.microCheck.answer
                                                    ? 'bg-aurora-500/20 border-aurora-400 text-accent-adaptive'
                                                    : 'bg-rose-500/20 border-rose-400 text-rose-300'
                                                : 'spatial-soft text-secondary-adaptive'
                                        }`}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                            {microAns !== null && (
                                <p className="text-xs text-accent-adaptive font-semibold pt-1">{guide.microCheck.explain}</p>
                            )}
                        </div>
                    )}

                    <div className="space-y-2.5 pt-2 border-t border-white/10">
                        <p className="text-[11px] text-amber-400 flex items-center gap-1.5">
                            <Icon name="ShieldAlert" size={13} /> PDPA Safety: กรุณาไม่ระบุชื่อ–สกุล หรือเลข HN ผู้ป่วยจริงในช่องถาม AI ค่ะ
                        </p>
                        {chat.length > 0 && (
                            <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                                {chat.map((m, i) => (
                                    <div key={i} className={`p-3 rounded-xl text-xs leading-relaxed ${m.role === 'user' ? 'bg-aurora-500/20 text-primary-adaptive ml-6 font-semibold' : 'spatial-soft text-secondary-adaptive mr-4 whitespace-pre-line'}`}>
                                        {m.text}
                                    </div>
                                ))}
                            </div>
                        )}
                        <form onSubmit={askAi} className="flex gap-2">
                            <input
                                type="text"
                                value={question}
                                onChange={e => setQuestion(e.target.value)}
                                placeholder="พิมพ์คำถามทางคลินิกประจำบทนี้..."
                                className="touch-target spatial-input flex-1 px-3.5 py-2 rounded-xl text-xs sm:text-sm"
                            />
                            <button type="submit" disabled={!question.trim() || loadingChat} className="touch-target px-4 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 font-display font-extrabold text-xs">
                                {loadingChat ? '...' : 'ถาม AI'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function ClinicalCaseSimulator() {
            const [caseIdx, setCaseIdx] = useState(0);
            const [stepIdx, setStepIdx] = useState(0);
            const [pickedOpt, setPickedOpt] = useState(null);

            const activeCase = CLINICAL_CASE_SIMULATIONS[caseIdx] || CLINICAL_CASE_SIMULATIONS[0];
            const activeStep = activeCase?.steps?.[stepIdx] || activeCase?.steps?.[0];
            if (!activeCase || !activeStep) return null;

            const currentVitals = pickedOpt?.nextVitals || activeStep.vitals || {};

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap gap-2">
                        {CLINICAL_CASE_SIMULATIONS.map((c, idx) => (
                            <button
                                key={c.id}
                                type="button"
                                onClick={() => { setCaseIdx(idx); setStepIdx(0); setPickedOpt(null); }}
                                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${idx === caseIdx ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}
                            >
                                เคสที่ {idx + 1}
                            </button>
                        ))}
                    </div>

                    <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive">{activeCase.badge}</span>
                            <h3 className="font-display text-lg font-extrabold text-primary-adaptive mt-0.5">{activeCase.title}</h3>
                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">{activeCase.patientSummary}</p>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            {Object.entries(currentVitals).map(([k, v]) => (
                                <div key={k} className="spatial-soft p-3 rounded-xl text-center">
                                    <span className="font-mono text-[10px] uppercase text-muted-adaptive block">{k}</span>
                                    <span className="font-mono text-sm font-extrabold text-accent-adaptive">{v}</span>
                                </div>
                            ))}
                        </div>

                        <p className="p-4 rounded-2xl spatial-soft text-sm font-bold text-primary-adaptive leading-relaxed">{activeStep.situation}</p>

                        <div className="space-y-2.5">
                            {activeStep.options.map((opt, idx) => (
                                <button
                                    key={idx}
                                    type="button"
                                    onClick={() => setPickedOpt(opt)}
                                    className={`touch-target w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm font-semibold transition-all ${
                                        pickedOpt === opt
                                            ? opt.correct ? 'bg-aurora-500/20 border-aurora-400 text-accent-adaptive' : 'bg-rose-500/20 border-rose-400 text-rose-300'
                                            : 'spatial-soft text-primary-adaptive'
                                    }`}
                                >
                                    {opt.label}
                                </button>
                            ))}
                        </div>

                        {pickedOpt && (
                            <div className={`p-4 rounded-2xl border text-xs sm:text-sm leading-relaxed space-y-3 ${pickedOpt.correct ? 'bg-aurora-500/15 border-aurora-400/40 text-primary-adaptive' : 'bg-rose-500/15 border-rose-400/40 text-primary-adaptive'}`}>

        // ============================================================================
        // 4. MAIN LEARNER APPLICATION (ALL 7 SCREENS + MODULAR ENGINES + PDPA)
        // ============================================================================
        function App() {
            const adminPreviewParam = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);
            const isAdminPreview = Boolean(adminPreviewParam);

            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f4f9fb');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => setTheme(t => (t === 'dark' ? 'light' : 'dark')), []);

            // โหลดสถานะผู้เรียนเดิมหรือจำลองสำหรับ Admin Preview
            const initialSaved = useMemo(() => {
                if (isAdminPreview) {
                    return {
                        user: {
                            id: 'admin_preview_2027',
                            license: '4511128901',
                            name: 'พว.ผู้ดูแลระบบ (Admin Preview)',
                            nameEN: 'Admin Preview RN',
                            position: 'พยาบาลวิชาชีพชำนาญการ',
                            workContext: 'ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)',
                            department: 'กรมการแพทย์',
                            hospital: 'รพ.ราชวิถี',
                            province: 'กรุงเทพมหานคร',
                            email: 'rjcloud.organ@gmail.com',
                            phone: '0812345678',
                            userType: 'เรียนใหม่',
                            pretest: '30/40',
                            posttest: '38/40',
                            progress: 100,
                            studySeconds: 28800,
                            skillLabPassed: true,
                            skillLabBestScore: 94,
                            status: 'ผ่าน',
                            certificateClaimed: true,
                            certificateCode: 'RJC-2027-DEMO01',
                            certificateIssuedAt: new Date().toISOString()
                        }
                    };
                }
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) { return null; }
            }, [isAdminPreview]);

            const [user, setUser] = useState(initialSaved?.user || null);
            const [screen, setScreen] = useState(() => {
                if (adminPreviewParam) {
                    if (['auth1', 'auth2', 'auth3'].includes(adminPreviewParam)) return 'auth';
                    if (['pretest', 'posttest', 'cert_confirm', 'certificate', 'landing'].includes(adminPreviewParam)) return adminPreviewParam;
                    return 'dashboard';
                }
                if (initialSaved?.user) {
                    const hasPre = Boolean(initialSaved.user.pretest && initialSaved.user.pretest !== '-');
                    return hasPre ? 'dashboard' : 'pretest';
                }
                return 'landing';
            });
            const [activeTab, setActiveTab] = useState(() => {
                if (adminPreviewParam === 'live') return 'live';
                if (adminPreviewParam === 'profile') return 'profile';
                return 'lessons';
            });

            // Cloud Settings & Content
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', days: 1, hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคอวัยวะ 2027', url: '', documentUrl: '' });
            const [certTemplate, setCertTemplate] = useState({ ...DEFAULT_CERT_TEMPLATE });
            const [cneuConfig, setCneuConfig] = useState({ ...DEFAULT_CNEU_CONFIG });
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : FALLBACK_LESSONS));
            const [questionSets, setQuestionSets] = useState(() => [parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW)]);

            // Auth Wizard 3 Steps + PDPA
            const [authStep, setAuthStep] = useState(() => (adminPreviewParam === 'auth2' ? 2 : adminPreviewParam === 'auth3' ? 3 : 1));
            const [authForm, setAuthForm] = useState({
                license: '', name: '', position: 'พยาบาลวิชาชีพ', workContext: 'หอผู้ป่วยวิกฤต (ICU / ER / OR)',
                department: 'กรมการแพทย์', hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร',
                email: '', phone: '', userType: 'เรียนใหม่'
            });
            const [isReturningUser, setIsReturningUser] = useState(false);
            const [editContactMode, setEditContactMode] = useState(false);
            const [pdpaAccepted, setPdpaAccepted] = useState(false);
            const [pdpaModalOpen, setPdpaModalOpen] = useState(false);
            const [generatedOtp, setGeneratedOtp] = useState('');
            const [otpInput, setOtpInput] = useState('');
            const [otpFallbackHint, setOtpFallbackHint] = useState('');
            const [authBusy, setAuthBusy] = useState(false);

            // Dashboard, Certificate & Warm-up States
            const [currentLessonId, setCurrentLessonId] = useState(() => Number(initialSaved?.user?.lastVideoId || 1));
            const [certDocTab, setCertDocTab] = useState('certificate');
            const [certConfirmForm, setCertConfirmForm] = useState(() => ({
                name: initialSaved?.user?.name || '',
                nameEN: initialSaved?.user?.nameEN || '',
                hospital: initialSaved?.user?.hospital || ''
            }));
            const [evalCriteria, setEvalCriteria] = useState({ content: 5, speaker: 5, platform: 5, aiLab: 5, application: 5 });
            const [evalComment, setEvalComment] = useState('');
            const [warmupMood, setWarmupMood] = useState(PRE_APPROACH_TAGS.familyMoods[0]);
            const [warmupConcern, setWarmupConcern] = useState(PRE_APPROACH_TAGS.concerns[0]);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', confirmText: 'ยืนยัน', onConfirm: null });

            const userRef = useRef(user);
            const certCanvasRef = useRef(null);
            useEffect(() => { userRef.current = user; }, [user]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // บันทึกความคืบหน้าผู้เรียน (partialOnly = true จะไม่อัปโหลดทับฟิลด์ที่แอดมินปรับแก้บน Cloud)
            const saveUserProgress = useCallback(async (patch, options = {}) => {
                const { partialOnly = false, syncTelemetry = false } = options;
                const prev = userRef.current;
                if (!prev) return null;
                const merged = { ...prev, ...patch };
                userRef.current = merged;
                setUser(merged);

                if (isAdminPreview || String(merged.id).startsWith('admin_preview_')) return merged;

                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                } catch (_) {}

                if (fbDb && merged.id) {
                    try {
                        const cloudPayload = partialOnly ? patch : merged;
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(merged.id)), cloudPayload, { merge: true });
                        if (syncTelemetry) await syncExecutiveTelemetry(merged);
                    } catch (err) {
                        console.warn('Firestore save warning:', err);
                    }
                }
                return merged;
            }, [isAdminPreview]);

            // Firebase Auth + Real-Time Sync (settings และ content)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let anonAttempted = false;
                let unsubSettings = null;
                let unsubContent = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) return;
                        if (!anonAttempted) {
                            anonAttempted = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') await fbAuth.authStateReady();
                                if (active && !fbAuth.currentUser) await signInAnonymously(fbAuth);
                            } catch (_) {}
                        }
                        return;
                    }

                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                            if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                            if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                        },
                        () => {}
                    );

                    if (unsubContent) unsubContent();
                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                };
            }, [isAdminPreview]);

            // ซิงค์ข้อมูลผู้เรียนสดจาก Cloud Firestore (หากแอดมินแก้สิทธิ์/กดผ่าน Lab จะอัปเดตทันที)
            useEffect(() => {
                if (!fbDb || isAdminPreview || !user?.id || String(user.id).startsWith('admin_preview_')) return;
                const unsubUser = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id)),
                    (snap) => {
                        if (!snap.exists()) return;
                        const cloud = snap.data();
                        const local = userRef.current || {};
                        const merged = {
                            ...local,
                            ...cloud,
                            studySeconds: Math.max(Number(local.studySeconds || 0), Number(cloud.studySeconds || 0)),
                            progress: Math.max(Number(local.progress || 0), Number(cloud.progress || 0))
                        };
                        userRef.current = merged;
                        setUser(merged);
                        try {
                            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                            localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                        } catch (_) {}
                    },
                    () => {}
                );
                return () => unsubUser();
            }, [user?.id, isAdminPreview]);

            // นาฬิกาจับเวลาเรียนสะสม (อัปเดตเฉพาะฟิลด์เวลาเรียน partialOnly ทุก 20 วินาที ไม่ทับข้อมูลแอดมิน)
            const targetHours = getTargetHoursForUser(user, liveConfig);
            const targetSeconds = targetHours * 3600;
            const liveStudyPercent = user ? Math.min(100, Math.max(Number(user.progress || 0), Math.round((Number(user.studySeconds || 0) / targetSeconds) * 100))) : 0;

            useEffect(() => {
                if (screen !== 'dashboard' || activeTab !== 'lessons' || !user || isAdminPreview) return;
                let tick = 0;
                const timer = setInterval(() => {
                    tick += 1;
                    const cur = userRef.current;
                    if (!cur) return;
                    const nextSec = Number(cur.studySeconds || 0) + 1;
                    const nextPct = Math.min(100, Math.max(Number(cur.progress || 0), Math.round((nextSec / targetSeconds) * 100)));
                    const updated = { ...cur, studySeconds: nextSec, progress: nextPct, lastVideoId: currentLessonId };
                    userRef.current = updated;
                    setUser(updated);
                    if (tick % 20 === 0) {
                        saveUserProgress({ studySeconds: nextSec, progress: nextPct, lastVideoId: currentLessonId }, { partialOnly: true, syncTelemetry: true });
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [screen, activeTab, user?.id, currentLessonId, targetSeconds, isAdminPreview, saveUserProgress]);

            // สะพานเชื่อมกับไฟล์เสริม ai-interactive.js
            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            useEffect(() => {
                if (window.RJCLOUD_AI_INTERACTIVE && typeof window.RJCLOUD_AI_INTERACTIVE.registerBridge === 'function') {
                    window.RJCLOUD_AI_INTERACTIVE.registerBridge({
                        screen,
                        activeTab,
                        user,
                        lessons,
                        currentLessonId,
                        studySeconds: Number(user?.studySeconds || 0),
                        targetSeconds,
                        liveStudyPercent,
                        hasDonePretest,
                        isAdminPreview,
                        appsScriptUrl,
                        setActiveTab,
                        selectLesson: (lid) => {
                            setCurrentLessonId(Number(lid));
                            saveUserProgress({ lastVideoId: Number(lid) }, { partialOnly: true });
                        },
                        toggleTheme,
                        toast: showToast
                    });
                }
            }, [screen, activeTab, user, lessons, currentLessonId, targetSeconds, liveStudyPercent, hasDonePretest, isAdminPreview, appsScriptUrl, toggleTheme, showToast, saveUserProgress]);

            // วาดใบประกาศนียบัตรเมื่อเปิดหน้า certificate
            const verifyUrl = useMemo(() => buildVerifyUrlSafe(user?.certificateCode, certTemplate.certPrefix), [user?.certificateCode, certTemplate.certPrefix]);

            useEffect(() => {
                if (screen !== 'certificate' || certDocTab !== 'certificate' || !certCanvasRef.current || !user) return;
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certCanvasRef.current, certTemplate, user, verifyUrl);
                } else {
                    const c = certCanvasRef.current;
                    c.width = 1600; c.height = 1131;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1600, 1131);
                    ctx.strokeStyle = '#c5a059'; ctx.lineWidth = 3; ctx.strokeRect(48, 48, 1504, 1035);
                    ctx.textAlign = 'center'; ctx.fillStyle = '#1d1d1f';
                    ctx.font = '600 22px "Prompt", sans-serif'; ctx.fillText(certTemplate.orgTitleTH, 800, 160);
                    ctx.font = '700 54px "Prompt", sans-serif'; ctx.fillText('ประกาศนียบัตร', 800, 290);
                    ctx.font = '700 56px "Prompt", sans-serif'; ctx.fillText(user.name || 'ผู้สำเร็จการอบรม', 800, 440);
                    if (user.nameEN) {
                        ctx.font = '600 24px "Prompt", sans-serif'; ctx.fillStyle = '#424245';
                        ctx.fillText(user.nameEN, 800, 484);
                    }
                    ctx.fillStyle = '#1d1d1f';
                    ctx.font = '700 28px "Prompt", sans-serif'; ctx.fillText(certTemplate.courseTitleTH, 800, 620);
                    ctx.font = '500 20px "Sarabun", sans-serif'; ctx.fillStyle = '#6e6e73';
                    ctx.fillText(`ให้ไว้ ณ วันที่ ${formatThaiDate(user.certificateIssuedAt)}`, 800, 680);
                    ctx.fillStyle = '#1d1d1f';
                    ctx.font = '600 22px "Prompt", sans-serif'; ctx.fillText(certTemplate.signerName, 800, 960);
                    ctx.font = '500 18px "Sarabun", sans-serif'; ctx.fillStyle = '#6e6e73';
                    ctx.fillText(certTemplate.signerPosition, 800, 992);
                    drawQrSafe(ctx, verifyUrl, 1340, 860, 150, '#1d1d1f');
                }
            }, [screen, certDocTab, certTemplate, user, verifyUrl]);

            // ==================== AUTH WIZARD HANDLERS (PDPA-SAFE + NO 000000 BACKDOOR) ====================
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (cleanLic.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพให้ถูกต้องค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                setIsReturningUser(false);
                setEditContactMode(false);
                try {
                    let found = null;
                    if (fbDb) {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) found = snap.data();
                    }
                    if (found) {
                        setIsReturningUser(true);
                        setAuthForm(p => ({
                            ...p,
                            license: cleanLic,
                            name: found.name || p.name,
                            position: found.position || p.position,
                            workContext: found.workContext || p.workContext,
                            department: found.department || p.department,
                            hospital: found.hospital || p.hospital,
                            province: found.province || p.province,
                            email: found.email || '',
                            phone: found.phone || '',
                            userType: found.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'
                        }));
                        showToast('พบข้อมูลเดิมในระบบแล้ว (ปกปิดอีเมล/เบอร์โทรบางส่วนตามหลัก PDPA)', 'info');
                    } else {
                        setAuthForm(p => ({ ...p, license: cleanLic }));
                        setEditContactMode(true);
                    }
                    setAuthStep(2);
                } catch (_) {
                    showToast('ตรวจสอบข้อมูลไม่สำเร็จ กรุณาลองใหม่ค่ะ', 'error');
                } finally {
                    setAuthBusy(false);
                }
            };

            const requestOtpCode = async () => {
                if (!pdpaAccepted) {
                    showToast('กรุณาติ๊กยินยอมตามนโยบายคุ้มครองข้อมูลส่วนบุคคล PDPA ก่อนขอรหัส OTP ค่ะ', 'error');
                    return;
                }
                if (!authForm.name.trim() || !authForm.email.trim()) {
                    showToast('กรุณากรอกชื่อ-สกุล และอีเมลสำหรับรับรหัส OTP ให้ครบค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                setOtpInput('');
                setOtpFallbackHint('');

                const otp = String(Math.floor(100000 + Math.random() * 900000));
                setGeneratedOtp(otp);

                let sentViaEmail = false;
                if (appsScriptUrl) {
                    try {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'sendOtpEmail',
                                email: authForm.email.trim(),
                                name: authForm.name.trim(),
                                otp
                            })
                        }).then(r => r.json());
                        if (res?.status === 'success') sentViaEmail = true;
                    } catch (_) {}
                }

                setAuthBusy(false);
                setAuthStep(3);
                if (sentViaEmail) {
                    showToast(`ส่งรหัส OTP 6 หลักไปยัง ${maskEmail(authForm.email)} เรียบร้อยแล้วค่ะ`);
                } else {
                    setOtpFallbackHint(otp);
                    showToast('ระบบส่งอีเมลขัดข้องชั่วคราว แสดงรหัส OTP ยืนยันบนหน้าจอแทนค่ะ', 'info');
                }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                const entered = otpInput.trim();
                if (!entered || !generatedOtp || entered !== generatedOtp) {
                    showToast('รหัส OTP 6 หลักไม่ถูกต้อง กรุณาตรวจสอบอีเมลหรือกดส่งรหัสใหม่ค่ะ', 'error');
                    return;
                }

                setAuthBusy(true);
                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                let existing = null;
                if (fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) existing = snap.data();
                    } catch (_) {}
                }

                const nextUser = {
                    ...(existing || {}),
                    id: cleanLic,
                    license: cleanLic,
                    name: authForm.name.trim(),
                    position: authForm.position.trim(),
                    workContext: authForm.workContext,
                    department: authForm.department,
                    hospital: authForm.hospital.trim(),
                    province: authForm.province.trim(),
                    email: authForm.email.trim(),
                    phone: authForm.phone.trim(),
                    userType: existing?.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : (authForm.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'),
                    pdpaAccepted: true,
                    pdpaAcceptedAt: new Date().toISOString(),
                    status: existing?.status || 'กำลังเรียน',
                    pretest: existing?.pretest || '-',
                    posttest: existing?.posttest || '-',
                    progress: Number(existing?.progress || 0),
                    studySeconds: Number(existing?.studySeconds || 0),
                    lastVideoId: Number(existing?.lastVideoId || 1),
                    skillLabPassed: Boolean(existing?.skillLabPassed)
                };

                userRef.current = nextUser;
                setUser(nextUser);
                setCurrentLessonId(nextUser.lastVideoId || 1);
                setGeneratedOtp('');
                setOtpInput('');
                setOtpFallbackHint('');

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: nextUser }));
                    if (fbDb) {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic), nextUser, { merge: true });
                        await syncExecutiveTelemetry(nextUser);
                    }
                } catch (_) {}

                setAuthBusy(false);
                const donePre = Boolean(nextUser.pretest && nextUser.pretest !== '-');
                setScreen(donePre ? 'dashboard' : 'pretest');
                showToast(`ยินดีต้อนรับคุณ${nextUser.name} เข้าสู่ระบบ rjcloud.organ ค่ะ`);
            };

            const handleLogout = () => {
                setConfirmDialog({
                    open: true,
                    title: 'ออกจากระบบผู้เรียน?',
                    message: 'ข้อมูลเวลาเรียนและคะแนนของคุณถูกบันทึกไว้บน Cloud แล้ว สามารถเข้าสู่ระบบใหม่ด้วยเลขใบอนุญาตเดิมได้ทุกเมื่อค่ะ',
                    confirmText: 'ออกจากระบบ',
                    onConfirm: () => {
                        localStorage.removeItem(STORAGE_KEY);
                        userRef.current = null;
                        setUser(null);
                        setScreen('landing');
                        setAuthStep(1);
                        showToast('ออกจากระบบเรียบร้อยแล้วค่ะ', 'info');
                    }
                });
            };

            // ==================== LIVE CHECK-IN & STEP 5 CERTIFICATE ====================
            const handleLiveCheckIn = async () => {
                const nowIso = new Date().toISOString();
                await saveUserProgress({ liveCheckedIn: true, liveCheckInAt: nowIso }, { partialOnly: true });
                showToast('เช็คอินยืนยันเข้าเรียน Live สดเรียบร้อยแล้วค่ะ ✓');
            };

            const handleIssueCertificate = async (e) => {
                e.preventDefault();
                if (!user) return;
                const vals = Object.values(evalCriteria);
                const avgSat = Number((vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2));
                const code = user.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
                const issuedAt = user.certificateIssuedAt || new Date().toISOString();
                const finalName = certConfirmForm.name.trim() || user.name;
                const finalHospital = certConfirmForm.hospital.trim() || user.hospital;

                const updated = await saveUserProgress({
                    name: finalName,
                    nameEN: certConfirmForm.nameEN.trim(),
                    hospital: finalHospital,
                    satisfactionScore: avgSat,
                    satisfactionCriteria: evalCriteria,
                    satisfactionComment: evalComment.trim(),
                    certificateClaimed: true,
                    certificateCode: code,
                    certificateIssuedAt: issuedAt,
                    cneuActivityCode: cneuConfig.activityCode,
                    cneuCredits: cneuConfig.cneuCredits,
                    status: 'ผ่าน'
                }, { syncTelemetry: true });

                const publicPayload = typeof CERT.buildPublicCertPayload === 'function'
                    ? CERT.buildPublicCertPayload({ user: updated, code, finalName, nameEN: certConfirmForm.nameEN.trim(), finalHospital, certTemplate, cneuConfig, issuedAt })
                    : {
                        code, name: finalName, nameEN: certConfirmForm.nameEN.trim(), license: user.license || user.id,
                        position: user.position || 'พยาบาลวิชาชีพ', hospital: finalHospital, department: user.department || '',
                        userType: user.userType || 'เรียนใหม่', courseTitleTH: certTemplate.courseTitleTH, orgTitleTH: certTemplate.orgTitleTH,
                        signerName: certTemplate.signerName, signerPosition: certTemplate.signerPosition,
                        posttestScore: user.posttest || 'ผ่านเกณฑ์ (≥ 80%)', skillLabBestScore: user.skillLabBestScore ?? null,
                        cneuActivityCode: cneuConfig.activityCode, cneuCredits: cneuConfig.cneuCredits, issuedAt, status: 'valid'
                    };

                try {
                    const localMap = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                    localMap[code] = publicPayload;
                    localStorage.setItem('rjcloud_local_certificates', JSON.stringify(localMap));
                    if (fbDb && !isAdminPreview) {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), publicPayload, { merge: true });
                    }
                } catch (_) {}

                setScreen('certificate');
                showToast('ออกประกาศนียบัตรและหนังสือรับรอง CNEU เรียบร้อยแล้วค่ะ 🎉');
            };

            const handleDownloadCertPng = () => {
                if (!certCanvasRef.current) return;
                if (typeof CERT.downloadCanvasAsPng === 'function') {
                    CERT.downloadCanvasAsPng(certCanvasRef.current, user?.certificateCode);
                } else {
                    const a = document.createElement('a');
                    a.href = certCanvasRef.current.toDataURL('image/png', 1.0);
                    a.download = `Certificate_${user?.certificateCode || 'rjcloud'}.png`;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                }
                showToast('ดาวน์โหลดประกาศนียบัตร (PNG) เรียบร้อยแล้วค่ะ');
            };

            const handleDownloadCertPdf = () => {
                if (!certCanvasRef.current) return;
                if (typeof CERT.downloadCanvasAsPdf === 'function') {
                    CERT.downloadCanvasAsPdf(certCanvasRef.current, user?.certificateCode);
                } else if (window.jspdf?.jsPDF) {
                    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    pdf.addImage(certCanvasRef.current.toDataURL('image/png', 1.0), 'PNG', 0, 0, 297, 210);
                    pdf.save(`Certificate_${user?.certificateCode || 'rjcloud'}.pdf`);
                } else {
                    handleDownloadCertPng();
                }
                showToast('ดาวน์โหลดประกาศนียบัตร (PDF) เรียบร้อยแล้วค่ะ');
            };

            const handlePrintCneu = () => {
                if (typeof CERT.printIndividualCneuLetter === 'function') {
                    CERT.printIndividualCneuLetter();
                } else {
                    window.print();
                }
            };

            const activeQuestions = questionSets[0] || parseRawExams(FALLBACK_QUIZ_RAW);
            const activeLesson = lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0];
            const isStudyMet = liveStudyPercent >= MIN_STUDY_PERCENT;
            const isLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const isPostPassed = parsePosttestPercent(user) >= MIN_POSTTEST_PERCENT;
            const canTakePosttest = isAdminPreview || liveConfig.allowPosttest || (hasDonePretest && isStudyMet && isLabDone);

            const navTabs = [
                { id: 'lessons', label: 'บทเรียน + AI', icon: 'BookOpen' },
                { id: 'clinical_cases', label: 'เคสคลินิก', icon: 'Stethoscope' },
                { id: 'flashcards', label: 'Flashcards', icon: 'Layers' },
                { id: 'live', label: 'Live สด', icon: 'Radio' },
                { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
            ];

            // ============================================================================
            // 5. RENDER SCREENS
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* ==================== SCREEN 1: LANDING PAGE ==================== */}
                    {screen === 'landing' && (
                        <div className="relative z-10 min-h-dvh flex flex-col justify-between pt-safe pb-safe">
                            <header className="max-w-6xl w-full mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2.5">
                                    <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-lg">
                                        <Icon name="HeartHandshake" size={19} />
                                    </div>
                                    <div>
                                        <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="text-[10px] text-muted-adaptive block">Clinical Organ Donation Platform</span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-1.5 sm:gap-2">
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                    <a href="./verify.html" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5">
                                        <Icon name="QrCode" size={14} className="text-accent-adaptive" />
                                        <span className="hidden sm:inline">ตรวจประกาศฯ</span>
                                    </a>
                                    <a href="./executive.html" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5">
                                        <Icon name="BarChart3" size={14} className="text-prism-adaptive" />
                                        <span className="hidden sm:inline">ผู้บริหาร</span>
                                    </a>
                                </div>
                            </header>

                            <main className="max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 text-center space-y-6">
                                {HERO_BANNER_URL && (
                                    <div className="max-w-xs sm:max-w-sm mx-auto bg-white rounded-[1.75rem] p-5 shadow-2xl border border-white/60">
                                        <img src={HERO_BANNER_URL} alt="Rajavithi Hospital Organ Transplantation Cloud" className="w-full h-auto max-h-40 object-contain mx-auto" />
                                    </div>
                                )}

                                <div className="space-y-3">
                                    <h1 className="font-display text-2xl sm:text-4xl md:text-5xl font-extrabold text-primary-adaptive leading-tight">
                                        ยกระดับทักษะการรับบริจาคและปลูกถ่ายอวัยวะ{' '}
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-aurora-400 to-prism-400">สู่มาตรฐานปี 2027</span>
                                    </h1>
                                    <p className="text-xs sm:text-base text-secondary-adaptive max-w-2xl mx-auto leading-relaxed">
                                        ผสาน <b className="text-primary-adaptive">AI Study Companion</b> วิเคราะห์จุดอ่อนและช่วยทบทวนตลอด 20 บทเรียน, ฝึกสื่อสารกับญาติใน <b className="text-primary-adaptive">AI Skill Lab 3 มิติ</b> และออกประกาศนียบัตรพร้อม QR Code ทันทีเมื่อผ่านเกณฑ์
                                    </p>
                                </div>

                                <div>
                                    <button
                                        type="button"
                                        onClick={() => { setScreen('auth'); setAuthStep(1); }}
                                        className="touch-target px-8 py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-sm sm:text-base shadow-xl shadow-aurora-500/25 active:scale-[0.98]"
                                    >
                                        เข้าสู่ระบบ / ลงทะเบียนเรียน →
                                    </button>
                                </div>

                                <div className="spatial-card rounded-[2rem] p-4 sm:p-6 space-y-4">
                                    <p className="font-mono text-[11px] font-bold text-prism-adaptive uppercase tracking-wider">
                                        5-STEP AI-GUIDED PATHWAY สู่ประกาศนียบัตรอิเล็กทรอนิกส์
                                    </p>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5 text-left">
                                        {[
                                            { step: 'STEP 01', icon: 'ClipboardCheck', title: 'Pre-test + AI Map', desc: 'วิเคราะห์จุดอ่อน 4 หมวดและจัดแผนรายบุคคล' },
                                            { step: 'STEP 02', icon: 'BookOpen', title: `เรียน ≥ ${MIN_STUDY_PERCENT}% + AI`, desc: '20 บทเรียน AI สรุป 1 นาที & ถาม-ตอบสด' },
                                            { step: 'STEP 03', icon: 'Bot', title: 'AI Skill Lab 3D', desc: 'ฝึกสื่อสารกับญาติ 3 มิติ จับความเงียบ 2.5 วิ' },
                                            { step: 'STEP 04', icon: 'FileCheck2', title: `Post-test ≥ ${MIN_POSTTEST_PERCENT}%`, desc: 'ทดสอบหลังเรียนพร้อม AI ทบทวนจุดพลาด' },
                                            { step: 'STEP 05', icon: 'Award', title: 'ประกาศนียบัตร', desc: 'รับ PDF / PNG พร้อม QR ยืนยันคุณวุฒิทันที' }
                                        ].map(item => (
                                            <div key={item.step} className="spatial-soft p-3 rounded-2xl space-y-1.5 text-center">
                                                <div className="w-8 h-8 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center mx-auto">
                                                    <Icon name={item.icon} size={16} />
                                                </div>
                                                <span className="font-mono text-[9px] text-muted-adaptive block">{item.step}</span>
                                                <p className="font-display font-bold text-xs text-primary-adaptive leading-snug">{item.title}</p>
                                                <p className="text-[11px] text-muted-adaptive leading-snug">{item.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </main>

                            <footer className="max-w-6xl w-full mx-auto px-4 sm:px-6 py-4 flex items-center justify-between text-xs text-muted-adaptive">
                                <a href="./admin.html" title="ผู้ดูแลระบบ" className="spatial-soft w-8 h-8 rounded-xl flex items-center justify-center text-muted-adaptive hover:text-accent-adaptive">
                                    <Icon name="Settings" size={14} />
                                </a>
                                <span className="font-mono text-[11px]">{CONFIG.appName} • {CONFIG.contactEmail}</span>
                            </footer>
                        </div>
                    )}

                    {/* ==================== SCREEN 2: AUTH WIZARD 3 STEPS (PDPA + PRE-OTP MASK) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 min-h-dvh flex items-center justify-center p-4 pt-safe pb-safe">
                            <div className="spatial-card w-full max-w-lg rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => (authStep === 1 ? setScreen('landing') : setAuthStep(s => s - 1))} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1">
                                        <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-xs font-bold text-prism-adaptive">STEP {authStep} / 3</span>
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleCheckLicense} className="space-y-4">
                                        <div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนเรียน</h2>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">กรอกเลขที่ใบประกอบวิชาชีพ (ไม่เก็บเลขบัตรประชาชน) เพื่อดึงประวัติเดิมหรือเริ่มลงทะเบียน</p>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-secondary-adaptive mb-1.5">เลขที่ใบประกอบวิชาชีพ / รหัสผู้เรียน *</label>
                                            <input
                                                type="text"
                                                required
                                                value={authForm.license}
                                                onChange={e => setAuthForm(p => ({ ...p, license: e.target.value }))}
                                                placeholder="เช่น 6501234567"
                                                className="touch-target spatial-input w-full px-4 py-3 rounded-2xl font-mono text-base font-bold"
                                            />
                                        </div>
                                        <button type="submit" disabled={authBusy} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังตรวจสอบ...' : 'ตรวจสอบข้อมูลและไปขั้นตอนถัดไป →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={(e) => { e.preventDefault(); requestOtpCode(); }} className="space-y-3.5">
                                        <div>
                                            <h2 className="font-display text-lg font-extrabold text-primary-adaptive">ยืนยันข้อมูลผู้เรียน &amp; ความยินยอม PDPA</h2>
                                            <p className="text-xs text-muted-adaptive">เลขที่ใบอนุญาต: <span className="font-mono font-bold text-prism-adaptive">{authForm.license}</span></p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">คำนำหน้า ชื่อ–นามสกุล *</label>
                                                <input type="text" required value={authForm.name} onChange={e => setAuthForm(p => ({ ...p, name: e.target.value }))} placeholder="พว.ใจดี มีเมตตา" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">ตำแหน่ง</label>
                                                <input type="text" value={authForm.position} onChange={e => setAuthForm(p => ({ ...p, position: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">สังกัด / เขตสุขภาพ</label>
                                                <select value={authForm.department} onChange={e => setAuthForm(p => ({ ...p, department: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm">
                                                    {Object.keys(HOSPITAL_MAPPING).map(dep => <option key={dep} value={dep.replace(/_/g, ' ')}>{dep.replace(/_/g, ' ')}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">โรงพยาบาล / หน่วยงาน</label>
                                                <input type="text" value={authForm.hospital} onChange={e => setAuthForm(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                        </div>

                                        {isReturningUser && !editContactMode ? (
                                            <div className="spatial-soft p-3.5 rounded-2xl space-y-1.5 border-prism-400/35">
                                                <div className="flex items-center justify-between gap-2">
                                                    <span className="text-xs font-bold text-prism-adaptive flex items-center gap-1.5"><Icon name="Lock" size={14} /> ปกปิดข้อมูลติดต่อเดิมก่อนยืนยัน OTP</span>
                                                    <button type="button" onClick={() => setEditContactMode(true)} className="text-xs font-bold text-accent-adaptive hover:underline">เปลี่ยนอีเมล/เบอร์</button>
                                                </div>
                                                <p className="text-xs text-secondary-adaptive font-mono">อีเมล: {maskEmail(authForm.email)} • เบอร์โทร: {maskPhone(authForm.phone) || '-'}</p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-bold text-secondary-adaptive mb-1">อีเมลรับรหัส OTP *</label>
                                                    <input type="email" required value={authForm.email} onChange={e => setAuthForm(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-secondary-adaptive mb-1">เบอร์โทรศัพท์</label>
                                                    <input type="tel" value={authForm.phone} onChange={e => setAuthForm(p => ({ ...p, phone: e.target.value }))} placeholder="08X-XXX-XXXX" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                                </div>
                                            </div>
                                        )}

                                        {/* กล่องแจ้งเตือนและปุ่มติ๊กยินยอม PDPA */}
                                        <div className="p-3.5 rounded-2xl bg-aurora-500/10 border border-aurora-400/35 space-y-2.5">
