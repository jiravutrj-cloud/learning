                            <div className="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-clinical-500 to-medical-500 transition-all"
                                    style={{ width: `${Math.round(((quiz.idx + 1) / Math.max(1, quiz.questions.length)) * 100)}%` }}
                                />
                            </div>

                            <div className="space-y-4">
                                <h3 className="font-display text-base sm:text-lg font-bold text-slate-900 leading-relaxed">
                                    {quiz.idx + 1}. {q.question}
                                </h3>
                                <div className="space-y-2.5">
                                    {q.options.map((opt, oIdx) => {
                                        const isPicked = selectedOpt === oIdx;
                                        return (
                                            <button
                                                key={oIdx}
                                                type="button"
                                                onClick={() => setQuiz(prev => ({ ...prev, answers: { ...prev.answers, [q.id]: oIdx } }))}
                                                className={`touch-target w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 transition-all flex items-start gap-3 ${
                                                    isPicked
                                                        ? 'bg-clinical-50 border-clinical-500 text-clinical-900 shadow-sm'
                                                        : 'bg-white hover:bg-slate-50 border-slate-200/80 text-slate-700'
                                                }`}
                                            >
                                                <span className={`w-6 h-6 rounded-full font-mono text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${
                                                    isPicked ? 'bg-clinical-600 text-white' : 'bg-slate-100 text-slate-500'
                                                }`}>
                                                    {['ก', 'ข', 'ค', 'ง'][oIdx] || oIdx + 1}
                                                </span>
                                                <span className="text-sm sm:text-base font-medium leading-relaxed">{opt}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="flex items-center justify-between gap-2.5 pt-3 border-t border-slate-200/80">
                                <PrimaryButton
                                    variant="ghost"
                                    disabled={quiz.idx === 0}
                                    onClick={() => setQuiz(p => ({ ...p, idx: Math.max(0, p.idx - 1) }))}
                                >
                                    <Icon name="ChevronLeft" size={18} /> ก่อนหน้า
                                </PrimaryButton>

                                {quiz.idx < quiz.questions.length - 1 ? (
                                    <PrimaryButton onClick={() => setQuiz(p => ({ ...p, idx: Math.min(p.questions.length - 1, p.idx + 1) }))}>
                                        ข้อถัดไป <Icon name="ChevronRight" size={18} />
                                    </PrimaryButton>
                                ) : (
                                    <PrimaryButton variant="sky" onClick={handleRequestSubmitQuiz}>
                                        ส่งคำตอบและตรวจคะแนน <Icon name="CheckCircle2" size={18} />
                                    </PrimaryButton>
                                )}
                            </div>
                        </BentoCard>
                        <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 4: PRETEST RESULT / POSTTEST FAIL ---
            if (screen === 'quiz_result' || screen === 'quiz_fail') {
                const isFail = screen === 'quiz_fail';
                const totalQ = Math.max(1, quiz.questions.length);
                const scorePercent = Math.round((quiz.score / totalQ) * 100);
                const passNeed = Math.ceil(totalQ * 0.8);
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-md p-6 sm:p-8 text-center space-y-5">
                            <div className={`w-16 h-16 rounded-2xl mx-auto flex items-center justify-center ${isFail ? 'bg-rose-50 text-rose-500' : 'bg-clinical-50 text-clinical-600'}`}>
                                <Icon name={isFail ? 'AlertTriangle' : 'CheckCircle2'} size={34} />
                            </div>
                            <div>
                                <h2 className="font-display text-2xl font-bold text-slate-900">
                                    {isFail ? 'คะแนน Post-test ยังไม่ถึง 80%' : 'บันทึกผล Pre-test เรียบร้อย'}
                                </h2>
                                <p className="text-sm text-slate-500 mt-1">
                                    {isFail
                                        ? `ต้องทำคะแนน Post-test ไม่น้อยกว่า 80% (${passNeed}/${totalQ} คะแนนขึ้นไป) เพื่อรับประกาศนียบัตร สามารถสอบใหม่ได้ทันทีค่ะ`
                                        : 'ขั้นต่อไป (ขั้นที่ 2): สะสมชั่วโมงเรียนให้ได้อย่างน้อย 80% เพื่อปลดล็อก AI Skill Lab ค่ะ'}
                                </p>
                            </div>
                            <div className="p-6 rounded-2xl bg-slate-50 border border-slate-100">
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">คะแนนที่ได้ ({scorePercent}%)</p>
                                <p className={`font-mono text-5xl font-extrabold mt-1 ${isFail ? 'text-rose-600' : 'text-clinical-600'}`}>
                                    {quiz.score} <span className="text-2xl text-slate-400">/ {quiz.questions.length}</span>
                                </p>
                            </div>
                            <div className="space-y-2.5">
                                {isFail && (
                                    <PrimaryButton onClick={() => startQuiz('posttest')} className="w-full">
                                        ทำแบบทดสอบหลังเรียนอีกครั้ง
                                    </PrimaryButton>
                                )}
                                <PrimaryButton variant={isFail ? 'ghost' : 'clinical'} onClick={() => setScreen('dashboard')} className="w-full">
                                    เข้าสู่ห้องเรียนหลัก
                                </PrimaryButton>
                            </div>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 5: CERTIFICATE CONFIRMATION + CSAT RATING ---
            if (screen === 'cert_confirm' && user) {
                const postInfo = parseScoreInfo(user.posttest);
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-xl p-5 sm:p-8 space-y-5">
                            <div className="text-center space-y-1.5">
                                <div className="w-14 h-14 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto">
                                    <Icon name="Award" size={30} />
                                </div>
                                <span className="inline-block px-3 py-1 rounded-full bg-clinical-100 text-clinical-700 font-mono text-xs font-bold">
                                    Post-test: {user.posttest} ({postInfo.percent}%) • ผ่านเกณฑ์ ≥ 80%
                                </span>
                                <h2 className="font-display text-2xl font-extrabold text-slate-900">ยินดีด้วย! ผ่านเกณฑ์รับประกาศนียบัตรแล้ว 🎉</h2>
                                <p className="text-xs sm:text-sm text-slate-500">ตรวจสอบชื่อบนประกาศนียบัตรและประเมินความพึงพอใจเพื่อรับใบประกาศฯ ทันที</p>
                            </div>

                            <form onSubmit={handleClaimCertificate} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">ชื่อ - นามสกุล ที่จะปรากฏบนใบประกาศฯ *</label>
                                    <input
                                        type="text"
                                        required
                                        value={certFormName}
                                        onChange={e => setCertFormName(e.target.value)}
                                        className="touch-target w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 text-sm font-bold text-slate-900 focus:outline-none focus:border-clinical-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">โรงพยาบาล / หน่วยงาน</label>
                                    <input
                                        type="text"
                                        value={certFormHosp}
                                        onChange={e => setCertFormHosp(e.target.value)}
                                        className="touch-target w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 text-sm font-medium text-slate-900 focus:outline-none focus:border-clinical-500"
                                    />
                                </div>

                                <div className="p-4 rounded-2xl bg-amber-50/70 border border-amber-200/80 space-y-2.5 text-center">
                                    <p className="text-xs font-bold text-amber-900">ประเมินความพึงพอใจต่อหลักสูตร (CSAT)</p>
                                    <div className="flex items-center justify-center gap-2">
                                        {[1, 2, 3, 4, 5].map(star => (
                                            <button
                                                key={star}
                                                type="button"
                                                onClick={() => setCsatScore(star)}
                                                className="p-1 transition-transform active:scale-90"
                                                aria-label={`${star} ดาว`}
                                            >
                                                <Icon
                                                    name="Star"
                                                    size={32}
                                                    className={star <= csatScore ? 'text-amber-500 fill-amber-400' : 'text-slate-300'}
                                                />
                                            </button>
                                        ))}
                                    </div>
                                    <textarea
                                        rows={2}
                                        value={csatComment}
                                        onChange={e => setCsatComment(e.target.value)}
                                        placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)..."
                                        className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-amber-200 text-xs sm:text-sm outline-none focus:border-amber-400"
                                    />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    <PrimaryButton type="button" variant="ghost" onClick={() => setScreen('dashboard')}>
                                        กลับห้องเรียน
                                    </PrimaryButton>
                                    <PrimaryButton type="submit" disabled={isBusy}>
                                        {isBusy ? 'กำลังออกใบประกาศฯ...' : 'ออกประกาศนียบัตรทันที'} <Icon name="Award" size={18} />
                                    </PrimaryButton>
                                </div>
                            </form>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 6: BUILT-IN CERTIFICATE STUDIO ---
            if (screen === 'certificate' && user) {
                const verifyHref = `./verify.html?code=${encodeURIComponent(user.certificateCode || '')}`;
                return (
                    <div className="min-h-dvh relative flex flex-col items-center justify-center p-3.5 sm:p-6 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-4xl p-4 sm:p-7 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div>
                                    <span className="px-2.5 py-0.5 rounded-full bg-clinical-100 text-clinical-700 font-mono text-[10px] font-bold">
                                        VERIFIED E-CERTIFICATE • {user.certificateCode}
                                    </span>
                                    <h2 className="font-display text-lg sm:text-2xl font-extrabold text-slate-900 mt-1">
                                        ประกาศนียบัตรอิเล็กทรอนิกส์ของคุณ
                                    </h2>
                                </div>
                                <PrimaryButton variant="ghost" onClick={() => setScreen('dashboard')} className="!py-2 !px-4 !text-xs">
                                    <Icon name="ArrowLeft" size={15} /> กลับห้องเรียน
                                </PrimaryButton>
                            </div>

                            <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-slate-200 shadow-lg">
                                <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                <PrimaryButton onClick={handleDownloadCertPDF} className="w-full">
                                    <Icon name="FileDown" size={18} /> ดาวน์โหลด PDF (A4)
                                </PrimaryButton>
                                <PrimaryButton variant="sky" onClick={handleDownloadCertPNG} className="w-full">
                                    <Icon name="Image" size={18} /> บันทึกรูปภาพ PNG
                                </PrimaryButton>
                                <a
                                    href={verifyHref}
                                    target="_blank"
                                    rel="noreferrer"
                                    className="touch-target w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-display font-bold text-sm shadow-sm"
                                >
                                    <Icon name="QrCode" size={18} className="text-clinical-600" /> หน้าตรวจสอบ QR
                                </a>
                            </div>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 7: STUDENT DASHBOARD ---
            if (!user) return null;

            const targetHours = getTargetHours(user.userType, liveConfig.hours);
            const hasDonePretest = Boolean(user.pretest && user.pretest !== '-');
            // ขั้นที่ 2: ชั่วโมงเรียนไม่น้อยกว่า 80%
            const isStudyMet = (user.progress || 0) >= 80 || liveConfig.allowPosttest;
            // ขั้นที่ 3: ผ่านห้องฝึกความเข้าใจหลักการ AI Skill Lab
            const isSkillLabMet = hasPassedSkillLab(user) || liveConfig.allowPosttest;
            // ขั้นที่ 4 & 5: คะแนน Post-test ไม่น้อยกว่า 80% (สิทธิ์รับประกาศฯ อ้างอิงจากคะแนน Post-test)
            const posttestInfo = parseScoreInfo(user.posttest);
            const hasPassedPosttest = posttestInfo.passed80;

            const canEnterSkillLab = hasDonePretest && isStudyMet;
            const canTakePosttest = hasDonePretest && isStudyMet && isSkillLabMet;
            const hasPassedCourse = hasPassedPosttest;

            const activeLesson = lessons.find(l => l.id === currentVideoId) || lessons[0];
            const filteredLessons = lessons.filter(l => l.title.toLowerCase().includes(lessonSearch.trim().toLowerCase()));
            const currentLessonIndex = Math.max(0, lessons.findIndex(l => l.id === activeLesson?.id));

            const learningSteps = [
                { num: 1, title: 'Pre-test', sub: hasDonePretest ? user.pretest : 'เริ่มสอบ', done: hasDonePretest, current: !hasDonePretest },
                { num: 2, title: 'เรียน ≥ 80%', sub: `${user.progress || 0}%`, done: isStudyMet, current: hasDonePretest && !isStudyMet },
                { num: 3, title: 'AI Skill Lab', sub: isSkillLabMet ? 'ผ่านแล้ว' : (canEnterSkillLab ? 'พร้อมฝึก' : 'ล็อก'), done: isSkillLabMet, current: canEnterSkillLab && !isSkillLabMet },
                { num: 4, title: 'Post-test ≥ 80%', sub: hasPassedPosttest ? `${posttestInfo.percent}%` : (canTakePosttest ? 'พร้อมสอบ' : 'ล็อก'), done: hasPassedPosttest, current: canTakePosttest && !hasPassedPosttest },
                { num: 5, title: 'ประกาศนียบัตร', sub: hasPassedCourse ? 'รับได้ทันที' : 'รอผลสอบ', done: hasPassedCourse, current: hasPassedCourse }
            ];

            const nextAction = hasPassedCourse
                ? {
                    badge: `ขั้นที่ 5/5 • POST-TEST ${user.posttest} (${posttestInfo.percent}%)`,
                    title: 'ยินดีด้วย! คุณผ่านเกณฑ์รับประกาศนียบัตรแล้ว 🎉',
                    desc: 'อ้างอิงจากผลคะแนน Post-test ไม่น้อยกว่า 80% สามารถดาวน์โหลด PDF (A4) หรือแชร์พร้อม QR Code ได้ทันที',
                    btn: 'เปิดรับประกาศนียบัตร',
                    variant: 'clinical',
                    onClick: () => {
                        if (!user.certificateClaimed) {
                            setCertFormName(user.name || '');
                            setCertFormHosp(user.hospital || '');
                            setScreen('cert_confirm');
                        } else {
                            setScreen('certificate');
                        }
                    }
                }
                : canTakePosttest
                    ? {
                        badge: 'ขั้นที่ 4/5 • READY FOR POST-TEST',
                        title: 'ผ่าน AI Skill Lab แล้ว พร้อมสอบ Post-test!',
                        desc: 'ทำแบบทดสอบหลังเรียนให้ได้ไม่น้อยกว่า 80% เพื่อปลดล็อกประกาศนียบัตรในขั้นที่ 5',
                        btn: 'เริ่มสอบ Post-test',
                        variant: 'sky',
                        onClick: () => startQuiz('posttest')
                    }
                    : canEnterSkillLab
                        ? {
                            badge: 'ขั้นที่ 3/5 • AI SKILL LAB UNLOCKED',
                            title: 'ชั่วโมงเรียนครบ 80% แล้ว! เข้าฝึก AI Skill Lab',
                            desc: 'ฝึกสื่อสารให้ข้อมูลญาติแบบเข้าใจหลักการ มี AI Coach คอยชี้นำทางทีละขั้น ไม่ยากเกินไป',
                            btn: 'เข้าห้อง AI Skill Lab',
                            variant: 'amber',
                            onClick: () => { window.location.href = './aiskilllab.html'; }
                        }
                        : !hasDonePretest
                            ? {
                                badge: 'ขั้นที่ 1/5 • PRE-TEST',
                                title: 'เริ่มต้นทำแบบทดสอบก่อนเรียน (Pre-test)',
                                desc: 'ประเมินความรู้พื้นฐานก่อนเริ่มสะสมชั่วโมงเรียน',
                                btn: 'เริ่มทำ Pre-test',
                                variant: 'sky',
                                onClick: () => startQuiz('pretest')
                            }
                            : {
                                badge: `ขั้นที่ 2/5 • MODULE ${String(activeLesson?.id || 1).padStart(2, '0')}`,
                                title: `เรียนต่อ: ${activeLesson?.title || 'บทเรียนออนไลน์'}`,
                                desc: `สะสมเวลาเรียนให้ได้อย่างน้อย 80% (ปัจจุบัน ${user.progress || 0}%) เพื่อปลดล็อก AI Skill Lab`,
                                btn: 'เปิดบทเรียน',
                                variant: 'clinical',
                                onClick: () => setActiveTab('video')
                            };

            const avgSkillScore = user.skillLabHistory?.length
                ? Math.round(user.skillLabHistory.reduce((s, r) => s + (r.score || 0), 0) / user.skillLabHistory.length)
                : 0;

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-dock-safe md:pb-12">
                    <div className="aura-canvas" /><div className="aura-grid" />

                    {/* Top Student App Header */}
                    <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/84 border-b border-slate-200/75">
                        <div className="max-w-7xl mx-auto px-3.5 sm:px-6 md:px-8 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shadow-sm shrink-0">
                                    <Icon name="HeartPulse" size={19} />
                                </div>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-slate-900 block leading-none truncate">
                                        rjcloud<span className="text-clinical-600">.organ</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-slate-500 block truncate">
                                        {user.name} • {user.userType}
                                    </span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                                {hasPassedCourse && (
                                    <button
                                        type="button"
                                        onClick={() => setScreen(user.certificateClaimed ? 'certificate' : 'cert_confirm')}
                                        className="px-3 py-1.5 rounded-xl bg-clinical-600 hover:bg-clinical-700 text-white text-xs font-bold inline-flex items-center gap-1.5 shadow-sm"
                                    >
                                        <Icon name="Award" size={15} />
                                        <span className="hidden sm:inline">รับประกาศฯ</span>
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={() => setActiveTab('profile')}
                                    className="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center"
                                    title="โปรไฟล์ผู้เรียน"
                                >
                                    <Icon name="User" size={18} />
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="relative z-10 max-w-7xl w-full mx-auto px-3 sm:px-4 md:px-8 pt-4 md:pt-6 space-y-4 md:space-y-6">
                        {/* 5-Step Learning Pathway Stepper */}
                        <BentoCard className="p-3.5 sm:p-4">
                            <div className="grid grid-cols-5 gap-1.5 sm:gap-3">
                                {learningSteps.map(st => (
                                    <div
                                        key={st.num}
                                        className={`p-2 sm:p-3 rounded-2xl border text-center transition-all ${
                                            st.done
                                                ? 'bg-clinical-50 border-clinical-300 text-clinical-800'
                                                : st.current
                                                    ? 'bg-medical-50 border-medical-300 text-medical-800 ring-2 ring-medical-500/15'
                                                    : 'bg-slate-50/80 border-slate-200/70 text-slate-400'
                                        }`}
                                    >
                                        <div className={`w-6 h-6 mx-auto rounded-full font-mono text-[11px] font-extrabold flex items-center justify-center mb-1 ${
                                            st.done ? 'bg-clinical-600 text-white' : st.current ? 'bg-medical-600 text-white' : 'bg-slate-200 text-slate-500'
                                        }`}>
                                            {st.done ? '✓' : st.num}
                                        </div>
                                        <p className="text-[10px] sm:text-xs font-bold leading-tight truncate">{st.title}</p>
                                        <p className="text-[9px] sm:text-[11px] font-mono opacity-80 truncate mt-0.5">{st.sub}</p>
                                    </div>
                                ))}
                            </div>
                        </BentoCard>

                        {/* Bento Summary Row */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-3.5 md:gap-5">
                            <BentoCard className="lg:col-span-8 p-4 sm:p-6 md:p-7 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                <div className="space-y-1 max-w-xl">
                                    <span className="inline-block px-2.5 py-0.5 rounded-full bg-clinical-100 text-clinical-700 font-mono text-[10px] md:text-[11px] font-bold">
                                        {nextAction.badge}
                                    </span>
                                    <h2 className="font-display text-lg sm:text-xl md:text-2xl font-bold text-slate-900 leading-snug">{nextAction.title}</h2>
                                    <p className="text-xs sm:text-sm text-slate-600">{nextAction.desc}</p>
                                </div>
                                <PrimaryButton variant={nextAction.variant} onClick={nextAction.onClick} className="w-full md:w-auto shrink-0 !py-3 md:!py-3.5">
                                    {nextAction.btn} <Icon name="ChevronRight" size={18} />
                                </PrimaryButton>
                            </BentoCard>

                            <BentoCard className="lg:col-span-4 p-4 sm:p-6 flex flex-col justify-between">
                                <div className="flex items-start justify-between">
                                    <div>
                                        <p className="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                                            <Icon name="Clock" size={14} className="text-clinical-600" /> เวลาเรียนสะสม ({user.userType})
                                        </p>
                                        <p className="font-mono text-base sm:text-lg font-bold text-slate-900 mt-0.5">{formatDuration(studySeconds)}</p>
                                    </div>
                                    <span className="font-mono text-2xl font-extrabold text-clinical-600">{user.progress || 0}%</span>
                                </div>
                                <div className="mt-3">
                                    <div className="relative w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-clinical-500 to-medical-500 rounded-full transition-all duration-500" style={{ width: `${user.progress || 0}%` }} />
                                        <div className="absolute top-0 bottom-0 left-[80%] w-0.5 bg-amber-500/80" title="เกณฑ์ปลดล็อก AI Lab 80%" />
                                    </div>
                                    <div className="flex justify-between text-[11px] text-slate-400 font-medium mt-1.5">
                                        <span>เกณฑ์ขั้นต่ำ 80% (เป้าหมาย {targetHours} ชม.)</span>
                                        <span>{isTabVisible ? 'กำลังบันทึกเวลาอัตโนมัติ' : 'หยุดนับชั่วคราว'}</span>
                                    </div>
                                </div>
                            </BentoCard>
                        </div>

                        {/* Smartphone Bottom Dock + Desktop Pill Nav */}
                        <nav className="fixed bottom-0 left-0 right-0 md:static z-40">
                            <div className="bg-white/92 md:bg-white/75 backdrop-blur-2xl border-t md:border border-slate-200/80 md:rounded-2xl px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] md:p-1.5 grid grid-cols-5 md:flex items-center md:w-fit gap-1 shadow-[0_-8px_30px_rgba(15,23,42,0.08)] md:shadow-sm">
                                {[
                                    { id: 'video', label: 'บทเรียน', icon: 'MonitorPlay' },
                                    { id: 'live', label: 'Live สด', icon: 'Radio', live: liveConfig.status === 'live' },
                                    {
                                        id: 'skill_lab',
                                        label: canEnterSkillLab ? 'AI Lab' : 'AI Lab 🔒',
                                        icon: canEnterSkillLab ? 'Bot' : 'Lock',
                                        locked: !canEnterSkillLab,
                                        customClick: () => {
                                            if (!canEnterSkillLab) {
                                                showToast(`กรุณาสะสมชั่วโมงเรียนให้ได้อย่างน้อย 80% ก่อนเข้า AI Skill Lab ค่ะ (ปัจจุบัน ${user.progress || 0}%)`, 'info');
                                                return;
                                            }
                                            window.location.href = './aiskilllab.html';
                                        }
                                    },
                                    { id: 'leaderboard', label: 'อันดับ', icon: 'Trophy' },
                                    { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
                                ].map(item => {
                                    const active = activeTab === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            type="button"
                                            onClick={item.customClick || (() => setActiveTab(item.id))}
                                            className={`touch-target flex flex-col md:flex-row items-center justify-center gap-0.5 md:gap-2 px-1.5 md:px-5 py-1.5 md:py-2.5 rounded-xl text-[10px] sm:text-[11px] md:text-sm font-bold transition-all active:scale-95 ${
                                                active
                                                    ? 'bg-clinical-600 text-white shadow-md shadow-clinical-600/20'
                                                    : item.locked
                                                        ? 'text-slate-400 bg-slate-50/70'
                                                        : item.live
                                                            ? 'bg-rose-50 text-rose-600 animate-pulse'
                                                            : 'text-slate-600 hover:bg-slate-100/80'
                                            }`}
                                        >
                                            <Icon name={item.icon} size={19} />
                                            <span className="truncate max-w-full">{item.label}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </nav>

                        {/* ==================== TAB: VIDEO LESSONS ==================== */}
                        {activeTab === 'video' && (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                <BentoCard className="lg:col-span-8 p-3.5 sm:p-5 space-y-4">
                                    <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-900 border border-slate-200/80 shadow-md">
                                        {activeLesson?.videoId ? (
                                            <iframe
                                                key={activeLesson.id}
                                                src={`https://drive.google.com/file/d/${activeLesson.videoId}/preview`}
                                                className="absolute inset-0 w-full h-full border-0"
                                                allow="autoplay; fullscreen"
                                                allowFullScreen
                                                title={activeLesson.title}
                                            />
                                        ) : (
                                            <div className="absolute inset-0 flex items-center justify-center text-slate-400 text-sm">
                                                ยังไม่ได้เชื่อมต่อวิดีโอสำหรับบทเรียนนี้
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div>
                                            <span className="px-2.5 py-0.5 rounded-full bg-clinical-50 text-clinical-700 font-mono text-[10px] font-bold">
                                                บทที่ {currentLessonIndex + 1} / {lessons.length}
                                            </span>
                                            <h3 className="font-display font-bold text-base sm:text-lg text-slate-900 mt-1">
                                                {activeLesson?.title}
                                            </h3>
                                        </div>

                                        {activeLesson?.documentUrl && (
                                            <a
                                                href={activeLesson.documentUrl}
                                                target="_blank"
                                                rel="noreferrer"
                                                className="touch-target shrink-0 px-4 py-2.5 rounded-2xl bg-medical-50 hover:bg-medical-100 border border-medical-200 text-medical-700 font-bold text-xs inline-flex items-center justify-center gap-1.5"
                                            >
                                                <Icon name="FileText" size={15} /> เอกสารประกอบบทเรียน
                                            </a>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-100">
                                        <PrimaryButton
                                            variant="ghost"
                                            disabled={currentLessonIndex <= 0}
                                            onClick={() => {
                                                const prevL = lessons[currentLessonIndex - 1];
                                                if (prevL) {
                                                    setCurrentVideoId(prevL.id);
                                                    persistUser({ ...user, lastVideoId: prevL.id }, false);
                                                }
                                            }}
                                            className="!text-xs sm:!text-sm"
                                        >
                                            <Icon name="ChevronLeft" size={16} /> บทก่อนหน้า
                                        </PrimaryButton>
                                        <PrimaryButton
                                            disabled={currentLessonIndex >= lessons.length - 1}
                                            onClick={() => {
                                                const nextL = lessons[currentLessonIndex + 1];
                                                if (nextL) {
                                                    setCurrentVideoId(nextL.id);
                                                    persistUser({ ...user, lastVideoId: nextL.id }, false);
                                                }
                                            }}
                                            className="!text-xs sm:!text-sm"
                                        >
                                            บทถัดไป <Icon name="ChevronRight" size={16} />
                                        </PrimaryButton>
                                    </div>
                                </BentoCard>

                                <BentoCard className="lg:col-span-4 p-4 sm:p-5 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <h3 className="font-display font-bold text-sm sm:text-base text-slate-900">
                                            รายวิชาทั้งหมด ({lessons.length} บท)
                                        </h3>
                                    </div>
                                    <div className="relative">
                                        <Icon name="Search" size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input
                                            type="text"
                                            value={lessonSearch}
                                            onChange={e => setLessonSearch(e.target.value)}
                                            placeholder="ค้นหาชื่อบทเรียน..."
                                            className="touch-target w-full pl-9 pr-3 py-2 rounded-xl bg-white border border-slate-200 text-xs sm:text-sm outline-none focus:border-clinical-500"
                                        />
                                    </div>

                                    <div className="space-y-1.5 max-h-[440px] overflow-y-auto custom-scrollbar pr-1">
                                        {filteredLessons.map((l) => {
                                            const active = l.id === activeLesson?.id;
                                            return (
                                                <button
                                                    key={l.id}
                                                    type="button"
                                                    onClick={() => {
                                                        setCurrentVideoId(l.id);
                                                        persistUser({ ...user, lastVideoId: l.id }, false);
                                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                                    }}
                                                    className={`w-full text-left p-3 rounded-2xl border transition-all flex items-start gap-2.5 ${
                                                        active
                                                            ? 'bg-clinical-50 border-clinical-400 text-clinical-900 shadow-sm'
                                                            : 'bg-white/80 hover:bg-slate-50 border-slate-200/70 text-slate-700'
                                                    }`}
                                                >
                                                    <span className={`w-6 h-6 rounded-lg font-mono text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5 ${
                                                        active ? 'bg-clinical-600 text-white' : 'bg-slate-100 text-slate-500'
                                                    }`}>
                                                        {l.id}
                                                    </span>
                                                    <span className="text-xs sm:text-sm font-semibold leading-snug">{l.title}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </BentoCard>
                            </div>
                        )}

                        {/* ==================== TAB: LIVE STREAM ==================== */}
                        {activeTab === 'live' && (
                            <BentoCard className="p-4 sm:p-7 space-y-5 max-w-4xl mx-auto">
                                <div className="flex flex-wrap items-center justify-between gap-3">
                                    <div>
                                        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${
                                            liveConfig.status === 'live'
                                                ? 'bg-rose-100 text-rose-700'
                                                : liveConfig.status === 'paused'
                                                    ? 'bg-amber-100 text-amber-800'
                                                    : 'bg-slate-100 text-slate-600'
                                        }`}>
                                            <span className={`w-2 h-2 rounded-full ${liveConfig.status === 'live' ? 'bg-rose-500 animate-ping' : 'bg-slate-400'}`} />
                                            {liveConfig.status === 'live' ? 'กำลังถ่ายทอดสด (LIVE)' : liveConfig.status === 'paused' ? 'พักเบรกการบรรยาย' : 'ยังไม่มีการถ่ายทอดสด'}
                                        </span>
                                        <h3 className="font-display text-lg sm:text-2xl font-bold text-slate-900 mt-1.5">
                                            {liveConfig.topic}
                                        </h3>
                                    </div>

                                    <PrimaryButton
                                        variant={isLiveCheckedIn ? 'ghost' : 'clinical'}
                                        onClick={handleLiveCheckIn}
                                        disabled={isLiveCheckedIn}
                                    >
                                        <Icon name={isLiveCheckedIn ? 'CheckCircle2' : 'UserCheck'} size={18} />
                                        {isLiveCheckedIn ? 'ยืนยันเข้าเรียนสดแล้ว' : 'ยืนยันเข้าเรียนสด'}
                                    </PrimaryButton>
                                </div>

                                {liveConfig.url ? (
                                    <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-900 border border-slate-200">
                                        <iframe
                                            src={liveConfig.url}
                                            className="absolute inset-0 w-full h-full border-0"
                                            allow="autoplay; fullscreen"
                                            allowFullScreen
                                            title="Live Broadcast"
                                        />
                                    </div>
                                ) : (
                                    <div className="p-10 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-center space-y-2">
                                        <Icon name="Radio" size={32} className="mx-auto text-slate-400" />
                                        <p className="font-display font-bold text-slate-700">ยังไม่มีลิงก์ถ่ายทอดสดในขณะนี้</p>
                                        <p className="text-xs text-slate-500">คุณสามารถรับชมวิดีโอบทเรียนย้อนหลังในแท็บ "บทเรียน" เพื่อสะสมเวลาเรียนได้เลยค่ะ</p>
                                    </div>
                                )}

                                {liveConfig.documentUrl && (
                                    <a
                                        href={liveConfig.documentUrl}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="touch-target w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-medical-50 hover:bg-medical-100 border border-medical-200 text-medical-700 font-bold text-sm"
                                    >
                                        <Icon name="FileText" size={17} /> ดาวน์โหลดเอกสารประกอบการบรรยายสด
                                    </a>
                                )}
                            </BentoCard>
                        )}

                        {/* ==================== TAB: LEADERBOARD ==================== */}
                        {activeTab === 'leaderboard' && (
                            <BentoCard className="p-4 sm:p-7 max-w-3xl mx-auto space-y-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h3 className="font-display text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-2">
                                            <Icon name="Trophy" size={20} className="text-amber-500" />
                                            กระดานเกียรติยศ AI Skill Lab
                                        </h3>
                                        <p className="text-xs text-slate-500">จัดอันดับคะแนนทักษะการสื่อสารกับญาติสูงสุด (คุ้มครองข้อมูล PDPA)</p>
                                    </div>
                                </div>

                                {leaderboard.length > 0 ? (
                                    <div className="space-y-2">
                                        {leaderboard.map((row, idx) => (
                                            <div key={row.id} className="p-3.5 rounded-2xl bg-white/90 border border-slate-200/70 flex items-center justify-between gap-3">
                                                <div className="flex items-center gap-3 min-w-0">
                                                    <span className={`w-8 h-8 rounded-xl font-mono text-xs font-extrabold flex items-center justify-center shrink-0 ${
                                                        idx === 0 ? 'bg-amber-100 text-amber-700' : idx === 1 ? 'bg-slate-200 text-slate-700' : idx === 2 ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-500'
                                                    }`}>
                                                        #{idx + 1}
                                                    </span>
                                                    <div className="min-w-0">
                                                        <p className="font-display font-bold text-sm text-slate-900 truncate">{row.name}</p>
                                                        <p className="text-xs text-slate-500 truncate">{row.hospital || 'เครือข่าย rjcloud.organ'}</p>
                                                    </div>
                                                </div>
                                                <span className="font-mono text-base font-extrabold text-clinical-700 shrink-0">
                                                    {row.score} <span className="text-xs text-slate-400">/100</span>
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="p-8 rounded-2xl bg-slate-50 text-center text-sm text-slate-500">
                                        ยังไม่มีสถิติคะแนน AI Skill Lab — สะสมเวลาเรียนให้ครบ 80% แล้วเข้าฝึกเพื่อขึ้นอันดับแรกได้เลยค่ะ!
                                    </div>
                                )}
                            </BentoCard>
                        )}

                        {/* ==================== TAB: PROFILE ==================== */}
                        {activeTab === 'profile' && (
                            <BentoCard className="p-5 sm:p-7 max-w-2xl mx-auto space-y-5">
                                <div className="flex items-center gap-4 pb-4 border-b border-slate-100">
                                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-clinical-500 to-medical-500 text-white font-display font-extrabold text-xl flex items-center justify-center shrink-0">
                                        {(user.name || 'U').slice(0, 1)}
                                    </div>
                                    <div className="min-w-0">
                                        <h3 className="font-display text-lg sm:text-xl font-extrabold text-slate-900 truncate">{user.name}</h3>
                                        <p className="text-xs sm:text-sm text-slate-500 truncate">{user.position || 'บุคลากรทางการแพทย์'} • {user.hospital}</p>
                                        <span className="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-clinical-50 text-clinical-700 font-mono text-[11px] font-bold">
                                            ใบอนุญาต: {user.license || user.id} • {user.userType}
                                        </span>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                        <p className="text-[11px] font-bold text-slate-400">1. Pre-test</p>
                                        <p className="font-mono text-lg font-extrabold text-medical-600 mt-0.5">{user.pretest || '-'}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                        <p className="text-[11px] font-bold text-slate-400">4. Post-test (≥ 80%)</p>
                                        <p className={`font-mono text-lg font-extrabold mt-0.5 ${hasPassedPosttest ? 'text-clinical-600' : 'text-slate-700'}`}>
                                            {user.posttest && user.posttest !== '-' ? `${user.posttest} (${posttestInfo.percent}%)` : '-'}
                                        </p>
                                    </div>
                                    <div className="col-span-2 sm:col-span-1 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                        <p className="text-[11px] font-bold text-slate-400">3. AI Skill Lab</p>
                                        <p className="font-mono text-lg font-extrabold text-violet-600 mt-0.5">
                                            {isSkillLabMet ? (avgSkillScore > 0 ? `ผ่าน (${avgSkillScore}/100)` : 'ผ่านแล้ว') : '-'}
                                        </p>
                                    </div>
                                </div>

                                {hasPassedCourse ? (
                                    <PrimaryButton
                                        onClick={() => {
                                            if (!user.certificateClaimed) {
                                                setCertFormName(user.name || '');
                                                setCertFormHosp(user.hospital || '');
                                                setScreen('cert_confirm');
                                            } else {
                                                setScreen('certificate');
                                            }
                                        }}
                                        className="w-full py-4"
                                    >
                                        <Icon name="Award" size={20} /> เปิดดู / ดาวน์โหลดประกาศนียบัตร (Post-test {posttestInfo.percent}%)
                                    </PrimaryButton>
                                ) : (
                                    <div className="p-4 rounded-2xl bg-amber-50/80 border border-amber-200/80 text-xs text-amber-900 leading-relaxed">
                                        <b>เงื่อนไขรับประกาศนียบัตร (ขั้นที่ 5):</b> ทำ Pre-test → เรียน ≥ 80% → ผ่าน AI Skill Lab → ทำคะแนน Post-test ไม่น้อยกว่า 80%
                                    </div>
                                )}

                                <button
                                    type="button"
                                    onClick={handleLogout}
                                    className="touch-target w-full py-3 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-sm transition-colors"
                                >
                                    ออกจากระบบ
                                </button>
                            </BentoCard>
                        )}
                    </main>

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
