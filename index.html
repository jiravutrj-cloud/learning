                                                    await saveUserProgress({ lastLiveCheckInAt: new Date().toISOString() });
                                                    showToast('ยืนยันการเข้าเรียนห้องบรรยายสดเรียบร้อยแล้วค่ะ');
                                                }}
                                                className={`touch-target px-5 py-2.5 rounded-2xl font-display font-extrabold text-xs flex items-center gap-1.5 ${
                                                    isLiveCheckedIn
                                                        ? 'bg-aurora-500/20 text-accent-adaptive border border-aurora-400/40'
                                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-lg'
                                                }`}
                                            >
                                                <Icon name="CheckCircle2" size={16} />
                                                {isLiveCheckedIn ? 'ยืนยันเข้าเรียนแล้ว ✓' : 'ยืนยันเข้าเรียน Live'}
                                            </button>
                                        </div>

                                        <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10 flex items-center justify-center">
                                            {liveConfig.url ? (
                                                <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen" allowFullScreen title="Live Broadcast" />
                                            ) : (
                                                <p className="text-sm text-slate-400 p-6 text-center">ยังไม่มีลิงก์ถ่ายทอดสดในขณะนี้ เมื่อวิทยากรเปิด Live หน้าจอจะแสดงอัตโนมัติค่ะ</p>
                                            )}
                                        </div>

                                        {liveConfig.documentUrl && (
                                            <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="spatial-soft inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold text-prism-adaptive">
                                                <Icon name="FileText" size={15} /> ดาวน์โหลดเอกสารประกอบการบรรยายสด
                                            </a>
                                        )}
                                    </SpatialCard>
                                )}

                                {/* TAB 5: PDPA-SAFE LEADERBOARD */}
                                {activeTab === 'leaderboard' && (
                                    <SpatialCard className="p-5 sm:p-7 space-y-4">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-aurora-400 uppercase">AI SKILL LAB EMPATHY HALL OF FAME • PDPA-SAFE</span>
                                            <h2 className="font-display text-lg sm:text-2xl font-extrabold text-primary-adaptive">กระดานจัดอันดับทักษะการสื่อสาร</h2>
                                        </div>
                                        <div className="space-y-2.5">
                                            {leaderboard.map((item, idx) => (
                                                <div key={item.id || idx} className="spatial-soft p-3.5 rounded-2xl flex items-center justify-between gap-3">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <span className={`w-8 h-8 rounded-xl font-mono text-xs font-extrabold flex items-center justify-center shrink-0 ${
                                                            idx === 0 ? 'bg-amber-400 text-void-950' : idx === 1 ? 'bg-slate-300 text-void-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-white/10 text-secondary-adaptive'
                                                        }`}>
                                                            {idx + 1}
                                                        </span>
                                                        <div className="min-w-0">
                                                            <p className="font-display font-bold text-sm text-primary-adaptive truncate">{item.name}</p>
                                                            <p className="text-xs text-muted-adaptive truncate">{item.hospital || '-'}</p>
                                                        </div>
                                                    </div>
                                                    <span className="font-mono text-base font-extrabold text-accent-adaptive shrink-0">{item.score}/100</span>
                                                </div>
                                            ))}
                                            {leaderboard.length === 0 && (
                                                <p className="text-center py-8 text-sm text-muted-adaptive">ยังไม่มีอันดับคะแนน AI Skill Lab ในระบบ</p>
                                            )}
                                        </div>
                                    </SpatialCard>
                                )}

                                {/* TAB 6: PROFILE + PORTFOLIO NARRATIVE + PDPA-SAFE PRE-APPROACH WARM-UP */}
                                {activeTab === 'profile' && (
                                    <div className="space-y-5">
                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                                            <SpatialCard className="lg:col-span-5 p-5 sm:p-6 space-y-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center font-display font-extrabold text-lg">
                                                        {(user.name || 'U').slice(0, 1)}
                                                    </div>
                                                    <div className="min-w-0">
                                                        <h2 className="font-display font-bold text-lg text-primary-adaptive truncate">{user.name}</h2>
                                                        <p className="text-xs text-muted-adaptive truncate">{user.position} • {user.hospital}</p>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 gap-2.5 text-xs">
                                                    <div className="spatial-soft p-3 rounded-xl">
                                                        <span className="text-muted-adaptive block">ใบอนุญาต</span>
                                                        <span className="font-mono font-bold text-prism-adaptive">{user.license || user.id}</span>
                                                    </div>
                                                    <div className="spatial-soft p-3 rounded-xl">
                                                        <span className="text-muted-adaptive block">ประเภทสิทธิ์</span>
                                                        <span className="font-bold text-primary-adaptive">{user.userType || 'เรียนใหม่'}</span>
                                                    </div>
                                                    <div className="spatial-soft p-3 rounded-xl">
                                                        <span className="text-muted-adaptive block">Pre-test / Post-test</span>
                                                        <span className="font-mono font-bold text-accent-adaptive">{user.pretest || '-'} / {user.posttest || '-'}</span>
                                                    </div>
                                                    <div className="spatial-soft p-3 rounded-xl">
                                                        <span className="text-muted-adaptive block">AI Skill Lab</span>
                                                        <span className="font-mono font-bold text-accent-adaptive">{user.skillLabBestScore ? `${user.skillLabBestScore}/100` : (hasPassedSkillLab ? 'ผ่าน ✓' : 'รอฝึก')}</span>
                                                    </div>
                                                </div>

                                                <div className="space-y-2 pt-2">
                                                    {user.certificateCode && (
                                                        <button
                                                            type="button"
                                                            onClick={() => setScreen('certificate')}
                                                            className="touch-target w-full py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2"
                                                        >
                                                            <Icon name="Award" size={17} /> เปิดดูและดาวน์โหลดประกาศนียบัตร
                                                        </button>
                                                    )}
                                                    <button
                                                        type="button"
                                                        onClick={handleLogout}
                                                        className="touch-target w-full py-3 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-400/35 text-rose-400 font-display font-bold text-sm flex items-center justify-center gap-2"
                                                    >
                                                        <Icon name="LogOut" size={16} /> ออกจากระบบผู้เรียน
                                                    </button>
                                                </div>
                                            </SpatialCard>

                                            {/* AI Growth Narrative for Portfolio */}
                                            <SpatialCard className="lg:col-span-7 p-5 sm:p-6 space-y-4">
                                                <div className="flex flex-wrap items-center justify-between gap-2">
                                                    <div>
                                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">AI GROWTH NARRATIVE FOR PORTFOLIO</span>
                                                        <h3 className="font-display font-bold text-base sm:text-lg text-primary-adaptive">รายงานสรุปพัฒนาการสมรรถนะแนบแฟ้มผลงาน</h3>
                                                    </div>
                                                    <div className="flex gap-1.5">
                                                        <button
                                                            type="button"
                                                            onClick={() => {
                                                                if (copyTextFallback(growthNarrativeText)) showToast('คัดลอกสรุปพัฒนาการสำหรับแนบ Portfolio แล้วค่ะ');
                                                            }}
                                                            className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1"
                                                        >
                                                            <Icon name="Copy" size={13} /> คัดลอก
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => window.print()}
                                                            className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1 no-print"
                                                        >
                                                            <Icon name="Printer" size={13} /> พิมพ์
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="spatial-soft p-4 rounded-2xl text-xs sm:text-sm text-primary-adaptive whitespace-pre-line leading-relaxed">
                                                    {growthNarrativeText}
                                                </div>
                                            </SpatialCard>
                                        </div>

                                        {/* PDPA-Safe Pre-Approach Warm-up */}
                                        <PreApproachWarmupCard appsScriptUrl={appsScriptUrl} onToast={showToast} />
                                    </div>
                                )}
                            </main>

                            {/* Mobile Bottom Spatial Dock */}
                            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] no-print">
                                <div className="grid grid-cols-6 gap-1 max-w-xl mx-auto">
                                    {[
                                        { id: 'lessons', label: 'บทเรียน', icon: 'MonitorPlay' },
                                        { id: 'clinical_cases', label: 'เคสคลินิก', icon: 'Stethoscope' },
                                        { id: 'flashcards', label: 'การ์ดจำ', icon: 'Layers' },
                                        { id: 'live', label: 'Live', icon: 'Radio' },
                                        { id: 'leaderboard', label: 'อันดับ', icon: 'Trophy' },
                                        { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
                                    ].map(t => {
                                        const active = activeTab === t.id;
                                        return (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => { setActiveTab(t.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all ${
                                                    active ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950' : 'text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={17} />
                                                <span className="truncate max-w-full px-0.5">{t.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </nav>
                        </div>
                    )}

                    {/* ==================== SCREEN 6: CERTIFICATE CONFIRM & CSAT ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <div className="relative z-10 flex-1 flex items-center justify-center px-4 py-8">
                            <SpatialCard className="w-full max-w-lg p-6 sm:p-8 space-y-5">
                                <div className="text-center space-y-1.5">
                                    <span className="px-3 py-1 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[10px] font-bold">
                                        STEP 05 • CERTIFICATE & SATISFACTION SURVEY
                                    </span>
                                    <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                        ยืนยันชื่อบนประกาศนียบัตร & ประเมินความพึงพอใจ
                                    </h1>
                                </div>

                                <form onSubmit={handleConfirmIssueCertificate} className="space-y-4">
                                    <FormField label="ชื่อ - นามสกุลที่จะแสดงบนประกาศนียบัตร *" required value={certFormName} onChange={e => setCertFormName(e.target.value)} />
                                    <FormField label="โรงพยาบาล / หน่วยงาน" value={certFormHosp} onChange={e => setCertFormHosp(e.target.value)} />

                                    <div className="spatial-soft p-4 rounded-2xl space-y-2.5 text-center">
                                        <p className="text-xs font-bold text-secondary-adaptive">ระดับความพึงพอใจต่อหลักสูตรและระบบ AI (1–5 ดาว)</p>
                                        <div className="flex items-center justify-center gap-2">
                                            {[1, 2, 3, 4, 5].map(star => (
                                                <button
                                                    key={star}
                                                    type="button"
                                                    onClick={() => setCsatRating(star)}
                                                    className={`w-11 h-11 rounded-2xl flex items-center justify-center transition-all ${
                                                        star <= csatRating ? 'bg-amber-400/20 text-amber-400 scale-105' : 'spatial-soft text-muted-adaptive'
                                                    }`}
                                                >
                                                    <Icon name="Star" size={22} className={star <= csatRating ? 'fill-amber-400' : ''} />
                                                </button>
                                            ))}
                                        </div>
                                        <input
                                            type="text"
                                            value={csatComment}
                                            onChange={e => setCsatComment(e.target.value)}
                                            placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)"
                                            className="spatial-input w-full px-3.5 py-2.5 rounded-xl text-xs"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={isIssuingCert}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-xl"
                                    >
                                        {isIssuingCert ? 'กำลังออกประกาศนียบัตร...' : 'ออกประกาศนียบัตรพร้อม QR Code ทันที'}
                                    </button>
                                </form>
                            </SpatialCard>
                        </div>
                    )}

                    {/* ==================== SCREEN 7: MINIMALIST GOLD CERTIFICATE STUDIO ==================== */}
                    {screen === 'certificate' && user && (
                        <div className="relative z-10 flex-1 w-full max-w-5xl mx-auto px-3.5 sm:px-6 py-6 sm:py-10 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">OFFICIAL CERTIFICATE • MINIMALIST GOLD</span>
                                    <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ประกาศนียบัตรอิเล็กทรอนิกส์ของคุณ</h1>
                                </div>
                                <button
                                    type="button"
                                    onClick={() => setScreen('dashboard')}
                                    className="spatial-soft px-4 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                </button>
                            </div>

                            <SpatialCard className="p-3 sm:p-6 space-y-4">
                                <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-amber-500/35 shadow-2xl">
                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                    <button
                                        type="button"
                                        onClick={handleDownloadCertPDF}
                                        className="touch-target py-3.5 px-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                    >
                                        <Icon name="FileDown" size={18} /> ดาวน์โหลด PDF (A4)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleDownloadCertPNG}
                                        className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="Image" size={18} className="text-accent-adaptive" /> บันทึกภาพ PNG (300 DPI)
                                    </button>
                                    <a
                                        href={`./verify.html?code=${encodeURIComponent(user.certificateCode || '')}`}
                                        className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-prism-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="QrCode" size={18} /> ตรวจสอบรหัสรับรอง
                                    </a>
                                </div>
                            </SpatialCard>
                        </div>
                    )}

                    {/* Collapsible Admin Preview Floating Badge */}
                    {isAdminPreview && (
                        <div className="fixed top-[calc(4.5rem+env(safe-area-inset-top,0px))] right-3 z-[130] flex flex-col items-end gap-1.5 no-print">
                            {previewBarOpen ? (
                                <div className="spatial-card rounded-2xl p-2 flex flex-wrap items-center gap-1.5 text-[11px] font-bold">
                                    <span className="text-accent-adaptive font-mono px-1">ADMIN VIEW</span>
                                    <button type="button" onClick={() => setScreen('landing')} className="px-2 py-1 rounded-lg spatial-soft">หน้าแรก</button>
                                    <button type="button" onClick={() => { setQuizSubmitted(false); setScreen('pretest'); }} className="px-2 py-1 rounded-lg spatial-soft">Pre-test</button>
                                    <button type="button" onClick={() => setScreen('dashboard')} className="px-2 py-1 rounded-lg spatial-soft">ห้องเรียน</button>
                                    <button type="button" onClick={() => setScreen('certificate')} className="px-2 py-1 rounded-lg spatial-soft">ประกาศฯ</button>
                                    <a href="./admin.html" className="px-2.5 py-1 rounded-lg bg-aurora-500 text-void-950">กลับ Admin</a>
                                    <button type="button" onClick={() => setPreviewBarOpen(false)} className="w-6 h-6 rounded-lg spatial-soft flex items-center justify-center">
                                        <Icon name="X" size={13} />
                                    </button>
                                </div>
                            ) : (
                                <button type="button" onClick={() => setPreviewBarOpen(true)} className="spatial-card px-3 py-1.5 rounded-full text-accent-adaptive text-[10px] font-mono font-bold flex items-center gap-1">
                                    <Icon name="Eye" size={12} /> ADMIN VIEW
                                </button>
                            )}
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
