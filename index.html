    /* ========================================================================
       2. Liquid Glass OTP Input (6 Digits + Spring Physics)
       ======================================================================== */
    function LiquidGlassOtpInput({ value, onChange, errorShake }) {
      const refs = useRef([]);
      const digits = Array.from({ length: 6 }, (_, i) => value[i] || "");

      const handleChange = (idx, raw) => {
        const clean = raw.replace(/\D/g, "");
        if (!clean) {
          const next = [...digits];
          next[idx] = "";
          onChange(next.join(""));
          return;
        }
        if (clean.length > 1) {
          const pasted = clean.slice(0, 6);
          onChange(pasted);
          refs.current[Math.min(pasted.length, 5)]?.focus();
          return;
        }
        const next = [...digits];
        next[idx] = clean;
        onChange(next.join(""));
        if (idx < 5) refs.current[idx + 1]?.focus();
      };

      const handleKeyDown = (idx, e) => {
        if (e.key === "Backspace" && !digits[idx] && idx > 0) {
          refs.current[idx - 1]?.focus();
        }
      };

      return (
        <div className={`liquid-otp-group ${errorShake ? "liquid-otp-shake" : ""}`}>
          {digits.map((d, idx) => (
            <input
              key={idx}
              ref={(el) => (refs.current[idx] = el)}
              type="text"
              inputMode="numeric"
              maxLength={6}
              value={d}
              onChange={(e) => handleChange(idx, e.target.value)}
              onKeyDown={(e) => handleKeyDown(idx, e)}
              className={`liquid-otp-cell ${d ? "is-filled" : ""}`}
              aria-label={`รหัส OTP หลักที่ ${idx + 1}`}
            />
          ))}
        </div>
      );
    }

    /* ========================================================================

       ======================================================================== */

        if (window.__RJCLOUD_KEYNOTE_READY__ && window.startKeynoteLaunch) {

        } else {

      // Step 1: License Lookup & System-Driven Auto-Classification (Read-only)
      const handleLookupLicense = async (e) => {

        const cleanLic = license.trim().toUpperCase();
        if (cleanLic.length < 4) {
          setAuthError("กรุณากรอกเลขใบอนุญาตประกอบวิชาชีพให้ถูกต้องค่ะ");
          return;
        }
        setAuthError("");
        setAuthLoading(true);
        try {
          // 1) Check onsite_registrations for CREDIT_TRANSFER
          const onsiteRef = collection(db, `${DATA_ROOT}/onsite_registrations`);
          const onsiteQ = query(onsiteRef, where("license", "==", cleanLic));
          const onsiteSnap = await getDocs(onsiteQ);
          let transferEvent = null;
          onsiteSnap.forEach((d) => {
            const data = d.data();
            const activeCourse = !data.targetCourseId || data.targetCourseId === DEFAULT_COURSE_ID;
            if (activeCourse && data.status !== "cancelled" && !data.cancelled) {
              transferEvent = data;
            }
          });

          // 2) Check elearning_users for CONTINUING
          const userDocRef = doc(db, `${DATA_ROOT}/elearning_users`, cleanLic);
          const userSnap = await getDoc(userDocRef);
          const existingUser = userSnap.exists() ? userSnap.data() : null;

          // System-Driven Priority: CREDIT_TRANSFER > CONTINUING > NEW_LEARNER
          let cls;
          if (transferEvent) {
            cls = {
              type: "CREDIT_TRANSFER",
              label: "เทียบโอนชั่วโมงเรียน (ยกเว้นชั่วโมงเรียน 100%)",
              eventName: transferEvent.eventName || transferEvent.eventId || "อบรม Onsite รพ.ราชวิถี",
              exemptHours: true
            };
          } else if (existingUser) {
            cls = {
              type: "CONTINUING",
              label: "ผู้เรียนต่อเนื่อง (พบประวัติในระบบกลาง)",
              eventName: "",
              exemptHours: false
            };
          } else {
            cls = {
              type: "NEW_LEARNER",
              label: "ผู้เรียนใหม่ (ลงทะเบียนเข้าสู่ระบบกลางครั้งแรก)",
              eventName: "",
              exemptHours: false
            };
          }

          setClassification(cls);
          if (existingUser) {
            setFullName(existingUser.fullName || "");
            setEmail(existingUser.email || "");
            setProfession(existingUser.profession || "nurse");
            setHospital(existingUser.hospital || "");
            if (existingUser.region) setRegion(existingUser.region);
          } else if (transferEvent) {
            setFullName(transferEvent.fullName || "");
            setEmail(transferEvent.email || "");
            setProfession(transferEvent.profession || "nurse");
            setHospital(transferEvent.hospital || "");
          }
          setAuthStep(2);
        } catch (err) {
          setAuthError(`ไม่สามารถเชื่อมต่อฐานข้อมูลกลางได้: ${err.message}`);
        } finally {
          setAuthLoading(false);
        }
      };

      // Step 2: Send Real OTP via Code.gs (Production Only)
      const handleSendOtp = async (e) => {
        e.preventDefault();
        if (!fullName.trim() || !email.trim().includes("@")) {
          setAuthError("กรุณากรอกชื่อ-นามสกุล และอีเมลสำหรับรับรหัส OTP ให้ครบถ้วนค่ะ");
          return;
        }
        setAuthError("");
        setAuthLoading(true);
        try {
          const res = await fetch(GAS_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: "follow",
            body: JSON.stringify({
              action: "sendOTP",
              email: email.trim(),
              license: license.trim().toUpperCase(),
              fullName: fullName.trim()
            })
          });
          const data = await res.json();
          if (!data.success && !data.ok && !data.otpHash && !data.otp) {
            throw new Error(data.error || "ส่งรหัส OTP ไม่สำเร็จ กรุณาตรวจสอบอีเมล");

          setOtpTokenHash(String(data.otp || data.otpHash || ""));
          setOtpInput("");
          setAuthStep(3);
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

          setOtpShake(true);
          setTimeout(() => setOtpShake(false), 450);
          setAuthError("กรุณากรอกรหัส OTP ให้ครบ 6 หลักค่ะ");
          return;
        }
        if (otpTokenHash && otpInput !== otpTokenHash) {
          setOtpShake(true);
          setTimeout(() => setOtpShake(false), 450);
          setAuthError("รหัส OTP ไม่ถูกต้อง กรุณาตรวจสอบในอีเมลอีกครั้งค่ะ");

        setAuthLoading(true);

            title: "ยืนยันตัวตนสำเร็จแล้วค่ะ 🌸",
            message: classification?.exemptHours
              ? `ระบบตรวจพบสิทธิ์เทียบโอนจากกิจกรรม "${classification.eventName}" (ยกเว้นชั่วโมงเรียน 100%) ขั้นตอนแรกขอเชิญทำแบบทดสอบก่อนเรียน (Pre-test) เพื่อประเมินพื้นฐานก่อนนะคะ`
              : "ขั้นตอนแรกของหลักสูตร ขอเชิญทำแบบทดสอบก่อนเรียน (Pre-test) สั้นๆ เพื่อวัดความรู้พื้นฐานก่อนเข้าสู่ห้องเรียนนะคะ",
            ctaLabel: "เริ่มทำ Pre-test",
            targetScreen: "pretest"
          });
        } catch (err) {
          setAuthError(`บันทึกข้อมูลผู้เรียนไม่สำเร็จ: ${err.message}`);
        } finally {
          setAuthLoading(false);
        }
      };

      // Submit Pre-test / Post-test
      const handleSubmitExam = (mode) => {
        let score = 0;
        EXAM_QUESTIONS.forEach((q) => {
          if (examAnswers[q.id] === q.ans) score += 1;
        });
        const pct = Math.round((score / EXAM_QUESTIONS.length) * 100);
        setExamAnswers({});
        if (mode === "pretest") {
          setPreScore(pct);
          const nextUser = { ...user, preScore: pct };
          setUser(nextUser);
          localStorage.setItem("rjcloud_session_user", JSON.stringify(nextUser));

          if (classification?.exemptHours) {
            setAiNav({
              title: `บันทึกผล Pre-test (${pct}%) เรียบร้อยค่ะ ✨`,
              message: "เนื่องจากคุณได้รับสิทธิ์เทียบโอนชั่วโมงเรียน 100% สามารถเข้าฝึกสถานการณ์จำลอง AI Skill Lab เพื่อเตรียมพร้อมทำ Post-test ได้เลยค่ะ",
              ctaLabel: "ไปฝึกที่ AI Skill Lab",
              externalUrl: "./aiskilllab.html?from=index"
            });
            setScreen("classroom");
          } else {
            setAiNav({
              title: `บันทึกผล Pre-test (${pct}%) เรียบร้อยค่ะ 📖`,
              message: "ก้าวถัดไปเรามาเรียนรู้เนื้อหาหลักในห้องเรียน (เอกสาร PDF + AI สรุป 1 นาที + เสียงสตูดิโอ 24kHz) ให้ครบทั้ง 3 บทกันนะคะ",
              ctaLabel: "เข้าสู่ห้องเรียน",
              targetScreen: "classroom"
            });
            setScreen("classroom");
          }
        } else {
          setPostScore(pct);
          if (pct >= 60) {
            setAiNav({
              title: `ยินดีด้วยค่ะ! ผ่านเกณฑ์ Post-test (${pct}%) 🎉`,
              message: "เหลือขั้นตอนสุดท้ายคือยืนยันชื่อ-นามสกุลบนใบประกาศนียบัตร และทำแบบประเมิน R2R สั้นๆ เพื่อรับใบประกาศฯ A4 ค่ะ",
              ctaLabel: "ยืนยันชื่อ & รับใบประกาศฯ",
              targetScreen: "r2r"
            });
            setScreen("r2r");
          } else {
            setAiNav({
              title: `คะแนน Post-test ${pct}% (เกณฑ์ผ่าน 60%)`,
              message: "ลองทบทวนสรุป 1 นาทีในห้องเรียนอีกนิด แล้วกลับมาทำ Post-test ใหม่ได้ตลอดเลยนะคะ เป็นกำลังใจให้ค่ะ 💛",
              ctaLabel: "กลับไปทบทวนบทเรียน",
              targetScreen: "classroom"
            });
          }
        }
      };

      // Mark Lesson Complete
      const handleCompleteLesson = (lessonId) => {
        const next = completedLessons.includes(lessonId) ? completedLessons : [...completedLessons, lessonId];
        setCompletedLessons(next);
        const nextUser = { ...user, completedLessons: next };
        setUser(nextUser);
        localStorage.setItem("rjcloud_session_user", JSON.stringify(nextUser));

        if (next.length >= DEFAULT_LESSONS.length) {
          setAiNav({
            title: "เรียนครบทุกบทเรียนแล้วค่ะ! 🌟",
            message: "ก่อนเข้าสู่ Post-test ขอเชิญฝึกสื่อสารสถานการณ์จริงกับครอบครัวผู้ป่วยในห้อง AI Skill Lab 3 มิติก่อนนะคะ",
            ctaLabel: "เปิดห้อง AI Skill Lab",
            externalUrl: "./aiskilllab.html?from=index"
          });
        } else if (activeLessonIdx < DEFAULT_LESSONS.length - 1) {
          setActiveLessonIdx(activeLessonIdx + 1);
        }
      };

      // Play 24kHz Studio Audio (Gemini TTS Only — No speechSynthesis)
      const handleToggleStudioAudio = async (text) => {
        if (audioPlaying && audioRef.current) {
          audioRef.current.pause();
          setAudioPlaying(false);
          return;
        }
        setAudioLoading(true);
        try {
          const blob = await Core.fetchStudioGuideBlob(text, GAS_URL, "Sulafat");
          const url = URL.createObjectURL(blob);
          if (audioRef.current) audioRef.current.pause();
          const audio = new Audio(url);
          audioRef.current = audio;
          audio.onended = () => setAudioPlaying(false);
          await audio.play();
          setAudioPlaying(true);
        } catch (err) {
          alert(`ไม่สามารถเล่นเสียงสตูดิโอ 24kHz ได้: ${err.message}`);
        } finally {
          setAudioLoading(false);
        }
      };

      // Ask Clinical AI (Code.gs callGemini)
      const handleAskAi = async (e) => {
        e.preventDefault();
        if (!aiQuestion.trim()) return;
        setAiBusy(true);
        setAiAnswer("");
        try {
          const lesson = DEFAULT_LESSONS[activeLessonIdx];
          const prompt = `${Core.CLINICAL_AI_SYSTEM_PREFIX || "คุณคืออาจารย์แพทย์และพยาบาลผู้เชี่ยวชาญด้านการรับบริจาคและปลูกถ่ายอวัยวะ รพ.ราชวิถี"}\nบริบทบทเรียน: ${lesson.title}\nคำถามจากบุคลากรทางการแพทย์: ${aiQuestion.trim()}\nตอบอย่างกระชับ ชัดเจน อ้างอิงหลักคลินิกและสื่อสารอย่างอบอุ่น`;
          const res = await fetch(GAS_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: "follow",
            body: JSON.stringify({ action: "callGemini", prompt })
          });
          const data = await res.json();
          setAiAnswer(data.text || data.reply || data.answer || "ได้รับคำตอบแล้วแต่ไม่พบข้อความ");
        } catch (err) {
          setAiAnswer(`เกิดข้อผิดพลาดในการเชื่อมต่อ AI: ${err.message}`);
        } finally {
          setAiBusy(false);
        }
      };

      // Issue Certificate (CNEU strictly for Nurse only)
      const handleIssueCertificate = async (e) => {
        e.preventDefault();
        const code = `RJ-${new Date().getFullYear()}-${(user?.license || "0000").slice(-4)}-${Math.floor(100 + Math.random() * 900)}`;
        setCertNo(code);
        try {
          await setDoc(doc(db, `${DATA_ROOT}/certificates`, code), {
            certNo: code,
            license: user.license,
            fullName: certName.trim() || user.fullName,
            profession: user.profession,
            courseId: DEFAULT_COURSE_ID,
            postScore,
            susScores,
            issuedAt: serverTimestamp()
          });
        } catch (_) {}
        setScreen("certificate");
      };

      const isNurse = user?.profession === "nurse";
      const activeLesson = DEFAULT_LESSONS[activeLessonIdx];
      const oneMinText = useMemo(
        () => (Core.buildDefaultOneMinSummary ? Core.buildDefaultOneMinSummary(activeLesson) : ""),
        [activeLesson]
      );
      const docUrl = useMemo(
        () => (Core.resolveLessonDocUrl ? Core.resolveLessonDocUrl(activeLesson) : ""),
        [activeLesson]
      );

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Bar */}
          <header className="no-print sticky top-0 z-30 px-4 sm:px-8 py-4 flex items-center justify-between backdrop-blur-md border-b border-white/10">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-300/30 to-amber-300/20 border border-rose-300/40 flex items-center justify-center">
                <Stethoscope className="w-5 h-5 text-rose-300" />
              </div>
              <div>
                <div className="font-bold tracking-tight text-sm sm:text-base">rjcloud.organ 2.0</div>
                <div className="text-xs text-slate-400">ศูนย์ความเป็นเลิศฯ การรับบริจาคและปลูกถ่ายอวัยวะ รพ.ราชวิถี</div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
                className="p-2.5 rounded-xl bento-card hover:border-rose-300/50 transition"
                aria-label="สลับโหมดมืดและสว่าง"
              >
                {theme === "dark" ? <Sun className="w-4 h-4 text-amber-300" /> : <Moon className="w-4 h-4 text-slate-700" />}
              </button>
              {user && (
                <button
                  onClick={() => {
                    localStorage.removeItem("rjcloud_session_user");
                    setUser(null);
                    setScreen("auth");
                    setAuthStep(1);
                  }}
                  className="px-3 py-2 rounded-xl bento-card text-xs flex items-center gap-1.5 hover:border-rose-400/50"
                >
                  <LogOut className="w-3.5 h-3.5" /> ออกจากระบบ
                </button>
              )}
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-8">
            {/* Watermark RAJAVITHI HOSPITAL */}
            {screen === "auth" && (
              <div className="text-center mb-6">
                <div className="water-text-rajavithi text-xl sm:text-3xl md:text-4xl">RAJAVITHI HOSPITAL</div>
                <p className="text-xs sm:text-sm text-slate-300/85 mt-1">
                  ระบบเรียนรู้และฝึกทักษะคลินิกเฉพาะบุคลากรทางการแพทย์ (Production Only)
                </p>
              </div>
            )}

            {/* SCREEN 1: AUTH 3-STEP (Production Only) */}
            {screen === "auth" && (
              <div className="max-w-lg mx-auto liquid-glass-chamber p-6 sm:p-8 auth-fade-ltr" key={authStep}>
                <div className="flex items-center justify-between mb-6">
                  <span className="text-xs font-mono-code px-3 py-1 rounded-full bg-white/10 border border-white/15">
                    STEP {authStep} / 3
                  </span>
                  <span className="text-xs text-emerald-400 flex items-center gap-1">
                    <ShieldCheck className="w-4 h-4" /> ยืนยันตัวตนด้วยใบอนุญาตฯ + OTP จริง
                  </span>
                </div>

                {authError && (
                  <div className="mb-4 p-3 rounded-xl bg-rose-500/15 border border-rose-400/40 text-rose-200 text-sm flex items-center gap-2">
                    <AlertCircle className="w-4 h-4 shrink-0" /> {authError}
                  </div>
                )}

                {authStep === 1 && (
                  <form onSubmit={handleLookupLicense} className="space-y-5">
                    <div>
                      <h1 className="text-xl font-bold mb-1">ตรวจสอบสิทธิ์บุคลากรทางการแพทย์</h1>
                      <p className="text-sm text-slate-400">
                        กรอกเลขใบอนุญาตประกอบวิชาชีพ ระบบจะจำแนกประเภทผู้เรียนและตรวจสอบสิทธิ์เทียบโอนให้อัตโนมัติค่ะ
                      </p>
                    </div>
                    <div>
                      <label className="block text-xs font-medium mb-1.5">เลขใบอนุญาตประกอบวิชาชีพ (License No.)</label>
                      <input
                        type="text"
                        required
                        value={license}
                        onChange={(e) => setLicense(e.target.value)}
                        placeholder="เช่น ว.12345 หรือ 6511001234"
                        className="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/15 focus:border-rose-300 outline-none font-mono-code"
                      />
                    </div>
                    <button type="submit" disabled={authLoading} className="w-full btn-peach-ambient">
                      {authLoading ? "กำลังตรวจสอบฐานข้อมูลกลาง..." : "ตรวจสอบสิทธิ์และดำเนินการต่อ"}
                      <ArrowRight className="w-4 h-4" />
                    </button>
                  </form>
                )}

                {authStep === 2 && (
                  <form onSubmit={handleSendOtp} className="space-y-4">
                    {/* System-Driven Auto-Classification Badge (Read-only) */}
                    {classification && (
                      <div
                        className={`p-3.5 rounded-2xl text-sm ${
                          classification.type === "CREDIT_TRANSFER"
                            ? "badge-credit-transfer"
                            : classification.type === "CONTINUING"
                            ? "badge-continuing"
                            : "badge-new-learner"
                        }`}
                      >
                        <div className="font-bold flex items-center gap-1.5">
                          <Lock className="w-3.5 h-3.5" /> สถานะผู้เรียน (ระบบกำหนดอัตโนมัติ): {classification.label}
                        </div>
                        {classification.eventName && (
                          <div className="text-xs mt-1 opacity-90">กิจกรรมเทียบโอน: {classification.eventName}</div>
                        )}
                      </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs mb-1">ชื่อ-นามสกุล (สำหรับใบประกาศฯ)</label>
                        <input
                          required
                          value={fullName}
                          onChange={(e) => setFullName(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/15 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs mb-1">กลุ่มวิชาชีพ</label>
                        <select
                          value={profession}
                          onChange={(e) => setProfession(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-white/15 outline-none text-white"
                        >
                          {(Core.PROFESSION_OPTIONS || []).map((p) => (
                            <option key={p.id} value={p.id}>{p.label}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs mb-1">อีเมลสำหรับรับรหัส OTP ยืนยันตัวตน</label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="name@hospital.go.th"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/15 outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs mb-1">หน่วยงาน / โรงพยาบาล</label>
                        <input
                          value={hospital}
                          onChange={(e) => setHospital(e.target.value)}
                          placeholder="รพ.ราชวิถี"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/15 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs mb-1">เขตสุขภาพ</label>
                        <select
                          value={region}
                          onChange={(e) => setRegion(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-white/15 outline-none text-white text-xs"
                        >
                          {(Core.HEALTH_REGIONS || []).map((r) => (
                            <option key={r} value={r}>{r}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button type="button" onClick={() => setAuthStep(1)} className="px-4 py-3 rounded-2xl bento-card text-sm">
                        ย้อนกลับ
                      </button>
                      <button type="submit" disabled={authLoading} className="flex-1 btn-peach-ambient">
                        {authLoading ? "กำลังส่งรหัส OTP..." : "ส่งรหัส OTP ไปยังอีเมล"}
                        <ArrowRight className="w-4 h-4" />
                      </button>
                    </div>
                  </form>
                )}

                {authStep === 3 && (
                  <form onSubmit={handleVerifyOtp} className="space-y-6 text-center">
                    <div>
                      <h2 className="text-lg font-bold">กรอกรหัส OTP 6 หลัก</h2>
                      <p className="text-xs text-slate-400 mt-1">ระบบได้ส่งรหัสยืนยันไปยัง {email} เรียบร้อยแล้วค่ะ</p>
                    </div>
                    <LiquidGlassOtpInput value={otpInput} onChange={setOtpInput} errorShake={otpShake} />
                    <button type="submit" disabled={authLoading} className="w-full btn-peach-ambient">
                      {authLoading ? "กำลังยืนยันตัวตน..." : "ยืนยันรหัส OTP และเข้าสู่ระบบ"}
                      <CheckCircle2 className="w-4 h-4" />
                    </button>
                    <button type="button" onClick={() => setAuthStep(2)} className="text-xs text-slate-400 hover:text-rose-300">
                      แก้ไขอีเมลหรือส่งรหัสใหม่อีกครั้ง
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* SCREEN 2 & 4: PRE-TEST / POST-TEST */}
            {(screen === "pretest" || screen === "posttest") && (
              <div className="max-w-3xl mx-auto bento-card p-6 sm:p-8 space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-xl font-bold">
                      {screen === "pretest" ? "แบบทดสอบก่อนเรียน (Pre-test)" : "แบบทดสอบหลังเรียน (Post-test)"}
                    </h2>
                    <p className="text-xs text-slate-400">
                      {screen === "pretest" ? "ประเมินความรู้พื้นฐานก่อนเริ่มเรียน (บังคับสำหรับผู้เรียนทุกกลุ่ม)" : "เกณฑ์ผ่าน 60% เพื่อรับใบประกาศนียบัตร"}
                    </p>
                  </div>
                  <span className="font-mono-code text-xs px-3 py-1 rounded-full bg-rose-400/15 text-rose-300">
                    {Object.keys(examAnswers).length} / {EXAM_QUESTIONS.length} ข้อ
                  </span>
                </div>

                {EXAM_QUESTIONS.map((item, idx) => (
                  <div key={item.id} className="p-4 rounded-2xl bg-white/5 border border-white/10 space-y-3">
                    <div className="font-semibold text-sm">{idx + 1}. {item.q}</div>
                    <div className="space-y-2">
                      {item.options.map((opt, oIdx) => (
                        <label
                          key={oIdx}
                          className={`flex items-start gap-2.5 p-3 rounded-xl border cursor-pointer text-sm transition ${
                            examAnswers[item.id] === oIdx
                              ? "border-rose-300 bg-rose-300/15"
                              : "border-white/10 hover:border-white/25"
                          }`}
                        >
                          <input
                            type="radio"
                            name={item.id}
                            checked={examAnswers[item.id] === oIdx}
                            onChange={() => setExamAnswers({ ...examAnswers, [item.id]: oIdx })}
                            className="mt-1 accent-rose-400"
                          />
                          <span>{opt}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                ))}

                <button
                  onClick={() => handleSubmitExam(screen)}
                  disabled={Object.keys(examAnswers).length < EXAM_QUESTIONS.length}
                  className="w-full btn-peach-ambient"
                >
                  ส่งคำตอบ {screen === "pretest" ? "Pre-test" : "Post-test"}
                  <ArrowRight className="w-4 h-4" />
                </button>
              </div>
            )}

            {/* SCREEN 3: CLASSROOM (PDF + AI 1-Min Summary + Ask AI + 24kHz Studio Audio) */}
            {screen === "classroom" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                {/* Left Sidebar: Lessons & Roadmap */}
                <aside className="lg:col-span-4 space-y-4">
                  <div className="bento-card p-5 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold text-rose-300">แผนการเรียนของคุณ</span>
                      <span className="text-xs font-mono-code">{completedLessons.length}/{DEFAULT_LESSONS.length} บท</span>
                    </div>
                    {DEFAULT_LESSONS.map((l, idx) => {
                      const done = completedLessons.includes(l.id);
                      return (
                        <button
                          key={l.id}
                          onClick={() => setActiveLessonIdx(idx)}
                          className={`w-full text-left p-3.5 rounded-2xl border transition flex items-center justify-between ${
                            activeLessonIdx === idx
                              ? "border-rose-300/70 bg-rose-300/10"
                              : "border-white/10 hover:border-white/25"
                          }`}
                        >
                          <div>
                            <div className="text-sm font-semibold">{l.title}</div>
                            <div className="text-xs text-slate-400">{l.durationMin} นาที</div>
                          </div>
                          {done ? <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" /> : <ChevronRight className="w-4 h-4 opacity-50" />}
                        </button>
                      );
                    })}

                    <div className="pt-2 space-y-2">
                      <a
                        href="./aiskilllab.html?from=index"
                        className="w-full btn-peach-ambient text-sm py-2.5"
                      >
                        <Sparkles className="w-4 h-4" /> เข้าห้องฝึก AI Skill Lab 3 มิติ
                      </a>
                      {(completedLessons.length >= DEFAULT_LESSONS.length || classification?.exemptHours) && (
                        <button
                          onClick={() => setScreen("posttest")}
                          className="w-full py-2.5 rounded-2xl bg-emerald-500/20 border border-emerald-400/50 text-emerald-300 text-sm font-semibold"
                        >
                          ไปทำแบบทดสอบหลังเรียน (Post-test)
                        </button>
                      )}
                    </div>
                  </div>

                  {/* ICU Pocket Phrases */}
                  <div className="bento-card p-5 space-y-2.5">
                    <div className="text-xs font-bold text-amber-300">วลีสื่อสารฉุกเฉินหน้างาน ICU</div>
                    {(Core.POCKET_PHRASES || []).map((p, i) => (
                      <div key={i} className="p-3 rounded-xl bg-white/5 border border-white/10 text-xs">
                        <div className="font-semibold text-rose-200 mb-1">{p.stage}</div>
                        <div className="text-slate-300 leading-relaxed">"{p.phrase}"</div>
                      </div>
                    ))}
                  </div>
                </aside>

                {/* Right Main: Lesson PDF + AI 1-Min Summary + Studio Audio + Ask AI */}
                <section className="lg:col-span-8 space-y-5">
                  <div className="bento-card p-6 space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <h2 className="text-lg font-bold flex items-center gap-2">
                        <BookOpen className="w-5 h-5 text-rose-300" /> {activeLesson.title}
                      </h2>
                      <button
                        onClick={() => handleToggleStudioAudio(oneMinText)}
                        disabled={audioLoading}
                        className="px-4 py-2 rounded-xl bg-rose-400/20 border border-rose-300/50 text-xs font-semibold flex items-center gap-2"
                      >
                        {audioPlaying ? <Square className="w-3.5 h-3.5" /> : <Volume2 className="w-3.5 h-3.5" />}
                        {audioLoading ? "กำลังสร้างเสียง 24kHz..." : audioPlaying ? "หยุดเสียงสตูดิโอ" : "ฟัง AI สรุป 1 นาที (24kHz)"}
                      </button>
                    </div>

                    {/* AI 1-Min Summary Box */}
                    <div className="p-4 rounded-2xl bg-white/5 border border-white/10 whitespace-pre-line text-sm leading-relaxed">
                      {oneMinText}
                    </div>

                    {/* PDF Document Frame */}
                    <div className="rounded-2xl overflow-hidden border border-white/10 bg-black/25">
                      {docUrl ? (
                        <iframe src={docUrl} title={activeLesson.title} className="w-full h-80" />
                      ) : (
                        <div className="p-6 text-center text-xs text-slate-400 flex flex-col items-center gap-2">
                          <FileText className="w-6 h-6 text-rose-300/70" />
                          <span>เอกสาร PDF ประกอบบทเรียน (พร้อมเชื่อมต่อ URL เอกสารจากระบบ Admin)</span>
                        </div>
                      )}
                    </div>

                    <button
                      onClick={() => handleCompleteLesson(activeLesson.id)}
                      className="w-full btn-peach-ambient"
                    >
                      <CheckCircle2 className="w-4 h-4" /> บันทึกว่าเรียนจบบทนี้แล้ว
                    </button>
                  </div>

                  {/* Ask Clinical AI */}
                  <div className="bento-card p-6 space-y-3">
                    <div className="text-sm font-bold flex items-center gap-2">
                      <MessageSquare className="w-4 h-4 text-sky-300" /> ถามอาจารย์ AI ประจำบทเรียน (Clinical Mode)
                    </div>
                    <form onSubmit={handleAskAi} className="flex gap-2">
                      <input
                        value={aiQuestion}
                        onChange={(e) => setAiQuestion(e.target.value)}
                        placeholder="ถามข้อสงสัยทางคลินิก เช่น เกณฑ์ Apnea Test หรือการให้ Vasopressor..."
                        className="flex-1 px-4 py-2.5 rounded-xl bg-white/5 border border-white/15 outline-none text-sm"
                      />
                      <button type="submit" disabled={aiBusy} className="px-4 py-2.5 rounded-xl bg-sky-400/20 border border-sky-300/40 text-sm font-semibold flex items-center gap-1.5">
                        {aiBusy ? <RefreshCw className="w-4 h-4 animate-spin" /> : <Send className="w-4 h-4" />} ถาม
                      </button>
                    </form>
                    {aiAnswer && (
                      <div className="p-4 rounded-2xl bg-sky-500/10 border border-sky-400/30 text-sm leading-relaxed whitespace-pre-line">
                        {aiAnswer}
                      </div>
                    )}
                  </div>
                </section>
              </div>
            )}

            {/* SCREEN 5: R2R SUS & CERTIFICATE NAME CONFIRMATION */}
            {screen === "r2r" && (
              <form onSubmit={handleIssueCertificate} className="max-w-3xl mx-auto bento-card p-6 sm:p-8 space-y-6">
                <div>
                  <h2 className="text-xl font-bold">ยืนยันชื่อบนใบประกาศนียบัตร & แบบประเมิน R2R</h2>
                  <p className="text-xs text-slate-400 mt-1">ตรวจสอบคำสะกดชื่อ-นามสกุลให้ถูกต้องก่อนออกใบประกาศนียบัตรนะคะ</p>
                </div>
                <div>
                  <label className="block text-xs mb-1.5">ชื่อ-นามสกุลที่จะแสดงบนใบประกาศนียบัตร</label>
                  <input
                    required
                    value={certName}
                    onChange={(e) => setCertName(e.target.value)}
                    className="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/15 outline-none font-semibold"
                  />
                </div>
                <div className="space-y-3">
                  <div className="text-sm font-semibold">แบบประเมินความพึงพอใจมาตรฐาน R2R (1 = น้อยที่สุด, 5 = มากที่สุด)</div>
                  {(Core.SUS_QUESTIONS || []).slice(0, 5).map((q, idx) => (
                    <div key={idx} className="p-3.5 rounded-xl bg-white/5 border border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <span className="text-xs">{q}</span>
                      <div className="flex gap-1.5">
                        {[1, 2, 3, 4, 5].map((n) => (
                          <button
                            type="button"
                            key={n}
                            onClick={() => setSusScores({ ...susScores, [idx]: n })}
                            className={`w-8 h-8 rounded-lg text-xs font-bold border ${
                              susScores[idx] === n ? "bg-rose-400 text-slate-950 border-rose-300" : "border-white/15"
                            }`}
                          >
                            {n}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
                <button type="submit" className="w-full btn-peach-ambient">
                  <Award className="w-4 h-4" /> ออกใบประกาศนียบัตร A4
                </button>
              </form>
            )}

            {/* SCREEN 6: CERTIFICATE A4 PRINT STUDIO */}
            {screen === "certificate" && (
              <div className="space-y-5">
                <div className="no-print flex flex-wrap items-center justify-between gap-3 max-w-5xl mx-auto">
                  <h2 className="text-lg font-bold">ใบประกาศนียบัตรอิเล็กทรอนิกส์ (A4 Landscape)</h2>
                  <button onClick={() => window.print()} className="btn-peach-ambient text-sm py-2.5">
                    <Printer className="w-4 h-4" /> พิมพ์ / บันทึกเป็น PDF (A4)
                  </button>
                </div>

                <div className="cert-a4-frame p-10 sm:p-14 flex flex-col justify-between border-8 border-double border-amber-500/60">
                  <div className="text-center space-y-2">
                    <div className="text-xs font-mono-code tracking-widest text-slate-500">RAJAVITHI HOSPITAL — CENTER OF EXCELLENCE</div>
                    <h1 className="text-2xl sm:text-4xl font-bold text-slate-900">ประกาศนียบัตร</h1>
                    <p className="text-sm text-slate-600">ศูนย์ความเป็นเลิศทางการแพทย์ด้านการรับบริจาคและปลูกถ่ายอวัยวะ โรงพยาบาลราชวิถี</p>
                  </div>

                  <div className="text-center space-y-3 my-4">
                    <div className="text-sm text-slate-500">ขอมอบประกาศนียบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า</div>
                    <div className="text-2xl sm:text-4xl font-bold text-rose-700">{certName || user?.fullName}</div>
                    <div className="text-sm text-slate-700">
                      เลขใบอนุญาตประกอบวิชาชีพ: <span className="font-mono-code font-bold">{user?.license}</span>
                    </div>
                    <p className="text-sm sm:text-base text-slate-800 max-w-2xl mx-auto">
                      ได้ผ่านการอบรมและประเมินสมรรถนะหลักสูตรการรับบริจาคและปลูกถ่ายอวัยวะ (rjcloud.organ 2.0)
                    </p>
                    {/* Strict Rule: CNEU ONLY for Nurses */}
                    <div className="inline-block px-4 py-1.5 rounded-full bg-amber-50 border border-amber-300 text-xs font-semibold text-amber-900">
                      {isNurse
                        ? "หน่วยคะแนนการศึกษาต่อเนื่องสาขาพยาบาลศาสตร์ (CNEU) • รหัสกิจกรรมมาตรฐานสภาการพยาบาล"
                        : "ชั่วโมงการฝึกอบรมมาตรฐานวิชาชีพทางการแพทย์ (Professional Training Hours)"}
                    </div>
                  </div>

                  <div className="flex items-end justify-between text-xs text-slate-500 pt-4 border-t border-slate-200">
                    <div>เลขที่ใบประกาศฯ: <span className="font-mono-code font-semibold text-slate-800">{certNo}</span></div>
                    <div className="text-right">
                      <div>ออกให้ ณ วันที่ {new Date().toLocaleDateString("th-TH", { dateStyle: "long" })}</div>
                      <div className="font-semibold text-slate-800">verify.html?cert={certNo}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* AI Navigator Popup */}
          {aiNav && (
            <div className="no-print fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="max-w-md w-full liquid-glass-chamber p-6 space-y-4 ai-nav-modal-enter">
                <div className="flex items-center gap-2 text-rose-300 font-bold">
                  <Sparkles className="w-5 h-5" /> {aiNav.title}
                </div>
                <p className="text-sm text-slate-200 leading-relaxed">{aiNav.message}</p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setAiNav(null)} className="px-4 py-2 rounded-xl bento-card text-xs">
                    ปิดไว้ก่อน
                  </button>
                  {aiNav.externalUrl ? (
                    <a href={aiNav.externalUrl} className="btn-peach-ambient text-xs py-2 px-4">
                      {aiNav.ctaLabel} <ArrowRight className="w-3.5 h-3.5" />
                    </a>
                  ) : (
                    <button
                      onClick={() => {
                        if (aiNav.targetScreen) setScreen(aiNav.targetScreen);
                        setAiNav(null);
                      }}
                      className="btn-peach-ambient text-xs py-2 px-4"
                    >
                      {aiNav.ctaLabel} <ArrowRight className="w-3.5 h-3.5" />
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
