        // ============================================================================
        // 6. MAIN LEARNER APPLICATION (PRODUCTION 2027)
        // ============================================================================
        function App() {
            const adminPreviewParam = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);
            const isAdminPreview = Boolean(adminPreviewParam);

            // 1. Adaptive Theme (synced across all files via rjcloud_theme)
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f8fafc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => {
                setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            // 2. Session, Screen & Navigation States
            const [user, setUser] = useState(() => {
                if (isAdminPreview) {
                    return {
                        id: 'ADMIN2027',
                        license: 'ADMIN2027',
                        name: 'ผู้ดูแลระบบ (Admin Preview)',
                        email: CONFIG.contactEmail,
                        phone: '0800000000',
                        position: 'พยาบาลวิชาชีพชำนาญการ',
                        workContext: 'ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)',
                        department: 'กรมการแพทย์',
                        hospital: 'รพ.ราชวิถี',
                        province: 'กรุงเทพมหานคร',
                        userType: 'เรียนต่อเนื่อง',
                        status: 'ผ่าน',
                        pretest: '30/40',
                        posttest: '36/40',
                        progress: 100,
                        studySeconds: 14400,
                        skillLabPassed: true,
                        skillLabBestScore: 92,
                        skillLabHistory: [{ score: 92, passed: true }],
                        certificateClaimed: true,
                        certificateCode: 'RJC-2027-ADMIN1',
                        certificateIssuedAt: new Date().toISOString()
                    };
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user && saved.user.id) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (adminPreviewParam) {
                    if (['auth1', 'auth2', 'auth3'].includes(adminPreviewParam)) return 'auth';
                    if (['live', 'leaderboard', 'profile'].includes(adminPreviewParam)) return 'dashboard';
                    if (['landing', 'pretest', 'dashboard', 'posttest', 'cert_confirm', 'certificate'].includes(adminPreviewParam)) {
                        return adminPreviewParam;
                    }
                    return 'dashboard';
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user && saved.user.id) {
                        if (!saved.user.pretest || saved.user.pretest === '-') return 'pretest';
                        return 'dashboard';
                    }
                } catch (_) {}
                return 'landing';
            });

            const [activeTab, setActiveTab] = useState(() => {
                if (['live', 'leaderboard', 'profile'].includes(adminPreviewParam)) return adminPreviewParam;
                return 'lessons';
            });

            // 3. Auth Wizard States (3 Steps)
            const [authStep, setAuthStep] = useState(() => {
                if (adminPreviewParam === 'auth2') return 2;
                if (adminPreviewParam === 'auth3') return 3;
                return 1;
            });
            const [authBusy, setAuthBusy] = useState(false);
            const [authForm, setAuthForm] = useState({
                license: '',
                name: '',
                email: '',
                phone: '',
                position: 'พยาบาลวิชาชีพ',
                workContext: 'หอผู้ป่วยวิกฤต (ICU / ER / OR)',
                department: 'กรมการแพทย์',
                hospital: 'รพ.ราชวิถี',
                province: 'กรุงเทพมหานคร',
                userType: 'เรียนใหม่'
            });
            const [otpInput, setOtpInput] = useState('');
            const [otpSent, setOtpSent] = useState(false);

            // 4. Cloud Content & Settings States
            const [lessons, setLessons] = useState(() => (
                Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0
                    ? window.INITIAL_LESSONS
                    : FALLBACK_LESSONS
            ));
            const [quizQuestions, setQuizQuestions] = useState(() => parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW));
            const [certTemplate, setCertTemplate] = useState(() => {
                try {
                    const saved = localStorage.getItem('rjcloud_cert_template_v2027');
                    if (saved) return { ...DEFAULT_CERT_TEMPLATE, ...JSON.parse(saved) };
                } catch (_) {}
                return { ...DEFAULT_CERT_TEMPLATE };
            });
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 8,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [leaderboardList, setLeaderboardList] = useState([]);
            const [isLiveCheckedIn, setIsLiveCheckedIn] = useState(false);

            // 5. Study Progress, Quiz & AI Diagnosis States
            const [currentLessonId, setCurrentLessonId] = useState(() => user?.lastVideoId || 1);
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);
            const [quizScoreSummary, setQuizScoreSummary] = useState(null);
            const [lastDiagnosis, setLastDiagnosis] = useState(() => user?.aiRoadmap || null);
            const [remediationAiText, setRemediationAiText] = useState('');
            const [isRemediationLoading, setIsRemediationLoading] = useState(false);

            // 6. AI Study Companion Panel States
            const [companionTab, setCompanionTab] = useState('cheat'); // cheat | check | cases | flashcards | ask
            const [microCheckPick, setMicroCheckPick] = useState({});
            const [missedDomains, setMissedDomains] = useState([]);
            const [aiChatInput, setAiChatInput] = useState('');
            const [aiChatHistory, setAiChatHistory] = useState([]);
            const [isAiChatLoading, setIsAiChatLoading] = useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = useState(false);

            // 7. CSAT & Certificate States
            const [certFormName, setCertFormName] = useState(user?.name || '');
            const [certFormHosp, setCertFormHosp] = useState(user?.hospital || '');
            const [csatRating, setCsatRating] = useState(5);
            const [csatComment, setCsatComment] = useState('');
            const [isClaimingCert, setIsClaimingCert] = useState(false);

            // 8. UI Feedback States
            const [heroImgSrc, setHeroImgSrc] = useState(CONFIG.heroBannerUrl);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            // Refs
            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);
            const certCanvasRef = useRef(null);
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            const askConfirm = useCallback(({ title, message, danger = false, confirmText = 'ยืนยัน', onConfirm }) => {
                setConfirmDialog({ open: true, title, message, danger, confirmText, onConfirm });
            }, []);

            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Computed Learning Metrics
            const targetStudySeconds = useMemo(() => {
                if (normalizeUserType(user?.userType) === 'เรียนต่อเนื่อง') {
                    return Math.max(1, Number(liveConfig.hours || 4)) * 1800; // 4 ชม.มาตรฐานสำหรับเรียนต่อเนื่อง
                }
                return Math.max(1, Number(liveConfig.hours || 8)) * 3600;     // 8 ชม.มาตรฐานสำหรับเรียนใหม่
            }, [user?.userType, liveConfig.hours]);

            const studyPercent = useMemo(() => {
                const calc = Math.min(100, Math.round((studySeconds / targetStudySeconds) * 100));
                return Math.max(Number(user?.progress || 0), calc);
            }, [studySeconds, targetStudySeconds, user?.progress]);

            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyRequirementMet = studyPercent >= MIN_STUDY_PERCENT;
            const hasPassedSkillLab = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const posttestInfo = useMemo(() => parseScoreRatio(user?.posttest), [user?.posttest]);
            const hasPassedPosttest = Boolean(user?.status === 'ผ่าน' || (posttestInfo.total > 0 && posttestInfo.percent >= MIN_POSTTEST_PERCENT));
            const canEnterSkillLab = hasDonePretest && isStudyRequirementMet;
            const canTakePosttest = (canEnterSkillLab && hasPassedSkillLab) || Boolean(liveConfig.allowPosttest);
            const canClaimCertificate = hasPassedPosttest;

            // Persist local state helper
            const persistUserState = useCallback(async (nextUser, syncCloud = true) => {
                setUser(nextUser);
                if (isAdminPreview) return;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: nextUser, updatedAt: Date.now() }));
                } catch (_) {}
                if (syncCloud && isCloudConfigured && fbDb && nextUser?.id) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            nextUser,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Firestore user sync warning:', err);
                    }
                }
            }, [isAdminPreview]);

            // ============================================================================
            // 7. FIREBASE AUTH & LIVE SUBSCRIPTIONS (ADMIN-PREVIEW SAFE)
            // ============================================================================
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let anonAttempted = false;
                let unsubSettings = null;
                let unsubContent = null;
                let unsubLeaderboard = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) return;
                        if (!anonAttempted) {
                            anonAttempted = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') {
                                    await fbAuth.authStateReady();
                                }
                                if (active && !fbAuth.currentUser) {
                                    await signInAnonymously(fbAuth);
                                }
                            } catch (err) {
                                console.warn('Anon auth warning:', err);
                            }
                        }
                        return;
                    }

                    // Sync current user doc if logged in
                    const cur = userRef.current;
                    if (!isAdminPreview && cur?.id) {
                        try {
                            const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(cur.id)));
                            if (snap.exists() && active) {
                                const cloudData = snap.data();
                                const merged = {
                                    ...cur,
                                    ...cloudData,
                                    studySeconds: Math.max(Number(cur.studySeconds || 0), Number(cloudData.studySeconds || 0)),
                                    progress: Math.max(Number(cur.progress || 0), Number(cloudData.progress || 0))
                                };
                                setUser(merged);
                                setStudySeconds(merged.studySeconds);
                                try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: merged })); } catch (_) {}
                            }
                        } catch (_) {}
                    }

                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.liveConfig) setLiveConfig(prev => ({ ...prev, ...d.liveConfig }));
                            if (d.certTemplate) {
                                setCertTemplate(prev => ({ ...prev, ...d.certTemplate }));
                                try { localStorage.setItem('rjcloud_cert_template_v2027', JSON.stringify(d.certTemplate)); } catch (_) {}
                            }
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        },
                        () => {}
                    );

                    if (unsubContent) unsubContent();
                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) {
                                const sets = normalizeQuestionSets(d.questionSets);
                                if (sets[0]?.length > 0) setQuizQuestions(sets[0]);
                            }
                        },
                        () => {}
                    );

                    if (unsubLeaderboard) unsubLeaderboard();
                    unsubLeaderboard = onSnapshot(
                        collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard'),
                        (snap) => {
                            const arr = [];
                            snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                            arr.sort((a, b) => Number(b.score || 0) - Number(a.score || 0));
                            setLeaderboardList(arr.slice(0, 20));
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                    if (unsubLeaderboard) unsubLeaderboard();
                };
            }, [isAdminPreview]);

            // Study Time Tracker (Page Visibility API — นับเฉพาะตอนเปิดหน้าจอบทเรียน/Live)
            useEffect(() => {
                if (isAdminPreview || !user || screen !== 'dashboard') return;
                if (activeTab !== 'lessons' && !(activeTab === 'live' && isLiveCheckedIn)) return;

                let tickCount = 0;
                const interval = setInterval(() => {
                    if (document.hidden) return;
                    setStudySeconds(prev => {
                        const nextSec = prev + 1;
                        tickCount += 1;
                        if (tickCount % 30 === 0 && userRef.current) {
                            const pct = Math.min(100, Math.round((nextSec / targetStudySeconds) * 100));
                            const updated = {
                                ...userRef.current,
                                studySeconds: nextSec,
                                progress: Math.max(Number(userRef.current.progress || 0), pct),
                                lastVideoId: currentLessonId
                            };
                            persistUserState(updated, true);
                        }
                        return nextSec;
                    });
                }, 1000);

                const flushProgress = () => {
                    if (!userRef.current) return;
                    const sec = studySecondsRef.current;
                    const pct = Math.min(100, Math.round((sec / targetStudySeconds) * 100));
                    const updated = {
                        ...userRef.current,
                        studySeconds: sec,
                        progress: Math.max(Number(userRef.current.progress || 0), pct),
                        lastVideoId: currentLessonId
                    };
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: updated })); } catch (_) {}
                };

                window.addEventListener('beforeunload', flushProgress);
                document.addEventListener('visibilitychange', flushProgress);

                return () => {
                    clearInterval(interval);
                    window.removeEventListener('beforeunload', flushProgress);
                    document.removeEventListener('visibilitychange', flushProgress);
                    flushProgress();
                };
            }, [isAdminPreview, user, screen, activeTab, isLiveCheckedIn, targetStudySeconds, currentLessonId, persistUserState]);

            // Apps Script API Proxy Helper
            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'offline' };
                try {
                    const res = await fetch(appsScriptUrl, { method: 'POST', body: JSON.stringify(payload) });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            }, [appsScriptUrl]);

            // ============================================================================
            // 8. AI STUDY COMPANION CHAT HANDLER & AUDIO BRIEF (ROLE-ADAPTIVE)
            // ============================================================================
            const activeLesson = useMemo(
                () => lessons.find(l => l.id === currentLessonId) || lessons[0],
                [lessons, currentLessonId]
            );
            const activeLessonGuide = useMemo(
                () => LESSON_AI_GUIDES[activeLesson?.id] || null,
                [activeLesson?.id]
            );
            const roleProfile = useMemo(() => resolveUserRoleProfile(user), [user]);
            const flashcardPriorityDomains = useMemo(() => {
                const weakIds = (lastDiagnosis?.weakDomains || []).map(d => d.id);
                return Array.from(new Set([...missedDomains, ...weakIds]));
            }, [missedDomains, lastDiagnosis]);

            const pickedMicroOption = microCheckPick[activeLesson?.id];

            const stopAudioBrief = useCallback(() => {
                if (audioRef.current) {
                    try { audioRef.current.pause(); } catch (_) {}
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsPlayingAudio(false);
            }, []);

            useEffect(() => () => stopAudioBrief(), [stopAudioBrief]);
            useEffect(() => { stopAudioBrief(); }, [currentLessonId, stopAudioBrief]);

            const handlePlayAudioBrief = useCallback(async () => {
                if (isPlayingAudio) {
                    stopAudioBrief();
                    return;
                }
                const pts = activeLessonGuide?.keyPoints || ['ทบทวนเป้าหมาย แนวปฏิบัติทางคลินิก และบทบาทการประสานงานในบทเรียนนี้'];
                const scriptText = `สรุปบทที่ ${activeLesson?.id} เรื่อง ${activeLesson?.title} สำหรับ${roleProfile.badgeTH}ค่ะ. ${pts.map((p, i) => `ประเด็นที่ ${i + 1} ${p}`).join('. ')}`;

                setIsPlayingAudio(true);

                // 1. พยายามสร้างเสียงคุณภาพสูงด้วย Gemini TTS ผ่าน Code.gs
                const ttsRes = await callAppsScript({
                    action: 'callGeminiTTS',
                    text: scriptText.replace(/[*#•]/g, ''),
                    voiceName: 'Aoede'
                });
                if (ttsRes?.status === 'success' && ttsRes.inlineData?.data) {
                    try {
                        const rate = parseInt(ttsRes.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                        const wavUrl = pcm16ToWavUrl(ttsRes.inlineData.data, rate);
                        audioUrlRef.current = wavUrl;
                        const audio = new Audio(wavUrl);
                        audioRef.current = audio;
                        audio.onended = () => stopAudioBrief();
                        audio.onerror = () => stopAudioBrief();
                        await audio.play();
                        return;
                    } catch (_) {
                        stopAudioBrief();
                    }
                }

                // 2. ระบบเสียงอ่านสำรองบนเบราว์เซอร์ (Web Speech API)
                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(scriptText);
                        utter.lang = 'th-TH';
                        utter.rate = 0.98;
                        utter.onend = () => setIsPlayingAudio(false);
                        utter.onerror = () => setIsPlayingAudio(false);
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }

                setIsPlayingAudio(false);
                showToast('เบราว์เซอร์นี้ไม่รองรับการเล่นเสียงสรุปอัตโนมัติค่ะ', 'error');
            }, [isPlayingAudio, stopAudioBrief, activeLessonGuide, activeLesson, roleProfile, callAppsScript, showToast]);

            const handleAskAiCompanion = async (e, presetQ = null) => {
                if (e) e.preventDefault();
                const qText = String(presetQ ?? aiChatInput).trim();
                if (!qText || isAiChatLoading) return;

                setAiChatInput('');
                setAiChatHistory(prev => [...prev, { id: `q-${Date.now()}`, role: 'user', text: qText }]);
                setIsAiChatLoading(true);

                const lessonContext = activeLessonGuide?.keyPoints?.length
                    ? `ประเด็นหลักของบทเรียน:\n- ${activeLessonGuide.keyPoints.join('\n- ')}`
                    : '';
                const knowledge = window.CLINICAL_KNOWLEDGE_BASE || '';

                const sysPrompt = `คุณคือ "AI Study Companion" ประจำแพลตฟอร์ม rjcloud.organ
ผู้เรียนกำลังศึกษาบทเรียนที่ ${activeLesson?.id}: "${activeLesson?.title}"
บทบาทของผู้เรียน: ${roleProfile.badgeTH} (${user?.position || '-'} / ${user?.workContext || '-'})
แนวทางปรับคำอธิบายตามตำแหน่งงาน: ${roleProfile.aiPromptAddon}
${lessonContext}

ฐานความรู้วิชาชีพกลาง:
${knowledge}

หลักการตอบ:
1. ตอบเป็นภาษาไทยที่ชัดเจน กระชับ อ่านง่ายบนมือถือ (ไม่เกิน 4-6 บรรทัด)
2. ปรับตัวอย่างและการอธิบายให้ตรงกับบริบทตำแหน่งงานของผู้เรียน
3. ยึดตามหลักการแพทย์และจริยธรรมการรับบริจาคอวัยวะของไทยอย่างแม่นยำ และห้ามเฉลยข้อสอบตรงๆ`;

                const aiRes = await callAppsScript({
                    action: 'callGemini',
                    prompt: qText,
                    systemInstruction: sysPrompt
                });

                const replyText = (aiRes?.status === 'success' && aiRes.text)
                    ? aiRes.text
                    : generateOfflineStudyAnswer(qText, activeLesson, roleProfile);

                setAiChatHistory(prev => [...prev, { id: `a-${Date.now()}`, role: 'ai', text: replyText }]);
                setIsAiChatLoading(false);
            };

            // ============================================================================
            // 9. AUTH WIZARD HANDLERS (PRODUCTION OTP FLOW)
            // ============================================================================
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (cleanLic.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพให้ถูกต้องค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                try {
                    let found = null;
                    if (isCloudConfigured && fbDb) {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) found = snap.data();
                    }
                    if (found) {
                        setAuthForm(prev => ({
                            ...prev,
                            license: cleanLic,
                            name: found.name || prev.name,
                            email: found.email || prev.email,
                            phone: found.phone || prev.phone,
                            position: found.position || prev.position,
                            workContext: found.workContext || prev.workContext,
                            department: found.department || prev.department,
                            hospital: found.hospital || prev.hospital,
                            province: found.province || prev.province,
                            userType: normalizeUserType(found.userType)
                        }));
                        showToast('พบข้อมูลของคุณในระบบแล้ว กรุณาตรวจสอบความถูกต้องค่ะ');
                    } else {
                        setAuthForm(prev => ({ ...prev, license: cleanLic }));
                        showToast('ไม่พบประวัติเดิม กรุณากรอกข้อมูลเพื่อลงทะเบียนใหม่ค่ะ', 'info');
                    }
                    setAuthStep(2);
                } catch (err) {
                    console.warn('License lookup error:', err);
                    setAuthForm(prev => ({ ...prev, license: cleanLic }));
                    setAuthStep(2);
                } finally {
                    setAuthBusy(false);
                }
            };

            const handleRequestOtp = async (e) => {
                e.preventDefault();
                if (!authForm.name.trim() || !authForm.email.trim()) {
                    showToast('กรุณากรอกชื่อ-สกุล และอีเมลสำหรับรับรหัส OTP ให้ครบค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                const res = await callAppsScript({
                    action: 'requestOTP',
                    email: authForm.email.trim(),
                    name: authForm.name.trim()
                });
                setAuthBusy(false);
                if (res?.status === 'success') {
                    setOtpSent(true);
                    setAuthStep(3);
                    showToast(`ส่งรหัส OTP 6 หลักไปที่ ${authForm.email} แล้วค่ะ`);
                } else {
                    showToast(res?.message || 'ไม่สามารถส่งรหัส OTP ได้ในขณะนี้ กรุณาตรวจสอบอีเมลและลองใหม่อีกครั้งค่ะ', 'error');
                }
            };

            const handleVerifyOtpAndLogin = async (e) => {
                e.preventDefault();
                const cleanOtp = otpInput.replace(/[^0-9]/g, '');
                if (cleanOtp.length !== 6) {
                    showToast('กรุณากรอกรหัส OTP 6 หลักให้ครบถ้วนค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                const res = await callAppsScript({
                    action: 'verifyOTP',
                    email: authForm.email.trim(),
                    otp: cleanOtp
                });
                if (res?.status !== 'success') {
                    setAuthBusy(false);
                    showToast(res?.message || 'รหัส OTP ไม่ถูกต้องหรือหมดอายุแล้วค่ะ', 'error');
                    return;
                }

                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                let existing = {};
                if (isCloudConfigured && fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) existing = snap.data();
                    } catch (_) {}
                }

                const loggedUser = {
                    ...existing,
                    id: cleanLic,
                    license: cleanLic,
                    name: authForm.name.trim(),
                    email: authForm.email.trim(),
                    phone: authForm.phone.trim(),
                    position: authForm.position.trim(),
                    workContext: authForm.workContext,
                    department: authForm.department,
                    hospital: authForm.hospital.trim(),
                    province: authForm.province.trim(),
                    userType: normalizeUserType(authForm.userType),
                    status: existing.status || 'กำลังเรียน',
                    pretest: existing.pretest || '-',
                    posttest: existing.posttest || '-',
                    progress: Number(existing.progress || 0),
                    studySeconds: Number(existing.studySeconds || 0),
                    lastVideoId: existing.lastVideoId || 1,
                    skillLabPassed: Boolean(existing.skillLabPassed),
                    skillLabHistory: Array.isArray(existing.skillLabHistory) ? existing.skillLabHistory : []
                };

                await persistUserState(loggedUser, true);
                setStudySeconds(loggedUser.studySeconds);
                setCurrentLessonId(loggedUser.lastVideoId || 1);
                if (loggedUser.aiRoadmap) setLastDiagnosis(loggedUser.aiRoadmap);
                callAppsScript({ action: 'upsertUser', user: loggedUser }).catch(() => {});

                setAuthBusy(false);
                showToast(`ยินดีต้อนรับคุณ ${loggedUser.name} เข้าสู่ rjcloud.organ ค่ะ`);
                if (!loggedUser.pretest || loggedUser.pretest === '-') {
                    setQuizAnswers({});
                    setQuizSubmitted(false);
                    setScreen('pretest');
                } else {
                    setScreen('dashboard');
                }
            };

            const handleLogout = () => {
                askConfirm({
                    title: 'ออกจากระบบผู้เรียน?',
                    message: 'ระบบจะบันทึกความคืบหน้าและเวลาเรียนสะสมของคุณไว้บน Cloud ให้เรียบร้อยค่ะ',
                    danger: true,
                    confirmText: 'ออกจากระบบ',
                    onConfirm: async () => {
                        stopAudioBrief();
                        if (user) {
                            const updated = {
                                ...user,
                                studySeconds,
                                progress: studyPercent,
                                lastVideoId: currentLessonId
                            };
                            await persistUserState(updated, true);
                        }
                        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                        setUser(null);
                        setScreen('landing');
                        showToast('ออกจากระบบเรียบร้อยแล้วค่ะ');
                    }
                });
            };

            // ============================================================================
            // 10. PRE-TEST & POST-TEST HANDLERS (WITH AI DIAGNOSTIC & REMEDIATION)
            // ============================================================================
            const handleSubmitQuiz = async (mode) => {
                const unanswered = quizQuestions.length - Object.keys(quizAnswers).length;
                if (unanswered > 0) {
                    showToast(`ยังทำข้อสอบไม่ครบ (เหลืออีก ${unanswered} ข้อ) ค่ะ`, 'error');
                    return;
                }

                let correct = 0;
                quizQuestions.forEach((q, idx) => {
                    if (quizAnswers[idx] === q.answer) correct += 1;
                });
                const total = quizQuestions.length || 1;
                const percent = Math.round((correct / total) * 100);
                const scoreStr = `${correct}/${total}`;
                const diagnosis = analyzeQuizByDomains(quizQuestions, quizAnswers);

                setLastDiagnosis(diagnosis);
                setQuizScoreSummary({ mode, correct, total, percent, scoreStr, passed: percent >= MIN_POSTTEST_PERCENT });
                setQuizSubmitted(true);
                setRemediationAiText('');

                if (user) {
                    if (mode === 'pretest') {
                        const updated = { ...user, pretest: scoreStr, aiRoadmap: diagnosis };
                        await persistUserState(updated, true);
                        showToast(`ส่ง Pre-test สำเร็จ (${scoreStr}) AI จัดแผนการเรียนเฉพาะคุณให้แล้วค่ะ`);
                    } else {
                        const isPassed = percent >= MIN_POSTTEST_PERCENT;
                        const updated = {
                            ...user,
                            posttest: scoreStr,
                            status: isPassed ? 'ผ่าน' : (user.status === 'ผ่าน' ? 'ผ่าน' : 'กำลังเรียน'),
                            aiRoadmap: diagnosis
                        };
                        await persistUserState(updated, true);
                        if (isPassed) {
                            showToast(`ยินดีด้วยค่ะ! สอบผ่าน Post-test (${percent}%) ปลดล็อกประกาศนียบัตรแล้ว 🎉`);
                        } else {
                            showToast(`คะแนน ${percent}% (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%) ให้ AI ช่วยติวซ่อมจุดพลาดก่อนสอบใหม่นะคะ`, 'info');
                            setIsRemediationLoading(true);
                            const weakNames = diagnosis.weakDomains.map(d => `${d.nameTH} (${d.percent}%)`).join(', ');
                            const res = await callAppsScript({
                                action: 'callGemini',
                                prompt: `ผู้เรียนสอบ Post-test ได้ ${percent}% ยังไม่ถึงเกณฑ์ 80% หมวดที่อ่อนได้แก่: ${weakNames} ช่วยอธิบายสรุปหลักการคลินิกที่ควรทบทวนใน 3-4 ข้อสั้นๆ แบบให้กำลังใจ โดยห้ามเฉลยข้อสอบตรงๆ`,
                                systemInstruction: `คุณคือ AI Remediation Coach ประจำ rjcloud.organ บทบาทผู้เรียน: ${roleProfile.badgeTH}`
                            });
                            if (res?.status === 'success' && res.text) setRemediationAiText(res.text);
                            setIsRemediationLoading(false);
                        }
                    }
                }
            };

            // ============================================================================
            // 11. CSAT & BUILT-IN APPLE MINIMALIST CERTIFICATE STUDIO HANDLERS
            // ============================================================================
            const handleConfirmCertificate = async (e) => {
                e.preventDefault();
                if (!certFormName.trim()) {
                    showToast('กรุณาระบุชื่อ-นามสกุลที่จะแสดงบนประกาศนียบัตรค่ะ', 'error');
                    return;
                }
                setIsClaimingCert(true);
                const code = user?.certificateCode || generateCertCode(certTemplate.certPrefix || 'RJC-2027');
                const issuedAt = user?.certificateIssuedAt || new Date().toISOString();

                const updatedUser = {
                    ...user,
                    name: certFormName.trim(),
                    hospital: certFormHosp.trim() || user?.hospital || '',
                    satisfactionScore: csatRating,
                    satisfactionComment: csatComment.trim(),
                    certificateClaimed: true,
                    certificateCode: code,
                    certificateIssuedAt: issuedAt,
                    status: 'ผ่าน'
                };

                await persistUserState(updatedUser, true);

                // บันทึกลงคอลเลกชัน certificates สำหรับหน้า verify.html ตรวจสอบ QR Code จริง
                const certRecord = {
                    code,
                    name: updatedUser.name,
                    license: updatedUser.license || updatedUser.id || '',
                    position: updatedUser.position || 'บุคลากรทางการแพทย์',
                    hospital: updatedUser.hospital || 'เครือข่าย rjcloud.organ',
                    department: updatedUser.department || '',
                    province: updatedUser.province || '',
                    userType: normalizeUserType(updatedUser.userType),
                    courseTitleTH: certTemplate.courseTitleTH,
                    orgTitleTH: certTemplate.orgTitleTH,
                    signerName: certTemplate.signerName,
                    signerPosition: certTemplate.signerPosition,
                    posttestScore: updatedUser.posttest || '≥ 80% PASS',
                    skillLabBestScore: updatedUser.skillLabBestScore ?? null,
                    issuedAt,
                    status: 'valid'
                };

                try {
                    const localMap = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                    localMap[code] = certRecord;
                    localStorage.setItem('rjcloud_local_certificates', JSON.stringify(localMap));
                } catch (_) {}

                if (!isAdminPreview && isCloudConfigured && fbDb) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), certRecord, { merge: true });
                    } catch (err) {
                        console.warn('Cert record save warning:', err);
                    }
                }

                setIsClaimingCert(false);
                setScreen('certificate');
                showToast('ออกประกาศนียบัตรอิเล็กทรอนิกส์พร้อม QR Code เรียบร้อยแล้วค่ะ 🎉');
            };

            // วาดใบประกาศนียบัตรลง Canvas เมื่อเข้าหน้า certificate
            useEffect(() => {
                if (screen === 'certificate' && certCanvasRef.current && user) {
                    renderAppleMinimalCertificate(
                        certCanvasRef.current,
                        {
                            code: user.certificateCode || generateCertCode(certTemplate.certPrefix),
                            name: user.name,
                            hospital: user.hospital,
                            license: user.license || user.id,
                            issuedAt: user.certificateIssuedAt || new Date().toISOString()
                        },
                        certTemplate
                    );
                }
            }, [screen, user, certTemplate]);

            const handleDownloadCertPng = () => {
                if (!certCanvasRef.current) return;
                const link = document.createElement('a');
                link.href = certCanvasRef.current.toDataURL('image/png', 1.0);
                link.download = `Certificate_${user?.certificateCode || 'rjcloud'}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('ดาวน์โหลดประกาศนียบัตรไฟล์ PNG เรียบร้อยแล้วค่ะ');
            };

            const handleDownloadCertPdf = () => {
                if (!certCanvasRef.current || !window.jspdf?.jsPDF) {
                    showToast('ไม่พบไลบรารีสร้าง PDF กรุณาดาวน์โหลดไฟล์ PNG แทนค่ะ', 'error');
                    return;
                }
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const imgData = certCanvasRef.current.toDataURL('image/png', 1.0);
                pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
                pdf.save(`Certificate_${user?.certificateCode || 'rjcloud'}.pdf`);
                showToast('ดาวน์โหลดประกาศนียบัตรไฟล์ PDF (A4) เรียบร้อยแล้วค่ะ');
            };

            // ============================================================================
            // 12. RENDER VIEWS
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* ==================== SCREEN 1: LANDING PAGE ==================== */}
                    {screen === 'landing' && (
                        <div className="relative z-10 flex-1 flex flex-col justify-between">
                            <header className="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-lg shadow-aurora-500/25 shrink-0">
                                        <Icon name="HeartPulse" size={20} />
                                    </div>
                                    <div className="min-w-0">
                                        <span className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive leading-none block truncate">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                            Clinical Organ Donation Platform
                                        </span>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                    <a href="./verify.html" className="spatial-soft px-3 py-2 rounded-xl text-primary-adaptive font-bold text-xs inline-flex items-center gap-1.5">
                                        <Icon name="QrCode" size={14} className="text-accent-adaptive" />
                                        <span className="hidden sm:inline">ตรวจประกาศฯ</span>
                                    </a>
                                    <a href="./executive.html" className="spatial-soft px-3 py-2 rounded-xl text-primary-adaptive font-bold text-xs inline-flex items-center gap-1.5">
                                        <Icon name="BarChart3" size={14} className="text-prism-adaptive" />
                                        <span className="hidden sm:inline">ผู้บริหาร</span>
                                    </a>
                                </div>
                            </header>

                            <main className="w-full max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10 text-center space-y-7">
                                {/* ภาพหน้าหลักผู้เรียนในกรอบการ์ดขาวขอบมนเรียบหรู */}
                                <div className="max-w-md mx-auto bg-white rounded-[2rem] p-5 sm:p-7 shadow-[0_22px_50px_-14px_rgba(15,23,42,0.18)] border border-white/90">
                                    <img
                                        src={heroImgSrc}
                                        onError={() => {
                                            if (heroImgSrc !== CONFIG.heroFallbackUrl) setHeroImgSrc(CONFIG.heroFallbackUrl);
                                        }}
                                        alt="Rajavithi Hospital COE Organ Transplantation Cloud"
                                        className="w-full h-auto max-h-60 object-contain mx-auto block"
                                    />
                                </div>

                                <div className="space-y-3.5 max-w-2xl mx-auto">
                                    <h1 className="font-display text-2xl sm:text-4xl md:text-[2.65rem] font-extrabold text-primary-adaptive leading-tight tracking-tight">
                                        ยกระดับทักษะการรับบริจาคและปลูกถ่ายอวัยวะ{' '}
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-aurora-400 via-prism-400 to-indigo-400">
                                            สู่มาตรฐานปี 2027
                                        </span>
                                    </h1>
                                    <p className="text-xs sm:text-sm md:text-base text-secondary-adaptive leading-relaxed max-w-xl mx-auto">
                                        ผสาน <b className="text-primary-adaptive">AI Study Companion</b> วิเคราะห์จุดอ่อนและช่วยทบทวนตลอด 20 บทเรียน, ฝึกสื่อสารกับญาติใน <b className="text-accent-adaptive">AI Skill Lab 3 มิติ</b> และออกประกาศนียบัตรพร้อม QR Code ทันทีเมื่อผ่านเกณฑ์
                                    </p>

                                    <div className="pt-2 flex justify-center">
                                        <button
                                            type="button"
                                            onClick={() => { setAuthStep(1); setScreen('auth'); }}
                                            className="touch-target px-8 py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-sm sm:text-base shadow-[0_14px_32px_-8px_rgba(16,185,129,0.45)] inline-flex items-center gap-2 transition-all active:scale-[0.98]"
                                        >
                                            <span>เข้าสู่ระบบ / ลงทะเบียนเรียน</span>
                                            <Icon name="ArrowRight" size={18} />
                                        </button>
                                    </div>
                                </div>

                                {/* 5-Step AI-Guided Pathway */}
                                <SpatialCard className="p-4 sm:p-6 space-y-4">
                                    <p className="font-mono text-[11px] font-bold text-prism-adaptive tracking-wider uppercase">
                                        5-STEP AI-GUIDED PATHWAY สู่ประกาศนียบัตรอิเล็กทรอนิกส์
                                    </p>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5 sm:gap-3 text-center">
                                        {[
                                            { step: 'STEP 01', icon: 'ClipboardCheck', title: 'Pre-test + AI Map', desc: 'วิเคราะห์จุดอ่อน 4 หมวดจัดแผนเรียนเฉพาะคุณ' },
                                            { step: 'STEP 02', icon: 'MonitorPlay', title: 'เรียน ≥ 80% + AI', desc: '20 บทพร้อม AI สรุป 1 นาที ฟังเสียง & เคสคลินิก' },
                                            { step: 'STEP 03', icon: 'Bot', title: 'AI Skill Lab 3D', desc: 'ฝึกสื่อสารกับญาติ 3 มิติ เลือก 4 เคส Normal/Hard' },
                                            { step: 'STEP 04', icon: 'FileCheck2', title: 'Post-test ≥ 80%', desc: 'สอบหลังเรียนพร้อม AI ช่วยทบทวนจุดพลาด' },
                                            { step: 'STEP 05', icon: 'Award', title: 'ประกาศนียบัตร', desc: 'รับ PDF / PNG พร้อม QR ยืนยันคุณวุฒิทันที' }
                                        ].map((item) => (
                                            <div key={item.step} className="spatial-soft p-3.5 rounded-2xl flex flex-col items-center gap-1.5">
                                                <div className="w-9 h-9 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center">
                                                    <Icon name={item.icon} size={18} />
                                                </div>
                                                <span className="font-mono text-[9px] font-bold text-prism-adaptive">{item.step}</span>
                                                <h3 className="font-display font-bold text-xs text-primary-adaptive leading-snug">{item.title}</h3>
                                                <p className="text-[10px] text-muted-adaptive leading-snug">{item.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </SpatialCard>
                            </main>

                            <footer className="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between text-[11px] text-muted-adaptive">
                                <a
                                    href="./admin.html"
                                    title="ระบบหลังบ้านผู้ดูแลระบบ (Admin)"
                                    className="w-9 h-9 rounded-xl spatial-soft text-muted-adaptive hover:text-accent-adaptive flex items-center justify-center transition-colors"
                                >
                                    <Icon name="Settings" size={16} />
                                </a>
                                <span className="font-mono">{CONFIG.appName} • {CONFIG.contactEmail}</span>
                            </footer>
                        </div>
                    )}

                    {/* ==================== SCREEN 2: AUTH WIZARD (3 STEPS + OTP) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4">
                            <SpatialCard className="w-full max-w-lg p-5 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between">
                                    <button
                                        type="button"
                                        onClick={() => (authStep > 1 ? setAuthStep(s => s - 1) : setScreen('landing'))}
                                        className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-secondary-adaptive inline-flex items-center gap-1"
                                    >
                                        <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-[11px] font-bold text-prism-adaptive">STEP {authStep} / 3</span>
                                </div>

                                <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                    <div className="h-full rounded-full bg-gradient-to-r from-aurora-400 to-prism-400 transition-all" style={{ width: `${(authStep / 3) * 100}%` }} />
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleCheckLicense} className="space-y-4">
                                        <div>
                                            <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนผู้เรียน</h2>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">ระบุเลขที่ใบประกอบวิชาชีพเพื่อตรวจสอบสิทธิ์และดึงข้อมูลเดิมของคุณค่ะ</p>
                                        </div>
                                        <FormField
                                            label="เลขที่ใบประกอบวิชาชีพ *"
                                            required
                                            value={authForm.license}
                                            onChange={e => setAuthForm(p => ({ ...p, license: e.target.value }))}
                                            placeholder="ระบุเฉพาะตัวเลขหรือตัวอักษร เช่น 65012345"
                                        />
                                        <button
                                            type="submit"
                                            disabled={authBusy}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {authBusy ? 'กำลังตรวจสอบข้อมูล...' : 'ตรวจสอบสิทธิ์และไปขั้นถัดไป →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={handleRequestOtp} className="space-y-3.5">
                                        <div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">ยืนยันข้อมูลผู้เรียน & แผนกปฏิบัติงาน</h2>
                                            <p className="text-xs text-secondary-adaptive mt-0.5">AI Study Companion จะปรับคำอธิบายให้ตรงกับตำแหน่งและลักษณะงานของคุณค่ะ</p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormField label="ชื่อ - นามสกุล *" required value={authForm.name} onChange={e => setAuthForm(p => ({ ...p, name: e.target.value }))} placeholder="พว. / นพ. ชื่อ นามสกุล" />
                                            <FormField label="อีเมล (สำหรับรับ OTP) *" type="email" required value={authForm.email} onChange={e => setAuthForm(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" />
                                            <FormField label="เบอร์โทรศัพท์" value={authForm.phone} onChange={e => setAuthForm(p => ({ ...p, phone: e.target.value }))} placeholder="08XXXXXXXX" />
                                            <FormField label="ตำแหน่งวิชาชีพ" value={authForm.position} onChange={e => setAuthForm(p => ({ ...p, position: e.target.value }))} placeholder="พยาบาลวิชาชีพ / แพทย์" />
                                            <FormSelect
                                                label="ลักษณะงานปัจจุบัน (สำหรับ Role-Adaptive AI)"
                                                value={authForm.workContext}
                                                onChange={e => setAuthForm(p => ({ ...p, workContext: e.target.value }))}
                                                options={[
                                                    'หอผู้ป่วยวิกฤต (ICU / ER / OR)',
                                                    'ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)',
                                                    'ผู้สนใจศึกษาทั่วไป'
                                                ]}
                                            />
                                            <FormSelect
                                                label="ประเภทสิทธิ์การเรียน"
                                                value={authForm.userType}
                                                onChange={e => setAuthForm(p => ({ ...p, userType: e.target.value }))}
                                                options={['เรียนใหม่', 'เรียนต่อเนื่อง']}
                                            />
                                            <FormSelect
                                                label="สังกัด / เขตสุขภาพ"
                                                value={authForm.department}
                                                onChange={e => {
                                                    const dep = e.target.value;
                                                    const firstHosp = HOSPITAL_MAPPING[dep]?.[0];
                                                    setAuthForm(p => ({
                                                        ...p,
                                                        department: dep,
                                                        hospital: firstHosp?.name || p.hospital,
                                                        province: firstHosp?.prov || p.province
                                                    }));
                                                }}
                                                options={Object.keys(HOSPITAL_MAPPING)}
                                            />
                                            <FormField label="โรงพยาบาล / หน่วยงาน *" required value={authForm.hospital} onChange={e => setAuthForm(p => ({ ...p, hospital: e.target.value }))} />
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={authBusy}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {authBusy ? 'กำลังส่งรหัส OTP ทางอีเมล...' : 'ขอรับรหัส OTP 6 หลักทางอีเมล →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtpAndLogin} className="space-y-4">
                                        <div className="text-center space-y-1.5">
                                            <div className="w-12 h-12 rounded-2xl bg-aurora-500/20 text-accent-adaptive flex items-center justify-center mx-auto">
                                                <Icon name="ShieldCheck" size={24} />
                                            </div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">ยืนยันตัวตนด้วยรหัส OTP</h2>
                                            <p className="text-xs text-secondary-adaptive">
                                                กรอกรหัส 6 หลักที่ส่งไปยัง <b className="text-primary-adaptive">{authForm.email || 'อีเมลของคุณ'}</b>
                                            </p>
                                        </div>

                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength={6}
                                            value={otpInput}
                                            onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))}
                                            placeholder="000000"
                                            className="touch-target spatial-input w-full py-4 rounded-2xl text-center font-mono text-2xl font-extrabold tracking-[0.5em]"
                                        />

                                        <button
                                            type="submit"
                                            disabled={authBusy || otpInput.length !== 6}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {authBusy ? 'กำลังยืนยันรหัส OTP...' : 'ยืนยันรหัสและเข้าเรียนทันที'}
                                        </button>

                                        <button
                                            type="button"
                                            onClick={handleRequestOtp}
                                            disabled={authBusy}
                                            className="w-full py-2 text-xs font-bold text-prism-adaptive hover:underline"
                                        >
                                            ไม่ได้รับอีเมล? กดขอรหัส OTP อีกครั้ง
                                        </button>
                                    </form>
                                )}
                            </SpatialCard>
                        </div>
                    )}

                    {/* ==================== SCREEN 3 & 5: PRE-TEST & POST-TEST ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && (
                        <div className="relative z-10 flex-1 w-full max-w-3xl mx-auto px-3.5 sm:px-6 py-5 sm:py-8 space-y-5">
                            <div className="flex items-center justify-between gap-2">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                        {screen === 'pretest' ? 'STEP 01 • PRE-TEST & AI DIAGNOSTIC ROADMAP' : `STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                                    </span>
                                    <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                        {screen === 'pretest' ? 'แบบทดสอบวัดความรู้ก่อนเรียน' : 'แบบทดสอบวัดความรู้หลังเรียน'}
                                    </h1>
                                </div>
                                {screen === 'posttest' && (
                                    <button
                                        type="button"
                                        onClick={() => { setQuizSubmitted(false); setScreen('dashboard'); }}
                                        className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive"
                                    >
                                        กลับห้องเรียน
                                    </button>
                                )}
                            </div>

                            {!quizSubmitted ? (
                                <div className="space-y-4">
                                    <div className="spatial-soft px-4 py-3 rounded-2xl flex items-center justify-between text-xs font-bold">
                                        <span className="text-secondary-adaptive">ตอบแล้ว {Object.keys(quizAnswers).length} / {quizQuestions.length} ข้อ</span>
                                        <span className="font-mono text-accent-adaptive">
                                            {Math.round((Object.keys(quizAnswers).length / Math.max(1, quizQuestions.length)) * 100)}%
                                        </span>
                                    </div>

                                    {quizQuestions.map((q, qIdx) => (
                                        <SpatialCard key={q.id || qIdx} className="p-4 sm:p-5 space-y-3">
                                            <div className="flex items-start gap-2.5">
                                                <span className="px-2.5 py-1 rounded-lg bg-prism-500/15 text-prism-adaptive font-mono text-xs font-bold shrink-0">
                                                    {qIdx + 1}
                                                </span>
                                                <p className="font-display font-bold text-sm sm:text-base text-primary-adaptive leading-relaxed">
                                                    {q.question}
                                                </p>
                                            </div>
                                            <div className="grid grid-cols-1 gap-2">
                                                {q.options.map((opt, oIdx) => {
                                                    const selected = quizAnswers[qIdx] === oIdx;
                                                    return (
                                                        <button
                                                            key={oIdx}
                                                            type="button"
                                                            onClick={() => setQuizAnswers(p => ({ ...p, [qIdx]: oIdx }))}
                                                            className={`touch-target text-left px-4 py-3 rounded-2xl border text-xs sm:text-sm font-semibold transition-all flex items-center gap-3 ${
                                                                selected
                                                                    ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive'
                                                                    : 'spatial-soft text-secondary-adaptive hover:border-prism-400/50'
                                                            }`}
                                                        >
                                                            <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${
                                                                selected ? 'border-aurora-400 bg-aurora-400 text-void-950' : 'border-slate-400/60'
                                                            }`}>
                                                                {selected && <Icon name="Check" size={12} strokeWidth={3} />}
                                                            </span>
                                                            <span>{opt}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </SpatialCard>
                                    ))}

                                    <button
                                        type="button"
                                        onClick={() => handleSubmitQuiz(screen)}
                                        className="touch-target w-full py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-base shadow-xl"
                                    >
                                        ส่งคำตอบและให้ AI วิเคราะห์ผลทันที
                                    </button>
                                </div>
                            ) : (
                                <SpatialCard className="p-5 sm:p-7 space-y-5">
                                    <div className="text-center space-y-2">
                                        <span className={`inline-block px-3 py-1 rounded-full font-mono text-xs font-bold ${
                                            screen === 'pretest' || quizScoreSummary?.passed
                                                ? 'bg-aurora-500/20 text-accent-adaptive'
                                                : 'bg-amber-500/20 text-amber-400'
                                        }`}>
                                            {screen === 'pretest'
                                                ? 'AI DIAGNOSTIC ROADMAP READY'
                                                : (quizScoreSummary?.passed ? 'PASSED ≥ 80% • CERTIFICATE UNLOCKED' : 'NEEDS REVIEW (< 80%)')}
                                        </span>
                                        <h2 className="font-mono text-4xl font-extrabold text-primary-adaptive">
                                            {quizScoreSummary?.scoreStr} <span className="text-xl text-accent-adaptive">({quizScoreSummary?.percent}%)</span>
                                        </h2>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive max-w-lg mx-auto">
                                            {lastDiagnosis?.summaryText}
                                        </p>
                                    </div>

                                    {/* 4-Domain Diagnostic Breakdown */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {(lastDiagnosis?.domains || []).map(d => (
                                            <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1.5">
                                                <div className="flex justify-between text-xs font-bold">
                                                    <span className="text-primary-adaptive">{d.shortName}</span>
                                                    <span className="font-mono" style={{ color: d.color }}>{d.percent}%</span>
                                                </div>
                                                <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                                    <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                                </div>
                                                <p className="text-[11px] text-muted-adaptive leading-relaxed">{d.remediationGuide}</p>
                                            </div>
                                        ))}
                                    </div>

                                    {screen === 'posttest' && !quizScoreSummary?.passed && (
                                        <div className="p-4 rounded-2xl bg-amber-500/15 border border-amber-400/35 text-xs sm:text-sm space-y-2">
                                            <p className="font-bold text-amber-400 flex items-center gap-1.5">
                                                <Icon name="Sparkles" size={15} /> AI Remediation Coach (สรุปทบทวนจุดพลาดโดยไม่เฉลยข้อสอบ)
                                            </p>
                                            <p className="text-primary-adaptive whitespace-pre-line leading-relaxed">
                                                {isRemediationLoading
                                                    ? 'AI กำลังวิเคราะห์หลักการคลินิกจุดที่ควรทบทวนเพิ่มเติม...'
                                                    : (remediationAiText || lastDiagnosis?.weakDomains?.map(d => `• ${d.nameTH}: ${d.remediationGuide}`).join('\n'))}
                                            </p>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                        {screen === 'posttest' && quizScoreSummary?.passed ? (
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setCertFormName(user?.name || '');
                                                    setCertFormHosp(user?.hospital || '');
                                                    setScreen('cert_confirm');
                                                }}
                                                className="touch-target sm:col-span-2 py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                            >
                                                <Icon name="Award" size={18} /> ไปยืนยันชื่อและรับประกาศนียบัตรทันที
                                            </button>
                                        ) : (
                                            <>
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        const recId = lastDiagnosis?.recommendedLessonIds?.[0];
                                                        if (recId) setCurrentLessonId(recId);
                                                        setQuizSubmitted(false);
                                                        setActiveTab('lessons');
                                                        setScreen('dashboard');
                                                    }}
                                                    className="touch-target py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm"
                                                >
                                                    เข้าสู่ห้องเรียนตามแผน AI →
                                                </button>
                                                {screen === 'posttest' && (
                                                    <button
                                                        type="button"

                                                                companionTab === t.id

                                                            <span>{t.label}</span>

                                                {/* Sub-Tab A: 1-Minute Clinical Cheat Sheet */}

                                                                <span>{pt}</span>

                                                                onClick={() => setCompanionTab('cases')}

                                                                            <button
                                                                                key={idx}

                                                                                {opt}

                                                                        pickedMicroOption === activeLessonGuide.microCheck.answer
                                                                            ? 'bg-aurora-500/15 border-aurora-400/40 text-primary-adaptive'
                                                                            : 'bg-amber-500/15 border-amber-400/40 text-primary-adaptive'
                                                                    }`}>

                                                                    </div>

                                                                </p>
                                                            )}
                                                            {aiChatHistory.map(m => (
                                                                <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                                    <div className={`max-w-[90%] p-3 rounded-2xl text-xs sm:text-sm leading-relaxed whitespace-pre-line ${
                                                                        m.role === 'user'

                                                                        {m.text}

                                                                </div>
