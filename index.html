                                                </g>

                                                {/* ปุ่มโหนดดิจิทัล Cloud AI */}
                                                <g stroke="#9ce8e6" strokeWidth="2.2" fill="rgba(56,189,248,0.26)">
                                                    <circle className="cloud-node-pulse" style={{ animationDelay: '0s' }} cx="298" cy="148" r="6" />
                                                    <circle className="cloud-node-pulse" style={{ animationDelay: '0.8s' }} cx="338" cy="166" r="5" />
                                                    <circle className="cloud-node-pulse" style={{ animationDelay: '1.5s' }} cx="352" cy="114" r="5.5" />
                                                    <circle className="cloud-node-pulse" style={{ animationDelay: '0.4s' }} cx="242" cy="128" r="5" />
                                                    <circle className="cloud-node-pulse" style={{ animationDelay: '1.9s' }} cx="204" cy="166" r="5.5" />

                                                {/* ชั้นปล่อยวงคลื่นและละอองออร่าลอยขึ้นจากใบไม้ที่ขยับ */}

                                    {/* LAYER 2 (DESKTOP): SLIM SCULPTED LIQUID GLASS CHAMBER (วางอยู่ระหว่างรากต้นไม้ + ชิดปุ่มด้านล่าง) */}
                                    <div

                                            <path
                                                d="M 28 4 L 538 4 Q 562 4 562 28 L 562 56 Q 562 80 586 80 L 732 80 Q 756 80 756 104 L 756 180 Q 756 204 732 204 L 210 204 Q 186 204 186 180 L 186 138 Q 186 114 162 114 L 28 114 Q 4 114 4 90 L 4 28 Q 4 4 28 4 Z"

                                            <div

                    {/* SECTION 2: 5-STEP AI-GUIDED PATHWAY & FOOTER */}

                                    { step: 'STEP 01', icon: 'ClipboardCheck', title: 'Pre-test + AI Map', desc: 'วิเคราะห์จุดอ่อน 4 หมวด และจัดแผนรายบุคคล' },
                                    { step: 'STEP 02', icon: 'BookOpen', title: `เรียน ≥ ${MIN_STUDY_PERCENT}% + AI`, desc: '20 บทเรียน AI สรุปเสียง 1 นาที & ถาม-ตอบสด' },
                                    { step: 'STEP 03', icon: 'Bot', title: 'AI Skill Lab 3D', desc: 'ฝึกสื่อสารกับญาติ 3 มิติ จับความเงียบ 2.5 วิ' },
                                    { step: 'STEP 04', icon: 'FileCheck2', title: `Post-test ≥ ${MIN_POSTTEST_PERCENT}%`, desc: 'แบบทดสอบทีละข้ออัตโนมัติพร้อมย้อนตรวจได้' },
                                    { step: 'STEP 05', icon: 'Award', title: 'ประกาศฯ & CNEU', desc: 'รับ PDF / PNG และใบรับรองพร้อม QR ยืนยัน' }

                                <span className="opacity-40">•</span>

                                <span className="opacity-40">•</span>

                            </footer>

                </div>
            );
        }

        // ============================================================================
        // 4. MAIN LEARNER APPLICATION (INDEX.HTML — RJCLOUD.ORGAN 2.0 PRODUCTION 2027)
        // ============================================================================
        const DEFAULT_AUTH_FORM = {
            license: '', name: '', position: 'พยาบาลวิชาชีพ', workContext: 'ICU / ER / OR',
            department: 'กรมการแพทย์', hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร',
            email: '', phone: '', userType: 'เรียนใหม่', pdpaAccepted: false
        };

        function App() {
            const adminPreviewParam = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);
            const isAdminPreview = Boolean(adminPreviewParam);

            // Adaptive Theme
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020612' : '#edf6fd');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // App State
            const [user, setUser] = useState(() => {
                if (isAdminPreview) {
                    return {
                        id: 'admin_preview_2027', license: '6501234567', name: 'พว.กัญญารัตน์ วัฒนากูล (Preview)',
                        nameEN: 'Kanyarat Wattanakul, RN', position: 'พยาบาลวิชาชีพชำนาญการ',
                        workContext: 'ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)', department: 'กรมการแพทย์',
                        hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร', email: 'preview@rajavithi.go.th',
                        phone: '0812345678', userType: 'เรียนใหม่', status: 'ผ่าน', progress: 92,
                        studySeconds: 26500, pretest: '30/40', posttest: '38/40', skillLabPassed: true,
                        skillLabBestScore: 94, certificateCode: 'RJC-2027-DEMO01',
                        certificateIssuedAt: '2027-01-12T09:30:00Z', pdpaAccepted: true, lastVideoId: 1
                    };
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (adminPreviewParam === 'landing') return 'landing';
                if (['auth1', 'auth2', 'auth3'].includes(adminPreviewParam)) return 'auth';
                if (adminPreviewParam === 'pretest') return 'pretest';
                if (adminPreviewParam === 'posttest') return 'posttest';
                if (adminPreviewParam === 'cert_confirm') return 'cert_confirm';
                if (adminPreviewParam === 'certificate') return 'certificate';
                if (['dashboard', 'live', 'profile'].includes(adminPreviewParam)) return 'dashboard';
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return 'dashboard';
                } catch (_) {}
                return 'landing';
            });

            const [activeTab, setActiveTab] = useState(() => {
                if (adminPreviewParam === 'live') return 'live';
                if (adminPreviewParam === 'profile') return 'profile';
                return 'lessons';
            });

            // Cloud Config & Content
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : FALLBACK_LESSONS));
            const [questionSets, setQuestionSets] = useState(() => [parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW)]);
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', days: 1, hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027', url: '', documentUrl: '' });
            const [certTemplate, setCertTemplate] = useState({ ...DEFAULT_CERT_TEMPLATE });
            const [cneuConfig, setCneuConfig] = useState({ ...DEFAULT_CNEU_CONFIG });
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [isCloudReady, setIsCloudReady] = useState(false);

            // Lesson & Timer States
            const [currentLessonId, setCurrentLessonId] = useState(() => Number(user?.lastVideoId || 1));
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));

            // Auth Wizard 3-Step States
            const [authStep, setAuthStep] = useState(() => (adminPreviewParam === 'auth2' ? 2 : adminPreviewParam === 'auth3' ? 3 : 1));
            const [authBusy, setAuthBusy] = useState(false);
            const [isExistingAccount, setIsExistingAccount] = useState(false);
            const [existingRegisteredEmail, setExistingRegisteredEmail] = useState('');
            const [pdpaAgreed, setPdpaAgreed] = useState(false);
            const [pdpaModalOpen, setPdpaModalOpen] = useState(false);
            const [authForm, setAuthForm] = useState(() => ({ ...DEFAULT_AUTH_FORM }));
            const [generatedOtp, setGeneratedOtp] = useState('');
            const [otpInput, setOtpInput] = useState('');
            const [otpCooldown, setOtpCooldown] = useState(0);

            // Certificate & Evaluation States
            const [certSubView, setCertSubView] = useState('cert'); // cert | cneu
            const [certForm, setCertForm] = useState({ name: '', nameEN: '', hospital: '', comment: '' });
            const [evalCriteria, setEvalCriteria] = useState({ content: 5, speaker: 5, platform: 5, aiLab: 5, application: 5 });

            // Profile PDPA Self-Service & Warm-up States
            const [pdpaEditOpen, setPdpaEditOpen] = useState(false);
            const [pdpaDangerOpen, setPdpaDangerOpen] = useState(false);
            const [pdpaForm, setPdpaForm] = useState({ name: '', position: '', department: '', hospital: '', province: '', email: '', phone: '' });
            const [warmupTags, setWarmupTags] = useState({ age: 'วัยทำงาน (20–45 ปี)', cause: 'อุบัติเหตุทางศีรษะ (TBI)', mood: 'สับสนเรื่องเครื่องช่วยหายใจ', concern: 'กลัวร่างไม่เรียบร้อย' });
            const [warmupResult, setWarmupResult] = useState('');

            // UI Feedback
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);
            const currentLessonIdRef = useRef(currentLessonId);
            const certCanvasRef = useRef(null);
            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);
            useEffect(() => { currentLessonIdRef.current = currentLessonId; }, [currentLessonId]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // OTP Resend Cooldown
            useEffect(() => {
                if (otpCooldown <= 0) return;
                const t = setTimeout(() => setOtpCooldown(c => c - 1), 1000);
                return () => clearTimeout(t);
            }, [otpCooldown]);

            // Save User Progress (รองรับ partialOnly เพื่อไม่ทับข้อมูลที่แอดมินแก้บน Cloud)
            const saveUserProgress = useCallback(async (patch, options = {}) => {
                const cur = userRef.current;
                if (!cur) return null;
                const merged = { ...cur, ...patch };
                userRef.current = merged;
                setUser(merged);

                if (isAdminPreview || String(merged.id || '').startsWith('admin_preview_')) return merged;

                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                } catch (_) {}

                if (fbDb && merged.id) {
                    try {
                        const payloadToCloud = options.partialOnly ? patch : merged;
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(merged.id)), payloadToCloud, { merge: true });
                        if (options.syncTelemetry) {
                            const anonId = buildAnonTelemetryId(merged.id);
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId),
                                buildExecutiveTelemetryPayload(merged),
                                { merge: true }
                            );
                        }
                    } catch (err) {
                        console.warn('Firestore save warning:', err);
                    }
                }
                return merged;
            }, [isAdminPreview]);

            // Firebase Auth + Settings + Content Subscriptions
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let anonTried = false;
                let unsubSettings = null;
                let unsubContent = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) return;
                        if (!anonTried) {
                            anonTried = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') await fbAuth.authStateReady();
                                if (active && !fbAuth.currentUser) await signInAnonymously(fbAuth);
                            } catch (err) {
                                console.warn('Anonymous auth warning:', err);
                            }
                        }
                        return;
                    }
                    setIsCloudReady(true);

                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                            if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        },
                        () => {}
                    );

                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                };
            }, [isAdminPreview]);

            // ซิงค์ข้อมูลผู้เรียนสดจาก Cloud Firestore (ไม่ทับข้อมูลที่แอดมินปรับแก้)
            useEffect(() => {
                if (!isCloudReady || !fbDb || isAdminPreview || !user?.id || String(user.id).startsWith('admin_preview_')) return;
                const unsubUser = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id)),
                    (snap) => {
                        if (!snap.exists()) return;
                        const cloud = snap.data();
                        const cur = userRef.current || {};
                        const bestSeconds = Math.max(Number(cur.studySeconds || 0), Number(cloud.studySeconds || 0));
                        const bestProgress = Math.max(Number(cur.progress || 0), Number(cloud.progress || 0));
                        const merged = { ...cur, ...cloud, id: String(user.id), studySeconds: bestSeconds, progress: bestProgress };
                        userRef.current = merged;
                        setUser(merged);
                        if (bestSeconds > Number(studySecondsRef.current || 0)) {
                            studySecondsRef.current = bestSeconds;
                            setStudySeconds(bestSeconds);
                        }
                        try {
                            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                            localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                        } catch (_) {}
                    },
                    () => {}
                );
                return () => unsubUser();
            }, [isCloudReady, isAdminPreview, user?.id]);

            // คำนวณเกณฑ์ความคืบหน้า 5 ขั้นตอนแบบ Real-time
            const targetHours = useMemo(() => getTargetHoursForUser(user, liveConfig), [user, liveConfig]);
            const targetSeconds = Math.max(60, targetHours * 3600);
            const liveStudyPercent = useMemo(
                () => Math.max(Number(user?.progress || 0), Math.min(100, Math.round((Number(studySeconds || 0) / targetSeconds) * 100))),
                [user?.progress, studySeconds, targetSeconds]
            );
            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyHoursMet = liveStudyPercent >= MIN_STUDY_PERCENT;
            const isSkillLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const isPosttestUnlocked = Boolean(isAdminPreview || liveConfig.allowPosttest || (hasDonePretest && isStudyHoursMet && isSkillLabDone));
            const isPosttestPassed = Boolean(user?.status === 'ผ่าน' || parsePosttestPercent(user) >= MIN_POSTTEST_PERCENT);

            // นาฬิกาจับเวลาเรียนอัตโนมัติ (แยก Side-Effect ออกจาก setState updater เพื่อความถูกต้องตาม React 18)
            useEffect(() => {
                if (screen !== 'dashboard' || !user || isAdminPreview) return;
                if (!['lessons', 'live', 'clinical_cases', 'flashcards'].includes(activeTab)) return;

                let tickCount = 0;
                const timer = setInterval(() => {
                    const nextSec = Number(studySecondsRef.current || 0) + 1;
                    studySecondsRef.current = nextSec;
                    setStudySeconds(nextSec);
                    tickCount += 1;
                    if (tickCount % 20 === 0) {
                        const nextPct = Math.max(
                            Number(userRef.current?.progress || 0),
                            Math.min(100, Math.round((nextSec / Math.max(1, targetSeconds)) * 100))
                        );
                        saveUserProgress(
                            { studySeconds: nextSec, progress: nextPct, lastVideoId: Number(currentLessonIdRef.current || 1) },
                            { partialOnly: true }
                        );
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [screen, activeTab, user?.id, isAdminPreview, targetSeconds, saveUserProgress]);

            // เชื่อมต่อ Bridge กับไฟล์เสริม ai-interactive.js ครบทุกฟิลด์
            useEffect(() => {
                if (window.RJCLOUD_AI_INTERACTIVE && typeof window.RJCLOUD_AI_INTERACTIVE.registerBridge === 'function') {
                    window.RJCLOUD_AI_INTERACTIVE.registerBridge({
                        screen,
                        activeTab,
                        user,
                        lessons,
                        currentLessonId,
                        studySeconds,
                        liveStudyPercent,
                        targetSeconds,
                        hasDonePretest,
                        isAdminPreview,
                        appsScriptUrl,
                        setActiveTab: (t) => setActiveTab(t),
                        selectLesson: (lid) => {
                            setCurrentLessonId(Number(lid));
                            saveUserProgress({ lastVideoId: Number(lid) }, { partialOnly: true });
                        },
                        toggleTheme,
                        toast: showToast
                    });
                }
            }, [screen, activeTab, user, lessons, currentLessonId, studySeconds, liveStudyPercent, targetSeconds, hasDonePretest, isAdminPreview, appsScriptUrl, toggleTheme, showToast, saveUserProgress]);

            // เชื่อมต่อโมดูลเปิดตัว Keynote พิธีกรคู่ ชาย–หญิง + เพลง Epic (keynote-launch.js)
            useEffect(() => {
                if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.sync === 'function') {
                    window.RJCLOUD_KEYNOTE.sync({
                        isLanding: screen === 'landing',
                        appsScriptUrl,
                        isAdminPreview
                    });
                }
            }, [screen, appsScriptUrl, isAdminPreview]);

            useEffect(() => () => {
                if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.stopAll === 'function') {
                    window.RJCLOUD_KEYNOTE.stopAll();
                }
            }, []);

            // เตรียมฟอร์มยืนยันใบประกาศฯ เมื่อเข้าหน้า cert_confirm
            useEffect(() => {
                if (screen === 'cert_confirm' && user) {
                    setCertForm({
                        name: user.name || '',
                        nameEN: user.nameEN || '',
                        hospital: user.hospital || '',
                        comment: user.satisfactionComment || ''
                    });
                }
            }, [screen, user]);

            // วาดใบประกาศนียบัตรลง Canvas เมื่อเข้าหน้า certificate (พร้อม Fallback กรณีพรีวิวไฟล์เดี่ยวไม่มี cert-engine.js)
            const verifyUrl = useMemo(() => {
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-DEMO01`;
                return typeof CERT.buildVerifyUrl === 'function'
                    ? CERT.buildVerifyUrl(code, certTemplate.certPrefix)
                    : `https://learn.coerj.com/verify.html?code=${encodeURIComponent(code)}`;
            }, [user?.certificateCode, certTemplate.certPrefix]);

            useEffect(() => {
                if (screen !== 'certificate' || certSubView !== 'cert' || !certCanvasRef.current || !user) return;
                const mergedCertTpl = {
                    ...certTemplate,
                    cneuActivityCode: certTemplate.cneuActivityCode || cneuConfig.activityCode || '',
                    cneuCredits: certTemplate.cneuCredits || cneuConfig.cneuCredits || ''
                };
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certCanvasRef.current, mergedCertTpl, user, verifyUrl);
                    return;
                }
                // Built-in Fallback Canvas Renderer สำหรับโหมดพรีวิวไฟล์เดี่ยว
                const canvas = certCanvasRef.current;
                const W = 1200, H = 848;
                canvas.width = W;
                canvas.height = H;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = '#c5a059';
                ctx.lineWidth = 3;
                ctx.strokeRect(32, 32, W - 64, H - 64);
                ctx.strokeStyle = 'rgba(197, 160, 89, 0.45)';
                ctx.lineWidth = 1;
                ctx.strokeRect(46, 46, W - 92, H - 92);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#1d1d1f';
                ctx.font = '600 18px "Prompt", sans-serif';
                ctx.fillText(certTemplate.orgTitleTH || '', W / 2, 120, W - 160);
                ctx.fillStyle = '#a8843b';
                ctx.font = '700 13px "JetBrains Mono", monospace';
                ctx.fillText('CERTIFICATE OF COMPLETION', W / 2, 170);
                ctx.fillStyle = '#1d1d1f';
                ctx.font = '700 44px "Prompt", sans-serif';
                ctx.fillText('ประกาศนียบัตร', W / 2, 228);
                ctx.font = '700 40px "Prompt", sans-serif';
                ctx.fillText(user.name || 'ผู้สำเร็จการอบรม', W / 2, 330, W - 160);
                ctx.fillStyle = '#475569';
                ctx.font = '500 19px "Sarabun", sans-serif';
                ctx.fillText([user.hospital || '', user.license ? `เลขที่ใบอนุญาต ${user.license}` : ''].filter(Boolean).join(' • '), W / 2, 378, W - 160);
                ctx.fillStyle = '#0f172a';
                ctx.font = '700 22px "Prompt", sans-serif';
                ctx.fillText(mergedCertTpl.courseTitleTH || '', W / 2, 460, W - 180);
                const cneuCode = String(mergedCertTpl.cneuActivityCode || user.cneuActivityCode || '').trim();
                const cneuCred = String(mergedCertTpl.cneuCredits || user.cneuCredits || '').trim();
                if (cneuCode || cneuCred) {
                    const cneuLine = [
                        cneuCode ? `รหัสกิจกรรม CNEU: ${cneuCode}` : '',
                        cneuCred ? `จำนวน ${cneuCred} หน่วยคะแนน` : ''
                    ].filter(Boolean).join('   •   ');
                    ctx.fillStyle = '#047857';
                    ctx.font = '600 17px "Prompt", sans-serif';
                    ctx.fillText(cneuLine, W / 2, 496, W - 180);
                }
                ctx.fillStyle = '#64748b';
                ctx.font = '500 16px "Sarabun", sans-serif';
                ctx.fillText(`ให้ไว้ ณ วันที่ ${formatThaiDate(user.certificateIssuedAt)}`, W / 2, cneuCode || cneuCred ? 530 : 505);
                ctx.fillStyle = '#1d1d1f';
                ctx.font = '600 18px "Prompt", sans-serif';
                ctx.fillText(certTemplate.signerName || '', W / 2, H - 115);
                ctx.textAlign = 'left';
                ctx.fillStyle = '#0f172a';
                ctx.font = '700 15px "JetBrains Mono", monospace';
                ctx.fillText(user.certificateCode || 'RJC-2027-DEMO01', 78, H - 96);
                if (typeof window.qrcode === 'function') {
                    try {
                        const qr = window.qrcode(0, 'M');
                        qr.addData(String(verifyUrl));
                        qr.make();
                        const count = qr.getModuleCount();
                        const qSize = 110, qx = W - 78 - qSize, qy = H - 78 - qSize, cell = qSize / count;
                        ctx.fillStyle = '#1d1d1f';
                        for (let r = 0; r < count; r++) {
                            for (let c = 0; c < count; c++) {
                                if (qr.isDark(r, c)) ctx.fillRect(Math.floor(qx + c * cell), Math.floor(qy + r * cell), Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    } catch (_) {}
                }
            }, [screen, certSubView, certTemplate, cneuConfig, user, verifyUrl]);

            // ============================================================================
            // 5. AUTH WIZARD HANDLERS (STEP 1 -> STEP 2 PDPA -> STEP 3 EMAIL OTP)
            // ============================================================================
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (cleanLic.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพให้ถูกต้องค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                setGeneratedOtp('');
                setOtpInput('');

                let found = null;
                if (fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) found = { id: snap.id, ...snap.data() };
                    } catch (_) {}
                }
                if (!found) {
                    try {
                        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                        if (raw?.user && String(raw.user.license || raw.user.id) === cleanLic) found = raw.user;
                    } catch (_) {}
                }

                if (found) {
                    const regEmail = String(found.email || '').trim();
                    const hasRegEmail = Boolean(regEmail && regEmail.includes('@'));
                    const isContinuing = found.userType === 'เรียนต่อเนื่อง' || Boolean(found.pdpaAccepted);
                    setIsExistingAccount(true);
                    setExistingRegisteredEmail(hasRegEmail ? regEmail : '');
                    // บัญชีเดิมที่เคยลงทะเบียนไว้แล้ว ไม่ต้องติ๊ก PDPA ซ้ำ
                    setPdpaAgreed(true);
                    setAuthForm({
                        ...DEFAULT_AUTH_FORM,
                        ...found,
                        license: cleanLic,
                        workContext: found.workContext || 'ICU / ER / OR',
                        userType: found.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                        pdpaAccepted: true
                    });
                    showToast(
                        isContinuing
                            ? 'พบประวัติเรียนต่อเนื่องในระบบ ปกปิดข้อมูลติดต่อตามหลัก PDPA แล้วค่ะ'
                            : 'พบประวัติเดิมในระบบ ปกปิดข้อมูลติดต่อตามหลัก PDPA แล้วค่ะ',
                        'info'
                    );
                } else {
                    // รีเซ็ตฟอร์มสะอาดทั้งอ็อบเจกต์ ป้องกันข้อมูลรั่วข้ามบัญชีเมื่อกดย้อนกลับ
                    setIsExistingAccount(false);
                    setExistingRegisteredEmail('');
                    setPdpaAgreed(false);
                    setAuthForm({ ...DEFAULT_AUTH_FORM, license: cleanLic });
                }
                setAuthBusy(false);
                setAuthStep(2);
            };

            // ผู้เรียนใหม่ที่ยังไม่เคยลงทะเบียนหรือยังไม่เคยยินยอม PDPA ต้องติ๊กยินยอม 1 ครั้งเสมอ
            const needsPdpaCheckbox = !(isExistingAccount || authForm.pdpaAccepted);

            const handleRequestOtp = async (e) => {
                if (e) e.preventDefault();
                if (!authForm.name.trim()) { showToast('กรุณากรอกชื่อ–นามสกุลค่ะ', 'error'); return; }

                // บังคับส่ง OTP ไปยังอีเมลที่ลงทะเบียนไว้เดิมเท่านั้นสำหรับบัญชีเก่า (ป้องกันการยึดบัญชีและเผยอีเมลก่อน OTP)
                const targetEmail = (isExistingAccount && existingRegisteredEmail)
                    ? existingRegisteredEmail
                    : String(authForm.email || '').trim();

                if (!targetEmail || !targetEmail.includes('@')) {
                    showToast('กรุณากรอกอีเมลที่ถูกต้องสำหรับรับรหัส OTP 6 หลักค่ะ', 'error');
                    return;
                }
                if (needsPdpaCheckbox && !pdpaAgreed) {
                    showToast('กรุณาติ๊กยินยอมนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ก่อนดำเนินการต่อค่ะ', 'error');
                    return;
                }

                const code = String(Math.floor(100000 + Math.random() * 900000));
                setAuthBusy(true);
                setOtpInput('');
                const mailRes = await sendOtpViaEmail(appsScriptUrl, targetEmail, code, authForm.name, authForm.license);
                setAuthBusy(false);

                if (!mailRes.ok) {
                    showToast(`ส่งรหัส OTP ทางอีเมลไม่สำเร็จ: ${mailRes.reason}`, 'error');
                    return;
                }

                setGeneratedOtp(code);
                setOtpCooldown(45);
                setAuthStep(3);
                showToast(`ส่งรหัส OTP 6 หลักไปยัง ${maskEmail(targetEmail)} เรียบร้อยแล้วค่ะ (ตรวจสอบในกล่องจดหมายหรือ Spam)`);
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                const entered = otpInput.trim().replace(/[^0-9]/g, '');
                if (!generatedOtp || entered !== generatedOtp) {
                    showToast('รหัส OTP 6 หลักไม่ถูกต้อง กรุณาตรวจสอบในอีเมลอีกครั้งค่ะ', 'error');
                    return;
                }

                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                const nowIso = new Date().toISOString();
                const finalUser = {
                    ...authForm,
                    id: cleanLic,
                    license: cleanLic,
                    userType: authForm.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    status: authForm.status || 'กำลังเรียน',
                    progress: Number(authForm.progress || 0),
                    studySeconds: Number(authForm.studySeconds || 0),
                    pretest: authForm.pretest || '-',
                    posttest: authForm.posttest || '-',
                    lastVideoId: Number(authForm.lastVideoId || 1),
                    pdpaAccepted: true,
                    pdpaAcceptedAt: authForm.pdpaAcceptedAt || nowIso,
                    lastLoginAt: nowIso
                };

                userRef.current = finalUser;
                setUser(finalUser);
                setStudySeconds(finalUser.studySeconds);
                setCurrentLessonId(finalUser.lastVideoId);
                setGeneratedOtp('');
                setOtpInput('');

                await saveUserProgress(finalUser, { syncTelemetry: true });
                showToast(`ยืนยันตัวตนสำเร็จ ยินดีต้อนรับคุณ${finalUser.name} ค่ะ`);
                setScreen(finalUser.pretest && finalUser.pretest !== '-' ? 'dashboard' : 'pretest');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // ============================================================================
            // 6. QUIZ, LIVE CHECK-IN, PDPA SELF-SERVICE & CERTIFICATE HANDLERS
            // ============================================================================
            const handlePretestComplete = async (res) => {
                await saveUserProgress({ pretest: `${res.score}/${res.total}`, aiRoadmap: res.diagnosis }, { syncTelemetry: true });
                showToast('บันทึกผล Pre-test และสร้างแผนการเรียน AI Roadmap เรียบร้อยค่ะ');
                setScreen('dashboard');
                setActiveTab('lessons');
            };

            const handlePosttestComplete = async (res) => {
                const patch = { posttest: `${res.score}/${res.total}`, aiRoadmap: res.diagnosis };
                if (res.passed) patch.status = 'ผ่าน';
                await saveUserProgress(patch, { syncTelemetry: true });
                if (res.passed) {
                    showToast('ยินดีด้วยค่ะ! สอบผ่าน Post-test แล้ว ไปยืนยันออกใบประกาศนียบัตรกันค่ะ 🎉');
                    setScreen('cert_confirm');
                } else {
                    showToast('บันทึกผลทบทวนแล้ว แนะนำดูบทเรียนที่ติดดาว ★ แล้วสอบใหม่ได้ตลอดเวลาค่ะ', 'info');
                    setScreen('dashboard');
                    setActiveTab('lessons');
                }
            };

            const handleLiveCheckIn = async () => {
                const nowIso = new Date().toISOString();
                await saveUserProgress({ liveCheckInAt: nowIso, liveAttendedTopic: liveConfig.topic || 'Live สด' }, { partialOnly: true });
                showToast('เช็คอินยืนยันเข้าเรียน Live สดเรียบร้อยแล้วค่ะ ✓');
            };

            const handleOpenPdpaEdit = () => {
                if (!user) return;
                setPdpaForm({
                    name: user.name || '', position: user.position || '', department: user.department || '',
                    hospital: user.hospital || '', province: user.province || '', email: user.email || '', phone: user.phone || ''
                });
                setPdpaEditOpen(true);
            };

            const handleSavePdpaEdit = async (e) => {
                e.preventDefault();
                if (!pdpaForm.name.trim()) { showToast('กรุณากรอกชื่อ–นามสกุลค่ะ', 'error'); return; }
                await saveUserProgress({
                    name: pdpaForm.name.trim(),
                    position: pdpaForm.position.trim(),
                    department: pdpaForm.department.trim(),
                    hospital: pdpaForm.hospital.trim(),
                    province: pdpaForm.province.trim(),
                    email: pdpaForm.email.trim(),
                    phone: pdpaForm.phone.trim(),
                    updatedAt: new Date().toISOString()
                }, { partialOnly: true, syncTelemetry: true });
                setPdpaEditOpen(false);
                showToast('อัปเดตข้อมูลส่วนบุคคลของคุณเรียบร้อยแล้วค่ะ');
            };

            const handleDeletePersonalData = () => {
                if (!user) return;
                setConfirmDialog({
                    open: true,
                    danger: true,
                    title: 'ยืนยันการลบข้อมูลส่วนบุคคล (สิทธิ PDPA)',
                    message: 'ระบบจะลบข้อมูลส่วนบุคคลและประวัติการเรียนของคุณออกจากฐานข้อมูล Cloud และล้างข้อมูลในอุปกรณ์นี้ถาวร ยืนยันหรือไม่?',
                    confirmText: 'ลบข้อมูลถาวร',
                    onConfirm: async () => {
                        const uid = user.id || user.license;
                        if (fbDb && uid && !isAdminPreview && !String(uid).startsWith('admin_preview_')) {
                            try { await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(uid))); }
                            catch (err) { console.warn('Delete user cloud warning:', err); }
                        }
                        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                        userRef.current = null;
                        setUser(null);
                        setPdpaEditOpen(false);
                        setPdpaDangerOpen(false);
                        setScreen('landing');
                        showToast('ลบข้อมูลส่วนบุคคลของคุณออกจากระบบเรียบร้อยแล้วค่ะ', 'info');
                    }
                });
            };

            const handleLogout = () => {
                setConfirmDialog({
                    open: true,
                    danger: false,
                    title: 'ออกจากระบบผู้เรียน',
                    message: 'ข้อมูลความคืบหน้าการเรียนของคุณถูกบันทึกไว้บน Cloud แล้ว ต้องการออกจากระบบใช่หรือไม่?',
                    confirmText: 'ออกจากระบบ',
                    onConfirm: () => {
                        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                        userRef.current = null;
                        setUser(null);
                        setPdpaEditOpen(false);
                        setPdpaDangerOpen(false);
                        setAuthStep(1);
                        setScreen('landing');
                        showToast('ออกจากระบบเรียบร้อยแล้วค่ะ', 'info');
                    }
                });
            };

            const handleGenerateWarmup = () => {
                const { age, cause, mood, concern } = warmupTags;
                setWarmupResult(
                    `1. ประโยคเปิดในพื้นที่ส่วนตัว (${age} • ${cause}):\n“สวัสดีค่ะ ดิฉันเป็นพยาบาลผู้ประสานงานดูแลครอบครัวค่ะ ขอแสดงความเสียใจอย่างสุดซึ้งกับเหตุการณ์ที่เกิดขึ้นนะคะ ขอบคุณที่มานั่งคุยกันในที่เงียบๆ นี้ค่ะ”\n\n` +
                    `2. แนวทางรับมืออารมณ์ (${mood}):\nรับฟังและเว้นจังหวะเงียบ 2.5 วินาทีก่อนอธิบายความจริงทางการแพทย์อย่างนุ่มนวลโดยไม่โต้แย้ง\n\n` +
                    `3. แนวทางคลายความกังวล (${concern}):\nยืนยันความโปร่งใสของศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC) ไม่มีค่าใช้จ่ายกับครอบครัว และรับรองการดูแลตกแต่งร่างอย่างประณีตสมเกียรติที่สุด โดยไม่เร่งรัดการตัดสินใจค่ะ\n\n(เครื่องมือทบทวนเพื่อการเรียนรู้เท่านั้น ไม่ใช่คำสั่งการรักษาแทนแพทย์)`
                );
            };

            const handleIssueCertificate = async (e) => {
                e.preventDefault();
                if (!certForm.name.trim() || !certForm.hospital.trim()) {
                    showToast('กรุณากรอกชื่อ–นามสกุล และโรงพยาบาลให้ครบค่ะ', 'error');
                    return;
                }
                const vals = Object.values(evalCriteria);
                const avgCsat = Number((vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2));
                const issuedAt = user?.certificateIssuedAt || new Date().toISOString();
                const randomSuffix = Math.random().toString(36).slice(2, 8).toUpperCase();
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${randomSuffix}`;

                const updated = await saveUserProgress({
                    name: certForm.name.trim(),
                    nameEN: certForm.nameEN.trim(),
                    hospital: certForm.hospital.trim(),
                    status: 'ผ่าน',
                    certificateClaimed: true,
                    certificateCode: code,
                    certificateIssuedAt: issuedAt,
                    satisfactionScore: avgCsat,
                    satisfactionCriteria: evalCriteria,
                    satisfactionComment: certForm.comment.trim(),
                    cneuActivityCode: cneuConfig.activityCode || '',
                    cneuCredits: cneuConfig.cneuCredits || ''
                }, { syncTelemetry: true });

                const publicCert = typeof CERT.buildPublicCertPayload === 'function'
                    ? CERT.buildPublicCertPayload({
                        code, finalName: certForm.name.trim(), nameEN: certForm.nameEN.trim(),
                        finalHospital: certForm.hospital.trim(), license: updated?.license || updated?.id,
                        user: updated, certTemplate, cneuConfig, issuedAt
                    })
                    : { code, name: certForm.name.trim(), license: updated?.license || '', hospital: certForm.hospital.trim(), issuedAt, status: 'valid' };

                try {
                    const localMap = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                    localMap[code] = publicCert;
                    localStorage.setItem('rjcloud_local_certificates', JSON.stringify(localMap));
                } catch (_) {}

                if (fbDb && !isAdminPreview) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), publicCert, { merge: true });
                    } catch (err) { console.warn('Cert registry write warning:', err); }
                }

                showToast('ออกประกาศนียบัตรและหนังสือรับรอง CNEU เรียบร้อยแล้วค่ะ 🎉');
                setCertSubView('cert');
                setScreen('certificate');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const activeLesson = useMemo(() => lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0], [lessons, currentLessonId]);
            const recommendedLessonIds = useMemo(() => new Set(user?.aiRoadmap?.recommendedLessonIds || []), [user?.aiRoadmap]);
            const activeQuizQuestions = useMemo(() => (Array.isArray(questionSets[0]) && questionSets[0].length > 0 ? questionSets[0] : parseRawExams(FALLBACK_QUIZ_RAW)), [questionSets]);
            const avgCsatPreview = useMemo(() => {
                const v = Object.values(evalCriteria);
                return (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2);
            }, [evalCriteria]);

            const dashboardTabs = [
                { id: 'lessons', label: 'บทเรียน + AI', shortLabel: 'บทเรียน', icon: 'BookOpen' },
                { id: 'clinical_cases', label: 'เคสคลินิก', shortLabel: 'เคสคลินิก', icon: 'Stethoscope' },
                { id: 'flashcards', label: 'Flashcards', shortLabel: 'การ์ดจำ', icon: 'Layers' },
                { id: 'live', label: 'Live สด', shortLabel: 'Live สด', icon: 'Radio' },
                { id: 'profile', label: 'โปรไฟล์ & Warm-up', shortLabel: 'โปรไฟล์', icon: 'User' }
            ];

            // ============================================================================
            // 7. RENDER SCREENS (7 FULL SCREENS)
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe">
                    {screen !== 'landing' && <><div className="spatial-aura" /><div className="spatial-grid" /></>}

                    {/* ==================== SCREEN 1: LANDING PAGE (RJCLOUD.ORGAN 2.0) ==================== */}
                    {screen === 'landing' && (
                        <Rjcloud2LandingStage
                            onStartLogin={() => {
                                if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.stopAll === 'function') {
                                    window.RJCLOUD_KEYNOTE.stopAll();
                                }
                                setAuthStep(1);
                                setScreen('auth');
                                window.scrollTo({ top: 0, behavior: 'smooth' });
                            }}
                            onOpenPdpa={() => setPdpaModalOpen(true)}
                        />
                    )}

                    {/* ==================== SCREEN 2: AUTH WIZARD (3 STEPS + PDPA + EMAIL OTP) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4 py-8">
                            <div className="spatial-card w-full max-w-lg rounded-[2rem] p-5 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (authStep > 1) {
                                                if (authStep === 3) { setGeneratedOtp(''); setOtpInput(''); }
                                                setAuthStep(s => s - 1);
                                            } else {
                                                setScreen('landing');
                                            }
                                        }}
                                        className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5"
                                    >
                                        <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-xs font-bold text-prism-adaptive">STEP {authStep} / 3</span>
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleCheckLicense} className="space-y-4">
                                        <div>
                                            <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนเรียน</h1>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">กรอกเลขที่ใบอนุญาตประกอบวิชาชีพเพื่อดึงประวัติเดิมอัตโนมัติ (ไม่ใช้เลขบัตรประชาชน)</p>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-secondary-adaptive mb-1.5 ml-1">เลขที่ใบอนุญาตประกอบวิชาชีพ *</label>
                                            <input
                                                type="text"
                                                required
                                                value={authForm.license}
                                                onChange={e => setAuthForm(p => ({ ...p, license: e.target.value }))}
                                                placeholder="เช่น 6501234567"
                                                className="touch-target spatial-input w-full px-4 py-3 rounded-2xl font-mono text-base font-bold"
                                            />
                                        </div>
                                        <button type="submit" disabled={authBusy} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                            {authBusy ? 'กำลังตรวจสอบฐานข้อมูล...' : 'ตรวจสอบและดำเนินการต่อ →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={handleRequestOtp} className="space-y-3.5">
                                        <div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">ยืนยันข้อมูลผู้เรียนและรับรหัส OTP</h2>
                                            <p className="text-xs text-secondary-adaptive">เลขที่ใบอนุญาต: <span className="font-mono font-bold text-prism-adaptive">{authForm.license}</span></p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div className="sm:col-span-2">
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">คำนำหน้า ชื่อ – นามสกุล *</label>
                                                <input type="text" required value={authForm.name} onChange={e => setAuthForm(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ตำแหน่ง</label>
                                                <input type="text" value={authForm.position} onChange={e => setAuthForm(p => ({ ...p, position: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ประเภทการเรียน</label>
                                                <select value={authForm.userType} onChange={e => setAuthForm(p => ({ ...p, userType: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm font-bold">
                                                    <option value="เรียนใหม่">เรียนใหม่</option>
                                                    <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">สังกัด / เขตสุขภาพ</label>
                                                <select
                                                    value={authForm.department}
                                                    onChange={e => {
                                                        const dep = e.target.value;
                                                        const firstHosp = (HOSPITAL_MAPPING[dep] || [])[0];
                                                        setAuthForm(p => ({ ...p, department: dep, hospital: firstHosp?.name || p.hospital, province: firstHosp?.prov || p.province }));
                                                    }}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                >
                                                    {Object.keys(HOSPITAL_MAPPING).map(k => <option key={k} value={k}>{k}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">โรงพยาบาล / หน่วยงาน</label>
                                                <input type="text" value={authForm.hospital} onChange={e => setAuthForm(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                            </div>
                                            <div className="sm:col-span-2">
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ลักษณะงาน / แผนก (สำหรับปรับมุมมองผู้ช่วย AI)</label>
                                                <select value={authForm.workContext || 'ICU / ER / OR'} onChange={e => setAuthForm(p => ({ ...p, workContext: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm">
                                                    <option value="ICU / ER / OR">หอผู้ป่วยวิกฤต / ห้องฉุกเฉิน / ห้องผ่าตัด (ICU / ER / OR)</option>
                                                    <option value="ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)">ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)</option>
                                                    <option value="หอผู้ป่วยทั่วไป / คลินิก">หอผู้ป่วยทั่วไป / คลินิกเฉพาะทาง</option>
                                                    <option value="ผู้สนใจศึกษาทั่วไป">ผู้สนใจศึกษาทั่วไป</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* PDPA Pre-OTP Lock: บัญชีเดิมที่มีอีเมลแล้วจะไม่เปิดเผยหรือให้แก้ไขอีเมลก่อนยืนยัน OTP */}
                                        {isExistingAccount && existingRegisteredEmail ? (
                                            <div className="spatial-soft p-3.5 rounded-2xl space-y-1 text-xs">
                                                <span className="font-bold text-accent-adaptive flex items-center gap-1.5">
                                                    <Icon name="Lock" size={13} /> ส่ง OTP ไปยังอีเมลที่ลงทะเบียนไว้ (ปกปิดตามหลัก PDPA)
                                                </span>
                                                <p className="font-mono text-primary-adaptive font-bold">
                                                    {maskEmail(existingRegisteredEmail)} {authForm.phone ? `• ${maskPhone(authForm.phone)}` : ''}
                                                </p>
                                                <p className="text-[11px] text-muted-adaptive leading-snug">
                                                    เพื่อป้องกันการสวมสิทธิ์ สามารถแก้ไขข้อมูลติดต่อได้ในเมนู <b>โปรไฟล์ &amp; Warm-up</b> หลังยืนยัน OTP แล้ว หรือติดต่อ {CONFIG.contactEmail}
                                                </p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">อีเมล (สำหรับรับรหัส OTP) *</label>
                                                    <input type="email" required value={authForm.email} onChange={e => setAuthForm(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">เบอร์โทรศัพท์</label>
                                                    <input type="tel" value={authForm.phone} onChange={e => setAuthForm(p => ({ ...p, phone: e.target.value }))} placeholder="08xxxxxxxx" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                                </div>
                                            </div>
                                        )}

                                        {/* เงื่อนไข PDPA: ผู้เรียนใหม่ต้องติ๊กยินยอมครั้งแรก ส่วนบัญชีเดิมที่เคยยินยอมแล้วไม่ต้องติ๊กซ้ำ */}
                                        {needsPdpaCheckbox ? (
                                            <div className="p-3.5 rounded-2xl bg-aurora-500/10 border border-aurora-400/35 space-y-2">
                                                <p className="text-xs font-bold text-primary-adaptive leading-relaxed">
                                                    ข้อมูลของท่านได้รับการคุ้มครองข้อมูลส่วนบุคคล PDPA ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562
                                                </p>
                                                <label className="flex items-start gap-2.5 cursor-pointer text-xs text-secondary-adaptive">
                                                    <input type="checkbox" checked={pdpaAgreed} onChange={e => setPdpaAgreed(e.target.checked)} className="w-4 h-4 mt-0.5 accent-aurora-500 shrink-0" />
                                                    <span>
                                                        ข้าพเจ้ายินยอมให้จัดเก็บข้อมูลที่จำเป็นต่อการเรียนและออกประกาศนียบัตรตาม{' '}
                                                        <button type="button" onClick={() => setPdpaModalOpen(true)} className="text-prism-adaptive font-bold underline">นโยบาย PDPA</button>
                                                    </span>
                                                </label>
                                            </div>
                                        ) : (
                                            <div className="px-3.5 py-2.5 rounded-2xl bg-aurora-500/10 border border-aurora-400/30 flex items-center justify-between gap-2 text-xs">
                                                <span className="text-accent-adaptive font-bold flex items-center gap-1.5">
                                                    <Icon name="ShieldCheck" size={15} /> ผู้เรียนต่อเนื่อง / ยืนยัน PDPA เรียบร้อยแล้ว
                                                </span>
                                                <button type="button" onClick={() => setPdpaModalOpen(true)} className="text-prism-adaptive font-bold underline shrink-0">อ่านนโยบาย</button>
                                            </div>
                                        )}

                                        <button type="submit" disabled={authBusy || (needsPdpaCheckbox && !pdpaAgreed)} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                            {authBusy ? 'กำลังส่งรหัส OTP ทางอีเมล...' : 'ขอรหัส OTP 6 หลักทางอีเมล →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtp} className="space-y-4">
                                        <div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">กรอกรหัสยืนยันตัวตน OTP 6 หลัก</h2>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">
                                                ส่งรหัสไปยังอีเมล <span className="font-mono font-bold text-prism-adaptive">{maskEmail(authForm.email)}</span> แล้วค่ะ
                                            </p>
                                            <p className="text-xs text-muted-adaptive mt-1">หากไม่พบในกล่องขาเข้า กรุณาตรวจสอบโฟลเดอร์อีเมลขยะ (Spam/Junk)</p>
                                        </div>

                                        {/* ลบกล่องตัวอย่างรหัส OTP ออก 100% + ปรับช่องกรอกไม่ให้ภาษาไทยยืดห่าง */}
                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength={6}
                                            required
                                            value={otpInput}
                                            onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, '').slice(0, 6))}
                                            placeholder="กรอกรหัส OTP 6 หลักจากอีเมล"
                                            className={`touch-target spatial-input w-full px-4 py-3.5 rounded-2xl text-center font-bold transition-all ${
                                                otpInput ? 'font-mono text-2xl tracking-[0.45em]' : 'font-sans text-base tracking-normal'
                                            }`}
                                        />

                                        <button type="submit" disabled={otpInput.length < 6} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                            ยืนยัน OTP และเข้าสู่ระบบ
                                        </button>

                                        <button
                                            type="button"
                                            disabled={authBusy || otpCooldown > 0}
                                            onClick={() => handleRequestOtp()}
                                            className="touch-target spatial-soft w-full py-3 rounded-2xl text-prism-adaptive font-display font-bold text-xs disabled:opacity-50"
                                        >
                                            {otpCooldown > 0 ? `ส่งรหัส OTP อีกครั้งได้ใน ${otpCooldown} วินาที` : 'ส่งรหัส OTP อีกครั้ง'}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ==================== SCREEN 3 & 4: PRE-TEST / POST-TEST ==================== */}
                    {screen === 'pretest' && (
                        <div className="relative z-10 flex-1">
                            <QuizEngine mode="pretest" questions={activeQuizQuestions} onComplete={handlePretestComplete} onExit={() => setScreen('dashboard')} />
                        </div>
                    )}
                    {screen === 'posttest' && (
                        <div className="relative z-10 flex-1">
                            <QuizEngine mode="posttest" questions={activeQuizQuestions} onComplete={handlePosttestComplete} onExit={() => setScreen('dashboard')} />
                        </div>
                    )}

                    {/* ==================== SCREEN 5: MAIN CLASSROOM DASHBOARD (5 MENUS) ==================== */}
                    {screen === 'dashboard' && user && (
                        <div className="relative z-10 flex-1 flex flex-col pb-dock-safe lg:pb-10">
                            {/* Top Header (โครงสร้าง Selector ตรงกับ ai-interactive.js 100%) */}
                            <header className="sticky top-0 z-30 spatial-header no-print">
                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">
                                            <Icon name="HeartPulse" size={18} />
                                        </div>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                rjcloud<span className="text-accent-adaptive">.organ</span> <span className="text-[10px] font-mono text-prism-adaptive">2.0</span>
                                            </span>
                                            <span className="font-mono text-[10px] text-muted-adaptive block truncate">
                                                {user.name} • {liveStudyPercent}%
                                            </span>
                                        </div>
                                    </div>

                                    {/* Desktop 5 Menus + ปุ่มออกจากระบบ (ปกติกลมกลืนไม่ดึงสายตา เปลี่ยนเป็นสีแดงเมื่อชี้/แตะ) */}
                                    <div className="hidden lg:flex items-center gap-1.5">
                                        {dashboardTabs.map(t => (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setActiveTab(t.id)}
                                                className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                    activeTab === t.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={15} /> {t.label}
                                            </button>
                                        ))}
                                        <button
                                            id="btn-learner-logout"
                                            type="button"
                                            onClick={handleLogout}
                                            className="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all spatial-soft text-secondary-adaptive hover:!bg-red-600 hover:!text-white hover:!border-red-500 focus-visible:!bg-red-600 focus-visible:!text-white active:!bg-red-600 active:!text-white active:scale-95"
                                        >
                                            <Icon name="LogOut" size={15} /> ออกจากระบบ
                                        </button>
                                    </div>

                                    {/* Right Actions (matches header .max-w-7xl > div:last-child) */}
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>
                            </header>

                            <main className="w-full max-w-7xl mx-auto px-3.5 sm:px-6 pt-4 md:pt-6 space-y-5">
                                {/* First Child inside <main>: 5-Step Progress Strip (matches main > div:first-child) */}
                                <div className="spatial-card rounded-[1.5rem] p-3.5 sm:p-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                    <button type="button" onClick={() => setScreen('pretest')} className={`p-2.5 rounded-xl border text-left ${hasDonePretest ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">1. PRE-TEST</span>
                                        <span className="font-bold text-primary-adaptive">{hasDonePretest ? `เสร็จแล้ว (${user.pretest})` : 'เริ่มทำ Pre-test →'}</span>
                                    </button>
                                    <button type="button" onClick={() => setActiveTab('lessons')} className={`p-2.5 rounded-xl border text-left ${isStudyHoursMet ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">2. เวลาเรียน ≥ {MIN_STUDY_PERCENT}%</span>
                                        <span className="font-mono font-bold text-accent-adaptive">{liveStudyPercent}% ({formatStudyTime(studySeconds)})</span>
                                    </button>
                                    <a
                                        href={hasDonePretest && isStudyHoursMet ? './aiskilllab.html' : '#'}
                                        onClick={e => { if (!isAdminPreview && (!hasDonePretest || !isStudyHoursMet)) { e.preventDefault(); showToast(`กรุณาทำ Pre-test และสะสมเวลาเรียนครบ ${MIN_STUDY_PERCENT}% ก่อนเข้า AI Skill Lab ค่ะ`, 'info'); } }}
                                        className={`p-2.5 rounded-xl border text-left block ${isSkillLabDone ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">3. AI SKILL LAB</span>
                                        <span className="font-bold text-prism-adaptive">{isSkillLabDone ? `ผ่านแล้ว (${user.skillLabBestScore || '✓'})` : 'เข้าห้องฝึก 3 มิติ →'}</span>
                                    </a>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (!isPosttestUnlocked) { showToast('กรุณาผ่านเวลาเรียน ≥ 80% และ AI Skill Lab ก่อนทำ Post-test ค่ะ', 'info'); return; }
                                            setScreen('posttest');
                                        }}
                                        className={`p-2.5 rounded-xl border text-left ${isPosttestPassed ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">4. POST-TEST ≥ {MIN_POSTTEST_PERCENT}%</span>
                                        <span className="font-bold text-primary-adaptive">{isPosttestPassed ? `ผ่าน (${user.posttest})` : isPosttestUnlocked ? 'เข้าสอบ Post-test →' : 'ยังไม่ปลดล็อก'}</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (!isPosttestPassed && !isAdminPreview) { showToast('สอบผ่าน Post-test ≥ 80% เพื่อรับประกาศนียบัตรค่ะ', 'info'); return; }
                                            setScreen(user.certificateCode ? 'certificate' : 'cert_confirm');
                                        }}
                                        className={`col-span-2 sm:col-span-1 p-2.5 rounded-xl border text-left ${user.certificateCode ? 'bg-amber-500/20 border-amber-400/45' : 'spatial-soft'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">5. ประกาศฯ &amp; CNEU</span>
                                        <span className="font-bold text-amber-400">{user.certificateCode ? 'เปิดใบประกาศฯ →' : isPosttestPassed ? 'กดรับเอกสาร →' : 'รอผ่านเกณฑ์'}</span>
                                    </button>
                                </div>

                                {/* TAB 1: LESSONS + AI STUDY COMPANION */}
                                {activeTab === 'lessons' && activeLesson && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        {/* Left Column (8 cols — target for ai-interactive.js Smart Resume 20-lesson panel) */}
                                        <div className="lg:col-span-8 space-y-4">
                                            <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5">
                                                <div className="flex flex-wrap items-start justify-between gap-2">
                                                    <div>
                                                        <span className="px-2.5 py-0.5 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[10px] font-bold">
                                                            บทที่ {activeLesson.id} / {lessons.length}
                                                        </span>
                                                        <h1 className="font-display text-base sm:text-xl font-extrabold text-primary-adaptive mt-1">{activeLesson.title}</h1>
                                                    </div>
                                                    {activeLesson.documentUrl && (
                                                        <a href={activeLesson.documentUrl} target="_blank" rel="noreferrer" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5 shrink-0">
                                                            <Icon name="FileText" size={14} /> เอกสารประกอบ
                                                        </a>
                                                    )}
                                                </div>

                                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                    {activeLesson.videoId ? (
                                                        <iframe
                                                            src={`https://drive.google.com/file/d/${activeLesson.videoId}/preview`}
                                                            className="absolute inset-0 w-full h-full border-0"
                                                            allow="autoplay; fullscreen"
                                                            allowFullScreen
                                                            title={activeLesson.title}
                                                        />
                                                    ) : (
                                                        <div className="absolute inset-0 flex items-center justify-center text-sm text-muted-adaptive">ยังไม่มีลิงก์วิดีโอในบทเรียนนี้</div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <h2 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">รายชื่อบทเรียนทั้งหมด ({lessons.length} บท)</h2>
                                                    <span className="text-xs text-amber-400 font-bold">★ แนะนำจาก AI Roadmap</span>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto custom-scrollbar pr-1">
                                                    {lessons.map(l => {
                                                        const active = Number(l.id) === Number(activeLesson.id);
                                                        const rec = recommendedLessonIds.has(Number(l.id));
                                                        return (
                                                            <button
                                                                key={l.id}
                                                                type="button"
                                                                onClick={() => { setCurrentLessonId(Number(l.id)); saveUserProgress({ lastVideoId: Number(l.id) }, { partialOnly: true }); }}
                                                                className={`text-left p-3 rounded-xl border text-xs transition-all flex items-start gap-2 ${
