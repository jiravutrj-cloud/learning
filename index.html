    <!-- ซิงค์ธีมมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

    <!-- Global Error Guard ป้องกันหน้าขาว/จอดำ -->
    <script>
      window.addEventListener('error', function (ev) {
        const src = String(ev.filename || (ev.target && ev.target.src) || '');
        if (src.includes('data.js') || src.includes('learning-core.js') || src.includes('cert-engine.js') || src.includes('ai-interactive.js') || src.includes('keynote-launch.js') || src.includes('styles.css') || src.includes('qrcode') || src.includes('jspdf')) return;
        const root = document.getElementById('root');
        if (root && !root.dataset.mounted && ev.message) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#030712;color:#f8fafc;font-family:Sarabun,sans-serif;">' +
            '<div style="max-width:440px;width:100%;background:#070d1c;border:1px solid rgba(244,63,94,0.4);border-radius:24px;padding:24px;text-align:center;">' +
            '<h2 style="color:#fda4af;font-weight:700;margin:0 0 8px;">ไม่สามารถเปิดระบบได้ชั่วคราว</h2>' +
            '<p style="font-size:13px;color:#cbd5e1;margin:0 0 16px;">' + String(ev.message || 'Unknown error') + '</p>' +

        async function postAppsScript(url, payload) {
            if (!url) return { status: 'no_url', message: 'ยังไม่ได้ตั้งค่า Apps Script URL' };
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    redirect: 'follow',

                    body: JSON.stringify(payload)
                });
                const txt = await res.text();

        async function sendOtpViaEmail(url, email, otp, name, license) {
            if (!url || !email) return { ok: false, reason: 'ไม่พบ URL ส่งอีเมลหรือที่อยู่อีเมลปลายทาง' };
            const cleanEmail = String(email).trim();

            const basePayload = {
                email: cleanEmail,
                to: cleanEmail,
                otp: cleanOtp,
                code: cleanOtp,
                name: String(name || 'ผู้เรียน'),
                license: String(license || ''),
                appName,
                subject: `[${appName}] รหัสยืนยันตัวตน OTP 6 หลัก: ${cleanOtp}`,

            };

            const candidateActions = ['sendOtp', 'sendOTP', 'sendOtpEmail', 'sendEmail'];
            let lastErr = 'ระบบส่งอีเมลไม่ตอบสนอง กรุณาตรวจสอบการ Deploy Web App ของ Code.gs ค่ะ';

            for (const act of candidateActions) {
                const res = await postAppsScript(url, { action: act, ...basePayload });
                if (res?.status === 'success' || res?.ok === true || res?.sent === true) {
                    return { ok: true, res };
                }
                const msg = String(res?.message || '');
                if (msg) lastErr = msg;
                // หาก error ไม่ใช่เรื่องไม่รองรับชื่อ action ให้หยุดทันที (เช่น โควต้าเต็มหรือเน็ตหลุด)
                if (!msg.includes('ไม่รองรับ') && !msg.toLowerCase().includes('action')) {
                    break;
                }
            }
            return { ok: false, reason: lastErr };
        }

        function prepareNaturalThaiSpeechSafe(rawText) {
            if (typeof CORE.prepareNaturalThaiSpeech === 'function') return CORE.prepareNaturalThaiSpeech(rawText);
            return String(rawText || '')
                .replace(/≥/g, 'ไม่น้อยกว่า ').replace(/≤/g, 'ไม่เกิน ').replace(/°C/g, ' องศาเซลเซียส')
                .replace(/(\d+)\s*[–-]\s*(\d+)/g, '$1 ถึง $2').replace(/GCS\s*=\s*(\d+)/gi, 'คะแนนจีซีเอสเท่ากับ $1')
                .replace(/\bODC\b/g, 'ศูนย์รับบริจาคอวัยวะสภากาชาดไทย').replace(/\bTC\b/g, 'พยาบาลผู้ประสานงาน')
                .replace(/\bDDAVP\b/g, 'ยาดีดีเอวีพี').replace(/\bICU\b/g, 'ไอซียู').replace(/ชม\./g, 'ชั่วโมง')
                .replace(/[()*"#_]/g, ' ').replace(/\s{2,}/g, ' ').trim();
        }

        function pickNaturalBrowserVoiceSafe(lang) {
            if (typeof CORE.pickNaturalBrowserVoice === 'function') return CORE.pickNaturalBrowserVoice(lang);
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const prefix = lang === 'en' ? 'en' : 'th';
            const matches = voices.filter(v => String(v.lang || '').toLowerCase().startsWith(prefix));
            return matches.find(v => /premwadee|kanya|google|natural|narisa/i.test(v.name || '')) || matches[0] || null;
        }

        function pcm16ToWavBlobSafe(base64PCM, sampleRate = 24000) {
            if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
            const bin = window.atob(base64PCM);
            const raw = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
            const offset = (raw.length > 44 && raw[0] === 0x52 && raw[1] === 0x49 && raw[2] === 0x46 && raw[3] === 0x46) ? 44 : 0;
            const count = Math.floor((raw.length - offset) / 2);
            if (count <= 0) return new Blob([], { type: 'audio/wav' });
            const inView = new DataView(raw.buffer, raw.byteOffset + offset, count * 2);
            const samples = new Float32Array(count);
            for (let i = 0; i < count; i++) samples[i] = inView.getInt16(i * 2, true) / 32768;
            const frameSize = Math.max(128, Math.round(sampleRate * 0.02));
            const numFrames = Math.floor(count / frameSize);
            let endFrame = numFrames - 1;
            while (endFrame > 12) {
                let sumSq = 0, zc = 0, prev = samples[endFrame * frameSize];
                for (let j = 0; j < frameSize; j++) {
                    const s = samples[endFrame * frameSize + j];
                    sumSq += s * s;
                    if ((s >= 0 && prev < 0) || (s < 0 && prev >= 0)) zc++;
                    prev = s;
                }
                if (Math.sqrt(sumSq / frameSize) < 0.016 || zc / frameSize > 0.22) endFrame--;
                else break;
            }
            const kept = Math.min(count, Math.max(Math.round(sampleRate * 0.25), (endFrame + 1) * frameSize));
            const pad = Math.round(sampleRate * 0.045);
            const outBytes = (kept + pad) * 2;
            const fadeOut = Math.min(Math.round(sampleRate * 0.075), Math.floor(kept * 0.22));
            const buf = new ArrayBuffer(44 + outBytes);
            const v = new DataView(buf);
            const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            ws(0, 'RIFF'); v.setUint32(4, 36 + outBytes, true); ws(8, 'WAVE'); ws(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
            v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, outBytes, true);
            for (let i = 0; i < kept; i++) {
                let s = samples[i];
                if (i >= kept - fadeOut) s *= 0.5 * (1 + Math.cos(Math.PI * ((i - (kept - fadeOut)) / fadeOut)));
                v.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, s)) * 32767), true);
            }
            return new Blob([buf], { type: 'audio/wav' });
        }

        function AiStudyCompanion({ lesson, user, appsScriptUrl, showToast }) {
            const roleProfile = useMemo(() => resolveRoleProfile(user), [user]);
            const guide = (window.LESSON_AI_GUIDES && window.LESSON_AI_GUIDES[lesson?.id]) || {
                keyPoints: [
                    `ทบทวนแนวคิดหลักและเกณฑ์มาตรฐานในบทที่ ${lesson?.id || 1}: ${lesson?.title || ''}`,
                    'เชื่อมโยงการคัดกรอง การดูแลสัญญาณชีพ และการสื่อสารกับครอบครัวผู้ป่วยอย่างอ่อนโยน'
                ],
                microCheck: null
            };

            const [pickedOpt, setPickedOpt] = useState(null);
            const [chatInput, setChatInput] = useState('');
            const [chatMsgs, setChatMsgs] = useState([]);
            const [asking, setAsking] = useState(false);
            const [audioPhase, setAudioPhase] = useState('idle'); // idle | loading | playing
            const audioElRef = useRef(null);
            const blobUrlRef = useRef(null);

            const stopAudio = useCallback(() => {
                if (audioElRef.current) { try { audioElRef.current.pause(); } catch (_) {} audioElRef.current = null; }
                if (blobUrlRef.current) { try { URL.revokeObjectURL(blobUrlRef.current); } catch (_) {} blobUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setAudioPhase('idle');
            }, []);

            useEffect(() => {
                setPickedOpt(null);
                setChatMsgs([]);
                stopAudio();
                return () => stopAudio();
            }, [lesson?.id, stopAudio]);

            const handlePlayAudioBrief = async () => {
                if (audioPhase !== 'idle') { stopAudio(); return; }
                const rawScript = `สวัสดีค่ะ มาฟังสรุปหนึ่งนาที บทที่ ${lesson.id} เรื่อง ${lesson.title} กันนะคะ ประเด็นสำคัญที่ควรจำมีดังนี้ค่ะ ${guide.keyPoints.join(' นอกจากนี้ ')} ขอให้มีความสุขกับการเรียนนะคะ`;
                const script = prepareNaturalThaiSpeechSafe(rawScript);
                const cacheKey = `lesson_brief_v3_${lesson.id}`;
                setAudioPhase('loading');

                try {
                    let blob = typeof CORE.getCachedAudio === 'function' ? await CORE.getCachedAudio(cacheKey) : null;
                    if (!blob && appsScriptUrl) {
                        const res = await postAppsScript(appsScriptUrl, {
                            action: 'callGeminiTTS',
                            text: script,
                            voiceName: 'Sulafat',
                            languageCode: 'th-TH',
                            style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล ลื่นหู และเป็นธรรมชาติเหมือนอาจารย์พยาบาลกำลังสรุปบทเรียนให้ผู้เรียนฟัง ไม่แข็งเป็นหุ่นยนต์'
                        });
                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            blob = pcm16ToWavBlobSafe(res.inlineData.data, rate);
                            if (typeof CORE.setCachedAudio === 'function') await CORE.setCachedAudio(cacheKey, blob);
                        }
                    }
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        blobUrlRef.current = url;
                        const audio = new Audio(url);
                        audioElRef.current = audio;
                        setAudioPhase('playing');
                        audio.onended = () => stopAudio();
                        audio.onerror = () => stopAudio();
                        await audio.play();
                        return;
                    }
                } catch (_) {}

                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(script);
                        utter.lang = 'th-TH';
                        utter.rate = 0.95;
                        utter.pitch = 1.02;
                        const naturalVoice = pickNaturalBrowserVoiceSafe('th');
                        if (naturalVoice) utter.voice = naturalVoice;
                        setAudioPhase('playing');
                        utter.onend = () => setAudioPhase('idle');
                        utter.onerror = () => setAudioPhase('idle');
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }
                setAudioPhase('idle');
                showToast('อุปกรณ์นี้ไม่รองรับการเล่นเสียงอัตโนมัติค่ะ', 'info');

                setAsking(true);

                const sys = `คุณคือ AI Study Companion ผู้ช่วยติวบทเรียนการรับบริจาคและปลูกถ่ายอวัยวะ rjcloud.organ
บทเรียนปัจจุบัน: บทที่ ${lesson?.id} - ${lesson?.title}
${roleProfile.aiPromptAddon || ''}

                let reply = '';

                    const res = await postAppsScript(appsScriptUrl, { action: 'callGemini', prompt: q, systemInstruction: sys });
                    if (res?.status === 'success' && res.text) reply = res.text;
                }
                if (!reply) {
                    reply = `สรุปแนวทางสำหรับบทที่ ${lesson?.id} (${lesson?.title}):\n• ${guide.keyPoints[0]}\n• หากต้องการฝึกสื่อสารกับญาติจริง แนะนำเข้าฝึกต่อใน AI Skill Lab 3 มิติค่ะ`;
                }
                setChatMsgs(p => [...p, { role: 'ai', text: reply }]);
                setAsking(false);
            };

            return (
                <div className={`spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-4 overflow-hidden ${audioPhase === 'loading' ? 'ambient-loading-card' : audioPhase === 'playing' ? 'ambient-playing-card' : ''}`}>

                                <Icon name="Sparkles" size={11} /> AI STUDY COMPANION
                            </span>
                            <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive mt-1">สรุป 1 นาที &amp; ถาม AI ประจำบท</h3>
                            <p className="text-[11px] text-prism-adaptive font-bold">{roleProfile.badgeTH}</p>
                        </div>
                        <button
                            type="button"
                            onClick={handlePlayAudioBrief}
                            className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shrink-0 ${
                                audioPhase === 'loading' ? 'ambient-btn-runner'
                                    : audioPhase === 'playing' ? 'bg-rose-500 text-white'
                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                            }`}
                        >
                            <Icon name={audioPhase === 'playing' ? 'Square' : 'Volume2'} size={14} />
                            {audioPhase === 'loading' ? 'เตรียมเสียง...' : audioPhase === 'playing' ? 'หยุดฟัง' : 'ฟังสรุป'}
                        </button>
                    </div>

                    <ul className="space-y-1.5 text-xs text-secondary-adaptive leading-relaxed">
                        {guide.keyPoints.map((kp, idx) => (
                            <li key={idx} className="spatial-soft p-2.5 rounded-xl flex gap-2">
                                <span className="font-mono font-bold text-accent-adaptive shrink-0">{idx + 1}.</span>
                                <span>{kp}</span>
                            </li>

                    </ul>

                    {guide.microCheck && (
                        <div className="spatial-soft p-3.5 rounded-2xl space-y-2 border-prism-400/25">

                                        ? 'spatial-soft text-secondary-adaptive'
                                        : isCorrect ? 'bg-aurora-500/20 border-aurora-400 text-accent-adaptive font-bold'
                                            : picked ? 'bg-rose-500/20 border-rose-400 text-rose-300' : 'spatial-soft opacity-60';
                                    return (
                                        <button key={idx} type="button" onClick={() => setPickedOpt(idx)} className={`w-full text-left p-2.5 rounded-xl border text-xs transition-all ${cls}`}>
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>
                            {pickedOpt !== null && (
                                <p className="text-xs text-accent-adaptive pt-1 leading-relaxed">{guide.microCheck.explain}</p>
                            )}
                        </div>
                    )}

                    <div className="space-y-2 pt-2 border-t border-white/10">
                        <p className="text-[11px] text-muted-adaptive flex items-center gap-1">
                            <Icon name="ShieldCheck" size={12} className="text-accent-adaptive shrink-0" />
                            ถามข้อสงสัยคลินิกได้ทันที (งดพิมพ์ชื่อ/HN ผู้ป่วยจริง)
                        </p>
                        {chatMsgs.length > 0 && (
                            <div className="max-h-44 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                {chatMsgs.map((m, i) => (
                                    <div key={i} className={`p-2.5 rounded-xl text-xs whitespace-pre-line leading-relaxed ${m.role === 'user' ? 'bg-aurora-500/20 text-primary-adaptive ml-6' : 'spatial-soft text-secondary-adaptive mr-4'}`}>
                                        {m.text}
                                    </div>
                                ))}
                            </div>
                        )}
                        <form onSubmit={handleAskAi} className="flex gap-1.5">
                            <input
                                type="text"
                                value={chatInput}
                                onChange={e => setChatInput(e.target.value)}
                                placeholder="ถาม AI เกี่ยวกับบทนี้..."
                                disabled={asking}
                                className="touch-target spatial-input flex-1 px-3 py-2 rounded-xl text-xs"
                            />
                            <button type="submit" disabled={!chatInput.trim() || asking} className="touch-target px-3.5 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-bold text-xs disabled:opacity-40">
                                {asking ? '...' : 'ถาม'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function QuizEngine({ mode, questions, onComplete, onExit }) {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [result, setResult] = useState(null);
            const autoNextRef = useRef(null);

            const total = questions.length || 1;
            const answeredCount = Object.keys(answers).length;
            const safeIdx = Math.max(0, Math.min(total - 1, currentIdx));
            const currentQ = questions[safeIdx] || questions[0];

            useEffect(() => () => {
                if (autoNextRef.current) clearTimeout(autoNextRef.current);
            }, []);

            const handlePickOption = (optIdx) => {
                if (autoNextRef.current) clearTimeout(autoNextRef.current);
                setAnswers(prev => ({ ...prev, [safeIdx]: optIdx }));
                // เปลี่ยนไปข้อถัดไปอัตโนมัติอย่างนุ่มนวลหลังเลือกคำตอบ (ยกเว้นข้อสุดท้ายเพื่อให้ตรวจสอบหรือกดส่งได้)
                if (safeIdx < total - 1) {
                    autoNextRef.current = setTimeout(() => {
                        setCurrentIdx(prev => Math.min(total - 1, prev + 1));
                    }, 260);
                }
            };

            const handleGoPrev = () => {
                if (autoNextRef.current) clearTimeout(autoNextRef.current);
                setCurrentIdx(prev => Math.max(0, prev - 1));
            };

            const handleGoNext = () => {
                if (autoNextRef.current) clearTimeout(autoNextRef.current);
                setCurrentIdx(prev => Math.min(total - 1, prev + 1));
            };

            const handleJumpFirstUnanswered = () => {
                if (autoNextRef.current) clearTimeout(autoNextRef.current);
                const missing = questions.findIndex((_, i) => answers[i] === undefined);
                if (missing >= 0) setCurrentIdx(missing);
            };

            const handleSubmit = () => {
                if (autoNextRef.current) clearTimeout(autoNextRef.current);
                let score = 0;
                questions.forEach((q, idx) => { if (answers[idx] === q.answer) score++; });
                const pct = Math.round((score / total) * 100);
                const diagnosis = computeDomainDiagnosis(questions, answers, MIN_POSTTEST_PERCENT);
                const passed = mode === 'pretest' ? true : pct >= MIN_POSTTEST_PERCENT;
                setResult({ score, total, pct, passed, diagnosis });
                setSubmitted(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const progressPct = Math.round(((safeIdx + 1) / total) * 100);

            return (
                <div className="max-w-3xl mx-auto px-3.5 sm:px-6 py-6 space-y-5">
                    <div className="spatial-card rounded-[1.75rem] p-5 space-y-3">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                    {mode === 'pretest' ? 'STEP 01 • PRE-TEST & AI ROADMAP' : `STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                                </span>
                                <h1 className="font-display text-lg sm:text-2xl font-extrabold text-primary-adaptive">
                                    {mode === 'pretest' ? 'แบบทดสอบก่อนเรียน (วัดพื้นฐาน 4 หมวด)' : 'แบบทดสอบหลังเรียน (ประเมินรับประกาศนียบัตร)'}
                                </h1>
                            </div>
                            <button type="button" onClick={onExit} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1.5">
                                <Icon name="ArrowLeft" size={15} /> กลับห้องเรียน
                            </button>
                        </div>

                        {!submitted && (
                            <div className="space-y-1.5">
                                <div className="flex items-center justify-between text-xs font-bold">
                                    <span className="font-mono text-accent-adaptive">ข้อที่ {safeIdx + 1} / {total}</span>
                                    <span className="text-secondary-adaptive">ตอบแล้ว {answeredCount} / {total} ข้อ ({progressPct}%)</span>
                                </div>
                                <div className="w-full h-2 rounded-full bg-slate-500/20 overflow-hidden">
                                    <div
                                        className="h-full rounded-full bg-gradient-to-r from-aurora-400 to-prism-400 transition-all duration-300"
                                        style={{ width: `${progressPct}%` }}
                                    />
                                </div>
                            </div>
                        )}
                    </div>

                    {submitted && result ? (
                        <div className="spatial-card rounded-[2rem] p-6 space-y-5 border-aurora-400/40">
                            <div className="text-center space-y-2">
                                <span className={`inline-block px-3 py-1 rounded-full font-mono text-xs font-bold ${result.passed ? 'bg-aurora-500/20 text-accent-adaptive' : 'bg-rose-500/20 text-rose-400'}`}>
                                    {mode === 'pretest' ? 'วิเคราะห์จุดอ่อน AI Roadmap สำเร็จ' : result.passed ? 'ผ่านเกณฑ์รับประกาศนียบัตร ✓' : `ยังไม่ถึงเกณฑ์ ${MIN_POSTTEST_PERCENT}%`}
                                </span>
                                <p className="font-mono text-4xl font-extrabold text-primary-adaptive">{result.score} / {result.total} <span className="text-xl text-accent-adaptive">({result.pct}%)</span></p>
                                <p className="text-xs sm:text-sm text-secondary-adaptive max-w-xl mx-auto">{result.diagnosis.summaryText}</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                {result.diagnosis.domains.map(d => (
                                    <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1.5">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span className="text-primary-adaptive">{d.shortName}</span>
                                            <span className="font-mono" style={{ color: d.color }}>{d.percent}%</span>
                                        </div>
                                        <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                            <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                        </div>
                                        {d.percent < MIN_POSTTEST_PERCENT && (
                                            <p className="text-[11px] text-amber-400 leading-snug">{d.remediationGuide}</p>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-2.5">
                                {!result.passed && mode === 'posttest' && (
                                    <button
                                        type="button"
                                        onClick={() => { setCurrentIdx(0); setAnswers({}); setSubmitted(false); setResult(null); }}
                                        className="touch-target flex-1 py-3.5 rounded-2xl bg-amber-500 text-void-950 font-display font-extrabold text-sm"
                                    >
                                        ทำแบบทดสอบใหม่อีกครั้ง
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={() => onComplete(result)}
                                    className="touch-target flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm"
                                >
                                    {mode === 'pretest'
                                        ? 'บันทึกผลและเข้าสู่ห้องเรียน →'
                                        : result.passed
                                            ? 'บันทึกผลและไปรับประกาศนียบัตร →'
                                            : 'กลับไปทบทวนบทเรียนตามจุดอ่อน'}
                                </button>
                            </div>
                        </div>
                    ) : currentQ ? (
                        <div className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                            <div className="space-y-2">
                                <span className="inline-block px-2.5 py-0.5 rounded-full spatial-soft font-mono text-[10px] font-bold text-prism-adaptive">
                                    คำถามข้อที่ {safeIdx + 1} จาก {total} • แตะเลือกคำตอบเพื่อไปข้อถัดไปอัตโนมัติ
                                </span>
                                <p className="font-display font-bold text-base sm:text-xl text-primary-adaptive leading-relaxed">
                                    <span className="font-mono text-accent-adaptive mr-1.5">{safeIdx + 1}.</span>
                                    {currentQ.question}
                                </p>
                            </div>

                            <div className="space-y-2.5">
                                {(currentQ.options || []).map((opt, optIdx) => {
                                    const active = answers[safeIdx] === optIdx;
                                    return (
                                        <button
                                            key={optIdx}
                                            type="button"
                                            onClick={() => handlePickOption(optIdx)}
                                            className={`touch-target w-full text-left px-4 py-3.5 rounded-2xl border text-sm sm:text-base transition-all active:scale-[0.99] flex items-center gap-3 ${
                                                active
                                                    ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold shadow-md'
                                                    : 'spatial-soft text-secondary-adaptive hover:border-prism-400/50'
                                            }`}
                                        >
                                            <span className={`w-7 h-7 rounded-full font-mono text-xs font-bold flex items-center justify-center shrink-0 ${active ? 'bg-aurora-400 text-void-950' : 'bg-white/10 text-muted-adaptive'}`}>
                                                {String.fromCharCode(65 + optIdx)}
                                            </span>
                                            <span className="flex-1 leading-snug">{opt}</span>
                                            {active && <Icon name="CheckCircle2" size={18} className="text-accent-adaptive shrink-0" />}
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="pt-3 border-t border-white/10 flex flex-wrap items-center justify-between gap-2.5">
                                <button
                                    type="button"
                                    disabled={safeIdx === 0}
                                    onClick={handleGoPrev}
                                    className="touch-target spatial-soft px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold text-primary-adaptive disabled:opacity-35 inline-flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={15} /> ย้อนกลับข้อก่อนหน้า
                                </button>

                                {safeIdx < total - 1 ? (
                                    <button
                                        type="button"
                                        onClick={handleGoNext}
                                        className="touch-target spatial-soft px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold text-prism-adaptive inline-flex items-center gap-1.5"
                                    >
                                        ข้อถัดไป <Icon name="ArrowRight" size={15} />
                                    </button>
                                ) : answeredCount < total ? (
                                    <button
                                        type="button"
                                        onClick={handleJumpFirstUnanswered}
                                        className="touch-target px-5 py-2.5 rounded-2xl bg-amber-500 text-void-950 font-display font-extrabold text-xs sm:text-sm"
                                    >
                                        ยังมีข้อที่ไม่ได้ตอบ ({total - answeredCount} ข้อ) → ไปข้อที่ข้ามไว้
                                    </button>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={handleSubmit}
                                        className="touch-target px-6 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                    >
                                        ส่งคำตอบและวิเคราะห์ผลด้วย AI →
                                    </button>
                                )}
                            </div>
                        </div>
                    ) : null}
                </div>
            );
        }

        function ClinicalCaseSimulator() {
            const [caseIdx, setCaseIdx] = useState(0);
            const [stepIdx, setStepIdx] = useState(0);
            const [picked, setPicked] = useState(null);
            const curCase = CLINICAL_CASE_SIMULATIONS[caseIdx];
            if (!curCase) return <div className="spatial-card rounded-2xl p-6 text-center text-sm text-muted-adaptive">ยังไม่มีข้อมูลเคสคลินิกในระบบค่ะ</div>;
            const step = curCase.steps[stepIdx] || curCase.steps[0];
            const vitals = (picked !== null && step.options[picked]?.nextVitals) ? step.options[picked].nextVitals : step.vitals;

            return (
                <div className="space-y-4">
                    <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-1">
                        {CLINICAL_CASE_SIMULATIONS.map((c, i) => (
                            <button
                                key={c.id}
                                type="button"
                                onClick={() => { setCaseIdx(i); setStepIdx(0); setPicked(null); }}
                                className={`shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border ${i === caseIdx ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 border-transparent font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}
                            >
                                {c.title}
                            </button>
                        ))}
                    </div>

                    <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive">{curCase.badge} • ขั้นที่ {stepIdx + 1}/{curCase.steps.length}</span>
                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive mt-0.5">{curCase.title}</h2>
                            <p className="text-xs text-secondary-adaptive mt-1">{curCase.patientSummary}</p>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            {Object.entries(vitals || {}).map(([k, v]) => (
                                <div key={k} className="spatial-soft p-3 rounded-xl text-center">
                                    <span className="font-mono text-[10px] text-muted-adaptive uppercase block">{k}</span>
                                    <span className="font-mono text-sm font-extrabold text-accent-adaptive">{v}</span>
                                </div>
                            ))}
                        </div>

                        <p className="spatial-soft p-4 rounded-2xl text-sm text-primary-adaptive leading-relaxed font-semibold">{step.situation}</p>

                        <div className="space-y-2.5">
                            {step.options.map((opt, idx) => (
                                <button
                                    key={idx}
                                    type="button"
                                    onClick={() => setPicked(idx)}
                                    className={`touch-target w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm transition-all ${
                                        picked === idx
                                            ? opt.correct ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'bg-rose-500/20 border-rose-400 text-rose-200 font-bold'
                                            : 'spatial-soft text-secondary-adaptive'
                                    }`}
                                >
                                    {opt.label}
                                </button>
                            ))}
                        </div>

                        {picked !== null && (
                            <div className={`p-4 rounded-2xl border text-xs sm:text-sm space-y-3 ${step.options[picked]?.correct ? 'bg-aurora-500/15 border-aurora-400/45 text-primary-adaptive' : 'bg-rose-500/15 border-rose-400/45 text-rose-200'}`}>
                                <p className="leading-relaxed">{step.options[picked]?.outcome}</p>
                                {stepIdx + 1 < curCase.steps.length && (
                                    <button type="button" onClick={() => { setStepIdx(s => s + 1); setPicked(null); }} className="px-4 py-2 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs">
                                        ไปสถานการณ์ถัดไป →
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SpacedFlashcardsDeck({ aiRoadmap }) {
            const weakIds = useMemo(() => new Set((aiRoadmap?.weakDomains || []).map(d => d.id)), [aiRoadmap]);
            const cards = useMemo(() => [...SPACED_FLASHCARDS].sort((a, b) => (weakIds.has(b.domain) ? 1 : 0) - (weakIds.has(a.domain) ? 1 : 0)), [weakIds]);
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [mastered, setMastered] = useState({});

            if (cards.length === 0) return <div className="spatial-card rounded-2xl p-6 text-center text-sm text-muted-adaptive">ยังไม่มีการ์ดทบทวนในระบบค่ะ</div>;
            const card = cards[idx % cards.length];
            const dom = CLINICAL_DOMAINS[card.domain];

            return (
                <div className="max-w-2xl mx-auto space-y-4">
                    <div className="flex items-center justify-between text-xs font-bold">
                        <span className="text-prism-adaptive font-mono">การ์ดที่ {(idx % cards.length) + 1} / {cards.length}</span>
                        <span className="text-accent-adaptive">จำได้แล้ว {Object.values(mastered).filter(Boolean).length} / {cards.length} ใบ</span>
                    </div>

                    <button
                        type="button"
                        onClick={() => setFlipped(f => !f)}
                        className="spatial-card w-full min-h-[250px] rounded-[2rem] p-6 sm:p-8 text-center flex flex-col items-center justify-center gap-3 border-prism-400/35 transition-all active:scale-[0.99]"
                    >
                        <span className="px-3 py-1 rounded-full spatial-soft font-mono text-[10px] font-bold" style={{ color: dom?.color || '#34d399' }}>
                            {flipped ? 'คำตอบ / เกณฑ์มาตรฐาน' : (dom?.shortName || 'CLINICAL CARD')} {weakIds.has(card.domain) ? '★ เน้นทบทวน' : ''}
                        </span>
                        <p className="font-display font-bold text-base sm:text-xl text-primary-adaptive whitespace-pre-line leading-relaxed">
                            {flipped ? card.back : card.front}
                        </p>
                        <span className="text-xs text-muted-adaptive mt-2">{flipped ? 'แตะเพื่อพลิกกลับหน้าคำถาม' : 'แตะที่การ์ดเพื่อดูเฉลย'}</span>
                    </button>

                    <div className="grid grid-cols-3 gap-2">
                        <button type="button" onClick={() => { setIdx(i => (i - 1 + cards.length) % cards.length); setFlipped(false); }} className="touch-target spatial-soft rounded-2xl font-bold text-xs text-primary-adaptive">← ก่อนหน้า</button>
                        <button type="button" onClick={() => setMastered(p => ({ ...p, [card.id]: !p[card.id] }))} className={`touch-target rounded-2xl font-bold text-xs ${mastered[card.id] ? 'bg-aurora-500/20 border border-aurora-400 text-accent-adaptive' : 'spatial-soft text-primary-adaptive'}`}>
                            {mastered[card.id] ? 'จำได้แล้ว ✓' : 'ทำเครื่องหมายจำได้'}
                        </button>
                        <button type="button" onClick={() => { setIdx(i => (i + 1) % cards.length); setFlipped(false); }} className="touch-target rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs">ใบถัดไป →</button>
                    </div>
                </div>
            );
        }

        function IndividualCneuLetter({ user, cneuConfig, certTemplate, verifyUrl }) {
            const qrCanvasRef = useRef(null);
            useEffect(() => {
                if (!qrCanvasRef.current || !verifyUrl) return;
                const canvas = qrCanvasRef.current;
                canvas.width = 160;
                canvas.height = 160;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 160, 160);
                if (typeof CERT.drawRealQrOnCanvas === 'function') {
                    CERT.drawRealQrOnCanvas(ctx, verifyUrl, 8, 8, 144, '#0f172a');
                } else if (typeof window.qrcode === 'function') {
                    try {
                        const qr = window.qrcode(0, 'M');
                        qr.addData(String(verifyUrl));
                        qr.make();
                        const count = qr.getModuleCount();
                        const cell = 144 / count;
                        ctx.fillStyle = '#0f172a';
                        for (let r = 0; r < count; r++) {
                            for (let c = 0; c < count; c++) {
                                if (qr.isDark(r, c)) ctx.fillRect(Math.floor(8 + c * cell), Math.floor(8 + r * cell), Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    } catch (_) {}
                }
            }, [verifyUrl]);

            return (
                <article className="cneu-letter-sheet mx-auto rounded-2xl p-6 sm:p-10 space-y-5">
                    <div className="border-b-2 border-slate-800 pb-4 flex items-start justify-between gap-4">
                        <div className="space-y-1">
                            <p className="text-[11px] font-bold text-emerald-800 uppercase tracking-wider">INDIVIDUAL CNEU VERIFICATION CERTIFICATE</p>
                            <h2 className="font-display text-lg sm:text-xl font-extrabold text-slate-900">หนังสือรับรองการสำเร็จการอบรมและหน่วยคะแนน CNEU รายบุคคล</h2>
                            <p className="text-xs font-bold text-slate-700">{cneuConfig.orgName}</p>
                        </div>
                        <div className="text-right shrink-0 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50">
                            <p className="text-[10px] font-bold text-slate-500">รหัสกิจกรรม CNEU</p>
                            <p className="font-mono text-sm font-extrabold text-emerald-800">{cneuConfig.activityCode}</p>
                            <p className="text-xs font-bold text-slate-700">{cneuConfig.cneuCredits} หน่วยคะแนน</p>
                        </div>
                    </div>

                    <div className="text-sm text-slate-800 leading-relaxed space-y-2">
                        <p>หนังสือฉบับนี้ขอรับรองว่า <b>{user?.name || '-'}</b> {user?.nameEN ? `(${user.nameEN})` : ''} เลขที่ใบอนุญาตประกอบวิชาชีพ <b className="font-mono">{user?.license || user?.id || '-'}</b> สังกัด <b>{user?.hospital || '-'}</b> ({user?.department || '-'})</p>
                        <p>ได้สำเร็จการอบรมหลักสูตร <b>{cneuConfig.courseName || certTemplate.courseTitleTH}</b> ({cneuConfig.batchLabel}) ครบถ้วนตามเกณฑ์มาตรฐานของระบบ <b>rjcloud.organ</b> และสมควรได้รับหน่วยคะแนนการศึกษาต่อเนื่องสาขาพยาบาลศาสตร์จำนวน <b>{cneuConfig.cneuCredits} หน่วยคะแนน</b></p>
                    </div>

                    <table className="cneu-evidence-table">
                        <thead>
                            <tr><th>รายการหลักฐานผ่านเกณฑ์</th><th>ผลการประเมิน</th><th>สถานะ</th></tr>
                        </thead>
                        <tbody>

                            <tr><td>2. การฝึกปฏิบัติการสื่อสารในห้องจำลอง AI Skill Lab 3 มิติ</td><td className="font-mono text-center">{typeof user?.skillLabBestScore === 'number' ? `${user.skillLabBestScore}/100` : 'ผ่านการฝึก'}</td><td className="text-center font-bold text-emerald-700">ผ่านเกณฑ์ ✓</td></tr>
                            <tr><td>3. แบบทดสอบหลังเรียน Post-test (เกณฑ์ ≥ {MIN_POSTTEST_PERCENT}%)</td><td className="font-mono text-center">{user?.posttest || '-'} ({parsePosttestPercent(user)}%)</td><td className="text-center font-bold text-emerald-700">ผ่านเกณฑ์ ✓</td></tr>
                        </tbody>
                    </table>

                    <div className="pt-4 grid grid-cols-1 sm:grid-cols-2 gap-6 items-end">
                        <div className="flex items-center gap-3">
                            <canvas ref={qrCanvasRef} className="w-24 h-24 border border-slate-300 rounded-lg bg-white shrink-0" />
                            <div className="text-[11px] text-slate-600 space-y-0.5">
                                <p className="font-bold text-slate-900">ตรวจสอบความถูกต้องด้วย QR Code</p>
                                <p className="font-mono text-emerald-800 font-bold">{user?.certificateCode || 'RJC-2027-DEMO01'}</p>
                                <p>ออกหนังสือรับรอง ณ วันที่ {formatThaiDate(user?.certificateIssuedAt)}</p>
                            </div>
                        </div>
                        <div className="text-center text-xs space-y-1">
                            <p className="text-slate-600">ลงชื่อ ...........................................................</p>
                            <p className="font-bold text-slate-900">( {cneuConfig.approverName || certTemplate.signerName} )</p>
                            <p className="text-slate-600">{cneuConfig.approverPosition || certTemplate.signerPosition}</p>
                        </div>
                    </div>
                </article>
            );
        }

        // ============================================================================
        // 3.5 RJCLOUD.ORGAN 2.0 HERO STAGE (LIVING TREE + LUMINOUS AURA + LIQUID GLASS)
        // ============================================================================
        const HERO_LEFT_LEAVES = [
            { cx: 86, cy: 254, rx: 14, ry: 7, rot: -24 },
            { cx: 104, cy: 282, rx: 13, ry: 6.5, rot: -40 },
            { cx: 78, cy: 220, rx: 14, ry: 7, rot: -8 },
            { cx: 88, cy: 184, rx: 14, ry: 7, rot: 14 },
            { cx: 110, cy: 146, rx: 13, ry: 6.5, rot: 28 },
            { cx: 144, cy: 110, rx: 13, ry: 6.5, rot: 42 },
            { cx: 176, cy: 76, rx: 13, ry: 6.5, rot: 56 },
            { cx: 212, cy: 54, rx: 12, ry: 6, rot: 72 },
            { cx: 136, cy: 174, rx: 11, ry: 5.5, rot: 12 },
            { cx: 152, cy: 210, rx: 11, ry: 5.5, rot: -18 },
            { cx: 192, cy: 134, rx: 11, ry: 5.5, rot: 36 },
            { cx: 222, cy: 98, rx: 11, ry: 5.5, rot: 62 },
            { cx: 122, cy: 240, rx: 12, ry: 6, rot: -25 }
        ];

        const HERO_RIGHT_LEAVES = [
            { cx: 260, cy: 38, rx: 7, ry: 15, rot: 0 },
            { cx: 308, cy: 54, rx: 12, ry: 6, rot: -72 },
            { cx: 344, cy: 76, rx: 13, ry: 6.5, rot: -56 },
            { cx: 376, cy: 110, rx: 13, ry: 6.5, rot: -42 },
            { cx: 410, cy: 146, rx: 13, ry: 6.5, rot: -28 },
            { cx: 432, cy: 184, rx: 14, ry: 7, rot: -14 },
            { cx: 442, cy: 220, rx: 14, ry: 7, rot: 8 },
            { cx: 434, cy: 254, rx: 14, ry: 7, rot: 24 },
            { cx: 416, cy: 282, rx: 13, ry: 6.5, rot: 40 },
            { cx: 384, cy: 174, rx: 11, ry: 5.5, rot: -12 },
            { cx: 368, cy: 210, rx: 11, ry: 5.5, rot: 18 },
            { cx: 328, cy: 134, rx: 11, ry: 5.5, rot: -36 },
            { cx: 298, cy: 98, rx: 11, ry: 5.5, rot: -62 },
            { cx: 398, cy: 240, rx: 12, ry: 6, rot: 25 }
        ];

        function Rjcloud2LandingStage({ onStartLogin, onOpenPdpa }) {
            const heroStageRef = useRef(null);
            const flareCanvasRef = useRef(null);
            const glassStageRef = useRef(null);
            const treeSvgRef = useRef(null);
            const particleLayerRef = useRef(null);
            const leafRefs = useRef([]);
            const heroFitBoxRef = useRef(null);
            const heroFitLine1Ref = useRef(null);
            const heroFitLine2Ref = useRef(null);
            const heroCenterColRef = useRef(null);
            const mobileFitBoxRef = useRef(null);
            const mobileFitLine1Ref = useRef(null);
            const mobileFitLine2Ref = useRef(null);

            const allLeafMeta = useMemo(() => {
                const build = (list, side) => list.map((lf, idx) => ({
                    ...lf,
                    side,
                    dur: `${(3.4 + ((idx * 0.73) % 2.4)).toFixed(2)}s`,
                    del: `${(-((idx * 0.67) % 4.2)).toFixed(2)}s`,
                    flRot: `${((idx % 2 === 0 ? 1 : -1) * (6 + (idx % 5) * 1.4)).toFixed(1)}deg`,
                    flX: `${((side === 'left' ? -1 : 1) * (1.2 + (idx % 3) * 0.5)).toFixed(1)}px`,
                    flY: `${(-1.6 - (idx % 3) * 0.5).toFixed(1)}px`,
                    auraCol: side === 'left' ? 'rgba(232,121,249,0.92)' : 'rgba(94,234,212,0.92)'
                }));
                return {
                    left: build(HERO_LEFT_LEAVES, 'left'),
                    right: build(HERO_RIGHT_LEAVES, 'right')
                };
            }, []);

            // ระบบปล่อยออร่าเรืองแสงออกจากใบไม้ที่พริ้วไหวต่อเนื่อง + ตอบสนองสายลมจากเมาส์
            useEffect(() => {
                const SVG_NS = 'http://www.w3.org/2000/svg';
                const layer = particleLayerRef.current;
                const heroEl = heroStageRef.current;
                const treeEl = treeSvgRef.current;
                if (!layer) return;

                const allNodes = [
                    ...allLeafMeta.left.map((lf, i) => ({ x: lf.cx, y: lf.cy, side: 'left', refIdx: i })),
                    ...allLeafMeta.right.map((lf, i) => ({ x: lf.cx, y: lf.cy, side: 'right', refIdx: allLeafMeta.left.length + i })),
                    { x: 132, y: 208, side: 'heart', refIdx: allLeafMeta.left.length + allLeafMeta.right.length },
                    { x: 172, y: 162, side: 'heart', refIdx: allLeafMeta.left.length + allLeafMeta.right.length + 1 }
                ];

                let activeCount = 0;
                const MAX_PARTICLES = 26;

                const emitAura = (node, boosted) => {
                    if (!layer || !node || document.hidden || activeCount >= MAX_PARTICLES) return;
                    const leafDom = leafRefs.current[node.refIdx];
                    if (leafDom) {
                        leafDom.classList.add('leaf-gust');
                        setTimeout(() => leafDom && leafDom.classList.remove('leaf-gust'), 650);
                    }
                    const gradFill = node.side === 'heart' ? 'url(#auraHeartGrad)' : node.side === 'left' ? 'url(#auraPinkGrad)' : 'url(#auraCyanGrad)';
                    const strokeHex = node.side === 'heart' ? '#fbcfe8' : node.side === 'left' ? '#f0abfc' : '#99f6e4';

                    const ring = document.createElementNS(SVG_NS, 'circle');
                    ring.setAttribute('cx', node.x);
                    ring.setAttribute('cy', node.y);
                    ring.setAttribute('r', boosted ? '12' : '9');
                    ring.setAttribute('fill', 'none');
                    ring.setAttribute('stroke', strokeHex);
                    ring.setAttribute('stroke-width', boosted ? '1.8' : '1.2');
                    ring.setAttribute('class', 'aura-ring-burst');
                    layer.appendChild(ring);
                    activeCount++;
                    setTimeout(() => { if (ring.parentNode) ring.parentNode.removeChild(ring); activeCount = Math.max(0, activeCount - 1); }, 1400);

                    const count = boosted ? 2 : 1;
                    for (let i = 0; i < count; i++) {
                        const wisp = document.createElementNS(SVG_NS, 'circle');
                        const dx = `${((Math.random() - 0.5) * 34).toFixed(1)}px`;
                        const durSec = (2.1 + Math.random() * 1.2).toFixed(2);
                        wisp.setAttribute('cx', (node.x + (Math.random() - 0.5) * 10).toFixed(1));
                        wisp.setAttribute('cy', (node.y + (Math.random() - 0.5) * 6).toFixed(1));
                        wisp.setAttribute('r', (boosted ? 8 + Math.random() * 5 : 6 + Math.random() * 4.5).toFixed(1));
                        wisp.setAttribute('fill', gradFill);
                        wisp.setAttribute('class', 'aura-wisp');
                        wisp.style.setProperty('--dx', dx);
                        wisp.style.setProperty('--wisp-dur', `${durSec}s`);
                        layer.appendChild(wisp);
                        activeCount++;
                        setTimeout(() => { if (wisp.parentNode) wisp.parentNode.removeChild(wisp); activeCount = Math.max(0, activeCount - 1); }, Number(durSec) * 1000 + 120);
                    }
                };

                const timer = setInterval(() => {
                    if (document.hidden) return;
                    emitAura(allNodes[Math.floor(Math.random() * allNodes.length)], false);
                }, 400);

                let lastBreeze = 0;
                const handleMove = (e) => {
                    const now = Date.now();
                    if (now - lastBreeze < 180 || !treeEl) return;
                    const rect = treeEl.getBoundingClientRect();
                    if (rect.width <= 0 || e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;
                    lastBreeze = now;
                    const sx = ((e.clientX - rect.left) / rect.width) * 520;
                    const sy = ((e.clientY - rect.top) / rect.height) * 374;
                    let nearest = null, best = 92;
                    for (let i = 0; i < allNodes.length; i++) {
                        const d = Math.hypot(allNodes[i].x - sx, allNodes[i].y - sy);
                        if (d < best) { best = d; nearest = allNodes[i]; }
                    }
                    if (nearest) emitAura(nearest, true);
                };

                if (heroEl) heroEl.addEventListener('mousemove', handleMove);
                return () => {
                    clearInterval(timer);
                    if (heroEl) heroEl.removeEventListener('mousemove', handleMove);
                };
            }, [allLeafMeta]);

            // ระบบ Solar Flare Style 03: Eclipse Arc ความเข้มแสง 80% + Optical Parallax ลื่นไหล 60FPS
            useEffect(() => {
                const canvas = flareCanvasRef.current;
                const heroEl = heroStageRef.current;
                if (!canvas || !heroEl) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const ECLIPSE_INTENSITY = 0.80;
                const flareState = {
                    targetMouseX: 0,
                    targetMouseY: 0,
                    mouseX: 0,
                    mouseY: 0,
                    w: window.innerWidth,
                    h: window.innerHeight
                };

                const resizeCanvas = () => {
                    const rect = heroEl.getBoundingClientRect();
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    flareState.w = Math.max(1, rect.width);
                    flareState.h = Math.max(1, rect.height);
                    canvas.width = Math.round(flareState.w * dpr);
                    canvas.height = Math.round(flareState.h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                };

                const drawHexagon = (c, x, y, r, rot, fillStyle, strokeStyle, lineW) => {
                    c.save();
                    c.translate(x, y);
                    c.rotate(rot);
                    c.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const ang = (Math.PI / 3) * i;
                        const px = Math.cos(ang) * r;
                        const py = Math.sin(ang) * r;
                        if (i === 0) c.moveTo(px, py);
                        else c.lineTo(px, py);
                    }
                    c.closePath();
                    if (fillStyle) { c.fillStyle = fillStyle; c.fill(); }
                    if (strokeStyle) { c.strokeStyle = strokeStyle; c.lineWidth = lineW || 1; c.stroke(); }
                    c.restore();
                };

                const drawSoftOrb = (c, x, y, r, stops) => {
                    const g = c.createRadialGradient(x, y, 0, x, y, r);
                    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
                    c.fillStyle = g;
                    c.beginPath();
                    c.arc(x, y, r, 0, Math.PI * 2);
                    c.fill();
                };

                const drawAnamorphicStreak = (c, x, y, halfLen, height, colorStops) => {
                    c.save();
                    c.translate(x, y);
                    const g = c.createLinearGradient(-halfLen, 0, halfLen, 0);
                    for (let i = 0; i < colorStops.length; i++) g.addColorStop(colorStops[i][0], colorStops[i][1]);
                    c.fillStyle = g;
                    c.beginPath();
                    c.ellipse(0, 0, halfLen, height, 0, 0, Math.PI * 2);
                    c.fill();
                    c.restore();
                };

                const drawVolumetricRays = (c, x, y, maxR, rayCount, t, alphaScale) => {
                    c.save();
                    c.translate(x, y);
                    for (let i = 0; i < rayCount; i++) {
                        const seed = i * 1.6180339;
                        const baseAng = (i / rayCount) * Math.PI * 2 + Math.sin(t * 0.14 + seed) * 0.08 + t * 0.018;
                        const spread = 0.022 + (i % 3) * 0.016;
                        const len = maxR * (0.52 + 0.42 * (0.5 + 0.5 * Math.sin(t * 0.65 + seed * 3.1)));
                        const rayAlpha = (0.045 + 0.04 * Math.sin(t * 0.9 + seed * 2.3)) * alphaScale;
                        if (rayAlpha <= 0.002) continue;

                        c.save();
                        c.rotate(baseAng);
                        const rg = c.createLinearGradient(0, 0, len, 0);
                        if (i % 2 === 0) {
                            rg.addColorStop(0, `rgba(255, 249, 214, ${(rayAlpha * 1.65).toFixed(4)})`);
                            rg.addColorStop(0.35, `rgba(253, 211, 128, ${(rayAlpha * 0.72).toFixed(4)})`);
                            rg.addColorStop(1, 'rgba(56, 189, 248, 0)');
                        } else {
                            rg.addColorStop(0, `rgba(224, 247, 255, ${(rayAlpha * 1.45).toFixed(4)})`);
                            rg.addColorStop(0.4, `rgba(125, 211, 252, ${(rayAlpha * 0.65).toFixed(4)})`);
                            rg.addColorStop(1, 'rgba(129, 140, 248, 0)');
                        }
                        c.fillStyle = rg;
                        c.beginPath();
                        c.moveTo(0, 0);
                        c.lineTo(len, -Math.tan(spread) * len);
                        c.lineTo(len, Math.tan(spread) * len);
                        c.closePath();
                        c.fill();
                        c.restore();
                    }
                    c.restore();
                };

                const drawOpticalGhosts = (c, sx, sy, cx, cy, alpha) => {
                    const dx = cx - sx;
                    const dy = cy - sy;
                    const ghosts = [
                        { pos: 0.42, r: 22, type: 'ring', col: `rgba(125, 211, 252, ${(0.16 * alpha).toFixed(3)})` },
                        { pos: 0.68, r: 44, type: 'hex', col: `rgba(253, 224, 71, ${(0.065 * alpha).toFixed(3)})`, stroke: `rgba(254, 240, 138, ${(0.16 * alpha).toFixed(3)})` },
                        { pos: 0.95, r: 16, type: 'dot', col: `rgba(167, 243, 208, ${(0.24 * alpha).toFixed(3)})` },
                        { pos: 1.24, r: 64, type: 'halo', col1: `rgba(56, 189, 248, ${(0.06 * alpha).toFixed(3)})`, col2: `rgba(232, 121, 249, ${(0.09 * alpha).toFixed(3)})` },
                        { pos: 1.56, r: 28, type: 'hex', col: `rgba(103, 232, 249, ${(0.08 * alpha).toFixed(3)})`, stroke: `rgba(186, 230, 253, ${(0.20 * alpha).toFixed(3)})` },
                        { pos: 1.88, r: 12, type: 'dot', col: `rgba(254, 243, 199, ${(0.22 * alpha).toFixed(3)})` }
                    ];
                    ghosts.forEach((g, i) => {
                        const gx = sx + dx * g.pos;
                        const gy = sy + dy * g.pos;
                        if (g.type === 'hex') {
                            drawHexagon(c, gx, gy, g.r, 0.25 + i * 0.2, g.col, g.stroke, 1.1);
                        } else if (g.type === 'ring') {
                            c.save();
                            c.strokeStyle = g.col;
                            c.lineWidth = 1.6;
                            c.beginPath();
                            c.arc(gx, gy, g.r, 0, Math.PI * 2);
                            c.stroke();
                            c.restore();
                        } else if (g.type === 'halo') {
                            drawSoftOrb(c, gx, gy, g.r, [
                                [0, 'rgba(255,255,255,0)'],
                                [0.62, g.col1],
                                [0.84, g.col2],
                                [1, 'rgba(0,0,0,0)']
                            ]);
                        } else {
                            drawSoftOrb(c, gx, gy, g.r, [[0, g.col], [1, 'rgba(0,0,0,0)']]);
                        }
                    });
                };

                const onMouseMove = (e) => {
                    flareState.targetMouseX = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
                    flareState.targetMouseY = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
                };
                const onTouchMove = (e) => {
                    if (!e.touches || !e.touches[0]) return;
                    flareState.targetMouseX = (e.touches[0].clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
                    flareState.targetMouseY = (e.touches[0].clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
                };

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('touchmove', onTouchMove, { passive: true });

                let ro = null;
                if (typeof ResizeObserver !== 'undefined') {
                    ro = new ResizeObserver(resizeCanvas);
                    ro.observe(heroEl);
                }

                let rafId = null;
                const render = (now) => {
                    rafId = requestAnimationFrame(render);
                    if (document.hidden) return;
                    const w = flareState.w;
                    const h = flareState.h;
                    ctx.clearRect(0, 0, w, h);

                    flareState.mouseX += (flareState.targetMouseX - flareState.mouseX) * 0.055;
                    flareState.mouseY += (flareState.targetMouseY - flareState.mouseY) * 0.055;

                    const t = now * 0.001;
                    const k = ECLIPSE_INTENSITY * (0.92 + 0.08 * Math.sin(t * 1.15));
                    const minDim = Math.min(w, h);
                    const cx = w * 0.5;
                    const cy = h * 0.5;

                    ctx.globalCompositeOperation = 'lighter';

                    // Style 03: Luxury Eclipse Horizon Arc (ความเข้มแสง 80%)
                    const arcR = Math.max(w * 0.62, 540);
                    const arcCx = w * 0.5 + flareState.mouseX * 14;
                    const arcCy = h * 0.22 + arcR + flareState.mouseY * 10;

                    ctx.save();
                    const arcGrad = ctx.createLinearGradient(w * 0.14, h * 0.22, w * 0.86, h * 0.22);
                    arcGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
                    arcGrad.addColorStop(0.25, `rgba(56, 189, 248, ${(0.32 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.46, `rgba(186, 230, 253, ${(0.72 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.52, `rgba(255, 250, 215, ${(0.98 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.62, `rgba(110, 231, 183, ${(0.58 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.82, `rgba(129, 140, 248, ${(0.22 * k).toFixed(3)})`);
                    arcGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');

                    ctx.strokeStyle = arcGrad;
                    ctx.lineWidth = 14;
                    ctx.filter = 'blur(10px)';
                    ctx.beginPath();
                    ctx.arc(arcCx, arcCy, arcR, Math.PI * 1.28, Math.PI * 1.72);
                    ctx.stroke();

                    ctx.filter = 'none';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(arcCx, arcCy, arcR, Math.PI * 1.30, Math.PI * 1.70);
                    ctx.stroke();
                    ctx.restore();

                    const fx = arcCx + Math.sin(t * 0.22) * Math.min(w * 0.06, 55);
                    const fy = arcCy - Math.sqrt(Math.max(0, arcR * arcR - Math.pow(fx - arcCx, 2)));

                    drawSoftOrb(ctx, fx, fy, minDim * 0.34, [
                        [0, `rgba(255, 254, 244, ${(0.92 * k).toFixed(3)})`],
                        [0.12, `rgba(254, 240, 178, ${(0.56 * k).toFixed(3)})`],
                        [0.34, `rgba(125, 211, 252, ${(0.22 * k).toFixed(3)})`],
                        [1, 'rgba(0, 0, 0, 0)']
                    ]);
                    drawAnamorphicStreak(ctx, fx, fy, w * 0.42, 3.2, [
                        [0, 'rgba(125, 211, 252, 0)'],
                        [0.35, `rgba(125, 211, 252, ${(0.36 * k).toFixed(3)})`],
                        [0.5, `rgba(255, 255, 255, ${(0.96 * k).toFixed(3)})`],
                        [0.65, `rgba(253, 224, 71, ${(0.36 * k).toFixed(3)})`],
                        [1, 'rgba(125, 211, 252, 0)']
                    ]);
                    drawVolumetricRays(ctx, fx, fy, minDim * 0.36, 10, t, k * 0.72);
                    drawOpticalGhosts(ctx, fx, fy, cx, cy, k * 0.6);
                };
                rafId = requestAnimationFrame(render);

                return () => {
                    if (rafId) cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', resizeCanvas);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('touchmove', onTouchMove);
                    if (ro) ro.disconnect();
                };
            }, []);

            // ระบบปรับขนาดข้อความให้เต็มความกว้างกรอบกระจก Slim ซ้าย-ขวาอัตโนมัติทั้งคอมพิวเตอร์และมือถือ
            useEffect(() => {
                const fitLineToWidth = (el, targetW, minPx, maxPx) => {
                    if (!el || targetW <= 0) return minPx;
                    el.style.fontSize = '32px';
                    const measured = el.scrollWidth;
                    if (!measured) return minPx;
                    const ideal = (targetW / measured) * 32;
                    const clamped = Math.max(minPx, Math.min(maxPx, ideal));
                    el.style.fontSize = `${clamped.toFixed(2)}px`;
                    return clamped;
                };

                const fitHeroTextToGlass = () => {
                    const box = heroFitBoxRef.current;
                    const line1 = heroFitLine1Ref.current;
                    const line2 = heroFitLine2Ref.current;
                    const centerCol = heroCenterColRef.current;
                    if (box && line1 && box.clientWidth > 0) {
                        const targetW = box.clientWidth * 0.99;
                        fitLineToWidth(line1, targetW, 16, 36);
                        if (line2) {
                            const colW = centerCol && centerCol.clientWidth > 0 ? centerCol.clientWidth * 0.94 : targetW * 0.49;
                            fitLineToWidth(line2, Math.min(targetW * 0.49, colW), 16, 34);
                        }
                    }

                    const mBox = mobileFitBoxRef.current;
                    const mLine1 = mobileFitLine1Ref.current;
                    const mLine2 = mobileFitLine2Ref.current;
                    if (mBox && mLine1 && mLine2 && mBox.clientWidth > 0) {
                        const mTargetW = mBox.clientWidth * 0.98;
                        fitLineToWidth(mLine1, mTargetW, 13, 21);
                        fitLineToWidth(mLine2, mTargetW * 0.49, 15, 24);
                    }
                };

                fitHeroTextToGlass();
                const raf = requestAnimationFrame(fitHeroTextToGlass);
                window.addEventListener('resize', fitHeroTextToGlass);
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(fitHeroTextToGlass).catch(() => {});
                }

                let ro = null;
                if (typeof ResizeObserver !== 'undefined') {
                    ro = new ResizeObserver(fitHeroTextToGlass);
                    if (glassStageRef.current) ro.observe(glassStageRef.current);
                    if (mobileFitBoxRef.current) ro.observe(mobileFitBoxRef.current);
                }

                return () => {
                    cancelAnimationFrame(raf);
                    window.removeEventListener('resize', fitHeroTextToGlass);
                    if (ro) ro.disconnect();
                };
            }, []);

            const handleGlassMouseMove = (e) => {
                const el = glassStageRef.current;
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const px = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
                const py = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
                el.style.setProperty('--gx', `${px.toFixed(1)}%`);
                el.style.setProperty('--gy', `${py.toFixed(1)}%`);
            };

            const handleGlassMouseLeave = () => {
                const el = glassStageRef.current;
                if (!el) return;
                el.style.setProperty('--gx', '32%');
                el.style.setProperty('--gy', '28%');
            };

            return (
                <div className="relative z-10 flex-1 flex flex-col">
                    {/* SVG ClipPath สำหรับกรอบกระจก Liquid Glass แบบ Slim ชิดปุ่มด้านล่าง (760x208) */}
                    <svg width="0" height="0" className="absolute pointer-events-none" aria-hidden="true">
                        <defs>
                            <clipPath id="liquidGlassClipNorm" clipPathUnits="objectBoundingBox">
                                <path d="M 0.0368,0.0192 L 0.7079,0.0192 Q 0.7395,0.0192 0.7395,0.1346 L 0.7395,0.2692 Q 0.7395,0.3846 0.7711,0.3846 L 0.9632,0.3846 Q 0.9947,0.3846 0.9947,0.5000 L 0.9947,0.8654 Q 0.9947,0.9808 0.9632,0.9808 L 0.2763,0.9808 Q 0.2447,0.9808 0.2447,0.8654 L 0.2447,0.6635 Q 0.2447,0.5481 0.2132,0.5481 L 0.0368,0.5481 Q 0.0053,0.5481 0.0053,0.4327 L 0.0053,0.1346 Q 0.0053,0.0192 0.0368,0.0192 Z" />

                            <span className="twinkle-star top-[5%] left-[63%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '3.4s', '--tw-del': '2.1s' }} />
                            <span className="twinkle-star top-[14%] left-[78%] w-[2px] h-[2px]" style={{ '--tw-dur': '4.9s', '--tw-del': '0.6s' }} />
                            <span className="twinkle-star top-[9%] left-[91%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '4.1s', '--tw-del': '1.7s' }} />
                            <span className="twinkle-star top-[22%] left-[8%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '5.5s', '--tw-del': '2.5s' }} />
                            <span className="twinkle-star top-[18%] left-[35%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '3.9s', '--tw-del': '1.1s' }} />

                            <span className="shooting-star top-[12%] left-[92%]" style={{ '--len': '185px', '--ang': '-34deg', '--m-dur': '8.4s', '--m-del': '2.7s', '--trail-col': 'rgba(110,231,183,0.78)' }} />
                            <span className="shooting-star top-[4%] left-[46%]" style={{ '--len': '135px', '--ang': '-28deg', '--m-dur': '9.6s', '--m-del': '4.9s', '--trail-col': 'rgba(232,121,249,0.75)' }} />

                            <span className="ambient-dot absolute top-[26%] left-[52%] w-1 h-1 rounded-full bg-white" style={{ '--dur': '5.8s', '--del': '0.8s' }} />
                            <span className="ambient-dot absolute top-[52%] right-[14%] w-1.5 h-1.5 rounded-full bg-emerald-200 blur-[0.5px]" style={{ '--dur': '7.6s', '--del': '1.5s' }} />

                                            <g className="tree-living-root">
                                                <path d="M168 368 C215 350 246 316 252 258 C258 210 228 176 190 152" stroke="url(#trunkGrad)" strokeWidth="8" strokeLinecap="round" opacity="0.9" />

                                                {/* กิ่งซ้าย + ใบไม้ม่วง-ชมพู-หัวใจ */}

                                                    <g stroke="url(#leftBranchGrad)" strokeLinecap="round" opacity="0.92">
                                                        <path d="M248 240 C200 223 148 230 104 250" strokeWidth="4.5" />
                                                        <path d="M242 210 C188 186 140 183 96 196" strokeWidth="4.5" />
                                                        <path d="M245 180 C202 143 162 126 128 132" strokeWidth="4" />
                                                        <path d="M254 150 C228 110 206 84 184 72" strokeWidth="3.8" />
                                                        <path d="M190 196 C166 170 152 154 146 140" strokeWidth="2.8" />
                                                        <path d="M172 230 C148 250 132 264 118 272" strokeWidth="2.6" />
                                                    </g>
                                                    <g opacity="0.95">
                                                        {allLeafMeta.left.map((lf, i) => (
                                                            <circle key={`la-${i}`} cx={lf.cx} cy={lf.cy} r={Math.max(lf.rx, lf.ry) * 1.65} fill="url(#auraPinkGrad)" className="leaf-aura-halo" style={{ '--dur': lf.dur, '--del': lf.del }} />
                                                        ))}
                                                    </g>
                                                    <g>
                                                        {allLeafMeta.left.map((lf, i) => (
                                                            <g key={`ls-${i}`} transform={`rotate(${lf.rot} ${lf.cx} ${lf.cy})`}>
                                                                <ellipse
                                                                    ref={el => { leafRefs.current[i] = el; }}
                                                                    cx={lf.cx} cy={lf.cy} rx={lf.rx} ry={lf.ry} fill="#c668d4" opacity="0.96"
                                                                    className="living-leaf"
                                                                    style={{ '--dur': lf.dur, '--del': lf.del, '--fl-rot': lf.flRot, '--fl-x': lf.flX, '--fl-y': lf.flY, '--aura-col': lf.auraCol }}
                                                                />

                                                    </g>
                                                    <g className="leaf-aura-halo" style={{ '--dur': '4.6s', '--del': '0.4s' }}><circle cx="132" cy="208" r="20" fill="url(#auraHeartGrad)" /></g>
                                                    <g className="leaf-aura-halo" style={{ '--dur': '5.1s', '--del': '1.8s' }}><circle cx="172" cy="162" r="20" fill="url(#auraHeartGrad)" /></g>
                                                    <g stroke="#f0abfc" strokeWidth="2" fill="rgba(217,70,239,0.34)">
                                                        <path ref={el => { leafRefs.current[allLeafMeta.left.length + allLeafMeta.right.length] = el; }} className="living-leaf" style={{ '--dur': '4.6s', '--del': '0.4s', '--fl-rot': '9deg', '--aura-col': 'rgba(244,114,182,0.95)' }} d="M132 202 C128 196 118 198 120 206 C122 212 132 218 132 218 C132 218 142 212 144 206 C146 198 136 196 132 202 Z" />
                                                        <path ref={el => { leafRefs.current[allLeafMeta.left.length + allLeafMeta.right.length + 1] = el; }} className="living-leaf" style={{ '--dur': '5.1s', '--del': '1.8s', '--fl-rot': '-8deg', '--aura-col': 'rgba(244,114,182,0.95)' }} d="M172 156 C168 150 158 152 160 160 C162 166 172 172 172 172 C172 172 182 166 184 160 C186 152 176 150 172 156 Z" />
                                                    </g>

                                                                />
