    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        function saveSessionTwoLayer(userObj) {
            if (!userObj?.id) return;
            const payload = JSON.stringify({ user: userObj, savedAt: Date.now() });
            try { localStorage.setItem(STORAGE_KEY, payload); } catch (_) {}
            try { sessionStorage.setItem(SESSION_BACKUP_KEY, payload); } catch (_) {}
        }

        function loadSessionTwoLayer() {
            const stores = [
                { store: localStorage, key: STORAGE_KEY },
                { store: sessionStorage, key: SESSION_BACKUP_KEY }
            ];
            for (const s of stores) {
                try {
                    const parsed = JSON.parse(s.store.getItem(s.key) || 'null');
                    if (parsed?.user?.id) return parsed.user;
                } catch (_) {}
            }
            return null;
        }

        function clearSessionTwoLayer() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
            try { sessionStorage.removeItem(SESSION_BACKUP_KEY); } catch (_) {}
        }

            const exempt = isHoursExemptUser(u);
            const pct = Math.max(Number(u.progress || 0), Number(livePercent || 0));
            const studyEnough = exempt || pct >= MIN_STUDY_PERCENT;
            const labDone = Boolean(u.skillLabPassed || (Array.isArray(u.skillLabHistory) && u.skillLabHistory.length > 0));
            const bestLab = Number(u.skillLabBestScore || 0);
            const passed = parsePosttestPassed(u) || Boolean(u.certificateCode);

            const activityName = exempt

            const activityMeta = [u.hoursActivityDate, u.hoursActivityVenue].filter(Boolean).join(' • ');
            const hoursLabel = exempt ? 'ชั่วโมงครบ (เทียบโอน)' : (studyEnough ? 'ชั่วโมงครบ' : `กำลังสะสมชั่วโมง (${Math.round(pct)}%)`);

            if (passed && bestLab >= 85) statusLabel = 'ผู้เชี่ยวชาญคลินิก';
            else if (passed) statusLabel = 'สำเร็จหลักสูตร';

        function computeSusScore(ans) {
            let sum = 0, cnt = 0;
            SUS_ITEMS.forEach(it => {
                const v = Number(ans[it.key]);
                if (v >= 1 && v <= 5) { sum += it.positive ? (v - 1) : (5 - v); cnt += 1; }
            });
            return cnt > 0 ? Math.round((sum / (cnt * 4)) * 100) : 85;

        function buildAnonTelemetryId(rawId) {

            let h = 2166136261;
            for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }

        // ============================================================================
        // 3. STUDIO 24kHz AI VOICE HELPERS (AUTO-PLAY + REPLAY • NO SUBTITLES)
        // ============================================================================
        function pcmToWavBlobSafe(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = Math.max(0, bytes.length - off);
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return new Blob([buf], { type: 'audio/wav' });
            } catch (_) { return null; }
        }

        function splitSpeechChunks(rawText, maxChars = 185) {
            let clean = String(rawText || '').replace(/[*#_]/g, ' ').replace(/\s{2,}/g, ' ').trim();
            if (typeof CORE.prepareNaturalThaiSpeech === 'function') clean = CORE.prepareNaturalThaiSpeech(clean);
            if (!clean) return [];
            if (clean.length <= maxChars) return [clean];
            const marked = clean.replace(/([.!?。\n]|ค่ะ|ครับ)\s+/g, '$1\u0001');
            const pieces = marked.split('\u0001').map(s => s.trim()).filter(Boolean);
            const chunks = [];
            let buf = '';
            pieces.forEach(p => {
                if ((buf + ' ' + p).trim().length <= maxChars) buf = (buf ? `${buf} ${p}` : p).trim();
                else { if (buf) chunks.push(buf); buf = p.trim(); }
            });
            if (buf) chunks.push(buf);
            return chunks.filter(Boolean);
        }

        async function fetchStudioTtsBlob({ appsScriptUrl, text, signal, cacheKey = '' }) {
            if (cacheKey && typeof CORE.getCachedAudio === 'function') {
                try { const hit = await CORE.getCachedAudio(cacheKey); if (hit && hit.size > 0) return hit; } catch (_) {}
            }
            if (!appsScriptUrl || !navigator.onLine) return null;
            for (let attempt = 0; attempt < 2; attempt++) {
                if (signal && signal.aborted) return null;
                const ctrl = new AbortController();
                const onExtAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onExtAbort, { once: true });
                const tm = setTimeout(() => ctrl.abort(), 45000);
                try {
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'callGeminiTTS', text, voiceName: 'Sulafat', languageCode: 'th-TH',
                            style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ เป็นมิตรเหมือนอาจารย์ผู้ช่วยดูแลผู้เรียน'
                        }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onExtAbort);
                    if (signal && signal.aborted) return null;
                    const res = JSON.parse((await rawRes.text()) || '{}');
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rateMatch = String(res.inlineData.mimeType || '').match(/rate=(\d+)/);
                        const blob = pcmToWavBlobSafe(res.inlineData.data, parseInt(rateMatch ? rateMatch[1] : '24000', 10));
                        if (blob && blob.size > 0) {
                            if (cacheKey && typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(cacheKey, blob).catch(() => {});
                            return blob;
                        }
                    }
                } catch (_) {
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onExtAbort);
                }
                if (attempt === 0 && !(signal && signal.aborted)) await new Promise(r => setTimeout(r, 1100));
            }
            return null;
        }

        // ============================================================================
        // 5. MAIN LEARNER APPLICATION (PROFESSION-AWARE CNEU • 5-STEP WORKFLOW)
        // ============================================================================
        function MainApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const adminPreviewScreen = urlParams.get('admin_preview') || '';
            const isAdminPreview = Boolean(adminPreviewScreen);
            const returnParam = urlParams.get('return') || '';
            const incomingLicense = urlParams.get('license') || '';

            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020612' : '#edf6fd');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // Cloud Config States
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [certTemplate, setCertTemplate] = useState(() => ({ ...DEFAULT_CERT_TEMPLATE }));
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษ 2027', url: '', documentUrl: '' });
            const [onsiteGlobalCfg, setOnsiteGlobalCfg] = useState({ forceUnlocked: false, unlockAt: '' });
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : BUILTIN_LESSONS));
            const [questions, setQuestions] = useState(() => (Array.isArray(window.QUIZ_QUESTIONS_RAW) && window.QUIZ_QUESTIONS_RAW.length > 0 ? parseRawExams(window.QUIZ_QUESTIONS_RAW) : BUILTIN_QUESTIONS));

            // Learner Session (2-Layer Recovery — ป้องกันเด้งกลับหน้าต้นไม้เมื่อกลับมาจาก AI Skill Lab)
            const [user, setUser] = useState(() => {
                if (isAdminPreview) {
                    return {
                        id: '4511128901', license: '4511128901', name: 'พว.กัญญารัตน์ วัฒนากูล', nameEN: 'Kanyarat Wattanakul, RN',
                        professionGroup: 'พยาบาล', cneuEligible: true, email: 'kanyarat@demo.go.th', phone: '0812345678',
                        position: 'พยาบาลวิชาชีพชำนาญการ (TC)', department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)',
                        hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร', userType: 'เรียนต่อเนื่อง', studyHoursExempt: true,
                        progress: 100, hoursActivityName: 'การอบรมเชิงปฏิบัติการการรับบริจาคและปลูกถ่ายอวัยวะ รุ่นที่ 1/2570',
                        pretest: '30/40', posttest: '37/40', status: 'ผ่าน', skillLabPassed: true, skillLabBestScore: 92,
                        certificateClaimed: true, certificateCode: 'RJC-2027-DEMO01', certificateIssuedAt: new Date().toISOString()
                    };
                }
                return loadSessionTwoLayer();
            });

            const [screen, setScreen] = useState(() => {
                if (adminPreviewScreen) {
                    if (adminPreviewScreen.startsWith('auth')) return 'auth';
                    if (['pretest', 'dashboard', 'posttest', 'cert_confirm', 'certificate'].includes(adminPreviewScreen)) return adminPreviewScreen;
                    if (adminPreviewScreen === 'live' || adminPreviewScreen === 'profile') return 'dashboard';
                    return 'landing';
                }
                const saved = loadSessionTwoLayer();
                if (returnParam === 'dashboard' && saved?.id) return 'dashboard';
                if (incomingLicense) return 'auth';
                return 'landing';
            });

            const [dashTab, setDashTab] = useState(() => {
                if (adminPreviewScreen === 'live') return 'live';
                if (adminPreviewScreen === 'profile') return 'profile';
                return 'lessons';
            });

            // Auth Wizard 3 Steps State
            const [authStep, setAuthStep] = useState(() => {
                if (adminPreviewScreen === 'auth2') return 2;
                if (adminPreviewScreen === 'auth3') return 3;
                return 1;
            });
            const [licenseInput, setLicenseInput] = useState(incomingLicense || '');
            const [authBusy, setAuthBusy] = useState(false);
            const [existingCloudRecord, setExistingCloudRecord] = useState(null);
            const [authProfile, setAuthProfile] = useState({
                name: '', nameEN: '', email: '', phone: '', position: '',
                professionGroup: '', department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)',
                hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร', userType: 'เรียนใหม่',
                hoursActivityName: '', pdpaAccepted: true
            });
            const [otpInput, setOtpInput] = useState('');
            const [generatedDemoOtp, setGeneratedDemoOtp] = useState('');

            // Learning & Quiz State
            const [currentLessonIdx, setCurrentLessonIdx] = useState(0);
            const [studySeconds, setStudySeconds] = useState(() => Number(loadSessionTwoLayer()?.studySeconds || 0));
            const [quizAnswers, setQuizAnswers] = useState({});
            const [aiTutorQ, setAiTutorQ] = useState('');
            const [aiTutorReply, setAiTutorReply] = useState('');
            const [aiTutorBusy, setAiTutorBusy] = useState(false);

            // Profile PDPA Self-Service Edit State
            const [editProfileOpen, setEditProfileOpen] = useState(false);
            const [editForm, setEditForm] = useState({ professionGroup: 'พยาบาล', name: '', nameEN: '', position: '', hospital: '', phone: '' });

            // Step 5 Cert Confirm + CSAT + SUS State
            const [certNameTH, setCertNameTH] = useState('');
            const [certNameEN, setCertNameEN] = useState('');
            const [certHospital, setCertHospital] = useState('');
            const [csatScores, setCsatScores] = useState({ content: 5, speaker: 5, platform: 5, aiLab: 5, application: 5 });
            const [susAnswers, setSusAnswers] = useState({ s1: 5, s2: 1, s3: 5, s4: 1, s5: 5 });

            // Audio Voice Guide State (Audio-Only • No Subtitles)
            const [ttsState, setTtsState] = useState({ activeKey: '', status: 'idle' });
            const [nowMs, setNowMs] = useState(Date.now());
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            // Refs
            const certCanvasRef = useRef(null);
            const sharedAudioRef = useRef(null);
            const ttsUrlRef = useRef(null);
            const ttsSessionRef = useRef(0);
            const ttsAbortRef = useRef(null);
            const autoPlayedStepsRef = useRef(new Set());

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            useEffect(() => {
                const el = document.getElementById('app-root');
                if (el) el.dataset.mounted = 'true';
                const timer = setInterval(() => setNowMs(Date.now()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Sync Keynote Launch Curtain (Landing only)
            useEffect(() => {
                if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.sync === 'function') {
                    window.RJCLOUD_KEYNOTE.sync({ isLanding: screen === 'landing', appsScriptUrl, isAdminPreview });
                }
            }, [screen, appsScriptUrl, isAdminPreview]);

            // Firebase Auth + Live Settings & Learner Sync
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let unsubSettings = null;
                let unsubContent = null;
                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser && !isAdminPreview) {
                        try { await signInAnonymously(fbAuth); } catch (_) {}
                        return;
                    }
                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                        if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                        if (d.onsiteConfig) setOnsiteGlobalCfg(p => ({ ...p, ...d.onsiteConfig }));
                    }, () => {});

                    if (unsubContent) unsubContent();
                    unsubContent = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                        if (d.questionSets && d.questionSets['0'] && d.questionSets['0'].length > 0) setQuestions(d.questionSets['0']);
                    }, () => {});
                });
                return () => { active = false; unsubAuth(); if (unsubSettings) unsubSettings(); if (unsubContent) unsubContent(); };
            }, [isAdminPreview]);

            // ซิงค์ข้อมูลผู้เรียนล่าสุดจาก Cloud อัตโนมัติ (รับสถานะ skillLabPassed เมื่อกลับมาจาก aiskilllab.html)
            useEffect(() => {
                if (isAdminPreview || !user?.id || !fbDb) return;
                const unsub = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id)), (snap) => {
                    if (!snap.exists()) return;
                    const cloudUser = { id: snap.id, ...snap.data() };
                    setUser(prev => {
                        const merged = { ...(prev || {}), ...cloudUser };
                        saveSessionTwoLayer(merged);
                        return merged;
                    });
                }, () => {});
                return () => { try { unsub(); } catch (_) {} };
            }, [user?.id, isAdminPreview]);

            // Sync Cert Confirm fields when entering cert_confirm
            useEffect(() => {
                if (screen === 'cert_confirm' && user) {
                    setCertNameTH(user.name || '');
                    setCertNameEN(user.nameEN || '');
                    setCertHospital(user.hospital || '');
                }
            }, [screen, user]);

            // Derived Learner Status & Profession-Aware Credit Meta
            const targetStudySeconds = Math.max(60, Number(liveConfig.hours || 8) * 60); // 1 ชม. = 60 วิในโหมดจำลอง หรือใช้ % จาก Cloud
            const isExemptHours = isHoursExemptUser(user);
            const liveStudyPercent = isExemptHours ? 100 : Math.min(100, Math.max(Number(user?.progress || 0), Math.round((studySeconds / targetStudySeconds) * 100)));
            const isStudyEnough = isExemptHours || liveStudyPercent >= MIN_STUDY_PERCENT;
            const isLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const isPostPassed = parsePosttestPassed(user);
            const canTakePosttest = Boolean(isAdminPreview || liveConfig.allowPosttest || (isStudyEnough && isLabDone));
            const statusInfo = useMemo(() => resolveLearnerStatusInfo(user, liveStudyPercent), [user, liveStudyPercent]);
            const userCreditMeta = useMemo(
                () => resolveCreditMetaSafe(user, certTemplate, { ...cneuConfig, trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8) }),
                [user, certTemplate, cneuConfig, liveConfig.hours]
            );

            // Onsite Scheduled Auto-Unlock Gate Check
            const onsiteLockInfo = useMemo(() => {
                if (!user || isAdminPreview || !user.onsiteUnlockAt) return { locked: false, countdown: '', unlockIso: '' };
                if (user.onsiteForceUnlocked || onsiteGlobalCfg.forceUnlocked) return { locked: false, countdown: '', unlockIso: user.onsiteUnlockAt };
                const unlockMs = new Date(user.onsiteUnlockAt).getTime();
                if (isNaN(unlockMs) || nowMs >= unlockMs) return { locked: false, countdown: '', unlockIso: user.onsiteUnlockAt };
                const diff = Math.max(0, Math.floor((unlockMs - nowMs) / 1000));
                const d = Math.floor(diff / 86400), h = Math.floor((diff % 86400) / 3600), m = Math.floor((diff % 3600) / 60), s = diff % 60;
                const countdown = d > 0 ? `อีก ${d} วัน ${h} ชม. ${m} นาที ${s} วินาที` : `อีก ${h} ชม. ${String(m).padStart(2, '0')} นาที ${String(s).padStart(2, '0')} วินาที`;
                return { locked: true, countdown, unlockIso: user.onsiteUnlockAt };
            }, [user, isAdminPreview, onsiteGlobalCfg.forceUnlocked, nowMs]);

            // Study Time Tracker while inside Dashboard Lessons
            useEffect(() => {
                if (screen !== 'dashboard' || dashTab !== 'lessons' || !user || isExemptHours || isAdminPreview) return;
                const tm = setInterval(() => setStudySeconds(s => s + 1), 1000);
                return () => clearInterval(tm);
            }, [screen, dashTab, user, isExemptHours, isAdminPreview]);

            const saveUserToCloud = useCallback(async (nextUser) => {
                setUser(nextUser);
                saveSessionTwoLayer(nextUser);

            const stopStepVoice = useCallback(() => {

                if (sharedAudioRef.current) { try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {} }
                if (ttsUrlRef.current) { try { URL.revokeObjectURL(ttsUrlRef.current); } catch (_) {} ttsUrlRef.current = null; }

            const playStudioVoice = useCallback(async (key, rawText, cacheKeyBase = '', options = {}) => {
                const { silentFail = false } = options || {};
                if (ttsState.activeKey === key && ttsState.status !== 'idle') {
                    stopStepVoice();
                    return;
                }
                unlockMobileAudio();
                stopStepVoice();

                let currentPromise = fetchStudioTtsBlob({ appsScriptUrl, text: chunks[0], signal: ctrl.signal, cacheKey: cacheKeyBase ? `${cacheKeyBase}_c0` : '' });
                let playedAny = false;

                for (let i = 0; i < chunks.length; i++) {
                    if (ttsSessionRef.current !== sid || ctrl.signal.aborted) return;
                    setTtsState({ activeKey: key, status: 'loading' });
                    const blob = await currentPromise;
                    if (ttsSessionRef.current !== sid || ctrl.signal.aborted) return;

                        a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });

                    email: 'demo@rajavithi.go.th',
                    phone: '0812345678',
                    position: isNurse ? 'พยาบาลวิชาชีพชำนาญการ (TC)' : (profGroup === 'แพทย์' ? 'นายแพทย์ชำนาญการพิเศษ' : 'เภสัชกรคลินิก'),
                    department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)',
                    hospital: 'โรงพยาบาลราชวิถี',
                    province: 'กรุงเทพมหานคร',
                    userType: 'เรียนต่อเนื่อง',
                    studyHoursExempt: true,
                    progress: 100,
                    hoursActivityName: 'การอบรมเชิงปฏิบัติการการรับบริจาคและปลูกถ่ายอวัยวะ รุ่นที่ 1/2570',
                    pretest: '6/8',
                    posttest: '8/8',
                    status: 'ผ่าน',
                    skillLabPassed: true,
                    skillLabBestScore: 92,
                    certificateClaimed: true,
                    certificateCode: isNurse ? 'RJC-2027-NURSE01' : (profGroup === 'แพทย์' ? 'RJC-2027-MD01' : 'RJC-2027-ALLIED01'),
                    certificateIssuedAt: new Date().toISOString()
                };
                setUser(demoUser);
                saveSessionTwoLayer(demoUser);
                setScreen('dashboard');
                showToast(`เข้าโหมดตัวอย่างกลุ่ม "${profGroup}" เรียบร้อย (ลองกดดูใบประกาศฯ ขั้นที่ 5 ได้ทันทีค่ะ)`, 'info');
            };

            const handleSubmitQuiz = async (mode) => {
                if (Object.keys(quizAnswers).length < questions.length) {
                    showToast(`กรุณาตอบคำถามให้ครบทั้ง ${questions.length} ข้อก่อนส่งค่ะ`, 'error');
                    return;
                }
                let correct = 0;
                questions.forEach(q => { if (Number(quizAnswers[q.id]) === Number(q.answer)) correct += 1; });
                const total = questions.length || 1;
                const pct = Math.round((correct / total) * 100);
                const scoreStr = `${correct}/${total}`;

                if (mode === 'pretest') {
                    await saveUserToCloud({ ...user, pretest: scoreStr });
                    setQuizAnswers({});
                    setScreen('dashboard');
                    showToast(`บันทึกผล Pre-test (${scoreStr} • ${pct}%) เรียบร้อยแล้วค่ะ`);
                } else {
                    const passed = pct >= MIN_POSTTEST_PERCENT;
                    await saveUserToCloud({ ...user, posttest: scoreStr, status: passed ? 'ผ่าน' : 'กำลังเรียน' });
                    setQuizAnswers({});
                    if (passed) {
                        showToast(`ยินดีด้วยค่ะ สอบผ่าน Post-test (${scoreStr} • ${pct}%) ปลดล็อกใบประกาศนียบัตรแล้ว!`);
                        setScreen('cert_confirm');
                    } else {
                        showToast(`ได้คะแนน ${scoreStr} (${pct}%) ยังไม่ถึงเกณฑ์ ${MIN_POSTTEST_PERCENT}% สามารถทบทวนและสอบใหม่ได้ค่ะ`, 'error');
                        setScreen('dashboard');
                    }
                }
            };

            const handleAskTutor = async (e) => {
                e.preventDefault();
                const q = aiTutorQ.trim();
                if (!q || aiTutorBusy) return;
                const currentLessonObj = lessons[currentLessonIdx] || lessons[0] || {};
                setAiTutorBusy(true);
                setAiTutorQ('');
                let reply = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const raw = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `บทเรียนปัจจุบัน: ${currentLessonObj.title || ''}\nคำถามผู้เรียน: ${q}`,
                                systemInstruction: 'คุณคือผู้ช่วยอาจารย์ด้านการรับบริจาคและปลูกถ่ายอวัยวะ รพ.ราชวิถี ตอบกระชับ ถูกต้องตามเกณฑ์แพทยสภาและ ODC 3-5 บรรทัดภาษาไทยสุภาพ'
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const data = JSON.parse((await raw.text()) || '{}');
                        if (data?.status === 'success' && data.text) reply = data.text;
                    } catch (_) {}
                }
                setAiTutorReply(reply || `สรุปสำหรับบท "${currentLessonObj.title || ''}": ${currentLessonObj.summary || 'สามารถทบทวนแฟลชการ์ดและฝึกสื่อสารจริงใน AI Skill Lab 3D ได้เลยค่ะ'}`);
                setAiTutorBusy(false);
            };

            const handleConfirmAndIssueCert = async (e) => {
                e.preventDefault();
                if (!certNameTH.trim() || !certHospital.trim()) {
                    showToast('กรุณากรอกชื่อ–นามสกุล และโรงพยาบาลให้ครบถ้วนค่ะ', 'error');
                    return;
                }
                const csatVals = Object.values(csatScores).map(Number);
                const csatAvg = Number((csatVals.reduce((a, b) => a + b, 0) / csatVals.length).toFixed(2));
                const susScore = computeSusScore(susAnswers);
                const issuedAt = user.certificateIssuedAt || new Date().toISOString();
                const certCode = user.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${String(user.license || user.id).slice(-6).toUpperCase()}`;

                const updatedUser = {
                    ...user,
                    name: certNameTH.trim(),
                    nameEN: certNameEN.trim(),
                    hospital: certHospital.trim(),
                    professionGroup: userCreditMeta.professionGroup,
                    cneuEligible: userCreditMeta.isNurseCneu,
                    trainingHours: userCreditMeta.trainingHours,
                    satisfactionScore: csatAvg,
                    satisfactionCriteria: csatScores,
                    susScore,
                    certificateClaimed: true,
                    certificateCode: certCode,
                    certificateIssuedAt: issuedAt,
                    status: 'ผ่าน'
                };

                const mergedCneuCfg = { ...cneuConfig, trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8) };
                // บันทึกทะเบียนสาธารณะ certificates/{code} ด้วยมาตรฐานเท่าเทียมกัน 100% (ใส่ CNEU เฉพาะกลุ่มพยาบาลเท่านั้น)
                const publicPayload = typeof CERT.buildPublicCertPayload === 'function'
                    ? CERT.buildPublicCertPayload({ code: certCode, user: updatedUser, finalName: updatedUser.name, nameEN: updatedUser.nameEN, finalHospital: updatedUser.hospital, certTemplate, cneuConfig: mergedCneuCfg, issuedAt })
                    : {
                        code: certCode, name: updatedUser.name, nameEN: updatedUser.nameEN, license: updatedUser.license || updatedUser.id,
                        position: updatedUser.position || 'บุคลากรทางการแพทย์',
                        professionGroup: userCreditMeta.professionGroup,
                        cneuEligible: userCreditMeta.isNurseCneu,
                        creditType: userCreditMeta.creditType,
                        creditLabelTH: userCreditMeta.lineTextTH,
                        trainingHours: userCreditMeta.trainingHours,
                        hospital: updatedUser.hospital, province: updatedUser.province || '',
                        courseTitleTH: certTemplate.courseTitleTH, courseTitleEN: certTemplate.courseTitleEN, orgTitleTH: certTemplate.orgTitleTH,
                        signerName: certTemplate.signerName, signerPosition: certTemplate.signerPosition,
                        cneuActivityCode: userCreditMeta.isNurseCneu ? cneuConfig.activityCode : '',
                        cneuCredits: userCreditMeta.isNurseCneu ? cneuConfig.cneuCredits : '',
                        issuedAt, status: 'valid'
                    };

                await saveUserToCloud(updatedUser);
                if (!isAdminPreview && fbDb) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', certCode), publicPayload, { merge: true });
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', buildAnonTelemetryId(updatedUser.id)), {
                            regionId: resolveRegionId(updatedUser.department),
                            status: 'ผ่าน',
                            progress: 100,
                            hasLab: Boolean(updatedUser.skillLabPassed),
                            satisfactionScore: csatAvg,
                            susScore,
                            updatedAt: issuedAt
                        }, { merge: true });
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_summary', 'global'), {
                            csatSum: increment(csatAvg), csatCount: increment(1),
                            susSum: increment(susScore), susCount: increment(1),
                            updatedAt: issuedAt
                        }, { merge: true });
                    } catch (err) { console.warn('Public cert write warning:', err); }
                }

                showToast('ออกใบประกาศนียบัตรดิจิทัลพร้อม QR Code เรียบร้อยแล้วค่ะ');
                setScreen('certificate');
            };

            const handleSelfDeleteAccount = () => {
                if (!user?.id) return;
                setConfirmDialog({
                    open: true,
                    title: 'ยืนยันการลบข้อมูลส่วนตัว (PDPA Right to Erasure)',
                    message: `ต้องการลบข้อมูลผู้เรียน "${user.name}" (${user.license || user.id}) ออกจากระบบหรือไม่? การดำเนินการนี้ไม่สามารถย้อนกลับได้ค่ะ`,
                    danger: true,
                    confirmText: 'ลบข้อมูลถาวร',
                    onConfirm: async () => {
                        if (!isAdminPreview && fbDb) {
                            try { await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id))); } catch (_) {}
                        }
                        clearSessionTwoLayer();
                        setUser(null);
                        setScreen('landing');
                        showToast('ลบข้อมูลส่วนบุคคลของท่านเรียบร้อยแล้วค่ะ');
                    }
                });
            };

            const handleGoToSkillLab = () => {
                if (user) saveSessionTwoLayer({ ...user, studySeconds, progress: liveStudyPercent });
                window.location.href = isAdminPreview ? './aiskilllab.html?admin_preview=1' : './aiskilllab.html';
            };

            const currentLesson = lessons[currentLessonIdx] || lessons[0] || BUILTIN_LESSONS[0];

            // ============================================================================
            // 8. RENDER SCREENS
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col">
                    {screen !== 'landing' && (<><div className="spatial-aura" /><div className="spatial-grid" /></>)}

                    {/* แถบไฟแอมเบียนบนสุดขณะ AI พูดแนะนำ (ไร้ซับไตเติลกวนสายตา) */}
                    {ttsState.status !== 'idle' && (
                        <div className="fixed top-0 left-0 right-0 z-50 pointer-events-none" aria-hidden="true">
                            <div className="rjc-ambient-bar" />
                        </div>
                    )}

                    {/* ==================== SCREEN: LANDING ==================== */}
                    {screen === 'landing' && (
                        <LandingHeroScreen
                            hasSavedSession={Boolean(user?.id)}
                            onStartAuth={() => { setAuthStep(1); setScreen('auth'); }}
                            onResumeDashboard={() => setScreen('dashboard')}
                        />
                    )}

                    {/* ==================== SCREEN: ONSITE SCHEDULED AUTO-UNLOCK GATE ==================== */}
                    {screen !== 'landing' && screen !== 'auth' && onsiteLockInfo.locked && user && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4">
                            <div className="spatial-card max-w-lg w-full rounded-[2rem] p-6 sm:p-8 text-center space-y-5 border-prism-400/45">
                                <div className="w-14 h-14 rounded-2xl bg-prism-500/20 text-prism-adaptive flex items-center justify-center mx-auto">
                                    <Icon name="Clock" size={28} />
                                </div>
                                <div className="space-y-1">
                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">ONSITE SCHEDULED AUTO-UNLOCK</span>
                                    <h1 className="font-display font-extrabold text-xl text-primary-adaptive">สิทธิ์เทียบโอนของท่านพร้อมเปิดอัตโนมัติตามกำหนดเวลา</h1>
                                    <p className="text-xs text-secondary-adaptive">{user.name} • {user.hoursActivityName || 'ผู้เข้าอบรม Onsite'}</p>
                                </div>
                                <div className="p-4 rounded-2xl bg-aurora-500/15 border border-aurora-400/40 space-y-1">
                                    <p className="font-display font-extrabold text-xl text-accent-adaptive">{onsiteLockInfo.countdown}</p>
                                    <p className="text-xs text-secondary-adaptive">เปิดระบบวันที่ <b>{formatThaiDateTime(onsiteLockInfo.unlockIso)}</b></p>
                                </div>
                                <button type="button" onClick={() => setScreen('landing')} className="spatial-soft touch-target w-full py-3 rounded-full text-xs font-bold text-primary-adaptive">กลับหน้าแรก</button>
                            </div>
                        </div>
                    )}

                    {/* ==================== SCREEN: AUTH WIZARD 3 STEPS (CONDITIONAL CNEU BY PROFESSION) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4 py-8">
                            <div className="spatial-card max-w-xl w-full rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => { stopStepVoice(); setScreen('landing'); }} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1">
                                        <Icon name="ArrowLeft" size={14} /> หน้าแรก
                                    </button>
                                    <div className="flex items-center gap-1.5">
                                        {currentStepVoiceGuide && <StepVoiceButton activeKey={ttsState.activeKey} targetKey={currentStepVoiceGuide.key} status={ttsState.status} onToggle={handleReplayStepGuide} />}
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>

                                <div className="flex items-center justify-between text-[11px] font-mono font-bold text-muted-adaptive">
                                    <span className={authStep >= 1 ? 'text-accent-adaptive' : ''}>1. เลขใบอนุญาต</span>
                                    <span className={authStep >= 2 ? 'text-accent-adaptive' : ''}>2. กลุ่มวิชาชีพ &amp; ข้อมูล</span>
                                    <span className={authStep >= 3 ? 'text-accent-adaptive' : ''}>3. ยืนยัน OTP</span>
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleLookupLicense} className="space-y-4">
                                        <div>
                                            <h2 className="font-display font-extrabold text-xl text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนผู้เรียน</h2>
                                            <p className="text-xs text-secondary-adaptive mt-1">กรอกเลขที่ใบอนุญาตประกอบวิชาชีพหรือรหัสบุคลากร เพื่อดึงข้อมูลเดิมและตรวจสอบสิทธิ์เทียบโอนชั่วโมงอัตโนมัติ</p>
                                        </div>
                                        <input required value={licenseInput} onChange={e => setLicenseInput(e.target.value)} placeholder="เลขที่ใบอนุญาตประกอบวิชาชีพ (เช่น 4511128901)" className="touch-target spatial-input w-full px-4 py-3.5 rounded-2xl font-mono text-base font-bold" />
                                        <button type="submit" disabled={authBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังตรวจสอบฐานข้อมูล...' : 'ตรวจสอบเลขที่ใบอนุญาต →'}
                                        </button>

                                        {/* ปุ่มทดลองเข้าห้องเรียนแยกตาม 3 กลุ่มวิชาชีพ (ช่วยทดสอบการแสดง/ซ่อน CNEU ได้ทันที) */}
                                        <div className="pt-3 border-t border-white/10 space-y-2">
                                            <p className="text-[11px] font-mono text-muted-adaptive text-center">ทดลองดูความแตกต่างระหว่างวิชาชีพ (Preview Mode):</p>
                                            <div className="grid grid-cols-3 gap-1.5 text-[11px]">
                                                <button type="button" onClick={() => handleQuickDemoEnter('พยาบาล')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-accent-adaptive">พยาบาล (CNEU)</button>
                                                <button type="button" onClick={() => handleQuickDemoEnter('แพทย์')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-prism-adaptive">แพทย์ (ชม.อบรม)</button>
                                                <button type="button" onClick={() => handleQuickDemoEnter('บุคลากรสหวิชาชีพ')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-secondary-adaptive">สหวิชาชีพ</button>
                                            </div>
                                        </div>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={handleSendOtp} className="space-y-4 text-xs">
                                        <div className="flex items-center justify-between gap-2">
                                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive">ระบุกลุ่มวิชาชีพและตรวจสอบข้อมูล</h2>
                                            <button type="button" onClick={() => setAuthStep(1)} className="text-prism-adaptive font-bold hover:underline">← เปลี่ยนรหัส</button>
                                        </div>

                                        {/* คัดกรองกลุ่มวิชาชีพตั้งแต่หน้าลงทะเบียน (เลือกพยาบาล -> เด้งกล่อง CNEU ทันที / แพทย์และสหวิชาชีพไม่ขึ้น CNEU) */}
                                        <div className="space-y-2">
                                            <label className="block font-bold text-secondary-adaptive ml-1">1. เลือกกลุ่มวิชาชีพของท่าน *</label>
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                {PROFESSION_OPTIONS.map(pg => {
                                                    const active = authProfile.professionGroup === pg.id;
                                                    return (
                                                        <button
                                                            key={pg.id}
                                                            type="button"
                                                            onClick={() => setAuthProfile(p => {
                                                                const isDefPos = !p.position || PROFESSION_OPTIONS.some(o => o.defaultPos === p.position);
                                                                return { ...p, professionGroup: pg.id, position: isDefPos ? pg.defaultPos : p.position };
                                                            })}
                                                            className={`text-left p-3 rounded-xl border transition-all space-y-0.5 ${active ? 'bg-aurora-500/20 border-aurora-400 shadow-sm' : 'spatial-soft hover:border-prism-400/50'}`}
                                                        >
                                                            <div className="flex items-center justify-between gap-1">
                                                                <span className="font-display font-extrabold text-sm text-primary-adaptive">{pg.label}</span>
                                                                <Icon name={pg.icon} size={15} className={active ? 'text-accent-adaptive' : 'text-muted-adaptive'} />
                                                            </div>
                                                            <p className="text-[10.5px] text-muted-adaptive leading-snug">{pg.desc}</p>
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {/* แสดงข้อความ CNEU เฉพาะเมื่อเลือก "พยาบาล" เท่านั้น (แพทย์/สหวิชาชีพไม่มีข้อความ CNEU แสดงต่อ) */}
                                            {authProfile.professionGroup === 'พยาบาล' && (cneuConfig.activityCode || cneuConfig.cneuCredits) && (
                                                <div className="p-3.5 rounded-2xl bg-aurora-500/15 border border-aurora-400/50 space-y-1">
                                                    <div className="flex items-center gap-1.5 text-accent-adaptive font-mono text-[10px] font-bold uppercase">
                                                        <Icon name="Award" size={14} /> สิทธิ์รับหน่วยคะแนนการศึกษาต่อเนื่องทางการพยาบาล (CNEU • สภาการพยาบาล)
                                                    </div>
                                                    <p className="font-display font-extrabold text-sm text-primary-adaptive">
                                                        รหัสกิจกรรม CNEU: <span className="text-accent-adaptive font-mono">{cneuConfig.activityCode || '-'}</span>
                                                        {cneuConfig.cneuCredits && <> • จำนวน <span className="text-accent-adaptive font-mono">{cneuConfig.cneuCredits}</span> หน่วยคะแนน</>}
                                                    </p>
                                                    <p className="text-[11px] text-secondary-adaptive leading-relaxed">
                                                        ระบบจะใช้เลขที่ใบอนุญาตประกอบวิชาชีพการพยาบาลของท่านในการรับรองหน่วยคะแนน CNEU บนประกาศนียบัตรและรายงานส่งสภาการพยาบาลโดยอัตโนมัติค่ะ
                                                    </p>
                                                </div>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">คำนำหน้า ชื่อ–นามสกุล *</label>
                                                <input required value={authProfile.name} onChange={e => setAuthProfile(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา / นพ.สมชาย..." className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ชื่อภาษาอังกฤษ (สำหรับใบประกาศฯ)</label>
                                                <input value={authProfile.nameEN} onChange={e => setAuthProfile(p => ({ ...p, nameEN: e.target.value }))} placeholder="First Last, RN / MD" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">สังกัด / เขตสุขภาพ</label>
                                                <select value={authProfile.department} onChange={e => setAuthProfile(p => ({ ...p, department: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm">
                                                    {REGION_OPTIONS.map(k => <option key={k} value={k}>{k}</option>)}
                                                </select>
                                            </div>
                                            <div>

                                                        <button type="submit" disabled={!aiTutorQ.trim() || aiTutorBusy} className="rjc2-pill-btn touch-target px-4 rounded-xl font-display font-extrabold text-xs">{aiTutorBusy ? '...' : 'ถาม AI'}</button>

                                {dashTab === 'phrases' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {POCKET_PHRASEBOOK.map((item, idx) => (

                                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">{item.cat}</span>
                                                    <StepVoiceButton activeKey={ttsState.activeKey} targetKey={`phrase_${idx}`} status={ttsState.status} onToggle={() => playStudioVoice(`phrase_${idx}`, item.th, `phrase_${idx}`)} />

                                                <p className="text-primary-adaptive font-semibold leading-relaxed">“{item.th}”</p>

                                            </div>
                                            <button type="button" onClick={() => { setEditForm({ professionGroup: userCreditMeta.professionGroup, name: user.name || '', nameEN: user.nameEN || '', position: user.position || '', hospital: user.hospital || '', phone: user.phone || '' }); setEditProfileOpen(v => !v); }} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-prism-adaptive">
                                                {editProfileOpen ? 'ปิดฟอร์ม' : 'แก้ไขข้อมูล'}
                                            </button>
                                        </div>

                                        <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                            <div className="flex justify-between gap-2 border-b border-white/10 pb-2"><span className="text-muted-adaptive">กลุ่มวิชาชีพ:</span><span className="font-bold text-primary-adaptive">{userCreditMeta.professionGroup}</span></div>
                                            <div className="flex justify-between gap-2 border-b border-white/10 pb-2"><span className="text-muted-adaptive">สิทธิ์หน่วยคะแนน / การรับรอง:</span><span className="font-bold text-prism-adaptive text-right">{userCreditMeta.lineTextTH}</span></div>
                                            <div className="flex justify-between gap-2 border-b border-white/10 pb-2"><span className="text-muted-adaptive">สถานะปัจจุบัน:</span><span className="font-display font-extrabold text-accent-adaptive">{statusInfo.statusLabel}</span></div>
                                            <div className="flex justify-between gap-2 border-b border-white/10 pb-2"><span className="text-muted-adaptive">สถานะชั่วโมงอบรม:</span><span className="font-bold text-primary-adaptive">{statusInfo.hoursLabel}</span></div>
                                            {statusInfo.activityName && <div className="flex justify-between gap-2 border-b border-white/10 pb-2"><span className="text-muted-adaptive">กิจกรรมอ้างอิง:</span><span className="font-semibold text-secondary-adaptive text-right">{statusInfo.activityName}</span></div>}
                                            <div className="flex justify-between gap-2"><span className="text-muted-adaptive">สังกัด / โรงพยาบาล:</span><span className="font-semibold text-primary-adaptive text-right">{user.hospital} ({user.department})</span></div>
                                        </div>

                                        {editProfileOpen && (
                                            <form onSubmit={async (e) => {
                                                e.preventDefault();
                                                const nextProf = editForm.professionGroup || userCreditMeta.professionGroup;
                                                await saveUserToCloud({ ...user, ...editForm, professionGroup: nextProf, cneuEligible: nextProf === 'พยาบาล' });
                                                setEditProfileOpen(false);
                                                showToast('บันทึกการแก้ไขข้อมูลส่วนตัวเรียบร้อยแล้วค่ะ');
                                            }} className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs">
                                                <select value={editForm.professionGroup} onChange={e => setEditForm(p => ({ ...p, professionGroup: e.target.value }))} className="touch-target spatial-input w-full px-3 py-2 rounded-xl font-bold">
                                                    {PROFESSION_OPTIONS.map(pg => <option key={pg.id} value={pg.id}>กลุ่มวิชาชีพ: {pg.label}</option>)}
                                                </select>
                                                <input required value={editForm.name} onChange={e => setEditForm(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ–นามสกุล" className="touch-target spatial-input w-full px-3 py-2 rounded-xl" />
                                                <input value={editForm.nameEN} onChange={e => setEditForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="ชื่อภาษาอังกฤษ" className="touch-target spatial-input w-full px-3 py-2 rounded-xl" />
                                                <input value={editForm.position} onChange={e => setEditForm(p => ({ ...p, position: e.target.value }))} placeholder="ตำแหน่ง" className="touch-target spatial-input w-full px-3 py-2 rounded-xl" />
                                                <input value={editForm.hospital} onChange={e => setEditForm(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล" className="touch-target spatial-input w-full px-3 py-2 rounded-xl" />
                                                <button type="submit" className="rjc2-pill-btn touch-target w-full py-2.5 rounded-xl font-display font-extrabold text-xs">บันทึกข้อมูลส่วนตัว</button>
                                            </form>
                                        )}

                                        <div className="pt-2 border-t border-white/10 flex justify-end">
                                            <button type="button" onClick={handleSelfDeleteAccount} className="px-3.5 py-2 rounded-xl bg-rose-500/15 border border-rose-400/35 text-rose-300 text-xs font-bold hover:bg-rose-600 hover:text-white transition-colors">
                                                ลบข้อมูลส่วนตัวออกจากระบบ (PDPA)
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </main>
                        </div>
                    )}

                    {/* ==================== SCREEN: STEP 5 CERTIFICATE CONFIRM + CSAT + SUS (R2R) ==================== */}
                    {screen === 'cert_confirm' && user && !onsiteLockInfo.locked && (
                        <div className="relative z-10 max-w-2xl w-full mx-auto px-4 py-7">
                            <form onSubmit={handleConfirmAndIssueCert} className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive">← กลับห้องเรียน</button>
                                    <div className="flex items-center gap-2">
                                        {currentStepVoiceGuide && <StepVoiceButton activeKey={ttsState.activeKey} targetKey={currentStepVoiceGuide.key} status={ttsState.status} onToggle={handleReplayStepGuide} />}
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive">
                                            {userCreditMeta.isNurseCneu ? 'STEP 05 • CNEU & R2R' : 'STEP 05 • CERTIFICATE & R2R'}
                                        </span>
                                    </div>
                                </div>

                                <div>
                                    <h1 className="font-display font-extrabold text-xl text-primary-adaptive">ยืนยันชื่อบนประกาศนียบัตร &amp; ประเมินหลักสูตร</h1>
                                    <p className="text-xs text-secondary-adaptive mt-1">
                                        {userCreditMeta.isNurseCneu
                                            ? `ประกาศนียบัตรและหนังสือรับรอง CNEU (${userCreditMeta.lineTextTH}) มอบสิทธิ์และเกียรติมาตรฐานเดียวกันทุกประเภทผู้เรียนค่ะ`
                                            : `ประกาศนียบัตรและหนังสือรับรองการผ่านการอบรม (${userCreditMeta.lineTextTH}) มอบสิทธิ์และเกียรติมาตรฐานเดียวกันทุกประเภทผู้เรียนค่ะ`}
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    <div className="sm:col-span-2">
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">คำนำหน้า ชื่อ–นามสกุล (ภาษาไทย) *</label>
                                        <input required value={certNameTH} onChange={e => setCertNameTH(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm font-bold" />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ชื่อภาษาอังกฤษ (ถ้ามี)</label>
                                        <input value={certNameEN} onChange={e => setCertNameEN(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-secondary-adaptive mb-1 ml-1">หน่วยงาน / โรงพยาบาล *</label>
                                        <input required value={certHospital} onChange={e => setCertHospital(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                    </div>
                                </div>

                                <div className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs">
                                    <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">
                                        {userCreditMeta.isNurseCneu ? 'แบบประเมินความพึงพอใจหลักสูตร CNEU (1–5)' : 'แบบประเมินความพึงพอใจหลักสูตร (1–5)'}
                                    </p>
                                    {CSAT_CRITERIA.map(c => (
                                        <div key={c.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                                            <span className="text-secondary-adaptive">{c.label}</span>
                                            <div className="flex gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(n => (
                                                    <button key={n} type="button" onClick={() => setCsatScores(p => ({ ...p, [c.key]: n }))} className={`w-8 h-8 rounded-lg font-mono text-xs font-bold ${csatScores[c.key] === n ? 'bg-amber-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs">
                                    <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">แบบประเมินความง่ายในการใช้งาน (SUS • R2R • 1–5)</p>
                                    {SUS_ITEMS.map(item => (
                                        <div key={item.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                                            <span className="text-secondary-adaptive">{item.label}</span>
                                            <div className="flex gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(n => (
                                                    <button key={n} type="button" onClick={() => setSusAnswers(p => ({ ...p, [item.key]: n }))} className={`w-8 h-8 rounded-lg font-mono text-xs font-bold ${susAnswers[item.key] === n ? 'bg-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button type="submit" className="rjc2-pill-btn touch-target w-full py-4 rounded-full font-display font-extrabold text-sm">
                                    ยืนยันและออกใบประกาศนียบัตรดิจิทัล →
                                </button>
                            </form>
                        </div>
                    )}

                    {/* ==================== SCREEN: STEP 5 CERTIFICATE VIEW & PROFESSION-AWARE LETTER ==================== */}
                    {screen === 'certificate' && user && !onsiteLockInfo.locked && (
                        <div className="relative z-10 max-w-4xl w-full mx-auto px-4 py-6 space-y-5 pb-12">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive">← กลับห้องเรียน</button>
                                    {currentStepVoiceGuide && <StepVoiceButton activeKey={ttsState.activeKey} targetKey={currentStepVoiceGuide.key} status={ttsState.status} onToggle={handleReplayStepGuide} />}
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    <button type="button" onClick={() => { if (typeof CERT.downloadCanvasAsPdf === 'function') CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode); else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png'); a.download = `Certificate_${user.certificateCode}.png`; a.click(); } }} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs inline-flex items-center gap-1.5">
                                        <Icon name="Download" size={14} /> ดาวน์โหลด PDF
                                    </button>
                                    <button type="button" onClick={() => { if (typeof CERT.downloadCanvasAsPng === 'function') CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode); else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png'); a.download = `Certificate_${user.certificateCode}.png`; a.click(); } }} className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-primary-adaptive">บันทึก PNG</button>
                                    <button type="button" onClick={() => { if (typeof CERT.printIndividualCneuLetter === 'function') CERT.printIndividualCneuLetter(); else window.print(); }} className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-accent-adaptive">
                                        {userCreditMeta.isNurseCneu ? 'พิมพ์หนังสือรับรอง CNEU' : 'พิมพ์หนังสือรับรองการอบรม'}
                                    </button>
                                </div>
                            </div>

                            <div className="spatial-card rounded-[1.75rem] p-3 sm:p-4">
                                <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-2xl">
                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                </div>
                            </div>

                            {/* หนังสือรับรองรายบุคคล A4 (ปรับหัวข้อและข้อความตามกลุ่มวิชาชีพ — ไม่แสดง CNEU ในกลุ่มแพทย์/สหวิชาชีพ) */}
                            <article id="cneu-individual-letter" className="bg-white text-slate-900 rounded-2xl p-6 sm:p-10 space-y-5 shadow-xl font-sans">
                                <div className="text-center border-b-2 border-slate-800 pb-4 space-y-1">
                                    <p className={`text-xs font-bold uppercase ${userCreditMeta.isNurseCneu ? 'text-emerald-800' : 'text-sky-800'}`}>
                                        {userCreditMeta.letterHeadingTH}
                                    </p>
                                    <h2 className="font-display text-lg font-extrabold">{cneuConfig.orgName}</h2>
                                    <p className="text-xs font-mono text-slate-600">เลขที่เอกสารอ้างอิง: {user.certificateCode}</p>
                                </div>
                                <div className="space-y-3 text-sm leading-relaxed">
                                    <p>
                                        หนังสือฉบับนี้ขอรับรองว่า <b>{user.name}</b> {userCreditMeta.licenseLabelTH} <b>{user.license || user.id}</b> สังกัด <b>{user.hospital}</b> ได้สำเร็จการอบรมตามเกณฑ์มาตรฐานหลักสูตร <b>{cneuConfig.courseName}</b>
                                    </p>
                                    {userCreditMeta.isNurseCneu ? (
                                        <p>
                                            รหัสกิจกรรม CNEU: <b>{cneuConfig.activityCode}</b> จำนวน <b>{cneuConfig.cneuCredits} หน่วยคะแนน</b> โดยผ่านการยืนยันตัวตน ผ่านเกณฑ์ชั่วโมงการอบรมตามมาตรฐานหลักสูตร ผ่านห้องฝึกสื่อสาร 3 มิติ AI Skill Lab และสอบวัดผลหลังเรียน (Post-test) ได้คะแนนไม่น้อยกว่าร้อยละ 80 ครบถ้วนทุกประการ
                                        </p>
                                    ) : (
                                        <p>
                                            ได้รับรอง<b>{userCreditMeta.lineTextTH}</b> โดยผ่านการยืนยันตัวตน ผ่านเกณฑ์ชั่วโมงการอบรมตามมาตรฐานหลักสูตร ผ่านห้องฝึกสื่อสาร 3 มิติ AI Skill Lab และสอบวัดผลหลังเรียน (Post-test) ได้คะแนนไม่น้อยกว่าร้อยละ 80 ครบถ้วนทุกประการ เพื่อใช้เป็นหลักฐานประกอบการพัฒนาสมรรถนะและพิจารณาทางวิชาชีพ
                                        </p>
                                    )}
                                    <p className="text-xs text-slate-600">ให้ไว้ ณ วันที่ {formatThaiDateOnly(user.certificateIssuedAt)} • ตรวจสอบความถูกต้องผ่าน QR Code ที่ <span className="font-mono">verify.html?code={user.certificateCode}</span></p>
                                </div>
                                <div className="pt-8 text-center text-xs space-y-1">
                                    <p>ลงชื่อ ...............................................................</p>
                                    <p className="font-bold">({cneuConfig.approverName})</p>
                                    <p className="text-slate-600">{cneuConfig.approverPosition}</p>
                                </div>
                            </article>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('app-root'));
        root.render(<AppErrorBoundary><MainApp /></AppErrorBoundary>);
    </script>
    <!-- โหลด Babel ท้ายสุดหลังสคริปต์ทั้งหมด เพื่อให้แน่ใจว่าโค้ดครบ 100% ก่อนคอมไพล์ -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
