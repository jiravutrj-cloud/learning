    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f8fafc');
        } catch (_) {}
      })();
    </script>

      .spatial-aura {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 12% 14%, var(--aura-1) 0%, transparent 46%),
          radial-gradient(circle at 88% 12%, var(--aura-2) 0%, transparent 45%),
          radial-gradient(circle at 65% 88%, var(--aura-3) 0%, transparent 48%);
        pointer-events: none;
      }
      .spatial-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(ellipse at center, black 45%, transparent 94%);
        pointer-events: none;
      }

        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(155%);
        -webkit-backdrop-filter: blur(24px) saturate(155%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      .spatial-header {
        background: var(--header-bg);
        backdrop-filter: blur(22px) saturate(150%);
        -webkit-backdrop-filter: blur(22px) saturate(150%);
        border-bottom: 1px solid var(--surface-border);
      }
      .spatial-dock {
        background: var(--dock-bg);
        backdrop-filter: blur(24px) saturate(150%);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        border-top: 1px solid var(--surface-border);
      }
      .spatial-soft {
        background: var(--surface-soft);
        border: 1px solid var(--surface-border);
      }
      .spatial-soft:hover {
        background: var(--surface-soft-hover);
      }
      .spatial-input {
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--input-text);
      }

        .no-print { display: none !important; }

        function parseRawExams(raw) {
            if (!Array.isArray(raw)) return [];
            const domMap = Array.isArray(window.QUESTION_DOMAIN_MAP) ? window.QUESTION_DOMAIN_MAP : [];
            const fallbackDoms = ['policy_ethics', 'procurement_transplant', 'family_communication', 'brain_death_donor'];
            return raw.map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    origIdx: idx,
                    domain: domMap[idx] || fallbackDoms[idx % fallbackDoms.length],
                    question: parts[0] ? parts[0].replace(/^[0-9]+\.\s*/, '') : '',
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW)];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)

                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [parseRawExams(FALLBACK_QUIZ_RAW)];
        }

        function computeDomainDiagnosis(questions, answers) {
            const buckets = {};
            Object.keys(CLINICAL_DOMAINS).forEach(k => {
                buckets[k] = { correct: 0, total: 0 };
            });

            questions.forEach((q, idx) => {
                const dk = CLINICAL_DOMAINS[q.domain] ? q.domain : 'policy_ethics';
                buckets[dk].total += 1;
                if (answers[idx] === q.answer) buckets[dk].correct += 1;
            });

            const domains = Object.values(CLINICAL_DOMAINS).map(meta => {
                const b = buckets[meta.id] || { correct: 0, total: 0 };
                const percent = b.total > 0 ? Math.round((b.correct / b.total) * 100) : 100;
                return {
                    ...meta,
                    correct: b.correct,
                    total: b.total,
                    percent
                };
            });

            const sortedWeak = [...domains].sort((a, b) => a.percent - b.percent);
            const weakDomains = sortedWeak.filter(d => d.percent < 80);
            const focusDomains = weakDomains.length > 0 ? weakDomains.slice(0, 2) : sortedWeak.slice(0, 1);
            const recommendedLessonIds = Array.from(new Set(focusDomains.flatMap(d => d.lessonIds || [])));

            const summaryText = weakDomains.length > 0
                ? `AI แนะนำให้โฟกัสหมวด “${focusDomains.map(d => d.shortName).join('” และ “')}” เป็นพิเศษ เพื่ออุดจุดอ่อนก่อนเข้าฝึก AI Skill Lab และสอบ Post-test ค่ะ`
                : 'พื้นฐานความรู้คลินิกทั้ง 4 หมวดของคุณยอดเยี่ยมมากค่ะ สามารถทบทวนบทเรียนที่สนใจและเตรียมเข้าฝึก AI Skill Lab 3 มิติได้เลย';

            return { domains, weakDomains, recommendedLessonIds, summaryText };
        }

        }

        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

        /**
         * วาดใบประกาศนียบัตรความละเอียดสูงสไตล์ Apple Minimalist
         * พื้นสีขาวบริสุทธิ์ ตัดกรอบและเส้นสายสีทองเมทัลลิกบางเฉียบ พร้อม QR Code จริง
         */
        async function drawMinimalistGoldCertificate(canvas, certData, template) {
            if (!canvas) return;
            const W = 1600, H = 1131;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const verifyUrl = `${window.location.origin}${window.location.pathname.replace(/index\.html$/i, '')}verify.html?code=${encodeURIComponent(certData.code || '')}`;

            const qrPromise = (async () => {
                try {
                    if (window.QRCode && typeof window.QRCode.toDataURL === 'function') {
                        const dataUrl = await window.QRCode.toDataURL(verifyUrl, {
                            width: 320,
                            margin: 1,
                            color: { dark: '#1d1d1f', light: '#ffffff' }
                        });
                        return await loadImageSafe(dataUrl);
                    }
                } catch (_) {}
                return null;
            })();

            const [logoImg, sigImg, qrImg] = await Promise.all([
                loadImageSafe(template.logoUrl),
                loadImageSafe(template.signatureUrl),
                qrPromise
            ]);

            // 1. พื้นหลังสีขาวบริสุทธิ์
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            // 2. เส้นกรอบสีทองเมทัลลิกแบบบางเฉียบ 2 ชั้น
            const goldGrad = ctx.createLinearGradient(0, 0, W, H);
            goldGrad.addColorStop(0, '#b89242');
            goldGrad.addColorStop(0.35, '#e2c785');
            goldGrad.addColorStop(0.7, '#c5a059');
            goldGrad.addColorStop(1, '#a67f32');

            ctx.strokeStyle = goldGrad;
            ctx.lineWidth = 2.2;
            ctx.strokeRect(42, 42, W - 84, H - 84);

            ctx.strokeStyle = 'rgba(197, 160, 89, 0.42)';
            ctx.lineWidth = 1.1;
            ctx.strokeRect(58, 58, W - 116, H - 116);

            // 3. มุมเรขาคณิตสีทองบางเฉียบ 4 มุม
            const cLen = 36, inset = 74;
            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 1.8;
            [
                [inset, inset, 1, 1],
                [W - inset, inset, -1, 1],
                [inset, H - inset, 1, -1],
                [W - inset, H - inset, -1, -1]
            ].forEach(([cx, cy, dx, dy]) => {
                ctx.beginPath();
                ctx.moveTo(cx + dx * cLen, cy);
                ctx.lineTo(cx, cy);
                ctx.lineTo(cx, cy + dy * cLen);
                ctx.stroke();
            });

            // 4. แถบเส้นทองบางหรือโลโก้หน่วยงานด้านบน
            let topY = 148;
            if (logoImg) {
                const maxH = 74;
                const drawW = maxH * (logoImg.width / (logoImg.height || 1));
                ctx.drawImage(logoImg, W / 2 - drawW / 2, 82, drawW, maxH);
                topY = 196;
            } else {
                const barGrad = ctx.createLinearGradient(W / 2 - 58, 0, W / 2 + 58, 0);
                barGrad.addColorStop(0, 'rgba(197, 160, 89, 0.15)');
                barGrad.addColorStop(0.5, '#c5a059');
                barGrad.addColorStop(1, 'rgba(197, 160, 89, 0.15)');
                ctx.fillStyle = barGrad;
                ctx.fillRect(W / 2 - 58, 98, 116, 2.2);
            }

            ctx.textAlign = 'center';

            // 5. ชื่อหน่วยงาน
            ctx.fillStyle = '#1d1d1f';
            ctx.font = '600 22px "Prompt", sans-serif';
            ctx.fillText(template.orgTitleTH || '', W / 2, topY);

            ctx.fillStyle = '#86868b';
            ctx.font = '500 14px "JetBrains Mono", monospace';
            ctx.fillText(template.orgTitleEN || '', W / 2, topY + 30);

            // 6. หัวข้อประกาศนียบัตร
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 16px "JetBrains Mono", monospace';
            ctx.fillText('C E R T I F I C A T E   O F   C O M P L E T I O N', W / 2, topY + 86);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 54px "Prompt", sans-serif';
            ctx.fillText('ประกาศนียบัตร', W / 2, topY + 150);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 23px "Sarabun", sans-serif';
            ctx.fillText(template.subtitleTH || '', W / 2, topY + 198);

            // 7. ชื่อผู้สำเร็จการอบรม + เส้นทองบางใต้ชื่อ
            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 56px "Prompt", sans-serif';
            ctx.fillText(certData.name || 'ผู้สำเร็จการอบรม', W / 2, topY + 276);

            const nameRule = ctx.createLinearGradient(W / 2 - 170, 0, W / 2 + 170, 0);
            nameRule.addColorStop(0, 'rgba(197, 160, 89, 0)');
            nameRule.addColorStop(0.25, '#c5a059');
            nameRule.addColorStop(0.75, '#e2c785');
            nameRule.addColorStop(1, 'rgba(197, 160, 89, 0)');
            ctx.fillStyle = nameRule;
            ctx.fillRect(W / 2 - 170, topY + 298, 340, 1.8);

            const subLine = [
                certData.hospital || '',
                certData.license ? `ใบอนุญาตเลขที่ ${certData.license}` : ''
            ].filter(Boolean).join('   •   ');
            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 20px "Sarabun", sans-serif';
            ctx.fillText(subLine, W / 2, topY + 338);

            // 8. ข้อความรับรองและชื่อหลักสูตร
            ctx.fillStyle = '#424245';
            ctx.font = '500 22px "Sarabun", sans-serif';
            ctx.fillText(template.completionTextTH || '', W / 2, topY + 394);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 28px "Prompt", sans-serif';
            ctx.fillText(template.courseTitleTH || '', W / 2, topY + 444);

            ctx.fillStyle = '#a8843b';
            ctx.font = '500 17px "Prompt", sans-serif';
            ctx.fillText(template.courseTitleEN || '', W / 2, topY + 478);

            const thaiDate = new Date(certData.issuedAt || Date.now()).toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            ctx.fillStyle = '#86868b';
            ctx.font = '500 17px "Sarabun", sans-serif';
            ctx.fillText(`ให้ไว้ ณ วันที่ ${thaiDate}   •   ${template.hoursText || ''}`, W / 2, topY + 516);

            // 9. ส่วนลายเซ็นกึ่งกลาง
            const sigBaseY = H - 188;
            if (sigImg) {
                const sigH = 70;
                const sigW = sigH * (sigImg.width / (sigImg.height || 1));
                ctx.drawImage(sigImg, W / 2 - sigW / 2, sigBaseY - 78, sigW, sigH);
            }

            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 160, sigBaseY);
            ctx.lineTo(W / 2 + 160, sigBaseY);
            ctx.stroke();

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '600 22px "Prompt", sans-serif';
            ctx.fillText(template.signerName || '', W / 2, sigBaseY + 36);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 17px "Sarabun", sans-serif';
            ctx.fillText(template.signerPosition || '', W / 2, sigBaseY + 64);

            // 10. รหัสอ้างอิงมุมซ้ายล่าง
            ctx.fillStyle = '#c5a059';
            ctx.fillRect(98, H - 172, 2.2, 62);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 13px "JetBrains Mono", monospace';
            ctx.fillText('CERTIFICATE NO.', 114, H - 156);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 18px "JetBrains Mono", monospace';
            ctx.fillText(certData.code || 'RJC-2027-XXXXXX', 114, H - 130);

            ctx.fillStyle = '#86868b';
            ctx.font = '500 14px "Sarabun", sans-serif';
            ctx.fillText('ตรวจสอบความถูกต้องผ่าน QR Code ที่ rjcloud.organ', 114, H - 108);

            // 11. กล่อง QR Code มุมขวาล่าง
            const qrSize = 136;
            const qrX = W - 102 - qrSize;
            const qrY = H - 122 - qrSize;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = 'rgba(197, 160, 89, 0.65)';
            ctx.lineWidth = 1.5;
            ctx.fillRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);
            ctx.strokeRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20);

            if (qrImg) {
                ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
            } else {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#a8843b';
                ctx.font = '600 14px "JetBrains Mono", monospace';
                ctx.fillText('QR VERIFY', qrX + qrSize / 2, qrY + qrSize / 2 + 5);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 11px "JetBrains Mono", monospace';
            ctx.fillText('SCAN TO VERIFY', qrX + qrSize / 2, qrY + qrSize + 28);
        }

        // ============================================================================
        // 3. SHARED UI PRIMITIVES (ERROR BOUNDARY, ICONS, CARDS, INPUTS, TOAST, MODAL)
        // ============================================================================
        class AppErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, err: null };
            }
            static getDerivedStateFromError(err) { return { hasError: true, err }; }
            componentDidCatch(err, info) { console.error('App ErrorBoundary:', err, info); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6">
                            <div className="spatial-card max-w-md w-full rounded-3xl p-6 border-rose-500/40 text-center space-y-4">
                                <h2 className="font-display font-bold text-lg text-rose-400">พบข้อผิดพลาดในการแสดงผล</h2>
                                <p className="text-xs font-mono bg-rose-500/10 text-rose-300 p-3 rounded-xl overflow-auto">
                                    {String(this.state.err?.message || this.state.err)}
                                </p>
                                <button
                                    type="button"
                                    onClick={() => window.location.reload()}
                                    className="touch-target w-full py-3 rounded-2xl bg-aurora-500 text-void-950 font-display font-bold text-sm"
                                >
                                    โหลดหน้าใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
            const Comp = LucideIcons[name] || LucideIcons.Sparkles || LucideIcons.Activity;
            if (!Comp) return null;
            return <Comp size={size} className={className} strokeWidth={strokeWidth} />;
        }

        function SpatialCard({ children, className = '' }) {
            return <div className={`spatial-card rounded-[1.75rem] ${className}`}>{children}</div>;
        }

        function ThemeToggleButton({ theme, onToggle, compact = false }) {
            const isDark = theme === 'dark';
            return (
                <button
                    type="button"
                    onClick={onToggle}
                    title={isDark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'}
                    aria-label="สลับโหมดมืดหรือสว่าง"
                    className="spatial-soft px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all active:scale-95 text-primary-adaptive shrink-0"
                >
                    <Icon name={isDark ? 'Sun' : 'Moon'} size={15} className={isDark ? 'text-amber-300' : 'text-indigo-600'} />
                    {!compact && <span className="hidden sm:inline">{isDark ? 'โหมดสว่าง' : 'โหมดมืด'}</span>}
                </button>
            );
        }

        function FormField({ label, className = '', ...props }) {
            return (
                <div className={`w-full ${className}`}>
                    {label && <label className="block text-xs font-bold text-secondary-adaptive mb-1.5 ml-1">{label}</label>}
                    <input className="touch-target spatial-input w-full px-4 py-3 rounded-2xl text-sm font-medium transition-all" {...props} />
                </div>
            );
        }

        function FormSelect({ label, options = [], className = '', ...props }) {
            return (
                <div className={`w-full ${className}`}>
                    {label && <label className="block text-xs font-bold text-secondary-adaptive mb-1.5 ml-1">{label}</label>}
                    <select className="touch-target spatial-input w-full px-4 py-3 rounded-2xl text-sm font-medium transition-all" {...props}>
                        {options.map(opt => {
                            const val = typeof opt === 'string' ? opt : opt.value;
                            const lbl = typeof opt === 'string' ? opt : opt.label;
                            return <option key={val} value={val}>{lbl}</option>;
                        })}
                    </select>
                </div>
            );
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[150] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-2xl flex items-center gap-2.5 text-xs sm:text-sm font-bold text-white ${
                        toast.type === 'error'
                            ? 'bg-rose-700/95 border-rose-400/60'
                            : toast.type === 'info'
                                ? 'bg-sky-700/95 border-sky-400/60'
                                : 'bg-emerald-700/95 border-emerald-400/60'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Sparkles' : 'CheckCircle2'} size={17} className="shrink-0 text-white" />
                        <span className="text-white">{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="fixed inset-0 z-[140] bg-slate-950/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="spatial-card w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] space-y-4">
                        <div className="flex items-start gap-3">
                            <div className="w-11 h-11 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
                                <Icon name="HelpCircle" size={22} />
                            </div>
                            <div>
                                <h3 className="font-display font-bold text-lg text-primary-adaptive">{dialog.title}</h3>
                                <p className="text-sm text-secondary-adaptive mt-1 leading-relaxed">{dialog.message}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button type="button" onClick={onClose} className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-display font-semibold text-sm">
                                ยกเลิก
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    const fn = dialog.onConfirm;
                                    onClose();
                                    if (fn) fn();
                                }}
                                className="touch-target py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-bold text-sm"
                            >
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 4. INTERACTIVE AI SUB-MODULES (CLINICAL CASES, FLASHCARDS, PRE-APPROACH)
        // ============================================================================
        function ClinicalCaseSimulatorTab({ cases, onToast }) {
            const [caseIdx, setCaseIdx] = useState(0);
            const [stepIdx, setStepIdx] = useState(0);
            const [pickedOpt, setPickedOpt] = useState(null);
            const [solvedMap, setSolvedMap] = useState({});

            const activeCase = cases[caseIdx] || cases[0];
            const activeStep = activeCase?.steps?.[stepIdx] || activeCase?.steps?.[0];
            const displayVitals = pickedOpt?.nextVitals || activeStep?.vitals || {};

            const handlePick = (opt) => {
                setPickedOpt(opt);
                if (opt.correct) {
                    setSolvedMap(prev => ({ ...prev, [`${activeCase.id}-${stepIdx}`]: true }));
                    onToast('ตัดสินใจทางคลินิกถูกต้องแม่นยำค่ะ!', 'success');
                } else {
                    onToast('สัญญาณชีพเปลี่ยนแปลง ลองทบทวนหลักการแล้วเลือกใหม่ได้ค่ะ', 'info');
                }
            };

            const selectCase = (idx) => {
                setCaseIdx(idx);
                setStepIdx(0);
                setPickedOpt(null);
            };

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">AI CLINICAL CASE SIMULATOR</span>
                            <h2 className="font-display text-lg sm:text-xl font-extrabold text-primary-adaptive">มินิเคสจำลองคลินิกแบบโต้ตอบ</h2>
                        </div>
                        <span className="px-3 py-1 rounded-full bg-aurora-500/15 text-accent-adaptive font-mono text-xs font-bold">
                            ผ่านแล้ว {Object.keys(solvedMap).length} จังหวะ
                        </span>
                    </div>

                    <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-1">
                        {cases.map((c, idx) => (
                            <button
                                key={c.id}
                                type="button"
                                onClick={() => selectCase(idx)}
                                className={`shrink-0 px-3.5 py-2 rounded-2xl text-xs font-bold border transition-all ${
                                    idx === caseIdx
                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 border-transparent font-extrabold'
                                        : 'spatial-soft text-secondary-adaptive'
                                }`}
                            >
                                เคสที่ {idx + 1}: {c.badge}
                            </button>
                        ))}
                    </div>

                    {activeCase && activeStep && (
                        <SpatialCard className="p-4 sm:p-6 space-y-4">
                            <div className="space-y-1">
                                <span className="inline-block px-2.5 py-0.5 rounded-full bg-prism-500/15 text-prism-adaptive font-mono text-[10px] font-bold">
                                    {activeCase.badge} • STEP {stepIdx + 1}/{activeCase.steps.length}
                                </span>
                                <h3 className="font-display font-bold text-base sm:text-lg text-primary-adaptive">{activeCase.title}</h3>
                                <p className="text-xs sm:text-sm text-secondary-adaptive">{activeCase.patientSummary}</p>
                            </div>

                            {/* Live Clinical Vitals Monitor */}
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 p-3.5 rounded-2xl bg-void-950/90 border border-aurora-400/30 text-white">
                                {Object.entries(displayVitals).map(([k, v]) => (
                                    <div key={k} className="p-2 rounded-xl bg-white/[0.04] border border-white/10">
                                        <span className="font-mono text-[9px] uppercase text-slate-400 block">{k}</span>
                                        <span className="font-mono text-sm font-extrabold text-aurora-300 mt-0.5 block">{v}</span>
                                    </div>
                                ))}
                            </div>

                            <p className="text-sm sm:text-base font-bold text-primary-adaptive leading-relaxed">{activeStep.situation}</p>

                            <div className="space-y-2.5">
                                {activeStep.options.map((opt, oIdx) => {
                                    const isPicked = pickedOpt === opt;
                                    return (
                                        <button
                                            key={oIdx}
                                            type="button"
                                            onClick={() => handlePick(opt)}
                                            className={`touch-target w-full text-left p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition-all ${
                                                isPicked
                                                    ? opt.correct
                                                        ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive'
                                                        : 'bg-rose-500/20 border-rose-400 text-primary-adaptive'
                                                    : 'spatial-soft text-secondary-adaptive hover:border-prism-400/50'
                                            }`}
                                        >
                                            {opt.label}
                                        </button>
                                    );
                                })}
                            </div>

                            {pickedOpt && (
                                <div className={`p-4 rounded-2xl border text-xs sm:text-sm leading-relaxed space-y-3 ${
                                    pickedOpt.correct
                                        ? 'bg-aurora-500/15 border-aurora-400/40 text-primary-adaptive'
                                        : 'bg-amber-500/15 border-amber-400/40 text-primary-adaptive'
                                }`}>
                                    <p className="font-bold flex items-center gap-1.5">
                                        <Icon name={pickedOpt.correct ? 'CheckCircle2' : 'AlertTriangle'} size={16} className={pickedOpt.correct ? 'text-accent-adaptive' : 'text-amber-400'} />
                                        ผลการตัดสินใจทางคลินิก:
                                    </p>
                                    <p>{pickedOpt.outcome}</p>
                                    {pickedOpt.correct && stepIdx < activeCase.steps.length - 1 && (
                                        <button
                                            type="button"
                                            onClick={() => { setStepIdx(s => s + 1); setPickedOpt(null); }}
                                            className="px-4 py-2 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs inline-flex items-center gap-1.5"
                                        >
                                            ไปจังหวะถัดไป <Icon name="ArrowRight" size={14} />
                                        </button>
                                    )}
                                </div>
                            )}
                        </SpatialCard>
                    )}
                </div>
            );
        }

        function SmartFlashcardsTab({ cards, weakDomainIds }) {
            const prioritizedCards = useMemo(() => {
                const weakSet = new Set(weakDomainIds || []);
                return [...cards].sort((a, b) => Number(weakSet.has(b.domain)) - Number(weakSet.has(a.domain)));
            }, [cards, weakDomainIds]);

            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [mastered, setMastered] = useState({});

            const current = prioritizedCards[idx] || prioritizedCards[0];
            const domainMeta = current ? CLINICAL_DOMAINS[current.domain] : null;
            const isPriority = current && (weakDomainIds || []).includes(current.domain);

            const goNext = (markMastered = false) => {
                if (markMastered && current) {
                    setMastered(prev => ({ ...prev, [current.id]: true }));
                }
                setFlipped(false);
                setIdx(prev => (prev + 1) % prioritizedCards.length);
            };

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">AI SPACED-REPETITION • 3-MINUTE SMART DECK</span>
                            <h2 className="font-display text-lg sm:text-xl font-extrabold text-primary-adaptive">การ์ดทบทวนความจำเฉพาะจุดอ่อน</h2>
                        </div>
                        <span className="px-3 py-1 rounded-full bg-aurora-500/15 text-accent-adaptive font-mono text-xs font-bold">
                            จำแม่นแล้ว {Object.keys(mastered).length}/{prioritizedCards.length} ใบ
                        </span>
                    </div>

                    {current && (
                        <SpatialCard className="p-5 sm:p-8 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center gap-2">
                                    <span className="px-2.5 py-1 rounded-lg bg-prism-500/15 text-prism-adaptive font-mono text-xs font-bold">
                                        CARD {idx + 1} / {prioritizedCards.length}
                                    </span>
                                    {domainMeta && (
                                        <span className="px-2.5 py-1 rounded-full spatial-soft text-[11px] font-bold text-secondary-adaptive">
                                            {domainMeta.shortName}
                                        </span>
                                    )}
                                </div>
                                {isPriority && (
                                    <span className="px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 font-bold text-[10px]">
                                        ★ AI แนะนำทบทวนจากผล Pre-test
                                    </span>
                                )}
                            </div>

                            <button
                                type="button"
                                onClick={() => setFlipped(f => !f)}
                                className="w-full min-h-[210px] p-6 rounded-3xl spatial-soft border-2 border-dashed border-aurora-400/40 flex flex-col items-center justify-center text-center gap-3 transition-all active:scale-[0.99]"
                            >
                                <span className="font-mono text-[10px] font-bold uppercase text-accent-adaptive">
                                    {flipped ? 'คำตอบและหลักเกณฑ์คลินิก (แตะเพื่อพลิกกลับ)' : 'คำถามทบทวน (แตะที่การ์ดเพื่อดูเฉลย)'}
                                </span>

            const handleGenerate = async () => {

                const prompt = `ช่วยจัดทำแนวทางอุ่นเครื่อง 30 วินาทีก่อนเข้าพูดคุยให้ข้อมูลญาติผู้เสียชีวิต (ห้ามรับหรืออ้างถึงชื่อผู้ป่วยเด็ดขาด)
บริบทแบบ Zero-PII:
- ช่วงอายุผู้ป่วย: ${ageGroup}
- สาเหตุการเสียชีวิต: ${cause}
- อารมณ์ครอบครัวเบื้องต้น: ${mood}
- ข้อกังวลหลักของญาติ: ${concern}

2) เช็กลิสต์หลักการสำคัญ (Setting, Empathy, Decoupling, Zero Pressure)
3) แนวทางตอบข้อกังวลหลักอย่างเคารพและตรงไปตรงมา`;

                let result = '';
                if (appsScriptUrl) {
                    try {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt,
                                systemInstruction: `คุณคือ AI โค้ชฝึกทักษะสื่อสารคลินิก อ้างอิงเฉพาะฐานความรู้นี้:\n${window.CLINICAL_KNOWLEDGE_BASE || ''}`

• “สวัสดีค่ะ ดิฉันเป็นพยาบาลผู้ประสานงานจากทีมดูแล ขอแสดงความเสียใจอย่างสุดซึ้งกับเหตุการณ์ที่เกิดขึ้นนะคะ ขอบคุณที่มานั่งพูดคุยกันในพื้นที่ที่เป็นส่วนตัวนี้ค่ะ”
• “ดิฉันเข้าใจดีเลยค่ะว่าตอนนี้ครอบครัวกำลัง${mood} ไม่ต้องรีบอะไรเลยนะคะ ดิฉันอยู่ตรงนี้เพื่อรับฟังและค่อยๆ อธิบายทุกข้อสงสัยให้ชัดเจนค่ะ”

2) เช็กลิสต์ 30 วินาที (SPIKES & Decoupling):
• Setting: นั่งในพื้นที่เงียบสงบ เป็นส่วนตัว ปิดเสียงรบกวน
• Empathy & Silence: สะท้อนความรู้สึกสูญเสีย และเว้นจังหวะเงียบ 2.5 วินาที
• Decoupling: แยกการทำความเข้าใจภาวะสมองตายออกจากการเสนอทางเลือกบริจาคอวัยวะ

3) แนวทางตอบประเด็น “${concern}”:
• รับฟังด้วยความเคารพ ไม่ตำหนิหรือโต้แย้ง ให้ข้อมูลอย่างโปร่งใสตามเกณฑ์ ODC สภากาชาดไทย และให้ความมั่นใจเรื่องการดูแลตกแต่งร่างอย่างประณีตสมเกียรติที่สุดโดยไม่เร่งรัดการตัดสินใจค่ะ`;
                }

                setPlanText(result);
                setLoading(false);
                onToast('AI เตรียมแนวทางอุ่นเครื่อง 30 วิเรียบร้อยแล้วค่ะ');
            };

            return (
                <SpatialCard className="p-5 sm:p-6 space-y-4 border-prism-400/30">
                    <div className="flex flex-wrap items-center justify-between gap-2">

                            <h3 className="font-display font-bold text-base sm:text-lg text-primary-adaptive">
                                ผู้ช่วย AI อุ่นเครื่อง 30 วิก่อนพบญาติจริง
                            </h3>
                        </div>
                        <span className="px-2.5 py-1 rounded-full bg-aurora-500/15 text-accent-adaptive font-mono text-[10px] font-bold">
                            ห้ามกรอกชื่อ/HN ผู้ป่วย
                        </span>
                    </div>

                    <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-400/30 text-[11px] text-secondary-adaptive leading-relaxed">
                        <b className="text-amber-400">ขอบเขตเพื่อการเรียนรู้ (Educational Disclaimer):</b> เครื่องมือนี้ช่วยทบทวนหลักการสื่อสารเท่านั้น ไม่ใช่เครื่องมือวินิจฉัยหรือสั่งการรักษาแทนแพทย์ และใช้ปุ่มเลือกบริบทเพื่อคุ้มครองข้อมูลส่วนบุคคลผู้ป่วย (PDPA)
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <FormSelect label="ช่วงอายุผู้ป่วย" value={ageGroup} onChange={e => setAgeGroup(e.target.value)} options={PRE_APPROACH_TAGS.ageGroups} />
                        <FormSelect label="สาเหตุการเสียชีวิต" value={cause} onChange={e => setCause(e.target.value)} options={PRE_APPROACH_TAGS.causes} />
                        <FormSelect label="อารมณ์ครอบครัวเบื้องต้น" value={mood} onChange={e => setMood(e.target.value)} options={PRE_APPROACH_TAGS.familyMoods} />
                        <FormSelect label="ข้อกังวลหลักของญาติ" value={concern} onChange={e => setConcern(e.target.value)} options={PRE_APPROACH_TAGS.concerns} />
                    </div>

                    <button
                        type="button"
                        onClick={handleGenerate}
                        disabled={loading}
                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                    >
                        <Icon name="Sparkles" size={17} />
                        {loading ? 'AI กำลังเรียบเรียงแนวทาง...' : 'สร้างแนวทางสื่อสาร 30 วินาที (PDPA-Safe)'}
                    </button>

                    {planText && (
                        <div className="p-4 rounded-2xl spatial-soft text-xs sm:text-sm text-primary-adaptive whitespace-pre-line leading-relaxed">
                            {planText}
                        </div>
                    )}
                </SpatialCard>
            );
        }

        // ============================================================================
        // 5. MAIN LEARNER APPLICATION (PRODUCTION 2027)
        // ============================================================================
        function App() {
            const adminPreviewTarget = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);
            const isAdminPreview = Boolean(adminPreviewTarget);

            // 1. Adaptive Theme (synced across all files via rjcloud_theme)
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f8fafc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => {
                setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            // 2. Cloud Content & Settings States
            const [lessons, setLessons] = useState(() =>
                (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0)
                    ? window.INITIAL_LESSONS
                    : FALLBACK_LESSONS
            );
            const [questionSets, setQuestionSets] = useState(() => [
                parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW)
            ]);
            const [certTemplate, setCertTemplate] = useState(() => ({ ...DEFAULT_CERT_TEMPLATE }));
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 8,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [leaderboard, setLeaderboard] = useState([]);
            const [isCloudReady, setIsCloudReady] = useState(false);

            // 3. Learner Session & Navigation States
            const [user, setUser] = useState(() => {
                if (isAdminPreview) {
                    return {
                        id: 'admin_preview_2027',
                        license: 'ADMIN2027',
                        name: 'ผู้ดูแลระบบ (Admin Preview)',
                        email: CONFIG.contactEmail,
                        phone: '0800000000',
                        position: 'พยาบาลวิชาชีพชำนาญการ',
                        workContext: 'ทีมรับบริจาค/ปลูกถ่ายอวัยวะ (TC)',
                        department: 'กรมการแพทย์',
                        hospital: 'รพ.ราชวิถี',
                        province: 'กรุงเทพมหานคร',
                        userType: 'เรียนใหม่',
                        status: 'กำลังเรียน',
                        pretest: '32/40',
                        posttest: '36/40',
                        progress: 100,
                        studySeconds: 28800,
                        skillLabPassed: true,
                        skillLabBestScore: 91,
                        skillLabLatestRadar: { setting: 92, empathy: 90, clarity: 91, vocal: 89, dignity: 93 },
                        certificateCode: 'RJC-2027-PREVIEW',
                        certificateIssuedAt: new Date().toISOString()
                    };
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (isAdminPreview) {
                    if (['landing', 'pretest', 'posttest', 'cert_confirm', 'certificate'].includes(adminPreviewTarget)) {
                        return adminPreviewTarget;
                    }
                    if (['auth1', 'auth2', 'auth3'].includes(adminPreviewTarget)) return 'auth';
                    return 'dashboard';
                }
                if (window.location.hash === '#dashboard') {
                    try {
                        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                        if (saved?.user?.id) return 'dashboard';
                    } catch (_) {}
                }
                return 'landing';
            });

            const [activeTab, setActiveTab] = useState(() => {
                if (isAdminPreview && ['live', 'leaderboard', 'profile'].includes(adminPreviewTarget)) {
                    return adminPreviewTarget;
                }
                return 'lessons';
            });

            // 4. Auth Wizard States (3 Steps + OTP)
            const [authStep, setAuthStep] = useState(() => {
                if (adminPreviewTarget === 'auth2') return 2;
                if (adminPreviewTarget === 'auth3') return 3;
                return 1;
            });
            const [authLoading, setAuthLoading] = useState(false);
            const [authForm, setAuthForm] = useState({
                license: '',
                name: '',
                email: '',
                phone: '',
                position: 'พยาบาลวิชาชีพ',
                workContext: 'หอผู้ป่วยวิกฤต (ICU) / ER / OR',
                department: 'กรมการแพทย์',
                hospital: 'รพ.ราชวิถี',
                province: 'กรุงเทพมหานคร',
                userType: 'เรียนใหม่'
            });
            const [existingCloudRecord, setExistingCloudRecord] = useState(null);
            const [otpInput, setOtpInput] = useState('');
            const [otpCooldown, setOtpCooldown] = useState(0);

            // 5. Study Progress, Quiz & AI Diagnosis States
            const [currentLessonId, setCurrentLessonId] = useState(() => user?.lastVideoId || 1);
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));
            const [isLiveCheckedIn, setIsLiveCheckedIn] = useState(false);
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizIndex, setQuizIndex] = useState(0);
            const [quizSubmitted, setQuizSubmitted] = useState(false);
            const [quizScoreSummary, setQuizScoreSummary] = useState(null);
            const [lastDiagnosis, setLastDiagnosis] = useState(() => user?.aiRoadmap || null);
            const [remediationAiText, setRemediationAiText] = useState('');
            const [isRemediationLoading, setIsRemediationLoading] = useState(false);

            // 6. AI Study Companion Panel States
            const [aiQuestion, setAiQuestion] = useState('');
            const [aiMessages, setAiMessages] = useState([]);
            const [isAiAnswering, setIsAiAnswering] = useState(false);
            const [microCheckPicked, setMicroCheckPicked] = useState({});
            const [isAudioSpeaking, setIsAudioSpeaking] = useState(false);

            // 7. Certificate & CSAT States
            const [certFormName, setCertFormName] = useState(() => user?.name || '');
            const [certFormHosp, setCertFormHosp] = useState(() => user?.hospital || '');
            const [csatRating, setCsatRating] = useState(5);
            const [csatComment, setCsatComment] = useState('');
            const [isIssuingCert, setIsIssuingCert] = useState(false);

            // 8. UI Feedback States
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', confirmText: 'ยืนยัน', onConfirm: null });
            const [previewBarOpen, setPreviewBarOpen] = useState(false);

            // Refs
            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);
            const certCanvasRef = useRef(null);
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const quizAutoTimerRef = useRef(null);
            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);

            // Derived Values (ประกาศก่อนฟังก์ชันใช้งานทุกจุดเพื่อป้องกัน ReferenceError)
            const quizQuestions = useMemo(
                () => (Array.isArray(questionSets[0]) && questionSets[0].length > 0 ? questionSets[0] : parseRawExams(FALLBACK_QUIZ_RAW)),
                [questionSets]
            );
            const currentLesson = useMemo(
                () => lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0],
                [lessons, currentLessonId]
            );
            const currentLessonGuide = useMemo(() => {
                const map = window.LESSON_AI_GUIDES || {};
                return map[currentLesson?.id] || {
                    keyPoints: [
                        `สรุปหลักการสำคัญของบทที่ ${currentLesson?.id || 1}: ${currentLesson?.title || ''}`,
                        'ยึดหลักความปลอดภัยทางคลินิก มาตรฐานสภากาชาดไทย (ODC) และจริยธรรมการเคารพผู้ป่วยและครอบครัว'
                    ],
                    microCheck: null
                };
            }, [currentLesson]);

            const roleProfile = useMemo(() => resolveRoleProfile(user), [user]);
            const targetHours = useMemo(() => getTargetHoursForUser(user, liveConfig), [user, liveConfig]);
            const targetSeconds = targetHours * 3600;
            const liveStudyPercent = useMemo(() => {
                const computed = Math.min(100, Math.round((studySeconds / Math.max(1, targetSeconds)) * 100));
                return Math.max(Number(user?.progress || 0), computed);
            }, [studySeconds, targetSeconds, user?.progress]);

            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyRequirementMet = liveStudyPercent >= MIN_STUDY_PERCENT;
            const hasPassedSkillLab = Boolean(
                user?.skillLabPassed ||
                (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0)
            );
            const canEnterSkillLab = isAdminPreview || (hasDonePretest && isStudyRequirementMet);
            const canTakePosttest = isAdminPreview || liveConfig.allowPosttest || (hasDonePretest && isStudyRequirementMet && hasPassedSkillLab);
            const hasPassedPosttest = Boolean(user?.status === 'ผ่าน');

            // 9. Lifecycle Effects
            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            useEffect(() => {
                return () => {
                    if (quizAutoTimerRef.current) clearTimeout(quizAutoTimerRef.current);
                };
            }, []);

            useEffect(() => {
                if (screen === 'pretest' || screen === 'posttest') {
                    setQuizIndex(0);
                    if (quizAutoTimerRef.current) {
                        clearTimeout(quizAutoTimerRef.current);
                        quizAutoTimerRef.current = null;
                    }
                }
            }, [screen]);

            useEffect(() => {
                if (otpCooldown <= 0) return;
                const t = setTimeout(() => setOtpCooldown(c => c - 1), 1000);
                return () => clearTimeout(t);
            }, [otpCooldown]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            const stopAudioBrief = useCallback(() => {
                if (audioRef.current) {
                    try { audioRef.current.pause(); } catch (_) {}
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsAudioSpeaking(false);
            }, []);

            useEffect(() => () => stopAudioBrief(), [stopAudioBrief]);

            // Firebase Auth + Live Settings/Content/Leaderboard Subscriptions (ป้องกันทับ Session แอดมินตอน Preview)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let anonAttempted = false;
                let unsubSettings = null;
                let unsubContent = null;
                let unsubBoard = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) return;
                        if (!anonAttempted) {
                            anonAttempted = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') {
                                    await fbAuth.authStateReady();
                                }
                                if (active && !fbAuth.currentUser) {
                                    await signInAnonymously(fbAuth);
                                }
                            } catch (_) {}
                        }
                        return;
                    }
                    setIsCloudReady(true);

                    // รีเฟรชข้อมูลผู้เรียนจาก Firestore หากล็อกอินค้างไว้
                    const cur = userRef.current;
                    if (!isAdminPreview && cur?.id && !String(cur.id).startsWith('admin_preview_')) {
                        try {
                            const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(cur.id)));
                            if (snap.exists()) {
                                const cloudData = snap.data();
                                const merged = {
                                    ...cur,
                                    ...cloudData,
                                    studySeconds: Math.max(Number(cur.studySeconds || 0), Number(cloudData.studySeconds || 0)),
                                    progress: Math.max(Number(cur.progress || 0), Number(cloudData.progress || 0))
                                };
                                setUser(merged);
                                setStudySeconds(merged.studySeconds);
                                localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: merged }));
                            }
                        } catch (_) {}
                    }

                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                    if (unsubBoard) unsubBoard();

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        },
                        () => {}
                    );

                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );

                    unsubBoard = onSnapshot(
                        collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard'),
                        (snap) => {
                            const arr = [];
                            snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                            arr.sort((a, b) => Number(b.score || 0) - Number(a.score || 0));
                            setLeaderboard(arr.slice(0, 20));
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                    if (unsubBoard) unsubBoard();
                };
            }, [isAdminPreview]);

            // 10. PERSIST USER HELPER
            const saveUserProgress = useCallback(async (patch = {}) => {
                const cur = userRef.current;
                if (!cur) return null;
                const nextSec = patch.studySeconds !== undefined ? patch.studySeconds : studySecondsRef.current;
                const calcProg = Math.min(100, Math.round((nextSec / Math.max(1, targetSeconds)) * 100));
                const nextUser = {
                    ...cur,
                    ...patch,
                    studySeconds: nextSec,
                    progress: Math.max(Number(cur.progress || 0), Number(patch.progress || 0), calcProg)
                };
                setUser(nextUser);
                if (isAdminPreview) return nextUser;

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: nextUser }));
                } catch (_) {}

                if (fbDb && nextUser.id && !String(nextUser.id).startsWith('admin_preview_')) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            nextUser,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Firestore user sync warning:', err);
                    }
                }
                return nextUser;
            }, [isAdminPreview, targetSeconds]);

            // Active Study Timer (นับเฉพาะตอนเปิดจออยู่จริงผ่าน Page Visibility API)
            useEffect(() => {
                if (screen !== 'dashboard' || !user || isAdminPreview) return;
                if (activeTab !== 'lessons' && activeTab !== 'live') return;

                let tickCount = 0;
                const timer = setInterval(() => {
                    if (document.hidden) return;
                    setStudySeconds(prev => prev + 1);
                    tickCount += 1;
                    if (tickCount % 30 === 0) {
                        saveUserProgress({ lastVideoId: currentLessonId });
                    }
                }, 1000);

                const onVisChange = () => {
                    if (document.hidden) saveUserProgress({ lastVideoId: currentLessonId });
                };
                window.addEventListener('visibilitychange', onVisChange);
                window.addEventListener('beforeunload', onVisChange);

                return () => {
                    clearInterval(timer);
                    window.removeEventListener('visibilitychange', onVisChange);
                    window.removeEventListener('beforeunload', onVisChange);
                };
            }, [screen, activeTab, user, isAdminPreview, currentLessonId, saveUserProgress]);

            // Render Certificate Canvas when viewing certificate screen
            useEffect(() => {
                if (screen === 'certificate' && certCanvasRef.current && user) {
                    drawMinimalistGoldCertificate(
                        certCanvasRef.current,
                        {
                            code: user.certificateCode || generateCertCode(certTemplate.certPrefix),
                            name: user.name,
                            hospital: user.hospital,
                            license: user.license || user.id,
                            issuedAt: user.certificateIssuedAt || new Date().toISOString()
                        },
                        certTemplate
                    );
                }
            }, [screen, user, certTemplate]);

            // 11. AUTH WIZARD HANDLERS (PRODUCTION OTP)
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (!cleanLic || cleanLic.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพหรือรหัสบุคลากรให้ถูกต้องค่ะ', 'error');
                    return;
                }
                setAuthLoading(true);
                setExistingCloudRecord(null);
                try {
                    if (fbDb && isCloudReady) {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) {
                            const d = snap.data();
                            setExistingCloudRecord(d);
                            setAuthForm(prev => ({
                                ...prev,
                                license: cleanLic,
                                name: d.name || prev.name,
                                email: d.email || prev.email,
                                phone: d.phone || prev.phone,
                                position: d.position || prev.position,
                                workContext: d.workContext || prev.workContext,
                                department: d.department || prev.department,
                                hospital: d.hospital || prev.hospital,
                                province: d.province || prev.province,
                                userType: String(d.userType || '').includes('ต่อเนื่อง') ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'
                            }));
                            showToast('พบข้อมูลเดิมในระบบแล้ว กรุณาตรวจสอบข้อมูลและยืนยัน OTP ค่ะ');
                        } else {
                            setAuthForm(prev => ({ ...prev, license: cleanLic }));
                            showToast('ไม่พบข้อมูลเดิม กรุณากรอกข้อมูลเพื่อลงทะเบียนเรียนใหม่ค่ะ', 'info');
                        }
                    } else {
                        setAuthForm(prev => ({ ...prev, license: cleanLic }));
                    }
                    setAuthStep(2);
                } catch (err) {
                    console.warn('License lookup error:', err);
                    setAuthForm(prev => ({ ...prev, license: cleanLic }));
                    setAuthStep(2);
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleRequestOtp = async (e) => {
                if (e) e.preventDefault();
                if (!authForm.name.trim() || !authForm.email.trim()) {
                    showToast('กรุณากรอกชื่อ-นามสกุล และอีเมลให้ครบถ้วนค่ะ', 'error');
                    return;
                }
                if (!appsScriptUrl) {
                    showToast('ไม่พบการเชื่อมต่อระบบส่ง OTP กรุณาติดต่อผู้ดูแลระบบค่ะ', 'error');
                    return;
                }
                setAuthLoading(true);
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'requestOTP',
                            email: authForm.email.trim(),
                            name: authForm.name.trim()
                        })
                    }).then(r => r.json());

                    if (res?.status === 'success') {
                        setOtpCooldown(45);
                        setAuthStep(3);
                        showToast('จัดส่งรหัส OTP 6 หลักไปยังอีเมลของคุณแล้วค่ะ');

                        showToast(res?.message || 'ไม่สามารถส่งรหัส OTP ได้ในขณะนี้ค่ะ', 'error');
                    }
                } catch (err) {
                    showToast('เชื่อมต่อระบบส่ง OTP ไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ', 'error');
                } finally {
                    setAuthLoading(false);
                }
            };

            const handleVerifyOtpAndLogin = async (e) => {
                e.preventDefault();
                const cleanOtp = otpInput.replace(/[^0-9]/g, '');
                if (cleanOtp.length !== 6) {
                    showToast('กรุณากรอกรหัส OTP 6 หลักให้ครบค่ะ', 'error');
                    return;
                }
                setAuthLoading(true);
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'verifyOTP',
                            email: authForm.email.trim(),
                            otp: cleanOtp
                        })
                    }).then(r => r.json());

                    if (res?.status !== 'success') {
                        showToast(res?.message || 'รหัส OTP ไม่ถูกต้องหรือหมดอายุค่ะ', 'error');
                        setAuthLoading(false);
                        return;
                    }

                    const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                    const loggedUser = {
                        ...(existingCloudRecord || {}),
                        id: cleanLic,
                        license: cleanLic,
                        name: authForm.name.trim(),
                        email: authForm.email.trim().toLowerCase(),
                        phone: authForm.phone.trim(),
                        position: authForm.position.trim(),
                        workContext: authForm.workContext,
                        department: authForm.department,
                        hospital: authForm.hospital.trim(),
                        province: authForm.province.trim(),
                        userType: authForm.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                        status: existingCloudRecord?.status || 'กำลังเรียน',
                        pretest: existingCloudRecord?.pretest || '-',
                        posttest: existingCloudRecord?.posttest || '-',
                        progress: Number(existingCloudRecord?.progress || 0),
                        studySeconds: Number(existingCloudRecord?.studySeconds || 0),
                        lastVideoId: existingCloudRecord?.lastVideoId || 1,
                        skillLabPassed: Boolean(existingCloudRecord?.skillLabPassed),
                        skillLabHistory: Array.isArray(existingCloudRecord?.skillLabHistory) ? existingCloudRecord.skillLabHistory : []
                    };

                    setUser(loggedUser);
                    setStudySeconds(loggedUser.studySeconds);
                    setCurrentLessonId(loggedUser.lastVideoId);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: loggedUser }));

                    if (fbDb) {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic),
                            loggedUser,
                            { merge: true }
                        ).catch(() => {});
                    }

                    showToast(`ยินดีต้อนรับคุณ ${loggedUser.name} เข้าสู่ rjcloud.organ ค่ะ`);
                    if (!loggedUser.pretest || loggedUser.pretest === '-') {
                        setQuizAnswers({});
                        setQuizIndex(0);
                        setQuizSubmitted(false);
                        setScreen('pretest');
                    } else {
                        setScreen('dashboard');
                    }
                } catch (err) {
                    showToast('ตรวจสอบรหัส OTP ไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ', 'error');
                } finally {
                    setAuthLoading(false);
                }
            };

            // 12. PRE-TEST & POST-TEST HANDLERS (AUTO-ADVANCE + BACK NAVIGATION)
            const handleSelectQuizOption = (qIdx, oIdx) => {
                setQuizAnswers(prev => ({ ...prev, [qIdx]: oIdx }));
                if (quizAutoTimerRef.current) {
                    clearTimeout(quizAutoTimerRef.current);
                    quizAutoTimerRef.current = null;
                }
                if (qIdx < quizQuestions.length - 1) {
                    quizAutoTimerRef.current = setTimeout(() => {
                        setQuizIndex(curr => (curr === qIdx ? Math.min(quizQuestions.length - 1, qIdx + 1) : curr));
                        quizAutoTimerRef.current = null;
                    }, 180);
                }
            };

            const handleGoQuizStep = (targetIdx) => {
                if (quizAutoTimerRef.current) {
                    clearTimeout(quizAutoTimerRef.current);
                    quizAutoTimerRef.current = null;
                }
                const clamped = Math.max(0, Math.min(Math.max(0, quizQuestions.length - 1), targetIdx));
                setQuizIndex(clamped);
            };

            const handleSubmitQuiz = async (mode) => {
                if (quizAutoTimerRef.current) {
                    clearTimeout(quizAutoTimerRef.current);
                    quizAutoTimerRef.current = null;
                }
                const firstUnansweredIdx = quizQuestions.findIndex((_, idx) => quizAnswers[idx] === undefined);
                if (firstUnansweredIdx !== -1) {
                    const unansweredCount = quizQuestions.filter((_, idx) => quizAnswers[idx] === undefined).length;
                    setQuizIndex(firstUnansweredIdx);
                    showToast(`ยังทำข้อสอบไม่ครบ (เหลืออีก ${unansweredCount} ข้อ) พากลับไปข้อที่ ${firstUnansweredIdx + 1} แล้วค่ะ`, 'error');
                    return;
                }

                let correct = 0;
                quizQuestions.forEach((q, idx) => {
                    if (quizAnswers[idx] === q.answer) correct += 1;
                });
                const total = Math.max(1, quizQuestions.length);
                const percent = Math.round((correct / total) * 100);
                const scoreStr = `${correct}/${total}`;
                const diagnosis = computeDomainDiagnosis(quizQuestions, quizAnswers);
                const passed = percent >= MIN_POSTTEST_PERCENT;

                setQuizScoreSummary({ correct, total, percent, scoreStr, passed });
                setLastDiagnosis(diagnosis);
                setQuizSubmitted(true);

                if (mode === 'pretest') {
                    await saveUserProgress({ pretest: scoreStr, aiRoadmap: diagnosis });
                    showToast('บันทึกผล Pre-test และสร้างแผนการเรียน AI เฉพาะคุณแล้วค่ะ');
                } else {
                    await saveUserProgress({
                        posttest: scoreStr,
                        status: passed ? 'ผ่าน' : (user?.status === 'ผ่าน' ? 'ผ่าน' : 'กำลังเรียน'),
                        aiRoadmap: diagnosis
                    });

                    if (passed) {
                        showToast(`ยินดีด้วยค่ะ! ผ่าน Post-test (${percent}%) ปลดล็อกประกาศนียบัตรแล้วค่ะ 🎉`);
                    } else {
                        setIsRemediationLoading(true);
                        setRemediationAiText('');
                        const weakNames = diagnosis.weakDomains.map(d => `${d.nameTH} (${d.percent}%)`).join(', ');
                        let aiCoachMsg = '';
                        if (appsScriptUrl) {
                            try {
                                const res = await fetch(appsScriptUrl, {
                                    method: 'POST',
                                    body: JSON.stringify({
                                        action: 'callGemini',
                                        prompt: `ผู้เรียนทำ Post-test ได้ ${scoreStr} (${percent}%) ยังไม่ถึงเกณฑ์ ${MIN_POSTTEST_PERCENT}% โดยมีหมวดที่คะแนนน้อยคือ: ${weakNames} กรุณาสรุปหลักการทางคลินิกที่ควรทบทวนสั้นๆ 3-4 ข้อแบบให้กำลังใจ โดยห้ามเฉลยข้อสอบตรงๆ`,
                                        systemInstruction: `คุณคือ AI Coach ประจำ rjcloud.organ ${roleProfile.aiPromptAddon}\nฐานความรู้:\n${window.CLINICAL_KNOWLEDGE_BASE || ''}`
                                    })
                                }).then(r => r.json());
                                if (res?.status === 'success' && res.text) aiCoachMsg = res.text;
                            } catch (_) {}
                        }
                        setRemediationAiText(aiCoachMsg);
                        setIsRemediationLoading(false);
                    }
                }
            };

            // 13. AI STUDY COMPANION (ROLE-ADAPTIVE Q&A + AUDIO BRIEF)
            const handlePlayLessonAudioBrief = async () => {
                if (isAudioSpeaking) {
                    stopAudioBrief();
                    return;
                }
                const speechText = `สรุปบทเรียนที่ ${currentLesson?.id || 1} เรื่อง ${currentLesson?.title || ''} สำหรับ${roleProfile.badgeTH}ค่ะ ` +
                    (currentLessonGuide.keyPoints || []).map((pt, i) => `ประเด็นที่ ${i + 1} ${pt}`).join(' ');

                setIsAudioSpeaking(true);
                if (appsScriptUrl) {
                    try {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'callGeminiTTS', text: speechText, voiceName: 'Aoede' })
                        }).then(r => r.json());
                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const wavUrl = pcm16ToWavUrl(res.inlineData.data, rate);
                            audioUrlRef.current = wavUrl;
                            const audio = new Audio(wavUrl);
                            audioRef.current = audio;
                            audio.onended = () => stopAudioBrief();
                            audio.onerror = () => stopAudioBrief();
                            await audio.play();
                            return;
                        }
                    } catch (_) {}
                }

                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(speechText);
                        utter.lang = 'th-TH';
                        utter.rate = 1.0;
                        utter.onend = () => setIsAudioSpeaking(false);
                        utter.onerror = () => setIsAudioSpeaking(false);
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }
                setIsAudioSpeaking(false);
                showToast('อุปกรณ์นี้ไม่รองรับการอ่านเสียงอัตโนมัติค่ะ', 'error');
            };

            const handleAskAiCompanion = async (e, presetText = null) => {

บทเรียนปัจจุบัน: บทที่ ${currentLesson?.id || 1} — ${currentLesson?.title || ''}
ประเด็นหลักของบทนี้: ${(currentLessonGuide.keyPoints || []).join(' | ')}
บริบทตำแหน่งผู้เรียน: ${roleProfile.badgeTH} — ${roleProfile.aiPromptAddon}
ฐานความรู้คลินิกกลาง:
${window.CLINICAL_KNOWLEDGE_BASE || ''}

ตอบคำถามผู้เรียนเป็นภาษาไทยที่สุภาพ กระชับ ถูกต้องตามหลักการแพทย์และจริยธรรม และเชื่อมโยงกับการปฏิบัติงานจริงค่ะ`;
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'callGemini', prompt: question, systemInstruction: sys })
                        }).then(r => r.json());

                }

                }

                setAiMessages(prev => [...prev, { id: Date.now() + 1, role: 'ai', text: reply }]);
                setIsAiAnswering(false);
            };

            // 14. CERTIFICATE ISSUANCE & DOWNLOAD HANDLERS
            const handleConfirmIssueCertificate = async (e) => {
                e.preventDefault();
                if (!certFormName.trim()) {
                    showToast('กรุณากรอกชื่อ-นามสกุลที่จะแสดงบนประกาศนียบัตรค่ะ', 'error');

                    satisfactionScore: csatRating,

                });

                setIsIssuingCert(false);
