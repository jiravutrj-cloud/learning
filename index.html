                                                </button>
                                                <div className="flex items-center gap-2">
                                                    <button type="button" disabled={activeLessonIdx <= 0} onClick={() => setActiveLessonIdx(i => Math.max(0, i - 1))} className="neu-btn px-4 py-2.5 text-xs font-bold">← บทก่อนหน้า</button>
                                                    <button type="button" disabled={activeLessonIdx >= lessons.length - 1} onClick={() => setActiveLessonIdx(i => Math.min(lessons.length - 1, i + 1))} className="neu-btn px-4 py-2.5 text-xs font-bold text-[var(--neu-teal)]">บทถัดไป →</button>
                                                </div>
                                            </div>
                                        </article>

                                        {/* AI 1-Minute Summary Card (With Signature Play -> Waveform Button, NO Inline Chat Box) */}
                                        <article className="neu-card p-5 sm:p-7 space-y-4">
                                            <div className="flex flex-wrap items-center justify-between gap-3">
                                                <div>
                                                    <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase block">✦ AI 1-MINUTE SUMMARY • STUDIO 24kHz VOICE</span>
                                                    <h3 className="font-display font-extrabold text-base sm:text-lg text-[var(--neu-text)] m-0 mt-0.5">AI สรุปสาระสำคัญ 1 นาที</h3>
                                                </div>
                                                <NeumorphicPlayButton
                                                    activeKey={guideVoiceState.activeKey}
                                                    targetKey={`lesson_${activeLessonKey}`}
                                                    status={guideVoiceState.status}
                                                    labelIdle="Play สรุปเสียง"
                                                    onToggle={() => playStudioVoice(`lesson_${activeLessonKey}`, activeLessonSummaryText)}
                                                />
                                            </div>
                                            <div className="neu-inset p-4 sm:p-5 text-xs sm:text-sm text-[var(--neu-text-sub)] leading-relaxed whitespace-pre-line">
                                                {activeLessonSummaryText}
                                            </div>
                                        </article>
                                    </div>

                                    {/* Sidebar: AI Skill Lab 3D + Lesson Directory */}
                                    <aside className="lg:col-span-4 space-y-6">
                                        <div className="neu-card p-5 space-y-3.5">
                                            <span className="font-mono text-[10px] font-bold text-[var(--neu-rose)] uppercase block">● AI SKILL LAB 3D • 10-STEP HEART HOLOGRAM</span>
                                            <h3 className="font-display font-extrabold text-base text-[var(--neu-text)] leading-snug m-0">ห้องฝึกเจรจาขอรับบริจาคอวัยวะ 10 สเต็ป</h3>
                                            <p className="text-xs text-[var(--neu-text-sub)] leading-relaxed m-0">ฝึกสื่อสารกับโฮโลแกรมหัวใจ 3 มิติ พร้อมเสียง AI สตูดิโอ 24kHz และรายงานประเมินผล 5 แกนสมรรถนะ</p>
                                            <a href="./aiskilllab.html" onClick={() => saveSessionTwoLayer(user)} className="neu-btn-teal w-full py-3 font-display font-bold text-xs sm:text-sm">
                                                {isLabDone ? 'เข้าฝึกซ้ำใน AI Skill Lab 3D →' : 'เปิดห้องฝึก AI Skill Lab 3D →'}
                                            </a>
                                        </div>

                                        <div className="neu-card p-5 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase">สารบัญบทเรียน ({lessons.length} บท)</span>
                                                <span className="font-mono text-[10px] text-[var(--neu-text-muted)]">organ cloud 2.0</span>
                                            </div>
                                            <div className="space-y-2.5 max-h-[440px] overflow-y-auto custom-scrollbar pr-1">
                                                {lessons.map((item, idx) => {
                                                    const active = idx === activeLessonIdx;
                                                    return (
                                                        <button
                                                            key={item.id || idx}
                                                            type="button"
                                                            onClick={() => setActiveLessonIdx(idx)}
                                                            className={`neu-lesson-item ${active ? 'is-active' : ''} w-full text-left p-3.5 space-y-1`}
                                                        >
                                                            <div className="flex items-center justify-between gap-2">
                                                                <span className={`font-mono text-[10px] font-bold ${active ? 'text-[var(--neu-teal)]' : 'text-[var(--neu-text-muted)]'}`}>บทที่ {idx + 1}</span>
                                                                {active && <span className="font-mono text-[10px] text-[var(--neu-teal)] font-bold">● กำลังเรียน</span>}
                                                            </div>
                                                            <p className="font-display font-bold text-xs sm:text-[13px] text-[var(--neu-text)] leading-snug m-0">{item.title}</p>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </aside>
                                </section>
                            )}

                            {/* TAB 2: ICU POCKET PHRASES */}
                            {dashTab === 'phrases' && (
                                <section className="neu-card p-5 sm:p-7 space-y-5">
                                    <div>
                                        <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase">ICU POCKET PHRASES • STUDIO 24kHz GUIDANCE</span>
                                        <h2 className="font-display font-extrabold text-xl text-[var(--neu-text)] m-0 mt-0.5">คลังคำพูดสื่อสารฉุกเฉินหน้างาน ICU</h2>
                                        <p className="text-xs sm:text-sm text-[var(--neu-text-sub)] mt-1 m-0">กดปุ่ม <b>Play</b> เพื่อฟังตัวอย่างน้ำเสียงการสื่อสารที่อ่อนโยนและเป็นมืออาชีพในแต่ละขั้นตอนค่ะ</p>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {POCKET_PHRASES.map((ph, idx) => (
                                            <div key={idx} className="neu-inset p-4 sm:p-5 flex flex-col justify-between gap-3.5">
                                                <div className="space-y-1.5">
                                                    <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase block">{ph.stage}</span>
                                                    <p className="text-xs sm:text-sm text-[var(--neu-text)] leading-relaxed m-0">“{ph.phrase}”</p>
                                                </div>
                                                <div>
                                                    <NeumorphicPlayButton
                                                        activeKey={guideVoiceState.activeKey}
                                                        targetKey={`phrase_${idx}`}
                                                        status={guideVoiceState.status}
                                                        labelIdle="Play ตัวอย่างเสียง"
                                                        onToggle={() => playStudioVoice(`phrase_${idx}`, ph.phrase)}
                                                    />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* TAB 3: LEARNER PROFILE */}
                            {dashTab === 'profile' && (
                                <section className="neu-card p-5 sm:p-7 space-y-5 max-w-3xl mx-auto">
                                    <div className="flex flex-wrap items-center justify-between gap-3">
                                        <div>
                                            <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase">LEARNER PROFILE • organ cloud 2.0 DATA CENTER</span>
                                            <h2 className="font-display font-extrabold text-xl text-[var(--neu-text)] m-0 mt-0.5">{user.name}</h2>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setEditForm({
                                                    professionGroup: userCreditMeta.professionGroup,
                                                    name: user.name || '', nameEN: user.nameEN || '',
                                                    position: user.position || '', hospital: user.hospital || '', phone: user.phone || ''
                                                });
                                                setEditProfileOpen(true);
                                            }}
                                            className="neu-btn px-4 py-2.5 text-xs font-bold"
                                        >
                                            <Icon name="Edit3" size={14} /> แก้ไขโปรไฟล์
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-xs sm:text-sm">
                                        <div className="neu-inset p-4 space-y-1">
                                            <span className="font-mono text-[10.5px] font-bold text-[var(--neu-text-muted)] block">กลุ่มวิชาชีพ &amp; สิทธิ์หน่วยคะแนน</span>
                                            <p className="font-display font-bold text-[var(--neu-teal)] m-0">{userCreditMeta.professionGroup} • {userCreditMeta.lineTextTH}</p>
                                        </div>
                                        <div className="neu-inset p-4 space-y-1">
                                            <span className="font-mono text-[10.5px] font-bold text-[var(--neu-text-muted)] block">ประเภทผู้เรียน (ระบบกำหนดอัตโนมัติ)</span>
                                            <p className="font-display font-bold text-[var(--neu-text)] m-0">{isExempt ? 'เทียบโอน (ยกเว้นชั่วโมงเรียน 100%)' : user.userType || 'เรียนใหม่'}</p>
                                        </div>
                                        <div className="neu-inset p-4 space-y-1">
                                            <span className="font-mono text-[10.5px] font-bold text-[var(--neu-text-muted)] block">{userCreditMeta.licenseLabelTH}</span>
                                            <p className="font-mono font-bold text-[var(--neu-text)] m-0">{user.license || user.id}</p>
                                        </div>
                                        <div className="neu-inset p-4 space-y-1">
                                            <span className="font-mono text-[10.5px] font-bold text-[var(--neu-text-muted)] block">หน่วยงาน / โรงพยาบาล</span>
                                            <p className="font-display font-bold text-[var(--neu-text)] m-0">{user.hospital || '-'} • {user.department || '-'}</p>
                                        </div>
                                    </div>
                                </section>
                            )}
                        </main>
                    )}

                    {/* ==================== SCREEN: PRE-TEST & POST-TEST (NEUMORPHIC) ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && (
                        <main className="no-print-letter max-w-3xl w-full mx-auto px-4 py-6 space-y-5 flex-1">
                            <div className="neu-card p-5 sm:p-7 space-y-2">
                                <div className="flex items-center justify-between gap-2">
                                    <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase">
                                        {screen === 'pretest' ? 'STEP 01 • PRE-TEST ASSESSMENT' : `STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                                    </span>
                                    <span className="font-mono text-xs font-bold text-[var(--neu-text-sub)]">ตอบแล้ว {Object.keys(quizAnswers).length} / {quizList.length} ข้อ</span>
                                </div>
                                <h1 className="font-display font-extrabold text-xl text-[var(--neu-text)] m-0">
                                    {screen === 'pretest' ? 'แบบทดสอบก่อนเรียน (Pre-test)' : 'แบบทดสอบหลังเรียน (Post-test)'}
                                </h1>
                                <div className="neu-progress-track"><div className="neu-progress-fill" style={{ width: `${Math.round((Object.keys(quizAnswers).length / Math.max(1, quizList.length)) * 100)}%` }} /></div>
                            </div>

                            <div className="space-y-4">
                                {quizList.map((q, idx) => (
                                    <div key={q.id || idx} className="neu-card p-5 space-y-3">
                                        <p className="font-display font-bold text-sm sm:text-base text-[var(--neu-text)] leading-relaxed m-0">
                                            <span className="font-mono text-[var(--neu-teal)] mr-2">{idx + 1}.</span>{q.question}
                                        </p>
                                        <div className="grid grid-cols-1 gap-2.5">
                                            {(q.options || []).map((opt, oi) => {
                                                const picked = Number(quizAnswers[q.id]) === oi;
                                                return (
                                                    <button
                                                        key={oi}
                                                        type="button"
                                                        onClick={() => setQuizAnswers(p => ({ ...p, [q.id]: oi }))}
                                                        className={`neu-lesson-item ${picked ? 'is-active' : ''} w-full text-left px-4 py-3 text-xs sm:text-sm flex items-center gap-3`}
                                                    >
                                                        <span className={`font-mono font-extrabold text-xs ${picked ? 'text-[var(--neu-teal)]' : 'text-[var(--neu-text-muted)]'}`}>{picked ? '●' : '○'}</span>
                                                        <span className="text-[var(--neu-text)]">{opt}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="flex gap-3 pb-6">
                                <button type="button" onClick={() => setScreen('dashboard')} className="neu-btn px-5 py-3.5 text-xs sm:text-sm font-bold">← กลับห้องเรียน</button>
                                <button type="button" onClick={() => handleSubmitQuiz(screen)} className="neu-btn-teal flex-1 py-3.5 font-display font-extrabold text-sm">
                                    {screen === 'pretest' ? 'ส่งคำตอบ Pre-test →' : 'ส่งคำตอบ Post-test & ประเมินผล →'}
                                </button>
                            </div>
                        </main>
                    )}

                    {/* ==================== SCREEN: CERT CONFIRM & R2R EVALUATION ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <main className="no-print-letter max-w-2xl w-full mx-auto px-4 py-7 flex-1">
                            <form onSubmit={handleClaimCertificate} className="neu-card p-6 sm:p-8 space-y-5">
                                <div>
                                    <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase">STEP 05 • EVALUATION &amp; CERTIFICATE CLAIM</span>
                                    <h1 className="font-display font-extrabold text-xl sm:text-2xl text-[var(--neu-text)] mt-1 m-0">ยืนยันชื่อบนประกาศนียบัตร &amp; ประเมินหลักสูตร</h1>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    <div><label className="block font-bold text-[var(--neu-text-sub)] mb-1 ml-1">ชื่อ–นามสกุล (ภาษาไทย) *</label><input required value={certNameTH} onChange={e => setCertNameTH(e.target.value)} className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" /></div>
                                    <div><label className="block font-bold text-[var(--neu-text-sub)] mb-1 ml-1">ชื่อ–นามสกุล (ภาษาอังกฤษ)</label><input value={certNameEN} onChange={e => setCertNameEN(e.target.value)} className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" /></div>
                                    <div className="sm:col-span-2"><label className="block font-bold text-[var(--neu-text-sub)] mb-1 ml-1">โรงพยาบาล / หน่วยงาน</label><input value={certHospital} onChange={e => setCertHospital(e.target.value)} className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" /></div>
                                </div>

                                <div className="neu-inset p-4 space-y-2.5">
                                    <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] block">ความพึงพอใจภาพรวมต่อ organ cloud 2.0 (CSAT 1–5)</span>
                                    <div className="grid grid-cols-5 gap-2">
                                        {[1, 2, 3, 4, 5].map(n => (
                                            <button key={n} type="button" onClick={() => setCsatScore(n)} className={`neu-btn py-2.5 font-mono font-extrabold text-sm ${csatScore === n ? 'is-pressed' : ''}`}>{n} ★</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="neu-inset p-4 space-y-3 text-xs">
                                    <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] block">แบบประเมินการใช้งานระบบ (SUS 1 = ไม่เห็นด้วยอย่างยิ่ง → 5 = เห็นด้วยอย่างยิ่ง)</span>
                                    {SUS_ITEMS.map(item => (
                                        <div key={item.key} className="space-y-1.5">
                                            <p className="text-[var(--neu-text-sub)] m-0">{item.label}</p>
                                            <div className="grid grid-cols-5 gap-1.5">
                                                {[1, 2, 3, 4, 5].map(v => (
                                                    <button key={v} type="button" onClick={() => setSusAnswers(p => ({ ...p, [item.key]: v }))} className={`neu-btn py-1.5 font-mono font-bold text-xs ${susAnswers[item.key] === v ? 'is-pressed' : ''}`}>{v}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button type="submit" className="neu-btn-teal touch-target w-full py-3.5 font-display font-extrabold text-sm">
                                    ยืนยันและออกประกาศนียบัตรดิจิทัลพร้อม QR →
                                </button>
                            </form>
                        </main>
                    )}

                    {/* ==================== SCREEN: DIGITAL CERTIFICATE & A4 LETTER ==================== */}
                    {screen === 'certificate' && user && (
                        <main className="no-print-letter max-w-4xl w-full mx-auto px-4 py-7 space-y-5 flex-1">
                            <div className="neu-card p-5 sm:p-7 space-y-5">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase">VERIFIED DIGITAL CERTIFICATE • {user.certificateCode}</span>
                                        <h1 className="font-display font-extrabold text-xl text-[var(--neu-text)] m-0 mt-0.5">ประกาศนียบัตรดิจิทัลของท่าน</h1>
                                    </div>
                                    <span className="font-mono text-xs font-bold text-[var(--neu-text-sub)]">{userCreditMeta.lineTextTH}</span>
                                </div>

                                <div className="neu-inset p-3 rounded-2xl">
                                    <div className="w-full aspect-[1.414/1] rounded-xl overflow-hidden bg-white shadow-lg">
                                        <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <button type="button" onClick={handleDownloadCertPdf} className="neu-btn-teal touch-target py-3.5 font-display font-bold text-xs sm:text-sm">
                                        <Icon name="FileDown" size={16} /> ดาวน์โหลด PDF
                                    </button>
                                    <button type="button" onClick={handleDownloadCertPng} className="neu-btn touch-target py-3.5 font-display font-bold text-xs sm:text-sm">
                                        <Icon name="Image" size={16} /> ดาวน์โหลดภาพ PNG
                                    </button>
                                    <button type="button" onClick={handlePrintCertLetter} className="neu-btn touch-target py-3.5 font-display font-bold text-xs sm:text-sm">
                                        <Icon name="Printer" size={16} /> พิมพ์หนังสือรับรอง A4
                                    </button>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* Printable Individual A4 Certification Letter */}
                    {user?.certificateCode && (
                        <article id="individual-cert-letter" className="max-w-3xl mx-auto space-y-5 text-sm leading-relaxed">
                            <div className="text-center border-b-2 border-slate-800 pb-4 space-y-1">
                                <p className="font-bold text-emerald-800 m-0">{userCreditMeta.letterHeadingTH}</p>
                                <h2 className="font-display text-xl font-extrabold m-0">{certTemplate.orgTitleTH}</h2>
                                <p className="text-xs text-slate-600 m-0">รหัสอ้างอิงประกาศนียบัตร: {user.certificateCode} • วันที่ออกเอกสาร: {formatThaiDateSafe(user.certificateIssuedAt)}</p>
                            </div>
                            <p>ขอรับรองว่า <b>{user.name}</b> ({userCreditMeta.licenseLabelTH}: <b>{user.license || user.id}</b>) สังกัด <b>{user.hospital || '-'}</b> ได้ผ่านการอบรมหลักสูตร <b>{certTemplate.courseTitleTH}</b> ครบตามเกณฑ์มาตรฐานของระบบ <b>organ cloud 2.0</b> เรียบร้อยแล้ว ({userCreditMeta.lineTextTH})</p>
                            <div className="pt-10 text-right">
                                <p className="m-0">ลงชื่อ ...............................................................</p>
                                <p className="font-bold m-0 mt-1">({certTemplate.signerName})</p>
                                <p className="text-xs text-slate-600 m-0">{certTemplate.signerPosition}</p>
                            </div>
                        </article>
                    )}

                    {/* Edit Profile Modal */}
                    {editProfileOpen && (
                        <div className="no-print-letter fixed inset-0 z-[170] bg-slate-950/65 backdrop-blur-md flex items-end sm:items-center justify-center p-3 sm:p-5">
                            <form onSubmit={handleSaveProfileEdit} className="neu-card w-full max-w-md p-6 space-y-3.5 text-xs">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-display font-extrabold text-base text-[var(--neu-text)] m-0">แก้ไขข้อมูลโปรไฟล์</h3>
                                    <button type="button" onClick={() => setEditProfileOpen(false)} className="neu-btn w-8 h-8 font-bold">✕</button>
                                </div>
                                <select value={editForm.professionGroup} onChange={e => setEditForm(p => ({ ...p, professionGroup: e.target.value }))} className="touch-target neu-input w-full px-3.5 py-2.5 text-sm">
                                    {PROFESSION_OPTIONS.map(o => <option key={o.id} value={o.value}>{o.label}</option>)}
                                </select>
                                <input required value={editForm.name} onChange={e => setEditForm(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ–นามสกุล (ไทย)" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" />
                                <input value={editForm.nameEN} onChange={e => setEditForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="ชื่อ–นามสกุล (อังกฤษ)" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" />
                                <input value={editForm.position} onChange={e => setEditForm(p => ({ ...p, position: e.target.value }))} placeholder="ตำแหน่ง" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" />
                                <input value={editForm.hospital} onChange={e => setEditForm(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล / หน่วยงาน" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" />
                                <input value={editForm.phone} onChange={e => setEditForm(p => ({ ...p, phone: e.target.value }))} placeholder="เบอร์โทรศัพท์" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" />
                                <div className="flex gap-2 pt-1">
                                    <button type="button" onClick={() => setEditProfileOpen(false)} className="neu-btn flex-1 py-3 font-bold">ยกเลิก</button>
                                    <button type="submit" className="neu-btn-teal flex-1 py-3 font-display font-bold">บันทึกข้อมูล ✓</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Ask AI Modal (Triggered by the Morphing "ถาม AI" Button) */}
                    <AskAiModal
                        open={askAiModalOpen}
                        onClose={() => setAskAiModalOpen(false)}
                        lessonTitle={activeLesson.title}
                        answer={lessonQaAnswer}
                        loading={lessonQaLoading}
                        inputVal={lessonQaInput}
                        onChangeInput={setLessonQaInput}
                        onSubmit={handleAskLessonAi}
                    />

                    <AiNavigatorPopup nav={navPopup} onClose={() => setNavPopup({ open: false })} guideVoiceState={guideVoiceState} onSpeak={playStudioVoice} />
                    <InstallAppModal open={showPwaGuide} onClose={() => setShowPwaGuide(false)} isIos={isIosDevice} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('app-root'));
        root.render(<AppErrorBoundary><LearnerApp /></AppErrorBoundary>);
    </script>

    <!-- @babel/standalone พร้อม CDN สำรอง (cdnjs) ป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
