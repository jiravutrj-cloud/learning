                                            <div className="p-4 rounded-2xl bg-aurora-500/10 border border-aurora-400/30 text-xs sm:text-sm text-primary-adaptive space-y-1.5 leading-relaxed">
                                                <p className="font-bold text-accent-adaptive">แนวทางเปิดบทสนทนา (SPIKES + Decoupling):</p>
                                                <p>• <b>Setting &amp; Empathy:</b> “สวัสดีค่ะ ดิฉันขออนุญาตเชิญครอบครัวมานั่งคุยในห้องที่เป็นส่วนตัวนะคะ เข้าใจดีว่าตอนนี้ครอบครัวกำลัง{warmupTags.mood} ดิฉันอยู่ตรงนี้เพื่อรับฟังและดูแลอย่างเต็มที่ค่ะ”</p>
                                                <p>• <b>ประเด็นที่ควรเตรียมคำตอบ:</b> {warmupTags.concern} — อธิบายอย่างนุ่มนวลตรงไปตรงมา ไม่เร่งรัด และยืนยันการดูแลตกแต่งร่างอย่างประณีตสูงสุดค่ะ</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </main>

                            {/* Mobile Bottom Spatial Dock (5 Tabs — NO Leaderboard) */}
                            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] no-print">
                                <div className="grid grid-cols-5 gap-1 max-w-lg mx-auto">
                                    {[
                                        { id: 'lessons', label: 'บทเรียน', icon: 'MonitorPlay' },
                                        { id: 'clinical_cases', label: 'เคสคลินิก', icon: 'Stethoscope' },
                                        { id: 'flashcards', label: 'การ์ดจำ', icon: 'Layers' },
                                        { id: 'live', label: 'Live สด', icon: 'Radio' },
                                        { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
                                    ].map(item => {
                                        const active = activeTab === item.id;
                                        return (
                                            <button
                                                key={item.id}
                                                type="button"
                                                onClick={() => { setActiveTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all active:scale-95 ${
                                                    active
                                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-sm'
                                                        : 'text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={item.icon} size={17} />
                                                <span>{item.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </nav>
                        </div>
                    )}

                    {/* ==================== SCREEN 6: CERT CONFIRM + 5-DIMENSION CNEU EVALUATION ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <div className="relative z-10 flex-1 w-full max-w-2xl mx-auto px-4 py-6">
                            <form onSubmit={handleIssueCertificate} className="spatial-card rounded-[2rem] p-5 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1">
                                        <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                    </button>
                                    <span className="font-mono text-xs font-bold text-accent-adaptive">STEP 05 • CERTIFICATE &amp; CNEU</span>
                                </div>

                                <div>
                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ยืนยันชื่อและประเมินความพึงพอใจ 5 ด้าน</h2>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive">ตรวจสอบตัวสะกดเพื่อออกใบประกาศนียบัตรและหนังสือรับรองหน่วยคะแนน CNEU ({cneuConfig.cneuCredits} หน่วยคะแนน)</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">คำนำหน้า ชื่อ – นามสกุล (ไทย) *</label>
                                        <input type="text" required value={certForm.name} onChange={e => setCertForm(p => ({ ...p, name: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">ชื่อ – นามสกุล ภาษาอังกฤษ (ไม่บังคับ)</label>
                                        <input type="text" value={certForm.nameEN} onChange={e => setCertForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="e.g. Kanyarat Wattanakul, RN" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">โรงพยาบาล / หน่วยงานต้นสังกัด *</label>
                                        <input type="text" required value={certForm.hospital} onChange={e => setCertForm(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                </div>

                                {/* 5-Dimension CNEU Evaluation */}
                                <div className="spatial-soft rounded-2xl p-4 space-y-3">
                                    <p className="font-display font-bold text-sm text-primary-adaptive">แบบประเมินความพึงพอใจรายด้าน (มาตรฐาน CNEU)</p>
                                    {CNEU_EVAL_CRITERIA.map(item => (
                                        <div key={item.key} className="p-3 rounded-xl spatial-soft flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <div className="flex-1">
                                                <p className="text-xs sm:text-sm font-bold text-primary-adaptive">{item.title}</p>
                                                <p className="text-[11px] text-muted-adaptive">{item.desc}</p>
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(star => (
                                                    <button
                                                        key={star}
                                                        type="button"
                                                        onClick={() => setCneuRatings(p => ({ ...p, [item.key]: star }))}
                                                        aria-label={`ให้คะแนน ${star} ดาว`}
                                                        className="p-1 active:scale-90"
                                                    >
                                                        <Icon name="Star" size={22} className={star <= cneuRatings[item.key] ? 'text-amber-400 fill-amber-400' : 'text-slate-500'} />
                                                    </button>
                                                ))}
                                                <span className="font-mono text-[10px] font-bold text-amber-400 ml-1 w-20 text-right">
                                                    {CSAT_RATING_LABELS[cneuRatings[item.key]]}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                    <textarea
                                        rows="2"
                                        value={csatComment}
                                        onChange={e => setCsatComment(e.target.value)}
                                        placeholder="ข้อเสนอแนะเพิ่มเติมสำหรับทีมพัฒนาหลักสูตร (ไม่บังคับ)..."
                                        className="spatial-input w-full p-3 rounded-xl text-xs sm:text-sm"
                                    />
                                </div>

                                <button type="submit" className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg">
                                    <Icon name="Award" size={18} /> ยืนยันและออกใบประกาศนียบัตร + หนังสือรับรอง CNEU
                                </button>
                            </form>
                        </div>
                    )}

                    {/* ==================== SCREEN 7: DUAL DOCUMENTS (CERTIFICATE + CNEU LETTER) ==================== */}
                    {screen === 'certificate' && user && (
                        <div className="relative z-10 flex-1 w-full max-w-5xl mx-auto px-4 py-6 space-y-5">
                            <div className="no-print hide-when-printing-cneu flex flex-wrap items-center justify-between gap-2">
                                <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1.5">
                                    <Icon name="ArrowLeft" size={15} /> กลับห้องเรียน
                                </button>
                                <div className="inline-flex p-1 rounded-2xl spatial-soft">
                                    <button
                                        type="button"
                                        onClick={() => setCertViewTab('certificate')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold ${certViewTab === 'certificate' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}
                                    >
                                        1. ใบประกาศนียบัตร (PDF/PNG)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setCertViewTab('cneu_letter')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold ${certViewTab === 'cneu_letter' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}
                                    >
                                        2. หนังสือรับรอง CNEU รายบุคคล (A4)
                                    </button>
                                </div>
                            </div>

                            {certViewTab === 'certificate' ? (
                                <div className="spatial-card rounded-[2rem] p-4 sm:p-6 space-y-4">
                                    <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-amber-400/40 shadow-2xl">
                                        <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                        <button type="button" onClick={handleDownloadCertPdf} className="touch-target py-3 px-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg">
                                            <Icon name="FileDown" size={17} /> ดาวน์โหลด PDF
                                        </button>
                                        <button type="button" onClick={handleDownloadCertPng} className="touch-target spatial-soft py-3 px-4 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2">
                                            <Icon name="Image" size={17} className="text-accent-adaptive" /> บันทึกรูปภาพ PNG
                                        </button>
                                        <a href={verifyUrl} target="_blank" rel="noreferrer" className="touch-target spatial-soft py-3 px-4 rounded-2xl text-prism-adaptive font-display font-bold text-sm flex items-center justify-center gap-2">
                                            <Icon name="QrCode" size={17} /> ทดสอบหน้าตรวจ QR
                                        </a>
                                    </div>
                                </div>
                            ) : (
                                <IndividualCneuLetter
                                    user={user}
                                    cneuConfig={cneuConfig}
                                    verifyUrl={verifyUrl}
                                    onPrint={handlePrintCneuLetter}
                                />
                            )}
                        </div>
                    )}

                    <PdpaPolicyModal open={pdpaModalOpen} onClose={() => setPdpaModalOpen(false)} />
                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
