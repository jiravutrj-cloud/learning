        // กล่อง OTP 6 หลัก Liquid Glass ฟิสิกส์สปริง
        function LiquidGlassOtpInput({ value, onChange, disabled }) {
            const refs = useRef([]);
            const digits = Array.from({ length: 6 }, (_, i) => value[i] || '');

            const handleChange = (idx, raw) => {
                const clean = raw.replace(/[^0-9]/g, '');
                if (!clean) {
                    const next = digits.slice();
                    next[idx] = '';
                    onChange(next.join(''));
                    return;
                }
                if (clean.length > 1) {
                    const pasted = clean.slice(0, 6);
                    onChange(pasted);
                    refs.current[Math.min(5, pasted.length - 1)]?.focus();
                    return;
                }
                const next = digits.slice();
                next[idx] = clean;
                onChange(next.join(''));
                if (idx < 5) refs.current[idx + 1]?.focus();
            };

            const handleKeyDown = (idx, e) => {
                if (e.key === 'Backspace' && !digits[idx] && idx > 0) {
                    refs.current[idx - 1]?.focus();
                }
            };

            return (
                <div className="flex items-center justify-center gap-2 sm:gap-2.5">
                    {digits.map((d, i) => (
                        <input
                            key={i}
                            ref={el => { refs.current[i] = el; }}
                            type="text"
                            inputMode="numeric"
                            autoComplete={i === 0 ? 'one-time-code' : 'off'}
                            maxLength={6}
                            disabled={disabled}
                            value={d}
                            onChange={e => handleChange(i, e.target.value)}
                            onKeyDown={e => handleKeyDown(i, e)}
                            aria-label={`รหัส OTP หลักที่ ${i + 1}`}
                            className={`otp-glass-slot ${d ? 'filled' : ''}`}
                        />
                    ))}
                </div>
            );
        }

        // ============================================================================
        // 4. MAIN PRODUCTION LEARNER APPLICATION (ZERO DEMO / FULL AUTO-CLASSIFICATION)
        // ============================================================================
        function LearnerApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const returnToDashboard = urlParams.get('return') === 'dashboard';
            const autoStepParam = urlParams.get('auto_step') || '';
            const incomingLicense = urlParams.get('license') || '';
            const incomingCourseId = urlParams.get('course') || '';

            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030611' : '#edf5fc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // PWA States
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isStandalonePwa, setIsStandalonePwa] = useState(() => {
                try { return Boolean(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true); }
                catch (_) { return false; }
            });
            const [showPwaGuide, setShowPwaGuide] = useState(false);
            const isIosDevice = useMemo(() => /iPad|iPhone|iPod/i.test(navigator.userAgent || ''), []);

            // Cloud & Course Settings
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...(CORE.DEFAULT_CNEU_CONFIG || {}) }));
            const [certTemplate, setCertTemplate] = useState(() => ({ ...(CORE.DEFAULT_CERT_TEMPLATE || {}) }));
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ', url: '', documentUrl: '' });
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : (CORE.FALLBACK_LESSONS || [])));
            const [quizList, setQuizList] = useState(() => (typeof CORE.parseRawExams === 'function' ? CORE.parseRawExams(window.QUIZ_QUESTIONS_RAW) : []));
            const [courseCatalog, setCourseCatalog] = useState(() => FALLBACK_COURSE_CATALOG.filter(c => c && c.active !== false));
            const [selectedCourseId, setSelectedCourseId] = useState(() => {
                const activeList = FALLBACK_COURSE_CATALOG.filter(c => c && c.active !== false);
                if (incomingCourseId && activeList.some(c => c.id === incomingCourseId)) return incomingCourseId;
                return activeList[0]?.id || 'organ_donation_core';
            });

            // User Session & Screen Routing
            const [user, setUser] = useState(() => loadSessionTwoLayer());
            const [screen, setScreen] = useState(() => {
                if ((returnToDashboard || autoStepParam) && loadSessionTwoLayer()?.id) return 'dashboard';
                if (incomingLicense || incomingCourseId) return 'auth';
                return 'landing';
            });
            const [dashTab, setDashTab] = useState('lessons');

            // Production Auth (3 Steps • System Auto-Classification Read-Only • Real OTP)
            const [authStep, setAuthStep] = useState(1);
            const [licenseInput, setLicenseInput] = useState(incomingLicense);
            const [authBusy, setAuthBusy] = useState(false);
            const [existingUserDoc, setExistingUserDoc] = useState(null);
            const [authClassification, setAuthClassification] = useState(null);
            const [authProfile, setAuthProfile] = useState({
                professionGroup: '', name: '', nameEN: '', position: '',
                department: HEALTH_REGIONS[HEALTH_REGIONS.length - 1] || 'เขตสุขภาพที่ 13 (กรุงเทพมหานคร)',
                hospital: '', email: '', phone: '', pdpaAccepted: true
            });
            const [sentOtpCode, setSentOtpCode] = useState('');
            const [otpExpiresAt, setOtpExpiresAt] = useState(0);
            const [otpCooldown, setOtpCooldown] = useState(0);
            const [otpInput, setOtpInput] = useState('');

            // Learning, PDF Preview, AI 1-Min Summary, Quiz, Eval & Certificate States
            const [activeLessonIdx, setActiveLessonIdx] = useState(0);
            const [showPdfPreview, setShowPdfPreview] = useState(false);
            const [aiLessonSummaries, setAiLessonSummaries] = useState({});
            const [aiSummaryLoading, setAiSummaryLoading] = useState(false);
            const [lessonQaInput, setLessonQaInput] = useState('');
            const [lessonQaAnswer, setLessonQaAnswer] = useState('');
            const [lessonQaLoading, setLessonQaLoading] = useState(false);

            const [quizAnswers, setQuizAnswers] = useState({});
            const [certNameTH, setCertNameTH] = useState('');
            const [certNameEN, setCertNameEN] = useState('');
            const [certHospital, setCertHospital] = useState('');
            const [csatScore, setCsatScore] = useState(5);
            const [susAnswers, setSusAnswers] = useState(() => Object.fromEntries(SUS_ITEMS.map(q => [q.key, q.pos ? 5 : 1])));
            const [editProfileOpen, setEditProfileOpen] = useState(false);

                }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, []);
            useEffect(() => () => stopStudioVoice(), [stopStudioVoice]);

            const playStudioVoice = useCallback(async (key, text) => {
                if (guideVoiceState.activeKey === key && guideVoiceState.status !== 'idle') { stopStudioVoice(); return; }
                stopStudioVoice();
                const sid = voiceSessionRef.current;
                setGuideVoiceState({ activeKey: key, status: 'loading' });
                try {
                    if (typeof CORE.fetchStudioGuideBlob !== 'function') throw new Error('ไม่พบโมดูลเสียงสตูดิโอ 24kHz');
                    const blob = await CORE.fetchStudioGuideBlob(text, appsScriptUrl, 'Sulafat');
                    if (voiceSessionRef.current !== sid) return;
                    if (!sharedAudioRef.current) {
                        const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', ''); sharedAudioRef.current = a;
                    }
                    const url = URL.createObjectURL(blob);
                    audioUrlRef.current = url;
                    setGuideVoiceState({ activeKey: key, status: 'speaking' });
                    await new Promise(resolve => {
                        const a = sharedAudioRef.current;
                        a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });
                    if (voiceSessionRef.current === sid) setGuideVoiceState({ activeKey: '', status: 'idle' });
                } catch (err) {
                    if (voiceSessionRef.current === sid) {
                        setGuideVoiceState({ activeKey: '', status: 'idle' });
                        showToast(err?.message || 'ไม่สามารถเชื่อมต่อเสียง AI สตูดิโอ 24kHz ได้ในขณะนี้ค่ะ', 'info');

            const handleAuthStep1Lookup = async (e) => {

            const handleAuthStep2SendOtp = async (e) => {

                    pretest: existingUserDoc?.pretest || '-', posttest: existingUserDoc?.posttest || '-',

                await persistUserUpdate(nextUser);

                        : 'ยินดีต้อนรับกลับสู่ห้องเรียน อาร์เจ คลาวด์ ออร์แกน สองจุดศูนย์ ค่ะ',
                    ctaLabel: needPretest ? 'เริ่มทำ Pre-test เลย →' : 'เข้าสู่ห้องเรียนหลัก →',
                    onConfirm: () => { if (needPretest) { setQuizAnswers({}); setScreen('pretest'); } }

                                systemInstruction: `${CLINICAL_AI_PREFIX} สรุปภาษาไทยกระชับ แม่นยำ ไม่ใช้ Markdown`
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');

            const handleAskLessonAi = async (e) => {
                e.preventDefault();
                const q = lessonQaInput.trim();
                if (!q || lessonQaLoading) return;
                setLessonQaLoading(true);
                let reply = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `บทเรียน: ${activeLesson.title || ''}\nคำถามจาก${userCreditMeta.professionGroup}: ${q}`,
                                systemInstruction: `${CLINICAL_AI_PREFIX} ตอบคำถามคลินิกกระชับ ชัดเจน ตามมาตรฐานสภากาชาดไทยและโรงพยาบาลราชวิถี ไม่เกิน 5 บรรทัด`
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) reply = String(d.text).replace(/[*#]/g, '').trim();
                    } catch (_) {}
                }
                setLessonQaAnswer(reply || 'ไม่สามารถเชื่อมต่อ AI ได้ในขณะนี้ กรุณาตรวจสอบอินเทอร์เน็ตและลองถามใหม่อีกครั้งค่ะ');
                setLessonQaInput('');
                setLessonQaLoading(false);
            };

            const handleSubmitQuiz = async (type) => {
                const total = quizList.length;
                if (Object.keys(quizAnswers).length < total) { showToast(`กรุณาตอบให้ครบทั้ง ${total} ข้อก่อนส่งคำตอบค่ะ`, 'error'); return; }
                let correct = 0;
                quizList.forEach(q => { if (Number(quizAnswers[q.id]) === Number(q.answer)) correct += 1; });
                const pct = Math.round((correct / Math.max(1, total)) * 100);
                const scoreStr = `${correct}/${total}`;
                const roadmap = typeof CORE.computeDomainDiagnosis === 'function' ? CORE.computeDomainDiagnosis(quizList, quizAnswers) : null;
                setQuizAnswers({});

                if (type === 'pretest') {
                    await persistUserUpdate({ ...user, pretest: scoreStr, aiRoadmap: roadmap || user.aiRoadmap || null });
                    setScreen('dashboard');
                    setNavPopup({
                        open: true,
                        badge: `PRE-TEST เสร็จสมบูรณ์ (${scoreStr})`,
                        title: isExempt ? 'สิทธิ์เทียบโอน: ไปห้อง AI Skill Lab 3D ได้เลย!' : 'ขั้นตอนถัดไป: ศึกษาบทเรียน & AI Skill Lab 3D',
                        message: isExempt
                            ? 'ท่านได้รับสิทธิ์เทียบโอนยกเว้นชั่วโมงเรียน 100% สามารถเข้าฝึกสื่อสาร 3 มิติ AI Skill Lab ต่อได้ทันทีค่ะ'
                            : `ทำคะแนน Pre-test ได้ ${pct}% เชิญศึกษาบทเรียนให้ครบ ≥ ${MIN_STUDY_PERCENT}% แล้วเข้าฝึกสื่อสาร AI Skill Lab 3D ค่ะ`,
                        ctaLabel: isExempt ? 'เปิดห้อง AI Skill Lab 3D →' : 'เข้าศึกษาบทเรียนเลย →',
                        onConfirm: () => { if (isExempt) { saveSessionTwoLayer(user); window.location.href = './aiskilllab.html'; } }
                    });
                } else {
                    const passed = pct >= MIN_POSTTEST_PERCENT;
                    await persistUserUpdate({ ...user, posttest: scoreStr, status: passed ? 'ผ่าน' : (user?.status || 'กำลังเรียน'), aiRoadmap: roadmap || user.aiRoadmap || null });
                    if (passed) {
                        setScreen('cert_confirm');
                        showToast(`ยินดีด้วยค่ะ! สอบ Post-test ผ่านเกณฑ์ (${pct}%) ปลดล็อกประกาศนียบัตรแล้วค่ะ`);
                    } else {
                        setScreen('dashboard');
                        showToast(`คะแนน Post-test ได้ ${pct}% (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%) สามารถทบทวนและสอบใหม่ได้ค่ะ`, 'info');
                    }
                }
            };

            const handleClaimCertificate = async (e) => {
                e.preventDefault();
                if (!certNameTH.trim()) { showToast('กรุณาระบุชื่อ–นามสกุลภาษาไทยบนประกาศนียบัตรค่ะ', 'error'); return; }
                const susRaw = SUS_ITEMS.reduce((acc, q) => acc + (q.pos ? (Number(susAnswers[q.key] || 3) - 1) : (5 - Number(susAnswers[q.key] || 3))), 0);
                const susScore = Math.round((susRaw / (SUS_ITEMS.length * 4)) * 100);
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${String(user?.license || '0000').slice(-4)}${Math.floor(10 + Math.random() * 89)}`;
                const issuedAt = user?.certificateIssuedAt || new Date().toISOString();

                const nextUser = {
                    ...user, name: certNameTH.trim(), nameEN: certNameEN.trim(), hospital: certHospital.trim() || user?.hospital || '',
                    satisfactionScore: Number(csatScore), susScore, status: 'ผ่าน',
                    certificateClaimed: true, certificateCode: code, certificateIssuedAt: issuedAt
                };
                await persistUserUpdate(nextUser);

                if (fbDb) {
                    try {
                        const pubPayload = typeof CERT.buildPublicCertPayload === 'function'
                            ? CERT.buildPublicCertPayload({ code, finalName: nextUser.name, nameEN: nextUser.nameEN, finalHospital: nextUser.hospital, license: nextUser.license, user: nextUser, certTemplate, cneuConfig, issuedAt })
                            : { code, name: nextUser.name, nameEN: nextUser.nameEN, license: nextUser.license, professionGroup: userCreditMeta.professionGroup, cneuEligible: userCreditMeta.isNurseCneu, creditType: userCreditMeta.creditType, creditLabelTH: userCreditMeta.lineTextTH, trainingHours: userCreditMeta.trainingHours, hospital: nextUser.hospital, courseTitleTH: certTemplate.courseTitleTH, orgTitleTH: certTemplate.orgTitleTH, cneuActivityCode: userCreditMeta.isNurseCneu ? userCreditMeta.cneuActivityCode : '', cneuCredits: userCreditMeta.isNurseCneu ? userCreditMeta.cneuCredits : '', issuedAt, status: 'valid' };
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), pubPayload, { merge: true });
                    } catch (_) {}
                }
                setScreen('certificate');
                showToast('ออกประกาศนียบัตรดิจิทัลพร้อมรหัส QR ตรวจสอบความถูกต้องเรียบร้อยแล้วค่ะ');
            };

            const handleMarkLessonStudied = async () => {
                const nextPct = Math.min(100, Math.max(studyPct + 20, Math.round(((activeLessonIdx + 1) / Math.max(1, lessons.length)) * 100)));
                await persistUserUpdate({ ...user, progress: nextPct });
                showToast(`บันทึกความก้าวหน้าการเรียน ${nextPct}% เรียบร้อยค่ะ`);
                if (nextPct >= MIN_STUDY_PERCENT && !isLabDone) {
                    setNavPopup({
                        open: true,
                        badge: 'ชั่วโมงเรียนผ่านเกณฑ์แล้ว!',
                        title: 'พร้อมเข้าฝึกสื่อสาร 3 มิติ AI Skill Lab',
                        message: 'ท่านสะสมเวลาเรียนครบเกณฑ์แล้ว เชิญเข้าฝึกสื่อสารโฮโลแกรมหัวใจ 3 มิติ 10 สเต็ป เพื่อปลดล็อก Post-test ค่ะ',
                        ctaLabel: 'เปิดห้อง AI Skill Lab 3D →',
                        onConfirm: () => { saveSessionTwoLayer(user); window.location.href = './aiskilllab.html'; }
                    });
                }
            };

            const handleSaveProfileEdit = async (e) => {
                e.preventDefault();
                const isNurse = editForm.professionGroup === 'พยาบาล';
                await persistUserUpdate({
                    ...user, professionGroup: editForm.professionGroup, cneuEligible: isNurse,
                    name: editForm.name.trim() || user.name, nameEN: editForm.nameEN.trim(),
                    position: editForm.position.trim(), hospital: editForm.hospital.trim(), phone: editForm.phone.trim()
                });
                setEditProfileOpen(false);
                showToast('อัปเดตข้อมูลโปรไฟล์เรียบร้อยค่ะ');
            };

            const handleInstallPwaClick = async () => {
                if (deferredPrompt?.prompt) {
                    try {
                        deferredPrompt.prompt();
                        const choice = await deferredPrompt.userChoice;
                        if (choice?.outcome === 'accepted') { setDeferredPrompt(null); showToast('กำลังติดตั้งแอป rjcloud.organ 2.0 ค่ะ'); }
                        return;
                    } catch (_) {}
                }
                setShowPwaGuide(true);
            };

            // ============================================================================
            // 7. RENDER VIEWS
            // ============================================================================
            if (screen === 'landing') {
                return (
                    <>
                        <LandingHeroScreen
                            hasSavedSession={Boolean(user?.id)}
                            onResumeDashboard={() => setScreen('dashboard')}
                            onStartAuth={() => { setAuthStep(1); setScreen('auth'); }}
                            showInstallBtn={!isStandalonePwa}
                            onInstallApp={handleInstallPwaClick}
                        />
                        <InstallAppModal open={showPwaGuide} onClose={() => setShowPwaGuide(false)} isIos={isIosDevice} />
                        <ToastBanner toast={toast} />
                    </>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="no-print-letter spatial-aura" />
                    <div className="no-print-letter spatial-grid" />
                    {guideVoiceState.status !== 'idle' && (
                        <div className="no-print-letter fixed top-0 left-0 right-0 z-50 pointer-events-none"><div className="rjc-ambient-bar" /></div>
                    )}

                    {/* Top Header */}
                    <header className="no-print-letter sticky top-0 z-30 spatial-header">
                        <div className="max-w-6xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <button type="button" onClick={() => { stopStudioVoice(); setScreen(user?.id && screen !== 'dashboard' ? 'dashboard' : 'landing'); }} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive shrink-0">
                                    <Icon name={user?.id && screen !== 'dashboard' ? 'ArrowLeft' : 'Home'} size={17} />
                                </button>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">2.0</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        {user?.name ? `${user.name} • ${userCreditMeta.professionGroup}` : 'Rajavithi Hospital COE • Production Hub'}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                {!isStandalonePwa && (
                                    <button type="button" onClick={handleInstallPwaClick} className="spatial-soft px-2.5 py-2 rounded-xl text-xs font-bold text-accent-adaptive inline-flex items-center gap-1">
                                        <Icon name="Smartphone" size={14} /><span className="hidden md:inline">ติดตั้งแอป</span>
                                    </button>
                                )}
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                {user?.id && (
                                    <button type="button" onClick={() => { stopStudioVoice(); clearSessionTwoLayer(); setUser(null); setScreen('landing'); showToast('ออกจากระบบเรียบร้อยค่ะ'); }} className="spatial-soft px-2.5 py-2 rounded-xl text-xs font-bold text-rose-400" title="ออกจากระบบ">
                                        <Icon name="LogOut" size={15} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* ==================== SCREEN: AUTH (PRODUCTION ONLY • 3 STEPS) ==================== */}
                    {screen === 'auth' && (
                        <main className="no-print-letter relative z-10 max-w-2xl w-full mx-auto px-4 py-7 space-y-5 flex-1">
                            {authStep === 1 && (
                                <form key="auth-s1" onSubmit={handleAuthStep1Lookup} className="spatial-card auth-fade-ltr rounded-[2rem] p-6 sm:p-8 space-y-6">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-pink-300 uppercase tracking-wider">PRODUCTION AUTH • STEP 1 / 3</span>
                                        <h1 className="font-display font-extrabold text-xl sm:text-2xl text-primary-adaptive mt-1">ยืนยันตัวตนบุคลากรทางการแพทย์</h1>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">ระบบปิดเฉพาะแพทย์ พยาบาล และบุคลากรสหวิชาชีพ — ตรวจสอบประวัติและสิทธิ์เทียบโอน Onsite ให้อัตโนมัติค่ะ</p>
                                    </div>

                                    {/* Modern Bento Course Selector Cards (แทน Dropdown แบบเก่า) */}
                                    <div className="space-y-2.5">
                                        <div className="flex items-center justify-between gap-2 px-0.5">
                                            <label className="text-xs sm:text-sm font-bold text-primary-adaptive flex items-center gap-1.5">
                                                <Icon name="GraduationCap" size={16} className="text-pink-300" />
                                                <span>1. เลือกหลักสูตรที่เข้าอบรม</span>
                                            </label>
                                            <span className="px-2.5 py-0.5 rounded-full spatial-soft font-mono text-[10px] font-bold text-prism-adaptive">
                                                เปิดสอน {courseCatalog.length} หลักสูตร
                                            </span>
                                        </div>

                                        <div className="grid grid-cols-1 gap-2.5">
                                            {courseCatalog.map((c, cIdx) => {
                                                const isSelected = selectedCourseId === c.id;
                                                const courseIcon = String(c.id || '').includes('kidney') || String(c.id || '').includes('surg') ? 'Stethoscope' : cIdx % 2 === 0 ? 'HeartPulse' : 'Activity';
                                                return (
                                                    <button
                                                        key={c.id}
                                                        type="button"
                                                        onClick={() => setSelectedCourseId(c.id)}
                                                        aria-pressed={isSelected}
                                                        className={`group w-full text-left p-4 rounded-2xl border transition-all duration-200 flex items-start gap-3.5 ${
                                                            isSelected
                                                                ? 'bg-gradient-to-br from-pink-400/15 via-aurora-400/10 to-prism-400/15 border-pink-300/80 shadow-[0_0_24px_-4px_rgba(253,164,175,0.38)] ring-1 ring-pink-300/35'
                                                                : 'spatial-soft hover:border-prism-400/50'
                                                        }`}
                                                    >
                                                        <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 border transition-all ${
                                                            isSelected
                                                                ? 'bg-pink-400/20 border-pink-300/60 text-pink-300 shadow-inner'
                                                                : 'bg-white/5 border-white/10 text-muted-adaptive group-hover:text-prism-adaptive'
                                                        }`}>
                                                            <Icon name={courseIcon} size={20} />
                                                        </div>

                                                        <div className="min-w-0 flex-1 space-y-1">
                                                            <div className="flex flex-wrap items-center gap-1.5">
                                                                {c.code && (
                                                                    <span className={`px-2 py-0.5 rounded-md font-mono text-[10px] font-bold ${
                                                                        isSelected ? 'bg-pink-400/20 text-pink-300' : 'bg-white/10 text-muted-adaptive'
                                                                    }`}>
                                                                        {c.code}
                                                                    </span>
                                                                )}
                                                                {c.trainingHours && (
                                                                    <span className="px-2 py-0.5 rounded-md bg-aurora-500/15 text-accent-adaptive font-mono text-[10px] font-bold">
                                                                        {c.trainingHours} ชม.
                                                                    </span>
                                                                )}
                                                                {isSelected && (
                                                                    <span className="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-bold text-[10px]">
                                                                        กำลังเลือก
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <p className="font-display font-bold text-sm sm:text-[15px] text-primary-adaptive leading-snug">
                                                                {c.titleTH}
                                                            </p>
                                                            {(c.subtitleTH || c.titleEN) && (
                                                                <p className="text-[11px] text-muted-adaptive leading-snug line-clamp-1">
                                                                    {c.subtitleTH || c.titleEN}
                                                                </p>
                                                            )}
                                                        </div>

                                                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 mt-1 transition-all ${
                                                            isSelected
                                                                ? 'bg-emerald-400 border-emerald-400 text-void-950 scale-105'
                                                                : 'border-slate-400/40 bg-transparent'
                                                        }`}>
                                                            {isSelected && <Icon name="Check" size={14} />}
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="space-y-1.5 text-xs">
                                        <label className="block font-bold text-secondary-adaptive ml-1">2. เลขที่ใบอนุญาตประกอบวิชาชีพ / รหัสบุคลากร *</label>
                                        <input type="text" required value={licenseInput} onChange={e => setLicenseInput(e.target.value)} placeholder="กรอกเลขที่ใบอนุญาตประกอบวิชาชีพ" className="touch-target spatial-input w-full px-4 py-3.5 rounded-2xl font-mono text-base font-bold uppercase" />
                                        {incomingLicense && (
                                            <p className="text-[11px] text-accent-adaptive ml-1">✓ ดึงเลขใบอนุญาตจากบัตร QR Code ให้อัตโนมัติแล้ว กดปุ่มด้านล่างเพื่อตรวจสอบสิทธิ์ได้เลยค่ะ</p>
                                        )}
                                    </div>

                                    <button type="submit" disabled={authBusy} className="btn-peach-ambient touch-target w-full py-3.5 font-display font-extrabold text-sm">
                                        {authBusy ? 'กำลังตรวจสอบฐานข้อมูลกลาง...' : 'ตรวจสอบสิทธิ์และไปขั้นตอนถัดไป →'}
                                    </button>
                                </form>
                            )}

                            {authStep === 2 && (
                                <form key="auth-s2" onSubmit={handleAuthStep2SendOtp} className="spatial-card auth-fade-ltr rounded-[2rem] p-6 sm:p-7 space-y-4">
                                    <div className="flex items-center justify-between">
                                        <button type="button" onClick={() => setAuthStep(1)} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive">← กลับ</button>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive">STEP 2 / 3 • รหัส {licenseInput}</span>
                                    </div>

                                    {selectedCourseObj && (
                                        <div className="spatial-soft px-3.5 py-2.5 rounded-2xl flex items-center justify-between gap-2 text-xs">
                                            <div className="min-w-0">
                                                <span className="font-mono text-[10px] text-muted-adaptive block">หลักสูตรที่เลือกเข้าอบรม</span>
                                                <span className="font-display font-bold text-primary-adaptive block truncate">{selectedCourseObj.titleTH}</span>
                                            </div>
                                            <span className="px-2 py-0.5 rounded-md bg-pink-400/15 text-pink-300 font-mono text-[10px] font-bold shrink-0">{selectedCourseObj.code || 'COURSE'}</span>
                                        </div>
                                    )}

                                    {/* ป้ายจำแนกประเภทผู้เรียนอัตโนมัติ (Read-Only ห้ามผู้เรียนเลือกเอง) */}
                                    {authClassification && (
                                        <div className={`p-3.5 rounded-2xl space-y-1 ${authClassification.badgeClass || 'badge-new-learner'}`}>
                                            <div className="flex items-center justify-between gap-2">
                                                <span className="font-mono text-[10px] font-bold uppercase">SYSTEM AUTO-CLASSIFICATION (READ-ONLY)</span>
                                                <span className="px-2.5 py-0.5 rounded-full bg-black/20 font-bold text-[11px]">{authClassification.userType}</span>
                                            </div>
                                            <p className="font-display font-bold text-sm">{authClassification.labelTH}</p>
                                            {authClassification.matchedEventName && (
                                                <p className="text-xs opacity-90">อ้างอิงกิจกรรมเทียบโอน: <b>{authClassification.matchedEventName}</b></p>
                                            )}
                                        </div>
                                    )}

                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-secondary-adaptive">เลือกกลุ่มวิชาชีพของท่าน *</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            {PROFESSION_OPTIONS.map(opt => {
                                                const active = authProfile.professionGroup === opt.value;
                                                return (
                                                    <button key={opt.id} type="button" onClick={() => setAuthProfile(p => ({ ...p, professionGroup: opt.value, position: p.position || opt.defaultPos }))} className={`text-left p-3 rounded-2xl border transition-all ${active ? 'bg-aurora-500/20 border-aurora-400 shadow' : 'spatial-soft'}`}>
                                                        <div className="flex items-center justify-between">
                                                            <span className="font-display font-extrabold text-sm text-primary-adaptive">{opt.label}</span>
                                                            <Icon name={opt.icon} size={15} className={active ? 'text-accent-adaptive' : 'text-muted-adaptive'} />
                                                        </div>
                                                        <p className="text-[10.5px] text-muted-adaptive mt-0.5">{opt.en}</p>
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* คัดกรอง CNEU เฉพาะพยาบาลเท่านั้น */}
                                        {authProfile.professionGroup === 'พยาบาล' && (cneuConfig.activityCode || cneuConfig.cneuCredits) && (
                                            <div className="p-3.5 rounded-2xl bg-aurora-500/15 border border-aurora-400/50 space-y-0.5">
                                                <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">✓ สิทธิ์หน่วยคะแนนการศึกษาต่อเนื่องทางการพยาบาล (CNEU)</p>
                                                <p className="font-display font-extrabold text-sm text-primary-adaptive">
                                                    รหัสกิจกรรม CNEU: <span className="font-mono text-accent-adaptive">{cneuConfig.activityCode}</span>
                                                    {cneuConfig.cneuCredits && <> • <span className="font-mono text-accent-adaptive">{cneuConfig.cneuCredits}</span> หน่วยคะแนน</>}
                                                </p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">

                            {dashTab === 'phrasebook' && (
                                <section className="spatial-card rounded-[1.75rem] p-5 space-y-3">
                                    <h2 className="font-display font-extrabold text-lg text-primary-adaptive">วลีสื่อสารฉุกเฉินหน้างาน ICU (Pocket Phrases)</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                        {POCKET_PHRASES.map((p, i) => (
                                            <div key={i} className="spatial-soft rounded-2xl p-4 space-y-1.5">
                                                <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">{p.stage || p.cat}</span>
                                                <p className="text-primary-adaptive font-semibold leading-relaxed">“{p.phrase || p.th}”</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            )}

                            {dashTab === 'live' && (
                                <section className="spatial-card rounded-[1.75rem] p-6 text-center space-y-4">
                                    <span className={`px-3 py-1 rounded-full font-mono text-[10px] font-bold ${liveConfig.status === 'live' ? 'bg-rose-500 text-white animate-pulse' : 'spatial-soft text-muted-adaptive'}`}>
                                        {liveConfig.status === 'live' ? '● ON AIR กำลังถ่ายทอดสด' : 'OFFLINE • ยังไม่มีการถ่ายทอดสดขณะนี้'}
                                    </span>
                                    <h2 className="font-display font-extrabold text-lg text-primary-adaptive">{liveConfig.topic}</h2>
                                    {liveConfig.url && <div className="w-full max-w-3xl mx-auto aspect-video rounded-2xl overflow-hidden bg-black"><iframe title="Live Stream" src={liveConfig.url} className="w-full h-full border-0" allowFullScreen /></div>}
                                    {liveConfig.documentUrl && <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="btn-peach-ambient touch-target inline-flex px-6 py-2.5 rounded-full text-xs">ดาวน์โหลดเอกสารประกอบการบรรยายสด (PDF)</a>}
                                </section>
                            )}

                            {dashTab === 'profile' && (
                                <section className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">LEARNER PROFILE • CENTRAL DATA CENTER</span>
                                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive">{user.name}</h2>
                                        </div>
                                        <button type="button" onClick={() => { setEditForm({ professionGroup: userCreditMeta.professionGroup, name: user.name || '', nameEN: user.nameEN || '', position: user.position || '', hospital: user.hospital || '', phone: user.phone || '' }); setEditProfileOpen(v => !v); }} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-prism-adaptive">
                                            {editProfileOpen ? 'ปิดฟอร์มแก้ไข' : 'แก้ไขข้อมูลส่วนตัว'}
                                        </button>
                                    </div>
                                    {!editProfileOpen ? (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">ประเภทผู้เรียน (ระบบกำหนดอัตโนมัติ)</span><span className="font-bold text-accent-adaptive">{user.userType || 'เรียนใหม่'}{user.hoursActivityName ? ` — ${user.hoursActivityName}` : ''}</span></div>
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">กลุ่มวิชาชีพ &amp; สิทธิ์รับรอง</span><span className="font-bold text-prism-adaptive">{userCreditMeta.professionGroup} • {userCreditMeta.lineTextTH}</span></div>
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">{userCreditMeta.licenseLabelTH}</span><span className="font-mono font-bold text-primary-adaptive">{user.license}</span></div>
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">โรงพยาบาล / สังกัด</span><span className="font-bold text-primary-adaptive">{user.hospital} • {user.department}</span></div>
                                        </div>
                                    ) : (
                                        <form onSubmit={handleSaveProfileEdit} className="space-y-3 text-xs">
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                {PROFESSION_OPTIONS.map(opt => (
                                                    <button key={opt.id} type="button" onClick={() => setEditForm(p => ({ ...p, professionGroup: opt.value }))} className={`p-2.5 rounded-xl border font-bold ${editForm.professionGroup === opt.value ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive' : 'spatial-soft text-secondary-adaptive'}`}>{opt.label}</button>
                                                ))}
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <input value={editForm.name} onChange={e => setEditForm(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ-นามสกุล (ไทย)" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                                <input value={editForm.nameEN} onChange={e => setEditForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="Full Name (EN)" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                                <input value={editForm.position} onChange={e => setEditForm(p => ({ ...p, position: e.target.value }))} placeholder="ตำแหน่ง" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                                <input value={editForm.hospital} onChange={e => setEditForm(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            </div>
                                            <button type="submit" className="btn-peach-ambient px-6 py-2.5 rounded-full text-xs">บันทึกการเปลี่ยนแปลง ✓</button>
                                        </form>
                                    )}
                                </section>
                            )}
                        </main>
                    )}

                    {/* ==================== SCREEN: CERT CONFIRM + R2R SUS ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <main className="no-print-letter relative z-10 max-w-2xl w-full mx-auto px-4 py-6 flex-1">
                            <form onSubmit={handleClaimCertificate} className="spatial-card rounded-[2rem] p-6 sm:p-7 space-y-5">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">STEP 5 • ยืนยันชื่อ &amp; ประเมินผล R2R (SUS)</span>
                                    <h1 className="font-display font-extrabold text-xl text-primary-adaptive mt-1">ตรวจสอบข้อมูลก่อนออกประกาศนียบัตร</h1>
                                    <p className="text-xs text-prism-adaptive font-semibold mt-1">{userCreditMeta.professionGroup} • {userCreditMeta.lineTextTH}</p>
                                </div>
                                <div className="space-y-3 text-xs">
                                    <div><label className="block font-bold text-secondary-adaptive mb-1">ชื่อ–นามสกุลภาษาไทยบนประกาศนียบัตร *</label><input required value={certNameTH} onChange={e => setCertNameTH(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm font-bold" /></div>
                                    <div><label className="block font-bold text-secondary-adaptive mb-1">ชื่อ–นามสกุลภาษาอังกฤษ (ถ้ามี)</label><input value={certNameEN} onChange={e => setCertNameEN(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="block font-bold text-secondary-adaptive mb-1">โรงพยาบาล / หน่วยงาน</label><input value={certHospital} onChange={e => setCertHospital(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                </div>
                                <div className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs">
                                    <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">ประเมินความพึงพอใจ &amp; SUS (1–5)</p>
                                    <div className="flex items-center justify-between gap-2 pb-2 border-b border-white/10">
                                        <span className="font-bold text-primary-adaptive">ความพึงพอใจภาพรวมหลักสูตร</span>
                                        <div className="flex gap-1">{[1, 2, 3, 4, 5].map(n => <button key={n} type="button" onClick={() => setCsatScore(n)} className={`w-8 h-8 rounded-lg font-mono font-bold ${csatScore === n ? 'bg-amber-400 text-void-950' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>)}</div>
                                    </div>
                                    {SUS_ITEMS.map(q => (
                                        <div key={q.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                                            <span className="text-secondary-adaptive">{q.label}</span>
                                            <div className="flex gap-1 shrink-0">{[1, 2, 3, 4, 5].map(n => <button key={n} type="button" onClick={() => setSusAnswers(p => ({ ...p, [q.key]: n }))} className={`w-7 h-7 rounded-lg font-mono font-bold ${susAnswers[q.key] === n ? 'bg-aurora-400 text-void-950' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>)}</div>
                                        </div>
                                    ))}
                                </div>
                                <button type="submit" className="btn-peach-ambient touch-target w-full py-4 rounded-full font-display font-extrabold text-sm">ยืนยันและออกประกาศนียบัตรดิจิทัล →</button>
                            </form>
                        </main>
                    )}

                    {/* ==================== SCREEN: CERTIFICATE (PDF / PNG / A4) ==================== */}
                    {screen === 'certificate' && user && (
                        <>
                            <main className="no-print-letter relative z-10 max-w-4xl w-full mx-auto px-4 py-6 space-y-5 flex-1">
                                <div className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">{userCreditMeta.professionGroup} • VERIFIED DIGITAL CERTIFICATE</span>
                                            <h1 className="font-display font-extrabold text-xl text-primary-adaptive">ประกาศนียบัตรดิจิทัลและหนังสือรับรองรายบุคคล</h1>
                                            <p className="text-xs text-prism-adaptive font-bold mt-0.5">{userCreditMeta.lineTextTH}</p>
                                        </div>
                                        <a href={`./verify.html?code=${encodeURIComponent(user.certificateCode || '')}`} target="_blank" rel="noreferrer" className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5">
                                            <Icon name="QrCode" size={14} /> หน้าตรวจ QR
                                        </a>
                                    </div>
                                    <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-2xl border border-white/60">
                                        <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                        <button type="button" onClick={() => { if (typeof CERT.downloadCanvasAsPdf === 'function') CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode); else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png', 1); a.download = `Certificate_${user.certificateCode}.png`; a.click(); } showToast('ดาวน์โหลดประกาศนียบัตรเรียบร้อยค่ะ'); }} className="btn-peach-ambient touch-target py-3.5 rounded-full text-xs sm:text-sm">
                                            <Icon name="Download" size={16} /> ดาวน์โหลด PDF
                                        </button>
                                        <button type="button" onClick={() => { if (typeof CERT.downloadCanvasAsPng === 'function') CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode); else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png', 1); a.download = `Certificate_${user.certificateCode}.png`; a.click(); } showToast('บันทึกภาพ PNG เรียบร้อยค่ะ'); }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-primary-adaptive inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Image" size={16} /> บันทึกภาพ (PNG)
                                        </button>
                                        <button type="button" onClick={() => { if (typeof CERT.printIndividualCneuLetter === 'function') CERT.printIndividualCneuLetter(); else { document.body.classList.add('printing-cneu-letter'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing-cneu-letter'), 1200); }, 120); } }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-accent-adaptive inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Printer" size={16} /> {userCreditMeta.isNurseCneu ? 'พิมพ์หนังสือรับรอง CNEU (A4)' : 'พิมพ์หนังสือรับรองอบรม (A4)'}
                                        </button>
                                    </div>
                                </div>
                            </main>

                            <article id="individual-cert-letter" className="max-w-3xl mx-auto font-sans">
                                <div style={{ borderBottom: '2px solid #0f172a', paddingBottom: '12px', textAlign: 'center', marginBottom: '20px' }}>
                                    <p style={{ fontSize: '12px', fontWeight: 700, color: '#047857', margin: '0 0 4px' }}>{userCreditMeta.letterHeadingTH}</p>
                                    <h2 style={{ fontSize: '18px', fontWeight: 800, margin: '0 0 4px' }}>{cneuConfig.orgName}</h2>
                                    <p style={{ fontSize: '13px', margin: 0 }}>{cneuConfig.courseName}</p>
                                </div>
                                <p style={{ fontSize: '14px', lineHeight: 1.9 }}>
                                    หนังสือฉบับนี้ขอรับรองว่า <b>{user.name}</b> ({userCreditMeta.professionGroup}) {userCreditMeta.licenseLabelTH}: <b>{user.license}</b> สังกัด <b>{user.hospital || '-'}</b> ได้ผ่านการอบรมและประเมินผลตามเกณฑ์มาตรฐานหลักสูตรประจำปี 2027 ({userCreditMeta.lineTextTH}) ผ่านการฝึกสื่อสาร 3 มิติ AI Skill Lab และสอบวัดผลหลังเรียน (Post-test) ผ่านเกณฑ์มาตรฐานเรียบร้อยแล้ว
                                </p>
                                <p style={{ fontSize: '13px', marginTop: '14px' }}>รหัสอ้างอิงประกาศนียบัตร: <b>{user.certificateCode}</b> • ออกให้ ณ วันที่ {formatThaiDateSafe(user.certificateIssuedAt)}</p>
                                <div style={{ marginTop: '48px', textAlign: 'center', fontSize: '13px' }}>
                                    <p>ลงชื่อ ...............................................................</p>
                                    <p style={{ fontWeight: 700, margin: '4px 0 2px' }}>({cneuConfig.approverName || certTemplate.signerName})</p>
                                    <p style={{ color: '#475569', margin: 0 }}>{cneuConfig.approverPosition || certTemplate.signerPosition}</p>
                                </div>
                            </article>
                        </>
                    )}

                    <AiNavigatorPopup nav={navPopup} onClose={() => setNavPopup({ open: false })} guideVoiceState={guideVoiceState} onSpeak={playStudioVoice} />
                    <InstallAppModal open={showPwaGuide} onClose={() => setShowPwaGuide(false)} isIos={isIosDevice} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('app-root'));
        root.render(<AppErrorBoundary><LearnerApp /></AppErrorBoundary>);
    </script>

    <!-- @babel/standalone พร้อม CDN สำรอง (cdnjs) ป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
