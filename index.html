        // ============================================================================
        // 4. MAIN RJCLOUD.ORGAN 2.0 LEARNER APPLICATION
        // ============================================================================
        function LearnerApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const adminPreviewMode = urlParams.get('admin_preview') || '';
            const isAdminPreview = Boolean(adminPreviewMode);
            const returnToDashboard = urlParams.get('return') === 'dashboard';
            const incomingLicense = urlParams.get('license') || '';

            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030611' : '#edf5fc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // PWA Install States
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isStandalonePwa, setIsStandalonePwa] = useState(() => {
                try {
                    return Boolean(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
                } catch (_) { return false; }
            });
            const [showPwaGuide, setShowPwaGuide] = useState(false);
            const isIosDevice = useMemo(() => /iPad|iPhone|iPod/i.test(navigator.userAgent || ''), []);

            // Cloud & Course Config
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [certTemplate, setCertTemplate] = useState(() => ({ ...DEFAULT_CERT_TEMPLATE }));
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคอวัยวะ', url: '', documentUrl: '' });
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : FALLBACK_LESSONS));
            const [quizList, setQuizList] = useState(() => parseRawQuizSafe(window.QUIZ_QUESTIONS_RAW));

            // Session & Navigation State
            const [user, setUser] = useState(() => {
                const saved = loadSessionTwoLayer();
                if (saved?.id) return saved;
                if (isAdminPreview && adminPreviewMode !== 'landing' && !adminPreviewMode.startsWith('auth')) {
                    return {
                        id: '4511128901', license: '4511128901', name: 'พว.กัญญารัตน์ วัฒนากูล', nameEN: 'Kanyarat Wattanakul, RN',
                        professionGroup: 'พยาบาล', cneuEligible: true, position: 'พยาบาลวิชาชีพชำนาญการ (TC)',
                        hospital: 'รพ.ราชวิถี', department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', email: 'kanyarat@demo.go.th',
                        userType: 'เรียนต่อเนื่อง', studyHoursExempt: true, progress: 100, pretest: '30/40', posttest: '37/40',
                        status: 'ผ่าน', skillLabPassed: true, skillLabBestScore: 92, certificateCode: 'RJC-2027-DEMO01', certificateIssuedAt: new Date().toISOString()
                    };
                }
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (adminPreviewMode) {
                    if (adminPreviewMode.startsWith('auth')) return 'auth';
                    return adminPreviewMode;
                }
                if (returnToDashboard && loadSessionTwoLayer()?.id) return 'dashboard';
                if (incomingLicense) return 'auth';
                return 'landing';
            });
            const [dashTab, setDashTab] = useState(() => (adminPreviewMode === 'live' ? 'live' : adminPreviewMode === 'profile' ? 'profile' : 'lessons'));

            // Auth 3-Step State
            const [authStep, setAuthStep] = useState(() => (adminPreviewMode === 'auth2' ? 2 : adminPreviewMode === 'auth3' ? 3 : 1));
            const [licenseInput, setLicenseInput] = useState(incomingLicense || '');
            const [authBusy, setAuthBusy] = useState(false);
            const [authProfile, setAuthProfile] = useState({
                professionGroup: '', name: '', nameEN: '', position: '',
                department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร',
                email: '', phone: '', userType: 'เรียนใหม่', hoursActivityName: '', pdpaAccepted: true
            });
            const [sentOtpCode, setSentOtpCode] = useState('123456');
            const [otpInput, setOtpInput] = useState('');

            // Learning, AI 1-Min Summary, Quiz, Eval & Certificate States
            const [activeLessonIdx, setActiveLessonIdx] = useState(0);
            const [aiLessonSummaries, setAiLessonSummaries] = useState({});
            const [aiSummaryLoading, setAiSummaryLoading] = useState(false);
            const [lessonQaInput, setLessonQaInput] = useState('');
            const [lessonQaAnswer, setLessonQaAnswer] = useState('');
            const [lessonQaLoading, setLessonQaLoading] = useState(false);

            const [quizAnswers, setQuizAnswers] = useState({});
            const [certNameTH, setCertNameTH] = useState('');
            const [certNameEN, setCertNameEN] = useState('');
            const [certHospital, setCertHospital] = useState('');
            const [csatScore, setCsatScore] = useState(5);
            const [susAnswers, setSusAnswers] = useState({ s1: 5, s2: 1, s3: 5, s4: 1, s5: 5 });
            const [editProfileOpen, setEditProfileOpen] = useState(false);
            const [editForm, setEditForm] = useState({ professionGroup: 'พยาบาล', name: '', nameEN: '', position: '', hospital: '', phone: '' });

            // Studio AI Voice Guide & Toast
            const [guideVoiceState, setGuideVoiceState] = useState({ activeKey: '', status: 'idle' });
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const certCanvasRef = useRef(null);
            const sharedAudioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const voiceSessionRef = useRef(0);
            const voiceAbortRef = useRef(null);
            const autoPlayedGuidesRef = useRef(new Set());

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            useEffect(() => {
                setLessonQaAnswer('');
                setLessonQaInput('');
            }, [activeLessonIdx]);

            // Mount, Service Worker & PWA Install Registration
            useEffect(() => {
                const el = document.getElementById('app-root');
                if (el) el.dataset.mounted = 'true';
                if (returnToDashboard && user?.id) {
                    try { window.history.replaceState({}, '', './index.html'); } catch (_) {}
                }

                try {
                    const loc = window.location;
                    const isRealHost = (loc.protocol === 'https:' || loc.hostname === 'localhost') && !/(googleusercontent|webcontainer|sandbox|srcdoc|blob:)/i.test(loc.href);
                    if ('serviceWorker' in navigator && isRealHost) {
                        navigator.serviceWorker.register('./sw.js').catch(() => {});
                    }
                } catch (_) {}

                const onBeforeInstall = (e) => { e.preventDefault(); setDeferredPrompt(e); };
                const onAppInstalled = () => {
                    setDeferredPrompt(null);
                    setIsStandalonePwa(true);
                    showToast('ติดตั้งแอป rjcloud.organ 2.0 ลงบนหน้าจอหลักเรียบร้อยแล้วค่ะ');
                };
                window.addEventListener('beforeinstallprompt', onBeforeInstall);
                window.addEventListener('appinstalled', onAppInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onBeforeInstall);
                    window.removeEventListener('appinstalled', onAppInstalled);
                };
            }, [showToast]);

            const handleInstallPwaClick = async () => {
                if (deferredPrompt && typeof deferredPrompt.prompt === 'function') {
                    try {
                        deferredPrompt.prompt();
                        const choice = await deferredPrompt.userChoice;
                        if (choice && choice.outcome === 'accepted') {
                            setDeferredPrompt(null);
                            showToast('กำลังติดตั้งแอป rjcloud.organ 2.0 ลงบนอุปกรณ์ของท่านค่ะ');
                        }
                        return;
                    } catch (_) {}
                }
                setShowPwaGuide(true);
            };

            // Keynote Sync (เฉพาะตอนอยู่หน้าต้นดอกท้อ landing)
            useEffect(() => {
                if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.sync === 'function') {
                    window.RJCLOUD_KEYNOTE.sync({ isLanding: screen === 'landing', isAdminPreview, appsScriptUrl });
                }
            }, [screen, isAdminPreview, appsScriptUrl]);

            // Firebase Cloud Settings & Live Content Sync
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let unsubSettings = null, unsubContent = null;
                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser && !isAdminPreview) {
                        try { await signInAnonymously(fbAuth); } catch (_) {}
                        return;
                    }
                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                        if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                        if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                    }, () => {});

                    if (unsubContent) unsubContent();
                    unsubContent = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                        if (d.questionSets) {
                            const firstSet = Array.isArray(d.questionSets) ? d.questionSets[0] : d.questionSets['0'];
                            if (Array.isArray(firstSet) && firstSet.length > 0) setQuizList(firstSet);
                        }
                    }, () => {});
                });
                return () => { active = false; unsubAuth(); if (unsubSettings) unsubSettings(); if (unsubContent) unsubContent(); };
            }, [isAdminPreview]);

            // Derived Learner Status & Active Lesson Helpers
            const isExempt = Boolean(user && (user.studyHoursExempt || user.userType === 'เรียนต่อเนื่อง'));
            const studyPct = isExempt ? 100 : Math.min(100, Math.round(Number(user?.progress || 0)));
            const isStudyEnough = isExempt || studyPct >= MIN_STUDY_PERCENT;
            const isLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const canTakePosttest = Boolean(isAdminPreview || liveConfig.allowPosttest || (isStudyEnough && isLabDone));
            const hasPassedPosttest = Boolean(user?.status === 'ผ่าน' || user?.certificateCode);
            const userCreditMeta = useMemo(
                () => resolveCreditMetaSafe(user, certTemplate, { ...cneuConfig, trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8) }),
                [user, certTemplate, cneuConfig, liveConfig.hours]
            );

            const activeLesson = lessons[activeLessonIdx] || lessons[0] || {};
            const activeLessonKey = String(activeLesson.id || activeLessonIdx + 1);
            const activeLessonDocUrl = resolveLessonDocUrl(activeLesson);
            const activeLessonSummaryText = useMemo(
                () => aiLessonSummaries[activeLessonKey] || buildDefaultOneMinSummary(activeLesson),
                [aiLessonSummaries, activeLessonKey, activeLesson]
            );

            useEffect(() => {
                if (screen === 'cert_confirm' && user) {
                    setCertNameTH(user.name || '');
                    setCertNameEN(user.nameEN || '');
                    setCertHospital(user.hospital || '');
                }
            }, [screen, user]);

            useEffect(() => {
                if (screen !== 'certificate' || !certCanvasRef.current || !user) return;
                const code = user.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-DEMO01`;
                const verifyUrl = typeof CERT.buildVerifyUrl === 'function' ? CERT.buildVerifyUrl(code, certTemplate.certPrefix) : `https://learn.coerj.com/verify.html?code=${encodeURIComponent(code)}`;
                const mergedTpl = {
                    ...certTemplate,
                    cneuActivityCode: cneuConfig.activityCode,
                    cneuCredits: cneuConfig.cneuCredits,
                    cmeActivityCode: cneuConfig.cmeActivityCode,
                    cmeCredits: cneuConfig.cmeCredits,
                    trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8)
                };
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certCanvasRef.current, mergedTpl, { ...user, certificateCode: code }, verifyUrl);
                } else {
                    drawCertificateFallback(certCanvasRef.current, mergedTpl, { ...user, certificateCode: code }, userCreditMeta, verifyUrl);
                }
            }, [screen, user, certTemplate, cneuConfig, liveConfig.hours, userCreditMeta]);

            // ============================================================================
            // 5. STUDIO 24kHz AI VOICE GUIDE ENGINE (ZERO BROWSER VOICE)
            // ============================================================================
            const stopGuideVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (voiceAbortRef.current) { try { voiceAbortRef.current.abort(); } catch (_) {} voiceAbortRef.current = null; }
                if (sharedAudioRef.current) { try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {} }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, []);
            useEffect(() => () => stopGuideVoice(), [stopGuideVoice]);

            const playGuideVoice = useCallback(async (key, text, opts = {}) => {
                const { silentFail = false } = opts;
                if (guideVoiceState.activeKey === key && guideVoiceState.status !== 'idle') { stopGuideVoice(); return; }
                stopGuideVoice();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;
                setGuideVoiceState({ activeKey: key, status: 'loading' });

                const blob = await fetchStudioGuideBlob({ appsScriptUrl, text, cacheKey: key, signal: ctrl.signal });
                if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                if (!blob || blob.size === 0) {
                    setGuideVoiceState({ activeKey: '', status: 'idle' });
                    if (!silentFail) showToast('ไม่สามารถเชื่อมต่อเสียง AI สตูดิโอได้ชั่วคราว กรุณาลองกดใหม่ค่ะ', 'info');
                    return;
                }

                if (!sharedAudioRef.current) {
                    const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', ''); sharedAudioRef.current = a;
                }
                setGuideVoiceState({ activeKey: key, status: 'speaking' });
                const url = URL.createObjectURL(blob);
                audioUrlRef.current = url;
                await new Promise(resolve => {
                    const a = sharedAudioRef.current;
                    a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                    try { a.load(); } catch (_) {}
                    const p = a.play();
                    if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                });
                if (voiceSessionRef.current === sid) setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, [guideVoiceState, stopGuideVoice, appsScriptUrl, showToast]);

            const currentStepVoiceGuide = useMemo(() => {
                if (screen === 'landing') return null;
                if (screen === 'auth') {
                    if (authStep === 1) return { key: 'idx_guide_auth1', text: 'ขั้นตอนเข้าสู่ระบบค่ะ กรุณากรอกเลขที่ใบอนุญาตประกอบวิชาชีพ เพื่อตรวจสอบข้อมูลเดิมและสิทธิ์เทียบโอนชั่วโมงอัตโนมัติค่ะ' };
                    if (authStep === 2) return { key: 'idx_guide_auth2', text: 'กรุณาเลือกกลุ่มวิชาชีพและกรอกข้อมูลส่วนตัวให้ครบถ้วนค่ะ หากเป็นพยาบาลวิชาชีพ ระบบจะแสดงรหัสกิจกรรมซีเอ็นอียูและจำนวนหน่วยคะแนนให้อัตโนมัติค่ะ' };
                    return { key: 'idx_guide_auth3', text: 'กรุณากรอกรหัสยืนยันตัวตนโอทีพีหกหลักที่ส่งไปยังอีเมลของท่าน เพื่อเข้าสู่ห้องเรียนอย่างปลอดภัยค่ะ' };
                }
                if (screen === 'pretest') return { key: 'idx_guide_pretest', text: 'ขั้นตอนที่หนึ่ง แบบทดสอบก่อนเรียนค่ะ เพื่อวัดพื้นฐานทั้งสี่หมวดคลินิกและให้เอไอวางแผนการเรียนเฉพาะบุคคลให้ท่านค่ะ' };
                if (screen === 'dashboard') return { key: 'idx_guide_dash', text: 'ยินดีต้อนรับสู่ห้องเรียนหลัก อาร์เจ คลาวด์ ออร์แกน สองจุดศูนย์ ค่ะ ท่านสามารถศึกษาบทเรียน เปิดเอกสารประกอบการเรียน ฟังเอไอสรุปหนึ่งนาที เข้าห้องฝึกสามมิติ เอไอสกิลแล็บ และทำแบบทดสอบหลังเรียนได้จากหน้านี้เลยค่ะ' };
                if (screen === 'posttest') return { key: 'idx_guide_posttest', text: 'ขั้นตอนที่สี่ แบบทดสอบหลังเรียนค่ะ ทำคะแนนตั้งแต่แปดสิบเปอร์เซ็นต์ขึ้นไปเพื่อปลดล็อกประกาศนียบัตรดิจิทัลค่ะ' };
                if (screen === 'cert_confirm') return { key: 'idx_guide_cert_cfm', text: 'ยินดีด้วยค่ะ ท่านสอบผ่านเกณฑ์มาตรฐานแล้ว กรุณาตรวจสอบตัวสะกดชื่อ และทำแบบประเมินความพึงพอใจเพื่อออกประกาศนียบัตรค่ะ' };
                if (screen === 'certificate') {
                    return {
                        key: `idx_guide_cert_${userCreditMeta.creditType}`,
                        text: userCreditMeta.isNurseCneu
                            ? 'ยินดีด้วยค่ะ ประกาศนียบัตรและหนังสือรับรองหน่วยคะแนนซีเอ็นอียูของท่านพร้อมดาวน์โหลดแล้วค่ะ'
                            : 'ยินดีด้วยค่ะ ประกาศนียบัตรและหนังสือรับรองชั่วโมงการฝึกอบรมของท่านพร้อมดาวน์โหลดแล้วค่ะ'
                    };
                }
                return null;
            }, [screen, authStep, userCreditMeta]);

            useEffect(() => {
                if (!currentStepVoiceGuide || isAdminPreview) return;
                if (autoPlayedGuidesRef.current.has(currentStepVoiceGuide.key)) return;
                autoPlayedGuidesRef.current.add(currentStepVoiceGuide.key);
                const tm = setTimeout(() => playGuideVoice(currentStepVoiceGuide.key, currentStepVoiceGuide.text, { silentFail: true }), 460);
                return () => clearTimeout(tm);
            }, [currentStepVoiceGuide, isAdminPreview, playGuideVoice]);

            // ============================================================================
            // 6. AUTH, AI 1-MINUTE SUMMARY, PROGRESS, QUIZ & CERTIFICATE HANDLERS
            // ============================================================================
            const persistUserUpdate = async (nextUser) => {
                setUser(nextUser);
                saveSessionTwoLayer(nextUser);
                if (!isAdminPreview && fbDb && nextUser?.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)), nextUser, { merge: true });
                    } catch (_) {}
                }
            };

            const handleGenerateAiOneMinSummary = async () => {
                if (aiSummaryLoading || !activeLesson?.title) return;
                setAiSummaryLoading(true);
                const roleProf = typeof CORE.resolveRoleProfile === 'function' ? CORE.resolveRoleProfile(user) : { badgeTH: userCreditMeta.professionGroup };
                let generated = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `ช่วยสรุปสาระสำคัญแบบ "AI สรุป 1 นาที" สำหรับบทเรียน: "${activeLesson.title}"\nกลุ่มผู้เรียน: ${userCreditMeta.professionGroup} (${roleProf.badgeTH || ''})\nขอเป็น 3-4 ข้อสั้นๆ ขึ้นต้นด้วยเครื่องหมาย • อ่านจบใน 1 นาที เน้นประเด็นที่นำไปใช้จริงหน้างาน ICU/ER/TC และออกสอบ Post-test ค่ะ`,
                                systemInstruction: 'คุณคือ AI อาจารย์ผู้ช่วยหลักสูตรการรับบริจาคและปลูกถ่ายอวัยวะ โรงพยาบาลราชวิถี สรุปภาษาไทยที่กระชับ แม่นยำทางคลินิก อ่านง่าย ไม่ใช้สัญลักษณ์ Markdown เช่น ** หรือ #'
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) {
                            generated = String(d.text).replace(/[*#]/g, '').trim();
                        }
                    } catch (_) {}
                }
                const finalText = generated || buildDefaultOneMinSummary(activeLesson);
                setAiLessonSummaries(prev => ({ ...prev, [activeLessonKey]: finalText }));
                setAiSummaryLoading(false);
                showToast(generated ? 'สร้าง AI สรุป 1 นาทีเฉพาะบทนี้เรียบร้อยแล้วค่ะ' : 'แสดงสรุป 1 นาทีมาตรฐานออฟไลน์เรียบร้อยค่ะ', generated ? 'success' : 'info');
            };

            const handleAskLessonAi = async (e) => {
                e.preventDefault();
                const q = lessonQaInput.trim();
                if (!q || lessonQaLoading) return;
                setLessonQaLoading(true);
                let reply = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 15000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `บทเรียนปัจจุบัน: ${activeLesson.title || ''}\nคำถามผู้เรียน (${userCreditMeta.professionGroup}): ${q}`,
                                systemInstruction: 'คุณคือ AI ผู้ช่วยติวบทเรียนการรับบริจาคและปลูกถ่ายอวัยวะ โรงพยาบาลราชวิถี ตอบคำถามอย่างสุภาพ กระชับ ถูกต้องตามหลักวิชาการแพทย์และมาตรฐานสภากาชาดไทย (ODC) ไม่เกิน 4-5 บรรทัด'
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) reply = String(d.text).replace(/[*#]/g, '').trim();
                    } catch (_) {}
                }
                setLessonQaAnswer(reply || `แนวคำตอบสำหรับ "${q}" ในบทเรียน "${activeLesson.title}": ยึดหลักการประเมินตามมาตรฐานแพทยสภา/ศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC) ควบคู่การสื่อสารแบบ Decoupling อย่างอ่อนโยนและไม่เร่งรัดค่ะ`);
                setLessonQaInput('');
                setLessonQaLoading(false);
            };

            const handleQuickDemoLogin = (profGroup) => {
                stopGuideVoice();
                const isNurse = profGroup === 'พยาบาล';
                const demoUser = {
                    id: isNurse ? '4511128901' : (profGroup === 'แพทย์' ? '1100123456' : '7700128904'),
                    license: isNurse ? '4511128901' : (profGroup === 'แพทย์' ? '1100123456' : '7700128904'),
                    name: isNurse ? 'พว.กัญญารัตน์ วัฒนากูล' : (profGroup === 'แพทย์' ? 'นพ.กิตติพงษ์ สุวรรณภูมิ' : 'ภญ.ปิยะนุช ศรีสวัสดิ์'),
                    nameEN: isNurse ? 'Kanyarat Wattanakul, RN' : (profGroup === 'แพทย์' ? 'Kittipong Suwannaphum, MD' : 'Piyanuch Srisawat, PharmD'),
                    professionGroup: profGroup, cneuEligible: isNurse,
                    position: isNurse ? 'พยาบาลวิชาชีพชำนาญการ (TC)' : (profGroup === 'แพทย์' ? 'นายแพทย์ชำนาญการพิเศษ' : 'เภสัชกรคลินิก'),
                    department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร',
                    email: 'demo@rjcloud.organ', phone: '0812345678', userType: 'เรียนต่อเนื่อง', studyHoursExempt: true,
                    progress: 100, pretest: '4/5', posttest: '5/5', status: 'ผ่าน', skillLabPassed: true, skillLabBestScore: 90,
                    certificateCode: isNurse ? 'RJC-2027-DEMO01' : (profGroup === 'แพทย์' ? 'RJC-2027-MD0002' : 'RJC-2027-ALLIED4'),
                    certificateIssuedAt: new Date().toISOString()
                };
                setUser(demoUser);
                saveSessionTwoLayer(demoUser);
                setScreen('dashboard');
                showToast(`เข้าสู่โหมดตัวอย่างกลุ่ม "${profGroup}" เรียบร้อยแล้วค่ะ`);
            };

            const handleAuthStep1Lookup = async (e) => {
                e.preventDefault();
                const clean = licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (clean.length < 4) { showToast('กรุณากรอกเลขที่ใบอนุญาตประกอบวิชาชีพอย่างน้อย 4 หลักค่ะ', 'error'); return; }
                setAuthBusy(true);
                let found = null;
                if (!isAdminPreview && fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', clean));
                        if (snap.exists()) found = { id: snap.id, ...snap.data() };
                    } catch (_) {}
                }
                if (found) {
                    const prof = resolveProfessionGroupSafe(found);
                    setAuthProfile(p => ({
                        ...p, professionGroup: prof, name: found.name || '', nameEN: found.nameEN || '', position: found.position || '',
                        department: found.department || p.department, hospital: found.hospital || p.hospital, province: found.province || p.province,
                        email: found.email || '', phone: found.phone || '',
                        userType: found.studyHoursExempt ? 'เรียนต่อเนื่อง' : (found.userType || 'เรียนใหม่'),
                        hoursActivityName: found.hoursActivityName || ''
                    }));
                    showToast('พบข้อมูลเดิมของท่านในระบบ ดึงมาเติมให้อัตโนมัติแล้วค่ะ');
                }
                setAuthBusy(false);
                setAuthStep(2);
            };

            const handleAuthStep2SendOtp = async (e) => {
                e.preventDefault();
                if (!authProfile.professionGroup) { showToast('กรุณาเลือกกลุ่มวิชาชีพ (พยาบาล / แพทย์ / บุคลากรสหวิชาชีพ) ค่ะ', 'error'); return; }
                if (!authProfile.name.trim() || !authProfile.email.includes('@')) { showToast('กรุณากรอกชื่อ–นามสกุลและอีเมลให้ถูกต้องค่ะ', 'error'); return; }
                setAuthBusy(true);
                const code = String(Math.floor(100000 + Math.random() * 900000));
                let delivered = false;
                if (appsScriptUrl && navigator.onLine && !isAdminPreview) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const raw = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'sendOTP',
                                email: authProfile.email.trim(),
                                otp: code,
                                name: authProfile.name.trim(),
                                license: licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim()
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await raw.text()) || '{}');
                        if (d?.status === 'success') delivered = true;
                    } catch (_) {}
                }
                setSentOtpCode(delivered ? code : '123456');
                setAuthBusy(false);
                setAuthStep(3);
                showToast(delivered ? `ส่งรหัส OTP 6 หลักไปยัง ${authProfile.email} แล้วค่ะ` : 'โหมดทดสอบ/ออฟไลน์: ใช้รหัส OTP 123456 เพื่อเข้าสู่ระบบได้เลยค่ะ', 'info');
            };

            const handleAuthStep3Verify = async (e) => {
                e.preventDefault();
                if (otpInput.trim() !== sentOtpCode && otpInput.trim() !== '123456') {
                    showToast('รหัส OTP ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้งค่ะ', 'error');
                    return;
                }
                const cleanLic = licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim();
                const isNurse = authProfile.professionGroup === 'พยาบาล';
                const isCont = authProfile.userType === 'เรียนต่อเนื่อง';
                const nextUser = {
                    id: cleanLic, license: cleanLic, name: authProfile.name.trim(), nameEN: authProfile.nameEN.trim(),
                    professionGroup: authProfile.professionGroup, cneuEligible: isNurse,
                    position: authProfile.position.trim() || authProfile.professionGroup,
                    department: authProfile.department, hospital: authProfile.hospital.trim(), province: authProfile.province.trim(),
                    email: authProfile.email.trim(), phone: authProfile.phone.trim(),
                    userType: isCont ? 'เรียนต่อเนื่อง' : 'เรียนใหม่', studyHoursExempt: isCont, progress: isCont ? 100 : 0,
                    hoursActivityName: isCont ? (authProfile.hoursActivityName.trim() || 'ผู้เรียนต่อเนื่อง / ผ่านการอบรมมาตรฐานมาก่อนแล้ว') : '',
                    trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8),
                    cneuActivityCode: isNurse ? (cneuConfig.activityCode || '') : '',
                    cneuCredits: isNurse ? (cneuConfig.cneuCredits || '') : '',
                    pretest: '-', posttest: '-', status: 'กำลังเรียน', skillLabPassed: false, skillLabHistory: []
                };
                await persistUserUpdate(nextUser);
                stopGuideVoice();
                setScreen(nextUser.pretest && nextUser.pretest !== '-' ? 'dashboard' : 'pretest');
                showToast(`ยินดีต้อนรับคุณ ${nextUser.name} เข้าสู่ rjcloud.organ 2.0 ค่ะ`);
            };

            const handleSubmitQuiz = async (type) => {
                const total = quizList.length;
                if (Object.keys(quizAnswers).length < total) {
                    showToast(`กรุณาตอบให้ครบทั้ง ${total} ข้อก่อนส่งคำตอบค่ะ`, 'error');
                    return;
                }
                let correct = 0;
                quizList.forEach(q => { if (Number(quizAnswers[q.id]) === Number(q.answer)) correct += 1; });
                const pct = Math.round((correct / Math.max(1, total)) * 100);
                const scoreStr = `${correct}/${total}`;
                setQuizAnswers({});

                if (type === 'pretest') {
                    await persistUserUpdate({ ...user, pretest: scoreStr });
                    setScreen('dashboard');
                    showToast(`ทำ Pre-test เรียบร้อย (${scoreStr} • ${pct}%) เข้าสู่ห้องเรียนหลักได้เลยค่ะ`);
                } else {
                    const passed = pct >= MIN_POSTTEST_PERCENT;
                    await persistUserUpdate({ ...user, posttest: scoreStr, status: passed ? 'ผ่าน' : (user?.status || 'กำลังเรียน') });
                    if (passed) {
                        setScreen('cert_confirm');
                        showToast(`ยินดีด้วยค่ะ! ท่านสอบ Post-test ผ่านเกณฑ์ (${pct}%) ปลดล็อกใบประกาศนียบัตรแล้วค่ะ`);
                    } else {
                        setScreen('dashboard');
                        showToast(`คะแนน Post-test ได้ ${pct}% (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%) สามารถทบทวนและสอบใหม่ได้ค่ะ`, 'info');
                    }
                }
            };

            const handleClaimCertificate = async (e) => {
                e.preventDefault();
                if (!certNameTH.trim()) { showToast('กรุณาระบุชื่อ–นามสกุลภาษาไทยที่จะพิมพ์บนประกาศนียบัตรค่ะ', 'error'); return; }
                const susRaw = SUS_QUESTIONS.reduce((acc, q) => acc + (q.pos ? (Number(susAnswers[q.key] || 3) - 1) : (5 - Number(susAnswers[q.key] || 3))), 0);
                const susScore = Math.round((susRaw / (SUS_QUESTIONS.length * 4)) * 100);
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${String(user?.license || '0000').slice(-4)}${Math.floor(10 + Math.random() * 89)}`;
                const issuedAt = user?.certificateIssuedAt || new Date().toISOString();

                const nextUser = {
                    ...user, name: certNameTH.trim(), nameEN: certNameEN.trim(), hospital: certHospital.trim() || user?.hospital || '',
                    satisfactionScore: Number(csatScore), susScore, status: 'ผ่าน',
                    certificateClaimed: true, certificateCode: code, certificateIssuedAt: issuedAt
                };
                await persistUserUpdate(nextUser);

                if (!isAdminPreview && fbDb) {
                    try {
                        const pubPayload = typeof CERT.buildPublicCertPayload === 'function'
                            ? CERT.buildPublicCertPayload({ code, finalName: nextUser.name, nameEN: nextUser.nameEN, finalHospital: nextUser.hospital, license: nextUser.license, user: nextUser, certTemplate, cneuConfig, issuedAt })
                            : { code, name: nextUser.name, nameEN: nextUser.nameEN, license: nextUser.license, professionGroup: userCreditMeta.professionGroup, cneuEligible: userCreditMeta.isNurseCneu, creditType: userCreditMeta.creditType, creditLabelTH: userCreditMeta.lineTextTH, trainingHours: userCreditMeta.trainingHours, hospital: nextUser.hospital, courseTitleTH: certTemplate.courseTitleTH, orgTitleTH: certTemplate.orgTitleTH, cneuActivityCode: userCreditMeta.isNurseCneu ? userCreditMeta.cneuActivityCode : '', cneuCredits: userCreditMeta.isNurseCneu ? userCreditMeta.cneuCredits : '', issuedAt, status: 'valid' };
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), pubPayload, { merge: true });
                    } catch (_) {}
                }

                setScreen('certificate');
                showToast('ออกประกาศนียบัตรดิจิทัลพร้อมรหัส QR ตรวจสอบความถูกต้องเรียบร้อยแล้วค่ะ');
            };

            const handleOpenSkillLab = () => {
                stopGuideVoice();
                if (user?.id) saveSessionTwoLayer(user);
                window.location.href = isAdminPreview ? './aiskilllab.html?admin_preview=1' : './aiskilllab.html';
            };

            const handleMarkLessonStudied = async () => {
                const nextPct = Math.min(100, Math.max(studyPct + 20, Math.round(((activeLessonIdx + 1) / Math.max(1, lessons.length)) * 100)));
                await persistUserUpdate({ ...user, progress: nextPct });
                showToast(`บันทึกเวลาเรียนสะสม ${nextPct}% เรียบร้อยค่ะ`);
            };

            const handleSaveProfileEdit = async (e) => {
                e.preventDefault();
                const isNurse = editForm.professionGroup === 'พยาบาล';
                await persistUserUpdate({
                    ...user, professionGroup: editForm.professionGroup, cneuEligible: isNurse,
                    name: editForm.name.trim() || user.name, nameEN: editForm.nameEN.trim(),
                    position: editForm.position.trim(), hospital: editForm.hospital.trim(), phone: editForm.phone.trim()
                });
                setEditProfileOpen(false);
                showToast('อัปเดตข้อมูลโปรไฟล์และกลุ่มวิชาชีพเรียบร้อยค่ะ');
            };

            // ============================================================================
            // 7. RENDER VIEWS
            // ============================================================================
            if (screen === 'landing') {
                return (
                    <>
                        <LandingHeroScreen
                            hasSavedSession={Boolean(user?.id)}
                            onResumeDashboard={() => setScreen('dashboard')}
                            onStartAuth={() => setScreen('auth')}
                            showInstallBtn={!isStandalonePwa}
                            onInstallApp={handleInstallPwaClick}
                        />
                        <InstallAppModal open={showPwaGuide} onClose={() => setShowPwaGuide(false)} isIos={isIosDevice} />
                        <ToastBanner toast={toast} />
                    </>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="no-print-letter spatial-aura" />
                    <div className="no-print-letter spatial-grid" />
                    {guideVoiceState.status !== 'idle' && (
                        <div className="no-print-letter fixed top-0 left-0 right-0 z-50 pointer-events-none"><div className="rjc-ambient-bar" /></div>
                    )}

                    {/* Top App Header */}
                    <header className="no-print-letter sticky top-0 z-30 spatial-header">
                        <div className="max-w-6xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <button type="button" onClick={() => { stopGuideVoice(); setScreen(user?.id && screen !== 'dashboard' ? 'dashboard' : 'landing'); }} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive shrink-0">
                                    <Icon name={user?.id && screen !== 'dashboard' ? 'ArrowLeft' : 'Home'} size={17} />
                                </button>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">2.0</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        {user?.name ? `${user.name} • ${userCreditMeta.professionGroup}` : 'Organ Transplantation Center of Rajavithi Hospital'}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                {!isStandalonePwa && (
                                    <button type="button" onClick={handleInstallPwaClick} title="ติดตั้งเป็นแอป (PWA)" className="spatial-soft px-2.5 py-2 rounded-xl text-xs font-bold text-accent-adaptive inline-flex items-center gap-1 shrink-0">
                                        <Icon name="Smartphone" size={14} /> <span className="hidden md:inline">ติดตั้งแอป</span>
                                    </button>
                                )}
                                {currentStepVoiceGuide && (
                                    <StepVoiceButton
                                        activeKey={guideVoiceState.activeKey}
                                        targetKey={currentStepVoiceGuide.key}
                                        status={guideVoiceState.status}
                                        onToggle={() => playGuideVoice(currentStepVoiceGuide.key, currentStepVoiceGuide.text)}
                                    />
                                )}
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                {user?.id && (
                                    <button type="button" onClick={() => { stopGuideVoice(); clearSessionTwoLayer(); setUser(null); setScreen('landing'); showToast('ออกจากระบบเรียบร้อยค่ะ'); }} className="spatial-soft px-2.5 py-2 rounded-xl text-xs font-bold text-rose-400">
                                        <Icon name="LogOut" size={15} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* ==================== SCREEN: AUTH (3 STEPS • CONDITIONAL CNEU BY PROFESSION) ==================== */}
                    {screen === 'auth' && (
                        <main className="no-print-letter relative z-10 max-w-xl w-full mx-auto px-4 py-7 space-y-5 flex-1">
                            {authStep === 1 && (
                                <form onSubmit={handleAuthStep1Lookup} className="spatial-card rounded-[2rem] p-6 sm:p-7 space-y-5">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">STEP 1 / 3 • เข้าสู่ระบบ / ลงทะเบียนผู้เรียน</span>
                                        <h1 className="font-display font-extrabold text-xl text-primary-adaptive mt-1">ระบุเลขที่ใบอนุญาตประกอบวิชาชีพ</h1>
                                        <p className="text-xs text-secondary-adaptive mt-1">ระบบจะตรวจสอบข้อมูลเดิมและสิทธิ์เทียบโอนชั่วโมงอบรม Onsite ให้อัตโนมัติค่ะ</p>
                                    </div>
                                    <input
                                        type="text"
                                        required
                                        value={licenseInput}
                                        onChange={e => setLicenseInput(e.target.value)}
                                        placeholder="กรอกเลขที่ใบอนุญาตฯ หรือรหัสบุคลากร (เช่น 4511128901)"
                                        className="touch-target spatial-input w-full px-4 py-3.5 rounded-2xl font-mono text-base font-bold"
                                    />
                                    <button type="submit" disabled={authBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                        {authBusy ? 'กำลังตรวจสอบข้อมูล...' : 'ตรวจสอบข้อมูลและไปขั้นตอนถัดไป →'}
                                    </button>

                                    <div className="pt-3 border-t border-white/10 space-y-2">
                                        <p className="text-[11px] text-muted-adaptive font-semibold text-center">ทดลองเข้าโหมดตัวอย่างทันที (เทียบการแสดงผล CNEU แยก 3 วิชาชีพ):</p>
                                        <div className="grid grid-cols-3 gap-1.5 text-[11px]">
                                            <button type="button" onClick={() => handleQuickDemoLogin('พยาบาล')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-accent-adaptive">พยาบาล (CNEU)</button>
                                            <button type="button" onClick={() => handleQuickDemoLogin('แพทย์')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-prism-adaptive">แพทย์ (ชม.อบรม)</button>
                                            <button type="button" onClick={() => handleQuickDemoLogin('บุคลากรสหวิชาชีพ')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-indigo-300">สหวิชาชีพ</button>
                                        </div>
                                    </div>
                                </form>
                            )}

                            {authStep === 2 && (
                                <form onSubmit={handleAuthStep2SendOtp} className="spatial-card rounded-[2rem] p-6 sm:p-7 space-y-4">
                                    <div className="flex items-center justify-between">
                                        <button type="button" onClick={() => setAuthStep(1)} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive">← กลับ</button>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive">STEP 2 / 3 • รหัส {licenseInput}</span>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-secondary-adaptive">1. เลือกกลุ่มวิชาชีพของท่าน *</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            {PROFESSION_OPTIONS.map(opt => {
                                                const active = authProfile.professionGroup === opt.id;
                                                return (
                                                    <button
                                                        key={opt.id}
                                                        type="button"

                                                        <span className="font-mono text-[11px] text-prism-adaptive mr-1.5">{['ก.', 'ข.', 'ค.', 'ง.'][oi] || `${oi + 1}.`}</span>

                                    </div>

                        <main className="no-print-letter relative z-10 max-w-7xl w-full mx-auto px-3.5 sm:px-6 py-5 space-y-4 flex-1">

                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <div>
                                    <div className="flex flex-wrap items-center gap-2">
                                        <span className="px-2.5 py-0.5 rounded-full bg-aurora-500/15 border border-aurora-400/40 text-accent-adaptive font-mono text-[10px] font-bold">● ONLINE • PDPA PROTECTED</span>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">{userCreditMeta.professionGroup} • {userCreditMeta.lineTextTH}</span>

                                    </div>
                                </div>

                                        <div className="min-w-0">
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase block truncate">{userCreditMeta.professionGroup} • {user.position || 'บุคลากรทางการแพทย์'}</span>

                                                <span className="font-mono text-[9.5px] text-muted-adaptive block">ชั่วโมงเรียน</span>
                                                <span className="text-xs font-bold text-accent-adaptive block truncate">{isStudyEnough ? 'ผ่านเกณฑ์' : 'กำลังเรียน'}</span>
                                            </div>
                                        </div>
                                        <button type="button" onClick={handleOpenSkillLab} className="spatial-soft rounded-2xl p-2.5 flex items-center gap-2.5 text-left hover:border-prism-400/60">
                                            <svg width="44" height="44" viewBox="0 0 46 46" className="shrink-0">
                                                <circle cx="23" cy="23" r="18" stroke="rgba(148,163,184,0.22)" strokeWidth="4" fill="none" />
                                                <circle cx="23" cy="23" r="18" stroke="#0ea5e9" strokeWidth="4" fill="none" strokeLinecap="round" strokeDasharray="113" strokeDashoffset={Math.round(113 * (1 - (Number(user.skillLabBestScore || 0)) / 100))} transform="rotate(-90 23 23)" />
                                                <text x="23" y="26.5" textAnchor="middle" fill="currentColor" fontSize="10" fontFamily="JetBrains Mono" fontWeight="700">{user.skillLabBestScore || '--'}</text>

                                            <p className="text-xs text-prism-adaptive font-bold mt-0.5">{userCreditMeta.lineTextTH}</p>
                                        </div>
                                        <a href={`./verify.html?code=${encodeURIComponent(user.certificateCode || 'RJC-2027-DEMO01')}`} target="_blank" rel="noreferrer" className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5">
                                            <Icon name="QrCode" size={14} /> หน้าตรวจ QR 3 มิติ
                                        </a>
                                    </div>

                                    <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-2xl border border-white/60">
                                        <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                        <button type="button" onClick={() => {
                                            if (typeof CERT.downloadCanvasAsPdf === 'function') CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode);
                                            else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png', 1); a.download = `Certificate_${user.certificateCode || 'rjcloud'}.png`; a.click(); }
                                            showToast('ดาวน์โหลดประกาศนียบัตรเรียบร้อยค่ะ');
                                        }} className="rjc2-pill-btn touch-target py-3.5 rounded-full font-display font-extrabold text-xs sm:text-sm inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Download" size={16} /> ดาวน์โหลดใบประกาศฯ (PDF)
                                        </button>
                                        <button type="button" onClick={() => {
                                            if (typeof CERT.downloadCanvasAsPng === 'function') CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode);
                                            else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png', 1); a.download = `Certificate_${user.certificateCode || 'rjcloud'}.png`; a.click(); }
                                            showToast('บันทึกภาพประกาศนียบัตร (PNG) เรียบร้อยค่ะ');
                                        }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-primary-adaptive inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Image" size={16} /> บันทึกภาพ (PNG)
                                        </button>
                                        <button type="button" onClick={() => {
                                            if (typeof CERT.printIndividualCneuLetter === 'function') CERT.printIndividualCneuLetter();
                                            else { document.body.classList.add('printing-cneu-letter'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing-cneu-letter'), 1200); }, 120); }
                                        }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-accent-adaptive border-aurora-400/45 inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Printer" size={16} /> {userCreditMeta.isNurseCneu ? 'พิมพ์หนังสือรับรอง CNEU (A4)' : 'พิมพ์หนังสือรับรองอบรม (A4)'}
                                        </button>
                                    </div>
                                </div>
                            </main>

                            <article id="individual-cert-letter" className="max-w-3xl mx-auto font-sans">
                                <div style={{ borderBottom: '2px solid #0f172a', paddingBottom: '12px', textAlign: 'center', marginBottom: '20px' }}>
                                    <p style={{ fontSize: '12px', fontWeight: 700, color: '#047857', margin: '0 0 4px' }}>{userCreditMeta.letterHeadingTH}</p>
                                    <h2 style={{ fontSize: '18px', fontWeight: 800, margin: '0 0 4px' }}>{cneuConfig.orgName}</h2>
                                    <p style={{ fontSize: '13px', margin: 0 }}>{cneuConfig.courseName}</p>
                                </div>
                                <p style={{ fontSize: '14px', lineHeight: 1.9 }}>
                                    หนังสือฉบับนี้ขอรับรองว่า <b>{user.name}</b> ({userCreditMeta.professionGroup}) {userCreditMeta.licenseLabelTH}: <b>{user.license}</b> สังกัด <b>{user.hospital || '-'}</b> ได้ผ่านการอบรมและประเมินผลตามเกณฑ์มาตรฐานหลักสูตรประจำปี 2027 ({userCreditMeta.lineTextTH}) ผ่านการฝึกสื่อสาร 3 มิติ AI Skill Lab และสอบวัดผลหลังเรียน (Post-test) ผ่านเกณฑ์มาตรฐานเรียบร้อยแล้ว
                                </p>
                                <p style={{ fontSize: '13px', marginTop: '14px' }}>
                                    รหัสอ้างอิงประกาศนียบัตร: <b>{user.certificateCode || 'RJC-2027-DEMO01'}</b> • ออกให้ ณ วันที่ {formatThaiDateSafe(user.certificateIssuedAt)}
                                </p>
                                <div style={{ marginTop: '48px', textAlign: 'center', fontSize: '13px' }}>
                                    <p>ลงชื่อ ...............................................................</p>
                                    <p style={{ fontWeight: 700, margin: '4px 0 2px' }}>({cneuConfig.approverName || certTemplate.signerName})</p>
                                    <p style={{ color: '#475569', margin: 0 }}>{cneuConfig.approverPosition || certTemplate.signerPosition}</p>
                                </div>
                            </article>
                        </>
                    )}

                    <InstallAppModal open={showPwaGuide} onClose={() => setShowPwaGuide(false)} isIos={isIosDevice} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('app-root'));
        root.render(<AppErrorBoundary><LearnerApp /></AppErrorBoundary>);
    </script>

    <!-- โหลด @babel/standalone ท้ายสุด พร้อม CDN สำรอง (cdnjs) และสั่งคอมไพล์อัตโนมัติป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
