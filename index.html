                                                                    active ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'
                                                                }`}
                                                            >
                                                                <span className="font-mono font-bold text-accent-adaptive shrink-0">{l.id}.</span>
                                                                <span className="flex-1 leading-snug">{l.title}</span>
                                                                {rec && <span className="text-amber-400 shrink-0" title="AI แนะนำทบทวน">★</span>}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Right Column (4 cols): AI Study Companion */}
                                        <div className="lg:col-span-4">
                                            <AiStudyCompanion lesson={activeLesson} user={user} appsScriptUrl={appsScriptUrl} showToast={showToast} />
                                        </div>
                                    </div>
                                )}

                                {/* TAB 2: CLINICAL CASES */}
                                {activeTab === 'clinical_cases' && <ClinicalCaseSimulator />}

                                {/* TAB 3: FLASHCARDS */}
                                {activeTab === 'flashcards' && <SpacedFlashcardsDeck aiRoadmap={user.aiRoadmap} />}

                                {/* TAB 4: LIVE STREAM + CHECK-IN */}
                                {activeTab === 'live' && (
                                    <div className="max-w-4xl mx-auto spatial-card rounded-[1.75rem] p-5 sm:p-7 space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div>
                                                <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-mono text-xs font-bold ${
                                                    liveConfig.status === 'live' ? 'bg-rose-500/20 text-rose-400' : liveConfig.status === 'paused' ? 'bg-amber-500/20 text-amber-400' : 'spatial-soft text-muted-adaptive'
                                                }`}>
                                                    {liveConfig.status === 'live' ? '🔴 กำลังถ่ายทอดสด' : liveConfig.status === 'paused' ? '⏸️ พักเบรก' : '⚫ ออฟไลน์'}
                                                </span>
                                                <h2 className="font-display text-lg sm:text-2xl font-extrabold text-primary-adaptive mt-1.5">{liveConfig.topic}</h2>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={handleLiveCheckIn}
                                                className="touch-target px-4 py-2.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs flex items-center gap-1.5 shadow-md"
                                            >
                                                <Icon name="CheckCircle2" size={16} />
                                                {user.liveCheckInAt ? 'เช็คอินเข้าเรียนแล้ว ✓' : 'เช็คอินยืนยันเข้าเรียน Live'}
                                            </button>
                                        </div>

                                        {liveConfig.url ? (
                                            <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen" allowFullScreen title="Live Broadcast" />
                                            </div>
                                        ) : (
                                            <div className="spatial-soft rounded-2xl p-10 text-center space-y-2">
                                                <Icon name="Radio" size={32} className="mx-auto text-muted-adaptive" />
                                                <p className="text-sm font-bold text-primary-adaptive">ยังไม่มีลิงก์ถ่ายทอดสดในขณะนี้</p>
                                                <p className="text-xs text-muted-adaptive">สามารถศึกษาวิดีโอ 20 บทเรียนและฝึกใน AI Skill Lab ระหว่างรอการบรรยายสดได้เลยค่ะ</p>
                                            </div>
                                        )}

                                        {liveConfig.documentUrl && (
                                            <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="touch-target spatial-soft w-full py-3 rounded-2xl text-prism-adaptive font-bold text-sm flex items-center justify-center gap-2">
                                                <Icon name="FileText" size={16} /> ดาวน์โหลดเอกสารประกอบการบรรยายสด
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* TAB 5: PROFILE, PRE-APPROACH WARM-UP & PDPA SELF-SERVICE */}
                                {activeTab === 'profile' && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        {/* Left 6 cols: Profile Summary + PDPA Self-Service (ตรวจสอบ แก้ไข ลบข้อมูลส่วนตัว) */}
                                        <div className="lg:col-span-6 space-y-4">
                                            <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div>
                                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">LEARNER PROFILE &amp; PORTFOLIO</span>
                                                        <h2 className="font-display text-xl font-extrabold text-primary-adaptive mt-0.5">{user.name}</h2>
                                                        <p className="text-xs text-secondary-adaptive">{user.position} • {user.hospital} ({user.department})</p>
                                                        <p className="font-mono text-xs text-prism-adaptive mt-0.5">เลขใบอนุญาต: {user.license || user.id} • {user.userType}</p>
                                                    </div>
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${isPosttestPassed ? 'bg-aurora-500/20 text-accent-adaptive' : 'spatial-soft text-amber-400'}`}>
                                                        {isPosttestPassed ? 'ผ่านหลักสูตร ✓' : 'กำลังเรียน'}
                                                    </span>
                                                </div>

                                                <div className="grid grid-cols-3 gap-2 text-center">
                                                    <div className="spatial-soft p-3 rounded-2xl">
                                                        <span className="text-[10px] text-muted-adaptive block">Pre-test</span>
                                                        <span className="font-mono text-sm font-extrabold text-primary-adaptive">{user.pretest || '-'}</span>
                                                    </div>
                                                    <div className="spatial-soft p-3 rounded-2xl">
                                                        <span className="text-[10px] text-muted-adaptive block">AI Skill Lab</span>
                                                        <span className="font-mono text-sm font-extrabold text-prism-adaptive">{user.skillLabBestScore ? `${user.skillLabBestScore}/100` : (isSkillLabDone ? 'ผ่าน ✓' : '-')}</span>
                                                    </div>
                                                    <div className="spatial-soft p-3 rounded-2xl">
                                                        <span className="text-[10px] text-muted-adaptive block">Post-test</span>
                                                        <span className="font-mono text-sm font-extrabold text-accent-adaptive">{user.posttest || '-'}</span>
                                                    </div>
                                                </div>

                                                {(isPosttestPassed || isAdminPreview) && (
                                                    <button
                                                        type="button"
                                                        onClick={() => setScreen(user.certificateCode ? 'certificate' : 'cert_confirm')}
                                                        className="touch-target w-full py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2"
                                                    >
                                                        <Icon name="Award" size={17} /> เปิดใบประกาศนียบัตร &amp; หนังสือรับรอง CNEU
                                                    </button>
                                                )}

                                                {/* สิทธิ์เจ้าของข้อมูลส่วนบุคคล (PDPA Self-Service — ตรงตามนโยบายข้อ 4) */}
                                                <div className="pt-3 border-t border-white/10 space-y-3">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <div>
                                                            <p className="font-display font-bold text-sm text-primary-adaptive flex items-center gap-1.5">
                                                                <Icon name="ShieldCheck" size={16} className="text-accent-adaptive" /> จัดการข้อมูลส่วนบุคคล (PDPA)
                                                            </p>
                                                            <p className="text-xs text-muted-adaptive">ตรวจสอบ แก้ไข หรือลบข้อมูลส่วนตัวของคุณได้ตลอดเวลา</p>
                                                        </div>
                                                        <button type="button" onClick={() => setPdpaModalOpen(true)} className="text-xs font-bold text-prism-adaptive underline shrink-0">อ่านนโยบาย</button>
                                                    </div>

                                                    {!pdpaEditOpen ? (
                                                        <div className="spatial-soft p-3.5 rounded-2xl space-y-2 text-xs text-secondary-adaptive">
                                                            <p><b>สังกัด / จังหวัด:</b> {user.department || '-'} {user.province ? `• จ.${user.province}` : ''}</p>
                                                            <p><b>อีเมล:</b> <span className="font-mono">{user.email || '-'}</span></p>
                                                            <p><b>เบอร์โทรศัพท์:</b> <span className="font-mono">{user.phone || '-'}</span></p>
                                                            <div className="pt-2">
                                                                <button type="button" onClick={handleOpenPdpaEdit} className="touch-target spatial-soft w-full py-2.5 rounded-xl font-bold text-prism-adaptive flex items-center justify-center gap-1.5">
                                                                    <Icon name="Edit3" size={14} /> ตรวจสอบ / แก้ไขข้อมูลส่วนตัว
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <form onSubmit={handleSavePdpaEdit} className="spatial-soft p-4 rounded-2xl space-y-2.5 text-xs">
                                                            <input type="text" required value={pdpaForm.name} onChange={e => setPdpaForm(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ–สกุล" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                            <div className="grid grid-cols-2 gap-2">
                                                                <input type="text" value={pdpaForm.position} onChange={e => setPdpaForm(p => ({ ...p, position: e.target.value }))} placeholder="ตำแหน่ง" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <select value={pdpaForm.department} onChange={e => setPdpaForm(p => ({ ...p, department: e.target.value }))} className="spatial-input w-full px-3 py-2 rounded-xl">
                                                                    {Object.keys(HOSPITAL_MAPPING).map(k => <option key={k} value={k}>{k}</option>)}
                                                                </select>
                                                                <input type="text" value={pdpaForm.hospital} onChange={e => setPdpaForm(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <input type="text" value={pdpaForm.province} onChange={e => setPdpaForm(p => ({ ...p, province: e.target.value }))} placeholder="จังหวัด" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <input type="email" value={pdpaForm.email} onChange={e => setPdpaForm(p => ({ ...p, email: e.target.value }))} placeholder="อีเมล" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <input type="tel" value={pdpaForm.phone} onChange={e => setPdpaForm(p => ({ ...p, phone: e.target.value }))} placeholder="เบอร์โทรศัพท์" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-2 pt-1">
                                                                <button type="button" onClick={() => setPdpaEditOpen(false)} className="spatial-soft py-2 rounded-xl font-bold text-secondary-adaptive">ยกเลิก</button>
                                                                <button type="submit" className="py-2 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold">บันทึกการแก้ไข</button>
                                                            </div>
                                                        </form>
                                                    )}
                                                </div>

                                                {/* โซนลบข้อมูลถาวร (Danger Zone): พับเก็บไว้ด้านล่างสุดแยกขาดจากปุ่มออกจากระบบ */}
                                                <div className="pt-2 border-t border-dashed border-slate-500/25">
                                                    <button
                                                        type="button"
                                                        onClick={() => setPdpaDangerOpen(v => !v)}
                                                        className="w-full py-1.5 text-xs font-semibold text-muted-adaptive hover:text-red-500 flex items-center justify-between gap-2 transition-colors"
                                                    >
                                                        <span className="flex items-center gap-1.5">
                                                            <Icon name="AlertTriangle" size={13} className="text-red-400" />
                                                            สิทธิ PDPA: ขอลบข้อมูลส่วนบุคคลถาวร (Danger Zone)
                                                        </span>
                                                        <Icon name={pdpaDangerOpen ? 'ChevronUp' : 'ChevronDown'} size={15} />
                                                    </button>

                                                    {pdpaDangerOpen && (
                                                        <div className="mt-2.5 p-3.5 rounded-2xl bg-red-600/10 border border-red-500/40 space-y-2.5">
                                                            <p className="text-xs text-red-500 dark:text-red-300 leading-relaxed">
                                                                <b>คำเตือน:</b> ปุ่มนี้จะลบบัญชี ประวัติการเรียน และข้อมูลส่วนตัวของคุณออกจากระบบ <b>อย่างถาวร</b> (หากต้องการแค่พักการเรียนชั่วคราว ให้กดปุ่ม <b>“ออกจากระบบ”</b> บนแถบเมนูหน้าห้องเรียนแทนค่ะ)
                                                            </p>
                                                            <button
                                                                type="button"
                                                                onClick={handleDeletePersonalData}
                                                                className="touch-target w-full py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-display font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-colors"
                                                            >
                                                                <Icon name="Trash2" size={14} /> ยืนยันลบข้อมูลส่วนบุคคลถาวร
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Right 6 cols: โหมดอุ่นเครื่อง 30 วิก่อนพบญาติจริง (PDPA Zero-PII) */}
                                        <div className="lg:col-span-6 spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">PDPA ZERO-PII • PRE-APPROACH WARM-UP</span>
                                                <h2 className="font-display text-lg font-extrabold text-primary-adaptive mt-0.5">โหมดอุ่นเครื่อง 30 วิก่อนพบญาติจริง</h2>
                                                <p className="text-xs text-secondary-adaptive">เลือกบริบทด้วยปุ่มกดเท่านั้น (ไม่พิมพ์ชื่อหรือ HN ผู้ป่วยจริง) เพื่อให้ AI เตรียมประโยคเปิดใจ</p>
                                            </div>

                                            {[
                                                { key: 'age', label: 'ช่วงอายุผู้ป่วย', opts: PRE_APPROACH_TAGS.ageGroups },
                                                { key: 'cause', label: 'สาเหตุการเสียชีวิต', opts: PRE_APPROACH_TAGS.causes },
                                                { key: 'mood', label: 'อารมณ์ครอบครัวเบื้องต้น', opts: PRE_APPROACH_TAGS.familyMoods },
                                                { key: 'concern', label: 'ข้อกังวลหลักของญาติ', opts: PRE_APPROACH_TAGS.concerns }
                                            ].map(grp => (
                                                <div key={grp.key} className="space-y-1.5">
                                                    <p className="text-xs font-bold text-secondary-adaptive">{grp.label}</p>
                                                    <div className="flex flex-wrap gap-1.5">
                                                        {(grp.opts || []).map(opt => (
                                                            <button
                                                                key={opt}
                                                                type="button"
                                                                onClick={() => setWarmupTags(p => ({ ...p, [grp.key]: opt }))}
                                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${warmupTags[grp.key] === opt ? 'bg-aurora-500/20 border-aurora-400 text-accent-adaptive' : 'spatial-soft text-secondary-adaptive'}`}
                                                            >
                                                                {opt}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}

                                            <button type="button" onClick={handleGenerateWarmup} className="touch-target w-full py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm">
                                                สร้างเช็กลิสต์และประโยคอุ่นเครื่อง 30 วิ →
                                            </button>

                                            {warmupResult && (
                                                <div className="spatial-soft p-4 rounded-2xl text-xs sm:text-sm text-primary-adaptive whitespace-pre-line leading-relaxed border-aurora-400/35">
                                                    {warmupResult}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </main>

                            {/* Mobile Bottom Dock (5 Menus + ปุ่มออกจากระบบสีแดงต่อจากโปรไฟล์) */}
                            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-1.5 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] no-print">
                                <div className="grid grid-cols-6 gap-1 max-w-xl mx-auto">
                                    {dashboardTabs.map(t => {
                                        const active = activeTab === t.id;
                                        return (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => { setActiveTab(t.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all ${
                                                    active ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950' : 'text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={17} />
                                                <span className="truncate max-w-full px-0.5">{t.shortLabel}</span>
                                            </button>
                                        );
                                    })}
                                    <button
                                        id="btn-learner-logout-mobile"
                                        type="button"
                                        onClick={handleLogout}
                                        className="touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all text-secondary-adaptive hover:!bg-red-600 hover:!text-white active:!bg-red-600 active:!text-white active:scale-95"
                                    >
                                        <Icon name="LogOut" size={17} />
                                        <span className="truncate max-w-full px-0.5">ออกจากระบบ</span>
                                    </button>
                                </div>
                            </nav>
                        </div>
                    )}

                    {/* ==================== SCREEN 6: STEP 05 — CERT CONFIRM + CNEU 5-DIM CSAT ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <div className="relative z-10 flex-1 max-w-2xl w-full mx-auto px-3.5 sm:px-6 py-6">
                            <form onSubmit={handleIssueCertificate} className="spatial-card rounded-[2rem] p-5 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5">
                                        <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                    </button>
                                    <span className="font-mono text-xs font-bold text-accent-adaptive">STEP 05 • CERTIFICATE &amp; CNEU</span>
                                </div>

                                <div>
                                    <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ยืนยันชื่อและประเมินความพึงพอใจ 5 ด้าน</h1>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">เพื่อออกใบประกาศนียบัตรและหนังสือรับรองหน่วยคะแนน CNEU ({cneuConfig.cneuCredits} หน่วยคะแนน)</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ชื่อ – นามสกุล (ไทย) *</label>
                                        <input type="text" required value={certForm.name} onChange={e => setCertForm(p => ({ ...p, name: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ชื่อ – นามสกุล (อังกฤษ • ไม่บังคับ)</label>
                                        <input type="text" value={certForm.nameEN} onChange={e => setCertForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="เช่น Kanyarat Wattanakul, RN" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">โรงพยาบาล / หน่วยงานต้นสังกัด *</label>
                                        <input type="text" required value={certForm.hospital} onChange={e => setCertForm(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                </div>

                                <div className="spatial-soft p-4 rounded-2xl space-y-3">
                                    <div className="flex items-center justify-between gap-2 pb-2 border-b border-white/10">
                                        <p className="font-display font-bold text-sm text-primary-adaptive">แบบประเมินความพึงพอใจ (มาตรฐาน CNEU)</p>
                                        <span className="font-mono text-sm font-extrabold text-accent-adaptive">เฉลี่ย {avgCsatPreview} / 5.00</span>
                                    </div>
                                    {CNEU_EVAL_CRITERIA.map(item => (
                                        <div key={item.key} className="p-3 rounded-xl spatial-soft flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <div className="flex-1">
                                                <p className="text-xs font-bold text-primary-adaptive">{item.title}</p>
                                                <p className="text-[11px] text-muted-adaptive">{item.desc}</p>
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(st => (
                                                    <button key={st} type="button" onClick={() => setEvalCriteria(p => ({ ...p, [item.key]: st }))} className="p-0.5">
                                                        <Icon name="Star" size={22} className={st <= evalCriteria[item.key] ? 'text-amber-400 fill-amber-400' : 'text-slate-500/60'} />
                                                    </button>
                                                ))}
                                                <span className="font-mono text-[10px] font-bold text-amber-400 ml-1">{CSAT_RATING_LABELS[evalCriteria[item.key]]}</span>
                                            </div>
                                        </div>
                                    ))}
                                    <textarea rows="2" value={certForm.comment} onChange={e => setCertForm(p => ({ ...p, comment: e.target.value }))} placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)..." className="spatial-input w-full p-3 rounded-xl text-xs" />
                                </div>

                                <button type="submit" className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                    ยืนยันและออกประกาศนียบัตร + ใบรับรอง CNEU →
                                </button>
                            </form>
                        </div>
                    )}

                    {/* ==================== SCREEN 7: DUAL CERTIFICATE + INDIVIDUAL CNEU LETTER ==================== */}
                    {screen === 'certificate' && user && (
                        <div className="relative z-10 flex-1 max-w-5xl w-full mx-auto px-3.5 sm:px-6 py-6 space-y-5 cneu-print-container">
                            <div className="spatial-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 no-print hide-when-printing-cneu">
                                <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5">
                                    <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                </button>
                                <div className="inline-flex p-1 rounded-xl spatial-soft text-xs font-bold">
                                    <button type="button" onClick={() => setCertSubView('cert')} className={`px-3.5 py-1.5 rounded-lg ${certSubView === 'cert' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>
                                        1. ใบประกาศนียบัตร
                                    </button>
                                    <button type="button" onClick={() => setCertSubView('cneu')} className={`px-3.5 py-1.5 rounded-lg ${certSubView === 'cneu' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>
                                        2. หนังสือรับรอง CNEU (A4)
                                    </button>
                                </div>
                                <a href={verifyUrl} target="_blank" rel="noreferrer" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5">
                                    <Icon name="QrCode" size={14} /> หน้าตรวจ QR
                                </a>
                            </div>

                            {certSubView === 'cert' ? (
                                <div className="space-y-4">
                                    <div className="spatial-card rounded-[1.75rem] p-3 sm:p-5">
                                        <canvas ref={certCanvasRef} className="w-full h-auto rounded-xl bg-white shadow-xl block" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 no-print">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const res = typeof CERT.downloadCanvasAsPdf === 'function' ? CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode) : { ok: false };
                                                showToast(res.ok ? `ดาวน์โหลดใบประกาศนียบัตร (${res.format.toUpperCase()}) เรียบร้อยแล้วค่ะ` : 'ไม่สามารถสร้างไฟล์ได้ กรุณาลองใหม่ค่ะ', res.ok ? 'success' : 'error');
                                            }}
                                            className="touch-target py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                        >
                                            <Icon name="FileDown" size={18} /> ดาวน์โหลดประกาศนียบัตร (PDF)
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const ok = typeof CERT.downloadCanvasAsPng === 'function' ? CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode) : false;
                                                showToast(ok ? 'บันทึกรูปภาพประกาศนียบัตร (PNG) เรียบร้อยแล้วค่ะ' : 'ไม่สามารถบันทึกรูปได้ค่ะ', ok ? 'success' : 'error');
                                            }}
                                            className="touch-target spatial-card py-3.5 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                        >
                                            <Icon name="Image" size={18} className="text-prism-adaptive" /> บันทึกเป็นรูปภาพ (PNG)
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex justify-end no-print hide-when-printing-cneu">
                                        <button
                                            type="button"
                                            onClick={() => (typeof CERT.printIndividualCneuLetter === 'function' ? CERT.printIndividualCneuLetter() : window.print())}
                                            className="touch-target px-5 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center gap-2 shadow-lg"
                                        >
                                            <Icon name="Printer" size={17} /> พิมพ์ / บันทึก PDF หนังสือรับรอง CNEU
                                        </button>
                                    </div>
                                    <IndividualCneuLetter user={user} cneuConfig={cneuConfig} certTemplate={certTemplate} verifyUrl={verifyUrl} />
                                </div>
                            )}
                        </div>
                    )}

                    <PdpaPolicyModal open={pdpaModalOpen} onClose={() => setPdpaModalOpen(false)} />
                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
