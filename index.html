    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f4f9fb');
        } catch (_) {}
      })();
    </script>

      }
      body {
        font-family: 'Sarabun', sans-serif;
        font-size: 16px;

        background-color: var(--bg-page);

      .spatial-aura {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 12% 14%, var(--aura-1) 0%, transparent 46%),
          radial-gradient(circle at 88% 12%, var(--aura-2) 0%, transparent 45%),
          radial-gradient(circle at 65% 88%, var(--aura-3) 0%, transparent 48%);
        pointer-events: none;
      }
      .spatial-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(ellipse at center, black 45%, transparent 94%);
        pointer-events: none;
      }

      .spatial-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(155%);
        -webkit-backdrop-filter: blur(24px) saturate(155%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      .spatial-header {
        background: var(--header-bg);
        backdrop-filter: blur(22px) saturate(150%);
        -webkit-backdrop-filter: blur(22px) saturate(150%);
        border-bottom: 1px solid var(--surface-border);
      }
      .spatial-dock {
        background: var(--dock-bg);
        backdrop-filter: blur(24px) saturate(150%);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        border-top: 1px solid var(--surface-border);
      }
      .spatial-soft {
        background: var(--surface-soft);
        border: 1px solid var(--surface-border);
      }
      .spatial-soft:hover {
        background: var(--surface-soft-hover);
      }
      .spatial-input {

        border: 1px solid var(--input-border);
        color: var(--input-text);

        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);

      /* ไฟแอมเบี้ยนวิ่ง (Ambient Light Runner) */
      @keyframes ambientBorderFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes ambientSweep {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(220%); }
      }
      @keyframes audioEqPulse {
        0%, 100% { transform: scaleY(0.32); opacity: 0.65; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      .ambient-loading-card {
        position: relative;
        border-color: rgba(34, 211, 238, 0.48) !important;
        box-shadow:
          0 0 0 1px rgba(52, 211, 153, 0.28),
          0 16px 46px -14px rgba(34, 211, 238, 0.34),
          0 0 30px -8px rgba(16, 185, 129, 0.28) !important;
      }
      .ambient-playing-card {
        position: relative;
        border-color: rgba(52, 211, 153, 0.5) !important;
        box-shadow:
          0 0 0 1px rgba(52, 211, 153, 0.25),
          0 14px 40px -14px rgba(16, 185, 129, 0.28) !important;
      }
      .ambient-ribbon {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3.5px;
        overflow: hidden;
        border-top-left-radius: 1.75rem;
        border-top-right-radius: 1.75rem;
        pointer-events: none;
        z-index: 5;
      }
      .ambient-ribbon-loading {
        background: linear-gradient(90deg, #10b981, #22d3ee, #818cf8, #34d399, #22d3ee);
        background-size: 280% 100%;
        animation: ambientBorderFlow 1.7s linear infinite;
        box-shadow: 0 0 16px rgba(34, 211, 238, 0.78);
      }
      .ambient-ribbon-playing {
        background: linear-gradient(90deg, rgba(16, 185, 129, 0.18), #34d399, #22d3ee, rgba(16, 185, 129, 0.18));
        background-size: 220% 100%;
        animation: ambientBorderFlow 3s ease-in-out infinite;
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.55);
      }
      .ambient-btn-runner {
        position: relative;
        overflow: hidden;
        background: linear-gradient(120deg, #0284c7, #10b981, #6366f1, #22d3ee);
        background-size: 260% 260%;
        animation: ambientBorderFlow 2s ease infinite;
        color: #ffffff !important;
        box-shadow: 0 0 22px -4px rgba(34, 211, 238, 0.65);
      }
      .ambient-btn-runner::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 48%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.42), transparent);
        animation: ambientSweep 1.3s ease-in-out infinite;
        pointer-events: none;
      }
      .audio-eq-bar {
        transform-origin: bottom;
        animation: audioEqPulse 0.85s ease-in-out infinite;

          padding: 0 !important;

        function parseRawExams(raw) {
            if (!Array.isArray(raw)) return [];
            const domMap = Array.isArray(window.QUESTION_DOMAIN_MAP) ? window.QUESTION_DOMAIN_MAP : [];
            const fallbackDoms = ['policy_ethics', 'procurement_transplant', 'family_communication', 'brain_death_donor'];
            return raw.map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    origIdx: idx,
                    domain: domMap[idx] || fallbackDoms[idx % fallbackDoms.length],
                    question: parts[0] ? parts[0].replace(/^[0-9]+\.\s*/, '') : '',
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW)];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [parseRawExams(FALLBACK_QUIZ_RAW)];
        }

        function formatStudyTime(seconds) {

            const s = total % 60;
            if (h > 0) return `${h} ชม. ${m} น.`;

            return `${s} วินาที`;

        function maskEmail(email = '') {
            const clean = String(email || '').trim();
            if (!clean || !clean.includes('@')) return clean ? '••••••' : '';
            const [local, domain] = clean.split('@');
            const head = local.slice(0, Math.min(2, local.length));
            return `${head}••••@${domain}`;
        }

        function maskPhone(phone = '') {
            const digits = String(phone || '').replace(/[^0-9]/g, '');

            return `${digits.slice(0, 3)}••••${digits.slice(-3)}`;

                h ^= str.charCodeAt(i);

        function computeDomainDiagnosis(questions, answers) {
            const bucket = {};
            Object.values(CLINICAL_DOMAINS).forEach(d => {
                bucket[d.id] = { ...d, correct: 0, total: 0 };
            });

            (questions || []).forEach((q, idx) => {
                const domId = bucket[q.domain] ? q.domain : 'policy_ethics';
                bucket[domId].total += 1;
                if (answers[idx] === q.answer) bucket[domId].correct += 1;
            });

            const domains = Object.values(bucket).map(d => ({
                ...d,
                percent: d.total > 0 ? Math.round((d.correct / d.total) * 100) : 100
            }));

            const sorted = [...domains].sort((a, b) => a.percent - b.percent);
            const weakDomains = sorted.filter(d => d.percent < MIN_POSTTEST_PERCENT);
            const focusDomains = weakDomains.length > 0 ? weakDomains : sorted.slice(0, 1);
            const recommendedLessonIds = Array.from(

        function pcm16ToWavBlob(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        function loadImageSafe(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });

        /**
         * วาด QR Code จริงลงบน Canvas โดยตรงด้วย qrcode-generator (ป้องกันช่องขาวว่าง 100%)
         */
        async function drawRealQrOnCanvas(ctx, urlText, x, y, size, darkColor = '#1d1d1f') {
            try {
                if (typeof window.qrcode === 'function') {
                    const qr = window.qrcode(0, 'M');
                    qr.addData(urlText);
                    qr.make();
                    const count = qr.getModuleCount();
                    const cell = size / count;
                    ctx.fillStyle = darkColor;
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                ctx.fillRect(x + c * cell, y + r * cell, Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    }
                    return true;
                }
            } catch (_) {}

            const fallbackUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=1&data=${encodeURIComponent(urlText)}`;
            const qrImg = await loadImageSafe(fallbackUrl);
            if (qrImg) {
                ctx.drawImage(qrImg, x, y, size, size);
                return true;
            }
            return false;
        }

            ctx.lineWidth = 2;

                [W - inset, inset, -1, 1],

                [W - inset, H - inset, -1, -1]
            ].forEach(([cx, cy, dx, dy]) => {
                ctx.beginPath();
                ctx.moveTo(cx + dx * cLen, cy);

            await drawRealQrOnCanvas(ctx, verifyUrl, qrX, qrY, qrSize, '#1d1d1f');

        // IndexedDB Cache สำหรับเสียง AI สรุปบทเรียน
        const AUDIO_DB_NAME = 'rjcloud_lesson_audio_cache_v1';
        const AUDIO_STORE_NAME = 'clips';
        let audioDbPromise = null;

        function openAudioCacheDb() {
            if (audioDbPromise) return audioDbPromise;
            audioDbPromise = new Promise((resolve) => {
                if (typeof indexedDB === 'undefined') return resolve(null);
                try {
                    const req = indexedDB.open(AUDIO_DB_NAME, 1);
                    req.onupgradeneeded = () => {
                        const db = req.result;
                        if (!db.objectStoreNames.contains(AUDIO_STORE_NAME)) db.createObjectStore(AUDIO_STORE_NAME);
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                } catch (_) {
                    resolve(null);
                }
            });
            return audioDbPromise;
        }

        async function getCachedAudio(key) {
            const db = await openAudioCacheDb();
            if (!db) return null;
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction(AUDIO_STORE_NAME, 'readonly');
                    const req = tx.objectStore(AUDIO_STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                } catch (_) { resolve(null); }
            });
        }

        async function setCachedAudio(key, blob) {
            if (!blob) return;
            const db = await openAudioCacheDb();
            if (!db) return;
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction(AUDIO_STORE_NAME, 'readwrite');
                    tx.objectStore(AUDIO_STORE_NAME).put(blob, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (_) { resolve(); }
            });
        }

                                    โหลดหน้าใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
            const Comp = LucideIcons[name] || LucideIcons.Sparkles || LucideIcons.Activity;
            if (!Comp) return null;
            return <Comp size={size} className={className} strokeWidth={strokeWidth} />;
        }

        function ThemeToggleButton({ theme, onToggle, compact = false }) {
            const isDark = theme === 'dark';
            return (
                <button
                    type="button"
                    onClick={onToggle}
                    title={isDark ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'}
                    aria-label="สลับโหมดมืดหรือสว่าง"
                    className="spatial-soft px-2.5 sm:px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all active:scale-95 text-primary-adaptive shrink-0"
                >
                    <Icon name={isDark ? 'Sun' : 'Moon'} size={15} className={isDark ? 'text-amber-300' : 'text-indigo-600'} />
                    {!compact && <span className="hidden sm:inline">{isDark ? 'โหมดสว่าง' : 'โหมดมืด'}</span>}
                </button>
            );
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[170] w-[92vw] max-w-md pointer-events-none no-print">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-2xl flex items-center gap-2.5 text-xs sm:text-sm font-bold text-white ${
                        toast.type === 'error'
                            ? 'bg-rose-700/95 border-rose-400/60'
                            : toast.type === 'info'
                                ? 'bg-sky-700/95 border-sky-400/60'
                                : 'bg-emerald-700/95 border-emerald-400/60'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Sparkles' : 'CheckCircle2'} size={17} className="shrink-0 text-white" />
                        <span className="text-white">{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="fixed inset-0 z-[165] bg-slate-950/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
                    <div className="spatial-card w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] space-y-4">
                        <div className="flex items-start gap-3">
                            <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${dialog.danger ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                <Icon name={dialog.danger ? 'AlertTriangle' : 'HelpCircle'} size={22} />
                            </div>
                            <div>
                                <h3 className="font-display font-bold text-lg text-primary-adaptive">{dialog.title}</h3>
                                <p className="text-sm text-secondary-adaptive mt-1 leading-relaxed">{dialog.message}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button type="button" onClick={onClose} className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-display font-semibold text-sm">
                                ยกเลิก
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    const fn = dialog.onConfirm;
                                    onClose();
                                    if (fn) fn();
                                }}
                                className={`touch-target py-3 rounded-2xl font-display font-bold text-sm ${dialog.danger ? 'bg-rose-600 hover:bg-rose-500 text-white' : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950'}`}
                            >
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function PdpaPolicyModal({ open, onClose }) {
            if (!open) return null;
            return (
                <div className="fixed inset-0 z-[165] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 no-print">
                    <div className="spatial-card w-full max-w-lg rounded-[2rem] p-5 sm:p-6 space-y-4 max-h-[85dvh] overflow-y-auto custom-scrollbar">
                        <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2">
                                <Icon name="ShieldCheck" size={20} className="text-accent-adaptive" />
                                <h3 className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive">
                                    นโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA)
                                </h3>
                            </div>
                            <button type="button" onClick={onClose} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive">
                                <Icon name="X" size={18} />
                            </button>
                        </div>
                        <div className="space-y-3 text-xs sm:text-sm text-secondary-adaptive leading-relaxed">
                            <p className="p-3 rounded-xl bg-aurora-500/10 border border-aurora-400/30 text-primary-adaptive font-semibold">
                                ข้อมูลของท่านได้รับการคุ้มครองข้อมูลส่วนบุคคล PDPA ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562
                            </p>
                            <div>
                                <p className="font-bold text-primary-adaptive">1. ข้อมูลที่จัดเก็บ (Data Minimization)</p>
                                <p>ระบบจัดเก็บเฉพาะข้อมูลที่จำเป็นต่อการอบรม ได้แก่ ชื่อ–สกุล เลขที่ใบอนุญาตประกอบวิชาชีพ ตำแหน่ง หน่วยงาน อีเมล เบอร์โทรศัพท์ และประวัติการเรียน โดย <b>ไม่มีการเก็บเลขบัตรประชาชน 13 หลัก</b></p>
                            </div>
                            <div>
                                <p className="font-bold text-primary-adaptive">2. วัตถุประสงค์การใช้ข้อมูล</p>
                                <p>ใช้สำหรับยืนยันตัวตนด้วยรหัส OTP บันทึกเวลาเรียน ออกประกาศนียบัตรพร้อม QR Code ยืนยันคุณวุฒิ และจัดทำเอกสารยื่นขอหน่วยคะแนนการศึกษาต่อเนื่อง (CNEU) ต่อสภาการพยาบาล (ศกพ.) เท่านั้น</p>
                            </div>
                            <div>
                                <p className="font-bold text-primary-adaptive">3. การปกปิดข้อมูลและสถิติผู้บริหาร</p>
                                <p>หน้าตรวจสอบ QR Code จะปกปิดเลขใบอนุญาตบางส่วนและไม่แสดงอีเมล/เบอร์โทรศัพท์ ส่วนแดชบอร์ดผู้บริหารใช้เฉพาะตัวเลขสถิติรวมแบบไม่ระบุตัวตน (Zero-PII) และไม่มีการเปิดเผยข้อมูลส่วนตัว</p>
                            </div>
                            <div>
                                <p className="font-bold text-primary-adaptive">4. สิทธิของเจ้าของข้อมูล</p>
                                <p>ท่านสามารถขอตรวจสอบ แก้ไข หรือลบข้อมูลส่วนบุคคลได้ตลอดเวลาผ่านอีเมล <span className="font-mono text-prism-adaptive">{CONFIG.contactEmail}</span></p>
                            </div>
                        </div>
                        <button type="button" onClick={onClose} className="touch-target w-full py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm">
                            รับทราบและปิดหน้าต่าง
                        </button>
                    </div>
                </div>
            );
        }

        function QrCodeCanvas({ value, size = 112 }) {
            const ref = useRef(null);
            useEffect(() => {
                const canvas = ref.current;
                if (!canvas || !value) return;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                drawRealQrOnCanvas(ctx, value, 4, 4, size - 8, '#0f172a');
            }, [value, size]);
            return <canvas ref={ref} width={size} height={size} className="block rounded-lg border border-slate-300 bg-white" />;
        }

        // ============================================================================
        // 4. AI STUDY COMPANION (CHEAT SHEET + SENTENCE TTS + MICRO-CHECK + Q&A)
        // ============================================================================
        function AiStudyCompanion({ lesson, user, appsScriptUrl, onToast }) {
            const roleProfile = useMemo(() => resolveRoleProfile(user), [user]);
            const guide = (window.LESSON_AI_GUIDES && window.LESSON_AI_GUIDES[lesson?.id]) || {
                keyPoints: [
                    `ประเด็นสำคัญของบทที่ ${lesson?.id || 1}: ${lesson?.title || ''}`,
                    'ทบทวนเกณฑ์มาตรฐานทางคลินิก การประสานงานศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC) และจริยธรรมวิชาชีพ',
                    'เชื่อมโยงความรู้ไปประยุกต์ใช้จริงในห้องฝึกสื่อสาร 3 มิติ (AI Skill Lab)'
                ],
                microCheck: {
                    q: `หัวใจสำคัญในการนำความรู้บทที่ ${lesson?.id || 1} ไปใช้คือข้อใด?`,
                    options: ['ยึดมาตรฐานคลินิก ความปลอดภัย และเคารพศักดิ์ศรีผู้ป่วย-ครอบครัว', 'ข้ามขั้นตอนการสื่อสารเพื่อความรวดเร็ว'],
                    answer: 0,
                    explain: 'ถูกต้องค่ะ มาตรฐานวิชาชีพและการเคารพครอบครัวคือหัวใจของการรับบริจาคอวัยวะ'
                }
            };

            const [pickedAns, setPickedAns] = useState(null);
            const [audioStatus, setAudioStatus] = useState('idle'); // idle | loading | playing
            const [audioProgress, setAudioProgress] = useState('');
            const [qaInput, setQaInput] = useState('');
            const [qaHistory, setQaHistory] = useState([]);
            const [isAsking, setIsAsking] = useState(false);

            const audioElRef = useRef(null);
            const audioUrlRef = useRef(null);
            const ttsSessionRef = useRef(0);
            const abortSetRef = useRef(new Set());

            const stopAudio = useCallback(() => {
                ttsSessionRef.current += 1;
                abortSetRef.current.forEach(c => { try { c.abort(); } catch (_) {} });
                abortSetRef.current.clear();
                if (audioElRef.current) { try { audioElRef.current.pause(); } catch (_) {} audioElRef.current = null; }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setAudioStatus('idle');
                setAudioProgress('');
            }, []);

            useEffect(() => {
                setPickedAns(null);
                setQaHistory([]);
                stopAudio();
                return () => stopAudio();
            }, [lesson?.id, stopAudio]);

            const fetchTtsSentence = async (text, cacheKey) => {
                const cached = await getCachedAudio(cacheKey);
                if (cached) return cached;
                if (!appsScriptUrl) return null;
                const ctrl = new AbortController();
                abortSetRef.current.add(ctrl);
                const timer = setTimeout(() => ctrl.abort(), 20000);
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'callGeminiTTS', text, voiceName: 'Aoede' }),
                        signal: ctrl.signal
                    }).then(r => r.json());
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                        const blob = pcm16ToWavBlob(res.inlineData.data, rate);
                        await setCachedAudio(cacheKey, blob);
                        return blob;
                    }
                } catch (_) {
                } finally {
                    clearTimeout(timer);
                    abortSetRef.current.delete(ctrl);
                }
                return null;
            };

            const handleToggleAudioBrief = async () => {
                if (audioStatus !== 'idle') {
                    stopAudio();
                    return;
                }
                const sentences = [
                    `สรุปสำคัญบทที่ ${lesson?.id || 1} เรื่อง ${lesson?.title || ''}`,
                    ...(guide.keyPoints || [])
                ].map(s => String(s || '').trim()).filter(Boolean);

                const sid = ++ttsSessionRef.current;
                let browserOnly = !appsScriptUrl;

                const wrap = (p) => Promise.resolve(p);
                let nextPromise = browserOnly
                    ? null
                    : wrap(fetchTtsSentence(sentences[0], `lesson_${lesson?.id}_0_${sentences[0]}`));

                for (let i = 0; i < sentences.length; i++) {
                    if (ttsSessionRef.current !== sid) return;
                    setAudioStatus('loading');
                    setAudioProgress(`กำลังเตรียมเสียง (${i + 1}/${sentences.length})`);

                    let blob = null;
                    if (!browserOnly && nextPromise) {
                        blob = await nextPromise;
                        if (ttsSessionRef.current !== sid) return;
                        if (!blob && i === 0) {
                            browserOnly = true;
                        } else if (i + 1 < sentences.length) {
                            nextPromise = wrap(fetchTtsSentence(sentences[i + 1], `lesson_${lesson?.id}_${i + 1}_${sentences[i + 1]}`));
                        }
                    }

                    if (ttsSessionRef.current !== sid) return;
                    setAudioStatus('playing');
                    setAudioProgress(`กำลังอ่านประเด็นที่ ${i + 1}/${sentences.length}`);

                    if (blob) {
                        await new Promise((resolve) => {
                            if (ttsSessionRef.current !== sid) return resolve();
                            if (audioUrlRef.current) URL.revokeObjectURL(audioUrlRef.current);
                            const url = URL.createObjectURL(blob);
                            audioUrlRef.current = url;
                            const audio = new Audio(url);
                            audioElRef.current = audio;
                            audio.onended = resolve;
                            audio.onerror = resolve;
                            audio.play().catch(resolve);
                        });
                    } else if ('speechSynthesis' in window) {
                        await new Promise((resolve) => {
                            if (ttsSessionRef.current !== sid) return resolve();
                            try {
                                window.speechSynthesis.cancel();
                                const utter = new SpeechSynthesisUtterance(sentences[i]);
                                utter.lang = 'th-TH';
                                utter.rate = 1.0;
                                utter.onend = resolve;
                                utter.onerror = resolve;
                                window.speechSynthesis.speak(utter);
                            } catch (_) { resolve(); }
                        });
                    }
                }
                if (ttsSessionRef.current === sid) {
                    setAudioStatus('idle');
                    setAudioProgress('');
                }
            };

            const handleAskAi = async (e) => {
                e.preventDefault();
                const q = qaInput.trim();
                if (!q || isAsking) return;
                setQaInput('');
                setQaHistory(prev => [...prev, { role: 'user', text: q }]);
                setIsAsking(true);

                const sysPrompt = `คุณคือ AI Study Companion ผู้ช่วยเรียนทางการแพทย์ประจำระบบ rjcloud.organ
บทเรียนปัจจุบัน: บทที่ ${lesson?.id} — ${lesson?.title}
โปรไฟล์ผู้เรียน: ${roleProfile.aiPromptAddon}
ฐานความรู้วิชาชีพ:
${window.CLINICAL_KNOWLEDGE_BASE || ''}
แนวทางตอบ: ตอบเป็นภาษาไทยสั้นกระชับ 3–5 บรรทัด อ้างอิงหลักการแพทย์และ ODC ที่ถูกต้อง ย้ำว่าเป็นสื่อช่วยทบทวนการเรียนรู้เท่านั้น`;

                let answer = '';
                if (appsScriptUrl) {
                    try {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'callGemini', prompt: q, systemInstruction: sysPrompt })
                        }).then(r => r.json());
                        if (res?.status === 'success' && res.text) answer = res.text;
                    } catch (_) {}
                }
                if (!answer) {
                    answer = `สรุปหลักการที่เกี่ยวข้องกับบทที่ ${lesson?.id}: ${guide.keyPoints.join(' • ')} (สื่อช่วยทบทวนความรู้เบื้องต้น กรุณาอ้างอิงแนวทางปฏิบัติของหน่วยงานและสภากาชาดไทยร่วมด้วยค่ะ)`;
                }
                setQaHistory(prev => [...prev, { role: 'ai', text: answer }]);
                setIsAsking(false);
            };

            return (
                <div className={`spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-4 overflow-hidden transition-all ${
                    audioStatus === 'loading' ? 'ambient-loading-card' : audioStatus === 'playing' ? 'ambient-playing-card' : ''
                }`}>
                    {audioStatus !== 'idle' && (
                        <div className={`ambient-ribbon ${audioStatus === 'loading' ? 'ambient-ribbon-loading' : 'ambient-ribbon-playing'}`} />
                    )}

                    <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-aurora-500/15 text-accent-adaptive font-mono text-[10px] font-bold">
                                <Icon name="Sparkles" size={11} /> AI STUDY COMPANION • {roleProfile.badgeTH}
                            </span>
                            <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive mt-1">
                                สรุป 1 นาที &amp; ถาม-ตอบประจำบทที่ {lesson?.id}
                            </h3>
                        </div>

                        <button
                            type="button"
                            onClick={handleToggleAudioBrief}
                            className={`touch-target px-3.5 py-2 rounded-xl text-xs font-display font-bold flex items-center gap-1.5 transition-all ${
                                audioStatus === 'loading'
                                    ? 'ambient-btn-runner'
                                    : audioStatus === 'playing'
                                        ? 'bg-rose-600 text-white shadow-md'
                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold shadow-md'
                            }`}
                        >
                            {audioStatus === 'playing' ? (
                                <span className="flex items-end gap-0.5 h-3.5">
                                    {[0.05, 0.2, 0.12].map((d, i) => (
                                        <span key={i} className="w-0.5 h-3.5 bg-white rounded-full audio-eq-bar" style={{ animationDelay: `${d}s` }} />
                                    ))}
                                </span>
                            ) : (
                                <Icon name={audioStatus === 'loading' ? 'Loader2' : 'Volume2'} size={15} className={audioStatus === 'loading' ? 'animate-spin' : ''} />
                            )}
                            <span>{audioStatus === 'idle' ? 'ฟังสรุปเสียง AI' : audioStatus === 'loading' ? audioProgress : 'หยุดเสียง'}</span>
                        </button>
                    </div>

                    {/* 1-Minute Clinical Cheat Sheet */}
                    <ul className="space-y-1.5 text-xs sm:text-sm text-secondary-adaptive bg-aurora-500/5 border border-aurora-400/20 rounded-2xl p-3.5">
                        {(guide.keyPoints || []).map((pt, idx) => (
                            <li key={idx} className="flex items-start gap-2 leading-relaxed">
                                <span className="text-accent-adaptive font-bold shrink-0">•</span>
                                <span>{pt}</span>
                            </li>
                        ))}
                    </ul>

                    {/* Micro-Check Quiz */}
                    {guide.microCheck && (
                        <div className="spatial-soft rounded-2xl p-3.5 space-y-2.5">
                            <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">MICRO-CHECK ท้ายบท (กันง่วง)</p>
                            <p className="text-xs sm:text-sm font-bold text-primary-adaptive">{guide.microCheck.q}</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {guide.microCheck.options.map((opt, idx) => {
                                    const picked = pickedAns === idx;
                                    const isRight = idx === guide.microCheck.answer;
                                    return (
                                        <button
                                            key={idx}
                                            type="button"
                                            onClick={() => setPickedAns(idx)}
                                            className={`text-left px-3 py-2.5 rounded-xl border text-xs font-semibold transition-all ${
                                                pickedAns === null
                                                    ? 'spatial-soft text-primary-adaptive hover:border-aurora-400/50'
                                                    : isRight
                                                        ? 'bg-emerald-500/20 border-emerald-400 text-accent-adaptive'
                                                        : picked
                                                            ? 'bg-rose-500/20 border-rose-400 text-rose-400'
                                                            : 'spatial-soft opacity-60'
                                            }`}
                                        >
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>
                            {pickedAns !== null && (
                                <p className={`text-xs font-semibold ${pickedAns === guide.microCheck.answer ? 'text-accent-adaptive' : 'text-amber-400'}`}>
                                    {guide.microCheck.explain}
                                </p>
                            )}
                        </div>
                    )}

                    {/* Contextual Q&A with PDPA Patient-Privacy Guardrail */}
                    <div className="space-y-2.5">
                        {qaHistory.length > 0 && (
                            <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
                                {qaHistory.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[90%] px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm whitespace-pre-line ${
                                            m.role === 'user'
                                                ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-bold'
                                                : 'spatial-soft text-primary-adaptive'
                                        }`}>
                                            {m.text}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        <form onSubmit={handleAskAi} className="flex items-center gap-2">
                            <input
                                type="text"
                                value={qaInput}
                                onChange={e => setQaInput(e.target.value)}
                                disabled={isAsking}
                                placeholder="ถามข้อสงสัยทางคลินิกประจำบทนี้ (ห้ามระบุชื่อ/HN ผู้ป่วยจริง)..."
                                className="touch-target spatial-input flex-1 px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm"
                            />
                            <button
                                type="submit"
                                disabled={!qaInput.trim() || isAsking}
                                className="touch-target px-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 font-display font-extrabold text-xs shrink-0"
                            >
                                {isAsking ? '...' : 'ถาม AI'}
                            </button>
                        </form>
                        <p className="text-[11px] text-muted-adaptive flex items-center gap-1">
                            <Icon name="ShieldCheck" size={12} className="text-accent-adaptive shrink-0" />
                            <span>PDPA Safety: กรุณาไม่ระบุชื่อ–สกุล เลข HN หรือข้อมูลที่ระบุตัวตนผู้ป่วยจริงในการสนทนากับ AI</span>
                        </p>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 5. CLINICAL CASE SIMULATOR, SPACED FLASHCARDS & PRE-APPROACH WARM-UP
        // ============================================================================
        function ClinicalCaseSimulator() {
            const [caseIdx, setCaseIdx] = useState(0);
            const [stepIdx, setStepIdx] = useState(0);
            const [pickedOpt, setPickedOpt] = useState(null);

            const curCase = CLINICAL_CASE_SIMULATIONS[caseIdx] || CLINICAL_CASE_SIMULATIONS[0];
            const curStep = curCase.steps[stepIdx] || curCase.steps[0];
            const activeVitals = pickedOpt?.nextVitals || curStep.vitals || {};

            const handlePickCase = (idx) => {
                setCaseIdx(idx);
                setStepIdx(0);
                setPickedOpt(null);
            };

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap gap-2">
                        {CLINICAL_CASE_SIMULATIONS.map((c, idx) => (
                            <button
                                key={c.id}
                                type="button"
                                onClick={() => handlePickCase(idx)}
                                className={`px-3.5 py-2 rounded-2xl text-xs font-bold transition-all ${
                                    idx === caseIdx
                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold shadow-md'
                                        : 'spatial-soft text-secondary-adaptive'
                                }`}
                            >
                                {c.title}
                            </button>
                        ))}
                    </div>

                    <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                        <div>
                            <span className="px-2.5 py-0.5 rounded-full bg-prism-500/20 text-prism-adaptive font-mono text-[10px] font-bold">
                                {curCase.badge} • STEP {stepIdx + 1}/{curCase.steps.length}
                            </span>
                            <h2 className="font-display text-lg sm:text-xl font-extrabold text-primary-adaptive mt-1">{curCase.title}</h2>
                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-0.5">{curCase.patientSummary}</p>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                            {Object.entries(activeVitals).map(([k, v]) => (
                                <div key={k} className="spatial-soft p-3 rounded-2xl text-center">
                                    <span className="font-mono text-[10px] uppercase text-muted-adaptive block">{k}</span>
                                    <span className="font-mono text-sm sm:text-base font-extrabold text-accent-adaptive mt-0.5 block">{v}</span>
                                </div>
                            ))}
                        </div>

                        <div className="p-4 rounded-2xl spatial-soft text-sm font-bold text-primary-adaptive leading-relaxed">
                            {curStep.situation}
                        </div>

                        <div className="space-y-2.5">
                            {curStep.options.map((opt, i) => {
                                const isSel = pickedOpt === opt;
                                return (
                                    <button
                                        key={i}
                                        type="button"
                                        onClick={() => setPickedOpt(opt)}
                                        className={`w-full text-left p-4 rounded-2xl border text-xs sm:text-sm font-semibold transition-all ${
                                            isSel
                                                ? opt.correct
                                                    ? 'bg-emerald-500/20 border-emerald-400 text-accent-adaptive'
                                                    : 'bg-rose-500/20 border-rose-400 text-rose-400'
                                                : 'spatial-soft text-primary-adaptive hover:border-prism-400/50'
                                        }`}
                                    >
                                        {opt.label}
                                    </button>
                                );
                            })}
                        </div>

                        {pickedOpt && (
                            <div className={`p-4 rounded-2xl border space-y-3 ${pickedOpt.correct ? 'bg-emerald-500/15 border-emerald-400/40' : 'bg-amber-500/15 border-amber-400/40'}`}>
                                <p className="text-xs sm:text-sm font-bold text-primary-adaptive leading-relaxed">{pickedOpt.outcome}</p>
                                {stepIdx + 1 < curCase.steps.length ? (
                                    <button
                                        type="button"
                                        onClick={() => { setStepIdx(s => s + 1); setPickedOpt(null); }}
                                        className="touch-target px-5 py-2.5 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs"
                                    >
                                        ไปจังหวะถัดไป →
                                    </button>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={() => { setStepIdx(0); setPickedOpt(null); }}
                                        className="touch-target spatial-soft px-4 py-2.5 rounded-xl text-primary-adaptive font-bold text-xs"
                                    >
                                        ทบทวนเคสนี้อีกครั้ง
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SpacedFlashcardsDeck({ aiRoadmap }) {
            const orderedCards = useMemo(() => {
                const weakIds = new Set((aiRoadmap?.weakDomains || []).map(d => d.id));
                return [...SPACED_FLASHCARDS].sort((a, b) => (weakIds.has(b.domain) ? 1 : 0) - (weakIds.has(a.domain) ? 1 : 0));
            }, [aiRoadmap]);

            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [mastered, setMastered] = useState({});

            const card = orderedCards[idx] || orderedCards[0];
            const dom = CLINICAL_DOMAINS[card?.domain] || CLINICAL_DOMAINS.policy_ethics;

            return (
                <div className="max-w-2xl mx-auto space-y-4">
                    <div className="flex items-center justify-between text-xs">
                        <span className="font-mono font-bold text-prism-adaptive">
                            SMART FLASHCARDS • {idx + 1} / {orderedCards.length}
                        </span>
                        <span className="font-bold text-accent-adaptive">
                            จำแม่นแล้ว {Object.values(mastered).filter(Boolean).length} การ์ด
                        </span>
                    </div>

                    <button
                        type="button"
                        onClick={() => setFlipped(f => !f)}
                        className="w-full min-h-[260px] spatial-card rounded-[2rem] p-6 sm:p-8 text-center flex flex-col items-center justify-center gap-4 border-prism-400/35 transition-all active:scale-[0.99]"
                    >
                        <span className="px-3 py-1 rounded-full bg-white/10 font-mono text-[10px] font-bold" style={{ color: dom.color }}>
                            {dom.shortName} • {flipped ? 'เฉลย & หลักจำแม่น' : 'แตะที่การ์ดเพื่อพลิกดูเฉลย'}
                        </span>
                        <p className={`font-display font-bold leading-relaxed whitespace-pre-line ${flipped ? 'text-sm sm:text-base text-accent-adaptive text-left max-w-lg' : 'text-lg sm:text-xl text-primary-adaptive'}`}>
                            {flipped ? card.back : card.front}
                        </p>
                    </button>

                    <div className="grid grid-cols-3 gap-2.5">
                        <button
                            type="button"
                            onClick={() => { setFlipped(false); setIdx(i => (i - 1 + orderedCards.length) % orderedCards.length); }}
                            className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-bold text-xs"
                        >
                            ← การ์ดก่อนหน้า
                        </button>
                        <button
                            type="button"
                            onClick={() => {
                                setMastered(p => ({ ...p, [card.id]: true }));
                                setFlipped(false);
                                setIdx(i => (i + 1) % orderedCards.length);
                            }}
                            className="touch-target py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs"
                        >
                            จำได้แม่น ✓
                        </button>
                        <button
                            type="button"
                            onClick={() => { setFlipped(false); setIdx(i => (i + 1) % orderedCards.length); }}
                            className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-bold text-xs"
                        >
                            การ์ดถัดไป →
                        </button>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 6. QUIZ ENGINE (PRE-TEST + POST-TEST + AI REMEDIATION COACH)
        // ============================================================================
        function QuizEngine({ mode, questions, onComplete, onBack }) {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(null);

            const total = questions.length || 1;
            const answeredCount = Object.keys(answers).length;

            const handleSubmit = () => {
                let correct = 0;
                questions.forEach((q, idx) => {
                    if (answers[idx] === q.answer) correct++;
                });
                const pct = Math.round((correct / total) * 100);
                const diagnosis = computeDomainDiagnosis(questions, answers);
                const passed = mode === 'pretest' ? true : pct >= MIN_POSTTEST_PERCENT;
                const result = { correct, total, pct, passed, scoreText: `${correct}/${total}`, diagnosis };
                setSubmitted(result);
                if (onComplete) onComplete(result);
            };

            if (submitted) {
                return (
                    <div className="max-w-3xl mx-auto space-y-5">
                        <div className="spatial-card rounded-[2rem] p-6 sm:p-8 text-center space-y-4">
                            <div className={`w-16 h-16 rounded-2xl mx-auto flex items-center justify-center ${
                                submitted.passed ? 'bg-aurora-500/20 text-accent-adaptive' : 'bg-amber-500/20 text-amber-400'
                            }`}>
                                <Icon name={submitted.passed ? 'CheckCircle2' : 'Sparkles'} size={34} />
                            </div>
                            <span className="font-mono text-xs font-bold text-prism-adaptive uppercase">
                                {mode === 'pretest' ? 'PRE-TEST + AI DIAGNOSTIC ROADMAP' : 'POST-TEST EVALUATION'}
                            </span>
                            <h2 className="font-display text-2xl sm:text-3xl font-extrabold text-primary-adaptive">
                                คะแนนของคุณ: {submitted.scoreText} ({submitted.pct}%)
                            </h2>
                            <p className="text-sm text-secondary-adaptive max-w-xl mx-auto leading-relaxed">
                                {mode === 'pretest'
                                    ? submitted.diagnosis.summaryText
                                    : submitted.passed
                                        ? `ยินดีด้วยค่ะ! คุณผ่านเกณฑ์มาตรฐาน ≥ ${MIN_POSTTEST_PERCENT}% แล้ว สามารถไปยืนยันชื่อและออกประกาศนียบัตรพร้อมหนังสือรับรอง CNEU ได้เลยค่ะ`
                                        : `เกือบผ่านแล้วค่ะ (เกณฑ์ ≥ ${MIN_POSTTEST_PERCENT}%) ลองทบทวนจุดที่ AI วิเคราะห์ด้านล่างโดยไม่ต้องกังวล แล้วกดสอบใหม่อีกครั้งนะคะ`}
                            </p>

                            {/* 4-Domain Diagnostic Breakdown */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left pt-2">
                                {submitted.diagnosis.domains.map(d => (
                                    <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1.5">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span className="text-primary-adaptive">{d.shortName}</span>
                                            <span className="font-mono" style={{ color: d.color }}>{d.percent}%</span>
                                        </div>
                                        <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                            <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                        </div>
                                        {d.percent < MIN_POSTTEST_PERCENT && (
                                            <p className="text-[11px] text-secondary-adaptive leading-relaxed pt-0.5">{d.remediationGuide}</p>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="flex flex-col sm:flex-row justify-center gap-2.5 pt-3">
                                {!submitted.passed && mode === 'posttest' && (
                                    <button
                                        type="button"
                                        onClick={() => { setAnswers({}); setSubmitted(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className="touch-target px-6 py-3 rounded-2xl bg-amber-500 text-void-950 font-display font-extrabold text-sm"
                                    >
                                        ทำ Post-test ใหม่อีกครั้ง
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={onBack}
                                    className="touch-target px-6 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm"
                                >
                                    {mode === 'pretest' ? 'เข้าสู่ห้องเรียน 20 บทเลย →' : submitted.passed ? 'ไปยืนยันรับประกาศนียบัตร →' : 'กลับไปทบทวนบทเรียน'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto space-y-4">
                    <div className="spatial-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-2 sticky top-16 z-20">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                {mode === 'pretest' ? 'STEP 01 • PRE-TEST' : `STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                            </span>
                            <h2 className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive">
                                ตอบแล้ว {answeredCount} / {total} ข้อ
                            </h2>
                        </div>
                        <button type="button" onClick={onBack} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-secondary-adaptive">
                            ย้อนกลับ
                        </button>
                    </div>

                    <div className="space-y-3.5">
                        {questions.map((q, idx) => (
                            <div key={q.id || idx} className="spatial-card rounded-2xl p-4 sm:p-5 space-y-3">
                                <p className="font-display font-bold text-sm sm:text-base text-primary-adaptive leading-snug">
                                    <span className="font-mono text-accent-adaptive mr-1.5">{idx + 1}.</span>
                                    {q.question}
                                </p>
                                <div className="space-y-2">
                                    {(q.options || []).map((opt, oIdx) => {
                                        const selected = answers[idx] === oIdx;
                                        return (
                                            <button
                                                key={oIdx}
                                                type="button"
                                                onClick={() => setAnswers(p => ({ ...p, [idx]: oIdx }))}
                                                className={`touch-target w-full text-left px-4 py-2.5 rounded-xl border text-xs sm:text-sm font-medium transition-all flex items-center gap-2.5 ${
                                                    selected
                                                        ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold'
                                                        : 'spatial-soft text-secondary-adaptive hover:border-prism-400/50'
                                                }`}
                                            >
                                                <span className={`w-5 h-5 rounded-full border flex items-center justify-center text-[10px] font-mono shrink-0 ${
                                                    selected ? 'bg-aurora-400 border-aurora-400 text-void-950 font-extrabold' : 'border-slate-500'
                                                }`}>
                                                    {selected ? '✓' : oIdx + 1}
                                                </span>
                                                <span>{opt}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>

                    <button
                        type="button"
                        disabled={answeredCount < total}
                        onClick={handleSubmit}
                        className="touch-target w-full py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 font-display font-extrabold text-base shadow-lg"
                    >
                        {answeredCount < total ? `กรุณาตอบให้ครบทุกข้อ (เหลืออีก ${total - answeredCount} ข้อ)` : 'ส่งคำตอบและวิเคราะห์ผลทันที'}
                    </button>
                </div>
            );
        }

        // ============================================================================
        // 7. INDIVIDUAL CNEU VERIFICATION LETTER (A4 PRINTABLE WITH REAL QR CODE)
        // ============================================================================
        function IndividualCneuLetter({ user, cneuConfig, verifyUrl, onPrint }) {
            const postPct = parsePosttestPercent(user);
            return (
                <div className="cneu-print-container w-full flex flex-col items-center gap-4">
                    <div className="no-print w-full max-w-[794px] flex flex-wrap items-center justify-between gap-2">
                        <span className="text-xs text-secondary-adaptive">
                            เอกสารรับรองรายบุคคลสำหรับยื่นขอหน่วยคะแนน CNEU ต่อสภาการพยาบาล (ศกพ.)
                        </span>
                        <button
                            type="button"
                            onClick={onPrint}
                            className="touch-target px-5 py-2.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs flex items-center gap-1.5 shadow-md"
                        >
                            <Icon name="Printer" size={16} /> พิมพ์ / บันทึกหนังสือรับรอง CNEU (PDF)
                        </button>
                    </div>

                    <article className="cneu-letter-sheet rounded-2xl p-6 sm:p-10 space-y-5">
                        <div className="border-b-2 border-slate-800 pb-4 flex items-start justify-between gap-4">
                            <div className="space-y-1">
                                <p className="text-[11px] font-bold text-emerald-800 uppercase tracking-wider">
                                    INDIVIDUAL CNEU COMPLETION CERTIFICATE • สภาการพยาบาล (ศกพ.)
                                </p>
                                <h2 className="font-display text-xl font-extrabold text-slate-900">
                                    หนังสือรับรองการสำเร็จการอบรมและหน่วยคะแนน CNEU รายบุคคล
                                </h2>
                                <p className="text-sm font-semibold text-slate-700">{cneuConfig.orgName}</p>
                            </div>
                            <div className="text-right shrink-0 border border-slate-300 rounded-xl px-3.5 py-2 bg-slate-50">
                                <p className="text-[10px] font-bold text-slate-500">รหัสกิจกรรม CNEU</p>
                                <p className="font-mono text-base font-extrabold text-emerald-800">{cneuConfig.activityCode}</p>
                                <p className="text-xs font-bold text-slate-800">{cneuConfig.cneuCredits} หน่วยคะแนน</p>
                            </div>
                        </div>

                        <p className="text-sm text-slate-800 leading-relaxed">
                            หนังสือฉบับนี้ให้ไว้เพื่อรับรองว่า <b>{user.name}</b> เลขที่ใบอนุญาตประกอบวิชาชีพ <b className="font-mono">{user.license || user.id}</b> ปฏิบัติงานที่ <b>{user.hospital || '-'}</b> ได้เข้าร่วมและผ่านเกณฑ์การประเมินหลักสูตร <b>{cneuConfig.courseName}</b> ({cneuConfig.batchLabel}) ครบถ้วนตามมาตรฐานที่กำหนด ดังหลักฐานต่อไปนี้:
                        </p>

                        <table className="cneu-evidence-table">
                            <tbody>
                                <tr>
                                    <th style={{ width: '38%' }}>รหัสประกาศนียบัตรอ้างอิง</th>
                                    <td className="font-mono font-bold text-emerald-800">{user.certificateCode || '-'}</td>
                                </tr>
                                <tr>
                                    <th>การยืนยันตัวตน &amp; เวลาเรียนสะสม</th>
                                    <td>ยืนยันตัวตน OTP เรียบร้อย • สะสมเวลาเรียน {user.progress || 100}% ({formatStudyTime(user.studySeconds || 0)})</td>
                                </tr>
                                <tr>
                                    <th>ผลการฝึกปฏิบัติการสื่อสาร (AI Skill Lab 3D)</th>
                                    <td>ผ่านเกณฑ์ {typeof user.skillLabBestScore === 'number' ? `• Empathy Index ${user.skillLabBestScore}/100` : ''}</td>
                                </tr>
                                <tr>
                                    <th>ผลการทดสอบหลังเรียน (Post-test ≥ 80%)</th>
                                    <td className="font-mono font-bold">{user.posttest || 'ผ่านเกณฑ์'} ({postPct}%)</td>
                                </tr>
                                <tr>
                                    <th>หน่วยคะแนน CNEU ที่ได้รับการรับรอง</th>
                                    <td className="font-mono font-bold text-emerald-800">{cneuConfig.cneuCredits} หน่วยคะแนน (รหัส {cneuConfig.activityCode})</td>
                                </tr>
                                <tr>
                                    <th>วันที่ออกหนังสือรับรอง</th>
                                    <td>{formatThaiDate(user.certificateIssuedAt)}</td>
                                </tr>
                            </tbody>
                        </table>

                        <div className="pt-4 flex flex-col sm:flex-row items-center justify-between gap-6">
                            <div className="flex items-center gap-3.5">
                                <QrCodeCanvas value={verifyUrl} size={108} />
                                <div className="text-xs text-slate-600 space-y-0.5">
                                    <p className="font-bold text-slate-900">สแกน QR Code เพื่อตรวจสอบสด</p>
                                    <p className="font-mono text-[11px]">{user.certificateCode || 'RJC-2027-DEMO01'}</p>
                                    <p>ตรวจสอบกับ Cloud Firestore ได้ตลอด 24 ชม.</p>
                                </div>
                            </div>

                            <div className="text-center text-xs sm:text-sm space-y-1">
                                <p className="text-slate-600">ลงชื่อ ................................................................</p>
                                <p className="font-bold text-slate-900">( {cneuConfig.approverName} )</p>
                                <p className="text-slate-600 text-xs">{cneuConfig.approverPosition}</p>
                            </div>
                        </div>
                    </article>
                </div>
            );
        }

        // ============================================================================
        // 8. MAIN APPLICATION (LANDING -> AUTH 3-STEP PDPA -> 5-STEP DASHBOARD)
        // ============================================================================
        function App() {
            const adminPreviewParam = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);
            const isAdminPreview = Boolean(adminPreviewParam);

            // Adaptive Theme
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f4f9fb');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => {
                setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            // Cloud & Dynamic Config States
            const [cloudReady, setCloudReady] = useState(!isCloudConfigured);
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [lessons, setLessons] = useState(() => (
                Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0
                    ? window.INITIAL_LESSONS
                    : FALLBACK_LESSONS
            ));
            const [questions, setQuestions] = useState(() => parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW));
            const [certTemplate, setCertTemplate] = useState(DEFAULT_CERT_TEMPLATE);
            const [cneuConfig, setCneuConfig] = useState(DEFAULT_CNEU_CONFIG);
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 8,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });

            // User & Screen States
            const [user, setUser] = useState(() => {
                if (isAdminPreview) {
                    return {
                        id: 'admin_preview_2027',
                        license: '4511128901',
                        name: 'พว.กัญญารัตน์ วัฒนากูล (Admin View)',
                        nameEN: 'Kanyarat Wattanakul, RN',
                        email: 'admin.preview@rajavithi.go.th',
                        phone: '0812345678',
                        position: 'พยาบาลวิชาชีพชำนาญการ',
                        workContext: 'ทีมรับบริจาค/ปลูกถ่ายอวัยวะ (TC)',
                        department: 'กรมการแพทย์',
                        hospital: 'รพ.ราชวิถี',
                        province: 'กรุงเทพมหานคร',
                        userType: 'เรียนใหม่',
                        status: 'ผ่าน',
                        pretest: '30/40',
                        posttest: '38/40',
                        progress: 100,
                        studySeconds: 28800,
                        skillLabPassed: true,
                        skillLabBestScore: 94,
                        certificateCode: 'RJC-2027-DEMO01',
                        certificateClaimed: true,
                        certificateIssuedAt: new Date().toISOString()
                    };
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (isAdminPreview) {
                    if (adminPreviewParam === 'landing') return 'landing';
                    if (['auth1', 'auth2', 'auth3'].includes(adminPreviewParam)) return 'auth';
                    if (adminPreviewParam === 'pretest') return 'pretest';
                    if (adminPreviewParam === 'posttest') return 'posttest';
                    if (adminPreviewParam === 'cert_confirm') return 'cert_confirm';
                    if (adminPreviewParam === 'certificate') return 'certificate';
                    return 'dashboard';
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) {
                        const hasPre = Boolean(saved.user.pretest && saved.user.pretest !== '-');
                        return hasPre ? 'dashboard' : 'pretest';
                    }
                } catch (_) {}
                return 'landing';
            });

            // 5 Clean Dashboard Tabs (Leaderboard REMOVED per PDPA requirement)
            const [activeTab, setActiveTab] = useState(() => {
                if (adminPreviewParam === 'live') return 'live';
                if (adminPreviewParam === 'profile') return 'profile';
                return 'lessons';
            });

            const [currentLessonId, setCurrentLessonId] = useState(() => Number(user?.lastVideoId || 1));
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));

            // Auth Wizard 3-Step + Pre-OTP PDPA Masking States
            const [authStep, setAuthStep] = useState(() => (
                adminPreviewParam === 'auth2' ? 2 : adminPreviewParam === 'auth3' ? 3 : 1
            ));
            const [isCheckingLic, setIsCheckingLic] = useState(false);
            const [existingUserPreOtp, setExistingUserPreOtp] = useState(null);
            const [editContactOverride, setEditContactOverride] = useState(false);
            const [pdpaAccepted, setPdpaAccepted] = useState(false);
            const [pdpaModalOpen, setPdpaModalOpen] = useState(false);
            const [regForm, setRegForm] = useState({
                license: '',
                name: '',
                position: 'พยาบาลวิชาชีพ',
                workContext: 'ICU / ER / OR (หอผู้ป่วยวิกฤต)',
                department: 'กรมการแพทย์',
                hospital: 'รพ.ราชวิถี',
                province: 'กรุงเทพมหานคร',
                email: '',
                phone: '',
                userType: 'เรียนใหม่'
            });
            const [otpCode, setOtpCode] = useState('');
            const [generatedOtp, setGeneratedOtp] = useState('');
            const [otpInput, setOtpInput] = useState('');
            const [isSendingOtp, setIsSendingOtp] = useState(false);

            // Step 5: Cert Confirm + 5-Dimension CNEU Evaluation + Dual Doc Tabs
            const [certForm, setCertForm] = useState({
                name: user?.name || '',
                nameEN: user?.nameEN || '',
                hospital: user?.hospital || ''
            });
            const [cneuRatings, setCneuRatings] = useState({
                content: 5,
                speaker: 5,
                platform: 5,
                aiLab: 5,
                application: 5
            });
            const [csatComment, setCsatComment] = useState('');
            const [certViewTab, setCertViewTab] = useState('certificate'); // certificate | cneu_letter

            // Pre-Approach 30s Warm-up (Zero-PII Tags)
            const [warmupTags, setWarmupTags] = useState({
                ageGroup: PRE_APPROACH_TAGS.ageGroups[1],
                cause: PRE_APPROACH_TAGS.causes[0],
                mood: PRE_APPROACH_TAGS.familyMoods[0],
                concern: PRE_APPROACH_TAGS.concerns[0]
            });

            // UI Feedback
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });
            const [heroImgFailed, setHeroImgFailed] = useState(false);

            const certCanvasRef = useRef(null);
            const userRef = useRef(user);
            useEffect(() => { userRef.current = user; }, [user]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Firebase Auth + Real-time Settings & Content Sync
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) {
                    setCloudReady(true);
                    return;
                }
                let active = true;
                let anonAttempted = false;
                let unsubSettings = null;
                let unsubContent = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) { setCloudReady(true); return; }
                        if (!anonAttempted) {
                            anonAttempted = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') await fbAuth.authStateReady();
                                if (active && !fbAuth.currentUser) await signInAnonymously(fbAuth);
                            } catch (_) {}
                            if (active) setCloudReady(true);
                        }
                        return;
                    }
                    setCloudReady(true);

                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                            if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
