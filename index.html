    <!-- ซิงค์ธีมมืด/สว่างทันที + โหลดโมดูลกลาง (Zero-Build GitHub Pages) -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('rjcloud_theme') || 'dark';
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#1c222b' : '#e6ebf0');
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&
            loc.origin !== 'null' &&
            !/(googleusercontent|webcontainer|stackblitz|sandbox|srcdoc|blob:)/i.test(loc.href);
          if (isRealHost) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            [
              './data.js',
              './learning-core.js?v=202712',
              './cert-engine.js',
              './hero-peach-engine.js?v=202712',
              './keynote-launch.js?v=202712'
            ].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

    <!-- ========================================================================
         1. MOONLIT PEACH CLIFF HERO STYLES (คงความสวยของหน้าต้นไม้ไว้ 100%)
         2. NEUMORPHIC SOFT UI SYSTEM TOKENS (ใช้ตั้งแต่ Auth ถึงใบประกาศฯ)
         ======================================================================== -->
    <style id="organ-cloud-system-styles">
      :root,
      html[data-theme="light"] {
        --neu-bg: #e6ebf0;
        --neu-header-bg: rgba(230, 235, 240, 0.92);
        --neu-light: #ffffff;
        --neu-dark: #c5ced9;
        --neu-border: rgba(255, 255, 255, 0.72);
        --neu-border-soft: rgba(255, 255, 255, 0.48);
        --neu-text: #1f2b38;
        --neu-text-sub: #47586b;
        --neu-text-muted: #64768a;
        --neu-teal: #247870;
        --neu-teal-bright: #1a9184;
        --neu-teal-soft: rgba(36, 120, 112, 0.22);
        --neu-rose: #d9486b;
        --neu-icon-muted: #4b5c6e;
        --neu-tray-bg: #485461;
        --neu-tray-fg: #f4f7fa;
        --neu-tray-hover-fg: #ffffff;
        --neu-tray-shadow: 3px 3px 7px rgba(132, 145, 160, 0.65), -2px -2px 6px rgba(255, 255, 255, 0.85);
        --neu-wave-grad: linear-gradient(180deg, #3ba397 0%, #246f68 100%);
        --shadow-raised-lg: 12px 12px 26px var(--neu-dark), -12px -12px 26px var(--neu-light);
        --shadow-raised: 7px 7px 15px var(--neu-dark), -7px -7px 15px var(--neu-light);
        --shadow-raised-sm: 4px 4px 9px var(--neu-dark), -4px -4px 9px var(--neu-light);
        --shadow-pressed: inset 6px 6px 12px var(--neu-dark), inset -6px -6px 12px var(--neu-light);
        --shadow-pressed-deep: inset 8px 8px 15px #b7c2ce, inset -7px -7px 14px #ffffff;
        --shadow-pressed-sm: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
      }

      html[data-theme="dark"] {
        --neu-bg: #1c222b;
        --neu-header-bg: rgba(28, 34, 43, 0.94);
        --neu-light: #2d3746;
        --neu-dark: #0e1218;
        --neu-border: rgba(255, 255, 255, 0.085);
        --neu-border-soft: rgba(255, 255, 255, 0.055);
        --neu-text: #f4f7fb;
        --neu-text-sub: #c9d6e6;
        --neu-text-muted: #9eb0c7;
        --neu-teal: #5eead4;
        --neu-teal-bright: #34d399;
        --neu-teal-soft: rgba(94, 234, 212, 0.28);
        --neu-rose: #fda4af;
        --neu-icon-muted: #e2eaf4;
        --neu-tray-bg: #2e394a;
        --neu-tray-fg: #f4f7fb;
        --neu-tray-hover-fg: #081c1a;
        --neu-tray-shadow: 4px 4px 9px #0c1015, -3px -3px 7px #313c4e;
        --neu-wave-grad: linear-gradient(180deg, #7ef6df 0%, #2dd4bf 100%);
        --shadow-raised-lg: 12px 12px 26px var(--neu-dark), -10px -10px 22px var(--neu-light);
        --shadow-raised: 7px 7px 15px var(--neu-dark), -6px -6px 14px var(--neu-light);
        --shadow-raised-sm: 4px 4px 9px var(--neu-dark), -4px -4px 9px var(--neu-light);
        --shadow-pressed: inset 6px 6px 12px var(--neu-dark), inset -5px -5px 11px var(--neu-light);
        --shadow-pressed-deep: inset 8px 8px 16px #090c10, inset -6px -6px 13px #313c4d;
        --shadow-pressed-sm: inset 4px 4px 8px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        background-color: var(--neu-bg);
        color: var(--neu-text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Anuphan', 'Sarabun', 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        transition: background-color 0.32s ease, color 0.32s ease;
      }
      @media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }
      html[data-theme="dark"] select option { background-color: #1c222b; color: #f4f7fb; }
      .touch-target { min-height: 44px; touch-action: manipulation; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

      /* ---- A. MOONLIT PEACH CLIFF LANDING HERO (UNCHANGED BEAUTY) ---- */
      .moonlit-stage {
        position: relative;
        min-height: 100svh;
        width: 100%;
        background: linear-gradient(180deg, #040917 0%, #0a1a36 24%, #15305c 48%, #193a69 64%, #0d203f 82%, #040a18 100%);
        overflow: hidden;
        isolation: isolate;
      }
      .mist-veil-back {
        position: absolute; inset: 0; pointer-events: none; z-index: 4;
        background:
          radial-gradient(ellipse 68% 40% at 22% 48%, rgba(165, 216, 255, 0.24) 0%, transparent 72%),
          radial-gradient(ellipse 58% 34% at 68% 44%, rgba(125, 198, 252, 0.16) 0%, transparent 70%),
          linear-gradient(180deg, rgba(148, 206, 255, 0.04) 0%, rgba(186, 230, 253, 0.08) 52%, rgba(8, 22, 48, 0.05) 100%);
        animation: rjMistBreath 18s ease-in-out infinite alternate;
      }
      .mist-veil-chill {
        position: absolute; inset: -6% -10%; pointer-events: none; z-index: 8;
        background:
          radial-gradient(ellipse 56% 24% at 24% 58%, rgba(206, 236, 255, 0.14) 0%, transparent 72%),
          radial-gradient(ellipse 48% 22% at 54% 52%, rgba(186, 230, 253, 0.11) 0%, transparent 70%),
          radial-gradient(ellipse 54% 26% at 18% 82%, rgba(147, 210, 252, 0.12) 0%, transparent 74%);
        filter: blur(18px);
        animation: rjChillDrift 26s ease-in-out infinite alternate;
        will-change: transform, opacity;
      }
      .moonlit-vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 12;
        background:
          radial-gradient(ellipse 86% 78% at 48% 44%, transparent 48%, rgba(2, 6, 18, 0.62) 100%),
          linear-gradient(180deg, rgba(2, 6, 18, 0.32) 0%, transparent 18%, transparent 76%, rgba(2, 6, 18, 0.78) 100%);
      }
      .cliff-text-zone { position: relative; text-shadow: 0 4px 24px rgba(1, 5, 16, 0.96); }
      .cliff-eyebrow { display: inline-flex; align-items: center; gap: 0.45rem; color: rgba(224, 242, 254, 0.92); letter-spacing: 0.04em; text-shadow: 0 2px 12px rgba(2, 8, 24, 0.95); }
      .headline-main { font-weight: 600; color: #ffffff; text-shadow: 0 3px 20px rgba(1, 6, 20, 0.98), 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 26px rgba(186, 230, 253, 0.28); }
      .headline-year {
        font-weight: 700;
        background: linear-gradient(95deg, #ffffff 0%, #fffbeb 38%, #fde68a 72%, #fbcfe8 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 16px rgba(1, 6, 20, 0.98)) drop-shadow(0 0 26px rgba(253, 224, 71, 0.36));
      }
      .sig-reveal-1 { display: inline-block; animation: rjSigOpen1 1.45s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both; }
      .sig-reveal-2 { display: inline-block; animation: rjSigOpen2 1.15s cubic-bezier(0.22, 1, 0.36, 1) 1.25s both; }
      .beta-glow-num { font-weight: 300; color: #fffce6; text-shadow: 0 2px 14px rgba(1, 6, 20, 0.95), 0 0 18px rgba(254, 249, 195, 0.78), 0 0 32px rgba(249, 168, 212, 0.35); }
      .btn-heartbeat-halo {
        position: relative; z-index: 2; display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
        min-width: 176px; min-height: 46px; padding: 0.55rem 2.25rem; border-radius: 9999px;
        background: linear-gradient(180deg, #ffffff 0%, #fff5f8 100%);
        border: 1.5px solid rgba(251, 182, 206, 0.96); color: #181429 !important;
        font-family: 'Prompt', 'Anuphan', -apple-system, sans-serif; font-weight: 700; font-size: 16px;
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; text-decoration: none; outline: none;
        transition: border-color 0.22s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        animation: rjHeartLubDub 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .btn-heartbeat-halo::before, .btn-heartbeat-halo::after {
        content: ""; position: absolute; inset: -2px; border-radius: 9999px;
        border: 1.5px solid rgba(249, 168, 212, 0.85); pointer-events: none; z-index: -1;
      }
      .btn-heartbeat-halo::before { animation: rjSonarRing1 2.6s ease-out infinite; }
      .btn-heartbeat-halo::after  { animation: rjSonarRing2 2.6s ease-out infinite; }
      .btn-heartbeat-halo:hover { border-color: #fb7185; transform: translateY(-2px) scale(1.035); }
      .btn-heartbeat-halo:active { transform: scale(0.96) !important; }
      .landing-service-pill, .landing-install-pill {
        background: rgba(7, 19, 44, 0.62); border: 1px solid rgba(186, 230, 253, 0.24);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #e0f2fe;
        transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease; text-decoration: none;
      }
      .landing-service-pill:hover, .landing-install-pill:hover {
        transform: translateY(-2px); border-color: rgba(251, 182, 206, 0.62); background: rgba(15, 36, 78, 0.82);
      }
      .water-wave-anim { animation: rjWaterDrift 8.5s linear infinite; }

      /* ---- B. NEUMORPHIC SOFT UI SYSTEM (AUTH -> PRETEST -> CLASSROOM -> POSTTEST -> CERT) ---- */
      .neu-header {
        background: var(--neu-header-bg);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--neu-border-soft);
      }
      .neu-card {
        background: var(--neu-bg); border-radius: 28px;
        border: 1px solid var(--neu-border); box-shadow: var(--shadow-raised-lg);
        transition: background-color 0.32s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }
      .neu-inset {
        background: var(--neu-bg); border-radius: 20px;
        border: 1px solid var(--neu-border-soft); box-shadow: var(--shadow-pressed);
      }
      .neu-input {
        background: var(--neu-bg); color: var(--neu-text); border-radius: 16px;
        border: 1px solid var(--neu-border-soft); box-shadow: var(--shadow-pressed-sm);
        outline: none; transition: box-shadow 0.22s ease, border-color 0.22s ease;
      }
      .neu-input::placeholder { color: var(--neu-text-muted); }
      .neu-input:focus { border-color: var(--neu-teal); box-shadow: var(--shadow-pressed), 0 0 0 2px var(--neu-teal-soft); }

      .neu-btn {
        background: var(--neu-bg); color: var(--neu-text); border-radius: 9999px;
        border: 1px solid var(--neu-border); box-shadow: var(--shadow-raised);
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
        display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; text-decoration: none;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }
      .neu-btn:hover:not(:disabled) { transform: translateY(-1.5px); color: var(--neu-teal); }
      .neu-btn:active:not(:disabled), .neu-btn.is-tapping:not(:disabled), .neu-btn.is-pressed {
        transform: translateY(1.5px) scale(0.978); box-shadow: var(--shadow-pressed-deep);
        border-color: var(--neu-border-soft); color: var(--neu-teal);
      }
      .neu-btn:disabled { opacity: 0.45; cursor: not-allowed; }

      .neu-btn-teal {
        background: linear-gradient(145deg, #258077 0%, #1b615a 100%);
        color: #ffffff !important; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.24);
        border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 9999px;
        box-shadow: 6px 6px 14px var(--neu-dark), -5px -5px 14px var(--neu-light);
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
        display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; text-decoration: none;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, filter 0.2s ease;
      }
      .neu-btn-teal:hover:not(:disabled) { transform: translateY(-1.5px); filter: brightness(1.07); }
      .neu-btn-teal:active:not(:disabled), .neu-btn-teal.is-tapping:not(:disabled) {
        transform: translateY(1.5px) scale(0.975);
        background: linear-gradient(145deg, #1a5c56 0%, #22756d 100%);
        box-shadow: inset 5px 5px 11px rgba(8, 34, 31, 0.72), inset -4px -4px 9px rgba(94, 234, 212, 0.24);
      }
      .neu-btn-teal:disabled { opacity: 0.48; cursor: not-allowed; }

      .neu-icon-well {
        width: 40px; height: 40px; border-radius: 9999px;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--neu-bg); box-shadow: var(--shadow-pressed-sm);
        color: var(--neu-icon-muted); flex-shrink: 0;
      }

      .neu-step-pill, .neu-lesson-item {
        background: var(--neu-bg); border-radius: 20px; border: 1px solid var(--neu-border);
        box-shadow: var(--shadow-raised-sm); cursor: pointer; user-select: none;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      }
      .neu-step-pill:hover, .neu-lesson-item:hover { transform: translateY(-1px); }
      .neu-step-pill:active, .neu-step-pill.is-tapping, .neu-step-pill.is-done,
      .neu-lesson-item:active, .neu-lesson-item.is-tapping, .neu-lesson-item.is-active {
        transform: translateY(1.5px) scale(0.982); box-shadow: var(--shadow-pressed-deep);
        border-color: var(--neu-teal-soft);
      }

      /* Signature Button #1: Play -> Animated Waveform Equalizer */
      .neu-play-morph {
        position: relative; display: inline-flex; align-items: center; gap: 11px;
        height: 50px; padding: 5px 18px 5px 7px; border-radius: 9999px;
        background: var(--neu-bg); border: 1px solid var(--neu-border); box-shadow: var(--shadow-raised);
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
        transition: padding 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, transform 0.2s ease;
      }
      .neu-play-morph:hover { transform: translateY(-1px); }
      .neu-play-morph:active, .neu-play-morph.is-tapping { transform: translateY(1.5px) scale(0.978); box-shadow: var(--shadow-pressed-deep); }
      .neu-play-morph.is-playing { padding-right: 20px; box-shadow: var(--shadow-pressed-deep); border-color: var(--neu-border-soft); }
      .neu-play-circle {
        width: 38px; height: 38px; border-radius: 9999px;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--neu-bg); box-shadow: var(--shadow-pressed-sm); color: var(--neu-icon-muted); flex-shrink: 0;
      }
      .neu-play-morph.is-playing .neu-play-circle { color: var(--neu-teal); box-shadow: var(--shadow-raised-sm); }
      .neu-play-content { position: relative; display: inline-flex; align-items: center; min-width: 92px; height: 28px; }
      .neu-play-label { font-family: 'Prompt', 'Anuphan', sans-serif; font-weight: 600; font-size: 13.5px; color: var(--neu-text); white-space: nowrap; transition: opacity 0.2s ease; }
      .neu-play-morph.is-playing .neu-play-label { opacity: 0; pointer-events: none; position: absolute; }
      .neu-waveform { display: none; align-items: center; gap: 3.2px; height: 26px; padding: 0 2px; }
      .neu-play-morph.is-playing .neu-waveform { display: inline-flex; animation: fadeWaveIn 0.32s ease forwards; }
      .neu-wave-bar {
        width: 3px; border-radius: 9999px; background: var(--neu-wave-grad); height: 22%;
        animation: neuBarDance var(--dur, 0.85s) ease-in-out var(--del, 0s) infinite alternate;
      }

      /* Signature Button #2: ถาม AI -> Morphing Icon Tray */
      .neu-ai-morph {
        position: relative; display: inline-flex; align-items: center; justify-content: center;
        height: 46px; min-width: 112px; padding: 5px 16px; border-radius: 9999px;
        background: var(--neu-bg); border: 1px solid var(--neu-border); box-shadow: var(--shadow-raised);
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
        transition: min-width 0.34s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, transform 0.2s ease;
      }
      .neu-ai-morph:hover:not(.is-open) { transform: translateY(-1px); }
      .neu-ai-morph:active:not(.is-open), .neu-ai-morph.is-tapping:not(.is-open) { transform: translateY(1.5px) scale(0.978); box-shadow: var(--shadow-pressed-deep); }
      .neu-ai-morph.is-open { min-width: 214px; box-shadow: var(--shadow-pressed-deep); border-color: var(--neu-border-soft); cursor: default; }
      .neu-ai-front { display: inline-flex; align-items: center; gap: 7px; color: var(--neu-teal); font-family: 'Prompt', 'Anuphan', sans-serif; font-weight: 700; font-size: 13px; }
      .neu-ai-morph.is-open .neu-ai-front { opacity: 0; pointer-events: none; position: absolute; }
      .neu-ai-tray { display: none; align-items: center; gap: 9px; }
      .neu-ai-morph.is-open .neu-ai-tray { display: inline-flex; }
      .neu-tray-icon {
        width: 34px; height: 34px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid transparent; cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        animation: trayIconPop 0.32s cubic-bezier(0.22, 1, 0.36, 1) var(--popDel, 0s) both;
      }
      .neu-tray-icon.is-close { background: var(--neu-bg); color: var(--neu-icon-muted); box-shadow: var(--shadow-raised-sm); }

        function LiquidGlassOtpInput({ value, onChange, disabled }) {
            const digits = Array.from({ length: 6 }, (_, i) => (value || '')[i] || '');
            const refs = useRef([]);
            const handleDigit = (idx, raw) => {
                const clean = raw.replace(/[^0-9]/g, '');
                if (!clean) {
                    const arr = digits.slice(); arr[idx] = ''; onChange(arr.join(''));
                    return;
                }
                if (clean.length > 1) {
                    onChange(clean.slice(0, 6));
                    refs.current[Math.min(5, clean.length - 1)]?.focus();
                    return;
                }
                const arr = digits.slice(); arr[idx] = clean;
                onChange(arr.join(''));
                if (idx < 5) refs.current[idx + 1]?.focus();
            };
            const handleKeyDown = (idx, e) => {
                if (e.key === 'Backspace' && !digits[idx] && idx > 0) refs.current[idx - 1]?.focus();
            };
            return (
                <div className="flex items-center justify-center gap-2 sm:gap-3">
                    {digits.map((d, i) => (
                        <input
                            key={i}
                            ref={el => { refs.current[i] = el; }}
                            type="text"
                            inputMode="numeric"
                            maxLength={6}
                            disabled={disabled}
                            value={d}
                            onChange={e => handleDigit(i, e.target.value)}
                            onKeyDown={e => handleKeyDown(i, e)}
                            className="neu-input w-11 h-14 sm:w-13 sm:h-15 text-center font-mono text-xl sm:text-2xl font-extrabold text-[var(--neu-teal)]"
                        />
                    ))}
                </div>
            );
        }

        // ============================================================================
        // 4. MAIN LEARNER APPLICATION (NEUMORPHIC SOFT UI FROM AUTH TO CERTIFICATE)
        // ============================================================================
        function LearnerApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); } catch (_) { return new URLSearchParams(); }
            }, []);
            const returnToDashboard = urlParams.get('return') === 'dashboard';
            const autoStepParam = urlParams.get('auto_step') || '';
            const incomingLicense = urlParams.get('license') || '';
            const incomingCourseId = urlParams.get('course') || '';

            const [theme, setTheme] = useState(() => {

            });

                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');

            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isStandalonePwa, setIsStandalonePwa] = useState(() => {
                try { return Boolean(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true); } catch (_) { return false; }
            });
            const [showPwaGuide, setShowPwaGuide] = useState(false);
            const isIosDevice = useMemo(() => /iPad|iPhone|iPod/i.test(navigator.userAgent || ''), []);

            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...(CORE.DEFAULT_CNEU_CONFIG || {}) }));
            const [certTemplate, setCertTemplate] = useState(() => ({ ...(CORE.DEFAULT_CERT_TEMPLATE || {}) }));
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ', url: '', documentUrl: '' });
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : (CORE.FALLBACK_LESSONS || [])));
            const [quizList, setQuizList] = useState(() => (typeof CORE.parseRawExams === 'function' ? CORE.parseRawExams(window.QUIZ_QUESTIONS_RAW) : []));
            const [courseCatalog, setCourseCatalog] = useState(() => FALLBACK_COURSE_CATALOG.filter(c => c && c.active !== false));
            const [selectedCourseId, setSelectedCourseId] = useState(() => {
                const activeList = FALLBACK_COURSE_CATALOG.filter(c => c && c.active !== false);
                if (incomingCourseId && activeList.some(c => c.id === incomingCourseId)) return incomingCourseId;
                return activeList[0]?.id || 'organ_donation_core';
            });

            const [user, setUser] = useState(() => loadSessionTwoLayer());
            const [screen, setScreen] = useState(() => {
                if ((returnToDashboard || autoStepParam) && loadSessionTwoLayer()?.id) return 'dashboard';
                if (incomingLicense || incomingCourseId) return 'auth';
                return 'landing';
            });
            const [dashTab, setDashTab] = useState('lessons');

            const [authStep, setAuthStep] = useState(1);
            const [licenseInput, setLicenseInput] = useState(incomingLicense);
            const [authBusy, setAuthBusy] = useState(false);
            const [existingUserDoc, setExistingUserDoc] = useState(null);
            const [authClassification, setAuthClassification] = useState(null);
            const [authProfile, setAuthProfile] = useState({
                professionGroup: '', name: '', nameEN: '', position: '',
                department: HEALTH_REGIONS[HEALTH_REGIONS.length - 1] || 'เขตสุขภาพที่ 13 (กรุงเทพมหานคร)',
                hospital: '', email: '', phone: '', pdpaAccepted: true
            });
            const [sentOtpCode, setSentOtpCode] = useState('');
            const [otpExpiresAt, setOtpExpiresAt] = useState(0);
            const [otpCooldown, setOtpCooldown] = useState(0);
            const [otpInput, setOtpInput] = useState('');

            // Classroom, Single Study Document ("เอกสารประกอบการเรียน"), Ask AI Modal, Quiz & Cert States
            const [activeLessonIdx, setActiveLessonIdx] = useState(0);
            const [showPdfPreview, setShowPdfPreview] = useState(false);
            const [aiLessonSummaries, setAiLessonSummaries] = useState({});
            const [aiSummaryLoading, setAiSummaryLoading] = useState(false);
            const [askAiModalOpen, setAskAiModalOpen] = useState(false);
            const [lessonQaInput, setLessonQaInput] = useState('');
            const [lessonQaAnswer, setLessonQaAnswer] = useState('');
            const [lessonQaLoading, setLessonQaLoading] = useState(false);

            const [quizAnswers, setQuizAnswers] = useState({});
            const [certNameTH, setCertNameTH] = useState('');
            const [certNameEN, setCertNameEN] = useState('');
            const [certHospital, setCertHospital] = useState('');
            const [csatScore, setCsatScore] = useState(5);
            const [susAnswers, setSusAnswers] = useState(() => Object.fromEntries(SUS_ITEMS.map(q => [q.key, q.pos ? 5 : 1])));
            const [editProfileOpen, setEditProfileOpen] = useState(false);
            const [editForm, setEditForm] = useState({ professionGroup: 'พยาบาล', name: '', nameEN: '', position: '', hospital: '', phone: '' });

            const [navPopup, setNavPopup] = useState({ open: false });
            const [guideVoiceState, setGuideVoiceState] = useState({ activeKey: '', status: 'idle' });
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const certCanvasRef = useRef(null);
            const sharedAudioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const voiceSessionRef = useRef(0);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            useEffect(() => {
                if (otpCooldown <= 0) return;
                const tm = setTimeout(() => setOtpCooldown(c => Math.max(0, c - 1)), 1000);
                return () => clearTimeout(tm);
            }, [otpCooldown]);

            useEffect(() => {
                setLessonQaAnswer(''); setLessonQaInput(''); setShowPdfPreview(false);
            }, [activeLessonIdx]);

            useEffect(() => {
                const el = document.getElementById('app-root');
                if (el) el.dataset.mounted = 'true';

                if (autoStepParam === 'posttest' && loadSessionTwoLayer()?.id) {
                    setNavPopup({
                        open: true,
                        badge: 'AI NAVIGATOR • ขั้นตอนที่ 4',
                        title: 'เยี่ยมมากค่ะ! ผ่าน AI Skill Lab 3D แล้ว',
                        message: 'พร้อมทำแบบทดสอบหลังเรียน (Post-test เกณฑ์ผ่าน ≥ 80%) เพื่อปลดล็อกประกาศนียบัตรดิจิทัลและรหัส QR ทันทีเลยไหมคะ?',
                        voiceKey: 'nav_auto_posttest',
                        voiceText: 'ยินดีด้วยค่ะ ท่านผ่านห้องฝึกสื่อสารสามมิติ เอไอสกิลแล็บ เรียบร้อยแล้ว เชิญทำแบบทดสอบหลังเรียนเพื่อปลดล็อกประกาศนียบัตรได้เลยค่ะ',
                        ctaLabel: 'เข้าทำ Post-test ทันที →',
                        onConfirm: () => { setQuizAnswers({}); setScreen('posttest'); }
                    });
                    try { window.history.replaceState({}, '', './index.html'); } catch (_) {}
                } else if (returnToDashboard && loadSessionTwoLayer()?.id) {
                    try { window.history.replaceState({}, '', './index.html'); } catch (_) {}
                }

                try {
                    const loc = window.location;
                    const isRealHost = (loc.protocol === 'https:' || loc.hostname === 'localhost') && !/(googleusercontent|webcontainer|sandbox|srcdoc|blob:)/i.test(loc.href);
                    if ('serviceWorker' in navigator && isRealHost) navigator.serviceWorker.register('./sw.js').catch(() => {});
                } catch (_) {}

                const onBeforeInstall = (e) => { e.preventDefault(); setDeferredPrompt(e); };
                const onAppInstalled = () => { setDeferredPrompt(null); setIsStandalonePwa(true); showToast('ติดตั้งแอป organ cloud 2.0 เรียบร้อยแล้วค่ะ'); };
                window.addEventListener('beforeinstallprompt', onBeforeInstall);
                window.addEventListener('appinstalled', onAppInstalled);
                return () => { window.removeEventListener('beforeinstallprompt', onBeforeInstall); window.removeEventListener('appinstalled', onAppInstalled); };
            }, [autoStepParam, returnToDashboard, showToast]);

            useEffect(() => {
                const syncKeynote = () => {
                    if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.sync === 'function') {
                        window.RJCLOUD_KEYNOTE.sync({ isLanding: screen === 'landing', appsScriptUrl });
                    }
                };
                syncKeynote();
                window.addEventListener('rjcloud-keynote-ready', syncKeynote);
                return () => window.removeEventListener('rjcloud-keynote-ready', syncKeynote);
            }, [screen, appsScriptUrl]);

            useEffect(() => {
                if (!fbAuth || !fbDb) return;
                let active = true, unsubSettings = null, unsubContent = null;
                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) { try { await signInAnonymously(fbAuth); } catch (_) {} return; }

                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                        if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                        if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                        if (Array.isArray(d.courseCatalog) && d.courseCatalog.length > 0) {
                            const activeCourses = d.courseCatalog.filter(c => c && c.active !== false);
                            if (activeCourses.length > 0) {
                                setCourseCatalog(activeCourses);
                                setSelectedCourseId(prev => (incomingCourseId && activeCourses.some(c => c.id === incomingCourseId)) ? incomingCourseId : (activeCourses.some(c => c.id === prev) ? prev : activeCourses[0].id));
                            }
                        }
                    }, () => {});

                    if (unsubContent) unsubContent();
                    unsubContent = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                        if (d.questionSets && typeof CORE.normalizeQuestionSets === 'function') {
                            const sets = CORE.normalizeQuestionSets(d.questionSets);
                            if (sets[0]?.length > 0) setQuizList(sets[0]);
                        }
                    }, () => {});
                });
                return () => { active = false; unsubAuth(); if (unsubSettings) unsubSettings(); if (unsubContent) unsubContent(); };
            }, [incomingCourseId]);

            const isExempt = Boolean(user && (user.studyHoursExempt || user.userType === 'เทียบโอน' || user.classificationCode === 'CREDIT_TRANSFER'));
            const studyPct = isExempt ? 100 : Math.min(100, Math.round(Number(user?.progress || 0)));
            const isStudyEnough = isExempt || studyPct >= MIN_STUDY_PERCENT;
            const isLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const canTakePosttest = Boolean(liveConfig.allowPosttest || (isStudyEnough && isLabDone));
            const hasPassedPosttest = Boolean(user?.status === 'ผ่าน' || user?.certificateCode);
            const userCreditMeta = useMemo(
                () => resolveCreditMetaSafe(user, certTemplate, { ...cneuConfig, trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8) }),
                [user, certTemplate, cneuConfig, liveConfig.hours]
            );

            const activeLesson = lessons[activeLessonIdx] || lessons[0] || {};
            const activeLessonKey = String(activeLesson.id || activeLessonIdx + 1);
            const activeLessonDocUrl = resolveDocUrlSafe(activeLesson);
            const activeLessonVideoUrl = resolveVideoEmbedUrl(activeLesson);
            const selectedCourseObj = useMemo(
                () => courseCatalog.find(c => c.id === selectedCourseId) || courseCatalog[0] || FALLBACK_COURSE_CATALOG[0],
                [courseCatalog, selectedCourseId]
            );
            const activeLessonSummaryText = useMemo(
                () => aiLessonSummaries[activeLessonKey] || (typeof CORE.buildDefaultOneMinSummary === 'function' ? CORE.buildDefaultOneMinSummary(activeLesson) : ''),
                [aiLessonSummaries, activeLessonKey, activeLesson]
            );

            useEffect(() => {
                if (screen === 'cert_confirm' && user) {
                    setCertNameTH(user.name || ''); setCertNameEN(user.nameEN || ''); setCertHospital(user.hospital || '');
                }
            }, [screen, user]);

            useEffect(() => {
                if (screen !== 'certificate' || !certCanvasRef.current || !user?.certificateCode) return;
                const code = user.certificateCode;
                const verifyUrl = typeof CERT.buildVerifyUrl === 'function' ? CERT.buildVerifyUrl(code, certTemplate.certPrefix) : `https://learn.coerj.com/verify.html?code=${encodeURIComponent(code)}`;
                const mergedTpl = { ...certTemplate, cneuActivityCode: cneuConfig.activityCode, cneuCredits: cneuConfig.cneuCredits, trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8) };
                if (typeof CERT.drawMinimalistCertificate === 'function') CERT.drawMinimalistCertificate(certCanvasRef.current, mergedTpl, user, verifyUrl);
                else drawCertificateFallback(certCanvasRef.current, mergedTpl, user, userCreditMeta);
            }, [screen, user, certTemplate, cneuConfig, liveConfig.hours, userCreditMeta]);

            // Studio 24kHz AI Voice Only (Strictly Never Browser SpeechSynthesis)
            const stopStudioVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (sharedAudioRef.current) { try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {} }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, []);
            useEffect(() => () => stopStudioVoice(), [stopStudioVoice]);

            const playStudioVoice = useCallback(async (key, text) => {
                if (guideVoiceState.activeKey === key && guideVoiceState.status !== 'idle') { stopStudioVoice(); return; }
                stopStudioVoice();
                const sid = voiceSessionRef.current;
                setGuideVoiceState({ activeKey: key, status: 'loading' });
                try {
                    if (typeof CORE.fetchStudioGuideBlob !== 'function') throw new Error('ไม่พบโมดูลเสียงสตูดิโอ 24kHz');
                    const blob = await CORE.fetchStudioGuideBlob(text, appsScriptUrl, 'Sulafat');
                    if (voiceSessionRef.current !== sid) return;
                    if (!sharedAudioRef.current) {
                        const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', ''); sharedAudioRef.current = a;
                    }
                    const url = URL.createObjectURL(blob);
                    audioUrlRef.current = url;
                    setGuideVoiceState({ activeKey: key, status: 'speaking' });
                    await new Promise(resolve => {
                        const a = sharedAudioRef.current;
                        a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });
                    if (voiceSessionRef.current === sid) setGuideVoiceState({ activeKey: '', status: 'idle' });
                } catch (err) {
                    if (voiceSessionRef.current === sid) {
                        setGuideVoiceState({ activeKey: '', status: 'idle' });
                        showToast(err?.message || 'ไม่สามารถเชื่อมต่อเสียง AI สตูดิโอ 24kHz ได้ในขณะนี้ค่ะ', 'info');
                    }
                }
            }, [guideVoiceState, stopStudioVoice, appsScriptUrl, showToast]);

            const persistUserUpdate = async (nextUser) => {
                setUser(nextUser);
                saveSessionTwoLayer(nextUser);
                if (fbDb && nextUser?.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)), nextUser, { merge: true });
                        if (typeof CORE.buildAnonTelemetryId === 'function' && typeof CORE.buildExecutiveTelemetryPayload === 'function') {
                            const anonId = CORE.buildAnonTelemetryId(nextUser.id);
                            await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId), CORE.buildExecutiveTelemetryPayload(nextUser), { merge: true });
                        }
                    } catch (_) {}
                }
            };

            const handleAuthStep1Lookup = async (e) => {
                e.preventDefault();
                const cleanLic = licenseInput.replace(/[^a-zA-Z0-9_-]/g, '').toUpperCase().trim();
                if (cleanLic.length < 4) { showToast('กรุณากรอกเลขที่ใบอนุญาตประกอบวิชาชีพอย่างน้อย 4 หลักค่ะ', 'error'); return; }
                setLicenseInput(cleanLic); setAuthBusy(true);
                let foundUser = null, onsiteRecords = [];
                if (fbDb) {
                    try {
                        const [uSnap, onsiteSnap] = await Promise.all([
                            getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic)),
                            getDocs(query(collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'onsite_registrations'), where('license', '==', cleanLic)))
                        ]);
                        if (uSnap.exists()) foundUser = { id: uSnap.id, ...uSnap.data() };
                        onsiteSnap.forEach(d => onsiteRecords.push({ id: d.id, ...d.data() }));
                    } catch (_) {}
                }
                const cls = typeof CORE.classifyLearnerForCourse === 'function'
                    ? CORE.classifyLearnerForCourse({ license: cleanLic, courseId: selectedCourseId, onsiteRecords, existingUser: foundUser })
                    : { code: 'NEW_LEARNER', userType: 'เรียนใหม่', labelTH: 'เรียนใหม่', badgeClass: 'badge-new-learner', studyHoursExempt: false, readOnly: true, matchedEventId: '', matchedEventName: '' };
                setExistingUserDoc(foundUser); setAuthClassification(cls);
                const src = foundUser || onsiteRecords[0] || null;
                if (src) {
                    setAuthProfile(p => ({
                        ...p, professionGroup: resolveProfessionGroupSafe(src),
                        name: src.name || p.name, nameEN: src.nameEN || p.nameEN, position: src.position || p.position,
                        department: src.department || p.department, hospital: src.hospital || p.hospital,
                        email: src.email || p.email, phone: src.phone || p.phone
                    }));
                }
                setAuthBusy(false); setAuthStep(2);
                showToast(`ระบบตรวจสอบสิทธิ์อัตโนมัติ: ${cls.labelTH}`, 'info');
            };

            const dispatchRealOtp = async () => {
                const code = String(Math.floor(100000 + Math.random() * 900000));
                if (!appsScriptUrl || !navigator.onLine) { showToast('กรุณาเชื่อมต่ออินเทอร์เน็ตเพื่อรับรหัส OTP ทางอีเมลค่ะ', 'error'); return false; }
                try {
                    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 16000);
                    const raw = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'sendOTP', email: authProfile.email.trim(), otp: code, name: authProfile.name.trim(), license: licenseInput }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    const d = JSON.parse((await raw.text()) || '{}');
                    if (d?.status !== 'success') throw new Error(d?.error || 'ส่งอีเมล OTP ไม่สำเร็จ');
                    setSentOtpCode(code); setOtpExpiresAt(Date.now() + 10 * 60 * 1000); setOtpCooldown(45); setOtpInput('');
                    return true;
                } catch (err) {
                    showToast(err?.message || 'ไม่สามารถส่งรหัส OTP ทางอีเมลได้ กรุณาลองใหม่อีกครั้งค่ะ', 'error');
                    return false;
                }
            };

            const handleAuthStep2SendOtp = async (e) => {
                e.preventDefault();
                if (!authProfile.professionGroup) { showToast('กรุณาเลือกกลุ่มวิชาชีพของท่านค่ะ', 'error'); return; }
                if (!authProfile.name.trim() || !authProfile.email.includes('@')) { showToast('กรุณากรอกชื่อ–นามสกุลและอีเมลจริงให้ครบถ้วนค่ะ', 'error'); return; }
                setAuthBusy(true); const sent = await dispatchRealOtp(); setAuthBusy(false);
                if (sent) { setAuthStep(3); showToast(`ส่งรหัส OTP 6 หลักไปยัง ${maskEmailSafe(authProfile.email)} เรียบร้อยแล้วค่ะ`); }
            };

            const handleAuthStep3Verify = async (e) => {
                e.preventDefault();
                if (!sentOtpCode || Date.now() > otpExpiresAt) { showToast('รหัส OTP หมดอายุแล้ว กรุณากดส่งรหัสใหม่อีกครั้งค่ะ', 'error'); return; }
                if (otpInput.trim() !== sentOtpCode) { showToast('รหัส OTP 6 หลักไม่ถูกต้อง กรุณาตรวจสอบอีเมลอีกครั้งค่ะ', 'error'); return; }

                setAuthBusy(true);
                const cls = authClassification || { code: 'NEW_LEARNER', userType: 'เรียนใหม่', studyHoursExempt: false, matchedEventId: '', matchedEventName: '' };
                const isNurse = authProfile.professionGroup === 'พยาบาล';
                const enrollment = typeof CORE.buildCourseEnrollmentRecord === 'function'
                    ? CORE.buildCourseEnrollmentRecord(existingUserDoc, selectedCourseId, cls)
                    : { courseId: selectedCourseId, classificationCode: cls.code, userType: cls.userType, studyHoursExempt: cls.studyHoursExempt };

                const prevCourses = (existingUserDoc && typeof existingUserDoc.courses === 'object') ? existingUserDoc.courses : {};
                const nextUser = {
                    ...(existingUserDoc || {}),
                    id: licenseInput, license: licenseInput, activeCourseId: selectedCourseId,
                    name: authProfile.name.trim(), nameEN: authProfile.nameEN.trim(),
                    professionGroup: authProfile.professionGroup, cneuEligible: isNurse,
                    position: authProfile.position.trim() || authProfile.professionGroup,
                    department: authProfile.department, hospital: authProfile.hospital.trim(),
                    email: authProfile.email.trim(), phone: authProfile.phone.trim(),
                    classificationCode: cls.code, userType: cls.userType, studyHoursExempt: Boolean(cls.studyHoursExempt),
                    hoursActivityName: cls.matchedEventName || existingUserDoc?.hoursActivityName || '',
                    progress: cls.studyHoursExempt ? 100 : Number(existingUserDoc?.progress || 0),
                    trainingHours: String(selectedCourseObj?.trainingHours || cneuConfig.trainingHours || liveConfig.hours || 8),
                    cneuActivityCode: isNurse ? (cneuConfig.activityCode || '') : '',
                    cneuCredits: isNurse ? (selectedCourseObj?.cneuCredits || cneuConfig.cneuCredits || '') : '',
                    pretest: existingUserDoc?.pretest || '-', posttest: existingUserDoc?.posttest || '-',
                    status: existingUserDoc?.status || 'กำลังเรียน',
                    skillLabPassed: Boolean(existingUserDoc?.skillLabPassed),
                    skillLabHistory: Array.isArray(existingUserDoc?.skillLabHistory) ? existingUserDoc.skillLabHistory : [],
                    courses: { ...prevCourses, [selectedCourseId]: enrollment },
                    createdAt: existingUserDoc?.createdAt || new Date().toISOString(),
                    lastLoginAt: new Date().toISOString()
                };

                await persistUserUpdate(nextUser);
                setAuthBusy(false); stopStudioVoice(); setScreen('dashboard');

                const needPretest = !nextUser.pretest || nextUser.pretest === '-';
                setNavPopup({
                    open: true,
                    badge: `ยืนยันตัวตนสำเร็จ • ${cls.userType}`,
                    title: needPretest ? 'เริ่มต้นด่านที่ 1: ทำแบบทดสอบก่อนเรียน' : `ยินดีต้อนรับกลับมาค่ะ คุณ${nextUser.name}`,
                    message: needPretest
                        ? `ระบบจำแนกสิทธิ์อัตโนมัติเป็น “${cls.labelTH}” เรียบร้อยค่ะ เชิญทำแบบทดสอบก่อนเรียน (Pre-test) เพื่อวางแผนการเรียนรู้ได้เลยค่ะ`
                        : 'ระบบซิงค์ประวัติการเรียนเดิมของท่านเรียบร้อยแล้ว เชิญเรียนรู้ต่อในห้องเรียน organ cloud 2.0 ได้เลยค่ะ',
                    voiceKey: needPretest ? 'nav_post_otp_pre' : 'nav_post_otp_dash',
                    voiceText: needPretest
                        ? 'ยืนยันตัวตนสำเร็จแล้วค่ะ เชิญเริ่มทำแบบทดสอบก่อนเรียนเพื่อประเมินพื้นฐานได้เลยค่ะ'
                        : 'ยินดีต้อนรับกลับสู่ห้องเรียน ออร์แกน คลาวด์ สองจุดศูนย์ ค่ะ',
                    ctaLabel: needPretest ? 'เริ่มทำ Pre-test เลย →' : 'เข้าสู่ห้องเรียนหลัก →',
                    onConfirm: () => { if (needPretest) { setQuizAnswers({}); setScreen('pretest'); } }
                });
            };

            const handleGenerateAiOneMinSummary = async () => {
                if (aiSummaryLoading || !activeLesson?.title) return;
                setAiSummaryLoading(true);
                let generated = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `สรุปสาระสำคัญแบบ "AI สรุป 1 นาที" สำหรับบทเรียน: "${activeLesson.title}" (กลุ่มผู้เรียน: ${userCreditMeta.professionGroup}) ขอ 3–4 ข้อสั้นๆ ขึ้นต้นด้วย • เน้นประเด็นทางคลินิก ICU/OR/TC และออกสอบ Post-test`,
                                systemInstruction: `${CLINICAL_AI_PREFIX} สรุปภาษาไทยกระชับ แม่นยำ ไม่ใช้ Markdown`
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) generated = String(d.text).replace(/[*#]/g, '').trim();
                    } catch (_) {}
                }
                const finalText = generated || (typeof CORE.buildDefaultOneMinSummary === 'function' ? CORE.buildDefaultOneMinSummary(activeLesson) : '');
                setAiLessonSummaries(prev => ({ ...prev, [activeLessonKey]: finalText }));
                setAiSummaryLoading(false);
                showToast(generated ? 'สร้าง AI สรุป 1 นาทีเฉพาะบทนี้เรียบร้อยแล้วค่ะ' : 'แสดงบทสรุป 1 นาทีมาตรฐานค่ะ', generated ? 'success' : 'info');
            };

            const handleAskLessonAi = async (e) => {
                e.preventDefault();
                const q = lessonQaInput.trim();
                if (!q || lessonQaLoading) return;
                setLessonQaLoading(true);
                let reply = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `บทเรียน: ${activeLesson.title || ''}\nคำถามจาก${userCreditMeta.professionGroup}: ${q}`,
                                systemInstruction: `${CLINICAL_AI_PREFIX} ตอบคำถามคลินิกกระชับ ชัดเจน ตามมาตรฐานสภากาชาดไทยและโรงพยาบาลราชวิถี ไม่เกิน 5 บรรทัด`
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) reply = String(d.text).replace(/[*#]/g, '').trim();
                    } catch (_) {}
                }
                setLessonQaAnswer(reply || 'ไม่สามารถเชื่อมต่อ AI ได้ในขณะนี้ กรุณาตรวจสอบอินเทอร์เน็ตและลองถามใหม่อีกครั้งค่ะ');
                setLessonQaInput(''); setLessonQaLoading(false);
            };

            const handleSubmitQuiz = async (type) => {
                const total = quizList.length;
                if (Object.keys(quizAnswers).length < total) { showToast(`กรุณาตอบให้ครบทั้ง ${total} ข้อก่อนส่งคำตอบค่ะ`, 'error'); return; }
                let correct = 0;
                quizList.forEach(q => { if (Number(quizAnswers[q.id]) === Number(q.answer)) correct += 1; });
                const pct = Math.round((correct / Math.max(1, total)) * 100);
                const scoreStr = `${correct}/${total}`;
                const roadmap = typeof CORE.computeDomainDiagnosis === 'function' ? CORE.computeDomainDiagnosis(quizList, quizAnswers) : null;
                setQuizAnswers({});

                if (type === 'pretest') {
                    await persistUserUpdate({ ...user, pretest: scoreStr, aiRoadmap: roadmap || user.aiRoadmap || null });
                    setScreen('dashboard');
                    setNavPopup({
                        open: true,
                        badge: `PRE-TEST เสร็จสมบูรณ์ (${scoreStr})`,
                        title: isExempt ? 'สิทธิ์เทียบโอน: ไปห้อง AI Skill Lab 3D ได้เลย!' : 'ขั้นตอนถัดไป: ศึกษาบทเรียน & AI Skill Lab 3D',
                        message: isExempt
                            ? 'ท่านได้รับสิทธิ์เทียบโอนยกเว้นชั่วโมงเรียน 100% สามารถเข้าฝึกสื่อสาร 3 มิติ AI Skill Lab ต่อได้ทันทีค่ะ'
                            : `ทำคะแนน Pre-test ได้ ${pct}% เชิญศึกษาบทเรียนให้ครบ ≥ ${MIN_STUDY_PERCENT}% แล้วเข้าฝึกสื่อสาร AI Skill Lab 3D ค่ะ`,
                        ctaLabel: isExempt ? 'เปิดห้อง AI Skill Lab 3D →' : 'เข้าศึกษาบทเรียนเลย →',
                        onConfirm: () => { if (isExempt) { saveSessionTwoLayer(user); window.location.href = './aiskilllab.html'; } }
                    });
                } else {
                    const passed = pct >= MIN_POSTTEST_PERCENT;
                    await persistUserUpdate({ ...user, posttest: scoreStr, status: passed ? 'ผ่าน' : (user?.status || 'กำลังเรียน'), aiRoadmap: roadmap || user.aiRoadmap || null });
                    if (passed) { setScreen('cert_confirm'); showToast(`ยินดีด้วยค่ะ! สอบ Post-test ผ่านเกณฑ์ (${pct}%) ปลดล็อกประกาศนียบัตรแล้วค่ะ`); }
                    else { setScreen('dashboard'); showToast(`คะแนน Post-test ได้ ${pct}% (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%) สามารถทบทวนและสอบใหม่ได้ค่ะ`, 'info'); }
                }
            };

            const handleClaimCertificate = async (e) => {
                e.preventDefault();
                if (!certNameTH.trim()) { showToast('กรุณาระบุชื่อ–นามสกุลภาษาไทยบนประกาศนียบัตรค่ะ', 'error'); return; }
                const susRaw = SUS_ITEMS.reduce((acc, q) => acc + (q.pos ? (Number(susAnswers[q.key] || 3) - 1) : (5 - Number(susAnswers[q.key] || 3))), 0);
                const susScore = Math.round((susRaw / (SUS_ITEMS.length * 4)) * 100);
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${String(user?.license || '0000').slice(-4)}${Math.floor(10 + Math.random() * 89)}`;
                const issuedAt = user?.certificateIssuedAt || new Date().toISOString();

                const nextUser = {
                    ...user, name: certNameTH.trim(), nameEN: certNameEN.trim(), hospital: certHospital.trim() || user?.hospital || '',
                    satisfactionScore: Number(csatScore), susScore, status: 'ผ่าน',
                    certificateClaimed: true, certificateCode: code, certificateIssuedAt: issuedAt
                };
                await persistUserUpdate(nextUser);

                if (fbDb) {
                    try {
                        const pubPayload = typeof CERT.buildPublicCertPayload === 'function'
                            ? CERT.buildPublicCertPayload({ code, finalName: nextUser.name, nameEN: nextUser.nameEN, finalHospital: nextUser.hospital, license: nextUser.license, user: nextUser, certTemplate, cneuConfig, issuedAt })
                            : { code, name: nextUser.name, nameEN: nextUser.nameEN, license: nextUser.license, professionGroup: userCreditMeta.professionGroup, cneuEligible: userCreditMeta.isNurseCneu, creditType: userCreditMeta.creditType, creditLabelTH: userCreditMeta.lineTextTH, trainingHours: userCreditMeta.trainingHours, hospital: nextUser.hospital, courseTitleTH: certTemplate.courseTitleTH, orgTitleTH: certTemplate.orgTitleTH, cneuActivityCode: userCreditMeta.isNurseCneu ? userCreditMeta.cneuActivityCode : '', cneuCredits: userCreditMeta.isNurseCneu ? userCreditMeta.cneuCredits : '', issuedAt, status: 'valid' };
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), pubPayload, { merge: true });
                    } catch (_) {}
                }
                setScreen('certificate');
                showToast('ออกประกาศนียบัตรดิจิทัลพร้อมรหัส QR ตรวจสอบความถูกต้องเรียบร้อยแล้วค่ะ');
            };

            const handleMarkLessonStudied = async () => {
                const nextPct = Math.min(100, Math.max(studyPct + 20, Math.round(((activeLessonIdx + 1) / Math.max(1, lessons.length)) * 100)));
                await persistUserUpdate({ ...user, progress: nextPct });
                showToast(`บันทึกความก้าวหน้าการเรียน ${nextPct}% เรียบร้อยค่ะ`);
                if (nextPct >= MIN_STUDY_PERCENT && !isLabDone) {
                    setNavPopup({
                        open: true,
                        badge: 'ชั่วโมงเรียนผ่านเกณฑ์แล้ว!',
                        title: 'พร้อมเข้าฝึกสื่อสาร 3 มิติ AI Skill Lab',
                        message: 'ท่านสะสมเวลาเรียนครบเกณฑ์แล้ว เชิญเข้าฝึกสื่อสารโฮโลแกรมหัวใจ 3 มิติ 10 สเต็ป เพื่อปลดล็อก Post-test ค่ะ',
                        ctaLabel: 'เปิดห้อง AI Skill Lab 3D →',
                        onConfirm: () => { saveSessionTwoLayer(user); window.location.href = './aiskilllab.html'; }
                    });
                }
            };

            const handleSaveProfileEdit = async (e) => {
                e.preventDefault();
                const isNurse = editForm.professionGroup === 'พยาบาล';
                await persistUserUpdate({
                    ...user, professionGroup: editForm.professionGroup, cneuEligible: isNurse,
                    name: editForm.name.trim() || user.name, nameEN: editForm.nameEN.trim(),
                    position: editForm.position.trim(), hospital: editForm.hospital.trim(), phone: editForm.phone.trim()
                });
                setEditProfileOpen(false);
                showToast('อัปเดตข้อมูลโปรไฟล์เรียบร้อยค่ะ');
            };

            const handleDownloadCertPng = () => {
                if (!certCanvasRef.current) return;
                try {
                    const a = document.createElement('a');
                    a.href = certCanvasRef.current.toDataURL('image/png', 1.0);
                    a.download = `organ_cloud_Cert_${user?.certificateCode || '2027'}.png`;
                    a.click();
                    showToast('ดาวน์โหลดประกาศนียบัตร (PNG) เรียบร้อยค่ะ');
                } catch (_) { showToast('ไม่สามารถบันทึกภาพได้ กรุณาลองใหม่อีกครั้งค่ะ', 'error'); }
            };

            const handleDownloadCertPdf = () => {
                if (!certCanvasRef.current) return;
                try {
                    const JsPdfCtor = window.jspdf?.jsPDF;
                    if (!JsPdfCtor) { handleDownloadCertPng(); return; }
                    const pdf = new JsPdfCtor({ orientation: 'landscape', unit: 'px', format: [1200, 848] });
                    pdf.addImage(certCanvasRef.current.toDataURL('image/png', 1.0), 'PNG', 0, 0, 1200, 848);
                    pdf.save(`organ_cloud_Cert_${user?.certificateCode || '2027'}.pdf`);
                    showToast('ดาวน์โหลดประกาศนียบัตร (PDF) เรียบร้อยค่ะ');
                } catch (_) { handleDownloadCertPng(); }
            };

            const handlePrintCertLetter = () => {
                document.body.classList.add('printing-cneu-letter');
                setTimeout(() => {
                    window.print();
                    setTimeout(() => document.body.classList.remove('printing-cneu-letter'), 500);
                }, 120);
            };

            const handleInstallPwaClick = async () => {
                if (deferredPrompt?.prompt) {
                    try {
                        deferredPrompt.prompt();
                        const choice = await deferredPrompt.userChoice;
                        if (choice?.outcome === 'accepted') { setDeferredPrompt(null); showToast('กำลังติดตั้งแอป organ cloud 2.0 ค่ะ'); }
                        return;
                    } catch (_) {}
                }
                setShowPwaGuide(true);
            };

            // ============================================================================
            // 5. RENDER SCREENS (LANDING = MOONLIT CLIFF | ALL OTHER SCREENS = NEUMORPHIC)
            // ============================================================================
            if (screen === 'landing') {
                return (
                    <>
                        <LandingHeroScreen
                            hasSavedSession={Boolean(user?.id)}
                            onResumeDashboard={() => setScreen('dashboard')}
                            onStartAuth={() => { setAuthStep(1); setScreen('auth'); }}
                            showInstallBtn={!isStandalonePwa}
                            onInstallApp={handleInstallPwaClick}
                        />
                        <InstallAppModal open={showPwaGuide} onClose={() => setShowPwaGuide(false)} isIos={isIosDevice} />
                        <ToastBanner toast={toast} />
                    </>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe bg-[var(--neu-bg)] text-[var(--neu-text)]">
                    {guideVoiceState.status !== 'idle' && (
                        <div className="no-print-letter fixed top-0 left-0 right-0 z-50 pointer-events-none"><div className="rjc-ambient-bar" /></div>
                    )}

                    {/* Sticky Neumorphic Header */}
                    <header className="no-print-letter sticky top-0 z-30 neu-header">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                                <button type="button" onClick={() => { stopStudioVoice(); setScreen(user?.id && screen !== 'dashboard' ? 'dashboard' : 'landing'); }} className="neu-btn w-10 h-10 shrink-0" aria-label="ย้อนกลับ">
                                    <Icon name={user?.id && screen !== 'dashboard' ? 'ArrowLeft' : 'Home'} size={17} />
                                </button>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-[var(--neu-text)] block leading-none truncate">
                                        organ <span className="text-[var(--neu-teal)]">cloud</span> <span className="font-mono text-[10.5px] text-[var(--neu-text-muted)]">2.0</span>
                                    </span>
                                    <span className="text-[10.5px] font-mono text-[var(--neu-text-muted)] block truncate mt-0.5">
                                        {user?.name ? `${user.name} • ${userCreditMeta.professionGroup}` : 'Rajavithi Hospital COE • Production Hub'}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                {!isStandalonePwa && (
                                    <button type="button" onClick={handleInstallPwaClick} className="neu-btn px-3 py-2 text-xs font-bold text-[var(--neu-teal)]">
                                        <Icon name="Smartphone" size={14} /><span className="hidden md:inline">ติดตั้งแอป</span>
                                    </button>
                                )}
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                {user?.id && (
                                    <button type="button" onClick={() => { stopStudioVoice(); clearSessionTwoLayer(); setUser(null); setScreen('landing'); showToast('ออกจากระบบเรียบร้อยค่ะ'); }} className="neu-btn w-10 h-10 text-[var(--neu-rose)]" title="ออกจากระบบ">
                                        <Icon name="LogOut" size={15} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* ==================== SCREEN: AUTH (3 STEPS • NEUMORPHIC) ==================== */}
                    {screen === 'auth' && (
                        <main className="no-print-letter max-w-2xl w-full mx-auto px-4 py-7 space-y-5 flex-1">
                            {authStep === 1 && (
                                <form onSubmit={handleAuthStep1Lookup} className="neu-card p-6 sm:p-8 space-y-6">
                                    <div>
                                        <span className="font-mono text-[10.5px] font-bold text-[var(--neu-teal)] uppercase">organ cloud 2.0 • STEP 1 / 3</span>
                                        <h1 className="font-display font-extrabold text-xl sm:text-2xl text-[var(--neu-text)] mt-1 m-0">ยืนยันตัวตนบุคลากรทางการแพทย์</h1>
                                        <p className="text-xs sm:text-sm text-[var(--neu-text-sub)] mt-1 m-0">ระบบปิดเฉพาะแพทย์ พยาบาล และบุคลากรสหวิชาชีพ — ตรวจสอบประวัติและสิทธิ์เทียบโอน Onsite ให้อัตโนมัติค่ะ</p>
                                    </div>

                                    <div className="space-y-2.5">
                                        <div className="flex items-center justify-between gap-2">
                                            <label className="text-xs sm:text-sm font-bold text-[var(--neu-text)] flex items-center gap-1.5">
                                                <Icon name="GraduationCap" size={16} className="text-[var(--neu-teal)]" />
                                                <span>1. เลือกหลักสูตรที่เข้าอบรม</span>
                                            </label>
                                            <span className="font-mono text-[10.5px] font-bold text-[var(--neu-text-muted)]">เปิดสอน {courseCatalog.length} หลักสูตร</span>
                                        </div>

                                        <div className="grid grid-cols-1 gap-3">
                                            {courseCatalog.map((c, cIdx) => {
                                                const isSelected = selectedCourseId === c.id;
                                                const courseIcon = String(c.id || '').includes('kidney') ? 'Stethoscope' : cIdx % 2 === 0 ? 'HeartPulse' : 'Activity';
                                                return (
                                                    <button
                                                        key={c.id}
                                                        type="button"
                                                        onClick={() => setSelectedCourseId(c.id)}
                                                        aria-pressed={isSelected}
                                                        className={`neu-lesson-item ${isSelected ? 'is-active' : ''} w-full text-left p-4 flex items-start gap-3.5`}
                                                    >
                                                        <div className={`neu-icon-well ${isSelected ? 'text-[var(--neu-teal)]' : ''}`}>
                                                            <Icon name={courseIcon} size={19} />
                                                        </div>
                                                        <div className="min-w-0 flex-1 space-y-1">
                                                            <div className="flex flex-wrap items-center gap-1.5">
                                                                {c.code && <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)]">{c.code}</span>}
                                                                {c.trainingHours && <span className="font-mono text-[10px] text-[var(--neu-text-muted)]">• {c.trainingHours} ชม.</span>}
                                                            </div>
                                                            <p className="font-display font-bold text-sm text-[var(--neu-text)] leading-snug m-0">{c.titleTH}</p>
                                                            {(c.subtitleTH || c.titleEN) && <p className="text-[11px] text-[var(--neu-text-muted)] truncate m-0">{c.subtitleTH || c.titleEN}</p>}
                                                        </div>
                                                        <span className={`font-mono text-xs font-extrabold ${isSelected ? 'text-[var(--neu-teal)]' : 'text-[var(--neu-text-muted)]'}`}>{isSelected ? '✓' : '○'}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="space-y-1.5 text-xs">

                                                            <span className="font-display font-extrabold text-sm text-[var(--neu-text)]">{opt.label}</span>

                                                    </button>

                                        </div>
                                        {authProfile.professionGroup === 'พยาบาล' && (cneuConfig.activityCode || cneuConfig.cneuCredits) && (

                                                <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)] block">✓ สิทธิ์หน่วยคะแนนการศึกษาต่อเนื่องทางการพยาบาล (CNEU)</span>
                                                <span className="font-display font-bold text-sm text-[var(--neu-text)]">รหัสกิจกรรม CNEU: <b className="font-mono text-[var(--neu-teal)]">{cneuConfig.activityCode}</b> • {cneuConfig.cneuCredits} หน่วยคะแนน</span>
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                        <div><label className="block font-bold text-[var(--neu-text-sub)] mb-1 ml-1">คำนำหน้า ชื่อ–นามสกุล (ไทย) *</label><input required value={authProfile.name} onChange={e => setAuthProfile(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" /></div>

                                        <div><label className="block font-bold text-[var(--neu-text-sub)] mb-1 ml-1">ตำแหน่งปัจจุบัน</label><input value={authProfile.position} onChange={e => setAuthProfile(p => ({ ...p, position: e.target.value }))} className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" /></div>

                                        <div><label className="block font-bold text-[var(--neu-text-sub)] mb-1 ml-1">เบอร์โทรศัพท์</label><input value={authProfile.phone} onChange={e => setAuthProfile(p => ({ ...p, phone: e.target.value }))} placeholder="08x-xxx-xxxx" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" /></div>
                                        <div className="sm:col-span-2"><label className="block font-bold text-[var(--neu-text-sub)] mb-1 ml-1">อีเมลจริงสำหรับรับรหัส OTP 6 หลัก *</label><input required type="email" value={authProfile.email} onChange={e => setAuthProfile(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" className="touch-target neu-input w-full px-3.5 py-2.5 text-sm" /></div>

                                    </button>
                                </form>
                            )}

                            {authStep === 3 && (

                                <div className="space-y-1">
                                    <div className="flex flex-wrap items-center gap-2">

                                        </button>

                                <div className="neu-progress-track"><div className="neu-progress-fill" style={{ width: `${studyPct}%` }} /></div>

                                    <button type="button" onClick={() => { setQuizAnswers({}); setScreen('pretest'); }} className={`neu-step-pill ${user.pretest && user.pretest !== '-' ? 'is-done' : ''} p-3.5 text-left space-y-1`}>

                                        <p className="font-display font-bold text-sm text-[var(--neu-text)] m-0">{user.pretest && user.pretest !== '-' ? user.pretest : 'เริ่มทำ'}</p>

                                            <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)]">02. ชั่วโมงเรียน</span>
                                            <span className="text-[var(--neu-teal)] font-bold text-xs">{isStudyEnough ? '✓' : '●'}</span>
                                        </div>
                                        <p className="font-display font-bold text-sm text-[var(--neu-text)] m-0">{isExempt ? 'เทียบโอน 100%' : `${studyPct}%`}</p>

                                    <a href="./aiskilllab.html" onClick={() => saveSessionTwoLayer(user)} className={`neu-step-pill ${isLabDone ? 'is-done' : ''} p-3.5 text-left space-y-1 no-underline block`}>

                                            setQuizAnswers({}); setScreen('posttest');
                                        }}
                                        className={`neu-step-pill ${hasPassedPosttest ? 'is-done' : ''} p-3.5 text-left space-y-1 ${!canTakePosttest ? 'opacity-75' : ''}`}

                                        <div className="flex items-center justify-between">
                                            <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)]">04. POST-TEST</span>

                                        <p className="font-display font-bold text-sm text-[var(--neu-text)] m-0">{user.certificateCode ? 'ดาวน์โหลด' : 'PDF + QR'}</p>

                                                        aiSummaryLoading={aiSummaryLoading}

                                                        onPlayVoice={() => playStudioVoice(`lesson_${activeLessonKey}`, activeLessonSummaryText)}

                                                            allow="autoplay; fullscreen; picture-in-picture"

                                                    </div>
                                                )}
                                            </div>

                                            {showPdfPreview && activeLessonDocUrl && (

                                                    <div className="flex items-center justify-between gap-2">

                                                        <div className="flex items-center gap-2">
                                                            <a href={activeLessonDocUrl} target="_blank" rel="noreferrer" className="neu-btn px-3 py-1.5 text-[11px] font-bold">เปิดเต็มหน้าจอ ↗</a>
                                                            <button type="button" onClick={() => setShowPdfPreview(false)} className="neu-btn px-3 py-1.5 text-[11px] font-bold">ปิด ✕</button>
                                                        </div>
                                                    </div>
                                                    <div className="w-full h-[460px] rounded-xl overflow-hidden bg-white">
                                                        <iframe title="เอกสารประกอบการเรียน" src={activeLessonDocUrl} className="w-full h-full border-0" />
                                                    </div>
                                                </div>
                                            )}

                                            {/* Lesson Navigation & Complete Bar */}
                                            <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
                                                <button type="button" onClick={handleMarkLessonStudied} className="neu-btn-teal px-5 py-3 font-display font-bold text-xs sm:text-sm">
