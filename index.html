        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme_2030';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f8fafc');
        } catch (_) {}
      })();
    </script>

      .pb-dock-safe { padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); }
      .touch-target { min-height: 46px; touch-action: manipulation; }

      @media (max-width: 768px) {
        input, select, textarea { font-size: 16px !important; }
      }

      /* 🌟 Spatial Aura Ambient Backdrop 🌟 */
      .spatial-aura {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 12% 14%, var(--aura-1) 0%, transparent 44%),
          radial-gradient(circle at 88% 12%, var(--aura-2) 0%, transparent 44%),
          radial-gradient(circle at 60% 90%, var(--aura-3) 0%, transparent 48%);
        pointer-events: none;
      }
      .spatial-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(ellipse at center, black 45%, transparent 94%);
        pointer-events: none;
      }

      .spatial-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(155%);
        -webkit-backdrop-filter: blur(24px) saturate(155%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }

        backdrop-filter: blur(22px) saturate(150%);

        border-bottom: 1px solid var(--surface-border);

            if (!rawSets) return [parseRawExams(INITIAL_QUIZ_RAW)];
            const mapItem = (q, idx) => ({
                ...q,
                id: q.id || idx + 1,
                origIdx: typeof q.origIdx === 'number' ? q.origIdx : idx,
                domain: q.domain || QUESTION_DOMAIN_MAP[idx] || 'policy_ethics'
            });
            if (Array.isArray(rawSets)) return rawSets.map(set => (Array.isArray(set) ? set.map(mapItem) : []));
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k].map(mapItem) : []));
            }
            return [parseRawExams(INITIAL_QUIZ_RAW)];
        }

        /**
         * สุ่มลำดับข้อสอบและตัวเลือก โดยคงค่า domain & origIdx ไว้เพื่อให้ AI Diagnostic ทำงานแม่นยำ
         */
        function prepareShuffledExam(rawList) {
            const list = Array.isArray(rawList) && rawList.length > 0 ? rawList : parseRawExams(INITIAL_QUIZ_RAW);
            const shuffledQs = [...list].sort(() => Math.random() - 0.5);
            return shuffledQs.map((q, idx) => {
                const optsWithFlag = (q.options || []).map((text, i) => ({ text, isCorrect: i === Number(q.answer) }));
                const shuffledOpts = optsWithFlag.sort(() => Math.random() - 0.5);
                const newAnswerIdx = Math.max(0, shuffledOpts.findIndex(o => o.isCorrect));
                const origIdx = typeof q.origIdx === 'number' ? q.origIdx : ((Number(q.id) || idx + 1) - 1);
                return {
                    id: q.id || idx + 1,
                    origIdx,
                    domain: q.domain || QUESTION_DOMAIN_MAP[origIdx] || 'policy_ethics',
                    question: q.question,
                    options: shuffledOpts.map(o => o.text),
                    answer: newAnswerIdx
                };
            });
        }

        /**
         * AI Diagnostic Engine (งบ 0 บาท รันทันทีบนเบราว์เซอร์)
         * วิเคราะห์ผลการสอบแยกตาม 4 หมวดสมรรถนะคลินิก และจัดลำดับบทเรียนแนะนำเฉพาะบุคคล
         */
        function analyzeExamDiagnostics(questions, answers) {
            const buckets = {};
            Object.keys(CLINICAL_DOMAINS).forEach(k => {
                buckets[k] = { ...CLINICAL_DOMAINS[k], correct: 0, total: 0, percent: 100 };
            });

            (questions || []).forEach((q) => {
                const domKey = buckets[q.domain] ? q.domain : 'policy_ethics';
                buckets[domKey].total += 1;
                if (answers[q.id] === q.answer) {
                    buckets[domKey].correct += 1;
                }
            });

            const domainResults = Object.values(buckets).map(b => ({
                ...b,
                percent: b.total > 0 ? Math.round((b.correct / b.total) * 100) : 100
            }));

            // เรียงหมวดที่คะแนนน้อยที่สุดขึ้นก่อนเพื่อแนะนำให้โฟกัส
            const sortedWeakFirst = [...domainResults].sort((a, b) => a.percent - b.percent);
            const weakDomains = sortedWeakFirst.filter(d => d.percent < 80);
            const focusDomains = weakDomains.length > 0 ? weakDomains.slice(0, 2) : sortedWeakFirst.slice(0, 1);

            const recommendedLessonIds = Array.from(
                new Set(focusDomains.flatMap(d => d.lessonIds || []))
            ).slice(0, 6);

            const summaryText = weakDomains.length === 0
                ? 'พื้นฐานความรู้ทั้ง 4 หมวดอยู่ในเกณฑ์ยอดเยี่ยม! แนะนำทบทวนบทเรียนสำคัญและเข้าฝึกสื่อสารในห้องรับรอง AI Skill Lab 2030 ค่ะ'
                : `AI แนะนำให้โฟกัสหมวด "${focusDomains.map(d => d.shortName).join('" และ "')}" เป็นพิเศษ เพื่อยกระดับความมั่นใจก่อนเข้าฝึก AI Skill Lab และสอบ Post-test ค่ะ`;

            return {
                domains: domainResults,
                weakDomains,
                focusDomains,
                recommendedLessonIds,
                summaryText,
                updatedAt: new Date().toISOString()
            };
        }

        /**
         * ระบบตอบคำถาม AI Study Companion สำรองอัจฉริยะบนเครื่อง (ทำงานเมื่อ Offline หรือ Apps Script หน่วง)
         */
        function generateOfflineStudyAnswer(question, lesson) {
            const q = String(question || '').toLowerCase();
            const guide = LESSON_AI_GUIDES[lesson?.id];

            if (q.match(/อุณหภูมิ|ขนส่งไต|บรรจุไต|น้ำแข็ง/)) {
                return 'การบรรจุและขนส่งไต (Kidney Packaging) ต้องควบคุมอุณหภูมิที่ 2–4 องศาเซลเซียส โดยแช่ในน้ำแข็งเกล็ดที่กำลังละลายแบบปลอดเชื้อหลายชั้น และห้ามใช้น้ำแข็งแห้ง (-20°C) เพราะจะทำให้เนื้อเยื่อไตเสียหายค่ะ';
            }
            if (q.match(/สมองตาย|gcs|apnea|แพทย์กี่|6 ชม|lazarus|eeg/)) {
                return 'เกณฑ์ยืนยันภาวะสมองตายในผู้ใหญ่: ต้องมี GCS = 3, ตรวจยืนยันทางคลินิกอย่างน้อย 2 ครั้งห่างกันอย่างน้อย 6 ชั่วโมง และรับรองโดยแพทย์ 3 ท่านที่ไม่เกี่ยวข้องกับทีมปลูกถ่าย • Apnea Test พิสูจน์การหยุดทำงานถาวรของศูนย์หายใจที่ก้านสมอง • Lazarus Sign เป็นเพียงรีเฟล็กซ์ไขสันหลัง ส่วน EEG เป็นทางเลือกเสริมค่ะ';
            }
            if (q.match(/เบาจืด|ddavp|desmopressin|ความดัน|donor|ecmo/)) {
                return 'ในการดูแลผู้บริจาคสมองตาย (Donor Management): ขั้นแรกต้องรักษาสัญญาณชีพและความดันโลหิตให้คงที่ ภาวะที่พบบ่อยคือความดันโลหิตต่ำและภาวะเบาจืด (Diabetes Insipidus) ซึ่งนิยมคุมด้วยยา Desmopressin (DDAVP) และให้ยาปฏิชีวนะป้องกันการติดเชื้อค่ะ';
            }
            if (q.match(/decoupling|spikes|ญาติ|ห้องรับรอง|สื่อสาร|ชาติหน้า|คัดค้าน/)) {
                return 'หลักการสื่อสารกับญาติ (Family Approach): ใช้ห้องรับรองที่เป็นส่วนตัว (Setting ใน SPIKES), ทำ Decoupling (แยกการแจ้งข่าวสมองตายออกจากการขอรับบริจาค), รับรู้อารมณ์ร่วมและเว้นความเงียบ 2.5 วินาที, ไม่เร่งรัด และหากญาติสายตรงคัดค้านรุนแรงให้ยุติการจัดเก็บเพื่อเคารพจิตใจครอบครัวค่ะ';
            }
            if (q.match(/หัวใจ|ดวงตา|golden|ชั่วโมง|ตกแต่ง|hla/)) {
                return 'ตัวเลขคลินิกสำคัญ: ระยะเวลาทองของหัวใจไม่เกิน 4 ชั่วโมง • ดวงตาควรจัดเก็บภายใน 6–8 ชั่วโมง • การปลูกถ่ายไตให้ความสำคัญสูงสุดกับ HLA Typing • และขั้นตอนสุดท้ายที่สำคัญที่สุดคือดูแลตกแต่งร่างผู้บริจาคให้เรียบร้อยประณีตที่สุดค่ะ';
            }

            if (guide?.keyPoints?.length) {
                return `ประเด็นสำคัญประจำบทที่ ${lesson.id} (${lesson.title}):\n• ${guide.keyPoints.join('\n• ')}\n\nหากต้องการสอบถามรายละเอียดเฉพาะเจาะจง เช่น ตัวเลขเกณฑ์คลินิก ยาที่ใช้ หรือแนวทางคุยกับญาติ สามารถพิมพ์ถามเพิ่มได้เลยค่ะ`;
            }

            return `สำหรับบทที่ ${lesson?.id || ''} (${lesson?.title || ''}) แนะนำให้ทบทวนประเด็นหลัก 3 ส่วนคือ เกณฑ์การประเมินทางคลินิก บทบาทการประสานงานของทีมสหสาขาวิชาชีพ และจริยธรรมการดูแลผู้ป่วยและญาติค่ะ`;
        }

        function parsePosttestScore(posttestStr, minPercent = MIN_POSTTEST_PERCENT) {
            const m = String(posttestStr || '').match(/(\d+)\s*\/\s*(\d+)/);
            if (!m) return { score: 0, total: 0, percent: 0, passed: false };
            const score = parseInt(m[1], 10);
            const total = parseInt(m[2], 10) || 1;
            const percent = Math.round((score / total) * 100);
            return { score, total, percent, passed: (score / total) >= (minPercent / 100) };
        }

        function formatDurationTH(totalSeconds) {
            const sec = Math.max(0, Math.floor(totalSeconds || 0));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) return `${h} ชม. ${m} นาที`;
            if (m > 0) return `${m} นาที ${s} วินาที`;
            return `${s} วินาที`;
        }

        function formatTimerMMSS(sec) {
            const s = Math.max(0, Math.floor(sec || 0));
            return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }

        function formatThaiDate(isoStr) {
            try {
                const d = isoStr ? new Date(isoStr) : new Date();
                return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (_) {
                return '';
            }
        }

        function generateCertificateCode(prefix = 'RJC-2027') {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let rand = '';
            for (let i = 0; i < 6; i++) rand += chars[Math.floor(Math.random() * chars.length)];
            return `${prefix || 'RJC-2027'}-${rand}`;
        }

        function loadImageSafe(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        function createQrCanvas(urlText, size = 220) {
            return new Promise((resolve) => {
                if (!window.QRCode) return resolve(null);
                const holder = document.createElement('div');
                holder.style.position = 'fixed';
                holder.style.left = '-9999px';
                document.body.appendChild(holder);
                try {
                    new window.QRCode(holder, {
                        text: urlText,
                        width: size,
                        height: size,
                        colorDark: '#064e3b',
                        colorLight: '#ffffff',
                        correctLevel: window.QRCode.CorrectLevel.M
                    });
                    setTimeout(() => {
                        const qrCanvas = holder.querySelector('canvas');
                        const qrImg = holder.querySelector('img');
                        let result = null;
                        if (qrCanvas) {
                            result = qrCanvas;
                        } else if (qrImg && qrImg.src) {
                            const c = document.createElement('canvas');
                            c.width = size;
                            c.height = size;
                            const ctx = c.getContext('2d');
                            ctx.drawImage(qrImg, 0, 0, size, size);
                            result = c;
                        }
                        if (holder.parentNode) holder.parentNode.removeChild(holder);
                        resolve(result);
                    }, 120);
                } catch (_) {
                    if (holder.parentNode) holder.parentNode.removeChild(holder);
                    resolve(null);
                }
            });
        }

        /**
         * วาดประกาศนียบัตรอิเล็กทรอนิกส์ความละเอียดสูง (A4 Landscape 2000x1414) พร้อมพิมพ์และฝัง QR ตรวจสอบได้จริง
         */
        async function renderFullCertificateCanvas(canvas, user, tpl, verifyUrl) {
            if (!canvas || !user) return;
            const W = 2000, H = 1414;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#ffffff');
            bg.addColorStop(0.55, '#f8fafc');
            bg.addColorStop(1, '#ecfdf5');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            const g1 = ctx.createRadialGradient(240, 200, 20, 240, 200, 560);
            g1.addColorStop(0, 'rgba(16, 185, 129, 0.16)');
            g1.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, W, H);

            const g2 = ctx.createRadialGradient(W - 240, H - 200, 20, W - 240, H - 200, 580);
            g2.addColorStop(0, 'rgba(14, 165, 233, 0.14)');
            g2.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 8;
            ctx.strokeRect(56, 56, W - 112, H - 112);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(76, 76, W - 152, H - 152);

            ctx.fillStyle = '#059669';
            ctx.fillRect(W / 2 - 230, 56, 460, 14);

            const [logoImg, sigImg, qrCanvas] = await Promise.all([
                loadImageSafe(tpl.logoUrl),
                loadImageSafe(tpl.signatureUrl),
                createQrCanvas(verifyUrl, 220)
            ]);

            let topY = 175;
            if (logoImg) {
                const maxH = 105;
                const drawW = maxH * (logoImg.width / (logoImg.height || 1));
                ctx.drawImage(logoImg, W / 2 - drawW / 2, 100, drawW, maxH);
                topY = 248;
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#047857';
            ctx.font = '700 34px "Prompt", sans-serif';
            ctx.fillText(tpl.orgTitleTH || DEFAULT_CERT_TEMPLATE.orgTitleTH, W / 2, topY);

            ctx.fillStyle = '#64748b';
            ctx.font = '600 22px "JetBrains Mono", monospace';
            ctx.fillText(tpl.orgTitleEN || DEFAULT_CERT_TEMPLATE.orgTitleEN, W / 2, topY + 46);

            ctx.fillStyle = '#0f172a';
            ctx.font = '800 72px "Prompt", sans-serif';
            ctx.fillText('ประกาศนียบัตร', W / 2, topY + 165);

            ctx.fillStyle = '#475569';
            ctx.font = '500 32px "Sarabun", sans-serif';
            ctx.fillText(tpl.subtitleTH || DEFAULT_CERT_TEMPLATE.subtitleTH, W / 2, topY + 235);

            ctx.fillStyle = '#064e3b';
            ctx.font = '800 74px "Prompt", sans-serif';
            ctx.fillText(user.name || 'ผู้สำเร็จการอบรม', W / 2, topY + 345);

            const subMeta = [
                user.hospital || 'เครือข่าย rjcloud.organ',
                user.license ? `เลขที่ใบอนุญาต ${user.license}` : ''
            ].filter(Boolean).join('  •  ');

            ctx.fillStyle = '#64748b';
            ctx.font = '600 28px "Sarabun", sans-serif';
            ctx.fillText(subMeta, W / 2, topY + 408);

            ctx.fillStyle = '#334155';
            ctx.font = '500 31px "Sarabun", sans-serif';
            ctx.fillText(tpl.completionTextTH || DEFAULT_CERT_TEMPLATE.completionTextTH, W / 2, topY + 492);

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 38px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleTH || DEFAULT_CERT_TEMPLATE.courseTitleTH, W / 2, topY + 562);

            ctx.fillStyle = '#0284c7';
            ctx.font = '600 24px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleEN || DEFAULT_CERT_TEMPLATE.courseTitleEN, W / 2, topY + 610);

            const postInfo = parsePosttestScore(user.posttest);
            const scoreLine = postInfo.total > 0
                ? `ผลประเมิน Post-test: ${user.posttest} (${postInfo.percent}%) • วันที่ออกประกาศนียบัตร ${formatThaiDate(user.certificateIssuedAt)}`
                : `วันที่ออกประกาศนียบัตร ${formatThaiDate(user.certificateIssuedAt)}`;

            ctx.fillStyle = '#047857';
            ctx.font = '600 25px "Sarabun", sans-serif';
            ctx.fillText(scoreLine, W / 2, topY + 670);

            const sigBaseY = H - 250;
            if (sigImg) {
                const sigH = 92;
                const sigW = sigH * (sigImg.width / (sigImg.height || 1));
                ctx.drawImage(sigImg, W / 2 - sigW / 2, sigBaseY - 96, sigW, sigH);
            }

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 240, sigBaseY);
            ctx.lineTo(W / 2 + 240, sigBaseY);
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 30px "Prompt", sans-serif';
            ctx.fillText(tpl.signerName || DEFAULT_CERT_TEMPLATE.signerName, W / 2, sigBaseY + 48);

            ctx.fillStyle = '#64748b';
            ctx.font = '500 24px "Sarabun", sans-serif';
            ctx.fillText(tpl.signerPosition || DEFAULT_CERT_TEMPLATE.signerPosition, W / 2, sigBaseY + 86);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#475569';
            ctx.font = '700 22px "JetBrains Mono", monospace';
            ctx.fillText(`CERTIFICATE NO: ${user.certificateCode || 'RJC-2027-VERIFIED'}`, 120, H - 150);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 20px "Sarabun", sans-serif';
            ctx.fillText('ตรวจสอบความถูกต้องผ่าน QR Code ที่ rjcloud.organ', 120, H - 114);

            const qrBoxSize = 210;
            const qrX = W - 120 - qrBoxSize;
            const qrY = H - 115 - qrBoxSize;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.fillRect(qrX - 14, qrY - 14, qrBoxSize + 28, qrBoxSize + 28);
            ctx.strokeRect(qrX - 14, qrY - 14, qrBoxSize + 28, qrBoxSize + 28);

            if (qrCanvas) {
                ctx.drawImage(qrCanvas, qrX, qrY, qrBoxSize, qrBoxSize);
            } else {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#059669';
                ctx.font = '700 22px "JetBrains Mono", monospace';
                ctx.fillText('QR VERIFY', qrX + qrBoxSize / 2, qrY + qrBoxSize / 2);
            }
        }

        // ============================================================================
        // 4. ERROR BOUNDARY & ADAPTIVE 2030 UI PRIMITIVES (NO alert() / confirm())

        class AppErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, err: null };
            }
            static getDerivedStateFromError(err) { return { hasError: true, err }; }
            componentDidCatch(err, info) { console.error('App ErrorBoundary:', err, info); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6">
                            <div className="spatial-card max-w-md w-full rounded-3xl p-6 text-center space-y-4 border-rose-500/40">
                                <h2 className="font-display font-bold text-lg text-rose-400">พบข้อผิดพลาดในการแสดงผล</h2>
                                <p className="text-xs font-mono bg-rose-500/10 text-rose-300 p-3 rounded-xl overflow-auto">
                                    {String(this.state.err?.message || this.state.err)}
                                </p>
                                <button
                                    type="button"
                                    onClick={() => window.location.reload()}
                                    className="touch-target w-full py-3 rounded-2xl bg-aurora-500 text-void-950 font-display font-bold text-sm"
                                >
                                    โหลดหน้าใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-2xl flex items-center gap-2.5 text-xs sm:text-sm font-bold ${
                        toast.type === 'error'
                            ? 'bg-rose-950/95 border-rose-400/50 text-rose-100'
                            : toast.type === 'info'
                                ? 'bg-sky-950/95 border-prism-400/50 text-prism-100'
                                : 'bg-emerald-950/95 border-aurora-400/50 text-aurora-100'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Sparkles' : 'CheckCircle2'} size={17} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="fixed inset-0 z-[135] bg-slate-950/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="spatial-card w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] space-y-4">
                        <div className="flex items-start gap-3.5">
                            <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${
                                dialog.danger ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'
                            }`}>
                                <Icon name={dialog.danger ? 'AlertTriangle' : 'HelpCircle'} size={22} />
                            </div>
                            <div>
                                <h3 className="font-display font-bold text-lg text-primary-adaptive">{dialog.title}</h3>
                                <p className="text-sm text-secondary-adaptive mt-1 leading-relaxed">{dialog.message}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-display font-semibold text-sm"
                            >
                                ยกเลิก
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    const fn = dialog.onConfirm;
                                    onClose();
                                    if (fn) fn();
                                }}
                                className={`touch-target py-3 rounded-2xl font-display font-bold text-sm ${
                                    dialog.danger
                                        ? 'bg-rose-600 hover:bg-rose-500 text-white'
                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950'
                                }`}
                            >
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function FormField({ label, ...props }) {
            return (
                <div className="w-full">
                    {label && <label className="block text-xs font-bold text-secondary-adaptive mb-1.5 ml-1">{label}</label>}
                    <input
                        className="touch-target spatial-input w-full px-4 py-3 rounded-2xl text-sm font-medium transition-all disabled:opacity-55"
                        {...props}
                    />
                </div>
            );
        }

        function FormSelect({ label, options, ...props }) {
            return (
                <div className="w-full">
                    {label && <label className="block text-xs font-bold text-secondary-adaptive mb-1.5 ml-1">{label}</label>}
                    <select
                        className="touch-target spatial-input w-full px-4 py-3 rounded-2xl text-sm font-medium transition-all"
                        {...props}
                    >
                        {options.map((opt) => (
                            <option key={opt.value ?? opt} value={opt.value ?? opt}>
                                {opt.label ?? opt}
                            </option>
                        ))}
                    </select>
                </div>
            );
        }

        // ============================================================================
        // 5. MAIN LEARNER APPLICATION (2030 SPATIAL OS + AI STUDY COMPANION)
        // ============================================================================
        function App() {
            const initialAdminPreview = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);

            // Adaptive Theme State (default: Spatial Dark 2030, user switchable anytime)
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f8fafc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => {
                setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            const [adminPreviewMode, setAdminPreviewMode] = useState(initialAdminPreview);
            const [inspectorBarExpanded, setInspectorBarExpanded] = useState(true);

            // 1. Session & Navigation States
            const [user, setUser] = useState(() => {
                if (initialAdminPreview) return null;
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (initialAdminPreview) return 'landing';
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user) return 'dashboard';
                } catch (_) {}
                return 'landing';
            }); // landing | auth | quiz | quiz_result | quiz_fail | cert_confirm | certificate | dashboard

            const [activeTab, setActiveTab] = useState('video'); // video | live | leaderboard | profile
            const [adminTapCount, setAdminTapCount] = useState(0);

            // 2. Cloud Config & Content States
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [certTemplate, setCertTemplate] = useState(() => {
                try {
                    const saved = localStorage.getItem('rjcloud_cert_template_v2027');
                    if (saved) return { ...DEFAULT_CERT_TEMPLATE, ...JSON.parse(saved) };
                } catch (_) {}
                return { ...DEFAULT_CERT_TEMPLATE };
            });
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 8,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });
            const [lessons, setLessons] = useState(INITIAL_LESSONS);
            const [questionSets, setQuestionSets] = useState([parseRawExams(INITIAL_QUIZ_RAW)]);
            const [leaderboard, setLeaderboard] = useState([]);

            // 3. Auth Wizard States (3 Steps)
            const [authStep, setAuthStep] = useState(1);
            const [licenseInput, setLicenseInput] = useState('');
            const [existingUserData, setExistingUserData] = useState(null);
            const [profileForm, setProfileForm] = useState({
                name: '',
                license: '',
                userType: 'เรียนใหม่',
                email: '',
                phone: '',
                position: 'พยาบาลวิชาชีพ',
                workContext: 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                department: 'กรมการแพทย์',
                hospital: 'รพ.ราชวิถี',
                province: 'กรุงเทพมหานคร'
            });
            const [otpInput, setOtpInput] = useState('');
            const [fallbackOtpCode, setFallbackOtpCode] = useState('');
            const [isBusy, setIsBusy] = useState(false);

            // 4. Classroom & Study Time Tracking States
            const [currentLessonId, setCurrentLessonId] = useState(() => user?.lastVideoId || INITIAL_LESSONS[0]?.id || 1);
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));

            // 5. Quiz & AI Diagnostic / Remediation States (2030)
            const [quiz, setQuiz] = useState({
                type: 'pretest',
                questions: [],
                idx: 0,
                answers: {},
                score: 0,
                timeLeft: 2700,
                finished: false
            });
            const [lastDiagnosis, setLastDiagnosis] = useState(() => user?.aiRoadmap || null);
            const [aiRemediationNote, setAiRemediationNote] = useState('');
            const [isFetchingAiNote, setIsFetchingAiNote] = useState(false);

            // 6. AI Study Companion Panel States (beside video theater)
            const [companionTab, setCompanionTab] = useState('cheat'); // cheat | check | ask
            const [microCheckPick, setMicroCheckPick] = useState({});  // { [lessonId]: optionIdx }
            const [aiChatInput, setAiChatInput] = useState('');
            const [aiChatHistory, setAiChatHistory] = useState([]);
            const [isAiChatLoading, setIsAiChatLoading] = useState(false);

            // 7. CSAT & Certificate States
            const [csatRating, setCsatRating] = useState(5);
            const [csatComment, setCsatComment] = useState('');
            const [certFormName, setCertFormName] = useState('');
            const [certFormHosp, setCertFormHosp] = useState('');
            const [isRenderingCert, setIsRenderingCert] = useState(false);

            // 8. Global UI Feedback
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            // Refs
            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);
            const certCanvasRef = useRef(null);
            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3600);
            }, []);

            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            const handleAdminGearTap = () => {
                const next = adminTapCount + 1;
                if (next >= 3) {
                    setAdminTapCount(0);
                    window.location.href = './admin.html';
                } else {
                    setAdminTapCount(next);
                    showToast(`แตะอีก ${3 - next} ครั้งเพื่อเข้าสู่ระบบผู้ดูแล (Admin)`, 'info');
                }
            };

            const targetStudySeconds = useMemo(() => Math.max(1, Number(liveConfig.hours || 8)) * 3600, [liveConfig.hours]);
            const studyPercent = useMemo(() => {
                const livePct = Math.min(100, Math.round((studySeconds / targetStudySeconds) * 100));
                return Math.max(livePct, Number(user?.progress || 0));
            }, [studySeconds, targetStudySeconds, user?.progress]);

            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyRequirementMet = studyPercent >= MIN_STUDY_PERCENT;
            const hasPassedSkillLab = Boolean(
                user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0)
            );
            const posttestInfo = useMemo(() => parsePosttestScore(user?.posttest, MIN_POSTTEST_PERCENT), [user?.posttest]);
            const canEnterSkillLab = Boolean(adminPreviewMode || (hasDonePretest && isStudyRequirementMet));
            const canTakePosttest = Boolean(adminPreviewMode || liveConfig.allowPosttest || (hasDonePretest && isStudyRequirementMet && hasPassedSkillLab));
            const canClaimCertificate = Boolean(adminPreviewMode || posttestInfo.passed);
            const recommendedIds = useMemo(() => (lastDiagnosis?.recommendedLessonIds || user?.aiRoadmap?.recommendedLessonIds || []), [lastDiagnosis, user?.aiRoadmap]);

            const callAppsScript = useCallback(async (payload) => {
                const targetUrl = appsScriptUrl || CONFIG.appsScriptUrl;
                if (!targetUrl) return { status: 'error', message: 'ยังไม่ได้ตั้งค่า Apps Script URL' };
                try {
                    const res = await fetch(targetUrl, { method: 'POST', body: JSON.stringify(payload) });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message || 'Failed to fetch' };
                }
            }, [appsScriptUrl]);

            const persistUser = useCallback(async (nextUser, syncCloud = false) => {
                if (!nextUser) return;
                setUser(nextUser);
                if (adminPreviewMode || String(nextUser.id).startsWith('admin_preview_')) return;

                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: nextUser }));
                } catch (_) {}

                if (syncCloud && isCloudConfigured && fbDb && nextUser.id && !String(nextUser.id).startsWith('demo_')) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            nextUser,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Cloud user persist warning:', err);
                    }
                }
            }, [adminPreviewMode]);

            // 1. เชื่อมต่อ Firebase (PDPA-Safe)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let unsubSettings = null;
                let unsubContent = null;
                let unsubLeader = null;

                signInAnonymously(fbAuth).catch(err => console.warn('Anon auth warning:', err));

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!fbUser) return;

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                            if (d.liveConfig) setLiveConfig(prev => ({ ...prev, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(prev => ({ ...prev, ...d.certTemplate }));
                        },
                        () => {}
                    );

                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );

                    unsubLeader = onSnapshot(
                        collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard'),
                        (snap) => {
                            const list = [];
                            snap.forEach(docItem => list.push({ id: docItem.id, ...docItem.data() }));
                            list.sort((a, b) => (b.score || 0) - (a.score || 0));
                            setLeaderboard(list.slice(0, 20));
                        },
                        () => {}
                    );

                    const curU = userRef.current;
                    if (!adminPreviewMode && curU?.id && !String(curU.id).startsWith('demo_') && !String(curU.id).startsWith('admin_preview_')) {
                        try {
                            const uSnap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(curU.id)));
                            if (uSnap.exists()) {
                                const cloudU = uSnap.data();
                                const merged = {
                                    ...curU,
                                    ...cloudU,
                                    studySeconds: Math.max(Number(curU.studySeconds || 0), Number(cloudU.studySeconds || 0)),
                                    progress: Math.max(Number(curU.progress || 0), Number(cloudU.progress || 0))
                                };
                                setStudySeconds(merged.studySeconds);
                                if (merged.aiRoadmap) setLastDiagnosis(merged.aiRoadmap);
                                persistUser(merged, false);
                            }
                        } catch (_) {}
                    }
                });

                return () => {
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                    if (unsubLeader) unsubLeader();
                };
            }, [adminPreviewMode, persistUser]);

            useEffect(() => {
                if (adminPreviewMode) return;
                if (window.location.hash === '#dashboard' && userRef.current) {
                    setScreen('dashboard');
                }
            }, [adminPreviewMode]);

            useEffect(() => {
                if (adminPreviewMode) return;
                if (!user && !['landing', 'auth'].includes(screen)) {
                    setScreen('landing');
                }
            }, [user, screen, adminPreviewMode]);

            // 2. นับเวลาเรียนเฉพาะตอนเปิดหน้าจอ (Page Visibility API)
            useEffect(() => {
                if (adminPreviewMode || screen !== 'dashboard' || !user) return;
                if (!['video', 'live'].includes(activeTab)) return;

                let tickCount = 0;
                const interval = setInterval(() => {
                    if (document.hidden) return;
                    setStudySeconds(prev => {
                        const nextSec = prev + 1;
                        tickCount += 1;
                        if (tickCount % 30 === 0 && userRef.current) {
                            const nextPct = Math.min(100, Math.round((nextSec / targetStudySeconds) * 100));
                            const updated = {
                                ...userRef.current,
                                studySeconds: nextSec,
                                progress: Math.max(Number(userRef.current.progress || 0), nextPct),
                                lastVideoId: currentLessonId
                            };
                            persistUser(updated, true);
                        }
                        return nextSec;
                    });
                }, 1000);

                const flushProgress = () => {
                    if (!userRef.current || adminPreviewMode) return;
                    const sec = studySecondsRef.current;
                    const nextPct = Math.min(100, Math.round((sec / targetStudySeconds) * 100));
                    const updated = {
                        ...userRef.current,
                        studySeconds: sec,
                        progress: Math.max(Number(userRef.current.progress || 0), nextPct),
                        lastVideoId: currentLessonId
                    };
                    persistUser(updated, true);
                };

                const onVisChange = () => { if (document.hidden) flushProgress(); };
                window.addEventListener('beforeunload', flushProgress);
                document.addEventListener('visibilitychange', onVisChange);

                return () => {
                    clearInterval(interval);
                    window.removeEventListener('beforeunload', flushProgress);
                    document.removeEventListener('visibilitychange', onVisChange);
                };
            }, [screen, activeTab, user?.id, currentLessonId, targetStudySeconds, adminPreviewMode, persistUser]);

            // 3. นับถอยหลังเวลาทำข้อสอบ
            useEffect(() => {
                if (screen !== 'quiz' || quiz.finished) return;
                const timer = setInterval(() => {
                    setQuiz(prev => {
                        if (prev.finished || prev.timeLeft <= 0) return prev;
                        return { ...prev, timeLeft: prev.timeLeft - 1 };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [screen, quiz.finished]);

            // 4. วาดใบประกาศนียบัตรลง Canvas
            useEffect(() => {
                if (screen !== 'certificate' || !user || !certCanvasRef.current) return;
                let active = true;
                setIsRenderingCert(true);
                const verifyUrl = `${window.location.origin}${window.location.pathname.replace(/index\.html$/i, '')}verify.html?code=${encodeURIComponent(user.certificateCode || 'RJC-2027-DEMO01')}`;
                renderFullCertificateCanvas(certCanvasRef.current, user, certTemplate, verifyUrl)
                    .finally(() => { if (active) setIsRenderingCert(false); });
                return () => { active = false; };
            }, [screen, user, certTemplate]);

            // ============================================================================
            // 6. AUTH WIZARD HANDLERS (เฉพาะสิทธิ์ เรียนใหม่ / เรียนต่อเนื่อง)
            // ============================================================================
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = licenseInput.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (cleanLic.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพให้ถูกต้อง (อย่างน้อย 4 หลัก)', 'error');
                    return;
                }

                setIsBusy(true);
                let foundUser = null;

                if (isCloudConfigured && fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) foundUser = { id: snap.id, ...snap.data() };
                    } catch (err) {
                        console.warn('License cloud lookup warning:', err);
                    }
                }

                if (!foundUser) {
                    try {
                        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                        if (saved?.user && String(saved.user.license || saved.user.id) === cleanLic) {
                            foundUser = saved.user;
                        }
                    } catch (_) {}
                }

                setExistingUserData(foundUser);

                if (foundUser) {
                    const dept = foundUser.department && HOSPITAL_MAPPING[foundUser.department] ? foundUser.department : 'กรมการแพทย์';
                    setProfileForm({
                        name: foundUser.name || '',
                        license: cleanLic,
                        userType: 'เรียนต่อเนื่อง',
                        email: foundUser.email || '',
                        phone: foundUser.phone || '',
                        position: foundUser.position || 'พยาบาลวิชาชีพ',
                        workContext: foundUser.workContext || 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                        department: dept,
                        hospital: foundUser.hospital || HOSPITAL_MAPPING[dept][0]?.name || 'รพ.ราชวิถี',
                        province: foundUser.province || HOSPITAL_MAPPING[dept][0]?.prov || 'กรุงเทพมหานคร'
                    });
                    showToast('พบประวัติการเรียนเดิม! ตั้งสิทธิ์เป็น "เรียนต่อเนื่อง" และดึงความคืบหน้าเดิมให้แล้วค่ะ');
                } else {
                    setProfileForm(prev => ({ ...prev, license: cleanLic, userType: 'เรียนใหม่' }));
                }

                setIsBusy(false);
                setAuthStep(2);
            };

            const handleDepartmentChange = (dept) => {
                const list = HOSPITAL_MAPPING[dept] || [{ name: 'อื่นๆ', prov: '' }];
                setProfileForm(prev => ({
                    ...prev,
                    department: dept,
                    hospital: list[0]?.name || '',
                    province: list[0]?.prov || ''
                }));
            };

            const handleHospitalChange = (hospName) => {
                const list = HOSPITAL_MAPPING[profileForm.department] || [];
                const hit = list.find(h => h.name === hospName);
                setProfileForm(prev => ({ ...prev, hospital: hospName, province: hit?.prov ?? prev.province }));
            };

            const handleRequestOtp = async (e) => {
                e.preventDefault();
                if (!profileForm.name.trim() || !profileForm.email.trim()) {
                    showToast('กรุณากรอกชื่อ-นามสกุล และอีเมลสำหรับรับรหัส OTP ค่ะ', 'error');
                    return;
                }
                setIsBusy(true);
                setFallbackOtpCode('');
                setOtpInput('');

                const res = await callAppsScript({
                    action: 'requestOTP',
                    email: profileForm.email.trim(),
                    name: profileForm.name.trim()
                });

                setIsBusy(false);

                if (res?.status === 'success') {
                    showToast(`ส่งรหัส OTP 6 หลักไปยัง ${profileForm.email.trim()} แล้วค่ะ`);
                    setAuthStep(3);
                } else {
                    const tempCode = String(Math.floor(100000 + Math.random() * 900000));
                    setFallbackOtpCode(tempCode);
                    showToast('ระบบส่งอีเมลขัดข้องชั่วคราว ออกรหัส OTP สำรองบนหน้าจอให้แล้วค่ะ', 'info');
                    setAuthStep(3);
                }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                const code = otpInput.replace(/[^0-9]/g, '');
                if (code.length !== 6) {
                    showToast('กรุณากรอกรหัส OTP 6 หลักให้ครบถ้วนค่ะ', 'error');
                    return;
                }

                setIsBusy(true);
                let verified = false;

                if (fallbackOtpCode) {
                    verified = (code === fallbackOtpCode);
