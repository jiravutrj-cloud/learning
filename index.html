<head>

    <title>rjcloud.organ 2.0 — Organ Transplantation Center of Rajavithi Hospital</title>

    <!-- ซิงค์โหมดมืด/สว่าง + โหลดไฟล์ร่วมเฉพาะเมื่ออยู่บนโดเมนเว็บจริง (ป้องกัน 404 ในโหมดพรีวิว) -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('rjcloud_theme') || 'dark';
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&
            loc.origin !== 'null' &&
            !/(googleusercontent|webcontainer|stackblitz|sandbox|srcdoc|blob:)/i.test(loc.href);
          if (isRealHost) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './styles.css';
            document.head.appendChild(css);

            ['./data.js', './learning-core.js', './cert-engine.js', './keynote-launch.js'].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

    <!-- Tailwind CSS, jsPDF, QR Generator & ฟอนต์ภาษาไทยสไตล์ Apple -->

    <style>
      /* ============================================================================
       * 1. ADAPTIVE THEME TOKENS (DARK & LIGHT MODE)
       * ============================================================================ */
      :root, html[data-theme="dark"] {
        --bg-page: #020612;
        --text-main: #f8fafc;
        --text-secondary: #dbeafe;
        --text-muted: #93b4d8;
        --glass-bg: linear-gradient(145deg, rgba(16, 40, 86, 0.56) 0%, rgba(5, 16, 40, 0.86) 100%);
        --glass-border: rgba(186, 230, 253, 0.24);
        --glass-shadow: 0 24px 54px -18px rgba(0, 8, 28, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        --header-bg: rgba(4, 12, 30, 0.86);
        --surface-soft: rgba(147, 197, 253, 0.08);
        --surface-soft-hover: rgba(147, 197, 253, 0.16);
        --surface-border: rgba(186, 230, 253, 0.18);
        --input-bg: rgba(6, 18, 44, 0.86);
        --input-border: rgba(147, 197, 253, 0.3);
        --input-text: #f8fafc;
        --accent-text: #6ee7b7;
        --accent-prism: #67e8f9;
        --grid-line: rgba(147, 197, 253, 0.055);
        --aura-1: rgba(22, 92, 196, 0.34);
        --aura-2: rgba(56, 189, 248, 0.22);
        --aura-3: rgba(168, 85, 247, 0.16);
      }
      html[data-theme="light"] {
        --bg-page: #edf6fd;
        --text-main: #0c1b33;
        --text-secondary: #284366;
        --text-muted: #5a7496;
        --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.94) 0%, rgba(232, 244, 253, 0.86) 100%);
        --glass-border: rgba(255, 255, 255, 0.96);
        --glass-shadow: 0 18px 42px -14px rgba(15, 58, 125, 0.14);
        --header-bg: rgba(244, 250, 255, 0.9);
        --surface-soft: rgba(255, 255, 255, 0.82);
        --surface-soft-hover: rgba(255, 255, 255, 0.98);
        --surface-border: rgba(125, 175, 226, 0.32);
        --input-bg: rgba(255, 255, 255, 0.95);
        --input-border: rgba(148, 184, 222, 0.65);
        --input-text: #0c1b33;
        --accent-text: #047857;
        --accent-prism: #0369a1;
        --grid-line: rgba(22, 92, 196, 0.04);
        --aura-1: rgba(75, 152, 232, 0.24);
        --aura-2: rgba(169, 214, 247, 0.36);
        --aura-3: rgba(192, 132, 252, 0.14);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Anuphan', 'Sarabun', sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.28s ease, color 0.28s ease;
      }

      .touch-target { min-height: 46px; touch-action: manipulation; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      @media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }

      .spatial-aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 90% 55% at 50% 108%, var(--aura-1) 0%, transparent 66%),
          radial-gradient(circle at 86% 14%, var(--aura-2) 0%, transparent 48%),
          radial-gradient(circle at 14% 28%, var(--aura-3) 0%, transparent 46%);
      }
      .spatial-grid {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at center, black 42%, transparent 94%);
      }
      .spatial-card {
        background: var(--glass-bg);
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      .spatial-header {
        background: var(--header-bg);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border-bottom: 1px solid var(--surface-border);
      }
      .spatial-soft { background: var(--surface-soft); border: 1px solid var(--surface-border); transition: background 0.18s ease, border-color 0.18s ease; }
      .spatial-soft:hover { background: var(--surface-soft-hover); }
      .spatial-input { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); }
      .spatial-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22); }

      /* ปุ่ม Pill หลัก พร้อมแสงสะท้อนพาดผ่านแบบ GPU Transform นุ่มละมุน */
      .rjc2-pill-btn {
        position: relative;
        overflow: hidden;
        background: linear-gradient(95deg, #d7fbe6 0%, #c6f3f9 48%, #b3c8ff 100%);
        color: #050b16 !important;
        box-shadow: 0 10px 28px -8px rgba(134, 239, 172, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.72) inset;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
        text-decoration: none;
        cursor: pointer;
      }
      .rjc2-pill-btn::after {
        content: '';
        position: absolute;
        top: -24%;
        left: 0;
        width: 56%;
        height: 148%;
        background: linear-gradient(105deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.38) 50%, rgba(255, 255, 255, 0) 100%);
        transform: translate3d(-150%, 0, 0) skewX(-22deg);
        will-change: transform, opacity;
        pointer-events: none;
        animation: btnSheenSweep 6.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .rjc2-pill-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 16px 36px -8px rgba(147, 197, 253, 0.62), 0 0 24px rgba(187, 247, 208, 0.45), 0 0 0 1.25px rgba(255, 255, 255, 0.88) inset;
      }
      .rjc2-pill-btn:active { transform: scale(0.97); }

      /* ปุ่มบริการสาธารณะ & ปุ่มติดตั้ง PWA ด้านล่างหน้าแรก (สีเข้มคมชัดตลอดเวลา ไม่กลืนขาวในโหมดสว่าง) */
      .landing-service-pill {
        background: linear-gradient(145deg, rgba(7, 24, 58, 0.84) 0%, rgba(4, 14, 38, 0.92) 100%);
        border: 1px solid rgba(186, 230, 253, 0.38);
        color: #f0f9ff !important;
        box-shadow: 0 10px 24px -8px rgba(0, 8, 28, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.16);
        transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
        text-decoration: none;
        cursor: pointer;
      }
      .landing-service-pill:hover {
        background: linear-gradient(145deg, rgba(14, 42, 92, 0.92) 0%, rgba(8, 24, 60, 0.96) 100%);
        border-color: rgba(110, 231, 183, 0.68);
        transform: translateY(-1.5px);
      }
      .landing-service-pill:active { transform: scale(0.97); }

      .landing-install-pill {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.24) 0%, rgba(14, 165, 233, 0.28) 100%), rgba(5, 20, 48, 0.88);
        border: 1px solid rgba(110, 231, 183, 0.58);
        color: #d1fae5 !important;
        box-shadow: 0 10px 26px -8px rgba(16, 185, 129, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.22);
        transition: transform 0.18s ease, border-color 0.18s ease;
        cursor: pointer;
      }
      .landing-install-pill:hover {
        border-color: rgba(167, 243, 208, 0.92);
        transform: translateY(-1.5px);
      }
      .landing-install-pill:active { transform: scale(0.97); }

      .text-primary-adaptive { color: var(--text-main); }
      .text-secondary-adaptive { color: var(--text-secondary); }
      .text-muted-adaptive { color: var(--text-muted); }
      .text-accent-adaptive { color: var(--accent-text); }
      .text-prism-adaptive { color: var(--accent-prism); }
      html[data-theme="dark"] select option { background-color: #061229; color: #f8fafc; }

      /* ============================================================================
       * 2. EPIC LANDING HERO ATMOSPHERE & LIQUID GLASS CHAMBER (ULTRA-SMOOTH & SOFT)
       * ============================================================================ */
      .hero-atmosphere {
        isolation: isolate;
        contain: layout paint;
        background: linear-gradient(
          180deg,
          #000000 0%,
          #000000 21%,
          #030c1e 36%,
          #07255e 52%,
          #165cc4 70%,
          #4b98e8 85%,
          #a9d6f7 95%,
          #c9e7fc 100%
        );
      }
      .lower-landing-bg {
        background: linear-gradient(
          180deg,
          #c9e7fc 0%,
          #93c5f0 10%,
          #16448e 36%,
          #061430 68%,
          #020612 100%
        );
      }

      .liquid-glass-backdrop {
        clip-path: url(#idxLiquidGlassClipNorm);
        -webkit-clip-path: url(#idxLiquidGlassClipNorm);
        background: radial-gradient(
          circle at var(--gx, 32%) var(--gy, 28%),
          rgba(255, 255, 255, 0.14) 0%,
          rgba(186, 224, 255, 0.06) 44%,
          rgba(15, 58, 130, 0.12) 78%,
          rgba(255, 255, 255, 0.03) 100%
        );
        backdrop-filter: blur(5px) saturate(135%) brightness(1.04);
        -webkit-backdrop-filter: blur(5px) saturate(135%) brightness(1.04);
        transition: background 0.25s ease;
      }
      /* ใช้พื้นกระจกใสไล่เฉดนุ่มแทน backdrop-filter หนักๆ บนมือถือ เพื่อให้เลื่อนขึ้น-ลงลื่นเนียน 60fps */
      .liquid-glass-mobile {
        background: linear-gradient(155deg, rgba(16, 68, 162, 0.56) 0%, rgba(12, 62, 152, 0.5) 52%, rgba(18, 72, 160, 0.66) 100%);
        border: 1px solid rgba(224, 242, 254, 0.34);
        box-shadow: 0 22px 46px -14px rgba(0, 18, 56, 0.44), inset 0 1px 1px rgba(255, 255, 255, 0.38), inset 0 0 28px rgba(125, 211, 252, 0.12);
        transform: translateZ(0);
      }
      #idx-liquid-glass-stage { container-type: inline-size; }
      .hero-eyebrow {
        letter-spacing: 0.045em;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 4px 16px rgba(0, 14, 44, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        text-shadow: 0 1px 8px rgba(0, 12, 42, 0.55);
      }
      .hero-headline {
        font-weight: 500;
        letter-spacing: -0.015em;
        text-shadow: 0 2px 14px rgba(0, 10, 38, 0.85), 0 1px 4px rgba(0, 12, 42, 0.72), 0 0 26px rgba(147, 210, 255, 0.22);
      }
      .hero-year-highlight {
        font-weight: 700;
        letter-spacing: -0.015em;
        background: linear-gradient(95deg, #ffffff 0%, #fffbeb 42%, #fde68a 74%, #bae6fd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-top: 0.04em;
        padding-bottom: 0.04em;
        filter: drop-shadow(0 3px 14px rgba(0, 12, 44, 0.78)) drop-shadow(0 0 22px rgba(253, 224, 71, 0.32));
      }
      .beta-glow {
        font-weight: 300;
        color: #fffce0;
        letter-spacing: 0.015em;
        text-shadow: 0 0 10px rgba(254, 249, 195, 0.82), 0 0 24px rgba(253, 224, 71, 0.4), 0 0 42px rgba(250, 204, 21, 0.22);
      }
      .rajavithi-watermark {
        color: rgba(38, 68, 112, 0.88);
        letter-spacing: 0.06em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
      }

      /* ============================================================================
       * 3. LIVING TREE, STARS, CLOUDS & ULTRA-SMOOTH SOFT ANIMATIONS (GPU ONLY)
       * ============================================================================ */
      @keyframes treeCanopySway {
        0%, 100% { transform: rotate(0deg) scale(1); }
        34% { transform: rotate(1.0deg) scale(1.005); }
        68% { transform: rotate(-0.9deg) scale(1.003); }
      }
      @keyframes branchSwayLeft {
        0%, 100% { transform: rotate(0deg); }
        42% { transform: rotate(-1.9deg); }
        76% { transform: rotate(1.1deg); }
      }
      @keyframes branchSwayRight {
        0%, 100% { transform: rotate(0deg); }
        38% { transform: rotate(1.9deg); }
        76% { transform: rotate(-1.1deg); }
      }
      @keyframes leafFlutterOrganic {
        0%, 100% { transform: rotate(0deg) scale(1); opacity: 0.92; }
        35% { transform: rotate(var(--fl-rot, 6deg)) scale(1.06); opacity: 1; }
        68% { transform: rotate(calc(var(--fl-rot, 6deg) * -0.5)) scale(0.98); opacity: 0.94; }
      }
      @keyframes leafAuraHaloSync {
        0%, 100% { opacity: 0.16; transform: scale(0.84); }
        35% { opacity: 0.72; transform: scale(1.52); }
        68% { opacity: 0.26; transform: scale(1.04); }
      }
      @keyframes nodePulseGlow {
        0%, 100% { opacity: 0.58; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.22); }
      }
      @keyframes twinkleStar {
        0%, 100% { opacity: 0.18; transform: scale(0.85); }
        50% { opacity: 0.88; transform: scale(1.26); }
      }
      @keyframes meteorStreak {
        0% { opacity: 0; transform: rotate(var(--ang, -32deg)) translateX(130px) scaleX(0.35); }
        5% { opacity: 0.82; }
        18% { opacity: 0.72; transform: rotate(var(--ang, -32deg)) translateX(-380px) scaleX(1.08); }
        28%, 100% { opacity: 0; transform: rotate(var(--ang, -32deg)) translateX(-640px) scaleX(0.55); }
      }
      @keyframes cloudDriftAcross {
        0% { transform: translate3d(-44vw, 0, 0); }
        100% { transform: translate3d(118vw, 0, 0); }
      }
      @keyframes cloudBankFloat {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(14px, -6px, 0); }
      }
      @keyframes cloudBankFloatAlt {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(-14px, -5px, 0); }
      }
      @keyframes heartBeatGlow {
        0%, 100% { transform: scale(1); opacity: 0.86; }
        24% { transform: scale(1.13); opacity: 1; }
        46% { transform: scale(1.02); opacity: 0.9; }
        64% { transform: scale(1.09); opacity: 0.98; }
      }
      @keyframes auroraCurtainWave {
        0%, 100% { transform: translate3d(-3%, 0, 0) scaleY(1); opacity: 0.48; }
        45% { transform: translate3d(3%, -2%, 0) scaleY(1.06); opacity: 0.72; }
      }
      @keyframes auroraCurtainAlt {
        0%, 100% { transform: translate3d(3%, 0, 0) scaleY(1.03); opacity: 0.36; }
        50% { transform: translate3d(-4%, -2%, 0) scaleY(0.94); opacity: 0.62; }
      }
      @keyframes btnSheenSweep {
        0%, 66% { transform: translate3d(-150%, 0, 0) skewX(-22deg); opacity: 0; }
        74% { opacity: 0.9; }
        94% { transform: translate3d(260%, 0, 0) skewX(-22deg); opacity: 0.75; }
        100% { transform: translate3d(270%, 0, 0) skewX(-22deg); opacity: 0; }
      }
      @keyframes rjcAmbientRun { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes rjcWaveBar { 0%, 100% { transform: scaleY(0.28); opacity: 0.65; } 50% { transform: scaleY(1); opacity: 1; } }
      @keyframes appSpin { to { transform: rotate(360deg); } }

      .tree-living-root { transform-origin: 260px 398px; animation: treeCanopySway 10s ease-in-out infinite; }
      .branch-group-left { transform-origin: 252px 236px; animation: branchSwayLeft 7.2s ease-in-out infinite; }
      .branch-group-right { transform-origin: 268px 236px; animation: branchSwayRight 7.8s ease-in-out infinite; animation-delay: -1.4s; }
      .living-leaf { transform-box: fill-box; transform-origin: center; animation: leafFlutterOrganic var(--dur, 4.6s) ease-in-out infinite; animation-delay: var(--del, 0s); }
      .leaf-aura-halo { transform-box: fill-box; transform-origin: center; pointer-events: none; animation: leafAuraHaloSync var(--dur, 4.6s) ease-in-out infinite; animation-delay: var(--del, 0s); }
      .cloud-node-pulse { transform-box: fill-box; transform-origin: center; animation: nodePulseGlow 3.6s ease-in-out infinite; }

      .heart-leaf-beat {
        transform-box: fill-box;
        transform-origin: center;
        animation: heartBeatGlow 4.4s ease-in-out infinite;
        animation-delay: var(--h-del, 0s);
      }
      /* ออโรราแบบ Radial Gradient นุ่มละมุนในตัว ไม่ใช้ filter:blur() หนักเครื่องมือถือ */
      .aurora-curtain-primary {
        background:
          radial-gradient(ellipse 50% 80% at 28% 58%, rgba(52, 211, 153, 0.22) 0%, rgba(56, 189, 248, 0.1) 50%, rgba(0, 0, 0, 0) 78%),
          radial-gradient(ellipse 52% 74% at 68% 52%, rgba(56, 189, 248, 0.2) 0%, rgba(192, 132, 252, 0.13) 52%, rgba(0, 0, 0, 0) 80%);
        will-change: transform, opacity;
        animation: auroraCurtainWave 18s ease-in-out infinite;
      }
      .aurora-curtain-secondary {
        background:
          radial-gradient(ellipse 54% 70% at 52% 46%, rgba(110, 231, 183, 0.17) 0%, rgba(168, 85, 247, 0.12) 46%, rgba(0, 0, 0, 0) 76%),
          radial-gradient(ellipse 40% 66% at 80% 60%, rgba(244, 114, 182, 0.13) 0%, rgba(0, 0, 0, 0) 72%);
        will-change: transform, opacity;
        animation: auroraCurtainAlt 22s ease-in-out infinite;
      }

      .twinkle-star {
        position: absolute; border-radius: 9999px; background: rgba(240, 249, 255, 0.88);
        box-shadow: 0 0 8px 1px rgba(186, 230, 253, 0.55);
        animation: twinkleStar var(--tw-dur, 4.4s) ease-in-out infinite;
        animation-delay: var(--tw-del, 0s);
      }
      .shooting-star {
        position: absolute; width: var(--len, 145px); height: 1.5px; border-radius: 9999px; opacity: 0;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.68) 0%, var(--trail-col, rgba(186, 230, 253, 0.45)) 32%, rgba(192, 132, 252, 0.1) 68%, rgba(255, 255, 255, 0) 100%);
        animation: meteorStreak var(--m-dur, 8.2s) cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
        animation-delay: var(--m-del, 0s);
        will-change: transform, opacity;
      }

        // Studio 24kHz TTS Helpers (Gemini 3.8 Flash TTS ผ่าน Code.gs — ไม่ใช้เสียงเบราว์เซอร์)
        function pcmToWavBlobSafe(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = Math.max(0, bytes.length - off);
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return new Blob([buf], { type: 'audio/wav' });
            } catch (_) { return null; }
        }

        async function fetchStudioGuideBlob({ appsScriptUrl, text, cacheKey, signal }) {
            if (cacheKey && typeof CORE.getCachedAudio === 'function') {
                try { const hit = await CORE.getCachedAudio(cacheKey); if (hit && hit.size > 0) return hit; } catch (_) {}
            }
            if (!appsScriptUrl || !navigator.onLine) return null;
            for (let attempt = 0; attempt < 2; attempt++) {
                if (signal?.aborted) return null;
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort, { once: true });
                const tm = setTimeout(() => ctrl.abort(), 45000);
                try {
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'callGeminiTTS', text, voiceName: 'Sulafat', languageCode: 'th-TH', style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ เป็นมิตรเหมือนผู้ดูแลหลักสูตร' }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                    if (signal?.aborted) return null;
                    const res = JSON.parse((await rawRes.text()) || '{}');
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rateMatch = String(res.inlineData.mimeType || '').match(/rate=(\d+)/);
                        const blob = pcmToWavBlobSafe(res.inlineData.data, parseInt(rateMatch ? rateMatch[1] : '24000', 10));
                        if (blob && blob.size > 0) {
                            if (cacheKey && typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(cacheKey, blob).catch(() => {});
                            return blob;
                        }
                    }
                } catch (_) {
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
                if (attempt === 0 && !signal?.aborted) await new Promise(r => setTimeout(r, 1000));
            }
            return null;
        }

                                <li>แตะ <b>“เพิ่ม (Add)”</b> มุมขวาบน เพื่อเปิดใช้งานเต็มจอเหมือนแอปเนทีฟค่ะ</li>

                                <li>เลือก <b>“ติดตั้งแอป (Install app)”</b> หรือ <b>“เพิ่มลงหน้าจอหลัก (Add to Home screen)”</b></li>
                                <li>กดยืนยัน <b>“ติดตั้ง (Install)”</b> เพื่อใช้งานเต็มจอและอ่านคลังคำพูดออฟไลน์ใน ICU/ER ค่ะ</li>
                            </ol>
                        )}

                        <button type="button" onClick={onClose} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-sm">
                            เข้าใจแล้ว
                        </button>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 3. EPIC LANDING HERO SCREEN (ULTRA-SMOOTH SOFT AMBIENT FLOW + 60FPS SCROLL)
        // ============================================================================
        function LandingHeroScreen({ onStartAuth, hasSavedSession, onResumeDashboard, showInstallBtn, onInstallApp }) {
            const heroStageRef = useRef(null);
            const flareCanvasRef = useRef(null);
            const treeSvgRef = useRef(null);
            const glassStageRef = useRef(null);
            const mobileGlassRef = useRef(null);
            const textFitBoxRef = useRef(null);
            const fitLine1Ref = useRef(null);
            const fitLine2Ref = useRef(null);
            const centerCtaRef = useRef(null);
            const mTextFitBoxRef = useRef(null);
            const mFitLine1Ref = useRef(null);
            const mFitLine2Ref = useRef(null);

            const leftLeaves = useMemo(() => ([
                { cx: 86, cy: 254, rx: 14, ry: 7, rot: -24 }, { cx: 104, cy: 282, rx: 13, ry: 6.5, rot: -40 },
                { cx: 78, cy: 220, rx: 14, ry: 7, rot: -8 }, { cx: 88, cy: 184, rx: 14, ry: 7, rot: 14 },
                { cx: 110, cy: 146, rx: 13, ry: 6.5, rot: 28 }, { cx: 144, cy: 110, rx: 13, ry: 6.5, rot: 42 },
                { cx: 176, cy: 76, rx: 13, ry: 6.5, rot: 56 }, { cx: 212, cy: 54, rx: 12, ry: 6, rot: 72 },
                { cx: 136, cy: 174, rx: 11, ry: 5.5, rot: 12 }, { cx: 152, cy: 210, rx: 11, ry: 5.5, rot: -18 },
                { cx: 192, cy: 134, rx: 11, ry: 5.5, rot: 36 }, { cx: 222, cy: 98, rx: 11, ry: 5.5, rot: 62 },
                { cx: 122, cy: 240, rx: 12, ry: 6, rot: -25 }
            ]), []);

            const rightLeaves = useMemo(() => ([
                { cx: 260, cy: 38, rx: 7, ry: 15, rot: 0 }, { cx: 308, cy: 54, rx: 12, ry: 6, rot: -72 },
                { cx: 344, cy: 76, rx: 13, ry: 6.5, rot: -56 }, { cx: 376, cy: 110, rx: 13, ry: 6.5, rot: -42 },
                { cx: 410, cy: 146, rx: 13, ry: 6.5, rot: -28 }, { cx: 432, cy: 184, rx: 14, ry: 7, rot: -14 },
                { cx: 442, cy: 220, rx: 14, ry: 7, rot: 8 }, { cx: 434, cy: 254, rx: 14, ry: 7, rot: 24 },
                { cx: 416, cy: 282, rx: 13, ry: 6.5, rot: 40 }, { cx: 384, cy: 174, rx: 11, ry: 5.5, rot: -12 },
                { cx: 368, cy: 210, rx: 11, ry: 5.5, rot: 18 }, { cx: 328, cy: 134, rx: 11, ry: 5.5, rot: -36 },
                { cx: 298, cy: 98, rx: 11, ry: 5.5, rot: -62 }, { cx: 398, cy: 240, rx: 12, ry: 6, rot: 25 }
            ]), []);

            // Unified Ultra-Smooth 60FPS Soft Ambient Canvas:
            // - แสงแอมเบียนฟุ้งนุ่มวิ่งจากขอบซ้าย-ขวาของกรอบกระจก -> เชื่อมเข้าสู่โคนลำต้น -> แตกแขนงขึ้นสู่กิ่งและปลายใบด้านบน
            // - ปรับแสงทุกดวง (สุริยคราส, ลำแสงสวรรค์, ละอองหิ่งห้อย) ให้ฟุ้งละมุนไร้เส้นแข็งกระด้าง
            // - ไม่เรียก getBoundingClientRect() ใน touchmove และหยุดวาดเมื่อเลื่อนพ้นหน้า เพื่อการเลื่อนที่ลื่นติดนิ้ว
            useEffect(() => {
                const canvas = flareCanvasRef.current;
                const stage = heroStageRef.current;
                if (!canvas || !stage) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const flare = {
                    targetMouseX: 0, targetMouseY: 0, mouseX: 0, mouseY: 0,
                    w: 0, h: 0, lastFitW: 0, inView: true,
                    crestX: window.innerWidth * 0.5, crestY: window.innerHeight * 0.14,
                    treeLeft: 0, treeTop: 0, treeW: 360, treeH: 310
                };

                // Pre-render Soft Feathered Radial Glow Sprites ครั้งเดียว (วาดเร็ว 60fps และขอบนุ่มฟุ้งเหมือนแสงจริง)
                const createSoftGlowSprite = (stops) => {
                    const sc = document.createElement('canvas');
                    sc.width = 64; sc.height = 64;
                    const sctx = sc.getContext('2d');
                    const g = sctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
                    sctx.fillStyle = g;
                    sctx.fillRect(0, 0, 64, 64);
                    return sc;
                };

                const glowSprites = {
                    pink: createSoftGlowSprite([[0, 'rgba(255,248,255,0.92)'], [0.24, 'rgba(245,208,254,0.58)'], [0.58, 'rgba(217,70,239,0.18)'], [1, 'rgba(168,85,247,0)']]),
                    mint: createSoftGlowSprite([[0, 'rgba(248,255,252,0.92)'], [0.24, 'rgba(167,243,208,0.58)'], [0.58, 'rgba(56,189,248,0.18)'], [1, 'rgba(14,165,233,0)']]),
                    gold: createSoftGlowSprite([[0, 'rgba(255,254,244,0.94)'], [0.26, 'rgba(254,240,178,0.54)'], [0.62, 'rgba(186,230,253,0.16)'], [1, 'rgba(56,189,248,0)']]),
                    cyan: createSoftGlowSprite([[0, 'rgba(244,252,255,0.9)'], [0.28, 'rgba(186,230,253,0.52)'], [0.64, 'rgba(125,211,252,0.14)'], [1, 'rgba(56,189,248,0)']])
                };

                const leafNodes = [
                    ...leftLeaves.map(l => ({ sx: l.cx, sy: l.cy, sprite: 'pink' })),
                    ...rightLeaves.map(l => ({ sx: l.cx, sy: l.cy, sprite: 'mint' })),
                    { sx: 132, sy: 208, sprite: 'pink' },
                    { sx: 172, sy: 162, sprite: 'gold' }
                ];

                // ระบบเส้นทางแสงแอมเบียนต่อเนื่อง (กรอบกระจกซ้าย/ขวา -> เชื่อมโคนต้นไม้ -> ลำต้น -> แตกกิ่งด้านบน)
                let ambientRoutes = [];

                const smoothPulse = (u) => (u > 0.82 ? Math.sin(((u - 0.82) / 0.18) * Math.PI) : 0);

                const sampleCatmullRomArc = (pts, samples = 96) => {
                    if (!pts || pts.length < 2) return [];
                    const dense = [];
                    const segs = pts.length - 1;
                    const subPerSeg = 14;
                    for (let i = 0; i < segs; i++) {
                        const p0 = pts[Math.max(0, i - 1)];
                        const p1 = pts[i];
                        const p2 = pts[i + 1];
                        const p3 = pts[Math.min(segs, i + 2)];
                        for (let s = 0; s < subPerSeg; s++) {
                            const t = s / subPerSeg;
                            const t2 = t * t, t3 = t2 * t;
                            const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
                            const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
                            dense.push({ x, y });
                        }
                    }
                    dense.push(pts[pts.length - 1]);

                    const cum = [0];
                    for (let i = 1; i < dense.length; i++) {
                        cum.push(cum[i - 1] + Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y));
                    }
                    const totalLen = Math.max(1, cum[cum.length - 1]);
                    const out = [];
                    let cursor = 0;
                    for (let k = 0; k <= samples; k++) {
                        const target = (k / samples) * totalLen;
                        while (cursor < cum.length - 2 && cum[cursor + 1] < target) cursor++;
                        const span = Math.max(0.0001, cum[cursor + 1] - cum[cursor]);
                        const f = (target - cum[cursor]) / span;
                        out.push({
                            x: dense[cursor].x + (dense[cursor + 1].x - dense[cursor].x) * f,
                            y: dense[cursor].y + (dense[cursor + 1].y - dense[cursor].y) * f
                        });
                    }
                    return out;
                };

                const rebuildAmbientRoutes = (heroRect) => {
                    if (flare.treeW <= 0 || flare.treeH <= 0) return;
                    const svgPt = (sx, sy) => ({
                        x: flare.treeLeft + ((sx - 30) / 460) * flare.treeW,
                        y: flare.treeTop + ((sy - 14) / 394) * flare.treeH
                    });

                    const isDesktop = flare.w >= 768;
                    const glassEl = isDesktop ? glassStageRef.current : mobileGlassRef.current;
                    let leftGlassArc = [];
                    let rightGlassArc = [];

                    if (glassEl) {
                        const gr = glassEl.getBoundingClientRect();
                        if (gr.width > 0 && gr.height > 0) {
                            const gx = gr.left - heroRect.left;
                            const gy = gr.top - heroRect.top;
                            const gw = gr.width;
                            const gh = gr.height;

                            if (isDesktop) {
                                leftGlassArc = [
                                    { x: gx + gw * 0.45, y: gy + gh * 0.98 },
                                    { x: gx + gw * 0.255, y: gy + gh * 0.95 },
                                    { x: gx + gw * 0.238, y: gy + gh * 0.56 },
                                    { x: gx + gw * 0.025, y: gy + gh * 0.535 },
                                    { x: gx + gw * 0.006, y: gy + gh * 0.28 },
                                    { x: gx + gw * 0.028, y: gy + gh * 0.03 },
                                    { x: gx + gw * 0.24, y: gy + gh * 0.02 }
                                ];
                                rightGlassArc = [
                                    { x: gx + gw * 0.55, y: gy + gh * 0.98 },
                                    { x: gx + gw * 0.96, y: gy + gh * 0.96 },
                                    { x: gx + gw * 0.992, y: gy + gh * 0.68 },
                                    { x: gx + gw * 0.97, y: gy + gh * 0.39 },
                                    { x: gx + gw * 0.75, y: gy + gh * 0.36 },
                                    { x: gx + gw * 0.735, y: gy + gh * 0.06 },
                                    { x: gx + gw * 0.60, y: gy + gh * 0.02 }
                                ];
                            } else {
                                leftGlassArc = [
                                    { x: gx + gw * 0.44, y: gy + gh },
                                    { x: gx + 20, y: gy + gh - 3 },
                                    { x: gx + 2, y: gy + gh * 0.72 },
                                    { x: gx + 2, y: gy + gh * 0.30 },
                                    { x: gx + 20, y: gy + 4 },
                                    { x: gx + gw * 0.26, y: gy + 1 }
                                ];
                                rightGlassArc = [
                                    { x: gx + gw * 0.56, y: gy + gh },
                                    { x: gx + gw - 20, y: gy + gh - 3 },
                                    { x: gx + gw - 2, y: gy + gh * 0.72 },
                                    { x: gx + gw - 2, y: gy + gh * 0.30 },
                                    { x: gx + gw - 20, y: gy + 4 },
                                    { x: gx + gw * 0.74, y: gy + 1 }
                                ];
                            }
                        }
                    }

                    const leftTrunk = [svgPt(188, 384), svgPt(226, 342), svgPt(246, 294), svgPt(252, 248)];
                    const rightTrunk = [svgPt(332, 384), svgPt(294, 342), svgPt(272, 294), svgPt(266, 248)];

                    const leftBranches = [
                        { pts: [svgPt(248, 240), svgPt(198, 224), svgPt(148, 232), svgPt(86, 254)], sprite: 'pink', dur: 6.8, phase: 0.0 },
                        { pts: [svgPt(242, 210), svgPt(188, 186), svgPt(138, 186), svgPt(88, 184)], sprite: 'pink', dur: 7.4, phase: 0.27 },
                        { pts: [svgPt(245, 180), svgPt(202, 145), svgPt(156, 130), svgPt(110, 146)], sprite: 'gold', dur: 7.9, phase: 0.54 },
                        { pts: [svgPt(254, 150), svgPt(228, 110), svgPt(202, 82), svgPt(176, 76)], sprite: 'pink', dur: 8.2, phase: 0.78 }
                    ];
                    const rightBranches = [
                        { pts: [svgPt(272, 240), svgPt(322, 224), svgPt(374, 232), svgPt(434, 254)], sprite: 'mint', dur: 7.0, phase: 0.14 },
                        { pts: [svgPt(276, 210), svgPt(332, 186), svgPt(380, 186), svgPt(432, 184)], sprite: 'cyan', dur: 7.6, phase: 0.41 },
                        { pts: [svgPt(274, 180), svgPt(318, 145), svgPt(364, 130), svgPt(410, 146)], sprite: 'mint', dur: 8.1, phase: 0.66 },
                        { pts: [svgPt(262, 165), svgPt(260, 118), svgPt(260, 78), svgPt(260, 38)], sprite: 'gold', dur: 6.6, phase: 0.88 }
                    ];

                    ambientRoutes = [
                        ...leftBranches.map(b => ({
                            pts: sampleCatmullRomArc([...leftGlassArc, ...leftTrunk, ...b.pts], 96),
                            sprite: b.sprite,
                            dur: b.dur,
                            phase: b.phase
                        })),
                        ...rightBranches.map(b => ({
                            pts: sampleCatmullRomArc([...rightGlassArc, ...rightTrunk, ...b.pts], 96),
                            sprite: b.sprite,
                            dur: b.dur,
                            phase: b.phase
                        }))
                    ];
                };

                const sampleRoutePoint = (pts, u) => {
                    const maxIdx = pts.length - 1;
                    const clamped = Math.max(0, Math.min(1, u)) * maxIdx;
                    const i0 = Math.floor(clamped);
                    const i1 = Math.min(maxIdx, i0 + 1);
                    const f = clamped - i0;
                    return {
                        x: pts[i0].x + (pts[i1].x - pts[i0].x) * f,
                        y: pts[i0].y + (pts[i1].y - pts[i0].y) * f
                    };
                };

                const fireflies = [];
                const bloomRipples = [];
                const floatingHearts = [];
                const SPRITE_KEYS = ['gold', 'mint', 'cyan', 'pink'];
                let lastTrailTs = 0;
                let lastAutoWispTs = 0;

                const spawnFirefly = (x, y, boosted = false, fixedSprite = null) => {
                    if (fireflies.length >= 48) fireflies.shift();
                    const angle = Math.random() * Math.PI * 2;
                    const speed = boosted ? (0.55 + Math.random() * 1.45) : (0.12 + Math.random() * 0.38);
                    fireflies.push({
                        x: x + (Math.random() - 0.5) * (boosted ? 12 : 8),
                        y: y + (Math.random() - 0.5) * (boosted ? 12 : 8),
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - (boosted ? 0.72 : 0.36),
                        r: boosted ? (5.5 + Math.random() * 5.5) : (4.2 + Math.random() * 4.2),
                        life: 0,
                        maxLife: boosted ? (1.1 + Math.random() * 0.7) : (1.1 + Math.random() * 0.8),
                        twinkle: Math.random() * Math.PI * 2,
                        sprite: fixedSprite || SPRITE_KEYS[Math.floor(Math.random() * SPRITE_KEYS.length)]
                    });
                };

                const spawnLeafWispOnCanvas = (count = 1) => {
                    if (flare.treeW <= 0) return;
                    for (let i = 0; i < count; i++) {
                        const lf = leafNodes[Math.floor(Math.random() * leafNodes.length)];
                        const px = flare.treeLeft + ((lf.sx - 30) / 460) * flare.treeW;
                        const py = flare.treeTop + ((lf.sy - 14) / 394) * flare.treeH;
                        spawnFirefly(px, py, false, lf.sprite);
                    }
                };

                const spawnBloomBurst = (clientX, clientY) => {
                    const rect = stage.getBoundingClientRect();
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;

                    if (bloomRipples.length >= 5) bloomRipples.shift();
                    bloomRipples.push({ x, y, r: 10, maxR: Math.min(rect.width, rect.height) * 0.22 + 42, life: 0, maxLife: 1.15 });

                    for (let i = 0; i < 12; i++) spawnFirefly(x, y, true);
                    spawnLeafWispOnCanvas(3);

                    for (let i = 0; i < 4; i++) {
                        if (floatingHearts.length >= 16) floatingHearts.shift();
                        floatingHearts.push({
                            x: x + (Math.random() - 0.5) * 28,
                            y: y + (Math.random() - 0.5) * 16,
                            vx: (Math.random() - 0.5) * 0.55,
                            vy: -(0.72 + Math.random() * 0.75),
                            size: 4.5 + Math.random() * 3.5,
                            sway: Math.random() * Math.PI * 2,
                            life: 0,
                            maxLife: 1.55 + Math.random() * 0.7,
                            color: i % 2 === 0 ? 'rgba(249, 168, 212, 0.9)' : 'rgba(254, 240, 178, 0.9)'
                        });
                    }
                };

                const drawMiniHeart = (c, hx, hy, sz, col, alpha) => {
                    c.save();
                    c.translate(hx, hy);
                    c.globalAlpha = alpha;
                    c.fillStyle = col;
                    c.beginPath();
                    c.moveTo(0, sz * 0.35);
                    c.bezierCurveTo(-sz * 0.55, -sz * 0.35, -sz * 1.15, sz * 0.25, 0, sz * 1.05);
                    c.bezierCurveTo(sz * 1.15, sz * 0.25, sz * 0.55, -sz * 0.35, 0, sz * 0.35);
                    c.fill();
                    c.restore();
                };

                const fitLineToWidth = (el, targetW, minPx, maxPx) => {
                    if (!el || targetW <= 0) return;
                    const curSize = parseFloat(window.getComputedStyle(el).fontSize) || 20;
                    const measured = el.scrollWidth;
                    if (!measured) return;
                    const nextSize = Math.max(minPx, Math.min(maxPx, (targetW / measured) * curSize));
                    if (Math.abs(nextSize - curSize) > 0.4) {
                        el.style.fontSize = `${nextSize.toFixed(2)}px`;
                    }
                };

                const syncLayout = (forceTextRefit = false) => {
                    const heroRect = stage.getBoundingClientRect();
                    const nw = Math.max(1, Math.round(heroRect.width));
                    const nh = Math.max(1, Math.round(heroRect.height));

                    // ล็อกขนาด Canvas: ไม่อัปเดตซ้ำเมื่อความสูงขยับเล็กน้อยจากแถบ URL มือถือ (แก้สะดุดตอนเลื่อนขึ้นลง 100%)
                    const widthChanged = Math.abs(nw - flare.w) > 3;
                    const majorHeightChanged = Math.abs(nh - flare.h) > 120;
                    if (flare.w === 0 || widthChanged || majorHeightChanged || forceTextRefit) {
                        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                        flare.w = nw;
                        flare.h = nh;
                        canvas.width = Math.round(nw * dpr);
                        canvas.height = Math.round(nh * dpr);
                        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                        if (treeSvgRef.current) {
                            const tr = treeSvgRef.current.getBoundingClientRect();
                            if (tr.width > 0 && tr.height > 0) {
                                flare.treeLeft = tr.left - heroRect.left;
                                flare.treeTop = tr.top - heroRect.top;
                                flare.treeW = tr.width;
                                flare.treeH = tr.height;
                                flare.crestX = flare.treeLeft + tr.width * 0.5;
                                flare.crestY = flare.treeTop + tr.height * (nw < 768 ? 0.04 : 0.075);
                            }
                        }

                        if (forceTextRefit || Math.abs(nw - flare.lastFitW) > 3) {
                            flare.lastFitW = nw;
                            if (textFitBoxRef.current && fitLine1Ref.current && textFitBoxRef.current.clientWidth > 0) {
                                const tw = textFitBoxRef.current.clientWidth * 0.98;
                                fitLineToWidth(fitLine1Ref.current, tw, 16, 36);
                                if (fitLine2Ref.current) {
                                    const cw = centerCtaRef.current?.clientWidth ? centerCtaRef.current.clientWidth * 0.94 : tw * 0.49;
                                    fitLineToWidth(fitLine2Ref.current, Math.min(tw * 0.49, cw), 16, 34);
                                }
                            }
                            if (mTextFitBoxRef.current && mFitLine1Ref.current && mFitLine2Ref.current && mTextFitBoxRef.current.clientWidth > 0) {
                                const mw = mTextFitBoxRef.current.clientWidth * 0.96;
                                fitLineToWidth(mFitLine1Ref.current, mw, 13, 21);
                                fitLineToWidth(mFitLine2Ref.current, mw * 0.54, 17, 26);
                            }
                        }

                        rebuildAmbientRoutes(heroRect);
                    }
                };

                const drawSoftOrb = (x, y, r, stops) => {
                    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                };

                const drawSoftLightBeam = (ox, oy, ang, len, halfW, colInner, colMid) => {
                    ctx.save();
                    ctx.translate(ox, oy);
                    ctx.rotate(ang);
                    ctx.scale(1, halfW / len);
                    const g = ctx.createRadialGradient(len * 0.34, 0, 0, len * 0.34, 0, len * 0.66);
                    g.addColorStop(0, colInner);
                    g.addColorStop(0.45, colMid);
                    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(len * 0.34, 0, len * 0.66, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                };

                let alive = true, rafId = null, prevFrameTs = performance.now();
                const renderLoop = (now) => {
                    if (!alive) return;
                    rafId = requestAnimationFrame(renderLoop);
                    if (document.hidden || !flare.inView || flare.w <= 0) return;

                    const dt = Math.min(0.05, Math.max(0.001, (now - prevFrameTs) / 1000));
                    prevFrameTs = now;

                    if (now - lastAutoWispTs > 620) {
                        lastAutoWispTs = now;
                        spawnLeafWispOnCanvas(1);
                    }

                    const w = flare.w, h = flare.h;
                    ctx.clearRect(0, 0, w, h);

                    flare.mouseX += (flare.targetMouseX - flare.mouseX) * 0.05;
                    flare.mouseY += (flare.targetMouseY - flare.mouseY) * 0.05;

                    const t = now * 0.001;
                    const k = 0.85 * (0.93 + 0.07 * Math.sin(t * 0.95));
                    const minDim = Math.min(w, h);

                    ctx.globalCompositeOperation = 'lighter';

                    // 1. วงโค้งสุริยคราสแบบฟุ้งนุ่ม (Soft Diffused Horizon Glow — ไม่มีเส้นแข็ง 2px)
                    const arcR = Math.max(w * 0.62, 520);
                    const arcCx = flare.crestX + flare.mouseX * 10;
                    const arcCy = flare.crestY + arcR + flare.mouseY * 5;

                    ctx.save();
                    const makeArcGrad = (alphaMult) => {
                        const ag = ctx.createLinearGradient(w * 0.14, flare.crestY, w * 0.86, flare.crestY);
                        ag.addColorStop(0, 'rgba(56, 189, 248, 0)');
                        ag.addColorStop(0.26, `rgba(56, 189, 248, ${(0.2 * k * alphaMult).toFixed(3)})`);
                        ag.addColorStop(0.46, `rgba(186, 230, 253, ${(0.44 * k * alphaMult).toFixed(3)})`);
                        ag.addColorStop(0.51, `rgba(255, 252, 224, ${(0.62 * k * alphaMult).toFixed(3)})`);
                        ag.addColorStop(0.64, `rgba(110, 231, 183, ${(0.36 * k * alphaMult).toFixed(3)})`);
                        ag.addColorStop(0.84, `rgba(129, 140, 248, ${(0.14 * k * alphaMult).toFixed(3)})`);
                        ag.addColorStop(1, 'rgba(56, 189, 248, 0)');
                        return ag;
                    };
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = makeArcGrad(0.24);
                    ctx.lineWidth = 34;
                    ctx.beginPath(); ctx.arc(arcCx, arcCy, arcR, Math.PI * 1.28, Math.PI * 1.72); ctx.stroke();

                    ctx.strokeStyle = makeArcGrad(0.36);
                    ctx.lineWidth = 14;
                    ctx.beginPath(); ctx.arc(arcCx, arcCy, arcR, Math.PI * 1.29, Math.PI * 1.71); ctx.stroke();

                    ctx.strokeStyle = makeArcGrad(0.55);
                    ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.arc(arcCx, arcCy, arcR, Math.PI * 1.31, Math.PI * 1.69); ctx.stroke();
                    ctx.restore();

                    const fx = arcCx + Math.sin(t * 0.2) * Math.min(w * 0.032, 30);
                    const fy = arcCy - Math.sqrt(Math.max(0, arcR * arcR - Math.pow(fx - arcCx, 2)));

                    // 2. ลำแสงสวรรค์แบบฟุ้งนุ่มไร้ขอบตัด (Feathered Soft Light Plumes — ไม่เป็นสามเหลี่ยมเส้นแข็ง)
                    const rayAngles = [-0.46, -0.22, 0.0, 0.22, 0.44];
                    const rayLen = h * 0.66;
                    for (let i = 0; i < rayAngles.length; i++) {
                        const sway = Math.sin(t * 0.35 + i * 1.4) * 0.035 + flare.mouseX * 0.024;
                        const ang = Math.PI * 0.5 + rayAngles[i] + sway;
                        const pulse = 0.038 + 0.016 * Math.sin(t * 0.7 + i * 1.8);
                        drawSoftLightBeam(
                            fx, fy, ang, rayLen, minDim * 0.14,
                            `rgba(254, 249, 205, ${(pulse * 1.45 * k).toFixed(3)})`,
                            i % 2 === 0
                                ? `rgba(147, 210, 252, ${(pulse * 0.82 * k).toFixed(3)})`
                                : `rgba(167, 243, 208, ${(pulse * 0.78 * k).toFixed(3)})`
                        );
                    }

                    // 3. ดวงแสง Solar Flare นุ่มละมุน + ม่านแสงแนวนอนบางเบา (ไม่เป็นเส้นเลเซอร์แข็ง)
                    drawSoftOrb(fx, fy, minDim * 0.34, [
                        [0, `rgba(255, 254, 246, ${(0.56 * k).toFixed(3)})`],
                        [0.2, `rgba(254, 240, 188, ${(0.34 * k).toFixed(3)})`],
                        [0.48, `rgba(125, 211, 252, ${(0.14 * k).toFixed(3)})`],
                        [1, 'rgba(0, 0, 0, 0)']
                    ]);
                    ctx.save();
                    ctx.translate(fx, fy);
                    ctx.scale(1, 0.045);
                    drawSoftOrb(0, 0, w * 0.36, [
                        [0, `rgba(255, 255, 255, ${(0.36 * k).toFixed(3)})`],
                        [0.35, `rgba(186, 230, 253, ${(0.18 * k).toFixed(3)})`],
                        [1, 'rgba(0, 0, 0, 0)']
                    ]);
                    ctx.restore();

                    // 4. แสงแอมเบียนอัลต้าสมูทวิ่งจากขอบกรอบกระจกซ้าย–ขวา -> เชื่อมลำต้น -> แตกกิ่งด้านบน (Zero Hard Lines!)
                    const isSmallScreen = w < 768;
                    const tailSteps = isSmallScreen ? 14 : 18;
                    const tailSpan = 0.21;
                    const baseGlowRadius = isSmallScreen ? 15 : 19;

                    for (let r = 0; r < ambientRoutes.length; r++) {
                        const rt = ambientRoutes[r];
                        if (!rt.pts || rt.pts.length < 4) continue;
                        const rawP = ((t / rt.dur) + rt.phase) % 1;
                        const headU = rawP - 0.04 * Math.sin(rawP * Math.PI * 2);
                        const envFade = Math.sin(Math.min(1, Math.max(0, rawP)) * Math.PI);
                        const spriteImg = glowSprites[rt.sprite] || glowSprites.mint;

                        for (let s = 0; s < tailSteps; s++) {
                            const frac = s / (tailSteps - 1);
                            const u = headU - frac * tailSpan;
                            if (u < 0 || u > 1) continue;
                            const pt = sampleRoutePoint(rt.pts, u);
                            const taper = Math.pow(1 - frac, 1.45);
                            const rad = baseGlowRadius * (0.45 + taper * 0.95);
                            ctx.globalAlpha = Math.max(0, Math.min(0.62, taper * envFade * 0.44));
                            ctx.drawImage(spriteImg, pt.x - rad, pt.y - rad, rad * 2, rad * 2);
                        }

                        if (headU >= 0 && headU <= 1) {
                            const hp = sampleRoutePoint(rt.pts, headU);
                            const headR = baseGlowRadius * (1.28 + 0.35 * smoothPulse(headU));
                            ctx.globalAlpha = Math.max(0, Math.min(0.75, envFade * 0.62));
                            ctx.drawImage(glowSprites.gold, hp.x - headR, hp.y - headR, headR * 2, headR * 2);
                        }
                    }
                    ctx.globalAlpha = 1;

                    // 5. ระลอกคลื่นแสงฟุ้งนุ่มเมื่อแตะหน้าจอ (Soft Touch-to-Bloom)
                    for (let i = bloomRipples.length - 1; i >= 0; i--) {
                        const rp = bloomRipples[i];
                        rp.life += dt;
                        const prog = rp.life / rp.maxLife;
                        if (prog >= 1) { bloomRipples.splice(i, 1); continue; }
                        const curR = rp.r + (rp.maxR - rp.r) * (1 - Math.pow(1 - prog, 2.4));
                        const alpha = (1 - prog) * 0.36;
                        drawSoftOrb(rp.x, rp.y, curR, [
                            [0, 'rgba(0,0,0,0)'],
                            [0.68, 'rgba(186,230,253,0)'],
                            [0.86, `rgba(186,230,253,${alpha.toFixed(3)})`],
                            [1, 'rgba(244,114,182,0)']
                        ]);
                    }

                    // 6. ละอองหิ่งห้อยแสงดาว & ละอองออร่าจากใบไม้ (ใช้ Soft Glow Sprite ฟุ้งนุ่ม)
                    for (let i = fireflies.length - 1; i >= 0; i--) {
                        const f = fireflies[i];
                        f.life += dt;
                        const prog = f.life / f.maxLife;
                        if (prog >= 1) { fireflies.splice(i, 1); continue; }
                        f.x += f.vx * (dt * 60) + Math.sin(t * 3.4 + f.twinkle) * 0.22;
                        f.y += f.vy * (dt * 60);
                        f.vy *= 0.986;
                        const fade = Math.sin(prog * Math.PI);
                        const glowR = f.r * (1.2 + 0.3 * Math.sin(t * 6.5 + f.twinkle));
                        ctx.globalAlpha = Math.max(0, fade * 0.72);
                        const sp = glowSprites[f.sprite] || glowSprites.gold;
                        ctx.drawImage(sp, f.x - glowR, f.y - glowR, glowR * 2, glowR * 2);
                    }
                    ctx.globalAlpha = 1;

                    // 7. ละอองหัวใจจิ๋วเรืองแสงลอยขึ้นเมื่อแตะ
                    for (let i = floatingHearts.length - 1; i >= 0; i--) {
                        const ht = floatingHearts[i];
                        ht.life += dt;
                        const prog = ht.life / ht.maxLife;
                        if (prog >= 1) { floatingHearts.splice(i, 1); continue; }
                        ht.x += (ht.vx + Math.sin(t * 2.8 + ht.sway) * 0.38) * (dt * 60);
                        ht.y += ht.vy * (dt * 60);
                        drawMiniHeart(ctx, ht.x, ht.y, ht.size * (0.8 + prog * 0.35), ht.color, Math.sin(prog * Math.PI) * 0.76);
                    }
                };

                const onMouseMove = (e) => {
                    flare.targetMouseX = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
                    flare.targetMouseY = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
                    const nowTs = performance.now();
                    if (nowTs - lastTrailTs > 42) {
                        lastTrailTs = nowTs;
                        const sRect = stage.getBoundingClientRect();
                        if (e.clientX >= sRect.left && e.clientX <= sRect.right && e.clientY >= sRect.top && e.clientY <= sRect.bottom) {
                            spawnFirefly(e.clientX - sRect.left, e.clientY - sRect.top, false);
                        }
                    }
                    const gs = glassStageRef.current;
                    if (gs) {
                        const rect = gs.getBoundingClientRect();
                        if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                            gs.style.setProperty('--gx', `${(((e.clientX - rect.left) / rect.width) * 100).toFixed(1)}%`);
                            gs.style.setProperty('--gy', `${(((e.clientY - rect.top) / rect.height) * 100).toFixed(1)}%`);
                        }
                    }
                };

                let tapStartX = 0, tapStartY = 0;
                const onTouchStart = (e) => {
                    if (e.touches && e.touches[0]) {
                        tapStartX = e.touches[0].clientX;
                        tapStartY = e.touches[0].clientY;
                    }
                };
                const onTouchEnd = (e) => {
                    if (e.target && e.target.closest && e.target.closest('button, a, input, select')) return;
                    const pt = e.changedTouches && e.changedTouches[0];
                    if (pt && Math.hypot(pt.clientX - tapStartX, pt.clientY - tapStartY) < 12) {
                        spawnBloomBurst(pt.clientX, pt.clientY);
                    }
                };
                const onMouseDown = (e) => {
                    if (e.target && e.target.closest && e.target.closest('button, a, input, select')) return;
                    spawnBloomBurst(e.clientX, e.clientY);
                };

                let resizeTm = null;
                const onWindowResize = () => {
                    clearTimeout(resizeTm);
                    resizeTm = setTimeout(() => syncLayout(false), 140);
                };

                let io = null;
                if (typeof IntersectionObserver !== 'undefined') {
                    io = new IntersectionObserver((entries) => {
                        flare.inView = Boolean(entries[0]?.isIntersecting);
                    }, { threshold: 0.02 });
                    io.observe(stage);
                }

                syncLayout(true);
                rafId = requestAnimationFrame(renderLoop);
                window.addEventListener('resize', onWindowResize);
                window.addEventListener('mousemove', onMouseMove);
                stage.addEventListener('mousedown', onMouseDown);
                stage.addEventListener('touchstart', onTouchStart, { passive: true });
                stage.addEventListener('touchend', onTouchEnd, { passive: true });
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => syncLayout(true)).catch(() => {});
                }

                return () => {
                    alive = false;
                    clearTimeout(resizeTm);
                    if (rafId) cancelAnimationFrame(rafId);
                    if (io) io.disconnect();
                    window.removeEventListener('resize', onWindowResize);
                    window.removeEventListener('mousemove', onMouseMove);
                    stage.removeEventListener('mousedown', onMouseDown);
                    stage.removeEventListener('touchstart', onTouchStart);
                    stage.removeEventListener('touchend', onTouchEnd);
                };
            }, [leftLeaves, rightLeaves]);

            return (
                <div className="min-h-[100svh] w-full flex flex-col text-white">
                    {/* SVG ClipPath สำหรับกรอบกระจก Liquid Glass ทรงขั้นบันได */}
                    <svg width="0" height="0" className="absolute pointer-events-none" aria-hidden="true">
                        <defs>
                            <clipPath id="idxLiquidGlassClipNorm" clipPathUnits="objectBoundingBox">
                                <path d="M 0.0368,0.0192 L 0.7079,0.0192 Q 0.7395,0.0192 0.7395,0.1346 L 0.7395,0.2692 Q 0.7395,0.3846 0.7711,0.3846 L 0.9632,0.3846 Q 0.9947,0.3846 0.9947,0.5000 L 0.9947,0.8654 Q 0.9947,0.9808 0.9632,0.9808 L 0.2763,0.9808 Q 0.2447,0.9808 0.2447,0.8654 L 0.2447,0.6635 Q 0.2447,0.5481 0.2132,0.5481 L 0.0368,0.5481 Q 0.0053,0.5481 0.0053,0.4327 L 0.0053,0.1346 Q 0.0053,0.0192 0.0368,0.0192 Z" />
                            </clipPath>
                        </defs>
                    </svg>

                    {/* ==================== FULLSCREEN EPIC HERO STAGE (100svh เลื่อนขึ้นลงลื่นไม่สะดุด) ==================== */}
                    <section ref={heroStageRef} className="hero-atmosphere relative min-h-[100svh] w-full flex flex-col justify-between overflow-hidden">
                        {/* Layer A (z-5): หมู่ดาวระยิบระยับ 11 ดวง + ดาวตกเฉียง 4 เส้น */}
                        <div className="absolute inset-0 pointer-events-none overflow-hidden z-[5]" aria-hidden="true">
                            <span className="twinkle-star top-[5%] left-[11%] w-[2px] h-[2px]" style={{ '--tw-dur': '3.8s', '--tw-del': '0.3s' }} />
                            <span className="twinkle-star top-[11%] left-[24%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '4.6s', '--tw-del': '1.4s' }} />
                            <span className="twinkle-star top-[7%] left-[42%] w-[2px] h-[2px]" style={{ '--tw-dur': '5.2s', '--tw-del': '0.9s' }} />
                            <span className="twinkle-star top-[4%] left-[61%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '3.4s', '--tw-del': '2.1s' }} />
                            <span className="twinkle-star top-[13%] left-[77%] w-[2px] h-[2px]" style={{ '--tw-dur': '4.9s', '--tw-del': '0.6s' }} />
                            <span className="twinkle-star top-[9%] left-[91%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '4.1s', '--tw-del': '1.7s' }} />
                            <span className="twinkle-star top-[22%] left-[7%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '5.5s', '--tw-del': '2.5s' }} />
                            <span className="twinkle-star top-[18%] left-[34%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '3.9s', '--tw-del': '1.1s' }} />
                            <span className="twinkle-star top-[24%] left-[86%] w-[2px] h-[2px]" style={{ '--tw-dur': '4.4s', '--tw-del': '0.2s' }} />
                            <span className="twinkle-star top-[16%] left-[54%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '4.7s', '--tw-del': '2.9s' }} />
                            <span className="twinkle-star top-[28%] left-[19%] w-[1.5px] h-[1.5px]" style={{ '--tw-dur': '5.0s', '--tw-del': '0.8s' }} />

                            <span className="shooting-star top-[8%] left-[72%]" style={{ '--len': '155px', '--ang': '-31deg', '--m-dur': '7.4s', '--m-del': '0.5s', '--trail-col': 'rgba(186,230,253,0.62)' }} />
                            <span className="shooting-star top-[28%] left-[90%]" style={{ '--len': '168px', '--ang': '-34deg', '--m-dur': '8.8s', '--m-del': '2.1s', '--trail-col': 'rgba(167,243,208,0.58)' }} />
                            <span className="shooting-star top-[5%] left-[46%]" style={{ '--len': '130px', '--ang': '-28deg', '--m-dur': '10.2s', '--m-del': '4.5s', '--trail-col': 'rgba(240,171,252,0.52)' }} />
                            <span className="shooting-star top-[17%] left-[84%]" style={{ '--len': '145px', '--ang': '-33deg', '--m-dur': '8.0s', '--m-del': '3.2s', '--trail-col': 'rgba(186,230,253,0.58)' }} />
                        </div>

                        {/* Layer A2 (z-8): ม่านแสงออโรราพลิ้วไหวเหนือขอบฟ้า (Radial นุ่มละมุน GPU-Only) */}
                        <div className="absolute inset-0 pointer-events-none overflow-hidden z-[8]" aria-hidden="true">
                            <div className="aurora-curtain-primary absolute -top-[4%] -left-[12%] w-[124%] h-[62%]" />
                            <div className="aurora-curtain-secondary absolute top-[8%] -left-[8%] w-[116%] h-[54%]" />
                        </div>

                        {/* Layer B (z-11): ชั้นเมฆนุ่มลอยผ่านและโอบซ้าย–ขวาด้านล่าง + หมอกขอบฟ้า */}
                        <div className="absolute inset-0 pointer-events-none overflow-hidden z-[11]" aria-hidden="true">
                            <svg width="0" height="0" className="absolute">
                                <defs>
                                    <linearGradient id="idxCloudSilver" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stopColor="#ffffff" stopOpacity="0.68" />
                                        <stop offset="48%" stopColor="#e0f2fe" stopOpacity="0.34" />
                                        <stop offset="100%" stopColor="#60a5fa" stopOpacity="0" />
                                    </linearGradient>
                                    <linearGradient id="idxCloudSoft" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stopColor="#ffffff" stopOpacity="0.58" />
                                        <stop offset="58%" stopColor="#bae6fd" stopOpacity="0.26" />
                                        <stop offset="100%" stopColor="#93c5fd" stopOpacity="0" />
                                    </linearGradient>
                                </defs>
                            </svg>
                            <div className="hero-cloud-drift top-[54%] w-[56vw] max-w-[660px] min-w-[260px] opacity-50" style={{ '--c-dur': '96s', '--c-del': '-54s' }}>
                                <svg viewBox="0 0 480 160" className="w-full h-auto overflow-visible">
                                    <path d="M36 128 C20 128 16 112 30 102 C40 94 58 92 72 96 C84 64 124 46 160 60 C186 24 248 18 286 48 C318 38 358 54 370 82 C398 78 426 90 434 108 C452 108 462 120 452 128 Z" fill="url(#idxCloudSilver)" />
                                </svg>
                            </div>
                            <div className="hero-cloud-bank-l bottom-[8%] -left-[8%] w-[58vw] max-w-[640px] opacity-65">
                                <svg viewBox="0 0 520 180" className="w-full h-auto overflow-visible">
                                    <path d="M10 164 C10 126 42 104 82 108 C100 68 154 48 202 68 C236 32 308 26 354 60 C392 52 436 70 452 104 C484 104 510 124 510 164 Z" fill="url(#idxCloudSoft)" />
                                </svg>
                            </div>
                            <div className="hero-cloud-bank-r bottom-[7%] -right-[8%] w-[60vw] max-w-[660px] opacity-65">
                                <svg viewBox="0 0 540 185" className="w-full h-auto overflow-visible">
                                    <path d="M24 168 C16 130 48 106 90 110 C112 72 166 56 214 74 C252 34 328 28 378 64 C418 54 468 72 486 108 C516 110 534 132 530 168 Z" fill="url(#idxCloudSilver)" />
                                </svg>
                            </div>
                            <div className="hero-cloud-haze absolute inset-x-0 bottom-0 h-[34%]" />
                        </div>

                        {/* Layer C (z-24): Unified Soft Ambient Canvas (แสงแอมเบียนเชื่อมกรอบซ้าย-ขวาขึ้นต้นไม้ + สุริยคราส & ลำแสงนุ่มฟุ้ง) */}
                        <canvas id="idx-solar-flare-canvas" ref={flareCanvasRef} aria-hidden="true" />

                        {/* Layer D (z-20): ต้นไม้มีชีวิต + กรอบกระจก Liquid Glass (วางคร่อมโคนต้นไม้ ไม่ทับลายน้ำราชวิถี) */}
                        <main className="relative z-20 flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 flex flex-col items-center justify-end pb-[calc(1rem+env(safe-area-inset-bottom,0px))] sm:pb-6 pt-[calc(2.5rem+env(safe-area-inset-top,0px))] sm:pt-6">
                            <div className="relative w-full max-w-[1200px] flex flex-col items-center">

        // ============================================================================

        function LearnerApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const adminPreviewMode = urlParams.get('admin_preview') || '';
            const isAdminPreview = Boolean(adminPreviewMode);
            const returnToDashboard = urlParams.get('return') === 'dashboard';
            const incomingLicense = urlParams.get('license') || '';

            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // PWA Install State (รองรับติดตั้งเป็นแอปบน Android/Chrome และคู่มือ 3 ขั้นตอนบน iOS Safari)
            const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
            const [isStandaloneApp, setIsStandaloneApp] = useState(() => {
                try {
                    return Boolean(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone);
                } catch (_) { return false; }
            });
            const [installModalOpen, setInstallModalOpen] = useState(false);

            useEffect(() => {
                try {
                    const loc = window.location;
                    const isRealHost = (loc.protocol === 'https:' || loc.hostname === 'localhost') && !/(googleusercontent|webcontainer|sandbox|srcdoc|blob:)/i.test(loc.href);
                    if ('serviceWorker' in navigator && isRealHost) {
                        navigator.serviceWorker.register('./sw.js').catch(() => {});
                    }
                } catch (_) {}

                const onBeforeInstall = (e) => {
                    e.preventDefault();
                    setDeferredInstallPrompt(e);
                };
                const onAppInstalled = () => {
                    setDeferredInstallPrompt(null);
                    setIsStandaloneApp(true);
                };
                window.addEventListener('beforeinstallprompt', onBeforeInstall);
                window.addEventListener('appinstalled', onAppInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onBeforeInstall);
                    window.removeEventListener('appinstalled', onAppInstalled);
                };
            }, []);

            // Cloud & Course Config
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [certTemplate, setCertTemplate] = useState(() => ({ ...DEFAULT_CERT_TEMPLATE }));
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคอวัยวะ', url: '', documentUrl: '' });
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : FALLBACK_LESSONS));
            const [quizList, setQuizList] = useState(() => parseRawQuizSafe(window.QUIZ_QUESTIONS_RAW));

            // Session & Navigation State (ไม่เด้งกลับหน้าต้นไม้เมื่อกลับมาจาก AI Skill Lab)
            const [user, setUser] = useState(() => {
                const saved = loadSessionTwoLayer();
                if (saved?.id) return saved;
                if (isAdminPreview && adminPreviewMode !== 'landing' && !adminPreviewMode.startsWith('auth')) {
                    return {
                        id: '4511128901', license: '4511128901', name: 'พว.กัญญารัตน์ วัฒนากูล', nameEN: 'Kanyarat Wattanakul, RN',
                        professionGroup: 'พยาบาล', cneuEligible: true, position: 'พยาบาลวิชาชีพชำนาญการ (TC)',
                        hospital: 'รพ.ราชวิถี', department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', email: 'kanyarat@demo.go.th',
                        userType: 'เรียนต่อเนื่อง', studyHoursExempt: true, progress: 100, pretest: '30/40', posttest: '37/40',
                        status: 'ผ่าน', skillLabPassed: true, skillLabBestScore: 92, certificateCode: 'RJC-2027-DEMO01', certificateIssuedAt: new Date().toISOString()
                    };
                }
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (adminPreviewMode) {
