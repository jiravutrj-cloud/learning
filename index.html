        if (ev.filename && ev.filename.includes('data.js')) {

          return;
        }
        var rootEl = document.getElementById('root');
        if (rootEl && !rootEl.dataset.mounted) {

        // ============================================================================

        function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
            const Comp = LucideIcons[name] || LucideIcons.Sparkles;
            return <Comp size={size} className={className} strokeWidth={strokeWidth} />;
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function parseRawExams(raw) {
            if (!Array.isArray(raw)) return [];
            return raw.map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    question: (parts[0] || '').replace(/^[0-9]+\.\s*/, ''),
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        function prepareShuffledExam(questions) {
            return shuffleArray(questions).map(q => {
                const correctText = q.options[q.answer];
                const shuffledOpts = shuffleArray(q.options);
                return {
                    ...q,
                    options: shuffledOpts,
                    answer: Math.max(0, shuffledOpts.indexOf(correctText))
                };
            });
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(INITIAL_QUIZ_RAW)];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [parseRawExams(INITIAL_QUIZ_RAW)];
        }

        function getTargetHours(userType, liveHours = 10) {
            return 8;
        }

        function calcProgress(studySeconds, userType, liveHours = 10) {
            const targetSecs = getTargetHours(userType, liveHours) * 3600;
            return Math.min(100, Math.round(((studySeconds || 0) / targetSecs) * 100));
        }

        function formatDuration(secs) {
            const total = Math.max(0, Math.floor(secs || 0));
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            return `${h} ชม. ${m} นาที`;
        }

        function generateCertCode(prefix = 'RJC-2027') {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return `${prefix || 'RJC-2027'}-${code}`;
        }

        function formatThaiDate(isoStr) {
            try {
                const d = isoStr ? new Date(isoStr) : new Date();
                return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch {
                return '';
            }
        }

        function loadImageSafe(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        /**
         * สร้างใบประกาศนียบัตรความละเอียดสูง 300 DPI (2480 x 1754 px) พร้อม QR Code ในตัวเว็บ
         */
        async function renderCertificateCanvas(canvas, user, tpl) {
            if (!canvas) return;
            const W = 2480, H = 1754;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            try {
                if (document.fonts?.ready) await document.fonts.ready;
            } catch (_) {}

            // 1. พื้นหลัง Pearl Clinical 2027
            const bgGrad = ctx.createLinearGradient(0, 0, W, H);
            bgGrad.addColorStop(0, '#ffffff');
            bgGrad.addColorStop(0.55, '#f8fafc');
            bgGrad.addColorStop(1, '#ecfdf5');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Soft Medical Aura Accents
            const aura1 = ctx.createRadialGradient(260, 240, 20, 260, 240, 780);
            aura1.addColorStop(0, 'rgba(16, 185, 129, 0.16)');
            aura1.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = aura1;
            ctx.fillRect(0, 0, W, H);

            const aura2 = ctx.createRadialGradient(W - 260, H - 220, 20, W - 260, H - 220, 820);
            aura2.addColorStop(0, 'rgba(14, 165, 233, 0.15)');
            aura2.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = aura2;
            ctx.fillRect(0, 0, W, H);

            // 2. กรอบสองชั้นสีเขียวมรกต-ทองคลินิก
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 10;
            ctx.strokeRect(72, 72, W - 144, H - 144);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.strokeRect(98, 98, W - 196, H - 196);

            // แถบหัวด้านบน
            const barGrad = ctx.createLinearGradient(W / 2 - 360, 72, W / 2 + 360, 72);
            barGrad.addColorStop(0, '#10b981');
            barGrad.addColorStop(1, '#0284c7');
            ctx.fillStyle = barGrad;
            ctx.fillRect(W / 2 - 360, 72, 720, 18);

            // 3. โลโก้หน่วยงาน (หากมี) หรือตราสัญลักษณ์ rjcloud.organ
            const logoImg = await loadImageSafe(tpl.logoUrl);
            let cursorY = 230;
            if (logoImg) {
                const maxH = 150;
                const ratio = Math.min(maxH / logoImg.height, 360 / logoImg.width);
                const lw = logoImg.width * ratio;
                const lh = logoImg.height * ratio;
                ctx.drawImage(logoImg, W / 2 - lw / 2, 130, lw, lh);
                cursorY = 320;
            } else {
                // วาดตราหัวใจ/คลินิกมินิมอล
                ctx.fillStyle = '#ecfdf5';
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(W / 2, 195, 58, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.fillStyle = '#059669';
                ctx.font = '800 32px "JetBrains Mono", monospace';
                ctx.fillText('RJ', W / 2, 207);
                cursorY = 305;
            }

            // 4. ข้อความหัวเรื่องและผู้รับ
            ctx.textAlign = 'center';
            ctx.fillStyle = '#047857';
            ctx.font = '700 40px "Prompt", sans-serif';
            ctx.fillText(tpl.orgTitleTH || '', W / 2, cursorY);

            ctx.fillStyle = '#64748b';
            ctx.font = '600 28px "JetBrains Mono", monospace';
            ctx.fillText(tpl.orgTitleEN || '', W / 2, cursorY + 52);

            ctx.fillStyle = '#0f172a';
            ctx.font = '800 88px "Prompt", sans-serif';
            ctx.fillText('ประกาศนียบัตร', W / 2, cursorY + 190);

            ctx.fillStyle = '#475569';
            ctx.font = '500 38px "Sarabun", sans-serif';
            ctx.fillText(tpl.subtitleTH || 'ขอมอบประกาศนียบัตรฉบับนี้เพื่อแสดงว่า', W / 2, cursorY + 275);

            // ชื่อผู้สำเร็จการอบรม
            ctx.fillStyle = '#064e3b';
            ctx.font = '800 94px "Prompt", sans-serif';
            ctx.fillText(user?.name || 'ผู้สำเร็จการอบรม', W / 2, cursorY + 415);

            // สังกัด / เลขใบอนุญาต
            const metaLine = [
                user?.position,
                user?.hospital,
                user?.license ? `เลขใบประกอบวิชาชีพ ${user.license}` : ''
            ].filter(Boolean).join(' • ');
            ctx.fillStyle = '#475569';
            ctx.font = '600 34px "Sarabun", sans-serif';
            ctx.fillText(metaLine, W / 2, cursorY + 485);

            // เส้นคั่นบางๆ
            ctx.strokeStyle = '#a7f3d0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 420, cursorY + 530);
            ctx.lineTo(W / 2 + 420, cursorY + 530);
            ctx.stroke();

            // ชื่อหลักสูตร
            ctx.fillStyle = '#334155';
            ctx.font = '500 38px "Sarabun", sans-serif';
            ctx.fillText(tpl.completionTextTH || '', W / 2, cursorY + 605);

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 48px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleTH || '', W / 2, cursorY + 690);

            ctx.fillStyle = '#0284c7';
            ctx.font = '600 32px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleEN || '', W / 2, cursorY + 750);

            // วันที่ให้ไว้
            const issuedLabel = `ให้ไว้ ณ วันที่ ${formatThaiDate(user?.certificateIssuedAt || new Date().toISOString())}`;
            ctx.fillStyle = '#64748b';
            ctx.font = '600 32px "Sarabun", sans-serif';
            ctx.fillText(issuedLabel, W / 2, cursorY + 835);

            // 5. ส่วนลายเซ็นผู้ลงนาม (ตรงกลางด้านล่าง)
            const signImg = await loadImageSafe(tpl.signatureUrl);
            if (signImg) {
                const maxSH = 130;
                const sRatio = Math.min(maxSH / signImg.height, 360 / signImg.width);
                const sw = signImg.width * sRatio;
                const sh = signImg.height * sRatio;
                ctx.drawImage(signImg, W / 2 - sw / 2, H - 410, sw, sh);
            }

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 300, H - 265);
            ctx.lineTo(W / 2 + 300, H - 265);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = '#0f172a';
            ctx.font = '700 40px "Prompt", sans-serif';
            ctx.fillText(tpl.signerName || '', W / 2, H - 205);

            ctx.fillStyle = '#64748b';
            ctx.font = '500 30px "Sarabun", sans-serif';
            ctx.fillText(tpl.signerPosition || '', W / 2, H - 155);

            // 6. รหัสอ้างอิงมุมซ้ายล่าง
            const certCode = user?.certificateCode || generateCertCode(tpl.certPrefix);
            ctx.textAlign = 'left';
            ctx.fillStyle = '#475569';
            ctx.font = '700 28px "JetBrains Mono", monospace';
            ctx.fillText(`CERTIFICATE ID: ${certCode}`, 145, H - 195);
            ctx.fillStyle = '#64748b';
            ctx.font = '500 24px "Sarabun", sans-serif';
            ctx.fillText('ตรวจสอบความถูกต้องได้ที่ verify.html หรือสแกน QR Code', 145, H - 152);

            // 7. วาด QR Code ความคมชัดสูง (มุมขวาล่าง)
            const basePath = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}`;
            const verifyUrl = `${basePath}verify.html?code=${encodeURIComponent(certCode)}`;
            const qrSize = 230;
            const qrX = W - 155 - qrSize;
            const qrY = H - 155 - qrSize;

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.fillRect(qrX - 18, qrY - 18, qrSize + 36, qrSize + 36);
            ctx.strokeRect(qrX - 18, qrY - 18, qrSize + 36, qrSize + 36);

            if (typeof window.qrcode === 'function') {
                try {
                    const qr = window.qrcode(0, 'M');
                    qr.addData(verifyUrl);
                    qr.make();
                    const count = qr.getModuleCount();
                    const cell = qrSize / count;
                    ctx.fillStyle = '#0f172a';
                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                ctx.fillRect(qrX + c * cell, qrY + r * cell, Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    }
                } catch (e) {
                    console.warn('QR draw error:', e);
                }
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#047857';
            ctx.font = '700 20px "JetBrains Mono", monospace';
            ctx.fillText('SCAN TO VERIFY', qrX + qrSize / 2, qrY + qrSize + 44);
        }

        // ============================================================================
        // 5. CERTIFICATE STUDIO VIEW (BUILT-IN PDF / PNG / MOBILE SHARE)
        // ============================================================================
        function CertificateStudioView({ user, certTemplate, onBack, onToast }) {
            const canvasRef = useRef(null);
            const [isRendering, setIsRendering] = useState(true);
            const [customTpl, setCustomTpl] = useState(certTemplate);
            const [showPreviewTweaker, setShowPreviewTweaker] = useState(false);

            const certCode = user?.certificateCode || generateCertCode(customTpl?.certPrefix);

            useEffect(() => {
                let mounted = true;
                setIsRendering(true);
                renderCertificateCanvas(canvasRef.current, { ...user, certificateCode: certCode }, customTpl)
                    .finally(() => { if (mounted) setIsRendering(false); });
                return () => { mounted = false; };
            }, [user, customTpl, certCode]);

            const handleDownloadPNG = () => {
                if (!canvasRef.current) return;
                const link = document.createElement('a');
                link.download = `rjcloud_certificate_${certCode}.png`;
                link.href = canvasRef.current.toDataURL('image/png');
                link.click();
                onToast('ดาวน์โหลดไฟล์รูปภาพ PNG เรียบร้อยแล้วค่ะ');
            };

            const handleShareMobile = async () => {
                if (!canvasRef.current) return;
                try {
                    const blob = await new Promise(resolve => canvasRef.current.toBlob(resolve, 'image/png'));
                    const file = new File([blob], `rjcloud_certificate_${certCode}.png`, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: 'ประกาศนียบัตร rjcloud.organ',
                            text: `ประกาศนียบัตรอิเล็กทรอนิกส์ rjcloud.organ (${certCode})`,
                            files: [file]
                        });
                        return;
                    }
                } catch (err) {
                    if (err?.name === 'AbortError') return;
                }
                handleDownloadPNG();
            };

            const handleDownloadPDF = () => {
                if (!canvasRef.current || !window.jspdf?.jsPDF) {
                    onToast('กำลังโหลดไลบรารี PDF กรุณาลองอีกครั้งในสักครู่ค่ะ', 'error');
                    return;
                }
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const imgData = canvasRef.current.toDataURL('image/jpeg', 0.96);
                pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
                pdf.save(`rjcloud_certificate_${certCode}.pdf`);
                onToast('สร้างและดาวน์โหลดไฟล์ PDF (A4 พร้อมพิมพ์) สำเร็จแล้วค่ะ');
            };

            const handleCopyVerifyLink = () => {
                const verifyUrl = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}verify.html?code=${encodeURIComponent(certCode)}`;
                const el = document.createElement('textarea');
                el.value = verifyUrl;
                document.body.appendChild(el);
                el.select();
                try {
                    document.execCommand('copy');
                    onToast('คัดลอกลิงก์ตรวจสอบความถูกต้องแล้วค่ะ');
                } catch {
                    onToast('ไม่สามารถคัดลอกได้ กรุณาเปิดหน้า verify.html ค่ะ', 'error');
                }
                document.body.removeChild(el);
            };

            return (
                <div className="min-h-dvh relative pt-safe pb-dock-safe md:pb-10">
                    <div className="aura-canvas" /><div className="aura-grid" />
                    <div className="w-full max-w-6xl mx-auto px-3 sm:px-4 pt-4 md:pt-8 relative z-10">
                        <div className="flex flex-wrap items-center justify-between gap-3 mb-4 md:mb-6">
                            <div className="flex items-center gap-3">
                                <button onClick={onBack} className="touch-target w-11 h-11 rounded-2xl bento-glass flex items-center justify-center text-slate-700 hover:text-clinical-600 active:scale-95">
                                    <Icon name="ArrowLeft" size={20} />
                                </button>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-clinical-100 text-clinical-700">STUDIO</span>
                                        <span className="text-[11px] font-mono text-slate-500">{certCode}</span>
                                    </div>
                                    <h2 className="font-display text-lg md:text-2xl font-bold text-slate-900 leading-tight">ประกาศนียบัตรอิเล็กทรอนิกส์</h2>
                                </div>
                            </div>

                            <div className="hidden md:flex flex-wrap gap-2">
                                <PrimaryButton variant="ghost" onClick={() => setShowPreviewTweaker(v => !v)} className="!py-2.5 !px-4 !text-xs">
                                    <Icon name="Sliders" size={16} /> {showPreviewTweaker ? 'ซ่อนแผงทดลองแก้ข้อความ' : 'ทดลองแก้ข้อความตัวอย่าง'}
                                </PrimaryButton>
                                <PrimaryButton variant="sky" onClick={handleDownloadPNG} className="!py-2.5 !px-4 !text-sm">
                                    <Icon name="Image" size={18} /> โหลด PNG
                                </PrimaryButton>
                                <PrimaryButton onClick={handleDownloadPDF} className="!py-2.5 !px-5 !text-sm">
                                    <Icon name="Download" size={18} /> โหลด PDF (A4)
                                </PrimaryButton>
                            </div>

                            <button
                                onClick={() => setShowPreviewTweaker(v => !v)}
                                className="md:hidden touch-target px-3.5 py-2 rounded-2xl bento-glass text-xs font-bold text-slate-700 flex items-center gap-1.5"
                            >
                                <Icon name="Sliders" size={15} className="text-clinical-600" /> {showPreviewTweaker ? 'ปิดแก้ไข' : 'แก้ข้อความ'}
                            </button>
                        </div>

                        {showPreviewTweaker && (
                            <BentoCard className="p-4 md:p-5 mb-4 md:mb-6 border-clinical-200">
                                <p className="text-xs font-bold text-clinical-700 flex items-center gap-1.5 mb-3">
                                    <Icon name="Edit3" size={15} /> ทดลองปรับข้อความตัวอย่างบนใบประกาศฯ
                                </p>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <InputField label="ชื่อหน่วยงานหลัก" value={customTpl.orgTitleTH} onChange={e => setCustomTpl(p => ({ ...p, orgTitleTH: e.target.value }))} />
                                    <InputField label="ชื่อหลักสูตร" value={customTpl.courseTitleTH} onChange={e => setCustomTpl(p => ({ ...p, courseTitleTH: e.target.value }))} />
                                    <InputField label="ชื่อผู้ลงนาม" value={customTpl.signerName} onChange={e => setCustomTpl(p => ({ ...p, signerName: e.target.value }))} />
                                    <InputField label="ตำแหน่งผู้ลงนาม" value={customTpl.signerPosition} onChange={e => setCustomTpl(p => ({ ...p, signerPosition: e.target.value }))} />
                                    <InputField label="ลิงก์โลโก้ PNG (ไม่บังคับ)" value={customTpl.logoUrl} placeholder="https://.../logo.png" onChange={e => setCustomTpl(p => ({ ...p, logoUrl: e.target.value }))} />
                                    <InputField label="ลิงก์ลายเซ็น PNG (ไม่บังคับ)" value={customTpl.signatureUrl} placeholder="https://.../sign.png" onChange={e => setCustomTpl(p => ({ ...p, signatureUrl: e.target.value }))} />
                                </div>
                            </BentoCard>
                        )}

                        <BentoCard className="p-2.5 sm:p-4 md:p-6">
                            <div className="relative w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-lg border border-slate-200/80">
                                {isRendering && (
                                    <div className="absolute inset-0 bg-white/85 backdrop-blur-sm flex flex-col items-center justify-center z-20 gap-3">
                                        <div className="w-10 h-10 border-4 border-clinical-500 border-t-transparent rounded-full animate-spin"></div>
                                        <p className="text-xs sm:text-sm font-semibold text-slate-600">กำลังสร้างประกาศนียบัตรความละเอียดสูง...</p>
                                    </div>
                                )}
                                <canvas ref={canvasRef} className="w-full h-full object-contain block" />
                            </div>

                            <div className="mt-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-3 pt-4 border-t border-slate-200/70">
                                <div className="flex items-center gap-3 text-xs text-slate-600">
                                    <div className="w-10 h-10 rounded-xl bg-clinical-50 text-clinical-600 flex items-center justify-center shrink-0">
                                        <Icon name="ShieldCheck" size={20} />
                                    </div>
                                    <div>
                                        <p className="font-bold text-slate-800">รับรองความถูกต้องด้วย QR Code</p>
                                        <p className="text-slate-500">รหัส <span className="font-mono font-bold text-clinical-700">{certCode}</span> ตรวจสอบได้ที่ verify.html</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 md:flex items-center gap-2 w-full md:w-auto">
                                    <button onClick={handleCopyVerifyLink} className="touch-target px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors">
                                        <Icon name="Copy" size={15} /> คัดลอกลิงก์
                                    </button>
                                    <a href={`./verify.html?code=${encodeURIComponent(certCode)}`} target="_blank" rel="noreferrer" className="touch-target px-3.5 py-2.5 rounded-xl bg-clinical-50 hover:bg-clinical-100 text-clinical-700 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors">
                                        <Icon name="ExternalLink" size={15} /> ตรวจสอบ QR
                                    </a>
                                </div>
                            </div>
                        </BentoCard>
                    </div>

                    {/* แถบปุ่มดาวน์โหลด/แชร์ติดขอบล่างเฉพาะสมาร์ทโฟน */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/92 backdrop-blur-xl border-t border-slate-200/80 px-3 pt-2.5 pb-[calc(0.75rem+env(safe-area-inset-bottom,0px))] shadow-[0_-10px_30px_rgba(15,23,42,0.08)]">
                        <div className="grid grid-cols-2 gap-2.5 max-w-lg mx-auto">
                            <PrimaryButton variant="sky" onClick={handleShareMobile} className="!py-3 !text-sm">
                                <Icon name="Share2" size={17} /> บันทึก / แชร์รูป
                            </PrimaryButton>
                            <PrimaryButton onClick={handleDownloadPDF} className="!py-3 !text-sm">
                                <Icon name="Download" size={17} /> โหลด PDF (A4)
                            </PrimaryButton>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 6. MAIN APPLICATION (RJCLOUD.ORGAN 2027)
        // ============================================================================
        function App() {
            // โหลดเซสชันล่าสุดจาก localStorage
            const initialSaved = useMemo(() => {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                } catch {
                    return null;
                }
            }, []);

            const [screen, setScreen] = useState(() => {
                const hash = window.location.hash.replace('#', '');
                if (hash === 'dashboard' && initialSaved?.user) return 'dashboard';
                if (initialSaved?.user && ['dashboard', 'certificate'].includes(initialSaved.screen)) return initialSaved.screen;
                return 'landing';
            });
            const [user, setUser] = useState(() => initialSaved?.user || null);
            const [activeTab, setActiveTab] = useState(() => initialSaved?.activeTab || 'video');
            const [currentVideoId, setCurrentVideoId] = useState(() => initialSaved?.currentVideoId || initialSaved?.user?.lastVideoId || 1);
            const [studySeconds, setStudySeconds] = useState(() => initialSaved?.studySeconds ?? initialSaved?.user?.studySeconds ?? 0);

            // Cloud & Dynamic Config States
            const [isCloudConnected, setIsCloudConnected] = useState(false);
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [lessons, setLessons] = useState(INITIAL_LESSONS);
            const [questionSets, setQuestionSets] = useState(() => [parseRawExams(INITIAL_QUIZ_RAW)]);
            const [certTemplate, setCertTemplate] = useState(() => {
                try {
                    const localTpl = localStorage.getItem('rjcloud_cert_template_v2027');
                    if (localTpl) return { ...DEFAULT_CERT_TEMPLATE, ...JSON.parse(localTpl) };
                } catch (_) {}
                return DEFAULT_CERT_TEMPLATE;
            });
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 10,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });
            const [leaderboard, setLeaderboard] = useState([]);

            // Auth Wizard States
            const [authStep, setAuthStep] = useState('license'); // license | profile | otp
            const [licenseInput, setLicenseInput] = useState('');
            const [regData, setRegData] = useState({
                license: '', name: '', email: '', phone: '', position: '',
                workContext: '', department: '', hospital: '', customHospital: '',
                province: '', userType: 'เรียนใหม่', isPrefilled: false
            });
            const [otpInput, setOtpInput] = useState('');
            const [sandboxOtp, setSandboxOtp] = useState('');
            const [isBusy, setIsBusy] = useState(false);

            // Quiz & CSAT States
            const [quiz, setQuiz] = useState({ type: 'pretest', questions: [], idx: 0, answers: {}, score: 0, timeLeft: 2700, finished: false });
            const [csatScore, setCsatScore] = useState(5);
            const [csatComment, setCsatComment] = useState('');
            const [certFormName, setCertFormName] = useState('');
            const [certFormHosp, setCertFormHosp] = useState('');

            // UI States
            const [lessonSearch, setLessonSearch] = useState('');
            const [isTabVisible, setIsTabVisible] = useState(!document.hidden);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const adminClickRef = useRef(0);
            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);

            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);

            // ระบุว่า Mount สำเร็จแล้วสำหรับ Error Guard
            useEffect(() => {
                const rootEl = document.getElementById('root');
                if (rootEl) rootEl.dataset.mounted = 'true';
            }, []);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            // บันทึกลง localStorage และ Firestore (ไม่ดึงข้อมูลส่วนตัวผู้เรียนคนอื่น - PDPA Safe!)
            const persistUser = useCallback(async (nextUser, syncCloud = true) => {
                setUser(nextUser);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        screen: 'dashboard',
                        user: nextUser,
                        activeTab,
                        currentVideoId: nextUser.lastVideoId || currentVideoId,
                        studySeconds: nextUser.studySeconds ?? studySecondsRef.current
                    }));
                } catch (_) {}

                if (syncCloud && isCloudConfigured && fbDb && nextUser?.id && !String(nextUser.id).startsWith('demo_')) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            nextUser,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Firestore save user warning:', err);
                    }
                }
            }, [activeTab, currentVideoId]);

            // 1. เชื่อมต่อ Firebase (Anonymous Auth + ฟังเฉพาะ Config & Public Leaderboard)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let unsubSettings = null, unsubContent = null, unsubBoard = null;

                signInAnonymously(fbAuth).catch(err => console.warn('Anon auth warning:', err));

                const unsubAuth = onAuthStateChanged(fbAuth, (fbUser) => {
                    if (!fbUser) return;
                    setIsCloudConnected(true);

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.liveConfig) setLiveConfig(prev => ({ ...prev, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(prev => ({ ...prev, ...d.certTemplate }));
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        },
                        () => {}
                    );

                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );

                    unsubBoard = onSnapshot(
                        collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard'),
                        (snap) => {
                            const list = [];
                            snap.forEach(docSnap => list.push({ id: docSnap.id, ...docSnap.data() }));
                            list.sort((a, b) => (b.score || 0) - (a.score || 0));
                            setLeaderboard(list.slice(0, 50));
                        },
                        () => {}
                    );
                });

                return () => {
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                    if (unsubBoard) unsubBoard();
                };
            }, []);

            // 2. ติดตาม Page Visibility (นับเวลาเฉพาะตอนเปิดหน้าจออยู่เท่านั้น + เซฟเมื่อสลับแท็บ)
            useEffect(() => {
                const onVisChange = () => {
                    const visible = !document.hidden;
                    setIsTabVisible(visible);
                    if (!visible && userRef.current) {
                        const u = userRef.current;
                        const secs = studySecondsRef.current;
                        persistUser({ ...u, studySeconds: secs, progress: calcProgress(secs, u.userType, liveConfig.hours) }, true);
                    }
                };
                document.addEventListener('visibilitychange', onVisChange);
                return () => document.removeEventListener('visibilitychange', onVisChange);
            }, [persistUser, liveConfig.hours]);

            // 3. นับเวลาเรียนสะสมอัตโนมัติ (เฉพาะตอนดูวิดีโอหรือเช็คอิน Live + หน้าจอเปิดอยู่)
            useEffect(() => {
                if (screen !== 'dashboard' || !user || !isTabVisible) return;
                const shouldCount = activeTab === 'video' || (activeTab === 'live' && liveConfig.status === 'live' && user.liveCheckedIn);
                if (!shouldCount) return;

                const interval = setInterval(() => {
                    setStudySeconds(prevSecs => {
                        const nextSecs = prevSecs + 10;
                        const curU = userRef.current;
                        if (!curU) return nextSecs;

                        const nextProg = calcProgress(nextSecs, curU.userType, liveConfig.hours);
                        const nextU = { ...curU, studySeconds: nextSecs, progress: nextProg };
                        const shouldSyncCloud = nextSecs % 30 === 0;
                        persistUser(nextU, shouldSyncCloud);

                        return nextSecs;
                    });
                }, 10000);

                return () => clearInterval(interval);
            }, [screen, user?.id, activeTab, isTabVisible, liveConfig.status, liveConfig.hours, user?.liveCheckedIn, persistUser, showToast]);

            // 4. ตัวจับเวลาข้อสอบ
            useEffect(() => {
                if (screen !== 'quiz' || quiz.finished) return;
                const timer = setInterval(() => {
                    setQuiz(prev => {
                        if (prev.timeLeft <= 1) {
                            clearInterval(timer);
                            return { ...prev, timeLeft: 0 };
                        }
                        return { ...prev, timeLeft: prev.timeLeft - 1 };
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [screen, quiz.finished]);

            // ส่งข้อสอบอัตโนมัติเมื่อหมดเวลา
            useEffect(() => {
                if (screen === 'quiz' && !quiz.finished && quiz.timeLeft === 0 && quiz.questions.length > 0) {
                    handleFinishQuiz(quiz);
                }
            }, [screen, quiz.timeLeft, quiz.finished]);

            // 5. เรียก Google Apps Script API
            const callAppsScript = async (payload) => {
                if (!appsScriptUrl) return { status: 'sandbox' };
                try {
                    const res = await fetch(appsScriptUrl, { method: 'POST', body: JSON.stringify(payload) });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            };

            // 6. Auth Handlers
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = licenseInput.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (!cleanLic) return showToast('กรุณาระบุเลขที่ใบประกอบวิชาชีพค่ะ', 'error');

                setIsBusy(true);
                let existing = null;
                if (isCloudConfigured && fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) existing = snap.data();
                    } catch (err) {
                        console.warn('License lookup warning:', err);
                    }
                }

                setRegData({
                    license: cleanLic,
                    name: existing?.name || '',
                    email: existing?.email || '',
                    phone: existing?.phone || '',
                    position: existing?.position || '',
                    workContext: existing?.workContext || '',
                    department: existing?.department || '',
                    hospital: existing?.hospital || '',
                    customHospital: '',
                    province: existing?.province || '',
                    // อ้างอิงสถานะจากเลขที่ใบอนุญาต: หากพบประวัติเดิมตั้งเป็น "เรียนต่อเนื่อง" อัตโนมัติ
                    userType: existing ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    isPrefilled: Boolean(existing),
                    _existingRecord: existing
                });
                setIsBusy(false);
                setAuthStep('profile');
            };

            const handleRequestOtp = async (e) => {
                e.preventDefault();
                if (!regData.email || !regData.name) return showToast('กรุณากรอกข้อมูลให้ครบถ้วนค่ะ', 'error');

                setIsBusy(true);
                setSandboxOtp('');
                const res = await callAppsScript({ action: 'requestOTP', email: regData.email.trim(), name: regData.name.trim() });
                setIsBusy(false);

                if (res?.status === 'success') {
                    showToast('ส่งรหัส OTP 6 หลักไปยังอีเมลของคุณแล้วค่ะ');
                    setAuthStep('otp');
                } else if (res?.status === 'sandbox') {
                    const demoCode = String(Math.floor(100000 + Math.random() * 900000));
                    setSandboxOtp(demoCode);
                    showToast(`โหมดทดสอบ: รหัส OTP คือ ${demoCode}`, 'info');
                    setAuthStep('otp');
                } else {
                    showToast(res?.message || 'ส่งรหัส OTP ไม่สำเร็จ กรุณาตรวจสอบอีเมลหรือลองใหม่อีกครั้งค่ะ', 'error');
                }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                if (otpInput.length < 6) return;
                setIsBusy(true);

                let verified = false;
                if (sandboxOtp) {
                    verified = otpInput === sandboxOtp;
                    if (!verified) {
                        setIsBusy(false);
                        return showToast('รหัส OTP ทดสอบไม่ถูกต้องค่ะ', 'error');
                    }
                } else {
                    const res = await callAppsScript({ action: 'verifyOTP', email: regData.email.trim(), otp: otpInput });
                    if (res?.status === 'success') {
                        verified = true;
                    } else {
                        setIsBusy(false);
                        return showToast(res?.message || 'รหัส OTP ไม่ถูกต้องหรือหมดอายุค่ะ', 'error');
                    }
                }

                if (!verified) return;

                const ex = regData._existingRecord || {};
                const isContinuing = Boolean(regData.isPrefilled || regData.userType === 'เรียนต่อเนื่อง');
                const finalUserType = isContinuing ? 'เรียนต่อเนื่อง' : 'เรียนใหม่';
                const initSecs = isContinuing ? (ex.studySeconds ?? 0) : 0;

                const finalHosp = regData.hospital === 'อื่นๆ'
                    ? regData.customHospital
                    : (regData.hospital === 'ศูนย์บริการสาธารณสุข' ? `ศูนย์บริการสาธารณสุข ${regData.customHospital}` : regData.hospital);

                const fullUser = {
                    ...(isContinuing ? ex : {}),
                    id: regData.license,
                    license: regData.license,
                    name: regData.name.trim(),
                    email: regData.email.trim(),
                    phone: regData.phone.trim(),
                    position: regData.position.trim(),
                    workContext: regData.workContext,
                    department: regData.department,
                    hospital: finalHosp || ex.hospital || '',
                    province: regData.province.trim(),
                    userType: finalUserType,
                    studySeconds: initSecs,
                    progress: calcProgress(initSecs, finalUserType, liveConfig.hours),
                    status: isContinuing ? (ex.status || 'กำลังเรียน') : 'กำลังเรียน',
                    pretest: isContinuing ? (ex.pretest || '-') : '-',
                    posttest: isContinuing ? (ex.posttest || '-') : '-',
                    skillLabPassed: isContinuing ? (ex.skillLabPassed ?? false) : false,
                    skillLabHistory: isContinuing ? (ex.skillLabHistory || []) : [],
                    lastVideoId: isContinuing ? (ex.lastVideoId || 1) : 1,
                    liveCheckedIn: isContinuing ? (ex.liveCheckedIn || false) : false
                };

                setStudySeconds(initSecs);
                setCurrentVideoId(fullUser.lastVideoId || 1);
                await persistUser(fullUser, true);
                callAppsScript({ action: 'upsertUser', user: fullUser });

                setIsBusy(false);
                setOtpInput('');

                if (fullUser.pretest === '-') {
                    startQuiz('pretest');
                } else {
                    setScreen('dashboard');
                    showToast(isContinuing ? `ยินดีต้อนรับกลับมาเรียนต่อค่ะ คุณ${fullUser.name}` : `ยินดีต้อนรับค่ะ คุณ${fullUser.name}`);
                }
            };

            const handleEnterDemoMode = (openCertDirectly = false) => {
                const demoUser = {
                    id: 'demo_65012345',
                    license: '65012345',
                    name: 'พว.ใจดี มีเมตตา (โหมดทดลอง)',
                    email: 'demo@rjcloud.organ',
                    phone: '0812345678',
                    position: 'พยาบาลวิชาชีพชำนาญการ (ICU)',
                    workContext: 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                    department: 'กรมการแพทย์',
                    hospital: 'โรงพยาบาลราชวิถี',
                    province: 'กรุงเทพมหานคร',
                    userType: 'เรียนต่อเนื่อง',
                    studySeconds: 28800,
                    progress: 100,
                    status: 'ผ่าน',
                    pretest: '30/40',
                    posttest: '38/40',
                    skillLabPassed: true,
                    skillLabHistory: [{ score: 92, passed: true, timestamp: new Date().toISOString() }],
                    satisfactionScore: 5,
                    certificateClaimed: true,
                    certificateCode: 'RJC-2027-DEMO01',
                    certificateIssuedAt: new Date().toISOString(),
                    lastVideoId: 1,
                    liveCheckedIn: false
                };
                setUser(demoUser);
                setStudySeconds(36000);
                setCurrentVideoId(1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ screen: 'dashboard', user: demoUser, activeTab: 'video', currentVideoId: 1, studySeconds: 36000 }));
                setScreen(openCertDirectly ? 'certificate' : 'dashboard');
                showToast(openCertDirectly ? 'เปิดตัวอย่าง Certificate Studio 2027 แล้วค่ะ' : 'เข้าสู่ระบบโหมดทดลองชม (Demo) เรียบร้อยค่ะ');
            };

            const handleLogout = async () => {
                if (user) {
                    const finalUser = {
                        ...user,
                        studySeconds,
                        progress: calcProgress(studySeconds, user.userType, liveConfig.hours)
                    };
                    await persistUser(finalUser, true);
                }
                localStorage.removeItem(STORAGE_KEY);
                setUser(null);
                setStudySeconds(0);
                setAuthStep('license');
                setLicenseInput('');
                setScreen('landing');
                showToast('ออกจากระบบเรียบร้อยแล้วค่ะ');
            };

            // 7. Quiz Handlers
            const startQuiz = (type) => {
                const rawSet = questionSets[0] || parseRawExams(INITIAL_QUIZ_RAW);
                const prepared = prepareShuffledExam(rawSet);
                setQuiz({ type, questions: prepared, idx: 0, answers: {}, score: 0, timeLeft: 2700, finished: false });
                setScreen('quiz');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleFinishQuiz = async (quizState) => {
                if (quizState.finished || !user) return;
                const score = quizState.questions.reduce((acc, q) => acc + (quizState.answers[q.id] === q.answer ? 1 : 0), 0);
                const total = quizState.questions.length || 1;
                const isPre = quizState.type === 'pretest';
                const passed = score >= Math.ceil(total * 0.8);

                const updatedUser = {
                    ...user,
                    ...(isPre
                        ? { pretest: `${score}/${total}` }
                        : { posttest: `${score}/${total}`, status: passed ? 'ผ่าน' : 'ไม่ผ่าน' })
                };

                setQuiz(prev => ({ ...prev, score, finished: true }));
                await persistUser(updatedUser, true);
                callAppsScript({ action: 'upsertUser', user: updatedUser });

                if (isPre) {
                    setScreen('quiz_result');
                } else if (passed) {
                    setCertFormName(updatedUser.name || '');
                    setCertFormHosp(updatedUser.hospital || '');
                    setScreen('cert_confirm');
                } else {
                    setScreen('quiz_fail');
                }
            };

            // 8. CSAT & Issue In-App Certificate
            const handleClaimCertificate = async (e) => {
                e.preventDefault();
                if (!user) return;
                setIsBusy(true);

                const certCode = user.certificateCode || generateCertCode(certTemplate.certPrefix);
                const issuedAt = user.certificateIssuedAt || new Date().toISOString();

                const nextUser = {
                    ...user,
                    name: certFormName.trim() || user.name,
                    hospital: certFormHosp.trim() || user.hospital,
                    status: 'ผ่าน',
                    satisfactionScore: csatScore,
                    satisfactionComment: csatComment.trim(),
                    certificateClaimed: true,
                    certificateCode: certCode,
                    certificateIssuedAt: issuedAt
                };

                await persistUser(nextUser, true);

                // บันทึกระเบียนตรวจสอบประกาศนียบัตรลง Firestore (สำหรับหน้า verify.html สแกน QR)
                const certPublicDoc = {
                    code: certCode,
                    name: nextUser.name,
                    license: nextUser.license || nextUser.id,
                    position: nextUser.position || 'บุคลากรทางการแพทย์',
                    hospital: nextUser.hospital || 'เครือข่าย rjcloud.organ',
                    department: nextUser.department || '',
                    province: nextUser.province || '',
                    userType: nextUser.userType || 'เรียนใหม่',
                    courseTitleTH: certTemplate.courseTitleTH,
                    orgTitleTH: certTemplate.orgTitleTH,
                    signerName: certTemplate.signerName,
                    signerPosition: certTemplate.signerPosition,
                    posttestScore: nextUser.posttest || 'ผ่านเกณฑ์',
                    issuedAt,
                    status: 'valid'
                };

                // บันทึก Local Cache เผื่อเปิด verify.html ในเครื่องเดียวกัน
                try {
                    const localCerts = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                    localCerts[certCode] = certPublicDoc;
                    localStorage.setItem('rjcloud_local_certificates', JSON.stringify(localCerts));
                } catch (_) {}

                if (isCloudConfigured && fbDb && !String(nextUser.id).startsWith('demo_')) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', certCode),
                            certPublicDoc,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Cert record save warning:', err);
                    }
                }

                callAppsScript({ action: 'upsertUser', user: nextUser });
                setIsBusy(false);
                showToast('ออกประกาศนียบัตรอิเล็กทรอนิกส์สำเร็จแล้วค่ะ 🎉');
                setScreen('certificate');
            };

            const handleLiveCheckIn = async () => {
                if (!user) return;
                const nextU = { ...user, liveCheckedIn: true, liveCheckedInAt: new Date().toISOString() };
                await persistUser(nextU, true);
                showToast('เช็คอินเข้าเรียน Live สดเรียบร้อยแล้วค่ะ ระบบจะนับเวลาให้อัตโนมัติ');
            };

            const handleAdminSecretClick = () => {
                adminClickRef.current += 1;
                if (adminClickRef.current >= 3) {
                    adminClickRef.current = 0;
                    window.open('./admin.html', '_blank');
                }
            };

            // ============================================================================
            // 7. RENDER SCREENS
            // ============================================================================

            // --- SCREEN 1: LANDING ---
            if (screen === 'landing') {
                return (
                    <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />

                        <header className="relative z-20 w-full max-w-6xl mx-auto px-4 md:px-8 pt-4 md:pt-6 flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shadow-lg shadow-clinical-500/25 shrink-0">
                                    <Icon name="HeartPulse" size={22} />
                                </div>
                                <div>
                                    <span className="font-display font-extrabold text-lg tracking-tight text-slate-900">rjcloud<span className="text-clinical-600">.organ</span></span>
                                    <p className="text-[10px] font-mono font-semibold text-slate-500 uppercase tracking-widest leading-none">2027 Clinical Edition</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <a href="./verify.html" className="touch-target px-3 sm:px-4 py-2 rounded-full bento-glass text-xs font-bold text-slate-700 hover:text-clinical-700 inline-flex items-center gap-1.5 transition-colors">
                                    <Icon name="QrCode" size={16} className="text-clinical-600" /> <span className="hidden sm:inline">ตรวจสอบประกาศฯ</span>
                                </a>
                                <a href="./executive.html" className="touch-target px-3 sm:px-4 py-2 rounded-full bento-glass text-xs font-bold text-slate-700 hover:text-medical-600 inline-flex items-center gap-1.5 transition-colors">
                                    <Icon name="Globe" size={16} className="text-medical-500" /> <span className="hidden sm:inline">Executive</span>
                                </a>
                            </div>
                        </header>

                        <main className="relative z-10 flex-1 w-full max-w-6xl mx-auto px-4 md:px-8 py-6 md:py-12 flex flex-col justify-center">
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-center">
                                <div className="lg:col-span-7 space-y-4 md:space-y-6">
                                    <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-clinical-50 border border-clinical-200/80 text-clinical-700 text-[11px] md:text-xs font-bold">
                                        <span className="w-2 h-2 rounded-full bg-clinical-500 animate-pulse" />
                                        {isCloudConnected ? 'Cloud Connected • rjcloud.organ' : 'Mobile Ready • rjcloud.organ 2027'}
                                    </div>

                                    <h1 className="font-display text-3xl sm:text-4xl lg:text-6xl font-extrabold text-slate-900 leading-[1.18] tracking-tight">
                                        ยกระดับการเรียนรู้ <br />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-clinical-600 via-teal-600 to-medical-600">
                                            การรับบริจาคและปลูกถ่ายอวัยวะ
                                        </span>
                                    </h1>

                                    <p className="text-slate-600 text-sm sm:text-base md:text-lg leading-relaxed max-w-xl">
                                        แพลตฟอร์มการเรียนรู้ออนไลน์บนสมาร์ทโฟนสำหรับบุคลากรทางการแพทย์ ครบทั้ง 20 บทเรียน ห้องจำลองฝึกเจรจา AI Skill Lab และประกาศนียบัตรพร้อม QR Code ในตัว
                                    </p>

                                    <div className="flex flex-col sm:flex-row gap-2.5 sm:gap-3 pt-1">
                                        <PrimaryButton onClick={() => setScreen('auth')} className="w-full sm:w-auto sm:px-8 py-4 text-base">
                                            เข้าสู่ระบบผู้เรียน <Icon name="ArrowRight" size={20} />
                                        </PrimaryButton>
                                        <PrimaryButton variant="ghost" onClick={() => handleEnterDemoMode(false)} className="w-full sm:w-auto py-3.5 text-sm">
                                            <Icon name="Sparkles" size={18} className="text-clinical-600" /> ทดลองชมระบบ (Demo)
                                        </PrimaryButton>
                                    </div>

                                    <div className="pt-1 flex flex-wrap items-center justify-between sm:justify-start gap-3 text-xs text-slate-500 font-medium">
                                        <button onClick={() => handleEnterDemoMode(true)} className="text-clinical-700 hover:underline font-bold flex items-center gap-1.5 py-1">
                                            <Icon name="Award" size={15} /> ดูตัวอย่างใบประกาศนียบัตร 2027
                                        </button>
                                        <span className="flex items-center gap-1.5 text-[11px]"><Icon name="Mail" size={13} className="text-clinical-600" /> {CONFIG.contactEmail}</span>
                                    </div>
                                </div>

                                <div className="lg:col-span-5 grid grid-cols-2 gap-3 md:gap-4 pb-12 sm:pb-0">
                                    <BentoCard className="col-span-2 p-4 sm:p-6 relative overflow-hidden">
                                        <div className="flex items-start justify-between mb-3">
                                            <div className="w-11 h-11 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center">
                                                <Icon name="Award" size={24} />
                                            </div>
                                            <span className="px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 font-mono text-[10px] font-bold border border-amber-200/70">NEW IN 2027</span>
                                        </div>
                                        <h3 className="font-display font-bold text-base sm:text-lg text-slate-900 mb-1">In-App Certificate Studio</h3>
                                        <p className="text-xs text-slate-600 leading-relaxed">ออกประกาศนียบัตร PDF / PNG ได้ทันทีบนมือถือ พร้อมแชร์ลง LINE และฝัง QR Code ยืนยันความถูกต้อง</p>
                                    </BentoCard>

                                    <BentoCard className="p-4 sm:p-5">
                                        <div className="w-9 h-9 rounded-xl bg-medical-50 text-medical-600 flex items-center justify-center mb-2.5">
                                            <Icon name="PlayCircle" size={20} />
                                        </div>
                                        <p className="font-display font-bold text-xl sm:text-2xl text-slate-900">{lessons.length}</p>
                                        <p className="text-xs text-slate-500 font-medium mt-0.5">บทเรียนวิดีโอ & เอกสาร</p>
                                    </BentoCard>

                                    <BentoCard className="p-4 sm:p-5">
                                        <div className="w-9 h-9 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center mb-2.5">
                                            <Icon name="Bot" size={20} />
                                        </div>
                                        <p className="font-display font-bold text-xl sm:text-2xl text-slate-900">AI Lab</p>
                                        <p className="text-xs text-slate-500 font-medium mt-0.5">จำลองฝึกเจรจาญาติ</p>
                                    </BentoCard>
                                </div>
                            </div>
                        </main>

                        <button
                            onClick={handleAdminSecretClick}
                            title="System Settings"
                            className="fixed bottom-[calc(1rem+env(safe-area-inset-bottom,0px))] left-4 z-40 w-10 h-10 rounded-full bento-glass text-slate-400 hover:text-slate-700 flex items-center justify-center transition-colors"
                        >
                            <Icon name="Settings" size={18} />
                        </button>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 2: AUTH WIZARD ---
            if (screen === 'auth') {
                const depts = [...Object.keys(HOSPITAL_MAPPING).filter(k => k !== 'อื่นๆ'), 'อื่นๆ'];
                const hospOptions = regData.department && HOSPITAL_MAPPING[regData.department]
                    ? [...new Set([...HOSPITAL_MAPPING[regData.department].map(h => h.name), 'อื่นๆ'])]
                    : ['อื่นๆ'];

                return (
                    <div className="min-h-dvh relative flex items-start sm:items-center justify-center p-3 sm:p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />

                        <BentoCard className="relative z-10 w-full max-w-lg p-5 sm:p-8 md:p-10 my-auto">
                            <div className="flex items-center justify-between mb-5">
                                <button
                                    onClick={() => authStep === 'license' ? setScreen('landing') : setAuthStep(authStep === 'otp' ? 'profile' : 'license')}
                                    className="touch-target inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 hover:text-slate-900 bg-slate-100/90 px-3.5 py-2 rounded-full transition-colors"
                                >
                                    <Icon name="ArrowLeft" size={15} /> ย้อนกลับ
                                </button>
                                <span className="font-mono text-xs font-bold text-clinical-600 bg-clinical-50 px-3 py-1 rounded-full">
                                    {authStep === 'license' ? 'STEP 1/3' : authStep === 'profile' ? 'STEP 2/3' : 'STEP 3/3'}
                                </span>
                            </div>

                            {authStep === 'license' && (
                                <form onSubmit={handleCheckLicense} className="space-y-5">
                                    <div className="text-center">
                                        <div className="w-14 h-14 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto mb-3.5">
                                            <Icon name="BadgeCheck" size={30} />
                                        </div>
                                        <h2 className="font-display text-2xl font-bold text-slate-900">ตรวจสอบสิทธิ์ผู้เรียน</h2>
                                        <p className="text-sm text-slate-500 mt-1">กรอกเลขที่ใบประกอบวิชาชีพเพื่อเริ่มต้นใช้งาน rjcloud.organ</p>
                                    </div>
                                    <input
                                        type="text"
                                        required
                                        autoComplete="off"
                                        placeholder="ระบุเลขที่ใบประกอบวิชาชีพ"
                                        value={licenseInput}
                                        onChange={e => setLicenseInput(e.target.value)}
                                        className="touch-target w-full px-4 py-4 text-center font-mono text-xl tracking-wider rounded-2xl bg-white border border-slate-200 focus:border-clinical-500 focus:ring-4 focus:ring-clinical-500/10 outline-none"
                                    />
                                    <PrimaryButton type="submit" disabled={isBusy || !licenseInput.trim()} className="w-full py-4">
                                        {isBusy ? 'กำลังตรวจสอบ...' : 'ตรวจสอบสิทธิ์'} <Icon name="ArrowRight" size={18} />
                                    </PrimaryButton>
                                </form>
                            )}

                            {authStep === 'profile' && (
                                <form onSubmit={handleRequestOtp} className="space-y-4">
                                    <div className="text-center mb-3">
                                        <h2 className="font-display text-xl font-bold text-slate-900">ยืนยันข้อมูลผู้เรียน</h2>
                                        <p className="text-xs text-slate-500 mt-1">
                                            ข้อมูลนี้จะนำไปแสดงบนประกาศนียบัตรอิเล็กทรอนิกส์
                                            {regData.isPrefilled && <span className="ml-2 px-2 py-0.5 rounded-full bg-clinical-100 text-clinical-700 font-bold">พบข้อมูลเดิม</span>}
                                        </p>
                                    </div>

                                    <div className="space-y-3 sm:max-h-[52vh] sm:overflow-y-auto custom-scrollbar sm:pr-1">
                                        <InputField label="ชื่อ - นามสกุล" required value={regData.name} onChange={e => setRegData(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา" />
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <InputField label="เลขที่ใบอนุญาต" disabled value={regData.license} />
                                            <SelectField label="สิทธิ์การเรียน" disabled={regData.isPrefilled} value={regData.userType} options={['เรียนใหม่', 'เรียนต่อเนื่อง']} onChange={e => setRegData(p => ({ ...p, userType: e.target.value }))} />
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <InputField label="อีเมล (สำหรับรับรหัส OTP)" type="email" inputMode="email" required value={regData.email} onChange={e => setRegData(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" />
                                            <InputField label="เบอร์โทรศัพท์" type="tel" inputMode="tel" required value={regData.phone} onChange={e => setRegData(p => ({ ...p, phone: e.target.value }))} placeholder="08xxxxxxxx" />
                                        </div>
                                        <InputField label="ตำแหน่ง" required value={regData.position} onChange={e => setRegData(p => ({ ...p, position: e.target.value }))} placeholder="พยาบาลวิชาชีพ / แพทย์ / เภสัชกร" />
                                        <SelectField
                                            label="ลักษณะงานปัจจุบัน"
                                            required
                                            value={regData.workContext}
                                            options={['ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ', 'ไม่ได้ปฏิบัติงานด้านนี้โดยตรง แต่สนใจศึกษา']}
                                            onChange={e => setRegData(p => ({ ...p, workContext: e.target.value }))}
                                        />
                                        <SelectField
                                            label="สังกัด / เขตสุขภาพ"
                                            required
                                            value={regData.department}
                                            options={depts}
                                            onChange={e => setRegData(p => ({ ...p, department: e.target.value, hospital: '', province: '', customHospital: '' }))}
                                        />
                                        <SelectField
                                            label="หน่วยงาน / โรงพยาบาล"
                                            required
                                            disabled={!regData.department}
                                            value={regData.hospital}
                                            options={hospOptions}
                                            onChange={e => {
                                                const hosp = e.target.value;
                                                const match = (HOSPITAL_MAPPING[regData.department] || []).find(h => h.name === hosp);
                                                setRegData(p => ({ ...p, hospital: hosp, province: match?.prov || (hosp === 'อื่นๆ' ? '' : p.province), customHospital: '' }));
                                            }}
                                        />
                                        {(regData.hospital === 'อื่นๆ' || regData.hospital === 'ศูนย์บริการสาธารณสุข') && (
                                            <InputField
                                                label={regData.hospital === 'อื่นๆ' ? 'ระบุชื่อหน่วยงาน' : 'ระบุหมายเลขศูนย์บริการสาธารณสุข'}
                                                required
                                                value={regData.customHospital}
                                                onChange={e => setRegData(p => ({ ...p, customHospital: e.target.value }))}
                                            />
                                        )}
                                        <InputField
                                            label="จังหวัด"
                                            required
                                            disabled={regData.hospital !== 'อื่นๆ' && !!regData.province}
                                            value={regData.province}
                                            onChange={e => setRegData(p => ({ ...p, province: e.target.value }))}
                                        />
                                    </div>

                                    <PrimaryButton type="submit" disabled={isBusy} className="w-full mt-3 py-4">
                                        {isBusy ? 'กำลังส่งรหัส OTP...' : 'ขอรับรหัส OTP ทางอีเมล'} <Icon name="Mail" size={18} />
                                    </PrimaryButton>
                                </form>
                            )}

                            {authStep === 'otp' && (
                                <form onSubmit={handleVerifyOtp} className="space-y-5 text-center">
                                    <div className="w-14 h-14 rounded-2xl bg-medical-50 text-medical-600 flex items-center justify-center mx-auto">
                                        <Icon name="ShieldCheck" size={30} />
                                    </div>
                                    <div>
                                        <h2 className="font-display text-2xl font-bold text-slate-900">ยืนยันรหัส OTP</h2>
                                        <p className="text-xs text-slate-500 mt-1">กรอกรหัส 6 หลักที่ส่งไปยัง <span className="font-bold text-slate-700">{regData.email}</span></p>
                                    </div>
                                    {sandboxOtp && (
                                        <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs font-medium">
                                            รหัส OTP ทดสอบคือ <b className="font-mono text-sm">{sandboxOtp}</b>
                                        </div>
                                    )}
                                    <input
                                        type="text"
                                        inputMode="numeric"
                                        autoComplete="one-time-code"
                                        required
                                        maxLength="6"
                                        placeholder="000000"
                                        value={otpInput}
                                        onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))}
                                        className="touch-target w-60 mx-auto block px-4 py-4 text-center font-mono text-3xl tracking-[0.3em] rounded-2xl bg-white border border-slate-200 focus:border-clinical-500 focus:ring-4 focus:ring-clinical-500/10 outline-none"
                                    />
                                    <PrimaryButton type="submit" disabled={isBusy || otpInput.length < 6} className="w-full py-4">
                                        {isBusy ? 'กำลังตรวจสอบ...' : 'เข้าสู่ห้องเรียน'} <Icon name="LogIn" size={18} />
                                    </PrimaryButton>
                                </form>
                            )}
                        </BentoCard>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 3: QUIZ ---
            if (screen === 'quiz') {
                const q = quiz.questions[quiz.idx];
                const selectedOpt = q ? quiz.answers[q.id] : undefined;
                if (!q) return null;

                return (
                    <div className="min-h-dvh relative flex flex-col items-center justify-start md:justify-center p-3 sm:p-4 pt-safe pb-dock-safe md:pb-8">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-3xl p-5 sm:p-8 md:p-10 mt-2 md:mt-0">
                            <div className="flex flex-wrap items-center justify-between gap-2.5 mb-4">
                                <div>
                                    <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-clinical-100 text-clinical-700">
                                        {quiz.type === 'pretest' ? 'PRE-TEST' : 'POST-TEST (ผ่าน 80%)'}
                                    </span>
                                    <h2 className="font-display text-lg md:text-xl font-bold text-slate-900 mt-1">
                                        แบบทดสอบ{quiz.type === 'pretest' ? 'ก่อนเรียน' : 'หลังเรียน'}
                                    </h2>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="px-3 py-2 rounded-xl bg-slate-100 font-mono text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                        <Icon name="Clock" size={14} className="text-clinical-600" />
                                        {Math.floor(quiz.timeLeft / 60)}:{String(quiz.timeLeft % 60).padStart(2, '0')}
                                    </div>
                                    <div className="px-3 py-2 rounded-xl bg-clinical-50 font-mono text-xs font-bold text-clinical-700">
                                        {quiz.idx + 1} / {quiz.questions.length}
                                    </div>
                                </div>
                            </div>

                            <div className="w-full h-2 rounded-full bg-slate-100 overflow-hidden mb-6">
                                <div className="h-full bg-gradient-to-r from-clinical-500 to-medical-500 transition-all duration-300" style={{ width: `${((quiz.idx + 1) / quiz.questions.length) * 100}%` }} />
                            </div>

                            <h3 className="font-display text-base sm:text-lg md:text-xl font-semibold text-slate-900 mb-5 leading-relaxed">
                                <span className="text-clinical-600 mr-2">{quiz.idx + 1}.</span>{q.question}
                            </h3>

                            <div className="space-y-2.5 sm:space-y-3">
                                {q.options.map((opt, oIdx) => {
                                    const active = selectedOpt === oIdx;
                                    return (
                                        <button
                                            key={oIdx}
                                            type="button"
                                            onClick={() => setQuiz(p => ({ ...p, answers: { ...p.answers, [q.id]: oIdx } }))}
                                            className={`touch-target w-full text-left p-4 rounded-2xl border transition-all flex items-center gap-3.5 active:scale-[0.99] ${
                                                active
                                                    ? 'bg-clinical-50 border-clinical-500 text-clinical-900 font-semibold shadow-sm'
                                                    : 'bg-white/90 border-slate-200 hover:border-clinical-300 text-slate-700'
                                            }`}
                                        >
                                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${active ? 'border-clinical-600 bg-white' : 'border-slate-300'}`}>
                                                {active && <div className="w-3 h-3 rounded-full bg-clinical-600" />}
                                            </div>
                                            <span className="text-sm sm:text-base leading-snug">{opt}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="hidden md:flex items-center justify-between mt-8 pt-4 border-t border-slate-100">
                                <PrimaryButton variant="ghost" disabled={quiz.idx === 0} onClick={() => setQuiz(p => ({ ...p, idx: Math.max(0, p.idx - 1) }))}>
                                    <Icon name="ArrowLeft" size={18} /> ข้อก่อนหน้า
                                </PrimaryButton>
                                {quiz.idx < quiz.questions.length - 1 ? (
                                    <PrimaryButton disabled={selectedOpt === undefined} onClick={() => setQuiz(p => ({ ...p, idx: p.idx + 1 }))}>
                                        ข้อถัดไป <Icon name="ArrowRight" size={18} />
                                    </PrimaryButton>
                                ) : (
                                    <PrimaryButton onClick={() => handleFinishQuiz(quiz)} disabled={selectedOpt === undefined}>
