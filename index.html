    <title>rjcloud.organ 2.0 — Organ Transplantation Center of Rajavithi Hospital</title>

    <!-- ซิงค์โหมดมืด/สว่าง + โหลดไฟล์ร่วมเฉพาะเมื่ออยู่บนโดเมนเว็บจริง (ป้องกัน 404 ในโหมดพรีวิว) -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('rjcloud_theme') || 'dark';
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&
            loc.origin !== 'null' &&
            !/(googleusercontent|webcontainer|stackblitz|sandbox|srcdoc|blob:)/i.test(loc.href);
          if (isRealHost) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './styles.css';
            document.head.appendChild(css);

            ['./data.js', './learning-core.js', './cert-engine.js', './keynote-launch.js'].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

    <!-- Tailwind CSS, jsPDF, QR Generator & ฟอนต์ภาษาไทยสไตล์ Apple -->

    <style>
      /* ============================================================================
       * 1. ADAPTIVE THEME TOKENS (DARK & LIGHT MODE)
       * ============================================================================ */
      :root, html[data-theme="dark"] {
        --bg-page: #020612;
        --text-main: #f8fafc;
        --text-secondary: #dbeafe;
        --text-muted: #93b4d8;
        --glass-bg: linear-gradient(145deg, rgba(16, 40, 86, 0.56) 0%, rgba(5, 16, 40, 0.86) 100%);
        --glass-border: rgba(186, 230, 253, 0.24);
        --glass-shadow: 0 24px 54px -18px rgba(0, 8, 28, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        --header-bg: rgba(4, 12, 30, 0.86);
        --surface-soft: rgba(147, 197, 253, 0.08);
        --surface-soft-hover: rgba(147, 197, 253, 0.16);
        --surface-border: rgba(186, 230, 253, 0.18);
        --input-bg: rgba(6, 18, 44, 0.86);
        --input-border: rgba(147, 197, 253, 0.3);
        --input-text: #f8fafc;
        --accent-text: #6ee7b7;
        --accent-prism: #67e8f9;
        --grid-line: rgba(147, 197, 253, 0.055);
        --aura-1: rgba(22, 92, 196, 0.34);
        --aura-2: rgba(56, 189, 248, 0.22);
        --aura-3: rgba(168, 85, 247, 0.16);
      }
      html[data-theme="light"] {
        --bg-page: #edf6fd;
        --text-main: #0c1b33;
        --text-secondary: #284366;
        --text-muted: #5a7496;
        --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.94) 0%, rgba(232, 244, 253, 0.86) 100%);
        --glass-border: rgba(255, 255, 255, 0.96);
        --glass-shadow: 0 18px 42px -14px rgba(15, 58, 125, 0.14);
        --header-bg: rgba(244, 250, 255, 0.9);
        --surface-soft: rgba(255, 255, 255, 0.82);
        --surface-soft-hover: rgba(255, 255, 255, 0.98);
        --surface-border: rgba(125, 175, 226, 0.32);
        --input-bg: rgba(255, 255, 255, 0.95);
        --input-border: rgba(148, 184, 222, 0.65);
        --input-text: #0c1b33;
        --accent-text: #047857;
        --accent-prism: #0369a1;
        --grid-line: rgba(22, 92, 196, 0.04);
        --aura-1: rgba(75, 152, 232, 0.24);
        --aura-2: rgba(169, 214, 247, 0.36);
        --aura-3: rgba(192, 132, 252, 0.14);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Anuphan', 'Sarabun', sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.28s ease, color 0.28s ease;
      }

      .touch-target { min-height: 46px; touch-action: manipulation; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      @media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }

      .spatial-aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 90% 55% at 50% 108%, var(--aura-1) 0%, transparent 66%),
          radial-gradient(circle at 86% 14%, var(--aura-2) 0%, transparent 48%),
          radial-gradient(circle at 14% 28%, var(--aura-3) 0%, transparent 46%);
      }
      .spatial-grid {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at center, black 42%, transparent 94%);
      }
      .spatial-card {
        background: var(--glass-bg);
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      .spatial-header {
        background: var(--header-bg);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border-bottom: 1px solid var(--surface-border);
      }
      .spatial-soft { background: var(--surface-soft); border: 1px solid var(--surface-border); transition: background 0.18s ease, border-color 0.18s ease; }
      .spatial-soft:hover { background: var(--surface-soft-hover); }
      .spatial-input { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); }
      .spatial-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22); }

      /* ปุ่ม Pill พร้อมแสงสะท้อนพาดผ่าน (ข้อ 5: Button Sheen Sweep) */
      .rjc2-pill-btn {
        position: relative;
        overflow: hidden;
        background: linear-gradient(95deg, #d7fbe6 0%, #c6f3f9 48%, #b3c8ff 100%);
        color: #050b16 !important;
        box-shadow: 0 10px 28px -6px rgba(134, 239, 172, 0.52), 0 0 0 1px rgba(255, 255, 255, 0.82) inset;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
        text-decoration: none;
        cursor: pointer;
      }
      .rjc2-pill-btn::after {
        content: '';
        position: absolute;
        top: -20%;
        left: -68%;
        width: 44%;
        height: 140%;
        background: linear-gradient(105deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.72) 50%, rgba(255, 255, 255, 0) 100%);
        transform: skewX(-22deg);
        pointer-events: none;
        animation: btnSheenSweep 5.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .rjc2-pill-btn:hover {
        transform: translateY(-2px) scale(1.025);
        box-shadow: 0 16px 36px -6px rgba(147, 197, 253, 0.78), 0 0 24px rgba(187, 247, 208, 0.7), 0 0 0 1.5px rgba(255, 255, 255, 0.95) inset;
      }
      .rjc2-pill-btn:active { transform: scale(0.97); }

      .text-primary-adaptive { color: var(--text-main); }
      .text-secondary-adaptive { color: var(--text-secondary); }
      .text-muted-adaptive { color: var(--text-muted); }
      .text-accent-adaptive { color: var(--accent-text); }
      .text-prism-adaptive { color: var(--accent-prism); }
      html[data-theme="dark"] select option { background-color: #061229; color: #f8fafc; }

      /* ============================================================================
       * 2. EPIC LANDING HERO ATMOSPHERE & LIQUID GLASS CHAMBER
       * ============================================================================ */
      .hero-atmosphere {
        background: linear-gradient(
          180deg,
          #000000 0%,
          #000000 21%,
          #030c1e 36%,
          #07255e 52%,
          #165cc4 70%,
          #4b98e8 85%,
          #a9d6f7 95%,
          #c9e7fc 100%
        );
      }
      .lower-landing-bg {
        background: linear-gradient(
          180deg,
          #c9e7fc 0%,
          #93c5f0 10%,
          #16448e 36%,
          #061430 68%,
          #020612 100%
        );
      }

      .liquid-glass-backdrop {
        clip-path: url(#idxLiquidGlassClipNorm);
        -webkit-clip-path: url(#idxLiquidGlassClipNorm);
        background: radial-gradient(
          circle at var(--gx, 32%) var(--gy, 28%),
          rgba(255, 255, 255, 0.17) 0%,
          rgba(186, 224, 255, 0.065) 40%,
          rgba(15, 58, 130, 0.1) 76%,
          rgba(255, 255, 255, 0.04) 100%
        );
        backdrop-filter: blur(5px) saturate(145%) brightness(1.06);
        -webkit-backdrop-filter: blur(5px) saturate(145%) brightness(1.06);
        transition: background 0.2s ease;
      }
      .liquid-glass-mobile {
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.15) 0%, rgba(160, 210, 255, 0.06) 46%, rgba(16, 65, 148, 0.24) 100%);
        backdrop-filter: blur(8px) saturate(145%);
        -webkit-backdrop-filter: blur(8px) saturate(145%);
        border: 1.25px solid rgba(255, 255, 255, 0.54);
        box-shadow: 0 22px 50px -15px rgba(0, 18, 56, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.58);
      }
      #idx-liquid-glass-stage { container-type: inline-size; }
      .hero-eyebrow {
        letter-spacing: 0.045em;
        background: rgba(255, 255, 255, 0.11);
        border: 1px solid rgba(255, 255, 255, 0.38);
        box-shadow: 0 4px 18px rgba(0, 14, 44, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.44);
        text-shadow: 0 1px 8px rgba(0, 12, 42, 0.65);
      }
      .hero-headline {
        font-weight: 500;
        letter-spacing: -0.015em;
        text-shadow: 0 2px 14px rgba(0, 10, 38, 0.85), 0 1px 4px rgba(0, 12, 42, 0.72), 0 0 26px rgba(147, 210, 255, 0.25);
      }
      .hero-year-highlight {
        font-weight: 700;
        letter-spacing: -0.015em;
        background: linear-gradient(95deg, #ffffff 0%, #fffbeb 42%, #fde68a 74%, #bae6fd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-top: 0.04em;
        padding-bottom: 0.04em;
        filter: drop-shadow(0 3px 16px rgba(0, 12, 44, 0.85)) drop-shadow(0 0 26px rgba(253, 224, 71, 0.38));
      }
      .beta-glow {
        font-weight: 300;
        color: #fffce0;
        letter-spacing: 0.015em;
        text-shadow: 0 0 10px rgba(254, 249, 195, 0.88), 0 0 26px rgba(253, 224, 71, 0.48), 0 0 46px rgba(250, 204, 21, 0.26);
      }
      .rajavithi-watermark {
        color: rgba(38, 68, 112, 0.88);
        letter-spacing: 0.06em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
      }

      /* ============================================================================
       * 3. LIVING TREE, STARS, CLOUDS & EPIC UPGRADE ANIMATIONS (1 + 2 + 4 + 5)
       * ============================================================================ */
      @keyframes treeCanopySway {
        0%, 100% { transform: rotate(0deg) scale(1); }
        32% { transform: rotate(1.1deg) scale(1.007); }
        68% { transform: rotate(-1.0deg) scale(1.004); }
      }
      @keyframes branchSwayLeft {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(-2.1deg); }
        75% { transform: rotate(1.2deg); }
      }
      @keyframes branchSwayRight {
        0%, 100% { transform: rotate(0deg); }
        38% { transform: rotate(2.0deg); }
        76% { transform: rotate(-1.25deg); }
      }
      @keyframes leafFlutterOrganic {
        0%, 100% { transform: rotate(0deg) translate(0, 0) scale(1); filter: brightness(1); }
        30% {
          transform: rotate(var(--fl-rot, 8deg)) translate(var(--fl-x, 1.4px), var(--fl-y, -1.8px)) scale(1.09);
          filter: brightness(1.32) drop-shadow(0 0 8px var(--aura-col, rgba(167, 243, 208, 0.92)));
        }
        62% {
          transform: rotate(calc(var(--fl-rot, 8deg) * -0.55)) translate(calc(var(--fl-x, 1.4px) * -0.5), 1px) scale(0.98);
          filter: brightness(1.06);
        }
      }
      @keyframes leafAuraHaloSync {
        0%, 100% { opacity: 0.14; transform: scale(0.8); }
        30% { opacity: 0.9; transform: scale(1.7); }
        62% { opacity: 0.28; transform: scale(1.08); }
      }
      @keyframes nodePulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes auraWispRise {
        0% { opacity: 0; transform: translate(0, 0) scale(0.45); }
        18% { opacity: 0.94; transform: translate(calc(var(--dx, 6px) * 0.25), -8px) scale(1.18); }
        68% { opacity: 0.54; transform: translate(calc(var(--dx, 6px) * 0.8), -32px) scale(1.48); }
        100% { opacity: 0; transform: translate(var(--dx, 6px), -54px) scale(0.5); }
      }
      @keyframes auraRingExpand {
        0% { opacity: 0.82; transform: scale(0.45); }
        100% { opacity: 0; transform: scale(2.8); }
      }
      @keyframes twinkleStar {
        0%, 100% { opacity: 0.18; transform: scale(0.85); }
        50% { opacity: 0.96; transform: scale(1.32); }
      }
      @keyframes meteorStreak {
        0% { opacity: 0; transform: rotate(var(--ang, -32deg)) translateX(130px) scaleX(0.35); }
        4% { opacity: 1; }
        16% { opacity: 0.96; transform: rotate(var(--ang, -32deg)) translateX(-380px) scaleX(1.12); }
        25%, 100% { opacity: 0; transform: rotate(var(--ang, -32deg)) translateX(-640px) scaleX(0.55); }
      }
      @keyframes cloudDriftAcross {
        0% { transform: translate3d(-44vw, 0, 0); }
        100% { transform: translate3d(118vw, 0, 0); }
      }
      @keyframes cloudBankFloat {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(16px, -8px, 0) scale(1.03); }
      }
      @keyframes cloudBankFloatAlt {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(-16px, -7px, 0) scale(1.03); }
      }
      @keyframes lifeforcePulseFlow {
        0% { stroke-dashoffset: 24; opacity: 0; }
        10% { opacity: 0.98; }
        78% { opacity: 0.92; }
        100% { stroke-dashoffset: -108; opacity: 0; }
      }
      @keyframes heartBeatGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(244, 114, 182, 0.72)); }
        22% { transform: scale(1.16); filter: drop-shadow(0 0 15px rgba(253, 224, 71, 0.95)); }
        42% { transform: scale(1.02); filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.8)); }
        60% { transform: scale(1.12); filter: drop-shadow(0 0 14px rgba(244, 114, 182, 0.95)); }
      }
      @keyframes auroraCurtainWave {
        0%, 100% { transform: translate3d(-4%, 0, 0) skewX(-6deg) scaleY(1); opacity: 0.56; }
        35% { transform: translate3d(3%, -2%, 0) skewX(5deg) scaleY(1.08); opacity: 0.84; }
        70% { transform: translate3d(-2%, 1.5%, 0) skewX(-3deg) scaleY(0.95); opacity: 0.66; }
      }
      @keyframes auroraCurtainAlt {
        0%, 100% { transform: translate3d(4%, 0, 0) skewX(7deg) scaleY(1.04); opacity: 0.44; }
        50% { transform: translate3d(-5%, -2.5%, 0) skewX(-6deg) scaleY(0.92); opacity: 0.76; }
      }
      @keyframes glassEdgeSweep {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes btnSheenSweep {
        0%, 66% { left: -68%; opacity: 0; }
        72% { opacity: 1; }
        94% { left: 128%; opacity: 0.95; }
        100% { left: 132%; opacity: 0; }
      }
      @keyframes rjcAmbientRun { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes rjcWaveBar { 0%, 100% { transform: scaleY(0.28); opacity: 0.65; } 50% { transform: scaleY(1); opacity: 1; } }
      @keyframes appSpin { to { transform: rotate(360deg); } }

      .tree-living-root { transform-origin: 260px 398px; animation: treeCanopySway 9.5s ease-in-out infinite; will-change: transform; }
      .branch-group-left { transform-origin: 252px 236px; animation: branchSwayLeft 6.8s ease-in-out infinite; }
      .branch-group-right { transform-origin: 268px 236px; animation: branchSwayRight 7.4s ease-in-out infinite; animation-delay: -1.4s; }
      .living-leaf { transform-box: fill-box; transform-origin: center; animation: leafFlutterOrganic var(--dur, 4.4s) ease-in-out infinite; animation-delay: var(--del, 0s); }
      .leaf-aura-halo { transform-box: fill-box; transform-origin: center; pointer-events: none; animation: leafAuraHaloSync var(--dur, 4.4s) ease-in-out infinite; animation-delay: var(--del, 0s); }
      .cloud-node-pulse { transform-box: fill-box; transform-origin: center; animation: nodePulseGlow 3.6s ease-in-out infinite; }
      .aura-wisp { transform-box: fill-box; transform-origin: center; animation: auraWispRise var(--wisp-dur, 2.5s) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .aura-ring-burst { transform-box: fill-box; transform-origin: center; animation: auraRingExpand 1.35s ease-out forwards; }

      .lifeforce-pulse {
        stroke-dasharray: 22 130;
        stroke-dashoffset: 24;
        stroke-linecap: round;
        opacity: 0;
        animation: lifeforcePulseFlow var(--p-dur, 4.4s) cubic-bezier(0.32, 0.08, 0.24, 1) infinite;
        animation-delay: var(--p-del, 0s);
        filter: drop-shadow(0 0 6px var(--p-glow, rgba(167, 243, 208, 0.95)));
      }
      .heart-leaf-beat {
        transform-box: fill-box;
        transform-origin: center;
        animation: heartBeatGlow 4.2s ease-in-out infinite;
        animation-delay: var(--h-del, 0s);
      }
      .aurora-curtain-primary {
        background:
          radial-gradient(ellipse 46% 78% at 28% 58%, rgba(52, 211, 153, 0.36) 0%, rgba(56, 189, 248, 0.15) 48%, transparent 76%),
          radial-gradient(ellipse 48% 72% at 68% 52%, rgba(56, 189, 248, 0.32) 0%, rgba(192, 132, 252, 0.2) 50%, transparent 78%);
        filter: blur(28px);
        mix-blend-mode: screen;
        will-change: transform, opacity;
        animation: auroraCurtainWave 16s ease-in-out infinite;
      }
      .aurora-curtain-secondary {
        background:
          radial-gradient(ellipse 52% 68% at 52% 46%, rgba(110, 231, 183, 0.28) 0%, rgba(168, 85, 247, 0.22) 44%, transparent 74%),
          radial-gradient(ellipse 36% 66% at 80% 60%, rgba(244, 114, 182, 0.22) 0%, transparent 70%);
        filter: blur(34px);
        mix-blend-mode: screen;
        will-change: transform, opacity;
        animation: auroraCurtainAlt 21s ease-in-out infinite;
      }
      .glass-edge-sweep {
        stroke-dasharray: 18 82;
        stroke-dashoffset: 100;
        stroke-linecap: round;
        animation: glassEdgeSweep 6.6s linear infinite;
        filter: drop-shadow(0 0 6px rgba(186, 230, 253, 0.95)) drop-shadow(0 0 14px rgba(253, 224, 71, 0.65));
      }

      .twinkle-star {
        position: absolute; border-radius: 9999px; background: #ffffff;
        box-shadow: 0 0 6px rgba(186, 230, 253, 0.85);
        animation: twinkleStar var(--tw-dur, 4s) ease-in-out infinite;
        animation-delay: var(--tw-del, 0s);
      }
      .shooting-star {
        position: absolute; width: var(--len, 155px); height: 2px; border-radius: 9999px; opacity: 0;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.98) 0%, var(--trail-col, rgba(125, 211, 252, 0.78)) 28%, rgba(192, 132, 252, 0.18) 65%, rgba(255, 255, 255, 0) 100%);
        filter: drop-shadow(0 0 6px var(--trail-col, rgba(125, 211, 252, 0.88)));

        // Studio 24kHz TTS Helpers (ไร้ซับไตเติลกวนสายตา)
        function pcmToWavBlobSafe(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = Math.max(0, bytes.length - off);
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return new Blob([buf], { type: 'audio/wav' });
            } catch (_) { return null; }
        }

        async function fetchStudioGuideBlob({ appsScriptUrl, text, cacheKey, signal }) {
            if (cacheKey && typeof CORE.getCachedAudio === 'function') {
                try { const hit = await CORE.getCachedAudio(cacheKey); if (hit && hit.size > 0) return hit; } catch (_) {}
            }
            if (!appsScriptUrl || !navigator.onLine) return null;
            for (let attempt = 0; attempt < 2; attempt++) {
                if (signal?.aborted) return null;
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort, { once: true });
                const tm = setTimeout(() => ctrl.abort(), 45000);
                try {
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'callGeminiTTS', text, voiceName: 'Sulafat', languageCode: 'th-TH', style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ เป็นมิตรเหมือนผู้ดูแลหลักสูตร' }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                    if (signal?.aborted) return null;
                    const res = JSON.parse((await rawRes.text()) || '{}');
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rateMatch = String(res.inlineData.mimeType || '').match(/rate=(\d+)/);
                        const blob = pcmToWavBlobSafe(res.inlineData.data, parseInt(rateMatch ? rateMatch[1] : '24000', 10));
                        if (blob && blob.size > 0) {
                            if (cacheKey && typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(cacheKey, blob).catch(() => {});
                            return blob;
                        }
                    }
                } catch (_) {
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
                if (attempt === 0 && !signal?.aborted) await new Promise(r => setTimeout(r, 1000));
            }
            return null;
        }

        }

        // ============================================================================
        // 3. EPIC LANDING HERO SCREEN (ต้นไม้มีชีวิต + 1 ชีพจรแสง + 2 หิ่งห้อยแตะผลิบาน + 4 ออโรรา/God Rays + 5 แสงขอบกระจก)
        // ============================================================================
        function LandingHeroScreen({ onStartAuth, hasSavedSession, onResumeDashboard }) {
            const heroStageRef = useRef(null);
            const flareCanvasRef = useRef(null);
            const treeSvgRef = useRef(null);
            const particleLayerRef = useRef(null);
            const bloomLeavesRef = useRef(null);
            const glassStageRef = useRef(null);
            const textFitBoxRef = useRef(null);
            const fitLine1Ref = useRef(null);
            const fitLine2Ref = useRef(null);
            const centerCtaRef = useRef(null);
            const mTextFitBoxRef = useRef(null);
            const mFitLine1Ref = useRef(null);
            const mFitLine2Ref = useRef(null);

            const leftLeaves = useMemo(() => ([
                { cx: 86, cy: 254, rx: 14, ry: 7, rot: -24 }, { cx: 104, cy: 282, rx: 13, ry: 6.5, rot: -40 },
                { cx: 78, cy: 220, rx: 14, ry: 7, rot: -8 }, { cx: 88, cy: 184, rx: 14, ry: 7, rot: 14 },
                { cx: 110, cy: 146, rx: 13, ry: 6.5, rot: 28 }, { cx: 144, cy: 110, rx: 13, ry: 6.5, rot: 42 },
                { cx: 176, cy: 76, rx: 13, ry: 6.5, rot: 56 }, { cx: 212, cy: 54, rx: 12, ry: 6, rot: 72 },
                { cx: 136, cy: 174, rx: 11, ry: 5.5, rot: 12 }, { cx: 152, cy: 210, rx: 11, ry: 5.5, rot: -18 },
                { cx: 192, cy: 134, rx: 11, ry: 5.5, rot: 36 }, { cx: 222, cy: 98, rx: 11, ry: 5.5, rot: 62 },
                { cx: 122, cy: 240, rx: 12, ry: 6, rot: -25 }
            ]), []);

            const rightLeaves = useMemo(() => ([
                { cx: 260, cy: 38, rx: 7, ry: 15, rot: 0 }, { cx: 308, cy: 54, rx: 12, ry: 6, rot: -72 },
                { cx: 344, cy: 76, rx: 13, ry: 6.5, rot: -56 }, { cx: 376, cy: 110, rx: 13, ry: 6.5, rot: -42 },
                { cx: 410, cy: 146, rx: 13, ry: 6.5, rot: -28 }, { cx: 432, cy: 184, rx: 14, ry: 7, rot: -14 },
                { cx: 442, cy: 220, rx: 14, ry: 7, rot: 8 }, { cx: 434, cy: 254, rx: 14, ry: 7, rot: 24 },
                { cx: 416, cy: 282, rx: 13, ry: 6.5, rot: 40 }, { cx: 384, cy: 174, rx: 11, ry: 5.5, rot: -12 },
                { cx: 368, cy: 210, rx: 11, ry: 5.5, rot: 18 }, { cx: 328, cy: 134, rx: 11, ry: 5.5, rot: -36 },
                { cx: 298, cy: 98, rx: 11, ry: 5.5, rot: -62 }, { cx: 398, cy: 240, rx: 12, ry: 6, rot: 25 }
            ]), []);

            // 1. วงโค้งสุริยคราส Eclipse Arc, Volumetric God Rays (ข้อ 4) & Touch-to-Bloom Firefly Trail (ข้อ 2)
            useEffect(() => {
                const canvas = flareCanvasRef.current;
                const stage = heroStageRef.current;
                if (!canvas || !stage) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const flare = {
                    targetMouseX: 0, targetMouseY: 0, mouseX: 0, mouseY: 0,
                    w: window.innerWidth, h: window.innerHeight,
                    crestX: window.innerWidth * 0.5, crestY: window.innerHeight * 0.14
                };

                const fireflies = [];
                const bloomRipples = [];
                const floatingHearts = [];
                const FIREFLY_COLORS = ['#fef08a', '#a7f3d0', '#bae6fd', '#f5d0fe', '#ffffff'];
                let lastTrailTs = 0;

                const spawnFirefly = (x, y, boosted = false) => {
                    if (fireflies.length >= 76) fireflies.shift();
                    const angle = Math.random() * Math.PI * 2;
                    const speed = boosted ? (0.75 + Math.random() * 2.1) : (0.18 + Math.random() * 0.65);
                    fireflies.push({
                        x: x + (Math.random() - 0.5) * (boosted ? 12 : 8),
                        y: y + (Math.random() - 0.5) * (boosted ? 12 : 8),
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - (boosted ? 0.95 : 0.42),
                        r: boosted ? (1.8 + Math.random() * 2.6) : (1.1 + Math.random() * 1.9),
                        life: 0,
                        maxLife: boosted ? (0.95 + Math.random() * 0.75) : (0.65 + Math.random() * 0.6),
                        twinkle: Math.random() * Math.PI * 2,
                        color: FIREFLY_COLORS[Math.floor(Math.random() * FIREFLY_COLORS.length)]
                    });
                };

                const spawnBloomBurst = (clientX, clientY) => {
                    const rect = stage.getBoundingClientRect();
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;

                    if (bloomRipples.length >= 8) bloomRipples.shift();
                    bloomRipples.push({ x, y, r: 8, maxR: Math.min(rect.width, rect.height) * 0.24 + 48, life: 0, maxLife: 1.05 });

                    for (let i = 0; i < 16; i++) spawnFirefly(x, y, true);

                    for (let i = 0; i < 5; i++) {
                        if (floatingHearts.length >= 24) floatingHearts.shift();
                        floatingHearts.push({
                            x: x + (Math.random() - 0.5) * 34,
                            y: y + (Math.random() - 0.5) * 18,
                            vx: (Math.random() - 0.5) * 0.7,
                            vy: -(0.85 + Math.random() * 0.95),
                            size: 4.5 + Math.random() * 4.2,
                            sway: Math.random() * Math.PI * 2,
                            life: 0,
                            maxLife: 1.55 + Math.random() * 0.8,
                            color: i % 2 === 0 ? '#f472b6' : '#fde68a'
                        });
                    }

                    if (typeof bloomLeavesRef.current === 'function') bloomLeavesRef.current(4);
                };

                const drawMiniHeart = (c, hx, hy, sz, col, alpha) => {
                    c.save();
                    c.translate(hx, hy);
                    c.globalAlpha = alpha;
                    c.fillStyle = col;
                    c.shadowColor = col;
                    c.shadowBlur = 10;
                    c.beginPath();
                    c.moveTo(0, sz * 0.35);
                    c.bezierCurveTo(-sz * 0.55, -sz * 0.35, -sz * 1.15, sz * 0.25, 0, sz * 1.05);
                    c.bezierCurveTo(sz * 1.15, sz * 0.25, sz * 0.55, -sz * 0.35, 0, sz * 0.35);
                    c.fill();
                    c.restore();
                };

                const fitLineToWidth = (el, targetW, minPx, maxPx) => {
                    if (!el || targetW <= 0) return;
                    el.style.fontSize = '32px';
                    const measured = el.scrollWidth;
                    if (!measured) return;
                    const clamped = Math.max(minPx, Math.min(maxPx, (targetW / measured) * 32));
                    el.style.fontSize = `${clamped.toFixed(2)}px`;
                };

                const syncLayout = () => {
                    const heroRect = stage.getBoundingClientRect();
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    flare.w = Math.max(1, heroRect.width);
                    flare.h = Math.max(1, heroRect.height);
                    canvas.width = Math.round(flare.w * dpr);
                    canvas.height = Math.round(flare.h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    if (treeSvgRef.current) {
                        const tr = treeSvgRef.current.getBoundingClientRect();
                        if (tr.width > 0 && tr.height > 0) {
                            flare.crestX = (tr.left - heroRect.left) + tr.width * 0.5;
                            flare.crestY = (tr.top - heroRect.top) + tr.height * (flare.w < 768 ? 0.035 : 0.075);
                        }
                    }

                    if (textFitBoxRef.current && fitLine1Ref.current && textFitBoxRef.current.clientWidth > 0) {
                        const tw = textFitBoxRef.current.clientWidth * 0.99;
                        fitLineToWidth(fitLine1Ref.current, tw, 16, 36);
                        if (fitLine2Ref.current) {
                            const cw = centerCtaRef.current?.clientWidth ? centerCtaRef.current.clientWidth * 0.94 : tw * 0.49;
                            fitLineToWidth(fitLine2Ref.current, Math.min(tw * 0.49, cw), 16, 34);
                        }
                    }
                    if (mTextFitBoxRef.current && mFitLine1Ref.current && mFitLine2Ref.current && mTextFitBoxRef.current.clientWidth > 0) {
                        const mw = mTextFitBoxRef.current.clientWidth * 0.98;
                        fitLineToWidth(mFitLine1Ref.current, mw, 13, 21);
                        fitLineToWidth(mFitLine2Ref.current, mw * 0.54, 17, 26);
                    }
                };

                const drawSoftOrb = (x, y, r, stops) => {
                    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                };

                const drawAnamorphicStreak = (x, y, halfLen, height, stops) => {
                    ctx.save();
                    ctx.translate(x, y);
                    const g = ctx.createLinearGradient(-halfLen, 0, halfLen, 0);
                    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, halfLen, height, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                };

                let alive = true, rafId = null, prevFrameTs = performance.now();
                const renderLoop = (now) => {
                    if (!alive) return;
                    rafId = requestAnimationFrame(renderLoop);
                    if (document.hidden) return;

                    const dt = Math.min(0.05, Math.max(0.001, (now - prevFrameTs) / 1000));
                    prevFrameTs = now;

                    const w = flare.w, h = flare.h;
                    ctx.clearRect(0, 0, w, h);

                    flare.mouseX += (flare.targetMouseX - flare.mouseX) * 0.055;
                    flare.mouseY += (flare.targetMouseY - flare.mouseY) * 0.055;

                    const t = now * 0.001;
                    const k = 0.9 * (0.92 + 0.08 * Math.sin(t * 1.15));
                    const minDim = Math.min(w, h);

                    ctx.globalCompositeOperation = 'lighter';

                    const arcR = Math.max(w * 0.62, 520);
                    const arcCx = flare.crestX + flare.mouseX * 14;
                    const arcCy = flare.crestY + arcR + flare.mouseY * 8;

                    ctx.save();
                    const arcGrad = ctx.createLinearGradient(w * 0.14, flare.crestY, w * 0.86, flare.crestY);
                    arcGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
                    arcGrad.addColorStop(0.24, `rgba(56, 189, 248, ${(0.34 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.45, `rgba(186, 230, 253, ${(0.76 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.51, `rgba(255, 250, 215, ${(0.98 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.64, `rgba(110, 231, 183, ${(0.58 * k).toFixed(3)})`);
                    arcGrad.addColorStop(0.84, `rgba(129, 140, 248, ${(0.20 * k).toFixed(3)})`);
                    arcGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');

                    ctx.strokeStyle = arcGrad;
                    ctx.lineWidth = 12;
                    ctx.filter = 'blur(9px)';
                    ctx.beginPath();
                    ctx.arc(arcCx, arcCy, arcR, Math.PI * 1.28, Math.PI * 1.72);
                    ctx.stroke();

                    ctx.filter = 'none';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(arcCx, arcCy, arcR, Math.PI * 1.30, Math.PI * 1.70);
                    ctx.stroke();
                    ctx.restore();

                    const fx = arcCx + Math.sin(t * 0.22) * Math.min(w * 0.04, 38);
                    const fy = arcCy - Math.sqrt(Math.max(0, arcR * arcR - Math.pow(fx - arcCx, 2)));

                    // ลำแสงสวรรค์ (ข้อ 4: Volumetric God Rays)
                    ctx.save();
                    const rayAngles = [-0.52, -0.27, -0.04, 0.21, 0.46];
                    const rayLen = h * 0.72;
                    for (let i = 0; i < rayAngles.length; i++) {
                        const sway = Math.sin(t * 0.42 + i * 1.35) * 0.045 + flare.mouseX * 0.035;
                        const ang = Math.PI * 0.5 + rayAngles[i] + sway;
                        const spread = 0.075 + (i % 2) * 0.025;
                        const pulse = 0.054 + 0.026 * Math.sin(t * 0.85 + i * 1.9);
                        const x1 = fx + Math.cos(ang - spread) * rayLen, y1 = fy + Math.sin(ang - spread) * rayLen;
                        const x2 = fx + Math.cos(ang + spread) * rayLen, y2 = fy + Math.sin(ang + spread) * rayLen;

                        const rGrad = ctx.createLinearGradient(fx, fy, fx + Math.cos(ang) * rayLen, fy + Math.sin(ang) * rayLen);
                        rGrad.addColorStop(0, `rgba(254, 249, 195, ${(pulse * 1.75 * k).toFixed(3)})`);
                        rGrad.addColorStop(0.32, i % 2 === 0 ? `rgba(125, 211, 252, ${(pulse * 1.12 * k).toFixed(3)})` : `rgba(110, 231, 183, ${(pulse * 1.04 * k).toFixed(3)})`);
                        rGrad.addColorStop(0.76, `rgba(186, 230, 253, ${(pulse * 0.35 * k).toFixed(3)})`);
                        rGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = rGrad;
                        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath(); ctx.fill();
                    }
                    ctx.restore();

                    // ดวงแสง Solar Flare หลักหลังยอดใบไม้
                    drawSoftOrb(fx, fy, minDim * 0.34, [
                        [0, `rgba(255, 254, 244, ${(0.95 * k).toFixed(3)})`],
                        [0.14, `rgba(254, 240, 178, ${(0.58 * k).toFixed(3)})`],
                        [0.36, `rgba(125, 211, 252, ${(0.24 * k).toFixed(3)})`],
                        [1, 'rgba(0, 0, 0, 0)']
                    ]);

                    // เส้นแสงเลนส์อนามอร์ฟิกแนวนอน
                    drawAnamorphicStreak(fx, fy, w * 0.36, 2.8, [
                        [0, 'rgba(125, 211, 252, 0)'],
                        [0.35, `rgba(125, 211, 252, ${(0.34 * k).toFixed(3)})`],
                        [0.5, `rgba(255, 255, 255, ${(0.95 * k).toFixed(3)})`],
                        [0.65, `rgba(253, 224, 71, ${(0.34 * k).toFixed(3)})`],
                        [1, 'rgba(125, 211, 252, 0)']
                    ]);

                    // Bokeh อ่อนๆ
                    drawSoftOrb(fx + flare.mouseX * -28, fy + 28 + flare.mouseY * -14, minDim * 0.075, [
                        [0, `rgba(167, 243, 208, ${(0.18 * k).toFixed(3)})`],
                        [0.6, `rgba(56, 189, 248, ${(0.08 * k).toFixed(3)})`],
                        [1, 'rgba(0, 0, 0, 0)']
                    ]);

                    // ระลอกคลื่นแสง Touch-to-Bloom (ข้อ 2)
                    for (let i = bloomRipples.length - 1; i >= 0; i--) {
                        const rp = bloomRipples[i];
                        rp.life += dt;
                        const prog = rp.life / rp.maxLife;
                        if (prog >= 1) { bloomRipples.splice(i, 1); continue; }
                        const curR = rp.r + (rp.maxR - rp.r) * (1 - Math.pow(1 - prog, 2.5));
                        const alpha = (1 - prog) * 0.72;
                        ctx.save();
                        const rg = ctx.createRadialGradient(rp.x, rp.y, Math.max(1, curR * 0.65), rp.x, rp.y, curR);
                        rg.addColorStop(0, 'rgba(253, 224, 71, 0)');
                        rg.addColorStop(0.75, `rgba(244, 114, 182, ${(alpha * 0.42).toFixed(3)})`);
                        rg.addColorStop(1, `rgba(186, 230, 253, ${(alpha * 0.85).toFixed(3)})`);
                        ctx.strokeStyle = rg;
                        ctx.lineWidth = 2.4 * (1 - prog * 0.55);
                        ctx.beginPath(); ctx.arc(rp.x, rp.y, curR, 0, Math.PI * 2); ctx.stroke();
                        ctx.restore();
                    }

                    // ละอองหิ่งห้อยแสงดาว (ข้อ 2)
                    for (let i = fireflies.length - 1; i >= 0; i--) {
                        const f = fireflies[i];
                        f.life += dt;
                        const prog = f.life / f.maxLife;
                        if (prog >= 1) { fireflies.splice(i, 1); continue; }
                        f.x += f.vx * (dt * 60) + Math.sin(t * 4.2 + f.twinkle) * 0.28;
                        f.y += f.vy * (dt * 60);
                        f.vy *= 0.985;
                        const fade = Math.sin(prog * Math.PI);
                        const glowR = f.r * (2.6 + 0.8 * Math.sin(t * 9 + f.twinkle));
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, fade * 0.92);
                        drawSoftOrb(f.x, f.y, glowR, [[0, '#ffffff'], [0.35, f.color], [1, 'rgba(0,0,0,0)']]);
                        ctx.restore();
                    }

                    // ละอองหัวใจจิ๋วเรืองแสงลอยขึ้น (ข้อ 2)
                    for (let i = floatingHearts.length - 1; i >= 0; i--) {
                        const ht = floatingHearts[i];
                        ht.life += dt;
                        const prog = ht.life / ht.maxLife;
                        if (prog >= 1) { floatingHearts.splice(i, 1); continue; }
                        ht.x += (ht.vx + Math.sin(t * 3.1 + ht.sway) * 0.45) * (dt * 60);
                        ht.y += ht.vy * (dt * 60);
                        drawMiniHeart(ctx, ht.x, ht.y, ht.size * (0.8 + prog * 0.38), ht.color, Math.sin(prog * Math.PI) * 0.88);
                    }
                };

                const onMouseMove = (e) => {
                    flare.targetMouseX = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
                    flare.targetMouseY = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
                    const nowTs = performance.now();
                    if (nowTs - lastTrailTs > 28) {
                        lastTrailTs = nowTs;
                        const sRect = stage.getBoundingClientRect();
                        if (e.clientX >= sRect.left && e.clientX <= sRect.right && e.clientY >= sRect.top && e.clientY <= sRect.bottom) {
                            spawnFirefly(e.clientX - sRect.left, e.clientY - sRect.top, false);
                        }
                    }
                    const gs = glassStageRef.current;
                    if (gs) {
                        const rect = gs.getBoundingClientRect();
                        if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                            gs.style.setProperty('--gx', `${(((e.clientX - rect.left) / rect.width) * 100).toFixed(1)}%`);
                            gs.style.setProperty('--gy', `${(((e.clientY - rect.top) / rect.height) * 100).toFixed(1)}%`);
                        }
                    }
                };
                const onTouchMove = (e) => {
                    if (!e.touches || !e.touches[0]) return;
                    const tx = e.touches[0].clientX, ty = e.touches[0].clientY;
                    flare.targetMouseX = (tx / Math.max(1, window.innerWidth) - 0.5) * 2;
                    flare.targetMouseY = (ty / Math.max(1, window.innerHeight) - 0.5) * 2;
                    const nowTs = performance.now();
                    if (nowTs - lastTrailTs > 32) {
                        lastTrailTs = nowTs;
                        const sRect = stage.getBoundingClientRect();
                        spawnFirefly(tx - sRect.left, ty - sRect.top, false);
                    }
                };
                const onStageTap = (e) => {
                    if (e.target && e.target.closest && e.target.closest('button, a, input, select')) return;
                    const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
                    if (pt && typeof pt.clientX === 'number') spawnBloomBurst(pt.clientX, pt.clientY);
                };

                syncLayout();
                rafId = requestAnimationFrame(renderLoop);
                window.addEventListener('resize', syncLayout);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('touchmove', onTouchMove, { passive: true });
                stage.addEventListener('mousedown', onStageTap);
                stage.addEventListener('touchstart', onStageTap, { passive: true });
                let ro = null;
                if (typeof ResizeObserver !== 'undefined') { ro = new ResizeObserver(syncLayout); ro.observe(stage); }
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncLayout).catch(() => {});

                return () => {
                    alive = false; if (rafId) cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', syncLayout);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('touchmove', onTouchMove);
                    stage.removeEventListener('mousedown', onStageTap);
                    stage.removeEventListener('touchstart', onStageTap);
                    if (ro) ro.disconnect();
                };
            }, []);

            // 2. Bio-Luminescent Aura Particle Emitter (ละอองแสงและวงแหวนออร่าจากใบไม้ + ปลุกผลิบานเมื่อแตะ)
            useEffect(() => {
                const SVG_NS = 'http://www.w3.org/2000/svg';
                const allNodes = [
                    ...leftLeaves.map(l => ({ x: l.cx, y: l.cy, side: 'left' })),
                    ...rightLeaves.map(l => ({ x: l.cx, y: l.cy, side: 'right' })),
                    { x: 132, y: 208, side: 'heart' },
                    { x: 172, y: 162, side: 'heart' }
                ];
                let activeCount = 0;

                const emitLeafAura = (boosted = false) => {
                    const layer = particleLayerRef.current;
                    if (!layer || document.hidden || activeCount >= 28) return;
                    const leaf = allNodes[Math.floor(Math.random() * allNodes.length)];
                    const gradFill = leaf.side === 'heart' ? 'url(#auraHeartGrad)' : leaf.side === 'left' ? 'url(#auraPinkGrad)' : 'url(#auraCyanGrad)';
                    const strokeHex = leaf.side === 'heart' ? '#fbcfe8' : leaf.side === 'left' ? '#f0abfc' : '#99f6e4';

                    const ring = document.createElementNS(SVG_NS, 'circle');
                    ring.setAttribute('cx', String(leaf.x)); ring.setAttribute('cy', String(leaf.y));
                    ring.setAttribute('r', boosted ? '12' : '9');
                    ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', strokeHex);
                    ring.setAttribute('stroke-width', boosted ? '1.8' : '1.3');
                    ring.setAttribute('class', 'aura-ring-burst');
                    layer.appendChild(ring);
                    activeCount += 1;
                    setTimeout(() => { if (ring.parentNode) ring.parentNode.removeChild(ring); activeCount = Math.max(0, activeCount - 1); }, 1400);

                    const wisp = document.createElementNS(SVG_NS, 'circle');
                    const dx = `${((Math.random() - 0.5) * (boosted ? 44 : 34)).toFixed(1)}px`;
                    const durSec = (2.1 + Math.random() * 1.1).toFixed(2);
                    wisp.setAttribute('cx', (leaf.x + (Math.random() - 0.5) * 10).toFixed(1));
                    wisp.setAttribute('cy', (leaf.y + (Math.random() - 0.5) * 6).toFixed(1));
                    wisp.setAttribute('r', (boosted ? 7.5 + Math.random() * 4.5 : 6 + Math.random() * 4.5).toFixed(1));
                    wisp.setAttribute('fill', gradFill);
                    wisp.setAttribute('class', 'aura-wisp');
                    wisp.style.setProperty('--dx', dx);
                    wisp.style.setProperty('--wisp-dur', `${durSec}s`);
                    layer.appendChild(wisp);
                    activeCount += 1;
                    setTimeout(() => { if (wisp.parentNode) wisp.parentNode.removeChild(wisp); activeCount = Math.max(0, activeCount - 1); }, Number(durSec) * 1000 + 120);
                };

                bloomLeavesRef.current = (count = 3) => {
                    for (let i = 0; i < count; i++) setTimeout(() => emitLeafAura(true), i * 80);
                };
