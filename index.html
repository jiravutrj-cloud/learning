                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-md p-6 sm:p-8 text-center space-y-5">
                            <div className="w-16 h-16 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center mx-auto">
                                <Icon name="RotateCcw" size={32} />
                            </div>
                            <div className="space-y-1">
                                <h2 className="font-display text-2xl font-extrabold text-slate-900">ยังไม่ถึงเกณฑ์ {MIN_POSTTEST_PERCENT}%</h2>
                                <p className="text-sm text-slate-600">สามารถทบทวนบทเรียนและทำ Post-test ใหม่ได้ทันทีค่ะ</p>
                            </div>
                            <div className="p-5 rounded-2xl bg-rose-50/70 border border-rose-200">
                                <p className="text-xs font-bold text-rose-700">คะแนน Post-test ครั้งนี้</p>
                                <p className="font-mono text-4xl font-extrabold text-rose-600 mt-1">
                                    {quiz.score}<span className="text-xl text-rose-300">/{totalQ}</span>
                                </p>
                                <p className="text-xs font-bold text-rose-700 mt-1">คิดเป็น {pct}% (ต้องได้ไม่น้อยกว่า {MIN_POSTTEST_PERCENT}%)</p>
                            </div>
                            <div className="grid grid-cols-2 gap-2.5">
                                <button
                                    type="button"
                                    onClick={() => setScreen('dashboard')}
                                    className="touch-target py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-display font-bold text-sm"
                                >
                                    กลับทบทวนบทเรียน
                                </button>
                                <button
                                    type="button"
                                    onClick={() => startQuiz('posttest')}
                                    className="touch-target py-3 rounded-2xl bg-clinical-600 hover:bg-clinical-700 text-white font-display font-bold text-sm"
                                >
                                    สอบใหม่ทันที
                                </button>
                            </div>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 6: CSAT & CERTIFICATE CONFIRMATION (STEP 5) ---
            if (screen === 'cert_confirm') {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-lg p-6 sm:p-8 space-y-5">
                            <div className="text-center space-y-1.5">
                                <div className="w-14 h-14 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto">
                                    <Icon name="Award" size={30} />
                                </div>
                                <span className="inline-block px-3 py-0.5 rounded-full bg-clinical-100 text-clinical-700 font-mono text-[11px] font-bold">
                                    POST-TEST PASSED ({user?.posttest} • {posttestInfo.percent}%)
                                </span>
                                <h2 className="font-display text-2xl font-extrabold text-slate-900">ยินดีด้วยค่ะ! ผ่านเกณฑ์รับประกาศนียบัตร</h2>
                                <p className="text-xs sm:text-sm text-slate-500">ตรวจสอบชื่อ-หน่วยงาน และประเมินความพึงพอใจเพื่อออกใบประกาศฯ ทันที</p>
                            </div>

                            <form onSubmit={handleIssueCertificate} className="space-y-4">
                                <FormField
                                    label="ชื่อ - นามสกุล ที่จะแสดงบนประกาศนียบัตร *"
                                    required
                                    value={certFormName}
                                    onChange={e => setCertFormName(e.target.value)}
                                />
                                <FormField
                                    label="หน่วยงาน / โรงพยาบาล *"
                                    required
                                    value={certFormHosp}
                                    onChange={e => setCertFormHosp(e.target.value)}
                                />

                                <div className="p-4 rounded-2xl bg-amber-50/70 border border-amber-200/80 text-center space-y-2.5">
                                    <p className="text-xs font-bold text-amber-900">ประเมินความพึงพอใจต่อหลักสูตร (CSAT)</p>
                                    <div className="flex items-center justify-center gap-2">
                                        {[1, 2, 3, 4, 5].map(star => (
                                            <button
                                                key={star}
                                                type="button"
                                                onClick={() => setCsatRating(star)}
                                                className="p-1 transition-transform active:scale-90"
                                            >
                                                <Icon
                                                    name="Star"
                                                    size={30}
                                                    className={star <= csatRating ? 'text-amber-400 fill-amber-400' : 'text-slate-300'}
                                                />
                                            </button>
                                        ))}
                                    </div>
                                    <input
                                        type="text"
                                        value={csatComment}
                                        onChange={e => setCsatComment(e.target.value)}
                                        placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)"
                                        className="w-full px-3.5 py-2 rounded-xl bg-white border border-amber-200 text-xs text-slate-700 outline-none"
                                    />
                                </div>

                                <button
                                    type="submit"
                                    disabled={isBusy}
                                    className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 hover:from-clinical-600 hover:to-teal-700 text-white font-display font-bold text-base shadow-lg shadow-clinical-500/25 flex items-center justify-center gap-2"
                                >
                                    <Icon name="Sparkles" size={18} />
                                    {isBusy ? 'กำลังสร้างใบประกาศนียบัตร...' : 'ยืนยันและรับประกาศนียบัตรทันที'}
                                </button>
                            </form>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 7: BUILT-IN CERTIFICATE STUDIO ---
            if (screen === 'certificate') {
                return (
                    <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <main className="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 py-6 sm:py-10 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <button
                                    type="button"
                                    onClick={() => setScreen('dashboard')}
                                    className="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-bold text-xs flex items-center gap-1.5 shadow-sm"
                                >
                                    <Icon name="ArrowLeft" size={15} /> กลับห้องเรียน
                                </button>
                                <span className="px-3 py-1 rounded-full bg-clinical-100 text-clinical-800 font-mono text-xs font-bold">
                                    REF: {user?.certificateCode || 'RJC-2027'}
                                </span>
                            </div>

                            <BentoCard className="p-4 sm:p-6 space-y-5">
                                <div className="text-center space-y-1">
                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-slate-900">ประกาศนียบัตรอิเล็กทรอนิกส์ของคุณ</h2>
                                    <p className="text-xs sm:text-sm text-slate-500">
                                        อ้างอิงผลประเมิน Post-test: <b className="text-clinical-700">{user?.posttest} ({posttestInfo.percent}%)</b> • รองรับการสแกน QR ตรวจสอบความถูกต้อง
                                    </p>
                                </div>

                                <div className="relative w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-slate-200 shadow-lg">
                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    {isRenderingCert && (
                                        <div className="absolute inset-0 bg-white/80 flex items-center justify-center text-sm font-bold text-clinical-700">
                                            กำลังจัดทำประกาศนียบัตรความละเอียดสูง...
                                        </div>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                    <button
                                        type="button"
                                        onClick={handleDownloadPdf}
                                        className="touch-target py-3.5 px-4 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 text-white font-display font-bold text-sm flex items-center justify-center gap-2 shadow-md"
                                    >
                                        <Icon name="FileDown" size={18} /> ดาวน์โหลด PDF (A4)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleDownloadPng}
                                        className="touch-target py-3.5 px-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="ImageDown" size={18} /> บันทึกรูปภาพ PNG
                                    </button>
                                    <a
                                        href={`./verify.html?code=${encodeURIComponent(user?.certificateCode || '')}`}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="touch-target py-3.5 px-4 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-800 font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="QrCode" size={18} className="text-clinical-600" /> ทดสอบลิงก์ QR
                                    </a>
                                </div>
                            </BentoCard>
                        </main>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 8: STUDENT DASHBOARD ---
            const activeLesson = lessons.find(l => l.id === currentLessonId) || lessons[0];
            const tabs = [
                { id: 'video', label: 'บทเรียน', icon: 'MonitorPlay' },
                { id: 'live', label: 'Live สด', icon: 'Radio' },
                { id: 'leaderboard', label: 'จัดอันดับ', icon: 'Trophy' },
                { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
            ];

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-dock-safe lg:pb-10">
                    <div className="aura-canvas" /><div className="aura-grid" />

                    {/* Top Header */}
                    <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/85 border-b border-slate-200/75">
                        <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shrink-0">
                                    <Icon name="HeartPulse" size={19} />
                                </div>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-slate-900 block leading-none truncate">
                                        rjcloud<span className="text-clinical-600">.organ</span>
                                    </span>
                                    <span className="text-[11px] text-slate-500 block truncate">{user?.name} • {user?.userType}</span>
                                </div>
                            </div>

                            {/* Desktop Navigation Pills */}
                            <nav className="hidden lg:flex items-center gap-1.5 p-1 rounded-2xl bg-slate-100/90 border border-slate-200/70">
                                {tabs.map(t => (
                                    <button
                                        key={t.id}
                                        type="button"
                                        onClick={() => setActiveTab(t.id)}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                            activeTab === t.id ? 'bg-white text-clinical-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                                        }`}
                                    >
                                        <Icon name={t.icon} size={15} /> {t.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="flex items-center gap-2 shrink-0">
                                {canEnterSkillLab ? (
                                    <a
                                        href={adminPreviewMode ? './aiskilllab.html?admin_preview=1' : './aiskilllab.html'}
                                        className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm active:scale-95"
                                    >
                                        <Icon name="Bot" size={15} /> AI Skill Lab
                                    </a>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={() => showToast(`สะสมชั่วโมงเรียนให้ถึง ${MIN_STUDY_PERCENT}% ก่อนเพื่อปลดล็อก AI Skill Lab (ตอนนี้ ${studyPercent}%)`, 'info')}
                                        className="px-3 py-2 rounded-xl bg-slate-100 border border-slate-200 text-slate-400 font-bold text-xs flex items-center gap-1.5"
                                    >
                                        <Icon name="Lock" size={14} /> AI Lab ({studyPercent}%/{MIN_STUDY_PERCENT}%)
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Main Dashboard Content */}
                    <main className="relative z-10 flex-1 max-w-7xl w-full mx-auto px-3.5 sm:px-6 pt-4 md:pt-6 space-y-5">
                        {/* 5-Step Progress Tracker Strip */}
                        <BentoCard className="p-4 sm:p-5 space-y-3">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center gap-2">
                                    <span className="px-2.5 py-0.5 rounded-full bg-clinical-100 text-clinical-700 font-mono text-[10px] font-bold">
                                        5-STEP LEARNING PATHWAY
                                    </span>
                                    <span className="text-xs font-bold text-slate-700">เวลาสะสม: {formatDurationTH(studySeconds)}</span>
                                </div>
                                <span className="font-mono text-xs font-extrabold text-clinical-700">
                                    {studyPercent}% (เกณฑ์ปลดล็อก AI Lab ≥ {MIN_STUDY_PERCENT}%)
                                </span>
                            </div>

                            {/* Progress Bar with 80% Marker */}
                            <div className="relative w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
                                <div
                                    className="h-full rounded-full bg-gradient-to-r from-clinical-500 to-medical-500 transition-all duration-500"
                                    style={{ width: `${studyPercent}%` }}
                                />
                                <div
                                    className="absolute top-0 bottom-0 w-0.5 bg-slate-900/50"
                                    style={{ left: `${MIN_STUDY_PERCENT}%` }}
                                    title={`เกณฑ์ ${MIN_STUDY_PERCENT}%`}
                                />
                            </div>

                            <div className="grid grid-cols-5 gap-1.5 text-center">
                                {[
                                    { n: '1', label: 'Pre-test', done: hasDonePretest },
                                    { n: '2', label: `เรียน ≥${MIN_STUDY_PERCENT}%`, done: isStudyRequirementMet },
                                    { n: '3', label: 'AI Lab', done: hasPassedSkillLab },
                                    { n: '4', label: `Post ≥${MIN_POSTTEST_PERCENT}%`, done: posttestInfo.passed },
                                    { n: '5', label: 'ประกาศฯ', done: Boolean(user?.certificateClaimed) }
                                ].map(st => (
                                    <div
                                        key={st.n}
                                        className={`py-1.5 px-1 rounded-xl border text-[10px] sm:text-xs font-bold flex items-center justify-center gap-1 ${
                                            st.done
                                                ? 'bg-clinical-50 border-clinical-200 text-clinical-700'
                                                : 'bg-white/70 border-slate-200 text-slate-400'
                                        }`}
                                    >
                                        <Icon name={st.done ? 'CheckCircle2' : 'Circle'} size={13} className="shrink-0" />
                                        <span className="truncate">{st.label}</span>
                                    </div>
                                ))}
                            </div>
                        </BentoCard>

                        {/* TAB 1: VIDEO CLASSROOM */}
                        {activeTab === 'video' && (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                <div className="lg:col-span-8 space-y-4">
                                    <BentoCard className="p-3.5 sm:p-5 space-y-3.5">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <span className="px-2.5 py-1 rounded-lg bg-clinical-50 text-clinical-700 font-mono text-xs font-bold">
                                                บทเรียนที่ {activeLesson?.id} / {lessons.length}
                                            </span>
                                            {activeLesson?.documentUrl && (
                                                <a
                                                    href={activeLesson.documentUrl}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="px-3 py-1.5 rounded-xl bg-medical-50 hover:bg-medical-100 text-medical-700 font-bold text-xs flex items-center gap-1.5"
                                                >
                                                    <Icon name="FileText" size={14} /> เอกสารประกอบการเรียน
                                                </a>
                                            )}
                                        </div>

                                        <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-slate-200 shadow-inner">
                                            {activeLesson?.videoId ? (
                                                <iframe
                                                    src={`https://drive.google.com/file/d/${activeLesson.videoId}/preview`}
                                                    className="absolute inset-0 w-full h-full border-0"
                                                    allow="autoplay; fullscreen"
                                                    allowFullScreen
                                                    title={activeLesson.title}
                                                />
                                            ) : (
                                                <div className="absolute inset-0 flex items-center justify-center text-slate-400 text-sm">
                                                    ยังไม่ได้ระบุวิดีโอสำหรับบทเรียนนี้
                                                </div>
                                            )}
                                        </div>

                                        <h2 className="font-display font-bold text-base sm:text-xl text-slate-900 leading-snug">
                                            {activeLesson?.title}
                                        </h2>
                                    </BentoCard>

                                    {/* Next Step Action Cards (Step 3 AI Skill Lab & Step 4 Post-test) */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <BentoCard className="p-4 flex flex-col justify-between gap-3 border-violet-200/80">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-violet-600">STEP 3 • PRACTICE</span>
                                                <h3 className="font-display font-bold text-base text-slate-900 mt-0.5">ห้องฝึกปฏิบัติ AI Skill Lab</h3>
                                                <p className="text-xs text-slate-500 mt-0.5">
                                                    {canEnterSkillLab
                                                        ? 'ปลดล็อกแล้ว! เข้าฝึกให้ข้อมูลญาติในห้องรับรองพร้อม AI Coach ชี้นำ'
                                                        : `สะสมเวลาเรียนให้ถึง ${MIN_STUDY_PERCENT}% เพื่อปลดล็อก (ปัจจุบัน ${studyPercent}%)`}
                                                </p>
                                            </div>
                                            {canEnterSkillLab ? (
                                                <a
                                                    href={adminPreviewMode ? './aiskilllab.html?admin_preview=1' : './aiskilllab.html'}
                                                    className="touch-target w-full py-2.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-display font-bold text-xs flex items-center justify-center gap-1.5"
                                                >
                                                    <Icon name="Bot" size={16} /> เข้าฝึก AI Skill Lab เลย
                                                </a>
                                            ) : (
                                                <button disabled className="touch-target w-full py-2.5 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs flex items-center justify-center gap-1.5">
                                                    <Icon name="Lock" size={15} /> ล็อกอยู่ ({studyPercent}% / {MIN_STUDY_PERCENT}%)
                                                </button>
                                            )}
                                        </BentoCard>

                                        <BentoCard className="p-4 flex flex-col justify-between gap-3 border-amber-200/80">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-amber-600">STEP 4 & 5 • POST-TEST & CERT</span>
                                                <h3 className="font-display font-bold text-base text-slate-900 mt-0.5">แบบทดสอบหลังเรียน (≥ {MIN_POSTTEST_PERCENT}%)</h3>
                                                <p className="text-xs text-slate-500 mt-0.5">
                                                    {canClaimCertificate
                                                        ? `ผ่านแล้ว (${user?.posttest} • ${posttestInfo.percent}%) สามารถรับประกาศนียบัตรได้ทันที`
                                                        : canTakePosttest
                                                            ? 'ปลดล็อกแล้ว! ทำคะแนนให้ได้อย่างน้อย 80% เพื่อรับประกาศนียบัตร'
                                                            : 'ต้องผ่านขั้นที่ 2 (≥80%) และขั้นที่ 3 (AI Skill Lab) ก่อนจึงจะปลดล็อก'}
                                                </p>
                                            </div>
                                            {canClaimCertificate ? (
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        if (user?.certificateClaimed) {
                                                            setScreen('certificate');
                                                        } else {
                                                            setCertFormName(user?.name || '');
                                                            setCertFormHosp(user?.hospital || '');
                                                            setScreen('cert_confirm');
                                                        }
                                                    }}
                                                    className="touch-target w-full py-2.5 rounded-xl bg-clinical-600 hover:bg-clinical-700 text-white font-display font-bold text-xs flex items-center justify-center gap-1.5"
                                                >
                                                    <Icon name="Award" size={16} /> {user?.certificateClaimed ? 'เปิดดูใบประกาศนียบัตร' : 'ประเมิน CSAT & รับประกาศนียบัตร'}
                                                </button>
                                            ) : canTakePosttest ? (
                                                <button
                                                    type="button"
                                                    onClick={() => startQuiz('posttest')}
                                                    className="touch-target w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-display font-bold text-xs flex items-center justify-center gap-1.5"
                                                >
                                                    <Icon name="FileCheck2" size={16} /> เริ่มทำ Post-test ทันที
                                                </button>
                                            ) : (
                                                <button disabled className="touch-target w-full py-2.5 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs flex items-center justify-center gap-1.5">
                                                    <Icon name="Lock" size={15} /> รอผ่าน AI Skill Lab
                                                </button>
                                            )}
                                        </BentoCard>
                                    </div>
                                </div>

                                {/* Right Sidebar: Playlist 20 Lessons */}
                                <BentoCard className="lg:col-span-4 p-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <h3 className="font-display font-bold text-sm text-slate-900">รายการบทเรียน ({lessons.length} บท)</h3>
                                        <span className="text-[11px] font-mono text-clinical-600 font-bold">เลือกเรียนได้อิสระ</span>
                                    </div>
                                    <div className="space-y-2 max-h-[540px] overflow-y-auto custom-scrollbar pr-1">
                                        {lessons.map((l, idx) => {
                                            const active = l.id === activeLesson?.id;
                                            return (
                                                <button
                                                    key={l.id}
                                                    type="button"
                                                    onClick={() => setCurrentLessonId(l.id)}
                                                    className={`w-full text-left p-3 rounded-2xl border transition-all flex items-start gap-2.5 ${
                                                        active
                                                            ? 'bg-clinical-50 border-clinical-400 text-clinical-900 shadow-sm'
                                                            : 'bg-white/80 border-slate-200/70 hover:bg-slate-50 text-slate-700'
                                                    }`}
                                                >
                                                    <span className={`w-7 h-7 rounded-xl font-mono text-xs font-bold flex items-center justify-center shrink-0 ${
                                                        active ? 'bg-clinical-600 text-white' : 'bg-slate-100 text-slate-500'
                                                    }`}>
                                                        {idx + 1}
                                                    </span>
                                                    <span className="text-xs sm:text-sm font-semibold leading-snug line-clamp-2">{l.title}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </BentoCard>
                            </div>
                        )}

                        {/* TAB 2: LIVE STREAM */}
                        {activeTab === 'live' && (
                            <BentoCard className="p-4 sm:p-6 max-w-4xl mx-auto space-y-4">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div>
                                        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-mono font-bold ${
                                            liveConfig.status === 'live'
                                                ? 'bg-rose-100 text-rose-700'
                                                : liveConfig.status === 'paused'
                                                    ? 'bg-amber-100 text-amber-800'
                                                    : 'bg-slate-100 text-slate-600'
                                        }`}>
                                            <span className={`w-2 h-2 rounded-full ${liveConfig.status === 'live' ? 'bg-rose-500 animate-ping' : 'bg-slate-400'}`} />
                                            {liveConfig.status === 'live' ? 'LIVE ON AIR' : liveConfig.status === 'paused' ? 'BREAK / PAUSED' : 'OFFLINE'}
                                        </span>
                                        <h2 className="font-display text-lg sm:text-2xl font-extrabold text-slate-900 mt-1.5">{liveConfig.topic}</h2>
                                    </div>
                                    {liveConfig.documentUrl && (
                                        <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="px-4 py-2 rounded-xl bg-medical-50 text-medical-700 font-bold text-xs flex items-center gap-1.5">
                                            <Icon name="FileText" size={15} /> เอกสารบรรยายสด
                                        </a>
                                    )}
                                </div>

                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-slate-200 flex items-center justify-center">
                                    {liveConfig.status === 'live' && liveConfig.url ? (
                                        <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen" allowFullScreen title="Live Broadcast" />
                                    ) : (
                                        <div className="text-center p-6 text-slate-400 space-y-2">
                                            <Icon name="Radio" size={38} className="mx-auto text-slate-600" />
                                            <p className="font-display font-bold text-white">ขณะนี้ยังไม่มีการถ่ายทอดสด</p>
                                            <p className="text-xs">ผู้เรียนสามารถเรียนวิดีโอบทเรียนย้อนหลังในแท็บ "บทเรียน" ได้ตลอด 24 ชั่วโมงค่ะ</p>
                                        </div>
                                    )}
                                </div>

                                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-200/80">
                                    <div>
                                        <p className="font-bold text-sm text-slate-900">ลงทะเบียนยืนยันเข้าฟังการบรรยายสด</p>
                                        <p className="text-xs text-slate-500">กดยืนยันเพื่อบันทึกเวลาเรียนเข้าสู่ฐานข้อมูลอัตโนมัติ</p>
                                    </div>
                                    <button
                                        type="button"
                                        disabled={Boolean(user?.liveCheckedIn)}
                                        onClick={handleLiveCheckIn}
                                        className={`touch-target w-full sm:w-auto px-6 py-3 rounded-2xl font-display font-bold text-sm flex items-center justify-center gap-2 ${
                                            user?.liveCheckedIn
                                                ? 'bg-clinical-100 text-clinical-700'
                                                : 'bg-clinical-600 hover:bg-clinical-700 text-white shadow-sm'
                                        }`}
                                    >
                                        <Icon name="CheckCircle2" size={18} />
                                        {user?.liveCheckedIn ? 'ยืนยันเข้าเรียนแล้ว' : 'ยืนยันเข้าเรียน Live สด'}
                                    </button>
                                </div>
                            </BentoCard>
                        )}

                        {/* TAB 3: LEADERBOARD (PDPA-SAFE) */}
                        {activeTab === 'leaderboard' && (
                            <BentoCard className="p-4 sm:p-6 max-w-3xl mx-auto space-y-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="font-display text-xl font-extrabold text-slate-900 flex items-center gap-2">
                                            <Icon name="Trophy" size={22} className="text-amber-500" /> กระดานจัดอันดับ AI Skill Lab
                                        </h2>
                                        <p className="text-xs text-slate-500">แสดงเฉพาะชื่อ หน่วยงาน และคะแนนทักษะการสื่อสารสูงสุด (คุ้มครองข้อมูล PDPA)</p>
                                    </div>
                                </div>

                                <div className="space-y-2.5">
                                    {leaderboard.map((item, idx) => (
                                        <div key={item.id || idx} className="p-3.5 rounded-2xl bg-white/90 border border-slate-200/80 flex items-center justify-between gap-3">
                                            <div className="flex items-center gap-3 min-w-0">
                                                <span className={`w-9 h-9 rounded-xl font-mono text-sm font-extrabold flex items-center justify-center shrink-0 ${
                                                    idx === 0 ? 'bg-amber-100 text-amber-700' : idx === 1 ? 'bg-slate-200 text-slate-700' : idx === 2 ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-500'
                                                }`}>
                                                    #{idx + 1}
                                                </span>
                                                <div className="min-w-0">
                                                    <p className="font-display font-bold text-sm text-slate-900 truncate">{item.name}</p>
                                                    <p className="text-xs text-slate-500 truncate">{item.hospital || 'เครือข่าย rjcloud.organ'}</p>
                                                </div>
                                            </div>
                                            <span className="font-mono text-lg font-extrabold text-clinical-700 shrink-0">{item.score || 0}<span className="text-xs text-slate-400">/100</span></span>
                                        </div>
                                    ))}
                                    {leaderboard.length === 0 && (
                                        <div className="p-8 text-center text-sm text-slate-400">ยังไม่มีคะแนนในกระดานจัดอันดับ มาเป็นคนแรกที่ฝึกใน AI Skill Lab กันค่ะ!</div>
                                    )}
                                </div>
                            </BentoCard>
                        )}

                        {/* TAB 4: PROFILE SUMMARY */}
                        {activeTab === 'profile' && (
                            <BentoCard className="p-5 sm:p-7 max-w-2xl mx-auto space-y-5">
                                <div className="flex items-center gap-4 pb-4 border-b border-slate-200/80">
                                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center font-display text-2xl font-extrabold shrink-0">
                                        {(user?.name || 'R').slice(0, 1)}
                                    </div>
                                    <div className="min-w-0">
                                        <h2 className="font-display text-xl font-extrabold text-slate-900 truncate">{user?.name}</h2>
                                        <p className="text-xs text-slate-500 truncate">{user?.position} • {user?.hospital}</p>
                                        <div className="flex flex-wrap gap-1.5 mt-1.5">
                                            <span className="px-2.5 py-0.5 rounded-full bg-clinical-50 text-clinical-700 font-mono text-[11px] font-bold">
                                                ใบอนุญาต: {user?.license}
                                            </span>
                                            <span className="px-2.5 py-0.5 rounded-full bg-medical-50 text-medical-700 text-[11px] font-bold">
                                                {user?.userType}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                                        <p className="text-[11px] font-bold text-slate-500">คะแนน Pre-test</p>
                                        <p className="font-mono text-xl font-extrabold text-slate-900 mt-0.5">{user?.pretest || '-'}</p>
                                    </div>
                                    <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                                        <p className="text-[11px] font-bold text-slate-500">คะแนน Post-test</p>
                                        <p className="font-mono text-xl font-extrabold text-clinical-700 mt-0.5">
                                            {user?.posttest || '-'} {posttestInfo.total > 0 ? `(${posttestInfo.percent}%)` : ''}
                                        </p>
                                    </div>
                                    <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                                        <p className="text-[11px] font-bold text-slate-500">เวลาเรียนสะสม</p>
                                        <p className="font-mono text-lg font-extrabold text-slate-900 mt-0.5">{studyPercent}%</p>
                                    </div>
                                    <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                                        <p className="text-[11px] font-bold text-slate-500">AI Skill Lab</p>
                                        <p className="font-display text-base font-extrabold text-violet-700 mt-0.5">
                                            {hasPassedSkillLab ? 'ผ่านแล้ว ✓' : 'ยังไม่ผ่าน'}
                                        </p>
                                    </div>
                                </div>

                                {canClaimCertificate && (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (user?.certificateClaimed) {
                                                setScreen('certificate');
                                            } else {
                                                setCertFormName(user?.name || '');
                                                setCertFormHosp(user?.hospital || '');
                                                setScreen('cert_confirm');
                                            }
                                        }}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 text-white font-display font-bold text-sm flex items-center justify-center gap-2 shadow-md"
                                    >
                                        <Icon name="Award" size={18} />
                                        {user?.certificateClaimed ? 'เปิดดูและดาวน์โหลดประกาศนียบัตร (PDF/PNG)' : 'ยืนยันชื่อและรับประกาศนียบัตร'}
                                    </button>
                                )}

                                <button
                                    type="button"
                                    onClick={handleLogout}
                                    className="touch-target w-full py-3 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-display font-bold text-sm flex items-center justify-center gap-2"
                                >
                                    <Icon name="LogOut" size={17} /> ออกจากระบบ
                                </button>
                            </BentoCard>
                        )}
                    </main>

                    {/* Mobile Bottom Navigation Dock */}
                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/94 backdrop-blur-2xl border-t border-slate-200/80 px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] shadow-[0_-8px_30px_rgba(15,23,42,0.08)]">
                        <div className="grid grid-cols-4 gap-1.5 max-w-md mx-auto">
                            {tabs.map(t => {
                                const active = activeTab === t.id;
                                return (
                                    <button
                                        key={t.id}
                                        type="button"
                                        onClick={() => { setActiveTab(t.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[11px] font-bold transition-all active:scale-95 ${
                                            active ? 'bg-clinical-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'
                                        }`}
                                    >
                                        <Icon name={t.icon} size={18} />
                                        <span>{t.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                    {renderAdminPreviewBar()}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
