                                                            )}
                                                        </div>

                                                                type="text"
                                                                value={aiChatInput}

                                                                className="touch-target spatial-input flex-1 px-3.5 py-2 rounded-xl text-sm"

                                                            <button
                                                                type="submit"

                                                            >
                                                                ส่ง

                                                    return (
                                                        <button
                                                            key={l.id}
                                                            type="button"
                                                            onClick={() => setCurrentLessonId(l.id)}
                                                            className={`w-full text-left p-3 rounded-2xl border transition-all flex items-start gap-2.5 ${
                                                                isActive
                                                                    ? 'bg-aurora-500/20 border-aurora-400'
                                                                    : 'spatial-soft hover:border-prism-400/50'
                                                            }`}
                                                        >
                                                            <span className={`w-7 h-7 rounded-xl font-mono text-xs font-bold flex items-center justify-center shrink-0 ${
                                                                isActive ? 'bg-aurora-400 text-void-950' : 'bg-white/10 text-secondary-adaptive'
                                                            }`}>
                                                                {l.id}
                                                            </span>
                                                            <div className="min-w-0 flex-1">
                                                                <p className="text-xs font-bold text-primary-adaptive leading-snug line-clamp-2">{l.title}</p>
                                                                {isRec && (
                                                                    <span className="inline-block mt-1 px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-400 font-mono text-[9px] font-bold">
                                                                        ★ AI แนะนำให้ทบทวน
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </SpatialCard>
                                    </div>
                                )}

                                {/* TAB 2: LIVE STREAM ROOM */}
                                {activeTab === 'live' && (
                                    <SpatialCard className="p-5 sm:p-7 max-w-4xl mx-auto space-y-5">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div>
                                                <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-mono text-[10px] font-bold ${
                                                    liveConfig.status === 'live'
                                                        ? 'bg-rose-500/20 text-rose-400'
                                                        : 'bg-slate-500/20 text-muted-adaptive'
                                                }`}>
                                                    {liveConfig.status === 'live' ? '🔴 LIVE ON-AIR' : liveConfig.status === 'paused' ? '⏸️ พักเบรก' : '⚫ ยังไม่เริ่มถ่ายทอดสด'}
                                                </span>
                                                <h2 className="font-display text-lg sm:text-2xl font-extrabold text-primary-adaptive mt-1">{liveConfig.topic}</h2>
                                            </div>

                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setIsLiveCheckedIn(true);
                                                    showToast('ยืนยันเข้าเรียน Live สดเรียบร้อย ระบบเริ่มนับเวลาสะสมให้แล้วค่ะ');
                                                }}
                                                disabled={isLiveCheckedIn}
                                                className={`touch-target px-4 py-2.5 rounded-2xl font-display font-extrabold text-xs flex items-center gap-1.5 ${
                                                    isLiveCheckedIn
                                                        ? 'bg-aurora-500/20 border border-aurora-400 text-accent-adaptive'
                                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-md'
                                                }`}
                                            >
                                                <Icon name="CheckCircle2" size={16} />
                                                {isLiveCheckedIn ? 'ยืนยันเข้าเรียนแล้ว ✓' : 'ยืนยันเข้าเรียน Live'}
                                            </button>
                                        </div>

                                        <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10 flex items-center justify-center">
                                            {liveConfig.url && liveConfig.status === 'live' ? (
                                                <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allowFullScreen title="Live Broadcast" />
                                            ) : (
                                                <div className="text-center p-6 space-y-2">
                                                    <Icon name="Radio" size={34} className="text-muted-adaptive mx-auto" />
                                                    <p className="font-display font-bold text-sm text-slate-300">ยังไม่มีการถ่ายทอดสดในขณะนี้</p>
                                                    <p className="text-xs text-slate-400">สามารถกลับไปเรียนวิดีโอบทเรียน 20 บทเพื่อสะสมชั่วโมงเรียนได้ตลอด 24 ชม. ค่ะ</p>
                                                </div>
                                            )}
                                        </div>

                                        {liveConfig.documentUrl && (
                                            <a
                                                href={liveConfig.documentUrl}
                                                target="_blank"
                                                rel="noreferrer"
                                                className="touch-target spatial-soft w-full py-3 rounded-2xl text-accent-adaptive font-bold text-sm flex items-center justify-center gap-2"
                                            >
                                                <Icon name="Download" size={16} /> ดาวน์โหลดเอกสารประกอบการบรรยายสด
                                            </a>
                                        )}
                                    </SpatialCard>
                                )}

                                {/* TAB 3: LEADERBOARD (PDPA-SAFE) */}
                                {activeTab === 'leaderboard' && (
                                    <SpatialCard className="p-5 sm:p-7 max-w-3xl mx-auto space-y-4">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">AI SKILL LAB EMPATHY HONORS</span>
                                                <h2 className="font-display text-xl font-extrabold text-primary-adaptive">กระดานเกียรติยศทักษะการสื่อสาร</h2>
                                            </div>
                                            <Icon name="Trophy" size={26} className="text-amber-400" />
                                        </div>

                                        <div className="space-y-2.5">
                                            {leaderboardList.length === 0 ? (
                                                <div className="spatial-soft p-8 rounded-2xl text-center text-sm text-muted-adaptive">
                                                    ยังไม่มีอันดับในระบบ — เข้าฝึกใน AI Skill Lab 3 มิติเพื่อขึ้นกระดานเกียรติยศคนแรกได้เลยค่ะ!
                                                </div>
                                            ) : (
                                                leaderboardList.map((row, idx) => (
                                                    <div key={row.id || idx} className="spatial-soft p-3.5 rounded-2xl flex items-center justify-between gap-3">
                                                        <div className="flex items-center gap-3 min-w-0">
                                                            <span className={`w-8 h-8 rounded-xl font-mono text-xs font-extrabold flex items-center justify-center shrink-0 ${
                                                                idx === 0 ? 'bg-amber-400 text-void-950' : idx === 1 ? 'bg-slate-300 text-void-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-white/10 text-secondary-adaptive'
                                                            }`}>
                                                                #{idx + 1}
                                                            </span>
                                                            <div className="min-w-0">
                                                                <p className="font-display font-bold text-sm text-primary-adaptive truncate">{row.name}</p>
                                                                <p className="text-[11px] text-muted-adaptive truncate">{row.hospital || 'เครือข่าย rjcloud.organ'}</p>
                                                            </div>
                                                        </div>
                                                        <span className="px-3 py-1 rounded-xl bg-aurora-500/20 text-accent-adaptive font-mono text-sm font-extrabold shrink-0">
                                                            {row.score}/100
                                                        </span>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </SpatialCard>
                                )}

                                {/* TAB 4: PROFILE SUMMARY + AI PORTFOLIO GROWTH + PDPA-SAFE PRE-APPROACH CO-PILOT */}
                                {activeTab === 'profile' && (
                                    <div className="space-y-5">
                                        <SpatialCard className="p-5 sm:p-7 max-w-2xl mx-auto space-y-5">
                                            <div className="flex items-center gap-4 pb-4 border-b border-white/10">
                                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center font-display text-2xl font-extrabold shrink-0">
                                                    {(user?.name || 'R').slice(0, 1)}
                                                </div>
                                                <div className="min-w-0">
                                                    <h2 className="font-display text-xl font-extrabold text-primary-adaptive truncate">{user?.name}</h2>
                                                    <p className="text-xs text-muted-adaptive truncate">{user?.position} • {user?.hospital}</p>
                                                    <div className="flex flex-wrap gap-1.5 mt-1.5">
                                                        <span className="px-2.5 py-0.5 rounded-full bg-aurora-500/15 text-accent-adaptive font-mono text-[11px] font-bold">
                                                            ใบอนุญาต: {user?.license}
                                                        </span>
                                                        <span className="px-2.5 py-0.5 rounded-full bg-prism-500/15 text-prism-adaptive text-[11px] font-bold">
                                                            {roleProfile.badgeTH}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <p className="text-[11px] font-bold text-muted-adaptive">คะแนน Pre-test</p>
                                                    <p className="font-mono text-xl font-extrabold text-primary-adaptive mt-0.5">{user?.pretest || '-'}</p>
                                                </div>
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <p className="text-[11px] font-bold text-muted-adaptive">คะแนน Post-test</p>
                                                    <p className="font-mono text-xl font-extrabold text-accent-adaptive mt-0.5">
                                                        {user?.posttest || '-'} {posttestInfo.total > 0 ? `(${posttestInfo.percent}%)` : ''}
                                                    </p>
                                                </div>
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <p className="text-[11px] font-bold text-muted-adaptive">เวลาเรียนสะสม</p>
                                                    <p className="font-mono text-lg font-extrabold text-primary-adaptive mt-0.5">{studyPercent}%</p>
                                                </div>
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <p className="text-[11px] font-bold text-muted-adaptive">AI Skill Lab</p>
                                                    <p className="font-display text-base font-extrabold text-violet-400 mt-0.5">
                                                        {hasPassedSkillLab ? 'ผ่านแล้ว ✓' : 'ยังไม่ผ่าน'}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="spatial-soft p-4 rounded-2xl flex items-center justify-between gap-3 no-print">
                                                <div>
                                                    <p className="text-xs font-bold text-primary-adaptive">โหมดการแสดงผล (Theme Preference)</p>
                                                    <p className="text-[11px] text-muted-adaptive">
                                                        กำลังใช้งาน: {theme === 'dark' ? 'โหมดมืด (สบายตา)' : 'โหมดสว่าง (Frosted Pearl)'}
                                                    </p>
                                                </div>
                                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                            </div>

                                            {canClaimCertificate && (
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        if (user?.certificateClaimed) setScreen('certificate');
                                                        else { setCertFormName(user?.name || ''); setCertFormHosp(user?.hospital || ''); setScreen('cert_confirm'); }
                                                    }}
                                                    className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg no-print"
                                                >
                                                    <Icon name="Award" size={18} />
                                                    {user?.certificateClaimed ? 'เปิดดูและดาวน์โหลดประกาศนียบัตร (PDF/PNG)' : 'ยืนยันชื่อและรับประกาศนียบัตร'}
                                                </button>
                                            )}

                                            <button
                                                type="button"
                                                onClick={handleLogout}
                                                className="touch-target w-full py-3 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-400/30 text-rose-400 font-display font-bold text-sm flex items-center justify-center gap-2 no-print"
                                            >
                                                <Icon name="LogOut" size={17} /> ออกจากระบบ
                                            </button>
                                        </SpatialCard>

                                        {/* รายงานพัฒนาการสมรรถนะรายบุคคลแนบแฟ้มผลงาน (AI Growth Narrative) */}
                                        <PortfolioGrowthCard
                                            user={user}
                                            posttestInfo={posttestInfo}
                                            callAppsScript={callAppsScript}
                                            showToast={showToast}
                                        />

                                        {/* ผู้ช่วยอุ่นเครื่อง 30 วิก่อนพบญาติจริง (PDPA-Safe Zero-PII) */}
                                        <div className="no-print">
                                            <PreApproachWarmupCard
                                                callAppsScript={callAppsScript}
                                                roleProfile={roleProfile}
                                                showToast={showToast}
                                            />
                                        </div>
                                    </div>
                                )}
                            </main>

                            {/* Mobile Bottom Dock Navigation */}
                            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-3 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] no-print">
                                <div className="grid grid-cols-4 gap-1.5 max-w-md mx-auto">
                                    {[
                                        { id: 'lessons', label: 'บทเรียน', icon: 'MonitorPlay' },
                                        { id: 'live', label: 'Live สด', icon: 'Radio' },
                                        { id: 'leaderboard', label: 'จัดอันดับ', icon: 'Trophy' },
                                        { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
                                    ].map(item => {
                                        const active = activeTab === item.id;
                                        return (
                                            <button
                                                key={item.id}
                                                type="button"
                                                onClick={() => { setActiveTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all active:scale-95 ${
                                                    active
                                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-sm'
                                                        : 'text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={item.icon} size={17} />
                                                <span>{item.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </nav>
                        </div>
                    )}

                    {/* ==================== SCREEN 6: CERTIFICATE CONFIRM & CSAT ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4">
                            <SpatialCard className="w-full max-w-lg p-6 sm:p-8 space-y-5">
                                <div className="text-center space-y-1.5">
                                    <div className="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto">
                                        <Icon name="Award" size={28} />
                                    </div>
                                    <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">STEP 05 • CSAT & CERTIFICATE STUDIO</span>
                                    <h2 className="font-display text-2xl font-extrabold text-primary-adaptive">ยืนยันข้อมูลและประเมินความพึงพอใจ</h2>
                                    <p className="text-xs text-secondary-adaptive">ตรวจสอบชื่อ-สกุลที่จะพิมพ์ลงประกาศนียบัตรสไตล์มินิมอล และให้คะแนนความพึงพอใจหลักสูตรค่ะ</p>
                                </div>

                                <form onSubmit={handleConfirmCertificate} className="space-y-4">
                                    <FormField label="ชื่อ - นามสกุล บนประกาศนียบัตร *" required value={certFormName} onChange={e => setCertFormName(e.target.value)} />
                                    <FormField label="โรงพยาบาล / หน่วยงาน" value={certFormHosp} onChange={e => setCertFormHosp(e.target.value)} />

                                    <div className="spatial-soft p-4 rounded-2xl space-y-2.5 text-center">
                                        <p className="text-xs font-bold text-primary-adaptive">คะแนนความพึงพอใจต่อระบบการเรียนรู้ (1–5 ดาว)</p>
                                        <div className="flex items-center justify-center gap-2">
                                            {[1, 2, 3, 4, 5].map(star => (
                                                <button
                                                    key={star}
                                                    type="button"
                                                    onClick={() => setCsatRating(star)}
                                                    className={`w-11 h-11 rounded-xl flex items-center justify-center transition-all ${
                                                        star <= csatRating ? 'bg-amber-400/20 text-amber-400 scale-105' : 'bg-white/5 text-slate-500'
                                                    }`}
                                                >
                                                    <Icon name="Star" size={22} />
                                                </button>
                                            ))}
                                        </div>
                                        <textarea
                                            rows="2"
                                            value={csatComment}
                                            onChange={e => setCsatComment(e.target.value)}
                                            placeholder="ข้อเสนอแนะเพิ่มเติมเพื่อพัฒนาหลักสูตร (ไม่บังคับ)"
                                            className="spatial-input w-full p-3 rounded-xl text-xs"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2.5">
                                        <button type="button" onClick={() => setScreen('dashboard')} className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-bold text-sm">
                                            กลับห้องเรียน
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={isClaimingCert}
                                            className="touch-target py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {isClaimingCert ? 'กำลังออกใบประกาศฯ...' : 'ออกประกาศนียบัตรทันที'}
                                        </button>
                                    </div>
                                </form>
                            </SpatialCard>
                        </div>
                    )}

                    {/* ==================== SCREEN 7: APPLE MINIMALIST CERTIFICATE VIEW ==================== */}
                    {screen === 'certificate' && user && (
                        <div className="relative z-10 flex-1 w-full max-w-5xl mx-auto px-3.5 sm:px-6 py-6 sm:py-10 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2 no-print">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">APPLE MINIMALIST EDITION • 300 DPI + QR VERIFY</span>
                                    <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ประกาศนียบัตรอิเล็กทรอนิกส์ของคุณ</h1>
                                </div>
                                <button
                                    type="button"
                                    onClick={() => setScreen('dashboard')}
                                    className="spatial-soft px-4 py-2 rounded-xl text-primary-adaptive font-bold text-xs inline-flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={14} /> กลับหน้าหลักห้องเรียน
                                </button>
                            </div>

                            <SpatialCard className="p-3 sm:p-5 space-y-4">
                                <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-amber-500/35 shadow-2xl">
                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 no-print">
                                    <button
                                        type="button"
                                        onClick={handleDownloadCertPdf}
                                        className="touch-target py-3.5 px-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                    >
                                        <Icon name="FileDown" size={18} /> ดาวน์โหลด PDF (A4 พร้อมพิมพ์)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleDownloadCertPng}
                                        className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="Image" size={18} className="text-prism-adaptive" /> บันทึกภาพ PNG ความละเอียดสูง
                                    </button>
                                    <a
                                        href={`./verify.html?code=${encodeURIComponent(user.certificateCode || '')}`}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-accent-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="QrCode" size={18} /> ทดสอบลิงก์ตรวจสอบ QR
                                    </a>
                                </div>
                            </SpatialCard>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
