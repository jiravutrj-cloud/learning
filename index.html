    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f8fafc');
        } catch (_) {}
      })();
    </script>

        --dock-bg: rgba(255, 255, 255, 0.96);
      }

      html {
        -webkit-tap-highlight-color: transparent;
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Sarabun', sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        margin: 0;
        overflow-x: hidden;
        overscroll-behavior-y: none;
        transition: background-color 0.28s ease, color 0.28s ease;
      }

      /* Mobile-First Safe Area & Touch Optimization */
      .min-h-dvh { min-height: 100vh; min-height: 100dvh; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pb-dock-safe { padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); }
      .touch-target { min-height: 46px; touch-action: manipulation; }

      /* ป้องกัน iOS Safari ซูมหน้าจอตอนแตะช่องกรอกข้อมูล */
      @media (max-width: 768px) {
        input, select, textarea { font-size: 16px !important; }
      }

      /* Spatial Aura Ambient Backdrop */
      .spatial-aura {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 12% 14%, var(--aura-1) 0%, transparent 46%),
          radial-gradient(circle at 88% 12%, var(--aura-2) 0%, transparent 45%),
          radial-gradient(circle at 68% 88%, var(--aura-3) 0%, transparent 48%);
        pointer-events: none;
      }
      .spatial-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(ellipse at center, black 45%, transparent 94%);
        pointer-events: none;
      }

      /* Semantic Spatial Glass Utilities */
      .spatial-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(155%);
        -webkit-backdrop-filter: blur(24px) saturate(155%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      .spatial-header {
        background: var(--header-bg);
        backdrop-filter: blur(22px) saturate(150%);
        -webkit-backdrop-filter: blur(22px) saturate(150%);
        border-bottom: 1px solid var(--surface-border);
      }
      .spatial-dock {
        background: var(--dock-bg);
        backdrop-filter: blur(24px) saturate(150%);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        border-top: 1px solid var(--surface-border);
      }
      .spatial-soft {
        background: var(--surface-soft);
        border: 1px solid var(--surface-border);
      }
      .spatial-soft:hover {
        background: var(--surface-soft-hover);
      }
      .spatial-input {
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--input-text);
      }
      .spatial-input:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
      }

      .text-primary-adaptive { color: var(--text-main); }
      .text-secondary-adaptive { color: var(--text-secondary); }
      .text-muted-adaptive { color: var(--text-muted); }
      .text-accent-adaptive { color: var(--accent-text); }
      .text-prism-adaptive { color: var(--accent-prism); }

        background-color: #070d1c;
        color: #f8fafc;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }

      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.38); border-radius: 999px; }

        .no-print { display: none !important; }
        .spatial-aura, .spatial-grid { display: none !important; }
        html, body { background: #ffffff !important; color: #0f172a !important; }
      }
    </style>

        function parseRawExams(raw) {

                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0

            });
        }

            const score = parseInt(m[1], 10);
            const total = parseInt(m[2], 10) || 1;
            return { score, total, percent: Math.round((score / total) * 100) };
        }

            const sec = s % 60;
            if (h > 0) return `${h} ชม. ${m} นาที`;

         */
        function analyzeQuizByDomains(questions, answersMap) {
            const bucket = {};
            Object.keys(CLINICAL_DOMAINS).forEach(k => {
                bucket[k] = { ...CLINICAL_DOMAINS[k], correct: 0, total: 0 };
            });

            questions.forEach((q, idx) => {
                const domKey = bucket[q.domain] ? q.domain : 'policy_ethics';
                bucket[domKey].total += 1;
                if (answersMap[idx] === q.answer) {
                    bucket[domKey].correct += 1;
                }
            });

            const domainResults = Object.values(bucket).map(d => ({
                ...d,
                percent: d.total > 0 ? Math.round((d.correct / d.total) * 100) : 100
            }));

            const sortedAsc = [...domainResults].sort((a, b) => a.percent - b.percent);
            const weakDomains = sortedAsc.filter(d => d.percent < 80);
            const focusDomains = weakDomains.length > 0 ? weakDomains.slice(0, 2) : sortedAsc.slice(0, 1);
            const recommendedLessonIds = Array.from(new Set(focusDomains.flatMap(d => d.lessonIds || [])));

            const summaryText = weakDomains.length === 0
                ? 'พื้นฐานความรู้ทั้ง 4 หมวดอยู่ในเกณฑ์ยอดเยี่ยม! แนะนำทบทวนบทเรียนสำคัญและเข้าฝึกสื่อสารใน AI Skill Lab ค่ะ'

            return {

                weakDomains,
                focusDomains,
                recommendedLessonIds,
                summaryText,
                updatedAt: new Date().toISOString()
            };
        }

        /**
         * แปลงเสียง PCM16 จาก Gemini TTS เป็นไฟล์ WAV เล่นบนเบราว์เซอร์ (AI Audio Brief)
         */
        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

                `“สวัสดีค่ะ ดิฉันขอแสดงความเสียใจอย่างสุดซึ้งกับเหตุการณ์ที่เกิดขึ้นกับท่านนะคะ ขออนุญาตเชิญครอบครัวมานั่งพูดคุยกันในพื้นที่ที่เป็นส่วนตัวนี้ ดิฉันอยู่ตรงนี้เพื่อรับฟังและค่อยๆ ตอบทุกข้อสงสัยของครอบครัวค่ะ”`,
                mood.includes('สับสน')
                    ? `“เข้าใจเลยค่ะว่าการยังเห็นหน้าอกขยับและตัวอุ่นทำให้ทำใจเชื่อได้ยากมาก สิ่งที่เห็นเกิดจากเครื่องช่วยหายใจและยาที่พยุงชั่วคราว ส่วนก้านสมองได้หยุดทำงานถาวรแล้วค่ะ ดิฉันขอให้เวลาครอบครัวค่อยๆ ซึมซับความจริงก่อนนะคะ”`
                    : mood.includes('ต่างกัน')
                        ? `“ดิฉันสัมผัสได้ถึงความรักที่ทุกท่านมีให้ผู้เสียชีวิตอย่างลึกซึ้งค่ะ ทีมจะไม่ฝืนใจหรือกดดันครอบครัวเด็ดขาด ขอให้ครอบครัวได้พูดคุยกันอย่างสงบและตัดสินใจร่วมกันด้วยความสบายใจที่สุดค่ะ”`
                        : `“เหตุการณ์จาก${cause}เกิดขึ้นอย่างกะทันหันและยากเกินจะทำใจได้จริงๆ ค่ะ ตอนนี้ยังไม่ต้องรีบตัดสินใจเรื่องใดๆ นะคะ หากมีจุดไหนที่ยังค้างคาใจ สามารถถามดิฉันได้ทุกเมื่อค่ะ”`
            ];

            let concernQa = 'หากญาติกังวลเรื่องระยะเวลาหรือความพร้อม: ยืนยันหลัก Zero Pressure ให้เวลาครอบครัวปรึกษากันอย่างเต็มที่โดยไม่เร่งรัดค่ะ';
            if (concern.includes('ความเชื่อ')) {
                concernQa = 'หากญาติกังวลเรื่องความเชื่อ/พิธีกรรมศาสนา: รับฟังด้วยความเคารพ ห้ามตำหนิ อธิบายคุณค่าทานบารมีอันยิ่งใหญ่ และรับรองการดูแลตกแต่งร่างอย่างประณีตเพื่อให้ทำพิธีทางศาสนาได้ตามปกติค่ะ';
            } else if (concern.includes('ร่าง')) {
                concernQa = 'หากญาติกลัวร่างไม่เรียบร้อย: ยืนยันอย่างหนักแน่นว่าทีมศัลยแพทย์จะดูแลผ่าตัดและเย็บแผลตกแต่งร่างอย่างประณีตสมบูรณ์ ให้เกียรติร่างผู้เสียชีวิตสูงสุดค่ะ';
            } else if (concern.includes('ค่าใช้จ่าย')) {
                concernQa = 'หากญาติกังวลค่าใช้จ่าย/ความโปร่งใส: อธิบายว่าอวัยวะทุกชิ้นจัดสรรผ่านระบบคอมพิวเตอร์ของศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC) อย่างเป็นธรรม ไม่มีซื้อขาย และครอบครัวไม่มีค่าใช้จ่ายเพิ่มจากกระบวนการบริจาคค่ะ';
            }

            return {
                contextLabel: `${ageGroup} • ${cause} • อารมณ์ญาติ: ${mood}`,
                openers,
                checklist: [
                    'Setting & Role: พูดคุยในพื้นที่ส่วนตัว เงียบสงบ แนะนำชื่อและบทบาทอย่างนุ่มนวล',
                    'Empathy & Silence: รับฟังอารมณ์สูญเสียและเว้นจังหวะเงียบ 2.5 วินาทีหลังญาติระบายความรู้สึก',
                    'Decoupling: แยกการยืนยันภาวะสมองตายออกจากการเสนอทางเลือกบริจาคอวัยวะอย่างชัดเจน',
                    'Zero Pressure & Dignity: ไม่เร่งรัด ไม่ใช้คำกระทบใจ (เลี่ยง “ถอดเครื่อง / ศพ”) และรับรองการตกแต่งร่างประณีต'
                ],
                concernQa
            };
        }

        /**
         * สร้างบทสรุปพัฒนาการสมรรถนะรายบุคคล 1 ย่อหน้าสำหรับแนบ Portfolio
         */
        function generateLocalGrowthNarrative(user, posttestInfo) {
            const preMatch = String(user?.pretest || '').match(/(\d+)\s*\/\s*(\d+)/);
            const prePct = preMatch ? Math.round((parseInt(preMatch[1], 10) / (parseInt(preMatch[2], 10) || 1)) * 100) : null;
            const postPct = posttestInfo?.total > 0 ? posttestInfo.percent : null;
            const deltaText = (prePct !== null && postPct !== null)
                ? (postPct >= prePct ? `เพิ่มขึ้น +${postPct - prePct}% (จาก ${prePct}% เป็น ${postPct}%)` : `อยู่ที่ ${postPct}%`)
                : (postPct !== null ? `ผ่านเกณฑ์มาตรฐาน ${postPct}%` : 'อยู่ระหว่างการเรียนรู้และประเมินผล');

            const hist = Array.isArray(user?.skillLabHistory) ? user.skillLabHistory : [];
            const bestLab = typeof user?.skillLabBestScore === 'number'
                ? user.skillLabBestScore
                : (hist.length > 0 ? Math.max(...hist.map(h => h.score || 0)) : null);
            const labText = bestLab !== null
                ? `พร้อมผ่านการฝึกจำลองการสื่อสารกับญาติ 3 มิติ (AI Skill Lab) ด้วยดัชนี Empathy สูงสุด ${bestLab}/100 คะแนน`
                : 'และเตรียมความพร้อมสู่การฝึกจำลองการสื่อสารกับญาติใน AI Skill Lab 3 มิติ';

            const role = resolveUserRoleProfile(user);
            return `${user?.name || 'ผู้เรียน'} (${user?.position || 'บุคลากรทางการแพทย์'} • ${user?.hospital || 'เครือข่าย rjcloud.organ'}) ได้แสดงความมุ่งมั่นในการพัฒนาสมรรถนะด้านการรับบริจาคและปลูกถ่ายอวัยวะในบทบาท “${role.badgeTH}” โดยมีพัฒนาการความรู้ทางคลินิก${deltaText} ${labText} สะท้อนถึงความพร้อมทั้งด้านความแม่นยำทางวิชาการ จริยธรรมวิชาชีพ และความอ่อนโยนในการประคับประคองครอบครัวผู้เสียชีวิตตามมาตรฐานปี 2027`;
        }

        /**
         * ระบบตอบคำถาม AI Study Companion สำรองบนเครื่อง (ปรับตามบทบาท Role-Adaptive)
         */
        function generateOfflineStudyAnswer(question, lesson, roleProfile = null) {
            const q = String(question || '').toLowerCase();
            const guide = LESSON_AI_GUIDES[lesson?.id];
            const rolePrefix = roleProfile ? `[${roleProfile.badgeTH}] ` : '';

            if (q.match(/อุณหภูมิ|ขนส่งไต|บรรจุไต|น้ำแข็ง/)) {
                return `${rolePrefix}การบรรจุและขนส่งไต (Kidney Packaging) ต้องควบคุมอุณหภูมิที่ 2–4 องศาเซลเซียส โดยแช่ในน้ำแข็งเกล็ดที่กำลังละลายแบบปลอดเชื้อหลายชั้น และห้ามใช้น้ำแข็งแห้ง (-20°C) เพราะจะทำให้เนื้อเยื่อไตเสียหายค่ะ`;
            }
            if (q.match(/สมองตาย|gcs|apnea|แพทย์กี่|6 ชม|lazarus|eeg/)) {
                return `${rolePrefix}เกณฑ์ยืนยันภาวะสมองตายในผู้ใหญ่: ต้องมี GCS = 3, ตรวจยืนยันทางคลินิกอย่างน้อย 2 ครั้งห่างกันอย่างน้อย 6 ชั่วโมง และรับรองโดยแพทย์ 3 ท่านที่ไม่เกี่ยวข้องกับทีมปลูกถ่าย • Apnea Test พิสูจน์การหยุดทำงานถาวรของศูนย์หายใจที่ก้านสมอง • Lazarus Sign เป็นเพียงรีเฟล็กซ์ไขสันหลัง ส่วน EEG เป็นทางเลือกเสริมค่ะ`;
            }
            if (q.match(/เบาจืด|ddavp|desmopressin|ความดัน|donor|ecmo/)) {
                return `${rolePrefix}ในการดูแลผู้บริจาคสมองตาย (Donor Management): ขั้นแรกต้องรักษาสัญญาณชีพและความดันโลหิตให้คงที่ ภาวะที่พบบ่อยคือความดันโลหิตต่ำและภาวะเบาจืด (Diabetes Insipidus) ซึ่งนิยมคุมด้วยยา Desmopressin (DDAVP) และให้ยาปฏิชีวนะป้องกันการติดเชื้อค่ะ`;
            }
            if (q.match(/decoupling|spikes|ญาติ|สื่อสาร|ชาติหน้า|คัดค้าน/)) {
                return `${rolePrefix}หลักการสื่อสารกับญาติ (Family Approach): ใช้พื้นที่ให้คำปรึกษาที่เป็นส่วนตัว (Setting ใน SPIKES), ทำ Decoupling (แยกการแจ้งข่าวสมองตายออกจากการขอรับบริจาค), รับรู้อารมณ์ร่วมและเว้นความเงียบ 2.5 วินาที, ไม่เร่งรัด และหากญาติสายตรงคัดค้านรุนแรงให้ยุติการจัดเก็บเพื่อเคารพจิตใจครอบครัวค่ะ`;
            }
            if (q.match(/หัวใจ|ดวงตา|golden|ชั่วโมง|ตกแต่ง|hla/)) {
                return `${rolePrefix}ตัวเลขคลินิกสำคัญ: ระยะเวลาทองของหัวใจไม่เกิน 4 ชั่วโมง • ดวงตาควรจัดเก็บภายใน 6–8 ชั่วโมง • การปลูกถ่ายไตให้ความสำคัญสูงสุดกับ HLA Typing • และขั้นตอนสุดท้ายที่สำคัญที่สุดคือดูแลตกแต่งร่างผู้บริจาคให้เรียบร้อยประณีตที่สุดค่ะ`;
            }

            if (guide?.keyPoints?.length) {
                return `${rolePrefix}ประเด็นสำคัญประจำบทที่ ${lesson.id} (${lesson.title}):\n• ${guide.keyPoints.join('\n• ')}\n\nหากต้องการสอบถามรายละเอียดเฉพาะเจาะจง เช่น ตัวเลขเกณฑ์คลินิก ยาที่ใช้ หรือแนวทางคุยกับญาติ สามารถพิมพ์ถามเพิ่มได้เลยค่ะ`;
            }

            return `${rolePrefix}สำหรับบทที่ ${lesson?.id || ''} (${lesson?.title || ''}) แนะนำให้ทบทวนประเด็นหลัก 3 ส่วนคือ เกณฑ์การประเมินทางคลินิก บทบาทการประสานงานของทีมสหสาขาวิชาชีพ และจริยธรรมการดูแลผู้ป่วยและญาติค่ะ`;
        }

        function loadImageSafe(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        /**
         * วาดประกาศนียบัตรความละเอียดสูง 300 DPI สไตล์ Apple Minimalist
         * พื้นสีขาวบริสุทธิ์ ตัดเส้นสายสีทองเมทัลลิกแบบบางเฉียบ เรียบหรู พร้อม QR Code ตรวจสอบจริง
         */
        async function renderAppleMinimalCertificate(canvas, certData, template) {
            if (!canvas) return;
            const W = 2400, H = 1697;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const verifyUrl = `${window.location.origin}${window.location.pathname.replace(/index\.html$/i, '')}verify.html?code=${encodeURIComponent(certData.code || '')}`;

            const [logoImg, sigImg, qrImg] = await Promise.all([
                loadImageSafe(template.logoUrl),
                loadImageSafe(template.signatureUrl),
                new Promise(async (resolve) => {
                    try {
                        if (window.QRCode && typeof window.QRCode.toDataURL === 'function') {
                            const dataUrl = await window.QRCode.toDataURL(verifyUrl, {
                                width: 320,
                                margin: 1,
                                color: { dark: '#1d1d1f', light: '#ffffff' }
                            });
                            const img = new Image();
                            img.onload = () => resolve(img);
                            img.onerror = () => resolve(null);
                            img.src = dataUrl;
                        } else {
                            resolve(null);
                        }
                    } catch (_) {
                        resolve(null);
                    }
                })
            ]);

            // 1. พื้นหลังสีขาวบริสุทธิ์
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            // 2. เส้นกรอบคู่สีทองเมทัลลิกแบบบางเฉียบ (Double Hairline Gold Frame)
            const goldGrad = ctx.createLinearGradient(0, 0, W, H);
            goldGrad.addColorStop(0, '#b89242');
            goldGrad.addColorStop(0.35, '#e2c785');
            goldGrad.addColorStop(0.7, '#c5a059');
            goldGrad.addColorStop(1, '#a67f32');

            ctx.strokeStyle = goldGrad;
            ctx.lineWidth = 3.2;
            ctx.strokeRect(64, 64, W - 128, H - 128);

            ctx.strokeStyle = 'rgba(197, 160, 89, 0.42)';
            ctx.lineWidth = 1.6;
            ctx.strokeRect(88, 88, W - 176, H - 176);

            // 3. เส้นมุมเรขาคณิตสีทองบาง 4 มุม
            const cLen = 56, inset = 112;
            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 2.8;
            [
                [inset, inset, 1, 1],
                [W - inset, inset, -1, 1],
                [inset, H - inset, 1, -1],
                [W - inset, H - inset, -1, -1]
            ].forEach(([cx, cy, dx, dy]) => {
                ctx.beginPath();
                ctx.moveTo(cx + dx * cLen, cy);
                ctx.lineTo(cx, cy);
                ctx.lineTo(cx, cy + dy * cLen);
                ctx.stroke();
            });

            // 4. แถบเส้นทองบางด้านบน หรือ โลโก้หน่วยงาน
            let topY = 216;
            if (logoImg) {
                const maxH = 108;
                const drawW = maxH * (logoImg.width / (logoImg.height || 1));
                ctx.drawImage(logoImg, W / 2 - drawW / 2, 124, drawW, maxH);
                topY = 286;
            } else {
                const barGrad = ctx.createLinearGradient(W / 2 - 90, 0, W / 2 + 90, 0);
                barGrad.addColorStop(0, 'rgba(197, 160, 89, 0.15)');
                barGrad.addColorStop(0.5, '#c5a059');
                barGrad.addColorStop(1, 'rgba(197, 160, 89, 0.15)');
                ctx.fillStyle = barGrad;
                ctx.fillRect(W / 2 - 90, 148, 180, 3.2);
            }

            ctx.textAlign = 'center';

            // 5. ชื่อหน่วยงาน
            ctx.fillStyle = '#1d1d1f';
            ctx.font = '600 34px "Prompt", sans-serif';
            ctx.fillText(template.orgTitleTH || '', W / 2, topY);

            ctx.fillStyle = '#86868b';
            ctx.font = '500 22px "JetBrains Mono", monospace';
            ctx.fillText(template.orgTitleEN || '', W / 2, topY + 44);

            // 6. หัวข้อประกาศนียบัตร
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 24px "JetBrains Mono", monospace';
            ctx.fillText('C E R T I F I C A T E   O F   C O M P L E T I O N', W / 2, topY + 126);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 84px "Prompt", sans-serif';
            ctx.fillText('ประกาศนียบัตร', W / 2, topY + 224);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 34px "Sarabun", sans-serif';
            ctx.fillText(template.subtitleTH || '', W / 2, topY + 296);

            // 7. ชื่อผู้สำเร็จการอบรม + เส้นทองบางคั่นด้านล่าง
            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 84px "Prompt", sans-serif';
            ctx.fillText(certData.name || 'ผู้สำเร็จการอบรม', W / 2, topY + 412);

            const nameRule = ctx.createLinearGradient(W / 2 - 260, 0, W / 2 + 260, 0);
            nameRule.addColorStop(0, 'rgba(197, 160, 89, 0)');
            nameRule.addColorStop(0.25, '#c5a059');
            nameRule.addColorStop(0.75, '#e2c785');
            nameRule.addColorStop(1, 'rgba(197, 160, 89, 0)');
            ctx.fillStyle = nameRule;
            ctx.fillRect(W / 2 - 260, topY + 444, 520, 2.6);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 30px "Sarabun", sans-serif';
            ctx.fillText(`${certData.hospital || ''}   •   เลขที่ใบอนุญาต ${certData.license || '-'}`, W / 2, topY + 502);

            // 8. ข้อความรับรองและชื่อหลักสูตร
            ctx.fillStyle = '#424245';
            ctx.font = '500 34px "Sarabun", sans-serif';
            ctx.fillText(template.completionTextTH || '', W / 2, topY + 586);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 42px "Prompt", sans-serif';
            ctx.fillText(template.courseTitleTH || '', W / 2, topY + 662);

            ctx.fillStyle = '#a8843b';
            ctx.font = '500 26px "Prompt", sans-serif';
            ctx.fillText(template.courseTitleEN || '', W / 2, topY + 714);

            const issuedDateTH = new Date(certData.issuedAt || Date.now()).toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 26px "Sarabun", sans-serif';
            ctx.fillText(`ให้ไว้ ณ วันที่ ${issuedDateTH}`, W / 2, topY + 772);

            // 9. ส่วนลายเซ็นกึ่งกลาง (เส้นทองบาง)
            const sigBaseY = H - 284;
            if (sigImg) {
                const sigH = 104;
                const sigW = sigH * (sigImg.width / (sigImg.height || 1));
                ctx.drawImage(sigImg, W / 2 - sigW / 2, sigBaseY - 116, sigW, sigH);
            }

            ctx.strokeStyle = '#c5a059';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 240, sigBaseY);
            ctx.lineTo(W / 2 + 240, sigBaseY);
            ctx.stroke();

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '600 34px "Prompt", sans-serif';
            ctx.fillText(template.signerName || '', W / 2, sigBaseY + 56);

            ctx.fillStyle = '#6e6e73';
            ctx.font = '500 26px "Sarabun", sans-serif';
            ctx.fillText(template.signerPosition || '', W / 2, sigBaseY + 100);

            // 10. รหัสอ้างอิงมุมซ้ายล่าง (ตัดเส้นทองแนวตั้งบางเฉียบ)
            ctx.fillStyle = '#c5a059';
            ctx.fillRect(148, H - 260, 3.6, 94);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 20px "JetBrains Mono", monospace';
            ctx.fillText('CERTIFICATE NO.', 172, H - 236);

            ctx.fillStyle = '#1d1d1f';
            ctx.font = '700 26px "JetBrains Mono", monospace';
            ctx.fillText(certData.code || 'RJC-2027-XXXXXX', 172, H - 198);

            ctx.fillStyle = '#86868b';
            ctx.font = '500 22px "Sarabun", sans-serif';
            ctx.fillText('ตรวจสอบความถูกต้องผ่าน QR Code ที่ rjcloud.organ', 172, H - 162);

            // 11. กล่อง QR Code มุมขวาล่าง (กรอบเส้นทองบางมินิมอล)
            const qrSize = 208;
            const qrX = W - 152 - qrSize;
            const qrY = H - 184 - qrSize;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = 'rgba(197, 160, 89, 0.65)';
            ctx.lineWidth = 2.4;
            ctx.fillRect(qrX - 16, qrY - 16, qrSize + 32, qrSize + 32);
            ctx.strokeRect(qrX - 16, qrY - 16, qrSize + 32, qrSize + 32);

            if (qrImg) {
                ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
            } else {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#a8843b';
                ctx.font = '600 22px "JetBrains Mono", monospace';
                ctx.fillText('QR VERIFY', qrX + qrSize / 2, qrY + qrSize / 2 + 8);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#a8843b';
            ctx.font = '600 18px "JetBrains Mono", monospace';
            ctx.fillText('SCAN TO VERIFY', qrX + qrSize / 2, qrY + qrSize + 44);
        }

                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6">

        function ClinicalCaseSimulatorCard({ onDomainMiss }) {
            const [caseIdx, setCaseIdx] = useState(0);
            const [stepIdx, setStepIdx] = useState(0);
            const [pickedOptIdx, setPickedOptIdx] = useState(null);
            const [completedCases, setCompletedCases] = useState({});

            const activeCase = CLINICAL_CASE_SIMULATIONS[caseIdx] || CLINICAL_CASE_SIMULATIONS[0];
            const activeStep = activeCase?.steps?.[stepIdx] || activeCase?.steps?.[0];
            const pickedOpt = pickedOptIdx !== null ? activeStep?.options?.[pickedOptIdx] : null;
            const liveVitals = pickedOpt?.nextVitals || activeStep?.vitals || {};

            const handlePickOption = (idx) => {
                if (pickedOptIdx !== null) return;
                setPickedOptIdx(idx);
                const opt = activeStep?.options?.[idx];
                if (opt && !opt.correct && onDomainMiss && activeCase?.domain) {
                    onDomainMiss(activeCase.domain);
                }
            };

            const handleNextStep = () => {
                if (stepIdx < (activeCase.steps.length - 1)) {
                    setStepIdx(s => s + 1);
                    setPickedOptIdx(null);
                } else {
                    setCompletedCases(p => ({ ...p, [activeCase.id]: true }));
                    const nextC = (caseIdx + 1) % CLINICAL_CASE_SIMULATIONS.length;
                    setCaseIdx(nextC);
                    setStepIdx(0);
                    setPickedOptIdx(null);
                }
            };

            const handleSelectCase = (idx) => {
                setCaseIdx(idx);
                setStepIdx(0);
                setPickedOptIdx(null);
            };

            return (
                <div className="space-y-3.5">
                    <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                        {CLINICAL_CASE_SIMULATIONS.map((c, i) => (
                            <button
                                key={c.id}
                                type="button"
                                onClick={() => handleSelectCase(i)}
                                className={`shrink-0 px-3 py-1.5 rounded-xl text-[11px] font-bold border transition-all flex items-center gap-1.5 ${
                                    caseIdx === i
                                        ? 'bg-aurora-500/20 border-aurora-400 text-accent-adaptive'
                                        : 'spatial-soft text-secondary-adaptive'
                                }`}
                            >
                                <span>{completedCases[c.id] ? '✓' : `${i + 1}.`}</span>
                                <span className="truncate max-w-[180px]">{c.badge}</span>
                            </button>
                        ))}
                    </div>

                    <div className="spatial-soft p-4 rounded-2xl space-y-3">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                            <span className="px-2.5 py-0.5 rounded-full bg-prism-500/20 text-prism-adaptive font-mono text-[10px] font-bold">
                                {activeCase.badge} • STEP {stepIdx + 1}/{activeCase.steps.length}
                            </span>
                            <span className="text-[10px] font-mono text-muted-adaptive">INTERACTIVE VITALS MONITOR</span>
                        </div>

                        <div>
                            <h4 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">{activeCase.title}</h4>
                            <p className="text-xs text-muted-adaptive mt-0.5">{activeCase.patientSummary}</p>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            {Object.entries(liveVitals).map(([k, v]) => (
                                <div key={k} className="p-2.5 rounded-xl bg-void-950/85 border border-white/10 text-center">
                                    <span className="font-mono text-[9px] uppercase text-slate-400 block">{k}</span>
                                    <span className={`font-mono text-xs sm:text-sm font-extrabold block mt-0.5 ${
                                        String(v).includes('✗') || String(v).includes('RISK') ? 'text-rose-400' : 'text-aurora-300'
                                    }`}>
                                        {v}
                                    </span>
                                </div>
                            ))}
                        </div>

                        <p className="text-xs sm:text-sm text-primary-adaptive font-semibold leading-relaxed pt-1">
                            {activeStep.situation}
                        </p>

                        <div className="space-y-2">
                            {activeStep.options.map((opt, idx) => {
                                const isPicked = pickedOptIdx === idx;
                                const revealed = pickedOptIdx !== null;
                                return (
                                    <button
                                        key={idx}
                                        type="button"
                                        onClick={() => handlePickOption(idx)}
                                        className={`touch-target w-full text-left p-3 rounded-xl border text-xs sm:text-sm font-semibold transition-all ${
                                            revealed && opt.correct
                                                ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive'
                                                : revealed && isPicked && !opt.correct
                                                    ? 'bg-rose-500/20 border-rose-400 text-primary-adaptive'
                                                    : 'spatial-soft text-secondary-adaptive hover:border-prism-400/50'
                                        }`}
                                    >
                                        {opt.label}
                                    </button>
                                );
                            })}
                        </div>

                        {pickedOpt && (
                            <div className={`p-3.5 rounded-xl border text-xs leading-relaxed space-y-2.5 ${
                                pickedOpt.correct
                                    ? 'bg-aurora-500/15 border-aurora-400/40 text-primary-adaptive'
                                    : 'bg-amber-500/15 border-amber-400/40 text-primary-adaptive'
                            }`}>
                                <p>
                                    <b>{pickedOpt.correct ? '✅ ผลลัพธ์ทางคลินิก: ' : '⚠️ ผลลัพธ์ทางคลินิก: '}</b>
                                    {pickedOpt.outcome}
                                </p>
                                <div className="flex justify-end gap-2">
                                    {!pickedOpt.correct && (
                                        <button
                                            type="button"
                                            onClick={() => setPickedOptIdx(null)}
                                            className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold"

                                            ลองตัดสินใจใหม่

                                        type="button"
                                        onClick={handleNextStep}
                                        className="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs"
                                    >
                                        {stepIdx < activeCase.steps.length - 1 ? 'ไปจังหวะถัดไป →' : 'เคสถัดไป →'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SmartFlashcardsDeck({ priorityDomains = [] }) {
            const [masteredIds, setMasteredIds] = useState({});
            const [reviewQueueBoost, setReviewQueueBoost] = useState({});
            const [cardIndex, setCardIndex] = useState(0);
            const [flipped, setFlipped] = useState(false);

            const orderedDeck = useMemo(() => {
                const prioSet = new Set(priorityDomains);
                return [...SPACED_FLASHCARDS].sort((a, b) => {
                    const aScore = (reviewQueueBoost[a.id] ? 3 : 0) + (prioSet.has(a.domain) ? 2 : 0) - (masteredIds[a.id] ? 4 : 0);
                    const bScore = (reviewQueueBoost[b.id] ? 3 : 0) + (prioSet.has(b.domain) ? 2 : 0) - (masteredIds[b.id] ? 4 : 0);
                    return bScore - aScore;
                });
            }, [priorityDomains, masteredIds, reviewQueueBoost]);

            const card = orderedDeck[cardIndex % orderedDeck.length] || SPACED_FLASHCARDS[0];
            const domMeta = CLINICAL_DOMAINS[card?.domain];
            const masteredCount = Object.values(masteredIds).filter(Boolean).length;

            const goNext = () => {
                setFlipped(false);
                setCardIndex(i => (i + 1) % orderedDeck.length);

                            <span className="text-[10px] font-bold text-muted-adaptive">

                            <div className="p-3 rounded-xl bg-aurora-500/15 border border-aurora-400/30 text-xs sm:text-sm text-primary-adaptive whitespace-pre-line leading-relaxed">
                                {card.back}

                        <div className="flex justify-end">
                            <span className="text-[11px] font-bold text-accent-adaptive">
