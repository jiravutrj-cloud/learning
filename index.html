        function computeDomainDiagnosis(questions, answersMap) {

                const dk = acc[q.domain] ? q.domain : 'policy_ethics';
                acc[dk].total += 1;
                if (Number(answersMap[idx]) === Number(q.answer)) acc[dk].correct += 1;
            });
            const domains = Object.keys(CLINICAL_DOMAINS).map(k => {
                const t = acc[k].total || 0;
                const c = acc[k].correct || 0;
                return { id: k, ...CLINICAL_DOMAINS[k], correct: c, total: t, percent: t > 0 ? Math.round((c / t) * 100) : 100 };

            return { domains, weakestId: weakest?.id || 'policy_ethics' };

        function maskEmailSafe(e) {

        function formatStudyTimeSafe(sec) {
            const s = Math.max(0, Math.floor(Number(sec || 0)));
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const r = s % 60;
            return `${h} ชม. ${String(m).padStart(2, '0')} น. ${String(r).padStart(2, '0')} วิ`;
        }

        function formatThaiDateSafe(iso) {
            try {
                const d = iso ? new Date(iso) : new Date();
                return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (_) { return '-'; }
        }

        function prepareSpeechSafe(raw) {
            if (typeof CORE.prepareNaturalThaiSpeech === 'function') return CORE.prepareNaturalThaiSpeech(raw);
            return String(raw || '').replace(/[*#_]/g, ' ').replace(/\s{2,}/g, ' ').trim();
        }

        function pcm16ToWavBlobSafe(base64, rate = 24000) {
            if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64, rate);
            const bin = window.atob(base64);
            const raw = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
            const off = (raw.length > 44 && raw[0] === 0x52 && raw[1] === 0x49) ? 44 : 0;
            const len = Math.max(0, raw.length - off);
            const buf = new ArrayBuffer(44 + len);
            const v = new DataView(buf);
            const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            ws(0, 'RIFF'); v.setUint32(4, 36 + len, true); ws(8, 'WAVE'); ws(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
            v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, len, true);
            new Uint8Array(buf, 44).set(raw.subarray(off));
            return new Blob([buf], { type: 'audio/wav' });
        }

                const rawRes = await fetch(url, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(bodyObj),
                    signal: ctrl.signal
                });
                clearTimeout(tm);
                return JSON.parse((await rawRes.text()) || '{}');
            } catch (_) {
                clearTimeout(tm);
                return null;
            }
        }

        function LearnerApp() {
            const previewParam = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);
            const isAdminPreview = Boolean(previewParam);

            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020612' : '#edf6fd');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // PWA Install & Offline Status (Zero-Cost Upgrade #5)
            const [pwaPrompt, setPwaPrompt] = useState(null);
            const [isOnline, setIsOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
            useEffect(() => {
                if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                    navigator.serviceWorker.register('./sw.js').catch(() => {});
                }
                const onBip = (e) => { e.preventDefault(); setPwaPrompt(e); };
                const onOn = () => setIsOnline(true);
                const onOff = () => setIsOnline(false);
                window.addEventListener('beforeinstallprompt', onBip);
                window.addEventListener('online', onOn);
                window.addEventListener('offline', onOff);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onBip);
                    window.removeEventListener('online', onOn);
                    window.removeEventListener('offline', onOff);
                };
            }, []);

            const handleInstallPwa = async () => {
                if (!pwaPrompt) return;
                try {
                    pwaPrompt.prompt();
                    await pwaPrompt.userChoice;
                } catch (_) {}
                setPwaPrompt(null);
            };

            // Core Navigation & User State
            const [screen, setScreen] = useState(() => {
                if (previewParam === 'landing') return 'landing';
                if (previewParam === 'auth1' || previewParam === 'auth2' || previewParam === 'auth3') return 'auth';
                if (previewParam === 'pretest') return 'pretest';
                if (previewParam === 'posttest') return 'posttest';
                if (previewParam === 'cert_confirm') return 'cert_confirm';
                if (previewParam === 'certificate') return 'certificate';
                if (previewParam === 'dashboard' || previewParam === 'live' || previewParam === 'profile') return 'dashboard';
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return saved.user.pretest && saved.user.pretest !== '-' ? 'dashboard' : 'pretest';
                } catch (_) {}
                return 'landing';
            });
            const [activeTab, setActiveTab] = useState(() => (previewParam === 'live' ? 'live' : previewParam === 'profile' ? 'profile' : 'lessons'));
            const [user, setUser] = useState(() => {
                if (isAdminPreview) return { ...ADMIN_PREVIEW_USER };
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return saved.user;
                } catch (_) {}
                return null;
            });

            // Cloud Settings & Content
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : []));
            const [questions, setQuestions] = useState(() => parseRawExams(window.QUIZ_QUESTIONS_RAW || []));
            const [certTemplate, setCertTemplate] = useState({ ...DEFAULT_CERT_TEMPLATE });
            const [cneuConfig, setCneuConfig] = useState({ ...DEFAULT_CNEU_CONFIG });
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคอวัยวะ 2027', url: '', documentUrl: '' });

            // Auth Wizard 3-Step State
            const [authStep, setAuthStep] = useState(() => (previewParam === 'auth2' ? 2 : previewParam === 'auth3' ? 3 : 1));
            const [licenseInput, setLicenseInput] = useState(isAdminPreview ? ADMIN_PREVIEW_USER.license : '');
            const [authBusy, setAuthBusy] = useState(false);
            const [isExistingAccount, setIsExistingAccount] = useState(false);
            const [regForm, setRegForm] = useState({
                name: isAdminPreview ? ADMIN_PREVIEW_USER.name : '',
                email: isAdminPreview ? ADMIN_PREVIEW_USER.email : '',
                phone: isAdminPreview ? ADMIN_PREVIEW_USER.phone : '',
                position: 'พยาบาลวิชาชีพ',
                department: 'กรมการแพทย์',
                hospital: 'รพ.ราชวิถี',
                province: 'กรุงเทพมหานคร',
                userType: 'เรียนใหม่',
                workContext: 'donor_team',
                pdpaAccepted: true
            });
            const [generatedOtp, setGeneratedOtp] = useState('');
            const [otpInput, setOtpInput] = useState('');
            const [otpSentEmail, setOtpSentEmail] = useState('');

            // Learning, Exam & AI Companion State
            const [currentLessonId, setCurrentLessonId] = useState(() => Number(user?.lastVideoId || 1));
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));
            const [examAnswers, setExamAnswers] = useState({});
            const [examResult, setExamResult] = useState(null);
            const [microAnswer, setMicroAnswer] = useState(null);
            const [aiLessonChat, setAiLessonChat] = useState([]);
            const [aiLessonInput, setAiLessonInput] = useState('');
            const [aiLessonBusy, setAiLessonBusy] = useState(false);
            const [ttsState, setTtsState] = useState({ activeKey: '', status: 'idle' });

            // Interactive Tabs: Clinical Cases, Flashcards, Pocket Phrasebook & 30s Warm-up
            const [caseIdx, setCaseIdx] = useState(0);
            const [caseStepIdx, setCaseStepIdx] = useState(0);
            const [caseFeedback, setCaseFeedback] = useState(null);
            const [fcIdx, setFcIdx] = useState(0);
            const [fcFlipped, setFcFlipped] = useState(false);
            const [masteredFcIds, setMasteredFcIds] = useState([]);
            const [phraseFilter, setPhraseFilter] = useState('ALL');
            const [warmupTags, setWarmupTags] = useState({ age: 'วัยทำงาน (20–45 ปี)', cause: 'อุบัติเหตุทางศีรษะ (TBI)', mood: 'สับสนเรื่องเครื่องช่วยหายใจ', concern: 'กลัวร่างไม่เรียบร้อย' });

            // Step 5: Certificate Confirm, CSAT 5-Dimension & SUS (0–100) R2R Research
            const [certNameTH, setCertNameTH] = useState(user?.name || '');
            const [certNameEN, setCertNameEN] = useState(user?.nameEN || '');

            const [issuingCert, setIssuingCert] = useState(false);
            const [showCneuLetter, setShowCneuLetter] = useState(false);

            const [showPdpaModal, setShowPdpaModal] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            const certCanvasRef = useRef(null);
            const ttsAudioRef = useRef(null);
            const ttsUrlRef = useRef(null);
            const studySecondsRef = useRef(studySeconds);

            // Keynote Launch Sync (เฉพาะหน้าแรกต้นไม้)

            // Firebase Auth + Real-Time Settings/Content Sync
            useEffect(() => {

                let unsubSettings = null;

                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                    }, () => {});
                    unsubContent = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'), (snap) => {

                            const sets = normalizeQuestionSets(d.questionSets);

                    }, () => {});
                });
                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                };
            }, [isAdminPreview]);

            // Computed Learning Metrics
            const targetSeconds = useMemo(() => {
                const baseH = Number(liveConfig.hours || 8);

                return hrs * 3600;
            }, [liveConfig.hours, user?.userType]);

            const liveStudyPercent = useMemo(() => {
                const calc = Math.min(100, Math.round((studySeconds / Math.max(1, targetSeconds)) * 100));
                return Math.max(Number(user?.progress || 0), calc);
            }, [studySeconds, targetSeconds, user?.progress]);

            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyEnough = liveStudyPercent >= MIN_STUDY_PERCENT;
            const isLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const isPostPassed = user?.status === 'ผ่าน';
            const canTakePosttest = Boolean(liveConfig.allowPosttest || (isStudyEnough && isLabDone) || isPostPassed);
            const activeLesson = useMemo(() => lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0] || { id: 1, title: 'บทเรียนที่ 1', videoId: '' }, [lessons, currentLessonId]);
            const activeLessonGuide = (window.LESSON_AI_GUIDES && window.LESSON_AI_GUIDES[activeLesson.id]) || { keyPoints: ['ทบทวนหลักการสำคัญจากวิดีโอและเอกสารประกอบบทเรียนนี้'], microCheck: null };
            const clinicalBadges = useMemo(() => computeClinicalBadgesForProfile(user), [user]);

            // Prioritized Flashcards (จุดอ่อนจาก Pre-test ขึ้นก่อน)
            const sortedFlashcards = useMemo(() => {

            }, [user?.aiRoadmap?.weakestId]);

            // Save User Helper + Zero-Cost Executive Summary Increment
            const saveUserToCloud = useCallback(async (updatedUser, summaryIncrements = null) => {
                setUser(updatedUser);
                if (isAdminPreview || !updatedUser?.id) return;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: updatedUser }));
                } catch (_) {}
                if (!fbDb) return;
                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(updatedUser.id)), updatedUser, { merge: true });
                    const anonId = buildAnonTelemetryId(updatedUser.id);
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId), buildExecutiveTelemetryPayload(updatedUser), { merge: true });
                    if (summaryIncrements) {
                        const regionKey = `region_${resolveRegionId(updatedUser.department)}`;
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_summary', 'global'),
                            { ...summaryIncrements, ...(summaryIncrements.totalUsers ? { [regionKey]: increment(1) } : {}), updatedAt: new Date().toISOString() },
                            { merge: true }
                        );
                    }
                } catch (err) { console.warn('Cloud save warning:', err); }
            }, [isAdminPreview]);

            // Study Timer (นับเวลาเรียนจริงเมื่ออยู่หน้าบทเรียนหรือ Live)
            useEffect(() => {
                if (screen !== 'dashboard' || !user || isAdminPreview) return;
                if (activeTab !== 'lessons' && activeTab !== 'live') return;
                const tick = setInterval(() => {
                    if (document.hidden) return;
                    setStudySeconds(s => s + 1);
                }, 1000);
                const syncCloud = setInterval(() => {
                    const sec = studySecondsRef.current;
                    const pct = Math.min(100, Math.round((sec / Math.max(1, targetSeconds)) * 100));
                    saveUserToCloud({ ...user, studySeconds: sec, progress: Math.max(Number(user.progress || 0), pct), lastVideoId: currentLessonId });
                }, 25000);
                return () => { clearInterval(tick); clearInterval(syncCloud); };
            }, [screen, activeTab, user, isAdminPreview, targetSeconds, currentLessonId, saveUserToCloud]);

            // Sync Bridge for ai-interactive.js
            useEffect(() => {
                if (window.RJCLOUD_AI_INTERACTIVE && typeof window.RJCLOUD_AI_INTERACTIVE.registerBridge === 'function') {
                    window.RJCLOUD_AI_INTERACTIVE.registerBridge({
                        screen,
                        activeTab,
                        user,
                        lessons,
                        currentLessonId,
                        studySeconds,
                        targetSeconds,
                        liveStudyPercent,
                        hasDonePretest,
                        isAdminPreview,
                        appsScriptUrl,
                        setActiveTab,

                        toggleTheme,
                        toast: showToast
                    });
                }
            }, [screen, activeTab, user, lessons, currentLessonId, studySeconds, targetSeconds, liveStudyPercent, hasDonePretest, isAdminPreview, appsScriptUrl, toggleTheme, showToast]);

            // Draw Certificate when viewing certificate screen
            useEffect(() => {

            // Natural Voice TTS Player (Lesson Cheat Sheet & Pocket Phrasebook)

                if (ttsUrlRef.current) { try { URL.revokeObjectURL(ttsUrlRef.current); } catch (_) {} ttsUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setTtsState({ activeKey: '', status: 'idle' });
            }, []);
            useEffect(() => () => stopTts(), [stopTts]);

            const playNaturalTts = useCallback(async (key, rawText, lang = 'th') => {
                if (ttsState.activeKey === key && ttsState.status !== 'idle') { stopTts(); return; }
                stopTts();
                const text = lang === 'en' ? String(rawText || '').trim() : prepareSpeechSafe(rawText);
                if (!text) return;
                setTtsState({ activeKey: key, status: 'loading' });

                let blob = typeof CORE.getCachedAudio === 'function' ? await CORE.getCachedAudio(key) : null;
                if (!blob && appsScriptUrl && navigator.onLine) {
                    const res = await postAppsScript(appsScriptUrl, {
                        action: 'callGeminiTTS',
                        text,
                        voiceName: 'Sulafat',
                        languageCode: lang === 'en' ? 'en-US' : 'th-TH',
                        style: lang === 'en'
                            ? 'Speak gently, warmly, and clearly like a compassionate clinical educator.'
                            : 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล ชัดถ้อยชัดคำ เหมือนอาจารย์พยาบาลอธิบายอย่างใจเย็น'
                    }, 18000);
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                        blob = pcm16ToWavBlobSafe(res.inlineData.data, rate);
                        if (typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(key, blob).catch(() => {});
                    }
                }
                if (blob && blob.size > 0) {
                    const url = URL.createObjectURL(blob);
                    ttsUrlRef.current = url;
                    const a = new Audio(url);
                    ttsAudioRef.current = a;
                    setTtsState({ activeKey: key, status: 'speaking' });
                    a.onended = () => stopTts();
                    a.onerror = () => stopTts();
                    a.play().catch(() => stopTts());
                    return;
                }
                if ('speechSynthesis' in window) {
                    setTtsState({ activeKey: key, status: 'speaking' });
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = lang === 'en' ? 'en-US' : 'th-TH';
                    u.rate = 0.95;
                    u.onend = () => stopTts();
                    u.onerror = () => stopTts();
                    window.speechSynthesis.speak(u);
                    return;

                stopTts();
            }, [ttsState, stopTts, appsScriptUrl]);

                setAuthBusy(false);
                setAuthStep(2);
            };

            const handleSendOtp = async (e) => {
                e.preventDefault();
                if (!regForm.name.trim() || !regForm.email.includes('@')) {
                    showToast('กรุณากรอกชื่อ–นามสกุลและอีเมลที่ถูกต้องค่ะ', 'error');
                    return;
                }
                if (!regForm.pdpaAccepted) {
                    showToast('กรุณายอมรับนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ก่อนดำเนินการค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                const code = String(Math.floor(100000 + Math.random() * 900000));
                setGeneratedOtp(code);
                setOtpSentEmail(regForm.email.trim());

                const res = await postAppsScript(appsScriptUrl, {
                    action: 'sendOtp',
                    email: regForm.email.trim(),
                    otp: code,
                    name: regForm.name.trim(),
                    license: licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim(),

                }, 16000);

                if (res && (res.status === 'success' || res.ok || res.sent)) {

                    setAuthStep(3);
                } else {
                    showToast('ส่งอีเมล OTP ไม่สำเร็จ (กรุณาตรวจสอบอีเมลหรือลองใหม่อีกครั้งค่ะ)', 'error');
                }

                };

            const handleSubmitExam = async (mode) => {

                    showToast(`กรุณาตอบคำถามให้ครบทุกข้อ (${Object.keys(examAnswers).length}/${questions.length}) ค่ะ`, 'error');
                    return;
                }
                let correct = 0;
                questions.forEach((q, i) => { if (Number(examAnswers[i]) === Number(q.answer)) correct += 1; });
                const total = Math.max(1, questions.length);
                const pct = Math.round((correct / total) * 100);
                const diag = computeDomainDiagnosis(questions, examAnswers);
                const scoreStr = `${correct}/${total}`;

                if (mode === 'pretest') {
                    const updated = { ...user, pretest: scoreStr, aiRoadmap: diag };
                    await saveUserToCloud(updated);
                    setExamResult({ mode, correct, total, pct, diag, passed: true });
                    showToast(`บันทึกคะแนน Pre-test (${scoreStr}) และสร้าง AI Roadmap เรียบร้อยค่ะ`);
                } else {

                    const updated = { ...user, posttest: scoreStr, status: passed ? 'ผ่าน' : (user?.status || 'กำลังเรียน'), aiRoadmap: diag };

                    setExamResult({ mode, correct, total, pct, diag, passed });

                    satisfactionScore: avgCsat,

                    danger: true,
                    confirmText: 'ออกจากระบบ',
                    onConfirm: () => {

                });
            };

            const handleExportPersonalPdpaJson = () => {
                const blob = new Blob([JSON.stringify(user || {}, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `rjcloud_pdpa_data_${user?.license || 'user'}.json`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast('ส่งออกสำเนาข้อมูลส่วนบุคคล (สิทธิ์ PDPA) แล้วค่ะ');
            };

            const handleDeleteAccountPdpa = () => {
                setConfirmDialog({
                    open: true,
                    title: 'ยืนยันการลบข้อมูลส่วนบุคคล (สิทธิ์ PDPA)',
                    message: 'ข้อมูลประวัติการเรียนของคุณจะถูกลบออกจากฐานข้อมูล Cloud ถาวร ไม่สามารถกู้คืนได้ ยืนยันหรือไม่?',
                    danger: true,
                    confirmText: 'ลบข้อมูลถาวร',
                    onConfirm: async () => {
                        if (fbDb && user?.id && !isAdminPreview) {
                            try { await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id))); } catch (_) {}
                        }
                        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                        setUser(null);
                        setScreen('landing');
                        showToast('ลบข้อมูลส่วนบุคคลตามคำร้อง PDPA เรียบร้อยแล้วค่ะ');
                    }
                });
            };

            // ============================================================================
            // 7. RENDER SCREENS
            // ============================================================================
            if (screen === 'landing') {
                return (
                    <>
                        <LandingHeroStage
                            onStartLogin={handleStartLogin}
                            onOpenPdpa={() => setShowPdpaModal(true)}
                            pwaPrompt={pwaPrompt}
                            onInstallPwa={handleInstallPwa}
                        />
                        {showPdpaModal && (
                            <div onClick={() => setShowPdpaModal(false)} className="fixed inset-0 z-[165] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                                <div onClick={e => e.stopPropagation()} className="spatial-card max-w-lg w-full rounded-[2rem] p-6 space-y-3 text-xs sm:text-sm">
                                    <h3 className="font-display font-extrabold text-base text-primary-adaptive">นโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA)</h3>
                                    <p className="text-secondary-adaptive leading-relaxed">
                                        ระบบจัดเก็บชื่อ–นามสกุล เลขใบอนุญาต อีเมล และหน่วยงานเพื่อการยืนยันตัวตน OTP, ออกประกาศนียบัตร CNEU และการวิจัยพัฒนาคุณภาพการฝึกอบรม โดยหน้า Dashboard สถิติ 13 เขตใช้ข้อมูลแบบไม่ระบุตัวตน (Zero-PII) 100% และคุณสามารถดาวน์โหลดหรือลบข้อมูลของตนเองได้ทุกเมื่อในหน้าโปรไฟล์ค่ะ
                                    </p>
                                    <button type="button" onClick={() => setShowPdpaModal(false)} className="rjc2-pill-btn touch-target w-full py-2.5 rounded-full font-display font-bold text-xs">รับทราบและปิด</button>
                                </div>
                            </div>
                        )}
                        <ToastBanner toast={toast} />
                    </>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* ==================== SCREEN: AUTH WIZARD (3 STEPS) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4 py-8">
                            <div className="spatial-card w-full max-w-lg rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => (authStep === 1 ? setScreen('landing') : setAuthStep(s => s - 1))} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1">
                                        <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-[11px] font-bold text-accent-adaptive">STEP {authStep} / 3 • OTP AUTH</span>
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleLookupLicense} className="space-y-4">
                                        <div>
                                            <h1 className="font-display text-xl font-extrabold text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนผู้เรียน</h1>
                                            <p className="text-xs text-secondary-adaptive mt-1">กรอกเลขที่ใบอนุญาตประกอบวิชาชีพ (10 หลัก) เพื่อตรวจสอบประวัติหรือเริ่มลงทะเบียนใหม่</p>
                                        </div>
                                        <input
                                            type="text"
                                            required
                                            value={licenseInput}
                                            onChange={e => setLicenseInput(e.target.value)}
                                            placeholder="เช่น 6511123456"
                                            className="touch-target spatial-input w-full px-4 py-3 rounded-2xl font-mono text-base font-bold"
                                        />
                                        <button type="submit" disabled={authBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังตรวจสอบข้อมูล...' : 'ตรวจสอบเลขที่ใบอนุญาต →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={handleSendOtp} className="space-y-3 text-xs">
                                        <h2 className="font-display text-lg font-extrabold text-primary-adaptive">ยืนยันข้อมูลผู้เรียน &amp; รับรหัส OTP</h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            <input required value={regForm.name} onChange={e => setRegForm(p => ({ ...p, name: e.target.value }))} placeholder="คำนำหน้า ชื่อ–นามสกุล *" className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm" />
                                            <input required type="email" value={regForm.email} onChange={e => setRegForm(p => ({ ...p, email: e.target.value }))} placeholder="อีเมลสำหรับรับ OTP *" className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm" />
                                            <input value={regForm.phone} onChange={e => setRegForm(p => ({ ...p, phone: e.target.value }))} placeholder="เบอร์โทรศัพท์" className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm" />
                                            <input value={regForm.position} onChange={e => setRegForm(p => ({ ...p, position: e.target.value }))} placeholder="ตำแหน่ง" className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm" />
                                            <select
                                                value={regForm.department}
                                                onChange={e => {
                                                    const dept = e.target.value;
                                                    const firstH = (HOSPITAL_MAPPING[dept] && HOSPITAL_MAPPING[dept][0]) || { name: '', prov: '' };
                                                    setRegForm(p => ({ ...p, department: dept, hospital: firstH.name || p.hospital, province: firstH.prov || p.province }));
                                                }}
                                                className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm"
                                            >
                                                {Object.keys(HOSPITAL_MAPPING).map(k => <option key={k} value={k}>{k}</option>)}
                                            </select>
                                            <input value={regForm.hospital} onChange={e => setRegForm(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล / หน่วยงาน" className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm" />
                                            <select value={regForm.userType} onChange={e => setRegForm(p => ({ ...p, userType: e.target.value }))} className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm">
                                                <option value="เรียนใหม่">สิทธิ์: เรียนใหม่</option>
                                                <option value="เรียนต่อเนื่อง">สิทธิ์: เรียนต่อเนื่อง</option>
                                            </select>
                                            <select value={regForm.workContext} onChange={e => setRegForm(p => ({ ...p, workContext: e.target.value }))} className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm">
                                                <option value="donor_team">มุมมอง AI: ทีมรับบริจาค / TC</option>
                                                <option value="icu_er_or">มุมมอง AI: พยาบาล ICU / ER / OR</option>
                                                <option value="general">มุมมอง AI: ผู้สนใจศึกษาทั่วไป</option>
                                            </select>
                                        </div>
                                        <label className="spatial-soft p-3 rounded-xl flex items-start gap-2 cursor-pointer">
                                            <input type="checkbox" checked={regForm.pdpaAccepted} onChange={e => setRegForm(p => ({ ...p, pdpaAccepted: e.target.checked }))} className="mt-1 accent-aurora-500" />
                                            <span className="text-secondary-adaptive leading-relaxed">ยินยอมให้จัดเก็บข้อมูลเพื่อการอบรม รับรองหน่วยคะแนน CNEU และการวิจัยพัฒนาคุณภาพตามนโยบาย PDPA</span>
                                        </label>
                                        <button type="submit" disabled={authBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังส่งรหัส OTP ไปยังอีเมล...' : 'ส่งรหัส OTP 6 หลักทางอีเมล →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtp} className="space-y-4 text-center">
                                        <div className="w-12 h-12 rounded-2xl bg-aurora-500/20 text-accent-adaptive flex items-center justify-center mx-auto">
                                            <Icon name="ShieldCheck" size={24} />
                                        </div>
                                        <div>
                                            <h2 className="font-display text-lg font-extrabold text-primary-adaptive">กรอกรหัสยืนยันตัวตน OTP 6 หลัก</h2>
                                            <p className="text-xs text-secondary-adaptive mt-1">ส่งไปยังอีเมล <b>{maskEmailSafe(otpSentEmail || regForm.email)}</b> แล้วค่ะ</p>
                                        </div>
                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength={6}
                                            required
                                            value={otpInput}
                                            onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))}
                                            placeholder="000000"
                                            className="touch-target spatial-input w-full text-center tracking-[0.55em] font-mono text-2xl font-extrabold py-3.5 rounded-2xl"
                                        />
                                        <button type="submit" className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                            ยืนยันรหัส OTP และเข้าสู่ห้องเรียน →
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ==================== SCREEN: PRE-TEST & POST-TEST ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && (
                        <div className="relative z-10 max-w-3xl w-full mx-auto px-4 py-6 space-y-5">
                            <header className="spatial-card rounded-2xl p-4 flex items-center justify-between gap-2">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">
                                        {screen === 'pretest' ? 'STEP 01 • PRE-TEST & AI DIAGNOSTIC' : 'STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥80%)'}
                                    </span>
                                    <h1 className="font-display font-extrabold text-lg text-primary-adaptive">
                                        {screen === 'pretest' ? 'แบบทดสอบก่อนเรียน' : 'แบบทดสอบหลังเรียน'} ({Object.keys(examAnswers).length}/{questions.length})
                                    </h1>
                                </div>
                                <div className="flex items-center gap-2">
                                    {screen === 'posttest' && (
                                        <button type="button" onClick={() => { setExamResult(null); setScreen('dashboard'); }} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive">กลับห้องเรียน</button>
                                    )}
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                </div>
                            </header>

                            {examResult ? (
                                <div className="spatial-card rounded-[2rem] p-6 space-y-4">
                                    <div className="flex items-center justify-between gap-3">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">AI 4-DOMAIN DIAGNOSTIC ROADMAP</span>
                                            <h2 className="font-display font-extrabold text-xl text-primary-adaptive">
                                                ได้คะแนน {examResult.correct}/{examResult.total} ({examResult.pct}%)
                                            </h2>
                                        </div>
                                        <span className={`px-3.5 py-1.5 rounded-full font-display font-extrabold text-xs ${examResult.passed ? 'bg-aurora-500/20 text-accent-adaptive' : 'bg-amber-500/20 text-amber-400'}`}>
                                            {examResult.mode === 'pretest' ? 'บันทึกผลแล้ว ✓' : (examResult.passed ? 'สอบผ่านเกณฑ์ ✓' : 'ยังไม่ถึง 80%')}
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                        {examResult.diag.domains.map(d => (
                                            <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1.5">
                                                <div className="flex justify-between text-xs font-bold">
                                                    <span className="text-primary-adaptive">{d.shortName}</span>
                                                    <span className="font-mono" style={{ color: d.color }}>{d.percent}%</span>
                                                </div>
                                                <div className="h-1.5 rounded-full bg-white/10 overflow-hidden">
                                                    <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                                </div>
                                                <p className="text-[11px] text-muted-adaptive">{d.remediationGuide}</p>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex flex-wrap gap-2 pt-2">
                                        {examResult.mode === 'posttest' && examResult.passed ? (
                                            <button type="button" onClick={() => { setExamResult(null); setScreen('cert_confirm'); }} className="rjc2-pill-btn touch-target flex-1 py-3.5 rounded-full font-display font-extrabold text-sm">
                                                ไปขั้นตอนที่ 5: ประเมินผล &amp; รับประกาศนียบัตร →
                                            </button>
                                        ) : (
                                            <button type="button" onClick={() => { setExamResult(null); setExamAnswers({}); setScreen('dashboard'); }} className="rjc2-pill-btn touch-target flex-1 py-3.5 rounded-full font-display font-extrabold text-sm">
                                                เข้าสู่ห้องเรียน 20 บท + AI Study Companion →
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-3 pb-10">
                                    {questions.map((q, qIdx) => (
                                        <div key={q.id || qIdx} className="spatial-card rounded-2xl p-4 sm:p-5 space-y-3">
                                            <p className="font-display font-bold text-sm text-primary-adaptive leading-relaxed">
                                                <span className="font-mono text-prism-adaptive mr-1.5">{qIdx + 1}.</span>{q.question}
                                            </p>
                                            <div className="space-y-2">
                                                {(q.options || []).map((opt, optIdx) => {
                                                    const chosen = Number(examAnswers[qIdx]) === optIdx;
                                                    return (
                                                        <button
                                                            key={optIdx}
                                                            type="button"
                                                            onClick={() => setExamAnswers(p => ({ ...p, [qIdx]: optIdx }))}
                                                            className={`w-full text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition-all ${chosen ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'}`}
                                                        >
                                                            {opt}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                    <button type="button" onClick={() => handleSubmitExam(screen)} className="rjc2-pill-btn touch-target w-full py-4 rounded-full font-display font-extrabold text-base">
                                        ส่งคำตอบและวิเคราะห์ผลด้วย AI →
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ==================== SCREEN: MAIN DASHBOARD (5 TABS) ==================== */}
                    {screen === 'dashboard' && user && (
                        <div className="relative z-10 flex-1 flex flex-col pb-dock-safe lg:pb-10">
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center font-display font-extrabold text-xs shrink-0">RJ</div>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">2.0</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                                {user.name} • {!isOnline ? 'โหมดออฟไลน์ ICU' : `${liveStudyPercent}%`}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="hidden lg:flex items-center gap-1">
                                        {[
                                            { id: 'lessons', label: 'บทเรียน + AI', icon: 'MonitorPlay' },
                                            { id: 'clinical_cases', label: 'เคสคลินิก', icon: 'HeartPulse' },
                                            { id: 'flashcards', label: 'Flashcards', icon: 'Layers' },
                                            { id: 'live', label: 'Live สด', icon: 'Radio' },
                                            { id: 'profile', label: 'โปรไฟล์ & Warm-up', icon: 'User' }
                                        ].map(t => (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setActiveTab(t.id)}
                                                className={`px-3.5 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 transition-all ${activeTab === t.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive hover:bg-white/10'}`}
                                            >
                                                <Icon name={t.icon} size={15} /> {t.label}
                                            </button>
                                        ))}
                                        <button
                                            id="btn-learner-logout"
                                            type="button"
                                            onClick={handleLogout}
                                            className="px-3 py-2 rounded-xl text-xs font-bold text-secondary-adaptive hover:bg-rose-600 hover:text-white transition-colors inline-flex items-center gap-1"
                                        >
                                            <Icon name="LogOut" size={14} /> ออกจากระบบ
                                        </button>
                                    </div>

                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                        <button id="btn-learner-logout-mobile" type="button" onClick={handleLogout} aria-label="ออกจากระบบ" className="lg:hidden w-9 h-9 rounded-xl spatial-soft hover:bg-rose-600 hover:text-white text-secondary-adaptive flex items-center justify-center">
                                            <Icon name="LogOut" size={16} />
                                        </button>
                                    </div>
                                </div>
                            </header>

                            <main className="max-w-7xl w-full mx-auto px-3.5 sm:px-6 pt-4 space-y-5">
                                {/* 5-Step Progress Strip */}
                                <div className="spatial-card rounded-[1.5rem] p-3.5 sm:p-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                    <div className={`p-2.5 rounded-xl border ${hasDonePretest ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive block">01 PRE-TEST</span>
                                        <span className="font-bold text-primary-adaptive">{user.pretest || 'รอทำ'}</span>
                                    </div>
                                    <div className={`p-2.5 rounded-xl border ${isStudyEnough ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive block">02 เวลาเรียน ≥80%</span>
                                        <span className="font-mono font-bold text-primary-adaptive">{liveStudyPercent}% ({formatStudyTimeSafe(studySeconds)})</span>
                                    </div>
                                    <a href="./aiskilllab.html" className={`p-2.5 rounded-xl border transition-all ${isLabDone ? 'bg-aurora-500/15 border-aurora-400/45' : 'bg-violet-500/15 border-violet-400/45 hover:border-violet-300'}`}>
                                        <span className="font-mono text-[10px] font-bold text-violet-300 block">03 AI SKILL LAB 3D</span>
                                        <span className="font-bold text-primary-adaptive">{isLabDone ? `ผ่าน (${user.skillLabBestScore || 85}/100) →` : 'เข้าห้องฝึก 3 มิติ →'}</span>
                                    </a>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (!canTakePosttest && !isAdminPreview) {
                                                showToast(`กรุณาสะสมเวลาเรียน ≥${MIN_STUDY_PERCENT}% และผ่าน AI Skill Lab ก่อนทำ Post-test ค่ะ`, 'info');
                                                return;
                                            }
                                            setExamAnswers({});
                                            setExamResult(null);
                                            setScreen('posttest');
                                        }}
                                        className={`text-left p-2.5 rounded-xl border ${isPostPassed ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-amber-400 block">04 POST-TEST ≥80%</span>
                                        <span className="font-bold text-primary-adaptive">{isPostPassed ? `ผ่าน (${user.posttest}) ✓` : (canTakePosttest ? 'เริ่มสอบเลย →' : 'ล็อกอยู่')}</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (!isPostPassed && !isAdminPreview) {

                                                <select value={warmupTags.concern} onChange={e => setWarmupTags(p => ({ ...p, concern: e.target.value }))} className="spatial-input px-3 py-2.5 rounded-xl">{PRE_APPROACH_TAGS.concerns.map(x => <option key={x} value={x}>ความกังวล: {x}</option>)}</select>
                                            </div>
                                            <div className="p-3.5 rounded-2xl bg-aurora-500/15 border border-aurora-400/35 text-primary-adaptive leading-relaxed">
                                                <b>แนวทางเปิดบทสนทนา 30 วิ ({warmupTags.age} • {warmupTags.mood}):</b> เริ่มในห้องส่วนตัวด้วยน้ำเสียงนุ่มนวล รับฟังความเสียใจและเว้นความเงียบ 2.5 วินาที ก่อนคลายข้อกังวลเรื่อง <b>“{warmupTags.concern}”</b> โดยไม่เร่งรัดการตัดสินใจค่ะ
                                            </div>
                                        </section>

                                        {/* PDPA Data Rights */}
                                        <section className="spatial-card rounded-[1.75rem] p-5 flex flex-wrap items-center justify-between gap-3 text-xs">
                                            <div>
                                                <h3 className="font-display font-bold text-sm text-primary-adaptive">สิทธิ์จัดการข้อมูลส่วนบุคคล (PDPA)</h3>
                                                <p className="text-muted-adaptive">สามารถขอรับสำเนาข้อมูลหรือขอลบประวัติผู้เรียนออกถาวรได้ทันที</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button type="button" onClick={handleExportPersonalPdpaJson} className="spatial-soft px-3.5 py-2 rounded-xl font-bold text-prism-adaptive">ดาวน์โหลดข้อมูล (JSON)</button>
                                                <button type="button" onClick={handleDeleteAccountPdpa} className="px-3.5 py-2 rounded-xl bg-rose-500/15 border border-rose-400/40 font-bold text-rose-300">ลบข้อมูลของฉัน</button>
                                            </div>
                                        </section>
                                    </div>
                                )}
                            </main>

                            {/* Mobile Bottom Dock */}
                            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]">
                                <div className="grid grid-cols-5 gap-1 max-w-lg mx-auto">
                                    {[
                                        { id: 'lessons', label: 'บทเรียน', icon: 'MonitorPlay' },
                                        { id: 'clinical_cases', label: 'เคส', icon: 'HeartPulse' },
                                        { id: 'flashcards', label: 'การ์ด', icon: 'Layers' },
                                        { id: 'live', label: 'Live', icon: 'Radio' },
                                        { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
                                    ].map(t => (
                                        <button key={t.id} type="button" onClick={() => setActiveTab(t.id)} className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold ${activeTab === t.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950' : 'text-secondary-adaptive'}`}>
                                            <Icon name={t.icon} size={17} />
                                            <span>{t.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </nav>
                        </div>
                    )}

                    {/* ==================== SCREEN: STEP 5 CERTIFICATE CONFIRM + CSAT + SUS (R2R) ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <div className="relative z-10 max-w-2xl w-full mx-auto px-4 py-7">
                            <form onSubmit={handleConfirmAndIssueCert} className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive">← กลับห้องเรียน</button>
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive">STEP 05 • CNEU &amp; R2R EVALUATION</span>
                                </div>

                                <div>
                                    <h1 className="font-display text-xl font-extrabold text-primary-adaptive">ยืนยันชื่อประกาศนียบัตร &amp; แบบประเมินหลักสูตร</h1>
                                    <p className="text-xs text-secondary-adaptive mt-0.5">ตรวจสอบตัวสะกดให้ถูกต้องก่อนออกใบประกาศนียบัตรพร้อม QR Code รับรอง</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <input required value={certNameTH} onChange={e => setCertNameTH(e.target.value)} placeholder="ชื่อ–นามสกุล (ภาษาไทย) *" className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm font-bold" />
                                    <input value={certNameEN} onChange={e => setCertNameEN(e.target.value)} placeholder="Full Name in English (ไม่บังคับ)" className="touch-target spatial-input px-3.5 py-2.5 rounded-xl text-sm" />
                                    <input value={certHospital} onChange={e => setCertHospital(e.target.value)} placeholder="โรงพยาบาล / หน่วยงาน" className="touch-target spatial-input sm:col-span-2 px-3.5 py-2.5 rounded-xl text-sm" />
                                </div>

                                {/* CNEU 5-Dimension Satisfaction */}
                                <div className="spatial-soft rounded-2xl p-4 space-y-3">
                                    <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">แบบประเมินความพึงพอใจ 5 ด้าน (มาตรฐาน CNEU • 1–5 ดาว)</p>
                                    {CNEU_EVAL_CRITERIA.map(c => (
                                        <div key={c.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-xs">
                                            <div>
                                                <p className="font-bold text-primary-adaptive">{c.title}</p>
                                                <p className="text-[11px] text-muted-adaptive">{c.desc}</p>
                                            </div>
                                            <div className="flex gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(n => (
                                                    <button key={n} type="button" onClick={() => setCsatScores(p => ({ ...p, [c.key]: n }))} className={`w-8 h-8 rounded-lg font-mono text-xs font-bold ${csatScores[c.key] === n ? 'bg-amber-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                        {n}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <textarea rows="2" value={csatComment} onChange={e => setCsatComment(e.target.value)} placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)..." className="spatial-input w-full p-3 rounded-xl text-xs" />
                                </div>

                                {/* Zero-Cost Upgrade #3: Compact SUS (0–100) for R2R Research */}
                                <div className="spatial-soft rounded-2xl p-4 space-y-3 border-prism-400/35">
                                    <div className="flex items-center justify-between gap-2">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">SYSTEM USABILITY SCALE (SUS • มาตรฐานสากล R2R)</span>
                                        <span className="font-mono text-xs font-extrabold text-accent-adaptive">คะแนน SUS: {computeSusScoreLocal(susAnswers)}/100</span>
                                    </div>
                                    {SUS_USABILITY_ITEMS.map(item => (
                                        <div key={item.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-xs">
                                            <span className="text-secondary-adaptive leading-snug">{item.title}</span>
                                            <div className="flex gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(n => (
                                                    <button key={n} type="button" onClick={() => setSusAnswers(p => ({ ...p, [item.key]: n }))} className={`w-8 h-8 rounded-lg font-mono text-xs font-bold ${susAnswers[item.key] === n ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                        {n}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button type="submit" disabled={issuingCert} className="rjc2-pill-btn touch-target w-full py-4 rounded-full font-display font-extrabold text-sm sm:text-base">
                                    {issuingCert ? 'กำลังออกใบประกาศนียบัตร...' : 'ยืนยันและออกใบประกาศนียบัตรดิจิทัล →'}
                                </button>
                            </form>
                        </div>
                    )}

                    {/* ==================== SCREEN: STEP 5 CERTIFICATE VIEW & EXPORT ==================== */}
                    {screen === 'certificate' && user && (
                        <div className="relative z-10 max-w-4xl w-full mx-auto px-4 py-6 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive">← กลับห้องเรียน</button>
                                <div className="flex flex-wrap gap-2">
                                    <button type="button" onClick={() => typeof CERT.downloadCanvasAsPdf === 'function' && CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode)} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs">ดาวน์โหลด PDF</button>
                                    <button type="button" onClick={() => typeof CERT.downloadCanvasAsPng === 'function' && CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode)} className="spatial-soft px-4 py-2 rounded-full font-display font-bold text-xs text-primary-adaptive">บันทึกภาพ PNG</button>
                                    <button type="button" onClick={() => { setShowCneuLetter(true); setTimeout(() => typeof CERT.printIndividualCneuLetter === 'function' && CERT.printIndividualCneuLetter(), 180); }} className="spatial-soft px-4 py-2 rounded-full font-display font-bold text-xs text-accent-adaptive">พิมพ์หนังสือรับรอง CNEU</button>
                                </div>
                            </div>

                            <div className="spatial-card rounded-[2rem] p-3 sm:p-5">
                                <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-2xl">
                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                </div>
                            </div>

                            <div className="spatial-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-2 text-xs">
                                <span>รหัสประกาศนียบัตร: <b className="font-mono text-prism-adaptive">{user.certificateCode || 'RJC-2027-DEMO01'}</b> • หน่วยคะแนน CNEU: <b className="text-accent-adaptive">{cneuConfig.cneuCredits}</b></span>
                                <a href={`./verify.html?code=${encodeURIComponent(user.certificateCode || 'RJC-2027-DEMO01')}`} target="_blank" rel="noreferrer" className="font-bold text-accent-adaptive underline">เปิดหน้าตรวจสอบ QR 3 มิติ →</a>
                            </div>

                            {showCneuLetter && (
                                <div id="cneu-letter-print-area" className="bg-white text-slate-900 rounded-2xl p-8 space-y-4 text-sm border border-slate-300">
                                    <h2 className="font-display font-extrabold text-xl text-center">หนังสือรับรองการผ่านการอบรมและหน่วยคะแนน CNEU</h2>
                                    <p className="text-center font-semibold">{cneuConfig.orgName}</p>
                                    <p className="leading-relaxed">
                                        ขอรับรองว่า <b>{user.name}</b> เลขที่ใบอนุญาตประกอบวิชาชีพ <b>{user.license}</b> สังกัด <b>{user.hospital}</b> ได้ผ่านการอบรมหลักสูตร <b>{cneuConfig.courseName}</b> รหัสกิจกรรม <b>{cneuConfig.activityCode}</b> จำนวน <b>{cneuConfig.cneuCredits} หน่วยคะแนน</b> ผ่านเกณฑ์เวลาเรียนสะสม, AI Skill Lab 3 มิติ และแบบทดสอบหลังเรียน ({user.posttest}) ณ วันที่ {formatThaiDateSafe(user.certificateIssuedAt)}
                                    </p>
                                    <div className="pt-8 text-right">
                                        <p className="font-bold">({cneuConfig.approverName})</p>
                                        <p className="text-xs text-slate-600">{cneuConfig.approverPosition}</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('app-root'));
        root.render(<AppErrorBoundary><LearnerApp /></AppErrorBoundary>);
    </script>
</body>
</html>
