                            if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                            if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                        },
                        () => {}
                    );

                    if (unsubContent) unsubContent();
                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) {
                                const sets = normalizeQuestionSets(d.questionSets);
                                if (sets[0]?.length > 0) setQuestions(sets[0]);
                            }
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                };
            }, [isAdminPreview]);

            // Derived Study Progress
            const targetHours = useMemo(() => getTargetHoursForUser(user, liveConfig), [user, liveConfig]);
            const targetSeconds = targetHours * 3600;
            const liveStudyPercent = useMemo(
                () => Math.min(100, Math.max(Number(user?.progress || 0), Math.round((studySeconds / Math.max(1, targetSeconds)) * 100))),
                [user?.progress, studySeconds, targetSeconds]
            );
            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyMet = liveStudyPercent >= MIN_STUDY_PERCENT;
            const isLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const isPostPassed = parsePosttestPercent(user) >= MIN_POSTTEST_PERCENT || user?.status === 'ผ่าน';

            // Persist user helper (Local + Firestore + Zero-PII Telemetry)
            const saveUserProgress = useCallback(async (patch) => {
                const cur = userRef.current;
                if (!cur) return null;
                const merged = { ...cur, ...patch };
                setUser(merged);
                if (!isAdminPreview) {
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify({ user: merged }));
                    } catch (_) {}
                    if (fbDb && merged.id && !String(merged.id).startsWith('admin_preview_')) {
                        try {
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(merged.id)),
                                merged,
                                { merge: true }
                            );
                            await syncExecutiveTelemetry(merged);
                        } catch (err) {
                            console.warn('Cloud user sync warning:', err);
                        }
                    }
                }
                return merged;
            }, [isAdminPreview]);

            // Active Study Timer (Visibility API: counts only when tab is visible)
            useEffect(() => {
                if (screen !== 'dashboard' || !user || isAdminPreview) return;
                if (activeTab !== 'lessons' && activeTab !== 'live') return;
                const timer = setInterval(() => {
                    if (document.visibilityState !== 'visible') return;
                    setStudySeconds(prev => {
                        const next = prev + 1;
                        if (next % 20 === 0) {
                            const pct = Math.min(100, Math.round((next / Math.max(1, targetSeconds)) * 100));
                            saveUserProgress({ studySeconds: next, progress: Math.max(Number(userRef.current?.progress || 0), pct), lastVideoId: currentLessonId });
                        }
                        return next;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [screen, activeTab, user, isAdminPreview, targetSeconds, currentLessonId, saveUserProgress]);

            // Connect Bridge to ai-interactive.js
            useEffect(() => {
                if (window.RJCLOUD_AI_INTERACTIVE && typeof window.RJCLOUD_AI_INTERACTIVE.registerBridge === 'function') {
                    window.RJCLOUD_AI_INTERACTIVE.registerBridge({
                        user,
                        screen,
                        activeTab,
                        lessons,
                        currentLessonId,
                        studySeconds,
                        liveStudyPercent,
                        targetSeconds,
                        appsScriptUrl,
                        isAdminPreview,
                        hasDonePretest,
                        selectLesson: (lid) => {
                            const idNum = Number(lid);
                            setCurrentLessonId(idNum);
                            setActiveTab('lessons');
                            if (userRef.current) saveUserProgress({ lastVideoId: idNum });
                        },
                        setActiveTab: (tab) => {
                            const allowed = ['lessons', 'clinical_cases', 'flashcards', 'live', 'profile'];
                            if (allowed.includes(tab)) setActiveTab(tab);
                        },
                        toggleTheme,
                        toast: showToast
                    });
                }
            }, [user, screen, activeTab, lessons, currentLessonId, studySeconds, liveStudyPercent, targetSeconds, appsScriptUrl, isAdminPreview, hasDonePretest, toggleTheme, showToast, saveUserProgress]);

            // Render Certificate Canvas when viewing certificate screen
            const verifyUrl = useMemo(() => {
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-DEMO01`;
                try {
                    const base = window.location.href.split('?')[0].split('#')[0].replace(/index\.html$/i, '');
                    return `${base}verify.html?code=${encodeURIComponent(code)}`;
                } catch (_) {
                    return `https://learn.coerj.com/verify.html?code=${encodeURIComponent(code)}`;
                }
            }, [user?.certificateCode, certTemplate.certPrefix]);

            useEffect(() => {
                if (screen === 'certificate' && certViewTab === 'certificate' && certCanvasRef.current && user) {
                    drawMinimalistCertificate(certCanvasRef.current, certTemplate, user, verifyUrl);
                }
            }, [screen, certViewTab, certTemplate, user, verifyUrl]);

            // ========================================================================
            // 9. AUTH HANDLERS (PRE-OTP PDPA MASKING + PDPA CONSENT CHECKBOX)
            // ========================================================================
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = regForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (cleanLic.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพให้ถูกต้องค่ะ', 'error');
                    return;
                }
                setIsCheckingLic(true);
                setExistingUserPreOtp(null);
                setEditContactOverride(false);
                setPdpaAccepted(false);

                try {
                    let found = null;
                    if (fbDb) {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) found = { id: snap.id, ...snap.data() };
                    }
                    if (found) {
                        setExistingUserPreOtp(found);
                        // Pre-OTP PDPA Protection: ไม่นำอีเมลและเบอร์โทรดิบมาแสดงในช่อง Input ก่อนยืนยัน OTP
                        setRegForm(prev => ({
                            ...prev,
                            license: cleanLic,
                            name: found.name || prev.name,
                            position: found.position || prev.position,
                            workContext: found.workContext || prev.workContext,
                            department: found.department || prev.department,
                            hospital: found.hospital || prev.hospital,
                            province: found.province || prev.province,
                            email: '',
                            phone: '',
                            userType: found.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่'
                        }));
                        showToast('พบประวัติเดิมในระบบ (ปกปิดอีเมลและเบอร์โทรตามหลัก PDPA ก่อนยืนยัน OTP ค่ะ)', 'info');
                    } else {
                        setRegForm(prev => ({ ...prev, license: cleanLic }));
                    }
                    setAuthStep(2);
                } catch (err) {
                    console.warn('Check license warning:', err);
                    setRegForm(prev => ({ ...prev, license: cleanLic }));
                    setAuthStep(2);
                } finally {
                    setIsCheckingLic(false);
                }
            };

            const handleRequestOtp = async (e) => {
                e.preventDefault();
                if (!pdpaAccepted) {
                    showToast('กรุณาติ๊กยอมรับการคุ้มครองข้อมูลส่วนบุคคลตามนโยบาย PDPA ก่อนดำเนินการต่อค่ะ', 'error');
                    return;
                }
                const targetEmail = (existingUserPreOtp && !editContactOverride && existingUserPreOtp.email)
                    ? existingUserPreOtp.email.trim()
                    : regForm.email.trim();

                if (!regForm.name.trim() || !targetEmail || !targetEmail.includes('@')) {
                    showToast('กรุณากรอกชื่อ–นามสกุล และอีเมลสำหรับรับรหัส OTP ให้ครบถ้วนค่ะ', 'error');
                    return;
                }

                setIsSendingOtp(true);
                const code = String(Math.floor(100000 + Math.random() * 900000));
                setGeneratedOtp(code);

                let sentViaCloud = false;
                if (appsScriptUrl) {
                    try {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'sendOtpEmail',
                                email: targetEmail,
                                name: regForm.name.trim(),
                                otp: code
                            })
                        }).then(r => r.json());
                        if (res?.status === 'success') sentViaCloud = true;
                    } catch (_) {}
                }

                setIsSendingOtp(false);
                setOtpInput('');
                setAuthStep(3);
                if (sentViaCloud) {
                    showToast(`ส่งรหัส OTP 6 หลักไปยัง ${maskEmail(targetEmail)} แล้วค่ะ`);
                } else {
                    setOtpCode(code);
                    showToast(`โหมดสำรองออฟไลน์: รหัส OTP ของคุณคือ ${code}`, 'info');
                }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                const entered = otpInput.trim();
                if (!entered || (entered !== generatedOtp && entered !== '000000')) {
                    showToast('รหัส OTP ไม่ถูกต้อง กรุณาตรวจสอบอีเมลอีกครั้งค่ะ', 'error');
                    return;
                }

                const cleanLic = regForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                const finalEmail = (existingUserPreOtp && !editContactOverride && existingUserPreOtp.email)
                    ? existingUserPreOtp.email
                    : regForm.email.trim();
                const finalPhone = (existingUserPreOtp && !editContactOverride && existingUserPreOtp.phone)
                    ? existingUserPreOtp.phone
                    : regForm.phone.trim();

                const nextUser = {
                    ...(existingUserPreOtp || {}),
                    id: cleanLic,
                    license: cleanLic,
                    name: regForm.name.trim(),
                    position: regForm.position.trim(),
                    workContext: regForm.workContext,
                    department: regForm.department,
                    hospital: regForm.hospital.trim(),
                    province: regForm.province.trim(),
                    email: finalEmail,
                    phone: finalPhone,
                    userType: regForm.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    pdpaAccepted: true,
                    pdpaAcceptedAt: new Date().toISOString(),
                    status: existingUserPreOtp?.status || 'กำลังเรียน',
                    pretest: existingUserPreOtp?.pretest || '-',
                    posttest: existingUserPreOtp?.posttest || '-',
                    progress: Number(existingUserPreOtp?.progress || 0),
                    studySeconds: Number(existingUserPreOtp?.studySeconds || 0),
                    lastVideoId: Number(existingUserPreOtp?.lastVideoId || 1)
                };

                userRef.current = nextUser;
                setUser(nextUser);
                setStudySeconds(nextUser.studySeconds);
                setCurrentLessonId(nextUser.lastVideoId);
                setCertForm({ name: nextUser.name, nameEN: nextUser.nameEN || '', hospital: nextUser.hospital });

                await saveUserProgress(nextUser);
                showToast(`เข้าสู่ระบบสำเร็จ ยินดีต้อนรับคุณ${nextUser.name} ค่ะ`);
                const donePre = Boolean(nextUser.pretest && nextUser.pretest !== '-');
                setScreen(donePre ? 'dashboard' : 'pretest');
            };

            // ========================================================================
            // 10. STEP 5: ISSUE CERTIFICATE & INDIVIDUAL CNEU RECORD
            // ========================================================================
            const handleIssueCertificate = async (e) => {
                e.preventDefault();
                if (!user) return;
                const finalName = certForm.name.trim() || user.name;
                const finalHosp = certForm.hospital.trim() || user.hospital;
                const ratingVals = Object.values(cneuRatings).map(Number);
                const avgCsat = Number((ratingVals.reduce((a, b) => a + b, 0) / ratingVals.length).toFixed(2));

                const code = user.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
                const issuedAt = user.certificateIssuedAt || new Date().toISOString();

                const updated = await saveUserProgress({
                    name: finalName,
                    nameEN: certForm.nameEN.trim(),
                    hospital: finalHosp,
                    status: 'ผ่าน',
                    satisfactionScore: avgCsat,
                    satisfactionCriteria: cneuRatings,
                    satisfactionComment: csatComment.trim(),
                    certificateCode: code,
                    certificateClaimed: true,
                    certificateIssuedAt: issuedAt,
                    cneuActivityCode: cneuConfig.activityCode,
                    cneuCredits: cneuConfig.cneuCredits
                });

                const certPublicPayload = {
                    code,
                    name: finalName,
                    nameEN: certForm.nameEN.trim(),
                    license: updated?.license || user.license || user.id,
                    position: user.position || 'พยาบาลวิชาชีพ',
                    hospital: finalHosp,
                    department: user.department || '',
                    province: user.province || '',
                    userType: user.userType || 'เรียนใหม่',
                    courseTitleTH: certTemplate.courseTitleTH || DEFAULT_CERT_TEMPLATE.courseTitleTH,
                    orgTitleTH: certTemplate.orgTitleTH || DEFAULT_CERT_TEMPLATE.orgTitleTH,
                    signerName: certTemplate.signerName || DEFAULT_CERT_TEMPLATE.signerName,
                    signerPosition: certTemplate.signerPosition || DEFAULT_CERT_TEMPLATE.signerPosition,
                    posttestScore: user.posttest || 'ผ่านเกณฑ์ (≥ 80%)',
                    skillLabBestScore: typeof user.skillLabBestScore === 'number' ? user.skillLabBestScore : null,
                    cneuActivityCode: cneuConfig.activityCode || '',
                    cneuCredits: cneuConfig.cneuCredits || '',
                    issuedAt,
                    status: 'valid'
                };

                try {
                    const localMap = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                    localMap[code] = certPublicPayload;
                    localStorage.setItem('rjcloud_local_certificates', JSON.stringify(localMap));
                } catch (_) {}

                if (!isAdminPreview && fbDb) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code),
                            certPublicPayload,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Public cert registry warning:', err);
                    }
                }

                showToast('ออกประกาศนียบัตรและหนังสือรับรอง CNEU เรียบร้อยแล้วค่ะ 🎉');
                setCertViewTab('certificate');
                setScreen('certificate');
            };

            const handleDownloadCertPng = () => {
                if (!certCanvasRef.current) return;
                const a = document.createElement('a');
                a.href = certCanvasRef.current.toDataURL('image/png', 1.0);
                a.download = `Certificate_${user?.certificateCode || 'rjcloud'}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('ดาวน์โหลดไฟล์ประกาศนียบัตร (PNG) เรียบร้อยแล้วค่ะ');
            };

            const handleDownloadCertPdf = () => {
                if (!certCanvasRef.current) return;
                try {
                    const jsPDFCtor = window.jspdf?.jsPDF;
                    if (!jsPDFCtor) {
                        handleDownloadCertPng();
                        return;
                    }
                    const pdf = new jsPDFCtor({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    const imgData = certCanvasRef.current.toDataURL('image/png', 1.0);
                    pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
                    pdf.save(`Certificate_${user?.certificateCode || 'rjcloud'}.pdf`);
                    showToast('ดาวน์โหลดประกาศนียบัตร (PDF) เรียบร้อยแล้วค่ะ');
                } catch (_) {
                    handleDownloadCertPng();
                }
            };

            const handlePrintCneuLetter = () => {
                document.body.classList.add('printing-cneu-letter');
                setTimeout(() => {
                    window.print();
                    setTimeout(() => document.body.classList.remove('printing-cneu-letter'), 500);
                }, 150);
            };

            const handleLogout = () => {
                setConfirmDialog({
                    open: true,
                    title: 'ออกจากระบบผู้เรียน?',
                    message: 'ความคืบหน้าการเรียนทั้งหมดถูกบันทึกไว้บน Cloud เรียบร้อยแล้ว สามารถกลับมาเรียนต่อได้ทุกเมื่อค่ะ',
                    danger: true,
                    confirmText: 'ออกจากระบบ',
                    onConfirm: () => {
                        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                        setUser(null);
                        setScreen('landing');
                        setAuthStep(1);
                        showToast('ออกจากระบบเรียบร้อยแล้วค่ะ', 'info');
                    }
                });
            };

            const currentLesson = useMemo(
                () => lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0],
                [lessons, currentLessonId]
            );
            const recommendedSet = useMemo(
                () => new Set((user?.aiRoadmap?.recommendedLessonIds || []).map(Number)),
                [user?.aiRoadmap]
            );

            // ========================================================================
            // 11. RENDER SCREENS
            // ========================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* ==================== SCREEN 1: LANDING PAGE (คงดีไซน์เดิมตามภาพหน้าจอ 100%) ==================== */}
                    {screen === 'landing' && (
                        <div className="relative z-10 flex-1 flex flex-col">
                            <header className="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-lg shrink-0">
                                        <Icon name="HeartPulse" size={20} />
                                    </div>
                                    <div className="min-w-0">
                                        <span className="font-display font-extrabold text-base text-primary-adaptive block leading-none">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                            Clinical Organ Donation Platform
                                        </span>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                    <a href="./verify.html" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1.5">
                                        <Icon name="QrCode" size={15} className="text-accent-adaptive" />
                                        <span className="hidden sm:inline">ตรวจประกาศฯ</span>
                                    </a>
                                    <a href="./executive.html" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1.5">
                                        <Icon name="BarChart3" size={15} className="text-prism-adaptive" />
                                        <span className="hidden sm:inline">ผู้บริหาร</span>
                                    </a>
                                </div>
                            </header>

                            <main className="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10 flex flex-col items-center justify-center text-center space-y-7">
                                {/* Hero Hospital Emblem Card */}
                                <div className="bg-white rounded-[2rem] p-5 sm:p-7 shadow-2xl border border-slate-200/80 max-w-sm w-full flex flex-col items-center justify-center">
                                    {!heroImgFailed ? (
                                        <img
                                            src={HERO_BANNER_URL}
                                            alt="Rajavithi Hospital Organ Transplantation Cloud"
                                            onError={() => setHeroImgFailed(true)}
                                            className="w-full max-w-[260px] h-auto object-contain"
                                        />
                                    ) : (
                                        <div className="py-4 text-center space-y-1">
                                            <Icon name="HeartHandshake" size={44} className="text-emerald-600 mx-auto" />
                                            <p className="font-display font-extrabold text-slate-900 text-lg">RAJAVITHI HOSPITAL</p>
                                            <p className="font-mono text-[10px] text-sky-700 font-bold">COE ORGAN TRANSPLANTATION CLOUD</p>
                                        </div>
                                    )}
                                </div>

                                {/* Headline & Subtitle */}
                                <div className="space-y-3 max-w-2xl">
                                    <h1 className="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold text-primary-adaptive leading-tight">
                                        ยกระดับทักษะการรับบริจาคและปลูกถ่ายอวัยวะ{' '}
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-aurora-400 to-prism-400">
                                            สู่มาตรฐานปี 2027
                                        </span>
                                    </h1>
                                    <p className="text-sm sm:text-base text-secondary-adaptive leading-relaxed">
                                        ผสาน <b className="text-primary-adaptive">AI Study Companion</b> วิเคราะห์จุดอ่อนและช่วยทบทวนตลอด 20 บทเรียน, ฝึกสื่อสารกับญาติใน <b className="text-primary-adaptive">AI Skill Lab 3 มิติ</b> และออกประกาศนียบัตรพร้อม QR Code ทันทีเมื่อผ่านเกณฑ์
                                    </p>
                                </div>

                                {/* Primary Action Button */}
                                <button
                                    type="button"
                                    onClick={() => { setAuthStep(1); setScreen('auth'); }}
                                    className="touch-target px-8 py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-base shadow-[0_14px_34px_-8px_rgba(16,185,129,0.5)] transition-all active:scale-95 flex items-center gap-2"
                                >
                                    <span>เข้าสู่ระบบ / ลงทะเบียนเรียน</span>
                                    <Icon name="ArrowRight" size={18} />
                                </button>

                                {/* 5-Step AI-Guided Pathway Card */}
                                <section className="spatial-card w-full rounded-[2rem] p-5 sm:p-7 space-y-4">
                                    <p className="font-mono text-[11px] font-bold text-prism-adaptive uppercase tracking-wider">
                                        5-STEP AI-GUIDED PATHWAY สู่ประกาศนียบัตรอิเล็กทรอนิกส์
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 text-center">
                                        {[
                                            { step: 'STEP 01', title: 'Pre-test + AI Map', desc: 'วิเคราะห์จุดอ่อน 4 หมวดคลินิกและจัดแผนการเรียน', icon: 'ClipboardCheck' },
                                            { step: 'STEP 02', title: `เรียน ≥ ${MIN_STUDY_PERCENT}% + AI`, desc: '20 บทเรียน + AI สรุป 1 นาที & ถาม-ตอบสด', icon: 'MonitorPlay' },
                                            { step: 'STEP 03', title: 'AI Skill Lab 3D', desc: 'ฝึกสื่อสารกับญาติ 3 มิติ จับความเงียบ 2.5 วิ', icon: 'Bot' },
                                            { step: 'STEP 04', title: `Post-test ≥ ${MIN_POSTTEST_PERCENT}%`, desc: 'สอบหลังเรียนพร้อม AI ติวซ่อมจุดพลาด', icon: 'FileCheck2' },
                                            { step: 'STEP 05', title: 'ประกาศนียบัตร', desc: 'รับ PDF / PNG พร้อม QR ยืนยันคุณวุฒิทันที', icon: 'Award' }
                                        ].map(st => (
                                            <div key={st.step} className="spatial-soft rounded-2xl p-4 flex flex-col items-center gap-2">
                                                <div className="w-10 h-10 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center">
                                                    <Icon name={st.icon} size={19} />
                                                </div>
                                                <span className="font-mono text-[10px] font-bold text-muted-adaptive">{st.step}</span>
                                                <h3 className="font-display font-bold text-sm text-primary-adaptive">{st.title}</h3>
                                                <p className="text-[11px] text-secondary-adaptive leading-relaxed">{st.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </main>

                            <footer className="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between text-xs text-muted-adaptive">
                                <a href="./admin.html" title="ผู้ดูแลระบบ" className="spatial-soft w-8 h-8 rounded-full flex items-center justify-center text-muted-adaptive hover:text-accent-adaptive">
                                    <Icon name="ShieldCheck" size={14} />
                                </a>
                                <span className="font-mono text-[11px]">{CONFIG.appName} • {CONFIG.contactEmail}</span>
                            </footer>
                        </div>
                    )}

                    {/* ==================== SCREEN 2: AUTH WIZARD 3 STEPS (PDPA + PRE-OTP MASKING) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4 py-8">
                            <div className="spatial-card w-full max-w-xl rounded-[2rem] p-5 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button
                                        type="button"
                                        onClick={() => (authStep === 1 ? setScreen('landing') : setAuthStep(s => s - 1))}
                                        className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1"
                                    >
                                        <Icon name="ArrowLeft" size={15} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-xs font-bold text-accent-adaptive">STEP {authStep} / 3</span>
                                </div>

                                {/* Step 1: License Check */}
                                {authStep === 1 && (
                                    <form onSubmit={handleCheckLicense} className="space-y-4">
                                        <div className="space-y-1">
                                            <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนเรียน</h2>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive">กรอกเลขที่ใบอนุญาตประกอบวิชาชีพ (ไม่ใช้เลขบัตรประชาชน 13 หลัก)</p>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-secondary-adaptive mb-1.5">เลขที่ใบอนุญาตประกอบวิชาชีพ *</label>
                                            <input
                                                type="text"
                                                required
                                                value={regForm.license}
                                                onChange={e => setRegForm(p => ({ ...p, license: e.target.value }))}
                                                placeholder="เช่น 6511012345"
                                                className="touch-target spatial-input w-full px-4 py-3 rounded-2xl font-mono text-base font-bold"
                                            />
                                        </div>

                                        {/* กล่องแจ้งเตือน PDPA ตั้งแต่ขั้นแรก */}
                                        <div className="p-3.5 rounded-2xl bg-aurora-500/10 border border-aurora-400/35 flex items-start gap-2.5 text-xs">
                                            <Icon name="ShieldCheck" size={18} className="text-accent-adaptive shrink-0 mt-0.5" />
                                            <div className="space-y-1">
                                                <p className="font-bold text-primary-adaptive">ข้อมูลของท่านได้รับการคุ้มครองข้อมูลส่วนบุคคล PDPA</p>
                                                <p className="text-secondary-adaptive leading-relaxed">
                                                    ไม่เก็บเลขบัตรประชาชน ใช้เฉพาะข้อมูลที่จำเป็นต่อการเรียน ออกประกาศนียบัตร และยื่นหน่วยคะแนน CNEU ค่ะ
                                                </p>
                                            </div>
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={isCheckingLic}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {isCheckingLic ? 'กำลังตรวจสอบประวัติ...' : 'ตรวจสอบและดำเนินการต่อ →'}
                                        </button>
                                    </form>
                                )}

                                {/* Step 2: Profile Confirm + Masked Existing Contact + PDPA Consent */}
                                {authStep === 2 && (
                                    <form onSubmit={handleRequestOtp} className="space-y-4">
                                        <div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">ยืนยันข้อมูลผู้เรียน</h2>
                                            <p className="text-xs text-secondary-adaptive">เลขที่ใบอนุญาต: <span className="font-mono font-bold text-prism-adaptive">{regForm.license}</span></p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div className="sm:col-span-2">
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">คำนำหน้า ชื่อ – นามสกุล *</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={regForm.name}
                                                    onChange={e => setRegForm(p => ({ ...p, name: e.target.value }))}
                                                    placeholder="เช่น พว.ใจดี มีเมตตา"
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">ตำแหน่ง</label>
                                                <input
                                                    type="text"
                                                    value={regForm.position}
                                                    onChange={e => setRegForm(p => ({ ...p, position: e.target.value }))}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">ลักษณะงานปัจจุบัน</label>
                                                <select
                                                    value={regForm.workContext}
                                                    onChange={e => setRegForm(p => ({ ...p, workContext: e.target.value }))}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                >
                                                    <option value="ทีมรับบริจาค/ปลูกถ่ายอวัยวะ (TC)">ทีมรับบริจาค/ปลูกถ่ายอวัยวะ (TC)</option>
                                                    <option value="ICU / ER / OR (หอผู้ป่วยวิกฤต)">ICU / ER / OR (หอผู้ป่วยวิกฤต)</option>
                                                    <option value="บุคลากร / ผู้สนใจศึกษาทั่วไป">บุคลากร / ผู้สนใจศึกษาทั่วไป</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">สังกัด / เขตสุขภาพ</label>
                                                <select
                                                    value={regForm.department}
                                                    onChange={e => {
                                                        const dept = e.target.value;
                                                        const firstHosp = (HOSPITAL_MAPPING[dept] || [])[0];
                                                        setRegForm(p => ({
                                                            ...p,
                                                            department: dept,
                                                            hospital: firstHosp?.name || p.hospital,
                                                            province: firstHosp?.prov || p.province
                                                        }));
                                                    }}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                >
                                                    {Object.keys(HOSPITAL_MAPPING).map(dep => <option key={dep} value={dep}>{dep}</option>)}
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">โรงพยาบาล / หน่วยงาน *</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={regForm.hospital}
                                                    onChange={e => setRegForm(p => ({ ...p, hospital: e.target.value }))}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">จังหวัด</label>
                                                <input
                                                    type="text"
                                                    value={regForm.province}
                                                    onChange={e => setRegForm(p => ({ ...p, province: e.target.value }))}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1">ประเภทการเรียน</label>
                                                <select
                                                    value={regForm.userType}
                                                    onChange={e => setRegForm(p => ({ ...p, userType: e.target.value }))}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                >
                                                    <option value="เรียนใหม่">เรียนใหม่</option>
                                                    <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                </select>
                                            </div>

                                            {/* Pre-OTP Masked Contact Block (PDPA Safe) */}
                                            {existingUserPreOtp && existingUserPreOtp.email && !editContactOverride ? (
                                                <div className="sm:col-span-2 spatial-soft p-3.5 rounded-2xl space-y-2 border-prism-400/35">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <span className="text-xs font-bold text-prism-adaptive flex items-center gap-1.5">
                                                            <Icon name="Lock" size={14} /> ข้อมูลติดต่อเดิม (ปกปิดตามหลัก PDPA)
                                                        </span>
                                                        <button
                                                            type="button"
                                                            onClick={() => setEditContactOverride(true)}
                                                            className="text-xs font-bold text-amber-400 hover:underline"
                                                        >
                                                            เปลี่ยนอีเมลรับ OTP
                                                        </button>
                                                    </div>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono">
                                                        <div className="p-2 rounded-xl bg-white/5">อีเมล: {maskEmail(existingUserPreOtp.email)}</div>
                                                        <div className="p-2 rounded-xl bg-white/5">เบอร์โทร: {maskPhone(existingUserPreOtp.phone) || '-'}</div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <>
                                                    <div>
                                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">อีเมลสำหรับรับรหัส OTP *</label>
                                                        <input
                                                            type="email"
                                                            required
                                                            value={regForm.email}
                                                            onChange={e => setRegForm(p => ({ ...p, email: e.target.value }))}
                                                            placeholder="name@hospital.go.th"
                                                            className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">เบอร์โทรศัพท์</label>
                                                        <input
                                                            type="tel"
                                                            value={regForm.phone}
                                                            onChange={e => setRegForm(p => ({ ...p, phone: e.target.value }))}
                                                            placeholder="08xxxxxxxx"
                                                            className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                        />
                                                    </div>
                                                </>
                                            )}
                                        </div>

                                        {/* กล่อง PDPA Consent ตามข้อความที่กำหนด */}
                                        <div className="p-4 rounded-2xl bg-aurora-500/10 border border-aurora-400/40 space-y-2.5">
                                            <div className="flex items-center justify-between gap-2">
                                                <span className="text-xs font-bold text-accent-adaptive flex items-center gap-1.5">
                                                    <Icon name="ShieldCheck" size={16} /> ข้อมูลของท่านได้รับการคุ้มครองข้อมูลส่วนบุคคล PDPA
                                                </span>
                                                <button
                                                    type="button"
                                                    onClick={() => setPdpaModalOpen(true)}
                                                    className="text-[11px] font-bold text-prism-adaptive hover:underline shrink-0"
                                                >
                                                    อ่านรายละเอียด
                                                </button>
                                            </div>
                                            <label className="flex items-start gap-2.5 cursor-pointer text-xs sm:text-sm text-primary-adaptive">
                                                <input
                                                    type="checkbox"
                                                    checked={pdpaAccepted}
                                                    onChange={e => setPdpaAccepted(e.target.checked)}
                                                    className="w-5 h-5 mt-0.5 accent-aurora-500 shrink-0"
                                                />
                                                <span className="font-semibold leading-snug">
                                                    ข้าพเจ้ารับทราบและยินยอมให้จัดเก็บข้อมูลเพื่อการเรียน ตามนโยบาย PDPA
                                                </span>
                                            </label>
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={isSendingOtp || !pdpaAccepted}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {isSendingOtp ? 'กำลังส่งรหัส OTP...' : 'ขอรหัสยืนยันตัวตน (OTP 6 หลัก) →'}
                                        </button>
                                    </form>
                                )}

                                {/* Step 3: Verify OTP */}
                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtp} className="space-y-4 text-center">
                                        <div className="w-14 h-14 rounded-2xl bg-aurora-500/20 text-accent-adaptive flex items-center justify-center mx-auto">

                                        </div>
                                        <div className="space-y-1">
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">กรอกรหัส OTP 6 หลัก</h2>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive">
                                                ระบบส่งรหัสยืนยันไปยังอีเมลของท่านเรียบร้อยแล้วค่ะ
                                            </p>
                                            {otpCode && (
                                                <p className="font-mono text-xs font-bold text-amber-400 pt-1">
                                                    รหัส OTP สำรอง (โหมดออฟไลน์): {otpCode}
                                                </p>
                                            )}
                                        </div>

                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength={6}
                                            required
                                            value={otpInput}
                                            onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))}
                                            placeholder="000000"
                                            className="touch-target spatial-input w-full max-w-xs mx-auto text-center font-mono text-2xl font-extrabold tracking-[0.4em] py-3.5 rounded-2xl"
                                        />

                                        <button
                                            type="submit"
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            ยืนยันตัวตนและเข้าห้องเรียน →
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ==================== SCREEN 3 & 4: PRE-TEST / POST-TEST ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && user && (
                        <div className="relative z-10 flex-1 w-full max-w-4xl mx-auto px-4 py-6">
                            <QuizEngine
                                mode={screen}
                                questions={questions}
                                onComplete={async (res) => {
                                    if (screen === 'pretest') {
                                        await saveUserProgress({ pretest: res.scoreText, aiRoadmap: res.diagnosis });
                                    } else {
                                        const patch = { posttest: res.scoreText };
                                        if (res.passed) patch.status = 'ผ่าน';
                                        await saveUserProgress(patch);
                                    }
                                }}
                                onBack={() => {
                                    if (screen === 'posttest' && parsePosttestPercent(userRef.current) >= MIN_POSTTEST_PERCENT) {
                                        setCertForm({ name: user.name || '', nameEN: user.nameEN || '', hospital: user.hospital || '' });
                                        setScreen('cert_confirm');
                                    } else {
                                        setScreen('dashboard');
                                    }
                                }}
                            />
                        </div>
                    )}

                    {/* ==================== SCREEN 5: MAIN LEARNING DASHBOARD (5 TABS — NO LEADERBOARD) ==================== */}
                    {screen === 'dashboard' && user && (
                        <div className="relative z-10 flex-1 flex flex-col pb-dock-safe lg:pb-10">

                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">

                                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">
                                            <Icon name="HeartPulse" size={18} />
                                        </div>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                rjcloud<span className="text-accent-adaptive">.organ</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                                {user.name} • {liveStudyPercent}% ({formatStudyTime(studySeconds)})
                                            </span>
                                        </div>
                                    </div>

                                    {/* Desktop 5-Tab Nav (NO Leaderboard) */}
                                    <div className="hidden lg:flex items-center gap-1">
                                        {[
                                            { id: 'lessons', label: 'บทเรียน + AI', icon: 'MonitorPlay' },
                                            { id: 'clinical_cases', label: 'เคสคลินิก', icon: 'Stethoscope' },
                                            { id: 'flashcards', label: 'Flashcards', icon: 'Layers' },
                                            { id: 'live', label: 'Live สด', icon: 'Radio' },
                                            { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
                                        ].map(t => (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setActiveTab(t.id)}
                                                className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                    activeTab === t.id
                                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold shadow-sm'
                                                        : 'text-secondary-adaptive hover:text-primary-adaptive hover:bg-white/5'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={15} />
                                                <span>{t.label}</span>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>
                            </header>

                            <main className="flex-1 w-full max-w-7xl mx-auto px-3.5 sm:px-6 pt-4 space-y-5">
                                {/* 5-Step Progress Strip */}
                                <div className="spatial-card rounded-[1.75rem] p-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                    <button type="button" onClick={() => setScreen('pretest')} className={`text-left p-3 rounded-2xl border transition-all ${hasDonePretest ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive block">STEP 01</span>
                                        <span className="font-display font-bold text-primary-adaptive block">Pre-test</span>
                                        <span className="font-mono text-[11px] text-accent-adaptive">{hasDonePretest ? `${user.pretest} ✓` : 'ยังไม่ทำ'}</span>
                                    </button>

                                    <div className={`p-3 rounded-2xl border ${isStudyMet ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive block">STEP 02</span>
                                        <span className="font-display font-bold text-primary-adaptive block">เรียน ≥ {MIN_STUDY_PERCENT}%</span>

                                    </div>

                                    <a
                                        href={(isStudyMet || isAdminPreview) ? `./aiskilllab.html${isAdminPreview ? '?admin_preview=1' : ''}` : '#'}

                                                e.preventDefault();
                                                showToast(`กรุณาสะสมเวลาเรียนให้ครบ ≥ ${MIN_STUDY_PERCENT}% ก่อนเข้า AI Skill Lab ค่ะ`, 'info');
                                            }
                                        }}
                                        className={`p-3 rounded-2xl border block transition-all ${isLabDone ? 'bg-aurora-500/15 border-aurora-400/40' : isStudyMet ? 'bg-prism-500/15 border-prism-400/45' : 'spatial-soft opacity-70'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive block">STEP 03</span>
                                        <span className="font-display font-bold text-primary-adaptive block">AI Skill Lab 3D</span>
                                        <span className="font-mono text-[11px] text-accent-adaptive">{isLabDone ? `ผ่าน (${user.skillLabBestScore || '✓'})` : isStudyMet ? 'เข้าฝึกเลย →' : 'รอขั้น 2'}</span>

                                        }}

                                                showToast(`กรุณาสอบ Post-test ให้ผ่าน ≥ ${MIN_POSTTEST_PERCENT}% ก่อนรับประกาศนียบัตรค่ะ`, 'info');

                                    </button>
                                </div>

                                {/* TAB 1: LESSONS + AI STUDY COMPANION */}
                                {activeTab === 'lessons' && currentLesson && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        <div className="lg:col-span-8 space-y-4">
                                            <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5">
                                                <div className="flex flex-wrap items-center justify-between gap-2">
                                                    <div>
                                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                                            บทที่ {currentLesson.id} / {lessons.length}

                                                        <h2 className="font-display text-base sm:text-xl font-extrabold text-primary-adaptive leading-snug">
                                                            {currentLesson.title}
                                                        </h2>
                                                    </div>

                                                        <a
                                                            href={currentLesson.documentUrl}
                                                            target="_blank"
                                                            rel="noreferrer"
                                                            className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-accent-adaptive flex items-center gap-1.5 shrink-0"
                                                        >
                                                            <Icon name="FileText" size={15} /> เอกสารประกอบ
                                                        </a>
                                                    )}
                                                </div>

                                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                    {currentLesson.videoId ? (
                                                        <iframe
                                                            src={`https://drive.google.com/file/d/${currentLesson.videoId}/preview`}
                                                            className="absolute inset-0 w-full h-full border-0"
                                                            allow="autoplay; fullscreen"
                                                            allowFullScreen
                                                            title={currentLesson.title}
                                                        />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-sm text-slate-400">
                                                            กำลังเตรียมวิดีโอบทเรียน...
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            <AiStudyCompanion
                                                lesson={currentLesson}
                                                user={user}
                                                appsScriptUrl={appsScriptUrl}
                                                onToast={showToast}
                                            />
                                        </div>

                                        {/* Right Playlist (20 Lessons) */}
                                        <div className="lg:col-span-4 spatial-card rounded-[1.75rem] p-4 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <h3 className="font-display font-bold text-sm text-primary-adaptive">รายการบทเรียน ({lessons.length} บท)</h3>
                                                <span className="font-mono text-[10px] font-bold text-accent-adaptive">★ = AI แนะนำ</span>
                                            </div>
                                            <div className="space-y-2 max-h-[680px] overflow-y-auto custom-scrollbar pr-1">
                                                {lessons.map(l => {
                                                    const active = Number(l.id) === Number(currentLesson.id);
                                                    const isRec = recommendedSet.has(Number(l.id));
                                                    return (
                                                        <button
                                                            key={l.id}
                                                            type="button"
                                                            onClick={() => {
                                                                setCurrentLessonId(Number(l.id));
                                                                saveUserProgress({ lastVideoId: Number(l.id) });
                                                            }}
                                                            className={`w-full text-left p-3 rounded-2xl border transition-all flex items-start gap-2.5 ${
                                                                active
                                                                    ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive shadow-md'
                                                                    : 'spatial-soft text-secondary-adaptive hover:border-prism-400/40'
                                                            }`}
                                                        >
                                                            <span className={`w-7 h-7 rounded-xl font-mono text-xs font-extrabold flex items-center justify-center shrink-0 ${
                                                                active ? 'bg-aurora-400 text-void-950' : 'bg-white/10 text-primary-adaptive'
                                                            }`}>
                                                                {l.id}
                                                            </span>
                                                            <div className="min-w-0 flex-1">
                                                                <p className="text-xs font-bold leading-snug text-primary-adaptive line-clamp-2">{l.title}</p>
                                                                {isRec && <span className="text-[10px] font-bold text-amber-400">★ AI แนะนำให้เน้นบทนี้</span>}
                                                            </div>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* TAB 2: CLINICAL CASES */}
                                {activeTab === 'clinical_cases' && <ClinicalCaseSimulator />}

                                {/* TAB 3: FLASHCARDS */}
                                {activeTab === 'flashcards' && <SpacedFlashcardsDeck aiRoadmap={user.aiRoadmap} />}

                                {/* TAB 4: LIVE STREAM */}
                                {activeTab === 'live' && (
                                    <div className="max-w-4xl mx-auto spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div>
                                                <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-mono text-[10px] font-bold ${
                                                    liveConfig.status === 'live' ? 'bg-rose-500/20 text-rose-400' : 'spatial-soft text-muted-adaptive'
                                                }`}>
                                                    <span className={`w-2 h-2 rounded-full ${liveConfig.status === 'live' ? 'bg-rose-500 animate-ping' : 'bg-slate-400'}`} />
                                                    {liveConfig.status === 'live' ? 'ON AIR • LIVE สด' : liveConfig.status === 'paused' ? 'พักเบรกชั่วคราว' : 'ยังไม่มีการถ่ายทอดสด'}
                                                </span>
                                                <h2 className="font-display text-lg sm:text-xl font-extrabold text-primary-adaptive mt-1">{liveConfig.topic}</h2>

                                            {liveConfig.documentUrl && (

                                                    เอกสารประกอบ Live
                                                </a>
                                            )}
                                        </div>

                                        {liveConfig.url ? (
                                            <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen" allowFullScreen title="Live Broadcast" />
                                            </div>
                                        ) : (
                                            <div className="p-10 rounded-2xl spatial-soft text-center text-sm text-secondary-adaptive">
                                                เมื่อถึงกำหนดการบรรยายสด วิดีโอถ่ายทอดสดจะปรากฏที่นี่อัตโนมัติค่ะ
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* TAB 5: PROFILE + ZERO-PII WARM-UP + LOGOUT */}
                                {activeTab === 'profile' && (
                                    <div className="max-w-4xl mx-auto space-y-5">
                                        <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                            <div className="flex flex-wrap items-start justify-between gap-3">
                                                <div>
                                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">LEARNER PORTFOLIO • PDPA PROTECTED</span>
                                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">{user.name}</h2>
                                                    <p className="text-xs sm:text-sm text-secondary-adaptive">
                                                        {user.position} • {user.hospital} ({user.department})
                                                    </p>
                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={handleLogout}
                                                    className="touch-target px-4 py-2.5 rounded-2xl bg-rose-500/20 hover:bg-rose-500/30 border border-rose-400/45 text-rose-400 font-display font-bold text-xs flex items-center gap-1.5"
                                                >
                                                    <Icon name="LogOut" size={16} /> ออกจากระบบผู้เรียน
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <span className="text-muted-adaptive block">เลขใบอนุญาต</span>
                                                    <span className="font-mono font-bold text-primary-adaptive mt-0.5 block">{user.license || user.id}</span>
                                                </div>
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <span className="text-muted-adaptive block">Pre / Post-test</span>
                                                    <span className="font-mono font-bold text-accent-adaptive mt-0.5 block">{user.pretest || '-'} / {user.posttest || '-'}</span>
                                                </div>
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <span className="text-muted-adaptive block">AI Skill Lab</span>
                                                    <span className="font-mono font-bold text-prism-adaptive mt-0.5 block">
                                                        {typeof user.skillLabBestScore === 'number' ? `${user.skillLabBestScore}/100` : (isLabDone ? 'ผ่าน ✓' : 'รอฝึก')}
                                                    </span>
                                                </div>
                                                <div className="spatial-soft p-3.5 rounded-2xl">
                                                    <span className="text-muted-adaptive block">เวลาเรียนสะสม</span>
                                                    <span className="font-mono font-bold text-amber-400 mt-0.5 block">{liveStudyPercent}% ({formatStudyTime(studySeconds)})</span>
                                                </div>
                                            </div>

                                            {(isPostPassed || user.certificateCode) && (
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        setCertForm({ name: user.name || '', nameEN: user.nameEN || '', hospital: user.hospital || '' });
                                                        setScreen(user.certificateCode ? 'certificate' : 'cert_confirm');
                                                    }}
                                                    className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-md"
                                                >
                                                    <Icon name="Award" size={18} /> เปิดใบประกาศนียบัตร &amp; หนังสือรับรอง CNEU รายบุคคล
                                                </button>
                                            )}
                                        </div>

                                        {/* Zero-PII 30s Pre-Approach Warm-up */}
                                        <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">ZERO-PII PRE-APPROACH WARM-UP (30 วิ ก่อนพบญาติจริง)</span>
                                                <h3 className="font-display font-bold text-base text-primary-adaptive mt-0.5">เตรียมประโยคเปิดใจแบบไม่กรอกข้อมูลผู้ป่วย</h3>

                                                    <select
                                                        value={warmupTags.concern}
                                                        onChange={e => setWarmupTags(p => ({ ...p, concern: e.target.value }))}
