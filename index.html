                        {/* TAB 2: LIVE STREAM */}
                        {activeTab === 'live' && (
                            <SpatialCard className="p-4 sm:p-6 max-w-4xl mx-auto space-y-4">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div>
                                        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-mono font-bold ${
                                            liveConfig.status === 'live'
                                                ? 'bg-rose-500/20 text-rose-400'
                                                : liveConfig.status === 'paused'
                                                    ? 'bg-amber-500/20 text-amber-400'
                                                    : 'spatial-soft text-muted-adaptive'
                                        }`}>
                                            <span className={`w-2 h-2 rounded-full ${liveConfig.status === 'live' ? 'bg-rose-500 animate-ping' : 'bg-slate-400'}`} />
                                            {liveConfig.status === 'live' ? 'LIVE ON AIR' : liveConfig.status === 'paused' ? 'BREAK / PAUSED' : 'OFFLINE'}
                                        </span>
                                        <h2 className="font-display text-lg sm:text-2xl font-extrabold text-primary-adaptive mt-1.5">{liveConfig.topic}</h2>
                                    </div>
                                    {liveConfig.documentUrl && (
                                        <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="px-4 py-2 rounded-xl bg-prism-500/15 text-prism-adaptive font-bold text-xs flex items-center gap-1.5">
                                            <Icon name="FileText" size={15} /> เอกสารบรรยายสด
                                        </a>
                                    )}
                                </div>

                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10 flex items-center justify-center">
                                    {liveConfig.status === 'live' && liveConfig.url ? (
                                        <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen" allowFullScreen title="Live Broadcast" />
                                    ) : (
                                        <div className="text-center p-6 text-slate-400 space-y-2">
                                            <Icon name="Radio" size={38} className="mx-auto text-slate-600" />
                                            <p className="font-display font-bold text-white">ขณะนี้ยังไม่มีการถ่ายทอดสด</p>
                                            <p className="text-xs">ผู้เรียนสามารถเรียนวิดีโอบทเรียนย้อนหลังในแท็บ "บทเรียน" ได้ตลอด 24 ชั่วโมงค่ะ</p>
                                        </div>
                                    )}
                                </div>

                                <div className="spatial-soft flex flex-col sm:flex-row items-center justify-between gap-3 p-4 rounded-2xl">
                                    <div>
                                        <p className="font-bold text-sm text-primary-adaptive">ลงทะเบียนยืนยันเข้าฟังการบรรยายสด</p>
                                        <p className="text-xs text-muted-adaptive">กดยืนยันเพื่อบันทึกเวลาเรียนเข้าสู่ฐานข้อมูลอัตโนมัติ</p>
                                    </div>
                                    <button
                                        type="button"
                                        disabled={Boolean(user?.liveCheckedIn)}
                                        onClick={handleLiveCheckIn}
                                        className={`touch-target w-full sm:w-auto px-6 py-3 rounded-2xl font-display font-extrabold text-sm flex items-center justify-center gap-2 ${
                                            user?.liveCheckedIn
                                                ? 'bg-aurora-500/20 text-accent-adaptive'
                                                : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-md'
                                        }`}
                                    >
                                        <Icon name="CheckCircle2" size={18} />
                                        {user?.liveCheckedIn ? 'ยืนยันเข้าเรียนแล้ว' : 'ยืนยันเข้าเรียน Live สด'}
                                    </button>
                                </div>
                            </SpatialCard>
                        )}

                        {/* TAB 3: LEADERBOARD (PDPA-SAFE) */}
                        {activeTab === 'leaderboard' && (
                            <SpatialCard className="p-4 sm:p-6 max-w-3xl mx-auto space-y-4">
                                <div>
                                    <h2 className="font-display text-xl font-extrabold text-primary-adaptive flex items-center gap-2">
                                        <Icon name="Trophy" size={22} className="text-amber-400" /> กระดานจัดอันดับ AI Skill Lab 2030
                                    </h2>
                                    <p className="text-xs text-muted-adaptive">แสดงเฉพาะชื่อ หน่วยงาน และคะแนนดัชนี Empathy สูงสุด (คุ้มครองข้อมูล PDPA)</p>
                                </div>

                                <div className="space-y-2.5">
                                    {leaderboard.map((item, idx) => (
                                        <div key={item.id || idx} className="spatial-soft p-3.5 rounded-2xl flex items-center justify-between gap-3">
                                            <div className="flex items-center gap-3 min-w-0">
                                                <span className={`w-9 h-9 rounded-xl font-mono text-sm font-extrabold flex items-center justify-center shrink-0 ${
                                                    idx === 0 ? 'bg-amber-400 text-void-950' : idx === 1 ? 'bg-slate-300 text-void-950' : idx === 2 ? 'bg-orange-400 text-void-950' : 'bg-slate-500/20 text-muted-adaptive'
                                                }`}>
                                                    #{idx + 1}
                                                </span>
                                                <div className="min-w-0">
                                                    <p className="font-display font-bold text-sm text-primary-adaptive truncate">{item.name}</p>
                                                    <p className="text-xs text-muted-adaptive truncate">{item.hospital || 'เครือข่าย rjcloud.organ'}</p>
                                                </div>
                                            </div>
                                            <span className="font-mono text-lg font-extrabold text-accent-adaptive shrink-0">{item.score || 0}<span className="text-xs text-muted-adaptive">/100</span></span>
                                        </div>
                                    ))}
                                    {leaderboard.length === 0 && (
                                        <div className="p-8 text-center text-sm text-muted-adaptive">ยังไม่มีคะแนนในกระดานจัดอันดับ มาเป็นคนแรกที่ฝึกใน AI Skill Lab 2030 กันค่ะ!</div>
                                    )}
                                </div>
                            </SpatialCard>
                        )}

                        {/* TAB 4: PROFILE SUMMARY */}
                        {activeTab === 'profile' && (
                            <SpatialCard className="p-5 sm:p-7 max-w-2xl mx-auto space-y-5">
                                <div className="flex items-center gap-4 pb-4 border-b border-white/10">
                                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center font-display text-2xl font-extrabold shrink-0">
                                        {(user?.name || 'R').slice(0, 1)}
                                    </div>
                                    <div className="min-w-0">
                                        <h2 className="font-display text-xl font-extrabold text-primary-adaptive truncate">{user?.name}</h2>
                                        <p className="text-xs text-muted-adaptive truncate">{user?.position} • {user?.hospital}</p>
                                        <div className="flex flex-wrap gap-1.5 mt-1.5">
                                            <span className="px-2.5 py-0.5 rounded-full bg-aurora-500/15 text-accent-adaptive font-mono text-[11px] font-bold">
                                                ใบอนุญาต: {user?.license}
                                            </span>
                                            <span className="px-2.5 py-0.5 rounded-full bg-prism-500/15 text-prism-adaptive text-[11px] font-bold">
                                                {user?.userType}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div className="spatial-soft p-3.5 rounded-2xl">
                                        <p className="text-[11px] font-bold text-muted-adaptive">คะแนน Pre-test</p>
                                        <p className="font-mono text-xl font-extrabold text-primary-adaptive mt-0.5">{user?.pretest || '-'}</p>
                                    </div>
                                    <div className="spatial-soft p-3.5 rounded-2xl">
                                        <p className="text-[11px] font-bold text-muted-adaptive">คะแนน Post-test</p>
                                        <p className="font-mono text-xl font-extrabold text-accent-adaptive mt-0.5">
                                            {user?.posttest || '-'} {posttestInfo.total > 0 ? `(${posttestInfo.percent}%)` : ''}
                                        </p>
                                    </div>
                                    <div className="spatial-soft p-3.5 rounded-2xl">
                                        <p className="text-[11px] font-bold text-muted-adaptive">เวลาเรียนสะสม</p>
                                        <p className="font-mono text-lg font-extrabold text-primary-adaptive mt-0.5">{studyPercent}%</p>
                                    </div>
                                    <div className="spatial-soft p-3.5 rounded-2xl">
                                        <p className="text-[11px] font-bold text-muted-adaptive">AI Skill Lab 2030</p>
                                        <p className="font-display text-base font-extrabold text-violet-400 mt-0.5">
                                            {hasPassedSkillLab ? 'ผ่านแล้ว ✓' : 'ยังไม่ผ่าน'}
                                        </p>
                                    </div>
                                </div>

                                <div className="spatial-soft p-4 rounded-2xl flex items-center justify-between gap-3">
                                    <div>
                                        <p className="text-xs font-bold text-primary-adaptive">โหมดการแสดงผล (Theme Preference)</p>
                                        <p className="text-[11px] text-muted-adaptive">
                                            กำลังใช้งาน: {theme === 'dark' ? 'Spatial Dark 2030 (สบายตา)' : 'Frosted Pearl 2030 (โหมดสว่าง)'}
                                        </p>
                                    </div>
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                </div>

                                {canClaimCertificate && (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (user?.certificateClaimed) setScreen('certificate');
                                            else { setCertFormName(user?.name || ''); setCertFormHosp(user?.hospital || ''); setScreen('cert_confirm'); }
                                        }}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                    >
                                        <Icon name="Award" size={18} />
                                        {user?.certificateClaimed ? 'เปิดดูและดาวน์โหลดประกาศนียบัตร (PDF/PNG)' : 'ยืนยันชื่อและรับประกาศนียบัตร'}
                                    </button>
                                )}

                                <button
                                    type="button"
                                    onClick={handleLogout}
                                    className="touch-target w-full py-3 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-400/30 text-rose-400 font-display font-bold text-sm flex items-center justify-center gap-2"
                                >
                                    <Icon name="LogOut" size={17} /> ออกจากระบบ
                                </button>
                            </SpatialCard>
                        )}
                    </main>

                    {/* Mobile Bottom Navigation Dock */}
                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]">
                        <div className="grid grid-cols-4 gap-1.5 max-w-md mx-auto">
                            {tabs.map(t => {
                                const active = activeTab === t.id;
                                return (
                                    <button
                                        key={t.id}
                                        type="button"
                                        onClick={() => { setActiveTab(t.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[11px] font-bold transition-all active:scale-95 ${
                                            active ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-sm' : 'text-secondary-adaptive'
                                        }`}
                                    >
                                        <Icon name={t.icon} size={18} />
                                        <span>{t.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                    {renderAdminPreviewBar()}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
