    <!-- ซิงค์โหมดมืด/สว่างทันที + โหลดไฟล์โมดูลร่วม (รวม hero-peach-engine.js) เฉพาะบนโดเมนจริง ป้องกัน 404 ในพรีวิว -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('rjcloud_theme') || 'dark';
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
        } catch (_) {}

        try {
          const loc = window.location;
          const isRealHost =
            (loc.protocol === 'https:' || loc.protocol === 'http:') &&
            loc.origin !== 'null' &&
            !/(googleusercontent|webcontainer|stackblitz|sandbox|srcdoc|blob:)/i.test(loc.href);
          if (isRealHost) {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = './manifest.json';
            document.head.appendChild(manifest);

            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './styles.css';
            document.head.appendChild(css);

            [
              './data.js',
              './learning-core.js',
              './cert-engine.js',
              './hero-peach-engine.js',
              './keynote-launch.js'
            ].forEach(function (src) {
              const s = document.createElement('script');
              s.src = src;
              s.async = false;
              s.onerror = function () {};
              document.head.appendChild(s);
            });
          }
        } catch (_) {}
      })();
    </script>

    <style>
      /* ============================================================================
       * 1. ADAPTIVE BENTO GRID THEME TOKENS (DARK OBSIDIAN GLASS & LIGHT CRYSTAL GLASS)
       * ============================================================================ */
      :root, html[data-theme="dark"] {
        --bg-page: #030611;
        --text-main: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --glass-bg: linear-gradient(155deg, rgba(18, 28, 54, 0.76) 0%, rgba(7, 13, 28, 0.90) 100%);
        --glass-border: rgba(148, 197, 255, 0.18);
        --glass-border-hover: rgba(103, 232, 249, 0.46);
        --glass-shadow: 0 24px 60px -20px rgba(0, 4, 18, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 0 24px rgba(56, 189, 248, 0.04);
        --header-bg: rgba(3, 6, 17, 0.80);
        --surface-soft: rgba(255, 255, 255, 0.045);
        --surface-soft-hover: rgba(255, 255, 255, 0.09);
        --surface-border: rgba(148, 197, 255, 0.16);
        --input-bg: rgba(5, 10, 24, 0.80);
        --input-border: rgba(148, 197, 255, 0.24);
        --input-text: #f8fafc;
        --accent-text: #6ee7b7;
        --accent-prism: #67e8f9;
        --grid-line: rgba(148, 197, 255, 0.038);
        --aura-1: rgba(16, 185, 129, 0.14);
        --aura-2: rgba(56, 189, 248, 0.16);
        --aura-3: rgba(129, 140, 248, 0.16);
      }
      html[data-theme="light"] {
        --bg-page: #edf5fc;
        --text-main: #0f172a;
        --text-secondary: #334155;
        --text-muted: #64748b;
        --glass-bg: linear-gradient(155deg, rgba(255, 255, 255, 0.92) 0%, rgba(236, 246, 255, 0.86) 100%);
        --glass-border: rgba(255, 255, 255, 0.96);
        --glass-border-hover: rgba(14, 165, 233, 0.48);
        --glass-shadow: 0 20px 46px -18px rgba(15, 58, 125, 0.16), 0 0 0 1px rgba(148, 184, 222, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.95);
        --header-bg: rgba(244, 249, 255, 0.88);
        --surface-soft: rgba(255, 255, 255, 0.76);
        --surface-soft-hover: rgba(255, 255, 255, 0.96);
        --surface-border: rgba(148, 184, 222, 0.36);
        --input-bg: rgba(255, 255, 255, 0.95);
        --input-border: rgba(148, 184, 222, 0.65);
        --input-text: #0f172a;
        --accent-text: #047857;
        --accent-prism: #0284c7;
        --grid-line: rgba(15, 58, 125, 0.045);
        --aura-1: rgba(16, 185, 129, 0.16);
        --aura-2: rgba(56, 189, 248, 0.20);
        --aura-3: rgba(129, 140, 248, 0.16);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Anuphan', 'Sarabun', sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.28s ease, color 0.28s ease;
      }

      .touch-target { min-height: 46px; touch-action: manipulation; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      @media (max-width: 768px) { input, select, textarea { font-size: 16px !important; } }

      .spatial-aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 90% 55% at 50% 108%, var(--aura-1) 0%, transparent 66%),
          radial-gradient(circle at 86% 14%, var(--aura-2) 0%, transparent 48%),
          radial-gradient(circle at 14% 28%, var(--aura-3) 0%, transparent 46%);
      }
      .spatial-grid {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at center, black 42%, transparent 94%);
      }
      .spatial-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(165%);
        -webkit-backdrop-filter: blur(24px) saturate(165%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        transition: border-color 0.22s ease, box-shadow 0.22s ease, background 0.28s ease;
      }
      .spatial-card:hover { border-color: var(--glass-border-hover); }
      .spatial-header {
        background: var(--header-bg);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border-bottom: 1px solid var(--surface-border);
      }
      .spatial-soft { background: var(--surface-soft); border: 1px solid var(--surface-border); transition: background 0.18s ease, border-color 0.18s ease; }
      .spatial-soft:hover { background: var(--surface-soft-hover); }
      .spatial-input { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); }
      .spatial-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22); }

      /* ปุ่มลิงก์บริการด้านล่างหน้าแรก */
      .landing-service-pill {
        background: linear-gradient(145deg, rgba(10, 32, 74, 0.86) 0%, rgba(5, 18, 46, 0.94) 100%);
        border: 1px solid rgba(186, 230, 253, 0.34);
        color: #f8fafc !important;
        box-shadow: 0 10px 26px -10px rgba(0, 8, 28, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.16);
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        text-decoration: none;
        cursor: pointer;
      }
      .landing-service-pill:hover {
        background: linear-gradient(145deg, rgba(18, 52, 114, 0.94) 0%, rgba(8, 26, 66, 0.98) 100%);
        border-color: rgba(125, 211, 252, 0.65);
        transform: translateY(-1.5px);
      }
      .landing-install-pill {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.28) 0%, rgba(14, 165, 233, 0.30) 100%);
        border: 1px solid rgba(110, 231, 183, 0.56);
        color: #ecfdf5 !important;
        box-shadow: 0 12px 28px -10px rgba(16, 185, 129, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.22);

      }
      .landing-install-pill:hover {

        border-color: rgba(167, 243, 208, 0.85);

      }

      /* ปุ่ม Pill พร้อมแสงสะท้อนเนื้อนุ่ม GPU-accelerated */
      .rjc2-pill-btn {
        position: relative;
        overflow: hidden;
        background: linear-gradient(95deg, #d7fbe6 0%, #c6f3f9 48%, #b3c8ff 100%);
        color: #050b16 !important;
        box-shadow: 0 10px 28px -6px rgba(134, 239, 172, 0.48), 0 0 0 1px rgba(255, 255, 255, 0.78) inset;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease;
        text-decoration: none;
        cursor: pointer;
      }
      .rjc2-pill-btn::after {
        content: '';
        position: absolute;
        top: -20%;
        left: 0;
        width: 48%;
        height: 140%;
        background: linear-gradient(105deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
        pointer-events: none;
        will-change: transform, opacity;
        animation: btnSheenSweep 8.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .rjc2-pill-btn:hover {
        transform: translateY(-1.5px) scale(1.02);
        box-shadow: 0 14px 34px -6px rgba(147, 197, 253, 0.7), 0 0 22px rgba(187, 247, 208, 0.55), 0 0 0 1.5px rgba(255, 255, 255, 0.92) inset;
      }
      .rjc2-pill-btn:active { transform: scale(0.97); }

      .text-primary-adaptive { color: var(--text-main); }
      .text-secondary-adaptive { color: var(--text-secondary); }
      .text-muted-adaptive { color: var(--text-muted); }
      .text-accent-adaptive { color: var(--accent-text); }
      .text-prism-adaptive { color: var(--accent-prism); }
      html[data-theme="dark"] select option { background-color: #061229; color: #f8fafc; }

      /* ============================================================================
       * 2. XIANXIA BLOCKBUSTER NIGHT ATMOSPHERE, LIQUID GLASS & WATER TEXT (60FPS)
       * ============================================================================ */
      .hero-atmosphere {
        isolation: isolate;
        contain: layout paint;
        background: linear-gradient(
          180deg,
          #01030a 0%,
          #030816 17%,
          #06142d 36%,
          #0b244a 55%,
          #103363 73%,
          #092044 84%,
          #05132b 93%,
          #030b1c 100%
        );
      }
      .hero-vignette {
        background:
          radial-gradient(ellipse 76% 64% at 48% 40%, rgba(0, 0, 0, 0) 40%, rgba(1, 3, 12, 0.58) 100%),
          linear-gradient(180deg, rgba(1, 3, 10, 0.45) 0%, rgba(1, 3, 10, 0) 18%, rgba(1, 3, 10, 0) 88%, rgba(2, 7, 18, 0.42) 100%);
      }
      .lower-landing-bg {
        background: linear-gradient(180deg, #030b1c 0%, #041026 24%, #030b1e 60%, #020612 100%);
      }

      .liquid-glass-backdrop {
        clip-path: url(#idxLiquidGlassClipNorm);
        -webkit-clip-path: url(#idxLiquidGlassClipNorm);
        background: radial-gradient(
          circle at var(--gx, 32%) var(--gy, 28%),
          rgba(255, 250, 244, 0.16) 0%,
          rgba(206, 228, 255, 0.09) 42%,
          rgba(10, 34, 84, 0.34) 78%,
          rgba(6, 20, 54, 0.24) 100%
        );
        backdrop-filter: blur(8px) saturate(140%) brightness(1.04);
        -webkit-backdrop-filter: blur(8px) saturate(140%) brightness(1.04);
        transition: background 0.25s ease;
      }
      .liquid-glass-mobile {
        background: linear-gradient(155deg, rgba(11, 38, 96, 0.72) 0%, rgba(9, 32, 82, 0.68) 52%, rgba(15, 44, 102, 0.78) 100%);
        border: 1px solid rgba(254, 243, 235, 0.36);
        box-shadow: 0 22px 46px -14px rgba(0, 10, 36, 0.56), inset 0 1px 1px rgba(255, 255, 255, 0.38), inset 0 0 28px rgba(249, 168, 212, 0.12);
        transform: translateZ(0);
      }
      #idx-liquid-glass-stage { container-type: inline-size; }

      .hero-eyebrow {
        letter-spacing: 0.045em;
        background: rgba(255, 255, 255, 0.11);
        border: 1px solid rgba(254, 240, 215, 0.34);
        box-shadow: 0 4px 16px rgba(0, 14, 44, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        text-shadow: 0 1px 8px rgba(0, 12, 42, 0.6);
      }
      .hero-headline {
        font-weight: 500;
        letter-spacing: -0.015em;
        text-shadow: 0 2px 14px rgba(0, 8, 32, 0.9), 0 1px 4px rgba(0, 10, 38, 0.8), 0 0 26px rgba(253, 224, 200, 0.22);
      }
      .hero-year-highlight {
        font-weight: 700;
        letter-spacing: -0.015em;
        background: linear-gradient(95deg, #ffffff 0%, #fffbeb 42%, #fde68a 74%, #fbcfe8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-top: 0.04em;
        padding-bottom: 0.04em;
        filter: drop-shadow(0 3px 14px rgba(0, 10, 40, 0.85)) drop-shadow(0 0 22px rgba(253, 224, 71, 0.34));
      }
      .beta-glow {
        font-weight: 300;
        color: #fffce0;
        letter-spacing: 0.015em;
        text-shadow: 0 0 10px rgba(254, 249, 195, 0.82), 0 0 24px rgba(253, 224, 71, 0.4), 0 0 42px rgba(250, 204, 21, 0.22);
      }

      /* ข้อความ RAJAVITHI HOSPITAL & COE แบบเนื้อน้ำเคลื่อนไหวอัลต้าสมูท (Seamless GPU Loop) */
      .water-title-wrap {
        width: min(94vw, 680px);
        filter: drop-shadow(0 2px 10px rgba(56, 189, 248, 0.22));
      }
      .water-wave-primary { will-change: transform; animation: waterFlowLeft380 10.5s linear infinite; }
      .water-wave-secondary { will-change: transform; animation: waterFlowRight260 14.5s linear infinite; }
      .water-wave-sub { will-change: transform; animation: waterFlowLeft240 9.2s linear infinite; }
      .water-caustic-band { will-change: transform, opacity; animation: waterCausticGlide 11s ease-in-out infinite; }
      .water-reflect-layer {
        transform-box: fill-box;
        transform-origin: center top;
        will-change: transform, opacity;
        animation: waterReflectSway 7.2s ease-in-out infinite;
      }

      /* ============================================================================
       * 3. GPU ANIMATIONS & LAYER STACKING
       * ============================================================================ */
      @keyframes leafFlutterOrganic {
        0%, 100% { transform: rotate(0deg) scale(1); opacity: 0.78; }
        45% { transform: rotate(var(--fl-rot, 5deg)) scale(1.06); opacity: 0.96; }
      }
      @keyframes twinkleStar {
        0%, 100% { opacity: 0.16; transform: scale(0.85); }
        50% { opacity: 0.88; transform: scale(1.24); }
      }
      @keyframes meteorStreak {
        0% { opacity: 0; transform: rotate(var(--ang, -32deg)) translateX(130px) scaleX(0.35); }
        5% { opacity: 0.78; }
        18% { opacity: 0.64; transform: rotate(var(--ang, -32deg)) translateX(-380px) scaleX(1.08); }
        28%, 100% { opacity: 0; transform: rotate(var(--ang, -32deg)) translateX(-640px) scaleX(0.55); }
      }
      @keyframes auroraCurtainWave {
        0%, 100% { transform: translate3d(-3%, 0, 0) scaleY(1); opacity: 0.40; }
        45% { transform: translate3d(3%, -2%, 0) scaleY(1.06); opacity: 0.64; }
      }
      @keyframes auroraCurtainAlt {
        0%, 100% { transform: translate3d(3%, 0, 0) scaleY(1.02); opacity: 0.32; }
        50% { transform: translate3d(-4%, -2%, 0) scaleY(0.94); opacity: 0.54; }
      }
      @keyframes btnSheenSweep {
        0%, 66% { transform: translate3d(-150%, 0, 0) skewX(-22deg); opacity: 0; }
        74% { opacity: 0.85; }
        94% { transform: translate3d(260%, 0, 0) skewX(-22deg); opacity: 0.7; }
        100% { transform: translate3d(270%, 0, 0) skewX(-22deg); opacity: 0; }
      }
      @keyframes waterFlowLeft380 { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-380px, 0, 0); } }
      @keyframes waterFlowRight260 { 0% { transform: translate3d(-260px, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
      @keyframes waterFlowLeft240 { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-240px, 0, 0); } }
      @keyframes waterCausticGlide {
        0%, 100% { transform: translate3d(-240px, 0, 0); opacity: 0.28; }
        50% { transform: translate3d(240px, 0, 0); opacity: 0.62; }
      }
      @keyframes waterReflectSway {
        0%, 100% { transform: translate3d(-3px, 0, 0) scaleY(-0.46) skewX(-3deg); opacity: 0.26; }
        50% { transform: translate3d(3px, 0.8px, 0) scaleY(-0.50) skewX(3deg); opacity: 0.36; }
      }
      @keyframes rjcAmbientRun { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes rjcWaveBar { 0%, 100% { transform: scaleY(0.28); opacity: 0.65; } 50% { transform: scaleY(1); opacity: 1; } }
      @keyframes appSpin { to { transform: rotate(360deg); } }

      .living-leaf { transform-box: fill-box; transform-origin: center; animation: leafFlutterOrganic var(--dur, 5.2s) ease-in-out infinite; animation-delay: var(--del, 0s); }
      .aurora-curtain-primary {
        background:
          radial-gradient(ellipse 52% 80% at 24% 52%, rgba(45, 212, 191, 0.18) 0%, rgba(56, 189, 248, 0.09) 50%, rgba(0, 0, 0, 0) 78%),
          radial-gradient(ellipse 52% 74% at 76% 48%, rgba(249, 168, 212, 0.15) 0%, rgba(168, 85, 247, 0.10) 52%, rgba(0, 0, 0, 0) 80%);
        will-change: transform, opacity;
        animation: auroraCurtainWave 18s ease-in-out infinite;
      }
      .aurora-curtain-secondary {
        background:
          radial-gradient(ellipse 54% 70% at 50% 38%, rgba(254, 240, 178, 0.16) 0%, rgba(94, 234, 212, 0.10) 46%, rgba(0, 0, 0, 0) 76%),
          radial-gradient(ellipse 40% 66% at 82% 58%, rgba(244, 114, 182, 0.10) 0%, rgba(0, 0, 0, 0) 72%);
        will-change: transform, opacity;
        animation: auroraCurtainAlt 22s ease-in-out infinite;
      }
      .twinkle-star {
        position: absolute; border-radius: 9999px; background: rgba(255, 250, 240, 0.9);
        box-shadow: 0 0 8px 1px rgba(254, 240, 178, 0.45);
        animation: twinkleStar var(--tw-dur, 4.4s) ease-in-out infinite;
        animation-delay: var(--tw-del, 0s);
      }
      .shooting-star {
        position: absolute; width: var(--len, 145px); height: 1.5px; border-radius: 9999px; opacity: 0;
        background: linear-gradient(90deg, rgba(255, 252, 235, 0.68) 0%, var(--trail-col, rgba(254, 240, 178, 0.42)) 32%, rgba(249, 168, 212, 0.12) 68%, rgba(255, 255, 255, 0) 100%);
        animation: meteorStreak var(--m-dur, 8.6s) cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
        animation-delay: var(--m-del, 0s);
        will-change: transform, opacity;
      }
      .shooting-star::before {
        content: ''; position: absolute; left: -2px; top: 50%; width: 4px; height: 4px; transform: translateY(-50%);
        border-radius: 9999px; background: rgba(255, 254, 244, 0.84);
        box-shadow: 0 0 10px 3px rgba(254, 240, 178, 0.52);
      }

      /* z-12: จันทรา + นกกระเรียน + โคมลอย + ทิวเขา 4 ระยะ AI Hologram + หมอกเย็น + ผิวน้ำทะเลสาบกระจก */
      #idx-mist-backdrop-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 12; transform: translateZ(0); }
      /* z-18: อยู่หน้ากิ่งไม้ (z-15) แต่หลังกรอบกระจก (z-25) -> แสงแอมเบียน + พุ่มดอกท้อใหญ่เต็มต้น + ฝนกลีบดอกท้อ */
      #idx-solar-flare-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 18; transform: translateZ(0); }

      .rjc-ambient-bar {
        height: 4px; width: 100%;

        // Studio 24kHz TTS Helpers (Zero Browser Voice)
        function pcmToWavBlobSafe(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = Math.max(0, bytes.length - off);
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return new Blob([buf], { type: 'audio/wav' });
            } catch (_) { return null; }
        }

        async function fetchStudioGuideBlob({ appsScriptUrl, text, cacheKey, signal }) {

            }
            if (!appsScriptUrl || !navigator.onLine) return null;
            for (let attempt = 0; attempt < 2; attempt++) {
                if (signal?.aborted) return null;
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort, { once: true });
                const tm = setTimeout(() => ctrl.abort(), 45000);
                try {
                    const cleanSpeech = typeof CORE.prepareNaturalThaiSpeech === 'function' ? CORE.prepareNaturalThaiSpeech(text) : text;
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'callGeminiTTS', text: cleanSpeech, voiceName: 'Sulafat', languageCode: 'th-TH', style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ เป็นมิตรเหมือนผู้ดูแลหลักสูตร' }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                    if (signal?.aborted) return null;
                    const res = JSON.parse((await rawRes.text()) || '{}');
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rateMatch = String(res.inlineData.mimeType || '').match(/rate=(\d+)/);
                        const blob = pcmToWavBlobSafe(res.inlineData.data, parseInt(rateMatch ? rateMatch[1] : '24000', 10));
                        if (blob && blob.size > 0) {
                            if (cacheKey && typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(cacheKey, blob).catch(() => {});
                            return blob;
                        }
                    }
                } catch (_) {
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
                if (attempt === 0 && !signal?.aborted) await new Promise(r => setTimeout(r, 1000));
            }
            return null;
        }

        // ============================================================================
        // 3. LANDING HERO SCREEN (เชื่อม hero-peach-engine.js + ข้อความเนื้อน้ำเคลื่อนไหว)
        // ============================================================================
        function LandingHeroScreen({ onStartAuth, hasSavedSession, onResumeDashboard, showInstallBtn, onInstallApp }) {
            const heroStageRef = useRef(null);
            const mistCanvasRef = useRef(null);
            const flareCanvasRef = useRef(null);
            const treeSvgRef = useRef(null);
            const glassStageRef = useRef(null);
            const mobileGlassRef = useRef(null);
            const textFitBoxRef = useRef(null);
            const fitLine1Ref = useRef(null);
            const fitLine2Ref = useRef(null);
            const centerCtaRef = useRef(null);
            const mTextFitBoxRef = useRef(null);
            const mFitLine1Ref = useRef(null);
            const mFitLine2Ref = useRef(null);

            const jadeLeaves = useMemo(
                () => (window.RJCLOUD_HERO_PEACH && Array.isArray(window.RJCLOUD_HERO_PEACH.JADE_LEAVES)
                    ? window.RJCLOUD_HERO_PEACH.JADE_LEAVES
                    : FALLBACK_JADE_LEAVES),
                []
            );

            useEffect(() => {
                const refs = {
                    stage: heroStageRef.current,
                    bgCanvas: mistCanvasRef.current,
                    fxCanvas: flareCanvasRef.current,
                    treeSvg: treeSvgRef.current,
                    glassStage: glassStageRef.current,
                    mobileGlass: mobileGlassRef.current,
                    textFitBox: textFitBoxRef.current,
                    fitLine1: fitLine1Ref.current,
                    fitLine2: fitLine2Ref.current,
                    centerCta: centerCtaRef.current,
                    mTextFitBox: mTextFitBoxRef.current,
                    mFitLine1: mFitLine1Ref.current,
                    mFitLine2: mFitLine2Ref.current
                };
                if (!refs.stage || !refs.bgCanvas || !refs.fxCanvas) return;

                let engineCtrl = null;
                let fallbackRaf = null;
                let pollTimer = null;
                let disposed = false;

                const fitTextOnce = () => {
                    const fitLine = (el, targetW, minPx, maxPx) => {
                        if (!el || targetW <= 0) return;
                        const cur = parseFloat(window.getComputedStyle(el).fontSize) || 20;
                        const mw = el.scrollWidth;
                        if (!mw) return;
                        const next = Math.max(minPx, Math.min(maxPx, (targetW / mw) * cur));
                        if (Math.abs(next - cur) > 0.4) el.style.fontSize = `${next.toFixed(2)}px`;
                    };
                    if (refs.textFitBox && refs.fitLine1 && refs.textFitBox.clientWidth > 0) {
                        const tw = refs.textFitBox.clientWidth * 0.98;
                        fitLine(refs.fitLine1, tw, 16, 36);
                        if (refs.fitLine2) {
                            const cw = refs.centerCta?.clientWidth ? refs.centerCta.clientWidth * 0.94 : tw * 0.49;
                            fitLine(refs.fitLine2, Math.min(tw * 0.49, cw), 16, 34);
                        }
                    }
                    if (refs.mTextFitBox && refs.mFitLine1 && refs.mFitLine2 && refs.mTextFitBox.clientWidth > 0) {
                        const mw = refs.mTextFitBox.clientWidth * 0.96;
                        fitLine(refs.mFitLine1, mw, 13, 21);
                        fitLine(refs.mFitLine2, mw * 0.54, 17, 26);
                    }
                };

                const startFallbackLite = () => {
                    const bgCtx = refs.bgCanvas.getContext('2d');
                    const fxCtx = refs.fxCanvas.getContext('2d');
                    if (!bgCtx || !fxCtx) return;

                    const syncLite = () => {
                        const r = refs.stage.getBoundingClientRect();
                        const w = Math.max(1, Math.round(r.width));
                        const h = Math.max(1, Math.round(r.height));
                        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                        refs.bgCanvas.width = Math.round(w * dpr); refs.bgCanvas.height = Math.round(h * dpr);
                        refs.fxCanvas.width = Math.round(w * dpr); refs.fxCanvas.height = Math.round(h * dpr);
                        bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                        fitTextOnce();
                        return { w, h };
                    };
                    let dims = syncLite();
                    const onResize = () => { dims = syncLite(); };
                    window.addEventListener('resize', onResize);

                    const petals = Array.from({ length: 24 }, (_, i) => ({
                        x: Math.random() * dims.w, y: Math.random() * dims.h * 0.7,
                        vx: 0.4 + Math.random() * 0.6, vy: 0.3 + Math.random() * 0.4,
                        r: 3 + Math.random() * 2.5, s: i * 1.1
                    }));

                    const loop = (now) => {
                        if (disposed || engineCtrl) {
                            window.removeEventListener('resize', onResize);
                            return;
                        }
                        fallbackRaf = requestAnimationFrame(loop);
                        const { w, h } = dims;
                        const t = now * 0.001;
                        bgCtx.clearRect(0, 0, w, h);

                        const mx = w * 0.21, my = Math.max(66, h * 0.16), mr = Math.min(w * 0.13, 86);
                        const mg = bgCtx.createRadialGradient(mx, my, 4, mx, my, mr * 2.8);
                        mg.addColorStop(0, 'rgba(255,253,240,0.92)');
                        mg.addColorStop(0.28, 'rgba(254,240,186,0.42)');
                        mg.addColorStop(0.62, 'rgba(110,231,183,0.14)');
                        mg.addColorStop(1, 'rgba(0,0,0,0)');
                        bgCtx.fillStyle = mg;
                        bgCtx.beginPath(); bgCtx.arc(mx, my, mr * 2.8, 0, Math.PI * 2); bgCtx.fill();

                        const wy = h * 0.84;
                        const wg = bgCtx.createLinearGradient(0, wy, 0, h);
                        wg.addColorStop(0, 'rgba(11,34,72,0.75)');
                        wg.addColorStop(1, 'rgba(2,8,22,0.95)');
                        bgCtx.fillStyle = wg; bgCtx.fillRect(0, wy, w, h - wy);

                        fxCtx.clearRect(0, 0, w, h);
                        if (refs.treeSvg) {
                            const sr = refs.stage.getBoundingClientRect();
                            const tr = refs.treeSvg.getBoundingClientRect();
                            const tx = tr.left - sr.left, ty = tr.top - sr.top;
                            for (let i = 0; i < 36; i++) {
                                const ang = (i / 36) * Math.PI * 1.15 - Math.PI * 1.075;
                                const radX = tr.width * (0.18 + (i % 4) * 0.075);
                                const radY = tr.height * (0.12 + (i % 3) * 0.065);
                                const bx = tx + tr.width * 0.5 + Math.cos(ang) * radX;
                                const by = ty + tr.height * 0.44 + Math.sin(ang) * radY;
                                const glow = fxCtx.createRadialGradient(bx, by, 1, bx, by, 18);
                                glow.addColorStop(0, 'rgba(255,245,250,0.88)');
                                glow.addColorStop(0.45, 'rgba(251,207,232,0.52)');
                                glow.addColorStop(1, 'rgba(244,114,182,0)');
                                fxCtx.fillStyle = glow;
                                fxCtx.beginPath(); fxCtx.arc(bx, by, 18, 0, Math.PI * 2); fxCtx.fill();
                            }
                        }
                        for (let i = 0; i < petals.length; i++) {
                            const p = petals[i];
                            p.x += p.vx + Math.sin(t + p.s) * 0.3; p.y += p.vy;
                            if (p.x > w + 20 || p.y > wy) { p.x = Math.random() * w * 0.8; p.y = h * 0.14; }
                            fxCtx.fillStyle = 'rgba(251,207,232,0.82)';
                            fxCtx.beginPath(); fxCtx.ellipse(p.x, p.y, p.r, p.r * 0.55, t + p.s, 0, Math.PI * 2); fxCtx.fill();
                        }
                    };
                    fallbackRaf = requestAnimationFrame(loop);
                };

                const tryMountHeroEngine = () => {
                    if (disposed || engineCtrl) return true;
                    if (window.RJCLOUD_HERO_PEACH && typeof window.RJCLOUD_HERO_PEACH.mount === 'function') {
                        if (fallbackRaf) { cancelAnimationFrame(fallbackRaf); fallbackRaf = null; }
                        engineCtrl = window.RJCLOUD_HERO_PEACH.mount(refs);
                        return true;
                    }
                    return false;
                };

                if (!tryMountHeroEngine()) {
                    startFallbackLite();
                    let tries = 0;
                    pollTimer = setInterval(() => {
                        tries += 1;
                        if (tryMountHeroEngine() || tries > 25) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                        }
                    }, 120);
                }

                return () => {
                    disposed = true;
                    if (pollTimer) clearInterval(pollTimer);
                    if (fallbackRaf) cancelAnimationFrame(fallbackRaf);
                    if (engineCtrl && typeof engineCtrl.destroy === 'function') engineCtrl.destroy();
                };
            }, []);

            return (
                <div className="min-h-[100svh] w-full flex flex-col text-white">
                    <svg width="0" height="0" className="absolute pointer-events-none" aria-hidden="true">
