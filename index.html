        // ============================================================================
        // 4. MAIN RJCLOUD.ORGAN 2.0 LEARNER APPLICATION
        // ============================================================================
        function LearnerApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const adminPreviewMode = urlParams.get('admin_preview') || '';
            const isAdminPreview = Boolean(adminPreviewMode);
            const returnToDashboard = urlParams.get('return') === 'dashboard';
            const incomingLicense = urlParams.get('license') || '';

            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // Cloud & Course Config
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [cneuConfig, setCneuConfig] = useState(() => ({ ...DEFAULT_CNEU_CONFIG }));
            const [certTemplate, setCertTemplate] = useState(() => ({ ...DEFAULT_CERT_TEMPLATE }));
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคอวัยวะ', url: '', documentUrl: '' });
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : FALLBACK_LESSONS));
            const [quizList, setQuizList] = useState(() => parseRawQuizSafe(window.QUIZ_QUESTIONS_RAW));

            // Session & Navigation State (ไม่เด้งกลับหน้าต้นไม้เมื่อกลับมาจาก AI Skill Lab)
            const [user, setUser] = useState(() => {
                const saved = loadSessionTwoLayer();
                if (saved?.id) return saved;
                if (isAdminPreview && adminPreviewMode !== 'landing' && !adminPreviewMode.startsWith('auth')) {
                    return {
                        id: '4511128901', license: '4511128901', name: 'พว.กัญญารัตน์ วัฒนากูล', nameEN: 'Kanyarat Wattanakul, RN',
                        professionGroup: 'พยาบาล', cneuEligible: true, position: 'พยาบาลวิชาชีพชำนาญการ (TC)',
                        hospital: 'รพ.ราชวิถี', department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', email: 'kanyarat@demo.go.th',
                        userType: 'เรียนต่อเนื่อง', studyHoursExempt: true, progress: 100, pretest: '30/40', posttest: '37/40',
                        status: 'ผ่าน', skillLabPassed: true, skillLabBestScore: 92, certificateCode: 'RJC-2027-DEMO01', certificateIssuedAt: new Date().toISOString()
                    };
                }
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (adminPreviewMode) {
                    if (adminPreviewMode.startsWith('auth')) return 'auth';
                    return adminPreviewMode;
                }
                if (returnToDashboard && loadSessionTwoLayer()?.id) return 'dashboard';
                if (incomingLicense) return 'auth';
                return 'landing';
            });
            const [dashTab, setDashTab] = useState(() => (adminPreviewMode === 'live' ? 'live' : adminPreviewMode === 'profile' ? 'profile' : 'lessons'));

            // Auth 3-Step State
            const [authStep, setAuthStep] = useState(() => (adminPreviewMode === 'auth2' ? 2 : adminPreviewMode === 'auth3' ? 3 : 1));
            const [licenseInput, setLicenseInput] = useState(incomingLicense || '');
            const [authBusy, setAuthBusy] = useState(false);
            const [authProfile, setAuthProfile] = useState({
                professionGroup: '', name: '', nameEN: '', position: '',
                department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)', hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร',
                email: '', phone: '', userType: 'เรียนใหม่', hoursActivityName: '', pdpaAccepted: true
            });
            const [sentOtpCode, setSentOtpCode] = useState('123456');
            const [otpInput, setOtpInput] = useState('');

            // Learning, Quiz, Eval & Certificate States
            const [activeLessonIdx, setActiveLessonIdx] = useState(0);
            const [quizAnswers, setQuizAnswers] = useState({});
            const [certNameTH, setCertNameTH] = useState('');
            const [certNameEN, setCertNameEN] = useState('');
            const [certHospital, setCertHospital] = useState('');
            const [csatScore, setCsatScore] = useState(5);
            const [susAnswers, setSusAnswers] = useState({ s1: 5, s2: 1, s3: 5, s4: 1, s5: 5 });
            const [editProfileOpen, setEditProfileOpen] = useState(false);
            const [editForm, setEditForm] = useState({ professionGroup: 'พยาบาล', name: '', nameEN: '', position: '', hospital: '', phone: '' });

            // Studio AI Voice Guide State (ไร้ซับไตเติล)
            const [guideVoiceState, setGuideVoiceState] = useState({ activeKey: '', status: 'idle' });
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const certCanvasRef = useRef(null);
            const sharedAudioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const voiceSessionRef = useRef(0);
            const voiceAbortRef = useRef(null);
            const autoPlayedGuidesRef = useRef(new Set());

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            useEffect(() => {
                const el = document.getElementById('app-root');
                if (el) el.dataset.mounted = 'true';
                if (returnToDashboard && user?.id) {
                    try { window.history.replaceState({}, '', './index.html'); } catch (_) {}
                }
            }, []);

            // Keynote Sync (เฉพาะตอนอยู่หน้าต้นไม้ landing)
            useEffect(() => {
                if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.sync === 'function') {
                    window.RJCLOUD_KEYNOTE.sync({ isLanding: screen === 'landing', isAdminPreview, appsScriptUrl });
                }
            }, [screen, isAdminPreview, appsScriptUrl]);

            // Firebase Cloud Settings & Live Content Sync
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let unsubSettings = null, unsubContent = null;
                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser && !isAdminPreview) {
                        try { await signInAnonymously(fbAuth); } catch (_) {}
                        return;
                    }
                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                        if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                        if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                    }, () => {});

                    if (unsubContent) unsubContent();
                    unsubContent = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'), (snap) => {
                        if (!snap.exists()) return;
                        const d = snap.data() || {};
                        if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                        if (d.questionSets) {
                            const firstSet = Array.isArray(d.questionSets) ? d.questionSets[0] : d.questionSets['0'];
                            if (Array.isArray(firstSet) && firstSet.length > 0) setQuizList(firstSet);
                        }
                    }, () => {});
                });
                return () => { active = false; unsubAuth(); if (unsubSettings) unsubSettings(); if (unsubContent) unsubContent(); };
            }, [isAdminPreview]);

            // Derived Learner Status & Profession-Aware Credit Meta
            const isExempt = Boolean(user && (user.studyHoursExempt || user.userType === 'เรียนต่อเนื่อง'));
            const studyPct = isExempt ? 100 : Math.min(100, Math.round(Number(user?.progress || 0)));
            const isStudyEnough = isExempt || studyPct >= MIN_STUDY_PERCENT;
            const isLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const canTakePosttest = Boolean(isAdminPreview || liveConfig.allowPosttest || (isStudyEnough && isLabDone));
            const hasPassedPosttest = Boolean(user?.status === 'ผ่าน' || user?.certificateCode);
            const userCreditMeta = useMemo(
                () => resolveCreditMetaSafe(user, certTemplate, { ...cneuConfig, trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8) }),
                [user, certTemplate, cneuConfig, liveConfig.hours]
            );

            // Sync Certificate Form Fields when entering cert_confirm
            useEffect(() => {
                if (screen === 'cert_confirm' && user) {
                    setCertNameTH(user.name || '');
                    setCertNameEN(user.nameEN || '');
                    setCertHospital(user.hospital || '');
                }
            }, [screen, user]);

            // Render Certificate Canvas when on certificate screen
            useEffect(() => {
                if (screen !== 'certificate' || !certCanvasRef.current || !user) return;
                const code = user.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-DEMO01`;
                const verifyUrl = typeof CERT.buildVerifyUrl === 'function' ? CERT.buildVerifyUrl(code, certTemplate.certPrefix) : `${window.location.origin}/verify.html?code=${encodeURIComponent(code)}`;
                const mergedTpl = {
                    ...certTemplate,
                    cneuActivityCode: cneuConfig.activityCode,
                    cneuCredits: cneuConfig.cneuCredits,
                    cmeActivityCode: cneuConfig.cmeActivityCode,
                    cmeCredits: cneuConfig.cmeCredits,
                    trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8)
                };
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certCanvasRef.current, mergedTpl, { ...user, certificateCode: code }, verifyUrl);
                } else {
                    drawCertificateFallback(certCanvasRef.current, mergedTpl, { ...user, certificateCode: code }, userCreditMeta, verifyUrl);
                }
            }, [screen, user, certTemplate, cneuConfig, liveConfig.hours, userCreditMeta]);

            // ============================================================================
            // 5. STUDIO 24kHz AI VOICE GUIDE ENGINE (AUTO-PLAY + MANUAL REPLAY • NO SUBTITLES)
            // ============================================================================
            const stopGuideVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (voiceAbortRef.current) { try { voiceAbortRef.current.abort(); } catch (_) {} voiceAbortRef.current = null; }
                if (sharedAudioRef.current) { try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {} }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, []);
            useEffect(() => () => stopGuideVoice(), [stopGuideVoice]);

            const playGuideVoice = useCallback(async (key, text, opts = {}) => {
                const { silentFail = false } = opts;
                if (guideVoiceState.activeKey === key && guideVoiceState.status !== 'idle') { stopGuideVoice(); return; }
                stopGuideVoice();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;
                setGuideVoiceState({ activeKey: key, status: 'loading' });

                const blob = await fetchStudioGuideBlob({ appsScriptUrl, text, cacheKey: key, signal: ctrl.signal });
                if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                if (!blob || blob.size === 0) {
                    setGuideVoiceState({ activeKey: '', status: 'idle' });
                    if (!silentFail) showToast('ไม่สามารถเชื่อมต่อเสียง AI สตูดิโอได้ชั่วคราว กรุณาลองกดใหม่ค่ะ', 'info');
                    return;
                }

                if (!sharedAudioRef.current) {
                    const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', ''); sharedAudioRef.current = a;
                }
                setGuideVoiceState({ activeKey: key, status: 'speaking' });
                const url = URL.createObjectURL(blob);
                audioUrlRef.current = url;
                await new Promise(resolve => {
                    const a = sharedAudioRef.current;
                    a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                    try { a.load(); } catch (_) {}
                    const p = a.play();
                    if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                });
                if (voiceSessionRef.current === sid) setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, [guideVoiceState, stopGuideVoice, appsScriptUrl, showToast]);

            const currentStepVoiceGuide = useMemo(() => {
                if (screen === 'landing') return null;
                if (screen === 'auth') {
                    if (authStep === 1) return { key: 'idx_guide_auth1', text: 'ขั้นตอนเข้าสู่ระบบค่ะ กรุณากรอกเลขที่ใบอนุญาตประกอบวิชาชีพ เพื่อตรวจสอบข้อมูลเดิมและสิทธิ์เทียบโอนชั่วโมงอัตโนมัติค่ะ' };
                    if (authStep === 2) return { key: 'idx_guide_auth2', text: 'กรุณาเลือกกลุ่มวิชาชีพและกรอกข้อมูลส่วนตัวให้ครบถ้วนค่ะ หากเป็นพยาบาลวิชาชีพ ระบบจะแสดงรหัสกิจกรรมซีเอ็นอียูและจำนวนหน่วยคะแนนให้อัตโนมัติค่ะ' };
                    return { key: 'idx_guide_auth3', text: 'กรุณากรอกรหัสยืนยันตัวตนโอทีพีหกหลักที่ส่งไปยังอีเมลของท่าน เพื่อเข้าสู่ห้องเรียนอย่างปลอดภัยค่ะ' };
                }
                if (screen === 'pretest') return { key: 'idx_guide_pretest', text: 'ขั้นตอนที่หนึ่ง แบบทดสอบก่อนเรียนค่ะ เพื่อวัดพื้นฐานทั้งสี่หมวดคลินิกและให้เอไอวางแผนการเรียนเฉพาะบุคคลให้ท่านค่ะ' };
                if (screen === 'dashboard') return { key: 'idx_guide_dash', text: 'ยินดีต้อนรับสู่ห้องเรียนหลัก อาร์เจ คลาวด์ ออร์แกน สองจุดศูนย์ ค่ะ ท่านสามารถศึกษาบทเรียน เข้าห้องฝึกสื่อสารสามมิติ เอไอสกิลแล็บ และทำแบบทดสอบหลังเรียนได้จากหน้านี้เลยค่ะ' };
                if (screen === 'posttest') return { key: 'idx_guide_posttest', text: 'ขั้นตอนที่สี่ แบบทดสอบหลังเรียนค่ะ ทำคะแนนตั้งแต่แปดสิบเปอร์เซ็นต์ขึ้นไปเพื่อปลดล็อกประกาศนียบัตรดิจิทัลค่ะ' };
                if (screen === 'cert_confirm') return { key: 'idx_guide_cert_cfm', text: 'ยินดีด้วยค่ะ ท่านสอบผ่านเกณฑ์มาตรฐานแล้ว กรุณาตรวจสอบตัวสะกดชื่อ และทำแบบประเมินความพึงพอใจเพื่อออกประกาศนียบัตรค่ะ' };
                if (screen === 'certificate') {
                    return {
                        key: `idx_guide_cert_${userCreditMeta.creditType}`,
                        text: userCreditMeta.isNurseCneu
                            ? 'ยินดีด้วยค่ะ ประกาศนียบัตรและหนังสือรับรองหน่วยคะแนนซีเอ็นอียูของท่านพร้อมดาวน์โหลดแล้วค่ะ'
                            : 'ยินดีด้วยค่ะ ประกาศนียบัตรและหนังสือรับรองชั่วโมงการฝึกอบรมของท่านพร้อมดาวน์โหลดแล้วค่ะ'
                    };
                }
                return null;
            }, [screen, authStep, userCreditMeta]);

            useEffect(() => {
                if (!currentStepVoiceGuide || isAdminPreview) return;
                if (autoPlayedGuidesRef.current.has(currentStepVoiceGuide.key)) return;
                autoPlayedGuidesRef.current.add(currentStepVoiceGuide.key);
                const tm = setTimeout(() => playGuideVoice(currentStepVoiceGuide.key, currentStepVoiceGuide.text, { silentFail: true }), 460);
                return () => clearTimeout(tm);
            }, [currentStepVoiceGuide, isAdminPreview, playGuideVoice]);

            // ============================================================================
            // 6. AUTH, PROGRESS, QUIZ & CERTIFICATE HANDLERS
            // ============================================================================
            const persistUserUpdate = async (nextUser) => {
                setUser(nextUser);
                saveSessionTwoLayer(nextUser);
                if (!isAdminPreview && fbDb && nextUser?.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)), nextUser, { merge: true });
                    } catch (_) {}
                }
            };

            const handleQuickDemoLogin = (profGroup) => {
                stopGuideVoice();
                const isNurse = profGroup === 'พยาบาล';
                const demoUser = {
                    id: isNurse ? '4511128901' : (profGroup === 'แพทย์' ? '1100123456' : '7700128904'),
                    license: isNurse ? '4511128901' : (profGroup === 'แพทย์' ? '1100123456' : '7700128904'),
                    name: isNurse ? 'พว.กัญญารัตน์ วัฒนากูล' : (profGroup === 'แพทย์' ? 'นพ.กิตติพงษ์ สุวรรณภูมิ' : 'ภญ.ปิยะนุช ศรีสวัสดิ์'),
                    nameEN: isNurse ? 'Kanyarat Wattanakul, RN' : (profGroup === 'แพทย์' ? 'Kittipong Suwannaphum, MD' : 'Piyanuch Srisawat, PharmD'),
                    professionGroup: profGroup,
                    cneuEligible: isNurse,
                    position: isNurse ? 'พยาบาลวิชาชีพชำนาญการ (TC)' : (profGroup === 'แพทย์' ? 'นายแพทย์ชำนาญการพิเศษ' : 'เภสัชกรคลินิก'),
                    department: 'เขตสุขภาพที่ 13 (กทม. / กรมการแพทย์)',
                    hospital: 'รพ.ราชวิถี',
                    province: 'กรุงเทพมหานคร',
                    email: 'demo@rjcloud.organ',
                    phone: '0812345678',
                    userType: 'เรียนต่อเนื่อง',
                    studyHoursExempt: true,
                    progress: 100,
                    pretest: '4/5',
                    posttest: '5/5',
                    status: 'ผ่าน',
                    skillLabPassed: true,
                    skillLabBestScore: 90,
                    certificateCode: isNurse ? 'RJC-2027-DEMO01' : (profGroup === 'แพทย์' ? 'RJC-2027-MD0002' : 'RJC-2027-ALLIED4'),
                    certificateIssuedAt: new Date().toISOString()
                };
                setUser(demoUser);
                saveSessionTwoLayer(demoUser);
                setScreen('dashboard');
                showToast(`เข้าสู่โหมดตัวอย่างกลุ่ม "${profGroup}" เรียบร้อยแล้วค่ะ (ลองกดดูใบประกาศฯ ขั้นที่ 5 เทียบสิทธิ์ได้ทันที!)`);
            };

            const handleAuthStep1Lookup = async (e) => {
                e.preventDefault();
                const clean = licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (clean.length < 4) { showToast('กรุณากรอกเลขที่ใบอนุญาตประกอบวิชาชีพอย่างน้อย 4 หลักค่ะ', 'error'); return; }
                setAuthBusy(true);
                let found = null;
                if (!isAdminPreview && fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', clean));
                        if (snap.exists()) found = { id: snap.id, ...snap.data() };
                    } catch (_) {}
                }
                if (found) {
                    const prof = resolveProfessionGroupSafe(found);
                    setAuthProfile(p => ({
                        ...p,
                        professionGroup: prof,
                        name: found.name || '', nameEN: found.nameEN || '', position: found.position || '',
                        department: found.department || p.department, hospital: found.hospital || p.hospital,
                        province: found.province || p.province, email: found.email || '', phone: found.phone || '',
                        userType: found.studyHoursExempt ? 'เรียนต่อเนื่อง' : (found.userType || 'เรียนใหม่'),
                        hoursActivityName: found.hoursActivityName || ''
                    }));
                    showToast('พบข้อมูลเดิมของท่านในระบบ ดึงมาเติมให้อัตโนมัติแล้วค่ะ');
                }
                setAuthBusy(false);
                setAuthStep(2);
            };

            const handleAuthStep2SendOtp = async (e) => {
                e.preventDefault();
                if (!authProfile.professionGroup) { showToast('กรุณาเลือกกลุ่มวิชาชีพ (พยาบาล / แพทย์ / บุคลากรสหวิชาชีพ) ค่ะ', 'error'); return; }
                if (!authProfile.name.trim() || !authProfile.email.includes('@')) { showToast('กรุณากรอกชื่อ–นามสกุลและอีเมลให้ถูกต้องค่ะ', 'error'); return; }
                setAuthBusy(true);
                const code = String(Math.floor(100000 + Math.random() * 900000));
                let delivered = false;
                if (appsScriptUrl && navigator.onLine && !isAdminPreview) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const raw = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'sendOTP', email: authProfile.email.trim(), otp: code, name: authProfile.name.trim() }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await raw.text()) || '{}');
                        if (d?.status === 'success') delivered = true;
                    } catch (_) {}
                }
                setSentOtpCode(delivered ? code : '123456');
                setAuthBusy(false);
                setAuthStep(3);
                showToast(delivered ? `ส่งรหัส OTP 6 หลักไปยัง ${authProfile.email} แล้วค่ะ` : 'โหมดทดสอบ/ออฟไลน์: ใช้รหัส OTP 123456 เพื่อเข้าสู่ระบบได้เลยค่ะ', 'info');
            };

            const handleAuthStep3Verify = async (e) => {
                e.preventDefault();
                if (otpInput.trim() !== sentOtpCode && otpInput.trim() !== '123456') {
                    showToast('รหัส OTP ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้งค่ะ', 'error');
                    return;
                }
                const cleanLic = licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim();
                const isNurse = authProfile.professionGroup === 'พยาบาล';
                const isCont = authProfile.userType === 'เรียนต่อเนื่อง';
                const nextUser = {
                    id: cleanLic, license: cleanLic,
                    name: authProfile.name.trim(), nameEN: authProfile.nameEN.trim(),
                    professionGroup: authProfile.professionGroup, cneuEligible: isNurse,
                    position: authProfile.position.trim() || authProfile.professionGroup,
                    department: authProfile.department, hospital: authProfile.hospital.trim(), province: authProfile.province.trim(),
                    email: authProfile.email.trim(), phone: authProfile.phone.trim(),
                    userType: isCont ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    studyHoursExempt: isCont,
                    progress: isCont ? 100 : 0,
                    hoursActivityName: isCont ? (authProfile.hoursActivityName.trim() || 'ผู้เรียนต่อเนื่อง / ผ่านการอบรมมาตรฐานมาก่อนแล้ว') : '',
                    trainingHours: String(cneuConfig.trainingHours || liveConfig.hours || 8),
                    cneuActivityCode: isNurse ? (cneuConfig.activityCode || '') : '',
                    cneuCredits: isNurse ? (cneuConfig.cneuCredits || '') : '',
                    pretest: '-', posttest: '-', status: 'กำลังเรียน', skillLabPassed: false, skillLabHistory: []
                };
                await persistUserUpdate(nextUser);
                stopGuideVoice();
                setScreen(nextUser.pretest && nextUser.pretest !== '-' ? 'dashboard' : 'pretest');
                showToast(`ยินดีต้อนรับคุณ ${nextUser.name} เข้าสู่ rjcloud.organ 2.0 ค่ะ`);
            };

            const handleSubmitQuiz = async (type) => {
                const total = quizList.length;
                if (Object.keys(quizAnswers).length < total) {
                    showToast(`กรุณาตอบให้ครบทั้ง ${total} ข้อก่อนส่งคำตอบค่ะ`, 'error');
                    return;
                }
                let correct = 0;
                quizList.forEach(q => { if (Number(quizAnswers[q.id]) === Number(q.answer)) correct += 1; });
                const pct = Math.round((correct / Math.max(1, total)) * 100);
                const scoreStr = `${correct}/${total}`;
                setQuizAnswers({});

                if (type === 'pretest') {
                    await persistUserUpdate({ ...user, pretest: scoreStr });
                    setScreen('dashboard');
                    showToast(`ทำ Pre-test เรียบร้อย (${scoreStr} • ${pct}%) เข้าสู่ห้องเรียนหลักได้เลยค่ะ`);
                } else {
                    const passed = pct >= MIN_POSTTEST_PERCENT;
                    await persistUserUpdate({ ...user, posttest: scoreStr, status: passed ? 'ผ่าน' : (user?.status || 'กำลังเรียน') });
                    if (passed) {
                        setScreen('cert_confirm');
                        showToast(`ยินดีด้วยค่ะ! ท่านสอบ Post-test ผ่านเกณฑ์ (${pct}%) ปลดล็อกใบประกาศนียบัตรแล้วค่ะ`);
                    } else {
                        setScreen('dashboard');
                        showToast(`คะแนน Post-test ได้ ${pct}% (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%) สามารถทบทวนและสอบใหม่ได้ค่ะ`, 'info');
                    }
                }
            };

            const handleClaimCertificate = async (e) => {
                e.preventDefault();
                if (!certNameTH.trim()) { showToast('กรุณาระบุชื่อ–นามสกุลภาษาไทยที่จะพิมพ์บนประกาศนียบัตรค่ะ', 'error'); return; }
                const susRaw = SUS_QUESTIONS.reduce((acc, q) => acc + (q.pos ? (Number(susAnswers[q.key] || 3) - 1) : (5 - Number(susAnswers[q.key] || 3))), 0);
                const susScore = Math.round((susRaw / (SUS_QUESTIONS.length * 4)) * 100);
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${String(user?.license || '0000').slice(-4)}${Math.floor(10 + Math.random() * 89)}`;
                const issuedAt = user?.certificateIssuedAt || new Date().toISOString();

                const nextUser = {
                    ...user,
                    name: certNameTH.trim(),
                    nameEN: certNameEN.trim(),
                    hospital: certHospital.trim() || user?.hospital || '',
                    satisfactionScore: Number(csatScore),
                    susScore,
                    status: 'ผ่าน',
                    certificateClaimed: true,
                    certificateCode: code,
                    certificateIssuedAt: issuedAt
                };
                await persistUserUpdate(nextUser);

                // บันทึกทะเบียนสาธารณะ certificates/{code} (PDPA-Safe • แยก CNEU เฉพาะพยาบาล)
                if (!isAdminPreview && fbDb) {
                    try {
                        const pubPayload = typeof CERT.buildPublicCertPayload === 'function'
                            ? CERT.buildPublicCertPayload({ code, finalName: nextUser.name, nameEN: nextUser.nameEN, finalHospital: nextUser.hospital, license: nextUser.license, user: nextUser, certTemplate, cneuConfig, issuedAt })
                            : { code, name: nextUser.name, nameEN: nextUser.nameEN, license: nextUser.license, professionGroup: userCreditMeta.professionGroup, cneuEligible: userCreditMeta.isNurseCneu, creditType: userCreditMeta.creditType, creditLabelTH: userCreditMeta.lineTextTH, trainingHours: userCreditMeta.trainingHours, hospital: nextUser.hospital, courseTitleTH: certTemplate.courseTitleTH, orgTitleTH: certTemplate.orgTitleTH, cneuActivityCode: userCreditMeta.isNurseCneu ? userCreditMeta.cneuActivityCode : '', cneuCredits: userCreditMeta.isNurseCneu ? userCreditMeta.cneuCredits : '', issuedAt, status: 'valid' };
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), pubPayload, { merge: true });
                    } catch (_) {}
                }

                setScreen('certificate');
                showToast('ออกประกาศนียบัตรดิจิทัลพร้อมรหัส QR ตรวจสอบความถูกต้องเรียบร้อยแล้วค่ะ');
            };

            const handleOpenSkillLab = () => {
                stopGuideVoice();
                if (user?.id) saveSessionTwoLayer(user);
                window.location.href = isAdminPreview ? './aiskilllab.html?admin_preview=1' : './aiskilllab.html';
            };

            const handleMarkLessonStudied = async () => {
                const nextPct = Math.min(100, Math.max(studyPct + 20, Math.round(((activeLessonIdx + 1) / Math.max(1, lessons.length)) * 100)));
                await persistUserUpdate({ ...user, progress: nextPct });
                showToast(`บันทึกเวลาเรียนสะสม ${nextPct}% เรียบร้อยค่ะ`);
            };

            const handleSaveProfileEdit = async (e) => {
                e.preventDefault();
                const isNurse = editForm.professionGroup === 'พยาบาล';
                await persistUserUpdate({
                    ...user,
                    professionGroup: editForm.professionGroup,
                    cneuEligible: isNurse,
                    name: editForm.name.trim() || user.name,
                    nameEN: editForm.nameEN.trim(),
                    position: editForm.position.trim(),
                    hospital: editForm.hospital.trim(),
                    phone: editForm.phone.trim()
                });
                setEditProfileOpen(false);
                showToast('อัปเดตข้อมูลโปรไฟล์และกลุ่มวิชาชีพเรียบร้อยค่ะ');
            };

            // ============================================================================
            // 7. RENDER VIEWS
            // ============================================================================
            if (screen === 'landing') {
                return (
                    <>
                        <LandingHeroScreen
                            hasSavedSession={Boolean(user?.id)}
                            onResumeDashboard={() => setScreen('dashboard')}
                            onStartAuth={() => setScreen('auth')}
                        />
                        <ToastBanner toast={toast} />
                    </>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="no-print-letter spatial-aura" />
                    <div className="no-print-letter spatial-grid" />
                    {guideVoiceState.status !== 'idle' && (
                        <div className="no-print-letter fixed top-0 left-0 right-0 z-50 pointer-events-none"><div className="rjc-ambient-bar" /></div>
                    )}

                    {/* Top App Header */}
                    <header className="no-print-letter sticky top-0 z-30 spatial-header">
                        <div className="max-w-6xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <button type="button" onClick={() => { stopGuideVoice(); setScreen(user?.id && screen !== 'dashboard' ? 'dashboard' : 'landing'); }} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive shrink-0">
                                    <Icon name={user?.id && screen !== 'dashboard' ? 'ArrowLeft' : 'Home'} size={17} />
                                </button>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">2.0</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        {user?.name ? `${user.name} • ${userCreditMeta.professionGroup}` : 'Organ Transplantation Center of Rajavithi Hospital'}
                                    </span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                {currentStepVoiceGuide && (
                                    <StepVoiceButton
                                        activeKey={guideVoiceState.activeKey}
                                        targetKey={currentStepVoiceGuide.key}
                                        status={guideVoiceState.status}
                                        onToggle={() => playGuideVoice(currentStepVoiceGuide.key, currentStepVoiceGuide.text)}
                                    />
                                )}
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                {user?.id && (
                                    <button type="button" onClick={() => { stopGuideVoice(); clearSessionTwoLayer(); setUser(null); setScreen('landing'); showToast('ออกจากระบบเรียบร้อยค่ะ'); }} className="spatial-soft px-2.5 py-2 rounded-xl text-xs font-bold text-rose-400">
                                        <Icon name="LogOut" size={15} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* ==================== SCREEN: AUTH (3 STEPS • CONDITIONAL CNEU BY PROFESSION) ==================== */}
                    {screen === 'auth' && (
                        <main className="no-print-letter relative z-10 max-w-xl w-full mx-auto px-4 py-7 space-y-5 flex-1">
                            {authStep === 1 && (
                                <form onSubmit={handleAuthStep1Lookup} className="spatial-card rounded-[2rem] p-6 sm:p-7 space-y-5">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">STEP 1 / 3 • เข้าสู่ระบบ / ลงทะเบียนผู้เรียน</span>
                                        <h1 className="font-display font-extrabold text-xl text-primary-adaptive mt-1">ระบุเลขที่ใบอนุญาตประกอบวิชาชีพ</h1>
                                        <p className="text-xs text-secondary-adaptive mt-1">ระบบจะตรวจสอบข้อมูลเดิมและสิทธิ์เทียบโอนชั่วโมงอบรม Onsite ให้อัตโนมัติค่ะ</p>
                                    </div>
                                    <input
                                        type="text"
                                        required
                                        value={licenseInput}
                                        onChange={e => setLicenseInput(e.target.value)}

                                    </button>

                                    <div className="pt-3 border-t border-white/10 space-y-2">
                                        <p className="text-[11px] text-muted-adaptive font-semibold text-center">ทดลองเข้าโหมดตัวอย่างทันที (เทียบการแสดงผล CNEU แยก 3 วิชาชีพ):</p>
                                        <div className="grid grid-cols-3 gap-1.5 text-[11px]">
                                            <button type="button" onClick={() => handleQuickDemoLogin('พยาบาล')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-accent-adaptive">พยาบาล (CNEU)</button>
                                            <button type="button" onClick={() => handleQuickDemoLogin('แพทย์')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-prism-adaptive">แพทย์ (ชม.อบรม)</button>
                                            <button type="button" onClick={() => handleQuickDemoLogin('บุคลากรสหวิชาชีพ')} className="spatial-soft py-2 px-2 rounded-xl font-bold text-indigo-300">สหวิชาชีพ</button>
                                        </div>
                                    </div>
                                </form>
                            )}

                            {authStep === 2 && (
                                <form onSubmit={handleAuthStep2SendOtp} className="spatial-card rounded-[2rem] p-6 sm:p-7 space-y-4">
                                    <div className="flex items-center justify-between">
                                        <button type="button" onClick={() => setAuthStep(1)} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive">← กลับ</button>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive">STEP 2 / 3 • รหัส {licenseInput}</span>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-secondary-adaptive">1. เลือกกลุ่มวิชาชีพของท่าน *</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            {PROFESSION_OPTIONS.map(opt => {
                                                const active = authProfile.professionGroup === opt.id;
                                                return (
                                                    <button
                                                        key={opt.id}
                                                        type="button"
                                                        onClick={() => setAuthProfile(p => ({ ...p, professionGroup: opt.id, position: p.position || opt.defaultPos }))}
                                                        className={`text-left p-3 rounded-2xl border transition-all ${active ? 'bg-aurora-500/20 border-aurora-400 shadow' : 'spatial-soft'}`}
                                                    >
                                                        <div className="flex items-center justify-between">
                                                            <span className="font-display font-extrabold text-sm text-primary-adaptive">{opt.label}</span>
                                                            <Icon name={opt.icon} size={15} className={active ? 'text-accent-adaptive' : 'text-muted-adaptive'} />
                                                        </div>
                                                        <p className="text-[10.5px] text-muted-adaptive mt-0.5 leading-snug">{opt.desc}</p>
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {/* เงื่อนไขสำคัญ: แสดงกล่อง CNEU เฉพาะเมื่อเลือก "พยาบาล" เท่านั้น (แพทย์/สหวิชาชีพไม่แสดงข้อความ CNEU ใดๆ) */}
                                        {authProfile.professionGroup === 'พยาบาล' && (cneuConfig.activityCode || cneuConfig.cneuCredits) && (
                                            <div className="p-3.5 rounded-2xl bg-aurora-500/15 border border-aurora-400/50 space-y-1">
                                                <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">✓ สิทธิ์รับหน่วยคะแนนการศึกษาต่อเนื่องทางการพยาบาล (CNEU • สภาการพยาบาล)</p>
                                                <p className="font-display font-extrabold text-sm text-primary-adaptive">
                                                    รหัสกิจกรรม CNEU: <span className="font-mono text-accent-adaptive">{cneuConfig.activityCode}</span>
                                                    {cneuConfig.cneuCredits && <> • จำนวน <span className="font-mono text-accent-adaptive">{cneuConfig.cneuCredits}</span> หน่วยคะแนน</>}
                                                </p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                        <div><label className="block font-bold text-secondary-adaptive mb-1">คำนำหน้า ชื่อ–นามสกุล *</label><input required value={authProfile.name} onChange={e => setAuthProfile(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                        <div><label className="block font-bold text-secondary-adaptive mb-1">ตำแหน่ง</label><input value={authProfile.position} onChange={e => setAuthProfile(p => ({ ...p, position: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                        <div><label className="block font-bold text-secondary-adaptive mb-1">เขตสุขภาพ / สังกัด</label><select value={authProfile.department} onChange={e => setAuthProfile(p => ({ ...p, department: e.target.value }))} className="touch-target spatial-input w-full px-3 py-2.5 rounded-xl text-sm">{HEALTH_REGIONS.map(r => <option key={r} value={r}>{r}</option>)}</select></div>
                                        <div><label className="block font-bold text-secondary-adaptive mb-1">โรงพยาบาล / หน่วยงาน *</label><input required value={authProfile.hospital} onChange={e => setAuthProfile(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                        <div className="sm:col-span-2"><label className="block font-bold text-secondary-adaptive mb-1">อีเมลสำหรับรับรหัส OTP *</label><input required type="email" value={authProfile.email} onChange={e => setAuthProfile(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                    </div>

                                    <button type="submit" disabled={authBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                        {authBusy ? 'กำลังส่งรหัส OTP...' : 'ส่งรหัส OTP ยืนยันตัวตนทางอีเมล →'}
                                    </button>
                                </form>
                            )}

                            {authStep === 3 && (
                                <form onSubmit={handleAuthStep3Verify} className="spatial-card rounded-[2rem] p-6 sm:p-7 space-y-5 text-center">
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">STEP 3 / 3 • ยืนยันรหัส OTP 6 หลัก</span>
                                    <h2 className="font-display font-extrabold text-xl text-primary-adaptive">กรอกรหัส OTP ที่ส่งไปยังอีเมล</h2>
                                    <p className="text-xs text-secondary-adaptive">{authProfile.email} (โหมดทดสอบใช้ <b>123456</b>)</p>
                                    <input required maxLength={6} value={otpInput} onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))} placeholder="••••••" className="touch-target spatial-input w-full max-w-[240px] mx-auto text-center font-mono text-2xl tracking-[0.4em] font-extrabold py-3 rounded-2xl" />
                                    <button type="submit" className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">ยืนยันและเข้าสู่ห้องเรียน →</button>
                                </form>
                            )}
                        </main>
                    )}

                    {/* ==================== SCREEN: PRE-TEST / POST-TEST ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && (
                        <main className="no-print-letter relative z-10 max-w-3xl w-full mx-auto px-4 py-6 space-y-4 flex-1">
                            <div className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">{screen === 'pretest' ? 'STEP 1 • PRE-TEST DIAGNOSTIC' : 'STEP 4 • POST-TEST (เกณฑ์ผ่าน ≥ 80%)'}</span>
                                        <h1 className="font-display font-extrabold text-xl text-primary-adaptive">{screen === 'pretest' ? 'แบบทดสอบก่อนเรียน' : 'แบบทดสอบหลังเรียนมาตรฐาน 2027'}</h1>
                                    </div>
                                    <span className="font-mono text-xs font-bold text-prism-adaptive">{Object.keys(quizAnswers).length}/{quizList.length} ข้อ</span>

                                <div className="space-y-4">
                                    {quizList.map((q, qi) => (
                                        <div key={q.id || qi} className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs sm:text-sm">
                                            <p className="font-bold text-primary-adaptive"><span className="font-mono text-prism-adaptive mr-1.5">{qi + 1}.</span>{q.question}</p>
                                            <div className="space-y-1.5">
                                                {(q.options || []).map((op, oi) => (
                                                    <button key={oi} type="button" onClick={() => setQuizAnswers(p => ({ ...p, [q.id]: oi }))} className={`w-full text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition-all ${Number(quizAnswers[q.id]) === oi ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                        {op}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button type="button" onClick={() => handleSubmitQuiz(screen)} className="rjc2-pill-btn touch-target w-full py-4 rounded-full font-display font-extrabold text-sm">
                                    {screen === 'pretest' ? 'ส่งคำตอบ Pre-test & เข้าสู่ห้องเรียนหลัก →' : 'ส่งคำตอบ Post-test & ตรวจผลสอบ →'}
                                </button>
                            </div>
                        </main>
                    )}

                    {/* ==================== SCREEN: MAIN DASHBOARD ==================== */}
                    {screen === 'dashboard' && user && (
                        <main className="no-print-letter relative z-10 max-w-6xl w-full mx-auto px-3.5 sm:px-6 py-5 space-y-5 flex-1">
                            {/* 5-Step Progress Tracker */}
                            <section className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">{userCreditMeta.professionGroup} • {userCreditMeta.lineTextTH}</span>
                                        <h1 className="font-display font-extrabold text-lg sm:text-xl text-primary-adaptive">ยินดีต้อนรับ, {user.name}</h1>
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {[{ id: 'lessons', l: 'บทเรียน', i: 'BookOpen' }, { id: 'phrasebook', l: 'คลังคำพูด', i: 'MessageSquareHeart' }, { id: 'live', l: 'Live สด', i: 'Radio' }, { id: 'profile', l: 'โปรไฟล์', i: 'User' }].map(t => (
                                            <button key={t.id} type="button" onClick={() => setDashTab(t.id)} className={`px-3 py-1.5 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 ${dashTab === t.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                <Icon name={t.i} size={14} /> {t.l}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                    <button type="button" onClick={() => setScreen('pretest')} className={`p-3 rounded-2xl border text-left ${user.pretest && user.pretest !== '-' ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] text-prism-adaptive block">1. PRE-TEST</span>
                                        <span className="font-bold text-primary-adaptive">{user.pretest && user.pretest !== '-' ? `เสร็จแล้ว (${user.pretest})` : 'ทำแบบทดสอบ →'}</span>
                                    </button>
                                    <div className={`p-3 rounded-2xl border ${isStudyEnough ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] text-prism-adaptive block">2. ชั่วโมงอบรม</span>
                                        <span className="font-bold text-accent-adaptive">{isExempt ? 'ครบแล้ว (เทียบโอน)' : `${studyPct}% / ${MIN_STUDY_PERCENT}%`}</span>
                                    </div>
                                    <button type="button" onClick={handleOpenSkillLab} className={`p-3 rounded-2xl border text-left ${isLabDone ? 'bg-aurora-500/15 border-aurora-400/45' : 'bg-prism-500/15 border-prism-400/50'}`}>
                                        <span className="font-mono text-[10px] text-prism-adaptive block">3. AI SKILL LAB 3D</span>
                                        <span className="font-bold text-primary-adaptive">{isLabDone ? `ผ่านแล้ว (${user.skillLabBestScore || 85})` : 'เข้าห้องฝึก 3 มิติ →'}</span>
                                    </button>
                                    <button type="button" onClick={() => canTakePosttest ? setScreen('posttest') : showToast('กรุณาสะสมเวลาเรียนครบและผ่าน AI Skill Lab ก่อนทำ Post-test ค่ะ', 'info')} className={`p-3 rounded-2xl border text-left ${hasPassedPosttest ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] text-prism-adaptive block">4. POST-TEST</span>
                                        <span className="font-bold text-primary-adaptive">{hasPassedPosttest ? `ผ่านแล้ว (${user.posttest || '≥80%'})` : (canTakePosttest ? 'ทำ Post-test →' : 'ล็อกอยู่')}</span>
                                    </button>
                                    <button type="button" onClick={() => hasPassedPosttest ? setScreen(user.certificateCode ? 'certificate' : 'cert_confirm') : showToast('สอบผ่าน Post-test ≥ 80% เพื่อปลดล็อกประกาศนียบัตรค่ะ', 'info')} className={`col-span-2 sm:col-span-1 p-3 rounded-2xl border text-left ${user.certificateCode ? 'bg-amber-400/20 border-amber-400/55' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] text-amber-300 block">5. ประกาศฯ</span>
                                        <span className="font-bold text-primary-adaptive">{user.certificateCode ? 'ดูใบประกาศฯ →' : (hasPassedPosttest ? 'ยืนยันออกใบฯ →' : 'รอผลสอบ')}</span>
                                    </button>
                                </div>
                            </section>

                            {dashTab === 'lessons' && (
                                <section className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                    <div className="lg:col-span-8 spatial-card rounded-[1.75rem] p-5 space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">บทเรียนที่ {activeLessonIdx + 1} / {lessons.length}</span>
                                            <button type="button" onClick={handleOpenSkillLab} className="rjc2-pill-btn px-4 py-1.5 rounded-full font-display font-extrabold text-xs">
                                                เปิดห้องฝึกสื่อสาร 3 มิติ AI Skill Lab →
                                            </button>
                                        </div>
                                        <h2 className="font-display font-extrabold text-lg text-primary-adaptive">{lessons[activeLessonIdx]?.title}</h2>
                                        {lessons[activeLessonIdx]?.videoId ? (
                                            <div className="w-full aspect-video rounded-2xl overflow-hidden bg-black">
                                                <iframe title="Lesson Video" src={`https://drive.google.com/file/d/${lessons[activeLessonIdx].videoId}/preview`} className="w-full h-full border-0" allow="autoplay" />
                                            </div>
                                        ) : (
                                            <div className="spatial-soft rounded-2xl p-6 space-y-2 text-xs sm:text-sm">
                                                <p className="font-bold text-accent-adaptive">สรุปสาระสำคัญ 1 นาที (อ่านได้แม้ออฟไลน์ใน ICU/ER):</p>
                                                <p className="text-secondary-adaptive leading-relaxed">{lessons[activeLessonIdx]?.summary || 'เนื้อหาหลักสูตรมาตรฐานปี 2027 ด้านการรับบริจาคและปลูกถ่ายอวัยวะ โรงพยาบาลราชวิถี'}</p>
                                            </div>
                                        )}
                                        <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                                            <button type="button" onClick={handleMarkLessonStudied} className="rjc2-pill-btn touch-target px-5 py-2.5 rounded-full font-display font-extrabold text-xs">
                                                ✓ บันทึกว่าเรียนบทนี้แล้ว ({studyPct}%)
                                            </button>
                                            {activeLessonIdx + 1 < lessons.length && (
                                                <button type="button" onClick={() => setActiveLessonIdx(i => Math.min(lessons.length - 1, i + 1))} className="spatial-soft px-4 py-2.5 rounded-full text-xs font-bold text-prism-adaptive">
                                                    บทถัดไป →
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    <div className="lg:col-span-4 spatial-card rounded-[1.75rem] p-4 space-y-2 max-h-[460px] overflow-y-auto custom-scrollbar">
                                        <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase px-1">สารบัญบทเรียน ({lessons.length} บท)</p>
                                        {lessons.map((ls, idx) => (
                                            <button key={ls.id || idx} type="button" onClick={() => setActiveLessonIdx(idx)} className={`w-full text-left p-3 rounded-2xl border text-xs transition-all ${activeLessonIdx === idx ? 'bg-aurora-500/20 border-aurora-400 font-bold text-primary-adaptive' : 'spatial-soft text-secondary-adaptive'}`}>
                                                {ls.title}
                                            </button>
                                        ))}
                                    </div>
                                </section>
                            )}

                            {dashTab === 'phrasebook' && (
                                <section className="spatial-card rounded-[1.75rem] p-5 space-y-3">
                                    <h2 className="font-display font-extrabold text-lg text-primary-adaptive">คลังคำพูดพกพาหน้างานจริง (Pocket Phrasebook • TH / EN)</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                        {POCKET_PHRASES.map((p, i) => (
                                            <div key={i} className="spatial-soft rounded-2xl p-4 space-y-1.5">
                                                <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">{p.cat}</span>
                                                <p className="text-primary-adaptive font-semibold leading-relaxed">“{p.th}”</p>
                                                <p className="text-muted-adaptive italic leading-relaxed">{p.en}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            )}

                            {dashTab === 'live' && (
                                <section className="spatial-card rounded-[1.75rem] p-6 text-center space-y-3">
                                    <span className={`px-3 py-1 rounded-full font-mono text-[10px] font-bold ${liveConfig.status === 'live' ? 'bg-rose-500 text-white animate-pulse' : 'spatial-soft text-muted-adaptive'}`}>
                                        {liveConfig.status === 'live' ? '● ON AIR กำลังถ่ายทอดสด' : 'OFFLINE • ยังไม่มีการถ่ายทอดสดขณะนี้'}
                                    </span>
                                    <h2 className="font-display font-extrabold text-lg text-primary-adaptive">{liveConfig.topic}</h2>
                                    {liveConfig.url && <div className="w-full max-w-3xl mx-auto aspect-video rounded-2xl overflow-hidden bg-black"><iframe title="Live Stream" src={liveConfig.url} className="w-full h-full border-0" allowFullScreen /></div>}
                                </section>
                            )}

                            {dashTab === 'profile' && (
                                <section className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">LEARNER PROFILE • PDPA SELF-SERVICE</span>
                                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive">{user.name}</h2>
                                        </div>
                                        <button type="button" onClick={() => { setEditForm({ professionGroup: userCreditMeta.professionGroup, name: user.name || '', nameEN: user.nameEN || '', position: user.position || '', hospital: user.hospital || '', phone: user.phone || '' }); setEditProfileOpen(v => !v); }} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-prism-adaptive">
                                            {editProfileOpen ? 'ปิดฟอร์มแก้ไข' : 'แก้ไขข้อมูล / เปลี่ยนกลุ่มวิชาชีพ'}
                                        </button>
                                    </div>

                                    {!editProfileOpen ? (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">กลุ่มวิชาชีพ &amp; สิทธิ์การรับรอง</span><span className="font-bold text-accent-adaptive">{userCreditMeta.professionGroup} • {userCreditMeta.lineTextTH}</span></div>
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">{userCreditMeta.licenseLabelTH}</span><span className="font-mono font-bold text-prism-adaptive">{user.license}</span></div>
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">โรงพยาบาล / สังกัด</span><span className="font-bold text-primary-adaptive">{user.hospital} • {user.department}</span></div>
                                            <div className="spatial-soft p-3.5 rounded-2xl"><span className="text-muted-adaptive block">สถานะชั่วโมงอบรม</span><span className="font-bold text-accent-adaptive">{isExempt ? `ชั่วโมงครบ (เทียบโอน) — ${user.hoursActivityName || ''}` : `สะสมแล้ว ${studyPct}%`}</span></div>
                                        </div>
                                    ) : (
                                        <form onSubmit={handleSaveProfileEdit} className="space-y-3 text-xs">
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                {PROFESSION_OPTIONS.map(opt => (
                                                    <button key={opt.id} type="button" onClick={() => setEditForm(p => ({ ...p, professionGroup: opt.id }))} className={`p-2.5 rounded-xl border font-bold ${editForm.professionGroup === opt.id ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive' : 'spatial-soft text-secondary-adaptive'}`}>{opt.label}</button>
                                                ))}
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <input value={editForm.name} onChange={e => setEditForm(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ-นามสกุล (ไทย)" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                                <input value={editForm.nameEN} onChange={e => setEditForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="Full Name (EN)" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                                <input value={editForm.position} onChange={e => setEditForm(p => ({ ...p, position: e.target.value }))} placeholder="ตำแหน่ง" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                                <input value={editForm.hospital} onChange={e => setEditForm(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล" className="touch-target spatial-input px-3.5 py-2 rounded-xl text-sm" />
                                            </div>
                                            <button type="submit" className="rjc2-pill-btn px-6 py-2.5 rounded-full font-display font-extrabold text-xs">บันทึกการเปลี่ยนแปลง ✓</button>
                                        </form>
                                    )}
                                </section>
                            )}
                        </main>
                    )}

                    {/* ==================== SCREEN: CERT CONFIRM + CSAT + SUS (R2R) ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <main className="no-print-letter relative z-10 max-w-2xl w-full mx-auto px-4 py-6 flex-1">
                            <form onSubmit={handleClaimCertificate} className="spatial-card rounded-[2rem] p-6 sm:p-7 space-y-5">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">STEP 5 • ยืนยันชื่อ &amp; ประเมินผลความพึงพอใจ (SUS • R2R)</span>
                                    <h1 className="font-display font-extrabold text-xl text-primary-adaptive mt-1">ตรวจสอบข้อมูลก่อนออกประกาศนียบัตร</h1>
                                    <p className="text-xs text-prism-adaptive font-semibold mt-1">{userCreditMeta.professionGroup} • {userCreditMeta.lineTextTH}</p>
                                </div>
                                <div className="space-y-3 text-xs">
                                    <div><label className="block font-bold text-secondary-adaptive mb-1">ชื่อ–นามสกุลภาษาไทยบนประกาศนียบัตร *</label><input required value={certNameTH} onChange={e => setCertNameTH(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm font-bold" /></div>
                                    <div><label className="block font-bold text-secondary-adaptive mb-1">ชื่อ–นามสกุลภาษาอังกฤษ (ถ้ามี)</label><input value={certNameEN} onChange={e => setCertNameEN(e.target.value)} placeholder="e.g. Kanyarat Wattanakul, RN" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="block font-bold text-secondary-adaptive mb-1">โรงพยาบาล / หน่วยงาน</label><input value={certHospital} onChange={e => setCertHospital(e.target.value)} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" /></div>
                                </div>
                                <div className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs">
                                    <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">ประเมินความพึงพอใจ &amp; ความง่ายในการใช้งาน (SUS • 1–5)</p>
                                    <div className="flex items-center justify-between gap-2 pb-2 border-b border-white/10">
                                        <span className="font-bold text-primary-adaptive">ความพึงพอใจภาพรวมหลักสูตร</span>
                                        <div className="flex gap-1">{[1, 2, 3, 4, 5].map(n => <button key={n} type="button" onClick={() => setCsatScore(n)} className={`w-8 h-8 rounded-lg font-mono font-bold ${csatScore === n ? 'bg-amber-400 text-void-950' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>)}</div>
                                    </div>
                                    {SUS_QUESTIONS.map(q => (
                                        <div key={q.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                                            <span className="text-secondary-adaptive">{q.label}</span>
                                            <div className="flex gap-1 shrink-0">{[1, 2, 3, 4, 5].map(n => <button key={n} type="button" onClick={() => setSusAnswers(p => ({ ...p, [q.key]: n }))} className={`w-7 h-7 rounded-lg font-mono font-bold ${susAnswers[q.key] === n ? 'bg-aurora-400 text-void-950' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>)}</div>
                                        </div>
                                    ))}
                                </div>
                                <button type="submit" className="rjc2-pill-btn touch-target w-full py-4 rounded-full font-display font-extrabold text-sm">
                                    ยืนยันและออกประกาศนียบัตรดิจิทัล →
                                </button>
                            </form>
                        </main>
                    )}

                    {/* ==================== SCREEN: DIGITAL CERTIFICATE & INDIVIDUAL LETTER ==================== */}
                    {screen === 'certificate' && user && (
                        <>
                            <main className="no-print-letter relative z-10 max-w-4xl w-full mx-auto px-4 py-6 space-y-5 flex-1">
                                <div className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">{userCreditMeta.professionGroup} • VERIFIED DIGITAL CERTIFICATE</span>
                                            <h1 className="font-display font-extrabold text-xl text-primary-adaptive">ประกาศนียบัตรดิจิทัลและหนังสือรับรองรายบุคคล</h1>
                                            <p className="text-xs text-prism-adaptive font-bold mt-0.5">{userCreditMeta.lineTextTH}</p>
                                        </div>
                                        <a href={`./verify.html?code=${encodeURIComponent(user.certificateCode || 'RJC-2027-DEMO01')}`} target="_blank" rel="noreferrer" className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5">
                                            <Icon name="QrCode" size={14} /> หน้าตรวจ QR 3 มิติ
                                        </a>
                                    </div>

                                    <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-2xl border border-white/60">
                                        <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                        <button type="button" onClick={() => {
                                            if (typeof CERT.downloadCanvasAsPdf === 'function') CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode);
                                            else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png', 1); a.download = `Certificate_${user.certificateCode || 'rjcloud'}.png`; a.click(); }
                                            showToast('ดาวน์โหลดประกาศนียบัตรเรียบร้อยค่ะ');
                                        }} className="rjc2-pill-btn touch-target py-3.5 rounded-full font-display font-extrabold text-xs sm:text-sm inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Download" size={16} /> ดาวน์โหลดใบประกาศฯ (PDF)
                                        </button>
                                        <button type="button" onClick={() => {
                                            if (typeof CERT.downloadCanvasAsPng === 'function') CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode);
                                            else { const a = document.createElement('a'); a.href = certCanvasRef.current.toDataURL('image/png', 1); a.download = `Certificate_${user.certificateCode || 'rjcloud'}.png`; a.click(); }
                                            showToast('บันทึกภาพประกาศนียบัตร (PNG) เรียบร้อยค่ะ');
                                        }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-primary-adaptive inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Image" size={16} /> บันทึกภาพ (PNG)
                                        </button>
                                        <button type="button" onClick={() => {
                                            if (typeof CERT.printIndividualCneuLetter === 'function') CERT.printIndividualCneuLetter();
                                            else { document.body.classList.add('printing-cneu-letter'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing-cneu-letter'), 1200); }, 120); }
                                        }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-accent-adaptive border-aurora-400/45 inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Printer" size={16} /> {userCreditMeta.isNurseCneu ? 'พิมพ์หนังสือรับรอง CNEU (A4)' : 'พิมพ์หนังสือรับรองอบรม (A4)'}
                                        </button>
                                    </div>
                                </div>
                            </main>

                            {/* เอกสารหนังสือรับรองรายบุคคล A4 (ปรับหัวข้อและหน่วยคะแนน/ชั่วโมงตามวิชาชีพ 100%) */}
                            <article id="individual-cert-letter" className="max-w-3xl mx-auto font-sans">
                                <div style={{ borderBottom: '2px solid #0f172a', paddingBottom: '12px', textAlign: 'center', marginBottom: '20px' }}>
                                    <p style={{ fontSize: '12px', fontWeight: 700, color: '#047857', margin: '0 0 4px' }}>{userCreditMeta.letterHeadingTH}</p>
                                    <h2 style={{ fontSize: '18px', fontWeight: 800, margin: '0 0 4px' }}>{cneuConfig.orgName}</h2>
                                    <p style={{ fontSize: '13px', margin: 0 }}>{cneuConfig.courseName}</p>
                                </div>
                                <p style={{ fontSize: '14px', lineHeight: 1.9 }}>
                                    หนังสือฉบับนี้ขอรับรองว่า <b>{user.name}</b> ({userCreditMeta.professionGroup}) {userCreditMeta.licenseLabelTH}: <b>{user.license}</b> สังกัด <b>{user.hospital}</b> ได้ผ่านการอบรมและประเมินผลตามเกณฑ์มาตรฐานหลักสูตรประจำปี 2027 (ผ่านเกณฑ์ชั่วโมงอบรม, AI Skill Lab 3D และ Post-test ≥ 80%) เป็นที่เรียบร้อยแล้ว
                                </p>
                                <p style={{ fontSize: '14px', fontWeight: 700, color: userCreditMeta.isNurseCneu ? '#047857' : '#0369a1', margin: '14px 0' }}>
                                    การรับรอง: {userCreditMeta.lineTextTH} • รหัสอ้างอิงประกาศนียบัตร: {user.certificateCode}
                                </p>
                                <p style={{ fontSize: '13px', marginTop: '24px' }}>ออกให้ ณ วันที่ {formatThaiDateSafe(user.certificateIssuedAt)}</p>
                                <div style={{ marginTop: '48px', textAlign: 'right', paddingRight: '24px', fontSize: '13px' }}>
                                    <p>ลงชื่อ .......................................................</p>
                                    <p style={{ fontWeight: 700 }}>({certTemplate.signerName})</p>
                                    <p>{certTemplate.signerPosition}</p>
                                </div>
                            </article>
                        </>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('app-root'));
        root.render(<AppErrorBoundary><LearnerApp /></AppErrorBoundary>);
    </script>
    <!-- โหลด Babel ท้ายสุดหลังสคริปต์ทั้งหมด เพื่อให้แน่ใจว่าโค้ดครบ 100% ก่อนคอมไพล์ -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
