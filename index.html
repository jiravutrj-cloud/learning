                            <div className="pointer-events-auto w-full sm:w-auto max-w-3xl bg-void-900/95 text-white backdrop-blur-xl border border-aurora-400/40 rounded-2xl p-2.5 shadow-2xl space-y-2">
                                <div className="flex items-center justify-between gap-2 px-1">
                                    <div className="flex items-center gap-1.5 text-[11px] font-mono font-bold text-aurora-300">
                                        <Icon name="Eye" size={14} /> ADMIN PREVIEW 2030
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <a href="./aiskilllab.html?admin_preview=1" className="px-2.5 py-1 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-[11px] font-bold">
                                            Holodeck 3D
                                        </a>
                                        <a href="./admin.html" className="px-2.5 py-1 rounded-lg bg-aurora-500 hover:bg-aurora-400 text-void-950 text-[11px] font-bold">
                                            กลับ Admin
                                        </a>
                                        <button
                                            type="button"
                                            onClick={() => setInspectorBarExpanded(false)}
                                            className="w-6 h-6 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center"
                                        >
                                            <Icon name="ChevronDown" size={14} />
                                        </button>
                                    </div>
                                </div>
                                <div className="flex flex-wrap gap-1">
                                    {quickScreens.map(sc => (
                                        <button
                                            key={sc.id}
                                            type="button"
                                            onClick={() => switchAdminPreviewScreen(sc.id)}
                                            className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${
                                                adminPreviewMode === sc.id
                                                    ? 'bg-aurora-400 text-void-950'
                                                    : 'bg-white/10 hover:bg-white/20 text-slate-200'
                                            }`}
                                        >
                                            {sc.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <button
                                type="button"
                                onClick={() => setInspectorBarExpanded(true)}
                                className="pointer-events-auto px-3.5 py-2 rounded-full bg-void-900/95 text-aurora-300 border border-aurora-400/40 shadow-xl text-xs font-bold flex items-center gap-1.5"
                            >
                                <Icon name="Eye" size={14} /> แถบตรวจหน้า Admin
                            </button>
                        )}
                    </div>
                );
            };

            // --- SCREEN 1: LANDING (2030 SPATIAL HERO) ---
            if (screen === 'landing') {
                return (
                    <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />

                        <header className="relative z-20 max-w-6xl w-full mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-lg shadow-aurora-500/25">
                                    <Icon name="HeartPulse" size={21} />
                                </div>
                                <div>
                                    <div className="flex items-center gap-1.5">
                                        <span className="font-display font-extrabold text-lg text-primary-adaptive leading-none">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="px-1.5 py-0.5 rounded bg-aurora-500/20 text-accent-adaptive font-mono text-[9px] font-bold">
                                            2030
                                        </span>
                                    </div>
                                    <span className="text-[10px] font-mono text-muted-adaptive">Spatial Clinical Ecosystem</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                <a href="./verify.html" className="spatial-soft px-3 py-2 rounded-xl text-primary-adaptive font-bold text-xs flex items-center gap-1.5">
                                    <Icon name="QrCode" size={15} className="text-accent-adaptive" />
                                    <span className="hidden sm:inline">ตรวจประกาศฯ</span>
                                </a>
                                <a href="./executive.html" className="spatial-soft px-3 py-2 rounded-xl text-primary-adaptive font-bold text-xs flex items-center gap-1.5">
                                    <Icon name="BarChart3" size={15} className="text-prism-adaptive" />
                                    <span className="hidden sm:inline">ผู้บริหาร</span>
                                </a>
                            </div>
                        </header>

                        <main className="relative z-10 flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 md:py-12 flex flex-col justify-center gap-7">
                            <div className="text-center space-y-4 max-w-3xl mx-auto">
                                <span className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full spatial-soft text-accent-adaptive font-mono text-[11px] font-bold">
                                    <span className="w-2 h-2 rounded-full bg-aurora-400 animate-pulse" />
                                    SPATIAL CLINICAL OS 2030 • AI-POWERED LEARNING
                                </span>
                                <h1 className="font-display text-3xl sm:text-5xl font-extrabold text-primary-adaptive leading-tight">
                                    ยกระดับทักษะการรับบริจาคและปลูกถ่ายอวัยวะ{' '}
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-aurora-400 via-prism-400 to-indigo-400">
                                        สู่มาตรฐานปี 2030
                                    </span>
                                </h1>
                                <p className="text-sm sm:text-base text-secondary-adaptive leading-relaxed max-w-2xl mx-auto">
                                    ผสาน <b className="text-primary-adaptive">AI Study Companion</b> วิเคราะห์จุดอ่อนและติวส่วนตัวตลอด 20 บทเรียน, ฝึกสื่อสารกับญาติใน <b className="text-accent-adaptive">3D Holodeck</b> และออกประกาศนียบัตรพร้อม QR Code ทันทีเมื่อผ่านเกณฑ์
                                </p>

                                <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => { setAuthStep(1); setScreen('auth'); }}
                                        className="touch-target w-full sm:w-auto px-8 py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-base shadow-[0_14px_34px_-8px_rgba(16,185,129,0.45)] flex items-center justify-center gap-2 transition-all active:scale-[0.98]"
                                    >
                                        <span>เข้าสู่ระบบ / ลงทะเบียนเรียน</span>
                                        <Icon name="ArrowRight" size={19} />
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleStartDemoLearner}
                                        className="touch-target spatial-soft w-full sm:w-auto px-6 py-4 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2 active:scale-[0.98]"
                                    >
                                        <Icon name="Sparkles" size={17} className="text-accent-adaptive" />
                                        <span>ทดลองเรียนโฉม 2030 (Demo)</span>
                                    </button>
                                </div>
                            </div>

                            {/* 5-Step Spatial Pathway Preview */}
                            <SpatialCard className="p-5 sm:p-6">
                                <p className="text-xs font-mono font-bold text-prism-adaptive uppercase tracking-wider mb-3.5 text-center">
                                    5-STEP AI-GUIDED PATHWAY สู่ประกาศนียบัตรอิเล็กทรอนิกส์
                                </p>
                                <div className="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                                    {[
                                        { step: '01', title: 'Pre-test + AI Map', desc: 'วิเคราะห์จุดอ่อน 4 หมวดจัดแผนเรียนเฉพาะคุณ', icon: 'ClipboardCheck' },
                                        { step: '02', title: `เรียน ≥ ${MIN_STUDY_PERCENT}% + AI`, desc: '20 บทพร้อม AI สรุป 1 นาที & ถาม-ตอบสด', icon: 'MonitorPlay' },
                                        { step: '03', title: '3D Holodeck Lab', desc: 'ฝึกคุยกับญาติ 3 มิติ จับความเงียบ 2.5 วิ', icon: 'Bot' },
                                        { step: '04', title: `Post-test ≥ ${MIN_POSTTEST_PERCENT}%`, desc: 'สอบหลังเรียนพร้อม AI โค้ชติวซ่อมจุดพลาด', icon: 'FileCheck2' },
                                        { step: '05', title: 'Holo-Cert ทันที', desc: 'รับ PDF / PNG พร้อม QR ยืนยันคุณวุฒิ', icon: 'Award' }
                                    ].map(item => (
                                        <div key={item.step} className="spatial-soft p-3.5 rounded-2xl flex sm:flex-col items-center sm:text-center gap-3 sm:gap-2">
                                            <div className="w-10 h-10 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center shrink-0">
                                                <Icon name={item.icon} size={20} />
                                            </div>
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive">STEP {item.step}</span>
                                                <h3 className="font-display font-bold text-sm text-primary-adaptive">{item.title}</h3>
                                                <p className="text-[11px] text-muted-adaptive mt-0.5 leading-snug">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </SpatialCard>
                        </main>

                        <footer className="relative z-10 max-w-6xl w-full mx-auto px-4 py-5 flex items-center justify-between text-xs text-muted-adaptive">
                            <button
                                type="button"
                                onClick={handleAdminGearTap}
                                aria-label="เข้าหน้าผู้ดูแลระบบ"
                                className="w-10 h-10 rounded-xl spatial-soft text-muted-adaptive hover:text-primary-adaptive flex items-center justify-center transition-colors"
                                title="แตะ 3 ครั้งเพื่อเข้าหน้า Admin"
                            >
                                <Icon name="Settings" size={18} />
                            </button>
                            <p className="text-right font-medium">{CONFIG.appName} 2030 • {CONFIG.contactEmail}</p>
                        </footer>

                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 2: AUTH WIZARD (3 STEPS) ---
            if (screen === 'auth') {
                const hospitalChoices = (HOSPITAL_MAPPING[profileForm.department] || [{ name: 'อื่นๆ', prov: '' }]).map(h => h.name);
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />

                        <SpatialCard className="relative z-10 w-full max-w-lg p-6 sm:p-8 space-y-6">
                            <div className="flex items-center justify-between gap-2">
                                <button
                                    type="button"
                                    onClick={() => (authStep === 1 ? setScreen('landing') : setAuthStep(s => Math.max(1, s - 1)))}
                                    className="spatial-soft px-3.5 py-2 rounded-full text-primary-adaptive font-bold text-xs flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                </button>
                                <div className="flex items-center gap-2">
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    <span className="px-3 py-1 rounded-full bg-aurora-500/15 border border-aurora-400/35 text-accent-adaptive font-mono text-xs font-bold">
                                        STEP {authStep}/3
                                    </span>
                                </div>
                            </div>

                            {authStep === 1 && (
                                <form onSubmit={handleCheckLicense} className="space-y-5">
                                    <div className="text-center space-y-1.5">
                                        <div className="w-12 h-12 rounded-2xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center mx-auto">
                                            <Icon name="UserCheck" size={24} />
                                        </div>
                                        <h2 className="font-display text-2xl font-extrabold text-primary-adaptive">ตรวจสอบสิทธิ์ผู้เรียน</h2>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive">
                                            กรอกเลขที่ใบประกอบวิชาชีพเพื่อลงทะเบียนใหม่หรือเรียนต่อจากสถานะล่าสุด
                                        </p>
                                    </div>

                                    <FormField
                                        label="เลขที่ใบประกอบวิชาชีพ / เลขประจำตัวผู้เรียน *"
                                        required
                                        value={licenseInput}
                                        onChange={e => setLicenseInput(e.target.value)}
                                        placeholder="เช่น 65012345"
                                        autoComplete="off"
                                    />

                                    <button
                                        type="submit"
                                        disabled={isBusy}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-base shadow-lg shadow-aurora-500/25 flex items-center justify-center gap-2"
                                    >
                                        <span>{isBusy ? 'กำลังตรวจสอบประวัติ...' : 'ตรวจสอบและดำเนินการต่อ'}</span>
                                        <Icon name="ArrowRight" size={18} />
                                    </button>
                                </form>
                            )}

                            {authStep === 2 && (
                                <form onSubmit={handleRequestOtp} className="space-y-4">
                                    <div className="text-center space-y-1">
                                        <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ยืนยันข้อมูลผู้เรียน</h2>
                                        <p className="text-xs text-muted-adaptive">ข้อมูลนี้จะนำไปแสดงบนประกาศนียบัตรอิเล็กทรอนิกส์</p>
                                    </div>

                                    {existingUserData && (
                                        <div className="p-3.5 rounded-2xl bg-aurora-500/15 border border-aurora-400/35 text-xs text-primary-adaptive flex items-center gap-2.5">
                                            <Icon name="History" size={18} className="text-accent-adaptive shrink-0" />
                                            <span>
                                                พบข้อมูลเดิมในระบบ (ความคืบหน้า <b>{existingUserData.progress || 0}%</b> • Pre-test: <b>{existingUserData.pretest || '-'}</b>) ระบบตั้งเป็น <b>เรียนต่อเนื่อง</b> ให้แล้วค่ะ
                                            </span>
                                        </div>
                                    )}

                                    <div className="space-y-3 max-h-[55vh] overflow-y-auto custom-scrollbar pr-1">
                                        <FormField
                                            label="ชื่อ - นามสกุล *"
                                            required
                                            value={profileForm.name}
                                            onChange={e => setProfileForm(p => ({ ...p, name: e.target.value }))}
                                            placeholder="ระบุคำนำหน้า ชื่อ และนามสกุล"
                                        />

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormField label="เลขที่ใบอนุญาต" value={profileForm.license} disabled />
                                            <FormSelect
                                                label="ประเภทการเรียน"
                                                value={profileForm.userType}
                                                onChange={e => setProfileForm(p => ({ ...p, userType: e.target.value }))}
                                                options={['เรียนใหม่', 'เรียนต่อเนื่อง']}
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormField
                                                label="อีเมล (สำหรับรับรหัส OTP) *"
                                                type="email"
                                                required
                                                value={profileForm.email}
                                                onChange={e => setProfileForm(p => ({ ...p, email: e.target.value }))}
                                                placeholder="name@hospital.go.th"
                                            />
                                            <FormField
                                                label="เบอร์โทรศัพท์"
                                                type="tel"
                                                value={profileForm.phone}
                                                onChange={e => setProfileForm(p => ({ ...p, phone: e.target.value }))}
                                                placeholder="08xxxxxxxx"
                                            />
                                        </div>

                                        <FormField
                                            label="ตำแหน่ง"
                                            value={profileForm.position}
                                            onChange={e => setProfileForm(p => ({ ...p, position: e.target.value }))}
                                            placeholder="พยาบาลวิชาชีพ / แพทย์ / เภสัชกร"
                                        />

                                        <FormSelect
                                            label="ลักษณะงานปัจจุบัน"
                                            value={profileForm.workContext}
                                            onChange={e => setProfileForm(p => ({ ...p, workContext: e.target.value }))}
                                            options={[
                                                'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                                                'ปฏิบัติงานหอผู้ป่วยวิกฤต (ICU) / ER / OR',
                                                'ไม่ได้ปฏิบัติงานด้านนี้โดยตรง แต่สนใจศึกษา'
                                            ]}
                                        />

                                        <FormSelect
                                            label="สังกัด / เขตสุขภาพ"
                                            value={profileForm.department}
                                            onChange={e => handleDepartmentChange(e.target.value)}
                                            options={Object.keys(HOSPITAL_MAPPING)}
                                        />

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormSelect
                                                label="หน่วยงาน / โรงพยาบาล"
                                                value={hospitalChoices.includes(profileForm.hospital) ? profileForm.hospital : hospitalChoices[0]}
                                                onChange={e => handleHospitalChange(e.target.value)}
                                                options={hospitalChoices}
                                            />
                                            <FormField
                                                label="จังหวัด"
                                                value={profileForm.province}
                                                onChange={e => setProfileForm(p => ({ ...p, province: e.target.value }))}
                                            />
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={isBusy}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-base shadow-lg shadow-aurora-500/25 flex items-center justify-center gap-2"
                                    >
                                        <span>{isBusy ? 'กำลังส่งรหัส OTP...' : 'ขอรับรหัส OTP ทางอีเมล'}</span>
                                        <Icon name="Mail" size={18} />
                                    </button>
                                </form>
                            )}

                            {authStep === 3 && (
                                <form onSubmit={handleVerifyOtp} className="space-y-5">
                                    <div className="text-center space-y-1.5">
                                        <div className="w-12 h-12 rounded-2xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center mx-auto">
                                            <Icon name="ShieldCheck" size={24} />
                                        </div>
                                        <h2 className="font-display text-2xl font-extrabold text-primary-adaptive">ยืนยันรหัส OTP</h2>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive">
                                            กรอกรหัส 6 หลักที่ส่งไปยัง <b className="text-primary-adaptive">{profileForm.email}</b>
                                        </p>
                                    </div>

                                    {fallbackOtpCode && (
                                        <div className="p-4 rounded-2xl bg-amber-500/15 border border-amber-400/40 text-center space-y-1">
                                            <p className="text-xs font-bold text-amber-400">รหัส OTP สำรอง (ใช้ยืนยันได้ทันที):</p>
                                            <p className="font-mono text-2xl font-extrabold tracking-[0.25em] text-primary-adaptive">{fallbackOtpCode}</p>
                                        </div>
                                    )}

                                    <input
                                        type="text"
                                        inputMode="numeric"
                                        maxLength={6}
                                        required
                                        value={otpInput}
                                        onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, '').slice(0, 6))}
                                        placeholder="000000"
                                        className="touch-target spatial-input w-full py-4 rounded-2xl text-center font-mono text-3xl font-extrabold tracking-[0.35em]"
                                    />

                                    <button
                                        type="submit"
                                        disabled={isBusy || otpInput.length !== 6}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 disabled:opacity-45 text-void-950 font-display font-extrabold text-base shadow-lg shadow-aurora-500/25"
                                    >
                                        {isBusy ? 'กำลังยืนยัน...' : 'ยืนยันเข้าสู่ห้องเรียน 2030'}
                                    </button>
                                </form>
                            )}
                        </SpatialCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 3: QUIZ (PRE-TEST & POST-TEST) ---
            if (screen === 'quiz') {
                const curQ = quiz.questions[quiz.idx];
                const totalQ = quiz.questions.length || 1;
                const answeredCount = Object.keys(quiz.answers).length;
                const isPre = quiz.type === 'pretest';
                const domMeta = CLINICAL_DOMAINS[curQ?.domain];

                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-3.5 sm:p-6 pt-safe pb-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <SpatialCard className="relative z-10 w-full max-w-2xl p-5 sm:p-8 space-y-5">
                            <div className="flex items-center justify-between gap-2 pb-4 border-b border-white/10">
                                <div>
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className={`px-2.5 py-0.5 rounded-full font-mono text-[10px] font-bold ${
                                            isPre ? 'bg-prism-500/20 text-prism-adaptive' : 'bg-amber-500/20 text-amber-400'
                                        }`}>
                                            {isPre ? 'STEP 1/5 • PRE-TEST' : `STEP 4/5 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                                        </span>
                                        {domMeta && (
                                            <span className="px-2 py-0.5 rounded-full spatial-soft text-[10px] font-bold text-secondary-adaptive">
                                                หมวด: {domMeta.shortName}
                                            </span>
                                        )}
                                    </div>
                                    <h2 className="font-display text-lg sm:text-xl font-extrabold text-primary-adaptive mt-1">
                                        {isPre ? 'แบบทดสอบก่อนเรียน (Pre-test)' : 'แบบทดสอบหลังเรียน (Post-test)'}
                                    </h2>
                                </div>
                                <div className="flex items-center gap-2 shrink-0">
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    <div className="px-3.5 py-2 rounded-2xl bg-void-900 text-white border border-white/15 font-mono text-sm font-bold flex items-center gap-1.5">
                                        <Icon name="Clock" size={15} className="text-aurora-400" />
                                        <span>{formatTimerMMSS(quiz.timeLeft)}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-1.5">
                                <div className="flex justify-between text-xs font-bold text-muted-adaptive">
                                    <span>ข้อที่ {quiz.idx + 1} / {totalQ}</span>
                                    <span>ตอบแล้ว {answeredCount} ข้อ</span>
                                </div>
                                <div className="w-full h-2 rounded-full bg-slate-500/20 overflow-hidden">
                                    <div className="h-full bg-gradient-to-r from-aurora-400 to-prism-400 transition-all" style={{ width: `${Math.round(((quiz.idx + 1) / totalQ) * 100)}%` }} />
                                </div>
                            </div>

                            {curQ && (
                                <div className="space-y-4">
                                    <p className="font-display font-bold text-base sm:text-lg text-primary-adaptive leading-relaxed">
                                        {quiz.idx + 1}. {curQ.question}
                                    </p>
                                    <div className="space-y-2.5">
                                        {(curQ.options || []).map((opt, oIdx) => {
                                            const selected = quiz.answers[curQ.id] === oIdx;
                                            return (
                                                <button
                                                    key={oIdx}
                                                    type="button"
                                                    onClick={() => setQuiz(prev => ({ ...prev, answers: { ...prev.answers, [curQ.id]: oIdx } }))}
                                                    className={`touch-target w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 transition-all flex items-start gap-3 ${
                                                        selected
                                                            ? 'bg-aurora-500/15 border-aurora-400 text-primary-adaptive font-bold shadow-sm'
                                                            : 'spatial-soft border-transparent hover:border-aurora-400/40 text-secondary-adaptive'
                                                    }`}
                                                >
                                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center font-mono text-xs font-bold shrink-0 mt-0.5 ${
                                                        selected ? 'bg-aurora-400 text-void-950' : 'bg-slate-500/20 text-muted-adaptive'
                                                    }`}>
                                                        {String.fromCharCode(65 + oIdx)}
                                                    </span>
                                                    <span className="text-sm leading-relaxed">{opt}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            <div className="flex items-center justify-between gap-2.5 pt-3 border-t border-white/10">
                                <button
                                    type="button"
                                    disabled={quiz.idx === 0}
                                    onClick={() => setQuiz(prev => ({ ...prev, idx: Math.max(0, prev.idx - 1) }))}
                                    className="touch-target spatial-soft px-4 py-2.5 rounded-2xl disabled:opacity-35 text-primary-adaptive font-bold text-sm"
                                >
                                    ข้อก่อนหน้า
                                </button>

                                {quiz.idx < totalQ - 1 ? (
                                    <button
                                        type="button"
                                        onClick={() => setQuiz(prev => ({ ...prev, idx: Math.min(totalQ - 1, prev.idx + 1) }))}
                                        className="touch-target px-6 py-2.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center gap-1.5"
                                    >
                                        ข้อถัดไป <Icon name="ArrowRight" size={16} />
                                    </button>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setConfirmDialog({
                                                open: true,
                                                title: 'ยืนยันการส่งคำตอบ',
                                                message: `คุณตอบคำถามแล้ว ${answeredCount}/${totalQ} ข้อ ต้องการส่งคำตอบและให้ AI วิเคราะห์ผลเลยหรือไม่?`,
                                                confirmText: 'ส่งคำตอบ',
                                                onConfirm: () => handleFinishQuiz(quiz)
                                            });
                                        }}
                                        className="touch-target px-6 py-2.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center gap-1.5 shadow-lg"
                                    >
                                        <Icon name="Send" size={16} /> ส่งข้อสอบ
                                    </button>
                                )}
                            </div>
                        </SpatialCard>
                        <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 4: PRE-TEST RESULT + AI DIAGNOSTIC ROADMAP (2030) ---
            if (screen === 'quiz_result') {
                const totalQ = quiz.questions.length || 1;
                const pct = Math.round((quiz.score / totalQ) * 100);
                const diag = lastDiagnosis;
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <SpatialCard className="relative z-10 w-full max-w-xl p-6 sm:p-8 space-y-5">
                            <div className="text-center space-y-1.5">
                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-xs font-bold">
                                    <Icon name="Sparkles" size={13} /> AI DIAGNOSTIC ROADMAP • STEP 1 COMPLETE
                                </span>
                                <h2 className="font-display text-2xl font-extrabold text-primary-adaptive">แผนการเรียนเฉพาะคุณพร้อมแล้วค่ะ</h2>
                            </div>

                            <div className="spatial-soft p-5 rounded-2xl flex items-center justify-between gap-4">
                                <div>
                                    <p className="text-xs font-bold text-muted-adaptive">คะแนน Pre-test ของคุณ</p>
                                    <p className="font-mono text-4xl font-extrabold text-accent-adaptive mt-0.5">
                                        {quiz.score}<span className="text-xl text-muted-adaptive">/{totalQ}</span>
                                    </p>
                                </div>
                                <div className="text-right">
                                    <span className="px-3 py-1 rounded-full bg-prism-500/15 text-prism-adaptive font-mono text-sm font-extrabold">
                                        {pct}%
                                    </span>
                                    <p className="text-[11px] text-muted-adaptive mt-1">ขั้นต่อไป: สะสมเวลา ≥ {MIN_STUDY_PERCENT}%</p>
                                </div>
                            </div>

                            {/* 4-Domain AI Mastery Diagnosis */}
                            {diag?.domains && (
                                <div className="space-y-2.5">
                                    <p className="text-xs font-bold text-secondary-adaptive flex items-center gap-1.5">
                                        <Icon name="Cpu" size={15} className="text-prism-adaptive" />
                                        ผลวิเคราะห์ความรู้พื้นฐาน 4 หมวดคลินิก
                                    </p>
                                    {diag.domains.map(d => (
                                        <div key={d.id} className="spatial-soft p-3 rounded-xl space-y-1.5">
                                            <div className="flex items-center justify-between text-xs font-bold">
                                                <span className="text-primary-adaptive">{d.nameTH}</span>
                                                <span className="font-mono" style={{ color: d.color }}>
                                                    {d.correct}/{d.total} ({d.percent}%)
                                                </span>
                                            </div>
                                            <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                                <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                            </div>
                                        </div>
                                    ))}
                                    <div className="p-3.5 rounded-2xl bg-aurora-500/15 border border-aurora-400/30 text-xs text-primary-adaptive leading-relaxed">
                                        <b>คำแนะนำจาก AI Coach:</b> {diag.summaryText}
                                    </div>
                                </div>
                            )}

                            <button
                                type="button"
                                onClick={() => {
                                    if (diag?.recommendedLessonIds?.[0]) setCurrentLessonId(diag.recommendedLessonIds[0]);
                                    setScreen('dashboard');
                                }}
                                className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-base shadow-lg shadow-aurora-500/25 flex items-center justify-center gap-2"
                            >
                                เริ่มเรียนตามแผนที่ AI แนะนำ <Icon name="ArrowRight" size={18} />
                            </button>
                        </SpatialCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 5: POST-TEST FAIL + AI REMEDIATION COACH (NO DIRECT ANSWERS) ---
            if (screen === 'quiz_fail') {
                const totalQ = quiz.questions.length || 1;
                const pct = Math.round((quiz.score / totalQ) * 100);
                const focusDomains = lastDiagnosis?.focusDomains || [];
                const reviewLessons = (lastDiagnosis?.recommendedLessonIds || [])
                    .map(id => lessons.find(l => l.id === id))
                    .filter(Boolean)
                    .slice(0, 3);

                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <SpatialCard className="relative z-10 w-full max-w-xl p-6 sm:p-8 space-y-5 border-rose-400/35">
                            <div className="text-center space-y-1.5">
                                <div className="w-14 h-14 rounded-2xl bg-rose-500/15 text-rose-400 flex items-center justify-center mx-auto">
                                    <Icon name="RotateCcw" size={28} />
                                </div>
                                <h2 className="font-display text-2xl font-extrabold text-primary-adaptive">ยังไม่ถึงเกณฑ์ {MIN_POSTTEST_PERCENT}%</h2>
                                <p className="text-xs sm:text-sm text-secondary-adaptive">
                                    คะแนนครั้งนี้ <b className="font-mono text-rose-400">{quiz.score}/{totalQ} ({pct}%)</b> — AI โค้ชสรุปหลักการที่ควรทบทวนให้ด้านล่างค่ะ (ไม่เฉลยข้อสอบ)
                                </p>
                            </div>

                            {/* AI Remediation Principles */}
                            <div className="space-y-2.5">
                                <p className="text-xs font-mono font-bold text-prism-adaptive flex items-center gap-1.5">
                                    <Icon name="Sparkles" size={14} /> AI REMEDIATION COACH (จุดที่ควรทบทวนก่อนสอบใหม่)
                                </p>

                                {focusDomains.map(d => (
                                    <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1">
                                        <div className="flex items-center justify-between text-xs font-bold">
                                            <span className="text-primary-adaptive">{d.nameTH}</span>
                                            <span className="font-mono text-amber-400">คะแนนหมวดนี้ {d.percent}%</span>
                                        </div>
                                        <p className="text-xs text-secondary-adaptive leading-relaxed">{d.remediationGuide}</p>
                                    </div>
                                ))}

                                {isFetchingAiNote && (
                                    <div className="spatial-soft p-3 rounded-xl text-xs text-prism-adaptive flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-prism-400 animate-ping" />
                                        AI กำลังสรุปคำแนะนำการทบทวนเฉพาะบุคคล...
                                    </div>
                                )}
                                {aiRemediationNote && (
                                    <div className="p-3.5 rounded-2xl bg-aurora-500/15 border border-aurora-400/30 text-xs text-primary-adaptive whitespace-pre-line leading-relaxed">
                                        {aiRemediationNote}
                                    </div>
                                )}

                                {reviewLessons.length > 0 && (
                                    <div className="space-y-1.5 pt-1">
                                        <p className="text-[11px] font-bold text-muted-adaptive">กดเพื่อข้ามไปทบทวนบทเรียนที่ตรงจุดทันที:</p>
                                        <div className="flex flex-wrap gap-1.5">
                                            {reviewLessons.map(l => (
                                                <button
                                                    key={l.id}
                                                    type="button"
                                                    onClick={() => jumpToLesson(l.id)}
                                                    className="px-3 py-1.5 rounded-xl bg-prism-500/15 hover:bg-prism-500/25 border border-prism-400/35 text-prism-adaptive text-xs font-bold"
                                                >
                                                    บทที่ {l.id}: {l.title.slice(0, 32)}...
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-2 gap-2.5 pt-1">
                                <button
                                    type="button"
                                    onClick={() => setScreen('dashboard')}
                                    className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-display font-bold text-sm"
                                >
                                    กลับทบทวนบทเรียน
                                </button>
                                <button
                                    type="button"
                                    onClick={() => startQuiz('posttest')}
                                    className="touch-target py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm"
                                >
                                    สอบใหม่ทันที
                                </button>
                            </div>
                        </SpatialCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 6: CSAT & CERTIFICATE CONFIRMATION (STEP 5) ---
            if (screen === 'cert_confirm') {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <SpatialCard className="relative z-10 w-full max-w-lg p-6 sm:p-8 space-y-5">
                            <div className="text-center space-y-1.5">
                                <div className="w-14 h-14 rounded-2xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center mx-auto">
                                    <Icon name="Award" size={30} />
                                </div>
                                <span className="inline-block px-3 py-0.5 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[11px] font-bold">
                                    POST-TEST PASSED ({user?.posttest} • {posttestInfo.percent}%)
                                </span>
                                <h2 className="font-display text-2xl font-extrabold text-primary-adaptive">ยินดีด้วยค่ะ! ผ่านเกณฑ์รับประกาศนียบัตร</h2>
                                <p className="text-xs sm:text-sm text-secondary-adaptive">ตรวจสอบชื่อ-หน่วยงาน และประเมินความพึงพอใจเพื่อออกใบประกาศฯ ทันที</p>
                            </div>

                            <form onSubmit={handleIssueCertificate} className="space-y-4">
                                <FormField label="ชื่อ - นามสกุล ที่จะแสดงบนประกาศนียบัตร *" required value={certFormName} onChange={e => setCertFormName(e.target.value)} />
                                <FormField label="หน่วยงาน / โรงพยาบาล *" required value={certFormHosp} onChange={e => setCertFormHosp(e.target.value)} />

                                <div className="spatial-soft p-4 rounded-2xl text-center space-y-2.5 border-amber-400/30">
                                    <p className="text-xs font-bold text-amber-400">ประเมินความพึงพอใจต่อหลักสูตร 2030 (CSAT)</p>
                                    <div className="flex items-center justify-center gap-2">
                                        {[1, 2, 3, 4, 5].map(star => (
                                            <button key={star} type="button" onClick={() => setCsatRating(star)} className="p-1 transition-transform active:scale-90">
                                                <Icon name="Star" size={30} className={star <= csatRating ? 'text-amber-400 fill-amber-400' : 'text-slate-500/50'} />
                                            </button>
                                        ))}
                                    </div>
                                    <input
                                        type="text"
                                        value={csatComment}
                                        onChange={e => setCsatComment(e.target.value)}
                                        placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)"
                                        className="spatial-input w-full px-3.5 py-2 rounded-xl text-xs"
                                    />
                                </div>

                                <button
                                    type="submit"
                                    disabled={isBusy}
                                    className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-base shadow-lg shadow-aurora-500/25 flex items-center justify-center gap-2"
                                >
                                    <Icon name="Sparkles" size={18} />
                                    {isBusy ? 'กำลังสร้างใบประกาศนียบัตร...' : 'ยืนยันและรับประกาศนียบัตรทันที'}
                                </button>
                            </form>
                        </SpatialCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 7: BUILT-IN CERTIFICATE STUDIO ---
            if (screen === 'certificate') {
                return (
                    <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <main className="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 py-6 sm:py-10 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <button
                                    type="button"
                                    onClick={() => setScreen('dashboard')}
                                    className="spatial-soft px-4 py-2 rounded-xl text-primary-adaptive font-bold text-xs flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={15} /> กลับห้องเรียน
                                </button>
                                <div className="flex items-center gap-2">
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    <span className="px-3 py-1.5 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-xs font-bold">
                                        REF: {user?.certificateCode || 'RJC-2027'}
                                    </span>
                                </div>
                            </div>

                            <SpatialCard className="p-4 sm:p-6 space-y-5">
                                <div className="text-center space-y-1">
                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ประกาศนียบัตรอิเล็กทรอนิกส์ของคุณ</h2>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive">
                                        อ้างอิงผลประเมิน Post-test: <b className="text-accent-adaptive">{user?.posttest} ({posttestInfo.percent}%)</b> • รองรับการสแกน QR ตราโฮโลแกรมตรวจสอบได้จริง
                                    </p>
                                </div>

                                <div className="relative w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-aurora-400/35 shadow-2xl">
                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    {isRenderingCert && (
                                        <div className="absolute inset-0 bg-void-950/70 flex items-center justify-center text-sm font-bold text-aurora-300">
                                            กำลังจัดทำประกาศนียบัตรความละเอียดสูง...
                                        </div>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                    <button
                                        type="button"
                                        onClick={handleDownloadPdf}
                                        className="touch-target py-3.5 px-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                    >
                                        <Icon name="FileDown" size={18} /> ดาวน์โหลด PDF (A4)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleDownloadPng}
                                        className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="ImageDown" size={18} className="text-prism-adaptive" /> บันทึกรูปภาพ PNG
                                    </button>
                                    <a
                                        href={`./verify.html?code=${encodeURIComponent(user?.certificateCode || '')}`}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="QrCode" size={18} className="text-accent-adaptive" /> ทดสอบลิงก์ QR
                                    </a>
                                </div>
                            </SpatialCard>
                        </main>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 8: 2030 SPATIAL LEARNER DASHBOARD ---
            const tabs = [
                { id: 'video', label: 'บทเรียน', icon: 'MonitorPlay' },
                { id: 'live', label: 'Live สด', icon: 'Radio' },
                { id: 'leaderboard', label: 'จัดอันดับ', icon: 'Trophy' },
                { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
            ];
            const pickedMicroOption = microCheckPick[activeLesson?.id];

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-dock-safe lg:pb-10">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* Top Spatial Header */}
                    <header className="sticky top-0 z-30 spatial-header">
                        <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0 shadow-md">
                                    <Icon name="HeartPulse" size={19} />
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5">
                                        <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive leading-none truncate">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="hidden sm:inline-block px-1.5 py-0.5 rounded bg-aurora-500/20 text-accent-adaptive font-mono text-[9px] font-bold">
                                            2030
                                        </span>
                                    </div>
                                    <span className="text-[11px] text-muted-adaptive block truncate">{user?.name} • {user?.userType}</span>
                                </div>
                            </div>

                            {/* Desktop Navigation Pills */}
                            <nav className="hidden lg:flex items-center gap-1.5 p-1 rounded-2xl spatial-soft">
                                {tabs.map(t => (
                                    <button
                                        key={t.id}
                                        type="button"
                                        onClick={() => setActiveTab(t.id)}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                            activeTab === t.id
                                                ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-sm'
                                                : 'text-secondary-adaptive hover:text-primary-adaptive'
                                        }`}
                                    >
                                        <Icon name={t.icon} size={15} /> {t.label}

                                    { n: '4', label: `Post ≥${MIN_POSTTEST_PERCENT}%`, done: posttestInfo.passed },

                                                        <Icon name="Sparkles" size={12} /> AI แนะนำสำหรับคุณ

                                                    href={activeLesson.documentUrl}

                                            {activeLesson?.title}
                                        </h2>

                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div className="flex items-center gap-2.5">
                                                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">

                                                </div>

                                                        key={t.id}
                                                        type="button"
                                                        onClick={() => setCompanionTab(t.id)}

                                                            companionTab === t.id
                                                                ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'

                                                        }`}

                                                        {t.label}
                                                    </button>

                                            </div>
                                        </div>

                                        {companionTab === 'cheat' && (
                                            <div className="space-y-2.5">
                                                {(activeLessonGuide?.keyPoints || ['ทบทวนเป้าหมาย แนวปฏิบัติทางคลินิก และบทบาทการประสานงานในบทเรียนนี้']).map((pt, i) => (

                                                            {i + 1}
                                                        </span>
                                                        <span>{pt}</span>
                                                    </div>
                                                ))}
                                                <div className="flex justify-end">
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            setCompanionTab('ask');
                                                            handleAskAiCompanion(null, `ช่วยยกตัวอย่างกรณีศึกษาหน้างานจริงที่เชื่อมโยงกับบทที่ ${activeLesson?.id}: ${activeLesson?.title}`);
                                                        }}
                                                        className="px-3.5 py-1.5 rounded-xl bg-prism-500/15 hover:bg-prism-500/25 text-prism-adaptive text-xs font-bold flex items-center gap-1.5"
                                                    >
                                                        <Icon name="Wand2" size={14} /> ให้ AI ยกตัวอย่างเคสหน้างานจริง
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {/* Sub-Tab B: Micro-Check Quick Recall */}
                                        {companionTab === 'check' && (
                                            <div className="space-y-3">
                                                {activeLessonGuide?.microCheck ? (
                                                    <>
                                                        <p className="font-display font-bold text-sm text-primary-adaptive leading-relaxed">
                                                            คำถามทบทวนด่วนประจำบทที่ {activeLesson.id}: {activeLessonGuide.microCheck.q}
                                                        </p>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                                            {activeLessonGuide.microCheck.options.map((opt, idx) => {
                                                                const picked = pickedMicroOption === idx;
                                                                const isCorrect = idx === activeLessonGuide.microCheck.answer;
                                                                const showState = typeof pickedMicroOption === 'number';
                                                                return (
                                                                    <button
                                                                        key={idx}
                                                                        type="button"
                                                                        onClick={() => setMicroCheckPick(p => ({ ...p, [activeLesson.id]: idx }))}
                                                                        className={`touch-target text-left p-3.5 rounded-2xl border text-xs sm:text-sm font-semibold transition-all ${
                                                                            showState && isCorrect
                                                                                ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive'

                                                                                    ? 'bg-rose-500/20 border-rose-400 text-primary-adaptive'

                                                                        {opt}

                                                            <div className={`p-3.5 rounded-2xl text-xs leading-relaxed border ${

                                                                    ? 'bg-aurora-500/15 border-aurora-400/40 text-primary-adaptive'
                                                                    : 'bg-amber-500/15 border-amber-400/40 text-primary-adaptive'
                                                            }`}>
                                                                <b>{pickedMicroOption === activeLessonGuide.microCheck.answer ? '✅ เยี่ยมมากค่ะ! ' : '💡 ทบทวนเพิ่มนิดนึงค่ะ: '}</b>
                                                                {activeLessonGuide.microCheck.explain}
                                                            </div>
                                                        )}
                                                    </>
                                                ) : (
                                                    <p className="text-xs text-muted-adaptive">สามารถสลับไปแท็บ "ถาม AI สด" เพื่อสอบถามเพิ่มเติมได้ทันทีค่ะ</p>

                                            </div>

                                                            <p className="font-bold text-primary-adaptive">สงสัยจุดไหนในบทที่ {activeLesson?.id} ถาม AI ได้เลยค่ะ:</p>

                                                                    'ถ้าเจอเคสนี้หน้างาน พยาบาลต้องเริ่มทำอะไรก่อน?'
                                                                ].map(q => (
                                                                    <button
                                                                        key={q}
                                                                        type="button"
                                                                        onClick={() => handleAskAiCompanion(null, q)}
                                                                        className="px-2.5 py-1.5 rounded-xl bg-aurora-500/15 hover:bg-aurora-500/25 text-accent-adaptive text-[11px] font-bold"
                                                                    >
                                                                        {q}

                                                        </div>

                                                    {aiChatHistory.map(m => (

                                                            <div className={`max-w-[90%] px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm leading-relaxed whitespace-pre-line ${

                                                            </div>

                                                            <span className="w-2 h-2 rounded-full bg-prism-400 animate-bounce" />

                                                        type="text"

                                                        disabled={isAiChatLoading}

                                                        className="touch-target spatial-input flex-1 px-3.5 py-2.5 rounded-2xl text-sm"

                                                    <button
                                                        type="submit"
                                                        disabled={!aiChatInput.trim() || isAiChatLoading}

                                                    >
                                                        <Icon name="Send" size={17} />
                                                    </button>
                                                </form>
                                            </div>
                                        )}

                                                <h3 className="font-display font-bold text-base text-primary-adaptive mt-0.5">AI Skill Lab 2030 Holodeck</h3>
                                                <p className="text-xs text-secondary-adaptive mt-0.5">
                                                    {canEnterSkillLab
                                                        ? 'ปลดล็อกแล้ว! เข้าฝึกให้ข้อมูลญาติในห้องรับรอง 3 มิติพร้อมรับการ์ดโฮโลแกรม'
                                                        : `สะสมเวลาเรียนให้ถึง ${MIN_STUDY_PERCENT}% เพื่อปลดล็อก (ปัจจุบัน ${studyPercent}%)`}

                                                    href={adminPreviewMode ? './aiskilllab.html?admin_preview=1' : './aiskilllab.html'}

                                                </button>

                                                            ? 'ปลดล็อกแล้ว! ทำคะแนนให้ได้อย่างน้อย 80% เพื่อรับประกาศนียบัตร'

                                                    type="button"
                                                    onClick={() => {

                                                    <Icon name="FileCheck2" size={16} /> เริ่มทำ Post-test ทันที
                                                </button>

                                                <button disabled className="touch-target spatial-soft w-full py-2.5 rounded-xl text-muted-adaptive font-bold text-xs flex items-center justify-center gap-1.5 opacity-70">

                                                            ? 'bg-aurora-500/15 border-aurora-400/60 text-primary-adaptive shadow-sm'

                                                    <span className={`w-7 h-7 rounded-xl font-mono text-xs font-bold flex items-center justify-center shrink-0 ${

                                                    <div className="min-w-0 flex-1">
                                                        <span className="text-xs sm:text-sm font-semibold leading-snug line-clamp-2 block">{l.title}</span>

                                                            <span className="inline-flex items-center gap-1 mt-1 px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-mono text-[9px] font-bold">
                                                                <Icon name="Sparkles" size={10} /> AI แนะนำ
                                                            </span>
                                                        )}
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </SpatialCard>
                            </div>
