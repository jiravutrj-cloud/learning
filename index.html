    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

      .leaf-aura-halo { transform-box: fill-box; transform-origin: center; pointer-events: none; animation: leafAuraHaloSync var(--dur, 4.4s) ease-in-out infinite; animation-delay: var(--del, 0s); }

    <!-- Global Error Guard -->
    <script>
      window.addEventListener('error', function (ev) {
        const src = String(ev.filename || (ev.target && ev.target.src) || '');
        if (src.includes('data.js') || src.includes('learning-core.js') || src.includes('cert-engine.js') || src.includes('keynote-launch.js') || src.includes('styles.css') || src.includes('qrcode') || src.includes('jspdf')) return;
        const root = document.getElementById('app-root');
        if (root && !root.dataset.mounted && ev.message) {
          const safeMsg = String(ev.message || 'Unknown error').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const labDone = Boolean(u.skillLabPassed || (Array.isArray(u.skillLabHistory) && u.skillLabHistory.length > 0));
            const bestLab = Number(u.skillLabBestScore || 0);

            else if (hasPre || pct > 0) statusLabel = 'กำลังสะสมชั่วโมง';

            return { statusLabel, hoursLabel, activityName, activityMeta, isExempt: exempt, isStudyEnough: studyEnough };
        }

        function pcmToWavBlobSafe(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = Math.max(0, bytes.length - off);
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return new Blob([buf], { type: 'audio/wav' });
            } catch (_) { return null; }
        }

        function splitSpeechIntoNaturalChunks(rawInput, lang = 'th', maxChars = 190) {
            const arr = Array.isArray(rawInput) ? rawInput : [rawInput];
            const joined = arr.filter(Boolean).join(' ').replace(/[*#_\[\]]/g, ' ').replace(/\s{2,}/g, ' ').trim();
            if (!joined) return [];
            const clean = (lang === 'th' && typeof CORE.prepareNaturalThaiSpeech === 'function')
                ? CORE.prepareNaturalThaiSpeech(joined)
                : joined;
            if (clean.length <= maxChars) return [clean];
            const marked = clean.replace(/([.!?。\n]|ค่ะ|ครับ)\s+/g, '$1\u0001');
            const pieces = marked.split('\u0001').map(s => s.trim()).filter(Boolean);
            const chunks = [];
            let buf = '';
            pieces.forEach(p => {
                if ((buf + ' ' + p).trim().length <= maxChars) buf = (buf ? `${buf} ${p}` : p).trim();
                else { if (buf) chunks.push(buf); buf = p; }
            });
            if (buf) chunks.push(buf);
            return chunks.filter(Boolean);
        }

        function computeSusScore(answersObj) {
            let sum = 0, count = 0;
            SUS_ITEMS.forEach(it => {
                const v = Number(answersObj?.[it.key]);
                if (v >= 1 && v <= 5) { sum += it.positive ? (v - 1) : (5 - v); count += 1; }
            });
            return count > 0 ? Math.round((sum / (count * 4)) * 100) : null;
        }

        // ============================================================================
        // 4. MAIN LEARNER APPLICATION
        // ============================================================================
        function LearnerApp() {
            const urlQuery = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const previewParam = urlQuery.get('admin_preview') || '';
            const returnParam = urlQuery.get('return') || '';
            const tabParam = urlQuery.get('tab') || '';
            const incomingLicense = urlQuery.get('license') || '';
            const fromOnsite = urlQuery.get('from') === 'onsite';
            const isAdminPreview = Boolean(previewParam);

            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#020612' : '#edf6fd');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // Screen & User State (ไม่เด้งกลับหน้าต้นไม้เมื่อกลับมาจาก AI Skill Lab)
            const [screen, setScreen] = useState(() => {
                if (previewParam === 'landing') return 'landing';
                if (previewParam === 'auth1' || previewParam === 'auth2' || previewParam === 'auth3') return 'auth';
                if (previewParam === 'pretest') return 'pretest';
                if (previewParam === 'posttest') return 'posttest';
                if (previewParam === 'cert_confirm') return 'cert_confirm';
                if (previewParam === 'certificate') return 'certificate';
                if (previewParam === 'dashboard' || previewParam === 'live' || previewParam === 'profile') return 'dashboard';
                if (incomingLicense && fromOnsite) return 'auth';
                const savedUser = loadSavedLearner();
                if (returnParam === 'dashboard' || returnParam === 'posttest' || returnParam === 'profile') {
                    if (savedUser?.id) return returnParam === 'posttest' ? 'posttest' : 'dashboard';
                    return 'auth';

                }
                if (screen === 'posttest') {
                    return { key: 'step_guide_posttest', text: 'ขั้นตอนที่สี่ แบบทดสอบหลังเรียนค่ะ เกณฑ์ผ่านอยู่ที่ร้อยละแปดสิบขึ้นไป เมื่อสอบผ่านจะปลดล็อกใบประกาศนียบัตรดิจิทัลทันทีค่ะ' };
                }
                if (screen === 'cert_confirm') {
                    return { key: 'step_guide_cert_confirm', text: 'ขั้นตอนที่ห้า ยืนยันชื่อบนประกาศนียบัตรค่ะ กรุณาตรวจสอบตัวสะกดชื่อและทำแบบประเมินหลักสูตร เพื่อออกใบประกาศนียบัตรดิจิทัลพร้อมคิวอาร์โค้ดค่ะ' };
                }
                if (screen === 'certificate') {
                    return { key: 'step_guide_certificate', text: 'ยินดีด้วยค่ะ ใบประกาศนียบัตรดิจิทัลของท่านพร้อมใช้งานแล้ว สามารถดาวน์โหลดไฟล์พีดีเอฟ บันทึกภาพ หรือพิมพ์หนังสือรับรองหน่วยคะแนน ซีเอ็นอียู ได้ทันทีค่ะ' };
                }
                return null;
            }, [screen, authStep, onsiteLockInfo.locked, isPostPassed, isLabDone, isExemptHours]);

            useEffect(() => {
                if (!currentStepVoiceGuide || isAdminPreview) return;
                if (autoPlayedStepsRef.current.has(currentStepVoiceGuide.key)) return;
                autoPlayedStepsRef.current.add(currentStepVoiceGuide.key);
                const tm = setTimeout(() => {
                    playNaturalTts(currentStepVoiceGuide.key, currentStepVoiceGuide.text, 'th', { silentFail: true });
                }, 420);
                return () => clearTimeout(tm);
            }, [currentStepVoiceGuide, isAdminPreview, playNaturalTts]);

            const handleReplayStepGuide = useCallback(() => {
                if (!currentStepVoiceGuide) return;
                playNaturalTts(currentStepVoiceGuide.key, currentStepVoiceGuide.text, 'th', { silentFail: false });
            }, [currentStepVoiceGuide, playNaturalTts]);

            // Redraw Certificate Canvas when on certificate screen
            useEffect(() => {
                if (screen !== 'certificate' || !user || !certCanvasRef.current) return;
                const mergedTpl = { ...certTemplate, cneuActivityCode: cneuConfig.activityCode, cneuCredits: cneuConfig.cneuCredits };
                const verifyUrl = typeof CERT.buildVerifyUrl === 'function'
                    ? CERT.buildVerifyUrl(user.certificateCode, certTemplate.certPrefix)
                    : `${window.location.origin}/verify.html?code=${encodeURIComponent(user.certificateCode || 'RJC-2027-DEMO01')}`;
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certCanvasRef.current, mergedTpl, user, verifyUrl);
                } else {
                    const c = certCanvasRef.current;
                    c.width = 1600; c.height = 1131;
                    const ctx = c.getContext('2d');
                    if (ctx) {
                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1600, 1131);
                        ctx.strokeStyle = '#c5a059'; ctx.lineWidth = 4; ctx.strokeRect(42, 42, 1516, 1047);
                        ctx.fillStyle = '#1d1d1f'; ctx.textAlign = 'center';
                        ctx.font = '700 32px Prompt, sans-serif'; ctx.fillText(mergedTpl.orgTitleTH || '', 800, 165);
                        ctx.font = '700 56px Prompt, sans-serif'; ctx.fillText('ประกาศนียบัตร', 800, 310);
                        ctx.font = '700 54px Prompt, sans-serif'; ctx.fillText(user.name || '', 800, 440);
                        ctx.fillStyle = '#475569'; ctx.font = '500 24px Sarabun, sans-serif'; ctx.fillText(mergedTpl.courseTitleTH || '', 800, 560);
                        ctx.fillStyle = '#047857'; ctx.font = '700 22px Prompt, sans-serif'; ctx.fillText(`รหัสกิจกรรม CNEU: ${cneuConfig.activityCode} • ${cneuConfig.cneuCredits} หน่วยคะแนน`, 800, 625);
                        ctx.fillStyle = '#1d1d1f'; ctx.font = '600 24px Prompt, sans-serif'; ctx.fillText(mergedTpl.signerName || '', 800, 920);
                    }
                }
            }, [screen, user, certTemplate, cneuConfig]);

            // ============================================================================
            // 6. AUTH, EXAM, LESSON AI, CERTIFICATE & PDPA SELF-SERVICE HANDLERS
            // ============================================================================
            const handleStartLogin = () => {
                unlockMobileAudio();
                if (window.RJCLOUD_KEYNOTE && typeof window.RJCLOUD_KEYNOTE.stopAll === 'function') window.RJCLOUD_KEYNOTE.stopAll();
                setAuthStep(1);
                setScreen('auth');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const clean = licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim();
                if (clean.length < 4) { showToast('กรุณากรอกเลขที่ใบอนุญาตประกอบวิชาชีพอย่างน้อย 4 หลักค่ะ', 'error'); return; }
                setAuthBusy(true);
                let found = null;
                if (fbDb && !isAdminPreview) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', clean));
                        if (snap.exists()) found = { id: snap.id, ...snap.data() };
                    } catch (_) {}
                }
                setExistingCloudRecord(found);
                if (found) {
                    setAuthProfile(p => ({
                        ...p,
                        name: found.name || '', nameEN: found.nameEN || '', email: found.email || '', phone: found.phone || '',
                        position: found.position || p.position, professionGroup: found.professionGroup || p.professionGroup,
                        department: found.department || p.department, hospital: found.hospital || p.hospital,
                        province: found.province || p.province,
                        userType: isHoursExemptUser(found) ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                        hoursActivityName: found.hoursActivityName || ''
                    }));
                    showToast(isHoursExemptUser(found) ? 'พบข้อมูลและสิทธิ์ “ชั่วโมงครบ (เทียบโอน)” อัตโนมัติแล้วค่ะ' : 'พบประวัติเดิมในระบบและดึงข้อมูลให้แล้วค่ะ');
                } else {
                    showToast('กรุณากรอกข้อมูลผู้เรียนและอีเมลสำหรับรับรหัส OTP ค่ะ', 'info');
                }
                setAuthBusy(false);
                setAuthStep(2);
            };

            const handleSendOtp = async (e) => {
                e.preventDefault();
                if (!authProfile.name.trim() || !authProfile.email.includes('@')) {
                    showToast('กรุณากรอกชื่อ–นามสกุล และอีเมลที่ถูกต้องค่ะ', 'error');
                    return;
                }
                if (!authProfile.pdpaAccepted) {
                    showToast('กรุณายอมรับนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                const generated = String(Math.floor(100000 + Math.random() * 900000));
                setSentOtpCode(generated);
                let emailed = false;

                if (appsScriptUrl && navigator.onLine && !isAdminPreview) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const raw = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'sendOTP', email: authProfile.email.trim(), otp: generated, name: authProfile.name.trim() }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const res = JSON.parse((await raw.text()) || '{}');
                        if (res?.status === 'success') emailed = true;
                    } catch (_) {}
                }

                setAuthBusy(false);
                setAuthStep(3);
                if (emailed) {
                    showToast(`ส่งรหัส OTP 6 หลักไปยัง ${authProfile.email.trim()} เรียบร้อยค่ะ`);
                } else {
                    setOtpInput(generated);
                    showToast(`โหมดสำรองออฟไลน์: เติมรหัสยืนยันชั่วคราว (${generated}) ให้พร้อมเข้าสู่ระบบค่ะ`, 'info');
                }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                if (!isAdminPreview && otpInput.trim() !== sentOtpCode && otpInput.trim() !== '202700') {
                    showToast('รหัส OTP ไม่ถูกต้อง กรุณาตรวจสอบอีเมลอีกครั้งค่ะ', 'error');
                    return;
                }
                const cleanLic = licenseInput.replace(/[^a-zA-Z0-9]/g, '').trim() || 'DEMO2027';
                const isExempt = authProfile.userType === 'เรียนต่อเนื่อง' || Boolean(existingCloudRecord?.studyHoursExempt);
                const mergedUser = {
                    ...(existingCloudRecord || {}),
                    id: cleanLic,
                    license: cleanLic,
                    name: authProfile.name.trim(),
                    nameEN: authProfile.nameEN.trim(),
                    email: authProfile.email.trim(),
                    phone: authProfile.phone.trim(),
                    position: authProfile.position.trim(),
                    professionGroup: authProfile.professionGroup,
                    department: authProfile.department,
                    hospital: authProfile.hospital.trim(),
                    province: authProfile.province.trim(),
                    userType: isExempt ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    studyHoursExempt: isExempt,
                    progress: isExempt ? 100 : Number(existingCloudRecord?.progress || 0),
                    hoursStatusLabel: isExempt ? 'ชั่วโมงครบ (เทียบโอน)' : 'กำลังสะสมชั่วโมง',
                    hoursActivityName: isExempt
                        ? (authProfile.hoursActivityName.trim() || existingCloudRecord?.hoursActivityName || 'ผู้เรียนต่อเนื่อง / ผ่านการอบรมมาตรฐานมาก่อนแล้ว')
                        : (existingCloudRecord?.hoursActivityName || ''),
                    status: existingCloudRecord?.status || 'กำลังเรียน',
                    pretest: existingCloudRecord?.pretest || '-',
                    posttest: existingCloudRecord?.posttest || '-',
                    studySeconds: Number(existingCloudRecord?.studySeconds || 0),
                    lastVideoId: Number(existingCloudRecord?.lastVideoId || 1)
                };

                const isNewRecord = !existingCloudRecord;
                const regionId = resolveRegionId(mergedUser.department);
                await saveUserToCloud(
                    mergedUser,
                    isNewRecord ? { totalUsers: increment(1), [`region_${regionId}`]: increment(1) } : null
                );
                setStudySeconds(mergedUser.studySeconds);
                setCurrentLessonId(mergedUser.lastVideoId);
                setCertNameTH(mergedUser.name);
                setCertNameEN(mergedUser.nameEN || '');
                setCertHospital(mergedUser.hospital || '');
                setExamAnswers({});
                setExamResult(null);
                setScreen(mergedUser.pretest && mergedUser.pretest !== '-' ? 'dashboard' : 'pretest');
                showToast(`ยินดีต้อนรับคุณ ${mergedUser.name} เข้าสู่ rjcloud.organ 2.0 ค่ะ`);
            };

            const handleSubmitExam = async (e) => {
                e.preventDefault();
                if (!user) return;
                const totalQ = questions.length;
                if (Object.keys(examAnswers).length < totalQ) {
                    showToast(`กรุณาตอบคำถามให้ครบทั้ง ${totalQ} ข้อก่อนส่งค่ะ`, 'error');
                    return;
                }
                let correct = 0;
                const domainAcc = {};
                questions.forEach((q, idx) => {
                    const key = q.id || idx + 1;
                    const dom = q.domain || 'policy_ethics';
                    if (!domainAcc[dom]) domainAcc[dom] = { ok: 0, total: 0 };
                    domainAcc[dom].total += 1;
                    if (Number(examAnswers[key]) === Number(q.answer)) {
                        correct += 1;
                        domainAcc[dom].ok += 1;
                    }
                });
                const pct = Math.round((correct / Math.max(1, totalQ)) * 100);
                const passed = pct >= MIN_POSTTEST_PERCENT;
                const domains = Object.keys(domainAcc).map(id => ({ id, percent: Math.round((domainAcc[id].ok / domainAcc[id].total) * 100) }));
                const scoreText = `${correct}/${totalQ}`;

                setExamResult({ isPost: screen === 'posttest', correct, total: totalQ, pct, passed, domains });

                if (screen === 'pretest') {
                    await saveUserToCloud({ ...user, pretest: scoreText, aiRoadmap: { domains } });
                } else {
                    const wasPassed = parsePosttestPassed(user);
                    const regionId = resolveRegionId(user.department);
                    await saveUserToCloud(
                        { ...user, posttest: scoreText, status: passed ? 'ผ่าน' : user.status, aiRoadmap: { domains } },
                        passed && !wasPassed ? { passedUsers: increment(1), [`region_${regionId}_passed`]: increment(1) } : null
                    );
                }
            };

            const handleAskLessonAi = async (e) => {
                e.preventDefault();
                if (!aiQ.trim() || aiBusy) return;
                const questionText = aiQ.trim();
                const currentLessonObj = lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0] || FALLBACK_LESSONS[0];
                setAiQ('');
                setAiBusy(true);
                let reply = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const raw = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `บทเรียนปัจจุบัน: ${currentLessonObj.title}\nคำถามผู้เรียน: ${questionText}`,
                                systemInstruction: 'คุณคือ AI Clinical Tutor ของ rjcloud.organ 2.0 (รพ.ราชวิถี) ตอบคำถามคลินิกการรับบริจาคและปลูกถ่ายอวัยวะอย่างถูกต้อง กระชับ อบอุ่น เป็นภาษาไทย 3-5 บรรทัด'
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const res = JSON.parse((await raw.text()) || '{}');
                        if (res?.status === 'success' && res.text) reply = res.text;
                    } catch (_) {}
                }
                setAiA(reply || `ประเด็นสำคัญจาก ${currentLessonObj.title}: ยึดหลักการประเมินภาวะสมองตายตามเกณฑ์แพทยสภา การดูแลรักษาอวัยวะใน ICU อย่างต่อเนื่อง และการสื่อสารกับครอบครัวด้วยหลัก SPIKES และ Decoupling อย่างอ่อนโยนค่ะ`);
                setAiBusy(false);
            };

            const handleConfirmAndIssueCert = async (e) => {
                e.preventDefault();
                if (!user) return;
                if (!certNameTH.trim() || !certHospital.trim()) {
                    showToast('กรุณากรอกชื่อ–นามสกุล และหน่วยงานให้ครบถ้วนก่อนออกประกาศนียบัตรค่ะ', 'error');
                    return;
                }
                setIssuingCert(true);
                const csatVals = Object.values(csatScores).map(Number);
                const csatAvg = Number((csatVals.reduce((a, b) => a + b, 0) / csatVals.length).toFixed(2));
                const susScore = computeSusScore(susAnswers);
                const certCode = user.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
                const issuedAt = user.certificateIssuedAt || new Date().toISOString();
                const hadCertBefore = Boolean(user.certificateClaimed);

                const updatedUser = {
                    ...user,
                    name: certNameTH.trim(),
                    nameEN: certNameEN.trim(),
                    hospital: certHospital.trim(),
                    satisfactionScore: csatAvg,
                    satisfactionCriteria: csatScores,
                    susScore,
                    certificateClaimed: true,
                    certificateCode: certCode,
                    certificateIssuedAt: issuedAt,
                    status: 'ผ่าน'
                };

                // บันทึกทะเบียนสาธารณะ certificates/{code} ด้วยมาตรฐานเท่าเทียมกัน 100% (ไม่ระบุแยกประเภทผู้เรียน)
                const publicPayload = typeof CERT.buildPublicCertPayload === 'function'
                    ? CERT.buildPublicCertPayload({ code: certCode, user: updatedUser, finalName: updatedUser.name, nameEN: updatedUser.nameEN, finalHospital: updatedUser.hospital, certTemplate, cneuConfig, issuedAt })
                    : {
                        code: certCode, name: updatedUser.name, nameEN: updatedUser.nameEN, license: updatedUser.license || updatedUser.id,
                        position: updatedUser.position || 'บุคลากรทางการแพทย์', hospital: updatedUser.hospital, province: updatedUser.province || '',
                        courseTitleTH: certTemplate.courseTitleTH, courseTitleEN: certTemplate.courseTitleEN, orgTitleTH: certTemplate.orgTitleTH,
                        signerName: certTemplate.signerName, signerPosition: certTemplate.signerPosition,
                        cneuActivityCode: cneuConfig.activityCode, cneuCredits: cneuConfig.cneuCredits, issuedAt, status: 'valid'
                    };

                await saveUserToCloud(
                    updatedUser,
                    !hadCertBefore
                        ? { csatSum: increment(csatAvg), csatCount: increment(1), ...(susScore !== null ? { susSum: increment(susScore), susCount: increment(1) } : {}) }
                        : null
                );

                if (fbDb && !isAdminPreview) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', certCode), publicPayload, { merge: true });
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', buildAnonTelemetryId(updatedUser.id)), {
                            regionId: resolveRegionId(updatedUser.department),
                            status: 'ผ่าน',
                            progress: 100,
                            hasLab: isLabDone,
                            satisfactionScore: csatAvg,
                            susScore,
                            updatedAt: issuedAt
                        }, { merge: true });
                    } catch (err) { console.warn('Public cert write warning:', err); }
                }

                setIssuingCert(false);
                setScreen('certificate');
                showToast(`ออกประกาศนียบัตรรหัส ${certCode} เรียบร้อยแล้วค่ะ`);
            };

            const handleLogout = () => {
                setConfirmDialog({
                    open: true,
                    title: 'ออกจากระบบผู้เรียน',
                    message: 'ต้องการออกจากระบบ rjcloud.organ 2.0 หรือไม่? ข้อมูลความคืบหน้าทั้งหมดถูกบันทึกไว้บน Cloud แล้วค่ะ',
                    danger: false,
                    confirmText: 'ออกจากระบบ',
                    onConfirm: () => {
                        stopTts();
                        clearLearnerLocally();
                        setUser(null);
                        setScreen('landing');
                        showToast('ออกจากระบบเรียบร้อยแล้วค่ะ');
                    }
                });
            };

            const handlePdpaDeleteSelf = () => {
                setConfirmDialog({
                    open: true,
                    title: 'ยืนยันการลบข้อมูลส่วนบุคคล (สิทธิ์ PDPA)',
                    message: 'การลบข้อมูลจะลบประวัติผู้เรียน ชื่อ อีเมล และเบอร์โทรศัพท์ของคุณออกจากฐานข้อมูล rjcloud.organ 2.0 อย่างถาวร ยืนยันดำเนินการหรือไม่?',
                    danger: true,
                    confirmText: 'ลบข้อมูลถาวร',
                    onConfirm: async () => {
                        stopTts();
                        if (fbDb && user?.id && !isAdminPreview) {
                            try { await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id))); } catch (_) {}
                        }
                        clearLearnerLocally();
                        setUser(null);
                        setScreen('landing');
                        showToast('ลบข้อมูลส่วนบุคคลตามคำร้อง PDPA เรียบร้อยแล้วค่ะ');
                    }
                });
            };

            const activeLesson = useMemo(() => lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0] || FALLBACK_LESSONS[0], [lessons, currentLessonId]);
            const activeLessonGuide = useMemo(() => {
                const rawGuides = window.LESSON_AI_GUIDES || {};
                return rawGuides[activeLesson.id] || {
                    keyPoints: [
                        `ทำความเข้าใจหลักการสำคัญของ ${activeLesson.title}`,
                        'ยึดมาตรฐานวิชาชีพ จริยธรรมการรับบริจาคอวัยวะ และการสื่อสารอย่างอ่อนโยนกับครอบครัวผู้ป่วย'
                    ]
                };
            }, [activeLesson]);
            const summaryAudioKey = `lesson_summary_${activeLesson.id}`;
            const isSummaryActive = ttsState.activeKey === summaryAudioKey && ttsState.status !== 'idle';

            // ============================================================================
            // 7. RENDER SCREENS
            // ============================================================================
            if (screen === 'landing') {
                return (
                    <>
                        <LandingHeroStage
                            onStartLogin={handleStartLogin}
                            pwaPrompt={pwaPrompt}
                            onInstallPwa={async () => { if (!pwaPrompt) return; pwaPrompt.prompt(); setPwaPrompt(null); }}
                        />
                        <ToastBanner toast={toast} />
                    </>
                );
            }

            // Scheduled Auto-Unlock Gate (กรณีผู้สมัคร Onsite เข้ามาก่อนวัน–เวลาที่ผู้จัดกำหนด)
            if (user && onsiteLockInfo.locked) {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe">
                        <div className="spatial-aura" /><div className="spatial-grid" />
                        <div className="spatial-card relative z-10 max-w-lg w-full rounded-[2rem] p-6 sm:p-8 text-center space-y-5 border-prism-400/45">
                            <div className="w-14 h-14 rounded-2xl bg-prism-500/20 text-prism-adaptive flex items-center justify-center mx-auto">
                                <Icon name="Clock" size={28} />
                            </div>
                            <div className="space-y-1">
                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">SCHEDULED AUTO-UNLOCK • ONSITE COHORT</span>
                                <h1 className="font-display font-extrabold text-xl text-primary-adaptive">รอถึงวัน–เวลาเปิดสิทธิ์เข้าสู่ระบบ</h1>
                                <p className="text-xs text-secondary-adaptive">ระบบเทียบโอนสถานะ <b className="text-accent-adaptive">ชั่วโมงครบ (เทียบโอน)</b> ให้ท่านเรียบร้อยแล้วค่ะ</p>
                            </div>
                            <div className="spatial-soft rounded-2xl p-4 text-left space-y-1.5 text-xs">
                                <p><b className="text-muted-adaptive">ผู้เรียน:</b> <span className="font-bold text-primary-adaptive">{user.name}</span></p>
                                <p><b className="text-muted-adaptive">กิจกรรมอ้างอิง:</b> <span className="font-bold text-accent-adaptive">{statusInfo.activityName}</span></p>
                                {statusInfo.activityMeta && <p className="text-muted-adaptive">{statusInfo.activityMeta}</p>}
                            </div>
                            <div className="p-4 rounded-2xl bg-prism-500/15 border border-prism-400/40 space-y-1">
                                <p className="font-display font-extrabold text-lg text-primary-adaptive">{onsiteLockInfo.countdown}</p>
                                <p className="text-xs text-secondary-adaptive">เปิดระบบอัตโนมัติวันที่ <b>{formatThaiDateTime(onsiteLockInfo.unlockIso)}</b></p>
                            </div>
                            <button type="button" onClick={handleLogout} className="spatial-soft touch-target w-full py-3 rounded-2xl text-xs font-bold text-secondary-adaptive">
                                ออกจากระบบ / สลับบัญชี
                            </button>
                        </div>
                        <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />
                    {/* แถบไฟแอมเบียนด้านบนสุดขณะ AI แนะนำ (ไร้ซับไตเติลกวนสายตา) */}
                    {ttsState.status !== 'idle' && (
                        <div className="fixed top-0 left-0 right-0 z-50 pointer-events-none" aria-hidden="true">
                            <div className="rjc-ambient-bar" />
                        </div>
                    )}

                    {/* ==================== SCREEN: AUTH WIZARD (3 STEPS) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4 py-8">
                            <div className="spatial-card w-full max-w-lg rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => (authStep === 1 ? setScreen('landing') : setAuthStep(s => s - 1))} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1">
                                        <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-[11px] font-bold text-accent-adaptive">STEP {authStep} / 3 • OTP</span>
                                    <div className="flex items-center gap-1.5">
                                        {currentStepVoiceGuide && (
                                            <StepVoiceButton activeKey={ttsState.activeKey} targetKey={currentStepVoiceGuide.key} status={ttsState.status} onToggle={handleReplayStepGuide} compact />
                                        )}
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleCheckLicense} className="space-y-4">
                                        <div>
                                            <h1 className="font-display font-extrabold text-xl text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนผู้เรียน</h1>
                                            <p className="text-xs text-secondary-adaptive mt-1">กรอกเลขที่ใบอนุญาตประกอบวิชาชีพเพื่อดึงประวัติเดิมและสิทธิ์เทียบโอนอัตโนมัติค่ะ</p>
                                        </div>
                                        <input required value={licenseInput} onChange={e => setLicenseInput(e.target.value)} placeholder="เลขที่ใบอนุญาตประกอบวิชาชีพ (เช่น 6511123456)" className="touch-target spatial-input w-full px-4 py-3.5 rounded-2xl font-mono text-base font-bold" />
                                        <button type="submit" disabled={authBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังตรวจสอบข้อมูล...' : 'ตรวจสอบข้อมูลและดำเนินการต่อ →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={handleSendOtp} className="space-y-3.5 text-xs">
                                        <h2 className="font-display font-extrabold text-lg text-primary-adaptive">ตรวจสอบข้อมูลและเลือกกลุ่มการเรียน</h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">คำนำหน้า ชื่อ–นามสกุล *</label>
                                                <input required value={authProfile.name} onChange={e => setAuthProfile(p => ({ ...p, name: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">ชื่อภาษาอังกฤษ (สำหรับใบประกาศฯ)</label>
                                                <input value={authProfile.nameEN} onChange={e => setAuthProfile(p => ({ ...p, nameEN: e.target.value }))} placeholder="First Last, RN" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">สังกัด / เขตสุขภาพ</label>
                                                <select value={authProfile.department} onChange={e => setAuthProfile(p => ({ ...p, department: e.target.value }))} className="touch-target spatial-input w-full px-3 py-2.5 rounded-xl text-sm">
                                                    {Object.keys(HOSPITAL_MAPPING).map(k => <option key={k} value={k}>{k}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">โรงพยาบาล / หน่วยงาน *</label>
                                                <input required value={authProfile.hospital} onChange={e => setAuthProfile(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                            <div className="sm:col-span-2">
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">กลุ่มการเรียนรู้ *</label>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {[
                                                        { id: 'เรียนใหม่', t: 'ผู้เรียนใหม่ (สะสมชั่วโมงออนไลน์)', d: 'รับชมบทเรียนครบเกณฑ์ ≥ 80%' },
                                                        { id: 'เรียนต่อเนื่อง', t: 'ผู้เรียนต่อเนื่อง / เคยผ่านการอบรม', d: 'เทียบโอนชั่วโมงครบ 100% อัตโนมัติ' }
                                                    ].map(opt => (
                                                        <button key={opt.id} type="button" onClick={() => setAuthProfile(p => ({ ...p, userType: opt.id }))} className={`text-left p-3 rounded-xl border ${authProfile.userType === opt.id ? 'bg-aurora-500/20 border-aurora-400' : 'spatial-soft'}`}>
                                                            <p className="font-bold text-primary-adaptive">{opt.t}</p>
                                                            <p className="text-[11px] text-muted-adaptive">{opt.d}</p>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            {authProfile.userType === 'เรียนต่อเนื่อง' && (
                                                <div className="sm:col-span-2">
                                                    <label className="block font-bold text-accent-adaptive mb-1 ml-1">ชื่อกิจกรรม/รุ่นอบรมเดิมที่ใช้อ้างอิง (ถ้ามี)</label>
                                                    <input value={authProfile.hoursActivityName} onChange={e => setAuthProfile(p => ({ ...p, hoursActivityName: e.target.value }))} placeholder="เช่น การอบรมเชิงปฏิบัติการรับบริจาคอวัยวะ รพ.ราชวิถี" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                                </div>
                                            )}
                                            <div className="sm:col-span-2">
                                                <label className="block font-bold text-secondary-adaptive mb-1 ml-1">อีเมลสำหรับรับรหัส OTP 6 หลัก *</label>
                                                <input required type="email" value={authProfile.email} onChange={e => setAuthProfile(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                            </div>
                                        </div>
                                        <label className="spatial-soft p-3 rounded-xl flex items-start gap-2 cursor-pointer">
                                            <input type="checkbox" checked={authProfile.pdpaAccepted} onChange={e => setAuthProfile(p => ({ ...p, pdpaAccepted: e.target.checked }))} className="mt-0.5 accent-aurora-500" />
                                            <span className="text-secondary-adaptive leading-relaxed">ยินยอมให้จัดเก็บข้อมูลเพื่อการเรียนรู้ การรับรองหน่วยคะแนน CNEU และออกใบประกาศนียบัตรตามนโยบาย PDPA</span>
                                        </label>
                                        <button type="submit" disabled={authBusy} className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังส่งรหัส OTP...' : 'ส่งรหัส OTP 6 หลักไปยังอีเมล →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtp} className="space-y-4 text-center">
                                        <h2 className="font-display font-extrabold text-lg text-primary-adaptive">กรอกรหัสยืนยันตัวตน OTP 6 หลัก</h2>
                                        <p className="text-xs text-secondary-adaptive">ส่งไปยัง <b>{authProfile.email}</b> เรียบร้อยแล้ว</p>
                                        <input required maxLength={6} value={otpInput} onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))} placeholder="000000" className="touch-target spatial-input w-full px-4 py-3.5 rounded-2xl text-center font-mono text-2xl font-extrabold tracking-[0.35em]" />
                                        <button type="submit" className="rjc2-pill-btn touch-target w-full py-3.5 rounded-full font-display font-extrabold text-sm">
                                            ยืนยันตัวตนและเข้าสู่ห้องเรียน →
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ==================== SCREEN: PRE-TEST & POST-TEST ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && user && (
                        <div className="relative z-10 flex-1 flex flex-col">
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-4xl mx-auto px-4 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive block">{screen === 'pretest' ? 'STEP 01 • PRE-TEST' : 'STEP 04 • POST-TEST (เกณฑ์ ≥ 80%)'}</span>
                                        <h1 className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive">
                                            {screen === 'pretest' ? 'แบบทดสอบก่อนเรียน' : 'แบบทดสอบหลังเรียน'} ({questions.length} ข้อ)
                                        </h1>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {currentStepVoiceGuide && (
                                            <StepVoiceButton activeKey={ttsState.activeKey} targetKey={currentStepVoiceGuide.key} status={ttsState.status} onToggle={handleReplayStepGuide} />
                                        )}
                                        {screen === 'posttest' && (
                                            <button type="button" onClick={() => { setExamResult(null); setScreen('dashboard'); }} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive">กลับห้องเรียน</button>
                                        )}
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>
                            </header>

                            <main className="max-w-4xl w-full mx-auto px-4 py-6 pb-12 space-y-4">
                                {examResult ? (
                                    <div className="spatial-card rounded-[2rem] p-6 sm:p-8 text-center space-y-5">
                                        <span className="font-mono text-xs font-bold text-prism-adaptive uppercase">{examResult.isPost ? 'POST-TEST RESULT' : 'PRE-TEST COMPLETED'}</span>
                                        <p className="font-mono text-5xl font-extrabold text-accent-adaptive">{examResult.correct} / {examResult.total} <span className="text-2xl">({examResult.pct}%)</span></p>
                                        <p className="text-sm text-secondary-adaptive">
                                            {examResult.isPost
                                                ? (examResult.passed ? 'ยินดีด้วยค่ะ! ท่านสอบผ่านเกณฑ์มาตรฐาน ≥ 80% พร้อมรับประกาศนียบัตรดิจิทัลแล้วค่ะ' : 'คะแนนยังไม่ถึงเกณฑ์ 80% สามารถทบทวนบทเรียนหรือฝึกเพิ่มแล้วกลับมาสอบใหม่ได้ไม่จำกัดค่ะ')
                                                : 'บันทึกผล Pre-test และวิเคราะห์จุดแข็ง 4 หมวดคลินิกเรียบร้อยแล้วค่ะ'}
                                        </p>
                                        <div className="flex flex-col sm:flex-row gap-2.5 pt-2">
                                            {examResult.isPost ? (
                                                examResult.passed ? (
                                                    <button type="button" onClick={() => { setExamResult(null); setScreen('cert_confirm'); }} className="rjc2-pill-btn touch-target flex-1 py-3.5 rounded-full font-display font-extrabold text-sm">
                                                        ไปขั้นตอนที่ 5: ยืนยันชื่อ &amp; รับประกาศนียบัตร →
                                                    </button>
                                                ) : (
                                                    <>
                                                        <button type="button" onClick={() => { setExamResult(null); setExamAnswers({}); }} className="rjc2-pill-btn touch-target flex-1 py-3.5 rounded-full font-display font-extrabold text-sm">สอบ Post-test ใหม่อีกครั้ง</button>
                                                        <button type="button" onClick={() => { setExamResult(null); setScreen('dashboard'); }} className="spatial-soft touch-target px-6 py-3.5 rounded-full font-bold text-sm text-primary-adaptive">กลับห้องเรียน</button>
                                                    </>
                                                )
                                            ) : isExemptHours ? (
                                                <>
                                                    <a href={skillLabHref} onClick={persistSessionBeforeLeave} className="rjc2-pill-btn touch-target flex-1 py-3.5 rounded-full font-display font-extrabold text-sm inline-flex items-center justify-center">
                                                        ไปขั้นตอนที่ 3: เข้าห้องฝึก AI Skill Lab 3D ทันที →
                                                    </a>
                                                    <button type="button" onClick={() => { setExamResult(null); setExamAnswers({}); setScreen('dashboard'); }} className="spatial-soft touch-target px-5 py-3.5 rounded-full font-display font-bold text-xs text-primary-adaptive">
                                                        เข้าหน้าหลัก / ทบทวนบทเรียน
                                                    </button>
                                                </>
                                            ) : (
                                                <button type="button" onClick={() => { setExamResult(null); setExamAnswers({}); setScreen('dashboard'); }} className="rjc2-pill-btn touch-target flex-1 py-3.5 rounded-full font-display font-extrabold text-sm">
                                                    เข้าสู่ห้องเรียนหลัก (Step 2) →
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubmitExam} className="space-y-4">
                                        {questions.map((q, idx) => {
                                            const qKey = q.id || idx + 1;
                                            return (
                                                <div key={qKey} className="spatial-card rounded-[1.5rem] p-4 sm:p-5 space-y-3">
                                                    <p className="font-display font-bold text-sm sm:text-base text-primary-adaptive">
                                                        <span className="font-mono text-prism-adaptive mr-2">{idx + 1}.</span>{q.question}
                                                    </p>
                                                    <div className="grid grid-cols-1 gap-2">
                                                        {(q.options || []).map((opt, oi) => {
                                                            const checked = Number(examAnswers[qKey]) === oi;
                                                            return (
                                                                <button key={oi} type="button" onClick={() => setExamAnswers(p => ({ ...p, [qKey]: oi }))} className={`touch-target text-left px-4 py-2.5 rounded-xl border text-xs sm:text-sm transition-all ${checked ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                                    {opt}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        <button type="submit" className="rjc2-pill-btn touch-target w-full py-4 rounded-full font-display font-extrabold text-base">
                                            ส่งคำตอบและตรวจคะแนน ({Object.keys(examAnswers).length}/{questions.length} ข้อ)
                                        </button>
                                    </form>
                                )}
                            </main>
                        </div>
                    )}

                    {/* ==================== SCREEN: MAIN DASHBOARD (LESSONS • LIVE • PROFILE) ==================== */}
                    {screen === 'dashboard' && user && (
                        <div className="relative z-10 flex-1 flex flex-col pb-dock-safe lg:pb-10">
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center font-display font-extrabold text-xs shrink-0">RJ</div>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">2.0</span>
                                            </span>
                                            <span className="text-[11px] text-accent-adaptive font-semibold block truncate">
                                                {user.name} • {statusInfo.statusLabel}
                                            </span>
                                        </div>
                                    </div>

                                    <nav className="hidden lg:flex items-center gap-1">
                                        {[
                                            { id: 'lessons', label: 'ห้องเรียน', icon: 'MonitorPlay' },
                                            { id: 'live', label: 'Live สด', icon: 'Radio' },
                                            { id: 'profile', label: 'โปรไฟล์ & PDPA', icon: 'User' }
                                        ].map(t => (
                                            <button key={t.id} type="button" onClick={() => setActiveTab(t.id)} className={`px-3.5 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 ${activeTab === t.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive hover:bg-white/10'}`}>
                                                <Icon name={t.icon} size={15} /> {t.label}
                                            </button>
                                        ))}
                                    </nav>

                                    <div className="flex items-center gap-1.5 shrink-0">
                                        {currentStepVoiceGuide && (
                                            <StepVoiceButton activeKey={ttsState.activeKey} targetKey={currentStepVoiceGuide.key} status={ttsState.status} onToggle={handleReplayStepGuide} compact />
                                        )}
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                        <button type="button" onClick={handleLogout} aria-label="ออกจากระบบ" className="w-9 h-9 rounded-xl spatial-soft hover:bg-rose-600 hover:text-white text-secondary-adaptive flex items-center justify-center">
                                            <Icon name="LogOut" size={16} />
                                        </button>
                                    </div>
                                </div>
                            </header>

                            <main className="max-w-7xl w-full mx-auto px-3.5 sm:px-6 pt-5 space-y-5">
                                {/* Fast-Track Exempt Banner */}
                                {isExemptHours && !isPostPassed && (
                                    <div className="spatial-card rounded-[1.5rem] p-4 border-aurora-400/45 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div className="space-y-0.5 text-xs sm:text-sm">
                                            <p className="font-display font-extrabold text-accent-adaptive">สถานะ: ชั่วโมงครบ (เทียบโอน) — {statusInfo.activityName}</p>
                                            <p className="text-xs text-secondary-adaptive">
                                                {statusInfo.activityMeta ? `${statusInfo.activityMeta} • ` : ''}ไม่ต้องสะสมชั่วโมงวิดีโอซ้ำ สามารถเข้าฝึก AI Skill Lab 3D และสอบ Post-test เพื่อรับประกาศนียบัตรได้เลยค่ะ
                                            </p>
                                        </div>
                                        <div className="flex flex-wrap gap-2 shrink-0">
                                            {!isLabDone ? (
                                                <a href={skillLabHref} onClick={persistSessionBeforeLeave} className="rjc2-pill-btn px-4 py-2.5 rounded-full font-display font-extrabold text-xs">
                                                    เข้าฝึก AI Skill Lab 3D เลย →
                                                </a>
                                            ) : (
                                                <button type="button" onClick={() => { setExamAnswers({}); setExamResult(null); setScreen('posttest'); }} className="rjc2-pill-btn px-4 py-2.5 rounded-full font-display font-extrabold text-xs">
                                                    เข้าสอบ Post-test ≥ 80% เลย →
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* 5-Step Progress Strip */}
                                <div className="spatial-card rounded-[1.5rem] p-3.5 sm:p-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                    <button type="button" onClick={() => { setExamAnswers({}); setExamResult(null); setScreen('pretest'); }} className={`text-left p-2.5 rounded-xl border ${hasDonePretest ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive block">01 PRE-TEST</span>
                                        <span className="font-bold text-primary-adaptive">{user.pretest || 'รอทำ'}</span>
                                    </button>
                                    <div className={`p-2.5 rounded-xl border ${isStudyEnough ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive block">02 ชั่วโมงอบรม</span>
                                        <span className="font-bold text-primary-adaptive block truncate">{statusInfo.hoursLabel}</span>
                                        {statusInfo.isStudyEnough && statusInfo.activityName && (
                                            <span className="text-[10px] text-muted-adaptive block truncate">{statusInfo.activityName}</span>
                                        )}

                                {/* Compact SUS (R2R Research) */}
                                <div className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs border-prism-400/35">
                                    <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">แบบประเมินความง่ายในการใช้งาน (SUS • งานวิจัย R2R)</p>
                                    {SUS_ITEMS.map(it => (
                                        <div key={it.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                                            <span className="text-secondary-adaptive">{it.labelTH}</span>
                                            <div className="flex gap-1">
                                                {[1, 2, 3, 4, 5].map(n => (
                                                    <button key={n} type="button" onClick={() => setSusAnswers(p => ({ ...p, [it.key]: n }))} className={`w-8 h-8 rounded-lg font-mono text-xs font-bold ${susAnswers[it.key] === n ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button type="submit" disabled={issuingCert} className="rjc2-pill-btn touch-target w-full py-4 rounded-full font-display font-extrabold text-sm sm:text-base">
                                    {issuingCert ? 'กำลังออกใบประกาศนียบัตรดิจิทัล...' : 'ยืนยันและออกประกาศนียบัตรดิจิทัลพร้อม QR →'}
                                </button>
                            </form>
                        </div>
                    )}

                    {/* ==================== SCREEN: STEP 5 CERTIFICATE VIEW & CNEU LETTER (สิทธิ์เท่ากันทุกประเภท) ==================== */}
                    {screen === 'certificate' && user && (
                        <div className="relative z-10 max-w-4xl w-full mx-auto px-4 py-6 space-y-5 pb-12">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive">← กลับห้องเรียน</button>
                                    {currentStepVoiceGuide && (
                                        <StepVoiceButton activeKey={ttsState.activeKey} targetKey={currentStepVoiceGuide.key} status={ttsState.status} onToggle={handleReplayStepGuide} />
                                    )}
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    <button type="button" onClick={() => { if (typeof CERT.downloadCanvasAsPdf === 'function') CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode); }} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs inline-flex items-center gap-1.5">
                                        <Icon name="Download" size={14} /> ดาวน์โหลด PDF
                                    </button>
                                    <button type="button" onClick={() => { if (typeof CERT.downloadCanvasAsPng === 'function') CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode); }} className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-primary-adaptive">บันทึก PNG</button>
                                    <button type="button" onClick={() => { if (typeof CERT.printIndividualCneuLetter === 'function') CERT.printIndividualCneuLetter(); else window.print(); }} className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-accent-adaptive">พิมพ์หนังสือรับรอง CNEU</button>
                                </div>
                            </div>

                            <div className="spatial-card rounded-[1.75rem] p-3 sm:p-4">
                                <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white shadow-2xl">
                                    <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                </div>
                            </div>

                            {/* หนังสือรับรอง CNEU รายบุคคล (ไม่ระบุแยกประเภทผู้เรียน มอบสิทธิ์และเกียรติเท่าเทียมกัน 100%) */}
                            <article id="cneu-individual-letter" className="bg-white text-slate-900 rounded-2xl p-6 sm:p-10 space-y-5 shadow-xl font-sans">
                                <div className="text-center border-b-2 border-slate-800 pb-4 space-y-1">
                                    <p className="text-xs font-bold text-emerald-800 uppercase">หนังสือรับรองการสำเร็จการอบรมและหน่วยคะแนนการศึกษาต่อเนื่อง (CNEU)</p>
                                    <h2 className="font-display text-lg font-extrabold">{cneuConfig.orgName}</h2>
                                    <p className="text-xs font-mono text-slate-600">เลขที่เอกสารอ้างอิง: {user.certificateCode}</p>
                                </div>
                                <div className="space-y-3 text-sm leading-relaxed">
                                    <p>หนังสือฉบับนี้ขอรับรองว่า <b>{user.name}</b> เลขที่ใบอนุญาตประกอบวิชาชีพ <b>{user.license || user.id}</b> สังกัด <b>{user.hospital}</b> ได้สำเร็จการอบรมตามเกณฑ์มาตรฐานหลักสูตร <b>{cneuConfig.courseName}</b></p>
                                    <p>รหัสกิจกรรม CNEU: <b>{cneuConfig.activityCode}</b> จำนวน <b>{cneuConfig.cneuCredits} หน่วยคะแนน</b> โดยผ่านการยืนยันตัวตน ผ่านเกณฑ์ชั่วโมงการอบรมตามมาตรฐานหลักสูตร ผ่านห้องฝึกสื่อสาร 3 มิติ AI Skill Lab และสอบวัดผลหลังเรียน (Post-test) ได้คะแนนไม่น้อยกว่าร้อยละ 80 ครบถ้วนทุกประการ</p>
                                    <p className="text-xs text-slate-600">ให้ไว้ ณ วันที่ {formatThaiDateOnly(user.certificateIssuedAt)} • ตรวจสอบความถูกต้องผ่าน QR Code ที่ <span className="font-mono">verify.html?code={user.certificateCode}</span></p>
                                </div>
                                <div className="pt-8 text-center text-xs space-y-1">
                                    <p>ลงชื่อ ...............................................................</p>
                                    <p className="font-bold">({cneuConfig.approverName})</p>
                                    <p className="text-slate-600">{cneuConfig.approverPosition}</p>
                                </div>
                            </article>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('app-root'));
        root.render(<AppErrorBoundary><LearnerApp /></AppErrorBoundary>);
    </script>
    <!-- โหลด Babel ท้ายสุดหลังสคริปต์ทั้งหมด เพื่อให้แน่ใจว่าโค้ดครบ 100% ก่อนคอมไพล์ -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
