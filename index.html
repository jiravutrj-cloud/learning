                { cx: 112, cy: 214, rx: 11, ry: 4.5, rot: -24 }, { cx: 168, cy: 196, rx: 10, ry: 4.2, rot: -14 },
                { cx: 92,  cy: 162, rx: 11, ry: 4.5, rot: 14 },  { cx: 152, cy: 156, rx: 10, ry: 4.0, rot: 22 },
                { cx: 146, cy: 112, rx: 10, ry: 4.2, rot: 34 },  { cx: 212, cy: 84,  rx: 9.5, ry: 4.0, rot: 52 },
                { cx: 266, cy: 62,  rx: 9,  ry: 3.8, rot: 68 },  { cx: 236, cy: 142, rx: 9.5, ry: 4.0, rot: 28 },
                { cx: 404, cy: 142, rx: 9.5, ry: 4.0, rot: -28 }, { cx: 374, cy: 62,  rx: 9,  ry: 3.8, rot: -68 },
                { cx: 428, cy: 84,  rx: 9.5, ry: 4.0, rot: -52 }, { cx: 494, cy: 112, rx: 10, ry: 4.2, rot: -34 },
                { cx: 488, cy: 156, rx: 10, ry: 4.0, rot: -22 }, { cx: 548, cy: 162, rx: 11, ry: 4.5, rot: -14 },
                { cx: 472, cy: 196, rx: 10, ry: 4.2, rot: 14 },  { cx: 528, cy: 214, rx: 11, ry: 4.5, rot: 24 }
            ]), []);

            useEffect(() => {
                const bgCanvas = mistCanvasRef.current;
                const fxCanvas = flareCanvasRef.current;
                const stage = heroStageRef.current;
                if (!bgCanvas || !fxCanvas || !stage) return;
                const bgCtx = bgCanvas.getContext('2d');
                const fxCtx = fxCanvas.getContext('2d');
                if (!bgCtx || !fxCtx) return;

                const flare = {
                    targetMouseX: 0, targetMouseY: 0, mouseX: 0, mouseY: 0,
                    w: 0, h: 0, lastFitW: 0, inView: true,
                    moonX: window.innerWidth * 0.5, moonY: window.innerHeight * 0.26,
                    treeLeft: 0, treeTop: 0, treeW: 480, treeH: 315
                };

                // =========================================================================
                // A. NOISE UTILITIES + COOL VOLUMETRIC 4-OCTAVE fBm MIST + 4-PLANE SHAN-SHUI MOUNTAINS
                // =========================================================================
                const hash2D = (ix, iy) => {
                    const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453123;
                    return n - Math.floor(n);
                };
                const valueNoise2D = (x, y) => {
                    const ix = Math.floor(x), iy = Math.floor(y);
                    const fx = x - ix, fy = y - iy;
                    const ux = fx * fx * (3 - 2 * fx);
                    const uy = fy * fy * (3 - 2 * fy);
                    const a = hash2D(ix, iy);
                    const b = hash2D(ix + 1, iy);
                    const c = hash2D(ix, iy + 1);
                    const d = hash2D(ix + 1, iy + 1);
                    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
                };
                const fbm4 = (x, y) => {
                    let v = 0, amp = 0.5, freq = 1;
                    for (let i = 0; i < 4; i++) {
                        v += amp * valueNoise2D(x * freq, y * freq);
                        freq *= 2.04;
                        amp *= 0.5;
                    }
                    return v;
                };
                const ridged1D = (x, seed) => {
                    let sum = 0, amp = 0.55, freq = 1;
                    for (let i = 0; i < 4; i++) {
                        const n = valueNoise2D(x * freq + seed * 3.1, seed * 1.7 + i * 2.3);
                        const r = 1 - Math.abs(n * 2 - 1);
                        sum += r * r * amp;
                        freq *= 2.15;
                        amp *= 0.48;
                    }
                    return sum;
                };
                const smoothstep = (e0, e1, x) => {
                    const t = Math.max(0, Math.min(1, (x - e0) / Math.max(0.0001, e1 - e0)));
                    return t * t * (3 - 2 * t);
                };

                // อบกลุ่มหมอกเย็นฟุ้งเนื้อละเอียด (Cool Immortal Valley Mist)
                const bakeMistSprite = ({ width, height, freqX, freqY, seed, domes, shadowRGB, midRGB, hiRGB, maxAlpha, threshold = 0.15, softness = 0.62 }) => {
                    const off = document.createElement('canvas');
                    off.width = width;
                    off.height = height;
                    const octx = off.getContext('2d');
                    const img = octx.createImageData(width, height);
                    const data = img.data;

                    for (let py = 0; py < height; py++) {
                        const v = py / (height - 1);
                        const edgeY = smoothstep(0.0, 0.28, v) * smoothstep(1.0, 0.74, v);
                        if (edgeY <= 0.001) continue;
                        for (let px = 0; px < width; px++) {
                            const u = px / (width - 1);
                            const edgeX = smoothstep(0.0, 0.22, u) * smoothstep(1.0, 0.78, u);
                            if (edgeX <= 0.001) continue;

                            let dome = 0;
                            for (let k = 0; k < domes.length; k++) {
                                const dm = domes[k];
                                const dx = (u - dm.x) / dm.rx;
                                const dy = (v - dm.y) / dm.ry;
                                const val = Math.exp(-0.5 * (dx * dx + dy * dy)) * dm.w;
                                dome = val > dome ? (dome + val * (1 - dome * 0.62)) : (dome + val * 0.34);
                            }
                            if (dome <= 0.02) continue;

                            const qx = fbm4(u * freqX + seed, v * freqY + seed * 0.7);
                            const qy = fbm4(u * freqX + seed + 6.3, v * freqY + seed + 2.9);
                            const n = fbm4(u * freqX + qx * 1.25 + 3.1, v * freqY + qy * 0.92 + 1.7);
                            const nUp = fbm4(u * freqX + qx * 1.25 + 3.1, (v - 0.05) * freqY + qy * 0.92 + 1.7);

                            const rawDensity = dome * (0.24 + 1.26 * n);
                            const alpha = smoothstep(threshold, threshold + softness, rawDensity) * edgeX * edgeY * maxAlpha;
                            if (alpha <= 0.004) continue;

                            const ridgeLight = Math.max(0, Math.min(1, (n - nUp) * 3.9 + (1 - v) * 0.56 + 0.24));
                            const hi = Math.pow(ridgeLight, 1.45);
                            let r, g, b;
                            if (hi < 0.55) {
                                const f = hi / 0.55;
                                r = shadowRGB[0] + (midRGB[0] - shadowRGB[0]) * f;
                                g = shadowRGB[1] + (midRGB[1] - shadowRGB[1]) * f;
                                b = shadowRGB[2] + (midRGB[2] - shadowRGB[2]) * f;
                            } else {
                                const f = (hi - 0.55) / 0.45;
                                r = midRGB[0] + (hiRGB[0] - midRGB[0]) * f;
                                g = midRGB[1] + (hiRGB[1] - midRGB[1]) * f;
                                b = midRGB[2] + (hiRGB[2] - midRGB[2]) * f;
                            }
                            const idx = (py * width + px) * 4;
                            data[idx] = Math.round(r);
                            data[idx + 1] = Math.round(g);
                            data[idx + 2] = Math.round(b);
                            data[idx + 3] = Math.round(Math.min(255, alpha * 255));
                        }
                    }
                    octx.putImageData(img, 0, 0);
                    return off;
                };

                const mistSprites = {
                    coolFar: bakeMistSprite({
                        width: 240, height: 108, freqX: 5.0, freqY: 2.8, seed: 3.1,
                        domes: [
                            { x: 0.20, y: 0.58, rx: 0.26, ry: 0.28, w: 0.92 },
                            { x: 0.50, y: 0.54, rx: 0.30, ry: 0.30, w: 0.96 },
                            { x: 0.80, y: 0.58, rx: 0.26, ry: 0.28, w: 0.92 }
                        ],
                        shadowRGB: [18, 56, 112], midRGB: [122, 194, 238], hiRGB: [224, 248, 255], maxAlpha: 0.72
                    }),
                    coolMidL: bakeMistSprite({
                        width: 220, height: 118, freqX: 4.5, freqY: 3.1, seed: 8.7,
                        domes: [
                            { x: 0.28, y: 0.60, rx: 0.26, ry: 0.28, w: 0.96 },
                            { x: 0.60, y: 0.52, rx: 0.25, ry: 0.28, w: 0.88 }
                        ],
                        shadowRGB: [22, 66, 126], midRGB: [148, 212, 246], hiRGB: [240, 252, 255], maxAlpha: 0.76
                    }),
                    coolMidR: bakeMistSprite({
                        width: 220, height: 118, freqX: 4.6, freqY: 3.0, seed: 14.4,
                        domes: [
                            { x: 0.40, y: 0.52, rx: 0.25, ry: 0.28, w: 0.88 },
                            { x: 0.72, y: 0.60, rx: 0.26, ry: 0.28, w: 0.96 }
                        ],
                        shadowRGB: [20, 68, 128], midRGB: [142, 216, 245], hiRGB: [238, 254, 252], maxAlpha: 0.76
                    }),
                    coolVeil: bakeMistSprite({
                        width: 215, height: 96, freqX: 5.4, freqY: 3.2, seed: 22.9,
                        domes: [
                            { x: 0.34, y: 0.50, rx: 0.25, ry: 0.26, w: 0.90 },
                            { x: 0.66, y: 0.52, rx: 0.25, ry: 0.26, w: 0.86 }
                        ],
                        shadowRGB: [40, 96, 160], midRGB: [182, 230, 252], hiRGB: [248, 254, 255], maxAlpha: 0.56, threshold: 0.18, softness: 0.60
                    })
                };

                // อบทิวเขาหินแหลมแดนเซียน 4 ระยะ (Shan-Shui Karst Peaks) พร้อมสันเขารับแสงจันทราหยกทอง
                let mountainLayers = [];
                const bakeMountainLayer = (w, h, cfg) => {
                    const off = document.createElement('canvas');
                    off.width = Math.max(2, Math.round(w));
                    off.height = Math.max(2, Math.round(h));
                    const c = off.getContext('2d');
                    const steps = Math.max(90, Math.round(w / 7));
                    const ridgePts = [];

                    for (let i = 0; i <= steps; i++) {
                        const u = i / steps;
                        // เว้นหุบเขาตรงกลางให้ดวงจันทราและต้นดอกท้อโดดเด่น พร้อมยอดเขาสูงชันซ้าย–ขวาแบบภาพยนตร์จีน
                        const valleyDip = 1 - cfg.valleyDepth * Math.exp(-Math.pow((u - 0.5) / cfg.valleyWidth, 2));
                        let spire = 0;
                        for (let s = 0; s < cfg.spires.length; s++) {
                            const sp = cfg.spires[s];
                            const dist = Math.abs(u - sp.x) / sp.w;
                            spire += sp.h * Math.exp(-Math.pow(dist, 1.55));
                        }
                        const crag = ridged1D(u * cfg.freq, cfg.seed) * cfg.roughness;
                        const normElev = Math.max(0.02, (cfg.baseElev + spire + crag) * valleyDip);
                        const py = h * (cfg.horizonY - normElev);
                        ridgePts.push({ x: u * w, y: py });
                    }

                    // 1) ตัวภูเขาไล่เฉดเงาหมึกจีนลึกสู่หมอกเย็นที่ฐานเขา
                    const bodyGrad = c.createLinearGradient(0, h * (cfg.horizonY - cfg.maxElev), 0, h);
                    bodyGrad.addColorStop(0, cfg.topCol);
                    bodyGrad.addColorStop(0.54, cfg.midCol);
                    bodyGrad.addColorStop(0.86, cfg.fogCol);
                    bodyGrad.addColorStop(1, 'rgba(138, 188, 224, 0)');

                    c.beginPath();
                    c.moveTo(0, h);
                    for (let i = 0; i < ridgePts.length; i++) c.lineTo(ridgePts[i].x, ridgePts[i].y);
                    c.lineTo(w, h);
                    c.closePath();
                    c.fillStyle = bodyGrad;
                    c.fill();

                    // 2) สันเขารองรับแสงจันทราหยกทอง (Rim Light จับเฉพาะสันเขาด้านที่หันรับดวงจันทร์กลางฟ้า)
                    c.save();
                    c.clip();
                    for (let i = 1; i < ridgePts.length - 1; i++) {
                        const p0 = ridgePts[i - 1], p1 = ridgePts[i], p2 = ridgePts[i + 1];
                        const slope = (p2.y - p0.y) / Math.max(1, p2.x - p0.x);
                        // ฝั่งซ้ายสันลาดลงขวาหันรับดวงจันทร์, ฝั่งขวาสันลาดขึ้นขวาหันรับดวงจันทร์
                        const facesMoon = (p1.x < w * 0.5 && slope > 0.06) || (p1.x >= w * 0.5 && slope < -0.06);
                        if (facesMoon && cfg.rimAlpha > 0) {
                            const g = c.createLinearGradient(p1.x, p1.y, p1.x + (p1.x < w * 0.5 ? 28 : -28), p1.y + 42);
                            g.addColorStop(0, `rgba(${cfg.rimRGB}, ${cfg.rimAlpha})`);
                            g.addColorStop(1, `rgba(${cfg.rimRGB}, 0)`);
                            c.strokeStyle = g;
                            c.lineWidth = cfg.rimWidth;
                            c.beginPath();
                            c.moveTo(p0.x, p0.y);
                            c.lineTo(p1.x, p1.y);
                            c.lineTo(p2.x, p2.y);
                            c.stroke();
                        }
                    }
                    c.restore();

                    // 3) เส้นออร่าขอบสันเขาบางเบาเสริมความคมลึกยามค่ำคืน
                    c.strokeStyle = `rgba(${cfg.rimRGB}, ${(cfg.rimAlpha * 0.42).toFixed(3)})`;
                    c.lineWidth = 1.15;
                    c.beginPath();
                    for (let i = 0; i < ridgePts.length; i++) {
                        if (i === 0) c.moveTo(ridgePts[i].x, ridgePts[i].y);
                        else c.lineTo(ridgePts[i].x, ridgePts[i].y);
                    }
                    c.stroke();

                    return off;
                };

                const rebuildMountains = (w, h) => {
                    mountainLayers = [
                        // ระยะที่ 1 (ไกลสุด): ยอดเขาเซียนจางในหมอกเงิน
                        bakeMountainLayer(w, h, {
                            horizonY: 0.72, baseElev: 0.04, maxElev: 0.34, valleyDepth: 0.45, valleyWidth: 0.28,
                            freq: 7.2, seed: 1.4, roughness: 0.085,
                            spires: [{ x: 0.14, h: 0.21, w: 0.09 }, { x: 0.28, h: 0.14, w: 0.08 }, { x: 0.73, h: 0.15, w: 0.08 }, { x: 0.87, h: 0.23, w: 0.09 }],
                            topCol: 'rgba(19, 48, 92, 0.58)', midCol: 'rgba(28, 72, 128, 0.36)', fogCol: 'rgba(116, 182, 228, 0.12)',
                            rimRGB: '214, 240, 255', rimAlpha: 0.22, rimWidth: 2.2
                        }),
                        // ระยะที่ 2 (กลางไกล): ทิวเขาแหลมซ้อนเหลื่อมรับแสงจันทราหยกทอง
                        bakeMountainLayer(w, h, {
                            horizonY: 0.77, baseElev: 0.04, maxElev: 0.32, valleyDepth: 0.62, valleyWidth: 0.30,
                            freq: 6.4, seed: 5.9, roughness: 0.09,
                            spires: [{ x: 0.08, h: 0.24, w: 0.08 }, { x: 0.22, h: 0.17, w: 0.07 }, { x: 0.79, h: 0.18, w: 0.075 }, { x: 0.93, h: 0.25, w: 0.085 }],
                            topCol: 'rgba(10, 29, 64, 0.80)', midCol: 'rgba(18, 52, 102, 0.56)', fogCol: 'rgba(92, 162, 218, 0.16)',
                            rimRGB: '254, 240, 195', rimAlpha: 0.30, rimWidth: 2.6
                        }),
                        // ระยะที่ 3 (กลางใกล้): ชะง่อนผาหมึกเข้มขับความลึกของหุบเขา
                        bakeMountainLayer(w, h, {
                            horizonY: 0.84, baseElev: 0.03, maxElev: 0.28, valleyDepth: 0.78, valleyWidth: 0.34,
                            freq: 5.5, seed: 11.3, roughness: 0.08,
                            spires: [{ x: 0.05, h: 0.22, w: 0.08 }, { x: 0.16, h: 0.13, w: 0.065 }, { x: 0.84, h: 0.14, w: 0.07 }, { x: 0.96, h: 0.23, w: 0.085 }],
                            topCol: 'rgba(5, 16, 40, 0.92)', midCol: 'rgba(11, 34, 72, 0.72)', fogCol: 'rgba(72, 138, 198, 0.14)',
                            rimRGB: '167, 243, 208', rimAlpha: 0.26, rimWidth: 2.4
                        }),
                        // ระยะที่ 4 (หน้าสุดขอบซ้าย-ขวา): ผาหินมืดเงา Chiaroscuro โอบฉากภาพยนตร์
                        bakeMountainLayer(w, h, {
                            horizonY: 0.92, baseElev: 0.01, maxElev: 0.22, valleyDepth: 0.96, valleyWidth: 0.42,
                            freq: 4.8, seed: 17.8, roughness: 0.055,
                            spires: [{ x: 0.02, h: 0.18, w: 0.075 }, { x: 0.98, h: 0.19, w: 0.075 }],
                            topCol: 'rgba(3, 9, 24, 0.95)', midCol: 'rgba(6, 18, 44, 0.76)', fogCol: 'rgba(56, 112, 174, 0)',
                            rimRGB: '186, 230, 253', rimAlpha: 0.18, rimWidth: 2.0
                        })
                    ];
                };

                // =========================================================================
                // B. PRE-BAKED SOFT GLOW, TEXTURED MOON & MULTI-TIER PEACH BLOSSOM SPRITES
                // =========================================================================
                const createSoftGlowSprite = (stops) => {
                    const sc = document.createElement('canvas');
                    sc.width = 64; sc.height = 64;
                    const sctx = sc.getContext('2d');
                    const g = sctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
                    sctx.fillStyle = g;
                    sctx.fillRect(0, 0, 64, 64);
                    return sc;
                };

                const glowSprites = {
                    peach: createSoftGlowSprite([[0, 'rgba(255,248,252,0.96)'], [0.24, 'rgba(251,207,232,0.64)'], [0.58, 'rgba(244,114,182,0.24)'], [1, 'rgba(244,114,182,0)']]),
                    gold:  createSoftGlowSprite([[0, 'rgba(255,254,244,0.98)'], [0.25, 'rgba(254,240,178,0.60)'], [0.60, 'rgba(251,191,36,0.20)'], [1, 'rgba(251,191,36,0)']]),
                    jade:  createSoftGlowSprite([[0, 'rgba(244,255,250,0.94)'], [0.25, 'rgba(167,243,208,0.58)'], [0.58, 'rgba(56,189,248,0.20)'], [1, 'rgba(56,189,248,0)']])
                };

                // ดวงจันทราหยกทองที่มีพื้นผิวเงาจันทร์อ่อนๆ (Celestial Jade-Gold Moon)
                const bakeMoonSprite = () => {
                    const sz = 220;
                    const sc = document.createElement('canvas');
                    sc.width = sz; sc.height = sz;
                    const c = sc.getContext('2d');
                    const cx = sz / 2, cy = sz / 2, r = 82;

                    const baseG = c.createRadialGradient(cx - 16, cy - 16, 8, cx, cy, r);
                    baseG.addColorStop(0, 'rgba(255, 254, 245, 0.98)');
                    baseG.addColorStop(0.52, 'rgba(254, 246, 214, 0.92)');
                    baseG.addColorStop(0.84, 'rgba(248, 228, 168, 0.78)');
                    baseG.addColorStop(1, 'rgba(167, 243, 208, 0.0)');
                    c.fillStyle = baseG;
                    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();

                    // เงาพื้นผิวดวงจันทร์นุ่มๆ ด้านใน
                    c.save();
                    c.beginPath(); c.arc(cx, cy, r * 0.92, 0, Math.PI * 2); c.clip();
                    const maria = [
                        { x: -24, y: -14, rx: 28, ry: 22, a: 0.09 },
                        { x: 18,  y: -22, rx: 22, ry: 18, a: 0.07 },
                        { x: 14,  y: 18,  rx: 32, ry: 24, a: 0.08 },
                        { x: -12, y: 26,  rx: 20, ry: 14, a: 0.06 }
                    ];
                    maria.forEach(m => {
                        const mg = c.createRadialGradient(cx + m.x, cy + m.y, 2, cx + m.x, cy + m.y, m.rx);
                        mg.addColorStop(0, `rgba(120, 148, 168, ${m.a})`);
                        mg.addColorStop(1, 'rgba(120, 148, 168, 0)');
                        c.fillStyle = mg;
                        c.beginPath(); c.ellipse(cx + m.x, cy + m.y, m.rx, m.ry, 0.3, 0, Math.PI * 2); c.fill();
                    });
                    c.restore();
                    return sc;
                };
                const moonSprite = bakeMoonSprite();

                // พุ่มดอกท้อชั้นหลัง (Soft Lush Canopy Cluster) เพื่อสร้างมวลพุ่มใหญ่เต็มต้นอย่างเป็นธรรมชาติ
                const createCanopyClusterSprite = (c1, c2) => {
                    const sz = 112;
                    const sc = document.createElement('canvas');
                    sc.width = sz; sc.height = sz;
                    const c = sc.getContext('2d');
                    const cx = sz / 2, cy = sz / 2;
                    const sub = [
                        { x: -16, y: -10, r: 26 }, { x: 18, y: -12, r: 24 },
                        { x: 0, y: 12, r: 28 }, { x: -20, y: 14, r: 20 }, { x: 20, y: 12, r: 22 }
                    ];
                    sub.forEach(p => {
                        const g = c.createRadialGradient(cx + p.x, cy + p.y, 2, cx + p.x, cy + p.y, p.r);
                        g.addColorStop(0, c1);
                        g.addColorStop(0.55, c2);
                        g.addColorStop(1, 'rgba(244, 114, 182, 0)');
                        c.fillStyle = g;
                        c.beginPath(); c.arc(cx + p.x, cy + p.y, p.r, 0, Math.PI * 2); c.fill();
                    });
                    return sc;
                };
                const canopyClusters = [
                    createCanopyClusterSprite('rgba(251, 207, 232, 0.72)', 'rgba(236, 72, 153, 0.34)'),
                    createCanopyClusterSprite('rgba(255, 228, 242, 0.68)', 'rgba(219, 39, 119, 0.28)')
                ];

                // ช่อดอกท้อ 5 กลีบเรียงชั้นพร้อมเกสรทอง
                const createPeachBlossomSprite = (outerCol, midCol, coreCol) => {
                    const sz = 96;
                    const sc = document.createElement('canvas');
                    sc.width = sz; sc.height = sz;
                    const c = sc.getContext('2d');
                    const cx = sz / 2, cy = sz / 2;

                    const halo = c.createRadialGradient(cx, cy, 2, cx, cy, 45);
                    halo.addColorStop(0, 'rgba(255, 240, 246, 0.56)');
                    halo.addColorStop(0.52, 'rgba(244, 114, 182, 0.24)');
                    halo.addColorStop(1, 'rgba(244, 114, 182, 0)');
                    c.fillStyle = halo;
                    c.beginPath(); c.arc(cx, cy, 45, 0, Math.PI * 2); c.fill();

                    for (let i = 0; i < 5; i++) {
                        c.save();
                        c.translate(cx, cy);
                        c.rotate((i * Math.PI * 2) / 5 - Math.PI / 2);
                        const pg = c.createLinearGradient(0, -4, 0, -35);
                        pg.addColorStop(0, coreCol);
                        pg.addColorStop(0.46, midCol);
                        pg.addColorStop(1, outerCol);
                        c.fillStyle = pg;
                        c.beginPath();
                        c.moveTo(0, -3);
                        c.bezierCurveTo(-13.5, -10, -16.5, -28.5, -4.5, -35);
                        c.quadraticCurveTo(0, -30, 4.5, -35);
                        c.bezierCurveTo(16.5, -28.5, 13.5, -10, 0, -3);
                        c.closePath();
                        c.fill();
                        c.strokeStyle = 'rgba(255, 255, 255, 0.48)';
                        c.lineWidth = 0.85;
                        c.stroke();
                        c.restore();
                    }

                    for (let i = 0; i < 5; i++) {
                        c.save();
                        c.translate(cx, cy);
                        c.rotate(((i + 0.5) * Math.PI * 2) / 5 - Math.PI / 2);
                        const ig = c.createLinearGradient(0, -2, 0, -21);
                        ig.addColorStop(0, 'rgba(255, 250, 240, 0.86)');
                        ig.addColorStop(0.55, midCol);
                        ig.addColorStop(1, 'rgba(255, 245, 250, 0.72)');
                        c.fillStyle = ig;
                        c.beginPath();
                        c.moveTo(0, -2);
                        c.bezierCurveTo(-8, -7, -10, -18, -2.6, -21.5);
                        c.quadraticCurveTo(0, -18.5, 2.6, -21.5);
                        c.bezierCurveTo(10, -18, 8, -7, 0, -2);
                        c.closePath();
                        c.fill();
                        c.restore();
                    }

                    for (let s = 0; s < 7; s++) {
                        const a = (s * Math.PI * 2) / 7;
                        const sx = cx + Math.cos(a) * 10.5;
                        const sy = cy + Math.sin(a) * 10.5;
                        c.strokeStyle = 'rgba(254, 243, 199, 0.9)';
                        c.lineWidth = 1;
                        c.beginPath(); c.moveTo(cx, cy); c.lineTo(sx, sy); c.stroke();
                        c.fillStyle = '#fde68a';
                        c.beginPath(); c.arc(sx, sy, 1.9, 0, Math.PI * 2); c.fill();
                    }
                    c.fillStyle = '#fffbeb';
                    c.beginPath(); c.arc(cx, cy, 3.8, 0, Math.PI * 2); c.fill();
                    return sc;
                };

                const createBudSprite = () => {
                    const sc = document.createElement('canvas');
                    sc.width = 36; sc.height = 36;
                    const c = sc.getContext('2d');
                    const g = c.createRadialGradient(18, 18, 1, 18, 18, 12);
                    g.addColorStop(0, 'rgba(255, 241, 246, 0.9)');
                    g.addColorStop(0.5, 'rgba(244, 114, 182, 0.5)');
                    g.addColorStop(1, 'rgba(244, 114, 182, 0)');
                    c.fillStyle = g;
                    c.beginPath(); c.arc(18, 18, 12, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#f9a8d4';
                    c.beginPath(); c.ellipse(18, 18, 3.6, 5.4, 0.25, 0, Math.PI * 2); c.fill();
                    return sc;
                };

                const blossomSprites = [
                    createPeachBlossomSprite('#fff5f9', '#fbcfe8', '#f472b6'),
                    createPeachBlossomSprite('#fff8fb', '#f9a8d4', '#ec4899'),
                    createPeachBlossomSprite('#fffbeb', '#fde2f3', '#f472b6'),
                    createPeachBlossomSprite('#ffffff', '#fce7f3', '#f9a8d4')
                ];
                const budSprite = createBudSprite();

                // =========================================================================
                // C. 12 AMBIENT QI ROUTES (กรอบซ้าย-ขวา -> ลำต้น -> 12 กิ่งแผ่กว้าง) + 185+ BLOSSOM CANOPY
                //    - ดอกท้อเกิดเฉพาะบนกิ่งเรือนยอดด้านบน (ห้ามเกิดบนลำต้นและห้ามบังกรอบกระจก 100%)
                //    - เมื่อแสงวิ่งผ่านกิ่งตรงไหน ดอกท้อตรงนั้นจะบานไล่ตามแสงและสะสมเป็นพุ่มใหญ่เต็มต้น!
                // =========================================================================
                let ambientRoutes = [];
                let blossomNodes = [];

                const sampleCatmullRomArc = (pts, samples = 110) => {
                    if (!pts || pts.length < 2) return [];
                    const dense = [];
                    const segs = pts.length - 1;
                    const subPerSeg = 14;
                    for (let i = 0; i < segs; i++) {
                        const p0 = pts[Math.max(0, i - 1)];
                        const p1 = pts[i];
                        const p2 = pts[i + 1];
                        const p3 = pts[Math.min(segs, i + 2)];
                        for (let s = 0; s < subPerSeg; s++) {
                            const t = s / subPerSeg;
                            const t2 = t * t, t3 = t2 * t;
                            dense.push({
                                x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
                                y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
                            });
                        }
                    }
                    dense.push(pts[pts.length - 1]);
                    const cum = [0];
                    for (let i = 1; i < dense.length; i++) {
                        cum.push(cum[i - 1] + Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y));
                    }
                    const totalLen = Math.max(1, cum[cum.length - 1]);
                    const out = [];
                    let cursor = 0;
                    for (let k = 0; k <= samples; k++) {
                        const target = (k / samples) * totalLen;
                        while (cursor < cum.length - 2 && cum[cursor + 1] < target) cursor++;
                        const span = Math.max(0.0001, cum[cursor + 1] - cum[cursor]);
                        const f = (target - cum[cursor]) / span;
                        out.push({
                            x: dense[cursor].x + (dense[cursor + 1].x - dense[cursor].x) * f,
                            y: dense[cursor].y + (dense[cursor + 1].y - dense[cursor].y) * f
                        });
                    }
                    return out;
                };

                const sampleRoutePoint = (pts, u) => {
                    const maxIdx = pts.length - 1;
                    const clamped = Math.max(0, Math.min(1, u)) * maxIdx;
                    const i0 = Math.floor(clamped);
                    const i1 = Math.min(maxIdx, i0 + 1);
                    const f = clamped - i0;
                    return {
                        x: pts[i0].x + (pts[i1].x - pts[i0].x) * f,
                        y: pts[i0].y + (pts[i1].y - pts[i0].y) * f
                    };
                };

                const rebuildRoutesAndBlossoms = (heroRect) => {
                    if (flare.treeW <= 0 || flare.treeH <= 0) return;
                    // แปลงพิกัด SVG (viewBox="0 0 640 420") เป็นพิกัด Canvas จริง
                    const svgPt = (sx, sy) => ({
                        x: flare.treeLeft + (sx / 640) * flare.treeW,
                        y: flare.treeTop + (sy / 420) * flare.treeH
                    });

                    const isDesktop = flare.w >= 768;
                    const glassEl = isDesktop ? glassStageRef.current : mobileGlassRef.current;
                    let leftGlassArc = [];
                    let rightGlassArc = [];
                    let glassTopSafeY = heroRect.height * 0.62;

                    if (glassEl) {
                        const gr = glassEl.getBoundingClientRect();
                        if (gr.width > 0 && gr.height > 0) {
                            const gx = gr.left - heroRect.left;
                            const gy = gr.top - heroRect.top;
                            const gw = gr.width;
                            const gh = gr.height;
                            // เส้นปลอดภัยเหนือกรอบกระจก (ห้ามดอกท้อใดๆ ลงมาบังพื้นที่กรอบกระจก)
                            glassTopSafeY = gy - 14;
                            if (isDesktop) {
                                leftGlassArc = [
                                    { x: gx + gw * 0.44, y: gy + gh * 0.98 },
                                    { x: gx + gw * 0.255, y: gy + gh * 0.94 },
                                    { x: gx + gw * 0.238, y: gy + gh * 0.56 },
                                    { x: gx + gw * 0.025, y: gy + gh * 0.535 },
                                    { x: gx + gw * 0.008, y: gy + gh * 0.28 },
                                    { x: gx + gw * 0.032, y: gy + gh * 0.03 },
                                    { x: gx + gw * 0.28, y: gy + gh * 0.015 }
                                ];
                                rightGlassArc = [
                                    { x: gx + gw * 0.56, y: gy + gh * 0.98 },
                                    { x: gx + gw * 0.96, y: gy + gh * 0.96 },
                                    { x: gx + gw * 0.992, y: gy + gh * 0.68 },
                                    { x: gx + gw * 0.97, y: gy + gh * 0.39 },
                                    { x: gx + gw * 0.75, y: gy + gh * 0.36 },
                                    { x: gx + gw * 0.735, y: gy + gh * 0.06 },
                                    { x: gx + gw * 0.58, y: gy + gh * 0.015 }
                                ];
                            } else {
                                leftGlassArc = [
                                    { x: gx + gw * 0.44, y: gy + gh },
                                    { x: gx + 20, y: gy + gh - 3 },
                                    { x: gx + 2, y: gy + gh * 0.72 },
                                    { x: gx + 2, y: gy + gh * 0.30 },
                                    { x: gx + 20, y: gy + 4 },
                                    { x: gx + gw * 0.28, y: gy + 1 }
                                ];
                                rightGlassArc = [
                                    { x: gx + gw * 0.56, y: gy + gh },
                                    { x: gx + gw - 20, y: gy + gh - 3 },
                                    { x: gx + gw - 2, y: gy + gh * 0.72 },
                                    { x: gx + gw - 2, y: gy + gh * 0.30 },
                                    { x: gx + gw - 20, y: gy + 4 },
                                    { x: gx + gw * 0.72, y: gy + 1 }
                                ];
                            }
                        }
                    }

                    const leftTrunk = [svgPt(254, 386), svgPt(292, 336), svgPt(308, 282), svgPt(312, 232)];
                    const rightTrunk = [svgPt(386, 386), svgPt(348, 336), svgPt(332, 282), svgPt(328, 232)];

                    // 12 กิ่งดอกท้อแผ่กว้างสง่างามระดับต้นไม้พันปีแดนเซียน (6 ซ้าย + 6 ขวา/ยอด)
                    const branchDefs = [
                        { glass: leftGlassArc,  trunk: leftTrunk,  bPts: [svgPt(308, 224), svgPt(236, 212), svgPt(148, 216), svgPt(64,  234)], sprite: 'peach', dur: 6.4, phase: 0.00 },
                        { glass: leftGlassArc,  trunk: leftTrunk,  bPts: [svgPt(306, 202), svgPt(222, 180), svgPt(132, 174), svgPt(46,  188)], sprite: 'gold',  dur: 6.8, phase: 0.14 },
                        { glass: leftGlassArc,  trunk: leftTrunk,  bPts: [svgPt(308, 178), svgPt(232, 146), svgPt(156, 128), svgPt(84,  136)], sprite: 'peach', dur: 7.2, phase: 0.28 },
                        { glass: leftGlassArc,  trunk: leftTrunk,  bPts: [svgPt(312, 154), svgPt(254, 114), svgPt(194, 86),  svgPt(136, 82)],  sprite: 'jade',  dur: 7.5, phase: 0.42 },
                        { glass: leftGlassArc,  trunk: leftTrunk,  bPts: [svgPt(316, 134), svgPt(280, 86),  svgPt(242, 54),  svgPt(206, 44)],  sprite: 'gold',  dur: 6.9, phase: 0.56 },
                        { glass: leftGlassArc,  trunk: leftTrunk,  bPts: [svgPt(248, 198), svgPt(202, 166), svgPt(168, 146), svgPt(134, 152)], sprite: 'peach', dur: 7.1, phase: 0.70 },

                        { glass: rightGlassArc, trunk: rightTrunk, bPts: [svgPt(332, 224), svgPt(404, 212), svgPt(492, 216), svgPt(576, 234)], sprite: 'peach', dur: 6.6, phase: 0.08 },
                        { glass: rightGlassArc, trunk: rightTrunk, bPts: [svgPt(334, 202), svgPt(418, 180), svgPt(508, 174), svgPt(594, 188)], sprite: 'jade',  dur: 7.0, phase: 0.22 },
                        { glass: rightGlassArc, trunk: rightTrunk, bPts: [svgPt(332, 178), svgPt(408, 146), svgPt(484, 128), svgPt(556, 136)], sprite: 'peach', dur: 7.4, phase: 0.36 },
                        { glass: rightGlassArc, trunk: rightTrunk, bPts: [svgPt(328, 154), svgPt(386, 114), svgPt(446, 86),  svgPt(504, 82)],  sprite: 'gold',  dur: 7.6, phase: 0.50 },
                        { glass: rightGlassArc, trunk: rightTrunk, bPts: [svgPt(324, 134), svgPt(360, 86),  svgPt(398, 54),  svgPt(434, 44)],  sprite: 'peach', dur: 6.8, phase: 0.64 },
                        { glass: rightGlassArc, trunk: rightTrunk, bPts: [svgPt(320, 152), svgPt(318, 106), svgPt(320, 62),  svgPt(320, 26)],  sprite: 'gold',  dur: 6.2, phase: 0.80 }
                    ];

                    ambientRoutes = branchDefs.map(b => {
                        const glassTrunkPts = [...b.glass, ...b.trunk];
                        const fullPts = [...glassTrunkPts, ...b.bPts];
                        // คำนวณสัดส่วน u ที่แท้จริงซึ่งกิ่งแยกตัวออกจากลำต้น เพื่อให้ดอกท้อเกิดบนกิ่งจริง 100%
                        const gtSamples = sampleCatmullRomArc(glassTrunkPts, 40);
                        const fullSamples = sampleCatmullRomArc(fullPts, 116);
                        let gtLen = 0, fullLen = 0;
                        for (let i = 1; i < gtSamples.length; i++) gtLen += Math.hypot(gtSamples[i].x - gtSamples[i - 1].x, gtSamples[i].y - gtSamples[i - 1].y);
                        for (let i = 1; i < fullSamples.length; i++) fullLen += Math.hypot(fullSamples[i].x - fullSamples[i - 1].x, fullSamples[i].y - fullSamples[i - 1].y);
                        const branchStartU = Math.max(0.52, Math.min(0.76, (gtLen / Math.max(1, fullLen)) + 0.03));
                        return {
                            pts: fullSamples,
                            branchStartU,
                            sprite: b.sprite,
                            dur: b.dur,
                            phase: b.phase
                        };
                    });

                    // สร้างพุ่มดอกท้อหนาแน่น 185+ ช่อ (3 ชั้นความลึก: พุ่มเงาชมพูด้านหลัง + ดอกท้อ 5 กลีบชั้นกลาง + ดอกท้อมุกสว่างด้านหน้า)
                    const prevStates = blossomNodes;
                    const nextNodes = [];
                    const scaleRef = Math.max(0.64, Math.min(1.18, flare.treeW / 700));
                    const isMobile = flare.w < 768;
                    const stopsPerBranch = isMobile ? 10 : 14;

                    ambientRoutes.forEach((rt, rIdx) => {
                        for (let k = 0; k < stopsPerBranch; k++) {
                            const frac = k / Math.max(1, stopsPerBranch - 1);
                            const u = rt.branchStartU + frac * (1 - rt.branchStartU);
                            const pt = sampleRoutePoint(rt.pts, u);
                            const seed = rIdx * 31 + k * 17;

                            // 1) พุ่มดอกท้อชั้นหลัง (Canopy Cluster) สร้างความหนาฟูเป็นพุ่มใหญ่
                            if (k % 2 === 0 && pt.y < glassTopSafeY - 12) {
                                const idC = nextNodes.length;
                                const prevC = prevStates[idC];
                                nextNodes.push({
                                    kind: 'cluster',
                                    routeIdx: rIdx,
                                    u,
                                    x: pt.x + Math.sin(seed * 1.9) * 18 * scaleRef,
                                    y: Math.min(glassTopSafeY - 16, pt.y + Math.cos(seed * 1.3) * 14 * scaleRef),
                                    baseSize: (34 + (seed % 4) * 7) * scaleRef,
                                    rot: (seed * 0.5) % (Math.PI * 2),
                                    spriteIdx: seed % canopyClusters.length,
                                    bloomed: prevC ? prevC.bloomed : false,
                                    bloom: prevC ? prevC.bloom : 0,
                                    haloFlash: prevC ? prevC.haloFlash : 0,
                                    lastWaveTs: prevC ? prevC.lastWaveTs : 0
                                });
                            }

                            // 2) ดอกท้อ 5 กลีบเรียงชั้น 1-2 ดอกต่อจุด กระจายโอบกิ่งให้ฟูเป็นพุ่มใหญ่เต็มต้น
                            const subCount = (k >= 2 && k % 3 === 1) ? 2 : 1;
                            for (let sc = 0; sc < subCount; sc++) {
                                const s2 = seed + sc * 43;
                                const spread = (14 + frac * 18) * scaleRef;
                                const bx = pt.x + Math.sin(s2 * 2.3) * spread;
                                const by = pt.y + Math.cos(s2 * 1.7) * (spread * 0.78);
                                // ตรวจสอบซ้ำ: ห้ามดอกท้ออยู่ต่ำกว่าขอบบนของกรอบกระจกเด็ดขาด
                                if (by > glassTopSafeY) continue;
                                const id = nextNodes.length;
                                const prev = prevStates[id];
                                nextNodes.push({
                                    kind: 'blossom',
                                    routeIdx: rIdx,
                                    u: Math.min(0.995, u + sc * 0.012),
                                    x: bx,
                                    y: by,
                                    baseSize: (11.5 + ((s2 % 6) * 2.6) + frac * 3.5) * scaleRef,
                                    rot: (s2 * 0.85) % (Math.PI * 2),
                                    spriteIdx: s2 % blossomSprites.length,
                                    bloomed: prev ? prev.bloomed : false,
                                    bloom: prev ? prev.bloom : 0.05,
                                    haloFlash: prev ? prev.haloFlash : 0,
                                    lastWaveTs: prev ? prev.lastWaveTs : 0
                                });
                            }
                        }
                    });
                    blossomNodes = nextNodes;
                };

                // =========================================================================
                // D. WIND-BLOWN PEACH PETALS, DRIFTING JADE LEAVES & TOUCH-TO-BLOOM RIPPLES
                // =========================================================================
                const driftingPetals = [];
                const fireflies = [];
                const bloomRipples = [];
                let lastTrailTs = 0;

                const spawnWindParticle = (x, y, boosted = false, forceLeaf = false) => {
                    const maxCap = flare.w < 768 ? 44 : 72;
                    if (driftingPetals.length >= maxCap) driftingPetals.shift();
                    const isLeaf = forceLeaf || Math.random() < 0.16;
                    driftingPetals.push({
                        isLeaf,
                        x: x + (Math.random() - 0.5) * 14,
                        y: y + (Math.random() - 0.5) * 10,
                        vx: boosted ? (0.45 + Math.random() * 1.4) : (0.38 + Math.random() * 0.72),
                        vy: boosted ? -(0.25 + Math.random() * 0.55) : (0.22 + Math.random() * 0.46),
                        size: isLeaf ? (5.2 + Math.random() * 3.0) : (4.2 + Math.random() * 3.2),
                        rot: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.065,
                        flipSeed: Math.random() * Math.PI * 2,
                        life: 0,
                        maxLife: 4.6 + Math.random() * 3.4,
                        color: isLeaf
                            ? (Math.random() > 0.5 ? '#5eead4' : '#6ee7b7')
                            : (Math.random() > 0.42 ? '#fbcfe8' : (Math.random() > 0.5 ? '#f9a8d4' : '#fff5f8'))
                    });
                };

                const spawnFirefly = (x, y, boosted = false, fixedSprite = null) => {
                    if (fireflies.length >= 46) fireflies.shift();
                    const angle = Math.random() * Math.PI * 2;
                    const speed = boosted ? (0.55 + Math.random() * 1.35) : (0.14 + Math.random() * 0.36);
                    fireflies.push({
                        x: x + (Math.random() - 0.5) * 10,
                        y: y + (Math.random() - 0.5) * 10,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - (boosted ? 0.6 : 0.32),
                        r: boosted ? (5.4 + Math.random() * 4.8) : (4.0 + Math.random() * 3.6),
                        life: 0,
                        maxLife: 1.15 + Math.random() * 0.8,
                        twinkle: Math.random() * Math.PI * 2,
                        sprite: fixedSprite || (Math.random() > 0.45 ? 'gold' : 'peach')
                    });
                };

                const spawnBloomBurst = (clientX, clientY) => {
                    const rect = stage.getBoundingClientRect();
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;

                    if (bloomRipples.length >= 5) bloomRipples.shift();
                    bloomRipples.push({ x, y, r: 12, maxR: Math.min(rect.width, rect.height) * 0.28 + 60, life: 0, maxLife: 1.2 });

                    for (let i = 0; i < 10; i++) spawnFirefly(x, y, true);
                    for (let i = 0; i < 8; i++) spawnWindParticle(x, y, true, i === 0);

                    const wakeRadius = Math.max(170, flare.treeW * 0.46);
                    const nowTs = performance.now();
                    for (let i = 0; i < blossomNodes.length; i++) {
                        const b = blossomNodes[i];
                        if (Math.hypot(b.x - x, b.y - y) < wakeRadius) {
                            b.bloomed = true;
                            b.lastWaveTs = nowTs;
                            b.haloFlash = 1.0;
                            if (Math.random() < 0.18) spawnWindParticle(b.x, b.y, true);
                        }
                    }
                };

                const fitLineToWidth = (el, targetW, minPx, maxPx) => {
                    if (!el || targetW <= 0) return;
                    const curSize = parseFloat(window.getComputedStyle(el).fontSize) || 20;
                    const measured = el.scrollWidth;
                    if (!measured) return;
                    const nextSize = Math.max(minPx, Math.min(maxPx, (targetW / measured) * curSize));
                    if (Math.abs(nextSize - curSize) > 0.4) {
                        el.style.fontSize = `${nextSize.toFixed(2)}px`;
                    }
                };

                const syncLayout = (forceTextRefit = false) => {
                    const heroRect = stage.getBoundingClientRect();
                    const nw = Math.max(1, Math.round(heroRect.width));
                    const nh = Math.max(1, Math.round(heroRect.height));

                    const widthChanged = Math.abs(nw - flare.w) > 3;
                    const majorHeightChanged = Math.abs(nh - flare.h) > 120;
                    if (flare.w === 0 || widthChanged || majorHeightChanged || forceTextRefit) {
                        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                        flare.w = nw;
                        flare.h = nh;
                        [bgCanvas, fxCanvas].forEach((c) => {
                            c.width = Math.round(nw * dpr);
                            c.height = Math.round(nh * dpr);
                        });
                        bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

                        rebuildMountains(nw, nh);

                        if (treeSvgRef.current) {
                            const tr = treeSvgRef.current.getBoundingClientRect();
                            if (tr.width > 0 && tr.height > 0) {
                                flare.treeLeft = tr.left - heroRect.left;
                                flare.treeTop = tr.top - heroRect.top;
                                flare.treeW = tr.width;
                                flare.treeH = tr.height;
                                flare.moonX = flare.treeLeft + tr.width * 0.5;
                                flare.moonY = flare.treeTop + tr.height * (nw < 768 ? 0.30 : 0.29);
                            }
                        }

                        if (forceTextRefit || Math.abs(nw - flare.lastFitW) > 3) {
                            flare.lastFitW = nw;
                            if (textFitBoxRef.current && fitLine1Ref.current && textFitBoxRef.current.clientWidth > 0) {
                                const tw = textFitBoxRef.current.clientWidth * 0.98;
                                fitLineToWidth(fitLine1Ref.current, tw, 16, 36);
                                if (fitLine2Ref.current) {
                                    const cw = centerCtaRef.current?.clientWidth ? centerCtaRef.current.clientWidth * 0.94 : tw * 0.49;
                                    fitLineToWidth(fitLine2Ref.current, Math.min(tw * 0.49, cw), 16, 34);
                                }
                            }
                            if (mTextFitBoxRef.current && mFitLine1Ref.current && mFitLine2Ref.current && mTextFitBoxRef.current.clientWidth > 0) {
                                const mw = mTextFitBoxRef.current.clientWidth * 0.96;
                                fitLineToWidth(mFitLine1Ref.current, mw, 13, 21);
                                fitLineToWidth(mFitLine2Ref.current, mw * 0.54, 17, 26);
                            }
                        }

                        rebuildRoutesAndBlossoms(heroRect);
                    }
                };

                const drawSoftOrb = (c, x, y, r, stops) => {
                    const g = c.createRadialGradient(x, y, 0, x, y, r);
                    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
                    c.fillStyle = g;
                    c.beginPath();
                    c.arc(x, y, r, 0, Math.PI * 2);
                    c.fill();
                };

                const drawSoftLightBeam = (c, ox, oy, ang, len, halfW, colInner, colMid) => {
                    c.save();
                    c.translate(ox, oy);
                    c.rotate(ang);
                    c.scale(1, halfW / len);
                    const g = c.createRadialGradient(len * 0.36, 0, 0, len * 0.36, 0, len * 0.64);
                    g.addColorStop(0, colInner);
                    g.addColorStop(0.45, colMid);
                    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    c.fillStyle = g;
                    c.beginPath();
                    c.arc(len * 0.36, 0, len * 0.64, 0, Math.PI * 2);
                    c.fill();
                    c.restore();
                };

                let alive = true, rafId = null, prevFrameTs = performance.now(), breezeTimer = 0;
                const renderLoop = (now) => {
                    if (!alive) return;
                    rafId = requestAnimationFrame(renderLoop);
                    if (document.hidden || !flare.inView || flare.w <= 0) return;

                    const dt = Math.min(0.05, Math.max(0.001, (now - prevFrameTs) / 1000));
                    prevFrameTs = now;
                    breezeTimer += dt;

                    const w = flare.w, h = flare.h;
                    const minDim = Math.min(w, h);
                    const t = now * 0.001;
                    const k = 0.90 * (0.94 + 0.06 * Math.sin(t * 0.8));

                    flare.mouseX += (flare.targetMouseX - flare.mouseX) * 0.045;
                    flare.mouseY += (flare.targetMouseY - flare.mouseY) * 0.045;

                    // =========================================================================
                    // LAYER 1 (bgCtx): จันทราหยกทอง + ลำแสงสวรรค์ + ทิวเขา 4 ระยะสลับชั้นหมอกเย็นฟุ้ง
                    // =========================================================================
                    bgCtx.clearRect(0, 0, w, h);

                    const mx = flare.moonX + flare.mouseX * 14;
                    const my = flare.moonY + flare.mouseY * 7;
                    const moonR = Math.min(w * 0.22, minDim * 0.23, 152);

                    // 1) รัศมีจันทราหยกทองและวงแหวนแสงศักดิ์สิทธิ์
                    bgCtx.save();
                    bgCtx.globalCompositeOperation = 'lighter';
                    drawSoftOrb(bgCtx, mx, my, moonR * 3.1, [
                        [0, `rgba(255, 252, 236, ${(0.34 * k).toFixed(3)})`],
                        [0.20, `rgba(254, 240, 186, ${(0.22 * k).toFixed(3)})`],
                        [0.44, `rgba(110, 231, 183, ${(0.12 * k).toFixed(3)})`],
                        [0.70, `rgba(56, 189, 248, ${(0.06 * k).toFixed(3)})`],
                        [1, 'rgba(0, 0, 0, 0)']
                    ]);
                    bgCtx.restore();

                    // ตัวดวงจันทราหยกทองมีรายละเอียดพื้นผิว
                    bgCtx.save();
                    bgCtx.globalAlpha = 0.92;
                    bgCtx.drawImage(moonSprite, mx - moonR * 1.15, my - moonR * 1.15, moonR * 2.3, moonR * 2.3);
                    bgCtx.restore();

                    // วงแหวนอักขระแสงบางเบาหมุนช้าๆ รอบจันทรา
                    bgCtx.save();
                    bgCtx.globalCompositeOperation = 'lighter';
                    bgCtx.translate(mx, my);
                    bgCtx.rotate(t * 0.06);
                    bgCtx.strokeStyle = `rgba(254, 240, 178, ${(0.18 * k).toFixed(3)})`;
                    bgCtx.lineWidth = 1.4;
                    bgCtx.setLineDash([34, 18, 10, 22]);
                    bgCtx.beginPath(); bgCtx.arc(0, 0, moonR * 1.16, 0, Math.PI * 2); bgCtx.stroke();
                    bgCtx.rotate(-t * 0.11);
                    bgCtx.strokeStyle = `rgba(167, 243, 208, ${(0.12 * k).toFixed(3)})`;
                    bgCtx.setLineDash([18, 28]);
                    bgCtx.beginPath(); bgCtx.arc(0, 0, moonR * 1.38, 0, Math.PI * 2); bgCtx.stroke();
                    bgCtx.setLineDash([]);
                    bgCtx.restore();

                    // 2) ทิวเขาแดนเซียน 4 ระยะสลับชั้นหมอกเย็นฟุ้ง (Atmospheric Depth Interleaving!)
                    const drift1 = ((t * 11) % (w * 1.35)) - w * 0.35;
                    const drift2 = w - (((t * 14) % (w * 1.40)));

                    bgCtx.save();
                    bgCtx.globalCompositeOperation = 'source-over';
                    if (mountainLayers[0]) {
                        bgCtx.globalAlpha = 0.88;
                        bgCtx.drawImage(mountainLayers[0], flare.mouseX * 4, 0, w, h);
                    }
                    // หมอกเย็นชั้นที่ 1 คั่นกลางระหว่างภูเขาระยะ 1 และระยะ 2
                    bgCtx.globalAlpha = 0.62;
                    bgCtx.drawImage(mistSprites.coolFar, -w * 0.12 + Math.sin(t * 0.14) * 26, h * 0.50, w * 1.24, h * 0.36);

                    if (mountainLayers[1]) {
                        bgCtx.globalAlpha = 0.94;
                        bgCtx.drawImage(mountainLayers[1], flare.mouseX * 9, 0, w, h);
                    }
                    // หมอกเย็นชั้นที่ 2 ลอยพาดหุบเขาซ้าย–ขวา
                    bgCtx.globalAlpha = 0.74;
                    bgCtx.drawImage(mistSprites.coolMidL, -w * 0.16 + Math.sin(t * 0.19) * 22, h * 0.54, w * 0.78, h * 0.38);
                    bgCtx.globalAlpha = 0.74;
                    bgCtx.drawImage(mistSprites.coolMidR, w * 0.38 - Math.sin(t * 0.17 + 1.1) * 22, h * 0.53, w * 0.78, h * 0.39);

                    if (mountainLayers[2]) {
                        bgCtx.globalAlpha = 0.96;
                        bgCtx.drawImage(mountainLayers[2], flare.mouseX * 15, 0, w, h);
                    }
                    // ปอยหมอกเย็นบางลอยสวนกันผ่านหน้าชะง่อนผา
                    bgCtx.globalAlpha = 0.52;
                    bgCtx.drawImage(mistSprites.coolVeil, drift1 - w * 0.32, h * 0.56, w * 0.86, h * 0.28);

                    if (mountainLayers[3]) {
                        bgCtx.globalAlpha = 0.98;
                        bgCtx.drawImage(mountainLayers[3], flare.mouseX * 22, 0, w, h);
                    }
                    // ทะเลหมอกเย็นฟุ้งฐานล่างโอบหุบเขาและโคนรากต้นดอกท้อ
                    bgCtx.globalAlpha = 0.76;
                    bgCtx.drawImage(mistSprites.coolFar, -w * 0.14 - Math.sin(t * 0.15) * 24, h * 0.68, w * 1.28, h * 0.38);
                    bgCtx.globalAlpha = 0.44;
                    bgCtx.drawImage(mistSprites.coolVeil, drift2 - w * 0.38, h * 0.66, w * 0.84, h * 0.26);
                    bgCtx.restore();

                    // 3) ลำแสงสวรรค์สาดส่อง (Volumetric Heavenly God Rays) ส่องทแยงจากจันทราลงสู่หุบเขาหมอกเย็น
                    bgCtx.save();
                    bgCtx.globalCompositeOperation = 'lighter';
                    const rayAngles = [-0.56, -0.32, -0.11, 0.10, 0.31, 0.54];
                    const rayLen = h * 0.82;
                    for (let i = 0; i < rayAngles.length; i++) {
                        const sway = Math.sin(t * 0.28 + i * 1.3) * 0.03 + flare.mouseX * 0.022;
                        const ang = Math.PI * 0.5 + rayAngles[i] + sway;
                        const pulse = 0.044 + 0.018 * Math.sin(t * 0.62 + i * 1.5);
                        drawSoftLightBeam(
                            bgCtx, mx, my - moonR * 0.25, ang, rayLen, minDim * 0.15,
                            `rgba(254, 249, 212, ${(pulse * 1.55 * k).toFixed(3)})`,
                            i % 2 === 0
                                ? `rgba(110, 231, 183, ${(pulse * 0.74 * k).toFixed(3)})`
                                : `rgba(147, 210, 252, ${(pulse * 0.72 * k).toFixed(3)})`
                        );
                    }
                    bgCtx.restore();

                    // =========================================================================
                    // LAYER 2 (fxCtx • z-18 อยู่หน้ากิ่งไม้แต่หลังกรอบกระจก):
                    // แสงปราณแอมเบียน -> บานไล่ตามเส้นแสงจนเป็นพุ่มใหญ่เต็มต้น -> กลีบดอกท้อและใบหยกร่วงปลิวตามลม
                    // =========================================================================
                    fxCtx.clearRect(0, 0, w, h);

                    const activeHeads = [];
                    const isSmallScreen = w < 768;
                    const tailSteps = isSmallScreen ? 14 : 18;
                    const tailSpan = 0.18;
                    const baseGlowRadius = isSmallScreen ? 15 : 19;

                    // 1) วาดสายแสงแอมเบียนเนื้อนุ่มไหลจากขอบกระจกซ้าย–ขวาขึ้นสู่ทั้ง 12 กิ่ง
                    fxCtx.save();
                    fxCtx.globalCompositeOperation = 'lighter';

                    for (let r = 0; r < ambientRoutes.length; r++) {
                        const rt = ambientRoutes[r];
                        if (!rt.pts || rt.pts.length < 4) continue;
                        const rawP = ((t / rt.dur) + rt.phase) % 1;
                        const headU = rawP - 0.03 * Math.sin(rawP * Math.PI * 2);
                        const envFade = Math.sin(Math.min(1, Math.max(0, rawP)) * Math.PI);
                        const spriteImg = glowSprites[rt.sprite] || glowSprites.peach;
                        activeHeads.push(headU);

                        for (let s = 0; s < tailSteps; s++) {
                            const frac = s / (tailSteps - 1);
                            const u = headU - frac * tailSpan;
                            if (u < 0 || u > 1) continue;
                            const pt = sampleRoutePoint(rt.pts, u);
                            const taper = Math.pow(1 - frac, 1.48);
                            const rad = baseGlowRadius * (0.44 + taper * 0.94);
                            fxCtx.globalAlpha = Math.max(0, Math.min(0.60, taper * envFade * 0.42));
                            fxCtx.drawImage(spriteImg, pt.x - rad, pt.y - rad, rad * 2, rad * 2);
                        }

                        if (headU >= 0 && headU <= 1) {
                            const hp = sampleRoutePoint(rt.pts, headU);
                            const headR = baseGlowRadius * 1.35;
                            fxCtx.globalAlpha = Math.max(0, Math.min(0.80, envFade * 0.68));
                            fxCtx.drawImage(glowSprites.gold, hp.x - headR, hp.y - headR, headR * 2, headR * 2);
                        }
                    }
                    fxCtx.restore();

                    // 2) อัปเดตและวาดพุ่มดอกท้อใหญ่เต็มต้น (พุ่มเงาชมพูชั้นหลังก่อน -> ดอกท้อ 5 กลีบชั้นหน้า)
                    const drawBlossomPass = (passKind) => {
                        for (let i = 0; i < blossomNodes.length; i++) {
                            const b = blossomNodes[i];
                            if (b.kind !== passKind) continue;

                            const rHeadU = activeHeads[b.routeIdx] !== undefined ? activeHeads[b.routeIdx] : -1;
                            // ทันทีที่แสงแอมเบียนวิ่งผ่านพิกัด u บนกิ่ง -> ปลุกให้บานและคงความบานเป็นพุ่มใหญ่!
                            if (rHeadU >= b.u - 0.015 && rHeadU <= b.u + 0.065 && now - b.lastWaveTs > 2600) {
                                b.bloomed = true;
                                b.lastWaveTs = now;
                                b.haloFlash = 1.0;
                                if (b.kind === 'blossom' && Math.random() < 0.24) {
                                    spawnWindParticle(b.x, b.y, false, false);
                                }
                            }

                            const breath = b.bloomed ? (0.94 + 0.08 * Math.sin(t * 1.4 + i * 0.7)) : 0;
                            const targetBloom = b.bloomed ? breath : 0.06;
                            const rate = targetBloom > b.bloom ? 4.4 : 1.6;
                            b.bloom += (targetBloom - b.bloom) * (1 - Math.exp(-dt * rate));
                            b.haloFlash = Math.max(0, b.haloFlash - dt * 0.95);

                            const swayX = Math.sin(t * 1.25 + i * 0.8) * (2.2 + b.u * 1.4);
                            const swayY = Math.cos(t * 1.0 + i * 1.1) * 1.5;
                            const bx = b.x + swayX;
                            const by = b.y + swayY;

                            if (b.kind === 'cluster') {
                                if (b.bloom > 0.12) {
                                    const sz = b.baseSize * (0.45 + b.bloom * 0.65);
                                    fxCtx.globalAlpha = Math.min(0.74, b.bloom * 0.66);
                                    fxCtx.drawImage(canopyClusters[b.spriteIdx], bx - sz, by - sz, sz * 2, sz * 2);
                                }
                                continue;
                            }

                            if (b.haloFlash > 0.03) {
                                fxCtx.save();
                                fxCtx.globalCompositeOperation = 'lighter';
                                fxCtx.globalAlpha = b.haloFlash * 0.55;
                                const hr = b.baseSize * (1.45 + (1 - b.haloFlash) * 0.85);
                                fxCtx.drawImage(glowSprites.peach, bx - hr, by - hr, hr * 2, hr * 2);
                                fxCtx.restore();
                            }

                            if (b.bloom < 0.28) {
                                const budR = b.baseSize * 0.56;
                                fxCtx.globalAlpha = 0.75;
                                fxCtx.drawImage(budSprite, bx - budR, by - budR, budR * 2, budR * 2);
                            }
                            if (b.bloom > 0.14) {
                                const openFrac = Math.min(1, (b.bloom - 0.14) / 0.86);
                                const drawSz = b.baseSize * (0.34 + openFrac * 0.88 + b.haloFlash * 0.14);
                                fxCtx.save();
                                fxCtx.translate(bx, by);
                                fxCtx.rotate(b.rot + Math.sin(t * 0.9 + i) * 0.08 + (1 - openFrac) * 0.5);
                                fxCtx.globalAlpha = Math.min(0.98, 0.22 + openFrac * 0.76);
                                fxCtx.drawImage(blossomSprites[b.spriteIdx], -drawSz, -drawSz, drawSz * 2, drawSz * 2);
                                fxCtx.restore();
                            }
                        }
                    };
                    drawBlossomPass('cluster');
                    drawBlossomPass('blossom');
                    fxCtx.globalAlpha = 1;

                    // สายลมพัดเอื่อยปล่อยกลีบดอกท้อและใบหยกร่วงปลิวต่อเนื่องจากพุ่มที่บานแล้ว
                    if (breezeTimer > 0.22 && blossomNodes.length > 0) {
                        breezeTimer = 0;
                        const pick = blossomNodes[Math.floor(Math.random() * blossomNodes.length)];
                        if (pick && pick.bloomed) {
                            spawnWindParticle(pick.x, pick.y, false, Math.random() < 0.18);
                        }
                    }

                    // 3) วาดกลีบดอกท้อทรงโค้งและใบหยกร่วงปลิวไปตามสายลม
                    for (let i = driftingPetals.length - 1; i >= 0; i--) {
                        const p = driftingPetals[i];
                        p.life += dt;
                        const prog = p.life / p.maxLife;
                        if (prog >= 1 || p.y > h + 24 || p.x > w + 48) { driftingPetals.splice(i, 1); continue; }
                        const windGust = 0.35 + 0.28 * Math.sin(t * 0.9 + p.flipSeed);
                        p.x += (p.vx + windGust) * (dt * 60);
                        p.y += (p.vy + Math.sin(t * 2.1 + p.flipSeed) * 0.16) * (dt * 60);
                        p.vy = Math.min(0.62, p.vy + dt * 0.14);
                        p.rot += p.vRot * (dt * 60);
                        const fade = Math.sin(prog * Math.PI);
                        const tiltScale = 0.36 + 0.64 * Math.abs(Math.cos(t * 2.5 + p.flipSeed));

                        fxCtx.save();
                        fxCtx.translate(p.x, p.y);
                        fxCtx.rotate(p.rot);
                        fxCtx.scale(1, tiltScale);
                        fxCtx.globalAlpha = Math.max(0, fade * 0.88);
                        fxCtx.fillStyle = p.color;
                        fxCtx.beginPath();
                        if (p.isLeaf) {
                            // ใบท้อสีหยกเรียวแหลม
                            fxCtx.moveTo(-p.size, 0);
                            fxCtx.quadraticCurveTo(0, -p.size * 0.56, p.size, 0);
                            fxCtx.quadraticCurveTo(0, p.size * 0.56, -p.size, 0);
                        } else {
                            // กลีบดอกท้อทรงหยดน้ำเว้าปลายอ่อนช้อย
                            fxCtx.moveTo(-p.size * 0.8, 0);
                            fxCtx.bezierCurveTo(-p.size * 0.3, -p.size * 0.85, p.size * 0.75, -p.size * 0.65, p.size, -p.size * 0.15);
                            fxCtx.quadraticCurveTo(p.size * 0.65, 0, p.size, p.size * 0.15);
                            fxCtx.bezierCurveTo(p.size * 0.75, p.size * 0.65, -p.size * 0.3, p.size * 0.85, -p.size * 0.8, 0);
                        }
                        fxCtx.closePath();
                        fxCtx.fill();
                        fxCtx.restore();
                    }

                    // 4) ระลอกคลื่นปราณ Touch-to-Bloom และละอองหิ่งห้อยทอง
                    fxCtx.save();
                    fxCtx.globalCompositeOperation = 'lighter';
                    for (let i = bloomRipples.length - 1; i >= 0; i--) {
                        const rp = bloomRipples[i];
                        rp.life += dt;
                        const prog = rp.life / rp.maxLife;
                        if (prog >= 1) { bloomRipples.splice(i, 1); continue; }
                        const curR = rp.r + (rp.maxR - rp.r) * (1 - Math.pow(1 - prog, 2.4));
                        const alpha = (1 - prog) * 0.36;
                        drawSoftOrb(fxCtx, rp.x, rp.y, curR, [
                            [0, 'rgba(0,0,0,0)'],
                            [0.68, 'rgba(251,207,232,0)'],
                            [0.86, `rgba(251,207,232,${alpha.toFixed(3)})`],
                            [1, 'rgba(254,240,178,0)']
                        ]);
                    }
                    for (let i = fireflies.length - 1; i >= 0; i--) {
                        const f = fireflies[i];
                        f.life += dt;
                        const prog = f.life / f.maxLife;
                        if (prog >= 1) { fireflies.splice(i, 1); continue; }
                        f.x += f.vx * (dt * 60) + Math.sin(t * 3.4 + f.twinkle) * 0.22;
                        f.y += f.vy * (dt * 60);
                        f.vy *= 0.986;
                        const fade = Math.sin(prog * Math.PI);
                        const glowR = f.r * (1.2 + 0.3 * Math.sin(t * 6.5 + f.twinkle));
                        fxCtx.globalAlpha = Math.max(0, fade * 0.72);
                        const sp = glowSprites[f.sprite] || glowSprites.gold;
                        fxCtx.drawImage(sp, f.x - glowR, f.y - glowR, glowR * 2, glowR * 2);
                    }
                    fxCtx.restore();
                };

                const onMouseMove = (e) => {
                    flare.targetMouseX = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
                    flare.targetMouseY = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
                    const nowTs = performance.now();
                    if (nowTs - lastTrailTs > 46) {
                        lastTrailTs = nowTs;
                        const sRect = stage.getBoundingClientRect();
                        if (e.clientX >= sRect.left && e.clientX <= sRect.right && e.clientY >= sRect.top && e.clientY <= sRect.bottom) {
                            spawnFirefly(e.clientX - sRect.left, e.clientY - sRect.top, false);
                        }
                    }
                    const gs = glassStageRef.current;
                    if (gs) {
                        const rect = gs.getBoundingClientRect();
                        if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                            gs.style.setProperty('--gx', `${(((e.clientX - rect.left) / rect.width) * 100).toFixed(1)}%`);
                            gs.style.setProperty('--gy', `${(((e.clientY - rect.top) / rect.height) * 100).toFixed(1)}%`);
                        }
                    }
                };

                let tapStartX = 0, tapStartY = 0;
                const onTouchStart = (e) => {
                    if (e.touches && e.touches[0]) {
                        tapStartX = e.touches[0].clientX;
                        tapStartY = e.touches[0].clientY;
                    }
                };
                const onTouchEnd = (e) => {
                    if (e.target && e.target.closest && e.target.closest('button, a, input, select')) return;
                    const pt = e.changedTouches && e.changedTouches[0];
                    if (pt && Math.hypot(pt.clientX - tapStartX, pt.clientY - tapStartY) < 12) {
                        spawnBloomBurst(pt.clientX, pt.clientY);
                    }
                };
                const onMouseDown = (e) => {
                    if (e.target && e.target.closest && e.target.closest('button, a, input, select')) return;
                    spawnBloomBurst(e.clientX, e.clientY);
                };

                let resizeTm = null;
                const onWindowResize = () => {
                    clearTimeout(resizeTm);
                    resizeTm = setTimeout(() => syncLayout(false), 140);
                };

                let io = null;
                if (typeof IntersectionObserver !== 'undefined') {
                    io = new IntersectionObserver((entries) => {
                        flare.inView = Boolean(entries[0]?.isIntersecting);
                    }, { threshold: 0.02 });
                    io.observe(stage);
                }

                syncLayout(true);
                rafId = requestAnimationFrame(renderLoop);
                window.addEventListener('resize', onWindowResize);
                window.addEventListener('mousemove', onMouseMove);
                stage.addEventListener('mousedown', onMouseDown);
                stage.addEventListener('touchstart', onTouchStart, { passive: true });
                stage.addEventListener('touchend', onTouchEnd, { passive: true });
                if (document.fonts && document.fonts.ready) {

        function LearnerApp() {
            const urlParams = useMemo(() => {
                try { return new URLSearchParams(window.location.search); }
                catch (_) { return new URLSearchParams(); }
            }, []);
            const adminPreviewMode = urlParams.get('admin_preview') || '';
            const isAdminPreview = Boolean(adminPreviewMode);
            const returnToDashboard = urlParams.get('return') === 'dashboard';
            const incomingLicense = urlParams.get('license') || '';

            const [theme, setTheme] = useState(() => {
                try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);
            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // PWA Install State (รองรับติดตั้งเป็นแอปบน Android/Chrome และคู่มือ 3 ขั้นตอนบน iOS Safari)
            const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
