                                        <Icon name="CheckCircle2" size={18} /> ส่งคำตอบทั้งหมด
                                    </PrimaryButton>
                                )}
                            </div>
                        </BentoCard>

                        <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/92 backdrop-blur-xl border-t border-slate-200/80 px-3 pt-2.5 pb-[calc(0.75rem+env(safe-area-inset-bottom,0px))] shadow-[0_-10px_30px_rgba(15,23,42,0.08)]">
                            <div className="flex items-center gap-2.5 max-w-lg mx-auto">
                                <PrimaryButton variant="ghost" disabled={quiz.idx === 0} onClick={() => setQuiz(p => ({ ...p, idx: Math.max(0, p.idx - 1) }))} className="!px-4 !py-3 shrink-0">
                                    <Icon name="ArrowLeft" size={18} />
                                </PrimaryButton>
                                {quiz.idx < quiz.questions.length - 1 ? (
                                    <PrimaryButton disabled={selectedOpt === undefined} onClick={() => setQuiz(p => ({ ...p, idx: p.idx + 1 }))} className="flex-1 !py-3">
                                        ข้อถัดไป <Icon name="ArrowRight" size={18} />
                                    </PrimaryButton>
                                ) : (
                                    <PrimaryButton onClick={() => handleFinishQuiz(quiz)} disabled={selectedOpt === undefined} className="flex-1 !py-3">
                                        <Icon name="CheckCircle2" size={18} /> ส่งคำตอบทั้งหมด
                                    </PrimaryButton>
                                )}
                            </div>
                        </div>

                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 4: PRETEST RESULT / POSTTEST FAIL ---
            if (screen === 'quiz_result' || screen === 'quiz_fail') {
                const isFail = screen === 'quiz_fail';
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-md p-6 sm:p-8 text-center space-y-5">
                            <div className={`w-16 h-16 rounded-2xl mx-auto flex items-center justify-center ${isFail ? 'bg-rose-50 text-rose-500' : 'bg-clinical-50 text-clinical-600'}`}>
                                <Icon name={isFail ? 'AlertTriangle' : 'CheckCircle2'} size={34} />
                            </div>
                            <div>
                                <h2 className="font-display text-2xl font-bold text-slate-900">
                                    {isFail ? 'ยังไม่ผ่านเกณฑ์ 80%' : 'บันทึกผล Pre-test เรียบร้อย'}
                                </h2>
                                <p className="text-sm text-slate-500 mt-1">
                                    {isFail ? 'สามารถทบทวนบทเรียนแล้วกลับมาสอบใหม่ได้ทันทีค่ะ' : 'พร้อมเข้าสู่ห้องเรียนออนไลน์ rjcloud.organ แล้วค่ะ'}
                                </p>
                            </div>
                            <div className="p-6 rounded-2xl bg-slate-50 border border-slate-100">
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">คะแนนที่ได้</p>
                                <p className={`font-mono text-5xl font-extrabold mt-1 ${isFail ? 'text-rose-600' : 'text-clinical-600'}`}>
                                    {quiz.score} <span className="text-2xl text-slate-400">/ {quiz.questions.length}</span>
                                </p>
                            </div>
                            <div className="space-y-2.5">
                                {isFail && (
                                    <PrimaryButton onClick={() => startQuiz('posttest')} className="w-full">
                                        ทำแบบทดสอบหลังเรียนอีกครั้ง
                                    </PrimaryButton>
                                )}
                                <PrimaryButton variant={isFail ? 'ghost' : 'clinical'} onClick={() => setScreen('dashboard')} className="w-full">
                                    เข้าสู่ห้องเรียนหลัก
                                </PrimaryButton>
                            </div>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 5: CERTIFICATE CONFIRMATION + CSAT RATING ---
            if (screen === 'cert_confirm' && user) {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-xl p-5 sm:p-8 space-y-5">
                            <div className="text-center space-y-1.5">
                                <div className="w-14 h-14 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto">
                                    <Icon name="Award" size={30} />
                                </div>
                                <h2 className="font-display text-2xl font-extrabold text-slate-900">ยินดีด้วย! คุณสอบผ่านเกณฑ์แล้ว 🎉</h2>
                                <p className="text-xs sm:text-sm text-slate-500">ตรวจสอบชื่อบนประกาศนียบัตรและประเมินความพึงพอใจเพื่อรับใบประกาศฯ ทันที</p>
                            </div>

                            <form onSubmit={handleClaimCertificate} className="space-y-4">
                                <InputField label="ชื่อ - นามสกุล ที่จะแสดงบนประกาศนียบัตร" required value={certFormName} onChange={e => setCertFormName(e.target.value)} />
                                <InputField label="หน่วยงาน / โรงพยาบาล" required value={certFormHosp} onChange={e => setCertFormHosp(e.target.value)} />

                                {/* CSAT 1–5 Stars */}
                                <div className="p-4 rounded-2xl bg-amber-50/70 border border-amber-200/70 text-center space-y-2">
                                    <p className="text-xs font-bold text-amber-900">ความพึงพอใจต่อการเรียนรู้บน rjcloud.organ</p>
                                    <div className="flex items-center justify-center gap-2">
                                        {[1, 2, 3, 4, 5].map(star => (
                                            <button
                                                key={star}
                                                type="button"
                                                onClick={() => setCsatScore(star)}
                                                className="p-1 transition-transform active:scale-90"
                                            >
                                                <Icon
                                                    name="Star"
                                                    size={32}
                                                    className={star <= csatScore ? 'text-amber-500 fill-amber-400' : 'text-slate-300'}
                                                />
                                            </button>
                                        ))}
                                    </div>
                                    <input
                                        type="text"
                                        value={csatComment}
                                        onChange={e => setCsatComment(e.target.value)}
                                        placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)..."
                                        className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-amber-200 text-sm outline-none"
                                    />
                                </div>

                                <PrimaryButton type="submit" disabled={isBusy} className="w-full py-4">
                                    <Icon name="Sparkles" size={18} /> {isBusy ? 'กำลังออกประกาศนียบัตร...' : 'ยืนยันและสร้างประกาศนียบัตรทันที'}
                                </PrimaryButton>
                            </form>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 6: CERTIFICATE STUDIO ---
            if (screen === 'certificate' && user) {
                return (
                    <>
                        <CertificateStudioView
                            user={user}
                            certTemplate={certTemplate}
                            onBack={() => setScreen('dashboard')}
                            onToast={showToast}
                        />
                        <ToastBanner toast={toast} />
                    </>
                );
            }

            // --- SCREEN 7: STUDENT DASHBOARD ---
            if (!user) {
                setScreen('landing');
                return null;
            }

            const targetHours = getTargetHours(user.userType, liveConfig.hours);
            const isTimeMet = (user.progress || 0) >= 100 || liveConfig.allowPosttest;
            const canTakePosttest = isTimeMet;
            const hasPassedCourse = user.status === 'ผ่าน';
            const activeLesson = lessons.find(l => l.id === currentVideoId) || lessons[0];
            const filteredLessons = lessons.filter(l => l.title.toLowerCase().includes(lessonSearch.trim().toLowerCase()));
            const currentLessonIndex = Math.max(0, lessons.findIndex(l => l.id === activeLesson?.id));

            const nextAction = hasPassedCourse
                ? {
                    badge: 'CERTIFIED 2027',
                    title: 'ยินดีด้วย! คุณสำเร็จหลักสูตรแล้ว 🎉',
                    desc: 'สามารถเปิดดู ดาวน์โหลด PDF (A4) หรือแชร์ประกาศนียบัตรพร้อม QR Code ได้ตลอดเวลา',
                    btn: 'เปิด Certificate Studio',
                    variant: 'clinical',
                    onClick: () => {
                        if (!user.certificateClaimed) {
                            setCertFormName(user.name || '');
                            setCertFormHosp(user.hospital || '');
                            setScreen('cert_confirm');
                        } else {
                            setScreen('certificate');
                        }
                    }
                }
                : canTakePosttest
                    ? {
                        badge: 'READY FOR EXAM',
                        title: 'สะสมเวลาเรียนครบแล้ว พร้อมสอบ Post-test!',
                        desc: 'ทำแบบทดสอบหลังเรียนให้ผ่านเกณฑ์ 80% เพื่อรับประกาศนียบัตรทันทีในระบบ',
                        btn: 'เริ่มสอบ Post-test',
                        variant: 'sky',
                        onClick: () => startQuiz('posttest')
                    }
                    : {
                        badge: `MODULE ${String(activeLesson?.id || 1).padStart(2, '0')}`,
                        title: `เรียนต่อ: ${activeLesson?.title || 'บทเรียนออนไลน์'}`,
                        desc: `สะสมเวลาเรียนให้ครบ ${targetHours} ชม. เพื่อปลดล็อกการสอบ Post-test`,
                        btn: 'เปิดบทเรียน',
                        variant: 'clinical',
                        onClick: () => setActiveTab('video')
                    };

            const avgSkillScore = user.skillLabHistory?.length
                ? Math.round(user.skillLabHistory.reduce((s, r) => s + (r.score || 0), 0) / user.skillLabHistory.length)
                : 0;

            const handleSelectLesson = (lessonId) => {
                setCurrentVideoId(lessonId);
                persistUser({ ...user, lastVideoId: lessonId }, false);
                if (window.innerWidth < 1024) window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="min-h-dvh relative pb-dock-safe md:pb-12">
                    <div className="aura-canvas" /><div className="aura-grid" />

                    {/* Top Header */}
                    <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/82 border-b border-slate-200/70 pt-safe">
                        <div className="max-w-7xl mx-auto px-3.5 md:px-8 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2 min-w-0">
                                <div className="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shadow-sm shrink-0">
                                    <Icon name="HeartPulse" size={18} />
                                </div>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm md:text-lg text-slate-900 block leading-none">
                                        rjcloud<span className="text-clinical-600">.organ</span>
                                    </span>
                                    <span className="sm:hidden text-[11px] font-semibold text-slate-500 truncate block mt-0.5 max-w-[165px]">
                                        {user.name}
                                    </span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                                <span className="sm:hidden px-2.5 py-1 rounded-full bg-clinical-50 text-clinical-700 font-mono text-[11px] font-extrabold border border-clinical-200/70">
                                    {user.progress || 0}%
                                </span>
                                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100/90 border border-slate-200/70">
                                    <span className="w-2 h-2 rounded-full bg-clinical-500" />
                                    <span className="text-xs font-bold text-slate-700">{user.name}</span>
                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-clinical-100 text-clinical-700">{user.userType}</span>
                                </div>
                                <button
                                    onClick={handleLogout}
                                    aria-label="ออกจากระบบ"
                                    className="w-9 h-9 sm:w-auto sm:h-auto sm:px-3.5 sm:py-2 rounded-xl bg-white hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200/80 text-xs font-bold flex items-center justify-center gap-1.5 transition-colors active:scale-95"
                                >
                                    <Icon name="LogOut" size={16} /> <span className="hidden sm:inline">ออกจากระบบ</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="relative z-10 max-w-7xl mx-auto px-3 sm:px-4 md:px-8 pt-4 md:pt-6 space-y-4 md:space-y-6">
                        {/* Bento Summary Row */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-3.5 md:gap-5">
                            <BentoCard className="lg:col-span-8 p-4 sm:p-6 md:p-7 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                <div className="space-y-1 max-w-xl">
                                    <span className="inline-block px-2.5 py-0.5 rounded-full bg-clinical-100 text-clinical-700 font-mono text-[10px] md:text-[11px] font-bold">
                                        {nextAction.badge}
                                    </span>
                                    <h2 className="font-display text-lg sm:text-xl md:text-2xl font-bold text-slate-900 leading-snug">{nextAction.title}</h2>
                                    <p className="text-xs sm:text-sm text-slate-600">{nextAction.desc}</p>
                                </div>
                                <PrimaryButton variant={nextAction.variant} onClick={nextAction.onClick} className="w-full md:w-auto shrink-0 !py-3 md:!py-3.5">
                                    {nextAction.btn} <Icon name="ChevronRight" size={18} />
                                </PrimaryButton>
                            </BentoCard>

                            <BentoCard className="lg:col-span-4 p-4 sm:p-6 flex flex-col justify-between">
                                <div className="flex items-start justify-between">
                                    <div>
                                        <p className="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                                            <Icon name="Clock" size={14} className="text-clinical-600" /> เวลาเรียนสะสม ({user.userType})
                                        </p>
                                        <p className="font-mono text-base sm:text-lg font-bold text-slate-900 mt-0.5">{formatDuration(studySeconds)}</p>
                                    </div>
                                    <span className="font-mono text-2xl font-extrabold text-clinical-600">{user.progress || 0}%</span>
                                </div>
                                <div className="mt-3">
                                    <div className="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-clinical-500 to-medical-500 rounded-full transition-all duration-500" style={{ width: `${user.progress || 0}%` }} />
                                    </div>
                                    <div className="flex justify-between text-[11px] text-slate-400 font-medium mt-1.5">
                                        <span>เป้าหมาย {targetHours} ชม.</span>
                                        <span>{isTabVisible ? 'กำลังบันทึกเวลาอัตโนมัติ' : 'หยุดนับชั่วคราว'}</span>
                                    </div>
                                </div>
                            </BentoCard>
                        </div>

                        {/* Smartphone Bottom Dock + Desktop Pill Nav */}
                        <nav className="fixed bottom-0 left-0 right-0 md:static z-40">
                            <div className="bg-white/92 md:bg-white/75 backdrop-blur-2xl border-t md:border border-slate-200/80 md:rounded-2xl px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] md:p-1.5 grid grid-cols-5 md:flex items-center md:w-fit gap-1 shadow-[0_-8px_30px_rgba(15,23,42,0.08)] md:shadow-sm">
                                {[
                                    { id: 'video', label: 'บทเรียน', icon: 'MonitorPlay' },
                                    { id: 'live', label: 'Live สด', icon: 'Radio', live: liveConfig.status === 'live' },
                                    {
                                        id: 'skill_lab',
                                        label: 'AI Lab',
                                        icon: 'Bot',
                                        customClick: () => {
                                            window.location.href = './aiskilllab.html';
                                        }
                                    },
                                    { id: 'leaderboard', label: 'อันดับ', icon: 'Trophy' },
                                    { id: 'profile', label: 'โปรไฟล์', icon: 'User' }
                                ].map(item => {
                                    const active = activeTab === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={item.customClick || (() => setActiveTab(item.id))}
                                            className={`touch-target flex flex-col md:flex-row items-center justify-center gap-0.5 md:gap-2 px-1.5 md:px-5 py-1.5 md:py-2.5 rounded-xl text-[10px] sm:text-[11px] md:text-sm font-bold transition-all active:scale-95 ${
                                                active
                                                    ? 'bg-clinical-600 text-white shadow-md shadow-clinical-600/20'
                                                    : item.live
                                                        ? 'bg-rose-50 text-rose-600 animate-pulse'
                                                        : 'text-slate-600 hover:bg-slate-100/80'
                                            }`}
                                        >
                                            <Icon name={item.icon} size={19} />
                                            <span className="truncate max-w-full">{item.label}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </nav>

                        {/* TAB 1: VIDEO LEARNING */}
                        {activeTab === 'video' && (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6 items-start">
                                <BentoCard className="lg:col-span-8 overflow-hidden p-0">
                                    <div className="w-full relative bg-slate-900 pb-[56.25%] h-0">
                                        <iframe
                                            src={activeLesson?.videoId ? `https://drive.google.com/file/d/${activeLesson.videoId}/preview` : ''}
                                            className="absolute inset-0 w-full h-full border-none"
                                            allow="autoplay; fullscreen"
                                            title={activeLesson?.title}
                                        />
                                    </div>
                                    <div className="p-4 sm:p-5 md:p-6 space-y-4">
                                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                            <div>
                                                <span className="text-[11px] font-mono font-bold text-clinical-600">MODULE {String(activeLesson?.id || 1).padStart(2, '0')} / {lessons.length}</span>
                                                <h3 className="font-display text-base sm:text-lg md:text-xl font-bold text-slate-900 mt-0.5 leading-snug">{activeLesson?.title}</h3>
                                            </div>
                                            {activeLesson?.documentUrl && (
                                                <a
                                                    href={activeLesson.documentUrl}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="touch-target w-full sm:w-auto px-4 py-2.5 rounded-xl bg-clinical-50 hover:bg-clinical-100 text-clinical-700 font-bold text-xs flex items-center justify-center gap-2 shrink-0 transition-colors"
                                                >
                                                    <Icon name="FileText" size={16} /> ดาวน์โหลดเอกสารประกอบ
                                                </a>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-2 gap-2.5 pt-3 border-t border-slate-100">
                                            <button
                                                type="button"
                                                disabled={currentLessonIndex <= 0}
                                                onClick={() => handleSelectLesson(lessons[currentLessonIndex - 1].id)}
                                                className="touch-target px-3.5 py-2.5 rounded-xl bg-slate-100/90 hover:bg-slate-200/80 disabled:opacity-40 text-slate-700 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors active:scale-95"
                                            >
                                                <Icon name="ChevronLeft" size={16} /> บทเรียนก่อนหน้า
                                            </button>
                                            <button
                                                type="button"
                                                disabled={currentLessonIndex >= lessons.length - 1}
                                                onClick={() => handleSelectLesson(lessons[currentLessonIndex + 1].id)}
                                                className="touch-target px-3.5 py-2.5 rounded-xl bg-clinical-50 hover:bg-clinical-100 disabled:opacity-40 text-clinical-700 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors active:scale-95"
                                            >
                                                บทเรียนถัดไป <Icon name="ChevronRight" size={16} />
                                            </button>
                                        </div>
                                    </div>
                                </BentoCard>

                                <BentoCard className="lg:col-span-4 p-4 md:p-5 flex flex-col lg:max-h-[580px]">
                                    <h4 className="font-display font-bold text-sm text-slate-800 mb-3">รายการบทเรียน ({lessons.length})</h4>
                                    <div className="relative mb-3">
                                        <Icon name="Search" size={15} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input
                                            type="text"
                                            value={lessonSearch}
                                            onChange={e => setLessonSearch(e.target.value)}
                                            placeholder="ค้นหาบทเรียน..."
                                            className="touch-target w-full pl-10 pr-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-sm outline-none focus:border-clinical-500"
                                        />
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1 max-h-[380px] lg:max-h-none">
                                        {filteredLessons.map(l => {
                                            const playing = l.id === activeLesson?.id;
                                            return (
                                                <button
                                                    key={l.id}
                                                    onClick={() => handleSelectLesson(l.id)}
                                                    className={`touch-target w-full text-left p-3.5 rounded-2xl border transition-all flex items-center gap-3 active:scale-[0.99] ${
                                                        playing
                                                            ? 'bg-clinical-50 border-clinical-400 text-clinical-900 shadow-sm'
                                                            : 'bg-white/75 border-slate-100 hover:bg-white hover:border-slate-200 text-slate-700'
                                                    }`}
                                                >
                                                    <div className={`w-8 h-8 rounded-xl font-mono text-xs font-bold flex items-center justify-center shrink-0 ${playing ? 'bg-clinical-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                                                        {l.id}
                                                    </div>
                                                    <span className="text-xs sm:text-sm font-semibold leading-snug line-clamp-2 flex-1">{l.title}</span>
                                                    {playing && <Icon name="Play" size={14} className="text-clinical-600 shrink-0" />}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </BentoCard>
                            </div>
                        )}

                        {/* TAB 2: LIVE STREAM */}
                        {activeTab === 'live' && (
                            <BentoCard className="p-5 sm:p-8">
                                {liveConfig.status !== 'offline' ? (
                                    <div className="space-y-5">
                                        <div className="relative w-full pb-[56.25%] h-0 rounded-2xl overflow-hidden bg-slate-900">
                                            {liveConfig.status === 'paused' && (
                                                <div className="absolute inset-0 z-20 bg-slate-900/80 backdrop-blur-md flex flex-col items-center justify-center text-white gap-2">
                                                    <Icon name="PauseCircle" size={48} className="text-amber-400" />
                                                    <p className="font-display text-lg font-bold">พักการถ่ายทอดสดชั่วคราว</p>
                                                </div>
                                            )}
                                            <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-none" allowFullScreen title="Live Stream" />
                                        </div>

                                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                            <div>
                                                <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-600 text-xs font-bold mb-1">
                                                    <span className="w-2 h-2 rounded-full bg-rose-500 animate-ping" /> LIVE BROADCAST
                                                </div>
                                                <h3 className="font-display text-lg sm:text-xl font-bold text-slate-900">{liveConfig.topic}</h3>
                                                <p className="text-xs text-slate-500 mt-0.5">หลักสูตร {liveConfig.hours} ชั่วโมง ({liveConfig.days} วัน)</p>
                                            </div>
                                            <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                                                {liveConfig.documentUrl && (
                                                    <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="touch-target flex-1 sm:flex-none px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center gap-1.5">
                                                        <Icon name="FileText" size={16} /> เอกสาร Live
                                                    </a>
                                                )}
                                                {user.liveCheckedIn ? (
                                                    <div className="touch-target flex-1 sm:flex-none px-4 py-2.5 rounded-2xl bg-clinical-50 border border-clinical-200 text-clinical-700 font-bold text-xs flex items-center justify-center gap-1.5">
                                                        <Icon name="CheckCircle2" size={16} /> เช็คอินเข้าเรียนแล้ว
                                                    </div>
                                                ) : (
                                                    <PrimaryButton onClick={handleLiveCheckIn} className="flex-1 sm:flex-none !py-2.5 !text-xs">
                                                        <Icon name="CheckCircle2" size={16} /> ยืนยันเช็คอินเข้าเรียน
                                                    </PrimaryButton>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="py-12 text-center space-y-3">
                                        <div className="w-16 h-16 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto">
                                            <Icon name="Radio" size={30} />
                                        </div>
                                        <h3 className="font-display text-xl font-bold text-slate-800">ขณะนี้ยังไม่มีการถ่ายทอดสด</h3>
                                        <p className="text-sm text-slate-500">คุณสามารถศึกษาบทเรียนวิดีโอในแท็บ "บทเรียน" เพื่อสะสมเวลาได้ตลอด 24 ชั่วโมงค่ะ</p>
                                    </div>
                                )}
                            </BentoCard>
                        )}

                        {/* TAB 3: LEADERBOARD (PDPA Safe Public Feed) */}
                        {activeTab === 'leaderboard' && (
                            <BentoCard className="p-5 sm:p-8 max-w-3xl mx-auto space-y-5">
                                <div className="text-center space-y-1">
                                    <div className="w-14 h-14 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center mx-auto mb-2">
                                        <Icon name="Trophy" size={28} />
                                    </div>
                                    <h3 className="font-display text-2xl font-extrabold text-slate-900">Hall of Fame 2027</h3>
                                    <p className="text-xs sm:text-sm text-slate-500">อันดับคะแนนทักษะการเจรจา AI Skill Lab (แสดงเฉพาะชื่อและหน่วยงาน)</p>
                                </div>

                                <div className="space-y-2.5">
                                    {leaderboard.length > 0 ? leaderboard.map((row, idx) => (
                                        <div key={row.id} className="p-4 rounded-2xl bg-white/90 border border-slate-200/70 flex items-center justify-between gap-3">
                                            <div className="flex items-center gap-3 min-w-0">
                                                <div className={`w-9 h-9 rounded-xl font-mono text-sm font-extrabold flex items-center justify-center shrink-0 ${
                                                    idx === 0 ? 'bg-amber-400 text-white' : idx === 1 ? 'bg-slate-400 text-white' : idx === 2 ? 'bg-orange-400 text-white' : 'bg-slate-100 text-slate-600'
                                                }`}>
                                                    {idx + 1}
                                                </div>
                                                <div className="min-w-0">
                                                    <p className="font-bold text-sm text-slate-900 truncate">{row.name}</p>
                                                    <p className="text-xs text-slate-500 truncate">{row.hospital || '-'}</p>
                                                </div>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <p className="font-mono text-xl font-extrabold text-clinical-600 leading-none">{row.score}</p>
                                                <p className="text-[10px] font-bold text-slate-400">EMPATHY</p>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="py-10 text-center text-sm text-slate-400">
                                            ยังไม่มีรายชื่อจัดอันดับในรอบปี 2027 — ลองฝึกในห้อง AI Skill Lab เพื่อเป็นคนแรกได้เลยค่ะ
                                        </div>
                                    )}
                                </div>
                            </BentoCard>
                        )}

                        {/* TAB 4: PROFILE & CERTIFICATE ACCESS */}
                        {activeTab === 'profile' && (
                            <BentoCard className="p-5 sm:p-8 max-w-2xl mx-auto space-y-5">
                                <div className="flex items-center gap-4 pb-5 border-b border-slate-100">
                                    <div className="w-16 h-16 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center shrink-0">
                                        <Icon name="User" size={32} />
                                    </div>
                                    <div className="min-w-0">
                                        <h3 className="font-display text-xl font-extrabold text-slate-900 truncate">{user.name}</h3>
                                        <p className="text-xs sm:text-sm text-slate-500 truncate">{user.position} • {user.hospital}</p>
                                        <div className="flex flex-wrap gap-1.5 mt-2">
                                            <span className="px-2.5 py-0.5 rounded-full bg-clinical-100 text-clinical-700 text-[11px] font-bold">{user.userType}</span>
                                            <span className="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 font-mono text-[11px] font-bold">{user.license}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                        <p className="text-[11px] font-bold text-slate-400">Pre-test</p>
                                        <p className="font-mono text-lg font-extrabold text-medical-600 mt-0.5">{user.pretest || '-'}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                        <p className="text-[11px] font-bold text-slate-400">Post-test</p>
                                        <p className="font-mono text-lg font-extrabold text-clinical-600 mt-0.5">{user.posttest || '-'}</p>
                                    </div>
                                    <div className="col-span-2 sm:col-span-1 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                        <p className="text-[11px] font-bold text-slate-400">AI Skill Lab</p>
                                        <p className="font-mono text-lg font-extrabold text-violet-600 mt-0.5">{avgSkillScore > 0 ? `${avgSkillScore}/100` : '-'}</p>
                                    </div>
                                </div>

                                {hasPassedCourse && (
                                    <PrimaryButton onClick={() => setScreen(user.certificateClaimed ? 'certificate' : 'cert_confirm')} className="w-full py-4">
                                        <Icon name="Award" size={20} /> เปิดดู / ดาวน์โหลดประกาศนียบัตร (PDF & PNG)
                                    </PrimaryButton>
                                )}

                                <button onClick={handleLogout} className="touch-target w-full py-3 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-sm transition-colors">
                                    ออกจากระบบ
                                </button>
                            </BentoCard>
                        )}
                    </main>

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
