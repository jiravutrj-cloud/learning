        // ============================================================================

        function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
            const Comp = LucideIcons[name] || LucideIcons.Activity;
            return <Comp size={size} className={className} strokeWidth={strokeWidth} />;
        }

        function getTargetHours(userType, liveHours = 8) {
            return Math.max(1, Number(liveHours) || 8);
        }

        function calcProgress(studySeconds, userType, liveHours = 8) {
            const targetSecs = getTargetHours(userType, liveHours) * 3600;
            return Math.min(100, Math.round(((studySeconds || 0) / targetSecs) * 100));
        }

        /**
         * แปลงผลคะแนนรูปแบบ "32/40" เพื่อตรวจสอบเกณฑ์ Post-test ไม่น้อยกว่า 80%
         */
        function parseScoreInfo(scoreStr) {
            if (!scoreStr || scoreStr === '-') {
                return { score: 0, total: 0, percent: 0, passed80: false };
            }
            const parts = String(scoreStr).split('/');
            const score = parseInt(parts[0], 10) || 0;
            const total = parseInt(parts[1], 10) || 0;
            const percent = total > 0 ? Math.round((score / total) * 100) : 0;
            return {
                score,
                total,
                percent,
                passed80: total > 0 && (score / total) >= 0.8
            };
        }

        /**
         * ตรวจสอบการผ่านขั้นที่ 3 (AI Skill Lab)
         */
        function hasPassedSkillLab(u) {
            if (!u) return false;
            if (u.skillLabPassed) return true;
            return Array.isArray(u.skillLabHistory) && u.skillLabHistory.some(item => item?.passed || (item?.score || 0) >= 60);
        }

        function formatDuration(secs) {
            const total = Math.max(0, Math.floor(secs || 0));
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function formatTimerMMSS(secs) {
            const total = Math.max(0, Math.floor(secs || 0));
            const m = Math.floor(total / 60);
            const s = total % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function parseRawExams(raw) {
            if (!raw || !Array.isArray(raw)) return [];
            return raw.map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    question: parts[0] ? parts[0].replace(/^[0-9]+\.\s*/, '') : '',
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(INITIAL_QUIZ_RAW)];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [parseRawExams(INITIAL_QUIZ_RAW)];
        }

        /**
         * สุ่มลำดับข้อสอบและตัวเลือกโดยยังคงดัชนีคำตอบที่ถูกต้องไว้แม่นยำ
         */
        function prepareShuffledExam(rawQuestions) {
            const list = [...(rawQuestions || [])];
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            return list.map((q, idx) => {
                const opts = (q.options || []).map((text, origIdx) => ({ text, isCorrect: origIdx === q.answer }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return {
                    id: q.id || idx + 1,
                    question: q.question,
                    options: opts.map(o => o.text),
                    answer: Math.max(0, opts.findIndex(o => o.isCorrect))
                };
            });
        }

        function generateCertCode(prefix = 'RJC-2027') {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return `${String(prefix || 'RJC-2027').trim().toUpperCase()}-${code}`;
        }

        function formatThaiDate(isoStr) {
            try {
                const d = isoStr ? new Date(isoStr) : new Date();
                return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch {
                return '';
            }
        }

        function loadImageSafe(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        function buildQrDataUrl(text, size = 220) {
            return new Promise((resolve) => {
                if (!window.QRCode) return resolve(null);
                const holder = document.createElement('div');
                holder.style.position = 'fixed';
                holder.style.left = '-9999px';
                document.body.appendChild(holder);
                try {
                    new window.QRCode(holder, {
                        text,
                        width: size,
                        height: size,
                        colorDark: '#064e3b',
                        colorLight: '#ffffff',
                        correctLevel: window.QRCode.CorrectLevel.M
                    });
                    setTimeout(() => {
                        const canvas = holder.querySelector('canvas');
                        const img = holder.querySelector('img');
                        const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
                        document.body.removeChild(holder);
                        resolve(dataUrl);
                    }, 80);
                } catch (_) {
                    document.body.removeChild(holder);
                    resolve(null);
                }
            });
        }

        /**
         * วาดใบประกาศนียบัตรความละเอียดสูงบน HTML5 Canvas (A4 Landscape 1600x1131) พร้อม QR Verify
         */
        async function renderCertificateCanvas(canvas, user, tpl, verifyUrl) {
            if (!canvas || !user) return;
            const W = 1600, H = 1131;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const postInfo = parseScoreInfo(user.posttest);

            // 1. Background Pearl Clinical Aura
            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#ffffff');
            bg.addColorStop(0.55, '#f8fafc');
            bg.addColorStop(1, '#ecfdf5');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            const glow1 = ctx.createRadialGradient(180, 150, 20, 180, 150, 480);
            glow1.addColorStop(0, 'rgba(16, 185, 129, 0.16)');
            glow1.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = glow1;
            ctx.fillRect(0, 0, W, H);

            const glow2 = ctx.createRadialGradient(W - 180, H - 150, 20, W - 180, H - 150, 520);
            glow2.addColorStop(0, 'rgba(14, 165, 233, 0.14)');
            glow2.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = glow2;
            ctx.fillRect(0, 0, W, H);

            // 2. Formal Borders & Top Accent Bar
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 7;
            ctx.strokeRect(46, 46, W - 92, H - 92);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.strokeRect(62, 62, W - 124, H - 124);

            ctx.fillStyle = '#059669';

                W / 2,
                topY + 560

            // 7. Signer Block & Optional Signature PNG
            const signImg = await loadImageSafe(tpl.signatureUrl);
            if (signImg) {
                const maxH = 74;
                const ratio = Math.min(maxH / signImg.height, 260 / signImg.width);
                const sw = signImg.width * ratio;
                const sh = signImg.height * ratio;
                ctx.drawImage(signImg, W / 2 - sw / 2, H - 275, sw, sh);
            }

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 210, H - 190);
            ctx.lineTo(W / 2 + 210, H - 190);
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 26px "Prompt", sans-serif';

            ctx.font = '500 20px "Sarabun", sans-serif';

            // 8. Reference ID (Left Bottom) & Scannable QR Code (Right Bottom)
            ctx.textAlign = 'left';
            ctx.fillStyle = '#475569';
            ctx.font = '700 18px "JetBrains Mono", monospace';
            ctx.fillText(`REF: ${user.certificateCode || 'RJC-2027-DEMO'}`, 95, H - 130);

            const qrDataUrl = await buildQrDataUrl(verifyUrl, 180);

            ctx.strokeStyle = '#d1fae5';

        // ============================================================================
        // 4. ERROR BOUNDARY & REUSABLE UI COMPONENTS (NO alert() / confirm())
        // ============================================================================
        class AppErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, err: null };
            }
            static getDerivedStateFromError(err) {
                return { hasError: true, err };
            }
            componentDidCatch(err, info) {
                console.error('App ErrorBoundary:', err, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6 bg-slate-50">
                            <div className="max-w-md w-full bg-white rounded-3xl p-6 border border-rose-200 shadow-lg text-center space-y-4">
                                <h2 className="font-display font-bold text-lg text-rose-700">เกิดข้อผิดพลาดในการแสดงผล</h2>
                                <p className="text-xs font-mono bg-rose-50 text-rose-800 p-3 rounded-xl overflow-auto">
                                    {String(this.state.err?.message || this.state.err)}
                                </p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="touch-target w-full py-3 rounded-2xl bg-clinical-600 text-white font-display font-bold text-sm"
                                >
                                    โหลดหน้าใหม่
                                </button>
                            </div>

            }
        }

                sky: 'bg-gradient-to-r from-medical-500 to-cyan-600 hover:from-medical-600 hover:to-cyan-700 text-white shadow-[0_10px_24px_-6px_rgba(2,132,199,0.38)]',
                amber: 'bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white shadow-[0_10px_24px_-6px_rgba(245,158,11,0.38)]',

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[120] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-xl flex items-center gap-2.5 text-xs sm:text-sm font-bold ${
                        toast.type === 'error'
                            ? 'bg-rose-50/95 border-rose-200 text-rose-700'
                            : toast.type === 'info'
                                ? 'bg-medical-50/95 border-medical-200 text-medical-700'
                                : 'bg-clinical-50/95 border-clinical-200 text-clinical-800'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Info' : 'CheckCircle2'} size={18} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="fixed inset-0 z-[110] bg-slate-900/55 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="w-full sm:max-w-md bg-white rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] shadow-2xl border border-slate-100 space-y-4">
                        <div className="flex items-start gap-3">
                            <div className="w-11 h-11 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center shrink-0">
                                <Icon name="HelpCircle" size={22} />
                            </div>
                            <div>
                                <h3 className="font-display font-bold text-lg text-slate-900">{dialog.title}</h3>
                                <p className="text-sm text-slate-600 mt-1 leading-relaxed">{dialog.message}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="touch-target py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-display font-bold text-sm"
                            >
                                ยกเลิก
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    const fn = dialog.onConfirm;
                                    onClose();
                                    if (fn) fn();
                                }}
                                className="touch-target py-3 rounded-2xl bg-clinical-600 hover:bg-clinical-700 text-white font-display font-bold text-sm"
                            >
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 5. MAIN STUDENT APPLICATION
        // ============================================================================
        function App() {
            // 1. Session & Navigation States
            const [user, setUser] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user) return 'dashboard';
                } catch (_) {}
                return 'landing';
            }); // landing | auth | quiz | quiz_result | quiz_fail | cert_confirm | certificate | dashboard

            const [activeTab, setActiveTab] = useState('video'); // video | live | leaderboard | profile

            // 2. Auth Wizard States (3 Steps: License -> Confirm Profile -> OTP)
            const [authStep, setAuthStep] = useState(1);
            const [licenseInput, setLicenseInput] = useState('');
            const [existingUserData, setExistingUserData] = useState(null);
            const [profileForm, setProfileForm] = useState({
                name: '',
                license: '',
                userType: 'เรียนใหม่',
                email: '',
                phone: '',
                position: '',
                workContext: 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                department: 'กรมการแพทย์',
                hospital: 'รพ.ราชวิถี',
                province: 'กรุงเทพมหานคร'
            });
            const [otpInput, setOtpInput] = useState('');
            const [fallbackOtpCode, setFallbackOtpCode] = useState('');

            // 3. Learning & Cloud Config States
            const [isCloudReady, setIsCloudReady] = useState(false);
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [lessons, setLessons] = useState(INITIAL_LESSONS);
            const [questionSets, setQuestionSets] = useState(() => [parseRawExams(INITIAL_QUIZ_RAW)]);
            const [certTemplate, setCertTemplate] = useState(DEFAULT_CERT_TEMPLATE);
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 8,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });
            const [leaderboard, setLeaderboard] = useState([]);

            // 4. Video, Study Timer & Live States
            const [currentVideoId, setCurrentVideoId] = useState(() => user?.lastVideoId || INITIAL_LESSONS[0]?.id || 1);
            const [lessonSearch, setLessonSearch] = useState('');
            const [studySeconds, setStudySeconds] = useState(() => user?.studySeconds || 0);
            const [isTabVisible, setIsTabVisible] = useState(() => !document.hidden);
            const [isLiveCheckedIn, setIsLiveCheckedIn] = useState(() => Boolean(user?.liveCheckedIn));

            // 5. Quiz & Certificate States
            const [quiz, setQuiz] = useState({ type: 'pretest', questions: [], idx: 0, answers: {}, score: 0, timeLeft: 2700, finished: false });
            const [certFormName, setCertFormName] = useState('');
            const [certFormHosp, setCertFormHosp] = useState('');
            const [csatScore, setCsatScore] = useState(5);
            const [csatComment, setCsatComment] = useState('');

            // 6. UI Feedback States
            const [isBusy, setIsBusy] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', confirmText: 'ยืนยัน', onConfirm: null });

            // Refs
            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);
            const certCanvasRef = useRef(null);
            const adminTapRef = useRef({ count: 0, timer: null });

            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3600);
            }, []);

            // ยืนยันว่า Mount สำเร็จ (ปิด Error Guard)
            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // เรียก Google Apps Script Proxy
            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'error', message: 'ยังไม่ได้ตั้งค่า Apps Script URL' };
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message || 'Failed to fetch' };
                }
            }, [appsScriptUrl]);

            // บันทึกข้อมูลผู้เรียนลง localStorage และ Firestore อย่างสอดคล้องกัน
            const persistUser = useCallback(async (nextUser, syncCloud = false) => {
                if (!nextUser) return;
                setUser(nextUser);
                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: nextUser }));
                } catch (_) {}

                if (syncCloud && isCloudConfigured && fbDb && nextUser.id && !String(nextUser.id).startsWith('demo_')) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            nextUser,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Cloud user persist warning:', err);
                    }
                }
            }, []);

            // 1. Firebase Auth (Anonymous) & Live Settings/Content/Leaderboard Subscriptions
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;

                let unsubSettings = null;
                let unsubContent = null;
                let unsubBoard = null;

                signInAnonymously(fbAuth).catch(err => console.warn('Anon auth warning:', err));

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!fbUser) return;
                    setIsCloudReady(true);

                    // ซิงค์ข้อมูลล่าสุดของผู้เรียนที่ล็อกอินอยู่ (เช่น คะแนน AI Skill Lab ที่เพิ่งกลับมา)
                    const cur = userRef.current;
                    if (cur?.id && !String(cur.id).startsWith('demo_')) {
                        try {
                            const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(cur.id)));
                            if (snap.exists()) {
                                const cloudData = snap.data();
                                const merged = {
                                    ...cur,
                                    ...cloudData,
                                    studySeconds: Math.max(cur.studySeconds || 0, cloudData.studySeconds || 0),
                                    progress: Math.max(cur.progress || 0, cloudData.progress || 0),
                                    skillLabPassed: Boolean(cur.skillLabPassed || cloudData.skillLabPassed)
                                };
                                setStudySeconds(merged.studySeconds);
                                setIsLiveCheckedIn(Boolean(merged.liveCheckedIn));
                                persistUser(merged, false);
                            }
                        } catch (_) {}
                    }

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                            if (d.liveConfig) setLiveConfig(prev => ({ ...prev, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(prev => ({ ...prev, ...d.certTemplate }));
                        },
                        () => {}
                    );

                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );

                    const qBoard = query(
                        collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard'),
                        orderBy('score', 'desc'),
                        limit(20)
                    );
                    unsubBoard = onSnapshot(
                        qBoard,
                        (snap) => {
                            const rows = [];
                            snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
                            setLeaderboard(rows);
                        },
                        () => {}
                    );
                });

                return () => {
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                    if (unsubBoard) unsubBoard();
                };
            }, [persistUser]);

            // 2. Page Visibility API — หยุดนับเวลาเรียนเมื่อพับจอหรือสลับแท็บ และบันทึกก่อนออก
            useEffect(() => {
                const handleVis = () => {
                    const visible = !document.hidden;
                    setIsTabVisible(visible);
                    if (!visible && userRef.current) {
                        const curU = userRef.current;
                        const secs = studySecondsRef.current;
                        const prog = calcProgress(secs, curU.userType, liveConfig.hours);
                        persistUser({ ...curU, studySeconds: secs, progress: prog }, true);
                    }
                };
                document.addEventListener('visibilitychange', handleVis);
                return () => document.removeEventListener('visibilitychange', handleVis);
            }, [liveConfig.hours, persistUser]);

            // 3. นับเวลาเรียนอัตโนมัติ (ขั้นที่ 2: สะสมชั่วโมงเรียน ≥ 80% ปลดล็อก AI Skill Lab)
            useEffect(() => {
                if (!user || screen !== 'dashboard' || !isTabVisible) return;
                if (!['video', 'live'].includes(activeTab)) return;

                const timer = setInterval(() => {
                    setStudySeconds(prev => {
                        const nextSecs = prev + 10;
                        const curU = userRef.current;
                        if (!curU) return nextSecs;

                        const nextProg = calcProgress(nextSecs, curU.userType, liveConfig.hours);
                        const prevProg = curU.progress || 0;
                        const nextU = { ...curU, studySeconds: nextSecs, progress: nextProg };
                        const shouldSyncCloud = nextSecs % 30 === 0 || (prevProg < 80 && nextProg >= 80);
                        persistUser(nextU, shouldSyncCloud);

                        if (prevProg < 80 && nextProg >= 80) {
                            showToast('สะสมชั่วโมงเรียนครบ 80% แล้ว! ปลดล็อกขั้นที่ 3 (AI Skill Lab) เรียบร้อยค่ะ 🎉');
                        }

                        return nextSecs;
                    });
                }, 10000);

                return () => clearInterval(timer);
            }, [user?.id, screen, activeTab, isTabVisible, liveConfig.hours, persistUser, showToast]);

            // 4. ตัวจับเวลาทำข้อสอบ (Pre-test / Post-test)
            useEffect(() => {
                if (screen !== 'quiz' || quiz.finished) return;
                const t = setInterval(() => {
                    setQuiz(prev => {
                        if (prev.finished) return prev;
                        if (prev.timeLeft <= 1) {
                            handleFinishQuiz(prev);
                            return { ...prev, timeLeft: 0 };
                        }
                        return { ...prev, timeLeft: prev.timeLeft - 1 };
                    });
                }, 1000);
                return () => clearInterval(t);
            }, [screen, quiz.finished]);

            // 5. วาดประกาศนียบัตรลง Canvas เมื่อเปิดหน้า Certificate
            useEffect(() => {
                if (screen !== 'certificate' || !user || !certCanvasRef.current) return;
                const verifyUrl = `${window.location.origin}${window.location.pathname.replace(/index\.html$/i, '')}verify.html?code=${encodeURIComponent(user.certificateCode || '')}`;
                renderCertificateCanvas(certCanvasRef.current, user, certTemplate, verifyUrl);
            }, [screen, user, certTemplate]);

            // ป้องกันการค้างหน้าเมื่อไม่มีเซสชันผู้เรียน
            useEffect(() => {
                if (!user && !['landing', 'auth'].includes(screen)) {
                    setScreen('landing');
                }
            }, [user, screen]);

            // ขั้นที่ 1: เมื่อเข้าสู่ระบบแล้ว หากยังไม่ได้ทำ Pre-test ให้เริ่มทำ Pre-test ทันที
            useEffect(() => {
                if (user && screen === 'dashboard' && (!user.pretest || user.pretest === '-')) {
                    startQuiz('pretest');
                }
            }, [user?.id, user?.pretest, screen]);

            // ============================================================================
            // 6. AUTH WIZARD HANDLERS (เรียนใหม่ / เรียนต่อเนื่อง + OTP Fallback)
            // ============================================================================
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = licenseInput.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (!cleanLic) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพก่อนค่ะ', 'error');
                    return;
                }
                setIsBusy(true);
                let found = null;

                // ค้นหาประวัติเดิมใน Firestore จากเลขที่ใบอนุญาต
                if (isCloudConfigured && fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) {
                            found = { id: snap.id, ...snap.data() };
                        }
                    } catch (err) {
                        console.warn('License lookup warning:', err);
                    }
                }

                setExistingUserData(found);
                if (found) {
                    const dept = found.department || 'กรมการแพทย์';
                    const hospList = HOSPITAL_MAPPING[dept] || HOSPITAL_MAPPING['อื่นๆ'] || [];
                    setProfileForm({
                        name: found.name || '',
                        license: cleanLic,
                        userType: 'เรียนต่อเนื่อง',
                        email: found.email || '',
                        phone: found.phone || '',
                        position: found.position || '',
                        workContext: found.workContext || 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                        department: dept,
                        hospital: found.hospital || hospList[0]?.name || '',
                        province: found.province || hospList[0]?.prov || ''
                    });
                    showToast(`พบประวัติเดิมในระบบ (เรียนต่อเนื่อง • ความคืบหน้า ${found.progress || 0}%)`, 'info');
                } else {
                    setProfileForm({
                        name: '',
                        license: cleanLic,
                        userType: 'เรียนใหม่',
                        email: '',
                        phone: '',
                        position: '',
                        workContext: 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                        department: 'กรมการแพทย์',
                        hospital: 'รพ.ราชวิถี',
                        province: 'กรุงเทพมหานคร'
                    });
                }

                setAuthStep(2);
                setIsBusy(false);
            };

            const handleDepartmentChange = (dept) => {
                const list = HOSPITAL_MAPPING[dept] || [];
                setProfileForm(prev => ({
                    ...prev,
                    department: dept,
                    hospital: list[0]?.name || '',
                    province: list[0]?.prov || ''
                }));
            };

            const handleHospitalChange = (hospName) => {
                const list = HOSPITAL_MAPPING[profileForm.department] || [];
                const hit = list.find(h => h.name === hospName);
                setProfileForm(prev => ({
                    ...prev,
                    hospital: hospName,
                    province: hit ? hit.prov : prev.province
                }));
            };

            const handleRequestOtp = async (e) => {
                e.preventDefault();
                if (!profileForm.name.trim() || !profileForm.email.trim()) {
                    showToast('กรุณากรอกชื่อ-นามสกุล และอีเมลให้ครบถ้วนค่ะ', 'error');
                    return;
                }
                setIsBusy(true);
                setFallbackOtpCode('');
                setOtpInput('');

                const res = await callAppsScript({
                    action: 'requestOTP',
                    email: profileForm.email.trim(),
                    name: profileForm.name.trim()
                });

                if (res?.status === 'success') {
                    showToast(`ส่งรหัส OTP 6 หลักไปยัง ${profileForm.email.trim()} แล้วค่ะ`);
                    setAuthStep(3);
                } else {
                    // แผนสำรองอัตโนมัติ: ป้องกันผู้เรียนค้างหากติด Failed to fetch จาก Apps Script
                    const localOtp = String(Math.floor(100000 + Math.random() * 900000));
                    setFallbackOtpCode(localOtp);
                    showToast(`ระบบส่งอีเมลขัดข้องชั่วคราว — ใช้รหัสยืนยันสำรอง: ${localOtp}`, 'info');
                    setAuthStep(3);
                }
                setIsBusy(false);
            };

            const handleVerifyOtpAndLogin = async (e) => {
                e.preventDefault();
                const code = otpInput.trim().replace(/[^0-9]/g, '');
                if (code.length !== 6) {
                    showToast('กรุณากรอกรหัส OTP 6 หลักให้ครบถ้วนค่ะ', 'error');
                    return;
                }

                setIsBusy(true);
                let verified = false;

                if (fallbackOtpCode) {
                    verified = code === fallbackOtpCode;
                    if (!verified) showToast('รหัสยืนยันสำรองไม่ถูกต้อง กรุณาตรวจสอบตัวเลข 6 หลักด้านบนค่ะ', 'error');
                } else {
                    const res = await callAppsScript({
                        action: 'verifyOTP',
                        email: profileForm.email.trim(),
                        otp: code
                    });
                    if (res?.status === 'success') {
                        verified = true;
                    } else {
                        showToast(res?.message || 'รหัส OTP ไม่ถูกต้องหรือหมดอายุค่ะ', 'error');
                    }
                }

                if (verified) {
                    const cleanLic = profileForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                    const isContinuing = profileForm.userType === 'เรียนต่อเนื่อง' || Boolean(existingUserData);
                    const prev = existingUserData || {};

                    const loggedUser = {
                        ...prev,
                        id: cleanLic,
                        license: cleanLic,
                        name: profileForm.name.trim(),
                        email: profileForm.email.trim(),
                        phone: profileForm.phone.trim(),
                        position: profileForm.position.trim(),
                        workContext: profileForm.workContext,
                        department: profileForm.department,
                        hospital: profileForm.hospital,
                        province: profileForm.province,
                        userType: isContinuing ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                        status: prev.status || 'กำลังเรียน',
                        pretest: prev.pretest || '-',
                        posttest: prev.posttest || '-',
                        studySeconds: prev.studySeconds || 0,
                        progress: prev.progress ?? calcProgress(prev.studySeconds || 0, isContinuing ? 'เรียนต่อเนื่อง' : 'เรียนใหม่', liveConfig.hours),
                        lastVideoId: prev.lastVideoId || lessons[0]?.id || 1,
                        skillLabPassed: Boolean(prev.skillLabPassed),
                        skillLabHistory: Array.isArray(prev.skillLabHistory) ? prev.skillLabHistory : [],
                        liveCheckedIn: Boolean(prev.liveCheckedIn),
                        lastLoginAt: new Date().toISOString()
                    };

                    setStudySeconds(loggedUser.studySeconds);
                    setCurrentVideoId(loggedUser.lastVideoId);
                    setIsLiveCheckedIn(loggedUser.liveCheckedIn);
                    await persistUser(loggedUser, true);
                    callAppsScript({ action: 'upsertUser', user: loggedUser });

                    showToast(`ยินดีต้อนรับคุณ ${loggedUser.name} ค่ะ`);
                    if (!loggedUser.pretest || loggedUser.pretest === '-') {
                        startQuiz('pretest');
                    } else {
                        setScreen('dashboard');
                    }
                }
                setIsBusy(false);
            };

            const handleStartDemoMode = () => {
                const demoUser = {
                    id: 'demo_2027',
                    license: 'DEMO2027',
                    name: 'พว.ทดลอง เรียนรู้ (Sandbox)',
                    email: 'demo@rjcloud.organ',
                    phone: '0800000000',
                    position: 'พยาบาลวิชาชีพ',
                    workContext: 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                    department: 'กรมการแพทย์',
                    hospital: 'รพ.ราชวิถี',
                    province: 'กรุงเทพมหานคร',
                    userType: 'เรียนใหม่',
                    status: 'กำลังเรียน',
                    pretest: '-',
                    posttest: '-',
                    studySeconds: 0,
                    progress: 0,
                    lastVideoId: lessons[0]?.id || 1,
                    skillLabPassed: false,
                    skillLabHistory: []
                };
                setStudySeconds(0);
                persistUser(demoUser, false);
                showToast('เข้าสู่โหมดทดลองใช้งาน เริ่มทำ Pre-test (ขั้นที่ 1) ได้เลยค่ะ', 'info');
                startQuiz('pretest');
            };

            const handleLogout = async () => {
                if (user) {
                    const prog = calcProgress(studySeconds, user.userType, liveConfig.hours);
                    await persistUser({ ...user, studySeconds, progress: prog }, true);
                }
                try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                setUser(null);
                setScreen('landing');
                setAuthStep(1);
                showToast('ออกจากระบบและบันทึกเวลาเรียนเรียบร้อยแล้วค่ะ');
            };

            const handleSecretAdminTap = () => {
                adminTapRef.current.count += 1;
                clearTimeout(adminTapRef.current.timer);
                if (adminTapRef.current.count >= 3) {
                    adminTapRef.current.count = 0;
                    window.location.href = './admin.html';
                    return;
                }
                adminTapRef.current.timer = setTimeout(() => {
                    adminTapRef.current.count = 0;
                }, 1800);
            };

            // ============================================================================
            // 7. QUIZ HANDLERS (PRE-TEST & POST-TEST ≥ 80%)
            // ============================================================================
            const startQuiz = (type) => {
                const rawSet = questionSets[0] || parseRawExams(INITIAL_QUIZ_RAW);
                const prepared = prepareShuffledExam(rawSet);
                setQuiz({ type, questions: prepared, idx: 0, answers: {}, score: 0, timeLeft: 2700, finished: false });
                setScreen('quiz');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleFinishQuiz = async (quizState) => {
                if (quizState.finished || !userRef.current) return;
                const curU = userRef.current;
                const score = quizState.questions.reduce((acc, q) => acc + (quizState.answers[q.id] === q.answer ? 1 : 0), 0);
                const total = quizState.questions.length || 1;
                const percent = Math.round((score / total) * 100);
                const isPre = quizState.type === 'pretest';
                // ขั้นที่ 4: ต้องทำคะแนน Post-test ไม่น้อยกว่า 80%
                const passed = (score / total) >= 0.8;

                const updatedUser = {
                    ...curU,
                    ...(isPre
                        ? { pretest: `${score}/${total}` }
                        : {
                            posttest: `${score}/${total}`,
                            posttestPercent: percent,
                            status: passed ? 'ผ่าน' : 'ไม่ผ่าน'
                        })
                };

                setQuiz(prev => ({ ...prev, score, finished: true }));
                await persistUser(updatedUser, true);
                callAppsScript({ action: 'upsertUser', user: updatedUser });

                if (isPre) {
                    setScreen('quiz_result');
                } else if (passed) {
                    setCertFormName(updatedUser.name || '');
                    setCertFormHosp(updatedUser.hospital || '');
                    setScreen('cert_confirm');
                } else {
                    setScreen('quiz_fail');
                }
            };

            const handleRequestSubmitQuiz = () => {
                const unanswered = quiz.questions.length - Object.keys(quiz.answers).length;
                setConfirmDialog({
                    open: true,
                    title: 'ยืนยันการส่งคำตอบ?',
                    message: unanswered > 0
                        ? `คุณยังไม่ได้เลือกคำตอบอีก ${unanswered} ข้อ ต้องการส่งคำตอบเลยหรือไม่?`
                        : `ตอบครบทั้ง ${quiz.questions.length} ข้อแล้ว ยืนยันการส่งคำตอบเพื่อตรวจคะแนนหรือไม่?`,
                    confirmText: 'ส่งคำตอบ',
                    onConfirm: () => handleFinishQuiz(quiz)
                });
            };

            // ============================================================================
            // 8. CSAT & BUILT-IN CERTIFICATE STUDIO (ขั้นที่ 5: อ้างอิงคะแนน Post-test ≥ 80%)
            // ============================================================================
            const handleClaimCertificate = async (e) => {
                e.preventDefault();
                if (!user) return;

                const postInfo = parseScoreInfo(user.posttest);
                if (!postInfo.passed80) {
                    showToast('ต้องทำคะแนน Post-test ไม่น้อยกว่า 80% ก่อนจึงจะรับประกาศนียบัตรได้ค่ะ', 'error');
                    setScreen('dashboard');
                    return;
                }

                setIsBusy(true);
                const certCode = user.certificateCode || generateCertCode(certTemplate.certPrefix);
                const issuedAt = user.certificateIssuedAt || new Date().toISOString();

                const nextUser = {
                    ...user,
                    name: certFormName.trim() || user.name,
                    hospital: certFormHosp.trim() || user.hospital,
                    status: 'ผ่าน',
                    posttestPercent: postInfo.percent,
                    satisfactionScore: csatScore,
                    satisfactionComment: csatComment.trim(),
                    certificateClaimed: true,
                    certificateCode: certCode,
                    certificateIssuedAt: issuedAt
                };

                await persistUser(nextUser, true);
                callAppsScript({ action: 'upsertUser', user: nextUser });

                const certPublicDoc = {
                    code: certCode,
                    name: nextUser.name,
                    license: nextUser.license || nextUser.id,
                    position: nextUser.position || 'บุคลากรทางการแพทย์',
                    hospital: nextUser.hospital || 'เครือข่าย rjcloud.organ',
                    department: nextUser.department || '',
                    province: nextUser.province || '',
                    userType: nextUser.userType || 'เรียนใหม่',
                    courseTitleTH: certTemplate.courseTitleTH,
                    orgTitleTH: certTemplate.orgTitleTH,
                    signerName: certTemplate.signerName,
                    signerPosition: certTemplate.signerPosition,
                    posttestScore: `${nextUser.posttest} (${postInfo.percent}%)`,
                    issuedAt,
                    status: 'valid'
                };

                // บันทึกลง Local Cache และ Firestore (สำหรับหน้า verify.html สแกน QR)
                try {
                    const localCerts = JSON.parse(localStorage.getItem(LOCAL_CERTS_KEY) || '{}');
                    localCerts[certCode] = certPublicDoc;
                    localStorage.setItem(LOCAL_CERTS_KEY, JSON.stringify(localCerts));
                } catch (_) {}

                if (isCloudConfigured && fbDb && !String(nextUser.id).startsWith('demo_')) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', certCode),
                            certPublicDoc,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Save public cert warning:', err);
                    }
                }

                setIsBusy(false);
                setScreen('certificate');
                showToast('ออกประกาศนียบัตรอิเล็กทรอนิกส์เรียบร้อยแล้วค่ะ 🎉');
            };

            const handleDownloadCertPNG = () => {
                const canvas = certCanvasRef.current;
                if (!canvas) return;
                const link = document.createElement('a');
                link.download = `Certificate_${user?.certificateCode || 'rjcloud'}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                showToast('ดาวน์โหลดไฟล์รูปภาพ PNG แล้วค่ะ');
            };

            const handleDownloadCertPDF = () => {
                const canvas = certCanvasRef.current;
                if (!canvas || !window.jspdf?.jsPDF) {
                    showToast('กำลังเตรียมไลบรารี PDF กรุณาลองอีกครั้งหรือเลือกดาวน์โหลด PNG ค่ะ', 'error');
                    return;
                }
                const imgData = canvas.toDataURL('image/jpeg', 0.96);
                const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
                pdf.save(`Certificate_${user?.certificateCode || 'rjcloud'}.pdf`);
                showToast('ดาวน์โหลดประกาศนียบัตร PDF (A4) เรียบร้อยแล้วค่ะ');
            };

            const handleLiveCheckIn = async () => {
                if (!user) return;
                setIsLiveCheckedIn(true);
                await persistUser({ ...user, liveCheckedIn: true, lastLiveCheckInAt: new Date().toISOString() }, true);
                showToast('ยืนยันการเข้าฟังบรรยายสดเรียบร้อยแล้วค่ะ กำลังนับเวลาเรียนอัตโนมัติ');
            };

            // ============================================================================
            // 9. RENDER SCREENS
            // ============================================================================

            // --- SCREEN 1: LANDING ---
            if (screen === 'landing') {
                return (
                    <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />

                        <header className="relative z-20 max-w-6xl w-full mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shadow-md shadow-clinical-500/20">
                                    <Icon name="HeartPulse" size={22} />
                                </div>
                                <div>
                                    <span className="font-display font-extrabold text-lg text-slate-900 leading-none block">
                                        rjcloud<span className="text-clinical-600">.organ</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-slate-500 uppercase tracking-wider">{CONFIG.edition}</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <a
                                    href="./verify.html"
                                    className="touch-target px-3.5 py-2 rounded-xl bg-white/85 hover:bg-white border border-slate-200/80 text-slate-700 font-bold text-xs inline-flex items-center gap-1.5 shadow-sm"
                                >
                                    <Icon name="QrCode" size={15} className="text-clinical-600" />
                                    <span className="hidden sm:inline">ตรวจสอบประกาศฯ</span>
                                </a>
                                <a
                                    href="./executive.html"
                                    className="touch-target px-3.5 py-2 rounded-xl bg-white/85 hover:bg-white border border-slate-200/80 text-slate-700 font-bold text-xs inline-flex items-center gap-1.5 shadow-sm"
                                >
                                    <Icon name="BarChart3" size={15} className="text-medical-600" />
                                    <span className="hidden sm:inline">ผู้บริหาร</span>
                                </a>
                            </div>
                        </header>

                        <main className="relative z-10 flex-1 flex items-center justify-center px-4 sm:px-6 py-6">
                            <div className="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
                                <div className="lg:col-span-7 space-y-5 text-center lg:text-left">
                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-clinical-50 border border-clinical-200/80 text-clinical-700 font-mono text-[11px] font-bold">
                                        <span className="w-2 h-2 rounded-full bg-clinical-500 animate-pulse" />
                                        ORGAN DONATION &amp; TRANSPLANTATION E-LEARNING
                                    </span>

                                    <h1 className="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 leading-[1.18]">
                                        ยกระดับทักษะการดูแลและประสานงาน<span className="text-clinical-600">การรับบริจาคอวัยวะ</span>
                                    </h1>

                                    <p className="text-sm sm:text-base text-slate-600 leading-relaxed max-w-xl mx-auto lg:mx-0">
                                        เรียนรู้ครบวงจร 5 ขั้นตอนบนสมาร์ทโฟน: แบบทดสอบก่อนเรียน, บทเรียนวิดีโอสะสมเวลา, ห้องฝึกสื่อสาร <b>AI Skill Lab</b> และรับประกาศนียบัตรอิเล็กทรอนิกส์พร้อม QR Code ทันทีเมื่อผ่านเกณฑ์
                                    </p>

                                    <div className="flex flex-col sm:flex-row gap-3 justify-center lg:justify-start pt-1">
                                        <PrimaryButton onClick={() => { setAuthStep(1); setScreen('auth'); }} className="w-full sm:w-auto !px-7 !py-3.5">
                                            เข้าสู่ระบบ / ลงทะเบียนเรียน <Icon name="ArrowRight" size={18} />
                                        </PrimaryButton>
                                        <PrimaryButton variant="ghost" onClick={handleStartDemoMode} className="w-full sm:w-auto !py-3.5">
                                            <Icon name="Sparkles" size={17} className="text-clinical-600" /> ทดลองใช้งาน (Sandbox)
                                        </PrimaryButton>
                                    </div>
                                </div>

                                <BentoCard className="lg:col-span-5 p-5 sm:p-6 space-y-3.5">
                                    <div className="flex items-center justify-between">
                                        <span className="font-display font-bold text-sm text-slate-900">เส้นทางการเรียนรู้ 5 ขั้นตอน</span>
                                        <span className="font-mono text-[10px] font-bold text-clinical-700 bg-clinical-50 px-2 py-0.5 rounded-full">2027 PATHWAY</span>
                                    </div>
                                    <div className="space-y-2.5">
                                        {[
                                            { n: '01', t: 'Pre-test', d: 'ประเมินความรู้พื้นฐานทันทีหลังเข้าสู่ระบบ' },
                                            { n: '02', t: 'สะสมชั่วโมงเรียน ≥ 80%', d: 'รับชมบทเรียนออนไลน์และบันทึกเวลาอัตโนมัติ' },
                                            { n: '03', t: 'AI Skill Lab (มีโค้ชชี้นำ)', d: 'ฝึกให้ข้อมูลญาติในห้องรับรองให้เข้าใจหลักการ' },
                                            { n: '04', t: 'Post-test ≥ 80%', d: 'ทำแบบทดสอบหลังเรียนให้ผ่านเกณฑ์ 80%' },
                                            { n: '05', t: 'รับประกาศนียบัตรทันที', d: 'ออกใบประกาศฯ PDF/PNG + QR ตรวจสอบความถูกต้อง' }
                                        ].map(s => (
                                            <div key={s.n} className="flex items-start gap-3 p-2.5 rounded-2xl bg-white/85 border border-slate-100">
                                                <span className="w-7 h-7 rounded-xl bg-clinical-50 text-clinical-700 font-mono text-xs font-extrabold flex items-center justify-center shrink-0">
                                                    {s.n}
                                                </span>
                                                <div>
                                                    <p className="font-display font-bold text-xs sm:text-sm text-slate-900 leading-tight">{s.t}</p>
                                                    <p className="text-[11px] text-slate-500 mt-0.5">{s.d}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </BentoCard>
                            </div>
                        </main>

                        <footer className="relative z-10 max-w-6xl w-full mx-auto px-4 py-4 flex items-center justify-between text-[11px] text-slate-400">
                            <button
                                type="button"
                                onClick={handleSecretAdminTap}
                                title="ผู้ดูแลระบบ (แตะ 3 ครั้ง)"
                                className="w-9 h-9 rounded-xl text-slate-300 hover:text-slate-500 hover:bg-white/70 flex items-center justify-center transition-colors"
                                aria-label="เข้าหน้าผู้ดูแลระบบ"
                            >
                                <Icon name="Settings" size={16} />
                            </button>
                            <span>{CONFIG.appName} • {CONFIG.contactEmail}</span>
                        </footer>

                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 2: AUTH WIZARD (3 STEPS) ---
            if (screen === 'auth') {
                const hospOptions = HOSPITAL_MAPPING[profileForm.department] || [];
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-3.5 sm:p-6 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />

                        <BentoCard className="relative z-10 w-full max-w-lg p-5 sm:p-8 space-y-5">
                            <div className="flex items-center justify-between">
                                <button
                                    type="button"
                                    onClick={() => (authStep === 1 ? setScreen('landing') : setAuthStep(authStep - 1))}
                                    className="px-3.5 py-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs inline-flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                </button>
                                <span className="px-3 py-1 rounded-full bg-clinical-50 text-clinical-700 font-mono text-xs font-bold">
                                    STEP {authStep}/3
                                </span>
                            </div>

                            {authStep === 1 && (
                                <form onSubmit={handleCheckLicense} className="space-y-4">
                                    <div className="text-center space-y-1">
                                        <div className="w-14 h-14 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto mb-2">
                                            <Icon name="IdCard" size={28} />
                                        </div>
                                        <h2 className="font-display text-2xl font-extrabold text-slate-900">ตรวจสอบเลขที่ใบอนุญาต</h2>
                                        <p className="text-xs sm:text-sm text-slate-500">ระบบจะตรวจสอบประวัติการเรียนล่าสุดจากเลขที่ใบอนุญาตให้อัตโนมัติ</p>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5 ml-1">เลขที่ใบประกอบวิชาชีพ / รหัสประจำตัว</label>
                                        <input
                                            type="text"
                                            required
                                            value={licenseInput}
                                            onChange={e => setLicenseInput(e.target.value)}
                                            placeholder="เช่น 65012345"
                                            className="touch-target w-full px-4 py-3.5 rounded-2xl bg-white border border-slate-200 font-mono text-base font-bold text-slate-900 focus:outline-none focus:border-clinical-500 focus:ring-4 focus:ring-clinical-500/10"
                                        />
                                    </div>

                                    <PrimaryButton type="submit" disabled={isBusy} className="w-full py-3.5">
                                        {isBusy ? 'กำลังตรวจสอบประวัติ...' : 'ตรวจสอบสิทธิ์และดำเนินการต่อ'} <Icon name="ArrowRight" size={18} />
                                    </PrimaryButton>
                                </form>
                            )}

                            {authStep === 2 && (
                                <form onSubmit={handleRequestOtp} className="space-y-3.5 max-h-[75dvh] overflow-y-auto custom-scrollbar pr-1">
                                    <div className="text-center">
                                        <h2 className="font-display text-xl sm:text-2xl font-extrabold text-slate-900">ยืนยันข้อมูลผู้เรียน</h2>
                                        <p className="text-xs text-slate-500">ข้อมูลนี้จะนำไปแสดงบนประกาศนียบัตรอิเล็กทรอนิกส์</p>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">ชื่อ - นามสกุล *</label>
                                        <input
                                            type="text"
                                            required
                                            value={profileForm.name}
                                            onChange={e => setProfileForm(p => ({ ...p, name: e.target.value }))}
                                            placeholder="เช่น พว.ใจดี มีเมตตา"
                                            className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm font-medium focus:outline-none focus:border-clinical-500"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">เลขที่ใบอนุญาต</label>
                                            <input
                                                type="text"
                                                readOnly
                                                value={profileForm.license}
                                                className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-slate-100 border border-slate-200 font-mono text-sm font-bold text-slate-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">ประเภทการเรียน</label>
                                            <select
                                                value={profileForm.userType}
                                                onChange={e => setProfileForm(p => ({ ...p, userType: e.target.value }))}
                                                className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm font-bold text-clinical-700 focus:outline-none focus:border-clinical-500"
                                            >
                                                <option value="เรียนใหม่">เรียนใหม่</option>
                                                <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                            </select>
                                        </div>
                                    </div>

                                    {existingUserData && (
                                        <div className="p-3 rounded-2xl bg-clinical-50 border border-clinical-200 text-xs text-clinical-800 flex items-center gap-2">
                                            <Icon name="History" size={16} className="shrink-0 text-clinical-600" />
                                            <span>พบสถานะเดิม: ความคืบหน้า <b>{existingUserData.progress || 0}%</b> • Pre-test: <b>{existingUserData.pretest || '-'}</b> (เรียนต่อจากจุดเดิมทันที)</span>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">อีเมล (สำหรับรับรหัส OTP) *</label>
                                            <input
                                                type="email"
                                                required
                                                value={profileForm.email}
                                                onChange={e => setProfileForm(p => ({ ...p, email: e.target.value }))}
                                                placeholder="name@hospital.go.th"
                                                className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">เบอร์โทรศัพท์</label>
                                            <input
                                                type="tel"
                                                value={profileForm.phone}
                                                onChange={e => setProfileForm(p => ({ ...p, phone: e.target.value }))}
                                                placeholder="08xxxxxxxx"
                                                className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">ตำแหน่ง</label>
                                        <input
                                            type="text"
                                            value={profileForm.position}
                                            onChange={e => setProfileForm(p => ({ ...p, position: e.target.value }))}
                                            placeholder="พยาบาลวิชาชีพ / แพทย์ / เภสัชกร"
                                            className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">ลักษณะงานปัจจุบัน</label>
                                        <select
                                            value={profileForm.workContext}
                                            onChange={e => setProfileForm(p => ({ ...p, workContext: e.target.value }))}
                                            className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                        >
                                            <option value="ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ">ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ</option>
                                            <option value="ปฏิบัติงานหอผู้ป่วยวิกฤต (ICU) / ห้องฉุกเฉิน">ปฏิบัติงานหอผู้ป่วยวิกฤต (ICU) / ห้องฉุกเฉิน</option>
                                            <option value="ไม่ได้ปฏิบัติงานด้านนี้โดยตรง แต่สนใจศึกษา">ไม่ได้ปฏิบัติงานด้านนี้โดยตรง แต่สนใจศึกษา</option>
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">สังกัด / เขตสุขภาพ</label>
                                            <select
                                                value={profileForm.department}
                                                onChange={e => handleDepartmentChange(e.target.value)}
                                                className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                            >
                                                {Object.keys(HOSPITAL_MAPPING).map(dept => (
                                                    <option key={dept} value={dept}>{dept}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">หน่วยงาน / โรงพยาบาล</label>
                                            {hospOptions.length > 0 && profileForm.department !== 'อื่นๆ' ? (
                                                <select
                                                    value={profileForm.hospital}
                                                    onChange={e => handleHospitalChange(e.target.value)}
                                                    className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                                >
                                                    {hospOptions.map(h => (
                                                        <option key={h.name} value={h.name}>{h.name}</option>
                                                    ))}
                                                </select>
                                            ) : (
                                                <input
                                                    type="text"
                                                    value={profileForm.hospital}
                                                    onChange={e => setProfileForm(p => ({ ...p, hospital: e.target.value }))}
                                                    placeholder="ระบุชื่อโรงพยาบาล / หน่วยงาน"
                                                    className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                                />
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1 ml-1">จังหวัด</label>
                                        <input
                                            type="text"
                                            value={profileForm.province}
                                            onChange={e => setProfileForm(p => ({ ...p, province: e.target.value }))}
                                            className="touch-target w-full px-3.5 py-2.5 rounded-2xl bg-white border border-slate-200 text-sm focus:outline-none focus:border-clinical-500"
                                        />
                                    </div>

                                    <PrimaryButton type="submit" disabled={isBusy} className="w-full py-3.5 mt-2">
                                        {isBusy ? 'กำลังส่งรหัส OTP...' : 'ขอรับรหัส OTP ทางอีเมล'} <Icon name="Mail" size={18} />
                                    </PrimaryButton>
                                </form>
                            )}

                            {authStep === 3 && (
                                <form onSubmit={handleVerifyOtpAndLogin} className="space-y-4 text-center">
                                    <div className="w-14 h-14 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto">
                                        <Icon name="ShieldCheck" size={28} />
                                    </div>
                                    <div>
                                        <h2 className="font-display text-2xl font-extrabold text-slate-900">กรอกรหัสยืนยัน OTP</h2>
                                        <p className="text-xs sm:text-sm text-slate-500 mt-1">
                                            ระบบจัดส่งรหัส 6 หลักไปที่ <b className="text-slate-800">{profileForm.email}</b>
                                        </p>
                                    </div>

                                    {fallbackOtpCode && (
                                        <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 space-y-1">
                                            <p className="font-bold">รหัสยืนยันสำรอง (Fallback Mode):</p>
                                            <p className="font-mono text-2xl font-extrabold tracking-[0.35em] text-amber-700">{fallbackOtpCode}</p>
                                        </div>
                                    )}

                                    <input
                                        type="text"
                                        inputMode="numeric"
                                        maxLength={6}
                                        required
                                        value={otpInput}
                                        onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))}
                                        placeholder="000000"
                                        className="touch-target w-full px-4 py-4 rounded-2xl bg-white border-2 border-slate-200 focus:border-clinical-500 font-mono text-3xl font-extrabold text-center tracking-[0.45em] text-clinical-700 outline-none"
                                    />

                                    <PrimaryButton type="submit" disabled={isBusy || otpInput.length !== 6} className="w-full py-3.5">
                                        {isBusy ? 'กำลังยืนยันรหัส...' : 'ยืนยันรหัสและเข้าสู่ห้องเรียน'}
                                    </PrimaryButton>

                                    <button
                                        type="button"
                                        onClick={handleRequestOtp}
                                        disabled={isBusy}
                                        className="text-xs font-bold text-clinical-700 hover:underline"
                                    >
                                        ส่งรหัส OTP ใหม่อีกครั้ง
                                    </button>
                                </form>
                            )}
                        </BentoCard>
                        <ToastBanner toast={toast} />
                    </div>
                );
            }

            // --- SCREEN 3: QUIZ (PRE-TEST / POST-TEST) ---
            if (screen === 'quiz') {
                const q = quiz.questions[quiz.idx];
                const selectedOpt = q ? quiz.answers[q.id] : undefined;
                if (!q) return null;

                return (
                    <div className="min-h-dvh relative flex flex-col items-center justify-start md:justify-center p-3 sm:p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-3xl p-5 sm:p-8 mt-2 md:mt-0 space-y-5">
                            <div className="flex flex-wrap items-center justify-between gap-2.5 pb-4 border-b border-slate-200/80">
                                <div>
                                    <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-clinical-100 text-clinical-700">
                                        {quiz.type === 'pretest' ? 'ขั้นที่ 1 • PRE-TEST' : 'ขั้นที่ 4 • POST-TEST (เกณฑ์ผ่าน ≥ 80%)'}
                                    </span>
                                    <h2 className="font-display text-lg md:text-xl font-bold text-slate-900 mt-1">
                                        แบบทดสอบ{quiz.type === 'pretest' ? 'ก่อนเรียน' : 'หลังเรียน'}
                                    </h2>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="px-3 py-1.5 rounded-xl bg-slate-100 font-mono text-xs font-bold text-slate-700">
                                        ข้อ {quiz.idx + 1} / {quiz.questions.length}
                                    </span>
                                    <span className="px-3 py-1.5 rounded-xl bg-medical-50 text-medical-700 font-mono text-xs font-bold flex items-center gap-1">
                                        <Icon name="Clock" size={14} /> {formatTimerMMSS(quiz.timeLeft)}
                                    </span>
                                </div>
                            </div>
