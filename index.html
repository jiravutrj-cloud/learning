          const mode = saved === 'light' ? 'light' : 'dark';

        // Core Helper Wrappers (ทำงานได้ทั้งตอนโหลด learning-core.js และโหมดพรีวิวเดี่ยว)

        }));

            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (h > 0) return `${h} ชม. ${m} น.`;
            if (m > 0) return `${m} น. ${s} วิ`;
            return `${s} วินาที`;
        });
        const formatThaiDate = CORE.formatThaiDate || ((iso) => {
            try {
                const d = iso ? new Date(iso) : new Date();
                return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (_) { return '-'; }
        });
        const maskEmail = CORE.maskEmail || ((e) => {
            const clean = String(e || '').trim();
            if (!clean || !clean.includes('@')) return clean ? '••••••' : '';
            const [local, dom] = clean.split('@');
            return `${local.slice(0, Math.min(2, local.length))}••••@${dom}`;
        });
        const maskPhone = CORE.maskPhone || ((p) => {
            const d = String(p || '').replace(/[^0-9]/g, '');
            if (!d) return '';
            return d.length <= 5 ? '•••••' : `${d.slice(0, 3)}••••${d.slice(-3)}`;
        });
        const resolveRegionId = CORE.resolveRegionId || ((dep = '') => {
            const d = String(dep || '').trim();
            if (d.startsWith('เขตสุขภาพที่')) {
                const num = d.replace(/[^0-9]/g, '');
                if (num && Number(num) >= 1 && Number(num) <= 12) return `R${num}`;
            }
            if (['กรมการแพทย์', 'สำนักการแพทย์ กรุงเทพฯ', 'สำนักอนามัย กรุงเทพฯ', 'กรุงเทพมหานคร'].some(k => d.includes(k))) return 'BKK';
            return 'OTHER';
        });

            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);

            return `ANON-${(h >>> 0).toString(16).toUpperCase().padStart(8, '0')}`;

        // CORS-Safe Apps Script Caller (เพิ่ม redirect: 'follow' รองรับ Google Apps Script Web App)
        async function postAppsScript(url, payload) {
            if (!url) return { status: 'no_url', message: 'ยังไม่ได้ตั้งค่า Apps Script URL' };
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const txt = await res.text();
                try { return JSON.parse(txt); }
                catch (_) { return { status: res.ok ? 'success' : 'error', raw: txt }; }
            } catch (err) {
                return { status: 'network_error', message: err.message };
            }
        }

        // ส่งรหัส OTP ทางอีเมลจริงผ่าน Apps Script (รองรับชื่อ action มาตรฐานและแนบฟิลด์ครบถ้วน)
        async function sendOtpViaEmail(url, email, otp, name, license) {
            if (!url || !email) return { ok: false, reason: 'ไม่พบ URL ส่งอีเมลหรือที่อยู่อีเมลปลายทาง' };
            const cleanEmail = String(email).trim();
            const cleanOtp = String(otp).trim();
            const appName = CONFIG.appName || 'rjcloud.organ';
            const basePayload = {
                email: cleanEmail,
                to: cleanEmail,
                otp: cleanOtp,
                code: cleanOtp,
                name: String(name || 'ผู้เรียน'),
                license: String(license || ''),
                appName,
                subject: `[${appName}] รหัสยืนยันตัวตน OTP 6 หลัก: ${cleanOtp}`,
                body: `สวัสดีค่ะคุณ ${name || 'ผู้เรียน'}\n\nรหัสยืนยันตัวตน OTP 6 หลักสำหรับเข้าสู่ระบบ ${appName} คือ: ${cleanOtp}\n(ใช้ได้ภายใน 10 นาที • ห้ามเปิดเผยรหัสนี้แก่ผู้อื่น)\n\nขอบคุณค่ะ\nทีมงาน ${appName}`
            };

            const candidateActions = ['sendOtp', 'sendOTP', 'sendOtpEmail', 'sendEmail'];
            let lastErr = 'ระบบส่งอีเมลไม่ตอบสนอง กรุณาตรวจสอบการ Deploy Web App ของ Code.gs ค่ะ';

            for (const act of candidateActions) {
                const res = await postAppsScript(url, { action: act, ...basePayload });
                if (res?.status === 'success' || res?.ok === true || res?.sent === true) {
                    return { ok: true, res };
                }
                const msg = String(res?.message || '');
                if (msg) lastErr = msg;
                // หาก error ไม่ใช่เรื่องไม่รองรับชื่อ action ให้หยุดทันที (เช่น โควต้าเต็มหรือเน็ตหลุด)
                if (!msg.includes('ไม่รองรับ') && !msg.toLowerCase().includes('action')) {
                    break;
                }
            }
            return { ok: false, reason: lastErr };
        }

        // 3. SUB-MODULES: AI STUDY COMPANION, QUIZ ENGINE, CASES, FLASHCARDS, CNEU LETTER
        // ============================================================================
        function AiStudyCompanion({ lesson, user, appsScriptUrl, showToast }) {
            const roleProfile = useMemo(() => resolveRoleProfile(user), [user]);
            const guide = (window.LESSON_AI_GUIDES && window.LESSON_AI_GUIDES[lesson?.id]) || {
                keyPoints: [
                    `ทบทวนแนวคิดหลักและเกณฑ์มาตรฐานในบทที่ ${lesson?.id || 1}: ${lesson?.title || ''}`,
                    'เชื่อมโยงการคัดกรอง การดูแลสัญญาณชีพ และการสื่อสารกับครอบครัวผู้ป่วยอย่างอ่อนโยน'
                ],
                microCheck: null
            };

            const [pickedOpt, setPickedOpt] = useState(null);
            const [chatInput, setChatInput] = useState('');
            const [chatMsgs, setChatMsgs] = useState([]);
            const [asking, setAsking] = useState(false);
            const [audioPhase, setAudioPhase] = useState('idle'); // idle | loading | playing
            const audioElRef = useRef(null);
            const blobUrlRef = useRef(null);

            const stopAudio = useCallback(() => {
                if (audioElRef.current) { try { audioElRef.current.pause(); } catch (_) {} audioElRef.current = null; }
                if (blobUrlRef.current) { try { URL.revokeObjectURL(blobUrlRef.current); } catch (_) {} blobUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setAudioPhase('idle');
            }, []);

            useEffect(() => {
                setPickedOpt(null);
                setChatMsgs([]);
                stopAudio();
                return () => stopAudio();
            }, [lesson?.id, stopAudio]);

            const handlePlayAudioBrief = async () => {
                if (audioPhase !== 'idle') { stopAudio(); return; }
                const script = `สรุป 1 นาที บทที่ ${lesson.id} เรื่อง ${lesson.title} ค่ะ ประเด็นสำคัญคือ ${guide.keyPoints.join(' และ ')}`;
                const cacheKey = `lesson_brief_${lesson.id}`;
                setAudioPhase('loading');

                try {
                    let blob = typeof CORE.getCachedAudio === 'function' ? await CORE.getCachedAudio(cacheKey) : null;
                    if (!blob && appsScriptUrl && typeof CORE.pcm16ToWavBlob === 'function') {
                        const res = await postAppsScript(appsScriptUrl, { action: 'callGeminiTTS', text: script, voiceName: 'Aoede' });
                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            blob = CORE.pcm16ToWavBlob(res.inlineData.data, rate);
                            if (typeof CORE.setCachedAudio === 'function') await CORE.setCachedAudio(cacheKey, blob);
                        }
                    }
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        blobUrlRef.current = url;
                        const audio = new Audio(url);
                        audioElRef.current = audio;
                        setAudioPhase('playing');
                        audio.onended = () => stopAudio();
                        audio.onerror = () => stopAudio();
                        await audio.play();
                        return;
                    }
                } catch (_) {}

                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(script);
                        utter.lang = 'th-TH';
                        utter.rate = 0.98;
                        setAudioPhase('playing');
                        utter.onend = () => setAudioPhase('idle');
                        utter.onerror = () => setAudioPhase('idle');
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }
                setAudioPhase('idle');
                showToast('อุปกรณ์นี้ไม่รองรับการเล่นเสียงอัตโนมัติค่ะ', 'info');
            };

            const handleAskAi = async (e) => {
                e.preventDefault();
                const q = chatInput.trim();
                if (!q || asking) return;
                setChatInput('');
                setChatMsgs(p => [...p, { role: 'user', text: q }]);
                setAsking(true);

                const sys = `คุณคือ AI Study Companion ผู้ช่วยติวบทเรียนการรับบริจาคและปลูกถ่ายอวัยวะ rjcloud.organ
บทเรียนปัจจุบัน: บทที่ ${lesson?.id} - ${lesson?.title}
${roleProfile.aiPromptAddon || ''}
อ้างอิงความรู้วิชาชีพ: ${(window.CLINICAL_KNOWLEDGE_BASE || '').slice(0, 1800)}
ตอบภาษาไทยกระชับ 3-4 บรรทัด อ่านง่าย เป็นมิตร และยึดหลักวิชาชีพค่ะ`;

                let reply = '';
                if (appsScriptUrl) {
                    const res = await postAppsScript(appsScriptUrl, { action: 'callGemini', prompt: q, systemInstruction: sys });
                    if (res?.status === 'success' && res.text) reply = res.text;
                }
                if (!reply) {
                    reply = `สรุปแนวทางสำหรับบทที่ ${lesson?.id} (${lesson?.title}):\n• ${guide.keyPoints[0]}\n• หากต้องการฝึกสื่อสารกับญาติจริง แนะนำเข้าฝึกต่อใน AI Skill Lab 3 มิติค่ะ`;
                }
                setChatMsgs(p => [...p, { role: 'ai', text: reply }]);
                setAsking(false);
            };

            return (
                <div className={`spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-4 overflow-hidden ${audioPhase === 'loading' ? 'ambient-loading-card' : audioPhase === 'playing' ? 'ambient-playing-card' : ''}`}>
                    {audioPhase !== 'idle' && <div className={`ambient-ribbon ${audioPhase === 'loading' ? 'ambient-ribbon-loading' : 'ambient-ribbon-playing'}`} />}

                    <div className="flex items-start justify-between gap-2">
                        <div>
                            <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[10px] font-bold">
                                <Icon name="Sparkles" size={11} /> AI STUDY COMPANION
                            </span>
                            <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive mt-1">สรุป 1 นาที &amp; ถาม AI ประจำบท</h3>
                            <p className="text-[11px] text-prism-adaptive font-bold">{roleProfile.badgeTH}</p>
                        </div>
                        <button
                            type="button"
                            onClick={handlePlayAudioBrief}
                            className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shrink-0 ${
                                audioPhase === 'loading' ? 'ambient-btn-runner'
                                    : audioPhase === 'playing' ? 'bg-rose-500 text-white'
                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                            }`}
                        >
                            <Icon name={audioPhase === 'playing' ? 'Square' : 'Volume2'} size={14} />
                            {audioPhase === 'loading' ? 'เตรียมเสียง...' : audioPhase === 'playing' ? 'หยุดฟัง' : 'ฟังสรุป'}
                        </button>
                    </div>

                    <ul className="space-y-1.5 text-xs text-secondary-adaptive leading-relaxed">
                        {guide.keyPoints.map((kp, idx) => (
                            <li key={idx} className="spatial-soft p-2.5 rounded-xl flex gap-2">
                                <span className="font-mono font-bold text-accent-adaptive shrink-0">{idx + 1}.</span>
                                <span>{kp}</span>
                            </li>
                        ))}
                    </ul>

                    {guide.microCheck && (
                        <div className="spatial-soft p-3.5 rounded-2xl space-y-2 border-prism-400/25">
                            <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">MICRO-CHECK (ทบทวนด่วน 1 ข้อ)</p>
                            <p className="text-xs font-bold text-primary-adaptive leading-snug">{guide.microCheck.q}</p>
                            <div className="space-y-1.5">
                                {guide.microCheck.options.map((opt, idx) => {
                                    const picked = pickedOpt === idx;
                                    const isCorrect = idx === guide.microCheck.answer;
                                    const cls = pickedOpt === null
                                        ? 'spatial-soft text-secondary-adaptive'
                                        : isCorrect ? 'bg-aurora-500/20 border-aurora-400 text-accent-adaptive font-bold'
                                            : picked ? 'bg-rose-500/20 border-rose-400 text-rose-300' : 'spatial-soft opacity-60';
                                    return (
                                        <button key={idx} type="button" onClick={() => setPickedOpt(idx)} className={`w-full text-left p-2.5 rounded-xl border text-xs transition-all ${cls}`}>
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>
                            {pickedOpt !== null && (
                                <p className="text-xs text-accent-adaptive pt-1 leading-relaxed">{guide.microCheck.explain}</p>
                            )}
                        </div>
                    )}

                    <div className="space-y-2 pt-2 border-t border-white/10">
                        <p className="text-[11px] text-muted-adaptive flex items-center gap-1">
                            <Icon name="ShieldCheck" size={12} className="text-accent-adaptive shrink-0" />
                            ถามข้อสงสัยคลินิกได้ทันที (งดพิมพ์ชื่อ/HN ผู้ป่วยจริง)
                        </p>
                        {chatMsgs.length > 0 && (
                            <div className="max-h-44 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                {chatMsgs.map((m, i) => (
                                    <div key={i} className={`p-2.5 rounded-xl text-xs whitespace-pre-line leading-relaxed ${m.role === 'user' ? 'bg-aurora-500/20 text-primary-adaptive ml-6' : 'spatial-soft text-secondary-adaptive mr-4'}`}>
                                        {m.text}
                                    </div>
                                ))}
                            </div>
                        )}
                        <form onSubmit={handleAskAi} className="flex gap-1.5">
                            <input
                                type="text"
                                value={chatInput}
                                onChange={e => setChatInput(e.target.value)}
                                placeholder="ถาม AI เกี่ยวกับบทนี้..."
                                disabled={asking}
                                className="touch-target spatial-input flex-1 px-3 py-2 rounded-xl text-xs"
                            />
                            <button type="submit" disabled={!chatInput.trim() || asking} className="touch-target px-3.5 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-bold text-xs disabled:opacity-40">
                                {asking ? '...' : 'ถาม'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function QuizEngine({ mode, questions, onComplete, onExit }) {
            const [answers, setAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [result, setResult] = useState(null);

            const total = questions.length || 1;
            const answeredCount = Object.keys(answers).length;

            const handleSubmit = () => {
                let score = 0;
                questions.forEach((q, idx) => { if (answers[idx] === q.answer) score++; });
                const pct = Math.round((score / total) * 100);
                const diagnosis = computeDomainDiagnosis(questions, answers, MIN_POSTTEST_PERCENT);
                const passed = mode === 'pretest' ? true : pct >= MIN_POSTTEST_PERCENT;
                setResult({ score, total, pct, passed, diagnosis });
                setSubmitted(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="max-w-3xl mx-auto px-3.5 sm:px-6 py-6 space-y-5">
                    <div className="spatial-card rounded-[1.75rem] p-5 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                {mode === 'pretest' ? 'STEP 01 • PRE-TEST & AI ROADMAP' : `STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                            </span>
                            <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                {mode === 'pretest' ? 'แบบทดสอบก่อนเรียน (วัดพื้นฐาน 4 หมวด)' : 'แบบทดสอบหลังเรียน (ประเมินรับประกาศนียบัตร)'}
                            </h1>
                            <p className="text-xs text-secondary-adaptive">ตอบแล้ว {answeredCount} / {total} ข้อ</p>
                        </div>
                        <button type="button" onClick={onExit} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1.5">
                            <Icon name="ArrowLeft" size={15} /> ย้อนกลับ
                        </button>
                    </div>

                    {submitted && result ? (
                        <div className="spatial-card rounded-[2rem] p-6 space-y-5 border-aurora-400/40">
                            <div className="text-center space-y-2">
                                <span className={`inline-block px-3 py-1 rounded-full font-mono text-xs font-bold ${result.passed ? 'bg-aurora-500/20 text-accent-adaptive' : 'bg-rose-500/20 text-rose-400'}`}>
                                    {mode === 'pretest' ? 'วิเคราะห์จุดอ่อน AI Roadmap สำเร็จ' : result.passed ? 'ผ่านเกณฑ์รับประกาศนียบัตร ✓' : `ยังไม่ถึงเกณฑ์ ${MIN_POSTTEST_PERCENT}%`}
                                </span>
                                <p className="font-mono text-4xl font-extrabold text-primary-adaptive">{result.score} / {result.total} <span className="text-xl text-accent-adaptive">({result.pct}%)</span></p>
                                <p className="text-xs sm:text-sm text-secondary-adaptive max-w-xl mx-auto">{result.diagnosis.summaryText}</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                {result.diagnosis.domains.map(d => (
                                    <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1.5">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span className="text-primary-adaptive">{d.shortName}</span>
                                            <span className="font-mono" style={{ color: d.color }}>{d.percent}%</span>
                                        </div>
                                        <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                            <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                        </div>
                                        {d.percent < MIN_POSTTEST_PERCENT && (
                                            <p className="text-[11px] text-amber-400 leading-snug">{d.remediationGuide}</p>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-2.5">
                                {!result.passed && mode === 'posttest' && (
                                    <button
                                        type="button"
                                        onClick={() => { setAnswers({}); setSubmitted(false); setResult(null); }}
                                        className="touch-target flex-1 py-3.5 rounded-2xl bg-amber-500 text-void-950 font-display font-extrabold text-sm"
                                    >
                                        ทำแบบทดสอบใหม่อีกครั้ง
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={() => onComplete(result)}
                                    className="touch-target flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm"
                                >
                                    {mode === 'pretest'
                                        ? 'บันทึกผลและเข้าสู่ห้องเรียน →'
                                        : result.passed
                                            ? 'บันทึกผลและไปรับประกาศนียบัตร →'
                                            : 'กลับไปทบทวนบทเรียนตามจุดอ่อน'}
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {questions.map((q, idx) => (
                                <div key={q.id || idx} className="spatial-card rounded-2xl p-4 sm:p-5 space-y-3">
                                    <p className="font-display font-bold text-sm sm:text-base text-primary-adaptive leading-snug">
                                        <span className="font-mono text-accent-adaptive mr-1.5">{idx + 1}.</span>{q.question}
                                    </p>
                                    <div className="space-y-2">
                                        {(q.options || []).map((opt, optIdx) => {
                                            const active = answers[idx] === optIdx;
                                            return (
                                                <button
                                                    key={optIdx}
                                                    type="button"
                                                    onClick={() => setAnswers(p => ({ ...p, [idx]: optIdx }))}
                                                    className={`touch-target w-full text-left px-4 py-2.5 rounded-xl border text-xs sm:text-sm transition-all flex items-center gap-2.5 ${
                                                        active ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'
                                                    }`}
                                                >
                                                    <span className={`w-6 h-6 rounded-full font-mono text-xs font-bold flex items-center justify-center shrink-0 ${active ? 'bg-aurora-400 text-void-950' : 'bg-white/10 text-muted-adaptive'}`}>
                                                        {String.fromCharCode(65 + optIdx)}
                                                    </span>
                                                    <span>{opt}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                            <button
                                type="button"
                                disabled={answeredCount < total}
                                onClick={handleSubmit}
                                className="touch-target w-full py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 font-display font-extrabold text-base shadow-lg"
                            >
                                {answeredCount < total ? `กรุณาตอบให้ครบทุกข้อ (${answeredCount}/${total})` : 'ส่งคำตอบและวิเคราะห์ผลด้วย AI →'}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function ClinicalCaseSimulator() {
            const [caseIdx, setCaseIdx] = useState(0);
            const [stepIdx, setStepIdx] = useState(0);
            const [picked, setPicked] = useState(null);
            const curCase = CLINICAL_CASE_SIMULATIONS[caseIdx];
            if (!curCase) return <div className="spatial-card rounded-2xl p-6 text-center text-sm text-muted-adaptive">ยังไม่มีข้อมูลเคสคลินิกในระบบค่ะ</div>;
            const step = curCase.steps[stepIdx] || curCase.steps[0];
            const vitals = (picked !== null && step.options[picked]?.nextVitals) ? step.options[picked].nextVitals : step.vitals;

            return (
                <div className="space-y-4">
                    <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-1">
                        {CLINICAL_CASE_SIMULATIONS.map((c, i) => (
                            <button
                                key={c.id}
                                type="button"
                                onClick={() => { setCaseIdx(i); setStepIdx(0); setPicked(null); }}
                                className={`shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border ${i === caseIdx ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 border-transparent font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}
                            >
                                {c.title}
                            </button>
                        ))}
                    </div>

                    <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-adaptive">{curCase.badge} • ขั้นที่ {stepIdx + 1}/{curCase.steps.length}</span>
                            <h2 className="font-display font-extrabold text-lg text-primary-adaptive mt-0.5">{curCase.title}</h2>
                            <p className="text-xs text-secondary-adaptive mt-1">{curCase.patientSummary}</p>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            {Object.entries(vitals || {}).map(([k, v]) => (
                                <div key={k} className="spatial-soft p-3 rounded-xl text-center">
                                    <span className="font-mono text-[10px] text-muted-adaptive uppercase block">{k}</span>
                                    <span className="font-mono text-sm font-extrabold text-accent-adaptive">{v}</span>
                                </div>
                            ))}
                        </div>

                        <p className="spatial-soft p-4 rounded-2xl text-sm text-primary-adaptive leading-relaxed font-semibold">{step.situation}</p>

                        <div className="space-y-2.5">
                            {step.options.map((opt, idx) => (
                                <button
                                    key={idx}
                                    type="button"
                                    onClick={() => setPicked(idx)}
                                    className={`touch-target w-full text-left p-3.5 rounded-2xl border text-xs sm:text-sm transition-all ${
                                        picked === idx
                                            ? opt.correct ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'bg-rose-500/20 border-rose-400 text-rose-200 font-bold'
                                            : 'spatial-soft text-secondary-adaptive'
                                    }`}
                                >
                                    {opt.label}
                                </button>
                            ))}
                        </div>

                        {picked !== null && (
                            <div className={`p-4 rounded-2xl border text-xs sm:text-sm space-y-3 ${step.options[picked]?.correct ? 'bg-aurora-500/15 border-aurora-400/45 text-primary-adaptive' : 'bg-rose-500/15 border-rose-400/45 text-rose-200'}`}>
                                <p className="leading-relaxed">{step.options[picked]?.outcome}</p>
                                {stepIdx + 1 < curCase.steps.length && (
                                    <button type="button" onClick={() => { setStepIdx(s => s + 1); setPicked(null); }} className="px-4 py-2 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs">
                                        ไปสถานการณ์ถัดไป →
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SpacedFlashcardsDeck({ aiRoadmap }) {
            const weakIds = useMemo(() => new Set((aiRoadmap?.weakDomains || []).map(d => d.id)), [aiRoadmap]);
            const cards = useMemo(() => [...SPACED_FLASHCARDS].sort((a, b) => (weakIds.has(b.domain) ? 1 : 0) - (weakIds.has(a.domain) ? 1 : 0)), [weakIds]);
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            const [mastered, setMastered] = useState({});

            if (cards.length === 0) return <div className="spatial-card rounded-2xl p-6 text-center text-sm text-muted-adaptive">ยังไม่มีการ์ดทบทวนในระบบค่ะ</div>;
            const card = cards[idx % cards.length];
            const dom = CLINICAL_DOMAINS[card.domain];

            return (
                <div className="max-w-2xl mx-auto space-y-4">
                    <div className="flex items-center justify-between text-xs font-bold">
                        <span className="text-prism-adaptive font-mono">การ์ดที่ {(idx % cards.length) + 1} / {cards.length}</span>
                        <span className="text-accent-adaptive">จำได้แล้ว {Object.values(mastered).filter(Boolean).length} / {cards.length} ใบ</span>
                    </div>

                    <button
                        type="button"
                        onClick={() => setFlipped(f => !f)}
                        className="spatial-card w-full min-h-[250px] rounded-[2rem] p-6 sm:p-8 text-center flex flex-col items-center justify-center gap-3 border-prism-400/35 transition-all active:scale-[0.99]"
                    >
                        <span className="px-3 py-1 rounded-full spatial-soft font-mono text-[10px] font-bold" style={{ color: dom?.color || '#34d399' }}>

        function IndividualCneuLetter({ user, cneuConfig, certTemplate, verifyUrl }) {
            const qrCanvasRef = useRef(null);
            useEffect(() => {
                if (!qrCanvasRef.current || !verifyUrl) return;
                const canvas = qrCanvasRef.current;
                canvas.width = 160;
                canvas.height = 160;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 160, 160);
                if (typeof CERT.drawRealQrOnCanvas === 'function') {
                    CERT.drawRealQrOnCanvas(ctx, verifyUrl, 8, 8, 144, '#0f172a');
                } else if (typeof window.qrcode === 'function') {
                    try {
                        const qr = window.qrcode(0, 'M');
                        qr.addData(String(verifyUrl));
                        qr.make();
                        const count = qr.getModuleCount();
                        const cell = 144 / count;
                        ctx.fillStyle = '#0f172a';
                        for (let r = 0; r < count; r++) {
                            for (let c = 0; c < count; c++) {
                                if (qr.isDark(r, c)) ctx.fillRect(Math.floor(8 + c * cell), Math.floor(8 + r * cell), Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    } catch (_) {}
                }
            }, [verifyUrl]);

            return (
                <article className="cneu-letter-sheet mx-auto rounded-2xl p-6 sm:p-10 space-y-5">
                    <div className="border-b-2 border-slate-800 pb-4 flex items-start justify-between gap-4">
                        <div className="space-y-1">
                            <p className="text-[11px] font-bold text-emerald-800 uppercase tracking-wider">INDIVIDUAL CNEU VERIFICATION CERTIFICATE</p>
                            <h2 className="font-display text-lg sm:text-xl font-extrabold text-slate-900">หนังสือรับรองการสำเร็จการอบรมและหน่วยคะแนน CNEU รายบุคคล</h2>
                            <p className="text-xs font-bold text-slate-700">{cneuConfig.orgName}</p>
                        </div>
                        <div className="text-right shrink-0 border border-slate-300 rounded-lg px-3 py-2 bg-slate-50">
                            <p className="text-[10px] font-bold text-slate-500">รหัสกิจกรรม CNEU</p>
                            <p className="font-mono text-sm font-extrabold text-emerald-800">{cneuConfig.activityCode}</p>
                            <p className="text-xs font-bold text-slate-700">{cneuConfig.cneuCredits} หน่วยคะแนน</p>
                        </div>
                    </div>

                    <div className="text-sm text-slate-800 leading-relaxed space-y-2">
                        <p>หนังสือฉบับนี้ขอรับรองว่า <b>{user?.name || '-'}</b> {user?.nameEN ? `(${user.nameEN})` : ''} เลขที่ใบอนุญาตประกอบวิชาชีพ <b className="font-mono">{user?.license || user?.id || '-'}</b> สังกัด <b>{user?.hospital || '-'}</b> ({user?.department || '-'})</p>
                        <p>ได้สำเร็จการอบรมหลักสูตร <b>{cneuConfig.courseName || certTemplate.courseTitleTH}</b> ({cneuConfig.batchLabel}) ครบถ้วนตามเกณฑ์มาตรฐานของระบบ <b>rjcloud.organ</b> และสมควรได้รับหน่วยคะแนนการศึกษาต่อเนื่องสาขาพยาบาลศาสตร์จำนวน <b>{cneuConfig.cneuCredits} หน่วยคะแนน</b></p>
                    </div>

                    <table className="cneu-evidence-table">
                        <thead>
                            <tr><th>รายการหลักฐานผ่านเกณฑ์</th><th>ผลการประเมิน</th><th>สถานะ</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>1. การสะสมเวลาเรียนบทเรียนออนไลน์ (เกณฑ์ ≥ {MIN_STUDY_PERCENT}%)</td><td className="font-mono text-center">{user?.progress ?? 0}% ({formatStudyTime(user?.studySeconds)})</td><td className="text-center font-bold text-emerald-700">ผ่านเกณฑ์ ✓</td></tr>
                            <tr><td>2. การฝึกปฏิบัติการสื่อสารในห้องจำลอง AI Skill Lab 3 มิติ</td><td className="font-mono text-center">{typeof user?.skillLabBestScore === 'number' ? `${user.skillLabBestScore}/100` : 'ผ่านการฝึก'}</td><td className="text-center font-bold text-emerald-700">ผ่านเกณฑ์ ✓</td></tr>
                            <tr><td>3. แบบทดสอบหลังเรียน Post-test (เกณฑ์ ≥ {MIN_POSTTEST_PERCENT}%)</td><td className="font-mono text-center">{user?.posttest || '-'} ({parsePosttestPercent(user)}%)</td><td className="text-center font-bold text-emerald-700">ผ่านเกณฑ์ ✓</td></tr>
                        </tbody>
                    </table>

                    <div className="pt-4 grid grid-cols-1 sm:grid-cols-2 gap-6 items-end">
                        <div className="flex items-center gap-3">
                            <canvas ref={qrCanvasRef} className="w-24 h-24 border border-slate-300 rounded-lg bg-white shrink-0" />
                            <div className="text-[11px] text-slate-600 space-y-0.5">
                                <p className="font-bold text-slate-900">ตรวจสอบความถูกต้องด้วย QR Code</p>
                                <p className="font-mono text-emerald-800 font-bold">{user?.certificateCode || 'RJC-2027-DEMO01'}</p>
                                <p>ออกหนังสือรับรอง ณ วันที่ {formatThaiDate(user?.certificateIssuedAt)}</p>
                            </div>
                        </div>
                        <div className="text-center text-xs space-y-1">
                            <p className="text-slate-600">ลงชื่อ ...........................................................</p>
                            <p className="font-bold text-slate-900">( {cneuConfig.approverName || certTemplate.signerName} )</p>
                            <p className="text-slate-600">{cneuConfig.approverPosition || certTemplate.signerPosition}</p>
                        </div>
                    </div>
                </article>
            );
        }

        // ============================================================================
        // 4. MAIN LEARNER APPLICATION (INDEX.HTML — PRODUCTION 2027)
        // ============================================================================
        const DEFAULT_AUTH_FORM = {
            license: '', name: '', position: 'พยาบาลวิชาชีพ', workContext: 'ICU / ER / OR',
            department: 'กรมการแพทย์', hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร',
            email: '', phone: '', userType: 'เรียนใหม่', pdpaAccepted: false
        };

        function App() {
            const adminPreviewParam = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') || ''; }
                catch (_) { return ''; }
            }, []);
            const isAdminPreview = Boolean(adminPreviewParam);

            // Adaptive Theme
            const [theme, setTheme] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f4f9fb');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => setTheme(p => (p === 'dark' ? 'light' : 'dark')), []);

            // App State
            const [user, setUser] = useState(() => {
                if (isAdminPreview) {
                    return {
                        id: 'admin_preview_2027', license: '6501234567', name: 'พว.กัญญารัตน์ วัฒนากูล (Preview)',
                        nameEN: 'Kanyarat Wattanakul, RN', position: 'พยาบาลวิชาชีพชำนาญการ',
                        workContext: 'ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)', department: 'กรมการแพทย์',
                        hospital: 'รพ.ราชวิถี', province: 'กรุงเทพมหานคร', email: 'preview@rajavithi.go.th',
                        phone: '0812345678', userType: 'เรียนใหม่', status: 'ผ่าน', progress: 92,
                        studySeconds: 26500, pretest: '30/40', posttest: '38/40', skillLabPassed: true,
                        skillLabBestScore: 94, certificateCode: 'RJC-2027-DEMO01',
                        certificateIssuedAt: '2027-01-12T09:30:00Z', pdpaAccepted: true, lastVideoId: 1
                    };
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (adminPreviewParam === 'landing') return 'landing';
                if (['auth1', 'auth2', 'auth3'].includes(adminPreviewParam)) return 'auth';
                if (adminPreviewParam === 'pretest') return 'pretest';
                if (adminPreviewParam === 'posttest') return 'posttest';
                if (adminPreviewParam === 'cert_confirm') return 'cert_confirm';
                if (adminPreviewParam === 'certificate') return 'certificate';
                if (['dashboard', 'live', 'profile'].includes(adminPreviewParam)) return 'dashboard';
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user?.id) return 'dashboard';
                } catch (_) {}
                return 'landing';
            });

            const [activeTab, setActiveTab] = useState(() => {
                if (adminPreviewParam === 'live') return 'live';
                if (adminPreviewParam === 'profile') return 'profile';
                return 'lessons';
            });

            // Cloud Config & Content
            const [lessons, setLessons] = useState(() => (Array.isArray(window.INITIAL_LESSONS) && window.INITIAL_LESSONS.length > 0 ? window.INITIAL_LESSONS : FALLBACK_LESSONS));
            const [questionSets, setQuestionSets] = useState(() => [parseRawExams(window.QUIZ_QUESTIONS_RAW || FALLBACK_QUIZ_RAW)]);
            const [liveConfig, setLiveConfig] = useState({ status: 'offline', days: 1, hours: 8, allowPosttest: false, topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027', url: '', documentUrl: '' });
            const [certTemplate, setCertTemplate] = useState({ ...DEFAULT_CERT_TEMPLATE });
            const [cneuConfig, setCneuConfig] = useState({ ...DEFAULT_CNEU_CONFIG });
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [isCloudReady, setIsCloudReady] = useState(false);

            // Lesson & Timer States
            const [currentLessonId, setCurrentLessonId] = useState(() => Number(user?.lastVideoId || 1));
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));

            // Auth Wizard 3-Step States
            const [authStep, setAuthStep] = useState(() => (adminPreviewParam === 'auth2' ? 2 : adminPreviewParam === 'auth3' ? 3 : 1));
            const [authBusy, setAuthBusy] = useState(false);
            const [isExistingAccount, setIsExistingAccount] = useState(false);
            const [existingRegisteredEmail, setExistingRegisteredEmail] = useState('');
            const [pdpaAgreed, setPdpaAgreed] = useState(false);
            const [pdpaModalOpen, setPdpaModalOpen] = useState(false);
            const [authForm, setAuthForm] = useState(() => ({ ...DEFAULT_AUTH_FORM }));
            const [generatedOtp, setGeneratedOtp] = useState('');
            const [otpInput, setOtpInput] = useState('');
            const [otpCooldown, setOtpCooldown] = useState(0);

            // Certificate & Evaluation States
            const [certSubView, setCertSubView] = useState('cert'); // cert | cneu
            const [certForm, setCertForm] = useState({ name: '', nameEN: '', hospital: '', comment: '' });
            const [evalCriteria, setEvalCriteria] = useState({ content: 5, speaker: 5, platform: 5, aiLab: 5, application: 5 });

            // Profile PDPA Self-Service & Warm-up States
            const [pdpaEditOpen, setPdpaEditOpen] = useState(false);
            const [pdpaDangerOpen, setPdpaDangerOpen] = useState(false);
            const [pdpaForm, setPdpaForm] = useState({ name: '', position: '', department: '', hospital: '', province: '', email: '', phone: '' });
            const [warmupTags, setWarmupTags] = useState({ age: 'วัยทำงาน (20–45 ปี)', cause: 'อุบัติเหตุทางศีรษะ (TBI)', mood: 'สับสนเรื่องเครื่องช่วยหายใจ', concern: 'กลัวร่างไม่เรียบร้อย' });
            const [warmupResult, setWarmupResult] = useState('');

            // UI Feedback
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);
            const currentLessonIdRef = useRef(currentLessonId);
            const certCanvasRef = useRef(null);
            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);
            useEffect(() => { currentLessonIdRef.current = currentLessonId; }, [currentLessonId]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // OTP Resend Cooldown
            useEffect(() => {
                if (otpCooldown <= 0) return;
                const t = setTimeout(() => setOtpCooldown(c => c - 1), 1000);
                return () => clearTimeout(t);
            }, [otpCooldown]);

            // Save User Progress (รองรับ partialOnly เพื่อไม่ทับข้อมูลที่แอดมินแก้บน Cloud)
            const saveUserProgress = useCallback(async (patch, options = {}) => {
                const cur = userRef.current;
                if (!cur) return null;
                const merged = { ...cur, ...patch };
                userRef.current = merged;
                setUser(merged);

                if (isAdminPreview || String(merged.id || '').startsWith('admin_preview_')) return merged;

                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                } catch (_) {}

                if (fbDb && merged.id) {
                    try {
                        const payloadToCloud = options.partialOnly ? patch : merged;
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(merged.id)), payloadToCloud, { merge: true });
                        if (options.syncTelemetry) {
                            const anonId = buildAnonTelemetryId(merged.id);
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId),
                                buildExecutiveTelemetryPayload(merged),
                                { merge: true }
                            );
                        }
                    } catch (err) {
                        console.warn('Firestore save warning:', err);
                    }
                }
                return merged;
            }, [isAdminPreview]);

            // Firebase Auth + Settings + Content Subscriptions
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let anonTried = false;
                let unsubSettings = null;
                let unsubContent = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) return;
                        if (!anonTried) {
                            anonTried = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') await fbAuth.authStateReady();
                                if (active && !fbAuth.currentUser) await signInAnonymously(fbAuth);
                            } catch (err) {
                                console.warn('Anonymous auth warning:', err);
                            }
                        }
                        return;
                    }
                    setIsCloudReady(true);

                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.liveConfig) setLiveConfig(p => ({ ...p, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(p => ({ ...p, ...d.certTemplate }));
                            if (d.cneuConfig) setCneuConfig(p => ({ ...p, ...d.cneuConfig }));
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                        },
                        () => {}
                    );

                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                };
            }, [isAdminPreview]);

            // ซิงค์ข้อมูลผู้เรียนสดจาก Cloud Firestore (ไม่ทับข้อมูลที่แอดมินปรับแก้)
            useEffect(() => {
                if (!isCloudReady || !fbDb || isAdminPreview || !user?.id || String(user.id).startsWith('admin_preview_')) return;
                const unsubUser = onSnapshot(
                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id)),
                    (snap) => {
                        if (!snap.exists()) return;
                        const cloud = snap.data();
                        const cur = userRef.current || {};
                        const bestSeconds = Math.max(Number(cur.studySeconds || 0), Number(cloud.studySeconds || 0));
                        const bestProgress = Math.max(Number(cur.progress || 0), Number(cloud.progress || 0));
                        const merged = { ...cur, ...cloud, id: String(user.id), studySeconds: bestSeconds, progress: bestProgress };
                        userRef.current = merged;
                        setUser(merged);
                        if (bestSeconds > Number(studySecondsRef.current || 0)) {
                            studySecondsRef.current = bestSeconds;
                            setStudySeconds(bestSeconds);
                        }
                        try {
                            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                            localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                        } catch (_) {}
                    },
                    () => {}
                );
                return () => unsubUser();
            }, [isCloudReady, isAdminPreview, user?.id]);

            // คำนวณเกณฑ์ความคืบหน้า 5 ขั้นตอนแบบ Real-time
            const targetHours = useMemo(() => getTargetHoursForUser(user, liveConfig), [user, liveConfig]);
            const targetSeconds = Math.max(60, targetHours * 3600);
            const liveStudyPercent = useMemo(
                () => Math.max(Number(user?.progress || 0), Math.min(100, Math.round((Number(studySeconds || 0) / targetSeconds) * 100))),
                [user?.progress, studySeconds, targetSeconds]
            );
            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyHoursMet = liveStudyPercent >= MIN_STUDY_PERCENT;
            const isSkillLabDone = Boolean(user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0));
            const isPosttestUnlocked = Boolean(isAdminPreview || liveConfig.allowPosttest || (hasDonePretest && isStudyHoursMet && isSkillLabDone));
            const isPosttestPassed = Boolean(user?.status === 'ผ่าน' || parsePosttestPercent(user) >= MIN_POSTTEST_PERCENT);

            // นาฬิกาจับเวลาเรียนอัตโนมัติ (แยก Side-Effect ออกจาก setState updater เพื่อความถูกต้องตาม React 18)
            useEffect(() => {
                if (screen !== 'dashboard' || !user || isAdminPreview) return;
                if (!['lessons', 'live', 'clinical_cases', 'flashcards'].includes(activeTab)) return;

                let tickCount = 0;
                const timer = setInterval(() => {
                    const nextSec = Number(studySecondsRef.current || 0) + 1;
                    studySecondsRef.current = nextSec;
                    setStudySeconds(nextSec);
                    tickCount += 1;
                    if (tickCount % 20 === 0) {
                        const nextPct = Math.max(
                            Number(userRef.current?.progress || 0),
                            Math.min(100, Math.round((nextSec / Math.max(1, targetSeconds)) * 100))
                        );
                        saveUserProgress(
                            { studySeconds: nextSec, progress: nextPct, lastVideoId: Number(currentLessonIdRef.current || 1) },
                            { partialOnly: true }
                        );
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [screen, activeTab, user?.id, isAdminPreview, targetSeconds, saveUserProgress]);

            // เชื่อมต่อ Bridge กับไฟล์เสริม ai-interactive.js ครบทุกฟิลด์
            useEffect(() => {
                if (window.RJCLOUD_AI_INTERACTIVE && typeof window.RJCLOUD_AI_INTERACTIVE.registerBridge === 'function') {
                    window.RJCLOUD_AI_INTERACTIVE.registerBridge({
                        screen,
                        activeTab,
                        user,
                        lessons,
                        currentLessonId,
                        studySeconds,
                        liveStudyPercent,
                        targetSeconds,
                        hasDonePretest,
                        isAdminPreview,
                        appsScriptUrl,
                        setActiveTab: (t) => setActiveTab(t),
                        selectLesson: (lid) => {
                            setCurrentLessonId(Number(lid));
                            saveUserProgress({ lastVideoId: Number(lid) }, { partialOnly: true });
                        },
                        toggleTheme,
                        toast: showToast
                    });
                }
            }, [screen, activeTab, user, lessons, currentLessonId, studySeconds, liveStudyPercent, targetSeconds, hasDonePretest, isAdminPreview, appsScriptUrl, toggleTheme, showToast, saveUserProgress]);

            // เตรียมฟอร์มยืนยันใบประกาศฯ เมื่อเข้าหน้า cert_confirm
            useEffect(() => {
                if (screen === 'cert_confirm' && user) {
                    setCertForm({
                        name: user.name || '',
                        nameEN: user.nameEN || '',
                        hospital: user.hospital || '',
                        comment: user.satisfactionComment || ''
                    });
                }
            }, [screen, user]);

            // วาดใบประกาศนียบัตรลง Canvas เมื่อเข้าหน้า certificate (พร้อม Fallback กรณีพรีวิวไฟล์เดี่ยวไม่มี cert-engine.js)
            const verifyUrl = useMemo(() => {
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-DEMO01`;
                return typeof CERT.buildVerifyUrl === 'function'
                    ? CERT.buildVerifyUrl(code, certTemplate.certPrefix)
                    : `https://learn.coerj.com/verify.html?code=${encodeURIComponent(code)}`;
            }, [user?.certificateCode, certTemplate.certPrefix]);

            useEffect(() => {
                if (screen !== 'certificate' || certSubView !== 'cert' || !certCanvasRef.current || !user) return;
                if (typeof CERT.drawMinimalistCertificate === 'function') {
                    CERT.drawMinimalistCertificate(certCanvasRef.current, certTemplate, user, verifyUrl);
                    return;
                }
                // Built-in Fallback Canvas Renderer สำหรับโหมดพรีวิวไฟล์เดี่ยว
                const canvas = certCanvasRef.current;
                const W = 1200, H = 848;
                canvas.width = W;
                canvas.height = H;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = '#c5a059';
                ctx.lineWidth = 3;
                ctx.strokeRect(32, 32, W - 64, H - 64);
                ctx.strokeStyle = 'rgba(197, 160, 89, 0.45)';
                ctx.lineWidth = 1;
                ctx.strokeRect(46, 46, W - 92, H - 92);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#1d1d1f';
                ctx.font = '600 18px "Prompt", sans-serif';
                ctx.fillText(certTemplate.orgTitleTH || '', W / 2, 120, W - 160);
                ctx.fillStyle = '#a8843b';
                ctx.font = '700 13px "JetBrains Mono", monospace';
                ctx.fillText('CERTIFICATE OF COMPLETION', W / 2, 170);
                ctx.fillStyle = '#1d1d1f';
                ctx.font = '700 44px "Prompt", sans-serif';
                ctx.fillText('ประกาศนียบัตร', W / 2, 228);
                ctx.font = '700 40px "Prompt", sans-serif';
                ctx.fillText(user.name || 'ผู้สำเร็จการอบรม', W / 2, 330, W - 160);
                ctx.fillStyle = '#475569';
                ctx.font = '500 19px "Sarabun", sans-serif';
                ctx.fillText([user.hospital || '', user.license ? `เลขที่ใบอนุญาต ${user.license}` : ''].filter(Boolean).join(' • '), W / 2, 378, W - 160);
                ctx.fillStyle = '#0f172a';
                ctx.font = '700 22px "Prompt", sans-serif';
                ctx.fillText(certTemplate.courseTitleTH || '', W / 2, 460, W - 180);
                ctx.fillStyle = '#64748b';
                ctx.font = '500 16px "Sarabun", sans-serif';
                ctx.fillText(`ให้ไว้ ณ วันที่ ${formatThaiDate(user.certificateIssuedAt)}`, W / 2, 505);
                ctx.fillStyle = '#1d1d1f';
                ctx.font = '600 18px "Prompt", sans-serif';
                ctx.fillText(certTemplate.signerName || '', W / 2, H - 115);
                ctx.textAlign = 'left';
                ctx.fillStyle = '#0f172a';
                ctx.font = '700 15px "JetBrains Mono", monospace';
                ctx.fillText(user.certificateCode || 'RJC-2027-DEMO01', 78, H - 96);
                if (typeof window.qrcode === 'function') {
                    try {
                        const qr = window.qrcode(0, 'M');
                        qr.addData(String(verifyUrl));
                        qr.make();
                        const count = qr.getModuleCount();
                        const qSize = 110, qx = W - 78 - qSize, qy = H - 78 - qSize, cell = qSize / count;
                        ctx.fillStyle = '#1d1d1f';
                        for (let r = 0; r < count; r++) {
                            for (let c = 0; c < count; c++) {
                                if (qr.isDark(r, c)) ctx.fillRect(Math.floor(qx + c * cell), Math.floor(qy + r * cell), Math.ceil(cell), Math.ceil(cell));
                            }
                        }
                    } catch (_) {}
                }
            }, [screen, certSubView, certTemplate, user, verifyUrl]);

            // ============================================================================
            // 5. AUTH WIZARD HANDLERS (STEP 1 -> STEP 2 PDPA -> STEP 3 EMAIL OTP)
            // ============================================================================
            const handleCheckLicense = async (e) => {
                e.preventDefault();
                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                if (cleanLic.length < 4) {
                    showToast('กรุณากรอกเลขที่ใบประกอบวิชาชีพให้ถูกต้องค่ะ', 'error');
                    return;
                }
                setAuthBusy(true);
                setGeneratedOtp('');
                setOtpInput('');

                let found = null;
                if (fbDb) {
                    try {
                        const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', cleanLic));
                        if (snap.exists()) found = { id: snap.id, ...snap.data() };
                    } catch (_) {}
                }
                if (!found) {
                    try {
                        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                        if (raw?.user && String(raw.user.license || raw.user.id) === cleanLic) found = raw.user;
                    } catch (_) {}
                }

                if (found) {
                    const regEmail = String(found.email || '').trim();
                    const hasRegEmail = Boolean(regEmail && regEmail.includes('@'));
                    const isContinuing = found.userType === 'เรียนต่อเนื่อง' || Boolean(found.pdpaAccepted);
                    setIsExistingAccount(true);
                    setExistingRegisteredEmail(hasRegEmail ? regEmail : '');
                    // บัญชีเดิมที่เคยลงทะเบียนไว้แล้ว ไม่ต้องติ๊ก PDPA ซ้ำ
                    setPdpaAgreed(true);
                    setAuthForm({
                        ...DEFAULT_AUTH_FORM,
                        ...found,
                        license: cleanLic,
                        workContext: found.workContext || 'ICU / ER / OR',
                        userType: found.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                        pdpaAccepted: true
                    });
                    showToast(
                        isContinuing
                            ? 'พบประวัติเรียนต่อเนื่องในระบบ ปกปิดข้อมูลติดต่อตามหลัก PDPA แล้วค่ะ'
                            : 'พบประวัติเดิมในระบบ ปกปิดข้อมูลติดต่อตามหลัก PDPA แล้วค่ะ',
                        'info'
                    );
                } else {
                    // รีเซ็ตฟอร์มสะอาดทั้งอ็อบเจกต์ ป้องกันข้อมูลรั่วข้ามบัญชีเมื่อกดย้อนกลับ
                    setIsExistingAccount(false);
                    setExistingRegisteredEmail('');
                    setPdpaAgreed(false);
                    setAuthForm({ ...DEFAULT_AUTH_FORM, license: cleanLic });
                }
                setAuthBusy(false);
                setAuthStep(2);
            };

            // ผู้เรียนใหม่ที่ยังไม่เคยลงทะเบียนหรือยังไม่เคยยินยอม PDPA ต้องติ๊กยินยอม 1 ครั้งเสมอ
            const needsPdpaCheckbox = !(isExistingAccount || authForm.pdpaAccepted);

            const handleRequestOtp = async (e) => {
                if (e) e.preventDefault();
                if (!authForm.name.trim()) { showToast('กรุณากรอกชื่อ–นามสกุลค่ะ', 'error'); return; }

                // บังคับส่ง OTP ไปยังอีเมลที่ลงทะเบียนไว้เดิมเท่านั้นสำหรับบัญชีเก่า (ป้องกันการยึดบัญชีและเผยอีเมลก่อน OTP)
                const targetEmail = (isExistingAccount && existingRegisteredEmail)
                    ? existingRegisteredEmail
                    : String(authForm.email || '').trim();

                if (!targetEmail || !targetEmail.includes('@')) {
                    showToast('กรุณากรอกอีเมลที่ถูกต้องสำหรับรับรหัส OTP 6 หลักค่ะ', 'error');
                    return;
                }
                if (needsPdpaCheckbox && !pdpaAgreed) {
                    showToast('กรุณาติ๊กยินยอมนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ก่อนดำเนินการต่อค่ะ', 'error');
                    return;
                }

                const code = String(Math.floor(100000 + Math.random() * 900000));
                setAuthBusy(true);
                setOtpInput('');
                const mailRes = await sendOtpViaEmail(appsScriptUrl, targetEmail, code, authForm.name, authForm.license);
                setAuthBusy(false);

                if (!mailRes.ok) {
                    showToast(`ส่งรหัส OTP ทางอีเมลไม่สำเร็จ: ${mailRes.reason}`, 'error');
                    return;
                }

                setGeneratedOtp(code);
                setOtpCooldown(45);
                setAuthStep(3);
                showToast(`ส่งรหัส OTP 6 หลักไปยัง ${maskEmail(targetEmail)} เรียบร้อยแล้วค่ะ (ตรวจสอบในกล่องจดหมายหรือ Spam)`);
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                const entered = otpInput.trim().replace(/[^0-9]/g, '');
                if (!generatedOtp || entered !== generatedOtp) {
                    showToast('รหัส OTP 6 หลักไม่ถูกต้อง กรุณาตรวจสอบในอีเมลอีกครั้งค่ะ', 'error');
                    return;
                }

                const cleanLic = authForm.license.trim().replace(/[^a-zA-Z0-9]/g, '');
                const nowIso = new Date().toISOString();
                const finalUser = {
                    ...authForm,
                    id: cleanLic,
                    license: cleanLic,
                    userType: authForm.userType === 'เรียนต่อเนื่อง' ? 'เรียนต่อเนื่อง' : 'เรียนใหม่',
                    status: authForm.status || 'กำลังเรียน',
                    progress: Number(authForm.progress || 0),
                    studySeconds: Number(authForm.studySeconds || 0),
                    pretest: authForm.pretest || '-',
                    posttest: authForm.posttest || '-',
                    lastVideoId: Number(authForm.lastVideoId || 1),
                    pdpaAccepted: true,
                    pdpaAcceptedAt: authForm.pdpaAcceptedAt || nowIso,
                    lastLoginAt: nowIso
                };

                userRef.current = finalUser;
                setUser(finalUser);
                setStudySeconds(finalUser.studySeconds);
                setCurrentLessonId(finalUser.lastVideoId);
                setGeneratedOtp('');
                setOtpInput('');

                await saveUserProgress(finalUser, { syncTelemetry: true });
                showToast(`ยืนยันตัวตนสำเร็จ ยินดีต้อนรับคุณ${finalUser.name} ค่ะ`);
                setScreen(finalUser.pretest && finalUser.pretest !== '-' ? 'dashboard' : 'pretest');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // ============================================================================
            // 6. QUIZ, LIVE CHECK-IN, PDPA SELF-SERVICE & CERTIFICATE HANDLERS
            // ============================================================================
            const handlePretestComplete = async (res) => {
                await saveUserProgress({ pretest: `${res.score}/${res.total}`, aiRoadmap: res.diagnosis }, { syncTelemetry: true });
                showToast('บันทึกผล Pre-test และสร้างแผนการเรียน AI Roadmap เรียบร้อยค่ะ');
                setScreen('dashboard');
                setActiveTab('lessons');
            };

            const handlePosttestComplete = async (res) => {
                const patch = { posttest: `${res.score}/${res.total}`, aiRoadmap: res.diagnosis };
                if (res.passed) patch.status = 'ผ่าน';
                await saveUserProgress(patch, { syncTelemetry: true });
                if (res.passed) {
                    showToast('ยินดีด้วยค่ะ! สอบผ่าน Post-test แล้ว ไปยืนยันออกใบประกาศนียบัตรกันค่ะ 🎉');
                    setScreen('cert_confirm');
                } else {
                    showToast('บันทึกผลทบทวนแล้ว แนะนำดูบทเรียนที่ติดดาว ★ แล้วสอบใหม่ได้ตลอดเวลาค่ะ', 'info');
                    setScreen('dashboard');
                    setActiveTab('lessons');
                }
            };

            const handleLiveCheckIn = async () => {
                const nowIso = new Date().toISOString();
                await saveUserProgress({ liveCheckInAt: nowIso, liveAttendedTopic: liveConfig.topic || 'Live สด' }, { partialOnly: true });
                showToast('เช็คอินยืนยันเข้าเรียน Live สดเรียบร้อยแล้วค่ะ ✓');
            };

            const handleOpenPdpaEdit = () => {
                if (!user) return;
                setPdpaForm({
                    name: user.name || '', position: user.position || '', department: user.department || '',
                    hospital: user.hospital || '', province: user.province || '', email: user.email || '', phone: user.phone || ''
                });
                setPdpaEditOpen(true);
            };

            const handleSavePdpaEdit = async (e) => {
                e.preventDefault();
                if (!pdpaForm.name.trim()) { showToast('กรุณากรอกชื่อ–นามสกุลค่ะ', 'error'); return; }
                await saveUserProgress({
                    name: pdpaForm.name.trim(),
                    position: pdpaForm.position.trim(),
                    department: pdpaForm.department.trim(),
                    hospital: pdpaForm.hospital.trim(),
                    province: pdpaForm.province.trim(),
                    email: pdpaForm.email.trim(),
                    phone: pdpaForm.phone.trim(),
                    updatedAt: new Date().toISOString()
                }, { partialOnly: true, syncTelemetry: true });
                setPdpaEditOpen(false);
                showToast('อัปเดตข้อมูลส่วนบุคคลของคุณเรียบร้อยแล้วค่ะ');
            };

            const handleDeletePersonalData = () => {
                if (!user) return;
                setConfirmDialog({
                    open: true,
                    danger: true,
                    title: 'ยืนยันการลบข้อมูลส่วนบุคคล (สิทธิ PDPA)',
                    message: 'ระบบจะลบข้อมูลส่วนบุคคลและประวัติการเรียนของคุณออกจากฐานข้อมูล Cloud และล้างข้อมูลในอุปกรณ์นี้ถาวร ยืนยันหรือไม่?',
                    confirmText: 'ลบข้อมูลถาวร',
                    onConfirm: async () => {
                        const uid = user.id || user.license;
                        if (fbDb && uid && !isAdminPreview && !String(uid).startsWith('admin_preview_')) {
                            try { await deleteDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(uid))); }
                            catch (err) { console.warn('Delete user cloud warning:', err); }
                        }
                        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                        userRef.current = null;
                        setUser(null);
                        setPdpaEditOpen(false);
                        setPdpaDangerOpen(false);
                        setScreen('landing');
                        showToast('ลบข้อมูลส่วนบุคคลของคุณออกจากระบบเรียบร้อยแล้วค่ะ', 'info');
                    }
                });
            };

            const handleLogout = () => {
                setConfirmDialog({
                    open: true,
                    danger: false,
                    title: 'ออกจากระบบผู้เรียน',
                    message: 'ข้อมูลความคืบหน้าการเรียนของคุณถูกบันทึกไว้บน Cloud แล้ว ต้องการออกจากระบบใช่หรือไม่?',
                    confirmText: 'ออกจากระบบ',
                    onConfirm: () => {
                        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                        userRef.current = null;
                        setUser(null);
                        setPdpaEditOpen(false);
                        setPdpaDangerOpen(false);
                        setAuthStep(1);
                        setScreen('landing');
                        showToast('ออกจากระบบเรียบร้อยแล้วค่ะ', 'info');
                    }
                });
            };

            const handleGenerateWarmup = () => {
                const { age, cause, mood, concern } = warmupTags;
                setWarmupResult(
                    `1. ประโยคเปิดในพื้นที่ส่วนตัว (${age} • ${cause}):\n“สวัสดีค่ะ ดิฉันเป็นพยาบาลผู้ประสานงานดูแลครอบครัวค่ะ ขอแสดงความเสียใจอย่างสุดซึ้งกับเหตุการณ์ที่เกิดขึ้นนะคะ ขอบคุณที่มานั่งคุยกันในที่เงียบๆ นี้ค่ะ”\n\n` +
                    `2. แนวทางรับมืออารมณ์ (${mood}):\nรับฟังและเว้นจังหวะเงียบ 2.5 วินาทีก่อนอธิบายความจริงทางการแพทย์อย่างนุ่มนวลโดยไม่โต้แย้ง\n\n` +
                    `3. แนวทางคลายความกังวล (${concern}):\nยืนยันความโปร่งใสของศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC) ไม่มีค่าใช้จ่ายกับครอบครัว และรับรองการดูแลตกแต่งร่างอย่างประณีตสมเกียรติที่สุด โดยไม่เร่งรัดการตัดสินใจค่ะ\n\n(เครื่องมือทบทวนเพื่อการเรียนรู้เท่านั้น ไม่ใช่คำสั่งการรักษาแทนแพทย์)`
                );
            };

            const handleIssueCertificate = async (e) => {
                e.preventDefault();
                if (!certForm.name.trim() || !certForm.hospital.trim()) {
                    showToast('กรุณากรอกชื่อ–นามสกุล และโรงพยาบาลให้ครบค่ะ', 'error');
                    return;
                }
                const vals = Object.values(evalCriteria);
                const avgCsat = Number((vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2));
                const issuedAt = user?.certificateIssuedAt || new Date().toISOString();
                const randomSuffix = Math.random().toString(36).slice(2, 8).toUpperCase();
                const code = user?.certificateCode || `${certTemplate.certPrefix || 'RJC-2027'}-${randomSuffix}`;

                const updated = await saveUserProgress({
                    name: certForm.name.trim(),
                    nameEN: certForm.nameEN.trim(),
                    hospital: certForm.hospital.trim(),
                    status: 'ผ่าน',
                    certificateClaimed: true,
                    certificateCode: code,
                    certificateIssuedAt: issuedAt,
                    satisfactionScore: avgCsat,
                    satisfactionCriteria: evalCriteria,
                    satisfactionComment: certForm.comment.trim(),
                    cneuActivityCode: cneuConfig.activityCode || '',
                    cneuCredits: cneuConfig.cneuCredits || ''
                }, { syncTelemetry: true });

                const publicCert = typeof CERT.buildPublicCertPayload === 'function'
                    ? CERT.buildPublicCertPayload({
                        code, finalName: certForm.name.trim(), nameEN: certForm.nameEN.trim(),
                        finalHospital: certForm.hospital.trim(), license: updated?.license || updated?.id,
                        user: updated, certTemplate, cneuConfig, issuedAt
                    })
                    : { code, name: certForm.name.trim(), license: updated?.license || '', hospital: certForm.hospital.trim(), issuedAt, status: 'valid' };

                try {
                    const localMap = JSON.parse(localStorage.getItem('rjcloud_local_certificates') || '{}');
                    localMap[code] = publicCert;
                    localStorage.setItem('rjcloud_local_certificates', JSON.stringify(localMap));
                } catch (_) {}

                if (fbDb && !isAdminPreview) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'certificates', code), publicCert, { merge: true });
                    } catch (err) { console.warn('Cert registry write warning:', err); }
                }

                showToast('ออกประกาศนียบัตรและหนังสือรับรอง CNEU เรียบร้อยแล้วค่ะ 🎉');
                setCertSubView('cert');
                setScreen('certificate');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const activeLesson = useMemo(() => lessons.find(l => Number(l.id) === Number(currentLessonId)) || lessons[0], [lessons, currentLessonId]);
            const recommendedLessonIds = useMemo(() => new Set(user?.aiRoadmap?.recommendedLessonIds || []), [user?.aiRoadmap]);
            const activeQuizQuestions = useMemo(() => (Array.isArray(questionSets[0]) && questionSets[0].length > 0 ? questionSets[0] : parseRawExams(FALLBACK_QUIZ_RAW)), [questionSets]);
            const avgCsatPreview = useMemo(() => {
                const v = Object.values(evalCriteria);
                return (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2);
            }, [evalCriteria]);
