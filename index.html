                setScreen('certificate');
                showToast('ออกประกาศนียบัตรอิเล็กทรอนิกส์พร้อม QR Code เรียบร้อยแล้วค่ะ 🎉');
            };

            const handleDownloadCertPNG = () => {
                if (!certCanvasRef.current) return;
                const link = document.createElement('a');
                link.download = `Certificate_${user?.certificateCode || 'rjcloud'}.png`;
                link.href = certCanvasRef.current.toDataURL('image/png', 1.0);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('ดาวน์โหลดไฟล์ประกาศนียบัตร PNG ความละเอียดสูงแล้วค่ะ');
            };

            const handleDownloadCertPDF = () => {
                if (!certCanvasRef.current) return;
                const jsPDFClass = window.jspdf?.jsPDF;
                if (!jsPDFClass) {
                    showToast('ไม่พบไลบรารี PDF กำลังดาวน์โหลดเป็น PNG แทนค่ะ', 'info');
                    handleDownloadCertPNG();
                    return;
                }
                const pdf = new jsPDFClass({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                const imgData = certCanvasRef.current.toDataURL('image/png', 1.0);
                pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
                pdf.save(`Certificate_${user?.certificateCode || 'rjcloud'}.pdf`);
                showToast('ดาวน์โหลดไฟล์ประกาศนียบัตร PDF (A4 แนวนอน) เรียบร้อยแล้วค่ะ');
            };

            const handleLogout = () => {
                setConfirmDialog({
                    open: true,
                    title: 'ออกจากระบบผู้เรียน?',
                    message: 'ระบบจะบันทึกความคืบหน้าและชั่วโมงเรียนล่าสุดของคุณไว้บน Cloud เรียบร้อยก่อนออกจากระบบค่ะ',
                    confirmText: 'ออกจากระบบ',
                    onConfirm: async () => {
                        await saveUserProgress({ lastVideoId: currentLessonId });
                        localStorage.removeItem(STORAGE_KEY);
                        setUser(null);
                        setScreen('landing');
                        showToast('ออกจากระบบเรียบร้อยแล้วค่ะ');
                    }
                });
            };

            // AI Growth Narrative Text for Portfolio
            const growthNarrativeText = useMemo(() => {
                if (!user) return '';
                const bestLab = typeof user.skillLabBestScore === 'number' ? `${user.skillLabBestScore}/100` : (hasPassedSkillLab ? 'ผ่านการฝึกแล้ว' : 'รอเข้าฝึก');
                return `รายงานสรุปพัฒนาการสมรรถนะวิชาชีพ (rjcloud.organ 2027)
ชื่อ-สกุล: ${user.name} (${user.position || 'บุคลากรทางการแพทย์'})
หน่วยงาน: ${user.hospital || '-'} • สังกัด: ${user.department || '-'}
1. ผลประเมินความรู้ก่อนเรียน (Pre-test): ${user.pretest || '-'}
2. การเรียนรู้ตามแผน AI เฉพาะบุคคล (${roleProfile.badgeTH}): สะสมเวลาเรียนแล้ว ${liveStudyPercent}% (${formatStudyTime(studySeconds)})
3. สมรรถนะการสื่อสารกับญาติ 3 มิติ (AI Skill Lab): ดัชนี Empathy ${bestLab}
4. ผลประเมินความรู้หลังเรียน (Post-test): ${user.posttest || '-'} (${hasPassedPosttest ? 'ผ่านเกณฑ์มาตรฐาน ≥ 80%' : 'กำลังพัฒนา'})
${user.certificateCode ? `5. รหัสประกาศนียบัตรรับรองคุณวุฒิ: ${user.certificateCode}` : ''}`.trim();
            }, [user, roleProfile, liveStudyPercent, studySeconds, hasPassedSkillLab, hasPassedPosttest]);

            // ============================================================================
            // 6. RENDER VIEWS
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* ==================== SCREEN 1: LANDING (PRODUCTION 2027) ==================== */}
                    {screen === 'landing' && (
                        <div className="relative z-10 flex-1 flex flex-col">
                            {/* Top Minimal Header */}
                            <header className="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-lg shadow-aurora-500/25 shrink-0">
                                        <Icon name="HeartHandshake" size={20} />
                                    </div>
                                    <div className="min-w-0">
                                        <span className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive block leading-none truncate">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="text-[10px] font-mono text-muted-adaptive">Clinical Organ Donation Platform</span>
                                    </div>
                                </div>

                                <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                    <a href="./verify.html" className="spatial-soft px-3 py-2 rounded-xl text-primary-adaptive font-bold text-xs inline-flex items-center gap-1.5">
                                        <Icon name="QrCode" size={14} className="text-accent-adaptive" />
                                        <span className="hidden sm:inline">ตรวจประกาศฯ</span>
                                    </a>
                                    <a href="./executive.html" className="spatial-soft px-3 py-2 rounded-xl text-primary-adaptive font-bold text-xs inline-flex items-center gap-1.5">
                                        <Icon name="BarChart3" size={14} className="text-prism-adaptive" />
                                        <span className="hidden sm:inline">ผู้บริหาร</span>
                                    </a>
                                </div>
                            </header>

                            {/* Hero Centerpiece */}
                            <main className="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10 flex flex-col items-center justify-center text-center gap-7">
                                {/* Hero Image in Clean White Rounded Card */}
                                <div className="w-full max-w-lg sm:max-w-xl mx-auto">
                                    <div className="bg-white rounded-[2rem] p-5 sm:p-8 shadow-[0_22px_55px_-16px_rgba(15,23,42,0.18)] border border-slate-200/80">
                                        <img
                                            src={HERO_BANNER_URL}
                                            alt="Rajavithi Hospital — COE Organ Transplantation Cloud"
                                            onError={(e) => {
                                                e.currentTarget.onerror = null;
                                                e.currentTarget.src = 'https://placehold.co/800x460/ffffff/0f172a?text=RAJAVITHI+HOSPITAL+COE+ORGAN';
                                            }}
                                            className="w-full h-auto max-h-[260px] sm:max-h-[300px] object-contain mx-auto block rounded-2xl"
                                        />
                                    </div>
                                </div>

                                <div className="space-y-3.5 max-w-3xl mx-auto">
                                    <h1 className="font-display text-2xl sm:text-4xl md:text-5xl font-extrabold text-primary-adaptive leading-tight">
                                        ยกระดับทักษะการรับบริจาคและปลูกถ่ายอวัยวะ{' '}
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-aurora-400 via-prism-400 to-indigo-400">
                                            สู่มาตรฐานปี 2027
                                        </span>
                                    </h1>
                                    <p className="text-xs sm:text-base text-secondary-adaptive max-w-2xl mx-auto leading-relaxed">
                                        ผสาน <b className="text-primary-adaptive">AI Study Companion</b> วิเคราะห์จุดอ่อนและช่วยทบทวนตลอด 20 บทเรียน, ฝึกสื่อสารกับญาติใน{' '}
                                        <b className="text-accent-adaptive">AI Skill Lab 3 มิติ</b> และออกประกาศนียบัตรพร้อม QR Code ทันทีเมื่อผ่านเกณฑ์
                                    </p>

                                    <div className="pt-2 flex flex-wrap items-center justify-center gap-3">
                                        {user && !isAdminPreview ? (
                                            <button
                                                type="button"
                                                onClick={() => setScreen('dashboard')}
                                                className="touch-target px-8 py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-sm sm:text-base shadow-xl shadow-aurora-500/25 inline-flex items-center gap-2 transition-all active:scale-[0.98]"
                                            >
                                                เข้าห้องเรียนต่อ ({user.name}) <Icon name="ArrowRight" size={18} />
                                            </button>
                                        ) : (
                                            <button
                                                type="button"
                                                onClick={() => { setAuthStep(1); setScreen('auth'); }}
                                                className="touch-target px-8 py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-sm sm:text-base shadow-xl shadow-aurora-500/25 inline-flex items-center gap-2 transition-all active:scale-[0.98]"
                                            >
                                                เข้าสู่ระบบ / ลงทะเบียนเรียน <Icon name="ArrowRight" size={18} />
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* 5-Step AI-Guided Pathway */}
                                <SpatialCard className="w-full p-4 sm:p-6 space-y-4">
                                    <p className="font-mono text-[11px] font-bold text-prism-adaptive uppercase tracking-wider">
                                        5-STEP AI-GUIDED PATHWAY สู่ประกาศนียบัตรอิเล็กทรอนิกส์
                                    </p>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5 sm:gap-3">
                                        {[
                                            { n: 'STEP 01', icon: 'ClipboardCheck', title: 'Pre-test + AI Map', desc: 'วิเคราะห์จุดอ่อน 4 หมวดจัดแผนเรียนเฉพาะคุณ' },
                                            { n: 'STEP 02', icon: 'MonitorPlay', title: 'เรียน ≥ 80% + AI', desc: '20 บทพร้อม AI สรุป 1 นาที & ถาม-ตอบสด' },
                                            { n: 'STEP 03', icon: 'Bot', title: 'AI Skill Lab 3D', desc: 'ฝึกสื่อสารกับญาติ 3 มิติ จับความเงียบ 2.5 วิ' },
                                            { n: 'STEP 04', icon: 'FileCheck2', title: 'Post-test ≥ 80%', desc: 'สอบหลังเรียนพร้อม AI ช่วยทบทวนจุดพลาด' },
                                            { n: 'STEP 05', icon: 'Award', title: 'ประกาศนียบัตร', desc: 'รับ PDF / PNG พร้อม QR ยืนยันคุณวุฒิทันที' }
                                        ].map(st => (
                                            <div key={st.n} className="spatial-soft p-3.5 rounded-2xl text-center flex flex-col items-center gap-1.5">
                                                <div className="w-9 h-9 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center">
                                                    <Icon name={st.icon} size={18} />
                                                </div>
                                                <span className="font-mono text-[9px] font-bold text-prism-adaptive">{st.n}</span>
                                                <h3 className="font-display font-bold text-xs text-primary-adaptive">{st.title}</h3>
                                                <p className="text-[11px] text-muted-adaptive leading-snug">{st.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </SpatialCard>
                            </main>

                            {/* Footer */}
                            <footer className="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-2 text-xs text-muted-adaptive">
                                <a
                                    href="./admin.html"
                                    title="ระบบหลังบ้านผู้ดูแล"
                                    aria-label="ระบบหลังบ้านผู้ดูแล"
                                    className="w-9 h-9 rounded-xl spatial-soft flex items-center justify-center text-muted-adaptive hover:text-accent-adaptive transition-colors"
                                >
                                    <Icon name="Settings" size={16} />
                                </a>
                                <span className="font-mono text-[11px]">{CONFIG.appName} • {CONFIG.contactEmail}</span>
                            </footer>
                        </div>
                    )}

                    {/* ==================== SCREEN 2: AUTH WIZARD (3 STEPS + OTP) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center px-4 py-8">
                            <SpatialCard className="w-full max-w-lg p-6 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between">
                                    <button
                                        type="button"
                                        onClick={() => (authStep > 1 ? setAuthStep(s => s - 1) : setScreen('landing'))}
                                        className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1"
                                    >
                                        <Icon name="ArrowLeft" size={15} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-xs font-bold text-accent-adaptive">STEP {authStep} / 3</span>
                                </div>

                                <div className="space-y-1">
                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                        {authStep === 1 && 'ตรวจสอบเลขที่ใบอนุญาต / ลงทะเบียน'}
                                        {authStep === 2 && 'ยืนยันข้อมูลผู้เรียนและแผนกงาน'}
                                        {authStep === 3 && 'ยืนยันตัวตนด้วยรหัส OTP 6 หลัก'}
                                    </h2>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive">
                                        {authStep === 1 && 'กรอกเลขที่ใบประกอบวิชาชีพหรือรหัสบุคลากรเพื่อค้นหาประวัติหรือลงทะเบียนใหม่'}
                                        {authStep === 2 && 'ข้อมูลแผนกงานจะช่วยให้ AI Study Companion ปรับคำอธิบายให้ตรงหน้างานของคุณ'}
                                        {authStep === 3 && `กรุณากรอกรหัส OTP 6 หลักที่ส่งไปยังอีเมล ${authForm.email}`}
                                    </p>
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleCheckLicense} className="space-y-4">
                                        <FormField
                                            label="เลขที่ใบประกอบวิชาชีพ / รหัสบุคลากร *"
                                            required
                                            value={authForm.license}
                                            onChange={e => setAuthForm(p => ({ ...p, license: e.target.value }))}
                                            placeholder="เช่น 6501234567"
                                            autoComplete="off"
                                        />
                                        <button
                                            type="submit"
                                            disabled={authLoading}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {authLoading ? 'กำลังตรวจสอบข้อมูล...' : 'ตรวจสอบและดำเนินการต่อ →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={handleRequestOtp} className="space-y-3.5">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormField label="คำนำหน้า ชื่อ - นามสกุล *" required value={authForm.name} onChange={e => setAuthForm(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา" />
                                            <FormField label="อีเมลสำหรับรับรหัส OTP *" type="email" required value={authForm.email} onChange={e => setAuthForm(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" />
                                            <FormField label="เบอร์โทรศัพท์" type="tel" value={authForm.phone} onChange={e => setAuthForm(p => ({ ...p, phone: e.target.value }))} placeholder="08XXXXXXXX" />
                                            <FormField label="ตำแหน่งวิชาชีพ" value={authForm.position} onChange={e => setAuthForm(p => ({ ...p, position: e.target.value }))} placeholder="เช่น พยาบาลวิชาชีพ" />
                                        </div>

                                        <FormSelect
                                            label="ลักษณะงานปัจจุบัน (ให้ AI ปรับมุมมองสอนเฉพาะแผนก)"
                                            value={authForm.workContext}
                                            onChange={e => setAuthForm(p => ({ ...p, workContext: e.target.value }))}
                                            options={[
                                                'ทีมรับบริจาค/ปลูกถ่ายอวัยวะ (TC)',
                                                'หอผู้ป่วยวิกฤต (ICU) / ER / OR',
                                                'ผู้สนใจศึกษาทั่วไป'
                                            ]}
                                        />

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormSelect
                                                label="สังกัด / เขตสุขภาพ"
                                                value={authForm.department}
                                                onChange={e => {
                                                    const dep = e.target.value;
                                                    const firstHosp = HOSPITAL_MAPPING[dep]?.[0];
                                                    setAuthForm(p => ({
                                                        ...p,
                                                        department: dep,
                                                        hospital: firstHosp?.name || p.hospital,
                                                        province: firstHosp?.prov || p.province
                                                    }));
                                                }}
                                                options={Object.keys(HOSPITAL_MAPPING)}
                                            />
                                            <FormField label="โรงพยาบาล / หน่วยงาน *" required value={authForm.hospital} onChange={e => setAuthForm(p => ({ ...p, hospital: e.target.value }))} />
                                        </div>

                                        <FormSelect
                                            label="ประเภทสิทธิ์การเรียน"
                                            value={authForm.userType}
                                            onChange={e => setAuthForm(p => ({ ...p, userType: e.target.value }))}
                                            options={['เรียนใหม่', 'เรียนต่อเนื่อง']}
                                        />

                                        <button
                                            type="submit"
                                            disabled={authLoading}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {authLoading ? 'กำลังส่งรหัส OTP...' : 'ขอรับรหัส OTP ทางอีเมล →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtpAndLogin} className="space-y-4">
                                        <FormField
                                            label="รหัสยืนยันตัวตน OTP (6 หลัก)"
                                            required
                                            maxLength={6}
                                            inputMode="numeric"
                                            value={otpInput}
                                            onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, '').slice(0, 6))}
                                            placeholder="กรอกตัวเลข 6 หลัก"
                                            className="font-mono text-center"
                                        />
                                        <button
                                            type="submit"
                                            disabled={authLoading || otpInput.length !== 6}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm shadow-lg"
                                        >
                                            {authLoading ? 'กำลังยืนยันรหัส...' : 'ยืนยัน OTP และเข้าสู่ระบบ'}
                                        </button>
                                        <button
                                            type="button"
                                            disabled={otpCooldown > 0 || authLoading}
                                            onClick={() => handleRequestOtp()}
                                            className="w-full py-2.5 rounded-xl spatial-soft text-xs font-bold text-prism-adaptive disabled:opacity-50"
                                        >
                                            {otpCooldown > 0 ? `ขอรหัส OTP ใหม่ได้ในอีก ${otpCooldown} วินาที` : 'ส่งรหัส OTP ใหม่อีกครั้ง'}
                                        </button>
                                    </form>
                                )}
                            </SpatialCard>
                        </div>
                    )}

                    {/* ==================== SCREEN 3 & 5: PRE-TEST & POST-TEST (AUTO-ADVANCE + BACK) ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && (() => {
                        const safeQuizIndex = Math.max(0, Math.min(Math.max(0, quizQuestions.length - 1), quizIndex));
                        const currentQ = quizQuestions[safeQuizIndex];
                        const answeredCount = Object.keys(quizAnswers).length;
                        const totalCount = Math.max(1, quizQuestions.length);
                        const allAnswered = answeredCount >= quizQuestions.length;
                        const isLastQuestion = safeQuizIndex >= quizQuestions.length - 1;
                        const currentDomainMeta = currentQ ? CLINICAL_DOMAINS[currentQ.domain] : null;

                        return (
                            <div className="relative z-10 flex-1 w-full max-w-3xl mx-auto px-3.5 sm:px-6 py-5 sm:py-8 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                            {screen === 'pretest' ? 'STEP 01 • PRE-TEST & AI DIAGNOSTIC ROADMAP' : `STEP 04 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                                        </span>
                                        <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                            {screen === 'pretest' ? 'แบบทดสอบวัดความรู้ก่อนเรียน' : 'แบบทดสอบวัดความรู้หลังเรียน'}
                                        </h1>
                                    </div>
                                    {screen === 'posttest' && (
                                        <button
                                            type="button"
                                            onClick={() => { setQuizSubmitted(false); setScreen('dashboard'); }}
                                            className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive"
                                        >
                                            กลับห้องเรียน
                                        </button>
                                    )}
                                </div>

                                {!quizSubmitted && currentQ ? (
                                    <div className="space-y-4">
                                        {/* Progress Header + Quick-Jump Question Bar */}
                                        <SpatialCard className="p-4 space-y-3">
                                            <div className="flex items-center justify-between text-xs font-bold">
                                                <span className="text-secondary-adaptive">
                                                    ข้อที่ <b className="text-primary-adaptive">{safeQuizIndex + 1}</b> / {quizQuestions.length} • ตอบแล้ว {answeredCount} ข้อ
                                                </span>
                                                <span className="font-mono text-accent-adaptive">
                                                    {Math.round((answeredCount / totalCount) * 100)}%
                                                </span>
                                            </div>
                                            <div className="w-full h-2 rounded-full bg-slate-500/20 overflow-hidden">
                                                <div
                                                    className="h-full rounded-full bg-gradient-to-r from-aurora-400 to-prism-400 transition-all duration-300"
                                                    style={{ width: `${Math.round((answeredCount / totalCount) * 100)}%` }}
                                                />
                                            </div>
                                            <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-1 pt-0.5">
                                                {quizQuestions.map((_, idx) => {
                                                    const isCurrent = idx === safeQuizIndex;
                                                    const isAnswered = quizAnswers[idx] !== undefined;
                                                    return (
                                                        <button
                                                            key={idx}
                                                            type="button"
                                                            onClick={() => handleGoQuizStep(idx)}
                                                            aria-label={`ไปยังข้อที่ ${idx + 1}`}
                                                            className={`shrink-0 w-8 h-8 rounded-xl font-mono text-xs font-bold border transition-all ${
                                                                isCurrent
                                                                    ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 border-transparent scale-105 shadow-md'
                                                                    : isAnswered
                                                                        ? 'bg-aurora-500/20 border-aurora-400/50 text-accent-adaptive'
                                                                        : 'spatial-soft text-muted-adaptive'
                                                            }`}
                                                        >
                                                            {idx + 1}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </SpatialCard>

                                        {/* Single Active Question Card (Auto-Advance on Selection) */}
                                        <SpatialCard key={currentQ.id || safeQuizIndex} className="p-5 sm:p-6 space-y-4">
                                            <div className="flex flex-wrap items-center justify-between gap-2">
                                                <span className="px-2.5 py-1 rounded-lg bg-prism-500/15 text-prism-adaptive font-mono text-xs font-bold">
                                                    ข้อที่ {safeQuizIndex + 1} จาก {quizQuestions.length}
                                                </span>
                                                {currentDomainMeta && (
                                                    <span className="px-2.5 py-1 rounded-full spatial-soft text-[11px] font-bold text-secondary-adaptive">
                                                        {currentDomainMeta.shortName}
                                                    </span>
                                                )}
                                            </div>

                                            <p className="font-display font-bold text-base sm:text-lg text-primary-adaptive leading-relaxed">
                                                {currentQ.question}
                                            </p>

                                            <div className="grid grid-cols-1 gap-2.5 pt-1">
                                                {currentQ.options.map((opt, oIdx) => {
                                                    const selected = quizAnswers[safeQuizIndex] === oIdx;
                                                    return (
                                                        <button
                                                            key={oIdx}
                                                            type="button"
                                                            onClick={() => handleSelectQuizOption(safeQuizIndex, oIdx)}
                                                            className={`touch-target text-left px-4 py-3.5 rounded-2xl border text-xs sm:text-sm font-semibold transition-all flex items-center gap-3 active:scale-[0.99] ${
                                                                selected
                                                                    ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive shadow-sm'
                                                                    : 'spatial-soft text-secondary-adaptive hover:border-prism-400/50'
                                                            }`}
                                                        >
                                                            <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${
                                                                selected ? 'border-aurora-400 bg-aurora-400 text-void-950' : 'border-slate-400/60'
                                                            }`}>
                                                                {selected && <Icon name="Check" size={12} strokeWidth={3} />}
                                                            </span>
                                                            <span className="leading-relaxed">{opt}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            <p className="text-[11px] text-muted-adaptive text-center pt-1">
                                                {isLastQuestion
                                                    ? 'แตะเลือกคำตอบข้อสุดท้าย แล้วกดปุ่มส่งคำตอบด้านล่าง หรือกดย้อนกลับเพื่อทบทวนข้อก่อนหน้าค่ะ'
                                                    : 'เมื่อแตะเลือกคำตอบ ระบบจะเปลี่ยนเป็นข้อถัดไปอัตโนมัติทันที (กดย้อนกลับเพื่อแก้คำตอบได้ทุกเมื่อ)'}
                                            </p>
                                        </SpatialCard>

                                        {/* Back / Next / Submit Controls */}
                                        <div className="grid grid-cols-2 gap-2.5">
                                            <button
                                                type="button"
                                                disabled={safeQuizIndex <= 0}
                                                onClick={() => handleGoQuizStep(safeQuizIndex - 1)}
                                                className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-primary-adaptive font-display font-bold text-sm disabled:opacity-40 flex items-center justify-center gap-1.5"
                                            >
                                                <Icon name="ArrowLeft" size={16} /> ย้อนกลับข้อก่อนหน้า
                                            </button>

                                            {!isLastQuestion ? (
                                                <button
                                                    type="button"
                                                    onClick={() => handleGoQuizStep(safeQuizIndex + 1)}
                                                    className="touch-target spatial-soft py-3.5 px-4 rounded-2xl text-prism-adaptive font-display font-bold text-sm flex items-center justify-center gap-1.5"
                                                >
                                                    ไปข้อถัดไป <Icon name="ArrowRight" size={16} />
                                                </button>
                                            ) : (
                                                <button
                                                    type="button"
                                                    onClick={() => handleSubmitQuiz(screen)}
                                                    className="touch-target py-3.5 px-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-xl flex items-center justify-center gap-1.5"
                                                >
                                                    <Icon name="CheckCircle2" size={17} /> ส่งคำตอบเลย
                                                </button>
                                            )}
                                        </div>

                                        {allAnswered && !isLastQuestion && (
                                            <button
                                                type="button"
                                                onClick={() => handleSubmitQuiz(screen)}
                                                className="touch-target w-full py-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-base shadow-xl"
                                            >
                                                ตอบครบทุกข้อแล้ว — ส่งคำตอบและให้ AI วิเคราะห์ผลทันที
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    <SpatialCard className="p-5 sm:p-7 space-y-5">
                                        <div className="text-center space-y-2">
                                            <span className={`inline-block px-3 py-1 rounded-full font-mono text-xs font-bold ${
                                                screen === 'pretest' || quizScoreSummary?.passed
                                                    ? 'bg-aurora-500/20 text-accent-adaptive'
                                                    : 'bg-amber-500/20 text-amber-400'
                                            }`}>
                                                {screen === 'pretest'
                                                    ? 'AI DIAGNOSTIC ROADMAP READY'
                                                    : (quizScoreSummary?.passed ? 'PASSED ≥ 80% • CERTIFICATE UNLOCKED' : 'NEEDS REVIEW (< 80%)')}
                                            </span>
                                            <h2 className="font-mono text-4xl font-extrabold text-primary-adaptive">
                                                {quizScoreSummary?.scoreStr} <span className="text-xl text-accent-adaptive">({quizScoreSummary?.percent}%)</span>
                                            </h2>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive max-w-lg mx-auto">
                                                {lastDiagnosis?.summaryText}
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {(lastDiagnosis?.domains || []).map(d => (
                                                <div key={d.id} className="spatial-soft p-3.5 rounded-2xl space-y-1.5">
                                                    <div className="flex justify-between text-xs font-bold">
                                                        <span className="text-primary-adaptive">{d.shortName}</span>
                                                        <span className="font-mono" style={{ color: d.color }}>{d.percent}%</span>
                                                    </div>
                                                    <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                                        <div className="h-full rounded-full" style={{ width: `${d.percent}%`, backgroundColor: d.color }} />
                                                    </div>
                                                    <p className="text-[11px] text-muted-adaptive leading-relaxed">{d.remediationGuide}</p>
                                                </div>
                                            ))}
                                        </div>

                                        {screen === 'posttest' && !quizScoreSummary?.passed && (
                                            <div className="p-4 rounded-2xl bg-amber-500/15 border border-amber-400/35 text-xs sm:text-sm space-y-2">
                                                <p className="font-bold text-amber-400 flex items-center gap-1.5">
                                                    <Icon name="Sparkles" size={15} /> AI Remediation Coach (สรุปทบทวนจุดพลาดโดยไม่เฉลยข้อสอบ)
                                                </p>
                                                <p className="text-primary-adaptive whitespace-pre-line leading-relaxed">
                                                    {isRemediationLoading
                                                        ? 'AI กำลังวิเคราะห์หลักการคลินิกจุดที่ควรทบทวนเพิ่มเติม...'
                                                        : (remediationAiText || lastDiagnosis?.weakDomains?.map(d => `• ${d.nameTH}: ${d.remediationGuide}`).join('\n'))}
                                                </p>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            {screen === 'posttest' && quizScoreSummary?.passed ? (
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        setCertFormName(user?.name || '');
                                                        setCertFormHosp(user?.hospital || '');
                                                        setScreen('cert_confirm');
                                                    }}
                                                    className="touch-target sm:col-span-2 py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                                >
                                                    <Icon name="Award" size={18} /> ไปยืนยันชื่อและรับประกาศนียบัตรทันที
                                                </button>
                                            ) : (
                                                <>
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            const recId = lastDiagnosis?.recommendedLessonIds?.[0];
                                                            if (recId) setCurrentLessonId(recId);
                                                            setQuizSubmitted(false);
                                                            setActiveTab('lessons');
                                                            setScreen('dashboard');
                                                        }}
                                                        className="touch-target py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm"
                                                    >
                                                        เข้าสู่ห้องเรียนตามแผน AI →
                                                    </button>
                                                    {screen === 'posttest' && (
                                                        <button
                                                            type="button"
                                                            onClick={() => { setQuizAnswers({}); setQuizIndex(0); setQuizSubmitted(false); }}
                                                            className="touch-target spatial-soft py-3.5 rounded-2xl text-primary-adaptive font-display font-bold text-sm"
                                                        >
                                                            ทำ Post-test ใหม่อีกครั้ง
                                                        </button>
                                                    )}
                                                </>
                                            )}
                                        </div>
                                    </SpatialCard>
                                )}
                            </div>
                        );
                    })()}

                    {/* ==================== SCREEN 4: MAIN LEARNING DASHBOARD ==================== */}
                    {screen === 'dashboard' && user && (
                        <div className="relative z-10 flex-1 flex flex-col pb-dock-safe lg:pb-10">
                            {/* Top Sticky Header */}
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">
                                            <Icon name="HeartHandshake" size={18} />
                                        </div>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                rjcloud<span className="text-accent-adaptive">.organ</span>
                                            </span>
                                            <span className="text-[11px] text-muted-adaptive block truncate">{user.name} • {roleProfile.badgeTH}</span>
                                        </div>
                                    </div>

                                    <div className="hidden lg:flex items-center gap-1.5">
                                        {[
                                            { id: 'lessons', label: 'บทเรียน + AI', icon: 'MonitorPlay' },
                                            { id: 'clinical_cases', label: 'เคสคลินิก', icon: 'Stethoscope' },
                                            { id: 'flashcards', label: 'Flashcards', icon: 'Layers' },
                                            { id: 'live', label: 'Live สด', icon: 'Radio' },
                                            { id: 'leaderboard', label: 'จัดอันดับ', icon: 'Trophy' },
                                            { id: 'profile', label: 'โปรไฟล์ & Warm-up', icon: 'User' }
                                        ].map(t => (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setActiveTab(t.id)}
                                                className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                    activeTab === t.id
                                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                        : 'spatial-soft text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={14} /> {t.label}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <span className="hidden sm:inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-aurora-500/15 text-accent-adaptive font-mono text-xs font-bold">
                                            <Icon name="Clock" size={13} /> {liveStudyPercent}%
                                        </span>
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>
                            </header>

                            <main className="w-full max-w-7xl mx-auto px-3.5 sm:px-6 pt-4 md:pt-6 space-y-5">
                                {/* 5-Step Progress Strip */}
                                <SpatialCard className="p-3.5 sm:p-4">
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                                        <div className={`p-3 rounded-2xl border ${hasDonePretest ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                            <span className="font-mono text-[9px] font-bold text-prism-adaptive block">STEP 01</span>
                                            <p className="font-display font-bold text-xs text-primary-adaptive">Pre-test</p>
                                            <p className="font-mono text-[11px] font-bold text-accent-adaptive">{user.pretest || 'ยังไม่ทำ'}</p>
                                        </div>

                                        <div className={`p-3 rounded-2xl border ${isStudyRequirementMet ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                            <span className="font-mono text-[9px] font-bold text-prism-adaptive block">STEP 02</span>
                                            <p className="font-display font-bold text-xs text-primary-adaptive">เรียน ≥ {MIN_STUDY_PERCENT}%</p>
                                            <p className="font-mono text-[11px] font-bold text-accent-adaptive">{liveStudyPercent}% ({formatStudyTime(studySeconds)})</p>
                                        </div>

                                        <button
                                            type="button"
                                            onClick={() => {
                                                if (!canEnterSkillLab) {
                                                    showToast(`กรุณาสะสมเวลาเรียนให้ครบ ${MIN_STUDY_PERCENT}% ก่อนเข้า AI Skill Lab ค่ะ`, 'info');
                                                    return;
                                                }
                                                saveUserProgress({ lastVideoId: currentLessonId });
                                                window.location.href = isAdminPreview ? './aiskilllab.html?admin_preview=1' : './aiskilllab.html';
                                            }}
                                            className={`text-left p-3 rounded-2xl border transition-all ${
                                                hasPassedSkillLab
                                                    ? 'bg-aurora-500/15 border-aurora-400/40'
                                                    : canEnterSkillLab
                                                        ? 'bg-prism-500/15 border-prism-400/50 hover:scale-[1.01]'
                                                        : 'spatial-soft opacity-70'
                                            }`}
                                        >
                                            <span className="font-mono text-[9px] font-bold text-prism-adaptive block">STEP 03</span>
                                            <p className="font-display font-bold text-xs text-primary-adaptive flex items-center gap-1">
                                                AI Skill Lab <Icon name={canEnterSkillLab ? 'ExternalLink' : 'Lock'} size={12} />
                                            </p>
                                            <p className="font-mono text-[11px] font-bold text-accent-adaptive">
                                                {hasPassedSkillLab ? `ผ่านแล้ว (${user.skillLabBestScore || '✓'})` : (canEnterSkillLab ? 'คลิกเข้าฝึก 3D →' : 'รอเรียนครบ 80%')}
                                            </p>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => {
                                                if (!canTakePosttest) {
                                                    showToast('กรุณาผ่านการฝึก AI Skill Lab 3 มิติก่อนทำ Post-test ค่ะ', 'info');
                                                    return;
                                                }
                                                setQuizAnswers({});
                                                setQuizIndex(0);
                                                setQuizSubmitted(false);
                                                setScreen('posttest');
                                            }}
                                            className={`text-left p-3 rounded-2xl border transition-all ${
                                                hasPassedPosttest
                                                    ? 'bg-aurora-500/15 border-aurora-400/40'
                                                    : canTakePosttest
                                                        ? 'bg-amber-500/15 border-amber-400/50 hover:scale-[1.01]'
                                                        : 'spatial-soft opacity-70'
                                            }`}
                                        >
                                            <span className="font-mono text-[9px] font-bold text-prism-adaptive block">STEP 04</span>
                                            <p className="font-display font-bold text-xs text-primary-adaptive flex items-center gap-1">
                                                Post-test <Icon name={canTakePosttest ? 'ArrowRight' : 'Lock'} size={12} />
                                            </p>
                                            <p className="font-mono text-[11px] font-bold text-accent-adaptive">
                                                {hasPassedPosttest ? `${user.posttest} ✓` : (canTakePosttest ? 'เริ่มทำข้อสอบ →' : 'รอผ่าน Lab')}
                                            </p>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => {
                                                if (!hasPassedPosttest && !isAdminPreview) {
                                                    showToast(`ต้องสอบ Post-test ให้ได้ ≥ ${MIN_POSTTEST_PERCENT}% ก่อนรับประกาศนียบัตรค่ะ`, 'info');
                                                    return;
                                                }
                                                if (user.certificateCode) {
                                                    setScreen('certificate');
                                                } else {
                                                    setCertFormName(user.name || '');
                                                    setCertFormHosp(user.hospital || '');
                                                    setScreen('cert_confirm');
                                                }
                                            }}
                                            className={`col-span-2 sm:col-span-1 text-left p-3 rounded-2xl border transition-all ${
                                                user.certificateCode
                                                    ? 'bg-aurora-500/20 border-aurora-400'
                                                    : hasPassedPosttest
                                                        ? 'bg-gradient-to-r from-aurora-500/25 to-prism-500/25 border-aurora-400'
                                                        : 'spatial-soft opacity-70'
                                            }`}
                                        >
                                            <span className="font-mono text-[9px] font-bold text-prism-adaptive block">STEP 05</span>
                                            <p className="font-display font-bold text-xs text-primary-adaptive flex items-center gap-1">
                                                ประกาศนียบัตร <Icon name={hasPassedPosttest ? 'Award' : 'Lock'} size={12} />
                                            </p>
                                            <p className="font-mono text-[11px] font-bold text-accent-adaptive">
                                                {user.certificateCode ? 'ดู / ดาวน์โหลด' : (hasPassedPosttest ? 'รับใบประกาศฯ →' : 'รอสอบผ่าน')}
                                            </p>
                                        </button>
                                    </div>
                                </SpatialCard>

                                {/* TAB 1: LESSONS + AI STUDY COMPANION */}
                                {activeTab === 'lessons' && currentLesson && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        <div className="lg:col-span-8 space-y-4">
                                            <SpatialCard className="p-4 sm:p-5 space-y-3.5">
                                                <div className="flex flex-wrap items-center justify-between gap-2">
                                                    <span className="px-2.5 py-1 rounded-full bg-aurora-500/15 text-accent-adaptive font-mono text-[10px] font-bold">
                                                        บทที่ {currentLesson.id} / {lessons.length} • {roleProfile.badgeTH}
                                                    </span>
                                                    {currentLesson.documentUrl && (
                                                        <a
                                                            href={currentLesson.documentUrl}
                                                            target="_blank"
                                                            rel="noreferrer"
                                                            className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5"
                                                        >
                                                            <Icon name="FileText" size={14} /> เอกสารประกอบ
                                                        </a>
                                                    )}
                                                </div>

                                                <h2 className="font-display font-extrabold text-base sm:text-xl text-primary-adaptive leading-snug">
                                                    {currentLesson.title}
                                                </h2>

                                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                    {currentLesson.videoId ? (
                                                        <iframe
                                                            src={`https://drive.google.com/file/d/${currentLesson.videoId}/preview`}
                                                            className="absolute inset-0 w-full h-full border-0"
                                                            allow="autoplay; fullscreen"
                                                            allowFullScreen
                                                            title={currentLesson.title}
                                                        />
                                                    ) : (
                                                        <div className="absolute inset-0 flex items-center justify-center text-slate-400 text-sm">
                                                            ไม่พบวิดีโอประจำบทเรียนนี้
                                                        </div>
                                                    )}
                                                </div>
                                            </SpatialCard>

                                            {/* AI Study Companion (1-Min Summary + Audio Brief + Micro-Check + Q&A) */}
                                            <SpatialCard className="p-4 sm:p-6 space-y-4 border-prism-400/25">
                                                <div className="flex flex-wrap items-center justify-between gap-2">
                                                    <div className="flex items-center gap-2.5">
                                                        <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">
                                                            <Icon name="Sparkles" size={19} />
                                                        </div>
                                                        <div>
                                                            <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">
                                                                AI Study Companion ประจำบทที่ {currentLesson.id}
                                                            </h3>
                                                            <p className="text-[11px] text-muted-adaptive">{roleProfile.focusSummary}</p>
                                                        </div>
                                                    </div>

                                                    <button
                                                        type="button"
                                                        onClick={handlePlayLessonAudioBrief}
                                                        className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                            isAudioSpeaking
                                                                ? 'bg-rose-500 text-white'
                                                                : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                        }`}
                                                    >
                                                        <Icon name={isAudioSpeaking ? 'Square' : 'Headphones'} size={15} />
                                                        {isAudioSpeaking ? 'หยุดฟังสรุป' : 'ฟังสรุปเสียง 1 นาที'}
                                                    </button>
                                                </div>

                                                {/* 1-Minute Clinical Cheat Sheet */}
                                                <div className="spatial-soft p-4 rounded-2xl space-y-2">
                                                    <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">1-MINUTE CLINICAL CHEAT SHEET</p>
                                                    <ul className="space-y-1.5 text-xs sm:text-sm text-primary-adaptive leading-relaxed">
                                                        {(currentLessonGuide.keyPoints || []).map((pt, i) => (
                                                            <li key={i} className="flex items-start gap-2">
                                                                <span className="text-accent-adaptive font-bold">•</span>
                                                                <span>{pt}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                {/* Micro-Check Quiz */}
                                                {currentLessonGuide.microCheck && (
                                                    <div className="p-4 rounded-2xl bg-prism-500/10 border border-prism-400/30 space-y-2.5">
                                                        <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">AI MICRO-CHECK (ทบทวนท้ายบท 1 ข้อ)</p>
                                                        <p className="text-xs sm:text-sm font-bold text-primary-adaptive">{currentLessonGuide.microCheck.q}</p>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {currentLessonGuide.microCheck.options.map((opt, oIdx) => {
                                                                const picked = microCheckPicked[currentLesson.id];
                                                                const isThis = picked === oIdx;
                                                                const isCorrect = oIdx === currentLessonGuide.microCheck.answer;
                                                                return (
                                                                    <button
                                                                        key={oIdx}
                                                                        type="button"
                                                                        onClick={() => setMicroCheckPicked(p => ({ ...p, [currentLesson.id]: oIdx }))}
                                                                        className={`text-left px-3.5 py-2.5 rounded-xl border text-xs font-semibold transition-all ${
                                                                            isThis
                                                                                ? isCorrect
                                                                                    ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive'
                                                                                    : 'bg-rose-500/20 border-rose-400 text-primary-adaptive'
                                                                                : 'spatial-soft text-secondary-adaptive'
                                                                        }`}
                                                                    >
                                                                        {opt}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                        {microCheckPicked[currentLesson.id] !== undefined && (
                                                            <p className="text-xs text-accent-adaptive font-semibold">
                                                                {currentLessonGuide.microCheck.explain}
                                                            </p>
                                                        )}
                                                    </div>
                                                )}

                                                {/* Contextual Q&A Chat */}
                                                <div className="space-y-2.5">
                                                    {aiMessages.length > 0 && (
                                                        <div className="max-h-56 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                                            {aiMessages.map(m => (
                                                                <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                                    <div className={`max-w-[90%] px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm whitespace-pre-line leading-relaxed ${
                                                                        m.role === 'user'
                                                                            ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-bold'
                                                                            : 'spatial-soft text-primary-adaptive'
                                                                    }`}>
                                                                        {m.text}
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}

                                                    <form onSubmit={handleAskAiCompanion} className="flex items-center gap-2">
                                                        <input
                                                            type="text"
                                                            value={aiQuestion}
                                                            onChange={e => setAiQuestion(e.target.value)}
                                                            disabled={isAiAnswering}
                                                            placeholder={`ถาม AI เกี่ยวกับบทที่ ${currentLesson.id} หรือการนำไปใช้จริง...`}
                                                            className="touch-target spatial-input flex-1 px-4 py-2.5 rounded-2xl text-sm"
                                                        />
                                                        <button
                                                            type="submit"
                                                            disabled={!aiQuestion.trim() || isAiAnswering}
                                                            className="touch-target px-4 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-xs flex items-center gap-1.5"
                                                        >
                                                            <Icon name="Send" size={16} />
                                                            <span>{isAiAnswering ? 'กำลังคิด...' : 'ถาม AI'}</span>
                                                        </button>
                                                    </form>
                                                </div>
                                            </SpatialCard>
                                        </div>

                                        {/* Right Column: Lesson Playlist with AI Recommendations */}
                                        <SpatialCard className="lg:col-span-4 p-4 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <h3 className="font-display font-bold text-sm text-primary-adaptive">รายการบทเรียน ({lessons.length} บท)</h3>
                                                <span className="font-mono text-[10px] text-accent-adaptive font-bold">{liveStudyPercent}%</span>
                                            </div>
                                            <div className="space-y-2 max-h-[680px] overflow-y-auto custom-scrollbar pr-1">
                                                {lessons.map(l => {
                                                    const active = Number(l.id) === Number(currentLesson.id);
                                                    const isRec = (lastDiagnosis?.recommendedLessonIds || []).includes(l.id);
                                                    return (
                                                        <button
                                                            key={l.id}
                                                            type="button"
                                                            onClick={() => {
                                                                stopAudioBrief();
                                                                setCurrentLessonId(l.id);
                                                                saveUserProgress({ lastVideoId: l.id });
                                                            }}
                                                            className={`w-full text-left p-3 rounded-2xl border transition-all flex items-start gap-2.5 ${
                                                                active
                                                                    ? 'bg-aurora-500/15 border-aurora-400 shadow-sm'
                                                                    : 'spatial-soft'
                                                            }`}
                                                        >
                                                            <span className={`w-7 h-7 rounded-xl font-mono text-xs font-bold flex items-center justify-center shrink-0 ${
                                                                active ? 'bg-aurora-400 text-void-950' : 'bg-white/10 text-secondary-adaptive'
                                                            }`}>
                                                                {l.id}
                                                            </span>
                                                            <div className="min-w-0 flex-1">
                                                                <p className="text-xs font-bold text-primary-adaptive leading-snug line-clamp-2">{l.title}</p>
                                                                {isRec && (
                                                                    <span className="inline-block mt-1 px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 text-[9px] font-bold">
                                                                        ★ AI แนะนำสำหรับคุณ
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </SpatialCard>
                                    </div>
                                )}

                                {/* TAB 2: AI CLINICAL CASE SIMULATOR */}
                                {activeTab === 'clinical_cases' && (
                                    <ClinicalCaseSimulatorTab cases={CLINICAL_CASE_SIMULATIONS} onToast={showToast} />
                                )}

                                {/* TAB 3: AI SMART FLASHCARDS */}
                                {activeTab === 'flashcards' && (
                                    <SmartFlashcardsTab
                                        cards={SPACED_FLASHCARDS}
                                        weakDomainIds={(lastDiagnosis?.weakDomains || []).map(d => d.id)}
                                    />
                                )}

                                {/* TAB 4: LIVE STREAM */}
                                {activeTab === 'live' && (
                                    <SpatialCard className="p-5 sm:p-7 space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div>
                                                <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-mono text-[10px] font-bold ${
                                                    liveConfig.status === 'live' ? 'bg-rose-500/20 text-rose-400' : 'bg-slate-500/20 text-muted-adaptive'
                                                }`}>
                                                    {liveConfig.status === 'live' ? '🔴 LIVE ON AIR' : (liveConfig.status === 'paused' ? '⏸️ พักเบรก' : '⚫ ยังไม่เปิดถ่ายทอดสด')}
                                                </span>
                                                <h2 className="font-display text-lg sm:text-2xl font-extrabold text-primary-adaptive mt-1">{liveConfig.topic}</h2>
                                            </div>
                                            <button
                                                type="button"
                                                disabled={isLiveCheckedIn}
                                                onClick={async () => {
                                                    setIsLiveCheckedIn(true);
