        const INITIAL_QUIZ_RAW = (Array.isArray(window.QUIZ_QUESTIONS_RAW) && window.QUIZ_QUESTIONS_RAW.length > 0)

            : ['การทำ Decoupling หมายถึงข้อใด?|แยกการแจ้งข่าวสมองตายออกจากการเจรจาขอรับบริจาค|แยกหมอออกจากพยาบาล|แยกญาติออกจากห้อง|ไม่แจ้งข่าวร้าย|0'];

        // ============================================================================

        // ============================================================================
        let fbApp = null, fbAuth = null, fbDb = null;
        const isCloudConfigured = Boolean(CONFIG.firebaseConfig?.apiKey && CONFIG.firebaseConfig?.projectId);

        if (isCloudConfigured) {
            try {
                fbApp = getApps().length === 0 ? initializeApp(CONFIG.firebaseConfig) : getApp();

        // ============================================================================
        // 3. HELPERS & CERTIFICATE CANVAS RENDERER
        // ============================================================================
        function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
            const Comp = LucideIcons[name] || LucideIcons.HeartPulse;
            return <Comp size={size} className={className} strokeWidth={strokeWidth} />;
        }

        function parseRawExams(raw) {
            if (!Array.isArray(raw)) return [];
            return raw.map((str, idx) => {
                const parts = String(str).split('|').map(s => s.trim());
                return {
                    id: idx + 1,
                    question: parts[0] ? parts[0].replace(/^[0-9]+\.\s*/, '') : '',
                    options: parts.slice(1, Math.max(2, parts.length - 1)),
                    answer: parseInt((parts[parts.length - 1] || '0').replace(/[^0-9]/g, ''), 10) || 0
                };
            });
        }

        function normalizeQuestionSets(rawSets) {
            if (!rawSets) return [parseRawExams(INITIAL_QUIZ_RAW)];
            if (Array.isArray(rawSets)) return rawSets;
            if (typeof rawSets === 'object') {
                return Object.keys(rawSets)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => (Array.isArray(rawSets[k]) ? rawSets[k] : []));
            }
            return [parseRawExams(INITIAL_QUIZ_RAW)];
        }

        /**
         * สุ่มลำดับข้อสอบและตัวเลือกโดยรักษาดัชนีคำตอบที่ถูกต้องไว้แม่นยำ
         */
        function prepareShuffledExam(rawList) {
            const list = Array.isArray(rawList) && rawList.length > 0 ? rawList : parseRawExams(INITIAL_QUIZ_RAW);
            const shuffledQs = [...list].sort(() => Math.random() - 0.5);
            return shuffledQs.map((q, idx) => {
                const optsWithFlag = (q.options || []).map((text, i) => ({ text, isCorrect: i === Number(q.answer) }));
                const shuffledOpts = optsWithFlag.sort(() => Math.random() - 0.5);
                const newAnswerIdx = Math.max(0, shuffledOpts.findIndex(o => o.isCorrect));
                return {
                    id: q.id || idx + 1,
                    question: q.question,
                    options: shuffledOpts.map(o => o.text),
                    answer: newAnswerIdx
                };
            });
        }

        /**
         * แปลงคะแนนข้อความ เช่น "34/40" เป็น { score, total, percent, passed }
         */
        function parsePosttestScore(posttestStr, minPercent = MIN_POSTTEST_PERCENT) {
            const m = String(posttestStr || '').match(/(\d+)\s*\/\s*(\d+)/);
            if (!m) return { score: 0, total: 0, percent: 0, passed: false };
            const score = parseInt(m[1], 10);
            const total = parseInt(m[2], 10) || 1;
            const percent = Math.round((score / total) * 100);
            return { score, total, percent, passed: (score / total) >= (minPercent / 100) };
        }

        function formatDurationTH(totalSeconds) {
            const sec = Math.max(0, Math.floor(totalSeconds || 0));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) return `${h} ชม. ${m} นาที`;
            if (m > 0) return `${m} นาที ${s} วินาที`;
            return `${s} วินาที`;
        }

        function formatTimerMMSS(sec) {
            const s = Math.max(0, Math.floor(sec || 0));
            const mm = String(Math.floor(s / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            return `${mm}:${ss}`;
        }

        function formatThaiDate(isoStr) {
            try {
                const d = isoStr ? new Date(isoStr) : new Date();
                return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (_) {
                return '';
            }
        }

        function generateCertificateCode(prefix = 'RJC-2027') {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let rand = '';
            for (let i = 0; i < 6; i++) rand += chars[Math.floor(Math.random() * chars.length)];
            return `${prefix || 'RJC-2027'}-${rand}`;
        }

        function loadImageSafe(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        function createQrCanvas(urlText, size = 220) {
            return new Promise((resolve) => {
                if (!window.QRCode) return resolve(null);
                const holder = document.createElement('div');
                holder.style.position = 'fixed';
                holder.style.left = '-9999px';
                document.body.appendChild(holder);
                try {
                    new window.QRCode(holder, {
                        text: urlText,
                        width: size,
                        height: size,
                        colorDark: '#064e3b',
                        colorLight: '#ffffff',
                        correctLevel: window.QRCode.CorrectLevel.M
                    });
                    setTimeout(() => {
                        const qrCanvas = holder.querySelector('canvas');
                        const qrImg = holder.querySelector('img');
                        let result = null;
                        if (qrCanvas) {
                            result = qrCanvas;
                        } else if (qrImg && qrImg.src) {
                            const c = document.createElement('canvas');
                            c.width = size;
                            c.height = size;
                            const ctx = c.getContext('2d');
                            ctx.drawImage(qrImg, 0, 0, size, size);
                            result = c;
                        }
                        document.body.removeChild(holder);
                        resolve(result);
                    }, 120);
                } catch (_) {
                    document.body.removeChild(holder);
                    resolve(null);
                }
            });
        }

        /**
         * วาดประกาศนียบัตรความละเอียดสูง (A4 Landscape 2000x1414) พร้อม QR Code ตรวจสอบได้จริง
         */
        async function renderFullCertificateCanvas(canvas, user, tpl, verifyUrl) {
            if (!canvas || !user) return;
            const W = 2000, H = 1414;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            // พื้นหลัง Pearl Clinical 2027
            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#ffffff');
            bg.addColorStop(0.55, '#f8fafc');
            bg.addColorStop(1, '#ecfdf5');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // แสงออร่ามุมบนซ้ายและล่างขวา
            const g1 = ctx.createRadialGradient(240, 200, 20, 240, 200, 560);
            g1.addColorStop(0, 'rgba(16, 185, 129, 0.16)');
            g1.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, W, H);

            const g2 = ctx.createRadialGradient(W - 240, H - 200, 20, W - 240, H - 200, 580);
            g2.addColorStop(0, 'rgba(14, 165, 233, 0.14)');
            g2.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, W, H);

            // กรอบมาตรฐาน 2 ชั้น
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 8;
            ctx.strokeRect(56, 56, W - 112, H - 112);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(76, 76, W - 152, H - 152);

            // แถบประดับด้านบนกึ่งกลาง
            ctx.fillStyle = '#059669';
            ctx.fillRect(W / 2 - 230, 56, 460, 14);

            // โหลดโลโก้และลายเซ็น (ถ้ามี)
            const [logoImg, sigImg, qrCanvas] = await Promise.all([
                loadImageSafe(tpl.logoUrl),
                loadImageSafe(tpl.signatureUrl),
                createQrCanvas(verifyUrl, 220)
            ]);

            let topY = 175;
            if (logoImg) {
                const maxH = 105;
                const ratio = logoImg.width / (logoImg.height || 1);
                const drawW = maxH * ratio;
                ctx.drawImage(logoImg, W / 2 - drawW / 2, 100, drawW, maxH);
                topY = 248;
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#047857';
            ctx.font = '700 34px "Prompt", sans-serif';
            ctx.fillText(tpl.orgTitleTH || DEFAULT_CERT_TEMPLATE.orgTitleTH, W / 2, topY);

            ctx.fillStyle = '#64748b';
            ctx.font = '600 22px "JetBrains Mono", monospace';
            ctx.fillText(tpl.orgTitleEN || DEFAULT_CERT_TEMPLATE.orgTitleEN, W / 2, topY + 46);

            ctx.fillStyle = '#0f172a';
            ctx.font = '800 72px "Prompt", sans-serif';
            ctx.fillText('ประกาศนียบัตร', W / 2, topY + 165);

            ctx.fillStyle = '#475569';
            ctx.font = '500 32px "Sarabun", sans-serif';
            ctx.fillText(tpl.subtitleTH || DEFAULT_CERT_TEMPLATE.subtitleTH, W / 2, topY + 235);

            ctx.fillStyle = '#064e3b';
            ctx.font = '800 74px "Prompt", sans-serif';
            ctx.fillText(user.name || 'ผู้สำเร็จการอบรม', W / 2, topY + 345);

            const subMeta = [
                user.hospital || 'เครือข่าย rjcloud.organ',
                user.license ? `เลขที่ใบอนุญาต ${user.license}` : ''
            ].filter(Boolean).join('  •  ');

            ctx.fillStyle = '#64748b';
            ctx.font = '600 28px "Sarabun", sans-serif';
            ctx.fillText(subMeta, W / 2, topY + 408);

            ctx.fillStyle = '#334155';
            ctx.font = '500 31px "Sarabun", sans-serif';
            ctx.fillText(tpl.completionTextTH || DEFAULT_CERT_TEMPLATE.completionTextTH, W / 2, topY + 492);

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 38px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleTH || DEFAULT_CERT_TEMPLATE.courseTitleTH, W / 2, topY + 562);

            ctx.fillStyle = '#0284c7';
            ctx.font = '600 24px "Prompt", sans-serif';
            ctx.fillText(tpl.courseTitleEN || DEFAULT_CERT_TEMPLATE.courseTitleEN, W / 2, topY + 610);

            const postInfo = parsePosttestScore(user.posttest);
            const scoreLine = postInfo.total > 0
                ? `ผลประเมิน Post-test: ${user.posttest} (${postInfo.percent}%) • วันที่ออกประกาศนียบัตร ${formatThaiDate(user.certificateIssuedAt)}`
                : `วันที่ออกประกาศนียบัตร ${formatThaiDate(user.certificateIssuedAt)}`;

            ctx.fillStyle = '#047857';
            ctx.font = '600 25px "Sarabun", sans-serif';
            ctx.fillText(scoreLine, W / 2, topY + 670);

            // ลายเซ็นและผู้ลงนาม
            const sigBaseY = H - 250;
            if (sigImg) {
                const sigH = 92;
                const sigW = sigH * (sigImg.width / (sigImg.height || 1));
                ctx.drawImage(sigImg, W / 2 - sigW / 2, sigBaseY - 96, sigW, sigH);
            }

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(W / 2 - 240, sigBaseY);
            ctx.lineTo(W / 2 + 240, sigBaseY);
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.font = '700 30px "Prompt", sans-serif';
            ctx.fillText(tpl.signerName || DEFAULT_CERT_TEMPLATE.signerName, W / 2, sigBaseY + 48);

            ctx.fillStyle = '#64748b';
            ctx.font = '500 24px "Sarabun", sans-serif';
            ctx.fillText(tpl.signerPosition || DEFAULT_CERT_TEMPLATE.signerPosition, W / 2, sigBaseY + 86);

            // มุมซ้ายล่าง: รหัสอ้างอิงประกาศนียบัตร
            ctx.textAlign = 'left';
            ctx.fillStyle = '#475569';
            ctx.font = '700 22px "JetBrains Mono", monospace';
            ctx.fillText(`CERTIFICATE NO: ${user.certificateCode || 'RJC-2027-VERIFIED'}`, 120, H - 150);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 20px "Sarabun", sans-serif';
            ctx.fillText('ตรวจสอบความถูกต้องผ่าน QR Code ที่ rjcloud.organ', 120, H - 114);

            // มุมขวาล่าง: QR Code ตรวจสอบจริง
            const qrBoxSize = 210;
            const qrX = W - 120 - qrBoxSize;
            const qrY = H - 115 - qrBoxSize;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 3;
            ctx.fillRect(qrX - 14, qrY - 14, qrBoxSize + 28, qrBoxSize + 28);
            ctx.strokeRect(qrX - 14, qrY - 14, qrBoxSize + 28, qrBoxSize + 28);

            if (qrCanvas) {
                ctx.drawImage(qrCanvas, qrX, qrY, qrBoxSize, qrBoxSize);
            } else {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#059669';
                ctx.font = '700 22px "JetBrains Mono", monospace';
                ctx.fillText('QR VERIFY', qrX + qrBoxSize / 2, qrY + qrBoxSize / 2);
            }
        }

        // ============================================================================
        // 4. ERROR BOUNDARY & SHARED UI COMPONENTS (NO alert() / confirm())
        // ============================================================================
        class AppErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, err: null };
            }
            static getDerivedStateFromError(err) {
                return { hasError: true, err };
            }
            componentDidCatch(err, info) {
                console.error('App ErrorBoundary:', err, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6 bg-slate-50">
                            <div className="max-w-md w-full bg-white rounded-3xl p-6 border border-rose-200 shadow-lg text-center space-y-4">
                                <h2 className="font-display font-bold text-lg text-rose-700">พบข้อผิดพลาดในการแสดงผล</h2>
                                <p className="text-xs font-mono bg-rose-50 text-rose-800 p-3 rounded-xl overflow-auto">
                                    {String(this.state.err?.message || this.state.err)}
                                </p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="touch-target w-full py-3 rounded-2xl bg-clinical-600 text-white font-display font-bold text-sm"
                                >
                                    โหลดหน้าใหม่
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function BentoCard({ children, className = '' }) {
            return <div className={`bento-glass rounded-[1.75rem] ${className}`}>{children}</div>;
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[140] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-xl flex items-center gap-2.5 text-sm font-bold ${
                        toast.type === 'error'
                            ? 'bg-rose-50/95 border-rose-200 text-rose-700'
                            : toast.type === 'info'
                                ? 'bg-medical-50/95 border-medical-200 text-medical-700'
                                : 'bg-clinical-50/95 border-clinical-200 text-clinical-800'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Info' : 'CheckCircle2'} size={18} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="fixed inset-0 z-[135] bg-slate-900/55 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="w-full sm:max-w-md bg-white rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] shadow-2xl border border-slate-100 space-y-4">
                        <div className="flex items-start gap-3.5">
                            <div className={`w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${
                                dialog.danger ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600'
                            }`}>
                                <Icon name={dialog.danger ? 'AlertTriangle' : 'HelpCircle'} size={22} />
                            </div>
                            <div>
                                <h3 className="font-display font-bold text-lg text-slate-900">{dialog.title}</h3>
                                <p className="text-sm text-slate-600 mt-1 leading-relaxed">{dialog.message}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="touch-target py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-display font-semibold text-sm"
                            >
                                ยกเลิก
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    const fn = dialog.onConfirm;
                                    onClose();
                                    if (fn) fn();
                                }}
                                className={`touch-target py-3 rounded-2xl text-white font-display font-semibold text-sm ${
                                    dialog.danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-clinical-600 hover:bg-clinical-700'
                                }`}
                            >
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function FormField({ label, ...props }) {
            return (
                <div className="w-full">
                    {label && <label className="block text-xs font-bold text-slate-600 mb-1.5 ml-1">{label}</label>}
                    <input
                        className="touch-target w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-clinical-500 focus:ring-4 focus:ring-clinical-500/10 text-sm font-medium transition-all disabled:bg-slate-100 disabled:text-slate-500"
                        {...props}
                    />
                </div>
            );
        }

        function FormSelect({ label, options, ...props }) {
            return (
                <div className="w-full">
                    {label && <label className="block text-xs font-bold text-slate-600 mb-1.5 ml-1">{label}</label>}
                    <select
                        className="touch-target w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-clinical-500 focus:ring-4 focus:ring-clinical-500/10 text-sm font-medium transition-all"
                        {...props}
                    >
                        {options.map((opt) => (
                            <option key={opt.value ?? opt} value={opt.value ?? opt}>
                                {opt.label ?? opt}
                            </option>
                        ))}
                    </select>
                </div>
            );
        }

        // ============================================================================
        // 5. MAIN LEARNER APPLICATION (5-STEP LEARNING PATHWAY)
        // ============================================================================
        function App() {
            // ตรวจสอบโหมดตรวจสอบหน้าจอสำหรับผู้ดูแลระบบ (?admin_preview=...)
            const initialAdminPreview = useMemo(() => {
                try {
                    return new URLSearchParams(window.location.search).get('admin_preview') || '';
                } catch (_) {
                    return '';
                }
            }, []);

            const [adminPreviewMode, setAdminPreviewMode] = useState(initialAdminPreview);
            const [inspectorBarExpanded, setInspectorBarExpanded] = useState(true);

            // 1. Session & Navigation States
            const [user, setUser] = useState(() => {
                if (initialAdminPreview) return null;
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user) return saved.user;
                } catch (_) {}
                return null;
            });

            const [screen, setScreen] = useState(() => {
                if (initialAdminPreview) return 'landing';
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user) return 'dashboard';
                } catch (_) {}
                return 'landing';
            }); // landing | auth | quiz | quiz_result | quiz_fail | cert_confirm | certificate | dashboard

            const [activeTab, setActiveTab] = useState('video'); // video | live | leaderboard | profile
            const [adminTapCount, setAdminTapCount] = useState(0);

            // 2. Cloud Config & Content States
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [certTemplate, setCertTemplate] = useState(() => {
                try {
                    const saved = localStorage.getItem('rjcloud_cert_template_v2027');
                    if (saved) return { ...DEFAULT_CERT_TEMPLATE, ...JSON.parse(saved) };
                } catch (_) {}
                return { ...DEFAULT_CERT_TEMPLATE };
            });
            const [liveConfig, setLiveConfig] = useState({
                status: 'offline',
                days: 1,
                hours: 8,
                allowPosttest: false,
                topic: 'การบรรยายพิเศษด้านการรับบริจาคและปลูกถ่ายอวัยวะ 2027',
                url: '',
                documentUrl: ''
            });
            const [lessons, setLessons] = useState(INITIAL_LESSONS);
            const [questionSets, setQuestionSets] = useState([parseRawExams(INITIAL_QUIZ_RAW)]);
            const [leaderboard, setLeaderboard] = useState([]);

            // 3. Auth Wizard States (3 Steps)
            const [authStep, setAuthStep] = useState(1);
            const [licenseInput, setLicenseInput] = useState('');
            const [existingUserData, setExistingUserData] = useState(null);
            const [profileForm, setProfileForm] = useState({
                name: '',
                license: '',
                userType: 'เรียนใหม่',
                email: '',
                phone: '',
                position: 'พยาบาลวิชาชีพ',
                workContext: 'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                department: 'กรมการแพทย์',
                hospital: 'รพ.ราชวิถี',
                province: 'กรุงเทพมหานคร'
            });
            const [otpInput, setOtpInput] = useState('');
            const [fallbackOtpCode, setFallbackOtpCode] = useState('');
            const [isBusy, setIsBusy] = useState(false);

            // 4. Classroom & Study Time Tracking States
            const [currentLessonId, setCurrentLessonId] = useState(() => user?.lastVideoId || INITIAL_LESSONS[0]?.id || 1);
            const [studySeconds, setStudySeconds] = useState(() => Number(user?.studySeconds || 0));

            // 5. Quiz State
            const [quiz, setQuiz] = useState({
                type: 'pretest',
                questions: [],
                idx: 0,
                answers: {},
                score: 0,
                timeLeft: 2700,
                finished: false
            });

            // 6. CSAT & Certificate States
            const [csatRating, setCsatRating] = useState(5);
            const [csatComment, setCsatComment] = useState('');
            const [certFormName, setCertFormName] = useState('');
            const [certFormHosp, setCertFormHosp] = useState('');
            const [isRenderingCert, setIsRenderingCert] = useState(false);

            // 7. Global UI Feedback
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', danger: false, confirmText: 'ยืนยัน', onConfirm: null });

            // Refs
            const userRef = useRef(user);
            const studySecondsRef = useRef(studySeconds);
            const certCanvasRef = useRef(null);
            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { studySecondsRef.current = studySeconds; }, [studySeconds]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3600);
            }, []);

            // ยืนยันว่า Mount สำเร็จ (ปิด Error Guard)
            useEffect(() => {
                const el = document.getElementById('root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // แตะฟันเฟือง 3 ครั้งเพื่อเปิดหน้า Admin
            const handleAdminGearTap = () => {
                const next = adminTapCount + 1;
                if (next >= 3) {
                    setAdminTapCount(0);
                    window.location.href = './admin.html';
                } else {
                    setAdminTapCount(next);
                    showToast(`แตะอีก ${3 - next} ครั้งเพื่อเข้าสู่ระบบผู้ดูแล (Admin)`, 'info');
                }
            };

            // คำนวณเวลาเป้าหมาย (ชั่วโมงเรียนหลักสูตร) และเปอร์เซ็นต์ความคืบหน้า
            const targetStudySeconds = useMemo(() => Math.max(1, Number(liveConfig.hours || 8)) * 3600, [liveConfig.hours]);
            const studyPercent = useMemo(() => {
                const livePct = Math.min(100, Math.round((studySeconds / targetStudySeconds) * 100));
                return Math.max(livePct, Number(user?.progress || 0));
            }, [studySeconds, targetStudySeconds, user?.progress]);

            // ตรวจสอบสถานะ 5 ขั้นตอนการเรียนรู้
            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyRequirementMet = studyPercent >= MIN_STUDY_PERCENT;
            const hasPassedSkillLab = Boolean(
                user?.skillLabPassed || (Array.isArray(user?.skillLabHistory) && user.skillLabHistory.length > 0)
            );
            const posttestInfo = useMemo(() => parsePosttestScore(user?.posttest, MIN_POSTTEST_PERCENT), [user?.posttest]);
            const canEnterSkillLab = Boolean(adminPreviewMode || (hasDonePretest && isStudyRequirementMet));
            const canTakePosttest = Boolean(adminPreviewMode || liveConfig.allowPosttest || (hasDonePretest && isStudyRequirementMet && hasPassedSkillLab));
            const canClaimCertificate = Boolean(adminPreviewMode || posttestInfo.passed);

            // เรียก Google Apps Script API
            const callAppsScript = useCallback(async (payload) => {
                const targetUrl = appsScriptUrl || CONFIG.appsScriptUrl;
                if (!targetUrl) return { status: 'error', message: 'ยังไม่ได้ตั้งค่า Apps Script URL' };
                try {
                    const res = await fetch(targetUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message || 'Failed to fetch' };
                }
            }, [appsScriptUrl]);

            // บันทึกข้อมูลผู้เรียนลง localStorage และ Firestore (ป้องกันการทับข้อมูลจริงในโหมด Admin Preview)
            const persistUser = useCallback(async (nextUser, syncCloud = false) => {
                if (!nextUser) return;
                setUser(nextUser);
                if (adminPreviewMode || String(nextUser.id).startsWith('admin_preview_')) return;

                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: nextUser }));
                } catch (_) {}

                if (syncCloud && isCloudConfigured && fbDb && nextUser.id && !String(nextUser.id).startsWith('demo_')) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            nextUser,
                            { merge: true }
                        );
                    } catch (err) {
                        console.warn('Cloud user persist warning:', err);
                    }
                }
            }, [adminPreviewMode]);

            // 1. เชื่อมต่อ Firebase (PDPA-Safe: ไม่ดึงรายชื่อผู้เรียนทั้งระบบลงเบราว์เซอร์ผู้เรียน)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let unsubSettings = null;
                let unsubContent = null;
                let unsubLeader = null;

                signInAnonymously(fbAuth).catch(err => console.warn('Anon auth warning:', err));

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!fbUser) return;

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (d.appsScriptUrl) setAppsScriptUrl(d.appsScriptUrl);
                            if (d.liveConfig) setLiveConfig(prev => ({ ...prev, ...d.liveConfig }));
                            if (d.certTemplate) setCertTemplate(prev => ({ ...prev, ...d.certTemplate }));
                        },
                        () => {}
                    );

                    unsubContent = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'content'),
                        (snap) => {
                            if (!snap.exists()) return;
                            const d = snap.data();
                            if (Array.isArray(d.lessons) && d.lessons.length > 0) setLessons(d.lessons);
                            if (d.questionSets) setQuestionSets(normalizeQuestionSets(d.questionSets));
                        },
                        () => {}
                    );

                    unsubLeader = onSnapshot(
                        collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard'),
                        (snap) => {
                            const list = [];
                            snap.forEach(docItem => list.push({ id: docItem.id, ...docItem.data() }));
                            list.sort((a, b) => (b.score || 0) - (a.score || 0));
                            setLeaderboard(list.slice(0, 20));
                        },
                        () => {}
                    );

                    // ซิงค์ข้อมูลล่าสุดของตัวผู้เรียนเอง (เช่น เพิ่งผ่าน AI Skill Lab กลับมา)
                    const curU = userRef.current;
                    if (!adminPreviewMode && curU?.id && !String(curU.id).startsWith('demo_') && !String(curU.id).startsWith('admin_preview_')) {
                        try {
                            const uSnap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(curU.id)));
                            if (uSnap.exists()) {
                                const cloudU = uSnap.data();
                                const merged = {
                                    ...curU,
                                    ...cloudU,
                                    studySeconds: Math.max(Number(curU.studySeconds || 0), Number(cloudU.studySeconds || 0)),
                                    progress: Math.max(Number(curU.progress || 0), Number(cloudU.progress || 0))
                                };
                                setStudySeconds(merged.studySeconds);
                                persistUser(merged, false);
                            }
                        } catch (_) {}
                    }
                });

                return () => {
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                    if (unsubContent) unsubContent();
                    if (unsubLeader) unsubLeader();
                };
            }, [adminPreviewMode, persistUser]);

            // รองรับ hash #dashboard เมื่อกลับมาจาก aiskilllab.html
            useEffect(() => {
                if (adminPreviewMode) return;
                if (window.location.hash === '#dashboard' && userRef.current) {
                    setScreen('dashboard');
                }
            }, [adminPreviewMode]);

            // ป้องกันการค้างหน้าเมื่อไม่มีเซสชันผู้เรียน
            useEffect(() => {
                if (adminPreviewMode) return;
                if (!user && !['landing', 'auth'].includes(screen)) {
                    setScreen('landing');
                }
            }, [user, screen, adminPreviewMode]);

            // 2. นับเวลาเรียนอัตโนมัติเฉพาะเมื่อเปิดหน้าจออยู่ (Page Visibility API) + บันทึกเป็นระยะ
            useEffect(() => {
                if (adminPreviewMode || screen !== 'dashboard' || !user) return;
                if (!['video', 'live'].includes(activeTab)) return;

                let tickCount = 0;
                const interval = setInterval(() => {
                    if (document.hidden) return;
                    setStudySeconds(prev => {
                        const nextSec = prev + 1;
                        tickCount += 1;
                        if (tickCount % 30 === 0 && userRef.current) {
                            const nextPct = Math.min(100, Math.round((nextSec / targetStudySeconds) * 100));
                            const updated = {
                                ...userRef.current,
                                studySeconds: nextSec,
                                progress: Math.max(Number(userRef.current.progress || 0), nextPct),
                                lastVideoId: currentLessonId
                            };
                            persistUser(updated, true);
                        }
                        return nextSec;
                    });
                }, 1000);

                const flushProgress = () => {
                    if (!userRef.current || adminPreviewMode) return;
                    const sec = studySecondsRef.current;
                    const nextPct = Math.min(100, Math.round((sec / targetStudySeconds) * 100));
                    const updated = {
                        ...userRef.current,
                        studySeconds: sec,
                        progress: Math.max(Number(userRef.current.progress || 0), nextPct),
                        lastVideoId: currentLessonId
                    };

            const handleRequestOtp = async (e) => {

            const handleFinishQuiz = async (quizState) => {
                if (quizState.finished || !userRef.current) return;
                const curU = userRef.current;
                const score = quizState.questions.reduce((acc, q) => acc + (quizState.answers[q.id] === q.answer ? 1 : 0), 0);
                const total = quizState.questions.length || 1;
                const percent = Math.round((score / total) * 100);
                const isPre = quizState.type === 'pretest';
                const passed = (score / total) >= (MIN_POSTTEST_PERCENT / 100);

                const updatedUser = {
                    ...curU,
                    ...(isPre
                        ? { pretest: `${score}/${total}` }
                        : {
                            posttest: `${score}/${total}`,
                            posttestPercent: percent,
                            status: passed ? 'ผ่าน' : 'ไม่ผ่าน'
                        })
                };

                setQuiz(prev => ({ ...prev, score, finished: true }));
                await persistUser(updatedUser, true);
                if (!adminPreviewMode) {
                    callAppsScript({ action: 'upsertUser', user: updatedUser });
                }

                if (isPre) {
                    setScreen('quiz_result');
                } else if (passed) {
                    setCertFormName(updatedUser.name || '');
                    setCertFormHosp(updatedUser.hospital || '');

                    liveCheckedIn: true,
                    liveCheckedInAt: new Date().toISOString(),
                    studySeconds: bonusSec,
                    progress: Math.max(Number(user.progress || 0), nextPct)
                };

                await persistUser(updated, true);
                showToast('ยืนยันการเข้าเรียน Live สด และบันทึกเวลาเรียนเรียบร้อยแล้วค่ะ ✅');

            };

            // ============================================================================
            // 9. ADMIN PREVIEW FLOATING INSPECTOR BAR & RENDER SCREENS
            // ============================================================================
            const renderAdminPreviewBar = () => {
                if (!adminPreviewMode) return null;
                const quickScreens = [
                    { id: 'landing', label: 'หน้าแรก' },
                    { id: 'auth1', label: 'ลงทะเบียน 1' },
                    { id: 'auth2', label: 'ลงทะเบียน 2' },
                    { id: 'auth3', label: 'OTP 3' },
                    { id: 'pretest', label: 'Pre-test' },
                    { id: 'dashboard', label: 'ห้องเรียน' },
                    { id: 'live', label: 'Live' },
                    { id: 'posttest', label: 'Post-test' },
                    { id: 'cert_confirm', label: 'CSAT' },
                    { id: 'certificate', label: 'ประกาศฯ' }
                ];
                return (
                    <div className="fixed bottom-3 right-3 left-3 sm:left-auto z-[130] flex flex-col items-end gap-1.5 pointer-events-none">
                        {inspectorBarExpanded ? (
                            <div className="pointer-events-auto w-full sm:w-auto max-w-3xl bg-slate-900/95 text-white backdrop-blur-xl border border-clinical-400/40 rounded-2xl p-2.5 shadow-2xl space-y-2">
                                <div className="flex items-center justify-between gap-2 px-1">
                                    <div className="flex items-center gap-1.5 text-[11px] font-mono font-bold text-clinical-300">
                                        <Icon name="Eye" size={14} /> ADMIN PREVIEW MODE (ไม่กระทบข้อมูลจริง)
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <a href="./aiskilllab.html?admin_preview=1" className="px-2.5 py-1 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-[11px] font-bold">
                                            AI Skill Lab
                                        </a>
                                        <a href="./admin.html" className="px-2.5 py-1 rounded-lg bg-clinical-600 hover:bg-clinical-500 text-white text-[11px] font-bold">
                                            กลับ Admin
                                        </a>
                                        <button
                                            type="button"
                                            onClick={() => setInspectorBarExpanded(false)}
                                            className="w-6 h-6 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center"
                                            title="พับแถบตรวจหน้าจอ"
                                        >
                                            <Icon name="ChevronDown" size={14} />
                                        </button>
                                    </div>
                                </div>
                                <div className="flex flex-wrap gap-1">
                                    {quickScreens.map(sc => (
                                        <button
                                            key={sc.id}
                                            type="button"
                                            onClick={() => switchAdminPreviewScreen(sc.id)}
                                            className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${
                                                adminPreviewMode === sc.id
                                                    ? 'bg-clinical-500 text-slate-950'
                                                    : 'bg-white/10 hover:bg-white/20 text-slate-200'
                                            }`}
                                        >
                                            {sc.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <button
                                type="button"
                                onClick={() => setInspectorBarExpanded(true)}
                                className="pointer-events-auto px-3.5 py-2 rounded-full bg-slate-900/95 text-clinical-300 border border-clinical-400/40 shadow-xl text-xs font-bold flex items-center gap-1.5"
                            >
                                <Icon name="Eye" size={14} /> แถบตรวจหน้า Admin
                            </button>
                        )}
                    </div>
                );
            };

            // --- SCREEN 1: LANDING ---
            if (screen === 'landing') {
                return (
                    <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />

                        <header className="relative z-20 max-w-6xl w-full mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-clinical-500 to-teal-600 text-white flex items-center justify-center shadow-md shadow-clinical-500/25">
                                    <Icon name="HeartPulse" size={21} />
                                </div>
                                <div>
                                    <span className="font-display font-extrabold text-lg text-slate-900 block leading-none">
                                        rjcloud<span className="text-clinical-600">.organ</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-slate-500">2027 Clinical Edition</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <a href="./verify.html" className="px-3.5 py-2 rounded-xl bg-white/85 hover:bg-white border border-slate-200 text-slate-700 font-bold text-xs flex items-center gap-1.5 shadow-sm">
                                    <Icon name="QrCode" size={15} className="text-clinical-600" />
                                    <span className="hidden sm:inline">ตรวจประกาศนียบัตร</span>
                                </a>
                                <a href="./executive.html" className="px-3.5 py-2 rounded-xl bg-white/85 hover:bg-white border border-slate-200 text-slate-700 font-bold text-xs flex items-center gap-1.5 shadow-sm">
                                    <Icon name="BarChart3" size={15} className="text-medical-600" />
                                    <span className="hidden sm:inline">ผู้บริหาร</span>
                                </a>
                            </div>
                        </header>

                        <main className="relative z-10 flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 md:py-12 flex flex-col justify-center gap-7">
                            <div className="text-center space-y-4 max-w-3xl mx-auto">
                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-clinical-50 border border-clinical-200 text-clinical-700 font-mono text-[11px] font-bold">
                                    <span className="w-2 h-2 rounded-full bg-clinical-500 animate-pulse" />
                                    ORGAN DONATION & TRANSPLANTATION LEARNING ECOSYSTEM
                                </span>
                                <h1 className="font-display text-3xl sm:text-5xl font-extrabold text-slate-900 leading-tight">
                                    ยกระดับทักษะการรับบริจาคและปลูกถ่ายอวัยวะ <span className="text-transparent bg-clip-text bg-gradient-to-r from-clinical-600 to-medical-600">ยุคดิจิทัล 2027</span>
                                </h1>
                                <p className="text-sm sm:text-base text-slate-600 leading-relaxed max-w-2xl mx-auto">
                                    เรียนรู้บทเรียนมาตรฐาน ฝึกสื่อสารกับญาติผู้เสียชีวิตในห้องรับรองจำลองด้วย AI Skill Lab พร้อมออกประกาศนียบัตรอิเล็กทรอนิกส์ (PDF / PNG + QR Verify) ทันทีเมื่อผ่านเกณฑ์
                                </p>

                                <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => { setAuthStep(1); setScreen('auth'); }}
                                        className="touch-target w-full sm:w-auto px-8 py-4 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 hover:from-clinical-600 hover:to-teal-700 text-white font-display font-bold text-base shadow-[0_14px_30px_-8px_rgba(5,150,105,0.45)] flex items-center justify-center gap-2 transition-all active:scale-[0.98]"
                                    >
                                        <span>เข้าสู่ระบบ / ลงทะเบียนเรียน</span>
                                        <Icon name="ArrowRight" size={19} />
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleStartDemoLearner}
                                        className="touch-target w-full sm:w-auto px-6 py-4 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-display font-bold text-sm flex items-center justify-center gap-2 shadow-sm active:scale-[0.98]"
                                    >
                                        <Icon name="Sparkles" size={17} className="text-clinical-600" />
                                        <span>ทดลองเรียน (Demo)</span>
                                    </button>
                                </div>
                            </div>

                            {/* 5-Step Learning Pathway Preview */}
                            <BentoCard className="p-5 sm:p-6">
                                <p className="text-xs font-mono font-bold text-clinical-700 uppercase tracking-wider mb-3 text-center">
                                    เส้นทางการเรียนรู้ 5 ขั้นตอนสู่ประกาศนียบัตร
                                </p>
                                <div className="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                                    {[
                                        { step: '01', title: 'ทำ Pre-test', desc: 'ประเมินความรู้ก่อนเรียนทันทีหลังเข้าสู่ระบบ', icon: 'ClipboardCheck' },
                                        { step: '02', title: `สะสมเวลา ≥ ${MIN_STUDY_PERCENT}%`, desc: 'เรียนวิดีโอ 20 บทหรือเข้าเรียน Live สด', icon: 'MonitorPlay' },
                                        { step: '03', title: 'AI Skill Lab', desc: 'ฝึกให้ข้อมูลญาติในห้องรับรองพร้อม AI Coach', icon: 'Bot' },
                                        { step: '04', title: `Post-test ≥ ${MIN_POSTTEST_PERCENT}%`, desc: 'ผ่านแบบทดสอบหลังเรียนตามเกณฑ์มาตรฐาน', icon: 'FileCheck2' },
                                        { step: '05', title: 'รับประกาศฯ ทันที', desc: 'ดาวน์โหลด PDF / PNG พร้อม QR ตรวจสอบได้', icon: 'Award' }
                                    ].map(item => (
                                        <div key={item.step} className="p-3.5 rounded-2xl bg-white/90 border border-slate-200/70 flex sm:flex-col items-center sm:text-center gap-3 sm:gap-2">
                                            <div className="w-10 h-10 rounded-xl bg-clinical-50 text-clinical-600 flex items-center justify-center shrink-0">
                                                <Icon name={item.icon} size={20} />
                                            </div>
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-clinical-600">STEP {item.step}</span>
                                                <h3 className="font-display font-bold text-sm text-slate-900">{item.title}</h3>
                                                <p className="text-[11px] text-slate-500 mt-0.5 leading-snug">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </BentoCard>
                        </main>

                        <footer className="relative z-10 max-w-6xl w-full mx-auto px-4 py-5 flex items-center justify-between text-xs text-slate-400">
                            <button
                                type="button"
                                onClick={handleAdminGearTap}
                                aria-label="เข้าหน้าผู้ดูแลระบบ"
                                className="w-10 h-10 rounded-xl hover:bg-slate-200/60 text-slate-400 hover:text-slate-600 flex items-center justify-center transition-colors"
                                title="แตะ 3 ครั้งเพื่อเข้าหน้า Admin"
                            >
                                <Icon name="Settings" size={18} />
                            </button>
                            <p className="text-right font-medium">{CONFIG.appName} • {CONFIG.contactEmail}</p>
                        </footer>

                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 2: AUTH WIZARD (3 STEPS) ---
            if (screen === 'auth') {
                const hospitalChoices = (HOSPITAL_MAPPING[profileForm.department] || [{ name: 'อื่นๆ', prov: '' }]).map(h => h.name);
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />

                        <BentoCard className="relative z-10 w-full max-w-lg p-6 sm:p-8 space-y-6">
                            <div className="flex items-center justify-between">
                                <button
                                    type="button"
                                    onClick={() => (authStep === 1 ? setScreen('landing') : setAuthStep(s => Math.max(1, s - 1)))}
                                    className="px-3.5 py-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center gap-1.5"
                                >
                                    <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                </button>
                                <span className="px-3 py-1 rounded-full bg-clinical-50 border border-clinical-200 text-clinical-700 font-mono text-xs font-bold">
                                    STEP {authStep}/3
                                </span>
                            </div>

                            {/* STEP 1: CHECK LICENSE */}
                            {authStep === 1 && (
                                <form onSubmit={handleCheckLicense} className="space-y-5">
                                    <div className="text-center space-y-1.5">
                                        <div className="w-12 h-12 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto">
                                            <Icon name="UserCheck" size={24} />
                                        </div>
                                        <h2 className="font-display text-2xl font-extrabold text-slate-900">ตรวจสอบสิทธิ์ผู้เรียน</h2>
                                        <p className="text-xs sm:text-sm text-slate-500">
                                            กรอกเลขที่ใบประกอบวิชาชีพเพื่อลงทะเบียนใหม่หรือเรียนต่อจากสถานะล่าสุด
                                        </p>
                                    </div>

                                    <FormField
                                        label="เลขที่ใบประกอบวิชาชีพ / เลขประจำตัวผู้เรียน *"
                                        required
                                        value={licenseInput}
                                        onChange={e => setLicenseInput(e.target.value)}
                                        placeholder="เช่น 65012345"
                                        autoComplete="off"
                                    />

                                    <button
                                        type="submit"
                                        disabled={isBusy}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 hover:from-clinical-600 hover:to-teal-700 text-white font-display font-bold text-base shadow-lg shadow-clinical-500/25 flex items-center justify-center gap-2"
                                    >
                                        <span>{isBusy ? 'กำลังตรวจสอบประวัติ...' : 'ตรวจสอบและดำเนินการต่อ'}</span>
                                        <Icon name="ArrowRight" size={18} />
                                    </button>
                                </form>
                            )}

                            {/* STEP 2: PROFILE CONFIRMATION (เรียนใหม่ / เรียนต่อเนื่อง เท่านั้น) */}
                            {authStep === 2 && (
                                <form onSubmit={handleRequestOtp} className="space-y-4">
                                    <div className="text-center space-y-1">
                                        <h2 className="font-display text-xl sm:text-2xl font-extrabold text-slate-900">ยืนยันข้อมูลผู้เรียน</h2>
                                        <p className="text-xs text-slate-500">ข้อมูลนี้จะนำไปแสดงบนประกาศนียบัตรอิเล็กทรอนิกส์</p>
                                    </div>

                                    {existingUserData && (
                                        <div className="p-3.5 rounded-2xl bg-clinical-50 border border-clinical-200 text-xs text-clinical-800 flex items-center gap-2.5">
                                            <Icon name="History" size={18} className="text-clinical-600 shrink-0" />
                                            <span>
                                                พบข้อมูลเดิมในระบบ (ความคืบหน้า <b>{existingUserData.progress || 0}%</b> • Pre-test: <b>{existingUserData.pretest || '-'}</b>) ระบบตั้งเป็น <b>เรียนต่อเนื่อง</b> ให้แล้วค่ะ
                                            </span>
                                        </div>
                                    )}

                                    <div className="space-y-3 max-h-[55vh] overflow-y-auto custom-scrollbar pr-1">
                                        <FormField
                                            label="ชื่อ - นามสกุล *"
                                            required
                                            value={profileForm.name}
                                            onChange={e => setProfileForm(p => ({ ...p, name: e.target.value }))}
                                            placeholder="ระบุคำนำหน้า ชื่อ และนามสกุล"
                                        />

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormField label="เลขที่ใบอนุญาต" value={profileForm.license} disabled />
                                            <FormSelect
                                                label="ประเภทการเรียน"
                                                value={profileForm.userType}
                                                onChange={e => setProfileForm(p => ({ ...p, userType: e.target.value }))}
                                                options={['เรียนใหม่', 'เรียนต่อเนื่อง']}
                                            />
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormField
                                                label="อีเมล (สำหรับรับรหัส OTP) *"
                                                type="email"
                                                required
                                                value={profileForm.email}
                                                onChange={e => setProfileForm(p => ({ ...p, email: e.target.value }))}
                                                placeholder="name@hospital.go.th"
                                            />
                                            <FormField
                                                label="เบอร์โทรศัพท์"
                                                type="tel"
                                                value={profileForm.phone}
                                                onChange={e => setProfileForm(p => ({ ...p, phone: e.target.value }))}
                                                placeholder="08xxxxxxxx"
                                            />
                                        </div>

                                        <FormField
                                            label="ตำแหน่ง"
                                            value={profileForm.position}
                                            onChange={e => setProfileForm(p => ({ ...p, position: e.target.value }))}
                                            placeholder="พยาบาลวิชาชีพ / แพทย์ / เภสัชกร"
                                        />

                                        <FormSelect
                                            label="ลักษณะงานปัจจุบัน"
                                            value={profileForm.workContext}
                                            onChange={e => setProfileForm(p => ({ ...p, workContext: e.target.value }))}
                                            options={[
                                                'ปฏิบัติงานรับบริจาค/ปลูกถ่ายอวัยวะ',
                                                'ปฏิบัติงานหอผู้ป่วยวิกฤต (ICU) / ER / OR',
                                                'ไม่ได้ปฏิบัติงานด้านนี้โดยตรง แต่สนใจศึกษา'
                                            ]}
                                        />

                                        <FormSelect
                                            label="สังกัด / เขตสุขภาพ"
                                            value={profileForm.department}
                                            onChange={e => handleDepartmentChange(e.target.value)}
                                            options={Object.keys(HOSPITAL_MAPPING)}
                                        />

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <FormSelect
                                                label="หน่วยงาน / โรงพยาบาล"
                                                value={hospitalChoices.includes(profileForm.hospital) ? profileForm.hospital : hospitalChoices[0]}
                                                onChange={e => handleHospitalChange(e.target.value)}
                                                options={hospitalChoices}
                                            />
                                            <FormField
                                                label="จังหวัด"
                                                value={profileForm.province}
                                                onChange={e => setProfileForm(p => ({ ...p, province: e.target.value }))}
                                            />
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={isBusy}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 hover:from-clinical-600 hover:to-teal-700 text-white font-display font-bold text-base shadow-lg shadow-clinical-500/25 flex items-center justify-center gap-2"
                                    >
                                        <span>{isBusy ? 'กำลังส่งรหัส OTP...' : 'ขอรับรหัส OTP ทางอีเมล'}</span>
                                        <Icon name="Mail" size={18} />
                                    </button>
                                </form>
                            )}

                            {/* STEP 3: VERIFY OTP */}
                            {authStep === 3 && (
                                <form onSubmit={handleVerifyOtp} className="space-y-5">
                                    <div className="text-center space-y-1.5">
                                        <div className="w-12 h-12 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto">
                                            <Icon name="ShieldCheck" size={24} />
                                        </div>
                                        <h2 className="font-display text-2xl font-extrabold text-slate-900">ยืนยันรหัส OTP</h2>
                                        <p className="text-xs sm:text-sm text-slate-500">
                                            กรอกรหัส 6 หลักที่ส่งไปยัง <b className="text-slate-700">{profileForm.email}</b>
                                        </p>
                                    </div>

                                    {fallbackOtpCode && (
                                        <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-center space-y-1">
                                            <p className="text-xs font-bold text-amber-800">รหัส OTP สำรอง (ใช้ยืนยันได้ทันที):</p>
                                            <p className="font-mono text-2xl font-extrabold tracking-[0.25em] text-amber-900">{fallbackOtpCode}</p>
                                        </div>
                                    )}

                                    <input
                                        type="text"
                                        inputMode="numeric"
                                        maxLength={6}
                                        required
                                        value={otpInput}
                                        onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, '').slice(0, 6))}
                                        placeholder="000000"
                                        className="touch-target w-full py-4 rounded-2xl bg-white border-2 border-slate-200 focus:border-clinical-500 text-center font-mono text-3xl font-extrabold tracking-[0.35em] text-slate-900 outline-none"
                                    />

                                    <button
                                        type="submit"
                                        disabled={isBusy || otpInput.length !== 6}
                                        className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 hover:from-clinical-600 hover:to-teal-700 disabled:opacity-50 text-white font-display font-bold text-base shadow-lg shadow-clinical-500/25"
                                    >
                                        {isBusy ? 'กำลังยืนยัน...' : 'ยืนยันเข้าสู่ห้องเรียน'}
                                    </button>
                                </form>
                            )}
                        </BentoCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 3: QUIZ (PRE-TEST & POST-TEST) ---
            if (screen === 'quiz') {
                const curQ = quiz.questions[quiz.idx];
                const totalQ = quiz.questions.length || 1;
                const answeredCount = Object.keys(quiz.answers).length;
                const isPre = quiz.type === 'pretest';

                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-3.5 sm:p-6 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-2xl p-5 sm:p-8 space-y-5">
                            <div className="flex items-center justify-between gap-2 pb-4 border-b border-slate-200/80">
                                <div>
                                    <span className={`px-2.5 py-0.5 rounded-full font-mono text-[10px] font-bold ${
                                        isPre ? 'bg-medical-100 text-medical-700' : 'bg-amber-100 text-amber-800'
                                    }`}>
                                        {isPre ? 'STEP 1/5 • PRE-TEST' : `STEP 4/5 • POST-TEST (เกณฑ์ผ่าน ≥ ${MIN_POSTTEST_PERCENT}%)`}
                                    </span>
                                    <h2 className="font-display text-lg sm:text-xl font-extrabold text-slate-900 mt-1">
                                        {isPre ? 'แบบทดสอบก่อนเรียน (Pre-test)' : 'แบบทดสอบหลังเรียน (Post-test)'}
                                    </h2>
                                </div>
                                <div className="px-3.5 py-2 rounded-2xl bg-slate-900 text-white font-mono text-sm font-bold flex items-center gap-1.5 shrink-0">
                                    <Icon name="Clock" size={15} className="text-clinical-400" />
                                    <span>{formatTimerMMSS(quiz.timeLeft)}</span>
                                </div>
                            </div>

                            <div className="space-y-1.5">
                                <div className="flex justify-between text-xs font-bold text-slate-500">
                                    <span>ข้อที่ {quiz.idx + 1} / {totalQ}</span>
                                    <span>ตอบแล้ว {answeredCount} ข้อ</span>
                                </div>
                                <div className="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                                    <div className="h-full bg-clinical-500 transition-all" style={{ width: `${Math.round(((quiz.idx + 1) / totalQ) * 100)}%` }} />
                                </div>
                            </div>

                            {curQ && (
                                <div className="space-y-4">
                                    <p className="font-display font-bold text-base sm:text-lg text-slate-900 leading-relaxed">
                                        {quiz.idx + 1}. {curQ.question}
                                    </p>
                                    <div className="space-y-2.5">
                                        {(curQ.options || []).map((opt, oIdx) => {
                                            const selected = quiz.answers[curQ.id] === oIdx;
                                            return (
                                                <button
                                                    key={oIdx}
                                                    type="button"
                                                    onClick={() => setQuiz(prev => ({ ...prev, answers: { ...prev.answers, [curQ.id]: oIdx } }))}
                                                    className={`touch-target w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 transition-all flex items-start gap-3 ${
                                                        selected
                                                            ? 'bg-clinical-50 border-clinical-500 text-clinical-900 font-bold shadow-sm'
                                                            : 'bg-white border-slate-200 hover:border-clinical-300 text-slate-700'
                                                    }`}
                                                >
                                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center font-mono text-xs font-bold shrink-0 mt-0.5 ${
                                                        selected ? 'bg-clinical-600 text-white' : 'bg-slate-100 text-slate-500'
                                                    }`}>
                                                        {String.fromCharCode(65 + oIdx)}
                                                    </span>
                                                    <span className="text-sm leading-relaxed">{opt}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            <div className="flex items-center justify-between gap-2.5 pt-3 border-t border-slate-200/80">
                                <button
                                    type="button"
                                    disabled={quiz.idx === 0}
                                    onClick={() => setQuiz(prev => ({ ...prev, idx: Math.max(0, prev.idx - 1) }))}
                                    className="touch-target px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 font-bold text-sm"
                                >
                                    ข้อก่อนหน้า
                                </button>

                                {quiz.idx < totalQ - 1 ? (
                                    <button
                                        type="button"
                                        onClick={() => setQuiz(prev => ({ ...prev, idx: Math.min(totalQ - 1, prev.idx + 1) }))}
                                        className="touch-target px-6 py-2.5 rounded-2xl bg-clinical-600 hover:bg-clinical-700 text-white font-display font-bold text-sm flex items-center gap-1.5"
                                    >
                                        ข้อถัดไป <Icon name="ArrowRight" size={16} />
                                    </button>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setConfirmDialog({
                                                open: true,
                                                title: 'ยืนยันการส่งคำตอบ',
                                                message: `คุณตอบคำถามแล้ว ${answeredCount}/${totalQ} ข้อ ต้องการส่งคำตอบและตรวจคะแนนเลยหรือไม่?`,
                                                confirmText: 'ส่งคำตอบ',
                                                onConfirm: () => handleFinishQuiz(quiz)
                                            });
                                        }}
                                        className="touch-target px-6 py-2.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 text-white font-display font-bold text-sm flex items-center gap-1.5 shadow-md"
                                    >
                                        <Icon name="Send" size={16} /> ส่งข้อสอบ
                                    </button>
                                )}
                            </div>
                        </BentoCard>
                        <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 4: PRE-TEST RESULT ---
            if (screen === 'quiz_result') {
                const totalQ = quiz.questions.length || 1;
                const pct = Math.round((quiz.score / totalQ) * 100);
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="aura-canvas" /><div className="aura-grid" />
                        <BentoCard className="relative z-10 w-full max-w-md p-6 sm:p-8 text-center space-y-5">
                            <div className="w-16 h-16 rounded-2xl bg-clinical-50 text-clinical-600 flex items-center justify-center mx-auto">
                                <Icon name="CheckCircle2" size={34} />
                            </div>
                            <div className="space-y-1">
                                <span className="px-3 py-1 rounded-full bg-clinical-100 text-clinical-700 font-mono text-xs font-bold">
                                    STEP 1 COMPLETE • PRE-TEST
                                </span>
                                <h2 className="font-display text-2xl font-extrabold text-slate-900">บันทึกคะแนนก่อนเรียนแล้วค่ะ</h2>
                            </div>
                            <div className="p-5 rounded-2xl bg-slate-50 border border-slate-200/80">
                                <p className="text-xs font-bold text-slate-500">คะแนน Pre-test ของคุณ</p>
                                <p className="font-mono text-4xl font-extrabold text-clinical-700 mt-1">
                                    {quiz.score}<span className="text-xl text-slate-400">/{totalQ}</span>
                                </p>
                                <p className="text-xs text-slate-500 mt-1">คิดเป็น {pct}% — ขั้นต่อไปสะสมเวลาเรียนให้ถึง {MIN_STUDY_PERCENT}% ค่ะ</p>
                            </div>
                            <button
                                type="button"
                                onClick={() => setScreen('dashboard')}
                                className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-clinical-500 to-teal-600 text-white font-display font-bold text-base shadow-lg shadow-clinical-500/25 flex items-center justify-center gap-2"
                            >
                                เข้าสู่ห้องเรียน (ขั้นที่ 2) <Icon name="ArrowRight" size={18} />
                            </button>
                        </BentoCard>
                        <ToastBanner toast={toast} />
                        {renderAdminPreviewBar()}
                    </div>
                );
            }

            // --- SCREEN 5: POST-TEST FAIL (< 80%) ---
            if (screen === 'quiz_fail') {
                const totalQ = quiz.questions.length || 1;
                const pct = Math.round((quiz.score / totalQ) * 100);
                return (
