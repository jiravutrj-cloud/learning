                                            <div className="flex items-center justify-between gap-2">
                                                <span className="text-xs font-bold text-accent-adaptive flex items-center gap-1.5">
                                                    <Icon name="ShieldCheck" size={16} /> ข้อมูลของท่านได้รับการคุ้มครองข้อมูลส่วนบุคคล PDPA
                                                </span>
                                                <button type="button" onClick={() => setPdpaModalOpen(true)} className="text-[11px] font-bold text-prism-adaptive hover:underline shrink-0">
                                                    อ่านนโยบาย
                                                </button>
                                            </div>
                                            <label className="flex items-start gap-2.5 cursor-pointer text-xs text-primary-adaptive leading-relaxed">
                                                <input type="checkbox" checked={pdpaAccepted} onChange={e => setPdpaAccepted(e.target.checked)} className="mt-0.5 w-4 h-4 accent-aurora-500 shrink-0" />
                                                <span>ข้าพเจ้ารับทราบและยินยอมให้จัดเก็บข้อมูลเพื่อการเรียน ตามนโยบาย PDPA</span>
                                            </label>
                                        </div>

                                        <button type="submit" disabled={authBusy || !pdpaAccepted} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังส่งรหัส OTP...' : 'ขอรหัสยืนยันตัวตน OTP 6 หลัก →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtp} className="space-y-4">
                                        <div>
                                            <h2 className="font-display text-lg font-extrabold text-primary-adaptive">กรอกรหัสยืนยันตัวตน OTP 6 หลัก</h2>
                                            <p className="text-xs text-secondary-adaptive mt-1">
                                                ส่งรหัสไปยังอีเมล <b className="font-mono text-prism-adaptive">{maskEmail(authForm.email)}</b> แล้วค่ะ
                                            </p>
                                        </div>
                                        {otpFallbackHint && (
                                            <div className="p-3 rounded-xl bg-amber-500/15 border border-amber-400/40 text-xs text-amber-300 font-bold text-center">
                                                รหัส OTP ยืนยันรอบนี้: <span className="font-mono text-base tracking-widest ml-1">{otpFallbackHint}</span>
                                            </div>
                                        )}
                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength="6"
                                            required
                                            value={otpInput}
                                            onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, ''))}
                                            placeholder="กรอกรหัส OTP 6 หลัก"
                                            className="touch-target spatial-input w-full px-4 py-3.5 rounded-2xl text-center font-mono text-2xl font-extrabold tracking-[0.4em]"
                                        />
                                        <button type="submit" disabled={authBusy || otpInput.length < 6} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 font-display font-extrabold text-sm">
                                            {authBusy ? 'กำลังยืนยัน...' : 'ยืนยัน OTP และเข้าสู่ระบบ'}
                                        </button>
                                        <button type="button" disabled={authBusy} onClick={requestOtpCode} className="touch-target spatial-soft w-full py-2.5 rounded-xl text-xs font-bold text-prism-adaptive">
                                            ส่งรหัส OTP อีกครั้ง
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ==================== SCREEN 3 & 4: PRE-TEST & POST-TEST ==================== */}
                    {(screen === 'pretest' || screen === 'posttest') && (
                        <main className="relative z-10 flex-1 w-full px-3.5 sm:px-6 py-6 pt-safe pb-safe">
                            <QuizEngine
                                mode={screen}
                                questions={activeQuestions}
                                onExit={screen === 'posttest' ? () => setScreen('dashboard') : null}
                                onJumpToLesson={(lid) => { setCurrentLessonId(lid); setActiveTab('lessons'); setScreen('dashboard'); }}
                                onComplete={async (res) => {
                                    if (screen === 'pretest') {
                                        await saveUserProgress({ pretest: res.scoreText, aiRoadmap: res.diagnosis }, { syncTelemetry: true });
                                        if (res.proceed) setScreen('dashboard');
                                    } else {
                                        const patch = { posttest: res.scoreText, aiRoadmap: res.diagnosis };
                                        if (res.passed) patch.status = 'ผ่าน';
                                        await saveUserProgress(patch, { syncTelemetry: true });
                                        if (res.proceed && res.passed) {
                                            setCertConfirmForm({ name: user?.name || '', nameEN: user?.nameEN || '', hospital: user?.hospital || '' });
                                            setScreen('cert_confirm');
                                        }
                                    }
                                }}
                            />
                        </main>
                    )}

                    {/* ==================== SCREEN 5: CLASSROOM DASHBOARD (5 MENUS — NO LEADERBOARD) ==================== */}
                    {screen === 'dashboard' && user && (
                        <div className="relative z-10 min-h-dvh flex flex-col pt-safe pb-dock-safe lg:pb-10">
                            <header className="sticky top-0 z-30 spatial-header no-print">
                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2 min-w-0">
                                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">
                                            <Icon name="HeartHandshake" size={18} />
                                        </div>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm text-primary-adaptive block leading-none truncate">
                                                rjcloud<span className="text-accent-adaptive">.organ</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">{user.name}</span>
                                        </div>
                                    </div>

                                    <div className="hidden lg:flex items-center gap-1">
                                        {navTabs.map(t => (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setActiveTab(t.id)}
                                                className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                    activeTab === t.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold shadow-sm' : 'text-secondary-adaptive hover:text-primary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={15} />
                                                <span>{t.label}</span>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>
                            </header>

                            <main className="flex-1 w-full max-w-7xl mx-auto px-3.5 sm:px-6 pt-4 space-y-5">
                                {/* 5-Step Progress Strip */}
                                <div className="spatial-card rounded-[1.5rem] p-3.5 sm:p-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                    <div className="spatial-soft p-2.5 rounded-xl">
                                        <span className="font-mono text-[10px] text-muted-adaptive block">1. PRE-TEST</span>
                                        <span className="font-mono font-extrabold text-accent-adaptive">{user.pretest || '-'}</span>
                                    </div>
                                    <div className="spatial-soft p-2.5 rounded-xl">
                                        <span className="font-mono text-[10px] text-muted-adaptive block">2. เรียน ≥ {MIN_STUDY_PERCENT}%</span>
                                        <span className="font-mono font-extrabold text-prism-adaptive">{liveStudyPercent}% ({formatStudyTime(user.studySeconds)})</span>
                                    </div>
                                    <a href="./aiskilllab.html" className={`p-2.5 rounded-xl border transition-all ${isStudyMet ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft opacity-75'}`}>
                                        <span className="font-mono text-[10px] text-muted-adaptive block">3. AI SKILL LAB 3D</span>
                                        <span className="font-display font-extrabold text-accent-adaptive">{isLabDone ? `ผ่าน (${user.skillLabBestScore || 85}) ✓` : isStudyMet ? 'เข้าฝึกเลย →' : 'ล็อก (<80%)'}</span>
                                    </a>
                                    <button
                                        type="button"
                                        disabled={!canTakePosttest}
                                        onClick={() => setScreen('posttest')}
                                        className={`text-left p-2.5 rounded-xl border transition-all ${canTakePosttest ? 'bg-prism-500/15 border-prism-400/40' : 'spatial-soft opacity-60'}`}
                                    >
                                        <span className="font-mono text-[10px] text-muted-adaptive block">4. POST-TEST ≥ {MIN_POSTTEST_PERCENT}%</span>
                                        <span className="font-display font-extrabold text-prism-adaptive">{isPostPassed ? `${user.posttest} ✓` : canTakePosttest ? 'เข้าสอบเลย →' : 'รอปลดล็อก'}</span>
                                    </button>
                                    <button
                                        type="button"
                                        disabled={!isPostPassed && !isAdminPreview}
                                        onClick={() => {
                                            setCertConfirmForm({ name: user.name || '', nameEN: user.nameEN || '', hospital: user.hospital || '' });
                                            setScreen(user.certificateClaimed ? 'certificate' : 'cert_confirm');
                                        }}
                                        className={`col-span-2 sm:col-span-1 text-left p-2.5 rounded-xl border transition-all ${isPostPassed ? 'bg-amber-500/15 border-amber-400/45' : 'spatial-soft opacity-60'}`}
                                    >
                                        <span className="font-mono text-[10px] text-muted-adaptive block">5. ประกาศฯ + CNEU</span>
                                        <span className="font-display font-extrabold text-amber-400">{user.certificateClaimed ? 'เปิดเอกสาร ✓' : isPostPassed ? 'กดรับเอกสาร →' : 'ยังไม่ปลดล็อก'}</span>
                                    </button>
                                </div>

                                {/* TAB 1: LESSONS + AI STUDY COMPANION */}
                                {activeTab === 'lessons' && activeLesson && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        <div className="lg:col-span-8 space-y-4">
                                            <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5">
                                                <div className="flex flex-wrap items-center justify-between gap-2">
                                                    <div>
                                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive">LESSON {activeLesson.id} / {lessons.length}</span>
                                                        <h2 className="font-display text-base sm:text-lg font-extrabold text-primary-adaptive">{activeLesson.title}</h2>
                                                    </div>
                                                    {activeLesson.documentUrl && (
                                                        <a href={activeLesson.documentUrl} target="_blank" rel="noreferrer" className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-accent-adaptive inline-flex items-center gap-1">
                                                            <Icon name="FileText" size={14} /> เอกสารบทเรียน
                                                        </a>
                                                    )}
                                                </div>
                                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                    <iframe
                                                        src={`https://drive.google.com/file/d/${activeLesson.videoId}/preview`}
                                                        className="absolute inset-0 w-full h-full border-0"
                                                        allow="autoplay; fullscreen"
                                                        allowFullScreen
                                                        title={activeLesson.title}
                                                    />
                                                </div>
                                            </div>

                                            <AiStudyCompanion lesson={activeLesson} user={user} appsScriptUrl={appsScriptUrl} onToast={showToast} />
                                        </div>

                                        <div className="lg:col-span-4 spatial-card rounded-[1.75rem] p-4 space-y-2.5 max-h-[680px] overflow-y-auto custom-scrollbar">
                                            <p className="font-display font-bold text-sm text-primary-adaptive px-1">รายชื่อบทเรียน ({lessons.length} บท)</p>
                                            {lessons.map(l => {
                                                const active = Number(l.id) === Number(currentLessonId);
                                                const recommended = (user?.aiRoadmap?.recommendedLessonIds || []).includes(Number(l.id));
                                                return (
                                                    <button
                                                        key={l.id}
                                                        type="button"
                                                        onClick={() => {
                                                            setCurrentLessonId(Number(l.id));
                                                            saveUserProgress({ lastVideoId: Number(l.id) }, { partialOnly: true });
                                                        }}
                                                        className={`w-full text-left p-3 rounded-2xl border text-xs transition-all flex items-start gap-2.5 ${
                                                            active ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'
                                                        }`}
                                                    >
                                                        <span className="font-mono font-extrabold text-prism-adaptive shrink-0">{String(l.id).padStart(2, '0')}</span>
                                                        <span className="leading-snug flex-1">{l.title}</span>
                                                        {recommended && <span className="text-amber-400 shrink-0" title="AI แนะนำให้เน้นทบทวน">★</span>}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* TAB 2: CLINICAL CASES */}
                                {activeTab === 'clinical_cases' && <ClinicalCaseSimulator />}

                                {/* TAB 3: FLASHCARDS */}
                                {activeTab === 'flashcards' && <SpacedFlashcardsDeck roadmap={user?.aiRoadmap} />}

                                {/* TAB 4: LIVE STREAM + CHECK-IN */}
                                {activeTab === 'live' && (
                                    <div className="max-w-4xl mx-auto spatial-card rounded-[1.75rem] p-5 sm:p-7 space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-rose-400 uppercase">LIVE BROADCAST • {String(liveConfig.status || 'offline').toUpperCase()}</span>
                                                <h2 className="font-display text-lg sm:text-xl font-extrabold text-primary-adaptive">{liveConfig.topic}</h2>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={handleLiveCheckIn}
                                                className={`touch-target px-4 py-2 rounded-xl font-display font-extrabold text-xs flex items-center gap-1.5 ${
                                                    user.liveCheckedIn
                                                        ? 'bg-aurora-500/20 border border-aurora-400/45 text-accent-adaptive'
                                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-md'
                                                }`}
                                            >
                                                <Icon name="CheckCircle2" size={15} />
                                                {user.liveCheckedIn ? 'เช็คอินเข้าเรียน Live แล้ว ✓' : 'เช็คอินยืนยันเข้าเรียน Live'}
                                            </button>
                                        </div>

                                        {liveConfig.url ? (
                                            <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allowFullScreen title="Live Broadcast" />
                                            </div>
                                        ) : (
                                            <div className="spatial-soft rounded-2xl p-10 text-center text-sm text-secondary-adaptive">
                                                ขณะนี้ยังไม่มีการถ่ายทอดสด สามารถกดเช็คอินหรือศึกษาบทเรียน 20 บทล่วงหน้าได้ตลอดเวลาค่ะ
                                            </div>
                                        )}

                                        {liveConfig.documentUrl && (
                                            <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="touch-target spatial-soft w-full py-3 rounded-2xl text-accent-adaptive font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
                                                <Icon name="FileText" size={16} /> เปิดเอกสารประกอบการบรรยายสด
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* TAB 5: PROFILE, 30-SEC WARM-UP & LOGOUT */}
                                {activeTab === 'profile' && (
                                    <div className="max-w-3xl mx-auto space-y-5">
                                        <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                            <div className="flex flex-wrap items-center justify-between gap-3">
                                                <div>
                                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">LEARNER PROFILE &amp; PORTFOLIO</span>
                                                    <h2 className="font-display text-xl font-extrabold text-primary-adaptive">{user.name}</h2>
                                                    <p className="text-xs sm:text-sm text-secondary-adaptive">{user.position} • {user.hospital} ({user.department})</p>
                                                </div>
                                                <span className="px-3 py-1 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-xs font-bold">
                                                    {user.userType || 'เรียนใหม่'}
                                                </span>
                                            </div>

                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center text-xs">
                                                <div className="spatial-soft p-3 rounded-xl"><span className="text-muted-adaptive block">Pre-test</span><b className="font-mono text-base text-primary-adaptive">{user.pretest || '-'}</b></div>
                                                <div className="spatial-soft p-3 rounded-xl"><span className="text-muted-adaptive block">เวลาเรียน</span><b className="font-mono text-base text-prism-adaptive">{liveStudyPercent}%</b></div>
                                                <div className="spatial-soft p-3 rounded-xl"><span className="text-muted-adaptive block">AI Skill Lab</span><b className="font-mono text-base text-accent-adaptive">{user.skillLabBestScore ?? (isLabDone ? 'ผ่าน' : '-')}</b></div>
                                                <div className="spatial-soft p-3 rounded-xl"><span className="text-muted-adaptive block">Post-test</span><b className="font-mono text-base text-amber-400">{user.posttest || '-'}</b></div>
                                            </div>
                                        </div>

                                        {/* โหมดอุ่นเครื่อง 30 วินาทีก่อนพบญาติจริง (PDPA Zero-PII Tags) */}
                                        <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-3.5 border-prism-400/30">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">PRE-APPROACH 30s WARM-UP • PDPA ZERO-PII</span>
                                                <h3 className="font-display font-bold text-base text-primary-adaptive">อุ่นเครื่อง 30 วิก่อนเข้าพบญาติจริง (ไม่ต้องระบุข้อมูลผู้ป่วย)</h3>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                                <div>
                                                    <label className="block font-bold text-secondary-adaptive mb-1">อารมณ์เบื้องต้นของครอบครัว</label>
                                                    <select value={warmupMood} onChange={e => setWarmupMood(e.target.value)} className="touch-target spatial-input w-full px-3 py-2 rounded-xl text-xs">
                                                        {PRE_APPROACH_TAGS.familyMoods.map(m => <option key={m} value={m}>{m}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block font-bold text-secondary-adaptive mb-1">ประเด็นที่คาดว่าญาติกังวล</label>
                                                    <select value={warmupConcern} onChange={e => setWarmupConcern(e.target.value)} className="touch-target spatial-input w-full px-3 py-2 rounded-xl text-xs">
                                                        {PRE_APPROACH_TAGS.concerns.map(c => <option key={c} value={c}>{c}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="p-3.5 rounded-2xl bg-aurora-500/10 border border-aurora-400/30 text-xs sm:text-sm text-primary-adaptive leading-relaxed">
                                                <b className="text-accent-adaptive">แนวทางเปิดบทสนทนาที่แนะนำ:</b> เตรียมพื้นที่เงียบสงบ (Setting) → สะท้อนความรู้สึกกรณี <b>“{warmupMood}”</b> → เว้นจังหวะเงียบ 2.5 วินาที → ให้ข้อมูลอย่างอ่อนโยนประเด็น <b>“{warmupConcern}”</b> โดยไม่เร่งรัดการตัดสินใจค่ะ
                                            </div>
                                        </div>

                                        <button
                                            type="button"
                                            onClick={handleLogout}
                                            className="touch-target w-full py-3.5 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-400/35 text-rose-400 font-display font-bold text-sm flex items-center justify-center gap-2"
                                        >
                                            <Icon name="LogOut" size={16} /> ออกจากระบบผู้เรียน
                                        </button>
                                    </div>
                                )}
                            </main>

                            {/* Mobile Bottom Dock (5 Menus — No Leaderboard) */}
                            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] no-print">
                                <div className="grid grid-cols-5 gap-1 max-w-xl mx-auto">
                                    {navTabs.map(t => {
                                        const active = activeTab === t.id;
                                        return (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => { setActiveTab(t.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all ${
                                                    active ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950' : 'text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={17} />
                                                <span className="truncate max-w-full px-0.5">{t.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </nav>
                        </div>
                    )}

                    {/* ==================== SCREEN 6: STEP 5 CONFIRM NAME & 5-DIMENSION CNEU CSAT ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <main className="relative z-10 flex-1 w-full max-w-2xl mx-auto px-3.5 sm:px-6 py-6 pt-safe pb-safe">
                            <form onSubmit={handleIssueCertificate} className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex items-center justify-between gap-2">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1">
                                        <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                    </button>
                                    <span className="font-mono text-xs font-bold text-accent-adaptive">STEP 05 • CERTIFICATE &amp; CNEU</span>
                                </div>

                                <div>
                                    <h2 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ยืนยันชื่อ–นามสกุลและประเมินความพึงพอใจ</h2>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">ตรวจสอบตัวสะกดก่อนออกใบประกาศนียบัตรและหนังสือรับรองหน่วยคะแนน CNEU ({cneuConfig.cneuCredits} หน่วยคะแนน)</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">คำนำหน้า ชื่อ–นามสกุล (ไทย) *</label>
                                        <input type="text" required value={certConfirmForm.name} onChange={e => setCertConfirmForm(p => ({ ...p, name: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">ชื่อ–นามสกุล (ภาษาอังกฤษ — ไม่บังคับ)</label>
                                        <input type="text" value={certConfirmForm.nameEN} onChange={e => setCertConfirmForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="e.g. Kanyarat Watthanakul, RN" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1">โรงพยาบาล / หน่วยงานต้นสังกัด *</label>
                                        <input type="text" required value={certConfirmForm.hospital} onChange={e => setCertConfirmForm(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-xl text-sm" />
                                    </div>
                                </div>

                                <div className="spatial-soft p-4 rounded-2xl space-y-3">
                                    <p className="font-display font-bold text-sm text-primary-adaptive">แบบประเมินความพึงพอใจรายด้าน (มาตรฐาน CNEU 5 ด้าน)</p>
                                    {CNEU_EVAL_CRITERIA.map(item => (
                                        <div key={item.key} className="p-3 rounded-xl spatial-soft flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <div>
                                                <p className="text-xs font-bold text-primary-adaptive">{item.title}</p>
                                                <p className="text-[11px] text-muted-adaptive">{item.desc}</p>
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(star => (
                                                    <button
                                                        key={star}
                                                        type="button"
                                                        onClick={() => setEvalCriteria(p => ({ ...p, [item.key]: star }))}
                                                        className="p-1"
                                                        title={CSAT_RATING_LABELS[star]}
                                                    >
                                                        <Icon name="Star" size={20} className={star <= evalCriteria[item.key] ? 'text-amber-400 fill-amber-400' : 'text-slate-500'} />
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <textarea
                                        rows="2"
                                        value={evalComment}
                                        onChange={e => setEvalComment(e.target.value)}
                                        placeholder="ข้อเสนอแนะเพิ่มเติมสำหรับทีมพัฒนาหลักสูตร (ไม่บังคับ)..."
                                        className="spatial-input w-full p-3 rounded-xl text-xs sm:text-sm"
                                    />
                                </div>

                                <button type="submit" className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg">
                                    <Icon name="Award" size={18} /> ยืนยันและออกประกาศนียบัตร + ใบรับรอง CNEU
                                </button>
                            </form>
                        </main>
                    )}

                    {/* ==================== SCREEN 7: DUAL DOCUMENTS (CERTIFICATE + INDIVIDUAL CNEU) ==================== */}
                    {screen === 'certificate' && user && (
                        <main className="cneu-print-container relative z-10 flex-1 w-full max-w-5xl mx-auto px-3.5 sm:px-6 py-6 pt-safe pb-safe space-y-5">
                            <div className="spatial-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 no-print">
                                <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive flex items-center gap-1.5">
                                    <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                </button>
                                <div className="inline-flex p-1 rounded-xl spatial-soft text-xs font-bold">
                                    <button type="button" onClick={() => setCertDocTab('certificate')} className={`px-3.5 py-1.5 rounded-lg ${certDocTab === 'certificate' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>
                                        1. ใบประกาศนียบัตร
                                    </button>
                                    <button type="button" onClick={() => setCertDocTab('cneu_letter')} className={`px-3.5 py-1.5 rounded-lg ${certDocTab === 'cneu_letter' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>
                                        2. หนังสือรับรอง CNEU (A4)
                                    </button>
                                </div>
                            </div>

                            {certDocTab === 'certificate' ? (
                                <div className="spatial-card rounded-[2rem] p-4 sm:p-6 space-y-4">
                                    <div className="w-full aspect-[1.414/1] rounded-2xl overflow-hidden bg-white border border-amber-400/40 shadow-2xl">
                                        <canvas ref={certCanvasRef} className="w-full h-full object-contain block" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 no-print">
                                        <button type="button" onClick={handleDownloadCertPdf} className="touch-target py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2">
                                            <Icon name="FileDown" size={16} /> ดาวน์โหลด PDF
                                        </button>
                                        <button type="button" onClick={handleDownloadCertPng} className="touch-target spatial-soft py-3 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2">
                                            <Icon name="Image" size={16} className="text-accent-adaptive" /> บันทึกภาพ PNG
                                        </button>
                                        <a href={verifyUrl} target="_blank" rel="noreferrer" className="touch-target spatial-soft py-3 rounded-2xl text-prism-adaptive font-display font-bold text-sm flex items-center justify-center gap-2">
                                            <Icon name="QrCode" size={16} /> เปิดหน้าตรวจ QR
                                        </a>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex justify-end no-print">
                                        <button type="button" onClick={handlePrintCneu} className="touch-target px-5 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center gap-2">
                                            <Icon name="Printer" size={16} /> พิมพ์ / บันทึก PDF (A4)
                                        </button>
                                    </div>
                                    <IndividualCneuLetter user={user} cneuConfig={cneuConfig} verifyUrl={verifyUrl} />
                                </div>
                            )}
                        </main>
                    )}

                    <PdpaPolicyModal open={pdpaModalOpen} onClose={() => setPdpaModalOpen(false)} />
                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
