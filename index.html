            const dashboardTabs = [
                { id: 'lessons', label: 'บทเรียน + AI', shortLabel: 'บทเรียน', icon: 'BookOpen' },
                { id: 'clinical_cases', label: 'เคสคลินิก', shortLabel: 'เคสคลินิก', icon: 'Stethoscope' },
                { id: 'flashcards', label: 'Flashcards', shortLabel: 'การ์ดจำ', icon: 'Layers' },
                { id: 'live', label: 'Live สด', shortLabel: 'Live สด', icon: 'Radio' },
                { id: 'profile', label: 'โปรไฟล์ & Warm-up', shortLabel: 'โปรไฟล์', icon: 'User' }
            ];

            // ============================================================================
            // 7. RENDER SCREENS (7 FULL SCREENS)
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* ==================== SCREEN 1: LANDING PAGE ==================== */}
                    {screen === 'landing' && (
                        <div className="relative z-10 flex-1 flex flex-col">
                            <header className="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-md">
                                        <Icon name="HeartPulse" size={19} />
                                    </div>
                                    <div>
                                        <span className="font-display font-extrabold text-base text-primary-adaptive block leading-none">
                                            rjcloud<span className="text-accent-adaptive">.organ</span>
                                        </span>
                                        <span className="font-mono text-[10px] text-muted-adaptive">{CONFIG.edition}</span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <a href="./verify.html" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-secondary-adaptive hover:text-primary-adaptive hidden sm:inline-flex items-center gap-1.5">
                                        <Icon name="QrCode" size={14} className="text-prism-adaptive" /> ตรวจ QR
                                    </a>
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                </div>
                            </header>

                            <main className="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-8 flex flex-col items-center justify-center text-center gap-6 sm:gap-8">
                                {/* ตัวอย่างที่ 1: ขยายภาพต้นไม้ Rajavithi Hospital ให้ใหญ่และโดดเด่นขึ้นชัดเจน */}
                                <div className="w-full max-w-lg sm:max-w-xl mx-auto rounded-[2rem] bg-white px-5 py-4 sm:px-8 sm:py-5 shadow-2xl border border-white/80 flex items-center justify-center">
                                    <img
                                        src={CONFIG.heroBannerUrl}
                                        alt="Rajavithi Hospital — COE Organ Transplantation Cloud"
                                        className="w-full max-h-56 sm:max-h-64 md:max-h-72 object-contain mx-auto select-none"
                                    />
                                </div>

                                <div className="space-y-3 max-w-3xl">
                                    <h1 className="font-display text-2xl sm:text-4xl md:text-5xl font-extrabold text-primary-adaptive leading-tight">
                                        ยกระดับทักษะการรับบริจาคและปลูกถ่ายอวัยวะ{' '}
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-aurora-400 to-prism-400">สู่มาตรฐานปี 2027</span>
                                    </h1>
                                    <p className="text-sm sm:text-base text-secondary-adaptive max-w-2xl mx-auto leading-relaxed">
                                        ผสาน <b>AI Study Companion</b> วิเคราะห์จุดอ่อนและช่วยทบทวนตลอด 20 บทเรียน, ฝึกสื่อสารกับญาติใน <b>AI Skill Lab 3 มิติ</b> และออกประกาศนียบัตรพร้อม QR Code ทันทีเมื่อผ่านเกณฑ์
                                    </p>
                                </div>

                                <div className="flex flex-wrap items-center justify-center gap-3">
                                    <button
                                        type="button"
                                        onClick={() => { setAuthStep(1); setScreen('auth'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className="touch-target px-8 py-4 rounded-full bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 text-void-950 font-display font-extrabold text-base shadow-xl shadow-aurora-500/25 active:scale-95 transition-all"
                                    >
                                        เข้าสู่ระบบ / ลงทะเบียนเรียน →
                                    </button>
                                </div>

                                {/* 5-STEP AI-GUIDED PATHWAY */}
                                <section className="w-full spatial-card rounded-[2rem] p-5 sm:p-6 space-y-4">
                                    <p className="font-mono text-xs font-bold text-prism-adaptive tracking-wider uppercase">
                                        5-STEP AI-GUIDED PATHWAY สู่ประกาศนียบัตรอิเล็กทรอนิกส์
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 text-center">
                                        {[
                                            { step: 'STEP 01', icon: 'ClipboardCheck', title: 'Pre-test + AI Map', desc: 'วิเคราะห์จุดอ่อน 4 หมวด และจัดแผนรายบุคคล' },
                                            { step: 'STEP 02', icon: 'BookOpen', title: `เรียน ≥ ${MIN_STUDY_PERCENT}% + AI`, desc: '20 บทเรียน AI สรุป 1 นาที & ถาม-ตอบสด' },
                                            { step: 'STEP 03', icon: 'Bot', title: 'AI Skill Lab 3D', desc: 'ฝึกสื่อสารกับญาติ 3 มิติ จับความเงียบ 2.5 วิ' },
                                            { step: 'STEP 04', icon: 'FileCheck2', title: `Post-test ≥ ${MIN_POSTTEST_PERCENT}%`, desc: 'ทดสอบหลังเรียนพร้อม AI ทบทวนจุดพลาด' },
                                            { step: 'STEP 05', icon: 'Award', title: 'ประกาศนียบัตร', desc: 'รับ PDF / PNG พร้อม QR ยืนยันคุณวุฒิทันที' }
                                        ].map(item => (
                                            <div key={item.step} className="spatial-soft rounded-2xl p-4 flex flex-col items-center gap-2">
                                                <div className="w-10 h-10 rounded-xl bg-aurora-500/15 text-accent-adaptive flex items-center justify-center">
                                                    <Icon name={item.icon} size={20} />
                                                </div>
                                                <span className="font-mono text-[10px] font-bold text-muted-adaptive">{item.step}</span>
                                                <h3 className="font-display font-bold text-sm text-primary-adaptive leading-snug">{item.title}</h3>
                                                <p className="text-xs text-secondary-adaptive leading-relaxed">{item.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </main>

                            <footer className="w-full max-w-5xl mx-auto px-4 py-5 flex flex-wrap items-center justify-center gap-4 text-xs text-muted-adaptive">
                                <a href="./verify.html" className="hover:text-accent-adaptive font-bold">ตรวจสอบ QR Code</a>
                                <span>•</span>
                                <a href="./executive.html" className="hover:text-prism-adaptive font-bold">แดชบอร์ดผู้บริหาร (PDPA Zero-PII)</a>
                                <span>•</span>
                                <a href="./admin.html" className="hover:text-primary-adaptive font-bold">ผู้ดูแลระบบ</a>
                                <span>•</span>
                                <button type="button" onClick={() => setPdpaModalOpen(true)} className="hover:text-accent-adaptive font-bold underline">นโยบาย PDPA</button>
                            </footer>
                        </div>
                    )}

                    {/* ==================== SCREEN 2: AUTH WIZARD (3 STEPS + PDPA + EMAIL OTP) ==================== */}
                    {screen === 'auth' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4 py-8">
                            <div className="spatial-card w-full max-w-lg rounded-[2rem] p-5 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (authStep > 1) {
                                                if (authStep === 3) { setGeneratedOtp(''); setOtpInput(''); }
                                                setAuthStep(s => s - 1);
                                            } else {
                                                setScreen('landing');
                                            }
                                        }}
                                        className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5"
                                    >
                                        <Icon name="ArrowLeft" size={14} /> ย้อนกลับ
                                    </button>
                                    <span className="font-mono text-xs font-bold text-prism-adaptive">STEP {authStep} / 3</span>
                                </div>

                                {authStep === 1 && (
                                    <form onSubmit={handleCheckLicense} className="space-y-4">
                                        <div>
                                            <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">เข้าสู่ระบบ / ลงทะเบียนเรียน</h1>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">กรอกเลขที่ใบอนุญาตประกอบวิชาชีพเพื่อดึงประวัติเดิมอัตโนมัติ (ไม่ใช้เลขบัตรประชาชน)</p>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-secondary-adaptive mb-1.5 ml-1">เลขที่ใบอนุญาตประกอบวิชาชีพ *</label>
                                            <input
                                                type="text"
                                                required
                                                value={authForm.license}
                                                onChange={e => setAuthForm(p => ({ ...p, license: e.target.value }))}
                                                placeholder="เช่น 6501234567"
                                                className="touch-target spatial-input w-full px-4 py-3 rounded-2xl font-mono text-base font-bold"
                                            />
                                        </div>
                                        <button type="submit" disabled={authBusy} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                            {authBusy ? 'กำลังตรวจสอบฐานข้อมูล...' : 'ตรวจสอบและดำเนินการต่อ →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 2 && (
                                    <form onSubmit={handleRequestOtp} className="space-y-3.5">
                                        <div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">ยืนยันข้อมูลผู้เรียนและรับรหัส OTP</h2>
                                            <p className="text-xs text-secondary-adaptive">เลขที่ใบอนุญาต: <span className="font-mono font-bold text-prism-adaptive">{authForm.license}</span></p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div className="sm:col-span-2">
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">คำนำหน้า ชื่อ – นามสกุล *</label>
                                                <input type="text" required value={authForm.name} onChange={e => setAuthForm(p => ({ ...p, name: e.target.value }))} placeholder="เช่น พว.ใจดี มีเมตตา" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ตำแหน่ง</label>
                                                <input type="text" value={authForm.position} onChange={e => setAuthForm(p => ({ ...p, position: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ประเภทการเรียน</label>
                                                <select value={authForm.userType} onChange={e => setAuthForm(p => ({ ...p, userType: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm font-bold">
                                                    <option value="เรียนใหม่">เรียนใหม่</option>
                                                    <option value="เรียนต่อเนื่อง">เรียนต่อเนื่อง</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">สังกัด / เขตสุขภาพ</label>
                                                <select
                                                    value={authForm.department}
                                                    onChange={e => {
                                                        const dep = e.target.value;
                                                        const firstHosp = (HOSPITAL_MAPPING[dep] || [])[0];
                                                        setAuthForm(p => ({ ...p, department: dep, hospital: firstHosp?.name || p.hospital, province: firstHosp?.prov || p.province }));
                                                    }}
                                                    className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm"
                                                >
                                                    {Object.keys(HOSPITAL_MAPPING).map(k => <option key={k} value={k}>{k}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">โรงพยาบาล / หน่วยงาน</label>
                                                <input type="text" value={authForm.hospital} onChange={e => setAuthForm(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                            </div>
                                            <div className="sm:col-span-2">
                                                <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ลักษณะงาน / แผนก (สำหรับปรับมุมมองผู้ช่วย AI)</label>
                                                <select value={authForm.workContext || 'ICU / ER / OR'} onChange={e => setAuthForm(p => ({ ...p, workContext: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm">
                                                    <option value="ICU / ER / OR">หอผู้ป่วยวิกฤต / ห้องฉุกเฉิน / ห้องผ่าตัด (ICU / ER / OR)</option>
                                                    <option value="ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)">ทีมรับบริจาคและปลูกถ่ายอวัยวะ (TC)</option>
                                                    <option value="หอผู้ป่วยทั่วไป / คลินิก">หอผู้ป่วยทั่วไป / คลินิกเฉพาะทาง</option>
                                                    <option value="ผู้สนใจศึกษาทั่วไป">ผู้สนใจศึกษาทั่วไป</option>
                                                </select>
                                            </div>
                                        </div>

                                        {/* PDPA Pre-OTP Lock: บัญชีเดิมที่มีอีเมลแล้วจะไม่เปิดเผยหรือให้แก้ไขอีเมลก่อนยืนยัน OTP */}
                                        {isExistingAccount && existingRegisteredEmail ? (
                                            <div className="spatial-soft p-3.5 rounded-2xl space-y-1 text-xs">
                                                <span className="font-bold text-accent-adaptive flex items-center gap-1.5">
                                                    <Icon name="Lock" size={13} /> ส่ง OTP ไปยังอีเมลที่ลงทะเบียนไว้ (ปกปิดตามหลัก PDPA)
                                                </span>
                                                <p className="font-mono text-primary-adaptive font-bold">
                                                    {maskEmail(existingRegisteredEmail)} {authForm.phone ? `• ${maskPhone(authForm.phone)}` : ''}
                                                </p>
                                                <p className="text-[11px] text-muted-adaptive leading-snug">
                                                    เพื่อป้องกันการสวมสิทธิ์ สามารถแก้ไขข้อมูลติดต่อได้ในเมนู <b>โปรไฟล์ &amp; Warm-up</b> หลังยืนยัน OTP แล้ว หรือติดต่อ {CONFIG.contactEmail}
                                                </p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">อีเมล (สำหรับรับรหัส OTP) *</label>
                                                    <input type="email" required value={authForm.email} onChange={e => setAuthForm(p => ({ ...p, email: e.target.value }))} placeholder="name@hospital.go.th" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">เบอร์โทรศัพท์</label>
                                                    <input type="tel" value={authForm.phone} onChange={e => setAuthForm(p => ({ ...p, phone: e.target.value }))} placeholder="08xxxxxxxx" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                                </div>
                                            </div>
                                        )}

                                        {/* เงื่อนไข PDPA: ผู้เรียนใหม่ต้องติ๊กยินยอมครั้งแรก ส่วนบัญชีเดิมที่เคยยินยอมแล้วไม่ต้องติ๊กซ้ำ */}
                                        {needsPdpaCheckbox ? (
                                            <div className="p-3.5 rounded-2xl bg-aurora-500/10 border border-aurora-400/35 space-y-2">
                                                <p className="text-xs font-bold text-primary-adaptive leading-relaxed">
                                                    ข้อมูลของท่านได้รับการคุ้มครองข้อมูลส่วนบุคคล PDPA ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562
                                                </p>
                                                <label className="flex items-start gap-2.5 cursor-pointer text-xs text-secondary-adaptive">
                                                    <input type="checkbox" checked={pdpaAgreed} onChange={e => setPdpaAgreed(e.target.checked)} className="w-4 h-4 mt-0.5 accent-aurora-500 shrink-0" />
                                                    <span>
                                                        ข้าพเจ้ายินยอมให้จัดเก็บข้อมูลที่จำเป็นต่อการเรียนและออกประกาศนียบัตรตาม{' '}
                                                        <button type="button" onClick={() => setPdpaModalOpen(true)} className="text-prism-adaptive font-bold underline">นโยบาย PDPA</button>
                                                    </span>
                                                </label>
                                            </div>
                                        ) : (
                                            <div className="px-3.5 py-2.5 rounded-2xl bg-aurora-500/10 border border-aurora-400/30 flex items-center justify-between gap-2 text-xs">
                                                <span className="text-accent-adaptive font-bold flex items-center gap-1.5">
                                                    <Icon name="ShieldCheck" size={15} /> ผู้เรียนต่อเนื่อง / ยืนยัน PDPA เรียบร้อยแล้ว
                                                </span>
                                                <button type="button" onClick={() => setPdpaModalOpen(true)} className="text-prism-adaptive font-bold underline shrink-0">อ่านนโยบาย</button>
                                            </div>
                                        )}

                                        <button type="submit" disabled={authBusy || (needsPdpaCheckbox && !pdpaAgreed)} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                            {authBusy ? 'กำลังส่งรหัส OTP ทางอีเมล...' : 'ขอรหัส OTP 6 หลักทางอีเมล →'}
                                        </button>
                                    </form>
                                )}

                                {authStep === 3 && (
                                    <form onSubmit={handleVerifyOtp} className="space-y-4">
                                        <div>
                                            <h2 className="font-display text-xl font-extrabold text-primary-adaptive">กรอกรหัสยืนยันตัวตน OTP 6 หลัก</h2>
                                            <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">
                                                ส่งรหัสไปยังอีเมล <span className="font-mono font-bold text-prism-adaptive">{maskEmail(authForm.email)}</span> แล้วค่ะ
                                            </p>
                                            <p className="text-xs text-muted-adaptive mt-1">หากไม่พบในกล่องขาเข้า กรุณาตรวจสอบโฟลเดอร์อีเมลขยะ (Spam/Junk)</p>
                                        </div>

                                        {/* ลบกล่องตัวอย่างรหัส OTP ออก 100% + ปรับช่องกรอกไม่ให้ภาษาไทยยืดห่าง */}
                                        <input
                                            type="text"
                                            inputMode="numeric"
                                            maxLength={6}
                                            required
                                            value={otpInput}
                                            onChange={e => setOtpInput(e.target.value.replace(/[^0-9]/g, '').slice(0, 6))}
                                            placeholder="กรอกรหัส OTP 6 หลักจากอีเมล"
                                            className={`touch-target spatial-input w-full px-4 py-3.5 rounded-2xl text-center font-bold transition-all ${
                                                otpInput ? 'font-mono text-2xl tracking-[0.45em]' : 'font-sans text-base tracking-normal'
                                            }`}
                                        />

                                        <button type="submit" disabled={otpInput.length < 6} className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-45 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                            ยืนยัน OTP และเข้าสู่ระบบ
                                        </button>

                                        <button
                                            type="button"
                                            disabled={authBusy || otpCooldown > 0}
                                            onClick={() => handleRequestOtp()}
                                            className="touch-target spatial-soft w-full py-3 rounded-2xl text-prism-adaptive font-display font-bold text-xs disabled:opacity-50"
                                        >
                                            {otpCooldown > 0 ? `ส่งรหัส OTP อีกครั้งได้ใน ${otpCooldown} วินาที` : 'ส่งรหัส OTP อีกครั้ง'}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ==================== SCREEN 3 & 4: PRE-TEST / POST-TEST ==================== */}
                    {screen === 'pretest' && (
                        <div className="relative z-10 flex-1">
                            <QuizEngine mode="pretest" questions={activeQuizQuestions} onComplete={handlePretestComplete} onExit={() => setScreen('dashboard')} />
                        </div>
                    )}
                    {screen === 'posttest' && (
                        <div className="relative z-10 flex-1">
                            <QuizEngine mode="posttest" questions={activeQuizQuestions} onComplete={handlePosttestComplete} onExit={() => setScreen('dashboard')} />
                        </div>
                    )}

                    {/* ==================== SCREEN 5: MAIN CLASSROOM DASHBOARD (5 MENUS) ==================== */}
                    {screen === 'dashboard' && user && (
                        <div className="relative z-10 flex-1 flex flex-col pb-dock-safe lg:pb-10">
                            {/* Top Header (โครงสร้าง Selector ตรงกับ ai-interactive.js 100%) */}
                            <header className="sticky top-0 z-30 spatial-header no-print">
                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">
                                            <Icon name="HeartPulse" size={18} />
                                        </div>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                rjcloud<span className="text-accent-adaptive">.organ</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">{user.name} • {liveStudyPercent}%</span>
                                        </div>
                                    </div>

                                    {/* Desktop 5 Menus (matches header .lg:flex button:nth-child(1..5)) */}
                                    <div className="hidden lg:flex items-center gap-1.5">
                                        {dashboardTabs.map(t => (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => setActiveTab(t.id)}
                                                className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                                    activeTab === t.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={15} /> {t.label}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Right Actions (matches header .max-w-7xl > div:last-child) */}
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>
                            </header>

                            <main className="w-full max-w-7xl mx-auto px-3.5 sm:px-6 pt-4 md:pt-6 space-y-5">
                                {/* First Child inside <main>: 5-Step Progress Strip (matches main > div:first-child) */}
                                <div className="spatial-card rounded-[1.5rem] p-3.5 sm:p-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                                    <button type="button" onClick={() => setScreen('pretest')} className={`p-2.5 rounded-xl border text-left ${hasDonePretest ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">1. PRE-TEST</span>
                                        <span className="font-bold text-primary-adaptive">{hasDonePretest ? `เสร็จแล้ว (${user.pretest})` : 'เริ่มทำ Pre-test →'}</span>
                                    </button>
                                    <button type="button" onClick={() => setActiveTab('lessons')} className={`p-2.5 rounded-xl border text-left ${isStudyHoursMet ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}>
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">2. เวลาเรียน ≥ {MIN_STUDY_PERCENT}%</span>
                                        <span className="font-mono font-bold text-accent-adaptive">{liveStudyPercent}% ({formatStudyTime(studySeconds)})</span>
                                    </button>
                                    <a
                                        href={hasDonePretest && isStudyHoursMet ? './aiskilllab.html' : '#'}
                                        onClick={e => { if (!isAdminPreview && (!hasDonePretest || !isStudyHoursMet)) { e.preventDefault(); showToast(`กรุณาทำ Pre-test และสะสมเวลาเรียนครบ ${MIN_STUDY_PERCENT}% ก่อนเข้า AI Skill Lab ค่ะ`, 'info'); } }}
                                        className={`p-2.5 rounded-xl border text-left block ${isSkillLabDone ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">3. AI SKILL LAB</span>
                                        <span className="font-bold text-prism-adaptive">{isSkillLabDone ? `ผ่านแล้ว (${user.skillLabBestScore || '✓'})` : 'เข้าห้องฝึก 3 มิติ →'}</span>
                                    </a>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (!isPosttestUnlocked) { showToast('กรุณาผ่านเวลาเรียน ≥ 80% และ AI Skill Lab ก่อนทำ Post-test ค่ะ', 'info'); return; }
                                            setScreen('posttest');
                                        }}
                                        className={`p-2.5 rounded-xl border text-left ${isPosttestPassed ? 'bg-aurora-500/15 border-aurora-400/40' : 'spatial-soft'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">4. POST-TEST ≥ {MIN_POSTTEST_PERCENT}%</span>
                                        <span className="font-bold text-primary-adaptive">{isPosttestPassed ? `ผ่าน (${user.posttest})` : isPosttestUnlocked ? 'เข้าสอบ Post-test →' : 'ยังไม่ปลดล็อก'}</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (!isPosttestPassed && !isAdminPreview) { showToast('สอบผ่าน Post-test ≥ 80% เพื่อรับประกาศนียบัตรค่ะ', 'info'); return; }
                                            setScreen(user.certificateCode ? 'certificate' : 'cert_confirm');
                                        }}
                                        className={`col-span-2 sm:col-span-1 p-2.5 rounded-xl border text-left ${user.certificateCode ? 'bg-amber-500/20 border-amber-400/45' : 'spatial-soft'}`}
                                    >
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">5. ประกาศฯ &amp; CNEU</span>
                                        <span className="font-bold text-amber-400">{user.certificateCode ? 'เปิดใบประกาศฯ →' : isPosttestPassed ? 'กดรับเอกสาร →' : 'รอผ่านเกณฑ์'}</span>
                                    </button>
                                </div>

                                {/* TAB 1: LESSONS + AI STUDY COMPANION */}
                                {activeTab === 'lessons' && activeLesson && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        {/* Left Column (8 cols — target for ai-interactive.js Smart Resume 20-lesson panel) */}
                                        <div className="lg:col-span-8 space-y-4">
                                            <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5">
                                                <div className="flex flex-wrap items-start justify-between gap-2">
                                                    <div>
                                                        <span className="px-2.5 py-0.5 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[10px] font-bold">
                                                            บทที่ {activeLesson.id} / {lessons.length}
                                                        </span>
                                                        <h1 className="font-display text-base sm:text-xl font-extrabold text-primary-adaptive mt-1">{activeLesson.title}</h1>
                                                    </div>
                                                    {activeLesson.documentUrl && (
                                                        <a href={activeLesson.documentUrl} target="_blank" rel="noreferrer" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5 shrink-0">
                                                            <Icon name="FileText" size={14} /> เอกสารประกอบ
                                                        </a>
                                                    )}
                                                </div>

                                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                    {activeLesson.videoId ? (
                                                        <iframe
                                                            src={`https://drive.google.com/file/d/${activeLesson.videoId}/preview`}
                                                            className="absolute inset-0 w-full h-full border-0"
                                                            allow="autoplay; fullscreen"
                                                            allowFullScreen
                                                            title={activeLesson.title}
                                                        />
                                                    ) : (
                                                        <div className="absolute inset-0 flex items-center justify-center text-sm text-muted-adaptive">ยังไม่มีลิงก์วิดีโอในบทเรียนนี้</div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <h2 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">รายชื่อบทเรียนทั้งหมด ({lessons.length} บท)</h2>
                                                    <span className="text-xs text-amber-400 font-bold">★ แนะนำจาก AI Roadmap</span>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto custom-scrollbar pr-1">
                                                    {lessons.map(l => {
                                                        const active = Number(l.id) === Number(activeLesson.id);
                                                        const rec = recommendedLessonIds.has(Number(l.id));
                                                        return (
                                                            <button
                                                                key={l.id}
                                                                type="button"
                                                                onClick={() => { setCurrentLessonId(Number(l.id)); saveUserProgress({ lastVideoId: Number(l.id) }, { partialOnly: true }); }}
                                                                className={`text-left p-3 rounded-xl border text-xs transition-all flex items-start gap-2 ${
                                                                    active ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive font-bold' : 'spatial-soft text-secondary-adaptive'
                                                                }`}
                                                            >
                                                                <span className="font-mono font-bold text-accent-adaptive shrink-0">{l.id}.</span>
                                                                <span className="flex-1 leading-snug">{l.title}</span>
                                                                {rec && <span className="text-amber-400 shrink-0" title="AI แนะนำทบทวน">★</span>}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Right Column (4 cols): AI Study Companion */}
                                        <div className="lg:col-span-4">
                                            <AiStudyCompanion lesson={activeLesson} user={user} appsScriptUrl={appsScriptUrl} showToast={showToast} />
                                        </div>
                                    </div>
                                )}

                                {/* TAB 2: CLINICAL CASES */}
                                {activeTab === 'clinical_cases' && <ClinicalCaseSimulator />}

                                {/* TAB 3: FLASHCARDS */}
                                {activeTab === 'flashcards' && <SpacedFlashcardsDeck aiRoadmap={user.aiRoadmap} />}

                                {/* TAB 4: LIVE STREAM + CHECK-IN */}
                                {activeTab === 'live' && (
                                    <div className="max-w-4xl mx-auto spatial-card rounded-[1.75rem] p-5 sm:p-7 space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div>
                                                <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-mono text-xs font-bold ${
                                                    liveConfig.status === 'live' ? 'bg-rose-500/20 text-rose-400' : liveConfig.status === 'paused' ? 'bg-amber-500/20 text-amber-400' : 'spatial-soft text-muted-adaptive'
                                                }`}>
                                                    {liveConfig.status === 'live' ? '🔴 กำลังถ่ายทอดสด' : liveConfig.status === 'paused' ? '⏸️ พักเบรก' : '⚫ ออฟไลน์'}
                                                </span>
                                                <h2 className="font-display text-lg sm:text-2xl font-extrabold text-primary-adaptive mt-1.5">{liveConfig.topic}</h2>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={handleLiveCheckIn}
                                                className="touch-target px-4 py-2.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-xs flex items-center gap-1.5 shadow-md"
                                            >
                                                <Icon name="CheckCircle2" size={16} />
                                                {user.liveCheckInAt ? 'เช็คอินเข้าเรียนแล้ว ✓' : 'เช็คอินยืนยันเข้าเรียน Live'}
                                            </button>
                                        </div>

                                        {liveConfig.url ? (
                                            <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                                <iframe src={liveConfig.url} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen" allowFullScreen title="Live Broadcast" />
                                            </div>
                                        ) : (
                                            <div className="spatial-soft rounded-2xl p-10 text-center space-y-2">
                                                <Icon name="Radio" size={32} className="mx-auto text-muted-adaptive" />
                                                <p className="text-sm font-bold text-primary-adaptive">ยังไม่มีลิงก์ถ่ายทอดสดในขณะนี้</p>
                                                <p className="text-xs text-muted-adaptive">สามารถศึกษาวิดีโอ 20 บทเรียนและฝึกใน AI Skill Lab ระหว่างรอการบรรยายสดได้เลยค่ะ</p>
                                            </div>
                                        )}

                                        {liveConfig.documentUrl && (
                                            <a href={liveConfig.documentUrl} target="_blank" rel="noreferrer" className="touch-target spatial-soft w-full py-3 rounded-2xl text-prism-adaptive font-bold text-sm flex items-center justify-center gap-2">
                                                <Icon name="FileText" size={16} /> ดาวน์โหลดเอกสารประกอบการบรรยายสด
                                            </a>
                                        )}
                                    </div>
                                )}

                                {/* TAB 5: PROFILE, PRE-APPROACH WARM-UP & PDPA SELF-SERVICE */}
                                {activeTab === 'profile' && (
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                        {/* Left 6 cols: Profile Summary + PDPA Self-Service (ตรวจสอบ แก้ไข ลบข้อมูลส่วนตัว) */}
                                        <div className="lg:col-span-6 space-y-4">
                                            <div className="spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div>
                                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">LEARNER PROFILE &amp; PORTFOLIO</span>
                                                        <h2 className="font-display text-xl font-extrabold text-primary-adaptive mt-0.5">{user.name}</h2>
                                                        <p className="text-xs text-secondary-adaptive">{user.position} • {user.hospital} ({user.department})</p>
                                                        <p className="font-mono text-xs text-prism-adaptive mt-0.5">เลขใบอนุญาต: {user.license || user.id} • {user.userType}</p>
                                                    </div>
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${isPosttestPassed ? 'bg-aurora-500/20 text-accent-adaptive' : 'spatial-soft text-amber-400'}`}>
                                                        {isPosttestPassed ? 'ผ่านหลักสูตร ✓' : 'กำลังเรียน'}
                                                    </span>
                                                </div>

                                                <div className="grid grid-cols-3 gap-2 text-center">
                                                    <div className="spatial-soft p-3 rounded-2xl">
                                                        <span className="text-[10px] text-muted-adaptive block">Pre-test</span>
                                                        <span className="font-mono text-sm font-extrabold text-primary-adaptive">{user.pretest || '-'}</span>
                                                    </div>
                                                    <div className="spatial-soft p-3 rounded-2xl">
                                                        <span className="text-[10px] text-muted-adaptive block">AI Skill Lab</span>
                                                        <span className="font-mono text-sm font-extrabold text-prism-adaptive">{user.skillLabBestScore ? `${user.skillLabBestScore}/100` : (isSkillLabDone ? 'ผ่าน ✓' : '-')}</span>
                                                    </div>
                                                    <div className="spatial-soft p-3 rounded-2xl">
                                                        <span className="text-[10px] text-muted-adaptive block">Post-test</span>
                                                        <span className="font-mono text-sm font-extrabold text-accent-adaptive">{user.posttest || '-'}</span>
                                                    </div>
                                                </div>

                                                {(isPosttestPassed || isAdminPreview) && (
                                                    <button
                                                        type="button"
                                                        onClick={() => setScreen(user.certificateCode ? 'certificate' : 'cert_confirm')}
                                                        className="touch-target w-full py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2"
                                                    >
                                                        <Icon name="Award" size={17} /> เปิดใบประกาศนียบัตร &amp; หนังสือรับรอง CNEU
                                                    </button>
                                                )}

                                                {/* สิทธิ์เจ้าของข้อมูลส่วนบุคคล (PDPA Self-Service — ตรงตามนโยบายข้อ 4) */}
                                                <div className="pt-3 border-t border-white/10 space-y-3">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <div>
                                                            <p className="font-display font-bold text-sm text-primary-adaptive flex items-center gap-1.5">
                                                                <Icon name="ShieldCheck" size={16} className="text-accent-adaptive" /> จัดการข้อมูลส่วนบุคคล (PDPA)
                                                            </p>
                                                            <p className="text-xs text-muted-adaptive">ตรวจสอบ แก้ไข หรือลบข้อมูลส่วนตัวของคุณได้ตลอดเวลา</p>
                                                        </div>
                                                        <button type="button" onClick={() => setPdpaModalOpen(true)} className="text-xs font-bold text-prism-adaptive underline shrink-0">อ่านนโยบาย</button>
                                                    </div>

                                                    {!pdpaEditOpen ? (
                                                        <div className="spatial-soft p-3.5 rounded-2xl space-y-2 text-xs text-secondary-adaptive">
                                                            <p><b>สังกัด / จังหวัด:</b> {user.department || '-'} {user.province ? `• จ.${user.province}` : ''}</p>
                                                            <p><b>อีเมล:</b> <span className="font-mono">{user.email || '-'}</span></p>
                                                            <p><b>เบอร์โทรศัพท์:</b> <span className="font-mono">{user.phone || '-'}</span></p>
                                                            <div className="pt-2">
                                                                <button type="button" onClick={handleOpenPdpaEdit} className="touch-target spatial-soft w-full py-2.5 rounded-xl font-bold text-prism-adaptive flex items-center justify-center gap-1.5">
                                                                    <Icon name="Edit3" size={14} /> ตรวจสอบ / แก้ไขข้อมูลส่วนตัว
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <form onSubmit={handleSavePdpaEdit} className="spatial-soft p-4 rounded-2xl space-y-2.5 text-xs">
                                                            <input type="text" required value={pdpaForm.name} onChange={e => setPdpaForm(p => ({ ...p, name: e.target.value }))} placeholder="ชื่อ–สกุล" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                            <div className="grid grid-cols-2 gap-2">
                                                                <input type="text" value={pdpaForm.position} onChange={e => setPdpaForm(p => ({ ...p, position: e.target.value }))} placeholder="ตำแหน่ง" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <select value={pdpaForm.department} onChange={e => setPdpaForm(p => ({ ...p, department: e.target.value }))} className="spatial-input w-full px-3 py-2 rounded-xl">
                                                                    {Object.keys(HOSPITAL_MAPPING).map(k => <option key={k} value={k}>{k}</option>)}
                                                                </select>
                                                                <input type="text" value={pdpaForm.hospital} onChange={e => setPdpaForm(p => ({ ...p, hospital: e.target.value }))} placeholder="โรงพยาบาล" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <input type="text" value={pdpaForm.province} onChange={e => setPdpaForm(p => ({ ...p, province: e.target.value }))} placeholder="จังหวัด" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <input type="email" value={pdpaForm.email} onChange={e => setPdpaForm(p => ({ ...p, email: e.target.value }))} placeholder="อีเมล" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                                <input type="tel" value={pdpaForm.phone} onChange={e => setPdpaForm(p => ({ ...p, phone: e.target.value }))} placeholder="เบอร์โทรศัพท์" className="spatial-input w-full px-3 py-2 rounded-xl" />
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-2 pt-1">
                                                                <button type="button" onClick={() => setPdpaEditOpen(false)} className="spatial-soft py-2 rounded-xl font-bold text-secondary-adaptive">ยกเลิก</button>
                                                                <button type="submit" className="py-2 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold">บันทึกการแก้ไข</button>
                                                            </div>
                                                        </form>
                                                    )}
                                                </div>

                                                {/* ปุ่มออกจากระบบผู้เรียน: โทนสีกลางสุภาพ ไม่ใช้สีแดง เพื่อไม่ให้สับสนกับการลบข้อมูล */}
                                                <button
                                                    id="btn-learner-logout"
                                                    type="button"
                                                    onClick={handleLogout}
                                                    className="touch-target spatial-soft w-full py-3 px-4 rounded-2xl border-slate-400/40 hover:border-prism-400/50 text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2 transition-all"
                                                >
                                                    <Icon name="LogOut" size={16} className="text-secondary-adaptive" />
                                                    <span>ออกจากระบบผู้เรียน</span>
                                                    <span className="text-[11px] font-sans font-normal text-muted-adaptive hidden sm:inline">(ข้อมูลไม่หาย)</span>
                                                </button>

                                                {/* โซนลบข้อมูลถาวร (Danger Zone): พับเก็บไว้ด้านล่างสุดแยกขาดจากปุ่มออกจากระบบ */}
                                                <div className="pt-2 border-t border-dashed border-slate-500/25">
                                                    <button
                                                        type="button"
                                                        onClick={() => setPdpaDangerOpen(v => !v)}
                                                        className="w-full py-1.5 text-xs font-semibold text-muted-adaptive hover:text-red-500 flex items-center justify-between gap-2 transition-colors"
                                                    >
                                                        <span className="flex items-center gap-1.5">
                                                            <Icon name="AlertTriangle" size={13} className="text-red-400" />
                                                            สิทธิ PDPA: ขอลบข้อมูลส่วนบุคคลถาวร (Danger Zone)
                                                        </span>
                                                        <Icon name={pdpaDangerOpen ? 'ChevronUp' : 'ChevronDown'} size={15} />
                                                    </button>

                                                    {pdpaDangerOpen && (
                                                        <div className="mt-2.5 p-3.5 rounded-2xl bg-red-600/10 border border-red-500/40 space-y-2.5">
                                                            <p className="text-xs text-red-500 dark:text-red-300 leading-relaxed">
                                                                <b>คำเตือน:</b> ปุ่มนี้จะลบบัญชี ประวัติการเรียน และข้อมูลส่วนตัวของคุณออกจากระบบ <b>อย่างถาวร</b> (หากต้องการแค่พักการเรียนชั่วคราว ให้กดปุ่ม <b>“ออกจากระบบผู้เรียน”</b> ด้านบนแทนค่ะ)
                                                            </p>
                                                            <button
                                                                type="button"
                                                                onClick={handleDeletePersonalData}
                                                                className="touch-target w-full py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-display font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-colors"
                                                            >
                                                                <Icon name="Trash2" size={14} /> ยืนยันลบข้อมูลส่วนบุคคลถาวร
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Right 6 cols: โหมดอุ่นเครื่อง 30 วิก่อนพบญาติจริง (PDPA Zero-PII) */}
                                        <div className="lg:col-span-6 spatial-card rounded-[1.75rem] p-5 sm:p-6 space-y-4">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">PDPA ZERO-PII • PRE-APPROACH WARM-UP</span>
                                                <h2 className="font-display text-lg font-extrabold text-primary-adaptive mt-0.5">โหมดอุ่นเครื่อง 30 วิก่อนพบญาติจริง</h2>
                                                <p className="text-xs text-secondary-adaptive">เลือกบริบทด้วยปุ่มกดเท่านั้น (ไม่พิมพ์ชื่อหรือ HN ผู้ป่วยจริง) เพื่อให้ AI เตรียมประโยคเปิดใจ</p>
                                            </div>

                                            {[
                                                { key: 'age', label: 'ช่วงอายุผู้ป่วย', opts: PRE_APPROACH_TAGS.ageGroups },
                                                { key: 'cause', label: 'สาเหตุการเสียชีวิต', opts: PRE_APPROACH_TAGS.causes },
                                                { key: 'mood', label: 'อารมณ์ครอบครัวเบื้องต้น', opts: PRE_APPROACH_TAGS.familyMoods },
                                                { key: 'concern', label: 'ข้อกังวลหลักของญาติ', opts: PRE_APPROACH_TAGS.concerns }
                                            ].map(grp => (
                                                <div key={grp.key} className="space-y-1.5">
                                                    <p className="text-xs font-bold text-secondary-adaptive">{grp.label}</p>
                                                    <div className="flex flex-wrap gap-1.5">
                                                        {(grp.opts || []).map(opt => (
                                                            <button
                                                                key={opt}
                                                                type="button"
                                                                onClick={() => setWarmupTags(p => ({ ...p, [grp.key]: opt }))}
                                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${warmupTags[grp.key] === opt ? 'bg-aurora-500/20 border-aurora-400 text-accent-adaptive' : 'spatial-soft text-secondary-adaptive'}`}
                                                            >
                                                                {opt}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}

                                            <button type="button" onClick={handleGenerateWarmup} className="touch-target w-full py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm">
                                                สร้างเช็กลิสต์และประโยคอุ่นเครื่อง 30 วิ →
                                            </button>

                                            {warmupResult && (
                                                <div className="spatial-soft p-4 rounded-2xl text-xs sm:text-sm text-primary-adaptive whitespace-pre-line leading-relaxed border-aurora-400/35">
                                                    {warmupResult}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </main>

                            {/* Mobile Bottom Dock (5 Menus — matches nav button:nth-child(1..5)) */}
                            <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-2 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] no-print">
                                <div className="grid grid-cols-5 gap-1 max-w-xl mx-auto">
                                    {dashboardTabs.map(t => {
                                        const active = activeTab === t.id;
                                        return (
                                            <button
                                                key={t.id}
                                                type="button"
                                                onClick={() => { setActiveTab(t.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[10px] font-bold transition-all ${
                                                    active ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950' : 'text-secondary-adaptive'
                                                }`}
                                            >
                                                <Icon name={t.icon} size={17} />
                                                <span className="truncate max-w-full px-0.5">{t.shortLabel}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </nav>
                        </div>
                    )}

                    {/* ==================== SCREEN 6: STEP 05 — CERT CONFIRM + CNEU 5-DIM CSAT ==================== */}
                    {screen === 'cert_confirm' && user && (
                        <div className="relative z-10 flex-1 max-w-2xl w-full mx-auto px-3.5 sm:px-6 py-6">
                            <form onSubmit={handleIssueCertificate} className="spatial-card rounded-[2rem] p-5 sm:p-8 space-y-5">
                                <div className="flex items-center justify-between">
                                    <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5">
                                        <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                    </button>
                                    <span className="font-mono text-xs font-bold text-accent-adaptive">STEP 05 • CERTIFICATE &amp; CNEU</span>
                                </div>

                                <div>
                                    <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">ยืนยันชื่อและประเมินความพึงพอใจ 5 ด้าน</h1>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive mt-1">เพื่อออกใบประกาศนียบัตรและหนังสือรับรองหน่วยคะแนน CNEU ({cneuConfig.cneuCredits} หน่วยคะแนน)</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ชื่อ – นามสกุล (ไทย) *</label>
                                        <input type="text" required value={certForm.name} onChange={e => setCertForm(p => ({ ...p, name: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">ชื่อ – นามสกุล (อังกฤษ • ไม่บังคับ)</label>
                                        <input type="text" value={certForm.nameEN} onChange={e => setCertForm(p => ({ ...p, nameEN: e.target.value }))} placeholder="เช่น Kanyarat Wattanakul, RN" className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                    <div className="sm:col-span-2">
                                        <label className="block text-xs font-bold text-secondary-adaptive mb-1 ml-1">โรงพยาบาล / หน่วยงานต้นสังกัด *</label>
                                        <input type="text" required value={certForm.hospital} onChange={e => setCertForm(p => ({ ...p, hospital: e.target.value }))} className="touch-target spatial-input w-full px-3.5 py-2.5 rounded-2xl text-sm" />
                                    </div>
                                </div>

                                <div className="spatial-soft p-4 rounded-2xl space-y-3">
                                    <div className="flex items-center justify-between gap-2 pb-2 border-b border-white/10">
                                        <p className="font-display font-bold text-sm text-primary-adaptive">แบบประเมินความพึงพอใจ (มาตรฐาน CNEU)</p>
                                        <span className="font-mono text-sm font-extrabold text-accent-adaptive">เฉลี่ย {avgCsatPreview} / 5.00</span>
                                    </div>
                                    {CNEU_EVAL_CRITERIA.map(item => (
                                        <div key={item.key} className="p-3 rounded-xl spatial-soft flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <div className="flex-1">
                                                <p className="text-xs font-bold text-primary-adaptive">{item.title}</p>
                                                <p className="text-[11px] text-muted-adaptive">{item.desc}</p>
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(st => (
                                                    <button key={st} type="button" onClick={() => setEvalCriteria(p => ({ ...p, [item.key]: st }))} className="p-0.5">
                                                        <Icon name="Star" size={22} className={st <= evalCriteria[item.key] ? 'text-amber-400 fill-amber-400' : 'text-slate-500/60'} />
                                                    </button>
                                                ))}
                                                <span className="font-mono text-[10px] font-bold text-amber-400 ml-1">{CSAT_RATING_LABELS[evalCriteria[item.key]]}</span>
                                            </div>
                                        </div>
                                    ))}
                                    <textarea rows="2" value={certForm.comment} onChange={e => setCertForm(p => ({ ...p, comment: e.target.value }))} placeholder="ข้อเสนอแนะเพิ่มเติม (ไม่บังคับ)..." className="spatial-input w-full p-3 rounded-xl text-xs" />
                                </div>

                                <button type="submit" className="touch-target w-full py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm shadow-lg">
                                    ยืนยันและออกประกาศนียบัตร + ใบรับรอง CNEU →
                                </button>
                            </form>
                        </div>
                    )}

                    {/* ==================== SCREEN 7: DUAL CERTIFICATE + INDIVIDUAL CNEU LETTER ==================== */}
                    {screen === 'certificate' && user && (
                        <div className="relative z-10 flex-1 max-w-5xl w-full mx-auto px-3.5 sm:px-6 py-6 space-y-5 cneu-print-container">
                            <div className="spatial-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 no-print hide-when-printing-cneu">
                                <button type="button" onClick={() => setScreen('dashboard')} className="spatial-soft px-3.5 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5">
                                    <Icon name="ArrowLeft" size={14} /> กลับห้องเรียน
                                </button>
                                <div className="inline-flex p-1 rounded-xl spatial-soft text-xs font-bold">
                                    <button type="button" onClick={() => setCertSubView('cert')} className={`px-3.5 py-1.5 rounded-lg ${certSubView === 'cert' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>
                                        1. ใบประกาศนียบัตร
                                    </button>
                                    <button type="button" onClick={() => setCertSubView('cneu')} className={`px-3.5 py-1.5 rounded-lg ${certSubView === 'cneu' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>
                                        2. หนังสือรับรอง CNEU (A4)
                                    </button>
                                </div>
                                <a href={verifyUrl} target="_blank" rel="noreferrer" className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5">
                                    <Icon name="QrCode" size={14} /> หน้าตรวจ QR
                                </a>
                            </div>

                            {certSubView === 'cert' ? (
                                <div className="space-y-4">
                                    <div className="spatial-card rounded-[1.75rem] p-3 sm:p-5">
                                        <canvas ref={certCanvasRef} className="w-full h-auto rounded-xl bg-white shadow-xl block" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 no-print">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const res = typeof CERT.downloadCanvasAsPdf === 'function' ? CERT.downloadCanvasAsPdf(certCanvasRef.current, user.certificateCode) : { ok: false };
                                                showToast(res.ok ? `ดาวน์โหลดใบประกาศนียบัตร (${res.format.toUpperCase()}) เรียบร้อยแล้วค่ะ` : 'ไม่สามารถสร้างไฟล์ได้ กรุณาลองใหม่ค่ะ', res.ok ? 'success' : 'error');
                                            }}
                                            className="touch-target py-3.5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                        >
                                            <Icon name="FileDown" size={18} /> ดาวน์โหลดประกาศนียบัตร (PDF)
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const ok = typeof CERT.downloadCanvasAsPng === 'function' ? CERT.downloadCanvasAsPng(certCanvasRef.current, user.certificateCode) : false;
                                                showToast(ok ? 'บันทึกรูปภาพประกาศนียบัตร (PNG) เรียบร้อยแล้วค่ะ' : 'ไม่สามารถบันทึกรูปได้ค่ะ', ok ? 'success' : 'error');
                                            }}
                                            className="touch-target spatial-card py-3.5 rounded-2xl text-primary-adaptive font-display font-bold text-sm flex items-center justify-center gap-2"
                                        >
                                            <Icon name="Image" size={18} className="text-prism-adaptive" /> บันทึกเป็นรูปภาพ (PNG)
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex justify-end no-print hide-when-printing-cneu">
                                        <button
                                            type="button"
                                            onClick={() => (typeof CERT.printIndividualCneuLetter === 'function' ? CERT.printIndividualCneuLetter() : window.print())}
                                            className="touch-target px-5 py-3 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center gap-2 shadow-lg"
                                        >
                                            <Icon name="Printer" size={17} /> พิมพ์ / บันทึก PDF หนังสือรับรอง CNEU
                                        </button>
                                    </div>
                                    <IndividualCneuLetter user={user} cneuConfig={cneuConfig} certTemplate={certTemplate} verifyUrl={verifyUrl} />
                                </div>
                            )}
                        </div>
                    )}

                    <PdpaPolicyModal open={pdpaModalOpen} onClose={() => setPdpaModalOpen(false)} />
                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
    </script>
</body>
</html>
