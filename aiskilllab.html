        window.addEventListener('pointerup', release, { once: true });

        function mountBloomingPeachStage(container, initOpts = {}) {
            if (!container) {
                return { setBloomProgress: () => {}, triggerQiSurge: () => {}, setStormEnabled: () => {}, triggerLightning: () => {}, destroy: () => {} };
            }

            const canvas = document.createElement('canvas');
            canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;';
            container.innerHTML = '';
            container.appendChild(canvas);

            let externalCtrl = null;
            let fallbackRaf = null;
            let pollTimer = null;
            let disposed = false;

            let desiredBloom = typeof initOpts.initialBloom === 'number' ? initOpts.initialBloom : 0.06;
            let desiredStorm = initOpts.stormEnabled !== false;
            let pendingSurge = false;

            const startExternalEngine = () => {
                if (disposed || externalCtrl) return true;
                if (window.RJCLOUD_HERO_PEACH && typeof window.RJCLOUD_HERO_PEACH.mount === 'function') {
                    if (fallbackRaf) { cancelAnimationFrame(fallbackRaf); fallbackRaf = null; }
                    externalCtrl = window.RJCLOUD_HERO_PEACH.mount({
                        stage: container,
                        canvas: canvas,
                        bgCanvas: canvas,
                        initialBloom: desiredBloom,
                        stormEnabled: desiredStorm
                    });
                    if (externalCtrl && typeof externalCtrl.setBloomProgress === 'function') {
                        externalCtrl.setBloomProgress(desiredBloom);
                    }
                    if (pendingSurge && externalCtrl && typeof externalCtrl.triggerQiSurge === 'function') {
                        externalCtrl.triggerQiSurge();
                        pendingSurge = false;
                    }
                    return true;
                }
                return false;
            };

            // Fallback soft moonlit peach silhouette (only runs if hero-peach-engine.js is unavailable in isolated sandbox)
            const startFallbackRenderer = () => {
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                let curBloom = desiredBloom;
                let qiBoost = 0;
                let lastTs = performance.now();

                const resizeFallback = () => {
                    const r = container.getBoundingClientRect();
                    if (r.width <= 0 || r.height <= 0) return;
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = Math.round(r.width * dpr);
                    canvas.height = Math.round(r.height * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                };
                resizeFallback();

                const blossomPts = Array.from({ length: 68 }, (_, i) => {
                    const ang = (i / 68) * Math.PI * 2 + (i % 5) * 0.25;
                    const rad = 0.14 + ((i * 37) % 100) / 155;
                    return {
                        lx: -0.06 + Math.cos(ang) * rad * 1.15,
                        ly: -0.44 + Math.sin(ang) * rad * 0.62,
                        r: 12 + (i % 6) * 4,
                        order: (i * 19 % 68) / 68,
                        ph: i * 0.7
                    };
                });

                    if (disposed || externalCtrl) return;
                    fallbackRaf = requestAnimationFrame(tick);

                    const t = now * 0.001;
                    const W = container.clientWidth || window.innerWidth;
                    const H = container.clientHeight || window.innerHeight;
                    curBloom += (desiredBloom - curBloom) * (1 - Math.exp(-dt * 2.0));
                    if (pendingSurge) { qiBoost = 1; pendingSurge = false; }
                    qiBoost = Math.max(0, qiBoost - dt * 0.55);

                    ctx.clearRect(0, 0, W, H);
                    const g = ctx.createLinearGradient(0, 0, 0, H);
                    g.addColorStop(0, '#020612'); g.addColorStop(0.54, '#132d54'); g.addColorStop(1, '#040a18');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

                    // Moon
                    const mx = W * 0.19, my = H * 0.16;
                    const mg = ctx.createRadialGradient(mx, my, 8, mx, my, 92);
                    mg.addColorStop(0, 'rgba(240,249,255,0.85)'); mg.addColorStop(0.45, 'rgba(186,230,253,0.22)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 92, 0, Math.PI * 2); ctx.fill();

                    // Cliff & Trunk
                    ctx.fillStyle = '#071324';
                    ctx.beginPath();
                    ctx.moveTo(W * 0.28, H); ctx.lineTo(W * 0.30, H * 0.55); ctx.lineTo(W, H * 0.52); ctx.lineTo(W, H); ctx.closePath();
                    ctx.fill();

                    const rx = W * 0.50, ry = H * 0.54, S = Math.min(W * 0.44, H * 0.48);
                    ctx.strokeStyle = '#1f1529'; ctx.lineWidth = Math.max(10, S * 0.055); ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(rx + 0.03 * S, ry); ctx.quadraticCurveTo(rx - 0.05 * S, ry - 0.2 * S, rx - 0.1 * S, ry - 0.36 * S); ctx.stroke();

                    if (qiBoost > 0.02) {
                        ctx.save(); ctx.globalCompositeOperation = 'lighter';
                        ctx.strokeStyle = `rgba(253,224,71,${(0.75 * qiBoost).toFixed(2)})`;
                        ctx.lineWidth = 4;
                        ctx.beginPath(); ctx.moveTo(rx + 0.03 * S, ry); ctx.quadraticCurveTo(rx - 0.05 * S, ry - 0.2 * S, rx - 0.1 * S, ry - 0.36 * S); ctx.stroke();
                        ctx.restore();
                    }

                    // Progressive blossoms
                    for (let i = 0; i < blossomPts.length; i++) {
                        const b = blossomPts[i];
                        const vis = Math.max(0, Math.min(1, (curBloom - b.order * 0.85) / 0.18));
                        if (vis <= 0.01) continue;
                        const bx = rx + b.lx * S + Math.sin(t + b.ph) * 2.5;
                        const by = ry + b.ly * S + Math.cos(t * 0.8 + b.ph) * 1.6;
                        const br = b.r * (0.4 + 0.6 * vis) * (1 + qiBoost * 0.15);
                        const bg = ctx.createRadialGradient(bx, by, 1, bx, by, br);
                        bg.addColorStop(0, `rgba(255,244,250,${(0.92 * vis).toFixed(2)})`);
                        bg.addColorStop(0.55, `rgba(249,168,212,${(0.68 * vis).toFixed(2)})`);
                        bg.addColorStop(1, 'rgba(244,114,182,0)');
                        ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
                    }
                };
                fallbackRaf = requestAnimationFrame(tick);
            };

            if (!startExternalEngine()) {
                let tries = 0;
                pollTimer = setInterval(() => {
                    tries += 1;
                    if (startExternalEngine()) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    } else if (tries >= 18) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        startFallbackRenderer();
                    }
                }, 120);
            }

            return {
                setBloomProgress: (ratio) => {
                    desiredBloom = Math.max(0.05, Math.min(1, Number(ratio) || 0.05));
                    if (externalCtrl && typeof externalCtrl.setBloomProgress === 'function') {
                        externalCtrl.setBloomProgress(desiredBloom);
                    }
                },
                triggerQiSurge: () => {
                    if (externalCtrl && typeof externalCtrl.triggerQiSurge === 'function') {
                        externalCtrl.triggerQiSurge();
                    } else {
                        pendingSurge = true;
                    }
                },
                setStormEnabled: (enabled) => {
                    desiredStorm = Boolean(enabled);
                    if (externalCtrl && typeof externalCtrl.setStormEnabled === 'function') {
                        externalCtrl.setStormEnabled(desiredStorm);
                    }
                },
                triggerLightning: () => {
                    if (externalCtrl && typeof externalCtrl.triggerLightning === 'function') {
                        externalCtrl.triggerLightning();
                    }
                },
                destroy: () => {
                    disposed = true;
                    if (pollTimer) clearInterval(pollTimer);
                    if (fallbackRaf) cancelAnimationFrame(fallbackRaf);
                    if (externalCtrl && typeof externalCtrl.destroy === 'function') {
                        externalCtrl.destroy();
                    }
                }
            };
        }

        function FiveAxisRadarSVG({ radarArr, theme }) {
            const isDark = theme === 'dark';
            const w = 320, h = 255, cx = w / 2, cy = h / 2, maxR = 72;
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / RADAR_AXES.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const valOf = (key) => {
                const f = (radarArr || []).find(r => r.key === key);
                return Math.max(0, Math.min(100, Number(f?.value || 0)));
            };
            const dataPts = RADAR_AXES.map((a, i) => pt(i, valOf(a.key) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[330px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor={isDark ? '#5eead4' : '#247870'} stopOpacity="0.42" />
                            <stop offset="100%" stopColor={isDark ? '#fda4af' : '#d9486b'} stopOpacity="0.24" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={RADAR_AXES.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(201,214,230,0.24)' : 'rgba(71,88,107,0.20)'} strokeWidth="1" />
                    ))}
                    {RADAR_AXES.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(201,214,230,0.22)' : 'rgba(71,88,107,0.16)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke={isDark ? '#5eead4' : '#247870'} strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.8" fill={isDark ? '#fda4af' : '#d9486b'} stroke={isDark ? '#1c222b' : '#e6ebf0'} strokeWidth="1.5" />
                    ))}
                    {RADAR_AXES.map((a, i) => {
                        const [lx, ly] = pt(i, 1.38);
                        return (
                            <g key={a.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#f4f7fb' : '#1f2b38'} fontSize="9.5" fontWeight="700">{a.shortTH}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#5eead4' : '#247870'} fontSize="10.5" fontFamily="JetBrains Mono, monospace" fontWeight="700">{valOf(a.key)}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

                    let sum = 0;
                    for (let i = 0; i < buf.length; i++) { const n = (buf[i] - 128) / 128; sum += n * n; }
                    const rms = Math.sqrt(sum / buf.length);
                    return rms < 0.012 ? 0 : Math.min(1, (rms - 0.012) * 7.2);
                } catch (_) { return -1; }

                            setSilenceCount(c => c + 1);
                            setTrustScore(t => Math.min(100, t + 6));
                            showToast('✓ เว้นความเงียบเยียวยา 2.5 วินาทีสำเร็จ! ญาติรู้สึกปลอดภัยและเปิดใจมากขึ้นค่ะ');
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 850);
            };

            const handleToggleMic = async () => {
                if (isRecordingMic) {
                    setIsRecordingMic(false);
                    if (speechRecRef.current) { try { speechRecRef.current.stop(); } catch (_) {} }
                    if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') { try { mediaRecRef.current.stop(); } catch (_) {} }
                    return;
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง สามารถพิมพ์ข้อความโต้ตอบได้ทันทีค่ะ', 'info');
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micChunksRef.current = [];
                    micStartTsRef.current = Date.now();
                    const mr = new MediaRecorder(stream);
                    mr.ondataavailable = (ev) => { if (ev.data.size > 0) micChunksRef.current.push(ev.data); };
                    mr.onstop = () => {
                        stream.getTracks().forEach(t => t.stop());
                        const blob = new Blob(micChunksRef.current, { type: 'audio/webm' });
                        const dur = Math.max(1, Math.round((Date.now() - micStartTsRef.current) / 1000));
                        setLearnerVoiceClips(prev => [...prev.slice(-4), { audioUrl: URL.createObjectURL(blob), durationSec: dur }]);
                    };
                    mr.start();
                    mediaRecRef.current = mr;

                    const rec = new SR();
                    rec.lang = 'th-TH';
                    rec.interimResults = false;
                    rec.onresult = (ev) => {
                        const transcript = ev.results?.[0]?.[0]?.transcript || '';
                        if (transcript) setInputText(prev => (prev ? `${prev} ${transcript}` : transcript));
                    };
                    rec.onerror = () => setIsRecordingMic(false);
                    rec.onend = () => {
                        setIsRecordingMic(false);
                        if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') { try { mediaRecRef.current.stop(); } catch (_) {} }
                    };
                    speechRecRef.current = rec;
                    rec.start();
                    setIsRecordingMic(true);
                    showToast('🎙️ กำลังรับเสียงพูดของท่าน (บันทึกเฉพาะใน RAM เพื่อฟังย้อนหลัง • PDPA 100%)', 'info');
                } catch (_) {
                    showToast('ไม่ได้รับสิทธิ์ไมโครโฟน สามารถพิมพ์หรือเลือกแนวทางคำพูดแทนได้ค่ะ', 'error');
                }
            };

            const handleSendMessage = async (e, overrideText = null) => {
                if (e) e.preventDefault();
                const txt = String(overrideText ?? inputText).trim();
                if (!txt || isAiThinking || finalDecision) return;

                setInputText('');
                setHintBanner('');
                stopStudioVoice();

                const stepObj = TEN_STEPS[stepIdx];
                const lowTxt = txt.toLowerCase();
                const hitTriggers = TRIGGER_WORDS.filter(w => lowTxt.includes(w.toLowerCase()));
                const nextTriggerTotal = triggerTotal + hitTriggers.length;
                if (hitTriggers.length > 0) {
                    setTriggerTotal(nextTriggerTotal);
                    showToast(`⚠️ พบคำที่อาจกระทบจิตใจ (${hitTriggers.join(', ')}) แนะนำหลีกเลี่ยงในสถานการณ์จริงค่ะ`, 'error');
                }

                const hitKeywords = (stepObj.keywords || []).filter(k => lowTxt.includes(k.toLowerCase()));
                const isStepMatched = hitTriggers.length === 0 && (hitKeywords.length >= 1 || txt.length >= 38);
                const nextMatched = isStepMatched && !matchedStepIds.includes(stepObj.step)
                    ? [...matchedStepIds, stepObj.step]
                    : matchedStepIds;
                setMatchedStepIds(nextMatched);

                const trustDelta = hitTriggers.length > 0
                    ? (difficultyId === 'hard' ? -16 : -10)
                    : (isStepMatched ? (difficultyId === 'hard' ? 6 : 8) : (difficultyId === 'hard' ? 1 : 3));
                const nextTrust = Math.max(10, Math.min(100, trustScore + trustDelta));
                setTrustScore(nextTrust);

                const nextMessages = [...messages, { role: 'user', step: stepObj.step, text: txt, at: Date.now() }];
                setMessages(nextMessages);
                setIsAiThinking(true);

                // สเต็ปที่ 10: ญาติตัดสินใจเองอย่างอิสระ (ยินยอมบริจาค / ขอกลับไปคิดหรือปรึกษาก่อน / ไม่ยินยอม)
                if (stepIdx >= TEN_STEPS.length - 1) {
                    let chosenOutcome = DECISION_OUTCOMES.THINKING;
                    const consentThreshold = difficultyId === 'hard' ? 78 : 72;
                    const declineThreshold = difficultyId === 'hard' ? 52 : 44;

                    if (nextTriggerTotal >= 2 || nextTrust < declineThreshold) {
                        chosenOutcome = DECISION_OUTCOMES.DECLINE;
                    } else if (nextTrust >= consentThreshold && nextMatched.length >= (difficultyId === 'hard' ? 7 : 6)) {
                        chosenOutcome = DECISION_OUTCOMES.CONSENT;
                    } else {
                        chosenOutcome = DECISION_OUTCOMES.THINKING;
                    }

                    let finalSpeech = chosenOutcome.speechTH;
                    if (appsScriptUrl && navigator.onLine) {
                        try {
                            const ctrl = new AbortController();
                            const tm = setTimeout(() => ctrl.abort(), 14000);
                            const convo = nextMessages.slice(-8).map(m => `${m.role === 'user' ? 'พยาบาล' : 'คุณแพรว'}: ${m.text}`).join('\n');
                            const rawRes = await fetch(appsScriptUrl, {
                                method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({
                                    action: 'callGemini',
                                    prompt: `บทบาท: ${OFFICIAL_CASE.relativeName}\nผลการตัดสินใจอิสระในสเต็ปที่ 10: ${chosenOutcome.badgeTH}\nประวัติบทสนทนา:\n${convo}\n\nโปรดกล่าวคำตัดสินใจสุดท้าย 2-3 ประโยคภาษาไทยอย่างสมจริงตามอารมณ์และความไว้วางใจ (${nextTrust}/100) ไม่ใช้ Markdown`,
                                    systemInstruction: `${CLINICAL_AI_PREFIX}\nตอบในบทบาทญาติผู้ป่วยสมองตายอย่างสมจริง อ่อนโยน และเคารพเหตุผลตามบริบทจริง`
                                }),
                                signal: ctrl.signal
                            });
                            clearTimeout(tm);
                            const d = JSON.parse((await rawRes.text()) || '{}');
                            if (d?.status === 'success' && d.text) finalSpeech = String(d.text).replace(/[*#]/g, '').trim();
                        } catch (_) {}
                    }

                    setCurrentEmotion(chosenOutcome.emotion);
                    setFinalDecision({ ...chosenOutcome, speechTH: finalSpeech });
                    setMessages(prev => [...prev, { role: 'ai', step: 10, text: finalSpeech, emotion: chosenOutcome.emotion, at: Date.now() }]);
                    setIsAiThinking(false);

                    // สเต็ปที่ 10: ไม่ว่าญาติจะยินยอม / ขอปรึกษา / ไม่ยินยอม -> แสงปราณเติมเต็มให้ต้นดอกท้อผลิบานเต็มที่ 100%!
                    triggerQiBloomFeedback(
                        100,
                        '🌸 แสงปราณเติมเต็มครบทั้ง 10 สเต็ป — ต้นดอกท้อผลิบานเต็มที่ 100% เพื่อเชิดชูทุกการสื่อสารด้วยหัวใจ'
                    );
                    setTimeout(() => {
                        if (peachCtrlRef.current) peachCtrlRef.current.triggerQiSurge();
                    }, 1600);

                    playStudioSpeech(finalSpeech);
                    return;
                }

                // สเต็ปที่ 1..9 -> เดินหน้าไปสเต็ปถัดไปพร้อมส่งแสงปราณไหลเติมให้ต้นดอกท้อผลิบานทีละขั้น
                const nextIdx = stepIdx + 1;
                const nextStepObj = TEN_STEPS[nextIdx];
                let aiReply = nextStepObj.relativeLineTH;
                let nextEmo = hitTriggers.length > 0 ? 'ANGRY' : nextStepObj.emotion;

                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const convo = nextMessages.slice(-6).map(m => `${m.role === 'user' ? 'พยาบาล' : 'คุณแพรว'}: ${m.text}`).join('\n');
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `บทบาท: ${OFFICIAL_CASE.relativeName} (ระดับความยาก: ${difficultyId === 'hard' ? 'Hard เข้มข้นสมจริง' : 'Normal'})\nสเต็ปถัดไป (${nextStepObj.step}/10): ${nextStepObj.titleTH}\nประเด็นที่ญาติจะถาม/สะท้อนต่อ: ${nextStepObj.relativeLineTH}\nประวัติสนทนา:\n${convo}\n\nโปรดตอบรับคำพูดของพยาบาลและเชื่อมเข้าสู่ประเด็นสเต็ปที่ ${nextStepObj.step} ความยาว 2-3 ประโยคภาษาไทยเป็นธรรมชาติ ขึ้นต้นด้วย [EMOTION:SHOCK|CONFUSED|SAD|ANGRY|HESITANT|CALM] ไม่ใช้ Markdown`,
                                systemInstruction: `${CLINICAL_AI_PREFIX}\nแสดงบทบาทญาติผู้เสียชีวิตสมองตายตามสื่อการสอน รพ.ราชวิถีอย่างสมจริง`
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) {
                            const clean = String(d.text).replace(/[*#]/g, '').trim();
                            const em = clean.match(/\[EMOTION:(SHOCK|CONFUSED|SAD|ANGRY|HESITANT|CALM)\]/i);
                            if (em) nextEmo = em[1].toUpperCase();
                            const stripped = clean.replace(/\[EMOTION:[^\]]+\]/gi, '').trim();
                            if (stripped) aiReply = stripped;
                        }
                    } catch (_) {}
                }

                setStepIdx(nextIdx);
                setCurrentEmotion(nextEmo);
                setMessages(prev => [...prev, { role: 'ai', step: nextStepObj.step, text: aiReply, emotion: nextEmo, at: Date.now() }]);
                setIsAiThinking(false);

                const nextBloomPct = Math.min(92, Math.round(6 + (nextIdx / TEN_STEPS.length) * 86));
                triggerQiBloomFeedback(
                    nextBloomPct,
                    `✨ ผ่านสเต็ปที่ ${stepObj.step}/10 — แสงปราณไหลเติมกิ่ง ต้นดอกท้อผลิบานแล้ว ${nextBloomPct}%`
                );

                playStudioSpeech(aiReply);
            };

            const handleOpenDebriefResult = () => {
                stopStudioVoice();
                const userMsgs = messages.filter(m => m.role === 'user');
                const coverageRatio = matchedStepIds.length / TEN_STEPS.length;
                const rawScore = Math.round(
                    45 +
                    coverageRatio * 38 +
                    Math.min(10, silenceCount * 4) +
                    (finalDecision?.code === 'CONSENT' ? 7 : finalDecision?.code === 'THINKING' ? 3 : 0) -
                    triggerTotal * 10
                );
                const finalScore = Math.max(48, Math.min(99, rawScore));

                const radar = RADAR_AXES.map((a, idx) => ({
                    key: a.key,
                    labelTH: a.labelTH,
                    value: Math.max(48, Math.min(99, finalScore + (idx % 2 === 0 ? 3 : -2)))
                }));

                const longestMsg = userMsgs.slice().sort((a, b) => b.text.length - a.text.length)[0];
                const missedStep = TEN_STEPS.find(s => !matchedStepIds.includes(s.step));

                setEvalResult({
                    score: finalScore,
                    decision: finalDecision || DECISION_OUTCOMES.THINKING,
                    radar,
                    summary: finalDecision?.code === 'CONSENT'
                        ? `ยอดเยี่ยมมากค่ะ! ท่านสื่อสารครบทั้ง 10 สเต็ปด้วยความอบอุ่น ชัดเจน และให้เกียรติ จนครอบครัววางใจและตัดสินใจยินยอมบริจาคอวัยวะด้วยตนเองค่ะ`
                        : finalDecision?.code === 'THINKING'
                            ? `สื่อสารได้ดีและไม่กดดันครอบครัวค่ะ ญาติเปิดใจรับฟังและขอกลับไปปรึกษาครอบครัวก่อน ซึ่งเป็นผลลัพธ์ที่พบได้จริงและมีคุณค่าทางคลินิกค่ะ`
                            : `ท่านได้ฝึกครบทั้ง 10 สเต็ปแล้วค่ะ แม้ครอบครัวตัดสินใจไม่ยินยอม แต่การเคารพการตัดสินใจและลดถ้อยคำที่กระทบจิตใจคือหัวใจสำคัญของการพัฒนาทักษะค่ะ`,
                    goldenMoment: longestMsg ? `“${longestMsg.text.slice(0, 150)}”` : 'สื่อสารด้วยความตั้งใจและรับฟังครอบครัวจนจบครบทั้ง 10 สเต็ป',
                    turningPoint: missedStep
                        ? `ลองเสริมประเด็นในสเต็ปที่ ${missedStep.step} (${missedStep.titleTH}): ${missedStep.hintTH}`
                        : 'ท่านเก็บครบทุกประเด็นสำคัญทั้ง 10 สเต็ปแล้วค่ะ ลองท้าทายตัวเองในโหมด Hard Mode ต่อได้เลยนะคะ'
                });
                setPhase('result');
            };

            const handleDownloadDebriefPng = () => {
                try {
                    const c = document.createElement('canvas'); c.width = 1200; c.height = 760;
                    const ctx = c.getContext('2d');
                    const g = ctx.createLinearGradient(0, 0, 1200, 760);
                    g.addColorStop(0, '#030611'); g.addColorStop(1, '#0c1f42');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, 1200, 760);
                    ctx.strokeStyle = 'rgba(253,164,175,0.55)'; ctx.lineWidth = 3; ctx.strokeRect(30, 30, 1140, 700);
                    ctx.fillStyle = '#fda4af'; ctx.font = '700 18px JetBrains Mono, monospace';
                    ctx.fillText('ORGAN CLOUD 2.0 • AI SKILL LAB 10-STEP DEBRIEF REPORT', 64, 92);
                    ctx.fillStyle = '#ffffff'; ctx.font = '800 32px Prompt, sans-serif';
                    ctx.fillText(OFFICIAL_CASE.titleTH, 64, 146, 1060);
                    ctx.fillStyle = '#bae6fd'; ctx.font = '600 22px Sarabun, sans-serif';
                    ctx.fillText(`ผู้เข้าฝึก: ${user?.name || '-'} (${user?.hospital || 'รพ.ราชวิถี'}) • ${difficultyId.toUpperCase()} MODE`, 64, 192);
                    ctx.fillStyle = '#34d399'; ctx.font = '800 84px JetBrains Mono, monospace';
                    ctx.fillText(`${evalResult?.score || 0}/100`, 64, 306);
                    ctx.fillStyle = '#fde68a'; ctx.font = '700 24px Prompt, sans-serif';
                    ctx.fillText(evalResult?.decision?.badgeTH || '', 360, 290, 760);
                    ctx.fillStyle = '#e2e8f0'; ctx.font = '500 22px Sarabun, sans-serif';
                    ctx.fillText(String(evalResult?.summary || '').slice(0, 88), 64, 382, 1060);
                    ctx.fillStyle = '#6ee7b7'; ctx.font = '700 20px Prompt, sans-serif';
                    ctx.fillText(`Golden Moment: ${String(evalResult?.goldenMoment || '').slice(0, 76)}`, 64, 462, 1060);
                    ctx.fillStyle = '#7dd3fc'; ctx.font = '600 20px Sarabun, sans-serif';
                    ctx.fillText(`ข้อเสนอแนะ: ${String(evalResult?.turningPoint || '').slice(0, 84)}`, 64, 520, 1060);
                    const a = document.createElement('a');
                    a.href = c.toDataURL('image/png', 1);
                    a.download = `AI_SkillLab_10Step_${user?.license || Date.now()}.png`;
                    a.click();
                    showToast('ดาวน์โหลดใบสรุปผล AI Skill Lab (PNG) เรียบร้อยค่ะ');
                } catch (_) {
                    showToast('ไม่สามารถสร้างภาพสรุปผลได้ในขณะนี้ค่ะ', 'error');
                }
            };

            const handleSaveAndGoPosttest = async () => {
                stopStudioVoice();
                const preAvg = Number(((preEff.e1 + preEff.e2 + preEff.e3) / 3).toFixed(2));
                const postAvg = Number(((postEff.e1 + postEff.e2 + postEff.e3) / 3).toFixed(2));
                const score = Number(evalResult?.score || 80);
                const prevHist = Array.isArray(user?.skillLabHistory) ? user.skillLabHistory : [];
                const newEntry = {
                    at: new Date().toISOString(),
                    caseId: OFFICIAL_CASE.id,
                    difficultyId,
                    score,
                    decisionCode: evalResult?.decision?.code || 'THINKING',
                    matchedSteps: matchedStepIds.length,
                    silenceCount,
                    triggerTotal,
                    radar: evalResult?.radar || [],
                    preSelfEfficacyAvg: preAvg,
                    postSelfEfficacyAvg: postAvg
                };
                const nextUser = {
                    ...user,
                    skillLabPassed: true,
                    skillLabBestScore: Math.max(Number(user?.skillLabBestScore || 0), score),
                    preSelfEfficacyAvg: preAvg,
                    postSelfEfficacyAvg: postAvg,
                    skillLabHistory: [...prevHist, newEntry].slice(-15)
                };
                setUser(nextUser);
                saveLearnerSessionSafe(nextUser);

                if (fbDb && nextUser?.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)), nextUser, { merge: true });
                        if (typeof CORE.buildAnonTelemetryId === 'function' && typeof CORE.buildExecutiveTelemetryPayload === 'function') {
                            const anonId = CORE.buildAnonTelemetryId(nextUser.id);
                            await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId), CORE.buildExecutiveTelemetryPayload(nextUser), { merge: true });
                        }
                    } catch (_) {}
                }
                showToast('บันทึกผล AI Skill Lab ขึ้น Central Data Center แล้ว กำลังพาไปสอบ Post-test ค่ะ');
                setTimeout(() => { window.location.href = './index.html?auto_step=posttest'; }, 650);
            };

            // ============================================================================
            // 8. RENDER PHASES (PRODUCTION ONLY — NEUMORPHIC SOFT UI + 3D HEART STAGE)
            // ============================================================================
            if (!user?.id) {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe bg-[var(--neu-bg)] text-[var(--neu-text)]">
                        <div className="neu-card relative z-10 w-full max-w-md p-6 sm:p-8 text-center space-y-5">
                            <div className="neu-icon-well w-14 h-14 mx-auto text-[var(--neu-teal)]">
                                <Icon name="ShieldCheck" size={28} />
                            </div>
                            <div className="space-y-1.5">
                                <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)] uppercase tracking-wider">organ cloud 2.0 • VERIFIED ACCESS</span>
                                <h1 className="font-display font-extrabold text-xl text-[var(--neu-text)] m-0">กรุณายืนยันตัวตนบุคลากรทางการแพทย์</h1>
                                <p className="text-xs sm:text-sm text-[var(--neu-text-sub)] leading-relaxed m-0">
                                    ห้องฝึกสื่อสาร AI Skill Lab 3D เป็นระบบปิดเฉพาะแพทย์ พยาบาล และบุคลากรสหวิชาชีพที่ยืนยันตัวตนด้วยเลขใบอนุญาตประกอบวิชาชีพและรหัส OTP แล้วเท่านั้นค่ะ
                                </p>
                            </div>
                            <a href="./index.html" className="neu-btn-teal touch-target w-full py-3.5 font-display font-extrabold text-sm">
                                ไปหน้ายืนยันตัวตน (เลขใบอนุญาต + OTP) →
                            </a>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe bg-[var(--neu-bg)] text-[var(--neu-text)]">
                    {voicePhase !== 'idle' && (
                        <div className="fixed top-0 left-0 right-0 z-50 pointer-events-none"><div className="rjc-ambient-bar" /></div>
                    )}

                    {/* ==================== PHASE 1: LOBBY (NEUMORPHIC SOFT UI) ==================== */}
                    {phase === 'lobby' && (
                        <>
                            <header className="sticky top-0 z-30 neu-header">
                                <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-3 min-w-0">
                                        <a href="./index.html?return=dashboard" className="neu-btn w-10 h-10 shrink-0" aria-label="กลับห้องเรียน">
                                            <Icon name="ArrowLeft" size={18} />
                                        </a>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-[var(--neu-text)] block leading-none truncate">
                                                AI Skill Lab <span className="text-[var(--neu-teal)]">10 Steps</span> <span className="font-mono text-[10px] text-[var(--neu-rose)]">organ cloud 2.0</span>
                                            </span>
                                            <span className="text-[10.5px] font-mono text-[var(--neu-text-muted)] block truncate mt-0.5">
                                                {user.name} • {user.professionGroup || 'บุคลากรทางการแพทย์'}
                                            </span>
                                        </div>
                                    </div>

                                            </span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-sky-100 leading-relaxed max-w-2xl mx-auto">
                                            ทุกถ้อยคำที่สื่อสารด้วยความเคารพและความเมตตา คือแสงปราณที่เติมเต็มให้ต้นดอกท้อต้นนี้ผลิบานอย่างสมบูรณ์ ไม่ว่าคำตอบของครอบครัวจะเป็นเช่นไร คุณค่าของการดูแลด้วยหัวใจยังคงงดงามเสมอค่ะ
                                        </p>
                                        <div className="flex flex-wrap items-center justify-center gap-2.5 pt-0.5">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setHideHudForAdmire(true);
                                                    if (peachCtrlRef.current) peachCtrlRef.current.triggerQiSurge();
                                                }}
                                                className="stage-hud-glass touch-target px-5 py-3 rounded-full font-display font-bold text-xs sm:text-sm text-pink-200 border-pink-300/50"
                                            >
                                                🌸 ซ่อนกรอบเพื่อชมต้นดอกท้อผลิบานเต็มตา
                                            </button>
                                            <button type="button" onClick={handleOpenDebriefResult} className="neu-btn-teal touch-target px-7 py-3 font-display font-extrabold text-xs sm:text-sm">
                                                ดูรายงานประเมินผล 5 แกน &amp; เตรียมทำ Post-test →
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="stage-hud-glass rounded-[1.5rem] p-3 sm:p-3.5 space-y-2.5 pointer-events-auto">
                                        {difficultyId === 'normal' && (
                                            <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                                                {currentStepObj.quickReplies.map((qr, qi) => (
                                                    <button key={qi} type="button" disabled={isAiThinking} onClick={() => handleSendMessage(null, qr)} className="shrink-0 px-3 py-1.5 rounded-xl bg-white/[0.08] hover:bg-white/[0.16] border border-pink-200/25 text-[11px] text-sky-100 text-left max-w-[290px] truncate">
                                                        ✦ {qr}
                                                    </button>
                                                ))}
                                            </div>
                                        )}

                                        <form onSubmit={handleSendMessage} className="flex items-center gap-2">
                                            <button type="button" onClick={handleTherapeuticSilence} disabled={silenceTimer > 0} className="touch-target px-3 rounded-xl bg-white/[0.08] border border-emerald-300/35 text-emerald-200 text-xs font-bold shrink-0" title="เว้นความเงียบเยียวยา 2.5 วินาที">
                                                {silenceTimer > 0 ? `⏳ ${silenceTimer}s` : '🤫 เงียบ 2.5s'}
                                            </button>
                                            <button type="button" onClick={handleToggleMic} className={`touch-target w-11 rounded-xl border flex items-center justify-center shrink-0 ${isRecordingMic ? 'bg-rose-600 border-rose-300 text-white animate-pulse' : 'bg-white/[0.08] border-sky-200/25 text-sky-100'}`} title="พูดผ่านไมโครโฟน">
                                                <Icon name={isRecordingMic ? 'MicOff' : 'Mic'} size={18} />
                                            </button>
                                            <input
                                                type="text"
                                                value={inputText}
                                                onChange={e => setInputText(e.target.value)}
                                                disabled={isAiThinking}
                                                placeholder={stepIdx === 9 ? 'สเต็ปที่ 10: เปิดพื้นที่ให้ญาติตัดสินใจเองอย่างอิสระ...' : `สเต็ปที่ ${stepIdx + 1}/10: พิมพ์หรือกดไมค์เพื่อสื่อสาร...`}
                                                className="touch-target flex-1 px-3.5 py-2 rounded-xl text-sm bg-white/[0.09] border border-sky-200/25 text-white placeholder:text-slate-400 focus:outline-none focus:border-pink-300"
                                            />
                                            <button type="submit" disabled={!inputText.trim() || isAiThinking} className="neu-btn-teal touch-target px-4 sm:px-5 rounded-xl font-display font-extrabold text-xs sm:text-sm shrink-0">
                                                {isAiThinking ? '...' : 'ส่ง →'}
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>

                            {/* Chat History Modal */}
                            {showHistoryModal && (
                                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                                    <div className="stage-hud-glass w-full max-w-lg max-h-[80vh] rounded-[1.75rem] p-5 flex flex-col gap-3">
                                        <div className="flex items-center justify-between border-b border-white/15 pb-2.5">
                                            <h3 className="font-display font-bold text-base">ประวัติบทสนทนา 10 สเต็ป ({messages.length})</h3>
                                            <button type="button" onClick={() => setShowHistoryModal(false)} className="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center">✕</button>
                                        </div>
                                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 text-xs pr-1">
                                            {messages.map((m, i) => (
                                                <div key={i} className={`p-3 rounded-2xl ${m.role === 'user' ? 'bg-emerald-500/20 border border-emerald-400/35 ml-6' : 'bg-white/10 border border-white/15 mr-6'}`}>
                                                    <span className="font-mono text-[10px] font-bold block mb-1 text-pink-300">
                                                        STEP {m.step || '-'} • {m.role === 'user' ? 'ท่าน (ทีมประสานงาน)' : OFFICIAL_CASE.relativeName}
                                                    </span>
                                                    <p className="leading-relaxed text-slate-100">{m.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ==================== PHASE 4: 5-AXIS DEBRIEF REPORT (NEUMORPHIC SOFT UI) ==================== */}
                    {phase === 'result' && evalResult && (
                        <main className="relative z-10 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-5 flex-1">
                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-[var(--neu-rose)] uppercase">organ cloud 2.0 • 10-STEP AI SUPERVISOR DEBRIEF</span>
                                    <h1 className="font-display font-extrabold text-xl sm:text-2xl text-[var(--neu-text)] m-0 mt-0.5">{OFFICIAL_CASE.titleTH}</h1>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="px-3.5 py-1.5 rounded-full bg-[var(--neu-bg)] shadow-[var(--shadow-pressed-sm)] border border-[var(--neu-teal-soft)] font-display font-bold text-xs text-[var(--neu-teal)]">
                                        {evalResult.decision?.badgeTH}
                                    </span>
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                </div>
                            </div>

                            <section className="grid grid-cols-1 md:grid-cols-12 gap-5 items-stretch">
                                <div className="md:col-span-5 neu-card p-5 sm:p-6 flex flex-col justify-between gap-4">
                                    <div>
                                        <p className="text-[11px] text-[var(--neu-text-muted)] font-mono uppercase m-0">CLINICAL COMMUNICATION SCORE ({difficultyId.toUpperCase()})</p>
                                        <div className="flex items-baseline gap-2 mt-2">
                                            <span className="font-mono text-5xl sm:text-6xl font-extrabold text-[var(--neu-teal)]">{evalResult.score}</span>
                                            <span className="font-mono text-xl text-[var(--neu-text-muted)]">/100</span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-[var(--neu-text-sub)] leading-relaxed mt-3 m-0">{evalResult.summary}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2.5 text-xs">
                                        <div className="neu-inset p-3">
                                            <span className="font-mono text-[9.5px] text-[var(--neu-text-muted)] block">ความเงียบ 2.5 วิ</span>
                                            <span className="font-mono font-bold text-[var(--neu-sky)]">{silenceCount} ครั้ง</span>
                                        </div>
                                        <div className="neu-inset p-3">
                                            <span className="font-mono text-[9.5px] text-[var(--neu-text-muted)] block">ความครอบคลุม</span>
                                            <span className="font-mono font-bold text-[var(--neu-teal)]">{matchedStepIds.length}/10 สเต็ป</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="md:col-span-7 neu-card p-5 flex flex-col justify-center">
                                    <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)] uppercase mb-1">5-AXIS CLINICAL COMPETENCY RADAR</span>
                                    <FiveAxisRadarSVG radarArr={evalResult.radar} theme={theme} />
                                </div>

                                <div className="md:col-span-6 neu-card p-5 space-y-1.5 text-xs">
                                    <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)] uppercase">★ ประโยคทองที่ทำได้ดีเยี่ยม (GOLDEN MOMENT)</span>
                                    <p className="text-[var(--neu-text)] text-sm leading-relaxed m-0">{evalResult.goldenMoment}</p>
                                </div>
                                <div className="md:col-span-6 neu-card p-5 space-y-1.5 text-xs">
                                    <span className="font-mono text-[10px] font-bold text-[var(--neu-sky)] uppercase">✦ ข้อเสนอแนะเพิ่มเติม (TURNING POINT)</span>
                                    <p className="text-[var(--neu-text)] text-sm leading-relaxed m-0">{evalResult.turningPoint}</p>
                                </div>

                                <div className="md:col-span-12 neu-card p-5 sm:p-6 space-y-4">
                                    {learnerVoiceClips.length > 0 && (
                                        <div className="neu-inset p-4 space-y-2 text-xs">
                                            <span className="font-mono text-[10px] font-bold text-[var(--neu-teal)] uppercase">🎙️ ฟังเสียงตัวเองย้อนหลัง (เก็บเฉพาะใน RAM • PDPA 100%)</span>
                                            <div className="flex flex-wrap gap-2">
                                                {learnerVoiceClips.map((c, ci) => c.audioUrl && (
                                                    <div key={ci} className="neu-step-pill px-3 py-2 flex items-center gap-2">
                                                        <span className="font-mono font-bold text-[var(--neu-teal)]">รอบ {ci + 1} ({c.durationSec}s)</span>
                                                        <audio controls src={c.audioUrl} className="h-7 max-w-[180px]" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="neu-inset p-4 space-y-2.5 text-xs">
                                        <span className="font-mono text-[10px] font-bold text-[var(--neu-amber)] uppercase">POST-PRACTICE SELF-EFFICACY (ประเมินความมั่นใจหลังฝึก • R2R)</span>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            {SELF_EFFICACY_ITEMS.map(it => (
                                                <div key={it.key} className="space-y-1.5">
                                                    <p className="text-[var(--neu-text-sub)] m-0">{it.labelTH}</p>
                                                    <div className="flex gap-1.5">
                                                        {[1, 2, 3, 4, 5].map(n => (
                                                            <button key={n} type="button" onClick={() => setPostEff(p => ({ ...p, [it.key]: n }))} className={`neu-btn flex-1 py-1.5 font-mono font-extrabold text-xs ${postEff[it.key] === n ? 'is-pressed' : ''}`}>{n}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                                        <button type="button" onClick={handleDownloadDebriefPng} className="neu-btn touch-target py-3.5 px-4 font-display font-bold text-xs sm:text-sm text-[var(--neu-teal)]">
                                            <Icon name="Download" size={15} /> บันทึกใบสรุปผล (PNG)
                                        </button>
                                        <button type="button" onClick={() => { stopStudioVoice(); setPhase('lobby'); }} className="neu-btn touch-target py-3.5 px-4 font-display font-bold text-xs sm:text-sm">
                                            ← ฝึกใหม่ (เปลี่ยน Normal / Hard)
                                        </button>
                                        <button type="button" onClick={handleSaveAndGoPosttest} className="neu-btn-teal touch-target py-3.5 px-4 font-display font-extrabold text-xs sm:text-sm">
                                            บันทึกผล &amp; ไปทำ Post-test ต่อทันที →
                                        </button>
                                    </div>
                                </div>
                            </section>
                        </main>
                    )}

                    <VideoReferenceModal open={showVideoModal} onClose={() => setShowVideoModal(false)} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('skilllab-root'));
        root.render(<SkillLabErrorBoundary><SkillLabApp /></SkillLabErrorBoundary>);
    </script>

    <!-- @babel/standalone พร้อม CDN สำรอง (cdnjs) ป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
