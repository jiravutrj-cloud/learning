                videoUrl: '',

                },

                    speakerKey: 'MICHAEL',
                    speakerName: 'Michael',
                    emotion: 'CONFUSED',
                    text: 'Hello... Are you the hospital staff coming to speak with me and my daughter about my wife?'
                },
                characters: [
                    { key: 'MICHAEL', displayName: 'Michael', voice: 'Charon', gender: 'male', style: 'Speak with a tense, worried 45-year-old male voice according to context' },
                    { key: 'EMILY', displayName: 'Emily', voice: 'Aoede', gender: 'female', style: 'Speak with an emotional, tearful 20-year-old female voice according to context' }
                ],
                systemPrompt: 'Act as foreign family Michael & Emily outside ICU in Thailand. Respond as ONE character per turn prefixed with [EMOTION] [Name].'
            }
        ];

        const SCENARIOS = (window.SKILL_LAB_SCENARIOS && window.SKILL_LAB_SCENARIOS.length > 0)
            ? window.SKILL_LAB_SCENARIOS
            : FALLBACK_SCENARIOS;

        let fbApp = null, fbAuth = null, fbDb = null;
        const isCloudConfigured = Boolean(CONFIG.firebaseConfig?.apiKey && CONFIG.firebaseConfig?.projectId);

        if (isCloudConfigured) {
            try {
                fbApp = getApps().length === 0 ? initializeApp(CONFIG.firebaseConfig) : getApp();
                fbAuth = getAuth(fbApp);
                fbDb = getFirestore(fbApp);
            } catch (err) {

        }

        // ============================================================================
        // 2. ERROR BOUNDARY & UI ATOMS
        // ============================================================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, info) {
                console.error('SkillLab ErrorBoundary:', error, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh bg-obsidian-950 text-white flex items-center justify-center p-6">

                    );

        }

        function Icon({ name, size = 20, className = "", strokeWidth = 2 }) {

            return <Comp size={size} className={className} strokeWidth={strokeWidth} />;

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[120] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-xl flex items-center gap-2.5 text-xs sm:text-sm font-bold ${
                        toast.type === 'error'
                            ? 'bg-rose-950/95 border-rose-500/40 text-rose-200'
                            : toast.type === 'info'
                                ? 'bg-slate-900/95 border-cyber-400/40 text-cyber-300'
                                : 'bg-emerald-950/95 border-biotech-400/40 text-biotech-300'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Info' : 'CheckCircle2'} size={17} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 3. HELPERS (AUDIO, CHARACTER PARSER, LOCAL SIMULATOR FALLBACK)
        // ============================================================================
        const EMOTION_META = {
            NEUTRAL: { labelTH: 'ปกติ', labelEN: 'Neutral', color: 'text-cyber-300 bg-cyber-500/15 border-cyber-400/30', aura: 'from-cyber-500/40 to-biotech-500/30' },
            CONFUSED: { labelTH: 'สับสน', labelEN: 'Confused', color: 'text-amber-300 bg-amber-500/15 border-amber-400/30', aura: 'from-amber-500/40 to-cyber-500/30' },
            SAD: { labelTH: 'โศกเศร้า', labelEN: 'Grieving', color: 'text-blue-300 bg-blue-500/15 border-blue-400/30', aura: 'from-blue-500/45 to-indigo-500/30' },
            ANGRY: { labelTH: 'โกรธ / กดดัน', labelEN: 'Distressed', color: 'text-rose-300 bg-rose-500/15 border-rose-400/30', aura: 'from-rose-500/45 to-orange-500/30' },
            HESITANT: { labelTH: 'ลังเล', labelEN: 'Hesitant', color: 'text-violet-300 bg-violet-500/15 border-violet-400/30', aura: 'from-violet-500/40 to-cyber-500/30' },
            ADVISING: { labelTH: 'ประเมินผล', labelEN: 'Evaluation', color: 'text-biotech-300 bg-biotech-500/15 border-biotech-400/30', aura: 'from-biotech-500/45 to-teal-500/30' }
        };

        /**
         * แปลง PCM16 Base64 จาก Gemini TTS เป็น WAV Blob URL (ต้องสั่ง revokeObjectURL เมื่อใช้เสร็จ)
         */
        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

        /**
         * ตรวจจับชื่อตัวละครและเสียงพากย์อย่างแม่นยำ (รองรับครบทั้ง ฟ้า, เมฆ, พี่เอก, Michael และ Emily!)
         */
        function detectSpeakerFromTag(tagText, scenario) {
            const t = String(tagText || '').toLowerCase();
            const isEn = scenario?.language === 'en';
            if (isEn) {
                if (t.includes('emily') || t.includes('daughter')) {
                    return { key: 'EMILY', displayName: 'Emily', voice: 'Aoede', gender: 'female' };
                }
                return { key: 'MICHAEL', displayName: 'Michael', voice: 'Charon', gender: 'male' };
            }
            if (t.match(/เมฆ|น้องชาย|mek|brother/)) {
                return { key: 'BROTHER', displayName: 'เมฆ', voice: 'Charon', gender: 'male' };
            }
            if (t.match(/พี่เอก|เอก|แฟน|boyfriend/)) {
                return { key: 'BOYFRIEND', displayName: 'พี่เอก', voice: 'Charon', gender: 'male' };
            }
            return { key: 'FAH', displayName: 'ฟ้า', voice: 'Aoede', gender: 'female' };
        }

        /**
         * เครื่องจำลองบทสนทนาอัจฉริยะ (Sandbox Mode) ใช้ทำงานได้ทันทีแม้ยังไม่ได้เชื่อม Apps Script / Gemini API
         */
        function generateLocalRoleplayReply(userMsg, scenario, turnCount) {
            const msg = String(userMsg || '').toLowerCase();
            const isEn = scenario.language === 'en';

            if (isEn) {
                if (turnCount <= 1) {
                    if (msg.match(/my name|i am|i'm|nurse|doctor|coordinator|staff/)) {
                        return `[CONFUSED] [Michael] Thank you for introducing yourself... I'm Michael, and this is our daughter Emily. We just got the call about the accident. Please tell me honestly—is she going to wake up?\n[SUGGESTION 1] I'm truly sorry for what happened, Michael and Emily. Could we step into a quiet room together so I can explain clearly?\n[SUGGESTION 2] Before I share the medical update, may I ask what the doctors have explained to you so far?`;
                    }
                    return `[ANGRY] [Michael] Wait—excuse me, who are you exactly? Are you the attending doctor? Nobody has given us a straight answer yet!\n[SUGGESTION 1] I apologize for not introducing myself first. I am the transplant coordinator nurse working with the ICU team.\n[SUGGESTION 2] I understand how stressful this wait is. My name is Nurse Joy from the care team, and I'm here to support your family.`;
                }
                if (msg.match(/brain death|brain dead|passed away|died|gone|cannot recover|irreversible/)) {
                    return `[SAD] [Emily] No... please don't say that! Her chest is still moving and her hand is still warm! How can you say Mom is gone?!\n[SUGGESTION 1] I hear how heartbreaking this is, Emily. Her chest moves only because the ventilator is pushing air, and the brain stem tests confirmed her brain can no longer recover.\n[SUGGESTION 2] Take a deep breath, Emily. I'm right here with you. It's completely understandable to feel confused when her body still feels warm.`;
                }
                if (msg.match(/donate|donation|organ|gift|help other/)) {
                    return `[HESITANT] [Michael] Organ donation...? That's a huge decision. Emily is devastated right now... Would it disfigure her body? We need time to think.\n[SUGGESTION 1] Please take all the time you need with no pressure. I can assure you our surgeons treat her body with the utmost dignity and care, just like a standard operation.\n[SUGGESTION 2] Of course, there is no rush at all. Whenever you are ready, I'm happy to answer any questions about how this honors her memory.`;
                }
                return `[SAD] [Emily] Mom was so healthy just yesterday... We came to Thailand for a family holiday. I just don't know how we can go home without her.\n[SUGGESTION 1] This sudden loss is unimaginably painful, Emily. Please know you don't have to face the next steps alone.\n[SUGGESTION 2] It sounds like she meant the world to both of you. Would you like to sit quietly for a moment, or have me explain the clinical findings gently?`;
            }

            // Thai Case (ฟ้า, เมฆ, พี่เอก)
            if (turnCount <= 1) {
                if (msg.match(/สวัสดี|ชื่อ|พยาบาล|หมอ|แพทย์|ผู้ประสาน|เจ้าหน้าที่/)) {
                    return `[SAD] [ฟ้า] สวัสดีค่ะ หนูชื่อฟ้านะคะ นี่เมฆน้องชายหนู แล้วก็นี่พี่เอกแฟนหนูค่ะ... พวกเราเพิ่งได้รับโทรศัพท์แจ้งเรื่องอุบัติเหตุ คุณพ่อจะเป็นอะไรมากไหมคะ?\n[SUGGESTION 1] ขอแสดงความเสียใจอย่างสุดซึ้งกับอุบัติเหตุที่เกิดขึ้นนะคะ ขอเชิญคุณฟ้า คุณเมฆ และคุณเอกเข้าไปคุยในห้องที่เงียบและเป็นส่วนตัวด้านนี้ก่อนดีไหมคะ\n[SUGGESTION 2] ก่อนอื่นขออนุญาตสอบถามว่า หลังจากที่คุณหมอเจ้าของไข้ได้แจ้งอาการล่าสุดไป คุณฟ้ากับคุณเมฆเข้าใจอาการคุณพ่อว่าอย่างไรบ้างคะ`;
                }

            }
            if (msg.match(/สมองตาย|เสียชีวิต|ไม่ฟื้น|จากไป|หยุดทำงาน/)) {
                return `[ANGRY] [เมฆ] ไม่จริงหรอกครับ! เมื่อกี้ผมยังเห็นหน้าจอมอนิเตอร์หัวใจพ่อเต้นอยู่เลย ตัวพ่อก็ยังอุ่นๆ อยู่ จะบอกว่าพ่อเสียชีวิตได้ยังไงครับ!\n[SUGGESTION 1] เข้าใจความรู้สึกคุณเมฆเลยค่ะที่เห็นตัวคุณพ่อยังอุ่นอยู่ แต่ที่เป็นแบบนั้นเกิดจากเครื่องช่วยหายใจและยาประคองความดันนะคะ ส่วนสมองได้หยุดทำงานอย่างถาวรแล้ว\n[SUGGESTION 2] มันเป็นเรื่องที่ทำใจยอมรับได้ยากมากเลยนะคะ คุณเมฆมีสิทธิ์ที่จะรู้สึกเสียใจและโกรธ ดิฉันขออนุญาตค่อยๆ อธิบายเรื่องภาวะสมองตายให้ชัดเจนนะคะ`;
            }
            if (msg.match(/บริจาค|อวัยวะ|บุญ|กุศล|ช่วยชีวิต/)) {
                return `[HESITANT] [พี่เอก] ใจเย็นๆ นะฟ้า เมฆ... คือผมเข้าใจเจตนาดีของทางโรงพยาบาลนะครับ แต่เรื่องนี้มันใหญ่มากสำหรับน้องสองคน ถ้ายินยอม ร่างของคุณพ่อจะไม่เสียรูปทรงใช่ไหมครับ?\n[SUGGESTION 1] ขอบคุณคุณเอกมากค่ะที่ช่วยดูแลใจน้องๆ ขอรับรองเลยค่ะว่าทีมศัลยแพทย์จะผ่าตัดเย็บแผลอย่างประณีตที่สุดและให้เกียรติร่างคุณพ่ออย่างเต็มที่ ร่างกายภายนอกจะเรียบร้อยสมบูรณ์ค่ะ\n[SUGGESTION 2] ไม่ต้องรีบตัดสินใจนะคะ ให้ครอบครัวได้ใช้เวลาคุยกันก่อนอย่างสบายใจ หากมีข้อสงสัยเรื่องขั้นตอนหรือสิทธิประโยชน์จากสภากาชาดไทย ดิฉันยินดีอธิบายทุกข้อค่ะ`;

            return `[SAD] [ฟ้า] ฮึก... คุณพ่อเลี้ยงหนูกับเมฆมาคนเดียวตั้งแต่แม่เสีย พ่อเหนื่อยมาทั้งชีวิต หนูยังไม่ได้พาพ่อไปเที่ยวอย่างที่สัญญาไว้เลยค่ะ...\n[SUGGESTION 1] คุณพ่อต้องภูมิใจในตัวคุณฟ้ากับคุณเมฆมากแน่ๆ ค่ะ ดิฉันขออยู่เป็นเพื่อนรับฟังตรงนี้นะคะ หากพร้อมเมื่อไหร่ค่อยคุยกันต่อก็ได้ค่ะ\n[SUGGESTION 2] ความรักที่คุณพ่อมีให้ลูกทั้งสองคนยิ่งใหญ่มากจริงๆ ค่ะ ดิฉันขออนุญาตให้เวลาทุกท่านได้อยู่ด้วยกันสักครู่นะคะ`;
        }

        function generateLocalEvaluation(messages, scenario) {
            const isEn = scenario.language === 'en';
            const userMsgs = messages.filter(m => m.sender === 'user' && !m.isSystemAction).map(m => m.text).join(' ').toLowerCase();
            let score = 62;
            const strengths = [];
            const improvements = [];

            if (userMsgs.match(/ชื่อ|พยาบาล|แพทย์|หมอ|สวัสดี|my name|i am|nurse|doctor|coordinator/)) {
                score += 10;
                strengths.push(isEn ? 'Clear self-introduction and role transparency (Decoupling).' : 'มีการแนะนำตัวและระบุบทบาทหน้าที่อย่างสุภาพชัดเจน (Identity & Decoupling)');
            } else {
                improvements.push(isEn ? 'Remember to introduce your name and role before clinical discussion.' : 'ควรแนะนำชื่อและบทบาทของตนเองก่อนเริ่มสนทนาเสมอ เพื่อลดความระแวงของญาติ');
            }

            if (userMsgs.match(/เสียใจ|เข้าใจ|ห่วง|เป็นส่วนตัว|ห้อง|รับฟัง|เวลา|sorry|understand|quiet|room|time|support|here/)) {
                score += 14;
                strengths.push(isEn ? 'Strong empathetic presence and emotional validation.' : 'แสดงความเห็นอกเห็นใจ (Empathy) และสร้างพื้นที่ปลอดภัยในการสื่อสารได้ดี');
            } else {
                improvements.push(isEn ? 'Validate the family’s grief and emotions before giving medical details.' : 'ควรสะท้อนความรู้สึกและแสดงความเห็นอกเห็นใจก่อนอธิบายข้อมูลทางการแพทย์');
            }

            if (userMsgs.match(/สมองตาย|เครื่องช่วยหายใจ|ประณีต|ให้เกียรติ|กุศล|brain death|ventilator|dignity|care|respect/)) {
                score += 10;
                strengths.push(isEn ? 'Clear, dignified clinical explanation without pressure.' : 'อธิบายภาวะสมองตายหรือการดูแลร่างอย่างสุภาพ ชัดเจน และไม่กดดันญาติ');
            } else {
                improvements.push(isEn ? 'Practice Perception Check to confirm understanding of brain death.' : 'ควรใช้คำถามเปิด (Perception Check) เพื่อประเมินความเข้าใจเรื่องภาวะสมองตายของญาติ');
            }

            score = Math.min(96, Math.max(45, score));
            const passed = score >= 60;

            const report = isEn
                ? `Cognitive Profiler Assessment (Sandbox Mode)\n\n• Empathy & Communication Score: ${score}/100 (${passed ? 'PASSED' : 'NEEDS PRACTICE'})\n\n✅ Strengths:\n${(strengths.length ? strengths : ['Maintained respectful communication throughout the simulation.']).map(s => `- ${s}`).join('\n')}\n\n💡 Recommendations:\n${(improvements.length ? improvements : ['Continue refining open-ended questions for cross-cultural sensitivity.']).map(s => `- ${s}`).join('\n')}`
                : `รายงานประเมินทักษะการเจรจา (Sandbox Mode)\n\n• คะแนนความเห็นอกเห็นใจและการสื่อสาร (Empathy Score): ${score}/100 (${passed ? 'ผ่านเกณฑ์' : 'ควรฝึกเพิ่มเติม'})\n\n✅ จุดแข็งที่ทำได้ดี:\n${(strengths.length ? strengths : ['รักษามารยาทและความสุภาพในการสื่อสารตลอดการสนทนา']).map(s => `- ${s}`).join('\n')}\n\n💡 ข้อเสนอแนะเพื่อพัฒนาต่อ:\n${(improvements.length ? improvements : ['ฝึกใช้คำถามปลายเปิดควบคู่กับหลัก SPIKES เพื่อประคองอารมณ์ญาติในจังหวะวิกฤตได้ดียิ่งขึ้น']).map(s => `- ${s}`).join('\n')}`;

            return { score, passed, report };
        }

        /**
         * โหลดข้อมูลผู้เรียนจาก localStorage (รองรับทั้งคีย์ใหม่ rjcloud.organ 2027 และคีย์เดิม)
         */
        function loadStoredUser() {
            const keys = ['rjcloud_organ_state_v2027', 'elearning_app_state'];
            for (const k of keys) {
                try {
                    const raw = localStorage.getItem(k);
                    if (!raw) continue;
                    const parsed = JSON.parse(raw);
                    const u = parsed?.user || parsed?.loggedInUser;
                    if (u && (u.id || u.license || u.name)) return u;
                } catch (_) {}
            }
            return null;
        }

        function saveStoredUser(updatedUser) {
            const keys = ['rjcloud_organ_state_v2027', 'elearning_app_state'];
            keys.forEach(k => {
                try {
                    const raw = localStorage.getItem(k);
                    if (!raw) return;
                    const parsed = JSON.parse(raw);
                    if (parsed.user) parsed.user = updatedUser;
                    if (parsed.loggedInUser) parsed.loggedInUser = updatedUser;
                    localStorage.setItem(k, JSON.stringify(parsed));
                } catch (_) {}
            });
        }

        // ============================================================================
        // 4. MAIN AI SKILL LAB APPLICATION (100% SMARTPHONE OPTIMIZED)
        // ============================================================================
        function SkillLabApp() {
            // User & Cloud Config State
            const [user, setUser] = useState(null);
            const [authState, setAuthState] = useState('checking'); // checking | ready | denied | guest_prompt
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');

            // Scenario & Roleplay State
            const [selectedScenario, setSelectedScenario] = useState(null);
            const [roleplayPhase, setRoleplayPhase] = useState('menu'); // menu | watching_video | giving_context | negotiating | evaluating
            const [messages, setMessages] = useState([]);
            const [smartSuggestions, setSmartSuggestions] = useState([]);
            const [lastEvalResult, setLastEvalResult] = useState(null);

            // Speaker, Emotion & Audio States
            const [currentSpeaker, setCurrentSpeaker] = useState({ key: 'FAH', displayName: 'ฟ้า', voice: 'Aoede', gender: 'female' });
            const [currentEmotion, setCurrentEmotion] = useState('NEUTRAL');
            const [isAiSpeaking, setIsAiSpeaking] = useState(false);
            const [voiceEnabled, setVoiceEnabled] = useState(true);

            // Composer & Mic States
            const [chatInput, setChatInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [selectedImage, setSelectedImage] = useState(null);
            const [isListening, setIsListening] = useState(false);
            const [audioLevel, setAudioLevel] = useState(0);

            // UI Drawers & Notifications
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            // Refs (Clean resource management — ป้องกัน Memory Leak & Mic ค้าง)
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const speechIdRef = useRef(0);
            const messagesEndRef = useRef(null);

            const recognitionRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const audioCtxRef = useRef(null);
            const analyserRef = useRef(null);
            const rafIdRef = useRef(null);
            const silenceTimerRef = useRef(null);
            const isSpeakingUserRef = useRef(false);
            const latestTranscriptRef = useRef('');
            const isListeningRef = useRef(false);
            const handleSendChatRef = useRef(null);
            const scenarioPromptRef = useRef('');

            const isEn = selectedScenario?.language === 'en';
            const emotionMeta = EMOTION_META[currentEmotion] || EMOTION_META.NEUTRAL;

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text, type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            // 1. ตรวจสอบสิทธิ์ผู้ใช้ & ซิงค์ Apps Script URL จาก Firestore (ไม่ Hardcode!)
            useEffect(() => {
                const stored = loadStoredUser();
                if (stored) {
                    if (stored.userType === 'Masterclass') {
                        setUser(stored);
                        setAuthState('ready');
                    } else {
                        setUser(stored);
                        setAuthState('denied');
                    }
                } else {
                    setAuthState('guest_prompt');
                }

                let unsubSettings = null;
                if (isCloudConfigured && fbAuth && fbDb) {
                    signInAnonymously(fbAuth)
                        .then(() => {
                            unsubSettings = onSnapshot(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                                (snap) => {
                                    if (snap.exists() && snap.data()?.appsScriptUrl) {
                                        setAppsScriptUrl(snap.data().appsScriptUrl);
                                    }
                                },
                                () => {}
                            );
                        })
                        .catch(() => {});
                }
                return () => { if (unsubSettings) unsubSettings(); };
            }, []);

            // 2. Auto-scroll chat feed
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, smartSuggestions, isTyping]);

            // 3. หยุดเสียง AI และคืนหน่วยความจำ ObjectURL สะอาดทุกครั้ง
            const stopAudio = useCallback(() => {
                speechIdRef.current += 1;
                setIsAiSpeaking(false);
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.onended = null;
                    audioRef.current.onerror = null;
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
            }, []);

            // 4. ปิดไมโครโฟน VAD อย่างสมบูรณ์ (ปิด MediaStream Track + AudioContext + rAF ไม่มีไมค์ค้าง!)
            const stopVAD = useCallback((silent = false) => {
                isListeningRef.current = false;
                setIsListening(false);
                setAudioLevel(0);
                isSpeakingUserRef.current = false;

                if (rafIdRef.current) {
                    cancelAnimationFrame(rafIdRef.current);
                    rafIdRef.current = null;
                }
                if (silenceTimerRef.current) {
                    clearTimeout(silenceTimerRef.current);
                    silenceTimerRef.current = null;
                }
                if (recognitionRef.current) {
                    try { recognitionRef.current.onend = null; recognitionRef.current.stop(); } catch (_) {}
                    recognitionRef.current = null;
                }
                if (mediaStreamRef.current) {
                    mediaStreamRef.current.getTracks().forEach(track => {
                        try { track.stop(); } catch (_) {}
                    });
                    mediaStreamRef.current = null;
                }
                if (audioCtxRef.current) {
                    try { audioCtxRef.current.close(); } catch (_) {}
                    audioCtxRef.current = null;
                }
                analyserRef.current = null;
                if (!silent) showToast(isEn ? 'Microphone muted' : 'ปิดไมโครโฟนเรียบร้อยแล้วค่ะ', 'info');
            }, [isEn, showToast]);

            // Cleanup on unmount
            useEffect(() => () => {
                stopAudio();
                stopVAD(true);
            }, [stopAudio, stopVAD]);

            // 5. เรียก Apps Script (Gemini Text & Gemini TTS)
            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'sandbox' };
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            }, [appsScriptUrl]);

            // 6. ระบบเสียง AI (Gemini TTS -> Fallback Web Speech API) พร้อมปลดล็อกข้อความเมื่อพูดจบ
            const speakText = useCallback(async (rawText, speakerObj, isSystemVoice = false, onEndCallback = null) => {
                stopAudio();
                speechIdRef.current += 1;
                const mySpeechId = speechIdRef.current;

                let finished = false;
                const finishOnce = () => {
                    if (finished) return;
                    finished = true;
                    setIsAiSpeaking(false);
                    if (onEndCallback) onEndCallback();
                };

                if (!voiceEnabled) {
                    // หากผู้ใช้ปิดเสียง ให้เปิดเผยข้อความทันทีหลังหน่วงเล็กน้อย
                    setTimeout(finishOnce, 350);
                    return;
                }

                // หยุดไมค์ชั่วคราวขณะ AI พูด เพื่อไม่ให้ไมค์ดูดเสียง AI กลับเข้าไป
                if (isListeningRef.current) stopVAD(true);

                const cleanText = String(rawText || '')
                    .replace(/\[.*?\]/g, '')
                    .replace(/\(.*?\)/g, '')
                    .replace(/[*#]/g, '')
                    .trim();

                if (!cleanText) {
                    finishOnce();
                    return;
                }

                const langCode = selectedScenario?.language === 'en' ? 'en-US' : 'th-TH';
                const targetVoice = isSystemVoice ? 'Aoede' : (speakerObj?.voice || 'Aoede');
                const stylePrompt = isSystemVoice
                    ? (langCode === 'en-US'
                        ? `[Speak with a warm, professional female clinical narrator voice]: ${cleanText}`
                        : `[พูดด้วยเสียงผู้บรรยายหญิง สุภาพ นุ่มนวล ชัดเจน เป็นทางการ]: ${cleanText}`)
                    : `[${speakerObj?.style || (langCode === 'en-US' ? 'Speak naturally with realistic emotion' : 'พูดด้วยน้ำเสียงตามอารมณ์บริบทอย่างเป็นธรรมชาติ')}]: ${cleanText}`;

                // 6.1 ลองใช้ Gemini Neural TTS ถ้าต่อ Apps Script แล้ว
                if (appsScriptUrl) {
                    try {
                        const res = await callAppsScript({
                            action: 'callGeminiTTS',
                            text: stylePrompt,
                            voiceName: targetVoice
                        });
                        if (mySpeechId !== speechIdRef.current) return;
                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const wavUrl = pcm16ToWavUrl(res.inlineData.data, rate);
                            audioUrlRef.current = wavUrl;
                            const audio = new Audio(wavUrl);
                            audioRef.current = audio;
                            setIsAiSpeaking(true);
                            audio.onended = () => {
                                if (audioUrlRef.current === wavUrl) {
                                    URL.revokeObjectURL(wavUrl);
                                    audioUrlRef.current = null;
                                }
                                finishOnce();
                            };
                            audio.onerror = () => finishOnce();
                            await audio.play();
                            return;
                        }
                    } catch (err) {
                        console.warn('Gemini TTS fallback to browser speech:', err);
                    }
                }

                // 6.2 Fallback: Web Speech API (รองรับบนสมาร์ทโฟนทันทีในโหมด Sandbox)
                if ('speechSynthesis' in window && mySpeechId === speechIdRef.current) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = langCode;
                        utter.pitch = speakerObj?.gender === 'male' && !isSystemVoice ? 0.85 : 1.05;
                        utter.rate = 1.0;
                        setIsAiSpeaking(true);
                        utter.onend = finishOnce;
                        utter.onerror = finishOnce;
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }

                finishOnce();
            }, [voiceEnabled, selectedScenario?.language, appsScriptUrl, callAppsScript, stopAudio, stopVAD]);

            // 7. เปิดไมโครโฟน VAD (ไม่สร้าง Instance ซ้ำเมื่อข้อความเปลี่ยน)
            const startVAD = async () => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast(isEn ? 'Speech recognition not supported on this browser.' : 'เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง กรุณาพิมพ์ข้อความแทนค่ะ', 'error');
                    return;
                }
                if (roleplayPhase === 'giving_context' || isTyping) return;

                stopAudio();
                setChatInput('');
                latestTranscriptRef.current = '';

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaStreamRef.current = stream;

                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioCtx();
                    audioCtxRef.current = ctx;
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;
                    analyserRef.current = analyser;
                    const src = ctx.createMediaStreamSource(stream);
                    src.connect(analyser);

                    const rec = new SR();
                    rec.continuous = true;
                    rec.interimResults = true;
                    rec.lang = isEn ? 'en-US' : 'th-TH';

                    rec.onresult = (e) => {
                        let fullText = '';
                        for (let i = 0; i < e.results.length; i++) {
                            fullText += e.results[i][0].transcript;
                        }
                        latestTranscriptRef.current = fullText;
                        setChatInput(fullText);
                    };

                    rec.onerror = (e) => {
                        if (e.error !== 'no-speech') {
                            stopVAD(true);
                            showToast(isEn ? 'Microphone paused.' : 'ไมโครโฟนหยุดทำงานชั่วคราว', 'error');
                        }
                    };

                    rec.onend = () => {
                        if (isListeningRef.current) {
                            try { rec.start(); } catch (_) {}
                        }
                    };

                    recognitionRef.current = rec;
                    isListeningRef.current = true;
                    setIsListening(true);
                    rec.start();
                    showToast(isEn ? '🎙️ Listening... Pause speaking to auto-send' : '🎙️ กำลังฟัง... พูดจบแล้วหยุดสักครู่ระบบจะส่งให้อัตโนมัติ', 'info');

                    // Voice Activity Detection Loop
                    const dataArr = new Uint8Array(analyser.frequencyBinCount);
                    const monitorVolume = () => {
                        if (!isListeningRef.current || !analyserRef.current) return;
                        analyserRef.current.getByteFrequencyData(dataArr);
                        let sum = 0;
                        for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
                        const avg = sum / dataArr.length;
                        setAudioLevel(Math.min(100, Math.round(avg * 2.2)));

                        if (avg > 14) {
                            isSpeakingUserRef.current = true;
                            if (silenceTimerRef.current) {
                                clearTimeout(silenceTimerRef.current);
                                silenceTimerRef.current = null;
                            }
                        } else if (isSpeakingUserRef.current && !silenceTimerRef.current) {
                            silenceTimerRef.current = setTimeout(() => {
                                isSpeakingUserRef.current = false;
                                silenceTimerRef.current = null;
                                const spoken = latestTranscriptRef.current.trim();
                                if (spoken && handleSendChatRef.current) {
                                    stopVAD(true);
                                    handleSendChatRef.current(null, spoken);
                                }
                            }, 1100);
                        }
                        rafIdRef.current = requestAnimationFrame(monitorVolume);
                    };
                    rafIdRef.current = requestAnimationFrame(monitorVolume);
                } catch (err) {
                    stopVAD(true);
                    showToast(isEn ? 'Cannot access microphone. Please allow permission.' : 'ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตสิทธิ์ไมค์ค่ะ', 'error');
                }
            };

            const toggleMic = () => {
                if (isListening) stopVAD(false);
                else startVAD();
            };

            // 8. เริ่มต้นบทบาทสมมติ (ดึงข้อมูลคนไข้ & ประโยคเปิดเรื่องจาก data.js อย่างแม่นยำ 100%)
            const beginNegotiationPhase = useCallback((sc) => {
                const isEnglish = sc.language === 'en';
                const pInfo = sc.patientInfo || {};
                const summaryText = pInfo.summaryText || (isEnglish
                    ? 'Initial Case Data: Brain death confirmed. You may begin speaking with the family now.'
                    : 'ข้อมูลเบื้องต้น: ยืนยันภาวะสมองตายแล้ว เริ่มการเจรจากับญาติผู้ป่วยได้เลยค่ะ');

                const introHook = sc.introHook || {
                    speakerKey: isEnglish ? 'MICHAEL' : 'FAH',
                    speakerName: isEnglish ? 'Michael' : 'ฟ้า',
                    emotion: 'CONFUSED',
                    text: isEnglish
                        ? 'Hello... Are you the hospital staff coming to speak with us?'
                        : 'สวัสดีค่ะ... คุณเป็นเจ้าหน้าที่ที่จะมาคุยกับพวกเราเรื่องคุณพ่อหรือเปล่าคะ?'
                };

                const hookSpeaker = detectSpeakerFromTag(introHook.speakerName, sc);

                setRoleplayPhase('giving_context');
                setCurrentEmotion('NEUTRAL');
                setCurrentSpeaker(hookSpeaker);
                setLastEvalResult(null);

                const contextId = `ctx-${Date.now()}`;
                setMessages([{
                    id: contextId,
                    sender: 'ai',
                    isContext: true,
                    isVoiceOnly: false,
                    speakerName: isEnglish ? 'Case Briefing' : 'ข้อมูลกรณีศึกษา',
                    text: summaryText
                }]);

                // อ่านบริบทเริ่มต้น (ล็อกช่องพิมพ์ระหว่างนี้จนกว่าจะอ่านจบ)
                speakText(summaryText, { voice: 'Aoede', gender: 'female' }, true, () => {
                    setRoleplayPhase('negotiating');
                    setCurrentEmotion(introHook.emotion || 'CONFUSED');
                    setCurrentSpeaker(hookSpeaker);

                    const introId = `intro-${Date.now()}`;
                    setMessages(prev => {
                        if (prev.some(m => m.id === introId)) return prev;
                        return [...prev, {
                            id: introId,
                            sender: 'ai',
                            isContext: false,
                            isVoiceOnly: voiceEnabled,
                            speakerName: hookSpeaker.displayName,
                            emotion: introHook.emotion || 'CONFUSED',
                            text: introHook.text
                        }];
                    });

                    // สร้างทางเลือกแนะนำเริ่มต้น 2 ข้อ
                    setSmartSuggestions(isEnglish ? [
                        "Hello, my name is Nurse Joy from the ICU care team. I'm so sorry about the accident.",
                        "Good day, I'm the clinical coordinator here to support you and your daughter. May we sit in a quiet room?"
                    ] : [
                        'สวัสดีค่ะ ดิฉันเป็นพยาบาลผู้ประสานงานจากโรงพยาบาลค่ะ ขอแสดงความเสียใจกับเหตุการณ์ที่เกิดขึ้นนะคะ',
                        'สวัสดีค่ะ ขอเชิญทุกท่านเข้าไปพูดคุยในห้องส่วนตัวที่เงียบสงบด้านนี้ก่อนดีไหมคะ'
                    ]);

                    speakText(introHook.text, hookSpeaker, false, () => {
                        setMessages(prev => prev.map(m => (m.id === introId ? { ...m, isVoiceOnly: false } : m)));
                    });
                });
            }, [speakText, voiceEnabled]);

            const startScenario = (sc) => {
                stopAudio();
                stopVAD(true);

                // ปลดล็อกสิทธิ์ Autoplay บน iOS/Android ทันทีที่ผู้ใช้กดแตะ
                try {
                    const silent = new Audio('data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU5LjI3LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIwADAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAw');
                    silent.play().catch(() => {});
                } catch (_) {}

                setSelectedScenario(sc);
                setMessages([]);
                setSmartSuggestions([]);
                setLastEvalResult(null);

                // สร้าง System Prompt ที่มีข้อมูลคนไข้ถูกต้องตามเคสนั้นๆ 100%
                const pInfo = sc.patientInfo || {};
                const userPos = user?.position || (sc.language === 'en' ? 'Medical Professional' : 'บุคลากรทางการแพทย์');
                const filledPrompt = (sc.systemPrompt || '')
                    .replace(/{{USER_POSITION}}/g, userPos)
                    .replace(/{{PATIENT_GENDER}}/g, pInfo.gender || '')
                    .replace(/{{PATIENT_AGE}}/g, pInfo.age || '')
                    .replace(/{{PATIENT_CAUSE}}/g, pInfo.cause || '')
                    .replace(/{{PATIENT_RELATION}}/g, pInfo.relation || '');

                const clinicalDB = window.CLINICAL_KNOWLEDGE_BASE || '';
                scenarioPromptRef.current = sc.language === 'en'
                    ? `[Clinical Knowledge Base]\n${clinicalDB}\n\n${filledPrompt}\n\n[CRITICAL RULE]: Output ONLY ONE character per response prefixed with [EMOTION] [Name].`
                    : `[ฐานความรู้ทางการแพทย์]\n${clinicalDB}\n\n${filledPrompt}\n\n[กฎเหล็ก]: ตอบในฐานะตัวละครเพียง 1 คนต่อ 1 ครั้งเท่านั้น ขึ้นต้นด้วย [EMOTION] [ชื่อ]`;

                if (sc.videoUrl) {
                    setRoleplayPhase('watching_video');
                } else {
                    beginNegotiationPhase(sc);
                }
            };

            // 9. ประมวลผลคำตอบจาก AI (แยกตัวละคร ฟ้า/เมฆ/พี่เอก/Michael/Emily และอารมณ์ได้สมบูรณ์)
            const processAiDialogue = useCallback((rawResponse, sc) => {
                let text = String(rawResponse || '');
                let sug1 = '', sug2 = '';

                const m1 = text.match(/\[SUGGESTION 1\](.*?)(?=\[SUGGESTION 2\]|$)/is);
                const m2 = text.match(/\[SUGGESTION 2\](.*?)$/is);
                if (m1) sug1 = m1[1].trim();
                if (m2) sug2 = m2[1].trim();
                text = text.replace(/\[SUGGESTION 1\][\s\S]*$/i, '').replace(/\[DIALOGUE\]/i, '').trim();
                setSmartSuggestions([sug1, sug2].filter(Boolean));

                // 1) แยกอารมณ์
                let emotion = 'SAD';
                const emotions = ['SAD', 'HESITANT', 'CONFUSED', 'ANGRY', 'ADVISING', 'NEUTRAL'];
                for (const em of emotions) {
                    if (new RegExp(`\\[\\s*${em}\\s*\\]`, 'i').test(text)) {
                        emotion = em;
                        break;
                    }
                }
                text = text.replace(/\[\s*(SAD|HESITANT|CONFUSED|ANGRY|ADVISING|NEUTRAL)\s*\]/gi, '').trim();

                // 2) แยกตัวละคร (รองรับ Emily เพิ่มเข้ามาเรียบร้อย!)
                const speakerRegex = /\[\s*(ฟ้า|เมฆ|พี่เอก|เอก|น้องชาย|ลูกสาว|แฟน|Fah|Mek|Brother|Boyfriend|Michael|Emily|Daughter|Husband)\s*\]/gi;
                const matches = [...text.matchAll(speakerRegex)];
                let speakerObj = detectSpeakerFromTag(matches[0]?.[1] || '', sc);

                // หาก AI เผลอพิมพ์ตัวละครที่ 2 ต่อท้าย ให้ตัดทิ้งเพื่อคุมกติกาพูดทีละคน
                if (matches.length > 1) {
                    text = text.substring(0, matches[1].index).trim();
                }

                const cleanDisplay = text
                    .replace(/\[.*?\]/g, '')
                    .replace(/^(ฟ้า|เมฆ|พี่เอก|เอก|Fah|Mek|Michael|Emily)\s*:\s*/i, '')
                    .replace(/[*#]/g, '')
                    .trim();

                setCurrentSpeaker(speakerObj);
                setCurrentEmotion(emotion);

                const msgId = `ai-${Date.now()}`;
                setMessages(prev => [...prev, {
                    id: msgId,
                    sender: 'ai',
                    isContext: false,
                    isVoiceOnly: voiceEnabled,
                    speakerName: speakerObj.displayName,
                    emotion,
                    text: cleanDisplay
                }]);
                setIsTyping(false);

                speakText(cleanDisplay, speakerObj, false, () => {
                    setMessages(prev => prev.map(m => (m.id === msgId ? { ...m, isVoiceOnly: false } : m)));
                });
            }, [voiceEnabled, speakText]);

            // 10. ส่งข้อความของผู้เรียน
            const handleSendChat = useCallback(async (e, quickText = null) => {
                if (e) e.preventDefault();
                if (!selectedScenario || roleplayPhase !== 'negotiating' || isTyping) return;

                const userMsg = (quickText ?? chatInput).trim();
                if (!userMsg && !selectedImage) return;

                stopAudio();
                if (isListeningRef.current) stopVAD(true);

                const imgToSend = selectedImage;
                setChatInput('');
                setSelectedImage(null);
                setSmartSuggestions([]);
                setIsTyping(true);

                const userEntry = { id: `u-${Date.now()}`, sender: 'user', text: userMsg, image: imgToSend };
                const updatedMessages = [...messages, userEntry];
                setMessages(updatedMessages);

                const userTurnCount = updatedMessages.filter(m => m.sender === 'user').length;
                const historyStr = updatedMessages
                    .filter(m => !m.isContext)
                    .slice(-10)
                    .map(m => `${m.sender === 'user' ? 'Learner' : m.speakerName}: ${m.text}`)
                    .join('\n');

                const sugInstr = selectedScenario.language === 'en'
                    ? `\n\n[SMART SUGGESTIONS]\nAt the very end, add 2 realistic empathetic reply options for the learner:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`
                    : `\n\n[SMART SUGGESTIONS]\nท้ายสุดสร้างทางเลือกตอบกลับที่เหมาะสมให้ผู้เรียน 2 ข้อ:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`;

                const fullInstruction = `${scenarioPromptRef.current}${sugInstr}\n\nConversation History:\n${historyStr}\nLearner: ${userMsg}\nFamily (Respond as ONE character with [EMOTION] [Name]):`;

                // เรียก Gemini API ผ่าน Apps Script (หรือใช้ Sandbox Simulator ถ้ายังไม่เชื่อม)
                if (appsScriptUrl) {
                    const res = await callAppsScript({
                        action: 'callGemini',
                        prompt: userMsg || 'Please analyze the attached image.',
                        systemInstruction: fullInstruction,
                        base64Image: imgToSend
                    });
                    if (res?.status === 'success' && res.text) {
                        processAiDialogue(res.text, selectedScenario);
                        return;
                    }
                    showToast('ไม่สามารถติดต่อ Gemini API ได้ สลับเป็นโหมดจำลองสำรองให้อัตโนมัติค่ะ', 'info');
                }

                await new Promise(r => setTimeout(r, 650));
                const localReply = generateLocalRoleplayReply(userMsg, selectedScenario, userTurnCount);
                processAiDialogue(localReply, selectedScenario);
            }, [selectedScenario, roleplayPhase, isTyping, chatInput, selectedImage, messages, appsScriptUrl, callAppsScript, processAiDialogue, stopAudio, stopVAD, showToast]);

            // ผูก Ref ให้ VAD ส่งข้อความได้โดยไม่ต้อง Rebuild SpeechRecognition
            useEffect(() => {
                handleSendChatRef.current = handleSendChat;
            }, [handleSendChat]);

            // 11. จบสถานการณ์และประเมินผล Empathy Score (0-100) + บันทึกลง Cloud/Local
            const handleEvaluate = async () => {
                if (!selectedScenario || isTyping) return;
                stopAudio();
                stopVAD(true);

                setIsTyping(true);
                setRoleplayPhase('evaluating');
                setCurrentEmotion('ADVISING');
                setSmartSuggestions([]);

                const endMsg = {
                    id: `end-${Date.now()}`,
                    sender: 'user',
                    isSystemAction: true,
                    text: isEn ? '🛑 End simulation and request Empathy Evaluation.' : '🛑 จบการจำลองสถานการณ์ ขอรับผลการประเมินทักษะค่ะ'
                };
                const fullLogMessages = [...messages, endMsg];
                setMessages(fullLogMessages);

                const transcript = fullLogMessages
                    .filter(m => !m.isContext && !m.isSystemAction)
                    .map(m => `${m.sender === 'user' ? 'Learner' : m.speakerName}: ${m.text}`)
                    .join('\n');

                let score = 75;
                let passed = true;
                let reportText = '';

                if (appsScriptUrl) {
                    const evalPrompt = isEn
                        ? `You are a Clinical Communication Evaluator. Evaluate this ICU negotiation.\nTranscript:\n${transcript}\n1. Give an Empathy Score from 0-100 with tag [EMPATHY: score].\n2. If score >= 60 include [PASS], else [FAIL].\n3. List clear Strengths and Recommendations in English.`
                        : `คุณคืออาจารย์ผู้เชี่ยวชาญด้านจิตวิทยาการสื่อสารการแพทย์ ประเมินการเจรจานี้จากคู่มือวิชาชีพ:\n${window.CLINICAL_KNOWLEDGE_BASE || ''}\n\nบทสนทนา:\n${transcript}\n\n1. ให้คะแนน Empathy Score 0-100 พร้อมแท็ก [EMPATHY: คะแนน]\n2. หากคะแนน >= 60 ใส่ [PASS] หากต่ำกว่าใส่ [FAIL]\n3. สรุปจุดแข็งและข้อเสนอแนะที่นำไปใช้จริงในห้อง ICU ได้ชัดเจน`;

                    const res = await callAppsScript({
                        action: 'callGemini',
                        prompt: isEn ? 'Evaluate this negotiation.' : 'ประเมินผลการเจรจานี้',
                        systemInstruction: evalPrompt
                    });

                    if (res?.status === 'success' && res.text) {
                        const raw = res.text;
                        const scoreMatch = raw.match(/\[EMPATHY:\s*(\d+)\]/i);
                        score = scoreMatch ? Math.min(100, Math.max(0, parseInt(scoreMatch[1], 10))) : (raw.includes('[PASS]') ? 80 : 50);
                        passed = raw.includes('[PASS]') || score >= 60;
                        reportText = raw.replace(/\[PASS\]|\[FAIL\]|\[EMPATHY:\s*\d+\]/gi, '').trim();
                    }
                }

                if (!reportText) {
                    await new Promise(r => setTimeout(r, 700));
                    const localEval = generateLocalEvaluation(fullLogMessages, selectedScenario);
                    score = localEval.score;
                    passed = localEval.passed;
                    reportText = localEval.report;
                }

                const evalRecord = {
                    timestamp: new Date().toISOString(),
                    scenarioId: selectedScenario.id,
                    scenarioTitle: selectedScenario.title,
                    passed,
                    score,
                    evaluation: reportText
                };

                setLastEvalResult(evalRecord);
                setMessages(prev => [...prev, {
                    id: `eval-${Date.now()}`,
                    sender: 'ai',
                    isEvaluation: true,
                    isVoiceOnly: false,
                    speakerName: 'Cognitive Profiler AI',
                    text: reportText
                }]);
                setIsTyping(false);

                // บันทึกประวัติและปลดล็อก skillLabPassed ให้ผู้เรียน
                if (user) {
                    const nextUser = {
                        ...user,
                        skillLabPassed: true,
                        skillLabHistory: [...(user.skillLabHistory || []), evalRecord]
                    };
                    setUser(nextUser);
                    saveStoredUser(nextUser);

                    if (isCloudConfigured && fbDb && nextUser.id && !String(nextUser.id).startsWith('demo_')) {
                        try {
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                                { skillLabPassed: true, skillLabHistory: nextUser.skillLabHistory },
                                { merge: true }
                            );
                        } catch (err) {
                            console.warn('Firestore save skill lab error:', err);
                        }
                    }
                }

                showToast(
                    isEn ? `Evaluation saved (Empathy Score: ${score}/100)` : `บันทึกผลประเมินเรียบร้อย (Empathy Score: ${score}/100)`,
                    'success'
                );

                speakText(reportText, { voice: 'Aoede', gender: 'female' }, true);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => setSelectedImage(reader.result);
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            const handleEnterSandboxGuest = () => {
                const demoLearner = {
                    id: 'demo_masterclass',
                    license: '65012345',
                    name: 'พว.ใจดี มีเมตตา (Demo)',
                    position: 'พยาบาลวิชาชีพชำนาญการ (ICU)',
                    userType: 'Masterclass',
                    skillLabHistory: []
                };
                setUser(demoLearner);
                setAuthState('ready');
                showToast('เข้าสู่ห้องจำลองโหมดทดลอง (Masterclass Sandbox) เรียบร้อยค่ะ');
            };

            // ============================================================================
            // 5. ACCESS & LOADING GATES
            // ============================================================================
            if (authState === 'checking') {
                return (
                    <div className="min-h-dvh bg-obsidian-950 flex items-center justify-center">
                        <div className="w-10 h-10 border-4 border-cyber-400 border-t-transparent rounded-full animate-spin" />
                    </div>
                );
            }

            if (authState === 'denied' || authState === 'guest_prompt') {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 pt-safe pb-safe">
                        <div className="obsidian-aura" /><div className="obsidian-grid" />
                        <div className="lab-glass relative z-10 max-w-md w-full rounded-[2rem] p-6 sm:p-8 text-center space-y-5">
                            <div className={`w-16 h-16 rounded-2xl mx-auto flex items-center justify-center border ${
                                authState === 'denied'
                                    ? 'bg-rose-500/15 border-rose-400/30 text-rose-400'
                                    : 'bg-cyber-500/15 border-cyber-400/30 text-cyber-300'
                            }`}>
                                <Icon name={authState === 'denied' ? 'Lock' : 'Bot'} size={32} />
                            </div>
                            <div className="space-y-2">
                                <span className="px-2.5 py-0.5 rounded-full bg-white/10 font-mono text-[10px] font-bold text-cyber-300">
                                    RJCLOUD.ORGAN • AI SKILL LAB 2027
                                </span>
                                <h1 className="font-display text-2xl font-extrabold text-white">
                                    {authState === 'denied' ? 'สงวนสิทธิ์เฉพาะ Masterclass' : 'ห้องจำลองฝึกเจรจา AI Skill Lab'}
                                </h1>

                                                        <button
                                                            type="button"
                                                            onClick={() => setMessages(prev => prev.map(x => (x.id === m.id ? { ...x, isVoiceOnly: false } : x)))}
                                                            className="flex items-center gap-3 text-left text-xs text-cyber-200"
                                                        >
                                                            <div className="flex items-end gap-0.5 h-4 shrink-0">
                                                                <span className="w-1 h-full bg-cyber-400 rounded-full eq-bar" />
                                                                <span className="w-1 h-full bg-biotech-400 rounded-full eq-bar" style={{ animationDelay: '0.15s' }} />
                                                                <span className="w-1 h-full bg-cyber-400 rounded-full eq-bar" style={{ animationDelay: '0.3s' }} />
                                                            </div>
                                                            <span>{isEn ? 'Listening to voice... (Tap to show transcript)' : 'กำลังฟังเสียงญาติ... (แตะเพื่อเปิดอ่านข้อความ)'}</span>
                                                        </button>
                                                    ) : (
                                                        <span className="whitespace-pre-wrap">{m.text}</span>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {isTyping && (
                                        <div className="flex justify-start">
                                            <div className="px-4 py-3 rounded-2xl bg-white/10 border border-white/15 flex items-center gap-1.5">
                                                <span className="w-2 h-2 rounded-full bg-cyber-400 animate-bounce" />
                                                <span className="w-2 h-2 rounded-full bg-biotech-400 animate-bounce" style={{ animationDelay: '0.15s' }} />
                                                <span className="w-2 h-2 rounded-full bg-cyber-400 animate-bounce" style={{ animationDelay: '0.3s' }} />
                                            </div>
                                        </div>
                                    )}
                                    <div ref={messagesEndRef} />
                                </div>

                                {/* BOTTOM COMPOSER AREA (Thumb-Friendly + Safe Area) */}
                                <div className="shrink-0 p-3 sm:p-4 pb-[calc(0.75rem+env(safe-area-inset-bottom,0px))] bg-obsidian-900/95 border-t border-white/10 space-y-2.5">

                                    {/* Smart Suggestion Chips */}
                                    {roleplayPhase === 'negotiating' && smartSuggestions.length > 0 && !isTyping && (
                                        <div className="flex flex-col gap-1.5">
                                            <p className="text-[10px] font-mono text-slate-400 px-1 flex items-center gap-1">
                                                <Icon name="Lightbulb" size={11} className="text-amber-300" />
                                                {isEn ? 'Suggested empathetic replies:' : 'แนวทางคำพูดแนะนำ (แตะเพื่อส่ง):'}
                                            </p>
                                            <div className="flex flex-col sm:grid sm:grid-cols-2 gap-1.5">
                                                {smartSuggestions.map((sug, idx) => (
                                                    <button
                                                        key={idx}
                                                        type="button"
                                                        onClick={() => handleSendChat(null, sug)}
                                                        className="text-left px-3 py-2 rounded-xl bg-white/8 hover:bg-white/15 border border-white/15 text-[11px] sm:text-xs text-slate-200 line-clamp-2 transition-colors active:scale-[0.99]"
                                                    >
                                                        {sug}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* VAD Audio Volume Bar */}
                                    {isListening && (
                                        <div className="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
                                            <div
                                                className="h-full bg-gradient-to-r from-biotech-400 to-cyber-400 transition-all duration-75"
                                                style={{ width: `${Math.max(8, audioLevel)}%` }}
                                            />
                                        </div>
                                    )}

                                    {/* Attached Image Preview */}
                                    {selectedImage && (
                                        <div className="relative inline-block">
                                            <img src={selectedImage} alt="Preview" className="h-14 w-14 rounded-xl object-cover border border-white/30" />
                                            <button
                                                type="button"
                                                onClick={() => setSelectedImage(null)}
                                                className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center"
                                            >
                                                <Icon name="X" size={13} />
                                            </button>
                                        </div>
                                    )}

                                    {/* Input Form (ล็อกอัตโนมัติระหว่าง giving_context / evaluating / isTyping) */}
                                    <form onSubmit={handleSendChat} className="flex items-center gap-2">
                                        <input type="file" id="lab-img-upload" accept="image/*" className="hidden" onChange={handleImageUpload} disabled={isInputLocked} />
                                        <label
                                            htmlFor="lab-img-upload"
                                            className={`touch-target w-11 h-11 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center shrink-0 transition-colors ${
                                                isInputLocked ? 'opacity-40 pointer-events-none' : 'text-slate-300 hover:bg-white/15 cursor-pointer'
                                            }`}
                                        >
                                            <Icon name="Image" size={18} />
                                        </label>

                                        <input
                                            type="text"
                                            value={chatInput}
                                            onChange={e => setChatInput(e.target.value)}
                                            disabled={isInputLocked}
                                            placeholder={
                                                roleplayPhase === 'giving_context'
                                                    ? (isEn ? 'Reading case briefing...' : 'กำลังอ่านข้อมูลเบื้องต้น...')
                                                    : roleplayPhase === 'evaluating'
                                                        ? (isEn ? 'Simulation ended.' : 'จบการประเมินแล้ว')
                                                        : isListening
                                                            ? (isEn ? 'Listening...' : 'กำลังฟังเสียงพูด...')
                                                            : (isEn ? 'Type or tap mic to speak...' : 'พิมพ์โต้ตอบ หรือกดไมค์พูด...')
                                            }
                                            className="touch-target flex-1 px-4 py-2.5 rounded-2xl bg-white/10 border border-white/15 text-white placeholder-slate-400 focus:outline-none focus:border-cyber-400 disabled:opacity-50 text-sm"
                                        />

                                        <button
                                            type="button"
                                            onClick={toggleMic}
                                            disabled={isInputLocked}
                                            aria-label="เปิด/ปิดไมโครโฟน"
                                            className={`touch-target w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 transition-all disabled:opacity-40 ${
                                                isListening
                                                    ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/40 animate-pulse'
                                                    : 'bg-white/10 hover:bg-white/15 border border-white/15 text-slate-200'
                                            }`}
                                        >
                                            <Icon name={isListening ? 'MicOff' : 'Mic'} size={18} />
                                        </button>

                                        <button
                                            type="submit"
                                            disabled={isInputLocked || (!chatInput.trim() && !selectedImage)}
                                            aria-label="ส่งข้อความ"
                                            className="touch-target w-11 h-11 rounded-2xl bg-gradient-to-r from-biotech-500 to-cyber-500 disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-400 text-slate-950 flex items-center justify-center shrink-0 shadow-md active:scale-95"
                                        >
                                            <Icon name="Send" size={18} />
                                        </button>
                                    </form>
                                </div>
                            </section>
                        </main>
                    )}

                    {/* ==================== EVALUATION HISTORY MODAL ==================== */}
                    {showHistoryModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="w-full sm:max-w-lg max-h-[82dvh] flex flex-col bg-obsidian-900 border border-white/15 rounded-t-[2rem] sm:rounded-[2rem] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom,0px))] shadow-2xl">
                                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                                    <h3 className="font-display font-bold text-base text-white flex items-center gap-2">
                                        <Icon name="History" size={18} className="text-cyber-300" /> ประวัติผลการประเมิน Skill Lab
                                    </h3>
                                    <button onClick={() => setShowHistoryModal(false)} className="w-9 h-9 rounded-full bg-white/10 text-slate-300 flex items-center justify-center">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar py-4 space-y-3">
                                    {(user?.skillLabHistory || []).length > 0 ? (
                                        [...user.skillLabHistory].reverse().map((item, i) => (
                                            <div key={i} className="p-4 rounded-2xl bg-white/5 border border-white/10 space-y-2">
                                                <div className="flex items-center justify-between gap-2">
                                                    <span className="font-display font-bold text-sm text-white truncate">
                                                        {item.scenarioTitle || `Case #${item.scenarioId}`}
                                                    </span>
                                                    <span className={`font-mono text-sm font-extrabold px-2.5 py-0.5 rounded-full ${
                                                        item.passed ? 'bg-biotech-500/20 text-biotech-300' : 'bg-amber-500/20 text-amber-300'
                                                    }`}>
                                                        {item.score}/100
                                                    </span>
                                                </div>
                                                <p className="text-[11px] font-mono text-slate-400">
                                                    {item.timestamp ? new Date(item.timestamp).toLocaleString('th-TH') : ''}
                                                </p>
                                                <p className="text-xs text-slate-300 whitespace-pre-line leading-relaxed line-clamp-5">
                                                    {item.evaluation}
                                                </p>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="text-center py-10 text-sm text-slate-400">
                                            ยังไม่มีประวัติการประเมิน ลองเลือกกรณีศึกษาเพื่อเริ่มฝึกได้เลยค่ะ
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('skilllab-root'));
        root.render(<ErrorBoundary><SkillLabApp /></ErrorBoundary>);
    </script>
</body>
</html>
