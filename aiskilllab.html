    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

            '  vec3 p = position;',
            '  float freq = 2.0 + uTension * 1.4;',
            '  float w1 = sin(p.x * freq + uTime * 1.35) * cos(p.y * freq - uTime * 1.1);',
            '  float w2 = sin(p.z * (freq * 1.25) - uTime * 1.65) * cos(p.x * 1.6 + uTime * 0.9);',
            '  float w3 = cos((p.y + p.z) * 3.1 + uTime * 2.2) * 0.45;',
            '  float disp = (w1 * 0.55 + w2 * 0.45 + w3 * 0.35) * (0.085 + uSpeak * 0.095 + uTension * 0.045);',
            '  vec3 displaced = p + normal * disp;',
            '  vDisp = disp;',
            '  vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);',
            '  vNormal = normalize(normalMatrix * normal);',
            '  vViewPos = -mvPosition.xyz;',
            '  gl_Position = projectionMatrix * mvPosition;',
            '}'
        ].join('\n');

        const LIQUID_ORB_FRAG = [
            'uniform vec3 uColor1;',
            'uniform vec3 uColor2;',
            'uniform float uTime;',
            'uniform float uSpeak;',
            'varying vec3 vNormal;',
            'varying vec3 vViewPos;',
            'varying float vDisp;',
            'void main() {',
            '  vec3 N = normalize(vNormal);',
            '  vec3 V = normalize(vViewPos);',
            '  float ndotv = clamp(dot(N, V), 0.0, 1.0);',
            '  float fresnel = pow(1.0 - ndotv, 2.35);',
            '  float swirl = 0.5 + 0.5 * sin(vDisp * 12.0 + N.y * 2.4 + uTime * 0.7);',
            '  vec3 baseCol = mix(uColor1, uColor2, swirl);',
            '  vec3 pearlescent = mix(baseCol, vec3(0.95, 0.99, 1.0), fresnel * 0.85);',
            '  float coreGlow = pow(ndotv, 1.7) * (0.34 + uSpeak * 0.24);',
            '  vec3 finalCol = pearlescent + baseCol * coreGlow;',
            '  float alpha = clamp(0.28 + fresnel * 0.76 + coreGlow * 0.35, 0.22, 0.96);',
            '  gl_FragColor = vec4(finalCol, alpha);',
            '}'
        ].join('\n');

        function extractDefaultAddressName(learnerObj, isEn) {
            const raw = String(learnerObj?.name || '').trim();
            if (!raw) return isEn ? 'Nurse' : 'คุณพยาบาล';
            const cleaned = raw
                .replace(/\(Preview\)/gi, '')
                .replace(/^(พว\.|นพ\.|พญ\.|นายแพทย์|แพทย์หญิง|พยาบาลวิชาชีพ|คุณ|นาย|นางสาว|นาง|ดร\.)\s*/i, '')
                .trim();
            const firstToken = cleaned.split(/\s+/)[0] || raw.split(/\s+/)[0] || '';
            if (!firstToken) return isEn ? 'Nurse' : 'คุณพยาบาล';
            return isEn ? firstToken : `คุณ${firstToken}`;
        }

        function detectSelfIntroductionName(text, isEn) {
            const s = String(text || '').trim();
            if (!s) return null;
            if (isEn) {
                const m = s.match(/(?:i(?:'m| am)|my name is|call me)\s+([A-Za-z][A-Za-z.\s]{1,22}?)(?:[,.!?]|$|\s+(?:and|from|the|a|an|nurse|coordinator))/i);
                return m && m[1] ? m[1].trim() : null;
            }
            const patterns = [
                /เรียก(?:ว่า|ฉันว่า|ดิฉันว่า|ผมว่า|หนูว่า)?\s*([^\s,."”?!]{2,18})/,
                /(?:ดิฉัน|ฉัน|ผม|หนู|กระผม)\s*ชื่อ\s*([^\s,."”?!]{2,18})/,
                /ชื่อ\s*(?:พี่|หมอ|คุณ|พยาบาล|น้อง)?\s*([^\s,."”?!]{2,18})/
            ];
            for (const rx of patterns) {
                const m = s.match(rx);
                if (m && m[1]) {
                    const candidate = m[1].replace(/(?:นะคะ|นะครับ|ค่ะ|ครับ|นะ)$/g, '').trim();
                    if (candidate.length >= 2 && !/^(พยาบาลผู้ประสานงาน|เจ้าหน้าที่|บุคลากร)$/.test(candidate)) {
                        return /^(พี่|หมอ|คุณ|น้อง|อาจารย์|พว\.|นพ\.|พญ\.)/.test(candidate) ? candidate : `คุณ${candidate}`;
                    }
                }
            }
            return null;
        }

        function detectTriggerPhrases(text, lang = 'th') {
            const input = String(text || '');
            return TRIGGER_DICT.filter(item => item.lang === lang && item.pattern.test(input));
        }

        function parseRelativeResponse(rawText) {
            let txt = String(rawText || '').trim();
            let emotion = null;
            let actionCue = '';
            let decision = null;

            const emoMatch = txt.match(/\[(?:EMOTION|อารมณ์)\s*[:=]\s*(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                txt = txt.replace(emoMatch[0], '').trim();
            }

            const decMatch = txt.match(/\[DECISION\s*[:=]\s*(CONSENT|DECLINE|HOME_DECIDE|NONE)\]/i);
            if (decMatch) {
                const val = decMatch[1].toUpperCase();
                if (val !== 'NONE') decision = val;
                txt = txt.replace(decMatch[0], '').trim();
            }

            const actMatch = txt.match(/\[ACTION\s*[:=]?\s*([^\]]+)\]/i);
            if (actMatch) {
                actionCue = actMatch[1].trim();
                txt = txt.replace(actMatch[0], '').trim();
            }

            return { text: txt, emotion, actionCue, decision };
        }

        function splitIntoVoiceSegments(rawText, personaObj, isEn) {
            const clean = String(rawText || '').replace(/\[ACTION[^\]]*\]/gi, '').replace(/\[EMOTION[^\]]*\]/gi, '').replace(/\[DECISION[^\]]*\]/gi, '').trim();
            if (!clean) return [];

            if (personaObj?.id === 'conflict') {
                const rx = /(\[(?:ภรรยา|คุณแม่|Wife|Mother)[^\]]*\]:?)/gi;
                const parts = clean.split(rx).filter(Boolean);
                const segs = [];
                let curLabel = isEn ? 'Wife' : 'ภรรยา';
                let curVoice = personaObj.voiceName || 'Sulafat';

                parts.forEach(part => {
                    const trimmed = part.trim();
                    if (!trimmed) return;
                    if (/^\[(?:ภรรยา|Wife)/i.test(trimmed)) {
                        curLabel = isEn ? 'Wife' : 'ภรรยา';
                        curVoice = personaObj.voiceName || 'Sulafat';
                    } else if (/^\[(?:คุณแม่|Mother)/i.test(trimmed)) {
                        curLabel = isEn ? 'Mother' : 'คุณแม่';
                        curVoice = personaObj.secondaryVoiceName || 'Kore';
                    } else {
                        segs.push({ speakerLabel: curLabel, voiceName: curVoice, text: trimmed });
                    }
                });
                if (segs.length > 0) return segs;
            }

            return [{
                speakerLabel: isEn ? 'Relative' : (personaObj?.speakerRoleTH || 'ญาติผู้ป่วย'),
                voiceName: personaObj?.voiceName || 'Sulafat',
                text: clean
            }];
        }

        function prepareNaturalSpeech(text, isEn) {
            const stripped = String(text || '')
                .replace(/\[[^\]]+\]:?\s*/g, '')
                .replace(/[*#_]/g, ' ')
                .replace(/\s{2,}/g, ' ')
                .trim();
            if (!isEn && typeof CORE.prepareNaturalThaiSpeech === 'function') {
                return CORE.prepareNaturalThaiSpeech(stripped);
            }
            return stripped;
        }

        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            if (typeof CORE.pcm16ToWavBlob === 'function') {
                const blob = CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                return blob && blob.size > 0 ? URL.createObjectURL(blob) : '';
            }
            const bin = window.atob(base64PCM);
            const raw = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
            const off = (raw.length > 44 && raw[0] === 0x52 && raw[1] === 0x49) ? 44 : 0;
            const len = Math.max(0, raw.length - off);
            const buf = new ArrayBuffer(44 + len);
            const v = new DataView(buf);
            const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            ws(0, 'RIFF'); v.setUint32(4, 36 + len, true); ws(8, 'WAVE'); ws(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
            v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, len, true);
            new Uint8Array(buf, 44).set(raw.subarray(off));
            return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
        }

        function playGentleKnockSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                [0, 0.24].forEach(delay => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(165, ctx.currentTime + delay);
                    osc.frequency.exponentialRampToValueAtTime(68, ctx.currentTime + delay + 0.09);
                    gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + delay + 0.012);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.11);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + delay);
                    osc.stop(ctx.currentTime + delay + 0.12);
                });
            } catch (_) {}
        }

        function generateOfflineRelativeReply({ persona, learnerText, turnIdx, maxTurns, addrName, isEn, askedHomeAlready }) {
            const t = String(learnerText || '').toLowerCase();
            const hasEmpathy = /เสียใจ|เข้าใจ|ห่วง|เคารพ|ค่อยๆ|ไม่เร่ง|เวลา|พร้อม|sorry|understand|gentle|respect|time/.test(t);
            const hasClinical = /สมองตาย|เครื่องช่วยหายใจ|ก้านสมอง|สภากาชาด|odc|ตกแต่ง|ค่าใช้จ่าย|brain death|ventilator|dignity|cost/.test(t);
            const allowsHome = /กลับไป|ที่บ้าน|ปรึกษา|ไม่เร่ง|ตามสะดวก|home|discuss|no rush|take your time/.test(t);
            const isFinalTurn = turnIdx >= maxTurns - 1;

            if (isFinalTurn) {
                if (hasEmpathy && hasClinical) {
                    if (askedHomeAlready && allowsHome) {
                        return {
                            emotion: 'CALM',
                            decision: 'HOME_DECIDE',
                            actionCue: isEn ? 'Nods softly with relief and wipes away tears' : 'พยักหน้าเบาๆ สีหน้าผ่อนคลายลงและซับน้ำตาอย่างซาบซึ้ง',
                            text: isEn
                                ? `Thank you so much, ${addrName}. Knowing we aren't rushed helps a lot. I would like to go home and consult with our family first before giving our final answer.`
                                : `ขอบคุณ${addrName}มากนะคะที่อธิบายชัดเจนและไม่เร่งรัดกันเลย หนูขอนำข้อมูลทั้งหมดกลับไปปรึกษาครอบครัวที่บ้านก่อน แล้วจะรีบแจ้งคำตอบให้ทราบนะคะ`
                        };
                    }
                    return {
                        emotion: 'CALM',
                        decision: 'CONSENT',
                        actionCue: isEn ? 'Takes a calm breath and looks up with quiet trust' : 'คลายไหล่ลง สูดลมหายใจลึก และสบตาอย่างไว้วางใจ',
                        text: isEn
                            ? `Thank you, ${addrName}. Everything feels clear and respectful now. Our family agrees to consent to organ donation so our loved one can help save other lives.`
                            : persona.id === 'conflict'
                                ? `[ภรรยา]: ขอบคุณ${addrName}ที่รับฟังพวกเราค่ะ [คุณแม่]: พอรู้ว่าทีมหมอจะดูแลร่างลูกแม่ให้เรียบร้อยและช่วยต่อชีวิตคนอื่นได้จริง... แม่ก็เริ่มสบายใจขึ้นแล้วค่ะ งั้นครอบครัวเรายินยอมบริจาคอวัยวะให้เป็นบุญครั้งสุดท้ายของต้นนะคะ`
                                : `ขอบคุณ${addrName}มากจริงๆ นะคะที่รับฟังและอธิบายทุกอย่างอย่างอ่อนโยน ตอนนี้ครอบครัวเราเข้าใจและสบายใจขึ้นมากแล้วค่ะ ขอยินยอมบริจาคอวัยวะเพื่อช่วยต่อชีวิตให้คนอื่นต่อไปนะคะ`
                    };
                }
                return {
                    emotion: 'SAD',
                    decision: 'DECLINE',
                    actionCue: isEn ? 'Lowers head gently, still feeling overwhelmed' : 'ก้มหน้าลงเบาๆ ยังรู้สึกหนักใจและไม่พร้อมปล่อยวาง',
                    text: isEn
                        ? `Thank you for talking with me, ${addrName}. Everything still feels too overwhelming right now, so our family has decided not to donate organs.`
                        : `ขอบคุณ${addrName}ที่มานั่งคุยกันนะคะ แต่ตอนนี้จิตใจครอบครัวยังไม่พร้อมจริงๆ ค่ะ ขอตัดสินใจไม่บริจาคอวัยวะนะคะ`
                };
            }

            if (turnIdx === maxTurns - 2 && !askedHomeAlready) {
                return {
                    emotion: hasEmpathy ? 'HESITANT' : 'CONFUSED',
                    decision: null,
                    actionCue: isEn ? 'Pauses thoughtfully while holding the tissue' : 'เงียบไปครู่หนึ่ง พลิกลำดับความคิดด้วยสีหน้าลังเล',
                    text: isEn
                        ? `I’m starting to understand better, ${addrName}... Before we decide, is it okay if I go back home to discuss this with the rest of our family first?`
                        : `พอฟัง${addrName}อธิบายก็เริ่มเข้าใจมากขึ้นแล้วค่ะ... แต่เรื่องนี้เป็นเรื่องใหญ่มากสำหรับครอบครัว ขอถามนิดนึงนะคะว่า เราสามารถกลับไปปรึกษาตัดสินใจกันที่บ้านก่อนได้ไหมคะ?`
                };
            }

            if (persona.id === 'conflict') {
                return {
                    emotion: hasEmpathy ? 'HESITANT' : 'ANGRY',
                    decision: null,
                    actionCue: hasEmpathy ? 'คุณแม่คลายมือที่กอดอกลงเล็กน้อย ภรรยาจับมือคุณแม่เบาๆ' : 'คุณแม่ขมวดคิ้วแน่น น้ำเสียงยังคงสั่นเครือ',
                    text: hasEmpathy
                        ? `[คุณแม่]: จริงเหรอคะ${addrName}ว่าถ้าแม่ยังไม่พร้อมจะไม่มีใครมาบังคับ... [ภรรยา]: หนูก็ไม่อยากฝืนใจแม่เหมือนกันค่ะ แต่อยากทราบว่าหลังผ่าตัดร่างพี่ต้นจะเรียบร้อยเหมือนเดิมไหมคะ?`
                        : `[คุณแม่]: แม่ไม่สนเรื่องขั้นตอนหรอกค่ะ${addrName} ตอนนี้แม่เสียใจจะแย่อยู่แล้ว [ภรรยา]: แม่ใจเย็นก่อนนะคะ ลองฟัง${addrName}อธิบายก่อนได้ไหมคะ`
                };
            }

            return {
                emotion: hasEmpathy && hasClinical ? 'HESITANT' : (hasEmpathy ? 'SAD' : 'CONFUSED'),
                decision: null,
                actionCue: hasEmpathy ? 'สีหน้าคลายความเกร็งลงเล็กน้อย ตั้งใจฟังมากขึ้น' : 'ขมวดคิ้วด้วยความกังวลและยังจับทิชชูแน่น',
                text: isEn
                    ? `Thank you, ${addrName}. Could you also reassure me about how my loved one’s body will be cared for and whether there are any costs or fairness concerns?`
                    : `ขอบคุณค่ะ${addrName}... แต่หนูยังอดกังวลไม่ได้เลยค่ะว่าขั้นตอนการบริจาคอวัยวะมีความโปร่งใสแค่ไหน มีค่าใช้จ่ายเพิ่มไหม แล้วร่างของท่านจะได้รับการดูแลให้เรียบร้อยเหมือนเดิมหรือเปล่าคะ?`
            };
        }

        function evaluateConversationLocal(history, silenceHits, triggerCount, isEn, decision) {
            const learnerMsgs = history.filter(m => m.role === 'learner').map(m => m.text);
            const joined = learnerMsgs.join(' ').toLowerCase();

            const setting = Math.min(100, 62 + (/สวัสดี|พยาบาล|ประสานงาน|ส่วนตัว|เงียบ|hello|coordinator|private/.test(joined) ? 28 : 10) + (learnerMsgs.length >= 2 ? 6 : 0));
            const empathy = Math.min(100, 60 + (/เสียใจ|เข้าใจ|รับฟัง|หนักใจ|ห่วง|เคารพ|sorry|understand|feel|gentle/.test(joined) ? 30 : 12) + Math.min(10, silenceHits * 5));
            const clarity = Math.min(100, 58 + (/สมองตาย|เครื่องช่วยหายใจ|ก้านสมอง|สภากาชาด|odc|โปร่งใส|ค่าใช้จ่าย|brain death|ventilator|transparent|cost/.test(joined) ? 32 : 12));
            const vocal = Math.min(100, Math.max(45, 72 + Math.min(24, silenceHits * 8) - triggerCount * 10));
            const dignity = Math.min(100, Math.max(50, 68 + (/ไม่เร่ง|เวลา|ปรึกษา|ตกแต่ง|เรียบร้อย|สมเกียรติ|เกียรติ|dignity|no rush|time|respect/.test(joined) ? 28 : 10) - triggerCount * 8));

            const radar = [
                { key: 'setting', value: setting },
                { key: 'empathy', value: empathy },
                { key: 'clarity', value: clarity },
                { key: 'vocal', value: vocal },
                { key: 'dignity', value: dignity }
            ];
            const overall = Math.round(radar.reduce((s, r) => s + r.value, 0) / radar.length);

            const goldenQuote = learnerMsgs.find(m => /เสียใจ|เข้าใจ|ไม่เร่ง|ตกแต่ง|สมเกียรติ|sorry|understand|dignity/i.test(m)) || learnerMsgs[0] || '';
            const turningQuote = learnerMsgs.find(m => detectTriggerPhrases(m, isEn ? 'en' : 'th').length > 0) || learnerMsgs[learnerMsgs.length - 1] || '';

            return {
                overall,
                radar,
                decision: decision || 'HOME_DECIDE',
                source: 'local',
                goldenMoment: goldenQuote
                    ? (isEn ? `Strong empathetic phrasing: “${goldenQuote}”` : `ประโยคที่ช่วยเปิดใจญาติได้ดีมาก: “${goldenQuote}”`)
                    : (isEn ? 'You maintained a respectful, calm presence throughout.' : 'คุณรักษาท่าทีที่สุภาพ นุ่มนวล และเคารพครอบครัวได้ดีตลอดการสนทนาค่ะ'),
                turningPoint: triggerCount > 0
                    ? (isEn ? `Consider softening phrasing around “${turningQuote}” to reduce emotional shock.` : `ลองเกลาคำพูดบางช่วงให้ลดคำกระทบใจ เช่น ใช้ “ยุติเครื่องพยุงชีพอย่างสงบ” และ “ดูแลร่างอย่างประณีต”`)
                    : (isEn ? 'Try pausing 2.5 seconds after emotional disclosures before offering clinical facts.' : 'แนะนำเว้นจังหวะความเงียบ 2.5 วินาทีหลังญาติสะเทือนใจก่อนให้ข้อมูลคลินิก จะยิ่งเพิ่มความไว้วางใจค่ะ'),
                summary: isEn
                    ? `You completed ${learnerMsgs.length} turns with ${silenceHits} therapeutic silence pauses. Empathy & clarity scored ${overall}/100.`
                    : `คุณสื่อสารครบ ${learnerMsgs.length} รอบ ใช้ความเงียบเยียวยา ${silenceHits} ครั้ง คะแนนรวมทักษะสื่อสาร 5 แกนอยู่ที่ ${overall}/100 คะแนนค่ะ`
            };
        }

        // ============================================================================
        // 2.5 AI LAB ADVISOR (วิเคราะห์ประวัติผู้เรียน + แนะนำรูปแบบ/ระดับ/เคสก่อนเข้าฝึก)
        // ============================================================================
        const LAB_GOAL_PRESETS = [
            { id: 'auto', label: 'AI วิเคราะห์ให้', icon: 'Sparkles' },
            { id: 'beginner', label: 'เพิ่งฝึกครั้งแรก', icon: 'Compass' },
            { id: 'quick', label: 'เวลาน้อย ซ้อมไว', icon: 'Clock' },
            { id: 'hard_conflict', label: 'ฝึกเคสหิน 2 เสียง', icon: 'ShieldAlert' },
            { id: 'english', label: 'ฝึกภาษาอังกฤษ', icon: 'Globe' }
        ];

        function computeLabRecommendation(learnerObj, goalId = 'auto') {
            const addrName = extractDefaultAddressName(learnerObj, false);
            const hist = Array.isArray(learnerObj?.skillLabHistory) ? learnerObj.skillLabHistory : [];
            const bestScore = typeof learnerObj?.skillLabBestScore === 'number'
                ? learnerObj.skillLabBestScore
                : (hist.length > 0 ? Math.max(...hist.map(h => Number(h?.score || 0))) : null);
            const practicedIds = new Set(hist.map(h => h?.personaId).filter(Boolean));
            const latestRadar = learnerObj?.skillLabLatestRadar || null;

            const weakAxisEntry = latestRadar
                ? RADAR_AXES
                    .map(a => ({ ...a, val: Number(latestRadar[a.key] || 0) }))
                    .filter(a => a.val > 0)
                    .sort((a, b) => a.val - b.val)[0]
                : null;

            // โหมดเลือกเป้าหมายเองแบบเร่งด่วน
            if (goalId === 'beginner') {
                return {
                    modeId: 'roleplay_th',
                    difficultyId: 'normal',
                    personaId: 'standard',
                    hologramStyle: 'lotus',
                    badge: 'AI แนะนำสำหรับผู้เริ่มต้น',
                    headline: 'เริ่มจาก Roleplay ไทย • ระดับ Normal • เคสที่ 1 (คุณพ่อ)',
                    reason: 'เคสคุณพ่อเป็นสถานการณ์มาตรฐานที่พบบ่อยที่สุด ระดับ Normal จะแสดงปุ่มแนวทางคำพูดช่วยให้คุณจับจังหวะการอธิบายภาวะสมองตายและการเว้นความเงียบ 2.5 วินาทีได้อย่างมั่นใจค่ะ',
                    speechText: `สวัสดีค่ะ${addrName} สำหรับการเริ่มฝึกครั้งแรก แนะนำให้เลือก โรลเพลย์เต็มรูปแบบภาษาไทย ระดับนอร์มอล และเคสที่หนึ่งเรื่องญาติสับสนภาวะสมองตายค่ะ เพราะมีปุ่มแนวทางคำพูดคอยช่วย และใช้ดอกบัวแสงเพื่อให้เห็นจังหวะที่ญาติค่อยๆ เปิดใจค่ะ`

                return {
                    modeId: 'micro_drill',
                    difficultyId: 'normal',
                    personaId: pickPersona,
                    hologramStyle: 'particles',

                    reason: 'โหมด Micro-Drill จบครบการประเมิน 5 แกนภายใน 4 รอบสนทนา เหมาะสำหรับทบทวนคำถามเฉพาะจุดบนสมาร์ทโฟนช่วงพักเวรค่ะ',
                    speechText: `หากมีเวลาจำกัด แนะนำโหมด ไมโครดริล สี่ด่าน ระดับนอร์มอล คู่กับ${pTitle} ค่ะ ใช้เวลาเพียงไม่กี่นาทีก็ได้ฝึกตอบคำถามสำคัญและรับผลประเมินครบทั้งห้าแกนค่ะ`
                };
            }
            if (goalId === 'hard_conflict') {
                return {
                    modeId: 'roleplay_th',
                    difficultyId: 'hard',
                    personaId: 'conflict',
                    hologramStyle: 'dual',
                    badge: 'AI แนะนำสำหรับยกระดับความเชี่ยวชาญ',
                    headline: 'ท้าทาย Roleplay ไทย • ระดับ Hard • เคสที่ 3 (ความขัดแย้ง 2 เสียง)',
                    reason: 'โหมด Hard ซ่อนแนวทางคำพูดเพื่อให้คิดตอบเอง 100% คู่กับเคส 3 ที่มีภรรยาและคุณแม่โต้ตอบ 2 เสียงจริง พร้อม Hologram ดวงแสงคู่ 2 เสียงค่ะ',
                    speechText: `สำหรับความท้าทายระดับสูง แนะนำ โรลเพลย์ภาษาไทย ระดับฮาร์ด ในเคสที่สาม ความขัดแย้งในครอบครัวสองเสียง พร้อมโฮโลแกรมดวงแสงคู่ค่ะ จะได้ฝึกวางตัวเป็นกลางระหว่างภรรยากับคุณแม่โดยไม่ใช้ตัวช่วยค่ะ`
                };
            }
            if (goalId === 'english') {
                return {
                    modeId: 'roleplay_en',
                    difficultyId: bestScore && bestScore >= 85 ? 'hard' : 'normal',
                    personaId: 'standard',
                    hologramStyle: 'liquid',
                    badge: 'AI แนะนำสำหรับฝึกสื่อสารนานาชาติ (EN)',
                    headline: `เลือก International Family (EN) • ระดับ ${bestScore && bestScore >= 85 ? 'Hard' : 'Normal'} • เคสที่ 1`,
                    reason: 'ฝึกอธิบายภาวะสมองตายและหลัก Decoupling เป็นภาษาอังกฤษอย่างสุภาพอ่อนโยน พร้อมระบบเสียงและการประเมิน 5 แกนมาตรฐานสากลค่ะ',
                    speechText: `สำหรับฝึกสื่อสารกับครอบครัวชาวต่างชาติ แนะนำโหมด อินเตอร์เนชั่นแนลแฟมิลี่ ภาษาอังกฤษ คู่กับเคสที่หนึ่งค่ะ จะได้ฝึกใช้คำศัพท์ทางการแพทย์ที่สุภาพและนุ่มนวลเป็นภาษาอังกฤษค่ะ`
                };
            }

            // โหมดอัตโนมัติ (AI วิเคราะห์จากประวัติการเรียนและคะแนนจริงของผู้เรียน)
            if (hist.length === 0) {
                const isTC = /TC|รับบริจาค|ปลูกถ่าย/i.test(`${learnerObj?.workContext || ''} ${learnerObj?.position || ''}`);
                const isContinuing = learnerObj?.userType === 'เรียนต่อเนื่อง';
                if (isTC || isContinuing) {
                    return {
                        modeId: 'roleplay_th',
                        difficultyId: 'normal',
                        personaId: 'belief',
                        hologramStyle: 'lotus',
                        badge: 'AI วิเคราะห์จากโปรไฟล์ของคุณ',
                        headline: 'แนะนำ Roleplay ไทย • ระดับ Normal • เคสที่ 2 (ความเชื่อ & ศาสนา)',
                        reason: `เห็นว่า${addrName}มีพื้นฐานงานรับบริจาค/เรียนต่อเนื่องอยู่แล้ว แนะนำเริ่มอุ่นเครื่องด้วยระดับ Normal ในเคสที่ 2 เพื่อฝึกตอบข้อกังวลเรื่องความเชื่อของคุณยายและพิธีศาสนาที่พบบ่อยในสังคมไทยค่ะ`,
                        speechText: `สวัสดีค่ะ${addrName} ดิฉันดูจากโปรไฟล์ของคุณแล้ว แนะนำให้เริ่มอุ่นเครื่องด้วย โรลเพลย์เต็มรูปแบบ ระดับนอร์มอล และเคสที่สองเรื่องความเชื่อและพิธีกรรมค่ะ เมื่อมั่นใจแล้วค่อยขยับไประดับฮาร์ดในรอบถัดไปนะคะ`
                    };
                }
                return {
                    modeId: 'roleplay_th',
                    difficultyId: 'normal',
                    personaId: 'standard',
                    hologramStyle: 'lotus',
                    badge: 'AI แนะนำเฉพาะคุณ (ครั้งแรก)',
                    headline: 'เริ่มด้วย Roleplay ไทย • ระดับ Normal • เคสที่ 1 (คุณพ่อ)',
                    reason: `ยังไม่พบประวัติฝึกใน AI Skill Lab ค่ะ แนะนำเริ่มจากระดับ Normal (มีปุ่มแนวทางคำพูดช่วย) ในเคสที่ 1 เพื่อฝึกสร้างความคุ้นเคยกับการอธิบายเครื่องช่วยหายใจและภาวะสมองตายก่อนค่ะ`,
                    speechText: `สวัสดีค่ะ${addrName} ยินดีต้อนรับสู่ห้องฝึกสื่อสารสามมิติค่ะ เนื่องจากเป็นการฝึกครั้งแรก แนะนำให้เลือก โรลเพลย์เต็มรูปแบบภาษาไทย ระดับนอร์มอล และเคสที่หนึ่งเรื่องคุณพ่อค่ะ ระบบจะมีปุ่มแนวทางคำพูดคอยช่วย กดปุ่มเลือกตามเอไอแนะนำด้านล่างแล้วเริ่มได้เลยนะคะ`
                };
            }

            // เคยฝึกมาแล้ว: หาเคสที่ยังไม่เคยลอง + ปรับระดับความยากตามคะแนนเดิม
            const unpracticed = PERSONAS.find(p => !practicedIds.has(p.id));
            const nextPersonaId = unpracticed ? unpracticed.id : (weakAxisEntry?.key === 'clarity' ? 'distrust' : 'conflict');
            const nextPersona = PERSONAS.find(p => p.id === nextPersonaId) || PERSONAS[0];
            const shouldGoHard = (bestScore !== null && bestScore >= 85) || hist.length >= 2;
            const recDiff = shouldGoHard ? 'hard' : 'normal';
            const recHolo = nextPersonaId === 'conflict' ? 'dual' : (weakAxisEntry?.key === 'vocal' ? 'slanted' : 'liquid');
            const weakNote = weakAxisEntry
                ? ` จากรอบก่อนแกนที่ควรเสริมคือ “${weakAxisEntry.labelTH}” (${weakAxisEntry.val}/100)`
                : '';

            return {
                modeId: hist.length >= 4 && bestScore >= 88 ? 'roleplay_en' : 'roleplay_th',
                difficultyId: recDiff,
                personaId: nextPersonaId,
                hologramStyle: recHolo,
                badge: `AI วิเคราะห์จากประวัติฝึก ${hist.length} ครั้ง (สูงสุด ${bestScore ?? '-'}/100)`,
                headline: `แนะนำ ${hist.length >= 4 && bestScore >= 88 ? 'International (EN)' : 'Roleplay ไทย'} • ระดับ ${recDiff === 'hard' ? 'Hard' : 'Normal'} • ${nextPersona.titleTH}`,
                reason: `${addrName}ฝึกไปแล้ว ${hist.length} ครั้ง${weakNote} แนะนำต่อยอดด้วย${unpracticed ? 'เคสที่ยังไม่เคยฝึก' : 'เคสท้าทาย'}ในระดับ ${recDiff === 'hard' ? 'Hard (คิดตอบเอง 100%)' : 'Normal'} เพื่อเพิ่มความแม่นยำก่อนสอบ Post-test ค่ะ`,
                speechText: `ยินดีต้อนรับกลับมาค่ะ${addrName} คุณฝึกไปแล้ว ${hist.length} ครั้ง คะแนนสูงสุด ${bestScore ?? 80} คะแนน${weakNote} รอบนี้แนะนำระดับ ${recDiff === 'hard' ? 'ฮาร์ด' : 'นอร์มอล'} ใน${nextPersona.titleTH} ค่ะ กดปุ่มตั้งค่าตามเอไอแนะนำแล้วเข้าห้องฝึกได้เลยนะคะ`
            };
        }

        function answerLabAdvisorOffline(question, rec, learnerObj) {
            const q = String(question || '').toLowerCase();
            if (q.includes('normal') || q.includes('hard') || q.includes('ยาก') || q.includes('ระดับ')) {
                return '• ระดับ Normal: มีปุ่ม “แนวทางคำพูด” ให้แตะส่งหรือปรับใช้ได้ เหมาะสำหรับผู้เริ่มต้นและรอบแรกค่ะ\n• ระดับ Hard: ซ่อนแนวทางคำพูดทั้งหมด (คิดพูดเอง 100%) และญาติจะซักถามลึก/อ่อนไหวมากขึ้น เหมาะสำหรับซ้อมหน้างานจริงค่ะ';
            }
            if (q.includes('micro') || q.includes('drill') || q.includes('roleplay') || q.includes('รูปแบบ') || q.includes('ต่างกัน')) {

        function ToastBanner({ toast }) {

                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[160] w-[92vw] max-w-md pointer-events-none">

        function FiveAxisRadarSVG({ radar, isEn, theme }) {
            const isDark = theme === 'dark';
            const w = 310, h = 264, cx = w / 2, cy = h / 2, maxR = 72;
            const valMap = {};
            (radar || []).forEach(r => { valMap[r.key] = Number(r.value || 0); });
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / RADAR_AXES.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const dataPts = RADAR_AXES.map((a, i) => pt(i, (valMap[a.key] || 0) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[310px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.5" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.25" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={RADAR_AXES.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.24)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {RADAR_AXES.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.14)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.8" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.6" />
                    ))}
                    {RADAR_AXES.map((a, i) => {
                        const [lx, ly] = pt(i, 1.38);
                        return (
                            <g key={a.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.4" fontWeight="700">
                                    {isEn ? a.labelEN : a.labelTH}
                                </text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">
                                    {valMap[a.key] || 0}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        function ThreeHologramStage({ emotionKey, isSpeaking, styleId = 'particles', activeSpeaker = 'wife', compact = false }) {
            const mountRef = useRef(null);
            const liveRef = useRef({ emotionKey, isSpeaking, styleId, activeSpeaker, compact });
            useEffect(() => {
                liveRef.current = { emotionKey, isSpeaking, styleId, activeSpeaker, compact };
            }, [emotionKey, isSpeaking, styleId, activeSpeaker, compact]);

            useEffect(() => {
                const container = mountRef.current;
                const THREE = window.THREE;
                if (!container || !THREE) return;

                const width = Math.max(1, container.clientWidth || window.innerWidth);
                const height = Math.max(1, container.clientHeight || window.innerHeight);
                const isMobileScreen = width < 640;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(compact ? 44 : 48, width / height, 0.1, 100);
                const resolveCamZ = (w, h) => (compact ? (w < 480 ? 6.1 : 5.4) : (w < 640 ? (h > w ? 7.5 : 6.4) : 5.8));
                camera.position.set(0, compact ? 0.08 : 0.2, resolveCamZ(width, height));

                let renderer;
                try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' }); }
                catch (_) { return; }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobileScreen ? 1.75 : 2));
                renderer.setSize(width, height);
                renderer.setClearColor(0x000000, 0);
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const disposables = [];
                const track = (obj) => { disposables.push(obj); return obj; };

                // Soft glowing sprite texture
                const pCanvas = document.createElement('canvas');
                pCanvas.width = 64; pCanvas.height = 64;
                const pCtx = pCanvas.getContext('2d');
                const grad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.32, 'rgba(255,255,255,0.78)');
                grad.addColorStop(0.7, 'rgba(255,255,255,0.16)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                pCtx.fillStyle = grad;
                pCtx.fillRect(0, 0, 64, 64);
                const tex = new THREE.CanvasTexture(pCanvas);

                const stageRoot = new THREE.Group();
                scene.add(stageRoot);

                const makeLiquidShaderMat = () => track(new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    blending: THREE.NormalBlending,
                    uniforms: {
                        uTime: { value: 0 },
                        uSpeak: { value: 0 },
                        uTension: { value: 0.5 },
                        uColor1: { value: new THREE.Color(0x38bdf8) },
                        uColor2: { value: new THREE.Color(0x818cf8) }
                    },
                    vertexShader: LIQUID_ORB_VERT,
                    fragmentShader: LIQUID_ORB_FRAG
                }));

                // ==================== STYLE 01: PARTICLE CORE (แกนอนุภาค) ====================
                const particlesGroup = new THREE.Group();
                stageRoot.add(particlesGroup);

                const COUNT = compact ? 920 : (isMobileScreen ? 1050 : 1800);
                const basePos = new Float32Array(COUNT * 3);
                const currPos = new Float32Array(COUNT * 3);
                const seeds = new Float32Array(COUNT);
                for (let i = 0; i < COUNT; i++) {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = 2 * Math.PI * u;
                    const phi = Math.acos(2 * v - 1);
                    const r = 1.48 + (Math.random() - 0.5) * 0.34;
                    const x = r * Math.sin(phi) * Math.cos(theta);
                    const y = r * Math.cos(phi);
                    const z = r * Math.sin(phi) * Math.sin(theta);
                    basePos[i * 3] = x; basePos[i * 3 + 1] = y; basePos[i * 3 + 2] = z;
                    currPos[i * 3] = x; currPos[i * 3 + 1] = y; currPos[i * 3 + 2] = z;
                    seeds[i] = Math.random() * Math.PI * 2;
                }
                const pGeo = track(new THREE.BufferGeometry());
                pGeo.setAttribute('position', new THREE.BufferAttribute(currPos, 3));
                const pMat = track(new THREE.PointsMaterial({
                    size: compact ? 0.085 : 0.095,
                    map: tex,
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.88,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                }));
                const pCloud = new THREE.Points(pGeo, pMat);
                particlesGroup.add(pCloud);

                const ring1Mat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending }));
                const ring1 = new THREE.Mesh(track(new THREE.TorusGeometry(2.05, 0.011, 16, 120)), ring1Mat);
                ring1.rotation.x = Math.PI * 0.42;
                particlesGroup.add(ring1);

                const ring2Mat = track(new THREE.MeshBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending }));
                const ring2 = new THREE.Mesh(track(new THREE.TorusGeometry(2.38, 0.008, 16, 120)), ring2Mat);
                ring2.rotation.x = -Math.PI * 0.34;
                ring2.rotation.y = Math.PI * 0.25;
                particlesGroup.add(ring2);

                // ==================== STYLE 02: LIQUID GLASS AURORA ORB (ลูกแก้วออร่า) ====================
                const liquidGroup = new THREE.Group();
                liquidGroup.visible = false;
                stageRoot.add(liquidGroup);

                const liquidOrbMat = makeLiquidShaderMat();
                const liquidOrb = new THREE.Mesh(track(new THREE.SphereGeometry(1.38, 64, 64)), liquidOrbMat);
                liquidGroup.add(liquidOrb);

                const innerCoreMat = track(new THREE.MeshBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
                const innerCore = new THREE.Mesh(track(new THREE.SphereGeometry(0.84, 32, 32)), innerCoreMat);
                liquidGroup.add(innerCore);

                const mistCount = compact ? 90 : 140;
                const mistPos = new Float32Array(mistCount * 3);
                const mistBase = new Float32Array(mistCount * 3);
                for (let i = 0; i < mistCount; i++) {
                    const th = Math.random() * Math.PI * 2;
                    const ph = Math.acos(2 * Math.random() - 1);
                    const r = 1.7 + Math.random() * 0.8;
                    mistBase[i * 3] = Math.sin(ph) * Math.cos(th) * r;
                    mistBase[i * 3 + 1] = Math.cos(ph) * r;
                    mistBase[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * r;
                    mistPos[i * 3] = mistBase[i * 3];
                    mistPos[i * 3 + 1] = mistBase[i * 3 + 1];
                    mistPos[i * 3 + 2] = mistBase[i * 3 + 2];
                }
                const mistGeo = track(new THREE.BufferGeometry());
                mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
                const mistMat = track(new THREE.PointsMaterial({ size: 0.13, map: tex, color: 0x67e8f9, transparent: true, opacity: 0.62, depthWrite: false, blending: THREE.AdditiveBlending }));
                liquidGroup.add(new THREE.Points(mistGeo, mistMat));

                // ==================== STYLE 03: BREATHING SILK WAVES (คลื่นไหมแสง) ====================
                const silkGroup = new THREE.Group();
                silkGroup.visible = false;
                stageRoot.add(silkGroup);

                const SILK_LINES = compact ? 16 : 20;
                const SILK_PTS = compact ? 76 : 96;
                const silkItems = [];
                for (let l = 0; l < SILK_LINES; l++) {
                    const arr = new Float32Array(SILK_PTS * 3);
                    const geo = track(new THREE.BufferGeometry());
                    geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
                    const t = l / (SILK_LINES - 1);
                    const mat = track(new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.16 + Math.sin(t * Math.PI) * 0.65, blending: THREE.AdditiveBlending, depthWrite: false }));
                    silkGroup.add(new THREE.Line(geo, mat));
                    silkItems.push({ geo, mat, t, phaseOffset: l * 0.28 });
                }

                // ==================== STYLE 04: LUMINOUS LOTUS BLOOM (ดอกบัวแสง) ====================
                const lotusGroup = new THREE.Group();
                lotusGroup.visible = false;
                lotusGroup.position.y = -0.62;
                stageRoot.add(lotusGroup);

                const buildPetalGeo = (pw, ph) => {
                    const g = track(new THREE.PlaneGeometry(pw, ph, 8, 12));
                    const pa = g.attributes.position;
                    for (let i = 0; i < pa.count; i++) {
                        const x = pa.getX(i);
                        const y = pa.getY(i) + ph * 0.5;
                        const ny = y / ph;
                        const taper = Math.sin(ny * Math.PI);
                        const nx = x * (0.25 + taper * 0.92);
                        const cupZ = Math.pow(Math.abs(x / (pw * 0.5)), 2) * 0.24 * taper + taper * 0.22;
                        pa.setXYZ(i, nx, y, cupZ);
                    }
                    g.computeVertexNormals();
                    return g;
                };

                const lotusPetals = [];
                [
                    { count: 6, w: 0.52, h: 1.2, baseTilt: 0.18, openTilt: 0.68 },
                    { count: 9, w: 0.65, h: 1.52, baseTilt: 0.28, openTilt: 1.02 },
                    { count: 12, w: 0.74, h: 1.76, baseTilt: 0.36, openTilt: 1.32 }
                ].forEach((ly, li) => {
                    const pg = buildPetalGeo(ly.w, ly.h);
                    const eg = track(new THREE.EdgesGeometry(pg, 25));
                    for (let k = 0; k < ly.count; k++) {
                        const pivot = new THREE.Group();
                        pivot.rotation.y = (k / ly.count) * Math.PI * 2 + li * 0.35;
                        const holder = new THREE.Group();
                        const mat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.22 + (2 - li) * 0.08, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
                        const rimMat = track(new THREE.LineBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.38, blending: THREE.AdditiveBlending }));
                        holder.add(new THREE.Mesh(pg, mat));
                        holder.add(new THREE.LineSegments(eg, rimMat));
                        pivot.add(holder);
                        lotusGroup.add(pivot);
                        lotusPetals.push({ holder, mat, rimMat, layerIdx: li, baseTilt: ly.baseTilt, openTilt: ly.openTilt, seed: k * 0.7 + li * 1.9 });
                    }
                });

                const lotusCoreMat = track(new THREE.MeshBasicMaterial({ color: 0xa7f3d0, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending }));
                const lotusCore = new THREE.Mesh(track(new THREE.SphereGeometry(0.32, 28, 28)), lotusCoreMat);
                lotusCore.position.y = 0.38;
                lotusGroup.add(lotusCore);

                const pollenCount = compact ? 55 : 80;
                const pollenPos = new Float32Array(pollenCount * 3);
                for (let i = 0; i < pollenCount; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const r = 0.2 + Math.random() * 1.35;
                    pollenPos[i * 3] = Math.cos(a) * r;
                    pollenPos[i * 3 + 1] = Math.random() * 2.3;
                    pollenPos[i * 3 + 2] = Math.sin(a) * r;
                }
                const pollenGeo = track(new THREE.BufferGeometry());
                pollenGeo.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3));
                const pollenMat = track(new THREE.PointsMaterial({ size: 0.12, map: tex, color: 0x6ee7b7, transparent: true, opacity: 0.78, blending: THREE.AdditiveBlending, depthWrite: false }));
                lotusGroup.add(new THREE.Points(pollenGeo, pollenMat));

                // ==================== STYLE 05: DUAL-CORE RESONANCE (ดวงแสงคู่ 2 เสียง) ====================
                const dualGroup = new THREE.Group();
                dualGroup.visible = false;
                stageRoot.add(dualGroup);

                const wifeMat = makeLiquidShaderMat();
                const wifeOrb = new THREE.Mesh(track(new THREE.SphereGeometry(0.86, 48, 48)), wifeMat);
                dualGroup.add(wifeOrb);

                const motherMat = makeLiquidShaderMat();
                const motherOrb = new THREE.Mesh(track(new THREE.SphereGeometry(0.92, 48, 48)), motherMat);
                dualGroup.add(motherOrb);

                const BRIDGE_PTS = 40;
                const bridgeLines = [];
                for (let b = 0; b < 6; b++) {
                    const arr = new Float32Array(BRIDGE_PTS * 3);
                    const geo = track(new THREE.BufferGeometry());
                    geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
                    const mat = track(new THREE.LineBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.44, blending: THREE.AdditiveBlending }));
                    dualGroup.add(new THREE.Line(geo, mat));
                    bridgeLines.push({ geo, mat, idx: b });
                }
                const unityRingMat = track(new THREE.MeshBasicMaterial({ color: 0x6ee7b7, transparent: true, opacity: 0.24, blending: THREE.AdditiveBlending }));
                const unityRing = new THREE.Mesh(track(new THREE.TorusGeometry(2.28, 0.011, 16, 120)), unityRingMat);
                unityRing.rotation.x = Math.PI * 0.44;
                dualGroup.add(unityRing);

                // ==================== STYLE 06: SLANTED AUDIO SPECTRUM (คลื่นเสียงแนวเฉียง) ====================
                const slantedGroup = new THREE.Group();
                slantedGroup.visible = false;
                slantedGroup.rotation.set(0.24, -0.42, -0.14);
                stageRoot.add(slantedGroup);

                const BAR_COUNT = compact ? 34 : 44;
                const BAR_STEP = compact ? 0.138 : 0.128;
                const barBoxGeo = track(new THREE.BoxGeometry(0.072, 1, 0.072));
                const capBoxGeo = track(new THREE.BoxGeometry(0.076, 0.045, 0.076));
                const slantedBars = [];
                for (let i = 0; i < BAR_COUNT; i++) {
                    const u = i / (BAR_COUNT - 1);
                    const x = (u - 0.5) * (BAR_COUNT - 1) * BAR_STEP;
                    const barMat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
                    const bar = new THREE.Mesh(barBoxGeo, barMat);
                    bar.position.x = x;

                    const refMat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.24, blending: THREE.AdditiveBlending, depthWrite: false }));
                    const ref = new THREE.Mesh(barBoxGeo, refMat);
                    ref.position.x = x;

                    const capMat = track(new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false }));
                    const cap = new THREE.Mesh(capBoxGeo, capMat);
                    cap.position.set(x, 0.3, 0);

                    slantedGroup.add(bar, ref, cap);
                    slantedBars.push({ bar, barMat, ref, refMat, cap, capMat, u, h: 0.25, peak: 0.3 });
                }

                const railMat = track(new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.48, blending: THREE.AdditiveBlending }));
                const rail = new THREE.Mesh(track(new THREE.BoxGeometry(BAR_COUNT * BAR_STEP + 0.3, 0.018, 0.04)), railMat);
                slantedGroup.add(rail);

                const specSparkCount = compact ? 45 : 70;
                const specSparkPos = new Float32Array(specSparkCount * 3);
                for (let i = 0; i < specSparkCount; i++) {
                    specSparkPos[i * 3] = (Math.random() - 0.5) * BAR_COUNT * BAR_STEP;
                    specSparkPos[i * 3 + 1] = Math.random() * 1.9 - 0.2;
                    specSparkPos[i * 3 + 2] = (Math.random() - 0.5) * 0.7;
                }
                const specSparkGeo = track(new THREE.BufferGeometry());
                specSparkGeo.setAttribute('position', new THREE.BufferAttribute(specSparkPos, 3));
                const specSparkMat = track(new THREE.PointsMaterial({ size: 0.11, map: tex, color: 0x7dd3fc, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending, depthWrite: false }));

                const onTouchMove = (e) => {

                    const cx = e.touches[0].clientX;
                    const cy = e.touches[0].clientY;
                    if (compact && !touchMode) {
                        const dx = Math.abs(cx - touchStartX);
                        const dy = Math.abs(cy - touchStartY);
                        if (dx + dy > 8) {
                            touchMode = dy > dx * 1.15 ? 'scroll' : 'orbit';
                        }
                    }
                    if (touchMode === 'scroll') return;

                renderer.domElement.addEventListener('mousedown', onMouseDown);

                const onResize = () => {
                    if (!container) return;

            const speakRelativeSegments = useCallback(async (rawText, emoKey, personaObj) => {

                            const ctrl = new AbortController();

                const openingText = isEn ? rawOpeningText : rawOpeningText.replace(/คุณเจ้าหน้าที่/g, defaultAddr);
                const initMsg = {
                    id: 'open-0',
                    role: 'relative',
                    text: openingText,
                    emotion: activePersona.openingEmotion || 'CONFUSED',
                    action: isEn ? activePersona.openingActionEN : activePersona.openingActionTH
                };
                setHistory([initMsg]);
                setPhase('negotiating');
                silenceAnchorRef.current = Date.now();
                silenceCountedForTurnRef.current = false;

                setTimeout(() => {
                    speakRelativeSegments(openingText, initMsg.emotion, activePersona);
                }, 380);
            };

            const handleRewindToTurn = (learnerIdx) => {
                stopAiVoice();
                stopMicCompletely();
                const targetMsg = history[learnerIdx];
                const sliced = history.slice(0, learnerIdx);
                const prevRel = [...sliced].reverse().find(m => m.role === 'relative');
                setHistory(sliced);
                setFamilyDecision(null);
                if (prevRel?.emotion) setRelativeEmotion(prevRel.emotion);
                if (prevRel?.action) setCurrentActionCue(prevRel.action);
                if (targetMsg?.text) setChatInput(targetMsg.text);
                setShowHistoryDrawer(false);
                showToast('ย้อนเวลากลับไปแก้ไขคำพูดในรอบนั้นเรียบร้อยค่ะ', 'info');
            };

            const handleSendLearnerMsg = useCallback(async (overrideText = null) => {
                const text = String(overrideText ?? chatInput).trim();
                if (!text || isThinking || familyDecision) return;

                unlockMobileAudio();
                stopAiVoice();
                setChatInput('');
                setPaceHint('');

                const introName = detectSelfIntroductionName(text, isEn);
                const effectiveAddr = introName || learnerAddressName;
                if (introName) setLearnerAddressName(introName);

                const flagged = detectTriggerPhrases(text, isEn ? 'en' : 'th');
                if (flagged.length > 0) {
                    setTriggerCount(c => c + flagged.length);
                    setTriggerWarning(flagged[0]);
                } else {
                    setTriggerWarning(null);
                }

                const nextTurnNumber = learnerTurns + 1;
                const nextHist = [...history, { id: `u-${Date.now()}`, role: 'learner', text }];
                setHistory(nextHist);
                setIsThinking(true);

                const transcriptText = nextHist
                    .map(m => `${m.role === 'learner' ? effectiveAddr : 'ญาติ'}: ${m.text}`)
                    .join('\n');

                const pacingRule = nextTurnNumber >= maxTurns
                    ? `นี่คือรอบสุดท้าย (รอบที่ ${nextTurnNumber}/${maxTurns}) ให้ญาติประกาศการตัดสินใจชัดเจน 1 ใน 3 แบบ: [DECISION:CONSENT] (ยินยอมบริจาคอวัยวะ), [DECISION:DECLINE] (ไม่ยินยอม), หรือ [DECISION:HOME_DECIDE] (ขอกลับไปตัดสินใจที่บ้านก่อน)`
                    : (nextTurnNumber === maxTurns - 1 && !askedHomeDecision
                        ? `นี่คือรอบที่ ${nextTurnNumber}/${maxTurns} ห้ามเพิ่งรีบจบบทสนทนา ให้ส่ง [DECISION:NONE] และถามผู้เรียนอย่างเป็นธรรมชาติว่า "สามารถกลับไปปรึกษาตัดสินใจกันที่บ้านก่อนได้ไหม"`
                        : `นี่คือรอบที่ ${nextTurnNumber}/${maxTurns} ห้ามจบบทสนทนาเร็วเกินไป ต้องส่ง [DECISION:NONE] และซักถามข้อมูลภาวะสมองตายหรือข้อกังวลของญาติต่ออย่างสมจริง`);

                const systemInstruction = isEn
                    ? `You are roleplaying a grieving relative in an organ donation family consultation.
${activePersona.promptHintEN}
${activeDifficulty.aiPromptRuleEN}
Always address the learner as "${effectiveAddr}".
${pacingRule}
Format your reply strictly starting with tags:
[EMOTION:SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] [DECISION:NONE|CONSENT|DECLINE|HOME_DECIDE] [ACTION:brief non-verbal body language] followed by 2-3 natural spoken sentences.`
                    : `คุณคือญาติผู้ป่วยในห้องให้คำปรึกษาเรื่องการบริจาคอวัยวะของโรงพยาบาล
${activePersona.promptHintTH}
${activeDifficulty.aiPromptRuleTH}
กติกาสำคัญมาก:
1. เวลาเรียกผู้เรียน ให้เรียกผู้เรียนว่า "${effectiveAddr}" เสมอ (ห้ามเรียก "คุณเจ้าหน้าที่")
2. ${pacingRule}
3. ตอบขึ้นต้นด้วยแท็กตามรูปแบบนี้เสมอ:
[EMOTION:SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] [DECISION:NONE|CONSENT|DECLINE|HOME_DECIDE] [ACTION:บรรยายภาษากายสั้นๆ 1 ประโยค] ตามด้วยคำพูดธรรมชาติ 2-3 ประโยค${activePersona.id === 'conflict' ? ' (โดยใช้ป้าย [ภรรยา]: ... และ [คุณแม่]: ... สลับกัน)' : ''}`;

                let parsedReply = null;
                if (appsScriptUrl) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST',
                            redirect: 'follow',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `ประวัติการสนทนา:\n${transcriptText}\n\nตอบกลับในบทบาทญาติ:`,
                                systemInstruction
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const txt = await rawRes.text();
                        const res = JSON.parse(txt || '{}');
                        if (res?.status === 'success' && res.text) {
                            parsedReply = parseRelativeResponse(res.text);
                        }
                    } catch (_) {}
                }

                if (!parsedReply || !parsedReply.text) {
                    await new Promise(r => setTimeout(r, 420));
                    parsedReply = generateOfflineRelativeReply({
                        persona: activePersona,
                        learnerText: text,
                        turnIdx: nextTurnNumber - 1,
                        maxTurns,
                        addrName: effectiveAddr,
                        isEn,
                        askedHomeAlready: askedHomeDecision
                    });
                }

                const finalEmo = parsedReply.emotion || relativeEmotion;
                const finalDecision = nextTurnNumber >= maxTurns ? (parsedReply.decision || 'HOME_DECIDE') : parsedReply.decision;
                if (/กลับไป|ที่บ้าน|home/i.test(parsedReply.text)) setAskedHomeDecision(true);

                const relMsg = {
                    id: `r-${Date.now()}`,
                    role: 'relative',
                    text: parsedReply.text,
                    emotion: finalEmo,
                    action: parsedReply.actionCue || ''
                };

                setRelativeEmotion(finalEmo);
                setCurrentActionCue(parsedReply.actionCue || '');
                if (finalDecision) setFamilyDecision(finalDecision);
                setHistory(prev => [...prev, relMsg]);
                setIsThinking(false);
                silenceAnchorRef.current = Date.now();
                silenceCountedForTurnRef.current = false;

                speakRelativeSegments(parsedReply.text, finalEmo, activePersona);
            }, [chatInput, isThinking, familyDecision, unlockMobileAudio, stopAiVoice, isEn, learnerAddressName, learnerTurns, history, maxTurns, askedHomeDecision, activePersona, activeDifficulty, appsScriptUrl, relativeEmotion, speakRelativeSegments]);

            useEffect(() => { sendLearnerMsgRef.current = handleSendLearnerMsg; }, [handleSendLearnerMsg]);

            const persistLabOutcomeBackground = useCallback((report) => {
                if (isAdminPreview || !learner?.id || String(learner.id).startsWith('guest_')) return;
                const radarObj = {};
                (report.radar || []).forEach(r => { radarObj[r.key] = Number(r.value || 0); });
                const entry = {
                    at: new Date().toISOString(),
                    personaId: activePersona.id,
                    modeId,
                    difficultyId,
                    score: report.overall,
                    decision: report.decision,
                    radar: report.radar
                };
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    const u = saved.user || learner;
                    const prevHist = Array.isArray(u.skillLabHistory) ? u.skillLabHistory : [];
                    const best = Math.max(Number(u.skillLabBestScore || 0), Number(report.overall || 0));
                    const updatedUser = {
                        ...u,
                        skillLabPassed: true,
                        skillLabBestScore: best,
                        skillLabLatestRadar: radarObj,
                        skillLabHistory: [...prevHist.slice(-9), entry]
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...saved, user: updatedUser }));
                    setLearner(updatedUser);

                    if (fbDb && u.id && !String(u.id).startsWith('admin_preview_')) {
                        setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(u.id)),
                            {
                                skillLabPassed: true,
                                skillLabBestScore: best,
                                skillLabLatestRadar: radarObj,
                                skillLabHistory: updatedUser.skillLabHistory
                            },
                            { merge: true }
                        ).catch(() => {});
                        if (typeof CORE.buildAnonTelemetryId === 'function' && typeof CORE.buildExecutiveTelemetryPayload === 'function') {
                            const anonId = CORE.buildAnonTelemetryId(u.id);
                            setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId),
                                CORE.buildExecutiveTelemetryPayload(updatedUser),
                                { merge: true }
                            ).catch(() => {});
                        }
                    }
                } catch (_) {}
            }, [isAdminPreview, learner, activePersona.id, modeId, difficultyId]);

            const handleEvaluateSession = useCallback(async (overrideHistory = null, overrideDecision = null) => {
                stopAiVoice();
                stopMicCompletely();
                const conv = overrideHistory || history;
                const dec = overrideDecision || familyDecision || 'HOME_DECIDE';
                const localFallback = evaluateConversationLocal(conv, silenceHits, triggerCount, isEn, dec);

                setIsEvaluating(true);
                setPhase('evaluation');
                window.scrollTo({ top: 0, behavior: 'smooth' });

                let finalReport = localFallback;
                if (appsScriptUrl && conv.filter(m => m.role === 'learner').length > 0) {
                    const ctrl = new AbortController();
                    evalAbortRef.current = ctrl;
                    const timeoutId = setTimeout(() => ctrl.abort(), 12000);
                    try {
                        const transcript = conv.map(m => `${m.role === 'learner' ? learnerAddressName : 'ญาติ'}: ${m.text}`).join('\n');
                        const prompt = `วิเคราะห์บทสนทนาให้คำปรึกษาญาติผู้เสียชีวิตต่อไปนี้ และตอบกลับเป็น JSON ล้วนเท่านั้น (ห้ามมีข้อความอื่นนอก JSON):
{"setting":0-100,"empathy":0-100,"clarity":0-100,"vocal":0-100,"dignity":0-100,"goldenMoment":"ยกประโยคจริงของผู้เรียนที่ทำได้ดีที่สุดพร้อมเหตุผลสั้นๆ","turningPoint":"ข้อแนะนำ 1 จุดที่เกลาให้ละมุนขึ้นได้","summary":"สรุปภาพรวมสั้นกระชับ 2 บรรทัด"}

ข้อมูลเสริม: เว้นความเงียบเยียวยา ${silenceHits} ครั้ง, คำกระทบใจ ${triggerCount} ครั้ง, การตัดสินใจของครอบครัว: ${dec}
บทสนทนา:
${transcript}`;
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST',
                            redirect: 'follow',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt,
                                systemInstruction: isEn ? 'You are an expert Organ Donation Clinical Supervisor. Return strictly valid JSON.' : 'คุณคืออาจารย์พยาบาล Clinical Supervisor ด้านการสื่อสารกับครอบครัวผู้บริจาคอวัยวะ ตอบกลับเป็น JSON ที่ถูกต้องเท่านั้น'
                            }),
                            signal: ctrl.signal
                        });
                        const txt = await rawRes.text();
                        const res = JSON.parse(txt || '{}');
                        if (res?.status === 'success' && res.text) {
                            const jsonMatch = res.text.match(/\{[\s\S]*\}/);
                            if (jsonMatch) {
                                const parsed = JSON.parse(jsonMatch[0]);
                                const clamp = (n, fb) => {
                                    const num = Number(n);
                                    return Number.isFinite(num) ? Math.max(40, Math.min(100, Math.round(num))) : fb;
                                };
                                const radar = [
                                    { key: 'setting', value: clamp(parsed.setting, localFallback.radar[0].value) },
                                    { key: 'empathy', value: clamp(parsed.empathy, localFallback.radar[1].value) },
                                    { key: 'clarity', value: clamp(parsed.clarity, localFallback.radar[2].value) },
                                    { key: 'vocal', value: clamp(parsed.vocal, localFallback.radar[3].value) },
                                    { key: 'dignity', value: clamp(parsed.dignity, localFallback.radar[4].value) }
                                ];
                                const overall = Math.round(radar.reduce((s, r) => s + r.value, 0) / radar.length);
                                finalReport = {
                                    overall,
                                    radar,
                                    decision: dec,
                                    source: 'ai',
                                    goldenMoment: parsed.goldenMoment || localFallback.goldenMoment,
                                    turningPoint: parsed.turningPoint || localFallback.turningPoint,
                                    summary: parsed.summary || localFallback.summary
                                };
                            }
                        }
                    } catch (_) {
                        finalReport = localFallback;
                    } finally {
                        clearTimeout(timeoutId);
                        evalAbortRef.current = null;
                    }
                }

                setEvalReport(finalReport);
                setIsEvaluating(false);
                persistLabOutcomeBackground(finalReport);
            }, [stopAiVoice, stopMicCompletely, history, familyDecision, silenceHits, triggerCount, isEn, appsScriptUrl, learnerAddressName, persistLabOutcomeBackground]);

            const handleForceShowEvaluationNow = () => {
                if (evalAbortRef.current) {
                    try { evalAbortRef.current.abort(); } catch (_) {}
                }
                const fallback = evaluateConversationLocal(history, silenceHits, triggerCount, isEn, familyDecision || 'HOME_DECIDE');
                setEvalReport(fallback);
                setIsEvaluating(false);
                persistLabOutcomeBackground(fallback);
            };

            // ============================================================================
            // 5. RENDER PHASES (SETUP -> BRIEFING -> 3D CONSULTATION ROOM -> EVALUATION)
            // ============================================================================
            return (
                <div className={`min-h-dvh relative flex flex-col pt-safe ${phase === 'negotiating' ? 'holo-stage-bg' : ''}`}>
                    {phase !== 'negotiating' ? (
                        <><div className="spatial-aura" /><div className="spatial-grid" /></>
                    ) : (
                        <div className="fixed inset-0 z-0">
                            <ThreeHologramStage
                                emotionKey={relativeEmotion}
                                isSpeaking={isSpeaking}
                                styleId={hologramStyle}
                                activeSpeaker={dualSpeakerKey}
                                compact={false}
                            />
                        </div>
                    )}

                    {/* ==================== PHASE 1: SETUP & LIVE 6-STYLE HOLOGRAM PREVIEW ==================== */}
                    {phase === 'setup' && (
                        <div className="relative z-10 flex-1 flex flex-col">
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-5xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <a href="./index.html" aria-label="กลับห้องเรียน" className="w-9 h-9 rounded-xl spatial-soft text-primary-adaptive flex items-center justify-center shrink-0">
                                            <Icon name="ArrowLeft" size={18} />
                                        </a>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                AI Skill Lab <span className="text-accent-adaptive">3D</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                                rjcloud.organ 2.0 • ฝึกสื่อสารกับญาติเสมือนจริง
                                            </span>
                                        </div>
                                    </div>
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                </div>
                            </header>

                            <main className="max-w-5xl w-full mx-auto px-3.5 sm:px-6 py-5 sm:py-7 pb-28 sm:pb-8 space-y-5">
                                <section className="spatial-card rounded-[1.75rem] p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div className="space-y-1">
                                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[10px] font-bold">
                                            <Icon name="Sparkles" size={12} /> STEP 03 • CLINICAL FAMILY CONSULTATION LAB
                                        </span>
                                        <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive">
                                            ห้องฝึกสื่อสารและให้ข้อมูลญาติ 3 มิติ
                                        </h1>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive">
                                            ผู้เรียน: <b className="text-primary-adaptive">{learner?.name}</b> • แฟ้มส่งเวรหน้าห้อง • 2 เสียงจริงในเคส 3 • ประเมิน 5 แกนโดย AI Supervisor
                                        </p>
                                    </div>
                                    <div className="spatial-soft px-3.5 py-2.5 rounded-2xl text-xs text-secondary-adaptive shrink-0">
                                        <p className="font-mono text-[10px] text-prism-adaptive font-bold">MOBILE-FIRST READY</p>
                                        <p className="font-bold text-primary-adaptive">แตะพูด / กดค้าง / แตะแนวทาง</p>
                                    </div>
                                </section>

                                {/* 0. AI แนะนำการฝึกก่อนเข้าทดสอบ (AI Lab Advisor — เหมือน AI แนะนำการเรียนในหน้าห้องเรียน) */}
                                <section className="spatial-card rounded-[1.75rem] overflow-hidden border-aurora-400/40">
                                    <div className="rjc-ambient-bar" />
                                    <div className="p-4 sm:p-5 space-y-3.5">
                                        <div className="flex flex-wrap items-start justify-between gap-2.5">
                                            <div className="flex items-start gap-2.5 min-w-0 flex-1">
                                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0 shadow-md">
                                                    <Icon name="Bot" size={20} />
                                                </div>
                                                <div className="min-w-0">
                                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase block">
                                                        {activeRecommendation.badge}
                                                    </span>
                                                    <h2 className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive leading-snug">
                                                        AI แนะนำรูปแบบที่เหมาะกับคุณก่อนเข้าฝึก
                                                    </h2>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-1.5 shrink-0">
                                                <button
                                                    type="button"
                                                    onClick={handleSpeakAdvisor}
                                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 transition-all ${
                                                        advisorVoicePhase === 'speaking'
                                                            ? 'bg-rose-500 text-white'
                                                            : advisorVoicePhase === 'loading'
                                                                ? 'bg-prism-500/25 border border-prism-400/50 text-prism-adaptive animate-pulse'
                                                                : 'spatial-soft text-prism-adaptive'
                                                    }`}
                                                >
                                                    <Icon name={advisorVoicePhase === 'speaking' ? 'Square' : 'Volume2'} size={14} />
                                                    <span>{advisorVoicePhase === 'loading' ? 'เตรียมเสียง...' : advisorVoicePhase === 'speaking' ? 'หยุดเสียง' : 'ฟัง AI แนะนำ'}</span>
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => setAdvisorExpanded(v => !v)}
                                                    aria-label={advisorExpanded ? 'ย่อคำแนะนำ AI' : 'ขยายคำแนะนำ AI'}
                                                    className="spatial-soft w-8 h-8 rounded-xl text-secondary-adaptive flex items-center justify-center"
                                                >
                                                    <Icon name={advisorExpanded ? 'ChevronUp' : 'ChevronDown'} size={16} />
                                                </button>
                                            </div>
                                        </div>

                                        {advisorExpanded && (
                                            <div className="space-y-3">
                                                {/* ปุ่มเลือกเป้าหมายแบบแตะเดียว */}
                                                <div className="flex gap-1.5 overflow-x-auto hide-scrollbar pb-0.5">
                                                    {LAB_GOAL_PRESETS.map(g => {
                                                        const active = advisorGoalId === g.id;
                                                        return (
                                                            <button
                                                                key={g.id}
                                                                type="button"
                                                                onClick={() => { setAdvisorGoalId(g.id); setAdvisorReply(''); stopAdvisorVoice(); }}
                                                                className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border inline-flex items-center gap-1.5 transition-all ${
                                                                    active
                                                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 border-transparent font-extrabold'
                                                                        : 'spatial-soft text-secondary-adaptive'
                                                                }`}
                                                            >
                                                                <Icon name={g.icon} size={13} />
                                                                <span>{g.label}</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>

                                                {/* กล่องสรุปคำแนะนำ + ปุ่มตั้งค่าตาม AI ทันที */}
                                                <div className="spatial-soft rounded-2xl p-3.5 sm:p-4 space-y-2.5 border-prism-400/30">
                                                    <p className="font-display font-bold text-xs sm:text-sm text-accent-adaptive">
                                                        ✦ {activeRecommendation.headline}
                                                    </p>
                                                    <p className="text-xs sm:text-sm text-secondary-adaptive leading-relaxed">
                                                        {activeRecommendation.reason}
                                                    </p>
                                                    <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                                                        <div className="flex flex-wrap gap-1.5 text-[10px] font-mono">
                                                            <span className="px-2 py-0.5 rounded-lg bg-prism-500/15 text-prism-adaptive font-bold">
                                                                {PRACTICE_MODES.find(m => m.id === activeRecommendation.modeId)?.badge}
                                                            </span>
                                                            <span className="px-2 py-0.5 rounded-lg bg-aurora-500/15 text-accent-adaptive font-bold">
                                                                {(DIFFICULTIES[activeRecommendation.difficultyId] || DIFFICULTIES.normal).badge}
                                                            </span>
