    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        function pcmToObjectUrl(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') {
                    const blob = CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                    return blob && blob.size > 0 ? URL.createObjectURL(blob) : '';
                }
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = bytes.length - off;
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
            } catch (_) {
                return '';
            }
        }

        function copyTextSafe(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = String(text || '');
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (ok) return true;
            } catch (_) {}
            try {
                if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                    navigator.clipboard.writeText(String(text || '')).catch(() => {});
                    return true;
                }
            } catch (_) {}
            return false;
        }

        function FiveAxisRadarSVG({ radar, axes, isEn, theme }) {
            const isDark = theme === 'dark';
            const w = 310, h = 264, cx = w / 2, cy = h / 2, maxR = 72;
            const valMap = {};
            (radar || []).forEach(r => { valMap[r.key] = Number(r.value || 0); });
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / axes.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const dataPts = axes.map((a, i) => pt(i, (valMap[a.key] || 0) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[310px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.5" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.25" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={axes.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.24)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {axes.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.14)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.8" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.6" />
                    ))}
                    {axes.map((a, i) => {
                        const [lx, ly] = pt(i, 1.38);
                        return (
                            <g key={a.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.4" fontWeight="700">
                                    {isEn ? a.labelEN : a.shortTH}
                                </text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">
                                    {valMap[a.key] || 0}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

                    setCurrentActionCue(st1.actionTH);

                    setMessages([{ id: 'drill-0', role: 'relative', text: st1.promptTH, emotion: st1.emotion, action: st1.actionTH, trustSnapshot: 42 }]);
                    setPhase('negotiating');
                    silenceAnchorRef.current = Date.now();
                    silenceCountedRef.current = false;
                    setTimeout(() => speakRelativeSegments(st1.promptTH, st1.emotion, st1.personaId), 360);
                    return;
                }

                if (activePersona.id === 'conflict' && !userPickedStyle) setHologramStyle('dual');
                const openEmo = activePersona.openingEmotion || 'CONFUSED';
                const initTrust = EMOTIONS[openEmo]?.baseTrust || 36;
                setTrustScore(initTrust);
                setRelativeEmotion(openEmo);
                setCurrentActionCue(isEn ? activePersona.openingActionEN : activePersona.openingActionTH);
                setActiveSpeakerBadge(activePersona.id === 'conflict' ? (isEn ? 'Wife / Mother' : 'ภรรยา / คุณแม่') : (isEn ? 'Relative' : activePersona.speakerRoleTH));

                const openText = isEn ? activePersona.openingEN : activePersona.openingTH;
                setMessages([{
                    id: 'open-0',
                    role: 'relative',
                    text: openText,
                    emotion: openEmo,
                    action: isEn ? activePersona.openingActionEN : activePersona.openingActionTH,
                    trustSnapshot: initTrust,
                    unlockedSnapshot: []
                }]);
                setPhase('negotiating');
                silenceAnchorRef.current = Date.now();
                silenceCountedRef.current = false;
                setTimeout(() => speakRelativeSegments(openText, openEmo, activePersona.id), 360);
            };

            const handleRewindToTurn = (userMsgIdx) => {
                stopAiVoice();
                stopMicCompletely();
                const target = messages[userMsgIdx];
                const sliced = messages.slice(0, userMsgIdx);
                const prevRel = [...sliced].reverse().find(m => m.role === 'relative');
                setMessages(sliced);
                setFinalOutcome('');
                setActiveCurveball(null);
                setCoachWhisper('');
                if (prevRel?.emotion) setRelativeEmotion(prevRel.emotion);
                if (prevRel?.action) setCurrentActionCue(prevRel.action);
                if (typeof prevRel?.trustSnapshot === 'number') setTrustScore(prevRel.trustSnapshot);
                if (Array.isArray(prevRel?.unlockedSnapshot)) setUnlockedBarrierIds(prevRel.unlockedSnapshot);
                if (target?.text) setChatInput(target.text);
                setShowHistoryDrawer(false);
                showToast('ย้อนเวลากลับไปแก้ไขคำพูดในรอบนั้นเรียบร้อยค่ะ', 'info');
            };

            const handleAdvanceDrillStage = () => {
                const nextIdx = drillIdx + 1;
                setPendingDrillReview(null);
                if (nextIdx >= MICRO_DRILL_STAGES.length) {
                    const avg = Math.round(drillResults.reduce((s, r) => s + r.score, 0) / Math.max(1, drillResults.length));
                    setFinalOutcome(avg >= 75 ? 'CONSENT' : 'CONSULT');
                    setRelativeEmotion('CALM');
                    setCurrentActionCue('ครบทั้ง 4 ด่านคำถามหนักแล้ว • พร้อมดูผลประเมินเรดาร์ 5 แกน');
                    return;
                }
                const nextStage = MICRO_DRILL_STAGES[nextIdx];
                if (nextStage.personaId === 'conflict' && !userPickedStyle) setHologramStyle('dual');
                setDrillIdx(nextIdx);
                setRelativeEmotion(nextStage.emotion);
                setCurrentActionCue(nextStage.actionTH);
                setActiveSpeakerBadge(SL.getCaseVoices(nextStage.personaId).labelPrimary);
                setMessages(prev => [...prev, {
                    id: `drill-s-${nextStage.stage}-${Date.now()}`,
                    role: 'relative',
                    text: nextStage.promptTH,
                    emotion: nextStage.emotion,
                    action: nextStage.actionTH,
                    trustSnapshot: trustScore
                }]);
                silenceAnchorRef.current = Date.now();
                silenceCountedRef.current = false;
                speakRelativeSegments(nextStage.promptTH, nextStage.emotion, nextStage.personaId);
            };

            const handleSendUserMsg = useCallback(async (overrideText = null) => {
                const text = String(overrideText ?? chatInput).trim();
                if (!text || isThinking || finalOutcome || pendingDrillReview) return;

                unlockMobileAudio();
                stopAiVoice();
                setChatInput('');
                setPaceHint('');

                const usedSilenceNow = silenceElapsed >= 2.5;
                const introName = SL.extractIntroducedLearnerName(text);
                const effectiveAddr = introName ? (isEn ? `Nurse ${introName}` : `คุณ${introName}`) : learnerAddressName;
                if (introName) setLearnerAddressName(effectiveAddr);

                const triggers = SL.detectTriggerPhrases(text, isEn ? 'en' : 'th');
                if (triggers.length > 0) {
                    setTriggerTotal(c => c + triggers.length);
                    setTriggerWarning(triggers[0]);
                } else {
                    setTriggerWarning(null);
                }

                if (selectedMode.isDrill) {
                    const curStage = MICRO_DRILL_STAGES[drillIdx] || MICRO_DRILL_STAGES[0];
                    const res = SL.evaluateMicroDrillAnswer(curStage, text, triggers, usedSilenceNow);
                    const nextResults = [...drillResults, res];
                    setDrillResults(nextResults);
                    const avgScore = Math.round(nextResults.reduce((s, r) => s + r.score, 0) / nextResults.length);
                    setLastTrustDelta(avgScore - trustScore);
                    setTrustScore(avgScore);
                    setMessages(prev => [...prev, { id: `du-${Date.now()}`, role: 'user', text }]);
                    setPendingDrillReview(res);
                    if (res.passed) SL.SoundFX.playChime([587.33, 880]);
                    return;
                }

                const bEval = SL.evaluateBarriersUnlocked(activePersona.id, text, unlockedBarrierIds);
                setUnlockedBarrierIds(bEval.unlockedIds);
                if (bEval.newlyUnlocked.length > 0) {
                    SL.SoundFX.playChime([523.25, 659.25, 783.99]);
                    showToast(`คลายปมในใจได้แล้ว: ${bEval.newlyUnlocked[0].titleTH}`, 'success');
                }

                const nextTurnNum = userTurns + 1;
                const nextMsgs = [...messages, { id: `u-${Date.now()}`, role: 'user', text }];
                setMessages(nextMsgs);
                setIsThinking(true);
                if (typeof SL.pickLatencyMaskCue === 'function') {
                    setThinkingCue(SL.pickLatencyMaskCue(activePersona.id, isEn));
                }
                if (SL.SoundFX && typeof SL.SoundFX.playThinkingCue === 'function') {
                    SL.SoundFX.playThinkingCue();
                }

                if (difficultyId === 'hard' && nextTurnNum < maxTurns) {
                    const cb = SL.pickHardCurveball(nextTurnNum, usedCurveballIds);
                    if (cb) {
                        setUsedCurveballIds(prev => [...prev, cb.id]);
                        setActiveCurveball(cb);
                        if (cb.type === 'phone') SL.SoundFX.playPhoneBuzz();

                        const inertia = SL.computeInertiaTrust({
                            prevTrust: trustScore,
                            aiEmotion: cb.emotion,
                            newlyUnlockedCount: bEval.newlyUnlocked.length,
                            totalUnlockedCount: bEval.unlockedIds.length,
                            triggerCount: triggers.length,
                            usedSilence: usedSilenceNow,
                            difficulty: difficultyId,
                            userText: text
                        });
                        setTrustScore(inertia.trust);
                        setLastTrustDelta(inertia.delta);
                        setRelativeEmotion(cb.emotion);
                        const cbAction = isEn ? cb.actionEN : cb.actionTH;
                        const cbSpeech = isEn ? cb.speechEN : cb.speechTH;
                        setCurrentActionCue(cbAction);
                        setCoachWhisper(cb.coachHintTH || '');
                        setMessages(prev => [...prev, {
                            id: `cb-${Date.now()}`,
                            role: 'relative',
                            text: cbSpeech,
                            emotion: cb.emotion,
                            action: cbAction,
                            trustSnapshot: inertia.trust,
                            unlockedSnapshot: bEval.unlockedIds
                        }]);
                        setIsThinking(false);
                        setThinkingCue('');
                        silenceAnchorRef.current = Date.now();
                        silenceCountedRef.current = false;
                        speakRelativeSegments(cbSpeech, cb.emotion, activePersona.id);
                        return;
                    }
                }
                setActiveCurveball(null);

                const transcript = nextMsgs.map(m => `${m.role === 'user' ? effectiveAddr : (activePersona.id === 'sbar_doctor' ? 'นพ.ภาคิน' : 'ญาติ')}: ${m.text}`).join('\n');
                const unresolved = activeBarriers.filter(b => !bEval.unlockedIds.includes(b.id)).map(b => b.titleTH);
                const isLastTurn = nextTurnNum >= maxTurns;

                const isSbarCase = activePersona.id === 'sbar_doctor';
                const sysPrompt = isEn
                    ? `You are roleplaying ${isSbarCase ? 'an ICU attending physician receiving an SBAR handoff for a potential organ donor' : 'a grieving relative in an organ donation consultation'}.\nCase: ${activePersona.briefingEN}\nLearner address: "${effectiveAddr}".\nCurrent Trust: ${trustScore}% (Barriers resolved ${bEval.unlockedIds.length}/3).\n${isLastTurn ? 'This is the final turn: include [OUTCOME:CONSENT|CONSULT|DECLINE].' : 'Continue realistically and do NOT end early.'}\nFormat strictly: [EMOTION:SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] [ACTION:short body language] [COACH:1 short clinical tip] ${isLastTurn ? '[OUTCOME:CONSENT|CONSULT|DECLINE] ' : ''}followed by 2-3 natural spoken sentences.`
                    : isSbarCase
                        ? `คุณคือ นพ.ภาคิน แพทย์เวร ICU ที่กำลังรับรายงานส่งเวรแบบ SBAR จากพยาบาล (${effectiveAddr}) สำหรับเคส Potential Donor\n${activePersona.promptHintTH}\nความครบถ้วนปัจจุบัน: ${trustScore}% (ครบแล้ว ${bEval.unlockedIds.length}/3 องค์ประกอบ${unresolved.length ? ' • จุดที่ยังไม่ครบ: ' + unresolved.join(', ') : ''})\nกติกา:\n1. เรียกผู้เรียนว่า "${effectiveAddr}" และพูดกระชับแบบแพทย์เวร ICU มืออาชีพ\n2. ${isLastTurn ? 'นี่คือรอบสุดท้าย ให้สรุปแผนการรักษา/Order และใส่แท็ก [OUTCOME:CONSENT] (หากรายงาน SBAR ครบถ้วน) หรือ [OUTCOME:CONSULT] (หากพอใช้ได้แต่ยังต้องติดตามเพิ่ม)' : `รอบที่ ${nextTurnNum}/${maxTurns} ซักถามเจาะจงในส่วน SBAR ที่ผู้เรียนยังไม่ได้รายงาน`}\n3. ขึ้นต้นด้วยแท็ก [EMOTION:CONFUSED|HESITANT|CALM] [ACTION:ภาษากายข้างเตียง ICU สั้นๆ] [COACH:คำแนะนำโค้ช SBAR 1 ประโยค] ตามด้วยคำพูดธรรมชาติ 2-3 ประโยค`
                        : `คุณคือญาติผู้ป่วยในห้องให้คำปรึกษาเรื่องการบริจาคอวัยวะของโรงพยาบาล\n${activePersona.promptHintTH}\nระดับความยาก: ${difficultyId === 'hard' ? 'Hard (ซักถามเจาะลึก ไม่เปิดใจง่าย)' : 'Normal'}\nความไว้วางใจปัจจุบัน: ${trustScore}% (คลายปมในใจแล้ว ${bEval.unlockedIds.length}/3 ข้อ${unresolved.length ? ' • ปมที่ยังค้างคา: ' + unresolved.join(', ') : ''})\nกติกา:\n1. เรียกผู้เรียนว่า "${effectiveAddr}" เสมอ\n2. ${isLastTurn ? 'นี่คือรอบสุดท้าย ให้ญาติสรุปการตัดสินใจและใส่แท็ก [OUTCOME:CONSENT] หรือ [OUTCOME:CONSULT] หรือ [OUTCOME:DECLINE]' : `นี่คือรอบที่ ${nextTurnNum}/${maxTurns} ห้ามรีบจบก่อนรอบสุดท้าย ให้ถามต่อตามปมที่ยังค้างคา`}\n3. ขึ้นต้นด้วยแท็ก [EMOTION:SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] [ACTION:ภาษากายสั้นๆ] [COACH:คำแนะนำโค้ช 1 ประโยค] ตามด้วยคำพูดธรรมชาติ 2-3 ประโยค${activePersona.id === 'conflict' ? ' (ใช้ [ภรรยา]: ... และ [คุณแม่]: ... ชัดเจน)' : ''}`;

                let parsed = null;
                if (appsScriptUrl) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST',
                            redirect: 'follow',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `ประวัติการสนทนา:\n${transcript}\n\n${isSbarCase ? 'ตอบกลับในบทบาทแพทย์เวร ICU:' : 'ตอบกลับในบทบาทญาติ:'}`,
                                systemInstruction: sysPrompt
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const res = JSON.parse((await rawRes.text()) || '{}');
                        if (res?.status === 'success' && res.text) {
                            parsed = SL.parseRelativeResponse(res.text, relativeEmotion);
                        }
                    } catch (_) {}
                }

                const inertia = SL.computeInertiaTrust({
                    prevTrust: trustScore,
                    aiEmotion: parsed?.emotion || relativeEmotion,
                    newlyUnlockedCount: bEval.newlyUnlocked.length,
                    totalUnlockedCount: bEval.unlockedIds.length,
                    triggerCount: triggers.length,
                    usedSilence: usedSilenceNow,
                    difficulty: difficultyId,
                    userText: text
                });

                if (!parsed || !parsed.speech) {
                    await new Promise(r => setTimeout(r, 360));
                    parsed = buildOfflineRelativeReply({
                        persona: activePersona,
                        turnIdx: nextTurnNum - 1,
                        maxTurns,
                        addrName: effectiveAddr,
                        trust: inertia.trust,
                        unlockedCount: bEval.unlockedIds.length,
                        isEn
                    });
                }

                const resolvedOutcome = isLastTurn
                    ? (parsed.outcome || (inertia.trust >= 76 && bEval.unlockedIds.length >= 2 ? 'CONSENT' : inertia.trust >= 54 ? 'CONSULT' : 'DECLINE'))
                    : parsed.outcome;

                setTrustScore(inertia.trust);
                setLastTrustDelta(inertia.delta);
                setRelativeEmotion(inertia.emotion);
                setCurrentActionCue(parsed.actionCue || '');
                if (difficultyId === 'normal' && parsed.coachHint) setCoachWhisper(parsed.coachHint);
                if (resolvedOutcome) setFinalOutcome(resolvedOutcome);

                setMessages(prev => [...prev, {
                    id: `r-${Date.now()}`,
                    role: 'relative',
                    text: parsed.speech,
                    emotion: inertia.emotion,
                    action: parsed.actionCue || '',
                    trustSnapshot: inertia.trust,
                    unlockedSnapshot: bEval.unlockedIds
                }]);
                setIsThinking(false);
                setThinkingCue('');
                silenceAnchorRef.current = Date.now();
                silenceCountedRef.current = false;
                speakRelativeSegments(parsed.speech, inertia.emotion, activePersona.id);
            }, [chatInput, isThinking, finalOutcome, pendingDrillReview, unlockMobileAudio, stopAiVoice, silenceElapsed, isEn, learnerAddressName, selectedMode.isDrill, drillIdx, drillResults, trustScore, activePersona, unlockedBarrierIds, showToast, userTurns, messages, difficultyId, maxTurns, usedCurveballIds, activeBarriers, appsScriptUrl, relativeEmotion, speakRelativeSegments]);

            useEffect(() => { sendUserMsgRef.current = handleSendUserMsg; }, [handleSendUserMsg]);

            const persistLabScore = useCallback(async (report, postConfOverride = null) => {
                if (!report || isAdminPreview) return;
                const preAvg = preConfidenceTouched ? avgScaleScore(preConfidence) : null;
                const postObj = postConfOverride || (postConfidenceSaved ? postConfidence : null);
                const postAvg = postObj ? avgScaleScore(postObj) : null;
                const blindTrans = typeof SL.buildBlindTranscript === 'function'
                    ? SL.buildBlindTranscript(messages, learner?.name)
                    : [];

                const entry = {
                    at: new Date().toISOString(),
                    modeId,
                    difficultyId,
                    personaId: selectedMode.isDrill ? 'micro_drill_4' : activePersona.id,
                    score: Number(report.score || 80),
                    outcome: finalOutcome || 'CONSULT',
                    trustScore,
                    barriersUnlocked: unlockedBarrierIds.length,
                    silenceCount,
                    triggerTotal,
                    avgVocalCalm: avgVocalCalmScore,
                    preSelfEfficacy: preConfidenceTouched ? preConfidence : null,
                    preSelfEfficacyAvg: preAvg,
                    postSelfEfficacy: postObj,
                    postSelfEfficacyAvg: postAvg,
                    radar: report.radar || [],
                    blindTranscript: blindTrans
                };
                try {
                    const savedRaw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    const curUser = savedRaw.user || learner;
                    if (curUser && curUser.id && !String(curUser.id).startsWith('guest_')) {
                        const prevHist = Array.isArray(curUser.skillLabHistory) ? curUser.skillLabHistory : [];
                        const wasAlreadyLabPassed = Boolean(curUser.skillLabPassed || prevHist.length > 0);
                        const nextHist = postConfOverride && prevHist.length > 0
                            ? [...prevHist.slice(0, -1), { ...prevHist[prevHist.length - 1], postSelfEfficacy: postObj, postSelfEfficacyAvg: postAvg }]
                            : [...prevHist, entry].slice(-20);
                        const bestScore = Math.max(Number(curUser.skillLabBestScore || 0), entry.score);
                        const updatedUser = {
                            ...curUser,
                            skillLabPassed: true,
                            skillLabBestScore: bestScore,
                            skillLabLatestRadar: report.radarMap || {},
                            skillLabHistory: nextHist,
                            ...(preAvg !== null ? { preSelfEfficacyAvg: preAvg } : {}),
                            ...(postAvg !== null ? { postSelfEfficacyAvg: postAvg } : {})
                        };
                        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...savedRaw, user: updatedUser }));
                        setLearner(updatedUser);

                        if (fbDb) {
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(curUser.id)),
                                {
                                    skillLabPassed: true,
                                    skillLabBestScore: bestScore,
                                    skillLabLatestRadar: report.radarMap || {},
                                    skillLabHistory: nextHist,
                                    ...(preAvg !== null ? { preSelfEfficacyAvg: preAvg } : {}),
                                    ...(postAvg !== null ? { postSelfEfficacyAvg: postAvg } : {})
                                },
                                { merge: true }
                            );
                            if (typeof CORE.buildAnonTelemetryId === 'function' && typeof CORE.buildExecutiveTelemetryPayload === 'function') {
                                const anonId = CORE.buildAnonTelemetryId(curUser.id);
                                const telemetryBase = CORE.buildExecutiveTelemetryPayload(updatedUser);
                                await setDoc(
                                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId),
                                    {
                                        ...telemetryBase,
                                        ...(preAvg !== null ? { preSelfEfficacyAvg: preAvg } : {}),
                                        ...(postAvg !== null ? { postSelfEfficacyAvg: postAvg } : {})
                                    },
                                    { merge: true }
                                );
                            }

                            // Zero-Cost Scalability Guard: อัปเดตยอดสรุปรวม 1 ใบ (executive_summary/global)
                            const summaryPatch = {};
                            if (!postConfOverride) {
                                if (!wasAlreadyLabPassed) summaryPatch.labUsers = increment(1);
                                summaryPatch.skillScoreSum = increment(entry.score);
                                summaryPatch.skillScoreCount = increment(1);
                                if (preAvg !== null && !preSummarySentRef.current) {
                                    preSummarySentRef.current = true;
                                    summaryPatch.preEffSum = increment(preAvg);
                                    summaryPatch.preEffCount = increment(1);
                                }
                            } else if (postAvg !== null && !postSummarySentRef.current) {
                                postSummarySentRef.current = true;
                                summaryPatch.postEffSum = increment(postAvg);
                                summaryPatch.postEffCount = increment(1);
                            }
                            if (Object.keys(summaryPatch).length > 0) {
                                await setDoc(
                                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_summary', 'global'),
                                    { ...summaryPatch, updatedAt: new Date().toISOString() },
                                    { merge: true }
                                );
                            }
                        }
                    }
                } catch (err) {
                    console.warn('Lab score persist warning:', err);
                }
            }, [isAdminPreview, preConfidenceTouched, preConfidence, postConfidenceSaved, postConfidence, avgScaleScore, messages, learner, modeId, difficultyId, selectedMode.isDrill, activePersona.id, finalOutcome, trustScore, unlockedBarrierIds.length, silenceCount, triggerTotal, avgVocalCalmScore]);

            const handleSavePostConfidence = useCallback(async () => {
                setPostConfidenceSaved(true);
                await persistLabScore(evalReport, postConfidence);
                showToast('บันทึกคะแนนความมั่นใจหลังฝึก (งานวิจัย R2R) เรียบร้อยแล้วค่ะ ✨');
            }, [evalReport, postConfidence, persistLabScore, showToast]);

            const handleFinishAndEvaluate = useCallback(async () => {
                stopAiVoice();
                stopMicCompletely();
                SL.SoundFX.setAmbient(false);
                setAmbientOn(false);
                setPhase('evaluation');
                setIsEvaluating(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });

                const fallbackEval = SL.evaluateConversationFallback({
                    messages,
                    barriersUnlocked: unlockedBarrierIds.length,
                    silenceCount,
                    triggerTotal,
                    finalTrust: trustScore
                });

                if (!appsScriptUrl || messages.filter(m => m.role === 'user').length === 0) {
                    setEvalReport(fallbackEval);
                    setIsEvaluating(false);
                    persistLabScore(fallbackEval);
                    return;
                }

                const evalPrompt = SL.buildSupervisorEvaluationPrompt({
                    messages,
                    personaTitle: selectedMode.isDrill ? 'Micro-Drill 4 ด่านคำถามหนัก' : activePersona.titleTH,
                    barriersUnlocked: unlockedBarrierIds.length,
                    silenceCount,
                    triggerTotal,
                    finalTrust: trustScore
                });

                let resolved = fallbackEval;
                let wasAborted = false;
                try {
                    const ctrl = new AbortController();
                    evalAbortRef.current = ctrl;
                    const tm = setTimeout(() => ctrl.abort(), 14000);
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'callGemini', prompt: evalPrompt }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (ctrl.signal.aborted) {
                        wasAborted = true;
                    } else {
                        const res = JSON.parse((await rawRes.text()) || '{}');
                        if (res?.status === 'success' && res.text) {
                            resolved = SL.parseSupervisorJson(res.text, fallbackEval);
                        }
                    }
                } catch (err) {
                    if (err && err.name === 'AbortError' && evalAbortRef.current === null) {
                        wasAborted = true;
                    }
                }

                if (wasAborted) return;
                evalAbortRef.current = null;
                setEvalReport(resolved);
                setIsEvaluating(false);
                persistLabScore(resolved);
            }, [stopAiVoice, stopMicCompletely, messages, unlockedBarrierIds.length, silenceCount, triggerTotal, trustScore, appsScriptUrl, selectedMode.isDrill, activePersona.titleTH, persistLabScore]);

            const handleForceShowEvaluation = useCallback(() => {
                if (evalAbortRef.current) {
                    const ctrl = evalAbortRef.current;
                    evalAbortRef.current = null;
                    try { ctrl.abort(); } catch (_) {}
                }
                const fallbackEval = SL.evaluateConversationFallback({
                    messages,
                    barriersUnlocked: unlockedBarrierIds.length,
                    silenceCount,
                    triggerTotal,
                    finalTrust: trustScore
                });
                setEvalReport(fallbackEval);

                                                {preConfidenceTouched && (
                                                    <span className="px-2.5 py-1 rounded-full bg-prism-500/20 text-prism-adaptive font-mono text-xs font-bold">
                                                        ก่อนฝึก {avgScaleScore(preConfidence)} → หลังฝึก {avgScaleScore(postConfidence)} / 5
                                                    </span>
                                                )}
                                            </div>
                                            <div className="space-y-2">
                                                {SELF_EFFICACY_ITEMS.map(item => (
                                                    <div key={item.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-xs">
                                                        <span className="text-secondary-adaptive leading-snug">{item.labelTH}</span>
                                                        <div className="flex items-center gap-1 shrink-0">
                                                            {[1, 2, 3, 4, 5].map(n => (
                                                                <button
                                                                    key={n}
                                                                    type="button"
                                                                    onClick={() => {
                                                                        setPostConfidenceSaved(false);
                                                                        setPostConfidence(p => ({ ...p, [item.key]: n }));
                                                                    }}
                                                                    className={`w-8 h-8 rounded-lg font-mono text-xs font-bold border transition-all ${
                                                                        postConfidence[item.key] === n
                                                                            ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 border-transparent font-extrabold'
                                                                            : 'spatial-soft text-secondary-adaptive'
                                                                    }`}
                                                                >
                                                                    {n}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            <button
                                                type="button"
                                                onClick={handleSavePostConfidence}
                                                className={`touch-target w-full py-2.5 rounded-xl font-display font-bold text-xs ${
                                                    postConfidenceSaved
                                                        ? 'bg-aurora-500/20 border border-aurora-400/50 text-accent-adaptive'
                                                        : 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold'
                                                }`}
                                            >
                                                {postConfidenceSaved ? 'บันทึกผลความมั่นใจหลังฝึกแล้ว ✓' : 'บันทึกคะแนนความมั่นใจหลังฝึก (R2R) →'}
                                            </button>
                                        </div>
                                    )}

                                    {/* CLINICAL MASTERY BADGES STRIP */}
                                    {earnedBadges.length > 0 && (
                                        <div className="spatial-soft rounded-2xl p-4 space-y-2">
                                            <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">
                                                CLINICAL MASTERY BADGES • เหรียญตราสมรรถนะคลินิก ({earnedBadges.filter(b => b.earned).length}/{earnedBadges.length})
                                            </p>
                                            <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                                                {earnedBadges.map(b => (
                                                    <div key={b.id} className={`p-2.5 rounded-xl border text-center space-y-1 ${b.earned ? 'bg-aurora-500/15 border-aurora-400/45' : 'spatial-soft opacity-50'}`}>
                                                        <span className="inline-block w-2.5 h-2.5 rounded-full" style={{ backgroundColor: b.earned ? b.color : '#64748b' }} />
                                                        <p className="font-display font-bold text-[11px] text-primary-adaptive leading-tight">{b.titleTH}</p>
                                                        <p className="text-[10px] text-muted-adaptive leading-tight">{b.descTH}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
                                        <button type="button" onClick={() => { setDecompressSec(15); setShowDecompressModal(true); }} className="touch-target spatial-soft py-3 px-4 rounded-full text-accent-adaptive font-display font-bold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="Wind" size={16} /> พักใจ 15 วิ
                                        </button>
                                        <button type="button" onClick={() => { setPhase('setup'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="touch-target spatial-soft py-3 px-4 rounded-full text-primary-adaptive font-display font-bold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="RotateCcw" size={15} /> ฝึกเคสอื่นต่อ
                                        </button>
                                        <a href="./index.html" className="rjc2-pill-btn touch-target py-3 px-4 rounded-full font-display font-extrabold text-xs flex items-center justify-center gap-1.5">
                                            <Icon name="CheckCircle2" size={16} /> กลับห้องเรียนหลัก →
                                        </a>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ==================== MODALS & MOBILE SHEETS ==================== */}
                    {showHistoryDrawer && (
                        <div onClick={() => setShowHistoryDrawer(false)} className="fixed inset-0 z-[125] bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div onClick={(e) => e.stopPropagation()} className="holo-obsidian-card w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom,0px))] space-y-3 text-white max-h-[82dvh] flex flex-col">
                                <div className="flex items-center justify-between shrink-0">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-cyan-300 uppercase">TRANSCRIPT &amp; TIME-REWIND</span>
                                        <h3 className="font-display font-extrabold text-base">ประวัติบทสนทนา (ย้อนเวลาแก้คำพูดได้)</h3>
                                    </div>
                                    <button type="button" onClick={() => setShowHistoryDrawer(false)} className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center"><Icon name="X" size={17} /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 pr-1 text-xs">
                                    {messages.map((m, idx) => (
                                        <div key={m.id || idx} className={`p-3 rounded-2xl border space-y-1 ${m.role === 'user' ? 'bg-emerald-500/15 border-emerald-400/35' : 'bg-white/[0.06] border-white/15'}`}>
                                            <div className="flex items-center justify-between gap-2">
                                                <span className="font-mono text-[10px] font-bold text-cyan-200">{m.role === 'user' ? learnerAddressName : (activePersona.id === 'sbar_doctor' ? 'นพ.ภาคิน (แพทย์เวร ICU)' : 'ญาติผู้ป่วย')}</span>
                                                {m.role === 'user' && !selectedMode.isDrill && (
                                                    <button type="button" onClick={() => handleRewindToTurn(idx)} className="px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-200 font-bold text-[10px] hover:bg-amber-500/35">↺ ย้อนแก้รอบนี้</button>
                                                )}
                                            </div>
                                            <p className="text-sky-100 leading-relaxed">{m.text}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {showToolsSheet && (
                        <div onClick={() => setShowToolsSheet(false)} className="fixed inset-0 z-[125] bg-slate-950/75 backdrop-blur-md flex items-end justify-center">
                            <div onClick={(e) => e.stopPropagation()} className="holo-obsidian-card w-full max-w-lg rounded-t-[2rem] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom,0px))] space-y-4 max-h-[85dvh] overflow-y-auto text-white border-t border-cyan-300/30">
                                <div className="w-10 h-1 rounded-full bg-white/25 mx-auto -mt-1" />
                                <div className="flex items-center justify-between">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-emerald-300 uppercase">MOBILE ROOM CONTROLS</span>
                                        <h3 className="font-display font-extrabold text-base">เครื่องมือห้องฝึก 3 มิติ</h3>
                                    </div>
                                    <button type="button" onClick={() => setShowToolsSheet(false)} className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center"><Icon name="X" size={17} /></button>
                                </div>

                                <div className="space-y-2">
                                    <p className="text-xs font-bold text-cyan-200">สลับรูปแบบ Hologram 3 มิติสด (6 สไตล์)</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        {HOLOGRAM_STYLES.map(st => (
                                            <button
                                                key={st.id}
                                                type="button"
                                                onClick={() => { handleSelectHoloStyle(st.id); setShowToolsSheet(false); }}
                                                className={`touch-target px-3 py-2.5 rounded-2xl border text-left text-xs font-bold flex items-center gap-2 ${hologramStyle === st.id ? 'bg-emerald-500/25 border-emerald-400 text-emerald-200' : 'bg-white/[0.06] border-white/15 text-sky-100'}`}
                                            >
                                                <Icon name={STYLE_ICONS[st.id] || 'Sparkles'} size={15} className="shrink-0" />
                                                <span className="truncate">{st.badge} {st.nameTH}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2 pt-1">
                                    <button type="button" onClick={() => { const next = !ambientOn; setAmbientOn(next); SL.SoundFX.setAmbient(next); setShowToolsSheet(false); }} className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-emerald-200 text-xs font-bold flex items-center justify-center gap-1.5">
                                        <Icon name="Wind" size={15} /> เสียงห้องสงบ: {ambientOn ? 'เปิด' : 'ปิด'}
                                    </button>
                                    <button type="button" onClick={() => { setShowToolsSheet(false); setShowChartModal(true); }} className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-amber-200 text-xs font-bold flex items-center justify-center gap-1.5">
                                        <Icon name="ClipboardList" size={15} /> แฟ้ม &amp; ปม 3 ข้อ
                                    </button>
                                    <button type="button" onClick={() => { setShowToolsSheet(false); setShowHistoryDrawer(true); }} className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-sky-100 text-xs font-bold flex items-center justify-center gap-1.5">
                                        <Icon name="History" size={15} /> ประวัติ &amp; ย้อนแก้
                                    </button>
                                    <button type="button" onClick={() => { setShowToolsSheet(false); setShowSubtitle(v => !v); }} className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-cyan-200 text-xs font-bold flex items-center justify-center gap-1.5">
                                        <Icon name="Subtitles" size={15} /> {showSubtitle ? 'ซ่อนซับไตเติล' : 'แสดงซับไตเติล'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showChartModal && (
                        <div onClick={() => setShowChartModal(false)} className="fixed inset-0 z-[126] bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div onClick={(e) => e.stopPropagation()} className="holo-obsidian-card w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom,0px))] space-y-3.5 text-white border-amber-400/35 max-h-[85dvh] overflow-y-auto">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-amber-300 uppercase">{activeBrief.ward}</span>
                                        <h3 className="font-display font-extrabold text-base">แฟ้มส่งเวร &amp; ปมในใจ 3 ข้อ (Trust {trustScore}%)</h3>
                                    </div>
                                    <button type="button" onClick={() => setShowChartModal(false)} className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center"><Icon name="X" size={17} /></button>
                                </div>
                                {!selectedMode.isDrill && (
                                    <div className="p-3 rounded-2xl bg-cyan-500/15 border border-cyan-400/35 space-y-1.5 text-xs">
                                        <p className="font-mono text-[10px] font-bold text-cyan-200 uppercase">ความคืบหน้าปมในใจ ({unlockedBarrierIds.length}/3)</p>
                                        {activeBarriers.map((b, idx) => {
                                            const done = unlockedBarrierIds.includes(b.id);
                                            return (
                                                <div key={b.id} className={`flex items-center gap-2 ${done ? 'text-emerald-300 font-bold' : 'text-sky-100/75'}`}>
                                                    <span>{done ? '✓' : '○'}</span>
                                                    <span>{idx + 1}. {b.titleTH}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                                <div className="space-y-2.5 text-xs">
                                    <div className="p-3 rounded-2xl bg-white/[0.06] border border-white/10 space-y-1">
                                        <p className="font-bold text-cyan-200">{activeBrief.patient}</p>
                                        <p className="text-sky-100/90">{activeBrief.diagnosis} • {activeBrief.brainDeath}</p>
                                    </div>
                                    <div className="p-3 rounded-2xl bg-white/[0.06] border border-white/10">
                                        <span className="text-[10px] font-mono text-sky-200/70 block">สัญญาณชีพ ICU</span>
                                        <p className="font-mono font-bold text-emerald-300 mt-0.5">{activeBrief.vitals}</p>
                                    </div>
                                    <div className="p-3 rounded-2xl bg-amber-500/15 border border-amber-400/30 space-y-1">
                                        <p className="font-bold text-amber-200">บันทึกส่งเวร ICU</p>
                                        <p className="text-amber-100/90 leading-relaxed">{activeBrief.handoffNote}</p>
                                    </div>
                                </div>
                                <button type="button" onClick={() => setShowChartModal(false)} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-xs">
                                    กลับเข้าสู่บทสนทนา
                                </button>
                            </div>
                        </div>
                    )}

                    {showDecompressModal && (
                        <div className="fixed inset-0 z-[130] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="holo-obsidian-card w-full max-w-md rounded-[2rem] p-6 text-center space-y-4 text-white border-emerald-400/40">
                                <span className="font-mono text-[10px] font-bold text-emerald-300 uppercase">MINDFUL DECOMPRESSION</span>
                                <h3 className="font-display font-extrabold text-lg">พักใจและผ่อนลมหายใจ 15 วินาที</h3>
                                <div className="w-24 h-24 rounded-full bg-emerald-500/20 border-2 border-emerald-400/60 flex items-center justify-center mx-auto font-mono text-3xl font-extrabold text-emerald-300">
                                    {decompressSec}
                                </div>
                                <p className="text-xs sm:text-sm text-sky-100/90 leading-relaxed">
                                    {decompressSec > 10 ? 'หายใจเข้าช้าๆ ลึกๆ... วางความตึงเครียดจากบทสนทนาลง' : decompressSec > 5 ? 'กลั้นเบาๆ แล้วค่อยๆ ผ่อนลมหายใจออกยาวๆ...' : 'คุณทำหน้าที่ดูแลครอบครัวผู้ป่วยได้อย่างงดงามแล้วค่ะ'}
                                </p>
                                <button type="button" onClick={() => setShowDecompressModal(false)} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-xs">
                                    {decompressSec > 0 ? 'ปิดหน้าต่าง' : 'พร้อมไปต่อด้วยใจที่เบาสบาย ✓'}
                                </button>
                            </div>
                        </div>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
