            const toggleAmbientSound = useCallback(() => {
                if (!soundscapeRef.current) return;
                if (ambientOn) {
                    soundscapeRef.current.stop();
                    setAmbientOn(false);
                    showToast('ปิดเสียงบรรยากาศแล้วค่ะ', 'info');
                } else {
                    const targetEmo = phase === 'negotiating' ? relativeEmotion : 'CALM';
                    soundscapeRef.current.start(targetEmo);
                    setAmbientOn(true);
                    showToast('เปิดเสียงบรรยากาศ 3 มิติแล้วค่ะ', 'info');
                }
            }, [ambientOn, phase, relativeEmotion, showToast]);

            // Connect Firebase (ป้องกันทับสิทธิ์ Admin ตอนเปิด Preview 2 ชั้น)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let anonAttempted = false;
                let unsubSettings = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) return;
                        if (!anonAttempted) {
                            anonAttempted = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') {
                                    await fbAuth.authStateReady();
                                }
                                if (active && !fbAuth.currentUser) {
                                    await signInAnonymously(fbAuth);
                                }
                            } catch (_) {}
                        }
                        return;
                    }
                    setIsCloudReady(true);

                    const cur = userRef.current;
                    if (!isAdminPreview && cur?.id && !String(cur.id).startsWith('admin_preview_')) {
                        try {
                            const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(cur.id)));
                            if (snap.exists()) {
                                const cloudData = snap.data();
                                const merged = { ...cur, ...cloudData, progress: Math.max(cur.progress || 0, cloudData.progress || 0) };
                                setUser(merged);
                                const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                                localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                            }
                        } catch (_) {}
                    }

                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (snap.exists() && snap.data()?.appsScriptUrl) {
                                setAppsScriptUrl(snap.data().appsScriptUrl);
                            }
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                };
            }, [isAdminPreview]);

            const stopAiVoice = useCallback(() => {
                if (audioRef.current) {
                    try { audioRef.current.pause(); } catch (_) {}
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsAiSpeaking(false);
            }, []);

            const stopMicCompletely = useCallback(() => {
                if (vadRafRef.current) { cancelAnimationFrame(vadRafRef.current); vadRafRef.current = null; }
                if (speechRecRef.current) {
                    try { speechRecRef.current.onend = null; speechRecRef.current.abort(); } catch (_) {}
                    speechRecRef.current = null;
                }
                if (mediaStreamRef.current) {
                    mediaStreamRef.current.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
                    mediaStreamRef.current = null;
                }
                if (audioCtxRef.current) {
                    try { audioCtxRef.current.close(); } catch (_) {}
                    audioCtxRef.current = null;
                }
                setIsListening(false);
                setMicLevel(0);
            }, []);

            useEffect(() => () => {
                stopAiVoice();
                stopMicCompletely();
                if (silenceTimerRef.current) clearInterval(silenceTimerRef.current);
            }, [stopAiVoice, stopMicCompletely]);

            useEffect(() => {
                if (showTranscriptDrawer) drawerEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, showTranscriptDrawer]);

            // Therapeutic Silence 2.5-Second Tracker
            useEffect(() => {
                if (silenceTimerRef.current) {
                    clearInterval(silenceTimerRef.current);
                    silenceTimerRef.current = null;
                }

                const lastMsg = messages[messages.length - 1];
                const shouldTrack = phase === 'negotiating'
                    && lastMsg?.sender === 'ai'
                    && !isAiSpeaking
                    && !isAiTyping
                    && !isListening
                    && !chatInput.trim()
                    && !silenceEarnedThisTurn;

                if (!shouldTrack) return;

                const startTs = Date.now();
                const TARGET_MS = 2500;
                silenceTimerRef.current = setInterval(() => {
                    const pct = Math.min(100, Math.round(((Date.now() - startTs) / TARGET_MS) * 100));
                    setSilenceProgress(pct);
                    if (pct >= 100) {
                        clearInterval(silenceTimerRef.current);
                        silenceTimerRef.current = null;
                        setSilenceEarnedThisTurn(true);
                        setSilenceBonusCount(c => c + 1);
                        soundscapeRef.current?.playChime();
                        showToast(
                            selectedMode?.language === 'en'
                                ? '✨ Therapeutic Silence +1 (Respectful 2.5s space held)'
                                : '✨ Therapeutic Silence +1 (เว้นจังหวะเงียบรับฟัง 2.5 วินาทีอย่างให้เกียรติ)',
                            'success'
                        );
                    }
                }, 80);

                return () => {
                    if (silenceTimerRef.current) {
                        clearInterval(silenceTimerRef.current);
                        silenceTimerRef.current = null;
                    }
                };
            }, [phase, messages, isAiSpeaking, isAiTyping, isListening, chatInput, silenceEarnedThisTurn, selectedMode, showToast]);

            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'offline' };
                try {
                    const res = await fetch(appsScriptUrl, { method: 'POST', body: JSON.stringify(payload) });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            }, [appsScriptUrl]);

            const speakText = useCallback(async (text, mode, onDone = null) => {
                stopAiVoice();
                if (!voiceEnabled || !text) {
                    if (onDone) onDone();
                    return;
                }
                const cleanText = String(text).replace(/[*#[\]]/g, '').trim();
                if (!cleanText) { if (onDone) onDone(); return; }

                setIsAiSpeaking(true);

                if (appsScriptUrl) {
                    const ttsRes = await callAppsScript({
                        action: 'callGeminiTTS',
                        text: cleanText,
                        voiceName: mode?.voiceName || 'Aoede'
                    });
                    if (ttsRes?.status === 'success' && ttsRes.inlineData?.data) {
                        try {
                            const rate = parseInt(ttsRes.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const wavUrl = pcm16ToWavUrl(ttsRes.inlineData.data, rate);
                            audioUrlRef.current = wavUrl;
                            const audio = new Audio(wavUrl);
                            audioRef.current = audio;
                            audio.onended = () => { stopAiVoice(); if (onDone) onDone(); };
                            audio.onerror = () => { stopAiVoice(); if (onDone) onDone(); };
                            await audio.play();
                            return;
                        } catch (_) {
                            stopAiVoice();
                        }
                    }
                }

                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = mode?.language === 'en' ? 'en-US' : 'th-TH';
                        utter.rate = 0.96;
                        utter.onend = () => { setIsAiSpeaking(false); if (onDone) onDone(); };
                        utter.onerror = () => { setIsAiSpeaking(false); if (onDone) onDone(); };
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }

                setIsAiSpeaking(false);
                if (onDone) onDone();
            }, [voiceEnabled, appsScriptUrl, callAppsScript, stopAiVoice]);

            const toggleMicrophone = async () => {
                if (isListening) {
                    stopMicCompletely();
                    return;
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการรับเสียง กรุณาพิมพ์ข้อความหรือแตะแนวทางคำพูดค่ะ', 'error');
                    return;
                }

                stopAiVoice();
                setVocalFeedback('');

                try {
                    // 1. เปิดไมโครโฟนและตัววิเคราะห์ความนุ่มนวลน้ำเสียง (Web Audio API Vocal Bio-Coach)
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                            mediaStreamRef.current = stream;
                            const AudioCtx = window.AudioContext || window.webkitAudioContext;
                            if (AudioCtx) {
                                const ctx = new AudioCtx();
                                audioCtxRef.current = ctx;
                                const src = ctx.createMediaStreamSource(stream);
                                const analyser = ctx.createAnalyser();
                                analyser.fftSize = 256;
                                src.connect(analyser);

                                const freqData = new Uint8Array(analyser.frequencyBinCount);
                                let peakLoudCount = 0;
                                let frameCount = 0;

                                const measureMic = () => {
                                    if (!mediaStreamRef.current) return;
                                    analyser.getByteFrequencyData(freqData);
                                    let sum = 0;
                                    for (let i = 0; i < freqData.length; i++) sum += freqData[i];
                                    const avg = Math.round(sum / freqData.length);
                                    setMicLevel(avg);

                                    frameCount += 1;
                                    if (avg > 92) peakLoudCount += 1;

                                    if (frameCount % 35 === 0) {
                                        const isTooLoud = peakLoudCount >= 6;
                                        const calmness = isTooLoud ? 68 : avg > 12 ? 91 : 85;
                                        setVocalSamples(prev => [...prev.slice(-14), calmness]);
                                        if (isTooLoud) {
                                            setVocalFeedback(
                                                selectedMode?.language === 'en'
                                                    ? 'Voice sounds tense/loud — try softening your tone and slowing down.'
                                                    : 'น้ำเสียงเริ่มดังและตึง ลองผ่อนน้ำเสียงให้นุ่มนวลและพูดช้าลงนะคะ'
                                            );
                                        } else if (avg > 12) {
                                            setVocalFeedback(
                                                selectedMode?.language === 'en'
                                                    ? 'Calm, steady vocal tone — comforting presence.'
                                                    : 'น้ำเสียงนุ่มนวลและสม่ำเสมอ ช่วยให้ญาติรู้สึกปลอดภัยค่ะ'
                                            );
                                        }
                                        peakLoudCount = 0;
                                    }
                                    vadRafRef.current = requestAnimationFrame(measureMic);
                                };
                                vadRafRef.current = requestAnimationFrame(measureMic);
                            }
                        } catch (micErr) {
                            console.warn('Mic analyser skipped:', micErr);
                        }
                    }

                    // 2. เริ่มระบบถอดเสียงพูดเป็นข้อความ (SpeechRecognition)
                    const rec = new SR();
                    rec.continuous = true;
                    rec.interimResults = true;
                    rec.lang = selectedMode?.language === 'en' ? 'en-US' : 'th-TH';

                    rec.onresult = (event) => {
                        let transcript = '';
                        for (let i = 0; i < event.results.length; i++) {
                            transcript += event.results[i][0].transcript;
                        }
                        setChatInput(transcript.trim());
                    };
                    rec.onerror = (ev) => {
                        if (ev?.error === 'not-allowed') {
                            showToast('กรุณาอนุญาตสิทธิ์การใช้ไมโครโฟนบนเบราว์เซอร์ก่อนค่ะ', 'error');
                        }
                        stopMicCompletely();
                    };
                    rec.onend = () => {
                        stopMicCompletely();
                    };

                    speechRecRef.current = rec;
                    setIsListening(true);
                    rec.start();
                } catch (err) {
                    console.warn('SpeechRecognition start error:', err);
                    stopMicCompletely();
                    showToast('ไม่สามารถเปิดไมโครโฟนได้ในขณะนี้ กรุณาพิมพ์ข้อความแทนค่ะ', 'error');
                }
            };

            const enterHolodeck = useCallback((mode, track, personaOverride = null, difficultyOverride = null) => {
                stopAiVoice();
                stopMicCompletely();

                const isEn = mode.language === 'en';
                const personaObj = personaOverride || activePersona || SKILL_LAB_PERSONAS[0];
                const diffObj = difficultyOverride || activeDifficulty || SKILL_LAB_DIFFICULTIES.normal;

                setSelectedMode(mode);
                setTrainingTrack(track);
                setPhase('negotiating');
                setEvalResult(null);
                setDrillIndex(0);
                setTimeline([]);
                setSilenceBonusCount(0);
                setSilenceProgress(0);
                setSilenceEarnedThisTurn(false);
                setVocalSamples([]);
                setVocalFeedback('');
                setShowCoachWhisper(Boolean(diffObj.showCoachDefault));

                if (track === 'micro_drill') {
                    const first = GUIDED_DRILLS[isEn ? 'en' : 'th'][0];
                    setRelativeEmotion(first.emotion);
                    setAiCoachTip(first.focusTip);
                    setMessages([
                        { id: `sys-${Date.now()}`, sender: 'system', title: first.stepTitle, text: first.context },
                        { id: `ai-open-${Date.now() + 1}`, sender: 'ai', emotion: first.emotion, speakerName: mode.relativeName, text: first.relativeLine }
                    ]);
                    setSmartSuggestions(diffObj.showSuggestions ? [
                        first.masterSample,
                        isEn
                            ? 'Hello, I am a clinical coordinator on the care team. I am so sorry for your worry—please sit comfortably in this quiet space.'
                            : 'สวัสดีค่ะ ดิฉันเป็นเจ้าหน้าที่ผู้ประสานงานดูแลครอบครัวค่ะ เข้าใจความกังวลใจอย่างมากเลยนะคะ ขอเชิญพูดคุยกันอย่างสบายใจและเป็นส่วนตัวได้เลยค่ะ'
                    ] : []);
                    speakText(first.relativeLine, mode);
                    return;
                }

                const openLine = isEn ? (personaObj.openingEN || mode.openingLine) : (personaObj.openingTH || mode.openingLine);
                const openEmo = personaObj.openingEmotion || mode.openingEmotion || 'CONFUSED';
                const briefTxt = isEn ? (personaObj.briefingEN || mode.briefingText) : (personaObj.briefingTH || mode.briefingText);

                setRelativeEmotion(openEmo);
                setAiCoachTip(isEn
                    ? `Scenario: ${personaObj.titleEN} (${diffObj.badge}) — Pause 2.5s for Therapeutic Silence, then validate emotions gently.`
                    : `เคส: ${personaObj.titleTH} (${diffObj.badge}) — ลองเว้นจังหวะเงียบ 2.5 วิ แล้วสะท้อนความรู้สึกของญาติก่อนให้ข้อมูลค่ะ`);
                setMessages([
                    { id: `sys-${Date.now()}`, sender: 'system', title: isEn ? personaObj.titleEN : personaObj.titleTH, text: briefTxt },
                    { id: `ai-open-${Date.now() + 1}`, sender: 'ai', emotion: openEmo, speakerName: mode.relativeName, text: openLine }
                ]);

                const personaSuggestions = (() => {
                    if (!diffObj.showSuggestions) return [];
                    if (personaObj.id === 'belief') {
                        return isEn ? [
                            'I deeply respect your elders’ spiritual beliefs. Our surgeons care for the body with utmost dignity so funeral rites proceed peacefully.',
                            'Thank you for sharing this concern openly. There is zero pressure—we can talk gently about how dignity and traditions are protected.'
                        ] : [
                            'ดิฉันเคารพความเชื่อและความห่วงใยของคุณยายอย่างยิ่งค่ะ ในทางศาสนาการต่อชีวิตเพื่อนมนุษย์ถือเป็นทานบารมีอันยิ่งใหญ่ และทีมศัลยแพทย์จะดูแลตกแต่งร่างอย่างประณีตเพื่อทำพิธีได้ตามปกติค่ะ',
                            'ขอบคุณที่เล่าความกังวลให้ฟังตรงๆ นะคะ ไม่ต้องรีบตัดสินใจเลยค่ะ ขอรับรองว่าร่างของท่านจะได้รับการดูแลอย่างสมเกียรติที่สุดค่ะ'
                        ];
                    }
                    if (personaObj.id === 'conflict') {
                        return isEn ? [
                            'I can see how deeply both of you love him. Please be assured our team will never force any decision against the family’s wishes.',
                            'Both perspectives come from deep love. Let’s pause together—there is no rush, and your family’s peace always comes first.'
                        ] : [
                            'ดิฉันสัมผัสได้ถึงความรักที่ทั้งคุณแม่และภรรยามีให้ท่านอย่างลึกซึ้งค่ะ ขอยืนยันว่าทีมจะไม่ฝืนใจหรือบังคับครอบครัวเด็ดขาด ความสบายใจของครอบครัวสำคัญที่สุดค่ะ',
                            'เข้าใจความรู้สึกของทั้งสองท่านเลยค่ะ ตอนนี้ไม่ต้องรีบตัดสินใจนะคะ ขอให้ครอบครัวค่อยๆ ปรึกษากันอย่างสงบโดยไม่มีแรงกดดันค่ะ'
                        ];
                    }
                    if (personaObj.id === 'distrust') {
                        return isEn ? [
                            'You have every right to ask directly. Organs are allocated transparently by the Thai Red Cross (ODC) computer system, and there is zero cost to your family.',
                            'Thank you for being honest with me. There is strictly no organ selling or queue-jumping, and all donation-related care carries no extra bill.'
                        ] : [
                            'เป็นสิทธิ์ของครอบครัวที่ซักถามได้ตรงๆ ค่ะ การจัดสรรอวัยวะทั้งหมดทำผ่านระบบคอมพิวเตอร์ศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC) อย่างโปร่งใสเป็นธรรม และครอบครัวไม่มีค่าใช้จ่ายเพิ่มเติมค่ะ',
                            'ขอบคุณที่ถามอย่างตรงไปตรงมานะคะ ขอยืนยันว่าไม่มีการลัดคิวหรือซื้อขายเด็ดขาด และครอบครัวไม่ต้องรับผิดชอบค่าใช้จ่ายที่เกี่ยวกับการบริจาคอวัยวะค่ะ'
                        ];
                    }
                    return isEn ? [
                        'Hello, my name is Nurse Joy, a clinical coordinator on the care team. I am truly sorry for what happened—thank you for speaking with me in this quiet space.',
                        'I understand why feeling warmth and seeing chest movement is heartbreakingly confusing. May I gently explain how the ventilator works compared with brain death?'
                    ] : [
                        'สวัสดีค่ะ ดิฉันชื่อพยาบาลใจดี เป็นพยาบาลผู้ประสานงานจากทีมดูแลค่ะ ขอแสดงความเสียใจกับเหตุการณ์ที่เกิดขึ้นนะคะ เข้าใจเลยค่ะว่าการเห็นหน้าอกขยับและตัวอุ่นทำให้สับสนมาก',
                        'เข้าใจความรู้สึกของครอบครัวอย่างมากเลยค่ะ ก่อนอื่นขออนุญาตอธิบายอย่างนุ่มนวลถึงความแตกต่างระหว่างการทำงานของเครื่องช่วยหายใจกับภาวะสมองตายนะคะ'
                    ];
                })();

                setSmartSuggestions(personaSuggestions);
                speakText(openLine, mode);
            }, [activePersona, activeDifficulty, stopAiVoice, stopMicCompletely, speakText]);

            const handleStartTrack = (mode, track) => {
                stopAiVoice();
                stopMicCompletely();
                setSelectedMode(mode);
                setTrainingTrack(track);
                if (track === 'full_sim') {
                    setPhase('video_intro');
                } else {
                    enterHolodeck(mode, track, activePersona, activeDifficulty);
                }
            };

            const handleSendMessage = async (e, presetReply = null) => {
                if (e) e.preventDefault();
                if (!selectedMode || phase !== 'negotiating' || isAiTyping) return;
                const learnerText = String(presetReply ?? chatInput).trim();
                if (!learnerText) return;

                stopAiVoice();
                if (isListening) stopMicCompletely();

                const heldSilenceThisTurn = silenceEarnedThisTurn;
                const prevTrust = (EMOTION_PHYSICS[relativeEmotion] || EMOTION_PHYSICS.CONFUSED).trust;
                const preTurnMessagesSnapshot = [...messages];

                setChatInput('');
                setSmartSuggestions([]);
                setSilenceProgress(0);
                setSilenceEarnedThisTurn(false);

                const userMsgObj = {
                    id: `u-${Date.now()}`,
                    sender: 'user',
                    speakerName: selectedMode.language === 'en' ? 'You (Communicator)' : 'คุณ (ผู้ให้ข้อมูลญาติ)',
                    text: learnerText
                };
                const nextMessages = [...messages, userMsgObj];
                setMessages(nextMessages);

                if (trainingTrack === 'micro_drill') {
                    const drills = GUIDED_DRILLS[selectedMode.language === 'en' ? 'en' : 'th'];
                    const nextIdx = drillIndex + 1;
                    const hasNext = nextIdx < drills.length;

                    if (hasNext) {
                        const nextDrill = drills[nextIdx];
                        const nextMeta = EMOTION_PHYSICS[nextDrill.emotion] || EMOTION_PHYSICS.SAD;
                        setDrillIndex(nextIdx);
                        setRelativeEmotion(nextDrill.emotion);
                        setAiCoachTip(nextDrill.focusTip);

                        setTimeline(prev => [...prev, {
                            id: `tl-${Date.now()}`,
                            userText: learnerText,
                            aiText: nextDrill.relativeLine,
                            emotion: nextDrill.emotion,
                            trust: nextMeta.trust,
                            tension: nextMeta.tension,
                            deltaTrust: nextMeta.trust - prevTrust,
                            silenceHeld: heldSilenceThisTurn,
                            snapshotBeforeTurn: preTurnMessagesSnapshot,
                            drillIndexBeforeTurn: drillIndex,
                            emotionBeforeTurn: relativeEmotion
                        }]);

                        const aiNext = {
                            id: `ai-d-${Date.now() + 1}`,
                            sender: 'ai',
                            emotion: nextDrill.emotion,
                            speakerName: selectedMode.relativeName,
                            text: nextDrill.relativeLine
                        };
                        setMessages([
                            ...nextMessages,
                            { id: `sys-d-${Date.now()}`, sender: 'system', title: nextDrill.stepTitle, text: nextDrill.context },
                            aiNext
                        ]);
                        setSmartSuggestions(activeDifficulty.showSuggestions ? [
                            nextDrill.masterSample,
                            selectedMode.language === 'en'
                                ? 'I hear how deeply painful this is. Please take all the quiet time you need.'
                                : 'ดิฉันเข้าใจความรู้สึกของครอบครัวอย่างมากเลยค่ะ ไม่ต้องรีบนะคะ ค่อยๆ สอบถามได้ทุกเรื่องเลยค่ะ'
                        ] : []);
                        speakText(nextDrill.relativeLine, selectedMode);
                    } else {
                        const calmMeta = EMOTION_PHYSICS.CALM;
                        const closingLine = selectedMode.language === 'en'
                            ? 'Thank you for speaking with such kindness and honesty. I feel peaceful knowing our family is respected and supported.'
                            : 'ขอบคุณมากนะคะที่ค่อยๆ อธิบายด้วยความอ่อนโยนและให้เกียรติครอบครัวเรา ตอนนี้ใจสงบและวางใจขึ้นมากเลยค่ะ';

                        setRelativeEmotion('CALM');
                        setTimeline(prev => [...prev, {
                            id: `tl-${Date.now()}`,
                            userText: learnerText,
                            aiText: closingLine,
                            emotion: 'CALM',
                            trust: calmMeta.trust,
                            tension: calmMeta.tension,
                            deltaTrust: calmMeta.trust - prevTrust,
                            silenceHeld: heldSilenceThisTurn,
                            snapshotBeforeTurn: preTurnMessagesSnapshot,
                            drillIndexBeforeTurn: drillIndex,
                            emotionBeforeTurn: relativeEmotion
                        }]);
                        setAiCoachTip(selectedMode.language === 'en'
                            ? 'Calibration complete! Tap "Evaluate" at top-right to claim your Competency Card.'
                            : 'ฝึกครบทั้ง 3 ด่านแล้วค่ะ กดปุ่ม "ประเมินผล" มุมขวาบนเพื่อรับการ์ดสมรรถนะและปลดล็อก Post-test ได้เลยค่ะ');
                        setMessages([
                            ...nextMessages,
                            { id: `ai-final-${Date.now()}`, sender: 'ai', emotion: 'CALM', speakerName: selectedMode.relativeName, text: closingLine }
                        ]);
                        speakText(closingLine, selectedMode);
                    }
                    return;
                }

                setIsAiTyping(true);
                const turnCount = nextMessages.filter(m => m.sender === 'user').length;
                const historyText = nextMessages
                    .filter(m => m.sender !== 'system')
                    .slice(-10)
                    .map(m => `${m.sender === 'user' ? 'Clinical Communicator' : 'Bereaved Relative'}: ${m.text}`)
                    .join('\n');

                const clinicalKnowledge = window.CLINICAL_KNOWLEDGE_BASE || '';
                const personaRule = selectedMode.language === 'en'
                    ? (activePersona?.promptHintEN || '')
                    : (activePersona?.promptHintTH || '');
                const diffRule = selectedMode.language === 'en'
                    ? (activeDifficulty?.aiPromptRuleEN || '')
                    : (activeDifficulty?.aiPromptRuleTH || '');

                const sugRule = activeDifficulty.showSuggestions
                    ? (selectedMode.language === 'en'
                        ? `\n\n[SMART SUGGESTIONS]\nAdd 2 empathetic next-turn suggestions:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`
                        : `\n\n[SMART SUGGESTIONS]\nต่อท้ายด้วยแนวทางคำพูดที่เหมาะสมสำหรับผู้เรียน 2 ข้อ:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`)
                    : '\n\n(Hard Mode: Do NOT output [SUGGESTION] lines.)';

                const fullPrompt = `${selectedMode.systemPrompt}

### บุคลิกและสถานการณ์จำเพาะ (Active Persona: ${activePersona?.titleTH || 'Standard'})
${personaRule}

### ระดับความยาก (Difficulty: ${activeDifficulty?.badge || 'NORMAL'})
${diffRule}

[Clinical Knowledge]
${clinicalKnowledge}${sugRule}

History:
${historyText}
Clinical Communicator: ${learnerText}
Bereaved Relative (Start with [EMOTION]):`;

                let rawReply = '';
                if (appsScriptUrl) {
                    const res = await callAppsScript({ action: 'callGemini', prompt: learnerText, systemInstruction: fullPrompt });
                    if (res?.status === 'success' && res.text) rawReply = res.text;
                }
                if (!rawReply) {
                    await new Promise(r => setTimeout(r, 550));
                    rawReply = generateOfflineRelativeReply(learnerText, selectedMode, turnCount, activePersona, activeDifficulty);
                }

                const parsed = parseAiResponse(rawReply);
                const nextMeta = EMOTION_PHYSICS[parsed.emotion] || EMOTION_PHYSICS.SAD;

                setRelativeEmotion(parsed.emotion);
                if (parsed.coachTip) setAiCoachTip(parsed.coachTip);
                setMessages(prev => [...prev, {
                    id: `ai-${Date.now()}`,
                    sender: 'ai',
                    emotion: parsed.emotion,
                    speakerName: selectedMode.relativeName,
                    text: parsed.text
                }]);
                setTimeline(prev => [...prev, {
                    id: `tl-${Date.now()}`,
                    userText: learnerText,
                    aiText: parsed.text,
                    emotion: parsed.emotion,
                    trust: nextMeta.trust,
                    tension: nextMeta.tension,
                    deltaTrust: nextMeta.trust - prevTrust,
                    silenceHeld: heldSilenceThisTurn,
                    snapshotBeforeTurn: preTurnMessagesSnapshot,
                    drillIndexBeforeTurn: drillIndex,
                    emotionBeforeTurn: relativeEmotion
                }]);
                setSmartSuggestions(activeDifficulty.showSuggestions ? parsed.suggestions : []);
                setIsAiTyping(false);

                speakText(parsed.text, selectedMode);
            };

            const handleRewindToTurn = (turnIdx) => {
                const target = timeline[turnIdx];
                if (!target || !selectedMode) return;
                stopAiVoice();
                stopMicCompletely();

                setMessages(target.snapshotBeforeTurn || []);
                setTimeline(prev => prev.slice(0, turnIdx));
                setRelativeEmotion(target.emotionBeforeTurn || 'CONFUSED');
                setDrillIndex(target.drillIndexBeforeTurn || 0);
                setChatInput('');
                setSilenceProgress(0);
                setSilenceEarnedThisTurn(false);
                setPhase('negotiating');
                setAiCoachTip(selectedMode.language === 'en'
                    ? `⏪ Time-Rewind active! Try delivering Turn ${turnIdx + 1} again with empathy and clarity.`
                    : `⏪ ย้อนเวลากลับมาที่จังหวะที่ ${turnIdx + 1} แล้วค่ะ ลองพูดหรือปรับประโยคใหม่เพื่อดูปฏิกิริยาอารมณ์ของญาติได้เลย`);
                showToast(`ย้อนเวลากลับไปแก้ไข Turn ${turnIdx + 1} เรียบร้อยค่ะ`, 'info');
            };

            const handleEvaluateSession = async () => {
                if (!selectedMode || !user) return;
                if (messages.filter(m => m.sender === 'user').length === 0) {
                    showToast('กรุณาสื่อสารให้ข้อมูลญาติอย่างน้อย 1 จังหวะก่อนประเมินผลค่ะ', 'error');
                    return;
                }

                stopAiVoice();
                stopMicCompletely();
                setPhase('evaluating');

                const vocalAvg = vocalSamples.length > 0
                    ? Math.round(vocalSamples.reduce((a, b) => a + b, 0) / vocalSamples.length)
                    : 84;
                const evaluated = evaluateFiveDimensions(messages, selectedMode, silenceBonusCount, vocalAvg);

                let aiCoachingNote = '';
                if (appsScriptUrl) {
                    const transcript = messages
                        .filter(m => m.sender !== 'system')
                        .map(m => `${m.sender === 'user' ? 'ผู้ให้ข้อมูลญาติ' : 'ญาติผู้เสียชีวิต'}: ${m.text}`)
                        .join('\n');
                    const evalPrompt = selectedMode.language === 'en'
                        ? `Give 3 concise, uplifting coaching bullet points reviewing (1) Clinical accuracy, (2) Emotional resonance, (3) One Master Coordinator phrase.\n\n${transcript}`
                        : `สรุปข้อเสนอแนะเชิงให้กำลังใจสั้นกระชับ 3 ข้อสำหรับบทสนทนานี้: (1) ความถูกต้องข้อมูลทางการแพทย์ (2) การรับรู้อารมณ์ร่วม (3) แนวทางประโยคระดับ Master Coordinator\n\n${transcript}`;
                    const res = await callAppsScript({ action: 'callGemini', prompt: evalPrompt });
                    if (res?.status === 'success' && res.text) aiCoachingNote = res.text;
                } else {
                    await new Promise(r => setTimeout(r, 500));
                }

                const finalResult = {
                    ...evaluated,
                    aiCoachingNote,
                    track: trainingTrack,
                    personaId: activePersona?.id || 'standard',
                    personaTitle: selectedMode.language === 'en' ? activePersona?.titleEN : activePersona?.titleTH,
                    difficulty: activeDifficulty?.id || 'normal',
                    language: selectedMode.language,
                    timestamp: new Date().toISOString()
                };

                setEvalResult(finalResult);
                setSelectedTimelineIdx(Math.max(0, timeline.length - 1));
                setPhase('debrief');

                if (isAdminPreview) {
                    showToast('แสดงผลในโหมด Admin View (ไม่บันทึกทับข้อมูลผู้เรียนจริง)', 'info');
                    return;
                }

                try {
                    const historyItem = {
                        score: finalResult.totalScore,
                        infoScore: finalResult.infoScore,
                        empathyScore: finalResult.empathyScore,
                        radar: finalResult.radar,
                        silenceBonusCount: finalResult.silenceBonusCount,
                        passed: finalResult.passed,
                        mode: selectedMode.id,
                        personaId: activePersona?.id || 'standard',
                        difficulty: activeDifficulty?.id || 'normal',
                        track: trainingTrack,
                        timestamp: finalResult.timestamp
                    };
                    const nextHistory = [...(Array.isArray(user.skillLabHistory) ? user.skillLabHistory : []), historyItem];
                    const bestScore = Math.max(...nextHistory.map(h => h.score || 0));
                    const latestRadarMap = (finalResult.radar || []).reduce((acc, item) => {
                        acc[item.key] = item.value;
                        return acc;
                    }, { setting: 80, empathy: 80, clarity: 80, vocal: 80, dignity: 80 });

                    const nextUser = {
                        ...user,
                        skillLabPassed: Boolean(user.skillLabPassed || finalResult.passed),
                        skillLabBestScore: bestScore,
                        skillLabLatestRadar: latestRadarMap,
                        skillLabHistory: nextHistory
                    };
                    setUser(nextUser);
                    const rawSaved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...rawSaved, user: nextUser }));

                    if (isCloudReady && fbDb && nextUser.id && !String(nextUser.id).startsWith('admin_preview_')) {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            {
                                skillLabPassed: nextUser.skillLabPassed,
                                skillLabBestScore: bestScore,
                                skillLabLatestRadar: latestRadarMap,
                                skillLabHistory: nextHistory
                            },
                            { merge: true }
                        );
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard', String(nextUser.id)),
                            {
                                name: nextUser.name,
                                hospital: nextUser.hospital || '-',
                                score: bestScore,
                                radar: latestRadarMap,
                                updatedAt: finalResult.timestamp
                            },
                            { merge: true }
                        );
                    }
                    showToast('บันทึกผลประเมิน AI Skill Lab และปลดล็อก Post-test เรียบร้อยแล้วค่ะ 🎉');
                } catch (err) {
                    console.warn('Save evaluation warning:', err);
                }
            };

            const handleExitToMenu = () => {
                if (phase === 'negotiating' && messages.some(m => m.sender === 'user')) {
                    setConfirmDialog({
                        open: true,
                        title: 'ออกจากห้องฝึกสื่อสาร AI Skill Lab?',
                        message: 'หากกลับหน้าเมนูตอนนี้ บทสนทนาที่ยังไม่ได้กดประเมินผลจะยังไม่ถูกบันทึกค่ะ',
                        confirmText: 'กลับหน้าเมนู',
                        onConfirm: () => {
                            stopAiVoice();
                            stopMicCompletely();
                            setSelectedMode(null);
                            setPhase('menu');
                        }
                    });
                } else {
                    stopAiVoice();
                    stopMicCompletely();
                    setSelectedMode(null);
                    setPhase('menu');
                }
            };

            const isEn = selectedMode?.language === 'en';
            const activeEmotionKey = phase === 'negotiating' ? relativeEmotion : 'CALM';
            const activeEmotionMeta = EMOTION_PHYSICS[activeEmotionKey] || EMOTION_PHYSICS.CONFUSED;

            // ตรวจคำที่อาจกระทบใจญาติแบบ Real-time ขณะพิมพ์/พูด (ประกาศ Hooks ก่อนเงื่อนไข return)
            const liveTriggerHits = useMemo(
                () => detectTriggerPhrases(chatInput, isEn ? 'en' : 'th'),
                [chatInput, isEn]
            );

            const handleApplySoftPolish = (hit) => {
                if (!hit) return;
                const cleanSoft = String(hit.softer || '').split('/')[0].trim();
                setChatInput(prev => prev.replace(hit.pattern, cleanSoft));
                showToast(isEn ? 'Softened phrasing applied!' : `ปรับถ้อยคำเป็น “${cleanSoft}” เรียบร้อยค่ะ`, 'success');
            };

            const latestAiMessage = useMemo(() => {
                for (let i = messages.length - 1; i >= 0; i--) {
                    if (messages[i].sender === 'ai') return messages[i];
                }
                return null;
            }, [messages]);
            const latestUserMessage = useMemo(() => {
                for (let i = messages.length - 1; i >= 0; i--) {
                    if (messages[i].sender === 'user') return messages[i];
                }
                return null;
            }, [messages]);

            const principleStatus = useMemo(() => {
                const list = GUIDED_PRINCIPLES[isEn ? 'en' : 'th'];
                const combined = messages.filter(m => m.sender === 'user').map(m => m.text || '').join(' ').toLowerCase();
                return list.map(item => ({ ...item, covered: item.pattern.test(combined) }));
            }, [messages, isEn]);

            const activeCoachGuidance = aiCoachTip
                || principleStatus.find(p => !p.covered)?.tip
                || (isEn ? 'All 4 core principles practiced! Tap "Evaluate" to claim your Competency Card.' : 'ครบทั้ง 4 หลักการแล้วค่ะ กด "ประเมินผล" เพื่อรับการ์ดสมรรถนะได้เลย');

            // ตรวจสอบสิทธิ์ผู้เรียน (ใช้งานจริงเต็มรูปแบบ: ต้องล็อกอิน + ผ่าน Pre-test + เรียน ≥ 80%)
            if (!user && !isAdminPreview) {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 bg-void-950 text-slate-100 spatial-grid">
                        <div className="vision-glass relative z-10 w-full max-w-md rounded-[2rem] p-6 sm:p-8 text-center space-y-5 border-prism-400/35">
                            <div className="w-16 h-16 rounded-2xl bg-prism-500/15 border border-prism-400/35 text-prism-300 flex items-center justify-center mx-auto">
                                <Icon name="UserCheck" size={32} />
                            </div>
                            <div className="space-y-1.5">
                                <span className="inline-block px-2.5 py-0.5 rounded-full bg-prism-500/15 text-prism-300 font-mono text-[10px] font-bold">
                                    AUTHENTICATION REQUIRED
                                </span>
                                <h1 className="font-display text-xl sm:text-2xl font-extrabold text-white">กรุณาเข้าสู่ระบบผู้เรียนก่อน</h1>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                                    ห้องฝึกสื่อสาร <b className="text-white">AI Skill Lab</b> บันทึกคะแนนสมรรถนะและปลดล็อก Post-test ผูกกับบัญชีผู้เรียนของคุณโดยตรง กรุณาเข้าสู่ระบบจากหน้าหลักก่อนค่ะ
                                </p>
                            </div>
                            <a href="./index.html" className="touch-target w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2">
                                <Icon name="ArrowLeft" size={17} /> ไปหน้าเข้าสู่ระบบผู้เรียน
                            </a>
                        </div>
                    </div>
                );
            }

            const hasDonePretest = Boolean(user?.pretest && user.pretest !== '-');
            const isStudyHoursMet = (user?.progress || 0) >= MIN_STUDY_PERCENT;
            const isLabLocked = !isAdminPreview && (!hasDonePretest || !isStudyHoursMet);

            if (isLabLocked) {
                return (
                    <div className="min-h-dvh relative flex items-center justify-center p-4 bg-void-950 text-slate-100 spatial-grid">
                        <div className="vision-glass relative z-10 w-full max-w-md rounded-[2rem] p-6 sm:p-8 text-center space-y-5 border-amber-400/35">
                            <div className="w-16 h-16 rounded-2xl bg-amber-500/15 border border-amber-400/35 text-amber-300 flex items-center justify-center mx-auto">
                                <Icon name="Lock" size={32} />
                            </div>
                            <div className="space-y-1.5">
                                <span className="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-mono text-[10px] font-bold">
                                    STEP 2 → 3 • PREREQUISITE LOCKED
                                </span>
                                <h1 className="font-display text-xl sm:text-2xl font-extrabold text-white">ยังไม่ปลดล็อก AI Skill Lab</h1>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                                    ผู้เรียนต้องทำ <b className="text-white">Pre-test</b> และสะสมชั่วโมงเรียนไม่น้อยกว่า <b className="text-aurora-300">{MIN_STUDY_PERCENT}%</b> ก่อนเข้าฝึกสื่อสารใน AI Skill Lab 3 มิติค่ะ
                                </p>
                            </div>
                            <div className="space-y-2.5 text-left bg-white/[0.04] border border-white/10 rounded-2xl p-4 text-xs">
                                <div className="flex justify-between">
                                    <span className="text-slate-300">1. Pre-test</span>
                                    <span className={`font-bold ${hasDonePretest ? 'text-aurora-300' : 'text-rose-300'}`}>{hasDonePretest ? user.pretest : 'ยังไม่ทำ'}</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-slate-300">2. ชั่วโมงเรียน (≥ {MIN_STUDY_PERCENT}%)</span>
                                    <span className="font-mono font-bold text-prism-300">{user?.progress || 0}% / {MIN_STUDY_PERCENT}%</span>
                                </div>
                            </div>
                            <a href="./index.html#dashboard" className="touch-target w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-aurora-500 to-prism-500 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2">
                                <Icon name="ArrowLeft" size={17} /> กลับไปสะสมชั่วโมงเรียนต่อ
                            </a>
                        </div>
                    </div>
                );
            }

            // ============================================================================
            // 9. RENDER AI SKILL LAB VIEWS
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col bg-void-950 text-slate-100 spatial-grid overflow-x-hidden">
                    {/* FULLSCREEN 3D LIVING EMOTIONAL CORE LAYER */}
                    <div className={`fixed inset-0 z-0 transition-opacity duration-700 ${phase === 'video_intro' || phase === 'debrief' ? 'opacity-35 pointer-events-none' : 'opacity-100'}`}>
                        <SpatialEmotionalCoreCanvas
                            emotionKey={activeEmotionKey}
                            isAiSpeaking={isAiSpeaking}
                            isAiTyping={isAiTyping}
                            micLevel={micLevel}
                            interactive={phase === 'negotiating' || phase === 'menu'}
                        />
                        <div className="absolute inset-0 pointer-events-none bg-gradient-to-b from-void-950/75 via-transparent to-void-950/90" />
                    </div>

                    {/* TOP SPATIAL NAVIGATION BAR */}
                    <header className="sticky top-0 z-30 pt-safe px-3 sm:px-6 py-2.5 pointer-events-none">
                        <div className="max-w-7xl mx-auto vision-pill rounded-2xl px-3 sm:px-4 min-h-[3.25rem] py-2 flex items-center justify-between gap-2 pointer-events-auto">
                            <div className="flex items-center gap-2.5 min-w-0">
                                {phase === 'menu' ? (
                                    <a href="./index.html#dashboard" className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/15 text-slate-200 flex items-center justify-center shrink-0" title="กลับห้องเรียน">
                                        <Icon name="ArrowLeft" size={17} />
                                    </a>
                                ) : (
                                    <button type="button" onClick={handleExitToMenu} className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/15 text-slate-200 flex items-center justify-center shrink-0" title="กลับเมนู AI Skill Lab">
                                        <Icon name="ArrowLeft" size={17} />
                                    </button>
                                )}
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5">
                                        <span className="font-display font-extrabold text-sm sm:text-base text-white truncate">
                                            AI SKILL <span className="text-transparent bg-clip-text bg-gradient-to-r from-aurora-300 to-prism-300">LAB</span>
                                        </span>
                                        <span className="hidden md:inline-block px-2 py-0.5 rounded-full bg-aurora-500/15 border border-aurora-400/30 font-mono text-[10px] font-bold text-aurora-300">
                                            3D EMPATHY SIMULATION
                                        </span>
                                    </div>
                                    <p className="text-[10px] font-mono text-slate-400 truncate">
                                        {phase === 'negotiating' ? selectedMode?.subtitle : `${CONFIG.appName} • ${user?.name}`}
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                <button
                                    type="button"
                                    onClick={toggleAmbientSound}
                                    title="เปิด/ปิดเสียงบรรยากาศ"
                                    className={`w-9 h-9 rounded-xl border flex items-center justify-center transition-colors ${
                                        ambientOn ? 'bg-prism-500/20 border-prism-400/45 text-prism-200' : 'bg-white/5 border-white/10 text-slate-400'
                                    }`}
                                >
                                    <Icon name={ambientOn ? 'AudioLines' : 'VolumeX'} size={16} />
                                </button>

                                {phase === 'negotiating' && (
                                    <>
                                        <button
                                            type="button"
                                            onClick={() => { const n = !voiceEnabled; setVoiceEnabled(n); if (!n) stopAiVoice(); }}
                                            title={voiceEnabled ? 'ปิดเสียงพากย์ญาติ' : 'เปิดเสียงพากย์ญาติ'}
                                            className={`w-9 h-9 rounded-xl border flex items-center justify-center ${
                                                voiceEnabled ? 'bg-aurora-500/20 border-aurora-400/40 text-aurora-200' : 'bg-white/5 border-white/10 text-slate-400'
                                            }`}
                                        >
                                            <Icon name={voiceEnabled ? 'Volume2' : 'Volume1'} size={16} />
                                        </button>

                                            <Icon name="Compass" size={12} />
                                            {difficulty === 'hard'
                                                ? (isEn ? 'Hard Mode Active • Tap for Hint' : 'โหมด Hard (คิดเอง 100%) • แตะเพื่อดูคำใบ้ AI Coach')
                                                : (isEn ? 'Open AI Coach Whisper' : 'เปิด AI Coach ชี้นำหลักการ')}
                                        </button>
                                    </div>
                                )}

                                {vocalFeedback && (
                                    <div className="flex justify-center">
                                        <span className="px-3 py-1 rounded-full bg-prism-500/20 border border-prism-400/40 text-prism-200 text-[11px] font-bold flex items-center gap-1.5">
                                            <Icon name="Activity" size={13} /> {vocalFeedback}
                                        </span>
                                    </div>
                                )}

                                {/* REAL-TIME AI TRIGGER-WORD & PHRASING POLISHER */}
                                {liveTriggerHits.length > 0 && (
                                    <div className="max-w-3xl mx-auto vision-pill rounded-2xl px-3.5 py-2.5 border-amber-400/50 bg-amber-500/10 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                        <div className="text-[11px] sm:text-xs leading-snug">
                                            <span className="font-bold text-amber-300 inline-flex items-center gap-1">
                                                <Icon name="Wand2" size={13} /> AI แนะนำคำถนอมใจ:
                                            </span>{' '}
                                            <span className="text-slate-200">
                                                พบคำว่า <b className="text-rose-300">“{liveTriggerHits[0].matchedWord}”</b> → ลองเปลี่ยนเป็น{' '}
                                                <b className="text-aurora-300">“{liveTriggerHits[0].softer}”</b>
                                            </span>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => handleApplySoftPolish(liveTriggerHits[0])}
                                            className="px-3 py-1.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-void-950 font-display font-extrabold text-[11px] shrink-0"
                                        >
                                            ปรับคำให้นุ่มนวล
                                        </button>
                                    </div>
                                )}

                                {activeDifficulty.showSuggestions && smartSuggestions.length > 0 && (
                                    <div className="flex gap-2 overflow-x-auto custom-scrollbar max-w-3xl mx-auto pb-0.5">
                                        {smartSuggestions.map((sug, idx) => (
                                            <button
                                                key={idx}
                                                type="button"
                                                onClick={() => handleSendMessage(null, sug)}
                                                className="shrink-0 max-w-[82vw] sm:max-w-sm text-left px-3.5 py-2 rounded-xl vision-pill hover:border-aurora-400/50 text-[11px] text-slate-200 line-clamp-2 transition-all"
                                            >
                                                <span className="text-aurora-300 font-bold mr-1">แนวทาง {idx + 1}:</span>
                                                {sug}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                <form onSubmit={handleSendMessage} className="max-w-3xl mx-auto vision-glass rounded-2xl p-2 flex items-center gap-2 border-white/15">
                                    <button
                                        type="button"
                                        onClick={toggleMicrophone}
                                        aria-label="พูดด้วยเสียง"
                                        className={`touch-target w-11 h-11 rounded-xl flex items-center justify-center shrink-0 relative transition-all ${
                                            isListening
                                                ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/40'
                                                : 'bg-white/10 hover:bg-white/15 text-aurora-300 border border-white/10'
                                        }`}
                                    >
                                        <Icon name={isListening ? 'MicOff' : 'Mic'} size={19} />
                                        {isListening && (
                                            <span
                                                className="absolute inset-0 rounded-xl border-2 border-rose-300 pointer-events-none"
                                                style={{ transform: `scale(${1 + micLevel / 220})`, opacity: 0.75 }}
                                            />
                                        )}
                                    </button>

                                    <input
                                        type="text"
                                        value={chatInput}
                                        onChange={e => setChatInput(e.target.value)}
                                        disabled={isAiTyping}
                                        placeholder={
                                            isListening
                                                ? (isEn ? 'Listening & analyzing vocal calmness...' : 'กำลังรับเสียงพูดและวิเคราะห์ความนุ่มนวล...')
                                                : (isEn ? 'Speak via mic or type to the relative...' : 'กดไมค์พูดจริง หรือพิมพ์สื่อสารกับญาติผู้เสียชีวิต...')
                                        }
                                        className="touch-target flex-1 bg-transparent px-2 text-sm text-white placeholder-slate-400 focus:outline-none"
                                    />

                                    <button
                                        type="submit"
                                        disabled={!chatInput.trim() || isAiTyping}
                                        aria-label="ส่งคำพูด"
                                        className="touch-target w-11 h-11 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 hover:from-aurora-300 hover:to-prism-300 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 text-void-950 flex items-center justify-center shrink-0 shadow-md transition-all"
                                    >
                                        <Icon name="Send" size={18} />
                                    </button>
                                </form>
                            </div>
                        </main>
                    )}

                    {/* VIEW 4: EVALUATING */}
                    {phase === 'evaluating' && (
                        <main className="relative z-10 flex-1 flex flex-col items-center justify-center p-6 text-center gap-4">
                            <div className="w-16 h-16 border-4 border-aurora-500/20 border-t-aurora-400 border-r-prism-400 rounded-full animate-spin" />
                            <div>
                                <h2 className="font-display text-xl sm:text-2xl font-extrabold text-white">กำลังสร้างการ์ดสมรรถนะ 5 มิติ & กราฟอารมณ์...</h2>
                                <p className="text-xs sm:text-sm text-slate-400 mt-1">ประมวลผลสมรรถนะ 5 มิติ + การเลือกใช้ถ้อยคำถนอมใจ + จังหวะความเงียบ</p>
                            </div>
                        </main>
                    )}

                    {/* VIEW 5: DEBRIEF (3D SKILL CARD + TIMELINE + TRIGGER POLISHER + DECOMPRESSION) */}
                    {phase === 'debrief' && evalResult && selectedMode && (
                        <main className="relative z-10 flex-1 w-full max-w-6xl mx-auto px-3.5 sm:px-6 py-5 sm:py-8 pb-safe space-y-5">
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                <div className="lg:col-span-5 space-y-4">
                                    <HolographicSkillCard
                                        evalResult={evalResult}
                                        user={user}
                                        isEn={isEn}
                                        onExportPng={() => {
                                            downloadHolographicCardPng(evalResult, user, isEn);
                                            showToast('บันทึกการ์ดสมรรถนะ (PNG) เรียบร้อยแล้วค่ะ');
                                        }}
                                    />

                                    <div className="vision-glass rounded-[1.5rem] p-4 border-aurora-400/35 space-y-3">
                                        <div className="flex items-start gap-2.5">
                                            <div className="w-9 h-9 rounded-xl bg-aurora-500/20 text-aurora-300 flex items-center justify-center shrink-0">
                                                <Icon name="Unlock" size={18} />
                                            </div>
                                            <div>
                                                <p className="font-display font-bold text-sm text-aurora-200">
                                                    ผ่านขั้นที่ 3 และปลดล็อก Post-test แล้วค่ะ
                                                </p>
                                                <p className="text-xs text-slate-300 mt-0.5">
                                                    เคส: {evalResult.personaTitle || activePersona?.titleTH} • โหมด {String(evalResult.difficulty || 'normal').toUpperCase()}
                                                </p>
                                            </div>
                                        </div>
                                        <a
                                            href="./index.html#dashboard"
                                            className="touch-target w-full py-3 rounded-xl bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-display font-extrabold text-sm flex items-center justify-center gap-2"
                                        >
                                            ไปทำ Post-test ตอนนี้เลย <Icon name="ArrowRight" size={16} />
                                        </a>
                                    </div>
                                </div>

                                <div className="lg:col-span-7 space-y-4">
                                    <EmotionalJourneyTimeline
                                        timeline={timeline}
                                        selectedIdx={selectedTimelineIdx}
                                        onSelectIdx={setSelectedTimelineIdx}
                                        onRewindToTurn={handleRewindToTurn}
                                        onPlayMasterVoice={(txt) => speakText(txt, selectedMode)}
                                        isEn={isEn}
                                    />

                                    {/* AI Trigger-Word & Phrasing Polisher Debrief */}
                                    <TriggerWordPolishCard polish={evalResult.languagePolish} isEn={isEn} />

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                        <div className="vision-glass rounded-2xl p-4 space-y-2 border-prism-400/25">
                                            <h4 className="font-display font-bold text-sm text-prism-300 flex items-center gap-1.5">
                                                <Icon name="Stethoscope" size={16} /> ความถูกต้องของข้อมูล ({evalResult.infoScore}/100)
                                            </h4>
                                            <ul className="space-y-1.5 text-xs text-slate-200 leading-relaxed">
                                                {evalResult.infoFeedback.map((f, i) => <li key={i}>• {f}</li>)}
                                            </ul>
                                        </div>
                                        <div className="vision-glass rounded-2xl p-4 space-y-2 border-amber-400/25">
                                            <h4 className="font-display font-bold text-sm text-amber-300 flex items-center gap-1.5">
                                                <Icon name="HeartHandshake" size={16} /> อารมณ์ร่วม & ความเงียบ ({evalResult.empathyScore}/100)
                                            </h4>
                                            <ul className="space-y-1.5 text-xs text-slate-200 leading-relaxed">
                                                {evalResult.empathyFeedback.map((f, i) => <li key={i}>• {f}</li>)}
                                            </ul>
                                        </div>
                                    </div>

                                    {evalResult.aiCoachingNote && (
                                        <div className="vision-glass rounded-2xl p-4 sm:p-5 space-y-2 border-aurora-400/25">
                                            <h4 className="font-display font-bold text-sm text-aurora-300 flex items-center gap-1.5">
                                                <Icon name="Sparkles" size={16} /> บทวิเคราะห์เชิงลึกจาก AI Coach
                                            </h4>
                                            <p className="text-xs sm:text-sm text-slate-200 leading-relaxed whitespace-pre-line">{evalResult.aiCoachingNote}</p>
                                        </div>
                                    )}

                                    {/* Post-Simulation Emotional Decompression Check-in */}
                                    <EmotionalDecompressionCard evalResult={evalResult} user={user} isEn={isEn} />

                                    <div className="flex flex-col sm:flex-row gap-2.5">
                                        <button
                                            type="button"
                                            onClick={() => enterHolodeck(selectedMode, trainingTrack, activePersona, activeDifficulty)}
                                            className="touch-target flex-1 py-3 px-4 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 text-white font-display font-bold text-sm flex items-center justify-center gap-2"
                                        >
                                            <Icon name="RotateCcw" size={16} /> {isEn ? 'Restart Simulation' : 'ฝึกเคสนี้ใหม่อีกครั้ง'}
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => { setSelectedMode(null); setPhase('menu'); }}
                                            className="touch-target flex-1 py-3 px-4 rounded-2xl bg-void-800 hover:bg-void-700 border border-white/10 text-slate-200 font-display font-bold text-sm flex items-center justify-center gap-2"
                                        >
                                            <Icon name="LayoutGrid" size={16} /> {isEn ? 'Switch Persona / Difficulty' : 'เปลี่ยนเคส / ปรับระดับความยาก'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* SLIDE-OVER TRANSCRIPT DRAWER */}
                    {showTranscriptDrawer && (
                        <div className="fixed inset-0 z-[110] bg-slate-950/70 backdrop-blur-sm flex justify-end">
                            <div className="w-full max-w-md h-full vision-glass border-l border-white/15 flex flex-col">
                                <div className="p-4 border-b border-white/10 flex items-center justify-between">
                                    <h3 className="font-display font-bold text-sm text-white flex items-center gap-2">
                                        <Icon name="ScrollText" size={16} className="text-prism-300" />
                                        {isEn ? 'Conversation Transcript' : 'ประวัติบทสนทนาทั้งหมด'}
                                    </h3>
                                    <button type="button" onClick={() => setShowTranscriptDrawer(false)} className="w-8 h-8 rounded-xl bg-white/10 text-slate-200 flex items-center justify-center">
                                        <Icon name="X" size={16} />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
                                    {messages.map(m => (
                                        <div key={m.id} className={`p-3 rounded-2xl text-xs leading-relaxed ${
                                            m.sender === 'system'
                                                ? 'bg-white/5 border border-white/10 text-slate-400'
                                                : m.sender === 'user'
                                                    ? 'bg-aurora-500/15 border border-aurora-400/30 text-aurora-100 ml-6'
                                                    : 'bg-void-800/90 border border-white/10 text-slate-100 mr-6'
                                        }`}>
                                            <p className="font-bold text-[10px] mb-1 opacity-80">{m.title || m.speakerName}</p>
                                            <p className="whitespace-pre-line">{m.text}</p>
                                        </div>
                                    ))}
                                    <div ref={drawerEndRef} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIMEO SCENARIO VIDEO MODAL */}
                    {showVideoModal && (
                        <div className="fixed inset-0 z-[115] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6">
                            <div className="w-full max-w-3xl vision-glass rounded-[1.75rem] p-4 sm:p-6 space-y-3.5">
                                <div className="flex items-center justify-between">
                                    <span className="font-mono text-xs font-bold text-prism-300">SCENARIO VIDEO • VIMEO #{SCENARIO_VIMEO_ID}</span>
                                    <button type="button" onClick={() => setShowVideoModal(false)} className="w-9 h-9 rounded-xl bg-white/10 text-slate-200 flex items-center justify-center">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>
                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-void-950 border border-white/10">
                                    <iframe
                                        src={SCENARIO_VIMEO_EMBED_URL}
                                        className="absolute inset-0 w-full h-full border-0"
                                        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
                                        allowFullScreen
                                        title="Scenario Reference Video"
                                    />
                                </div>
                            </div>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />

                    {/* Collapsible Admin View Badge */}
                    {isAdminPreview && (
                        <div className="fixed top-[calc(4.5rem+env(safe-area-inset-top,0px))] right-3 z-[125] flex flex-col items-end gap-1.5">
                            {previewBarOpen ? (
                                <div className="vision-pill rounded-2xl p-2 flex flex-wrap items-center gap-1.5 text-[11px] font-bold">
                                    <span className="text-aurora-300 font-mono px-1">ADMIN VIEW</span>
                                    <a href="./index.html?admin_preview=dashboard" className="px-2.5 py-1 rounded-lg bg-white/10 text-slate-200">ห้องเรียน</a>
                                    <a href="./index.html?admin_preview=posttest" className="px-2.5 py-1 rounded-lg bg-white/10 text-slate-200">Post-test</a>
                                    <a href="./admin.html" className="px-2.5 py-1 rounded-lg bg-aurora-500 text-void-950">กลับ Admin</a>
                                    <button type="button" onClick={() => setPreviewBarOpen(false)} className="w-6 h-6 rounded-lg bg-white/10 text-slate-200 flex items-center justify-center">
                                        <Icon name="X" size={13} />
                                    </button>
                                </div>
                            ) : (
                                <button type="button" onClick={() => setPreviewBarOpen(true)} className="vision-pill px-3 py-1.5 rounded-full text-aurora-300 text-[10px] font-mono font-bold flex items-center gap-1">
                                    <Icon name="Eye" size={12} /> ADMIN VIEW
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
