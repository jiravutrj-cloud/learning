                                </p>
                                <p className="text-xs text-muted-adaptive">
                                    {isEn ? 'Identifying your Golden Moment and Turning Point coaching tips' : 'กำลังคัดเลือกประโยคทองที่ทำได้ดีและข้อแนะนำเฉพาะบุคคลค่ะ'}
                                </p>
                            </div>
                        </div>
                    )}

                    {/* ==================== PHASE 3: 5-AXIS EMPATHY RADAR DEBRIEF (AI CLINICAL SUPERVISOR) ==================== */}
                    {phase === 'debrief' && evalResult && (
                        <div className="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-5">
                            <div className="spatial-card rounded-[2rem] p-5 sm:p-8 space-y-6 border-aurora-400/40">
                                <div className="flex flex-wrap items-start justify-between gap-3">
                                    <div>
                                        <span className="px-3 py-1 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[11px] font-bold">
                                            {evalResult.source === 'gemini_supervisor'
                                                ? 'AI CLINICAL SUPERVISOR • GEMINI REAL DIALOGUE REVIEW'
                                                : 'AI SKILL LAB COMPLETE • 5-AXIS COMPETENCY CARD'}
                                        </span>
                                        <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive mt-2">
                                            ผลการประเมินทักษะการสื่อสารกับญาติผู้เสียชีวิต
                                        </h1>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive mt-0.5">
                                            {isEn ? activePersona.titleEN : activePersona.titleTH} • {activeDifficulty.badge}
                                        </p>
                                    </div>
                                    <div className="spatial-soft px-5 py-3 rounded-2xl text-center">
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">EMPATHY INDEX</span>
                                        <span className="font-mono text-3xl font-extrabold text-accent-adaptive">{evalResult.score}</span>
                                        <span className="font-mono text-xs text-muted-adaptive"> / 100</span>
                                    </div>
                                </div>

                                {evalResult.supervisorSummary && (
                                    <div className="spatial-soft rounded-2xl p-4 border-prism-400/35 text-xs sm:text-sm text-primary-adaptive leading-relaxed">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive block mb-1">SUPERVISOR OVERVIEW</span>
                                        {evalResult.supervisorSummary}
                                    </div>
                                )}

                                {/* ประโยคทองที่ทำได้ดี (Golden Moment) & จุดพลิกผันที่ควรเกลา (Turning Point Coach) */}
                                {(evalResult.goldenMoment || evalResult.turningPoint) && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {evalResult.goldenMoment && (
                                            <div className="p-4 rounded-2xl bg-aurora-500/10 border border-aurora-400/40 space-y-1.5">
                                                <p className="font-display font-bold text-xs sm:text-sm text-accent-adaptive flex items-center gap-1.5">
                                                    <Icon name="Award" size={16} /> ประโยคทองที่ทำได้ดี (Golden Moment)
                                                </p>
                                                <p className="text-xs sm:text-sm font-bold text-primary-adaptive italic leading-relaxed">
                                                    “{evalResult.goldenMoment.quote}”
                                                </p>
                                                <p className="text-xs text-secondary-adaptive leading-relaxed">{evalResult.goldenMoment.reason}</p>
                                            </div>
                                        )}
                                        {evalResult.turningPoint && (
                                            <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-400/40 space-y-1.5">
                                                <p className="font-display font-bold text-xs sm:text-sm text-amber-400 flex items-center gap-1.5">
                                                    <Icon name="Sparkles" size={16} /> จุดที่เกลาให้นุ่มนวลขึ้นได้ (Turning Point)
                                                </p>
                                                {evalResult.turningPoint.quote && (
                                                    <p className="text-xs text-muted-adaptive line-through">“{evalResult.turningPoint.quote}”</p>
                                                )}
                                                <p className="text-xs sm:text-sm font-bold text-primary-adaptive leading-relaxed">
                                                    คำแนะนำ: “{evalResult.turningPoint.betterPhrase}”
                                                </p>
                                                <p className="text-xs text-secondary-adaptive leading-relaxed">{evalResult.turningPoint.reason}</p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">
                                    <div className="md:col-span-5 spatial-soft rounded-3xl p-4">
                                        <FiveAxisRadarSVG radar={evalResult.radar} theme={theme} />
                                    </div>
                                    <div className="md:col-span-7 space-y-3">
                                        <div className="spatial-soft rounded-2xl p-4 space-y-1.5">
                                            <p className="font-display font-bold text-sm text-accent-adaptive flex items-center gap-1.5">
                                                <Icon name="CheckCircle2" size={16} /> จุดแข็งที่ทำได้ดีมาก
                                            </p>
                                            <ul className="text-xs sm:text-sm text-primary-adaptive space-y-1">
                                                {evalResult.strengths.map((s, i) => <li key={i}>• {s}</li>)}
                                            </ul>
                                        </div>

                                        <div className="spatial-soft rounded-2xl p-4 space-y-1.5">
                                            <p className="font-display font-bold text-sm text-prism-adaptive flex items-center gap-1.5">
                                                <Icon name="Sparkles" size={16} /> ข้อเสนอแนะเพื่อพัฒนาต่อ
                                            </p>
                                            <ul className="text-xs sm:text-sm text-secondary-adaptive space-y-1">
                                                {evalResult.improvements.map((s, i) => <li key={i}>• {s}</li>)}
                                            </ul>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <div className="spatial-soft p-3 rounded-2xl">
                                                <span className="text-muted-adaptive block">เว้นจังหวะเงียบ ≥ 2.5 วิ</span>
                                                <span className="font-mono font-extrabold text-accent-adaptive text-base">{evalResult.silenceCount} ครั้ง</span>
                                            </div>
                                            <div className="spatial-soft p-3 rounded-2xl">
                                                <span className="text-muted-adaptive block">คำกระทบใจที่ตรวจพบ</span>
                                                <span className={`font-mono font-extrabold text-base ${evalResult.triggersFound.length > 0 ? 'text-amber-400' : 'text-accent-adaptive'}`}>
                                                    {evalResult.triggersFound.length} คำ
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* โหมดพักใจ 15 วินาที (Emotional Decompression) */}
                                <div className="spatial-soft rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-prism-400/30">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-11 h-11 rounded-full bg-gradient-to-br from-aurora-400/30 to-prism-400/30 border border-prism-300/50 flex items-center justify-center shrink-0 ${decompressionSec > 0 ? 'breathe-orb' : ''}`}>
                                            <Icon name="Wind" size={20} className="text-prism-adaptive" />
                                        </div>
                                        <div>
                                            <p className="font-display font-bold text-sm text-primary-adaptive">
                                                {decompressionSec > 0
                                                    ? `กำลังหายใจเข้าลึกๆ ช้าๆ... (${decompressionSec} วินาที)`
                                                    : decompressionDone
                                                        ? 'พักใจเรียบร้อยแล้วค่ะ ขอบคุณที่ทุ่มเทดูแลจิตใจครอบครัวผู้ป่วยนะคะ ✓'
                                                        : 'โหมดพักใจ 15 วินาทีหลังเคสสูญเสีย (Emotional Decompression)'}
                                            </p>
                                            <p className="text-xs text-muted-adaptive">ผ่อนคลายความตึงเครียดทางอารมณ์ก่อนกลับไปทำแบบทดสอบ Post-test ค่ะ</p>
                                        </div>
                                    </div>
                                    {decompressionSec === 0 && !decompressionDone && (
                                        <button type="button" onClick={() => setDecompressionSec(15)} className="touch-target spatial-soft px-4 py-2 rounded-xl text-xs font-bold text-prism-adaptive shrink-0">
                                            เริ่มพักใจ 15 วิ
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                    <button
                                        type="button"
                                        onClick={() => setPhase('setup')}
                                        className="touch-target spatial-soft py-3.5 rounded-2xl text-primary-adaptive font-display font-bold text-sm"
                                    >
                                        ฝึกสถานการณ์อื่นเพิ่มเติม
                                    </button>
                                    <a
                                        href="./index.html"
                                        className="rjc2-pill-btn touch-target py-3.5 rounded-2xl font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <span>บันทึกผลแล้ว กลับห้องเรียนเพื่อสอบ Post-test →</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== MODAL: TIME-REWIND HISTORY DRAWER ==================== */}
                    {showHistoryDrawer && (
                        <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="spatial-card w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-5 space-y-4 max-h-[82dvh] flex flex-col">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">TIME-REWIND • CONVERSATION LOG</span>
                                        <h3 className="font-display font-bold text-base text-primary-adaptive">ย้อนเวลาแก้ไขคำพูดในรอบก่อนหน้า</h3>
                                    </div>
                                    <button type="button" onClick={() => setShowHistoryDrawer(false)} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                                    {timeline.length === 0 ? (
                                        <p className="text-center text-xs text-muted-adaptive py-8">ยังไม่มีประวัติรอบสนทนาค่ะ</p>
                                    ) : timeline.map((t, idx) => (
                                        <div key={t.id} className="spatial-soft p-3.5 rounded-2xl space-y-2 text-xs">
                                            <div className="flex items-center justify-between">
                                                <span className="font-mono font-bold text-accent-adaptive">รอบที่ {idx + 1} • Trust {t.trust}%</span>
                                                <button
                                                    type="button"
                                                    onClick={() => handleRewindToTurn(idx)}
                                                    className="px-2.5 py-1 rounded-lg bg-prism-500/20 text-prism-adaptive font-bold text-[11px]"
                                                >
                                                    ↺ ย้อนไปแก้รอบนี้
                                                </button>
                                            </div>
                                            <p className="text-primary-adaptive"><b>คุณ:</b> {t.userText}</p>
                                            <p className="text-secondary-adaptive"><b>ญาติ:</b> {t.aiText}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== MODAL: REFERENCE VIMEO VIDEO ==================== */}
                    {showVimeoModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="spatial-card w-full max-w-3xl rounded-[2rem] p-4 sm:p-5 space-y-3">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">วิดีโอตัวอย่างการสื่อสารกับญาติผู้เสียชีวิต</h3>
                                    <button type="button" onClick={() => setShowVimeoModal(false)} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>
                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-black">
                                    <iframe src={VIMEO_EMBED_URL} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen; picture-in-picture" allowFullScreen title="Skill Lab Reference Video" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Banner */}
                    {toast.visible && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[70] w-[92vw] max-w-md pointer-events-none">
                            <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-xl text-xs sm:text-sm font-bold text-white text-center ${
                                toast.type === 'error' ? 'bg-rose-700/95 border-rose-400/60' : toast.type === 'info' ? 'bg-sky-700/95 border-sky-400/60' : 'bg-emerald-700/95 border-emerald-400/60'
                            }`}>
                                {toast.text}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
