        function mountVolumetricHeartHologram(container, initialState) {
            if (!container) return { update() {}, toggleViewMode() { return 'heart'; }, destroy() {} };

            const canvas = document.createElement('canvas');
            canvas.style.cssText = 'display:block;width:100%;height:100%;';
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            if (!ctx) return { update() {}, toggleViewMode() { return 'heart'; }, destroy() {} };

            const isMobile = window.innerWidth < 640;
            const totalPts = isMobile ? 2100 : 3200;

            // สร้างพิกัดเป้าหมายของ "หัวใจ 3 มิติสมจริง" (เปลือกหัวใจ 3D นูนโค้ง + แกนหัวใจเรืองแสง + วงคลื่นชีพจร)
            const heartPos = new Float32Array(totalPts * 3);

                const ratio = i / totalPts;
                let hx = 0, hy = 0, hz = 0, zone = 0, rimW = 0.5;

                if (ratio < 0.78) {
                    const t = Math.random() * Math.PI * 2;
                    const u = Math.pow(Math.random(), 0.36);
                    const ox = (16 * Math.pow(Math.sin(t), 3)) / 17.2;
                    const oy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17.2;
                    hx = ox * u;
                    hy = oy * u - 0.08;
                    const dome = Math.sqrt(Math.max(0, 1 - u * u));
                    const pinch = 0.72 + 0.28 * Math.exp(-oy * oy * 1.1);
                    const zDepth = dome * 0.48 * pinch;
                    hz = (Math.random() < 0.5 ? 1 : -1) * zDepth + (Math.random() - 0.5) * 0.018;
                    zone = 0;
                    rimW = u;
                } else if (ratio < 0.90) {
                    const t = Math.random() * Math.PI * 2;
                    const u = Math.pow(Math.random(), 0.55) * 0.46;
                    const ox = (16 * Math.pow(Math.sin(t), 3)) / 17.2;
                    const oy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17.2;
                    hx = ox * u;
                    hy = oy * u - 0.08;
                    hz = (Math.random() - 0.5) * 0.24 * (1 - u);
                    zone = 1;
                    rimW = 1.0;
                } else {
                    const ang = Math.random() * Math.PI * 2;
                    const rad = 1.08 + (Math.random() - 0.5) * 0.04;
                    hx = Math.cos(ang) * rad;
                    hy = Math.sin(ang * 2) * 0.09 - 0.04;
                    hz = Math.sin(ang) * rad * 0.62;
                    zone = 2;
                    rimW = 0.85;
                }

                heartPos[i * 3] = hx;
                heartPos[i * 3 + 1] = hy;
                heartPos[i * 3 + 2] = hz;
                heartZone[i] = zone;
                heartRim[i] = rimW;

            let textCache = {};

                oc.textAlign = 'center';
                oc.textBaseline = 'middle';

                oc.font = '700 36px "Inter", "JetBrains Mono", sans-serif';
                oc.fillText(pal.textSub, 360, 186, 600);

                const img = oc.getImageData(0, 0, off.width, off.height).data;
                const sampled = [];
                for (let y = 0; y < off.height; y += 2) {
                    for (let x = 0; x < off.width; x += 2) {
                        if (img[(y * off.width + x) * 4] > 110) sampled.push([x, y]);
                    }
                }

                const pos = new Float32Array(totalPts * 3);
                const subFlag = new Uint8Array(totalPts);
                for (let i = 0; i < totalPts; i++) {
                    const pk = sampled.length > 0 ? sampled[Math.floor(Math.random() * sampled.length)] : [360, 130];
                    pos[i * 3] = ((pk[0] - 360) / 185) + (Math.random() - 0.5) * 0.014;
                    pos[i * 3 + 1] = ((pk[1] - 132) / 185) - 0.06 + (Math.random() - 0.5) * 0.014;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 0.14;
                    subFlag[i] = pk[1] > 152 ? 1 : 0;
                }

                textCache[key] = { pos, subFlag };
                return textCache[key];
            };

            const pts = Array.from({ length: totalPts }, (_, i) => ({
                x: (Math.random() - 0.5) * 3.4,
                y: (Math.random() - 0.5) * 2.6,
                z: (Math.random() - 0.5) * 2.2,
                vx: 0, vy: 0, vz: 0,
                tx: heartPos[i * 3],
                ty: heartPos[i * 3 + 1],
                tz: heartPos[i * 3 + 2],
                zone: heartZone[i],
                rimW: heartRim[i],
                isSubText: 0,
                sz: 0.92 + Math.random() * 0.85,
                seed: Math.random() * Math.PI * 2
            }));

            const motes = Array.from({ length: 48 }, () => ({
                x: (Math.random() - 0.5) * 2.4,
                y: 1.25 - Math.random() * 2.4,
                vy: 0.08 + Math.random() * 0.14,
                r: 0.8 + Math.random() * 1.4,
                sd: Math.random() * 6.28
            }));

            let activeEmotion = PALETTES[st.emotion] ? st.emotion : 'SHOCK';
            let morphBackTimer = null;

            const setTargetsForMode = (nextMode, emoId, burstStrength = 0.14) => {
                viewMode = nextMode;
                activeEmotion = PALETTES[emoId] ? emoId : 'CONFUSED';
                if (typeof st.onViewModeChange === 'function') st.onViewModeChange(viewMode);

                if (viewMode === 'text') {
                    const td = getTextTargets(activeEmotion);
                    for (let i = 0; i < totalPts; i++) {
                        const p = pts[i];
                        p.tx = td.pos[i * 3];
                        p.ty = td.pos[i * 3 + 1];
                        p.tz = td.pos[i * 3 + 2];
                        p.isSubText = td.subFlag[i];
                        p.vx += (Math.random() - 0.5) * burstStrength;
                        p.vy += (Math.random() - 0.5) * burstStrength;
                        p.vz += (Math.random() - 0.5) * burstStrength;
                    }
                    targetRotY = 0;
                    targetRotX = 0;
                } else {
                    for (let i = 0; i < totalPts; i++) {
                        const p = pts[i];
                        p.tx = heartPos[i * 3];
                        p.ty = heartPos[i * 3 + 1];
                        p.tz = heartPos[i * 3 + 2];
                        p.isSubText = 0;
                        p.vx += (Math.random() - 0.5) * burstStrength;
                        p.vy += (Math.random() - 0.5) * burstStrength;
                        p.vz += (Math.random() - 0.5) * burstStrength;
                    }
                }
            };

            let w = Math.max(1, container.clientWidth), h = Math.max(1, container.clientHeight);
            let rotY = 0, rotX = 0.04, targetRotY = 0, targetRotX = 0.04;
            let dragging = false, lx = 0, ly = 0;

            const curCore = PALETTES[activeEmotion].core.slice();
            const curRim = PALETTES[activeEmotion].rim.slice();
            const curDeep = PALETTES[activeEmotion].deep.slice();

            const resize = () => {
                const r = container.getBoundingClientRect();
                if (r.width <= 0 || r.height <= 0) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                w = r.width; h = r.height;
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            };
            resize();

            const onDown = (e) => { dragging = true; lx = e.clientX; ly = e.clientY; };
            const onMove = (e) => {
                if (!dragging) return;
                targetRotY = Math.max(-0.85, Math.min(0.85, targetRotY + (e.clientX - lx) * 0.0055));
                targetRotX = Math.max(-0.32, Math.min(0.32, targetRotX + (e.clientY - ly) * 0.0045));
                lx = e.clientX; ly = e.clientY;
            };
            const onUp = () => { dragging = false; };
            const onTStart = (e) => { if (e.touches?.[0]) { dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; } };
            const onTMove = (e) => {
                if (!dragging || !e.touches?.[0]) return;
                targetRotY = Math.max(-0.85, Math.min(0.85, targetRotY + (e.touches[0].clientX - lx) * 0.0065));
                targetRotX = Math.max(-0.32, Math.min(0.32, targetRotX + (e.touches[0].clientY - ly) * 0.005));
                lx = e.touches[0].clientX; ly = e.touches[0].clientY;
            };

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            canvas.addEventListener('touchstart', onTStart, { passive: true });
            window.addEventListener('touchmove', onTMove, { passive: true });
            window.addEventListener('touchend', onUp);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    textCache = {};
                    if (viewMode === 'text') setTargetsForMode('text', activeEmotion, 0.04);
                }).catch(() => {});
            }

            let alive = true, raf = null, last = performance.now(), smoothAmp = 0, beatPhase = 0;

            const loop = (now) => {
                if (!alive) return;
                raf = requestAnimationFrame(loop);
                if (document.hidden || w <= 0 || h <= 0) return;

                const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
                last = now;
                const t = now * 0.001;

                const pal = PALETTES[activeEmotion] || PALETTES.CONFUSED;
                const kl = 1 - Math.exp(-dt * 4.2);
                for (let c = 0; c < 3; c++) {
                    curCore[c] += (pal.core[c] - curCore[c]) * kl;
                    curRim[c] += (pal.rim[c] - curRim[c]) * kl;
                    curDeep[c] += (pal.deep[c] - curDeep[c]) * kl;
                }

                if (!dragging) {
                    if (viewMode === 'text') {
                        targetRotY = Math.sin(t * 0.45) * 0.09;
                        targetRotX = Math.cos(t * 0.35) * 0.025;
                    } else {
                        targetRotY = Math.sin(t * 0.48) * 0.34;
                        targetRotX = 0.03 + Math.cos(t * 0.36) * 0.045;
                    }
                }
                rotY += (targetRotY - rotY) * (1 - Math.exp(-dt * 5.2));
                rotX += (targetRotX - rotX) * (1 - Math.exp(-dt * 5.2));

                // จังหวะหัวใจเต้น Lub-Dub ปรับความเร็วตามอารมณ์ญาติ
                beatPhase = (beatPhase + dt * pal.bpm) % 1;
                const lub = Math.exp(-Math.pow((beatPhase - 0.14) / 0.055, 2));
                const dub = 0.58 * Math.exp(-Math.pow((beatPhase - 0.30) / 0.065, 2));
                const heartbeat = lub + dub;

                // Real Audio Amplitude (24kHz Voice Pulse)
                let tgtAmp = 0;
                if (st.isSpeaking) {
                    const live = typeof st.getAudioAmplitude === 'function' ? st.getAudioAmplitude() : -1;
                    tgtAmp = (typeof live === 'number' && live >= 0) ? Math.min(1, live) : (0.18 + 0.45 * Math.abs(Math.sin(t * 8.2) * Math.cos(t * 3.5)));
                }
                smoothAmp += (tgtAmp - smoothAmp) * (1 - Math.exp(-dt * (tgtAmp > smoothAmp ? 22 : 14)));

                const cx = w * 0.5;
                const cy = h * (w < 640 ? 0.41 : 0.44);
                const foc = Math.min(w, h) * (w < 640 ? 0.56 : 0.50);

                ctx.clearRect(0, 0, w, h);

                const rr = Math.round(curRim[0]), rg = Math.round(curRim[1]), rb = Math.round(curRim[2]);
                const cr = Math.round(curCore[0]), cg = Math.round(curCore[1]), cb = Math.round(curCore[2]);
                const dr = Math.round(curDeep[0]), dg = Math.round(curDeep[1]), db = Math.round(curDeep[2]);

                // 1. กรวยแสงโฮโลแกรม & แท่นฉายวงแหวน 3 ชั้น
                const baseY = cy + foc * 0.52;
                const beamGrad = ctx.createLinearGradient(cx, baseY + 26, cx, cy - foc * 0.48);
                beamGrad.addColorStop(0, `rgba(${rr},${rg},${rb},0.24)`);
                beamGrad.addColorStop(0.45, `rgba(${rr},${rg},${rb},0.08)`);
                beamGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = beamGrad;
                ctx.beginPath();
                ctx.moveTo(cx - foc * 0.34, baseY + 18);
                ctx.lineTo(cx + foc * 0.34, baseY + 18);
                ctx.lineTo(cx + foc * 0.58, cy - foc * 0.46);
                ctx.lineTo(cx - foc * 0.58, cy - foc * 0.46);
                ctx.closePath();
                ctx.fill();

                const haloR = foc * (0.64 + heartbeat * 0.06 + smoothAmp * 0.09);
                const halo = ctx.createRadialGradient(cx, cy - foc * 0.04, 8, cx, cy - foc * 0.04, haloR);
                halo.addColorStop(0, `rgba(${rr},${rg},${rb},${(0.22 + heartbeat * 0.07 + smoothAmp * 0.08).toFixed(3)})`);
                halo.addColorStop(0.55, `rgba(${dr},${dg},${db},0.08)`);
                halo.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = halo;
                ctx.beginPath(); ctx.arc(cx, cy - foc * 0.04, haloR, 0, Math.PI * 2); ctx.fill();

                for (let ringIdx = 0; ringIdx < 3; ringIdx++) {
                    const rxRing = foc * (0.26 + ringIdx * 0.11);
                    const ryRing = rxRing * 0.22;
                    ctx.save();
                    ctx.translate(cx, baseY + 12 + ringIdx * 4);
                    ctx.strokeStyle = `rgba(${rr},${rg},${rb},${(0.46 - ringIdx * 0.12).toFixed(2)})`;
                    ctx.lineWidth = ringIdx === 0 ? 1.8 : 1.1;
                    ctx.setLineDash(ringIdx === 1 ? [14, 9] : ringIdx === 2 ? [4, 8] : []);
                    ctx.lineDashOffset = (ringIdx % 2 === 0 ? 1 : -1) * t * (18 + ringIdx * 8);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rxRing, ryRing, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 2. อัปเดตและฉายอนุภาค 3 มิติ (หัวใจ 3D ⇄ ข้อความอารมณ์)
                const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
                const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
                const floatY = Math.sin(t * 1.4) * 0.022;
                const scanY = -0.95 + ((t * 0.44) % 2.1);
                const pulseScale = viewMode === 'heart' ? (1 + heartbeat * 0.068 + smoothAmp * 0.075) : (1 + smoothAmp * 0.028);

                ctx.globalCompositeOperation = 'lighter';

                for (let i = 0; i < totalPts; i++) {
                    const p = pts[i];
                    let gx = p.tx * pulseScale;
                    let gy = p.ty * pulseScale + floatY;
                    let gz = p.tz * pulseScale;

                    if (viewMode === 'heart' && p.zone === 2) {
                        const spin = t * 0.55;
                        const cs = Math.cos(spin), sn = Math.sin(spin);
                        const rx = gx * cs - gz * sn;
                        const rz = gz * cs + gx * sn;
                        gx = rx;
                        gz = rz;
                        gy += Math.sin(t * 4.5 + p.seed) * (0.018 + smoothAmp * 0.045);
                    } else if (viewMode === 'text' && smoothAmp > 0.03) {
                        gz += Math.sin(t * 9 + p.seed) * smoothAmp * 0.035;
                    }

                    p.vx = (p.vx + (gx - p.x) * 0.088) * 0.80;
                    p.vy = (p.vy + (gy - p.y) * 0.088) * 0.80;
                    p.vz = (p.vz + (gz - p.z) * 0.088) * 0.80;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.z += p.vz;

                    const x1 = p.x * cosY - p.z * sinY;
                    const z1 = p.z * cosY + p.x * sinY;
                    const y2 = p.y * cosX - z1 * sinX;
                    const z2 = z1 * cosX + p.y * sinX;

                    const depth = 3.15 - z2;
                    if (depth <= 0.45) continue;
                    const persp = foc / depth;
                    const sx = cx + x1 * persp;
                    const sy = cy + y2 * persp;

                    const scanDist = Math.abs(p.y - scanY);
                    const scanBoost = scanDist < 0.09 ? (1 - scanDist / 0.09) * 0.52 : 0;
                    const depthShade = Math.max(0.32, Math.min(1, (z2 + 0.85) / 1.45));

                    let alpha = viewMode === 'text'
                        ? (p.isSubText ? 0.78 : 0.94)
                        : ((p.zone === 1 ? 0.92 : (0.40 + p.rimW * 0.46)) * depthShade + scanBoost + heartbeat * 0.08);
                    alpha = Math.min(0.98, alpha);

                    const rad = Math.max(0.65, p.sz * (persp / 225) * (viewMode === 'text' ? 1.05 : (1 + scanBoost * 0.4 + heartbeat * 0.12)));

                    let rCol, gCol, bCol;
                    if (viewMode === 'text') {
                        if (p.isSubText) { rCol = rr; gCol = rg; bCol = rb; }
                        else { rCol = cr; gCol = cg; bCol = cb; }
                    } else if (p.zone === 1 || scanBoost > 0.25) {
                        rCol = 255; gCol = 255; bCol = 255;
                    } else if (p.rimW > 0.76) {
                        rCol = cr; gCol = cg; bCol = cb;
                    } else {
                        rCol = rr; gCol = rg; bCol = rb;
                    }

                    ctx.fillStyle = `rgba(${rCol},${gCol},${bCol},${alpha.toFixed(3)})`;
                    ctx.beginPath();
                    ctx.arc(sx, sy, rad, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 3. ละอองโฟตอนลอยขึ้นจากฐาน
                for (let m = 0; m < motes.length; m++) {
                    const mt = motes[m];
                    mt.y -= mt.vy * dt;
                    if (mt.y < -1.15) { mt.y = 1.2; mt.x = (Math.random() - 0.5) * 2.2; }
                    const mx = cx + (mt.x + Math.sin(t + mt.sd) * 0.08) * (foc * 0.38);
                    const my = cy + mt.y * (foc * 0.46);
                    const ma = Math.max(0, 0.46 * (1 - Math.abs(mt.y) / 1.25));
                    ctx.fillStyle = `rgba(${cr},${cg},${cb},${ma.toFixed(3)})`;
                    ctx.beginPath(); ctx.arc(mx, my, mt.r, 0, Math.PI * 2); ctx.fill();
                }

                ctx.globalCompositeOperation = 'source-over';
            };

            raf = requestAnimationFrame(loop);

            return {
                update(next) {
                    const prevEmo = activeEmotion;
                    Object.assign(st, next || {});
                    const nextEmo = PALETTES[st.emotion] ? st.emotion : prevEmo;
                    // เมื่ออารมณ์ของญาติเปลี่ยน -> สลับเป็นข้อความอารมณ์ 2.4 วินาที แล้วกลับเป็นหัวใจ 3 มิติ
                    if (nextEmo !== prevEmo) {
                        clearTimeout(morphBackTimer);
                        setTargetsForMode('text', nextEmo, 0.18);
                        morphBackTimer = setTimeout(() => {
                            if (alive) setTargetsForMode('heart', nextEmo, 0.14);
                        }, 2400);
                    }
                },
                toggleViewMode() {
                    clearTimeout(morphBackTimer);
                    const nm = viewMode === 'heart' ? 'text' : 'heart';
                    setTargetsForMode(nm, activeEmotion, 0.14);
                    return nm;
                },
                destroy() {
                    alive = false;
                    clearTimeout(morphBackTimer);
                    if (raf) cancelAnimationFrame(raf);
                    canvas.removeEventListener('mousedown', onDown);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    canvas.removeEventListener('touchstart', onTStart);
                    window.removeEventListener('touchmove', onTMove);
                    window.removeEventListener('touchend', onUp);
                    window.removeEventListener('resize', resize);
                    try { if (canvas.parentNode) canvas.parentNode.removeChild(canvas); } catch (_) {}
                }
            };
        }

        function FiveAxisRadarSVG({ radarArr, theme }) {
            const isDark = theme === 'dark';
            const w = 320, h = 255, cx = w / 2, cy = h / 2, maxR = 72;
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / RADAR_AXES.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const valOf = (key) => {
                const f = (radarArr || []).find(r => r.key === key);
                return Math.max(0, Math.min(100, Number(f?.value || 0)));
            };
            const dataPts = RADAR_AXES.map((a, i) => pt(i, valOf(a.key) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[330px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.48" />
                            <stop offset="100%" stopColor="#f9a8d4" stopOpacity="0.26" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={RADAR_AXES.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {RADAR_AXES.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.20)' : 'rgba(15,58,125,0.14)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.8" fill="#f9a8d4" stroke={isDark ? '#030611' : '#ffffff'} strokeWidth="1.5" />
                    ))}
                    {RADAR_AXES.map((a, i) => {
                        const [lx, ly] = pt(i, 1.38);
                        return (
                            <g key={a.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.5" fontWeight="700">{a.shortTH}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10.5" fontFamily="JetBrains Mono, monospace" fontWeight="700">{valOf(a.key)}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

                    an.getByteTimeDomainData(buf);
                    let sum = 0;
                    for (let i = 0; i < buf.length; i++) { const n = (buf[i] - 128) / 128; sum += n * n; }
                    const rms = Math.sqrt(sum / buf.length);
                    return rms < 0.012 ? 0 : Math.min(1, (rms - 0.012) * 7.2);
                } catch (_) { return -1; }
            }, []);

            const ensureSharedAudioWithAnalyser = useCallback(() => {
                if (!sharedAudioRef.current) {
                    const a = new Audio();
                    a.playsInline = true;
                    a.setAttribute('playsinline', '');
                    a.crossOrigin = 'anonymous';
                    sharedAudioRef.current = a;
                }
                if (!analyserRef.current) {
                    try {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (AC) {
                            const ctx = new AC();
                            const src = ctx.createMediaElementSource(sharedAudioRef.current);
                            const an = ctx.createAnalyser();
                            an.fftSize = 256;
                            src.connect(an);
                            an.connect(ctx.destination);
                            audioCtxRef.current = ctx;
                            analyserRef.current = an;
                            ampBufRef.current = new Uint8Array(an.fftSize);
                        }
                    } catch (_) {}
                }
                if (audioCtxRef.current?.state === 'suspended') audioCtxRef.current.resume().catch(() => {});
                return sharedAudioRef.current;
            }, []);

            const stopStudioVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (sharedAudioRef.current) {
                    try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {}
                }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                setVoicePhase('idle');
            }, []);
            useEffect(() => () => stopStudioVoice(), [stopStudioVoice]);

            // เสียง AI สตูดิโอ 24kHz เท่านั้น (ผ่าน learning-core.js -> Code.gs Gemini TTS)
            const playStudioSpeech = useCallback(async (text) => {
                stopStudioVoice();
                const sid = voiceSessionRef.current;
                setLatestCaption(text);
                setVoicePhase('loading');
                try {
                    const a = ensureSharedAudioWithAnalyser();
                    let blob = null;
                    if (typeof CORE.fetchStudioGuideBlob === 'function') {
                        blob = await CORE.fetchStudioGuideBlob(text, appsScriptUrl, 'Sulafat');
                    } else if (appsScriptUrl && navigator.onLine) {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'callGeminiTTS', text, voiceName: 'Sulafat' })
                        });
                        const data = await res.json();
                        const b64 = data.audioBase64 || data.audio || data.inlineData?.data;
                        if (b64) blob = pcm16FallbackBlob(b64, 24000);
                    }
                    if (voiceSessionRef.current !== sid) return;
                    if (!blob || blob.size <= 44) { setVoicePhase('idle'); return; }

                    setVoicePhase('speaking');
                    const url = URL.createObjectURL(blob);
                    audioUrlRef.current = url;
                    await new Promise(resolve => {
                        a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });
                    if (voiceSessionRef.current === sid) setVoicePhase('idle');
                } catch (_) {
                    if (voiceSessionRef.current === sid) setVoicePhase('idle');
                }
            }, [stopStudioVoice, ensureSharedAudioWithAnalyser, appsScriptUrl]);

            // Mount & Sync 3D Volumetric Heart Hologram
            useEffect(() => {
                if (phase !== 'negotiating' || !stageContainerRef.current) return;
                const ctrl = mountVolumetricHeartHologram(stageContainerRef.current, {
                    emotion: currentEmotion,
                    trust: trustScore,
                    isSpeaking: voicePhase === 'speaking',
                    step: stepIdx + 1,
                    getAudioAmplitude: getLiveAudioAmplitude,
                    onViewModeChange: (m) => setHoloViewMode(m)
                });
                holoCtrlRef.current = ctrl;
                return () => { ctrl.destroy(); holoCtrlRef.current = null; };
            }, [phase]);

            useEffect(() => {
                if (!holoCtrlRef.current) return;
                holoCtrlRef.current.update({
                    emotion: currentEmotion,
                    trust: trustScore,
                    isSpeaking: voicePhase === 'speaking',
                    step: stepIdx + 1,
                    getAudioAmplitude: getLiveAudioAmplitude
                });
            }, [currentEmotion, trustScore, voicePhase, stepIdx, getLiveAudioAmplitude]);

            // ============================================================================
            // 7. 10-STEP CONSULTATION, SILENCE 2.5s, MIC, STEP-10 FREE DECISION & CLOUD SAVE
            // ============================================================================
            const handleStartConsultation = () => {
                stopStudioVoice();
                const s0 = TEN_STEPS[0];
                setStepIdx(0);
                setMatchedStepIds([]);
                setMessages([{ role: 'ai', step: 1, text: s0.relativeLineTH, emotion: s0.emotion, at: Date.now() }]);
                setCurrentEmotion(s0.emotion);
                setTrustScore(difficultyId === 'hard' ? 36 : 46);
                setSilenceCount(0);
                setSilenceTimer(0);
                setTriggerTotal(0);
                setFinalDecision(null);
                setHintBanner('');
                setInputText('');
                setLearnerVoiceClips([]);
                setHoloViewMode('heart');
                setPhase('negotiating');
                setTimeout(() => playStudioSpeech(s0.relativeLineTH), 320);
            };

            const handleTherapeuticSilence = () => {
                if (silenceTimer > 0) return;
                setSilenceTimer(3);
                const iv = setInterval(() => {
                    setSilenceTimer(prev => {
                        if (prev <= 1) {
                            clearInterval(iv);

                            setTrustScore(t => Math.min(100, t + 6));
                            showToast('✓ เว้นความเงียบเยียวยา 2.5 วินาทีสำเร็จ! ญาติรู้สึกปลอดภัยและเปิดใจมากขึ้นค่ะ');
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 850);
            };

            const handleToggleMic = async () => {
                if (isRecordingMic) {
                    setIsRecordingMic(false);
                    if (speechRecRef.current) { try { speechRecRef.current.stop(); } catch (_) {} }
                    if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') { try { mediaRecRef.current.stop(); } catch (_) {} }
                    return;
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

                    showToast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง สามารถพิมพ์ข้อความโต้ตอบได้ทันทีค่ะ', 'info');
                    return;
                }
                try {

            const handleSendMessage = async (e, overrideText = null) => {

                }

                const hitKeywords = (stepObj.keywords || []).filter(k => lowTxt.includes(k.toLowerCase()));
                const isStepMatched = hitTriggers.length === 0 && (hitKeywords.length >= 1 || txt.length >= 38);
                const nextMatched = isStepMatched && !matchedStepIds.includes(stepObj.step)

                if (stepIdx >= TEN_STEPS.length - 1) {

                    const declineThreshold = difficultyId === 'hard' ? 52 : 44;

                    if (appsScriptUrl && navigator.onLine) {

                            const convo = nextMessages.slice(-8).map(m => `${m.role === 'user' ? 'พยาบาล' : 'คุณแพรว'}: ${m.text}`).join('\n');
                            const rawRes = await fetch(appsScriptUrl, {
                                method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({
                                    action: 'callGemini',
                                    prompt: `บทบาท: ${OFFICIAL_CASE.relativeName}\nผลการตัดสินใจอิสระในสเต็ปที่ 10: ${chosenOutcome.badgeTH}\nประวัติบทสนทนา:\n${convo}\n\nโปรดกล่าวคำตัดสินใจสุดท้าย 2-3 ประโยคภาษาไทยอย่างสมจริงตามอารมณ์และความไว้วางใจ (${nextTrust}/100) ไม่ใช้ Markdown`,
                                    systemInstruction: `${CLINICAL_AI_PREFIX}\nตอบในบทบาทญาติผู้ป่วยสมองตายอย่างสมจริง อ่อนโยน และเคารพเหตุผลตามบริบทจริง`
                                }),
                                signal: ctrl.signal
                            });
                            clearTimeout(tm);
                            const d = JSON.parse((await rawRes.text()) || '{}');
                            if (d?.status === 'success' && d.text) finalSpeech = String(d.text).replace(/[*#]/g, '').trim();
                        } catch (_) {}
                    }

                    setCurrentEmotion(chosenOutcome.emotion);
                    setFinalDecision({ ...chosenOutcome, speechTH: finalSpeech });
                    setMessages(prev => [...prev, { role: 'ai', step: 10, text: finalSpeech, emotion: chosenOutcome.emotion, at: Date.now() }]);
                    setIsAiThinking(false);
                    playStudioSpeech(finalSpeech);
                    return;
                }

                // สเต็ปที่ 1..9 -> เดินหน้าไปสเต็ปถัดไปพร้อมปฏิกิริยาอารมณ์ที่สอดคล้อง
                const nextIdx = stepIdx + 1;
                const nextStepObj = TEN_STEPS[nextIdx];
                let aiReply = nextStepObj.relativeLineTH;

                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();

                        const convo = nextMessages.slice(-6).map(m => `${m.role === 'user' ? 'พยาบาล' : 'คุณแพรว'}: ${m.text}`).join('\n');
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `บทบาท: ${OFFICIAL_CASE.relativeName} (ระดับความยาก: ${difficultyId === 'hard' ? 'Hard เข้มข้นสมจริง' : 'Normal'})\nสเต็ปถัดไป (${nextStepObj.step}/10): ${nextStepObj.titleTH}\nประเด็นที่ญาติจะถาม/สะท้อนต่อ: ${nextStepObj.relativeLineTH}\nประวัติสนทนา:\n${convo}\n\nโปรดตอบรับคำพูดของพยาบาลและเชื่อมเข้าสู่ประเด็นสเต็ปที่ ${nextStepObj.step} ความยาว 2-3 ประโยคภาษาไทยเป็นธรรมชาติ ขึ้นต้นด้วย [EMOTION:SHOCK|CONFUSED|SAD|ANGRY|HESITANT|CALM] ไม่ใช้ Markdown`,
                                systemInstruction: `${CLINICAL_AI_PREFIX}\nแสดงบทบาทญาติผู้เสียชีวิตสมองตายตามสื่อการสอน รพ.ราชวิถีอย่างสมจริง`
                            }),

                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) {
                            const clean = String(d.text).replace(/[*#]/g, '').trim();
                            const em = clean.match(/\[EMOTION:(SHOCK|CONFUSED|SAD|ANGRY|HESITANT|CALM)\]/i);

                        }

                setStepIdx(nextIdx);
                setCurrentEmotion(nextEmo);
                setMessages(prev => [...prev, { role: 'ai', step: nextStepObj.step, text: aiReply, emotion: nextEmo, at: Date.now() }]);
                setIsAiThinking(false);
                playStudioSpeech(aiReply);
            };

            const handleOpenDebriefResult = () => {
                stopStudioVoice();
                const userMsgs = messages.filter(m => m.role === 'user');
                const coverageRatio = matchedStepIds.length / TEN_STEPS.length;
                const rawScore = Math.round(
                    45 +
                    coverageRatio * 38 +
                    Math.min(10, silenceCount * 4) +
                    (finalDecision?.code === 'CONSENT' ? 7 : finalDecision?.code === 'THINKING' ? 3 : 0) -
                    triggerTotal * 10
                );
                const finalScore = Math.max(48, Math.min(99, rawScore));

                const radar = RADAR_AXES.map((a, idx) => ({
                    key: a.key,
                    labelTH: a.labelTH,
                    value: Math.max(48, Math.min(99, finalScore + (idx % 2 === 0 ? 3 : -2)))
                }));

                const longestMsg = userMsgs.slice().sort((a, b) => b.text.length - a.text.length)[0];
                const missedStep = TEN_STEPS.find(s => !matchedStepIds.includes(s.step));

                setEvalResult({

                            : `ท่านได้ฝึกครบทั้ง 10 สเต็ปแล้วค่ะ แม้ครอบครัวตัดสินใจไม่ยินยอม แต่การเคารพการตัดสินใจและลดถ้อยคำที่กระทบจิตใจคือหัวใจสำคัญของการพัฒนาทักษะค่ะ`,
                    goldenMoment: longestMsg ? `“${longestMsg.text.slice(0, 150)}”` : 'สื่อสารด้วยความตั้งใจและรับฟังครอบครัวจนจบครบทั้ง 10 สเต็ป',

                });

            const handleDownloadDebriefPng = () => {

                }

            const handleSaveAndGoPosttest = async () => {
                stopStudioVoice();
                const preAvg = Number(((preEff.e1 + preEff.e2 + preEff.e3) / 3).toFixed(2));
                const postAvg = Number(((postEff.e1 + postEff.e2 + postEff.e3) / 3).toFixed(2));
                const score = Number(evalResult?.score || 80);
                const prevHist = Array.isArray(user?.skillLabHistory) ? user.skillLabHistory : [];
                const newEntry = {
                    at: new Date().toISOString(),
                    caseId: OFFICIAL_CASE.id,
                    difficultyId,
                    score,
                    decisionCode: evalResult?.decision?.code || 'THINKING',
                    matchedSteps: matchedStepIds.length,
                    silenceCount,
                    triggerTotal,
                    radar: evalResult?.radar || [],
                    preSelfEfficacyAvg: preAvg,
                    postSelfEfficacyAvg: postAvg
                };
                const nextUser = {
                    ...user,
                    skillLabPassed: true,
                    skillLabBestScore: Math.max(Number(user?.skillLabBestScore || 0), score),
                    preSelfEfficacyAvg: preAvg,
                    postSelfEfficacyAvg: postAvg,
                    skillLabHistory: [...prevHist, newEntry].slice(-15)
                };
                setUser(nextUser);
                saveLearnerSessionSafe(nextUser);

                if (fbDb && nextUser?.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)), nextUser, { merge: true });

                                        <span>💡 {hintBanner}</span>
                                        <button type="button" onClick={() => setHintBanner('')} className="text-white/60 hover:text-white font-bold">✕</button>
                                    </div>
                                )}

                                {/* STEP 10 FINAL INDEPENDENT DECISION BANNER */}
                                {finalDecision ? (
                                    <div className="stage-hud-glass rounded-[1.75rem] p-4 sm:p-5 space-y-3 border-pink-300/55 pointer-events-auto text-center">
                                        <div className="flex justify-center">
                                            <span className={`px-4 py-1.5 rounded-full border font-display font-extrabold text-xs sm:text-sm ${finalDecision.colorClass}`}>
                                                {finalDecision.badgeTH}
                                            </span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-sky-100 leading-relaxed max-w-2xl mx-auto">
                                            ครบทั้ง 10 สเต็ปเรียบร้อยแล้วค่ะ ญาติได้ตัดสินใจด้วยตนเองอย่างอิสระแล้ว เชิญรับชมรายงานการประเมินผล 5 แกนสมรรถนะค่ะ
                                        </p>
                                        <button type="button" onClick={handleOpenDebriefResult} className="btn-peach-ambient touch-target px-7 py-3 font-display font-extrabold text-sm">
                                            ดูรายงานประเมินผล 5 แกน &amp; สรุปผลการตัดสินใจ →
                                        </button>
                                    </div>
                                ) : (
                                    <div className="stage-hud-glass rounded-[1.5rem] p-3 sm:p-3.5 space-y-2.5 pointer-events-auto">
                                        {difficultyId === 'normal' && (
                                            <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                                                {currentStepObj.quickReplies.map((qr, qi) => (
                                                    <button key={qi} type="button" disabled={isAiThinking} onClick={() => handleSendMessage(null, qr)} className="shrink-0 px-3 py-1.5 rounded-xl bg-white/[0.08] hover:bg-white/[0.16] border border-pink-200/25 text-[11px] text-sky-100 text-left max-w-[290px] truncate">
                                                        ✦ {qr}
                                                    </button>
                                                ))}
                                            </div>
                                        )}

                                        <form onSubmit={handleSendMessage} className="flex items-center gap-2">
                                            <button type="button" onClick={handleTherapeuticSilence} disabled={silenceTimer > 0} className="touch-target px-3 rounded-xl bg-white/[0.08] border border-emerald-300/35 text-emerald-200 text-xs font-bold shrink-0" title="เว้นความเงียบเยียวยา 2.5 วินาที">
                                                {silenceTimer > 0 ? `⏳ ${silenceTimer}s` : '🤫 เงียบ 2.5s'}
                                            </button>
                                            <button type="button" onClick={handleToggleMic} className={`touch-target w-11 rounded-xl border flex items-center justify-center shrink-0 ${isRecordingMic ? 'bg-rose-600 border-rose-300 text-white animate-pulse' : 'bg-white/[0.08] border-sky-200/25 text-sky-100'}`} title="พูดผ่านไมโครโฟน">
                                                <Icon name={isRecordingMic ? 'MicOff' : 'Mic'} size={18} />
                                            </button>
                                            <input
                                                type="text"
                                                value={inputText}
                                                onChange={e => setInputText(e.target.value)}
                                                disabled={isAiThinking}
                                                placeholder={stepIdx === 9 ? 'สเต็ปที่ 10: เปิดพื้นที่ให้ญาติตัดสินใจเองอย่างอิสระ...' : `สเต็ปที่ ${stepIdx + 1}/10: พิมพ์หรือกดไมค์เพื่อสื่อสาร...`}
                                                className="touch-target flex-1 px-3.5 py-2 rounded-xl text-sm bg-white/[0.09] border border-sky-200/25 text-white placeholder:text-slate-400 focus:outline-none focus:border-pink-300"
                                            />
                                            <button type="submit" disabled={!inputText.trim() || isAiThinking} className="btn-peach-ambient touch-target px-4 sm:px-5 rounded-xl font-display font-extrabold text-xs sm:text-sm shrink-0">
                                                {isAiThinking ? '...' : 'ส่ง →'}
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>

                            {/* Chat History Modal */}
                            {showHistoryModal && (
                                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                                    <div className="stage-hud-glass w-full max-w-lg max-h-[80vh] rounded-[1.75rem] p-5 flex flex-col gap-3">
                                        <div className="flex items-center justify-between border-b border-white/15 pb-2.5">
                                            <h3 className="font-display font-bold text-base">ประวัติบทสนทนา 10 สเต็ป ({messages.length})</h3>
                                            <button type="button" onClick={() => setShowHistoryModal(false)} className="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center">✕</button>
                                        </div>
                                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 text-xs pr-1">
                                            {messages.map((m, i) => (
                                                <div key={i} className={`p-3 rounded-2xl ${m.role === 'user' ? 'bg-emerald-500/20 border border-emerald-400/35 ml-6' : 'bg-white/10 border border-white/15 mr-6'}`}>
                                                    <span className="font-mono text-[10px] font-bold block mb-1 text-pink-300">
                                                        STEP {m.step || '-'} • {m.role === 'user' ? 'ท่าน (ทีมประสานงาน)' : OFFICIAL_CASE.relativeName}
                                                    </span>
                                                    <p className="leading-relaxed text-slate-100">{m.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ==================== PHASE 4: 5-AXIS DEBRIEF REPORT & AUTO-STEP TO POSTTEST ==================== */}
                    {phase === 'result' && evalResult && (
                        <main className="relative z-10 max-w-5xl w-full mx-auto px-3.5 sm:px-6 py-6 sm:py-8 space-y-4 flex-1">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-pink-300 uppercase">RAJAVITHI 10-STEP AI SUPERVISOR DEBRIEF</span>
                                    <h1 className="font-display font-extrabold text-xl sm:text-2xl text-primary-adaptive">{OFFICIAL_CASE.titleTH}</h1>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className={`px-3 py-1 rounded-full border font-display font-bold text-xs ${evalResult.decision?.colorClass || ''}`}>
                                        {evalResult.decision?.badgeTH}
                                    </span>
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                </div>
                            </div>

                            <section className="grid grid-cols-1 md:grid-cols-12 gap-4 items-stretch">
                                <div className="md:col-span-5 spatial-card rounded-[1.75rem] p-5 sm:p-6 flex flex-col justify-between gap-4 border-aurora-400/40">
                                    <div>
                                        <p className="text-[11px] text-muted-adaptive font-mono uppercase">CLINICAL COMMUNICATION SCORE ({difficultyId.toUpperCase()})</p>
                                        <div className="flex items-baseline gap-2 mt-2">
                                            <span className="font-mono text-5xl sm:text-6xl font-extrabold text-accent-adaptive">{evalResult.score}</span>
                                            <span className="font-mono text-xl text-muted-adaptive">/100</span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive leading-relaxed mt-3">{evalResult.summary}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div className="spatial-soft rounded-xl p-2.5">
                                            <span className="font-mono text-[9.5px] text-muted-adaptive block">ความเงียบ 2.5 วิ</span>
                                            <span className="font-mono font-bold text-prism-adaptive">{silenceCount} ครั้ง</span>
                                        </div>
                                        <div className="spatial-soft rounded-xl p-2.5">
                                            <span className="font-mono text-[9.5px] text-muted-adaptive block">ความครอบคลุม</span>
                                            <span className="font-mono font-bold text-accent-adaptive">{matchedStepIds.length}/10 สเต็ป</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="md:col-span-7 spatial-card rounded-[1.75rem] p-4 sm:p-5 flex flex-col justify-center">
                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase mb-1">5-AXIS CLINICAL COMPETENCY RADAR</span>
                                    <FiveAxisRadarSVG radarArr={evalResult.radar} theme={theme} />
                                </div>

                                <div className="md:col-span-6 spatial-card rounded-[1.75rem] p-5 bg-aurora-500/10 border-aurora-400/40 space-y-1.5 text-xs">
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">★ ประโยคทองที่ทำได้ดีเยี่ยม (GOLDEN MOMENT)</span>
                                    <p className="text-primary-adaptive text-sm leading-relaxed">{evalResult.goldenMoment}</p>
                                </div>
                                <div className="md:col-span-6 spatial-card rounded-[1.75rem] p-5 bg-prism-500/10 border-prism-400/40 space-y-1.5 text-xs">
                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">✦ ข้อเสนอแนะเพิ่มเติม (TURNING POINT)</span>
                                    <p className="text-primary-adaptive text-sm leading-relaxed">{evalResult.turningPoint}</p>
                                </div>

                                <div className="md:col-span-12 spatial-card rounded-[1.75rem] p-5 space-y-4">
                                    {learnerVoiceClips.length > 0 && (
                                        <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">🎙️ ฟังเสียงตัวเองย้อนหลัง (เก็บเฉพาะใน RAM • PDPA 100%)</span>
                                            <div className="flex flex-wrap gap-2">
                                                {learnerVoiceClips.map((c, ci) => c.audioUrl && (
                                                    <div key={ci} className="spatial-soft px-3 py-2 rounded-xl flex items-center gap-2">
                                                        <span className="font-mono font-bold text-accent-adaptive">รอบ {ci + 1} ({c.durationSec}s)</span>
                                                        <audio controls src={c.audioUrl} className="h-7 max-w-[180px]" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                        <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">POST-PRACTICE SELF-EFFICACY (ประเมินความมั่นใจหลังฝึก • R2R)</span>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                                            {SELF_EFFICACY_ITEMS.map(it => (
                                                <div key={it.key} className="space-y-1">
                                                    <p className="text-secondary-adaptive">{it.labelTH}</p>
                                                    <div className="flex gap-1">
                                                        {[1, 2, 3, 4, 5].map(n => (
                                                            <button key={n} type="button" onClick={() => setPostEff(p => ({ ...p, [it.key]: n }))} className={`flex-1 py-1 rounded-lg font-mono font-bold ${postEff[it.key] === n ? 'bg-amber-400 text-void-950' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
                                        <button type="button" onClick={handleDownloadDebriefPng} className="spatial-soft touch-target py-3.5 px-4 rounded-full font-display font-bold text-xs sm:text-sm text-prism-adaptive inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Download" size={15} /> บันทึกใบสรุปผล (PNG)
                                        </button>
                                        <button type="button" onClick={() => { stopStudioVoice(); setPhase('lobby'); }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-primary-adaptive">
                                            ← ฝึกใหม่ (เปลี่ยน Normal / Hard)
                                        </button>
                                        <button type="button" onClick={handleSaveAndGoPosttest} className="btn-peach-ambient touch-target py-3.5 rounded-full font-display font-extrabold text-xs sm:text-sm">
                                            บันทึกผล &amp; ไปทำ Post-test ต่อทันที →
                                        </button>
                                    </div>
                                </div>
                            </section>
                        </main>
                    )}

                    <VideoReferenceModal open={showVideoModal} onClose={() => setShowVideoModal(false)} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('skilllab-root'));
        root.render(<SkillLabErrorBoundary><SkillLabApp /></SkillLabErrorBoundary>);
    </script>

    <!-- @babel/standalone พร้อม CDN สำรอง (cdnjs) ป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
