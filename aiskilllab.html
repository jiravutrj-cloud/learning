                                            className="touch-target flex-1 min-w-0 px-3.5 py-2.5 rounded-2xl bg-white/[0.08] border border-white/15 text-white placeholder-sky-200/55 text-sm focus:outline-none focus:border-cyan-400"
                                        />
                                        <button type="submit" disabled={!userInput.trim() || isThinking || Boolean(latestDrillFeedback)} aria-label="ส่งข้อความ" className="touch-target w-11 h-11 rounded-2xl rjc2-pill-btn disabled:opacity-35 flex items-center justify-center shrink-0">
                                            <Icon name="Send" size={17} />
                                        </button>
                                    </form>

                                    <div className="flex flex-wrap items-center justify-between gap-2 px-1 text-[11px] text-sky-200/85">
                                        <label className="inline-flex items-center gap-1.5 cursor-pointer">
                                            <input type="checkbox" checked={autoSendVoice} onChange={e => setAutoSendVoice(e.target.checked)} className="accent-emerald-400" />
                                            <span>พูดจบส่งอัตโนมัติ</span>
                                        </label>
                                        <button type="button" onClick={() => setShowTranscriptModal(true)} className="font-bold text-sky-200 hover:text-white inline-flex items-center gap-1">
                                            <Icon name="History" size={13} /> ดูประวัติสนทนา
                                        </button>
                                        <button type="button" disabled={!latestRelativeMsg} onClick={() => latestRelativeMsg && speakRelativeSegments(latestRelativeMsg.text, latestRelativeMsg.emotion || currentEmotion, personaId)} className="font-bold text-cyan-300 hover:text-white inline-flex items-center gap-1 disabled:opacity-40">
                                            <Icon name="RotateCcw" size={13} /> ฟังเสียงญาติซ้ำ
                                        </button>
                                    </div>
                                </div>
                            </section>
                        </div>
                    )}

                    {/* ==================== PHASE 4A: EVALUATING ==================== */}
                    {phase === 'evaluating' && (
                        <div className="relative z-10 flex-1 flex items-center justify-center p-4">
                            <div className="spatial-card max-w-md w-full rounded-[2rem] overflow-hidden text-center p-7 space-y-4">
                                <div className="w-12 h-12 border-4 border-aurora-400 border-t-transparent rounded-full animate-spin mx-auto" />
                                <h2 className="font-display font-extrabold text-lg text-primary-adaptive">AI Clinical Supervisor กำลังประเมินผล 5 แกน...</h2>
                                <p className="text-xs text-secondary-adaptive">กำลังวิเคราะห์ประโยคทอง จุดที่ควรเกลา ความเงียบ 2.5 วิ และน้ำเสียงของคุณ</p>
                                <button
                                    type="button"
                                    onClick={() => {
                                        const fb = SL.evaluateConversationFallback({ messages, barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal, finalTrust: trustScore });
                                        setEvalResult(fb); setPhase('result'); persistSkillLabSession(fb, messages, null);
                                    }}
                                    className="spatial-soft px-4 py-2 rounded-full text-xs font-bold text-prism-adaptive"
                                >
                                    แสดงผลสรุปทันที
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ==================== PHASE 4B: RESULT + 5-AXIS RADAR + POST R2R ==================== */}
                    {phase === 'result' && evalResult && (
                        <div className="relative z-10 max-w-4xl w-full mx-auto px-4 py-6 space-y-5 pb-12">
                            <header className="spatial-card rounded-[1.75rem] p-5 flex flex-wrap items-center justify-between gap-3">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">AI CLINICAL SUPERVISOR REPORT • 5-AXIS RADAR</span>
                                    <h1 className="font-display font-extrabold text-xl sm:text-2xl text-primary-adaptive">
                                        คะแนนสมรรถนะการสื่อสาร: <span className="text-accent-adaptive font-mono">{evalResult.score}/100</span>
                                    </h1>
                                    <p className="text-xs text-secondary-adaptive mt-0.5">{evalResult.summary}</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    {phaseVoiceGuide && (
                                        <StepVoiceButton activeKey={guideVoiceState.activeKey} targetKey={phaseVoiceGuide.key} status={guideVoiceState.status} onToggle={handleReplayPhaseGuide} />
                                    )}
                                    <span className="px-3.5 py-1.5 rounded-full bg-aurora-500/20 border border-aurora-400/45 text-accent-adaptive font-display font-extrabold text-xs">
                                        ผ่านภารกิจ AI Skill Lab ✓
                                    </span>
                                </div>
                            </header>

                            <div className="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
                                <div className="md:col-span-5 spatial-card rounded-[1.75rem] p-5 space-y-3">
                                    <FiveAxisRadarSVG radarArr={evalResult.radar} theme={theme} />
                                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                                        <div className="spatial-soft p-2.5 rounded-xl"><span className="text-[10px] text-muted-adaptive block">Trust</span><span className="font-mono font-extrabold text-accent-adaptive">{trustScore}%</span></div>
                                        <div className="spatial-soft p-2.5 rounded-xl"><span className="text-[10px] text-muted-adaptive block">ความเงียบ 2.5 วิ</span><span className="font-mono font-extrabold text-prism-adaptive">{silenceCount} ครั้ง</span></div>
                                        <div className="spatial-soft p-2.5 rounded-xl"><span className="text-[10px] text-muted-adaptive block">คำกระทบใจ</span><span className={`font-mono font-extrabold ${triggerTotal === 0 ? 'text-accent-adaptive' : 'text-rose-400'}`}>{triggerTotal}</span></div>
                                    </div>
                                </div>

                                <div className="md:col-span-7 space-y-4">
                                    <div className="spatial-card rounded-[1.75rem] p-5 space-y-3 text-xs sm:text-sm">
                                        <div className="p-3.5 rounded-2xl bg-emerald-500/15 border border-emerald-400/40 space-y-1">
                                            <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">✨ GOLDEN MOMENT (ประโยคทองที่ทำได้ดี)</p>
                                            <p className="text-primary-adaptive leading-relaxed">{evalResult.goldenMoment}</p>
                                        </div>
                                        <div className="p-3.5 rounded-2xl bg-amber-500/15 border border-amber-400/40 space-y-1">
                                            <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">🎯 TURNING POINT COACH (จุดที่ควรเกลาให้ละมุนขึ้น)</p>
                                            <p className="text-primary-adaptive leading-relaxed">{evalResult.turningPoint}</p>
                                        </div>
                                    </div>

                                    <div className="spatial-card rounded-[1.75rem] p-5 space-y-3 text-xs">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">SELF-REFLECTION AUDIO REPLAY (RAM-ONLY • 100% PDPA SAFE)</span>
                                            <h3 className="font-display font-bold text-sm text-primary-adaptive">ฟังเสียงตัวเองย้อนหลัง &amp; ผลวัดความนุ่มนวลน้ำเสียง</h3>
                                        </div>
                                        {recordedVoiceClips.length === 0 ? (
                                            <p className="spatial-soft p-3 rounded-xl text-muted-adaptive">รอบนี้ไม่ได้ใช้ไมโครโฟนพูด (ใช้การพิมพ์/แตะคำพูด) — ลองใช้ไมค์ในรอบถัดไปเพื่อฟังเสียงตัวเองย้อนหลังนะคะ</p>
                                        ) : (
                                            <div className="space-y-2.5 max-h-60 overflow-y-auto custom-scrollbar">
                                                {recordedVoiceClips.map(c => (
                                                    <div key={c.id} className="spatial-soft p-3 rounded-2xl space-y-2">
                                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                                            <span className="font-bold text-primary-adaptive">รอบที่ {c.turn} • {c.toneLabel}</span>
                                                            <span className="font-mono font-extrabold text-accent-adaptive">Vocal Calm {c.calmScore}/100</span>
                                                        </div>
                                                        <p className="text-muted-adaptive line-clamp-2">“{c.transcript}”</p>
                                                        {c.audioUrl && <audio controls src={c.audioUrl} className="w-full h-9" />}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Post-Session Self-Efficacy (R2R Research) */}
                            <section className="spatial-card rounded-[1.75rem] p-5 space-y-3 border-prism-400/35">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">POST-TRAINING SELF-EFFICACY (R2R RESEARCH)</span>
                                        <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">ประเมินความมั่นใจหลังฝึกเสร็จ (เทียบก่อนฝึก {preEffAvg} → หลังฝึก {postEffAvg})</h3>
                                    </div>
                                    <button type="button" disabled={postEffSaved} onClick={async () => { await persistSkillLabSession(evalResult, messages, postEff); setPostEffSaved(true); showToast('บันทึกความมั่นใจหลังฝึกเรียบร้อยแล้วค่ะ'); }} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs disabled:opacity-50">
                                        {postEffSaved ? 'บันทึกผลวิจัยแล้ว ✓' : 'บันทึกความมั่นใจหลังฝึก'}
                                    </button>
                                </div>
                                {SELF_EFFICACY_ITEMS.map(item => (
                                    <div key={item.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-xs">
                                        <span className="text-secondary-adaptive">{item.labelTH}</span>
                                        <div className="flex gap-1 shrink-0">
                                            {[1, 2, 3, 4, 5].map(n => (
                                                <button key={n} type="button" onClick={() => { setPostEffSaved(false); setPostEff(p => ({ ...p, [item.key]: n })); }} className={`w-8 h-8 rounded-lg font-mono text-xs font-bold ${postEff[item.key] === n ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                    {n}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </section>

                            <div className="flex flex-wrap gap-3">
                                <button type="button" onClick={() => { stopGuideVoice(); setPhase('lobby'); }} className="spatial-soft touch-target flex-1 py-3.5 rounded-full font-display font-bold text-sm text-primary-adaptive">
                                    ฝึกเคสใหม่อีกครั้ง
                                </button>
                                <a href={dashboardReturnHref} onClick={persistLearnerBeforeReturn} className="rjc2-pill-btn touch-target flex-1 py-3.5 rounded-full font-display font-extrabold text-sm inline-flex items-center justify-center">
                                    กลับสู่ห้องเรียนหลัก (Step 4 Post-test) →
                                </a>
                            </div>
                        </div>
                    )}

                    {/* ==================== MODALS: ICU CHART, TRANSCRIPT/REWIND, 15S CALM BREATHER ==================== */}
                    {showChartModal && (
                        <div onClick={() => setShowChartModal(false)} className="fixed inset-0 z-[150] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div onClick={e => e.stopPropagation()} className="spatial-card max-w-lg w-full rounded-[2rem] p-5 space-y-3 text-xs">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-display font-extrabold text-base text-primary-adaptive">แฟ้มส่งเวร ICU &amp; ปมในใจ 3 ข้อ</h3>
                                    <button type="button" onClick={() => setShowChartModal(false)} className="spatial-soft w-8 h-8 rounded-xl flex items-center justify-center"><Icon name="X" size={16} /></button>
                                </div>
                                <div className="spatial-soft p-3.5 rounded-2xl space-y-1">
                                    <p><b>หอผู้ป่วย:</b> {activeBrief.ward}</p>
                                    <p><b>ผู้ป่วย:</b> {activeBrief.patient}</p>
                                    <p><b>สัญญาณชีพ:</b> <span className="font-mono text-accent-adaptive">{activeBrief.vitals}</span></p>
                                    <p><b>หมายเหตุ:</b> {activeBrief.handoffNote}</p>
                                </div>
                                <div className="space-y-1.5">
                                    <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">ความคืบหน้าการคลายปมในใจ ({unlockedBarrierIds.length}/3)</p>
                                    {currentBarriers.map(b => {
                                        const done = unlockedBarrierIds.includes(b.id);
                                        return (
                                            <div key={b.id} className={`p-2.5 rounded-xl border ${done ? 'bg-aurora-500/15 border-aurora-400/50 text-primary-adaptive font-bold' : 'spatial-soft text-muted-adaptive'}`}>
                                                {done ? '✓ ' : '○ '}{b.titleTH}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {showTranscriptModal && (
                        <div onClick={() => setShowTranscriptModal(false)} className="fixed inset-0 z-[150] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div onClick={e => e.stopPropagation()} className="spatial-card max-w-lg w-full max-h-[82vh] rounded-[2rem] p-5 flex flex-col gap-3">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-display font-extrabold text-base text-primary-adaptive">ประวัติสนทนา &amp; ย้อนเวลาแก้คำพูด</h3>
                                    <button type="button" onClick={() => setShowTranscriptModal(false)} className="spatial-soft w-8 h-8 rounded-xl flex items-center justify-center"><Icon name="X" size={16} /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 text-xs pr-1">
                                    {messages.map((m, idx) => (
                                        <div key={m.id || idx} className={`p-3 rounded-2xl space-y-1.5 ${m.role === 'user' ? 'bg-aurora-500/15 border border-aurora-400/35 ml-5' : 'spatial-soft mr-5'}`}>
                                            <div className="flex items-center justify-between gap-2">
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive">{m.role === 'user' ? 'คุณ (ผู้เรียน)' : (activeSpeakerBadge || 'คู่สนทนา')}</span>
                                                {m.role === 'relative' && idx < messages.length - 1 && (
                                                    <button type="button" onClick={() => { stopAiVoice(); setMessages(messages.slice(0, idx + 1)); setShowTranscriptModal(false); showToast('ย้อนเวลากลับไปแก้ไขคำพูดในรอบที่เลือกแล้วค่ะ', 'info'); }} className="text-[10px] font-bold text-amber-400 hover:underline">⏪ ย้อนมาตรงนี้</button>
                                                )}
                                            </div>
                                            <p className="text-primary-adaptive leading-relaxed">{m.text}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {calmSeconds > 0 && (
                        <div className="fixed inset-0 z-[160] bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-6 text-center text-white">
                            <div className="max-w-sm space-y-4">
                                <p className="font-mono text-xs text-cyan-300 uppercase">EMOTIONAL BREATHER • พักใจ</p>
                                <p className="font-mono text-6xl font-extrabold text-emerald-300">{calmSeconds}</p>
                                <p className="text-sm text-sky-100 leading-relaxed">หายใจเข้าลึกๆ ช้าๆ ผ่อนไหล่ลง คุณทำหน้าที่ผู้ดูแลหัวใจครอบครัวได้อย่างยอดเยี่ยมค่ะ</p>
                                <button type="button" onClick={() => setCalmSeconds(0)} className="rjc2-pill-btn px-6 py-2.5 rounded-full font-display font-bold text-xs">กลับเข้าห้องฝึกต่อ</button>
                            </div>
                        </div>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('skilllab-root'));
        root.render(<SkillLabErrorBoundary><SkillLabApp /></SkillLabErrorBoundary>);
    </script>
    <!-- โหลด Babel ท้ายสุดหลังสคริปต์ทั้งหมด เพื่อให้แน่ใจว่าโค้ดครบ 100% ก่อนคอมไพล์ -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
