        function pcmToWavBlobSafe(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = Math.max(0, bytes.length - off);
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return new Blob([buf], { type: 'audio/wav' });
            } catch (_) { return null; }
        }

        async function fetchStudioTtsBlob({ appsScriptUrl, text, voiceName = 'Sulafat', languageCode = 'th-TH', style = '', cacheKey = '', signal }) {
            if (cacheKey && typeof CORE.getCachedAudio === 'function') {
                try { const hit = await CORE.getCachedAudio(cacheKey); if (hit && hit.size > 0) return hit; } catch (_) {}
            }
            if (!appsScriptUrl || !navigator.onLine) return null;
            for (let attempt = 0; attempt < 2; attempt++) {
                if (signal?.aborted) return null;
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort, { once: true });
                const tm = setTimeout(() => ctrl.abort(), 45000);
                try {
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'callGeminiTTS', text, voiceName, languageCode, style }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                    if (signal?.aborted) return null;
                    const res = JSON.parse((await rawRes.text()) || '{}');
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rateMatch = String(res.inlineData.mimeType || '').match(/rate=(\d+)/);
                        const blob = pcmToWavBlobSafe(res.inlineData.data, parseInt(rateMatch ? rateMatch[1] : '24000', 10));
                        if (blob && blob.size > 0) {
                            if (cacheKey && typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(cacheKey, blob).catch(() => {});
                            return blob;
                        }
                    }
                } catch (_) {
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
                if (attempt === 0 && !signal?.aborted) await new Promise(r => setTimeout(r, 1000));
            }
            return null;
        }

        function FiveAxisRadarSVG({ radarArr, theme, personaId = 'standard' }) {
            const isDark = theme === 'dark';
            const fallbackAxes = typeof SL.getRadarAxes === 'function' ? SL.getRadarAxes(personaId) : (SL.RADAR_AXES || []);
            const axes = Array.isArray(radarArr) && radarArr.length === 5
                ? radarArr
                : fallbackAxes.map(a => ({ key: a.key, labelTH: a.shortTH || a.labelTH, value: 75 }));
            const w = 300, h = 250, cx = w / 2, cy = h / 2, maxR = 72;
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / axes.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const dataPts = axes.map((a, i) => pt(i, Math.max(0, Math.min(100, Number(a.value || 0))) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[300px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.48" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.22" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={axes.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {axes.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.2)' : 'rgba(15,58,125,0.14)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.8" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.5" />
                    ))}
                    {axes.map((a, i) => {
                        const [lx, ly] = pt(i, 1.38);
                        return (
                            <g key={a.key || i}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.5" fontWeight="700">{a.shortTH || a.labelTH}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10.5" fontFamily="JetBrains Mono, monospace" fontWeight="700">
                                    {Number(a.value || 0)}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            // Refs
            const stageContainerRef = useRef(null);
            const holoControllerRef = useRef(null);
            const sharedAudioRef = useRef(null);
            const lipSyncAnalyserRef = useRef(null);
            const audioUrlRef = useRef(null);
            const voiceSessionRef = useRef(0);
            const voiceAbortRef = useRef(null);
            const relativeEndTimeRef = useRef(0);
            const recognitionRef = useRef(null);
            const vocalRecorderRef = useRef(null);
            const autoGuidePlayedRef = useRef(new Set());

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3400);
            }, []);

            useEffect(() => {
                const el = document.getElementById('skilllab-root');
                if (el) el.dataset.mounted = 'true';
                if (!vocalRecorderRef.current && typeof SL.createVocalToneRecorder === 'function') {
                    vocalRecorderRef.current = SL.createVocalToneRecorder();
                }
            }, []);

            // Firebase Cloud Settings & User Refresh
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let unsubSettings = null;
                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser && !isAdminPreview) {
                        try { await signInAnonymously(fbAuth); } catch (_) {}
                        return;
                    }
                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), (snap) => {
                        if (snap.exists() && snap.data()?.appsScriptUrl) setAppsScriptUrl(snap.data().appsScriptUrl);
                    }, () => {});
                });
                return () => { active = false; unsubAuth(); if (unsubSettings) unsubSettings(); };
            }, [isAdminPreview]);

            // Derived Values
            const personas = useMemo(() => (typeof SL.getPersonas === 'function' ? SL.getPersonas() : []), []);
            const selectedMode = useMemo(() => MODES.find(m => m.id === modeId) || MODES[0], [modeId]);
            const drillStages = SL.MICRO_DRILL_STAGES || [];
            const currentDrillStage = drillStages[drillIdx] || drillStages[0] || {};
            const activePersona = useMemo(() => personas.find(p => p.id === selectedPersonaId) || personas[0] || {}, [personas, selectedPersonaId]);
            const effectivePersonaId = selectedMode.isDrill ? (currentDrillStage.personaId || 'standard') : activePersona.id;
            const activeIcuBrief = (SL.CASE_ICU_BRIEFS || {})[effectivePersonaId] || (SL.CASE_ICU_BRIEFS || {}).standard || {};
            const activeBarriers = useMemo(() => (typeof SL.getCaseBarriers === 'function' ? SL.getCaseBarriers(effectivePersonaId) : []), [effectivePersonaId]);
            const learnerProfession = useMemo(
                () => (typeof SL.resolveProfessionGroup === 'function' ? SL.resolveProfessionGroup(user) : (user?.professionGroup || 'พยาบาล')),
                [user]
            );
            const quickRepliesList = useMemo(() => {
                if (typeof SL.getCoachQuickReplies === 'function') return SL.getCoachQuickReplies(effectivePersonaId, selectedMode.lang);
                const bank = COACH_QUICK_REPLIES_FALLBACK[selectedMode.lang === 'en' ? 'en' : 'th'] || COACH_QUICK_REPLIES_FALLBACK.th;
                return bank[effectivePersonaId] || bank.standard;
            }, [effectivePersonaId, selectedMode.lang]);
            const latestRelativeMsg = useMemo(() => [...messages].reverse().find(m => m.role === 'relative') || null, [messages]);
            const activeRec = useMemo(() => (typeof SL.computeLabRecommendation === 'function' ? SL.computeLabRecommendation(user, advisorGoal) : {}), [user, advisorGoal]);
            const clinicalBadges = useMemo(() => (typeof SL.computeClinicalBadges === 'function' ? SL.computeClinicalBadges(user) : []), [user]);
            const browserGuard = useMemo(() => (typeof SL.detectInAppBrowser === 'function' ? SL.detectInAppBrowser() : { isInApp: false }), []);

            // ============================================================================
            // 4. 3D ANIME HOLOGRAM STAGE MOUNT & LIVE SYNC (WITH REAL AUDIO LIP-SYNC)
            // ============================================================================
            useEffect(() => {
                if ((phase !== 'negotiating' && phase !== 'micro_drill') || !stageContainerRef.current || typeof SL.mountHologram3D !== 'function') return;
                const ctrl = SL.mountHologram3D(stageContainerRef.current, {
                    personaId: effectivePersonaId,
                    emotion: currentEmotion,
                    trust: trustScore,
                    isSpeaking,
                    activeSpeaker: activeSpeakerKey,
                    getAudioAmplitude: () => (lipSyncAnalyserRef.current ? lipSyncAnalyserRef.current.getAmplitude() : -1)
                });
                holoControllerRef.current = ctrl;
                return () => {
                    try { ctrl.destroy(); } catch (_) {}
                    holoControllerRef.current = null;
                };
            }, [phase]);

            useEffect(() => {
                if (holoControllerRef.current && typeof holoControllerRef.current.update === 'function') {
                    holoControllerRef.current.update({
                        personaId: effectivePersonaId,
                        emotion: currentEmotion,
                        trust: trustScore,
                        isSpeaking,
                        activeSpeaker: activeSpeakerKey
                    });
                }
            }, [effectivePersonaId, currentEmotion, trustScore, isSpeaking, activeSpeakerKey]);

            // Therapeutic 2.5s Silence Detector
            useEffect(() => {
                if ((phase !== 'negotiating' && phase !== 'micro_drill') || isSpeaking || sending || relativeEndTimeRef.current <= 0) {
                    setSilenceReady(false);
                    return;
                }
                const tm = setInterval(() => {
                    if (Date.now() - relativeEndTimeRef.current >= 2500) {
                        setSilenceReady(true);
                    }
                }, 300);
                return () => clearInterval(tm);
            }, [phase, isSpeaking, sending]);

            // ============================================================================
            // 5. STUDIO 24kHz AI VOICE & REAL AUDIO LIP-SYNC ENGINE
            // ============================================================================
            const stopAllAiVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (voiceAbortRef.current) { try { voiceAbortRef.current.abort(); } catch (_) {} voiceAbortRef.current = null; }
                if (sharedAudioRef.current) { try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {} }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setIsSpeaking(false);
                setGuideState({ activeKey: '', status: 'idle' });
            }, []);
            useEffect(() => () => { stopAllAiVoice(); if (SL.SoundFX) SL.SoundFX.setAmbient(false); }, [stopAllAiVoice]);

            const playStepGuide = useCallback(async (key, text, opts = {}) => {
                const { silentFail = false } = opts;
                if (guideState.activeKey === key && guideState.status !== 'idle') { stopAllAiVoice(); return; }
                stopAllAiVoice();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;
                setGuideState({ activeKey: key, status: 'loading' });

                const blob = await fetchStudioTtsBlob({
                    appsScriptUrl,
                    text,
                    voiceName: 'Sulafat',
                    languageCode: 'th-TH',
                    style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ เป็นมิตรเหมือนอาจารย์พยาบาลผู้ดูแลห้องฝึก',
                    cacheKey: key,
                    signal: ctrl.signal
                });
                if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                if (!blob || blob.size === 0) {
                    setGuideState({ activeKey: '', status: 'idle' });
                    if (!silentFail) showToast('ไม่สามารถโหลดเสียง AI แนะนำได้ชั่วคราว กรุณาลองกดอีกครั้งค่ะ', 'info');
                    return;
                }

                if (!sharedAudioRef.current) {
                    const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', ''); sharedAudioRef.current = a;
                }
                setGuideState({ activeKey: key, status: 'speaking' });
                const url = URL.createObjectURL(blob);
                audioUrlRef.current = url;
                await new Promise(resolve => {
                    const a = sharedAudioRef.current;
                    a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                    try { a.load(); } catch (_) {}
                    const p = a.play();
                    if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                });
                if (voiceSessionRef.current === sid) setGuideState({ activeKey: '', status: 'idle' });
            }, [guideState, stopAllAiVoice, appsScriptUrl, showToast]);

            // Auto-Play Studio Voice Guide on Lobby & Briefing
            useEffect(() => {
                if (isAdminPreview) return;
                if (phase === 'lobby' && !autoGuidePlayedRef.current.has('lab_lobby')) {
                    autoGuidePlayedRef.current.add('lab_lobby');
                    const tm = setTimeout(() => playStepGuide('lab_lobby', 'ยินดีต้อนรับสู่ห้องฝึกสื่อสารสามมิติ เอไอสกิลแล็บ ค่ะ ท่านสามารถเลือกเคสฝึกตามคำแนะนำของเอไอ หรือเลือกฝึกโหมดไมโครดริลล์สี่ด่านคำถามหนักได้เลยค่ะ', { silentFail: true }), 480);
                    return () => clearTimeout(tm);
                }
                if (phase === 'briefing' && !autoGuidePlayedRef.current.has(`lab_brief_${activePersona.id}`)) {
                    autoGuidePlayedRef.current.add(`lab_brief_${activePersona.id}`);
                    const tm = setTimeout(() => playStepGuide(`lab_brief_${activePersona.id}`, `แฟ้มประวัติผู้ป่วยไอซียูค่ะ ${activePersona.briefingTH} เมื่อพร้อมแล้วกดปุ่มเคาะประตูเพื่อเริ่มสนทนาได้เลยค่ะ`, { silentFail: true }), 450);
                    return () => clearTimeout(tm);
                }
            }, [phase, activePersona, isAdminPreview, playStepGuide]);

            const playRelativeSegments = useCallback(async (speechText, personaId, emotionId, lang = 'th') => {
                if (!voiceEnabled) {
                    relativeEndTimeRef.current = Date.now();
                    return;
                }
                stopAllAiVoice();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;

                const segs = typeof SL.splitDualSpeakerSegments === 'function'
                    ? SL.splitDualSpeakerSegments(speechText, personaId, lang)
                    : [{ speaker: 'primary', label: 'คู่สนทนา', voiceName: 'Sulafat', text: speechText }];
                const emoObj = (SL.EMOTIONS || {})[emotionId] || (SL.EMOTIONS || {}).CONFUSED || {};
                const styleStr = lang === 'en' ? (emoObj.ttsStyleEN || '') : (emoObj.ttsStyleTH || '');

                if (!sharedAudioRef.current) {
                    const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', '');
                    sharedAudioRef.current = a;
                }
                if (!lipSyncAnalyserRef.current && typeof SL.createAudioLipSyncAnalyser === 'function') {
                    lipSyncAnalyserRef.current = SL.createAudioLipSyncAnalyser(sharedAudioRef.current);
                }
                if (lipSyncAnalyserRef.current && typeof lipSyncAnalyserRef.current.resume === 'function') {
                    lipSyncAnalyserRef.current.resume();
                }

                for (let i = 0; i < segs.length; i++) {
                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                    const seg = segs[i];
                    setActiveSpeakerKey(seg.speaker || 'primary');
                    setActiveSpeakerBadge(seg.label || activePersona.speakerRoleTH || 'คู่สนทนา');

                    const blob = await fetchStudioTtsBlob({
                        appsScriptUrl,
                        text: seg.text,
                        voiceName: seg.voiceName || (personaId === 'sbar_doctor' ? 'Puck' : 'Sulafat'),
                        languageCode: lang === 'en' ? 'en-US' : 'th-TH',
                        style: styleStr,
                        signal: ctrl.signal
                    });

                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                    if (!blob || blob.size === 0) {
                        // Fallback mouth animation window if offline
                        setIsSpeaking(true);
                        await new Promise(r => setTimeout(r, Math.min(3600, Math.max(1400, seg.text.length * 42))));
                        setIsSpeaking(false);
                        continue;
                    }

                    setIsSpeaking(true);
                    if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} }
                    const url = URL.createObjectURL(blob);
                    audioUrlRef.current = url;

                    await new Promise(resolve => {
                        const a = sharedAudioRef.current;
                        a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });
                    setIsSpeaking(false);
                }

                if (voiceSessionRef.current === sid) {
                    relativeEndTimeRef.current = Date.now();
                }
            }, [voiceEnabled, stopAllAiVoice, appsScriptUrl, activePersona]);

            // ============================================================================
            // 6. SIMULATION FLOW HANDLERS (START, SEND TURN, HINT, MICRO-DRILL, EVALUATE)
            // ============================================================================
            const handleApplyRec = () => {
                if (activeRec.mode) setModeId(activeRec.mode);
                if (activeRec.difficulty) setDifficultyId(activeRec.difficulty);
                if (activeRec.personaId) setSelectedPersonaId(activeRec.personaId);
                showToast(`ตั้งค่าตามคำแนะนำสำหรับกลุ่ม${learnerProfession}เรียบร้อยแล้วค่ะ`);
            };

            const handleEnterBriefingOrDrill = () => {
                stopAllAiVoice();
                if (selectedMode.isDrill) {
                    const st0 = drillStages[0] || {};
                    setDrillIdx(0);
                    setDrillResults([]);
                    setCurrentDrillFeedback(null);
                    setCurrentEmotion(st0.emotion || 'CONFUSED');
                    setActiveSpeakerKey('primary');
                    setActiveSpeakerBadge(st0.badgeTH || 'ด่าน 1/4');
                    setCurrentActionCue(st0.actionTH || '');
                    setInputText('');
                    setPhase('micro_drill');
                    if (SL.SoundFX) SL.SoundFX.playDoorKnock();
                    setTimeout(() => playRelativeSegments(st0.promptTH || '', st0.personaId || 'standard', st0.emotion || 'CONFUSED', 'th'), 350);
                } else {
                    setPhase('briefing');
                }
            };

            const handleStartConsultation = () => {
                stopAllAiVoice();
                if (SL.SoundFX) SL.SoundFX.playDoorKnock();
                const isEn = selectedMode.lang === 'en';
                const openingSpeech = isEn ? (activePersona.openingEN || activePersona.openingTH) : activePersona.openingTH;
                const openingAction = isEn ? (activePersona.openingActionEN || activePersona.openingActionTH) : activePersona.openingActionTH;
                const initEmo = activePersona.openingEmotion || 'CONFUSED';

                setMessages([{ role: 'relative', text: openingSpeech, emotion: initEmo }]);
                setCurrentEmotion(initEmo);
                setTrustScore((SL.EMOTIONS?.[initEmo]?.baseTrust) || 38);
                setTrustDelta(0);
                setActiveSpeakerKey(activePersona.id === 'conflict' ? 'wife' : 'primary');
                setActiveSpeakerBadge(activePersona.speakerRoleTH || 'คู่สนทนา');
                setCurrentActionCue(openingAction || '');
                setUnlockedBarrierIds([]);
                setUsedCurveballs([]);
                setActiveCurveballBanner(null);
                setActiveBarrierHint(null);
                setTriggerHits([]);
                setSilenceCount(0);
                setLearnerVoiceClips([]);
                setInputText('');
                setPhase('negotiating');

                setTimeout(() => playRelativeSegments(openingSpeech, activePersona.id, initEmo, selectedMode.lang), 380);
            };

            const handleSendLearnerTurn = async (e) => {
                if (e) e.preventDefault();
                const raw = inputText.trim();
                if (!raw || sending) return;

                stopAllAiVoice();
                setInputText('');
                setActiveCurveballBanner(null);
                setActiveBarrierHint(null);

                const waitedMs = relativeEndTimeRef.current > 0 ? Date.now() - relativeEndTimeRef.current : 0;
                const usedSilence = waitedMs >= 2500 && relativeEndTimeRef.current > 0;
                if (usedSilence) setSilenceCount(c => c + 1);
                setSilenceReady(false);

                const triggers = typeof SL.detectTriggerPhrases === 'function'
                    ? SL.detectTriggerPhrases(raw, selectedMode.lang, activePersona.id)
                    : [];
                setTriggerHits(triggers);

                // Micro-Drill Mode Branch
                if (selectedMode.isDrill) {
                    const res = typeof SL.evaluateMicroDrillAnswer === 'function'
                        ? SL.evaluateMicroDrillAnswer(currentDrillStage, raw, triggers, usedSilence)
                        : { stage: drillIdx + 1, titleTH: currentDrillStage.titleTH, score: 82, passed: true, hitLabels: [], missLabels: [], modelAnswerTH: currentDrillStage.modelAnswerTH };
                    setCurrentDrillFeedback(res);
                    setDrillResults(prev => [...prev.filter(x => x.stage !== res.stage), res]);
                    if (SL.SoundFX) SL.SoundFX.playChime(res.passed ? [523.25, 659.25, 783.99] : [440, 392]);
                    return;
                }

                // Roleplay Mode Branch
                const nextMsgs = [...messages, { role: 'user', text: raw }];
                setMessages(nextMsgs);
                setSending(true);
                setLatencyCue(typeof SL.pickLatencyMaskCue === 'function' ? SL.pickLatencyMaskCue(activePersona.id, selectedMode.lang === 'en') : 'กำลังตั้งใจรับฟังคำพูดของท่าน...');

                const bRes = typeof SL.evaluateBarriersUnlocked === 'function'
                    ? SL.evaluateBarriersUnlocked(activePersona.id, raw, unlockedBarrierIds)
                    : { unlockedIds: unlockedBarrierIds, newlyUnlocked: [] };
                setUnlockedBarrierIds(bRes.unlockedIds);
                if (bRes.newlyUnlocked.length > 0 && SL.SoundFX) {
                    SL.SoundFX.playChime([523.25, 659.25, 783.99]);
                }

                // Check Hard Mode Curveball (แยกบริบท: เคสญาติ vs เคส 6 SBAR ICU Monitor Alarm)
                const nextTurnNumber = nextMsgs.filter(m => m.role === 'user').length;
                if (difficultyId === 'hard' && typeof SL.pickHardCurveball === 'function') {
                    const cb = SL.pickHardCurveball(nextTurnNumber, usedCurveballs, activePersona.id);
                    if (cb) {
                        setUsedCurveballs(prev => [...prev, cb.id]);
                        setActiveCurveballBanner(cb);
                        if (cb.type === 'alarm' && SL.SoundFX && typeof SL.SoundFX.playMonitorAlarm === 'function') {
                            SL.SoundFX.playMonitorAlarm();
                        } else if (cb.type === 'phone' && SL.SoundFX && typeof SL.SoundFX.playPhoneBuzz === 'function') {
                            SL.SoundFX.playPhoneBuzz();
                        }
                        const cbSpeech = selectedMode.lang === 'en' ? (cb.speechEN || cb.speechTH) : cb.speechTH;
                        const cbAction = selectedMode.lang === 'en' ? (cb.actionEN || cb.actionTH) : cb.actionTH;
                        setCurrentEmotion(cb.emotion || 'ANGRY');
                        setCurrentActionCue(cbAction || '');
                        setMessages([...nextMsgs, { role: 'relative', text: cbSpeech, emotion: cb.emotion || 'ANGRY' }]);
                        setSending(false);
                        setLatencyCue('');
                        playRelativeSegments(cbSpeech, activePersona.id, cb.emotion || 'ANGRY', selectedMode.lang);
                        return;
                    }
                }

                let aiRawText = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const historyTxt = nextMsgs.slice(-8).map(m => `${m.role === 'user' ? 'พยาบาล' : 'คู่สนทนา'}: ${m.text}`).join('\n');
                        const isSbarCase = activePersona.id === 'sbar_doctor';
                        const sysPrompt = isSbarCase
                            ? `คุณสวมบทบาทเป็น ${activePersona.speakerRoleTH} ในเคสส่งเวร SBAR: ${activePersona.briefingTH}\n${activePersona.promptHintTH || ''}\nระดับความยาก: ${difficultyId} | เป้าหมาย SBAR ที่รายงานแล้ว: ${bRes.unlockedIds.length}/3\nตอบสั้นกระชับ 2-3 ประโยคภาษา${selectedMode.lang === 'en' ? 'อังกฤษ' : 'ไทย'} ขึ้นต้นด้วย [EMOTION:SHOCK|CONFUSED|ANGRY|HESITANT|CALM] [ACTION:ภาษากายหน้าจอมอนิเตอร์]${difficultyId === 'normal' ? ' [COACH:คำแนะนำ SBAR สั้น 1 บรรทัด]' : ''} ตามด้วยคำพูด`
                            : `คุณสวมบทบาทเป็น ${activePersona.speakerRoleTH} ในเคส: ${activePersona.briefingTH}\n${activePersona.promptHintTH || ''}\nระดับความยาก: ${difficultyId} | ปมที่คลายแล้ว: ${bRes.unlockedIds.length}/3 | Trust ปัจจุบัน: ${trustScore}%\nตอบสั้น 2-3 ประโยคสมจริงภาษา${selectedMode.lang === 'en' ? 'อังกฤษ' : 'ไทย'} ขึ้นต้นด้วยแท็ก [EMOTION:SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] [ACTION:ภาษากายสั้นๆ]${difficultyId === 'normal' ? ' [COACH:คำแนะนำสั้น 1 บรรทัดให้พยาบาล]' : ''} ตามด้วยคำพูด`;
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawFetch = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'callGemini', prompt: historyTxt, systemInstruction: sysPrompt }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawFetch.text()) || '{}');
                        if (d?.status === 'success' && d.text) aiRawText = d.text;
                    } catch (_) {}
                }

                if (!aiRawText) {
                    const isAllDone = bRes.unlockedIds.length >= 3;
                    if (activePersona.id === 'sbar_doctor') {
                        aiRawText = isAllDone
                            ? '[EMOTION:CALM] [ACTION:พยักหน้ารับและสั่ง Order ในระบบคอมพิวเตอร์ทันที] ขอบคุณครับคุณพยาบาล รายงาน SBAR ชัดเจนครบถ้วนมาก ผมสั่ง Load สารน้ำ ปรับ Vasopressor และให้ DDAVP ทันที พร้อมประสานทีมตรวจสมองตายและ ODC เลยครับ'
                            : '[EMOTION:HESITANT] [ACTION:จดตัวเลขลงใบ Order อย่างรวดเร็ว] รับทราบตัวเลขเบื้องต้นครับ ช่วยสรุปการประเมินภาวะเบาจืดและแผนการรักษาหรือการประสานทีมต่อให้ครบอีกนิดครับ';
                    } else if (activePersona.id === 'conflict') {
                        aiRawText = isAllDone
                            ? '[EMOTION:CALM] [ACTION:ภรรยาและคุณแม่จับมือกันและหันมาขอบคุณอย่างซาบซึ้ง] [ภรรยา]: ขอบคุณนะคะที่ไม่กดดันครอบครัวเราเลย [คุณแม่]: แม่สบายใจขึ้นมากลูก ขอบคุณที่ให้เกียรติแม่กับลูกชายแม่นะ ขอแม่คุยกับลูกสะใภ้สักครู่นะคะ'
                            : '[EMOTION:HESITANT] [ACTION:ทั้งสองท่านนิ่งฟังและมองหน้ากัน] [ภรรยา]: หนูก็ไม่อยากขัดใจคุณแม่ค่ะ [คุณแม่]: แม่แค่อยากมั่นใจว่าจะไม่มีใครบังคับแม่ใช่ไหมคะ?';
                    } else {
                        aiRawText = isAllDone
                            ? '[EMOTION:CALM] [ACTION:สบตาด้วยความไว้วางใจและผ่อนคลายลงอย่างเห็นได้ชัด] ขอบคุณมากนะคะที่ค่อยๆ อธิบายอย่างอ่อนโยนและไม่เร่งรัดเลย ตอนนี้สบายใจขึ้นมากแล้วค่ะ ขอเวลาปรึกษาครอบครัวสักครู่นะคะ'
                            : '[EMOTION:HESITANT] [ACTION:พยักหน้ารับฟังช้าๆ] พอเข้าใจขึ้นบ้างแล้วค่ะ... แต่อยากขอความมั่นใจเรื่องการดูแลร่างและเวลาให้ครอบครัวตัดสินใจอีกนิดได้ไหมคะ?';
                    }
                }

                const parsed = typeof SL.parseRelativeResponse === 'function'
                    ? SL.parseRelativeResponse(aiRawText, currentEmotion)
                    : { speech: aiRawText, emotion: 'HESITANT', actionCue: '' };

                const tRes = typeof SL.computeInertiaTrust === 'function'
                    ? SL.computeInertiaTrust({ prevTrust: trustScore, aiEmotion: parsed.emotion, newlyUnlockedCount: bRes.newlyUnlocked.length, totalUnlockedCount: bRes.unlockedIds.length, triggerCount: triggers.length, usedSilence, difficulty: difficultyId, userText: raw })
                    : { trust: Math.min(95, trustScore + 12), delta: 12, emotion: parsed.emotion };

                setTrustScore(tRes.trust);
                setTrustDelta(tRes.delta);
                setCurrentEmotion(tRes.emotion);
                if (parsed.actionCue) setCurrentActionCue(parsed.actionCue);

                const updatedHistory = [...nextMsgs, { role: 'relative', text: parsed.speech, emotion: tRes.emotion }];
                setMessages(updatedHistory);
                setSending(false);
                setLatencyCue('');

                playRelativeSegments(parsed.speech, activePersona.id, tRes.emotion, selectedMode.lang);
            };

            const handleToggleMic = async () => {
                if (micListening) {
                    setMicListening(false);
                    if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch (_) {} }
                    if (vocalRecorderRef.current && vocalRecorderRef.current.isActive()) {
                        const clip = await vocalRecorderRef.current.stop();
                        setLiveVocalMetric(null);
                        if (clip) setLearnerVoiceClips(prev => [...prev, clip]);
                    }
                    return;
                }

                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง สามารถพิมพ์ข้อความลงช่องด้านล่างได้เลยค่ะ', 'info');
                    return;
                }
                stopAllAiVoice();
                const rec = new SR();
                rec.lang = selectedMode.lang === 'en' ? 'en-US' : 'th-TH';
                rec.interimResults = true;
                rec.continuous = false;
                let finalTxt = '';

                rec.onresult = (ev) => {
                    let interim = '';
                    for (let i = ev.resultIndex; i < ev.results.length; i++) {
                        if (ev.results[i].isFinal) finalTxt += ev.results[i][0].transcript;
                        else interim += ev.results[i][0].transcript;
                    }
                    setInputText((finalTxt + interim).trim());
                };
                rec.onend = async () => {
                    setMicListening(false);
                    if (vocalRecorderRef.current && vocalRecorderRef.current.isActive()) {
                        const clip = await vocalRecorderRef.current.stop();
                        setLiveVocalMetric(null);
                        if (clip) setLearnerVoiceClips(prev => [...prev, clip]);
                    }
                    if (autoSendVoice && finalTxt.trim()) {
                        setTimeout(() => {
                            const formEl = document.getElementById('skilllab-chat-form');
                            if (formEl) formEl.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                        }, 180);
                    }
                };
                rec.onerror = () => { setMicListening(false); setLiveVocalMetric(null); };
                recognitionRef.current = rec;
                try {
                    rec.start();
                    setMicListening(true);
                    if (vocalRecorderRef.current) vocalRecorderRef.current.start(m => setLiveVocalMetric(m));
                } catch (_) {
                    setMicListening(false);
                }
            };

            const handleRequestBarrierHint = () => {
                if (difficultyId === 'hard' || selectedMode.isDrill) return;
                if (typeof SL.getRemainingBarrierHint === 'function') {
                    const hintObj = SL.getRemainingBarrierHint(activePersona.id, unlockedBarrierIds, selectedMode.lang);
                    setActiveBarrierHint(hintObj);
                }
            };

            const handleDownloadDebriefPng = () => {
                if (!evalResult) return;
                const ok = typeof SL.downloadDebriefCardPng === 'function'
                    ? SL.downloadDebriefCardPng({
                        evalResult,
                        user,
                        personaId: effectivePersonaId,
                        caseTitle: selectedMode.isDrill ? 'Micro-Drill 4 ด่านคำถามหนัก' : activePersona.titleTH,
                        modeLabel: selectedMode.label,
                        difficultyId,
                        badges: clinicalBadges
                    })
                    : false;
                showToast(
                    ok ? 'บันทึกใบสรุปผลเรดาร์ 5 แกน (PNG) ลงเครื่องเรียบร้อยแล้วค่ะ' : 'ไม่สามารถสร้างไฟล์ภาพสรุปผลได้ในขณะนี้ค่ะ',
                    ok ? 'success' : 'error'
                );
            };

            const handleFinishAndEvaluate = async (finalMsgs = null, finalDrillRes = null) => {
                stopAllAiVoice();
                const msgList = Array.isArray(finalMsgs) ? finalMsgs : messages;
                const dResList = Array.isArray(finalDrillRes) ? finalDrillRes : drillResults;
                let result = null;

                if (selectedMode.isDrill) {
                    const avgDrill = dResList.length > 0
                        ? Math.round(dResList.reduce((s, x) => s + Number(x.score || 0), 0) / dResList.length)
                        : 78;
                    const axes = SL.RADAR_AXES || [];
                    const vals = [Math.min(98, avgDrill + 3), avgDrill, Math.min(98, avgDrill + 2), Math.max(60, avgDrill - 3), Math.min(98, avgDrill + 4)];
                    const rMap = {};
                    axes.forEach((a, i) => { rMap[a.key] = vals[i]; });
                    result = {
                        score: avgDrill,
                        personaId: 'standard',
                        radar: axes.map((a, i) => ({ ...a, value: vals[i] })),
                        radarMap: rMap,
                        goldenMoment: dResList[0]?.modelAnswerTH || 'ตอบคำถามเฉพาะจุดได้ครบถ้วนและนุ่มนวลค่ะ',
                        turningPoint: 'นำประโยคต้นแบบทั้ง 4 ด่านไปประยุกต์ใช้จริงในโหมด Roleplay 6 รอบต่อได้เลยค่ะ',
                        summary: `ผ่านการซ้อม Micro-Drill ${dResList.length}/${drillStages.length} ด่าน • คะแนนเฉลี่ย ${avgDrill}/100`
                    };
                } else {
                    const fallbackEval = typeof SL.evaluateConversationFallback === 'function'
                        ? SL.evaluateConversationFallback({ personaId: effectivePersonaId, messages: msgList, barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal: triggerHits.length, finalTrust: trustScore })
                        : { score: 84, personaId: effectivePersonaId, radar: [], radarMap: {}, goldenMoment: 'สื่อสารได้ดีค่ะ', turningPoint: 'ลองเว้นความเงียบ 2.5 วิเพิ่มนะคะ', summary: '' };
                    result = fallbackEval;

                    if (appsScriptUrl && navigator.onLine && typeof SL.buildSupervisorEvaluationPrompt === 'function') {
                        try {
                            const prompt = SL.buildSupervisorEvaluationPrompt({
                                personaId: effectivePersonaId,
                                messages: msgList, personaTitle: activePersona.titleTH,
                                barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal: triggerHits.length, finalTrust: trustScore
                            });
                            if (prompt) {
                                const ctrl = new AbortController();
                                const tm = setTimeout(() => ctrl.abort(), 14000);
                                const raw = await fetch(appsScriptUrl, {
                                    method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify({ action: 'callGemini', prompt }),
                                    signal: ctrl.signal
                                });
                                clearTimeout(tm);
                                const d = JSON.parse((await raw.text()) || '{}');
                                if (d?.status === 'success' && d.text && typeof SL.parseSupervisorJson === 'function') {
                                    result = SL.parseSupervisorJson(d.text, fallbackEval);
                                }
                            }
                        } catch (_) {}
                    }
                }

                setEvalResult(result);
                setPhase('result');
                if (SL.SoundFX) SL.SoundFX.playChime([523.25, 659.25, 783.99, 1046.5]);
            };

            const handleReturnToDashboard = async () => {
                stopAllAiVoice();
                if (evalResult && user?.id && user.id !== 'GUEST_LAB') {
                    const preAvg = Number(((preEff.explainBrainDeath + preEff.handleEmotion + preEff.gentleApproach) / 3).toFixed(2));
                    const postAvg = Number(((postEff.explainBrainDeath + postEff.handleEmotion + postEff.gentleApproach) / 3).toFixed(2));
                    const blind = typeof SL.buildBlindTranscript === 'function' ? SL.buildBlindTranscript(messages, user.name) : [];
                    const entry = {
                        at: new Date().toISOString(),

                        blindTranscript: blind

                    const prevHist = Array.isArray(user.skillLabHistory) ? user.skillLabHistory : [];
                    const nextHist = [...prevHist, entry];
                    const best = Math.max(Number(user.skillLabBestScore || 0), Number(evalResult.score || 0));

                        ...user,
                        skillLabPassed: true,
                        skillLabBestScore: best,
                        skillLabLatestRadar: evalResult.radarMap || user.skillLabLatestRadar || null,
                        preSelfEfficacyAvg: preAvg,
                        postSelfEfficacyAvg: postAvg,
                        skillLabHistory: nextHist
                    };
                    setUser(nextUser);
                    saveLearnerSessionSafe(nextUser);
                    if (!isAdminPreview && fbDb) {
                        try {
                            await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(user.id)), nextUser, { merge: true });
                        } catch (_) {}
                    }
                }
                window.location.href = isAdminPreview ? './index.html?admin_preview=dashboard' : './index.html?return=dashboard';
            };

            const activeEmoMeta = (SL.EMOTIONS || {})[currentEmotion] || (SL.EMOTIONS || {}).CONFUSED || { labelTH: 'สับสน', colorHex: '#38bdf8' };

            // ============================================================================
            // 7. RENDER INTERFACES (LOBBY, BRIEFING, NEGOTIATING, MICRO-DRILL, RESULT)
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    {phase !== 'negotiating' && phase !== 'micro_drill' && (
                        <>
                            <div className="spatial-aura" /><div className="spatial-grid" />
                        </>
                    )}
                    {(isSpeaking || guideState.status !== 'idle') && (
                        <div className="fixed top-0 left-0 right-0 z-50 pointer-events-none"><div className="rjc-ambient-bar" /></div>
                    )}

                    {/* ==================== PHASE 1: LOBBY ==================== */}
                    {phase === 'lobby' && (
                        <>
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-6xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <a href="./index.html?return=dashboard" onClick={() => { if (user?.id) saveLearnerSessionSafe(user); }} className="w-9 h-9 rounded-xl spatial-soft text-primary-adaptive flex items-center justify-center shrink-0">
                                            <Icon name="ArrowLeft" size={18} />
                                        </a>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                AI Skill Lab <span className="text-accent-adaptive">3D</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                                {user.name} • {learnerProfession}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        <button type="button" onClick={() => playStepGuide('lab_lobby', 'ยินดีต้อนรับสู่ห้องฝึกสื่อสารสามมิติ เอไอสกิลแล็บ ค่ะ ท่านสามารถเลือกเคสฝึกตามคำแนะนำของเอไอ หรือเลือกฝึกโหมดไมโครดริลล์สี่ด่านคำถามหนักได้เลยค่ะ')} className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-prism-adaptive inline-flex items-center gap-1.5">
                                            <Icon name="Volume2" size={14} /> <span className="hidden sm:inline">ฟังแนะนำ</span>
                                        </button>
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>

                            </header>

                            <main className="relative z-10 max-w-6xl w-full mx-auto px-3.5 sm:px-6 py-5 sm:py-7 space-y-5 flex-1">
                                {browserGuard.isInApp && (

                                        <span className="text-amber-200 font-bold">ตรวจพบการใช้งานผ่าน {browserGuard.appName} — แนะนำเปิดใน Safari / Chrome เพื่อให้ไมค์และเสียง AI ทำงานสมบูรณ์ค่ะ</span>
                                        <button type="button" onClick={() => { copyTextSafe(browserGuard.externalUrl); showToast('คัดลอกลิงก์แล้ว วางใน Safari หรือ Chrome ได้เลยค่ะ'); }} className="px-3 py-1.5 rounded-xl bg-amber-400 text-void-950 font-extrabold">
                                            คัดลอกลิงก์เปิดในเบราว์เซอร์
                                        </button>
                                    </div>
                                )}

                                {/* AI Lab Advisor (ปรับแนะนำตรงตาม 3 กลุ่มวิชาชีพ) */}
                                <section className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5 border-prism-400/35">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <div className="flex flex-wrap items-center gap-1.5">
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">AI LAB ADVISOR • แนะนำตรงตามกลุ่มวิชาชีพ</span>
                                                <span className="px-2 py-0.5 rounded-full bg-aurora-500/20 border border-aurora-400/40 text-accent-adaptive font-mono text-[10px] font-bold">

                                                {g.label}

                                                ? {q}

                                {/* Mode & Difficulty Selector */}

                                                <p className="font-display font-extrabold text-xs text-rose-300">Hard Mode ⚡</p>
                                                <p className="text-[10.5px] text-muted-adaptive mt-0.5">ไร้ตัวช่วย + เหตุการณ์แทรก</p>

                                {/* 6 Clinical Personas Grid */}

                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase px-1">3. เลือกเคสสถานการณ์จำลอง (ตัวละครอนิเมะ 3 มิติปรับเพศและจำนวนคนอัตโนมัติ)</span>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {personas.map(p => {

                                                    <button key={p.id} type="button" onClick={() => setSelectedPersonaId(p.id)} className={`text-left p-4 rounded-[1.5rem] border transition-all space-y-2 ${active ? 'bg-aurora-500/20 border-aurora-400 shadow-lg' : 'spatial-card hover:border-prism-400/50'}`}>
                                                        <div className="flex items-center justify-between gap-2">
                                                            <span className="px-2.5 py-0.5 rounded-full font-mono text-[10px] font-bold bg-white/10 text-prism-adaptive">{p.tagTH}</span>

                                {/* Pre-Session Self-Efficacy (R2R) + Start CTA */}

                                        <div className="flex flex-wrap gap-1">
                                            {clinicalBadges.map(b => (
                                                <span key={b.id} title={b.descTH} className={`px-2 py-0.5 rounded-full font-mono text-[10px] font-bold border ${b.earned ? 'bg-amber-400/20 border-amber-400/50 text-amber-200' : 'spatial-soft text-muted-adaptive opacity-60'}`}>
                                                    {b.earned ? '★ ' : ''}{b.titleTH}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5 text-xs">

                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">AI CLINICAL SUPERVISOR DEBRIEF REPORT</span>
                                        <h1 className="font-display font-extrabold text-xl text-primary-adaptive">
                                            {selectedMode.isDrill ? 'สรุปผลการฝึก Micro-Drill 4 ด่านคำถามหนัก' : activePersona.titleTH}
                                        </h1>
                                    </div>
                                    <span className="px-3 py-1 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-xs font-bold">
                                        {difficultyId.toUpperCase()} MODE
                                    </span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-center">
                                    <div className="text-center md:text-left space-y-2">
                                        <p className="text-xs text-muted-adaptive font-mono">
                                            {effectivePersonaId === 'sbar_doctor' ? 'SBAR ICU CLINICAL HANDOFF INDEX' : 'EMPATHY & CLINICAL COMMUNICATION INDEX'}
                                        </p>
                                        <div className="flex items-baseline justify-center md:justify-start gap-2">
                                            <span className="font-mono text-5xl font-extrabold text-accent-adaptive">{evalResult.score}</span>
                                            <span className="font-mono text-lg text-muted-adaptive">/100</span>
                                        </div>
                                        <p className="text-xs text-secondary-adaptive leading-relaxed">{evalResult.summary}</p>
                                    </div>
                                    <div className="spatial-soft rounded-2xl p-3">
                                        <FiveAxisRadarSVG radarArr={evalResult.radar} theme={theme} personaId={effectivePersonaId} />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                    <div className="p-4 rounded-2xl bg-aurora-500/15 border border-aurora-400/40 space-y-1">
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">★ ประโยคทองที่ทำได้ดีเยี่ยม (GOLDEN MOMENT)</span>
                                        <p className="text-primary-adaptive leading-relaxed">{evalResult.goldenMoment}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-prism-500/15 border border-prism-400/40 space-y-1">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">✦ จุดควรเกลาเพิ่มความเชี่ยวชาญ (TURNING POINT)</span>
                                        <p className="text-primary-adaptive leading-relaxed">{evalResult.turningPoint}</p>
                                    </div>
                                </div>

                                {learnerVoiceClips.length > 0 && (
                                    <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">🎙️ ฟังเสียงตัวเองย้อนหลัง (Self-Reflection • เก็บเฉพาะใน RAM • PDPA 100%)</span>
                                        <div className="flex flex-wrap gap-2">
                                            {learnerVoiceClips.map((c, ci) => c.audioUrl && (
                                                <div key={ci} className="spatial-soft px-3 py-2 rounded-xl flex items-center gap-2">
                                                    <span className="font-mono font-bold text-accent-adaptive">รอบ {ci + 1} ({c.durationSec}s)</span>
                                                    <audio controls src={c.audioUrl} className="h-7 max-w-[180px]" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Post-Practice Self-Efficacy (R2R) */}
                                <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                    <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">POST-PRACTICE SELF-EFFICACY (ประเมินความมั่นใจหลังฝึก • R2R)</span>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                                        {(SL.SELF_EFFICACY_ITEMS || []).map(it => (
                                            <div key={it.key} className="space-y-1">
                                                <p className="text-secondary-adaptive">{it.labelTH}</p>
                                                <div className="flex gap-1">
                                                    {[1, 2, 3, 4, 5].map(n => (
                                                        <button key={n} type="button" onClick={() => setPostEff(p => ({ ...p, [it.key]: n }))} className={`flex-1 py-1 rounded-lg font-mono font-bold ${postEff[it.key] === n ? 'bg-amber-400 text-void-950' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-2">
                                    <button type="button" onClick={handleDownloadDebriefPng} className="spatial-soft touch-target py-3.5 px-4 rounded-full font-display font-bold text-xs sm:text-sm text-prism-adaptive border-prism-400/45 inline-flex items-center justify-center gap-1.5">
                                        <Icon name="Download" size={15} /> บันทึกใบสรุปผล (PNG)
                                    </button>
                                    <button type="button" onClick={() => { stopAllAiVoice(); setPhase('lobby'); }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-primary-adaptive">
                                        ← ฝึกเคสใหม่อีกครั้ง
                                    </button>
                                    <button type="button" onClick={handleReturnToDashboard} className="rjc2-pill-btn touch-target py-3.5 rounded-full font-display font-extrabold text-xs sm:text-sm">
                                        บันทึกผล &amp; กลับห้องเรียนหลัก →
                                    </button>
                                </div>
                            </div>
                        </main>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('skilllab-root'));
        root.render(<SkillLabErrorBoundary><SkillLabApp /></SkillLabErrorBoundary>);
    </script>
    <!-- โหลด Babel ท้ายสุดหลังสคริปต์ทั้งหมด เพื่อให้แน่ใจว่าโค้ดครบ 100% ก่อนคอมไพล์ -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
