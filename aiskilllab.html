                    {showToolsSheet && (
                        <div onClick={() => setShowToolsSheet(false)} className="fixed inset-0 z-[125] bg-slate-950/75 backdrop-blur-md flex items-end justify-center">
                            <div onClick={(e) => e.stopPropagation()} className="holo-obsidian-card w-full max-w-lg rounded-t-[2rem] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom,0px))] space-y-4 max-h-[85dvh] overflow-y-auto text-white border-t border-cyan-300/30">
                                <div className="w-10 h-1 rounded-full bg-white/25 mx-auto -mt-1" />
                                <div className="flex items-center justify-between">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-emerald-300 uppercase">MOBILE ROOM CONTROLS</span>
                                        <h3 className="font-display font-extrabold text-base">เครื่องมือห้องฝึก 3 มิติ</h3>
                                    </div>
                                    <button type="button" onClick={() => setShowToolsSheet(false)} className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center">
                                        <Icon name="X" size={17} />
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    <p className="text-xs font-bold text-cyan-200">สลับรูปแบบ Hologram 3 มิติสด (6 สไตล์)</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        {HOLOGRAM_STYLES.map(st => {
                                            const active = hologramStyle === st.id;
                                            return (
                                                <button
                                                    key={st.id}
                                                    type="button"
                                                    onClick={() => { handleSelectHologramStyle(st.id); setShowToolsSheet(false); }}
                                                    className={`touch-target px-3 py-2.5 rounded-2xl border text-left text-xs font-bold flex items-center gap-2 transition-all ${
                                                        active ? 'bg-emerald-500/25 border-emerald-400 text-emerald-200' : 'bg-white/[0.06] border-white/15 text-sky-100'
                                                    }`}
                                                >
                                                    <Icon name={st.icon} size={15} className="shrink-0" />
                                                    <span className="truncate">{st.code} {isEn ? st.nameEN : st.nameTH}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2 pt-1">
                                    <button
                                        type="button"
                                        disabled={!latestRelativeMsg || isThinking}
                                        onClick={() => {
                                            setShowToolsSheet(false);
                                            unlockMobileAudio();
                                            if (latestRelativeMsg) speakRelativeSegments(latestRelativeMsg.text, latestRelativeMsg.emotion || relativeEmotion, activePersona);
                                        }}
                                        className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-cyan-200 text-xs font-bold flex items-center justify-center gap-1.5 disabled:opacity-40"
                                    >
                                        <Icon name="RotateCcw" size={15} /> ฟังเสียงญาติซ้ำ
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => { setShowToolsSheet(false); setShowChartModal(true); }}
                                        className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-amber-200 text-xs font-bold flex items-center justify-center gap-1.5"
                                    >
                                        <Icon name="ClipboardList" size={15} /> ดูแฟ้มส่งเวร
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => { setShowToolsSheet(false); setShowHistoryDrawer(true); }}
                                        className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-sky-100 text-xs font-bold flex items-center justify-center gap-1.5"
                                    >
                                        <Icon name="History" size={15} /> ย้อนเวลา (Rewind)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => { setShowToolsSheet(false); setDecompressSec(15); setShowDecompressModal(true); }}
                                        className="touch-target px-3 py-3 rounded-2xl bg-white/[0.08] border border-white/15 text-emerald-200 text-xs font-bold flex items-center justify-center gap-1.5"
                                    >
                                        <Icon name="Wind" size={15} /> พักหายใจ 15 วิ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* In-Room Quick Case Chart Modal */}
                    {showChartModal && (
                        <div onClick={() => setShowChartModal(false)} className="fixed inset-0 z-[126] bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div onClick={(e) => e.stopPropagation()} className="holo-obsidian-card w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom,0px))] space-y-3.5 text-white border-amber-400/35">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-amber-300 uppercase">{activePersona.chart?.ward || 'ICU HANDOVER'}</span>
                                        <h3 className="font-display font-extrabold text-base">แฟ้มส่งเวรผู้ป่วย (อ้างอิงระหว่างคุย)</h3>
                                    </div>
                                    <button type="button" onClick={() => setShowChartModal(false)} className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center">
                                        <Icon name="X" size={17} />
                                    </button>
                                </div>
                                <div className="space-y-2.5 text-xs">
                                    <div className="p-3 rounded-2xl bg-white/[0.06] border border-white/10 space-y-1">
                                        <p className="font-bold text-cyan-200">{activePersona.chart?.patient}</p>
                                        <p className="text-sky-100/90 leading-relaxed">{activePersona.chart?.dx}</p>
                                    </div>
                                    <div className="p-3 rounded-2xl bg-white/[0.06] border border-white/10">
                                        <span className="text-[10px] font-mono text-sky-200/70 block">สัญญาณชีพ ICU</span>
                                        <p className="font-mono font-bold text-emerald-300 mt-0.5">{activePersona.chart?.vitals}</p>
                                    </div>
                                    <div className="p-3 rounded-2xl bg-amber-500/15 border border-amber-400/30 space-y-1">
                                        <p className="font-bold text-amber-200">{activePersona.chart?.waiting}</p>
                                        <p className="text-amber-100/90 leading-relaxed">{activePersona.chart?.handover}</p>
                                    </div>
                                </div>
                                <button type="button" onClick={() => setShowChartModal(false)} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-xs">
                                    กลับเข้าสู่บทสนทนา
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Mindful Decompression 15s Modal */}
                    {showDecompressModal && (
                        <div className="fixed inset-0 z-[130] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="holo-obsidian-card w-full max-w-md rounded-[2rem] p-6 text-center space-y-4 text-white border-emerald-400/40">
                                <span className="font-mono text-[10px] font-bold text-emerald-300 uppercase">MINDFUL DECOMPRESSION</span>
                                <h3 className="font-display font-extrabold text-lg">พักใจและผ่อนลมหายใจ 15 วินาที</h3>
                                <div className="w-24 h-24 rounded-full bg-emerald-500/20 border-2 border-emerald-400/60 flex items-center justify-center mx-auto font-mono text-3xl font-extrabold text-emerald-300">
                                    {decompressSec}
                                </div>
                                <p className="text-xs sm:text-sm text-sky-100/90 leading-relaxed">
                                    {decompressSec > 10 ? 'หายใจเข้าช้าๆ ลึกๆ... วางความตึงเครียดจากบทสนทนาลง' : decompressSec > 5 ? 'กลั้นเบาๆ แล้วค่อยๆ ผ่อนลมหายใจออกยาวๆ...' : 'คุณทำหน้าที่ดูแลครอบครัวผู้ป่วยได้อย่างงดงามแล้วค่ะ'}
                                </p>
                                <button type="button" onClick={() => setShowDecompressModal(false)} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-xs">
                                    {decompressSec > 0 ? 'ปิดหน้าต่าง' : 'พร้อมไปต่อด้วยใจที่เบาสบาย ✓'}
                                </button>
                            </div>
                        </div>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
