        /**
         * แปลงไฟล์เสียง PCM16 Base64 จาก Gemini Neural TTS เป็น WAV Blob URL
         */
        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

        /**
         * แยก Tag อารมณ์, คำแนะนำชี้นำ [COACH_TIP] และ Smart Suggestions ออกจากคำตอบของ AI Relative
         */
        function parseAiResponse(rawText) {
            const text = String(rawText || '').trim();
            const suggestions = [];
            const sugRegex = /\[SUGGESTION\s*\d+\]\s*([^\n]+)/gi;
            let match;
            while ((match = sugRegex.exec(text)) !== null) {
                if (match[1]?.trim()) suggestions.push(match[1].trim());
            }

            let coachTip = '';
            const tipMatch = text.match(/\[COACH_TIP\]\s*([^\n]+)/i);
            if (tipMatch && tipMatch[1]) {
                coachTip = tipMatch[1].trim();
            }

            let cleaned = text
                .replace(/\[SUGGESTION\s*\d+\]\s*[^\n]+/gi, '')
                .replace(/\[COACH_TIP\]\s*[^\n]+/gi, '')
                .trim();

            let emotion = 'SAD';
            const emoMatch = cleaned.match(/^\[(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]\s*/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                cleaned = cleaned.replace(emoMatch[0], '').trim();
            }
            cleaned = cleaned.replace(/^\[[^\]]{1,25}\]\s*/, '').trim();

            return {
                emotion: EMOTION_META[emotion] ? emotion : 'SAD',
                text: cleaned || '...',
                coachTip,
                suggestions: suggestions.slice(0, 2)
            };
        }

        /**
         * ระบบตอบกลับญาติผู้เสียชีวิตแบบสำรอง (ทำงานอัตโนมัติเมื่อ Offline หรือรอ Gemini API)
         */
        function generateOfflineRelativeReply(userMsg, mode, turnCount) {
            const msg = String(userMsg || '').toLowerCase();
            const isEn = mode.language === 'en';

            if (isEn) {
                if (msg.match(/organ|donat|transplant|gift/)) {
                    return `[HESITANT] Organ donation... I never imagined facing a decision like this today. If we think about it, will their body still be treated with dignity and look peaceful? And do we have quiet time to talk as a family first?
[COACH_TIP] Great step! Next, apply Decoupling & Dignity: assure zero pressure, offer private family time, and explain respectful body care.
[SUGGESTION 1] Absolutely—there is no rush at all. Our surgical team treats every patient with the utmost care and dignity, and we will give you private time here.
[SUGGESTION 2] You do not have to decide right now. Please take quiet time together, and I will gladly answer any question whenever you are ready.`;
                }
                if (msg.match(/ventilator|brainstem|brain death|permanent|machine/)) {
                    return `[SAD] So the machine is the only thing keeping their chest moving... and they truly won't wake up again? It hurts so much to hear that, even though I appreciate you telling me honestly.
[COACH_TIP] Well explained! Now pause to validate their grief and offer quiet support before discussing next steps.
[SUGGESTION 1] I am so sorry. Yes, the ventilator is supporting breathing while the brain has permanently stopped working. I am right here with you—please take a moment.
[SUGGESTION 2] I hear how heartbreaking this is. Take all the time you need in this private room, and let me know if any medical detail is still unclear.`;
                }
                if (turnCount <= 1) {
                    return `[CONFUSED] Thank you for telling me who you are, but I still don't understand... When I saw them earlier, their hand felt warm and the monitor showed a heartbeat—how can it be brain death?
[COACH_TIP] Next principle: validate why warmth & heartbeat feel confusing, then explain ventilator/medication support vs. irreversible brain death.
[SUGGESTION 1] I understand why that feels impossible to believe. The ventilator and medications keep the heart beating and body warm temporarily, while brain stem tests confirmed permanent loss of brain function.
[SUGGESTION 2] Seeing warmth and a heartbeat makes this shock even harder. May I gently explain how the ventilator works compared with brain death?`;
                }
                return `[CALM] Thank you for speaking so gently with me in this quiet room. I feel calmer now... What happens next, and what options does our family have?
[COACH_TIP] You built strong trust! You can reassure zero-pressure family time and tap "Evaluate" whenever ready to unlock Post-test.
[SUGGESTION 1] Right now our priority is supporting your family. Whenever you feel ready, I can explain the next steps clearly and without any pressure.
[SUGGESTION 2] Take a breath—there is no hurry. Would you like some quiet time first, or would you like me to walk you through the next care steps?`;
            }

            if (msg.match(/บริจาค|อวัยวะ|ต่อชีวิต|บุญ|กุศล/)) {
                return `[HESITANT] เรื่องบริจาคอวัยวะเหรอคะ... ยอมรับตรงๆ ว่าตอนนี้ยังตกใจและทำใจไม่ทันเลยค่ะ กลัวว่าร่างของเขาจะไม่เรียบร้อย แล้วครอบครัวเราขอเวลาปรึกษากันก่อนได้ไหมคะ?
[COACH_TIP] หลักการถัดไป (Decoupling & Dignity): ยืนยันว่าไม่ต้องรีบตัดสินใจ ให้เวลาครอบครัวปรึกษากัน และรับรองการดูแลตกแต่งร่างอย่างประณีตค่ะ
[SUGGESTION 1] ได้แน่นอนค่ะ ไม่ต้องรีบตัดสินใจเลยนะคะ ทีมศัลยแพทย์จะดูแลผ่าตัดและตกแต่งร่างอย่างประณีตให้เกียรติสูงสุด ดิฉันขอให้เวลาครอบครัวปรึกษากันในห้องรับรองนี้ก่อนค่ะ
[SUGGESTION 2] เข้าใจความกังวลเลยค่ะ ไม่ว่าจะตัดสินใจอย่างไรทีมจะดูแลอย่างเต็มที่เสมอ ขอเชิญครอบครัวคุยกันตามสบาย หากมีคำถามเพิ่มเติมเรียกดิฉันได้ตลอดนะคะ`;
            }
            if (msg.match(/เครื่องช่วยหายใจ|สมองตาย|ก้านสมอง|ถาวร|หยุดทำงาน/)) {
                return `[SAD] แสดงว่าที่เห็นหน้าอกขยับและตัวอุ่นอยู่ เป็นเพราะเครื่องช่วยหายใจกับยาใช่ไหมคะ... หมายความว่าเขาจะไม่ฟื้นกลับมาคุยกับพวกเราอีกแล้วจริงๆ เหรอคะ...
[COACH_TIP] อธิบายข้อมูลได้ชัดเจนดีมากค่ะ! ขั้นต่อไปให้แสดงความเสียใจ รับฟังเงียบๆ และให้เวลาครอบครัวได้ตั้งหลักโดยไม่เร่งรัดนะคะ
[SUGGESTION 1] ดิฉันเสียใจด้วยจริงๆ ค่ะ ใช่ค่ะ เครื่องช่วยหายใจและยาช่วยพยุงชั่วคราว แต่ก้านสมองหยุดทำงานถาวรแล้ว ขอให้ครอบครัวค่อยๆ ทำใจในห้องรับรองนี้ได้เลยนะคะ ดิฉันอยู่ตรงนี้คอยรับฟังค่ะ
[SUGGESTION 2] เข้าใจความเจ็บปวดของครอบครัวมากค่ะ ตอนนี้ไม่ต้องรีบอะไรเลยนะคะ หากมีส่วนไหนที่ยังสงสัยเกี่ยวกับผลตรวจ ดิฉันยินดีค่อยๆ อธิบายให้ชัดเจนค่ะ`;
            }
            if (turnCount <= 1) {
                return `[CONFUSED] ขอบคุณนะคะที่แนะนำตัว... แต่เมื่อกี้เข้าไปจับมือ ตัวเขายังอุ่นอยู่เลย หน้าจอก็ยังมีชีพจรเต้นอยู่ จะบอกว่าสมองตายได้ยังไงคะ?
[COACH_TIP] หลักการถัดไป (Empathy + Clinical Facts): ยอมรับความสับสนของญาติก่อน แล้วค่อยๆ อธิบายว่าเครื่องช่วยหายใจและยาช่วยพยุงชั่วคราว แต่ก้านสมองหยุดทำงานถาวรแล้วค่ะ
[SUGGESTION 1] ดิฉันเข้าใจความรู้สึกเลยค่ะ การเห็นตัวอุ่นและชีพจรเต้นทำให้ทำใจเชื่อได้ยากมาก แต่ชีพจรและลมหายใจเกิดจากเครื่องช่วยหายใจกับยาที่พยุงไว้ชั่วคราว ส่วนสมองได้รับการตรวจยืนยันตามเกณฑ์แล้วว่าหยุดทำงานถาวรค่ะ
[SUGGESTION 2] เป็นเรื่องธรรมดามากค่ะที่จะรู้สึกสับสนเมื่อเห็นสัญญาณชีพบนจอ ขออนุญาตค่อยๆ อธิบายความแตกต่างระหว่างการทำงานของเครื่องช่วยหายใจกับภาวะสมองตายนะคะ`;
            }
            return `[CALM] ขอบคุณนะคะที่ค่อยๆ อธิบายด้วยน้ำเสียงที่นุ่มนวลและพาคุยในห้องรับรองที่เงียบสงบแบบนี้... ตอนนี้ใจนิ่งขึ้นมากแล้วค่ะ แล้วขั้นตอนต่อไปครอบครัวต้องเตรียมตัวยังไงบ้างคะ?
[COACH_TIP] ยอดเยี่ยมเลยค่ะ! คุณสื่อสารได้อบอุ่นและครบหลักการแล้ว สามารถสรุปให้เวลาครอบครัวและกดปุ่ม "จบ & ประเมินผล" ด้านบนเพื่อปลดล็อก Post-test ได้เลยค่ะ
[SUGGESTION 1] สิ่งสำคัญที่สุดตอนนี้คือดูแลจิตใจของครอบครัวค่ะ หากพร้อมแล้วดิฉันขออนุญาตอธิบายขั้นตอนการดูแลต่อจากนี้และทางเลือกต่างๆ อย่างตรงไปตรงมา โดยไม่มีการเร่งรัดใดๆ นะคะ
[SUGGESTION 2] ขอให้ครอบครัวพักหายใจก่อนได้เลยค่ะ ต้องการเวลาอยู่ด้วยกันเงียบๆ สักครู่ หรือให้ดิฉันเล่าขั้นตอนต่อไปให้ฟังก่อนดีคะ`;
        }

        /**
         * ประเมินผล 2 มิติ (เน้นเข้าใจหลักการ ไม่ยากหรือกดดันเกินไป — เกณฑ์ผ่าน ≥ 60)
         */
        function evaluateDualDimensions(chatLog, mode) {
            const isEn = mode.language === 'en';
            const userMsgs = chatLog.filter(m => m.sender === 'user');
            const userTexts = userMsgs.map(m => m.text || '').join(' ').toLowerCase();

            let infoScore = 68;
            let empathyScore = 68;
            const infoFeedback = [];
            const empathyFeedback = [];

            // มิติที่ 1: ความถูกต้องของข้อมูล (Clinical & Setting Accuracy)
            if (userTexts.match(/แนะนำ|ชื่อ|พยาบาล|เจ้าหน้าที่|ผู้ประสาน|ห้องรับรอง|ห้องส่วนตัว|เงียบ|name|nurse|coordinator|private room|quiet room/)) {
                infoScore += 10;
                infoFeedback.push(isEn
                    ? 'Introduced your role clearly and honored the calm, private consultation room setting.'
                    : 'แนะนำบทบาทผู้ให้ข้อมูลได้ชัดเจนและสื่อสารสอดคล้องกับบรรยากาศห้องรับรองที่เป็นส่วนตัว');
            } else {
                infoFeedback.push(isEn
                    ? 'Tip: Introduce your name/role clearly at the start in the private consultation room.'
                    : 'ข้อแนะนำเสริม: เริ่มต้นด้วยการแนะนำชื่อ-บทบาทของคุณในห้องรับรอง จะช่วยลดความกังวลของญาติได้เร็วขึ้น');
            }

            if (userTexts.match(/สมองตาย|ก้านสมอง|เครื่องช่วยหายใจ|ยาพยุง|ถาวร|หยุดทำงาน|brain death|brainstem|ventilator|medication|permanent/)) {
                infoScore += 12;
                infoFeedback.push(isEn
                    ? 'Clearly explained ventilator/medication support vs. irreversible brain death.'
                    : 'อธิบายความแตกต่างระหว่างเครื่องช่วยหายใจ/ยาพยุงชีพกับภาวะสมองตายถาวรได้ถูกต้องชัดเจน');
            } else {
                infoFeedback.push(isEn
                    ? 'Tip: Gently clarify that the ventilator supports breathing temporarily while brain death is permanent.'
                    : 'ข้อแนะนำเสริม: ย้ำให้ญาติเข้าใจง่ายๆ ว่าเครื่องช่วยหายใจช่วยพยุงชั่วคราว แต่ก้านสมองหยุดทำงานถาวรแล้ว');
            }

            if (userTexts.match(/ประณีต|ให้เกียรติ|เย็บแผล|ตกแต่ง|ไม่รีบ|ปรึกษา|ตัดสินใจ|dignity|respect|neatly|peaceful|no rush|time|decide/)) {
                infoScore += 8;
                infoFeedback.push(isEn
                    ? 'Reassured respectful body care and supported non-coercive family decision-making.'
                    : 'ให้ข้อมูลเรื่องการดูแลเกียรติร่างผู้เสียชีวิตและเปิดโอกาสให้ครอบครัวปรึกษากันโดยไม่เร่งรัด');
            } else {
                infoFeedback.push(isEn
                    ? 'Tip: Reassure respectful surgical care and offer zero-pressure family time.'
                    : 'ข้อแนะนำเสริม: เสริมความมั่นใจเรื่องการดูแลตกแต่งร่างอย่างประณีตและไม่เร่งรัดการตัดสินใจ');
            }

            // มิติที่ 2: การรับรู้อารมณ์ร่วม (Emotional Resonance & Empathy)
            if (userTexts.match(/เสียใจ|เข้าใจ|ตกใจ|เจ็บปวด|สับสน|ทำใจยาก|ห่วง|sorry|understand|heartbreaking|overwhelming|painful|hard|confusing/)) {
                empathyScore += 16;
                empathyFeedback.push(isEn
                    ? 'Recognized and validated the relative’s grief, shock, and confusion warmly.'
                    : 'รับรู้และสะท้อนอารมณ์เสียใจและสับสนของญาติผู้เสียชีวิตได้อย่างอบอุ่นและเข้าอกเข้าใจ');
            } else {
                empathyFeedback.push(isEn
                    ? 'Tip: Acknowledge the relative’s grief and shock before moving to clinical explanations.'
                    : 'ข้อแนะนำเสริม: สะท้อนความเสียใจหรือความตกใจของญาติก่อนให้ข้อมูลทางการแพทย์ จะช่วยให้ญาติเปิดรับมากขึ้น');
            }

            if (userTexts.match(/ค่อยๆ|รับฟัง|อยู่ตรงนี้|สบายใจ|ไม่กดดัน|ไม่เร่ง|gently|listen|here with you|calm|take your time|support/)) {
                empathyScore += 12;
                empathyFeedback.push(isEn
                    ? 'Maintained a calm, supportive pace that helped the relative feel emotionally safe.'
                    : 'ใช้จังหวะการสื่อสารที่อ่อนโยน ไม่เร่งรัด และสร้างพื้นที่ปลอดภัยทางใจให้ครอบครัว');
            } else {
                empathyFeedback.push(isEn
                    ? 'Tip: Reassure the relative that you are here to listen without rushing them.'
                    : 'ข้อแนะนำเสริม: เพิ่มถ้อยคำที่แสดงความพร้อมรับฟัง เช่น "ไม่ต้องรีบนะคะ ดิฉันอยู่ตรงนี้คอยรับฟังค่ะ"');
            }

            if (userMsgs.length >= 2) {
                infoScore += 4;
                empathyScore += 4;
            }

            infoScore = Math.min(98, Math.max(60, infoScore));
            empathyScore = Math.min(98, Math.max(60, empathyScore));
            const totalScore = Math.round((infoScore + empathyScore) / 2);
            const passed = totalScore >= 60;

            return {
                totalScore,
                infoScore,
                empathyScore,
                passed,
                infoFeedback,
                empathyFeedback,
                summaryText: isEn
                    ? `Evaluation Complete: Overall ${totalScore}/100 (Clinical Info ${infoScore}/100 • Emotional Empathy ${empathyScore}/100).`
                    : `สรุปผลประเมิน: คะแนนรวม ${totalScore}/100 (ความถูกต้องของข้อมูล ${infoScore}/100 • การรับรู้อารมณ์ร่วม ${empathyScore}/100)`
            };
        }

        // ============================================================================
        // 4. ERROR BOUNDARY & SHARED UI ATOMS (NO alert() / confirm())
        // ============================================================================
        class LabErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, err: null };
            }
            static getDerivedStateFromError(err) {
                return { hasError: true, err };
            }
            componentDidCatch(err, info) {
                console.error('AI Skill Lab ErrorBoundary:', err, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6 bg-obsidian-950 text-slate-100">
                            <div className="lab-glass max-w-md w-full rounded-3xl p-6 text-center space-y-4 border-rose-500/40">
                                <h2 className="font-display font-bold text-lg text-rose-300">พบข้อผิดพลาดใน AI Skill Lab</h2>
                                <p className="text-xs font-mono text-rose-200 bg-obsidian-900 p-3 rounded-xl overflow-auto">
                                    {String(this.state.err?.message || this.state.err)}
                                </p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="touch-target w-full py-3 rounded-2xl bg-biotech-500 text-slate-950 font-display font-bold text-sm"
                                >
                                    รีเฟรชหน้าห้องฝึก
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[120] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-xl flex items-center gap-2.5 text-xs sm:text-sm font-bold ${
                        toast.type === 'error'
                            ? 'bg-rose-950/95 border-rose-500/40 text-rose-200'
                            : toast.type === 'info'
                                ? 'bg-sky-950/95 border-cyber-500/40 text-cyber-200'
                                : 'bg-emerald-950/95 border-biotech-500/40 text-biotech-200'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Info' : 'CheckCircle2'} size={17} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ dialog, onClose }) {
            if (!dialog.open) return null;
            return (
                <div className="fixed inset-0 z-[110] bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="w-full sm:max-w-md bg-obsidian-900 border border-slate-700/80 rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] shadow-2xl space-y-4">
                        <div className="flex items-start gap-3">
                            <div className="w-11 h-11 rounded-2xl bg-amber-500/15 text-amber-300 border border-amber-400/30 flex items-center justify-center shrink-0">
                                <Icon name="HelpCircle" size={22} />
                            </div>
                            <div>
                                <h3 className="font-display font-bold text-lg text-white">{dialog.title}</h3>
                                <p className="text-sm text-slate-300 mt-1 leading-relaxed">{dialog.message}</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                className="touch-target py-3 rounded-2xl bg-white/10 hover:bg-white/15 text-slate-200 font-display font-semibold text-sm"
                            >
                                ยกเลิก
                            </button>
                            <button
                                type="button"
                                onClick={() => {
                                    const fn = dialog.onConfirm;
                                    onClose();
                                    if (fn) fn();
                                }}
                                className="touch-target py-3 rounded-2xl bg-biotech-500 hover:bg-biotech-400 text-slate-950 font-display font-bold text-sm"
                            >
                                {dialog.confirmText || 'ยืนยัน'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

                    id: 'guest_learner',
                    license: 'GUEST-2027',
                    name: 'ผู้เรียน rjcloud.organ',
                    position: 'พยาบาลผู้ประสานงาน / บุคลากรทางการแพทย์',
                    hospital: 'เครือข่าย rjcloud.organ'
                };
            });

            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [isCloudReady, setIsCloudReady] = useState(false);
            const [previewBarOpen, setPreviewBarOpen] = useState(false);
            // Screen & Training States
            const [selectedMode, setSelectedMode] = useState(null); // LAB_MODES[0] | LAB_MODES[1]
            const [trainingTrack, setTrainingTrack] = useState('full_sim'); // micro_drill | full_sim
            const [phase, setPhase] = useState('menu'); // menu | video_intro | negotiating | evaluating | debrief
            const [drillIndex, setDrillIndex] = useState(0);
            const [showGuideBanner, setShowGuideBanner] = useState(true);
            const [showHoloExpandedMobile, setShowHoloExpandedMobile] = useState(false);
            const [showVideoModal, setShowVideoModal] = useState(false);

            // Conversation & Emotion States
            const [messages, setMessages] = useState([]);
            const [relativeEmotion, setRelativeEmotion] = useState('CONFUSED');
            const [aiCoachTip, setAiCoachTip] = useState('');
            const [smartSuggestions, setSmartSuggestions] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const [evalResult, setEvalResult] = useState(null);

            // Voice & Microphone States (ปิดสนิททุก MediaStreamTrack เมื่อหยุด)
            const [voiceEnabled, setVoiceEnabled] = useState(true);
            const [voiceFirstMode, setVoiceFirstMode] = useState(false);
            const [isAiSpeaking, setIsAiSpeaking] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [micLevel, setMicLevel] = useState(0);

            // Toast & Confirm Modal
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', confirmText: 'ยืนยัน', onConfirm: null });

            // Refs
            const userRef = useRef(user);
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const speechRecRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const audioCtxRef = useRef(null);
            const vadRafRef = useRef(null);
            const chatEndRef = useRef(null);

            useEffect(() => { userRef.current = user; }, [user]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            // ยืนยันว่า Mount สำเร็จ (ปิด Error Guard)
            useEffect(() => {
                const el = document.getElementById('lab-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // เชื่อมต่อ Firebase (Anonymous Auth + ซิงค์ appsScriptUrl และสถานะผู้เรียนล่าสุด)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let unsubSettings = null;

                signInAnonymously(fbAuth).catch(err => console.warn('Anon auth warning:', err));

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!fbUser) return;
                    setIsCloudReady(true);

                    // ซิงค์สถานะล่าสุดของผู้เรียนจาก Cloud (เช่น progress >= 80%)
                    const cur = userRef.current;
                    if (!isAdminPreview && cur?.id && !String(cur.id).startsWith('guest_') && !String(cur.id).startsWith('demo_') && !String(cur.id).startsWith('admin_preview_')) {
                        try {
                            const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(cur.id)));
                            if (snap.exists()) {
                                const cloudData = snap.data();
                                const merged = {
                                    ...cur,
                                    ...cloudData,
                                    progress: Math.max(cur.progress || 0, cloudData.progress || 0)
                                };
                                setUser(merged);
                                const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                                localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                            }
                        } catch (_) {}
                    }

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (snap.exists() && snap.data()?.appsScriptUrl) {
                                setAppsScriptUrl(snap.data().appsScriptUrl);
                            }
                        },
                        () => {}
                    );
                });

                return () => {
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                };
            }, [isAdminPreview]);

            // หยุดเสียง AI และคืน Memory ของ Blob URL อย่างสะอาด
            const stopAiVoice = useCallback(() => {
                if (audioRef.current) {
                    try { audioRef.current.pause(); } catch (_) {}
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsAiSpeaking(false);
            }, []);

            // ปิดไมโครโฟน VAD + SpeechRecognition + MediaStreamTrack สนิท 100%
            const stopMicCompletely = useCallback(() => {
                if (vadRafRef.current) {
                    cancelAnimationFrame(vadRafRef.current);
                    vadRafRef.current = null;
                }
                if (speechRecRef.current) {
                    try { speechRecRef.current.onend = null; speechRecRef.current.abort(); } catch (_) {}
                    speechRecRef.current = null;
                }
                if (mediaStreamRef.current) {
                    mediaStreamRef.current.getTracks().forEach(track => {
                        try { track.stop(); } catch (_) {}
                    });
                    mediaStreamRef.current = null;
                }
                if (audioCtxRef.current) {
                    try { audioCtxRef.current.close(); } catch (_) {}
                    audioCtxRef.current = null;
                }
                setIsListening(false);
                setMicLevel(0);
            }, []);

            useEffect(() => {
                return () => {
                    stopAiVoice();
                    stopMicCompletely();
                };
            }, [stopAiVoice, stopMicCompletely]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isAiTyping]);

            // เรียก Google Apps Script Proxy
            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'offline' };
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            }, [appsScriptUrl]);

            // สังเคราะห์เสียงพากย์ของญาติผู้เสียชีวิต (Gemini Neural TTS -> Fallback Web Speech API)
            const speakRelativeText = useCallback(async (text, mode, onDone = null) => {
                stopAiVoice();
                if (!voiceEnabled || !text) {
                    if (onDone) onDone();
                    return;
                }

                const cleanText = String(text).replace(/[*#[\]]/g, '').trim();
                if (!cleanText) {
                    if (onDone) onDone();
                    return;
                }

                setIsAiSpeaking(true);

                if (appsScriptUrl) {
                    const ttsRes = await callAppsScript({
                        action: 'callGeminiTTS',
                        text: cleanText,
                        voiceName: mode?.voiceName || 'Aoede'
                    });
                    if (ttsRes?.status === 'success' && ttsRes.inlineData?.data) {
                        try {
                            const rate = parseInt(ttsRes.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const wavUrl = pcm16ToWavUrl(ttsRes.inlineData.data, rate);
                            audioUrlRef.current = wavUrl;
                            const audio = new Audio(wavUrl);
                            audioRef.current = audio;
                            audio.onended = () => {
                                stopAiVoice();
                                if (onDone) onDone();
                            };
                            audio.onerror = () => {
                                stopAiVoice();
                                if (onDone) onDone();
                            };
                            await audio.play();
                            return;
                        } catch (err) {
                            console.warn('Audio playback error, falling back to browser speech:', err);
                            stopAiVoice();
                        }
                    }
                }

                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = mode?.language === 'en' ? 'en-US' : 'th-TH';
                        utter.rate = 0.98;
                        utter.onend = () => {
                            setIsAiSpeaking(false);
                            if (onDone) onDone();
                        };
                        utter.onerror = () => {
                            setIsAiSpeaking(false);
                            if (onDone) onDone();
                        };
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }

                setIsAiSpeaking(false);
                if (onDone) onDone();
            }, [voiceEnabled, appsScriptUrl, callAppsScript, stopAiVoice]);

            // เปิด/ปิดไมโครโฟนพูดจริง (SpeechRecognition + Visual Volume Meter)
            const toggleMicrophone = async () => {
                if (isListening) {
                    stopMicCompletely();
                    return;
                }

                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง กรุณาพิมพ์ข้อความในช่องด้านล่างค่ะ', 'error');
                    return;
                }

                stopAiVoice();

                try {
                    if (navigator.mediaDevices?.getUserMedia) {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: { echoCancellation: true, noiseSuppression: true }
                        });
                        mediaStreamRef.current = stream;
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) {
                            const ctx = new AudioCtx();
                            audioCtxRef.current = ctx;
                            const src = ctx.createMediaStreamSource(stream);
                            const analyser = ctx.createAnalyser();
                            analyser.fftSize = 256;
                            src.connect(analyser);
                            const dataArr = new Uint8Array(analyser.frequencyBinCount);
                            const updateMeter = () => {
                                analyser.getByteFrequencyData(dataArr);
                                const avg = dataArr.reduce((a, b) => a + b, 0) / dataArr.length;
                                setMicLevel(Math.min(100, Math.round(avg * 1.4)));
                                vadRafRef.current = requestAnimationFrame(updateMeter);
                            };
                            updateMeter();
                        }
                    }

                    const rec = new SR();
                    rec.lang = selectedMode?.language === 'en' ? 'en-US' : 'th-TH';
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onresult = (event) => {
                        let transcript = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            transcript += event.results[i][0].transcript;
                        }
                        setChatInput(transcript);
                    };
                    rec.onerror = () => stopMicCompletely();
                    rec.onend = () => stopMicCompletely();
                    speechRecRef.current = rec;
                    rec.start();
                    setIsListening(true);
                } catch (err) {
                    console.warn('Mic permission denied or error:', err);
                    stopMicCompletely();
                    showToast('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตสิทธิ์ไมค์บนเบราว์เซอร์ค่ะ', 'error');
                }
            };

            // เข้าสู่ห้องรับรองจำลองสถานการณ์
            const enterConsultationRoom = useCallback((mode, track) => {
                stopAiVoice();
                stopMicCompletely();

                const isEn = mode.language === 'en';
                setSelectedMode(mode);
                setTrainingTrack(track);
                setPhase('negotiating');
                setEvalResult(null);
                setDrillIndex(0);
                setShowGuideBanner(true);

                if (track === 'micro_drill') {
                    const drills = GUIDED_DRILLS[isEn ? 'en' : 'th'];
                    const first = drills[0];
                    setRelativeEmotion(first.emotion);
                    setAiCoachTip(first.focusTheory);
                    setMessages([
                        {
                            id: `ctx-${Date.now()}`,
                            sender: 'system',
                            title: first.stepTitle,
                            text: first.context
                        },
                        {
                            id: `ai-open-${Date.now() + 1}`,
                            sender: 'ai',
                            emotion: first.emotion,
                            speakerName: mode.relativeName,
                            text: first.relativeLine,
                            revealed: true
                        }
                    ]);
                    setSmartSuggestions([
                        first.sampleReply,
                        isEn
                            ? 'Hello, I am a coordinator on the care team. I am truly sorry for your distress—let us talk calmly in this private room.'
                            : 'สวัสดีค่ะ ดิฉันเป็นเจ้าหน้าที่ผู้ประสานงานดูแลครอบครัวค่ะ เข้าใจความกังวลใจอย่างมากเลยนะคะ ขอเชิญคุยกันอย่างสบายใจในห้องรับรองนี้ค่ะ'
                    ]);
                    speakRelativeText(first.relativeLine, mode);
                    return;
                }

                setRelativeEmotion(mode.openingEmotion || 'CONFUSED');
                setAiCoachTip(isEn
                    ? 'Step 1 (Setting & Role): Warmly introduce your name/role in this private consultation room and acknowledge their worry. You can tap a guided reply below or speak/type in your own words.'
                    : 'คำแนะนำเริ่มต้น (Setting & Role): ลองแนะนำชื่อ-บทบาทของคุณอย่างสุภาพในห้องรับรอง และแสดงความเข้าอกเข้าใจญาติ สามารถแตะเลือก "แนวทางคำพูด" ด้านล่างเพื่อฝึกตามหลักการได้เลยค่ะ');
                const openId = `ai-open-${Date.now()}`;
                setMessages([
                    {
                        id: `ctx-${Date.now()}`,
                        sender: 'system',
                        title: isEn ? 'Consultation Room Briefing' : 'บริบทห้องรับรองผู้เสียชีวิต',
                        text: mode.briefingText
                    },
                    {
                        id: openId,
                        sender: 'ai',
                        emotion: mode.openingEmotion || 'CONFUSED',
                        speakerName: mode.relativeName,
                        text: mode.openingLine,
                        revealed: !voiceFirstMode
                    }
                ]);

                setSmartSuggestions(isEn ? [
                    'Hello, my name is Nurse Joy, a clinical coordinator on the care team. I am so sorry for what happened—thank you for coming into this quiet room.',
                    'I know this must feel overwhelming. Before I share the medical update, may I ask what the doctors have explained to you so far?'
                ] : [
                    'สวัสดีค่ะ ดิฉันชื่อพยาบาลใจดี เป็นพยาบาลผู้ประสานงานจากทีมดูแลค่ะ ขอแสดงความเสียใจกับเหตุการณ์ที่เกิดขึ้นนะคะ ยินดีที่ได้คุยกันในห้องรับรองที่เป็นส่วนตัวนี้ค่ะ',
                    'เข้าใจเลยค่ะว่าตอนนี้ครอบครัวกำลังตกใจและเป็นห่วงมาก ก่อนอื่นขออนุญาตถามเพื่อความเข้าใจตรงกันว่า คุณหมอได้แจ้งอาการให้ทราบบ้างแล้วหรือยังคะ'
                ]);

                speakRelativeText(mode.openingLine, mode, () => {
                    setMessages(prev => prev.map(m => (m.id === openId ? { ...m, revealed: true } : m)));
                });
            }, [stopAiVoice, stopMicCompletely, speakRelativeText, voiceFirstMode]);

            const handleSelectMode = (mode, track) => {
                stopAiVoice();
                stopMicCompletely();
                setSelectedMode(mode);
                setTrainingTrack(track);
                setMessages([]);
                setEvalResult(null);
                if (track === 'full_sim') {
                    setPhase('video_intro');
                } else {
                    enterConsultationRoom(mode, track);
                }
            };

            // ส่งคำพูดของผู้เรียนไปยังญาติผู้เสียชีวิต (AI)
            const handleSendMessage = async (e, presetReply = null) => {
                if (e) e.preventDefault();
                if (!selectedMode || phase !== 'negotiating' || isAiTyping) return;

                const learnerText = String(presetReply ?? chatInput).trim();
                if (!learnerText) return;

                stopAiVoice();
                if (isListening) stopMicCompletely();

                setChatInput('');
                setSmartSuggestions([]);

                const userMsgObj = {
                    id: `u-${Date.now()}`,
                    sender: 'user',
                    speakerName: selectedMode.language === 'en' ? 'You (Communicator)' : 'คุณ (ผู้ให้ข้อมูลญาติ)',
                    text: learnerText
                };

                const nextMessages = [...messages, userMsgObj];
                setMessages(nextMessages);

                // --- โหมดฝึกย่อย 3 ด่าน (Guided Micro-Drill) ---
                if (trainingTrack === 'micro_drill') {
                    const drills = GUIDED_DRILLS[selectedMode.language === 'en' ? 'en' : 'th'];
                    const curDrill = drills[drillIndex];
                    const nextIdx = drillIndex + 1;
                    const hasNext = nextIdx < drills.length;

                    const coachMsg = {
                        id: `coach-${Date.now()}`,
                        sender: 'system',
                        title: selectedMode.language === 'en' ? `Completed ${curDrill.stepTitle}` : `ผ่านการซ้อม ${curDrill.stepTitle}`,
                        text: selectedMode.language === 'en'
                            ? `Key points practiced: ${curDrill.checkpoints.join(' • ')}`
                            : `จุดสำคัญที่ฝึกในด่านนี้: ${curDrill.checkpoints.join(' • ')}`
                    };

                    if (hasNext) {
                        const nextDrill = drills[nextIdx];
                        setDrillIndex(nextIdx);
                        setRelativeEmotion(nextDrill.emotion);
                        setAiCoachTip(nextDrill.focusTheory);
                        const aiNextMsg = {
                            id: `ai-drill-${Date.now() + 1}`,
                            sender: 'ai',
                            emotion: nextDrill.emotion,
                            speakerName: selectedMode.relativeName,
                            text: nextDrill.relativeLine,
                            revealed: true
                        };
                        setMessages([...nextMessages, coachMsg, {
                            id: `ctx-next-${Date.now()}`,
                            sender: 'system',
                            title: nextDrill.stepTitle,
                            text: nextDrill.context
                        }, aiNextMsg]);
                        setSmartSuggestions([
                            nextDrill.sampleReply,
                            selectedMode.language === 'en'
                                ? 'I hear how deeply painful this is. Please take your time and ask me anything.'
                                : 'ดิฉันเข้าใจความรู้สึกของครอบครัวอย่างมากเลยค่ะ ไม่ต้องรีบนะคะ ค่อยๆ สอบถามได้ทุกเรื่องเลยค่ะ'
                        ]);
                        speakRelativeText(nextDrill.relativeLine, selectedMode);
                    } else {
                        setAiCoachTip(selectedMode.language === 'en'
                            ? 'Well done! You completed all 3 guided principles. Tap "Evaluate" above to unlock Post-test!'
                            : 'เก่งมากค่ะ! ฝึกครบทั้ง 3 หลักการแล้ว กดปุ่ม "จบ & ประเมินผล" ด้านบนเพื่อรับผลและปลดล็อก Post-test ได้เลยค่ะ');
                        setMessages([...nextMessages, coachMsg, {
                            id: `drill-done-${Date.now() + 1}`,
                            sender: 'system',
                            title: selectedMode.language === 'en' ? 'All 3 Drills Completed!' : 'ฝึกปฏิบัติย่อยครบทั้ง 3 ด่านแล้วค่ะ 🎉',
                            text: selectedMode.language === 'en'
                                ? 'Tap "Evaluate" above to review your Information Accuracy & Emotional Empathy scores and unlock Post-test.'
                                : 'สามารถกดปุ่ม "จบ & ประเมินผล" ด้านบนเพื่อดูคะแนน 2 มิติ (ข้อมูลถูกต้อง + การรับรู้อารมณ์ร่วม) และปลดล็อกแบบทดสอบ Post-test ได้เลยค่ะ'
                        }]);
                    }
                    return;
                }

                // --- โหมดสถานการณ์จำลองเต็มรูปแบบ (Full Simulation) ---
                setIsAiTyping(true);
                const turnCount = nextMessages.filter(m => m.sender === 'user').length;
                const historyText = nextMessages
                    .filter(m => m.sender !== 'system')
                    .slice(-10)
                    .map(m => `${m.sender === 'user' ? 'Clinical Communicator' : 'Bereaved Relative'}: ${m.text}`)
                    .join('\n');

                const clinicalKnowledge = window.CLINICAL_KNOWLEDGE_BASE || '';
                const suggestionRule = selectedMode.language === 'en'
                    ? `\n\n[SMART SUGGESTIONS]\nAt the end of your response, add 2 short empathetic next-turn suggestions for the learner:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`
                    : `\n\n[SMART SUGGESTIONS]\nต่อท้ายคำตอบของคุณด้วยแนวทางคำพูดที่เหมาะสมสำหรับผู้เรียน (ผู้ให้ข้อมูลญาติ) 2 ข้อ:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`;

                const fullSystemPrompt = `${selectedMode.systemPrompt}\n\n[Reference Clinical Knowledge]\n${clinicalKnowledge}${suggestionRule}\n\nConversation History:\n${historyText}\nClinical Communicator: ${learnerText}\nBereaved Relative (Start with [EMOTION]):`;

                let rawAiReply = '';
                if (appsScriptUrl) {
                    const res = await callAppsScript({
                        action: 'callGemini',
                        prompt: learnerText,
                        systemInstruction: fullSystemPrompt
                    });
                    if (res?.status === 'success' && res.text) {
                        rawAiReply = res.text;
                    } else {
                        showToast('กำลังใช้โหมดสนทนาจำลองสำรอง (รอการเชื่อมต่อ Gemini API)', 'info');
                    }
                }

                if (!rawAiReply) {
                    await new Promise(r => setTimeout(r, 600));
                    rawAiReply = generateOfflineRelativeReply(learnerText, selectedMode, turnCount);
                }

                const parsed = parseAiResponse(rawAiReply);
                const replyId = `ai-${Date.now()}`;
                setRelativeEmotion(parsed.emotion);
                if (parsed.coachTip) setAiCoachTip(parsed.coachTip);
                setMessages(prev => [...prev, {
                    id: replyId,
                    sender: 'ai',
                    emotion: parsed.emotion,
                    speakerName: selectedMode.relativeName,
                    text: parsed.text,
                    revealed: !voiceFirstMode
                }]);
                setSmartSuggestions(parsed.suggestions);
                setIsAiTyping(false);

                speakRelativeText(parsed.text, selectedMode, () => {
                    setMessages(prev => prev.map(m => (m.id === replyId ? { ...m, revealed: true } : m)));
                });
            };

                        score: finalResult.totalScore,
                        infoScore: finalResult.infoScore,
                        empathyScore: finalResult.empathyScore,
                        passed: finalResult.passed,
                        mode: selectedMode.id,
                        track: trainingTrack,
                        timestamp: finalResult.timestamp
                    };

                        ...user,
                        skillLabPassed: Boolean(user.skillLabPassed || finalResult.passed),
                        skillLabHistory: nextHistory
                    };

                    const rawSaved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

                                                        <button
                                                            type="button"
                                                            onClick={() => speakRelativeText(m.text, selectedMode)}
                                                            className="text-[11px] font-semibold text-slate-400 hover:text-cyber-300 inline-flex items-center gap-1"
                                                        >
                                                            <Icon name="Volume2" size={12} /> {isEn ? 'Replay voice' : 'ฟังเสียงซ้ำ'}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {isAiTyping && (
                                        <div className="flex justify-start">
                                            <div className="px-4 py-3 rounded-2xl bg-obsidian-800 border border-slate-700/70 text-xs font-semibold text-cyber-300 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-cyber-400 animate-bounce" />
                                                {isEn ? 'Relative is responding...' : 'ญาติผู้เสียชีวิตกำลังตอบกลับ...'}
                                            </div>
                                        </div>
                                    )}
                                    <div ref={chatEndRef} />
                                </div>

                                {/* Smart Suggestions + Input Dock */}
                                <div className="p-2.5 sm:p-3.5 border-t border-white/10 bg-obsidian-950/90 space-y-2 pb-[calc(0.6rem+env(safe-area-inset-bottom,0px))] shrink-0">
                                    {smartSuggestions.length > 0 && (
                                        <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                                            {smartSuggestions.map((sug, idx) => (
                                                <button
                                                    key={idx}
                                                    type="button"
                                                    onClick={() => handleSendMessage(null, sug)}
                                                    className="shrink-0 max-w-[82vw] sm:max-w-xs text-left px-3 py-2 rounded-xl bg-white/[0.06] hover:bg-biotech-500/20 border border-white/15 hover:border-biotech-400/40 text-[11px] text-slate-200 line-clamp-2 transition-colors"
                                                >
                                                    <span className="text-biotech-300 font-bold mr-1">แนวทาง {idx + 1}:</span>
                                                    {sug}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <form onSubmit={handleSendMessage} className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={toggleMicrophone}
                                            aria-label="พูดด้วยเสียง"
                                            className={`touch-target w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 transition-all relative ${
                                                isListening
                                                    ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/40'
                                                    : 'bg-white/10 hover:bg-white/15 text-slate-200 border border-white/10'
                                            }`}
                                        >
                                            <Icon name={isListening ? 'MicOff' : 'Mic'} size={18} />
                                            {isListening && (
                                                <span
                                                    className="absolute inset-0 rounded-2xl border-2 border-rose-300 pointer-events-none"
                                                    style={{ transform: `scale(${1 + micLevel / 250})`, opacity: 0.7 }}
                                                />
                                            )}
                                        </button>

                                        <input
                                            type="text"
                                            value={chatInput}
                                            onChange={e => setChatInput(e.target.value)}
                                            disabled={isAiTyping}
                                            placeholder={
                                                isListening
                                                    ? (isEn ? 'Listening to your voice...' : 'กำลังรับเสียงพูดของคุณ...')
                                                    : (isEn ? 'Type or speak as Clinical Communicator...' : 'พิมพ์หรือกดไมค์เพื่อสื่อสารกับญาติผู้เสียชีวิต...')
                                            }
                                            className="touch-target flex-1 px-4 py-2.5 rounded-2xl bg-obsidian-900 border border-slate-700/80 text-white placeholder-slate-400 focus:outline-none focus:border-biotech-400 text-sm"
                                        />

                                        <button
                                            type="submit"
                                            disabled={!chatInput.trim() || isAiTyping}
                                            aria-label="ส่งข้อความ"
                                            className="touch-target w-11 h-11 rounded-2xl bg-biotech-500 hover:bg-biotech-400 disabled:bg-slate-800 disabled:text-slate-500 text-slate-950 flex items-center justify-center shrink-0 shadow-md transition-colors"
                                        >
                                            <Icon name="Send" size={18} />
                                        </button>
                                    </form>
                                </div>
                            </section>
                        </main>
                    )}

                    {/* ==================== VIEW 4: EVALUATING LOADER ==================== */}
                    {phase === 'evaluating' && (
                        <main className="relative z-10 flex-1 flex flex-col items-center justify-center p-6 text-center gap-4">
                            <div className="w-14 h-14 border-4 border-biotech-500/25 border-t-biotech-400 rounded-full animate-spin" />
                            <div>
                                <h2 className="font-display text-xl font-bold text-white">กำลังวิเคราะห์การสื่อสาร 2 มิติ...</h2>
                                <p className="text-xs sm:text-sm text-slate-400 mt-1">ประเมินความถูกต้องของข้อมูลทางการแพทย์และการรับรู้อารมณ์ร่วมกับญาติ</p>
                            </div>
                        </main>
                    )}

                    {/* ==================== VIEW 5: DUAL-DIMENSION DEBRIEF REPORT ==================== */}
                    {phase === 'debrief' && evalResult && selectedMode && (
                        <main className="relative z-10 flex-1 w-full max-w-4xl mx-auto px-3.5 sm:px-6 py-6 sm:py-8 pb-safe space-y-5">
                            <div className="lab-glass rounded-[1.75rem] p-5 sm:p-8 space-y-6 border-biotech-400/30">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 border-b border-white/10">
                                    <div className="space-y-1">
                                        <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-mono text-xs font-bold ${
                                            evalResult.passed
                                                ? 'bg-biotech-500/20 text-biotech-300 border border-biotech-400/30'
                                                : 'bg-amber-500/20 text-amber-300 border border-amber-400/30'
                                        }`}>
                                            <Icon name={evalResult.passed ? 'Award' : 'RefreshCw'} size={14} />
                                            {evalResult.passed ? 'PASSED • ผ่านขั้นที่ 3 เรียบร้อย' : 'NEEDS MORE PRACTICE • ควรฝึกซ้ำ'}
                                        </span>
                                        <h2 className="font-display text-2xl sm:text-3xl font-extrabold text-white">
                                            ผลการประเมินทักษะการให้ข้อมูลญาติ
                                        </h2>
                                        <p className="text-xs sm:text-sm text-slate-400">{selectedMode.title}</p>
                                    </div>

                                    <div className="p-4 rounded-2xl bg-white/5 border border-white/10 text-center min-w-[130px]">
                                        <p className="text-[10px] font-mono text-slate-400 uppercase">Overall Score</p>
                                        <p className="font-mono text-4xl font-extrabold text-biotech-400 leading-none mt-1">
                                            {evalResult.totalScore}
                                            <span className="text-base text-slate-400">/100</span>
                                        </p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="p-5 rounded-2xl bg-cyber-500/10 border border-cyber-400/25 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-display font-bold text-sm sm:text-base text-cyber-300 flex items-center gap-2">
                                                <Icon name="Stethoscope" size={18} /> ความถูกต้องของข้อมูล
                                            </h3>
                                            <span className="font-mono text-2xl font-extrabold text-white">{evalResult.infoScore}<span className="text-xs text-slate-400">/100</span></span>
                                        </div>
                                        <div className="w-full h-2 rounded-full bg-slate-900 overflow-hidden">
                                            <div className="h-full bg-cyber-400 rounded-full" style={{ width: `${evalResult.infoScore}%` }} />
                                        </div>
                                        <ul className="space-y-1.5 text-xs sm:text-sm text-slate-200 leading-relaxed">
                                            {evalResult.infoFeedback.map((item, i) => (
                                                <li key={i} className="flex items-start gap-2">
                                                    <span className="text-cyber-300 mt-0.5">•</span>
                                                    <span>{item}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="p-5 rounded-2xl bg-amber-500/10 border border-amber-400/25 space-y-3">
                                        <div className="flex items-center justify-between">
                                            <h3 className="font-display font-bold text-sm sm:text-base text-amber-300 flex items-center gap-2">
                                                <Icon name="HeartHandshake" size={18} /> การรับรู้อารมณ์ร่วม
                                            </h3>
                                            <span className="font-mono text-2xl font-extrabold text-white">{evalResult.empathyScore}<span className="text-xs text-slate-400">/100</span></span>
                                        </div>
                                        <div className="w-full h-2 rounded-full bg-slate-900 overflow-hidden">
                                            <div className="h-full bg-amber-400 rounded-full" style={{ width: `${evalResult.empathyScore}%` }} />
                                        </div>
                                        <ul className="space-y-1.5 text-xs sm:text-sm text-slate-200 leading-relaxed">
                                            {evalResult.empathyFeedback.map((item, i) => (
                                                <li key={i} className="flex items-start gap-2">
                                                    <span className="text-amber-300 mt-0.5">•</span>
                                                    <span>{item}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>

                                {evalResult.aiCoachingNote && (
                                    <div className="p-4 sm:p-5 rounded-2xl bg-white/[0.04] border border-white/10 space-y-2">
                                        <h3 className="font-display font-bold text-sm text-biotech-300 flex items-center gap-2">
                                            <Icon name="Sparkles" size={16} /> ข้อเสนอแนะเสริมหลักการจาก AI Coach
                                        </h3>
                                        <p className="text-xs sm:text-sm text-slate-200 leading-relaxed whitespace-pre-line">
                                            {evalResult.aiCoachingNote}
                                        </p>
                                    </div>
                                )}

                                <div className="p-4 rounded-2xl bg-biotech-500/15 border border-biotech-400/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div className="space-y-0.5">
                                        <p className="font-display font-bold text-sm text-biotech-300 flex items-center gap-1.5">
                                            <Icon name="Unlock" size={16} /> ปลดล็อกขั้นที่ 4: แบบทดสอบหลังเรียน (Post-test) แล้วค่ะ!
                                        </p>
                                        <p className="text-xs text-slate-200">
                                            กลับไปหน้าห้องเรียนหลักเพื่อทำ Post-test ให้ได้ไม่น้อยกว่า {MIN_POSTTEST_PERCENT}% เพื่อรับประกาศนียบัตร (ขั้นที่ 5)
                                        </p>
                                    </div>
                                    <a
                                        href="./index.html#dashboard"
                                        className="touch-target shrink-0 py-2.5 px-5 rounded-xl bg-biotech-500 hover:bg-biotech-400 text-slate-950 font-display font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5"
                                    >
                                        ไปทำ Post-test <Icon name="ArrowRight" size={16} />
                                    </a>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-2.5 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => enterConsultationRoom(selectedMode, trainingTrack)}
                                        className="touch-target flex-1 py-3.5 px-5 rounded-2xl bg-gradient-to-r from-biotech-500 to-cyber-500 hover:from-biotech-400 hover:to-cyber-400 text-slate-950 font-display font-extrabold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="RotateCcw" size={17} /> {isEn ? 'Practice Again' : 'ฝึกสนทนาใหม่อีกครั้ง'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setSelectedMode(null);
                                            setPhase('menu');
                                        }}
                                        className="touch-target flex-1 py-3.5 px-5 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 text-white font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="LayoutGrid" size={17} /> {isEn ? 'Back to Lab Menu' : 'เลือกโหมดฝึกอื่น'}
                                    </button>
                                    <a
                                        href="./index.html#dashboard"
                                        className="touch-target sm:w-auto py-3.5 px-5 rounded-2xl bg-obsidian-800 hover:bg-obsidian-700 border border-slate-700 text-slate-200 font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="Home" size={17} /> {isEn ? 'Dashboard' : 'กลับห้องเรียน'}
                                    </a>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* ==================== VIMEO SCENARIO VIDEO MODAL (ดูซ้ำระหว่างสนทนา) ==================== */}
                    {showVideoModal && (
                        <div className="fixed inset-0 z-[105] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6">
                            <div className="w-full max-w-3xl lab-glass rounded-[1.75rem] p-4 sm:p-6 border-cyber-400/30 space-y-3.5">
                                <div className="flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2">
                                        <span className="px-2.5 py-1 rounded-full bg-cyber-500/15 border border-cyber-400/30 text-cyber-300 font-mono text-[10px] font-bold">
                                            VIMEO #{SCENARIO_VIMEO_ID}
                                        </span>
                                        <h3 className="font-display font-bold text-sm sm:text-base text-white">
                                            {isEn ? 'Scenario Reference Video' : 'วิดีโอสถานการณ์จำลองประกอบการฝึก'}
                                        </h3>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => setShowVideoModal(false)}
                                        aria-label="ปิดวิดีโอ"
                                        className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/15 text-slate-200 flex items-center justify-center"
                                    >
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-white/10">
                                    <iframe
                                        src={SCENARIO_VIMEO_EMBED_URL}
                                        className="absolute inset-0 w-full h-full border-0"
                                        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
                                        allowFullScreen
                                        title="Scenario Reference Video"
                                    />
                                </div>

                                <div className="flex items-center justify-between gap-2 text-xs text-slate-400">
                                    <a
                                        href={SCENARIO_VIMEO_SHARE_URL}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="text-cyber-300 hover:underline inline-flex items-center gap-1 font-bold"
                                    >
                                        เปิดบน Vimeo <Icon name="ExternalLink" size={12} />
                                    </a>
                                    <button
                                        type="button"
                                        onClick={() => setShowVideoModal(false)}
                                        className="px-4 py-2 rounded-xl bg-biotech-500 hover:bg-biotech-400 text-slate-950 font-display font-bold text-xs"
                                    >
                                        กลับไปสนทนาต่อ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />

                    {isAdminPreview && (
                        <div className="fixed top-[calc(4rem+env(safe-area-inset-top,0px))] right-3 z-[130] flex flex-col items-end gap-1.5 pointer-events-none">
                            {previewBarOpen ? (
                                <div className="pointer-events-auto bg-obsidian-900/95 border border-biotech-400/40 backdrop-blur-xl rounded-2xl p-2.5 shadow-2xl flex flex-wrap items-center gap-1.5 text-[11px] font-bold max-w-[92vw]">
                                    <span className="text-biotech-300 font-mono flex items-center gap-1 px-1">
                                        <Icon name="Eye" size={13} /> ADMIN PREVIEW
                                    </span>
                                    <a href="./index.html?admin_preview=dashboard" className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200">
                                        ห้องเรียน
                                    </a>
                                    <a href="./index.html?admin_preview=posttest" className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200">
                                        Post-test
                                    </a>
                                    <a href="./index.html?admin_preview=certificate" className="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200">
                                        ประกาศฯ
                                    </a>
                                    <a href="./admin.html" className="px-2.5 py-1 rounded-lg bg-biotech-500 hover:bg-biotech-400 text-slate-950">
                                        กลับ Admin
                                    </a>
                                    <button
                                        type="button"
                                        onClick={() => setPreviewBarOpen(false)}
                                        className="w-6 h-6 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200 flex items-center justify-center"
                                        title="พับแถบตรวจหน้าจอ"
                                    >
                                        <Icon name="X" size={13} />
                                    </button>
                                </div>
                            ) : (
                                <button
                                    type="button"
                                    onClick={() => setPreviewBarOpen(true)}
                                    className="pointer-events-auto px-3 py-1.5 rounded-full bg-obsidian-900/95 border border-biotech-400/45 text-biotech-300 shadow-xl text-[11px] font-mono font-bold flex items-center gap-1.5 hover:bg-obsidian-800"
                                >
                                    <Icon name="Eye" size={13} /> ADMIN PREVIEW
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
