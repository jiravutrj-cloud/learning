          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f8fafc');
        } catch (_) {}
      })();

        // 3. PROCEDURAL AMBIENT SOUNDSCAPE ENGINE (WEB AUDIO API)
        // ============================================================================
        class AmbientSoundscapeEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.filter = null;
                this.oscs = [];
                this.active = false;
            }

            start(emotionKey = 'CONFUSED') {
                if (this.active) {
                    this.updateEmotion(emotionKey);
                    return;
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                try {
                    const ctx = new AudioCtx();
                    const master = ctx.createGain();
                    master.gain.setValueAtTime(0.0001, ctx.currentTime);
                    master.gain.exponentialRampToValueAtTime(0.045, ctx.currentTime + 1.8);

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(420, ctx.currentTime);
                    filter.Q.setValueAtTime(1.2, ctx.currentTime);

                    const lfo = ctx.createOscillator();
                    const lfoGain = ctx.createGain();
                    lfo.frequency.setValueAtTime(0.14, ctx.currentTime);
                    lfoGain.gain.setValueAtTime(90, ctx.currentTime);
                    lfo.connect(lfoGain);
                    lfoGain.connect(filter.frequency);
                    lfo.start();

                    filter.connect(master);
                    master.connect(ctx.destination);

                    const freqs = (EMOTION_PHYSICS[emotionKey] || EMOTION_PHYSICS.CONFUSED).droneFreqs;
                    const oscs = freqs.map((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = idx === 0 ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime);
                        g.gain.setValueAtTime(idx === 0 ? 0.5 : 0.22, ctx.currentTime);
                        osc.connect(g);
                        g.connect(filter);
                        osc.start();
                        return osc;
                    });

                    this.ctx = ctx;
                    this.masterGain = master;
                    this.filter = filter;
                    this.oscs = [...oscs, lfo];
                    this.active = true;
                } catch (err) {
                    console.warn('Soundscape start warning:', err);
                }
            }

            updateEmotion(emotionKey) {
                if (!this.active || !this.ctx) return;
                const meta = EMOTION_PHYSICS[emotionKey] || EMOTION_PHYSICS.CONFUSED;
                const now = this.ctx.currentTime;
                meta.droneFreqs.forEach((f, idx) => {
                    if (this.oscs[idx]) {
                        try {
                            this.oscs[idx].frequency.exponentialRampToValueAtTime(Math.max(40, f), now + 1.4);
                        } catch (_) {}
                    }
                });
                if (this.filter) {
                    const targetCutoff = emotionKey === 'CALM' ? 540 : emotionKey === 'ANGRY' ? 320 : 420;
                    try {
                        this.filter.frequency.exponentialRampToValueAtTime(targetCutoff, now + 1.4);
                    } catch (_) {}
                }
            }

            playChime() {
                if (!this.active || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.35);
                    g.gain.setValueAtTime(0.001, now);
                    g.gain.exponentialRampToValueAtTime(0.06, now + 0.06);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 1.15);
                } catch (_) {}
            }

            stop() {
                if (!this.active) return;
                this.active = false;
                try {
                    if (this.masterGain && this.ctx) {
                        this.masterGain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.35);
                    }
                    setTimeout(() => {
                        this.oscs.forEach(o => { try { o.stop(); } catch (_) {} });
                        if (this.ctx) { try { this.ctx.close(); } catch (_) {} }
                        this.oscs = [];
                        this.ctx = null;
                        this.masterGain = null;
                    }, 400);
                } catch (_) {}
            }
        }

        function SpatialEmotionalCoreCanvas({ emotionKey, isAiSpeaking, isAiTyping, micLevel, interactive = true }) {
            const mountRef = useRef(null);
            const stateRef = useRef({ emotionKey, isAiSpeaking, isAiTyping, micLevel, interactive });

            useEffect(() => {
                stateRef.current = { emotionKey, isAiSpeaking, isAiTyping, micLevel, interactive };
            }, [emotionKey, isAiSpeaking, isAiTyping, micLevel, interactive]);

            useEffect(() => {
                const container = mountRef.current;
                if (!container) return;

                const THREE = window.THREE;
                let rafId = null;

                const start2dFallback = () => {
                    const canvas = document.createElement('canvas');
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                    canvas.style.display = 'block';
                    container.innerHTML = '';
                    container.appendChild(canvas);
                    const ctx = canvas.getContext('2d');
                    const resize2d = () => {
                        canvas.width = Math.max(1, container.clientWidth || window.innerWidth);
                        canvas.height = Math.max(1, container.clientHeight || window.innerHeight);
                    };
                    resize2d();
                    window.addEventListener('resize', resize2d);
                    let t = 0;
                    const draw2d = () => {
                        t += 0.016;
                        const { emotionKey: ek } = stateRef.current;
                        const meta = EMOTION_PHYSICS[ek] || EMOTION_PHYSICS.CONFUSED;
                        ctx.fillStyle = '#030712';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        const cx = canvas.width / 2;
                        const cy = canvas.height * 0.44;
                        const pulse = 1 + Math.sin(t * meta.pulseSpeed) * 0.08;
                        const r = Math.min(canvas.width, canvas.height) * 0.22 * pulse;
                        const grd = ctx.createRadialGradient(cx, cy, 8, cx, cy, r * 1.9);
                        grd.addColorStop(0, meta.hexCss + '88');
                        grd.addColorStop(1, 'transparent');
                        ctx.fillStyle = grd;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r * 1.9, 0, Math.PI * 2);
                        ctx.fill();
                        rafId = requestAnimationFrame(draw2d);
                    };
                    draw2d();
                    return () => {
                        cancelAnimationFrame(rafId);
                        window.removeEventListener('resize', resize2d);
                    };
                };

                if (!THREE) return start2dFallback();

                const width = Math.max(1, container.clientWidth || window.innerWidth);
                const height = Math.max(1, container.clientHeight || window.innerHeight);

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(52, width / height, 0.1, 100);
                camera.position.set(0, 0.25, 6.2);

                let renderer;
                try {
                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
                } catch (err) {
                    console.warn('WebGL fallback triggered:', err);
                    return start2dFallback();
                }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(width, height);
                renderer.setClearColor(0x000000, 0);
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const createGlowSpriteTexture = () => {
                    const c = document.createElement('canvas');
                    c.width = 64;
                    c.height = 64;
                    const g = c.getContext('2d');
                    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                    grad.addColorStop(0, 'rgba(255,255,255,1)');
                    grad.addColorStop(0.32, 'rgba(255,255,255,0.75)');
                    grad.addColorStop(0.65, 'rgba(255,255,255,0.18)');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    g.fillStyle = grad;
                    g.fillRect(0, 0, 64, 64);
                    return new THREE.CanvasTexture(c);
                };
                const particleTex = createGlowSpriteTexture();

                const rootGroup = new THREE.Group();
                scene.add(rootGroup);

                // 1) แกนอนุภาคพลังงานหลัก 2,400 จุด
                const PARTICLE_COUNT = 2400;
                const basePositions = new Float32Array(PARTICLE_COUNT * 3);
                const positions = new Float32Array(PARTICLE_COUNT * 3);
                const colors = new Float32Array(PARTICLE_COUNT * 3);
                const seeds = new Float32Array(PARTICLE_COUNT);

                const goldenAngle = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const y = 1 - (i / (PARTICLE_COUNT - 1)) * 2;
                    const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
                    const theta = goldenAngle * i;
                    const shellRadius = 1.48 + (i % 7 === 0 ? 0.42 : 0) + (Math.random() - 0.5) * 0.16;

                    const bx = Math.cos(theta) * radiusAtY * shellRadius;
                    const by = y * shellRadius;
                    const bz = Math.sin(theta) * radiusAtY * shellRadius;

                    basePositions[i * 3] = bx;
                    basePositions[i * 3 + 1] = by;
                    basePositions[i * 3 + 2] = bz;
                    positions[i * 3] = bx;
                    positions[i * 3 + 1] = by;
                    positions[i * 3 + 2] = bz;
                    seeds[i] = Math.random() * Math.PI * 2;

                    colors[i * 3] = 0.2;
                    colors[i * 3 + 1] = 0.85;
                    colors[i * 3 + 2] = 0.85;
                }

                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const particleMat = new THREE.PointsMaterial({
                    size: 0.085,
                    map: particleTex,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.92,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                const particleCloud = new THREE.Points(particleGeo, particleMat);
                rootGroup.add(particleCloud);

                // 2) แกนผลึกภายใน
                const coreGeo = new THREE.IcosahedronGeometry(0.88, 2);
                const coreMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.24,
                    blending: THREE.AdditiveBlending
                });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                rootGroup.add(coreMesh);

                // 3) วงแหวนโฮโลแกรมรอบนอก 2 ชั้น
                const ringGeo1 = new THREE.TorusGeometry(2.18, 0.012, 12, 120);
                const ringMat1 = new THREE.MeshBasicMaterial({
                    color: 0x22d3ee,
                    transparent: true,
                    opacity: 0.36,
                    blending: THREE.AdditiveBlending
                });
                const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
                ring1.rotation.x = Math.PI * 0.42;
                rootGroup.add(ring1);

                const ringGeo2 = new THREE.TorusGeometry(2.52, 0.008, 12, 120);
                const ringMat2 = new THREE.MeshBasicMaterial({
                    color: 0x34d399,
                    transparent: true,
                    opacity: 0.22,
                    blending: THREE.AdditiveBlending
                });
                const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
                ring2.rotation.x = -Math.PI * 0.34;
                ring2.rotation.y = Math.PI * 0.2;
                rootGroup.add(ring2);

                // 4) ฝุ่นดาวรอบห้องรับรอง
                const STAR_COUNT = 320;
                const starPos = new Float32Array(STAR_COUNT * 3);
                for (let i = 0; i < STAR_COUNT; i++) {
                    starPos[i * 3] = (Math.random() - 0.5) * 18;
                    starPos[i * 3 + 1] = (Math.random() - 0.5) * 14;
                    starPos[i * 3 + 2] = -2 - Math.random() * 12;
                }
                const starGeo = new THREE.BufferGeometry();
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    size: 0.06,
                    map: particleTex,
                    color: 0x94a3b8,
                    transparent: true,
                    opacity: 0.45,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                const starField = new THREE.Points(starGeo, starMat);
                scene.add(starField);

                // Interactive Mouse & Touch Drag Orbit
                let isDragging = false;
                let lastX = 0, lastY = 0;
                let targetRotX = 0.08, targetRotY = 0;
                let curRotX = 0.08, curRotY = 0;

                const onPointerDown = (x, y) => {
                    if (!stateRef.current.interactive) return;
                    isDragging = true;
                    lastX = x;
                    lastY = y;
                };
                const onPointerMove = (x, y) => {
                    if (!isDragging || !stateRef.current.interactive) return;
                    const dx = x - lastX;
                    const dy = y - lastY;
                    lastX = x;
                    lastY = y;
                    targetRotY += dx * 0.007;
                    targetRotX = Math.max(-0.9, Math.min(0.9, targetRotX + dy * 0.006));
                };
                const onPointerUp = () => { isDragging = false; };

                const handleMouseDown = (e) => onPointerDown(e.clientX, e.clientY);
                const handleMouseMove = (e) => onPointerMove(e.clientX, e.clientY);
                const handleTouchStart = (e) => { if (e.touches[0]) onPointerDown(e.touches[0].clientX, e.touches[0].clientY); };
                const handleTouchMove = (e) => { if (e.touches[0]) onPointerMove(e.touches[0].clientX, e.touches[0].clientY); };

                const domEl = renderer.domElement;
                domEl.addEventListener('mousedown', handleMouseDown);
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', onPointerUp);
                domEl.addEventListener('touchstart', handleTouchStart, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: true });
                window.addEventListener('touchend', onPointerUp);

                const handleResize = () => {
                    if (!container) return;
                    const w = Math.max(1, container.clientWidth || window.innerWidth);
                    const h = Math.max(1, container.clientHeight || window.innerHeight);
                    camera.aspect = w / h;
                    camera.position.z = w < 640 ? 7.4 : 6.1;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                handleResize();
                window.addEventListener('resize', handleResize);

                const curColor1 = new THREE.Color(0x38bdf8);
                const curColor2 = new THREE.Color(0x818cf8);
                const targetColor1 = new THREE.Color();
                const targetColor2 = new THREE.Color();
                const tmpColor = new THREE.Color();

                let curTurb = 0.35;
                let curSpread = 1.08;
                let curPulse = 1.8;
                let curRotSpeed = 0.22;
                let elapsed = 0;
                let lastTime = performance.now();

                const animate = (now) => {
                    rafId = requestAnimationFrame(animate);
                    const dt = Math.min(0.05, (now - lastTime) / 1000);
                    lastTime = now;
                    elapsed += dt;

                    const { emotionKey: ek, isAiSpeaking: speaking, isAiTyping: typing, micLevel: mic } = stateRef.current;
                    const meta = EMOTION_PHYSICS[ek] || EMOTION_PHYSICS.CONFUSED;

                    targetColor1.setHex(meta.primaryHex);
                    targetColor2.setHex(meta.secondaryHex);
                    curColor1.lerp(targetColor1, dt * 2.4);
                    curColor2.lerp(targetColor2, dt * 2.4);

                    curTurb += (meta.turbulence - curTurb) * dt * 2.5;
                    curSpread += (meta.spread - curSpread) * dt * 2.2;
                    curPulse += (meta.pulseSpeed - curPulse) * dt * 2.2;
                    curRotSpeed += (meta.rotSpeed - curRotSpeed) * dt * 2.2;

                    const voiceBoost = speaking
                        ? (0.24 + Math.sin(elapsed * 13) * 0.1 + Math.cos(elapsed * 7.5) * 0.07)
                        : typing
                            ? 0.14
                            : 0;
                    const micBoost = (mic || 0) / 170;
                    const totalEnergy = voiceBoost + micBoost;

                    const posAttr = particleGeo.attributes.position;
                    const colAttr = particleGeo.attributes.color;
                    const breath = 1 + Math.sin(elapsed * curPulse) * 0.045 + totalEnergy * 0.22;

                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        const i3 = i * 3;
                        const bx = basePositions[i3];
                        const by = basePositions[i3 + 1];
                        const bz = basePositions[i3 + 2];
                        const s = seeds[i];

                        const wave = Math.sin(elapsed * (1.8 + curTurb * 3.5) + s + by * 2.2) * (curTurb * 0.26 + totalEnergy * 0.22);
                        const ripple = Math.cos(elapsed * 2.1 + bx * 2.6 + s) * (curTurb * 0.14);
                        const scale = curSpread * breath + wave;

                        posAttr.array[i3] = bx * scale + ripple * 0.4;
                        posAttr.array[i3 + 1] = by * scale + Math.sin(elapsed * 1.4 + s) * 0.05;
                        posAttr.array[i3 + 2] = bz * scale;

                        const mixRatio = 0.5 + 0.5 * Math.sin(s + elapsed * 0.9 + by);
                        tmpColor.copy(curColor1).lerp(curColor2, mixRatio);
                        colAttr.array[i3] = tmpColor.r;
                        colAttr.array[i3 + 1] = tmpColor.g;
                        colAttr.array[i3 + 2] = tmpColor.b;
                    }
                    posAttr.needsUpdate = true;
                    colAttr.needsUpdate = true;

                    coreMat.color.copy(curColor1);
                    coreMat.opacity = 0.2 + totalEnergy * 0.35;
                    const coreScale = 0.92 + Math.sin(elapsed * curPulse * 1.2) * 0.06 + totalEnergy * 0.25;
                    coreMesh.scale.setScalar(coreScale);
                    coreMesh.rotation.y -= dt * (curRotSpeed * 1.3);
                    coreMesh.rotation.x += dt * 0.14;

                    ringMat1.color.copy(curColor2);
                    ringMat2.color.copy(curColor1);
                    ring1.rotation.z += dt * (0.28 + curRotSpeed);
                    ring2.rotation.z -= dt * (0.2 + curRotSpeed * 0.7);
                    ring1.scale.setScalar(1 + totalEnergy * 0.14);
                    ring2.scale.setScalar(1 + totalEnergy * 0.18);

                    if (!isDragging) targetRotY += dt * curRotSpeed * 0.65;
                    curRotX += (targetRotX - curRotX) * 0.08;
                    curRotY += (targetRotY - curRotY) * 0.08;
                    rootGroup.rotation.x = curRotX;
                    rootGroup.rotation.y = curRotY;
                    rootGroup.position.y = Math.sin(elapsed * 0.75) * 0.08 + 0.28;

                    starField.rotation.y += dt * 0.02;

                    renderer.render(scene, camera);
                };

                rafId = requestAnimationFrame(animate);

                return () => {
                    cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', handleResize);
                    domEl.removeEventListener('mousedown', handleMouseDown);
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', onPointerUp);
                    domEl.removeEventListener('touchstart', handleTouchStart);
                    window.removeEventListener('touchmove', handleTouchMove);
                    window.removeEventListener('touchend', onPointerUp);
                    particleGeo.dispose();
                    particleMat.dispose();
                    coreGeo.dispose();
                    coreMat.dispose();
                    ringGeo1.dispose();
                    ringMat1.dispose();
                    ringGeo2.dispose();
                    ringMat2.dispose();
                    starGeo.dispose();
                    starMat.dispose();
                    particleTex.dispose();
                    renderer.dispose();
                };
            }, []);

            return <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />;
        }

        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

        function parseAiResponse(rawText) {
            const text = String(rawText || '').trim();
            const suggestions = [];
            const sugRegex = /\[SUGGESTION\s*\d+\]\s*([^\n]+)/gi;
            let match;
            while ((match = sugRegex.exec(text)) !== null) {
                if (match[1]?.trim()) suggestions.push(match[1].trim());
            }
            let coachTip = '';
            const tipMatch = text.match(/\[COACH_TIP\]\s*([^\n]+)/i);
            if (tipMatch && tipMatch[1]) coachTip = tipMatch[1].trim();

            let cleaned = text
                .replace(/\[SUGGESTION\s*\d+\]\s*[^\n]+/gi, '')
                .replace(/\[COACH_TIP\]\s*[^\n]+/gi, '')
                .trim();

            let emotion = 'SAD';
            const emoMatch = cleaned.match(/^\[(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]\s*/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                cleaned = cleaned.replace(emoMatch[0], '').trim();
            }
            cleaned = cleaned.replace(/^\[[^\]]{1,25}\]\s*/, '').trim();

            return {
                emotion: EMOTION_PHYSICS[emotion] ? emotion : 'SAD',
                text: cleaned || '...',
                coachTip,
                suggestions: suggestions.slice(0, 2)
            };
        }

        function generateOfflineRelativeReply(userMsg, mode, turnCount) {

[SUGGESTION 1] ได้แน่นอนค่ะ ไม่ต้องรีบตัดสินใจเลยนะคะ ทีมศัลยแพทย์จะดูแลผ่าตัดและตกแต่งร่างอย่างประณีตให้เกียรติสูงสุด ดิฉันขอให้เวลาครอบครัวปรึกษากันในห้องรับรองนี้ก่อนค่ะ
[SUGGESTION 2] เข้าใจความกังวลเลยค่ะ ไม่ว่าจะตัดสินใจอย่างไรทีมจะดูแลอย่างเต็มที่เสมอ ขอเชิญครอบครัวคุยกันตามสบาย หากมีคำถามเพิ่มเติมเรียกดิฉันได้ตลอดนะคะ`;

                return `[ANGRY] ขอบคุณนะคะที่แนะนำตัว... แต่เมื่อกี้เข้าไปจับมือ ตัวเขายังอุ่นอยู่เลย หน้าจอก็ยังมีชีพจรเต้นอยู่ จะบอกว่าสมองตายได้ยังไงคะ! หมอตรวจผิดหรือเปล่าคะ?

[SUGGESTION 1] ดิฉันเข้าใจความรู้สึกเลยค่ะ การเห็นตัวอุ่นและชีพจรเต้นทำให้ทำใจเชื่อได้ยากมาก แต่ชีพจรและลมหายใจเกิดจากเครื่องช่วยหายใจกับยาที่พยุงไว้ชั่วคราว ส่วนสมองได้รับการตรวจยืนยันตามเกณฑ์แล้วว่าหยุดทำงานถาวรค่ะ
[SUGGESTION 2] เป็นเรื่องธรรมดามากค่ะที่จะรู้สึกสับสนเมื่อเห็นสัญญาณชีพบนจอ ขออนุญาตค่อยๆ อธิบายความแตกต่างระหว่างการทำงานของเครื่องช่วยหายใจกับภาวะสมองตายนะคะ`;
            }
            return `[CALM] ขอบคุณนะคะที่ค่อยๆ อธิบายด้วยน้ำเสียงที่นุ่มนวลและให้เวลาในห้องรับรองที่เงียบสงบแบบนี้... ตอนนี้ใจนิ่งขึ้นมากแล้วค่ะ ขั้นตอนต่อไปครอบครัวต้องเตรียมตัวยังไงบ้างคะ?
[COACH_TIP] ยอดเยี่ยมมากค่ะ สร้างความไว้วางใจได้สูงมาก สามารถสรุปให้เวลาครอบครัวและกดปุ่ม "ประเมินผล" เพื่อรับการ์ดสมรรถนะได้เลยค่ะ
[SUGGESTION 1] สิ่งสำคัญที่สุดตอนนี้คือดูแลจิตใจของครอบครัวค่ะ หากพร้อมแล้วดิฉันขออนุญาตอธิบายขั้นตอนการดูแลต่อจากนี้และทางเลือกต่างๆ อย่างตรงไปตรงมา โดยไม่มีการเร่งรัดใดๆ นะคะ
[SUGGESTION 2] ขอให้ครอบครัวพักหายใจก่อนได้เลยค่ะ ต้องการเวลาอยู่ด้วยกันเงียบๆ สักครู่ หรือให้ดิฉันเล่าขั้นตอนต่อไปให้ฟังก่อนดีคะ`;
        }

        function getMasterExampleForEmotion(emotionKey, isEn) {
            if (isEn) {
                if (emotionKey === 'ANGRY' || emotionKey === 'SHOCK') {
                    return 'I completely understand why seeing warmth and chest movement makes this feel impossible to accept. The ventilator and medications are temporarily supporting breathing, while formal exams confirmed irreversible brain death.';
                }
                if (emotionKey === 'HESITANT') {
                    return 'There is absolutely no rush—your family’s peace comes first. Our surgical team treats every patient with the utmost dignity so they look peaceful, and we will give you private time here to talk together.';
                }
                return 'I am truly sorry for what your family is going through. Thank you for coming into this quiet consultation room—I am here to listen and explain everything gently at your pace.';
            }
            if (emotionKey === 'ANGRY' || emotionKey === 'SHOCK') {
                return 'ดิฉันเข้าใจความรู้สึกเลยค่ะ การที่ยังเห็นหน้าอกขยับและตัวอุ่นทำให้ทำใจเชื่อได้ยากมาก แต่ชีพจรและลมหายใจเกิดจากเครื่องช่วยหายใจกับยาที่พยุงชั่วคราว ส่วนแพทย์ผู้เชี่ยวชาญตรวจยืนยันแล้วว่าก้านสมองหยุดทำงานถาวรค่ะ';
            }
            if (emotionKey === 'HESITANT') {
                return 'ไม่ต้องรีบตัดสินใจเลยนะคะ ทีมศัลยแพทย์จะดูแลผ่าตัดและตกแต่งร่างอย่างประณีตให้เกียรติสูงสุด ดิฉันขอให้เวลาครอบครัวได้ปรึกษากันอย่างเป็นส่วนตัวในห้องรับรองนี้ก่อนค่ะ';
            }
            return 'ดิฉันขอแสดงความเสียใจกับเหตุการณ์ที่เกิดขึ้นนะคะ ขอบคุณที่เข้ามานั่งคุยกันในห้องรับรองที่เป็นส่วนตัวนี้ ดิฉันอยู่ตรงนี้คอยรับฟังและค่อยๆ อธิบายให้ทุกข้อสงสัยชัดเจนค่ะ';
        }

        /**
         * ประเมินสมรรถนะ 5 มิติ (สำหรับ Radar Chart, 3D Skill Card และหน้าผู้บริหาร)
         */
        function evaluateFiveDimensions(chatLog, mode, silenceBonusCount, vocalCalmAvg) {
            const isEn = mode.language === 'en';
            const userMsgs = chatLog.filter(m => m.sender === 'user');
            const userTexts = userMsgs.map(m => m.text || '').join(' ').toLowerCase();

            const setting = Math.min(98, 66 + (userTexts.match(/แนะนำ|ชื่อ|พยาบาล|เจ้าหน้าที่|ผู้ประสาน|ห้องรับรอง|ห้องส่วนตัว|เงียบ|name|nurse|coordinator|private room|quiet room/) ? 26 : 6) + (userMsgs.length >= 2 ? 4 : 0));
            const empathy = Math.min(98, 64 + (userTexts.match(/เสียใจ|เข้าใจ|ตกใจ|เจ็บปวด|สับสน|ทำใจยาก|ห่วง|sorry|understand|heartbreaking|overwhelming|painful/) ? 24 : 6) + (userTexts.match(/ค่อยๆ|รับฟัง|อยู่ตรงนี้|สบายใจ|gently|listen|here with you|calm/) ? 8 : 0));
            const clarity = Math.min(98, 64 + (userTexts.match(/สมองตาย|ก้านสมอง|เครื่องช่วยหายใจ|ยาพยุง|ถาวร|หยุดทำงาน|brain death|brainstem|ventilator|medication|permanent/) ? 28 : 6) + (userMsgs.length >= 2 ? 4 : 0));
            const vocal = Math.min(98, Math.max(66, Math.round((vocalCalmAvg || 82) + Math.min(14, silenceBonusCount * 7))));
            const dignity = Math.min(98, 66 + (userTexts.match(/ประณีต|ให้เกียรติ|เย็บแผล|ตกแต่ง|ไม่รีบ|ปรึกษา|ตัดสินใจ|dignity|respect|neatly|peaceful|no rush|time|decide/) ? 26 : 8));

            const infoScore = Math.round((setting + clarity + dignity) / 3);
            const empathyScore = Math.round((empathy + vocal) / 2);
            const totalScore = Math.round((setting + empathy + clarity + vocal + dignity) / 5);
            const passed = totalScore >= 60;

            const rank = totalScore >= 90
                ? 'MASTER COORDINATOR'
                : totalScore >= 80
                    ? 'EMPATHY SPECIALIST'
                    : totalScore >= 70
                        ? 'CLINICAL COMMUNICATOR'
                        : 'RISING PRACTITIONER';

            const infoFeedback = [
                setting >= 85
                    ? (isEn ? 'Established calm private-room presence and clear clinical role.' : 'เปิดบทบาทผู้ให้ข้อมูลและสร้างพื้นที่ปลอดภัยในห้องรับรองได้ดีมาก')
                    : (isEn ? 'Tip: Introduce your name & role explicitly at the start.' : 'คำแนะนำ: เริ่มต้นด้วยการแนะนำชื่อ-บทบาทของคุณในห้องรับรองให้ชัดเจน'),
                clarity >= 85
                    ? (isEn ? 'Explained ventilator support vs. irreversible brain death accurately.' : 'อธิบายความต่างระหว่างเครื่องช่วยหายใจกับภาวะสมองตายถาวรได้ชัดเจน')
                    : (isEn ? 'Tip: Clarify ventilator/medication support vs. irreversible brain death.' : 'คำแนะนำ: อธิบายให้ชัดว่าเครื่องช่วยหายใจพยุงชั่วคราว แต่ก้านสมองหยุดทำงานถาวรแล้ว')
            ];

            const empathyFeedback = [
                empathy >= 85
                    ? (isEn ? 'Validated grief and shock with genuine warmth.' : 'รับรู้และสะท้อนความเสียใจ-ความสับสนของญาติได้อย่างอบอุ่น')
                    : (isEn ? 'Tip: Reflect the relative’s grief before sharing clinical facts.' : 'คำแนะนำ: สะท้อนความเสียใจของญาติก่อนอธิบายข้อมูลทางการแพทย์'),
                silenceBonusCount > 0
                    ? (isEn ? `Used Therapeutic Silence (${silenceBonusCount}×) to hold emotional space.` : `ใช้จังหวะหยุดเงียบเพื่อเยียวยา (Therapeutic Silence) ได้ยอดเยี่ยม ${silenceBonusCount} ครั้ง`)
                    : (isEn ? 'Tip: Pause 2.5 seconds after emotional moments before speaking.' : 'คำแนะนำ: ลองเว้นจังหวะเงียบ 2.5 วินาทีหลังญาติระบายอารมณ์ เพื่อรับโบนัส Therapeutic Silence')
            ];

            return {
                totalScore,
                infoScore,
                empathyScore,
                passed,
                rank,
                silenceBonusCount,
                radar: [
                    { key: 'setting', labelTH: 'ห้องรับรอง & บทบาท', labelEN: 'Setting & Role', value: setting },
                    { key: 'empathy', labelTH: 'รับรู้อารมณ์ร่วม', labelEN: 'Empathy', value: empathy },
                    { key: 'clarity', labelTH: 'ข้อมูลสมองตาย', labelEN: 'Clinical Facts', value: clarity },
                    { key: 'vocal', labelTH: 'น้ำเสียง & ความเงียบ', labelEN: 'Vocal & Silence', value: vocal },
                    { key: 'dignity', labelTH: 'ไม่เร่งรัด & เกียรติร่าง', labelEN: 'Dignity', value: dignity }
                ],
                infoFeedback,
                empathyFeedback
            };
        }

        // ============================================================================
        // 6. DEBRIEF VISUALIZATION: 5-AXIS RADAR, TIMELINE + TIME-REWIND, 3D HOLO CARD
        // ============================================================================
        function FiveAxisRadarSVG({ radar, isEn }) {
            const size = 240;
            const cx = size / 2;
            const cy = size / 2;
            const maxR = 76;
            const levels = [0.25, 0.5, 0.75, 1];

            const getPoint = (idx, ratio) => {
                const angle = (Math.PI * 2 * idx) / radar.length - Math.PI / 2;
                return [cx + Math.cos(angle) * maxR * ratio, cy + Math.sin(angle) * maxR * ratio];
            };

            const dataPoints = radar.map((item, i) => getPoint(i, (item.value || 0) / 100));
            const polyStr = dataPoints.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full max-w-[250px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="radarFillSkillLab" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.52" />
                            <stop offset="100%" stopColor="#22d3ee" stopOpacity="0.28" />
                        </linearGradient>
                    </defs>
                    {levels.map((lv, li) => {
                        const pts = radar.map((_, i) => getPoint(i, lv).join(',')).join(' ');
                        return <polygon key={li} points={pts} fill="none" stroke="rgba(148,163,184,0.22)" strokeWidth="1" />;
                    })}
                    {radar.map((_, i) => {
                        const [x, y] = getPoint(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(148,163,184,0.2)" strokeWidth="1" />;
                    })}
                    <polygon points={polyStr} fill="url(#radarFillSkillLab)" stroke="#34d399" strokeWidth="2" />
                    {dataPoints.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.6" fill="#67e8f9" stroke="#030712" strokeWidth="1.5" />
                    ))}
                    {radar.map((item, i) => {
                        const [lx, ly] = getPoint(i, 1.32);
                        return (
                            <g key={item.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill="#cbd5e1" fontSize="9.5" fontFamily="Sarabun, sans-serif" fontWeight="700">
                                    {isEn ? item.labelEN : item.labelTH}
                                </text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill="#6ee7b7" fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">
                                    {item.value}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        function HolographicSkillCard({ evalResult, user, isEn, onExportPng }) {
            const cardRef = useRef(null);
            const [tilt, setTilt] = useState({ rx: 0, ry: 0, mx: 50, my: 50 });

            const applyCoords = (clientX, clientY) => {
                const el = cardRef.current;
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const px = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const py = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
                setTilt({
                    rx: (0.5 - py) * 18,
                    ry: (px - 0.5) * 20,
                    mx: Math.round(px * 100),
                    my: Math.round(py * 100)
                });
            };

            useEffect(() => {
                const onOrient = (e) => {
                    if (typeof e.beta !== 'number' || typeof e.gamma !== 'number') return;
                    const rx = Math.max(-12, Math.min(12, (e.beta - 45) * 0.25));
                    const ry = Math.max(-14, Math.min(14, e.gamma * 0.35));
                    setTilt({ rx, ry, mx: 50 + ry * 2.5, my: 50 - rx * 2.5 });
                };
                window.addEventListener('deviceorientation', onOrient);
                return () => window.removeEventListener('deviceorientation', onOrient);
            }, []);

            return (
                <div className="holo-card-wrapper w-full">
                    <div
                        ref={cardRef}
                        onMouseMove={(e) => applyCoords(e.clientX, e.clientY)}
                        onMouseLeave={() => setTilt({ rx: 0, ry: 0, mx: 50, my: 50 })}
                        onTouchMove={(e) => { if (e.touches[0]) applyCoords(e.touches[0].clientX, e.touches[0].clientY); }}
                        onTouchEnd={() => setTilt({ rx: 0, ry: 0, mx: 50, my: 50 })}
                        style={{
                            transform: `rotateX(${tilt.rx.toFixed(2)}deg) rotateY(${tilt.ry.toFixed(2)}deg)`,
                            '--mx': `${tilt.mx}%`,
                            '--my': `${tilt.my}%`
                        }}
                        className="holo-card-surface keep-dark relative rounded-[2rem] overflow-hidden border border-aurora-400/40 bg-gradient-to-br from-[#0b1730] via-[#071124] to-[#041d22] p-5 sm:p-6 shadow-[0_30px_70px_-15px_rgba(16,185,129,0.28)]"
                    >
                        <div className="absolute inset-0 holo-foil-overlay" />
                        <div
                            className="absolute inset-0 opacity-20 pointer-events-none"
                            style={{
                                backgroundImage: 'repeating-linear-gradient(125deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 1px, transparent 1px, transparent 10px)'
                            }}
                        />

                        <div className="relative z-10 space-y-4">
                            <div className="flex items-start justify-between gap-2">
                                <div>
                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-aurora-500/20 border border-aurora-400/40 text-aurora-200 font-mono text-[10px] font-bold">
                                        <Icon name="Sparkles" size={11} /> AI SKILL LAB COMPETENCY CARD
                                    </span>
                                    <h3 className="font-display font-extrabold text-lg sm:text-xl text-white mt-1.5">
                                        {evalResult.rank}
                                    </h3>
                                    <p className="text-xs text-slate-300 truncate">{user?.name} • {user?.hospital}</p>
                                </div>
                                <div className="text-right px-3.5 py-2 rounded-2xl bg-void-950/70 border border-white/15 shrink-0">
                                    <p className="font-mono text-[9px] text-slate-400 uppercase">Empathy Index</p>
                                    <p className="font-mono text-3xl font-extrabold text-aurora-300 leading-none mt-0.5">
                                        {evalResult.totalScore}
                                    </p>
                                </div>
                            </div>

                            <div className="py-1">
                                <FiveAxisRadarSVG radar={evalResult.radar} isEn={isEn} />
                            </div>

                            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-white/10">
                                <div className="text-[10px] font-mono text-slate-400">
                                    <span>rjcloud.organ • AI SKILL LAB</span>
                                    <span className="block text-prism-300">
                                        {isEn ? 'Tilt card with mouse/finger' : 'เลื่อนเมาส์หรือเอียงมือถือเพื่อชมแสงโฮโลแกรม'}
                                    </span>
                                </div>
                                <button
                                    type="button"
                                    onClick={onExportPng}
                                    className="px-3.5 py-2 rounded-xl bg-aurora-500 hover:bg-aurora-400 text-void-950 font-display font-bold text-xs flex items-center gap-1.5 shadow-lg active:scale-95"
                                >
                                    <Icon name="Download" size={14} /> {isEn ? 'Save PNG' : 'บันทึกการ์ด PNG'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function EmotionalJourneyTimeline({ timeline, selectedIdx, onSelectIdx, onRewindToTurn, onPlayMasterVoice, isEn }) {
            if (!timeline || timeline.length === 0) return null;

            const W = 560, H = 160, padX = 34, padY = 22;
            const stepX = timeline.length > 1 ? (W - padX * 2) / (timeline.length - 1) : 0;
            const toY = (val) => padY + ((100 - Math.max(0, Math.min(100, val))) / 100) * (H - padY * 2);

            const buildPath = (key) => timeline.map((pt, i) => {
                const x = timeline.length > 1 ? padX + i * stepX : W / 2;
                const y = toY(pt[key]);
                return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
            }).join(' ');

            const selectedPoint = timeline[selectedIdx] || timeline[timeline.length - 1];
            const emo = EMOTION_PHYSICS[selectedPoint.emotion] || EMOTION_PHYSICS.CONFUSED;

            return (
                <div className="vision-glass rounded-[1.75rem] p-4 sm:p-6 space-y-4 border-prism-400/25">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <span className="font-mono text-[10px] font-bold text-prism-300 uppercase">
                                AFFECTIVE TIMELINE & TIME-REWIND ENGINE
                            </span>
                            <h3 className="font-display font-bold text-base sm:text-lg text-white">
                                {isEn ? 'Emotional Journey & Turning Points' : 'เส้นทางอารมณ์ญาติ & จุดเปลี่ยนสำคัญ'}
                            </h3>
                        </div>
                        <div className="flex items-center gap-3 text-[11px] font-bold">
                            <span className="flex items-center gap-1.5 text-aurora-300">
                                <span className="w-2.5 h-2.5 rounded-full bg-aurora-400" /> {isEn ? 'Trust' : 'ความไว้วางใจ'}
                            </span>
                            <span className="flex items-center gap-1.5 text-rose-300">
                                <span className="w-2.5 h-2.5 rounded-full bg-rose-400" /> {isEn ? 'Tension' : 'ความตึงเครียด'}
                            </span>
                        </div>
                    </div>

                    <div className="w-full rounded-2xl bg-void-950/70 border border-white/10 p-2 overflow-hidden">
                        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block">
                            {[25, 50, 75].map(v => (
                                <line key={v} x1={padX} y1={toY(v)} x2={W - padX} y2={toY(v)} stroke="rgba(148,163,184,0.12)" strokeDasharray="4 4" />
                            ))}
                            <path d={buildPath('tension')} fill="none" stroke="#fb7185" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                            <path d={buildPath('trust')} fill="none" stroke="#34d399" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />

                            {timeline.map((pt, i) => {
                                const x = timeline.length > 1 ? padX + i * stepX : W / 2;
                                const yTrust = toY(pt.trust);
                                const isSel = i === selectedIdx;
                                return (
                                    <g key={pt.id} onClick={() => onSelectIdx(i)} className="cursor-pointer">
                                        {isSel && <circle cx={x} cy={yTrust} r="12" fill="rgba(52,211,153,0.22)" />}
                                        <circle
                                            cx={x}
                                            cy={yTrust}
                                            r={isSel ? 6.5 : 5}
                                            fill={pt.deltaTrust >= 0 ? '#34d399' : '#fb7185'}
                                            stroke="#030712"
                                            strokeWidth="2"

        function downloadHolographicCardPng(evalResult, user, isEn) {
            const canvas = document.createElement('canvas');
            const W = 1200, H = 760;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#030712');
            bg.addColorStop(0.5, '#09162e');
            bg.addColorStop(1, '#042429');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            const g1 = ctx.createRadialGradient(260, 180, 20, 260, 180, 420);
            g1.addColorStop(0, 'rgba(16, 185, 129, 0.28)');
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, W, H);

            const g2 = ctx.createRadialGradient(940, 560, 20, 940, 560, 400);
            g2.addColorStop(0, 'rgba(34, 211, 238, 0.25)');
            g2.addColorStop(1, 'transparent');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(52, 211, 153, 0.55)';
            ctx.lineWidth = 4;
            ctx.strokeRect(28, 28, W - 56, H - 56);

            ctx.fillStyle = '#6ee7b7';
            ctx.font = '700 20px "JetBrains Mono", monospace';
            ctx.fillText('RJCLOUD.ORGAN • AI SKILL LAB', 76, 98);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 46px "Prompt", sans-serif';
            ctx.fillText(evalResult.rank, 76, 166);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '600 28px "Sarabun", sans-serif';
            ctx.fillText(user?.name || 'Clinical Communicator', 76, 224);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 22px "Sarabun", sans-serif';
            ctx.fillText(user?.hospital || 'rjcloud.organ Network', 76, 262);

            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.fillRect(76, 310, 430, 150);
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 2;
            ctx.strokeRect(76, 310, 430, 150);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 18px "JetBrains Mono", monospace';
            ctx.fillText('OVERALL EMPATHY INDEX', 106, 355);

            ctx.fillStyle = '#34d399';
            ctx.font = '800 72px "JetBrains Mono", monospace';
            ctx.fillText(`${evalResult.totalScore}`, 106, 434);
            ctx.fillStyle = '#64748b';
            ctx.font = '700 28px "JetBrains Mono", monospace';
            ctx.fillText('/100', 228, 434);

            ctx.font = '600 21px "Sarabun", sans-serif';
            evalResult.radar.forEach((r, idx) => {
                const y = 515 + idx * 38;
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText(isEn ? r.labelEN : r.labelTH, 76, y);
                ctx.fillStyle = '#67e8f9';
                ctx.font = '700 21px "JetBrains Mono", monospace';
                ctx.fillText(`${r.value}/100`, 390, y);
                ctx.font = '600 21px "Sarabun", sans-serif';
            });

            const rcx = 860, rcy = 385, maxR = 195;
            const pt = (idx, ratio) => {
                const a = (Math.PI * 2 * idx) / evalResult.radar.length - Math.PI / 2;
                return [rcx + Math.cos(a) * maxR * ratio, rcy + Math.sin(a) * maxR * ratio];
            };

            [0.25, 0.5, 0.75, 1].forEach(lv => {
                ctx.beginPath();
                evalResult.radar.forEach((_, i) => {
                    const [x, y] = pt(i, lv);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.strokeStyle = 'rgba(148,163,184,0.28)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            ctx.beginPath();
            evalResult.radar.forEach((item, i) => {
                const [x, y] = pt(i, item.value / 100);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.34)';
            ctx.fill();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            ctx.textAlign = 'center';
            evalResult.radar.forEach((item, i) => {
                const [x, y] = pt(i, item.value / 100);
                ctx.beginPath();
                ctx.arc(x, y, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#67e8f9';
                ctx.fill();

                const [lx, ly] = pt(i, 1.24);
                ctx.fillStyle = '#e2e8f0';
                ctx.font = '700 18px "Sarabun", sans-serif';
                ctx.fillText(isEn ? item.labelEN : item.labelTH, lx, ly);
            });

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png', 1.0);
            link.download = `AI_SkillLab_Card_${evalResult.totalScore}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function AiSkillLabApp() {
            const isAdminPreview = useMemo(() => {
                try { return new URLSearchParams(window.location.search).get('admin_preview') === '1'; }
                catch (_) { return false; }
            }, []);

            // Adaptive Theme synced across all pages

                    if (saved === 'light' || saved === 'dark') return saved;
                } catch (_) {}
                return CONFIG.theme?.defaultMode === 'light' ? 'light' : 'dark';
            });

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f8fafc');
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
            }, [theme]);

            const toggleTheme = useCallback(() => {
                setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            // โหมดใช้งานจริง: ต้องล็อกอินผู้เรียนจากหน้าหลักก่อน (ยกเว้นโหมด Admin View)
            const [user, setUser] = useState(() => {
                if (isAdminPreview) {
                    return {
                        id: 'admin_preview_2027',
                        license: 'ADMIN2027',
                        name: 'ผู้ดูแลระบบ (Admin View)',
                        position: 'พยาบาลวิชาชีพชำนาญการ',
                        hospital: 'รพ.ราชวิถี',
                        pretest: '30/40',
                        progress: 100
                    };
                }
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user && saved.user.id) return saved.user;
                } catch (_) {}
                return null;
            });

            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [isCloudReady, setIsCloudReady] = useState(false);
            const [previewBarOpen, setPreviewBarOpen] = useState(false);

            // Navigation & Track States
            const [selectedMode, setSelectedMode] = useState(null);
            const [trainingTrack, setTrainingTrack] = useState('full_sim'); // micro_drill | full_sim
            const [phase, setPhase] = useState('menu'); // menu | video_intro | negotiating | evaluating | debrief
            const [drillIndex, setDrillIndex] = useState(0);

            // Spatial HUD Overlays
            const [showTranscriptDrawer, setShowTranscriptDrawer] = useState(false);
            const [showVideoModal, setShowVideoModal] = useState(false);
            const [showCoachWhisper, setShowCoachWhisper] = useState(true);
            const [ambientOn, setAmbientOn] = useState(false);

            // Conversation, Affective Telemetry & Timeline States
            const [messages, setMessages] = useState([]);
            const [timeline, setTimeline] = useState([]);
            const [selectedTimelineIdx, setSelectedTimelineIdx] = useState(0);
            const [relativeEmotion, setRelativeEmotion] = useState('CONFUSED');
            const [aiCoachTip, setAiCoachTip] = useState('');
            const [smartSuggestions, setSmartSuggestions] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const [evalResult, setEvalResult] = useState(null);

            // Vocal Bio-Coach & Therapeutic Silence Meter States
            const [voiceEnabled, setVoiceEnabled] = useState(true);
            const [isAiSpeaking, setIsAiSpeaking] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [micLevel, setMicLevel] = useState(0);
            const [vocalFeedback, setVocalFeedback] = useState('');
            const [vocalSamples, setVocalSamples] = useState([]);
            const [silenceProgress, setSilenceProgress] = useState(0);
            const [silenceEarnedThisTurn, setSilenceEarnedThisTurn] = useState(false);
            const [silenceBonusCount, setSilenceBonusCount] = useState(0);

            // UI Feedback
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', confirmText: 'ยืนยัน', onConfirm: null });

            // Refs
            const userRef = useRef(user);
            const soundscapeRef = useRef(null);
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const speechRecRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const audioCtxRef = useRef(null);
            const vadRafRef = useRef(null);
            const silenceTimerRef = useRef(null);
            const drawerEndRef = useRef(null);

            useEffect(() => { userRef.current = user; }, [user]);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            useEffect(() => {
                const el = document.getElementById('lab-root');
                if (el) el.dataset.mounted = 'true';
                soundscapeRef.current = new AmbientSoundscapeEngine();
                return () => { soundscapeRef.current?.stop(); };
            }, []);

            useEffect(() => {
                if (ambientOn && soundscapeRef.current) {
                    const targetEmo = phase === 'negotiating' ? relativeEmotion : 'CALM';
                    soundscapeRef.current.updateEmotion(targetEmo);
                }
            }, [ambientOn, phase, relativeEmotion]);

            const toggleAmbientSound = useCallback(() => {
                if (!soundscapeRef.current) return;
                if (ambientOn) {
                    soundscapeRef.current.stop();
                    setAmbientOn(false);
                    showToast('ปิดเสียงบรรยากาศห้องรับรองแล้วค่ะ', 'info');
                } else {
                    const targetEmo = phase === 'negotiating' ? relativeEmotion : 'CALM';
                    soundscapeRef.current.start(targetEmo);
                    setAmbientOn(true);
                    showToast('เปิดเสียงบรรยากาศห้องรับรอง 3 มิติแล้วค่ะ', 'info');
                }
            }, [ambientOn, phase, relativeEmotion, showToast]);

            // Connect Firebase (ป้องกันทับสิทธิ์ Admin ตอนเปิด Preview 2 ชั้น)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let anonAttempted = false;
                let unsubSettings = null;

                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser) {
                        if (isAdminPreview) return;
                        if (!anonAttempted) {
                            anonAttempted = true;
                            try {
                                if (typeof fbAuth.authStateReady === 'function') {
                                    await fbAuth.authStateReady();
                                }
                                if (active && !fbAuth.currentUser) {
                                    await signInAnonymously(fbAuth);
                                }
                            } catch (_) {}
                        }
                        return;
                    }
                    setIsCloudReady(true);

                    const cur = userRef.current;
                    if (!isAdminPreview && cur?.id && !String(cur.id).startsWith('admin_preview_')) {
                        try {
                            const snap = await getDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(cur.id)));
                            if (snap.exists()) {
                                const cloudData = snap.data();
                                const merged = { ...cur, ...cloudData, progress: Math.max(cur.progress || 0, cloudData.progress || 0) };
                                setUser(merged);
                                const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                                localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: merged }));
                            }
                        } catch (_) {}
                    }

                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (snap.exists() && snap.data()?.appsScriptUrl) {
                                setAppsScriptUrl(snap.data().appsScriptUrl);
                            }
                        },
                        () => {}
                    );
                });

                return () => {
                    active = false;
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                };
            }, [isAdminPreview]);

            const stopAiVoice = useCallback(() => {
                if (audioRef.current) {
                    try { audioRef.current.pause(); } catch (_) {}
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsAiSpeaking(false);
            }, []);

            const stopMicCompletely = useCallback(() => {
                if (vadRafRef.current) { cancelAnimationFrame(vadRafRef.current); vadRafRef.current = null; }
                if (speechRecRef.current) {
                    try { speechRecRef.current.onend = null; speechRecRef.current.abort(); } catch (_) {}
                    speechRecRef.current = null;
                }
                if (mediaStreamRef.current) {
                    mediaStreamRef.current.getTracks().forEach(t => { try { t.stop(); } catch (_) {} });
                    mediaStreamRef.current = null;
                }
                if (audioCtxRef.current) {
                    try { audioCtxRef.current.close(); } catch (_) {}
                    audioCtxRef.current = null;
                }
                setIsListening(false);
                setMicLevel(0);
            }, []);

            useEffect(() => () => {
                stopAiVoice();
                stopMicCompletely();
                if (silenceTimerRef.current) clearInterval(silenceTimerRef.current);
            }, [stopAiVoice, stopMicCompletely]);

            useEffect(() => {
                if (showTranscriptDrawer) drawerEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, showTranscriptDrawer]);

            // Therapeutic Silence 2.5-Second Tracker
            useEffect(() => {
                if (silenceTimerRef.current) {
                    clearInterval(silenceTimerRef.current);
                    silenceTimerRef.current = null;
                }

                const lastMsg = messages[messages.length - 1];
                const shouldTrack = phase === 'negotiating'
                    && lastMsg?.sender === 'ai'
                    && !isAiSpeaking
                    && !isAiTyping
                    && !isListening
                    && !chatInput.trim()
                    && !silenceEarnedThisTurn;

                if (!shouldTrack) return;

                const startTs = Date.now();
                const TARGET_MS = 2500;
                silenceTimerRef.current = setInterval(() => {
                    const pct = Math.min(100, Math.round(((Date.now() - startTs) / TARGET_MS) * 100));
                    setSilenceProgress(pct);
                    if (pct >= 100) {
                        clearInterval(silenceTimerRef.current);
                        silenceTimerRef.current = null;
                        setSilenceEarnedThisTurn(true);
                        setSilenceBonusCount(c => c + 1);
                        soundscapeRef.current?.playChime();
                        showToast(
                            selectedMode?.language === 'en'
                                ? '✨ Therapeutic Silence +1 (Respectful 2.5s space held)'
                                : '✨ Therapeutic Silence +1 (เว้นจังหวะเงียบรับฟัง 2.5 วินาทีอย่างให้เกียรติ)',
                            'success'
                        );
                    }
                }, 80);

                return () => {
                    if (silenceTimerRef.current) {
                        clearInterval(silenceTimerRef.current);
                        silenceTimerRef.current = null;
                    }
                };
            }, [phase, messages, isAiSpeaking, isAiTyping, isListening, chatInput, silenceEarnedThisTurn, selectedMode, showToast]);

            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'offline' };
                try {
                    const res = await fetch(appsScriptUrl, { method: 'POST', body: JSON.stringify(payload) });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            }, [appsScriptUrl]);

            const speakText = useCallback(async (text, mode, onDone = null) => {
                stopAiVoice();
                if (!voiceEnabled || !text) {
                    if (onDone) onDone();
                    return;
                }
                const cleanText = String(text).replace(/[*#[\]]/g, '').trim();
                if (!cleanText) { if (onDone) onDone(); return; }

                setIsAiSpeaking(true);

                if (appsScriptUrl) {
                    const ttsRes = await callAppsScript({
                        action: 'callGeminiTTS',
                        text: cleanText,
                        voiceName: mode?.voiceName || 'Aoede'
                    });
                    if (ttsRes?.status === 'success' && ttsRes.inlineData?.data) {
                        try {
                            const rate = parseInt(ttsRes.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const wavUrl = pcm16ToWavUrl(ttsRes.inlineData.data, rate);
                            audioUrlRef.current = wavUrl;
                            const audio = new Audio(wavUrl);
                            audioRef.current = audio;
                            audio.onended = () => { stopAiVoice(); if (onDone) onDone(); };
                            audio.onerror = () => { stopAiVoice(); if (onDone) onDone(); };
                            await audio.play();
                            return;
                        } catch (_) {
                            stopAiVoice();
                        }
                    }
                }

                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = mode?.language === 'en' ? 'en-US' : 'th-TH';
                        utter.rate = 0.96;
                        utter.onend = () => { setIsAiSpeaking(false); if (onDone) onDone(); };
                        utter.onerror = () => { setIsAiSpeaking(false); if (onDone) onDone(); };
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }

                setIsAiSpeaking(false);
                if (onDone) onDone();
            }, [voiceEnabled, appsScriptUrl, callAppsScript, stopAiVoice]);

            const toggleMicrophone = async () => {
                if (isListening) {
                    stopMicCompletely();
                    return;
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการรับเสียง กรุณาพิมพ์ข้อความหรือแตะแนวทางคำพูดค่ะ', 'error');
                    return;
                }

                stopAiVoice();
                setVocalFeedback('');

                try {
                    if (navigator.mediaDevices?.getUserMedia) {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: { echoCancellation: true, noiseSuppression: true }
                        });
                        mediaStreamRef.current = stream;
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) {
                            const ctx = new AudioCtx();
                            audioCtxRef.current = ctx;
                            const src = ctx.createMediaStreamSource(stream);
                            const analyser = ctx.createAnalyser();
                            analyser.fftSize = 256;
                            src.connect(analyser);
                            const dataArr = new Uint8Array(analyser.frequencyBinCount);

                            let frameCounter = 0;
                            const sampleVocalBio = () => {
                                analyser.getByteFrequencyData(dataArr);
                                const avg = dataArr.reduce((a, b) => a + b, 0) / dataArr.length;
                                const level = Math.min(100, Math.round(avg * 1.5));
                                setMicLevel(level);
                                frameCounter++;
                                if (frameCounter % 18 === 0 && level > 10) {
                                    const calmScore = level > 76 ? 68 : level > 58 ? 82 : 95;
                                    setVocalSamples(prev => [...prev.slice(-25), calmScore]);
                                    if (level > 76) {
                                        setVocalFeedback(selectedMode?.language === 'en'
                                            ? 'Tone feels intense—try softening your volume slightly'
                                            : 'เสียงค่อนข้างดัง ลองผ่อนน้ำหนักเสียงให้นุ่มลงอีกนิดค่ะ');
                                    } else {
                                        setVocalFeedback(selectedMode?.language === 'en'
                                            ? 'Vocal Calmness: Optimal & Warm'
                                            : 'น้ำเสียงนุ่มนวลและสงบดีมาก (Vocal Calmness: Optimal)');
                                    }
                                }
                                vadRafRef.current = requestAnimationFrame(sampleVocalBio);
                            };
                            sampleVocalBio();
                        }
                    }

                    const rec = new SR();
                    rec.lang = selectedMode?.language === 'en' ? 'en-US' : 'th-TH';
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onresult = (event) => {
                        let transcript = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            transcript += event.results[i][0].transcript;
                        }
                        setChatInput(transcript);
                    };
                    rec.onerror = () => stopMicCompletely();
                    rec.onend = () => stopMicCompletely();
                    speechRecRef.current = rec;
                    rec.start();
                    setIsListening(true);
                } catch (_) {
                    stopMicCompletely();
                    showToast('ไม่สามารถเปิดไมโครโฟนได้ กรุณาอนุญาตสิทธิ์ไมค์บนเบราว์เซอร์ค่ะ', 'error');
                }
            };

            const enterHolodeck = useCallback((mode, track) => {
                stopAiVoice();
                stopMicCompletely();

                const isEn = mode.language === 'en';
                setSelectedMode(mode);
                setTrainingTrack(track);
                setPhase('negotiating');
                setEvalResult(null);
                setDrillIndex(0);
                setTimeline([]);
                setSilenceBonusCount(0);
                setSilenceProgress(0);
                setSilenceEarnedThisTurn(false);
                setVocalSamples([]);
                setVocalFeedback('');
                setShowCoachWhisper(true);

                if (track === 'micro_drill') {
                    const first = GUIDED_DRILLS[isEn ? 'en' : 'th'][0];
                    setRelativeEmotion(first.emotion);
                    setAiCoachTip(first.focusTip);
                    setMessages([
                        { id: `sys-${Date.now()}`, sender: 'system', title: first.stepTitle, text: first.context },
                        { id: `ai-open-${Date.now() + 1}`, sender: 'ai', emotion: first.emotion, speakerName: mode.relativeName, text: first.relativeLine }
                    ]);
                    setSmartSuggestions([
                        first.masterSample,
                        isEn
                            ? 'Hello, I am a clinical coordinator on the care team. I am so sorry for your worry—please sit comfortably in this quiet room.'
                            : 'สวัสดีค่ะ ดิฉันเป็นเจ้าหน้าที่ผู้ประสานงานดูแลครอบครัวค่ะ เข้าใจความกังวลใจอย่างมากเลยนะคะ ขอเชิญคุยกันอย่างสบายใจในห้องรับรองนี้ค่ะ'
                    ]);
                    speakText(first.relativeLine, mode);
                    return;
                }

                setRelativeEmotion(mode.openingEmotion || 'CONFUSED');
                setAiCoachTip(isEn
                    ? 'Tip: Try pausing 2.5 seconds after the relative finishes speaking for Therapeutic Silence, then introduce your name and role gently.'
                    : 'เคล็ดลับ: ลองเว้นจังหวะเงียบ 2.5 วินาทีหลังญาติพูดจบเพื่อรับโบนัส Therapeutic Silence แล้วค่อยแนะนำชื่อ-บทบาทอย่างนุ่มนวลค่ะ');
                setMessages([
                    { id: `sys-${Date.now()}`, sender: 'system', title: isEn ? 'Consultation Room Simulation' : 'ห้องรับรองจำลอง 3 มิติ', text: mode.briefingText },
                    { id: `ai-open-${Date.now() + 1}`, sender: 'ai', emotion: mode.openingEmotion || 'CONFUSED', speakerName: mode.relativeName, text: mode.openingLine }
                ]);
                setSmartSuggestions(isEn ? [
                    'Hello, my name is Nurse Joy, a clinical coordinator on the care team. I am truly sorry for what happened—thank you for coming into this quiet room.',
                    'I know this must feel overwhelming. Before I share the medical update, may I ask what the doctors have explained so far?'
                ] : [
                    'สวัสดีค่ะ ดิฉันชื่อพยาบาลใจดี เป็นพยาบาลผู้ประสานงานจากทีมดูแลค่ะ ขอแสดงความเสียใจกับเหตุการณ์ที่เกิดขึ้นนะคะ ยินดีที่ได้คุยกันในห้องรับรองที่เป็นส่วนตัวนี้ค่ะ',
                    'เข้าใจเลยค่ะว่าตอนนี้ครอบครัวกำลังตกใจและเป็นห่วงมาก ก่อนอื่นขออนุญาตถามเพื่อความเข้าใจตรงกันว่า คุณหมอได้แจ้งอาการให้ทราบบ้างแล้วหรือยังคะ'
                ]);
                speakText(mode.openingLine, mode);
            }, [stopAiVoice, stopMicCompletely, speakText]);

            const handleStartTrack = (mode, track) => {
                stopAiVoice();
                stopMicCompletely();
                setSelectedMode(mode);
                setTrainingTrack(track);
                if (track === 'full_sim') {
                    setPhase('video_intro');
                } else {
                    enterHolodeck(mode, track);
                }
            };

            const handleSendMessage = async (e, presetReply = null) => {
                if (e) e.preventDefault();
                if (!selectedMode || phase !== 'negotiating' || isAiTyping) return;
                const learnerText = String(presetReply ?? chatInput).trim();
                if (!learnerText) return;

                stopAiVoice();
                if (isListening) stopMicCompletely();

                const heldSilenceThisTurn = silenceEarnedThisTurn;
                const prevTrust = (EMOTION_PHYSICS[relativeEmotion] || EMOTION_PHYSICS.CONFUSED).trust;
                const preTurnMessagesSnapshot = [...messages];

                setChatInput('');
                setSmartSuggestions([]);
                setSilenceProgress(0);
                setSilenceEarnedThisTurn(false);

                const userMsgObj = {
                    id: `u-${Date.now()}`,
                    sender: 'user',
                    speakerName: selectedMode.language === 'en' ? 'You (Communicator)' : 'คุณ (ผู้ให้ข้อมูลญาติ)',
                    text: learnerText
                };
                const nextMessages = [...messages, userMsgObj];
                setMessages(nextMessages);

                if (trainingTrack === 'micro_drill') {
                    const drills = GUIDED_DRILLS[selectedMode.language === 'en' ? 'en' : 'th'];
                    const nextIdx = drillIndex + 1;
                    const hasNext = nextIdx < drills.length;

                    if (hasNext) {
                        const nextDrill = drills[nextIdx];
                        const nextMeta = EMOTION_PHYSICS[nextDrill.emotion] || EMOTION_PHYSICS.SAD;
                        setDrillIndex(nextIdx);
                        setRelativeEmotion(nextDrill.emotion);
                        setAiCoachTip(nextDrill.focusTip);

                        setTimeline(prev => [...prev, {
                            id: `tl-${Date.now()}`,

                            aiText: nextDrill.relativeLine,
                            emotion: nextDrill.emotion,
                            trust: nextMeta.trust,
                            tension: nextMeta.tension,
                            deltaTrust: nextMeta.trust - prevTrust,

                            drillIndexBeforeTurn: drillIndex,
                            emotionBeforeTurn: relativeEmotion
                        }]);

                        const aiNext = {
                            id: `ai-d-${Date.now() + 1}`,
                            sender: 'ai',
                            emotion: nextDrill.emotion,
                            speakerName: selectedMode.relativeName,
                            text: nextDrill.relativeLine
                        };
                        setMessages([
                            ...nextMessages,
                            { id: `sys-d-${Date.now()}`, sender: 'system', title: nextDrill.stepTitle, text: nextDrill.context },

                        setSmartSuggestions([

                            selectedMode.language === 'en'
                                ? 'I hear how deeply painful this is. Please take all the quiet time you need.'
