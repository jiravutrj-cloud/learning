        async function fetchStudioTtsBlob({ appsScriptUrl, text, voiceName = 'Sulafat', languageCode = 'th-TH', style = '', signal, cacheKey = '' }) {
            if (cacheKey && typeof CORE.getCachedAudio === 'function') {
                try { const hit = await CORE.getCachedAudio(cacheKey); if (hit && hit.size > 0) return hit; } catch (_) {}
            }
            if (!appsScriptUrl || !navigator.onLine) return null;
            for (let attempt = 0; attempt < 2; attempt++) {
                if (signal && signal.aborted) return null;
                const ctrl = new AbortController();
                const onExtAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onExtAbort, { once: true });
                const tm = setTimeout(() => ctrl.abort(), 45000);
                try {
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'callGeminiTTS', text, voiceName, languageCode, style }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onExtAbort);
                    if (signal && signal.aborted) return null;
                    const res = JSON.parse((await rawRes.text()) || '{}');
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const rateMatch = String(res.inlineData.mimeType || '').match(/rate=(\d+)/);
                        const blob = pcmToWavBlobSafe(res.inlineData.data, parseInt(rateMatch ? rateMatch[1] : '24000', 10));
                        if (blob && blob.size > 0) {
                            if (cacheKey && typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(cacheKey, blob).catch(() => {});
                            return blob;
                        }
                    }
                } catch (_) {
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onExtAbort);
                }
                if (attempt === 0 && !(signal && signal.aborted)) await new Promise(r => setTimeout(r, 1000));
            }
            return null;
        }

        function FiveAxisRadarSVG({ radarArr, theme }) {
            const isDark = theme === 'dark';
            const axes = Array.isArray(radarArr) && radarArr.length === 5
                ? radarArr
                : (SL.RADAR_AXES || []).map(a => ({ key: a.key, labelTH: a.shortTH || a.labelTH, value: 75 }));
            const w = 300, h = 250, cx = w / 2, cy = h / 2, maxR = 72;
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / axes.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const dataPts = axes.map((a, i) => pt(i, Math.max(0, Math.min(100, Number(a.value || 0))) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[300px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.5" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.22" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={axes.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.24)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {axes.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.2)' : 'rgba(15,58,125,0.14)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.8" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.5" />
                    ))}
                    {axes.map((a, i) => {
                        const [lx, ly] = pt(i, 1.38);
                        return (
                            <g key={a.key || i}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.2" fontWeight="700">{a.shortTH || a.labelTH}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">{a.value}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

            }, [phase, ambientOn]);

            // Calm 15s Breathing Countdown
            useEffect(() => {
                if (calmSeconds <= 0) return;
                const t = setInterval(() => setCalmSeconds(s => Math.max(0, s - 1)), 1000);
                return () => clearInterval(t);
            }, [calmSeconds]);

            // Mount Context-Aware 3D Anime Human Hologram in Phase 3 (Consultation Room)
            useEffect(() => {
                if (phase !== 'negotiating' || !stageContainerRef.current || typeof SL.mountHologram3D !== 'function') return;
                const ctrl = SL.mountHologram3D(stageContainerRef.current, {
                    personaId: effectivePersonaId,
                    emotion: currentEmotion,
                    trust: trustScore,
                    isSpeaking,
                    activeSpeaker: activeSpeakerKey
                });
                holoControllerRef.current = ctrl;
                return () => {
                    try { ctrl.destroy(); } catch (_) {}
                    holoControllerRef.current = null;
                };
            }, [phase]);

            useEffect(() => {
                if (holoControllerRef.current) {
                    holoControllerRef.current.update({
                        personaId: effectivePersonaId,
                        emotion: currentEmotion,
                        trust: trustScore,
                        isSpeaking,
                        activeSpeaker: activeSpeakerKey
                    });
                }
            }, [effectivePersonaId, currentEmotion, trustScore, isSpeaking, activeSpeakerKey]);

            // ============================================================================
            // 6. AUDIO ENGINE (GUIDE VOICE + RELATIVE MULTI-VOICE • NO SUBTITLES)
            // ============================================================================
            const unlockMobileAudio = useCallback(() => {
                try {
                    if (!sharedAudioRef.current) {
                        const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', ''); a.preload = 'auto';
                        sharedAudioRef.current = a;
                    }
                    const a = sharedAudioRef.current;
                    if (a.paused && !a.src) {
                        a.muted = true; a.src = SILENT_UNLOCK_WAV;
                        const p = a.play();
                        if (p && typeof p.then === 'function') p.then(() => { try { a.pause(); a.currentTime = 0; } catch (_) {} a.muted = false; }).catch(() => { a.muted = false; });
                        else a.muted = false;
                    }
                } catch (_) {}
            }, []);

            const stopAllAiVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (voiceAbortRef.current) { try { voiceAbortRef.current.abort(); } catch (_) {} voiceAbortRef.current = null; }
                if (sharedAudioRef.current) { try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {} }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setIsSpeaking(false);
                setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, []);

            useEffect(() => () => {
                stopAllAiVoice();
                if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
                if (vocalRecorderRef.current) { try { vocalRecorderRef.current.abort(); } catch (_) {} }
                selfRecordings.forEach(r => { if (r?.audioUrl) { try { URL.revokeObjectURL(r.audioUrl); } catch (_) {} } });
            }, []);

            const armTherapeuticSilenceTimer = useCallback(() => {
                relativeEndTimeRef.current = Date.now();
                setSilenceReady(false);
                if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
                silenceTimerRef.current = setTimeout(() => setSilenceReady(true), 2500);
            }, []);

            const playRelativeSegments = useCallback(async (speechText, pid, emotionKey, lang = 'th') => {
                stopAllAiVoice();
                if (!voiceEnabled || !speechText) {
                    armTherapeuticSilenceTimer();
                    return;
                }
                unlockMobileAudio();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;

                const segs = typeof SL.splitDualSpeakerSegments === 'function'
                    ? SL.splitDualSpeakerSegments(speechText, pid, lang)
                    : [{ speaker: 'primary', label: activePersona.speakerRoleTH || 'ญาติผู้ป่วย', voiceName: pid === 'sbar_doctor' ? 'Puck' : 'Sulafat', text: speechText }];

                const emoMeta = EMOTIONS[emotionKey] || EMOTIONS.CONFUSED || {};
                const ttsStyle = lang === 'en' ? (emoMeta.ttsStyleEN || '') : (emoMeta.ttsStyleTH || '');

                if (!sharedAudioRef.current) {
                    const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', '');
                    sharedAudioRef.current = a;
                }

                for (let i = 0; i < segs.length; i++) {
                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                    const seg = segs[i];
                    setActiveSpeakerKey(seg.speaker || 'primary');
                    if (seg.label) setActiveSpeakerBadge(seg.label);

                    const blob = await fetchStudioTtsBlob({
                        appsScriptUrl,
                        text: seg.text,
                        voiceName: seg.voiceName || 'Sulafat',
                        languageCode: lang === 'en' ? 'en-US' : 'th-TH',
                        style: ttsStyle,
                        signal: ctrl.signal
                    });
                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;

                    if (!blob || blob.size === 0) {
                        // โหมดจำลองจังหวะขยับปากสั้นๆ กรณีออฟไลน์/พรีวิวที่ไม่สามารถเรียก Apps Script TTS
                        setIsSpeaking(true);
                        await new Promise(r => setTimeout(r, Math.min(3400, Math.max(1500, seg.text.length * 24))));
                        if (voiceSessionRef.current !== sid) return;
                        setIsSpeaking(false);
                        continue;
                    }

                    setIsSpeaking(true);
                    if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} }
                    const url = URL.createObjectURL(blob);
                    audioUrlRef.current = url;

                    await new Promise((resolve) => {
                        const a = sharedAudioRef.current;
                        a.muted = false; a.src = url;
                        a.onended = () => resolve(true);
                        a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });
                    if (voiceSessionRef.current !== sid) return;
                }

                if (voiceSessionRef.current === sid) {
                    setIsSpeaking(false);
                    armTherapeuticSilenceTimer();
                }
            }, [stopAllAiVoice, voiceEnabled, unlockMobileAudio, appsScriptUrl, EMOTIONS, activePersona.speakerRoleTH, armTherapeuticSilenceTimer]);

            const playGuideVoice = useCallback(async (key, text, options = {}) => {
                const { silentFail = false } = options || {};
                if (guideVoiceState.activeKey === key && guideVoiceState.status !== 'idle') {
                    stopAllAiVoice();
                    return;
                }
                unlockMobileAudio();
                stopAllAiVoice();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;

                setGuideVoiceState({ activeKey: key, status: 'loading' });
                const blob = await fetchStudioTtsBlob({
                    appsScriptUrl,
                    text,
                    voiceName: 'Sulafat',
                    languageCode: 'th-TH',
                    style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ เป็นมิตรเหมือนอาจารย์ผู้ดูแลห้องฝึก',
                    signal: ctrl.signal,
                    cacheKey: key
                });
                if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                if (!blob || blob.size === 0) {
                    setGuideVoiceState({ activeKey: '', status: 'idle' });
                    if (!silentFail) showToast('ไม่สามารถเชื่อมต่อเสียง AI สตูดิโอได้ชั่วคราว กรุณาลองกดฟังใหม่ค่ะ', 'info');
                    return;
                }

                setGuideVoiceState({ activeKey: key, status: 'speaking' });
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} }
                const url = URL.createObjectURL(blob);
                audioUrlRef.current = url;

                await new Promise((resolve) => {
                    const a = sharedAudioRef.current;
                    a.muted = false; a.src = url;
                    a.onended = () => resolve(true);
                    a.onerror = () => resolve(false);
                    try { a.load(); } catch (_) {}
                    const p = a.play();
                    if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                });

                if (voiceSessionRef.current === sid) setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, [guideVoiceState, stopAllAiVoice, unlockMobileAudio, appsScriptUrl, showToast]);

            const phaseVoiceGuide = useMemo(() => {
                if (phase === 'lobby') {
                    return {
                        key: 'skilllab_guide_lobby_anime',
                        text: 'ยินดีต้อนรับสู่ห้องฝึกสื่อสารสามมิติ เอไอสกิลแล็บ ค่ะ ท่านสามารถเลือกรูปแบบการฝึก ระดับความยาก และสถานการณ์คลินิกที่ต้องการ โดยตัวละครโฮโลแกรมสามมิติจะปรับตามบริบทและเพศของคู่สนทนาให้อัตโนมัติ จากนั้นกดปุ่มเปิดแฟ้มส่งเวรด้านล่างได้เลยค่ะ'
                    };
                }
                if (phase === 'briefing') {
                    return {
                        key: `skilllab_guide_brief_${effectivePersonaId}`,
                        text: `แฟ้มส่งเวรหอผู้ป่วยวิกฤตค่ะ กรุณาอ่านข้อมูลผู้ป่วยและปมในใจทั้งสามข้อให้เข้าใจ ประเมินความมั่นใจก่อนฝึก แล้วกดปุ่มเคาะประตูเข้าห้องให้คำปรึกษาได้เลยค่ะ`
                    };
                }
                if (phase === 'result' && evalResult) {
                    return {
                        key: 'skilllab_guide_result',
                        text: `การฝึกเสร็จสมบูรณ์แล้วค่ะ คะแนนประเมินเรดาร์ห้าแกนของท่านอยู่ที่ ${evalResult.score} เต็มหนึ่งร้อยคะแนน สามารถทบทวนประโยคทอง จุดควรเกลา และกดบันทึกผลกลับสู่ห้องเรียนหลักได้ทันทีค่ะ`
                    };
                }
                return null;
            }, [phase, effectivePersonaId, evalResult]);

            useEffect(() => {
                if (!phaseVoiceGuide || isAdminPreview) return;
                if (autoPlayedGuidesRef.current.has(phaseVoiceGuide.key)) return;
                autoPlayedGuidesRef.current.add(phaseVoiceGuide.key);
                const tm = setTimeout(() => {
                    playGuideVoice(phaseVoiceGuide.key, phaseVoiceGuide.text, { silentFail: true });
                }, 460);
                return () => clearTimeout(tm);
            }, [phaseVoiceGuide, isAdminPreview, playGuideVoice]);

            // ============================================================================
            // 7. SESSION START, CONVERSATION SEND, MIC & EVALUATION HANDLERS
            // ============================================================================
            const handleReturnToDashboard = () => {
                stopAllAiVoice();
                if (user?.id) saveSessionTwoLayer(user);
                window.location.href = isAdminPreview ? './index.html?admin_preview=dashboard' : './index.html?return=dashboard';
            };

            const handleApplyRec = () => {
                stopAllAiVoice();
                if (activeRec.mode) setModeId(activeRec.mode);
                if (activeRec.difficulty) setDifficultyId(activeRec.difficulty);
                if (activeRec.personaId) setPersonaId(activeRec.personaId);
                showToast('ตั้งค่าห้องฝึกตามที่ AI แนะนำเรียบร้อยแล้วค่ะ กดเปิดแฟ้มส่งเวรเข้าห้องได้เลย!');
            };

            const handleEnterConsultationRoom = () => {
                unlockMobileAudio();
                stopAllAiVoice();
                if (SL.SoundFX && typeof SL.SoundFX.playDoorKnock === 'function') SL.SoundFX.playDoorKnock();

                setUnlockedBarrierIds([]);
                setUsedCurveballs([]);
                setActiveCurveballBanner(null);
                setTriggerHits([]);
                setTriggerTotal(0);
                setSilenceCount(0);
                setSilenceReady(false);
                setLastTrustDelta(0);
                setSelfRecordings([]);
                setPostEffSaved(false);
                setDrillIdx(0);
                setDrillResults([]);
                setLatestDrillFeedback(null);

                if (selectedMode.isDrill && MICRO_DRILL_STAGES.length > 0) {
                    const st0 = MICRO_DRILL_STAGES[0];
                    setCurrentEmotion(st0.emotion || 'CONFUSED');
                    setTrustScore((EMOTIONS[st0.emotion]?.baseTrust) || 38);
                    setActiveSpeakerBadge(st0.badgeTH);
                    setActionCueText(st0.actionTH || '');
                    setLastCoachHint('โหมด Micro-Drill: ตอบให้ครบประเด็นหลักเพื่อผ่านด่าน 1/4');
                    setMessages([{ id: Date.now(), role: 'relative', text: st0.promptTH, emotion: st0.emotion, actionCue: st0.actionTH }]);
                    setPhase('negotiating');
                    setTimeout(() => playRelativeSegments(st0.promptTH, st0.personaId, st0.emotion, 'th'), 520);
                    return;
                }

                const isEn = selectedMode.lang === 'en';
                const openEmo = activePersona.openingEmotion || 'CONFUSED';
                const openText = isEn ? (activePersona.openingEN || activePersona.openingTH) : activePersona.openingTH;
                const openAct = isEn ? (activePersona.openingActionEN || activePersona.openingActionTH) : activePersona.openingActionTH;

                setCurrentEmotion(openEmo);
                setTrustScore((EMOTIONS[openEmo]?.baseTrust) || 38);
                setActiveSpeakerBadge(activePersona.speakerRoleTH || 'ญาติผู้ป่วย');
                setActionCueText(openAct || '');
                setLastCoachHint(difficultyId === 'hard' ? '' : 'เริ่มจากการแนะนำตัว แสดงความเสียใจอย่างอ่อนโยน และรับฟังความรู้สึกก่อนอธิบายข้อมูลค่ะ');
                setMessages([{ id: Date.now(), role: 'relative', text: openText, emotion: openEmo, actionCue: openAct }]);
                setPhase('negotiating');
                setTimeout(() => playRelativeSegments(openText, activePersona.id, openEmo, selectedMode.lang), 520);
            };

            const handleSendMessage = async (overrideText = null, vocalMeta = null) => {
                const raw = String(overrideText ?? inputText).trim();
                if (!raw || sending) return;

                stopAllAiVoice();
                setInputText('');
                setActiveCurveballBanner(null);

                const waitedMs = relativeEndTimeRef.current > 0 ? Date.now() - relativeEndTimeRef.current : 0;
                const usedSilence = waitedMs >= 2500 && relativeEndTimeRef.current > 0;
                if (usedSilence) setSilenceCount(c => c + 1);
                setSilenceReady(false);

                const triggers = typeof SL.detectTriggerPhrases === 'function' ? SL.detectTriggerPhrases(raw, selectedMode.lang) : [];
                setTriggerHits(triggers);
                if (triggers.length > 0) setTriggerTotal(t => t + triggers.length);

                const nextMsgs = [...messages, { id: Date.now(), role: 'user', text: raw, usedSilence, vocalMeta }];
                setMessages(nextMsgs);

                // --- MODE: MICRO-DRILL 4 STAGES ---
                if (selectedMode.isDrill) {
                    const stageObj = MICRO_DRILL_STAGES[drillIdx];
                    const fb = typeof SL.evaluateMicroDrillAnswer === 'function'
                        ? SL.evaluateMicroDrillAnswer(stageObj, raw, triggers, usedSilence)
                        : { stage: drillIdx + 1, score: 80, passed: true, hitLabels: [], missLabels: [], modelAnswerTH: stageObj?.modelAnswerTH || '' };
                    const nextResults = [...drillResults, fb];
                    setDrillResults(nextResults);
                    setLatestDrillFeedback(fb);
                    if (SL.SoundFX && typeof SL.SoundFX.playChime === 'function') SL.SoundFX.playChime(fb.passed ? [523.25, 659.25, 783.99] : [330, 293]);

                    if (drillIdx + 1 < MICRO_DRILL_STAGES.length) {
                        const nextI = drillIdx + 1;
                        const nxt = MICRO_DRILL_STAGES[nextI];
                        setTimeout(() => {
                            setDrillIdx(nextI);
                            setCurrentEmotion(nxt.emotion || 'CONFUSED');
                            setActiveSpeakerBadge(nxt.badgeTH);
                            setActionCueText(nxt.actionTH || '');
                            setMessages(prev => [...prev, { id: Date.now() + 1, role: 'relative', text: nxt.promptTH, emotion: nxt.emotion, actionCue: nxt.actionTH }]);
                            playRelativeSegments(nxt.promptTH, nxt.personaId, nxt.emotion, 'th');
                        }, 1600);
                    } else {
                        setTimeout(() => handleFinishAndEvaluate(nextMsgs, nextResults), 1800);
                    }
                    return;
                }

                // --- MODE: ROLEPLAY TH / EN ---
                setSending(true);
                setLatencyCue(typeof SL.pickLatencyMaskCue === 'function' ? SL.pickLatencyMaskCue(activePersona.id, selectedMode.lang === 'en') : 'คู่สนทนากำลังตั้งสติและไตร่ตรอง...');
                if (SL.SoundFX && typeof SL.SoundFX.playThinkingCue === 'function') SL.SoundFX.playThinkingCue();

                const bRes = typeof SL.evaluateBarriersUnlocked === 'function'
                    ? SL.evaluateBarriersUnlocked(activePersona.id, raw, unlockedBarrierIds)
                    : { unlockedIds: unlockedBarrierIds, newlyUnlocked: [], total: 3 };
                setUnlockedBarrierIds(bRes.unlockedIds);
                if (bRes.newlyUnlocked.length > 0 && SL.SoundFX && typeof SL.SoundFX.playChime === 'function') {
                    SL.SoundFX.playChime([523.25, 659.25, 783.99]);
                }

                // Check Hard Mode Curveball
                const nextTurnNumber = nextMsgs.filter(m => m.role === 'user').length;
                if (difficultyId === 'hard' && typeof SL.pickHardCurveball === 'function') {
                    const cb = SL.pickHardCurveball(nextTurnNumber, usedCurveballs);
                    if (cb) {
                        setUsedCurveballs(prev => [...prev, cb.id]);
                        setActiveCurveballBanner(cb);
                        if (cb.type === 'phone' && SL.SoundFX && typeof SL.SoundFX.playPhoneBuzz === 'function') SL.SoundFX.playPhoneBuzz();
                        const cbSpeech = selectedMode.lang === 'en' ? (cb.speechEN || cb.speechTH) : cb.speechTH;
                        const cbAct = selectedMode.lang === 'en' ? (cb.actionEN || cb.actionTH) : cb.actionTH;
                        setCurrentEmotion(cb.emotion || 'ANGRY');
                        setActionCueText(cbAct || '');
                        setMessages(prev => [...prev, { id: Date.now() + 2, role: 'relative', text: cbSpeech, emotion: cb.emotion, actionCue: cbAct }]);
                        setSending(false);
                        setLatencyCue('');
                        playRelativeSegments(cbSpeech, activePersona.id, cb.emotion, selectedMode.lang);
                        return;
                    }
                }

                // Call Gemini Roleplay via Apps Script (or smart local fallback)
                let parsed = null;
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const historyTxt = nextMsgs.slice(-8).map(m => `${m.role === 'user' ? 'พยาบาล' : 'คู่สนทนา'}: ${m.text}`).join('\n');
                        const sysPrompt = `คุณสวมบทบาทเป็น ${activePersona.speakerRoleTH} ในเคส: ${activePersona.briefingTH}\n${activePersona.promptHintTH || ''}\nระดับความยาก: ${difficultyId} | ปมที่คลายแล้ว: ${bRes.unlockedIds.length}/3 | Trust ปัจจุบัน: ${trustScore}%\nตอบสั้น 2-3 ประโยคสมจริงภาษา${selectedMode.lang === 'en' ? 'อังกฤษ' : 'ไทย'} ขึ้นต้นด้วยแท็ก [EMOTION:SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] [ACTION:ภาษากายสั้นๆ]${difficultyId === 'normal' ? ' [COACH:คำแนะนำสั้น 1 บรรทัดให้พยาบาล]' : ''} ตามด้วยคำพูด`;
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'callGemini', prompt: historyTxt, systemInstruction: sysPrompt }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const data = JSON.parse((await rawRes.text()) || '{}');
                        if (data?.status === 'success' && data.text) {
                            parsed = typeof SL.parseRelativeResponse === 'function'
                                ? SL.parseRelativeResponse(data.text, currentEmotion)
                                : { speech: data.text, emotion: currentEmotion, actionCue: '', coachHint: '' };
                        }
                    } catch (_) {}
                }

                if (!parsed) {
                    const unlockedCnt = bRes.unlockedIds.length;
                    const fallbackEmo = triggers.length > 0 ? 'ANGRY' : (unlockedCnt >= 3 ? 'CALM' : unlockedCnt >= 2 ? 'HESITANT' : 'SAD');
                    let fbSpeech = '';
                    if (activePersona.id === 'conflict') {
                        fbSpeech = unlockedCnt >= 2
                            ? '[คุณแม่]: ขอบคุณนะคะที่ไม่บังคับแม่... พอฟังแบบนี้ใจแม่ก็เบาลงเยอะเลยค่ะ [ภรรยา]: ขอบคุณคุณพยาบาลมากนะคะ เดี๋ยวหนูกับคุณแม่ขอคุยกันเงียบๆ สักครู่นะคะ'
                            : '[ภรรยา]: หนูแค่อยากทำตามบัตรที่พี่ต้นตั้งใจไว้ค่ะ... [คุณแม่]: แม่ยังทำใจไม่ได้จริงๆ ค่ะ คุณพยาบาลช่วยบอกแม่ทีว่าเราจะไม่โดนบังคับใช่ไหมคะ?';
                    } else if (activePersona.id === 'sbar_doctor') {
                        fbSpeech = unlockedCnt >= 2
                            ? 'รับทราบครับ SBAR ชัดเจนมาก เดี๋ยวผมสั่ง Order สารน้ำ ยาพยุงความดัน และ DDAVP ทันทีครับ รบกวนเตรียมทีมตรวจสมองตายและประสาน ODC ต่อได้เลยครับ'
                            : 'ครับ พอเห็นภาพแล้ว แต่ขอความชัดเจนเรื่องการประเมินภาวะเบาจืดและแผนการรักษาเร่งด่วนที่แนะนำเพิ่มเติมด้วยครับ';
                    } else {
                        fbSpeech = triggers.length > 0
                            ? 'เดี๋ยวนะคะ... ฟังคำพูดเมื่อกี้แล้วใจหนูยิ่งสั่นไปหมดเลยค่ะ ทำไมต้องรีบขนาดนี้ด้วยคะ?'
                            : unlockedCnt >= 3
                                ? 'ขอบคุณคุณพยาบาลมากนะคะที่ค่อยๆ อธิบายด้วยความอ่อนโยนและไม่เร่งรัดเลย ตอนนี้หนูเข้าใจและสบายใจขึ้นมากแล้วค่ะ ขอเวลาไปคุยกับครอบครัวอีกนิดนะคะ'
                                : 'ขอบคุณนะคะที่ช่วยอธิบาย... ใจหนูเริ่มเบาลงบ้างแล้วค่ะ แต่ยังกังวลเรื่องการดูแลร่างและเวลาในการตัดสินใจอยู่เลยค่ะ';
                    }
                    parsed = {
                        speech: fbSpeech,
                        emotion: fallbackEmo,
                        actionCue: fallbackEmo === 'CALM' ? 'ถอนหายใจเบาลง สบตาด้วยแววตาที่ผ่อนคลายและไว้วางใจ' : 'สูดลมหายใจช้าๆ พยักหน้ารับฟังอย่างตั้งใจ',
                        coachHint: difficultyId === 'normal' ? (unlockedCnt < 3 ? 'เยี่ยมค่ะ ลองคลายปมในใจที่เหลือและเน้นหลักไม่เร่งรัดเพิ่มเติมนะคะ' : 'คลายปมครบแล้ว สามารถกด “จบเคส & ประเมินผล” ได้เลยค่ะ') : ''
                    };
                }

                const inertia = typeof SL.computeInertiaTrust === 'function'
                    ? SL.computeInertiaTrust({
                        prevTrust: trustScore, aiEmotion: parsed.emotion, newlyUnlockedCount: bRes.newlyUnlocked.length,
                        totalUnlockedCount: bRes.unlockedIds.length, triggerCount: triggers.length, usedSilence, difficulty: difficultyId, userText: raw
                    })
                    : { trust: Math.min(95, trustScore + 12), delta: 12, emotion: parsed.emotion };

                setTrustScore(inertia.trust);
                setLastTrustDelta(inertia.delta);
                setCurrentEmotion(inertia.emotion);
                if (parsed.actionCue) setActionCueText(parsed.actionCue);
                if (difficultyId === 'normal' && parsed.coachHint) setLastCoachHint(parsed.coachHint);

                setMessages(prev => [...prev, { id: Date.now() + 3, role: 'relative', text: parsed.speech, emotion: inertia.emotion, actionCue: parsed.actionCue }]);
                setSending(false);
                setLatencyCue('');
                playRelativeSegments(parsed.speech, activePersona.id, inertia.emotion, selectedMode.lang);
            };

            const handleToggleMic = async () => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง สามารถพิมพ์ข้อความโต้ตอบได้ตามปกติค่ะ', 'info');
                    return;
                }
                if (micListening) {
                    try { recognitionRef.current?.stop(); } catch (_) {}
                    setMicListening(false);
                    if (vocalRecorderRef.current?.isActive()) {
                        await vocalRecorderRef.current.stop();
                    }
                    setVocalLiveMetric(null);
                    return;
                }

                stopAllAiVoice();
                if (!vocalRecorderRef.current && typeof SL.createVocalToneRecorder === 'function') {
                    vocalRecorderRef.current = SL.createVocalToneRecorder();
                }
                if (vocalRecorderRef.current) {
                    vocalRecorderRef.current.start((m) => setVocalLiveMetric(m)).catch(() => {});
                }

                const rec = new SR();
                rec.lang = selectedMode.lang === 'en' ? 'en-US' : 'th-TH';
                rec.interimResults = true;
                rec.continuous = false;
                let finalSpoken = '';

                rec.onresult = (ev) => {
                    let interim = '';
                    for (let i = ev.resultIndex; i < ev.results.length; i++) {
                        if (ev.results[i].isFinal) finalSpoken += ev.results[i][0].transcript;
                        else interim += ev.results[i][0].transcript;
                    }
                    setInputText((finalSpoken + interim).trim());
                };
                rec.onend = async () => {
                    setMicListening(false);
                    setVocalLiveMetric(null);
                    let vMeta = null;
                    if (vocalRecorderRef.current?.isActive()) {
                        vMeta = await vocalRecorderRef.current.stop();
                        if (vMeta?.audioUrl) {
                            setSelfRecordings(prev => [...prev, { turn: userTurnCount + 1, text: finalSpoken.trim(), ...vMeta }]);
                        }
                    }
                    if (autoSendVoice && finalSpoken.trim()) {
                        handleSendMessage(finalSpoken.trim(), vMeta);
                    }
                };
                rec.onerror = () => {
                    setMicListening(false);
                    setVocalLiveMetric(null);
                    if (vocalRecorderRef.current?.isActive()) vocalRecorderRef.current.abort();
                };
                recognitionRef.current = rec;
                setMicListening(true);
                try { rec.start(); } catch (_) { setMicListening(false); }
            };

            const handleFinishAndEvaluate = async (finalMsgs = null, finalDrillRes = null) => {
                stopAllAiVoice();
                setPhase('evaluating');
                const msgList = finalMsgs || messages;
                const dRes = finalDrillRes || drillResults;

                let result = null;
                if (selectedMode.isDrill && dRes.length > 0) {
                    const avg = Math.round(dRes.reduce((s, r) => s + Number(r.score || 0), 0) / dRes.length);
                    result = {
                        score: avg,
                        radar: [
                            { key: 'setting', labelTH: 'ห้องรับรอง & บทบาท', value: Math.min(98, avg + 4) },
                            { key: 'empathy', labelTH: 'รับรู้อารมณ์ร่วม', value: avg },
                            { key: 'clarity', labelTH: 'ข้อมูลภาวะสมองตาย', value: Math.min(98, avg + 2) },
                            { key: 'vocal', labelTH: 'น้ำเสียง & ความเงียบ', value: Math.max(60, avg - 2) },
                            { key: 'dignity', labelTH: 'ไม่เร่งรัด & เกียรติร่าง', value: Math.min(98, avg + 3) }
                        ],
                        radarMap: { setting: Math.min(98, avg + 4), empathy: avg, clarity: Math.min(98, avg + 2), vocal: Math.max(60, avg - 2), dignity: Math.min(98, avg + 3) },
                        goldenMoment: `ผ่านโหมด Micro-Drill ครบ ${dRes.length} ด่านคำถามหนัก เฉลี่ย ${avg}/100 คะแนนค่ะ`,
                        turningPoint: 'สามารถทบทวนประโยคต้นแบบของแต่ละด่านแล้วนำไปฝึกต่อในโหมด Roleplay เต็มรูปแบบได้เลยค่ะ',
                        summary: `Micro-Drill 4 ด่านคำถามหนัก • ผ่าน ${dRes.filter(r => r.passed).length}/${dRes.length} ด่าน`
                    };
                } else {
                    const fallbackEval = typeof SL.evaluateConversationFallback === 'function'
                        ? SL.evaluateConversationFallback({ messages: msgList, barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal, finalTrust: trustScore })
                        : { score: 84, radar: [], radarMap: {}, goldenMoment: 'สื่อสารได้ดีค่ะ', turningPoint: 'ลองเว้นความเงียบ 2.5 วิเพิ่มนะคะ', summary: '' };
                    result = fallbackEval;

                    if (appsScriptUrl && navigator.onLine && typeof SL.buildSupervisorEvaluationPrompt === 'function') {
                        try {
                            const prompt = SL.buildSupervisorEvaluationPrompt({
                                messages: msgList, personaTitle: activePersona.titleTH,
                                barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal, finalTrust: trustScore
                            });
                            if (prompt) {
                                const ctrl = new AbortController();
                                const tm = setTimeout(() => ctrl.abort(), 14000);
                                const rawRes = await fetch(appsScriptUrl, {
                                    method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify({ action: 'callGemini', prompt, systemInstruction: 'ตอบเป็น JSON ล้วนตามรูปแบบเท่านั้น' }),
                                    signal: ctrl.signal
                                });
                                clearTimeout(tm);
                                const data = JSON.parse((await rawRes.text()) || '{}');
                                if (data?.status === 'success' && data.text && typeof SL.parseSupervisorJson === 'function') {
                                    result = SL.parseSupervisorJson(data.text, fallbackEval);
                                }
                            }
                        } catch (_) {}
                    }
                }

                // บันทึกประวัติ AI Skill Lab และซิงค์ขึ้น Cloud + 2-Layer Session ทันที
                const preAvg = Number(((preEff.explainBrainDeath + preEff.handleEmotion + preEff.gentleApproach) / 3).toFixed(2));
                const avgVocalCalm = selfRecordings.length > 0
                    ? Math.round(selfRecordings.reduce((s, r) => s + Number(r.calmScore || 80), 0) / selfRecordings.length)
                    : null;
                const entry = {
                    at: new Date().toISOString(),
                    modeId, difficultyId, personaId: effectivePersonaId,
                    score: result.score, radar: result.radar,
                    silenceCount, triggerTotal, avgVocalCalm,
                    preSelfEfficacyAvg: preAvg,
                    blindTranscript: typeof SL.buildBlindTranscript === 'function' ? SL.buildBlindTranscript(msgList, user?.name) : []
                };
                const nextHist = [...(Array.isArray(user?.skillLabHistory) ? user.skillLabHistory : []), entry].slice(-12);
                const bestScore = Math.max(Number(user?.skillLabBestScore || 0), Number(result.score || 0));
                const updatedUser = {
                    ...user,
                    skillLabPassed: true,
                    skillLabBestScore: bestScore,
                    skillLabLatestRadar: result.radarMap || {},
                    preSelfEfficacyAvg: preAvg,
                    skillLabHistory: nextHist
                };
                setUser(updatedUser);
                saveSessionTwoLayer(updatedUser);

                if (!isAdminPreview && fbDb && updatedUser.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(updatedUser.id)), {
                            skillLabPassed: true,
                            skillLabBestScore: bestScore,
                            skillLabLatestRadar: result.radarMap || {},
                            preSelfEfficacyAvg: preAvg,
                            skillLabHistory: nextHist
                        }, { merge: true });
                    } catch (_) {}
                }

                setEvalResult(result);
                setPhase('result');
            };

            const handleSavePostSelfEfficacy = async () => {
                const postAvg = Number(((postEff.explainBrainDeath + postEff.handleEmotion + postEff.gentleApproach) / 3).toFixed(2));
                const updated = { ...user, postSelfEfficacyAvg: postAvg };
                setUser(updated);
                saveSessionTwoLayer(updated);
                if (!isAdminPreview && fbDb && updated.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(updated.id)), { postSelfEfficacyAvg: postAvg }, { merge: true });
                    } catch (_) {}
                }
                setPostEffSaved(true);
                showToast(`บันทึกความมั่นใจหลังฝึก (${postAvg}/5) สำหรับงานวิจัย R2R เรียบร้อยแล้วค่ะ`);
            };

            // ============================================================================
            // 8. RENDER PHASES
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col">
                    {phase !== 'negotiating' && (<><div className="spatial-aura" /><div className="spatial-grid" /></>)}

                    {/* แถบไฟแอมเบียนบนสุดขณะ AI พูด (ไร้กล่องซับไตเติลกวนสายตา) */}
                    {(isSpeaking || guideVoiceState.status !== 'idle') && (
                        <div className="fixed top-0 left-0 right-0 z-50 pointer-events-none" aria-hidden="true">
                            <div className="rjc-ambient-bar" />
                        </div>
                    )}

                    {/* ==================== PHASE 1: LOBBY (ไร้ตัวอย่าง Hologram ให้เลือก) ==================== */}
                    {phase === 'lobby' && (
                        <div className="relative z-10 flex-1 flex flex-col pb-10">
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-6xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <button type="button" onClick={handleReturnToDashboard} className="spatial-soft px-3 py-2 rounded-xl text-xs font-bold text-primary-adaptive inline-flex items-center gap-1.5 shrink-0">
                                            <Icon name="ArrowLeft" size={15} /> <span>ห้องเรียนหลัก</span>
                                        </button>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                AI Skill Lab <span className="text-accent-adaptive">3D</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                                Context-Aware 3D Anime Character Hologram • Studio 24kHz Voice
                                            </span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        {phaseVoiceGuide && <StepVoiceButton activeKey={guideVoiceState.activeKey} targetKey={phaseVoiceGuide.key} status={guideVoiceState.status} onToggle={() => playGuideVoice(phaseVoiceGuide.key, phaseVoiceGuide.text)} />}
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                    </div>
                                </div>
                            </header>

                            <main className="max-w-6xl w-full mx-auto px-3.5 sm:px-6 py-5 space-y-5">
                                {inAppInfo.isInApp && (
                                    <div className="spatial-card rounded-2xl p-3.5 border-amber-400/50 bg-amber-500/15 flex flex-wrap items-center justify-between gap-2 text-xs">
                                        <span className="font-bold text-amber-200">ตรวจพบการเปิดผ่านแอป {inAppInfo.appName} — แนะนำเปิดใน Safari / Chrome เพื่อให้ไมโครโฟนและเสียง AI ทำงานสมบูรณ์ 100%</span>
                                        <a href={inAppInfo.externalUrl} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-xl bg-amber-400 text-void-950 font-extrabold">เปิดในเบราว์เซอร์หลัก</a>
                                    </div>
                                )}

                                {/* AI Lab Advisor */}
                                <section className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5 border-prism-400/35">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">AI LAB ADVISOR • แนะนำการฝึกจากประวัติจริง</span>
                                            <h2 className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive">{activeRec.headline}</h2>
                                        </div>
                                        <button type="button" onClick={handleApplyRec} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs shrink-0">
                                            เลือกตามที่ AI แนะนำทันที →
                                        </button>
                                    </div>
                                    <p className="text-xs sm:text-sm text-secondary-adaptive leading-relaxed">{activeRec.reason}</p>

                                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                                        {ADVISOR_GOALS.map(g => (
                                            <button key={g.id} type="button" onClick={() => setAdvisorGoal(g.id)} className={`shrink-0 px-3 py-1.5 rounded-full text-xs font-bold inline-flex items-center gap-1.5 ${advisorGoal === g.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                <Icon name={g.icon} size={13} /> {g.label}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="pt-2 border-t border-white/10 space-y-2">
                                        <div className="flex flex-wrap gap-1.5">
                                            {ADVISOR_QUICK_QUESTIONS.map((q, i) => (
                                                <button key={i} type="button" onClick={() => setAdvisorAnswer(typeof SL.answerAdvisorQuestion === 'function' ? SL.answerAdvisorQuestion(q) : '')} className="spatial-soft px-2.5 py-1 rounded-full text-[11px] font-semibold text-prism-adaptive">
                                                    ? {q}
                                                </button>
                                            ))}
                                        </div>
                                        {advisorAnswer && (
                                            <div className="p-3 rounded-2xl bg-aurora-500/10 border border-aurora-400/35 text-xs text-primary-adaptive whitespace-pre-line leading-relaxed">
                                                {advisorAnswer}
                                            </div>
                                        )}
                                    </div>
                                </section>

                                {/* 1. เลือกรูปแบบ & 2. ระดับความยาก */}
                                <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                        <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">1. เลือกรูปแบบการฝึก</p>
                                        <div className="space-y-2 text-xs">
                                            {[
                                                { id: 'roleplay_th', t: 'Roleplay ภาษาไทย (เต็มรูปแบบ)', d: 'สนทนาโต้ตอบด้วยเสียงและสีหน้าตัวละคร 3 มิติพร้อมปมในใจ 3 ข้อ' },
                                                { id: 'micro_drill', t: 'Micro-Drill 4 ด่านคำถามหนัก (3 นาที)', d: 'ซ้อม 4 คำถามหินเรียงต่อกัน เปลี่ยนตัวละครอัตโนมัติพร้อมเฉลยประโยคต้นแบบ' },
                                                { id: 'roleplay_en', t: 'International English Roleplay (EN)', d: 'ฝึกสื่อสารกับครอบครัวผู้ป่วยชาวต่างชาติด้วยหลัก SPIKES & Decoupling' }
                                            ].map(m => (
                                                <button key={m.id} type="button" onClick={() => setModeId(m.id)} className={`w-full text-left p-3 rounded-2xl border transition-all ${modeId === m.id ? 'bg-aurora-500/20 border-aurora-400' : 'spatial-soft'}`}>
                                                    <p className="font-display font-bold text-sm text-primary-adaptive">{m.t}</p>
                                                    <p className="text-[11px] text-muted-adaptive mt-0.5">{m.d}</p>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                        <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">2. เลือกระดับความยาก</p>
                                        <div className="space-y-2 text-xs">
                                            {[
                                                { id: 'normal', t: 'ระดับ Normal (มี AI Coach & แนวทางคำพูด)', d: 'เหมาะสำหรับสร้างความมั่นใจ มีคำแนะนำประโยคและดูปมในใจได้' },
                                                { id: 'hard', t: 'ระดับ Hard (ซ่อนตัวช่วย + เหตุการณ์แทรกกลางห้อง)', d: 'ซ่อนปุ่มคำพูด 100%, Trust ขึ้นยากกว่า และมีสายพี่ชายโทรแทรก/สะอื้นเงียบ' }
                                            ].map(d => (
                                                <button key={d.id} type="button" onClick={() => setDifficultyId(d.id)} className={`w-full text-left p-3 rounded-2xl border transition-all ${difficultyId === d.id ? 'bg-prism-500/20 border-prism-400' : 'spatial-soft'}`}>
                                                    <p className="font-display font-bold text-sm text-primary-adaptive">{d.t}</p>
                                                    <p className="text-[11px] text-muted-adaptive mt-0.5">{d.d}</p>
                                                </button>
                                            ))}
                                        </div>

                                        {/* Clinical Mastery Badges */}
                                        <div className="pt-2 border-t border-white/10">
                                            <p className="font-mono text-[10px] font-bold text-amber-400 uppercase mb-1.5">เหรียญตราสมรรถนะคลินิก ({clinicalBadges.filter(b => b.earned).length}/{clinicalBadges.length})</p>
                                            <div className="flex flex-wrap gap-1.5">
                                                {clinicalBadges.map(b => (
                                                    <span key={b.id} title={b.descTH} className={`px-2.5 py-1 rounded-full text-[10px] font-bold border ${b.earned ? 'bg-amber-400/20 border-amber-400/50 text-amber-200' : 'spatial-soft text-muted-adaptive opacity-60'}`}>
                                                        {b.earned ? '★ ' : '○ '}{b.titleTH}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* 3. เลือกเคสคลินิกครบ 6 เคส (ตัวละครโฮโลแกรมอนิเมะ 3 มิติปรับตามบริบทอัตโนมัติ) */}
                                {!selectedMode.isDrill && (
                                    <section className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                        <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">3. เลือกสถานการณ์คลินิก (6 เคส • จำลองตัวละครโฮโลแกรม 3 มิติตามบริบทและเพศอัตโนมัติ)</p>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                                            {PERSONAS.map(p => (
                                                <button key={p.id} type="button" onClick={() => setPersonaId(p.id)} className={`text-left p-3.5 rounded-2xl border transition-all space-y-1.5 ${personaId === p.id ? 'bg-aurora-500/20 border-aurora-400 shadow-md' : 'spatial-soft'}`}>
                                                    <div className="flex items-center justify-between gap-2">
                                                        <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-white/10 text-prism-adaptive">{p.tagTH}</span>
                                                        <Icon name={p.icon || 'HeartPulse'} size={16} className={personaId === p.id ? 'text-accent-adaptive' : 'text-muted-adaptive'} />
                                                    </div>
                                                    <p className="font-display font-bold text-sm text-primary-adaptive leading-snug">{p.titleTH}</p>
                                                    <p className="text-[11px] text-muted-adaptive leading-relaxed">{p.descTH}</p>
                                                    <p className="text-[10.5px] font-semibold text-accent-adaptive pt-0.5">ตัวละครในห้อง: {p.speakerRoleTH}</p>

                                <div className="flex justify-center pt-1">

                            <div className="spatial-card max-w-md w-full rounded-[2rem] p-8 text-center space-y-4">
                                <div className="w-12 h-12 border-4 border-aurora-400 border-t-transparent rounded-full animate-spin mx-auto" />
                                <h2 className="font-display font-extrabold text-lg text-primary-adaptive">AI Clinical Supervisor กำลังประเมินผล 5 แกน...</h2>
                                <p className="text-xs text-secondary-adaptive">วิเคราะห์อารมณ์ร่วม ความชัดเจนคลินิก ความเงียบ 2.5 วิ และเกียรติยศของครอบครัว</p>
                            </div>
                        </div>
                    )}

                    {/* ==================== PHASE 5: RESULT & 5-AXIS RADAR ==================== */}
                    {phase === 'result' && evalResult && (
                        <div className="relative z-10 max-w-3xl w-full mx-auto px-4 py-6 space-y-5 pb-12">
                            <div className="spatial-card rounded-[2rem] p-5 sm:p-7 space-y-5">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <span className="px-3 py-1 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[10px] font-bold uppercase">AI CLINICAL SUPERVISOR REPORT</span>
                                    {phaseVoiceGuide && <StepVoiceButton activeKey={guideVoiceState.activeKey} targetKey={phaseVoiceGuide.key} status={guideVoiceState.status} onToggle={() => playGuideVoice(phaseVoiceGuide.key, phaseVoiceGuide.text)} />}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-center">
                                    <div className="text-center md:text-left space-y-2">
                                        <p className="text-xs text-muted-adaptive font-mono">EMPATHY &amp; CLINICAL COMMUNICATION INDEX</p>
                                        <div className="flex items-baseline justify-center md:justify-start gap-2">
                                            <span className="font-mono text-5xl font-extrabold text-accent-adaptive">{evalResult.score}</span>
                                            <span className="font-mono text-lg text-muted-adaptive">/100</span>
                                        </div>
                                        <p className="text-xs text-secondary-adaptive leading-relaxed">{evalResult.summary}</p>
                                    </div>
                                    <div className="spatial-soft rounded-2xl p-3">
                                        <FiveAxisRadarSVG radarArr={evalResult.radar} theme={theme} />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    <div className="p-4 rounded-2xl bg-aurora-500/15 border border-aurora-400/35 space-y-1">
                                        <p className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">★ ประโยคทองที่ทำได้ดีเยี่ยม (Golden Moment)</p>
                                        <p className="text-primary-adaptive leading-relaxed">{evalResult.goldenMoment}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-prism-500/15 border border-prism-400/35 space-y-1">
                                        <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">✦ จุดควรเกลาเพิ่มความเชี่ยวชาญ (Turning Point)</p>
                                        <p className="text-primary-adaptive leading-relaxed">{evalResult.turningPoint}</p>
                                    </div>
                                </div>

                                {/* Self-Reflection Audio Replay (RAM-Only • Zero Upload PDPA) */}
                                {selfRecordings.length > 0 && (
                                    <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                        <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">ฟังเสียงตัวเองย้อนหลัง (Self-Reflection • เก็บเฉพาะ RAM ปลอดภัย PDPA)</p>
                                        {selfRecordings.map((rec, i) => (
                                            <div key={i} className="flex flex-wrap items-center justify-between gap-2 border-t border-white/10 pt-2">
                                                <div className="min-w-0 flex-1">
                                                    <p className="font-bold text-primary-adaptive truncate">รอบที่ {rec.turn}: {rec.toneLabel} ({rec.calmScore}/100)</p>
                                                    <p className="text-[11px] text-muted-adaptive truncate">{rec.text}</p>
                                                </div>
                                                <audio controls src={rec.audioUrl} className="h-8 max-w-[200px]" />
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* Post Self-Efficacy (R2R) */}
                                <div className="spatial-soft rounded-2xl p-4 space-y-2.5 text-xs">
                                    <div className="flex items-center justify-between gap-2">
                                        <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">ประเมินความมั่นใจหลังฝึก (Post Self-Efficacy • 1–5 • R2R)</p>
                                        {postEffSaved && <span className="text-accent-adaptive font-bold">✓ บันทึกแล้ว</span>}
                                    </div>
                                    {SELF_EFFICACY_ITEMS.map(item => (
                                        <div key={item.key} className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
                                            <span className="text-secondary-adaptive">{item.labelTH}</span>
                                            <div className="flex gap-1 shrink-0">
                                                {[1, 2, 3, 4, 5].map(n => (
                                                    <button key={n} type="button" onClick={() => setPostEff(p => ({ ...p, [item.key]: n }))} className={`w-8 h-8 rounded-lg font-mono text-xs font-bold ${postEff[item.key] === n ? 'bg-amber-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    {!postEffSaved && (
                                        <button type="button" onClick={handleSavePostSelfEfficacy} className="spatial-soft px-4 py-2 rounded-xl font-bold text-accent-adaptive border-aurora-400/40">
                                            บันทึกความมั่นใจหลังฝึก (R2R)
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
                                    <button type="button" onClick={() => { stopAllAiVoice(); setPhase('lobby'); }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-sm text-primary-adaptive">
                                        ← ฝึกเคสใหม่อีกครั้ง
                                    </button>
                                    <button type="button" onClick={handleReturnToDashboard} className="rjc2-pill-btn touch-target py-3.5 rounded-full font-display font-extrabold text-sm">
                                        บันทึกผล &amp; กลับห้องเรียนหลัก →
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('skilllab-root'));
        root.render(<SkillLabErrorBoundary><SkillLabApp /></SkillLabErrorBoundary>);
    </script>
    <!-- โหลด Babel ท้ายสุดหลังสคริปต์ทั้งหมด เพื่อให้แน่ใจว่าโค้ดครบ 100% ก่อนคอมไพล์ -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</body>
</html>
