    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

            const rawBytes = new Uint8Array(binaryString.length);

                            speakerLabel: isMother ? (isEn ? 'Mother' : 'คุณแม่') : (isEn ? 'Wife' : 'ภรรยา'),
                            voiceName: isMother ? secondaryVoice : primaryVoice,
                            pitchShift: isMother ? 0.88 : 1.06,
                            styleHint: isMother
                                ? (isEn ? 'Speak as a grieving, protective older mother with a deeper, emotionally trembling yet firm voice.' : 'พูดภาษาไทยด้วยน้ำเสียงคุณแม่วัยกลางคน–ผู้ใหญ่ที่ทุ้มหนักแน่นกว่าเล็กน้อย สั่นเครือด้วยความรักและหวงแหนลูกชาย ไม่แข็งเป็นหุ่นยนต์')
                                : (isEn ? 'Speak as a gentle, tearful younger wife trying to speak respectfully and softly.' : 'พูดภาษาไทยด้วยน้ำเสียงภรรยาวัยทำงานที่นุ่มนวล สั่นเครือเบาๆ และพยายามพูดด้วยความเคารพอย่างเป็นธรรมชาติ'),
                            text: spoken
                        });
                    }
                    if (segs.length > 0) return segs;
                }
            }

            const cleaned = cleanTextForSpeech(text, lang);
            if (!cleaned) return [];
            return [{
                speakerLabel: persona?.speakerRoleTH?.split(' ')[0] || (isEn ? 'Relative' : 'ญาติ'),
                voiceName: primaryVoice,
                pitchShift: 1.02,
                styleHint: baseStyle,
                text: cleaned
            }];
        }

        function pickBestBrowserVoice(lang) {
            if (typeof CORE.pickNaturalBrowserVoice === 'function') return CORE.pickNaturalBrowserVoice(lang);
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const prefix = lang === 'en' ? 'en' : 'th';
            const matches = voices.filter(v => String(v.lang || '').toLowerCase().startsWith(prefix));
            return matches.find(v => /premwadee|kanya|google|natural|samantha|aria/i.test(v.name || '')) || matches[0] || null;
        }

        // ============================================================================
        // 3. AI RESPONSE PARSER (WITH [ACTION] NON-VERBAL CUES), TRIGGER DETECTOR & AI SUPERVISOR
        // ============================================================================
        function parseAiResponse(rawText) {
            const text = String(rawText || '').trim();
            const readyToEvaluate = /\[(READY_TO_EVALUATE|CONVERSATION_END|END_SESSION)\]/i.test(text);
            const suggestions = [];
            const sugRegex = /\[SUGGESTION\s*\d+\]\s*([^\n]+)/gi;
            let match;
            while ((match = sugRegex.exec(text)) !== null) {
                if (match[1]?.trim()) suggestions.push(match[1].trim());
            }
            let coachTip = '';
            const tipMatch = text.match(/\[COACH_TIP\]\s*([^\n]+)/i);
            if (tipMatch && tipMatch[1]) coachTip = tipMatch[1].trim();

            let actionCue = '';
            const actionMatch = text.match(/\[ACTION\]\s*([^\n]+)/i);
            if (actionMatch && actionMatch[1]) actionCue = actionMatch[1].trim();

            let cleaned = text
                .replace(/\[(READY_TO_EVALUATE|CONVERSATION_END|END_SESSION)\]/gi, '')
                .replace(/\[ACTION\]\s*[^\n]+/gi, '')
                .replace(/\[SUGGESTION\s*\d+\]\s*[^\n]+/gi, '')
                .replace(/\[COACH_TIP\]\s*[^\n]+/gi, '')
                .trim();

            let emotion = 'SAD';
            const emoMatch = cleaned.match(/^\[(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]\s*/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                cleaned = cleaned.replace(emoMatch[0], '').trim();
            }
            // คงแท็ก [ภรรยา] / [คุณแม่] / [Wife] / [Mother] ไว้เพื่อแยกเสียง 2 ตัวละคร
            if (!/^\[(ภรรยา|คุณแม่|แม่|Wife|Mother)/i.test(cleaned)) {
                cleaned = cleaned.replace(/^\[[^\]]{1,25}\]\s*/, '').trim();
            }

            return {
                emotion: EMOTION_PHYSICS[emotion] ? emotion : 'SAD',
                actionCue,
                text: cleaned || '...',
                coachTip,
                suggestions: readyToEvaluate ? [] : suggestions.slice(0, 2),
                readyToEvaluate
            };
        }

        function detectTriggerPhrases(text, lang = 'th') {
            const input = String(text || '');
            return TRIGGER_PHRASE_DICTIONARY.filter(item => item.lang === lang && item.pattern.test(input));
        }

        function generateOfflineRelativeReply(userMsg, mode, turnCount, persona, difficulty) {
            const msg = String(userMsg || '').toLowerCase();
            const isEn = mode.language === 'en';
            const personaId = persona?.id || 'standard';
            const targetTurns = difficulty?.id === 'hard' ? 4 : 3;

            if (personaId === 'belief') {
                if (turnCount >= targetTurns || msg.match(/ไม่เร่ง|ปรึกษา|เวลา|ตามสบาย|สมเกียรติ|no rush|family|time/)) {
                    return isEn
                        ? `[CALM]\n[ACTION] Relaxes her shoulders, gently wipes her eyes, and nods with quiet gratitude.\nThank you for honoring our grandmother's beliefs and reassuring us that my brother's body will be cared for peacefully. I feel much calmer now and will talk gently with my family.\n[READY_TO_EVALUATE]\n[COACH_TIP] Natural closure achieved! Tap "Evaluate & Claim Card" below.`
                        : `[CALM]\n[ACTION] คลายมือที่ประสานแน่นลง ซับน้ำตาเบาๆ และพยักหน้าด้วยสีหน้าผ่อนคลายขึ้น\nขอบคุณมากนะคะที่ไม่มองว่าความเชื่อของคุณยายเป็นเรื่องงมงาย และยืนยันว่าจะดูแลตกแต่งร่างน้องชายให้เรียบร้อยสมบูรณ์ที่สุด ตอนนี้หนูสบายใจขึ้นมากแล้วค่ะ ขอให้หนูไปคุยกับคุณยายและที่บ้านก่อนนะคะ\n[READY_TO_EVALUATE]\n[COACH_TIP] ปิดบทสนทนาได้อย่างงดงามและครบถ้วนแล้วค่ะ กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ด้านล่างได้เลยค่ะ`;
                }
                return isEn
                    ? `[SAD]\n[ACTION] Looks down thoughtfully, voice softening as she processes your explanation.\nHearing that you respect our traditions helps so much. Still, will my brother truly look peaceful with no scary surgical marks at the funeral?\n[COACH_TIP] Reassure meticulous surgical closure and offer unhurried family time.\n[SUGGESTION 1] I assure you our surgical team closes incisions neatly and cares for your brother with utmost dignity so funeral rites proceed peacefully. Please take all the time your family needs.\n[SUGGESTION 2] Your grandmother's peace of mind matters deeply. There is no rush at all—we will respect whatever your family decides together.`
                    : `[SAD]\n[ACTION] ก้มหน้าคิดตามช้าๆ แววตาอ่อนลงแต่ยังมีความห่วงใยต่อร่างของน้องชาย\nฟังที่คุณเจ้าหน้าที่อธิบายเรื่องทานบารมีแล้วหนูอุ่นใจขึ้นค่ะ แต่อยากถามให้มั่นใจอีกนิดนะคะว่าหลังผ่าตัดร่างของน้องชายจะเรียบร้อยไม่มีรอยแผลน่ากลัว และครอบครัวขอเวลาไปปรึกษาคุณยายก่อนได้ไหมคะ?\n[COACH_TIP] ยืนยันการเย็บแผลตกแต่งร่างน้องชายอย่างประณีตสูงสุด และให้เวลาครอบครัวปรึกษาคุณยายโดยไม่เร่งรัดเพื่อปิดบทสนทนาค่ะ\n[SUGGESTION 1] ขอรับรองค่ะว่าทีมศัลยแพทย์จะดูแลเย็บแผลและตกแต่งร่างน้องชายอย่างประณีตสมเกียรติที่สุดจนทำพิธีศาสนาได้ตามปกติ และขอให้ครอบครัวค่อยๆ ปรึกษาคุณยายอย่างเต็มที่โดยไม่เร่งรัดเลยนะคะ\n[SUGGESTION 2] ได้แน่นอนค่ะ ไม่ต้องรีบตัดสินใจเลยนะคะ ไม่ว่าคุณยายและครอบครัวจะตัดสินใจอย่างไร ทีมจะดูแลน้องชายอย่างดีที่สุดเสมอค่ะ`;
            }

            if (personaId === 'conflict') {
                if (turnCount >= targetTurns || msg.match(/ไม่ฝืน|ไม่บังคับ|เคารพทั้งสอง|ปรึกษา|never force|neutral|peace/)) {
                    return isEn
                        ? `[CALM]\n[ACTION] The mother slowly lowers her tense hands and reaches out to hold her daughter-in-law's arm.\n[Mother]: Hearing that you will never force us against our hearts helps me breathe again... [Wife]: Thank you for helping us stay united. May we take quiet time together now?\n[READY_TO_EVALUATE]\n[COACH_TIP] Compassionate de-escalation complete! Tap "Evaluate & Claim Card" below.`
                        : `[CALM]\n[ACTION] คุณแม่ค่อยๆ ผ่อนลมหายใจและเอื้อมมือมาจับแขนลูกสะใภ้เบาๆ บรรยากาศในห้องเริ่มอบอุ่นลง\n[คุณแม่]: พอได้ยินว่าโรงพยาบาลจะไม่ฝืนใจแม่และเคารพความรู้สึกของครอบครัว แม่ก็โล่งใจขึ้นมากค่ะ... [ภรรยา]: ขอบคุณนะคะที่ช่วยให้พวกเราใจเย็นลง ขอให้หนูกับแม่ได้นั่งคุยกันเงียบๆ สักครู่นะคะ\n[READY_TO_EVALUATE]\n[COACH_TIP] ประคับประคองความขัดแย้งและปิดบทสนทนาได้อย่างยอดเยี่ยมแล้วค่ะ กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ได้เลยค่ะ`;
                }
                return isEn
                    ? `[HESITANT]\n[ACTION] The mother dabs her tears while the wife glances at her with gentle concern.\n[Mother]: I just don't want my son to suffer any more... [Wife]: I love him too, Mom. Can you assure us that the hospital won't rush us or force anything?\n[COACH_TIP] Validate both sides' love, assure zero coercion, and offer private family time.\n[SUGGESTION 1] I can feel how deeply both of you love him. Our team will never force any decision—please take quiet private time together and we will honor whatever brings your family peace.\n[SUGGESTION 2] Both perspectives come from love. There is absolutely no rush; I will give you private space to talk calmly whenever you are ready.`
                    : `[HESITANT]\n[ACTION] คุณแม่หยิบทิชชูขึ้นซับน้ำตาด้วยเสียงสั่นเครือ ขณะที่ภรรยาหันไปมองคุณแม่ด้วยความเห็นใจ\n[คุณแม่]: แม่แค่ไม่อยากเห็นต้นเจ็บอีกแล้ว... [ภรรยา]: หนูก็รักพี่ต้นเหมือนกันค่ะแม่... คุณเจ้าหน้าที่ช่วยยืนยันได้ไหมคะว่าจะไม่เร่งรัดและไม่บังคับครอบครัวเรา?\n[COACH_TIP] สะท้อนความรักของทั้งคุณแม่และภรรยา ยืนยันไม่ฝืนใจเด็ดขาด และให้เวลาส่วนตัวเพื่อปิดบทสนทนาอย่างสงบค่ะ\n[SUGGESTION 1] ดิฉันสัมผัสได้ถึงความรักที่ทั้งคุณแม่และภรรยามีให้คุณต้นอย่างลึกซึ้งค่ะ ขอยืนยันว่าจะไม่ฝืนใจหรือเร่งรัดเด็ดขาด ขอให้ทั้งสองท่านได้ใช้เวลาพูดคุยกันอย่างเป็นส่วนตัวได้เลยนะคะ\n[SUGGESTION 2] ความสบายใจและความรักของครอบครัวสำคัญที่สุดค่ะ ทีมพร้อมเคารพการตัดสินใจร่วมกันของครอบครัวเสมอ ดิฉันจะคอยอยู่ด้านนอกเรียกได้ตลอดนะคะ`;
            }

            if (personaId === 'distrust') {
                if (turnCount >= targetTurns || msg.match(/สภากาชาด|odc|ไม่มีค่าใช้จ่าย|โปร่งใส|red cross|transparent|no cost/)) {
                    return isEn
                        ? `[CALM]\n[ACTION] Uncrosses her arms, lets out a relieved breath, and nods sincerely.\nThank you for answering openly without getting defensive. Knowing ODC allocates organs fairly by computer with zero extra cost to our family truly eases my mind. I will speak with my relatives now.\n[READY_TO_EVALUATE]\n[COACH_TIP] Trust established cleanly! Tap "Evaluate & Claim Card" below.`
                        : `[CALM]\n[ACTION] คลายแขนที่กอดอกออก สีหน้าอ่อนโยนลงและพยักหน้าด้วยความไว้วางใจ\nขอบคุณนะคะที่ตอบอย่างตรงไปตรงมาและไม่หงุดหงิดใส่คำถามแรงๆ ของหนู พอรู้ว่าสภากาชาดไทย (ODC) จัดสรรด้วยคอมพิวเตอร์อย่างเป็นธรรมและครอบครัวไม่ต้องเสียค่าใช้จ่ายของคุณแม่เพิ่ม ก็สบายใจขึ้นมากเลยค่ะ เดี๋ยวหนูขอไปปรึกษาพี่น้องก่อนนะคะ\n[READY_TO_EVALUATE]\n[COACH_TIP] คลายความระแวงและปิดบทสนทนาได้อย่างมืออาชีพแล้วค่ะ กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ด้านล่างได้เลยค่ะ`;
                }
                return isEn
                    ? `[HESITANT]\n[ACTION] Loosens her posture slightly, listening more closely though still cautious.\nThat sounds clearer... So there is strictly no organ selling and no extra ICU bill for my mother if we consider this, and we don't have to decide immediately?\n[COACH_TIP] Confirm ODC transparency, zero family cost, and unhurried family time.\n[SUGGESTION 1] Yes—strictly no buying or selling, allocation is audited by the Thai Red Cross (ODC), zero donation-related cost to your family, and there is no rush at all.\n[SUGGESTION 2] You have every right to be certain. Everything is transparent under ODC with no extra bill—please take all the private time your family needs.`
                    : `[HESITANT]\n[ACTION] คลายคิ้วที่ขมวดลงเล็กน้อย ตั้งใจฟังข้อมูลมากขึ้นแต่ยังอยากได้คำยืนยันที่ชัดเจน\nฟังดูชัดเจนขึ้นค่ะ... แปลว่าไม่มีการซื้อขายหรือลัดคิวจริงๆ ครอบครัวไม่ต้องจ่ายค่าใช้จ่ายส่วนนี้ของคุณแม่เพิ่ม และไม่ต้องรีบตัดสินใจตอนนี้ใช่ไหมคะ?\n[COACH_TIP] ยืนยันความโปร่งใสของสภากาชาดไทย (ODC) ไม่มีค่าใช้จ่ายกับครอบครัว และให้เวลาปรึกษากันโดยไม่เร่งรัดเพื่อปิดบทสนทนาค่ะ\n[SUGGESTION 1] ใช่ค่ะ ขอยืนยันว่าไม่มีซื้อขายหรือลัดคิวเด็ดขาด จัดสรรโดยศูนย์รับบริจาคอวัยวะสภากาชาดไทย (ODC) ไม่มีค่าใช้จ่ายกับครอบครัว และขอให้ครอบครัวค่อยๆ ปรึกษากันอย่างสบายใจโดยไม่เร่งรัดนะคะ\n[SUGGESTION 2] เป็นสิทธิ์ของครอบครัวที่ซักถามให้มั่นใจได้เต็มที่เลยค่ะ ดิฉันขอให้เวลาครอบครัวพูดคุยกันก่อน หากมีคำถามเพิ่มเติมเรียกดิฉันได้ตลอดนะคะ`;
            }

            if (turnCount >= targetTurns || (turnCount >= 2 && msg.match(/ไม่รีบ|ปรึกษา|ตกแต่ง|เวลา|ประณีต|no rush|dignity|private time/))) {
                return isEn
                    ? `[CALM]\n[ACTION] Gently wipes away her tears and offers a small, heartfelt nod of relief.\nThank you for explaining about my father so gently and giving me space to breathe. I understand now and feel calmer. May I take some quiet time to talk with my family?\n[READY_TO_EVALUATE]\n[COACH_TIP] Strong trust and natural closure achieved! Tap "Evaluate & Claim Card" below.`
                    : `[CALM]\n[ACTION] ยกมือซับน้ำตาเบาๆ หายใจเข้าลึกและพยักหน้ารับด้วยสีหน้าที่สงบลง\nขอบคุณมากนะคะที่ค่อยๆ อธิบายเรื่องคุณพ่อด้วยน้ำเสียงที่นุ่มนวลและให้เวลาครอบครัวเราอย่างเต็มที่ ตอนนี้หนูเข้าใจและใจนิ่งขึ้นมากแล้วค่ะ ขอให้หนูได้นั่งปรึกษากับที่บ้านเงียบๆ สักครู่นะคะ\n[READY_TO_EVALUATE]\n[COACH_TIP] ปิดบทสนทนาได้อย่างอบอุ่นและครบหลักการแล้วค่ะ กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ด้านล่างได้เลยค่ะ`;
            }
            return isEn
                ? `[SAD]\n[ACTION] Tears well up as she covers her mouth briefly, voice trembling softly.\nSo the ventilator is the only thing keeping my father's chest moving, and his brain has permanently stopped... It hurts so deeply. If we even think about next steps, will my father's body look peaceful, and can we take time as a family?\n[COACH_TIP] Pause 2.5s (Therapeutic Silence), validate her grief, assure dignified care for her father, and offer unhurried family time.\n[SUGGESTION 1] I am truly sorry for your loss. There is no rush at all—our surgeons care for your father with utmost dignity so he looks completely peaceful. Please take quiet time together.\n[SUGGESTION 2] I hear how heartbreaking this is. Your family's peace comes first—we will give you private space here and support whatever you decide without any pressure.`
                : `[SAD]\n[ACTION] น้ำตาคลอไหลลงมา ก้มหน้าลงเล็กน้อยและพูดด้วยเสียงที่สั่นเครือ\nแสดงว่าที่เห็นหน้าอกคุณพ่อขยับและตัวอุ่นอยู่เป็นเพราะเครื่องช่วยหายใจกับยา และสมองคุณพ่อจะไม่ฟื้นกลับมาอีกแล้วจริงๆ เหรอคะ... หนูทำใจแทบไม่ทันเลยค่ะ แล้วขั้นตอนต่อไปครอบครัวเราขอเวลาปรึกษากันก่อนได้ไหมคะ หนูกลัวว่าถ้ามีขั้นตอนอะไรต่อร่างคุณพ่อจะไม่เรียบร้อยค่ะ\n[COACH_TIP] ลองเว้นจังหวะเงียบ 2.5 วินาที แล้วปลอบใจอย่างอ่อนโยน ยืนยันว่าไม่เร่งรัดและดูแลให้เกียรติร่างคุณพ่ออย่างประณีตเพื่อปิดบทสนทนาค่ะ\n[SUGGESTION 1] ดิฉันเสียใจด้วยจริงๆ ค่ะ ไม่ต้องรีบตัดสินใจเลยนะคะ ครอบครัวสามารถปรึกษากันได้อย่างเต็มที่ และหากสนใจทางเลือกใดๆ ทีมแพทย์จะดูแลให้เกียรติร่างคุณพ่ออย่างประณีตสมบูรณ์ที่สุดค่ะ\n[SUGGESTION 2] เข้าใจความเจ็บปวดของลูกมากค่ะ ตอนนี้ขอให้คุณแพรวและครอบครัวได้พักหายใจและคุยกันอย่างเป็นส่วนตัวก่อนนะคะ ดิฉันอยู่ตรงนี้คอยดูแลเสมอโดยไม่มีแรงกดดันใดๆ ค่ะ`;

        function evaluateConversation5Axis(messages, timeline, lang = 'th') {
            const isEn = lang === 'en';
            const userTurns = messages.filter(m => m.sender === 'user');
            const combined = userTurns.map(m => m.text || '').join(' ');
            const principles = GUIDED_PRINCIPLES[isEn ? 'en' : 'th'];
            const triggersFound = detectTriggerPhrases(combined, isEn ? 'en' : 'th');
            const silenceCount = timeline.filter(t => t.silenceHeld).length;
            const lastEmotion = timeline[timeline.length - 1]?.emotion || 'CONFUSED';

            const hit = (id) => principles.find(p => p.id === id)?.pattern?.test(combined) || false;
            const baseTurnBonus = Math.min(18, userTurns.length * 6);

            const setting = Math.min(100, (hit('setting') ? 76 : 56) + Math.min(20, userTurns.length * 5));
            const empathy = Math.min(100, (hit('empathy') ? 78 : 58) + (lastEmotion === 'CALM' ? 14 : 6) - triggersFound.length * 8);
            const clarity = Math.min(100, (hit('clarity') ? 78 : 56) + baseTurnBonus);
            const vocal = Math.min(100, 68 + Math.min(24, silenceCount * 12) + (lastEmotion === 'CALM' ? 8 : 0));
            const dignity = Math.min(100, (hit('dignity') ? 80 : 58) + (lastEmotion === 'CALM' ? 14 : 4) - triggersFound.length * 6);

            const clamp = (n) => Math.max(40, Math.min(100, Math.round(n)));
            const radar = [
                { key: 'setting', label: isEn ? 'Setting & Role' : 'ห้องรับรอง & บทบาท', value: clamp(setting) },
                { key: 'empathy', label: isEn ? 'Empathy' : 'รับรู้อารมณ์ร่วม', value: clamp(empathy) },
                { key: 'clarity', label: isEn ? 'Clinical Clarity' : 'ข้อมูลภาวะสมองตาย', value: clamp(clarity) },
                { key: 'vocal', label: isEn ? 'Vocal & Silence' : 'น้ำเสียง & ความเงียบ', value: clamp(vocal) },
                { key: 'dignity', label: isEn ? 'Dignity & Pace' : 'ไม่เร่งรัด & เกียรติร่าง', value: clamp(dignity) }
            ];
            const score = Math.round(radar.reduce((s, r) => s + r.value, 0) / radar.length);

            const strengths = [];
            const improvements = [];
            radar.forEach(r => {
                if (r.value >= 80) strengths.push(`${r.label} (${r.value}/100)`);
                else improvements.push(isEn ? `Strengthen ${r.label} (${r.value}/100)` : `เสริมทักษะด้าน ${r.label} (${r.value}/100)`);
            });

            const bestTurn = [...timeline].sort((a, b) => (b.deltaTrust || 0) - (a.deltaTrust || 0))[0];
            const goldenQuote = bestTurn?.userText || userTurns[userTurns.length - 1]?.text || '';
            const turningTurn = timeline.find(t => detectTriggerPhrases(t.userText, isEn ? 'en' : 'th').length > 0) || timeline[0];

            return {
                source: 'local',
                score,
                radar,
                triggersFound,
                silenceCount,
                supervisorSummary: isEn
                    ? 'You maintained compassionate presence and guided the family calmly through a delicate clinical moment.'
                    : 'คุณสามารถประคับประคองอารมณ์ของครอบครัวและถ่ายทอดข้อมูลสำคัญได้อย่างสุภาพเป็นระบบค่ะ',
                goldenMoment: goldenQuote ? {
                    quote: goldenQuote,
                    reason: isEn
                        ? 'This response helped lower emotional tension and build trust with the relative.'
                        : 'ประโยคนี้ช่วยลดความตึงเครียดทางอารมณ์และสร้างความไว้วางใจให้ญาติเปิดใจรับฟังได้ดีขึ้นค่ะ'
                } : null,
                turningPoint: triggersFound.length > 0 ? {
                    quote: turningTurn?.userText || triggersFound[0].flagged,
                    betterPhrase: triggersFound[0].softer,
                    reason: triggersFound[0].reason
                } : (turningTurn && score < 90 ? {
                    quote: turningTurn.userText,
                    betterPhrase: isEn
                        ? 'I hear how painful and sudden this is. Please take all the quiet time your family needs—there is no rush at all.'
                        : 'เข้าใจความรู้สึกหนักใจของครอบครัวมากค่ะ ไม่ต้องรีบตัดสินใจเลยนะคะ ขอให้ครอบครัวได้ใช้เวลาปรึกษากันอย่างเต็มที่ค่ะ',
                    reason: isEn
                        ? 'Adding explicit emotional validation before clinical facts softens the impact even further.'
                        : 'การสะท้อนอารมณ์และย้ำว่าไม่เร่งรัดก่อนเข้าสู่รายละเอียดจะช่วยให้ญาติอุ่นใจขึ้นอีกขั้นค่ะ'
                } : null),
                strengths: strengths.length ? strengths : [isEn ? 'Completed full compassionate practice' : 'กล้าสื่อสารและประคับประคองบทสนทนาจนจบ'],
                improvements: improvements.length ? improvements : [isEn ? 'Maintain this calm, respectful tone in real ICU cases' : 'รักษาน้ำเสียงที่นุ่มนวลและจังหวะเงียบอย่างนี้ในเคสหน้างานจริงค่ะ']
            };
        }

        function parseAiSupervisorJson(rawText, fallbackEval, lang = 'th') {
            try {
                const cleaned = String(rawText || '')
                    .replace(/```json\s*/gi, '')
                    .replace(/```\s*/g, '')
                    .trim();
                const start = cleaned.indexOf('{');
                const end = cleaned.lastIndexOf('}');
                if (start < 0 || end <= start) return null;
                const parsed = JSON.parse(cleaned.slice(start, end + 1));
                const r = parsed?.radar;
                if (!r || typeof r !== 'object') return null;

                const isEn = lang === 'en';
                const clamp = (v, fb) => {
                    const n = Number(v);
                    return Number.isFinite(n) ? Math.max(40, Math.min(100, Math.round(n))) : fb;
                };
                const fbMap = Object.fromEntries(fallbackEval.radar.map(x => [x.key, x.value]));
                const radar = [
                    { key: 'setting', label: isEn ? 'Setting & Role' : 'ห้องรับรอง & บทบาท', value: clamp(r.setting, fbMap.setting) },
                    { key: 'empathy', label: isEn ? 'Empathy' : 'รับรู้อารมณ์ร่วม', value: clamp(r.empathy, fbMap.empathy) },
                    { key: 'clarity', label: isEn ? 'Clinical Clarity' : 'ข้อมูลภาวะสมองตาย', value: clamp(r.clarity, fbMap.clarity) },
                    { key: 'vocal', label: isEn ? 'Vocal & Silence' : 'น้ำเสียง & ความเงียบ', value: clamp(r.vocal, fbMap.vocal) },
                    { key: 'dignity', label: isEn ? 'Dignity & Pace' : 'ไม่เร่งรัด & เกียรติร่าง', value: clamp(r.dignity, fbMap.dignity) }
                ];
                const score = Math.round(radar.reduce((s, x) => s + x.value, 0) / radar.length);

                return {
                    ...fallbackEval,
                    source: 'gemini_supervisor',
                    score,
                    radar,
                    supervisorSummary: String(parsed.supervisorSummary || fallbackEval.supervisorSummary || '').trim(),
                    goldenMoment: parsed.goldenMoment?.quote ? {
                        quote: String(parsed.goldenMoment.quote).trim(),
                        reason: String(parsed.goldenMoment.reason || '').trim()
                    } : fallbackEval.goldenMoment,
                    turningPoint: parsed.turningPoint?.betterPhrase ? {
                        quote: String(parsed.turningPoint.quote || '').trim(),
                        betterPhrase: String(parsed.turningPoint.betterPhrase).trim(),
                        reason: String(parsed.turningPoint.reason || '').trim()
                    } : fallbackEval.turningPoint,
                    strengths: Array.isArray(parsed.strengths) && parsed.strengths.length > 0
                        ? parsed.strengths.map(s => String(s).trim()).filter(Boolean).slice(0, 4)
                        : fallbackEval.strengths,
                    improvements: Array.isArray(parsed.improvements) && parsed.improvements.length > 0
                        ? parsed.improvements.map(s => String(s).trim()).filter(Boolean).slice(0, 4)
                        : fallbackEval.improvements
                };
            } catch (_) {
                return null;
            }
        }

        function ThreeHologramStage({ emotionKey, isSpeaking }) {
            const mountRef = useRef(null);
            const liveRef = useRef({ emotionKey, isSpeaking });
            useEffect(() => { liveRef.current = { emotionKey, isSpeaking }; }, [emotionKey, isSpeaking]);

            useEffect(() => {
                const container = mountRef.current;
                const THREE = window.THREE;
                if (!container || !THREE) return;

                const width = Math.max(1, container.clientWidth || window.innerWidth);
                const height = Math.max(1, container.clientHeight || window.innerHeight);

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
                camera.position.set(0, 0.2, width < 640 ? 7.2 : 5.8);

                let renderer;
                try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
                catch (_) { return; }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(width, height);
                renderer.setClearColor(0x000000, 0);
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const c = document.createElement('canvas');
                c.width = 64; c.height = 64;
                const g = c.getContext('2d');
                const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.35, 'rgba(255,255,255,0.72)');
                grad.addColorStop(0.75, 'rgba(255,255,255,0.14)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                g.fillStyle = grad;
                g.fillRect(0, 0, 64, 64);
                const tex = new THREE.CanvasTexture(c);

                const root = new THREE.Group();
                scene.add(root);

                const COUNT = 1800;
                const basePos = new Float32Array(COUNT * 3);
                const pos = new Float32Array(COUNT * 3);
                const cols = new Float32Array(COUNT * 3);
                const seeds = new Float32Array(COUNT);
                const golden = Math.PI * (3 - Math.sqrt(5));

                for (let i = 0; i < COUNT; i++) {
                    const y = 1 - (i / (COUNT - 1)) * 2;
                    const r = Math.sqrt(Math.max(0, 1 - y * y));
                    const theta = golden * i;
                    const rad = 1.55 + (i % 7 === 0 ? 0.5 : 0) + (Math.random() - 0.5) * 0.16;
                    basePos[i * 3] = Math.cos(theta) * r * rad;
                    basePos[i * 3 + 1] = y * rad;
                    basePos[i * 3 + 2] = Math.sin(theta) * r * rad;
                    pos[i * 3] = basePos[i * 3];
                    pos[i * 3 + 1] = basePos[i * 3 + 1];
                    pos[i * 3 + 2] = basePos[i * 3 + 2];
                    seeds[i] = Math.random() * Math.PI * 2;
                }

                const pGeo = new THREE.BufferGeometry();
                pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                pGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
                const pMat = new THREE.PointsMaterial({
                    size: 0.088, map: tex, vertexColors: true,
                    transparent: true, opacity: 0.92, depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                root.add(new THREE.Points(pGeo, pMat));

                const coreGeo = new THREE.IcosahedronGeometry(0.92, 2);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.14, blending: THREE.AdditiveBlending });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                root.add(coreMesh);

                const ringGeo = new THREE.TorusGeometry(2.25, 0.011, 12, 120);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI * 0.42;
                root.add(ring);

                // รองรับการหมุนมุมกล้อง 3 มิติทั้งเมาส์และสัมผัสหน้าจอ
                let dragging = false, lastX = 0, lastY = 0, userRotY = 0, userRotX = 0;
                const startDrag = (x, y) => { dragging = true; lastX = x; lastY = y; };
                const moveDrag = (x, y) => {
                    if (!dragging) return;
                    userRotY += (x - lastX) * 0.005;
                    userRotX = Math.max(-0.6, Math.min(0.6, userRotX + (y - lastY) * 0.004));
                    lastX = x; lastY = y;
                };
                const endDrag = () => { dragging = false; };

                const onMouseDown = (e) => startDrag(e.clientX, e.clientY);
                const onMouseMove = (e) => moveDrag(e.clientX, e.clientY);
                const onTouchStart = (e) => { if (e.touches[0]) startDrag(e.touches[0].clientX, e.touches[0].clientY); };
                const onTouchMove = (e) => { if (e.touches[0]) moveDrag(e.touches[0].clientX, e.touches[0].clientY); };

                renderer.domElement.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', endDrag);
                renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: true });
                window.addEventListener('touchmove', onTouchMove, { passive: true });
                window.addEventListener('touchend', endDrag);

                const onResize = () => {
                    if (!container) return;
                    const w = Math.max(1, container.clientWidth || window.innerWidth);
                    const h = Math.max(1, container.clientHeight || window.innerHeight);
                    camera.aspect = w / h;
                    camera.position.z = w < 640 ? 7.2 : 5.8;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', onResize);

                const c1 = new THREE.Color(0x38bdf8), c2 = new THREE.Color(0x818cf8);
                const t1 = new THREE.Color(), t2 = new THREE.Color(), tmp = new THREE.Color();
                let elapsed = 0, last = performance.now(), rafId = null;

                const animate = (now) => {
                    rafId = requestAnimationFrame(animate);
                    const dt = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    elapsed += dt;

                    const { emotionKey: ek, isSpeaking: speaking } = liveRef.current;
                    const meta = EMOTION_PHYSICS[ek] || EMOTION_PHYSICS.CONFUSED;
                    const damp = Math.min(1, dt * 1.8);
                    t1.setHex(meta.primaryHex);
                    t2.setHex(meta.secondaryHex);
                    c1.lerp(t1, damp);
                    c2.lerp(t2, damp);

                    const pAttr = pGeo.attributes.position;
                    const cAttr = pGeo.attributes.color;
                    const speakBoost = speaking ? 0.055 * Math.abs(Math.sin(elapsed * 6.5)) : 0;
                    const breath = 1 + Math.sin(elapsed * 0.85 * meta.speed) * 0.03 + speakBoost;

                    for (let i = 0; i < COUNT; i++) {
                        const i3 = i * 3;
                        const bx = basePos[i3], by = basePos[i3 + 1], bz = basePos[i3 + 2];
                        const wave = Math.sin(elapsed * meta.speed + by * 1.4 + bx * 0.8) * (speaking ? 0.055 : 0.03);
                        const sc = breath + wave;
                        pAttr.array[i3] = bx * sc;
                        pAttr.array[i3 + 1] = by * sc;
                        pAttr.array[i3 + 2] = bz * sc;

                        const mix = 0.5 + 0.5 * Math.sin(elapsed * 0.4 + by * 0.9 + seeds[i] * 0.2);
                        tmp.copy(c1).lerp(c2, mix);
                        cAttr.array[i3] = tmp.r;
                        cAttr.array[i3 + 1] = tmp.g;
                        cAttr.array[i3 + 2] = tmp.b;
                    }
                    pAttr.needsUpdate = true;
                    cAttr.needsUpdate = true;

                    coreMat.color.copy(c1);
                    ringMat.color.copy(c2);
                    root.rotation.y += dt * 0.065;
                    root.rotation.x = userRotX;
                    coreMesh.rotation.y = -elapsed * 0.08 + userRotY;
                    ring.rotation.z += dt * (speaking ? 0.14 : 0.055);
                    root.position.y = 0.65;

                    renderer.render(scene, camera);
                };
                rafId = requestAnimationFrame(animate);

                return () => {
                    cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', onResize);
                    renderer.domElement.removeEventListener('mousedown', onMouseDown);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', endDrag);
                    renderer.domElement.removeEventListener('touchstart', onTouchStart);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('touchend', endDrag);
                    pGeo.dispose(); pMat.dispose(); coreGeo.dispose(); coreMat.dispose(); ringGeo.dispose(); ringMat.dispose(); tex.dispose(); renderer.dispose();
                };
            }, []);

            return <div ref={mountRef} className="w-full h-full" />;
        }

        function FiveAxisRadarSVG({ radar, theme }) {
            const isDark = theme !== 'light';
            const size = 250, cx = size / 2, cy = size / 2, maxR = 78;
            const pt = (idx, ratio) => {
                const angle = (Math.PI * 2 * idx) / radar.length - Math.PI / 2;
                return [cx + Math.cos(angle) * maxR * ratio, cy + Math.sin(angle) * maxR * ratio];
            };
            const dataPts = radar.map((r, i) => pt(i, (r.value || 0) / 100));
            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full max-w-[270px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.52" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.25" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={radar.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.28)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {radar.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.12)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => <circle key={i} cx={x} cy={y} r="4" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.5" />)}
                    {radar.map((r, i) => {
                        const [lx, ly] = pt(i, 1.32);
                        return (
                            <g key={r.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.2" fontFamily="Anuphan, Sarabun, sans-serif" fontWeight="700">{r.label}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">{r.value}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        // ============================================================================
        // 5. MAIN AI SKILL LAB 3D APPLICATION (RJCLOUD.ORGAN 2.0)
        // ============================================================================
        function AiSkillLabApp() {
            const isAdminPreview = useMemo(() => {

            const [learner, setLearner] = useState(() => {

            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');

            const [phase, setPhase] = useState('setup'); // setup | briefing | negotiating | debrief

            const [personaId, setPersonaId] = useState(SKILL_LAB_PERSONAS[0].id);
            const [difficulty, setDifficulty] = useState('normal');
            const [trainingTrack, setTrainingTrack] = useState('roleplay'); // roleplay | micro_drill
            const [showVimeoModal, setShowVimeoModal] = useState(false);

            // Live conversation state
            const [messages, setMessages] = useState([]);
            const [timeline, setTimeline] = useState([]);
            const [relativeEmotion, setRelativeEmotion] = useState('CONFUSED');
            const [aiCoachTip, setAiCoachTip] = useState('');
            const [smartSuggestions, setSmartSuggestions] = useState([]);
            const [showSuggestionsPanel, setShowSuggestionsPanel] = useState(true);
            const [showHistoryDrawer, setShowHistoryDrawer] = useState(false);
            const [chatInput, setChatInput] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [activeSpeakerBadge, setActiveSpeakerBadge] = useState('');
            const [isListening, setIsListening] = useState(false);
            const [isPttHolding, setIsPttHolding] = useState(false);
            const [pttAutoSend, setPttAutoSend] = useState(true);
            const [paceFeedback, setPaceFeedback] = useState(null); // { status: 'good'|'fast', text }
            const [silenceElapsed, setSilenceElapsed] = useState(0);
            const [drillIndex, setDrillIndex] = useState(0);
            const [sessionReadyToEnd, setSessionReadyToEnd] = useState(false);
            const [triggerWarning, setTriggerWarning] = useState(null);
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [evalResult, setEvalResult] = useState(null);
            const [decompressionSec, setDecompressionSec] = useState(0);
            const [decompressionDone, setDecompressionDone] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const speechSessionRef = useRef(0);
            const recRef = useRef(null);
            const silenceStartRef = useRef(null);
            const pttStartRef = useRef(0);
            const pttTranscriptRef = useRef('');
            const pttAutoSendRef = useRef(true);
            const sendLearnerMsgRef = useRef(null);
            useEffect(() => { pttAutoSendRef.current = pttAutoSend; }, [pttAutoSend]);

            const selectedMode = useMemo(() => LAB_MODES.find(m => m.id === langId) || LAB_MODES[0], [langId]);
            const activePersona = useMemo(() => SKILL_LAB_PERSONAS.find(p => p.id === personaId) || SKILL_LAB_PERSONAS[0], [personaId]);
            const activeDifficulty = useMemo(() => SKILL_LAB_DIFFICULTIES[difficulty] || SKILL_LAB_DIFFICULTIES.normal, [difficulty]);
            const isEn = selectedMode.language === 'en';

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3200);
            }, []);

            useEffect(() => {
                const el = document.getElementById('lab-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // Firebase Auth + Settings subscription
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let unsubSettings = null;
                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser && !isAdminPreview) {
                        try { await signInAnonymously(fbAuth); } catch (_) {}
                        return;
                    }
                    if (!fbUser) return;
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (snap.exists() && snap.data()?.appsScriptUrl) {
                                setAppsScriptUrl(snap.data().appsScriptUrl);
                            }
                        },
                        () => {}
                    );
                });
                return () => { active = false; unsubAuth(); if (unsubSettings) unsubSettings(); };
            }, [isAdminPreview]);

            // Silence 2.5s tracker after AI stops speaking
            useEffect(() => {
                if (phase !== 'negotiating' || isSpeaking || isAiTyping || sessionReadyToEnd) {
                    silenceStartRef.current = null;
                    setSilenceElapsed(0);
                    return;
                }
                silenceStartRef.current = Date.now();
                const t = setInterval(() => {
                    if (silenceStartRef.current) setSilenceElapsed((Date.now() - silenceStartRef.current) / 1000);
                }, 200);
                return () => clearInterval(t);
            }, [phase, isSpeaking, isAiTyping, sessionReadyToEnd, messages.length]);

            // 15-second Guided Breathing Decompression Timer
            useEffect(() => {
                if (decompressionSec <= 0) return;
                const t = setTimeout(() => {
                    setDecompressionSec(prev => {
                        if (prev <= 1) {
                            setDecompressionDone(true);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearTimeout(t);
            }, [decompressionSec]);

            const stopAiVoice = useCallback(() => {
                speechSessionRef.current += 1;
                if (audioRef.current) { try { audioRef.current.pause(); } catch (_) {} audioRef.current = null; }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setIsSpeaking(false);
                setActiveSpeakerBadge('');
            }, []);

            const stopMicCompletely = useCallback(() => {
                if (recRef.current) { try { recRef.current.abort(); } catch (_) {} recRef.current = null; }
                setIsListening(false);
                setIsPttHolding(false);
            }, []);

            useEffect(() => () => { stopAiVoice(); stopMicCompletely(); }, [stopAiVoice, stopMicCompletely]);

            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'offline' };
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const txt = await res.text();
                    try { return JSON.parse(txt); }
                    catch (_) { return { status: 'error', raw: txt }; }
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            }, [appsScriptUrl]);

            // เสียง AI ญาติผู้เสียชีวิต (แยกเสียงตัวละคร + เล่น 2 เสียงสลับกันจริงในเคส 3 + ตัด WAV Metadata ไร้เสียงซ่า)
            const speakText = useCallback(async (text, modeObj, emoKey = 'SAD', personaObj = activePersona) => {
                stopAiVoice();
                const sessionId = speechSessionRef.current;
                const emoMeta = EMOTION_PHYSICS[emoKey] || EMOTION_PHYSICS.SAD;
                const segments = splitIntoVoiceSegments(text, personaObj, modeObj.language, emoMeta);
                if (segments.length === 0) return;

                setIsSpeaking(true);

                const playSingleUrl = (url) => new Promise((resolve) => {
                    if (speechSessionRef.current !== sessionId || !url) return resolve(false);
                    if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} }
                    audioUrlRef.current = url;
                    const audio = new Audio(url);
                    audioRef.current = audio;
                    audio.onended = () => resolve(true);
                    audio.onerror = () => resolve(false);
                    audio.play().catch(() => resolve(false));
                });

                const playSingleBrowser = (seg) => new Promise((resolve) => {
                    if (speechSessionRef.current !== sessionId || !('speechSynthesis' in window)) return resolve();
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(seg.text);
                        utter.lang = modeObj.language === 'en' ? 'en-US' : 'th-TH';
                        utter.rate = 0.95;
                        utter.pitch = seg.pitchShift || 1.02;
                        const best = pickBestBrowserVoice(modeObj.language);
                        if (best) utter.voice = best;
                        utter.onend = () => resolve();
                        utter.onerror = () => resolve();
                        window.speechSynthesis.speak(utter);
                    } catch (_) {
                        resolve();
                    }
                });

                for (let i = 0; i < segments.length; i++) {
                    if (speechSessionRef.current !== sessionId) return;
                    const seg = segments[i];
                    setActiveSpeakerBadge(`${seg.speakerLabel} (${seg.voiceName})`);

                    let playedCloud = false;
                    if (appsScriptUrl) {
                        const res = await callAppsScript({
                            action: 'callGeminiTTS',
                            text: seg.text,
                            voiceName: seg.voiceName || 'Sulafat',
                            languageCode: modeObj.language === 'en' ? 'en-US' : 'th-TH',
                            style: seg.styleHint
                        });
                        if (speechSessionRef.current !== sessionId) return;
                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const url = pcm16ToWavUrl(res.inlineData.data, rate);
                            if (url) playedCloud = await playSingleUrl(url);
                        }
                    }

                    if (!playedCloud && speechSessionRef.current === sessionId) {
                        await playSingleBrowser(seg);
                    }
                }

                if (speechSessionRef.current === sessionId) {
                    setIsSpeaking(false);
                    setActiveSpeakerBadge('');
                }
            }, [activePersona, appsScriptUrl, callAppsScript, stopAiVoice]);

            // ขั้นที่ 1: เปิดแฟ้มเคสหน้าห้องให้คำปรึกษา
            const handleOpenCaseBriefing = () => {
                stopAiVoice();
                stopMicCompletely();
                setPhase('briefing');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // ขั้นที่ 2: เคาะประตูและเดินเข้าห้องให้คำปรึกษา 3 มิติ
            const handleKnockAndEnterRoom = () => {
                playGentleKnockSound();
                stopAiVoice();
                stopMicCompletely();
                const openingText = isEn ? activePersona.openingEN : activePersona.openingTH;
                const openingAction = isEn ? activePersona.openingActionEN : activePersona.openingActionTH;
                const openingEmo = activePersona.openingEmotion || 'CONFUSED';
                const initCoach = trainingTrack === 'micro_drill'
                    ? GUIDED_DRILLS[isEn ? 'en' : 'th'][0].prompt
                    : (isEn
                        ? `Case: ${activePersona.titleEN} (${activeDifficulty.badge}) — Start gently by introducing yourself and validating emotion.`
                        : `เคส: ${activePersona.titleTH} (${activeDifficulty.badge}) — เริ่มต้นด้วยการแนะนำตัวและรับฟังความรู้สึกของญาติก่อนให้ข้อมูลค่ะ`);

                const initSuggestions = trainingTrack === 'micro_drill'
                    ? GUIDED_DRILLS[isEn ? 'en' : 'th'][0].suggestions
                    : (activeDifficulty.showSuggestions ? GUIDED_DRILLS[isEn ? 'en' : 'th'][0].suggestions : []);

                setRelativeEmotion(openingEmo);
                setMessages([{

            const handleSendLearnerMessage = async (e, overrideText = null) => {

                stopAiVoice();

                const heldSilenceThisTurn = silenceElapsed >= 2.5;

                setTriggerWarning(hits.length > 0 ? hits[0] : null);

                const nextMessages = [

                if (trainingTrack === 'micro_drill') {
                    const drills = GUIDED_DRILLS[isEn ? 'en' : 'th'];
                    const nextIdx = drillIndex + 1;
                    if (nextIdx < drills.length) {
                        const midAction = isEn ? 'Takes a slow breath and looks up cautiously.' : 'สูดลมหายใจช้าๆ สีหน้าอ่อนลงเล็กน้อยแต่ยังมีแววกังวล';
                        const midText = isEn
                            ? 'Thank you for speaking so gently... May I ask one more thing to be completely sure before talking with my family?'

                            id: `tl-${Date.now()}`, userText: learnerText, aiText: midText, emotion: 'SAD',

                            snapshotBeforeTurn: preTurnSnapshot, drillIndexBeforeTurn: drillIndex, emotionBeforeTurn: relativeEmotion
                        }]);
                        speakText(midText, selectedMode, 'SAD', activePersona);
                    } else {
                        const closingAction = isEn ? 'Wipes a tear softly and nods with quiet relief.' : 'ซับน้ำตาเบาๆ คลายความเกร็งที่ไหล่และพยักหน้าด้วยความซาบซึ้งใจ';
                        const closingLine = isEn
                            ? 'Thank you so much for your kindness and patience. I feel much calmer now and will talk gently with my family.'
                            : 'ขอบคุณมากนะคะที่รับฟังและดูแลจิตใจครอบครัวเราอย่างอ่อนโยน ตอนนี้หนูสบายใจขึ้นมากแล้วค่ะ ขอเวลาหนูไปปรึกษากับที่บ้านก่อนนะคะ';
                        setRelativeEmotion('CALM');
                        setSessionReadyToEnd(true);
                        setSmartSuggestions([]);
                        setAiCoachTip(isEn
                            ? 'All 3 stages complete! Tap "Evaluate & Claim Card" below.'
                            : 'ฝึกครบทั้ง 3 ด่านแล้วค่ะ กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ด้านล่างได้เลยค่ะ');
                        setMessages([...nextMessages, { id: `ai-final-${Date.now()}`, sender: 'ai', emotion: 'CALM', actionCue: closingAction, speakerName: selectedMode.relativeName, text: closingLine }]);
                        setTimeline(prev => [...prev, {
                            id: `tl-${Date.now()}`, userText: learnerText, aiText: closingLine, emotion: 'CALM',
                            trust: 92, tension: 16, deltaTrust: 92 - prevTrust, silenceHeld: heldSilenceThisTurn,
                            snapshotBeforeTurn: preTurnSnapshot, drillIndexBeforeTurn: drillIndex, emotionBeforeTurn: relativeEmotion
                        }]);
                        speakText(closingLine, selectedMode, 'CALM', activePersona);
                    }
                    return;
                }

                // โหมด Roleplay อิสระ (Character Bible Lock + Anti-Loop Memory + Auto-Closure)
                setIsAiTyping(true);
                const turnCount = nextMessages.filter(m => m.sender === 'user').length;
                const targetTurns = activeDifficulty.id === 'hard' ? 5 : 4;

                const historyText = nextMessages
                    .slice(-10)
                    .map(m => `${m.sender === 'user' ? 'Clinical Communicator' : 'Bereaved Relative'}: ${m.text}`)
                    .join('\n');

                const combinedLearnerText = nextMessages.filter(m => m.sender === 'user').map(m => m.text || '').join(' ');
                const currentPrinciples = GUIDED_PRINCIPLES[isEn ? 'en' : 'th'];
                const coveredList = currentPrinciples.filter(p => p.pattern.test(combinedLearnerText)).map(p => p.label);
                const shouldWrapUpNow = turnCount >= targetTurns || (turnCount >= 3 && coveredList.length >= 3);

                const personaRule = isEn ? activePersona.promptHintEN : activePersona.promptHintTH;
                const diffRule = isEn ? activeDifficulty.aiPromptRuleEN : activeDifficulty.aiPromptRuleTH;

                const pacingDirective = shouldWrapUpNow
                    ? (isEn
                        ? `\n### CLOSING STAGE (Turn ${turnCount}/${targetTurns}): Natural ending reached! Shift to [CALM], thank the communicator warmly, say you will now consult your family privately, DO NOT ask new open-ended questions, and output [READY_TO_EVALUATE] on its own line.`
                        : `\n### ขั้นตอนปิดบทสนทนา (รอบที่ ${turnCount}/${targetTurns}): ถึงจุดจบบทสนทนาอย่างเป็นธรรมชาติแล้ว! ให้ปรับอารมณ์เป็น [CALM], กล่าวขอบคุณอย่างอบอุ่น, แจ้งว่าจะขอเวลาไปปรึกษาครอบครัวเงียบๆ, ห้ามตั้งคำถามปลายเปิดใหม่ให้ยืดเยื้อเด็ดขาด และต้องใส่แท็ก [READY_TO_EVALUATE] บนบรรทัดแยก`)
                    : (isEn
                        ? `\n### PACING (Turn ${turnCount}/${targetTurns}): Learner already addressed: [${coveredList.join(', ') || 'None'}]. NEVER repeat answered questions—advance naturally so the conversation concludes cleanly by Turn ${targetTurns}.`
                        : `\n### ความคืบหน้า (รอบที่ ${turnCount}/${targetTurns}): ประเด็นที่ผู้เรียนอธิบายไปแล้ว: [${coveredList.join(', ') || 'ยังไม่มี'}] — ห้ามถามซ้ำเรื่องที่ผู้เรียนตอบชัดเจนแล้ว! ให้ขยับไปประเด็นถัดไปอย่างมีเหตุผลเพื่อให้บทสนทนาจบลงอย่างเป็นธรรมชาติภายในรอบที่ ${targetTurns}`);

                const sugRule = (!shouldWrapUpNow && activeDifficulty.showSuggestions)
                    ? (isEn
                        ? `\n\n[SMART SUGGESTIONS]\nAdd 2 empathetic next-turn suggestions:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`
                        : `\n\n[SMART SUGGESTIONS]\nต่อท้ายด้วยแนวทางคำพูดที่เหมาะสมสำหรับผู้เรียน 2 ข้อ:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`)
                    : '\n\n(Do NOT output [SUGGESTION] lines.)';

                const fullPrompt = `${selectedMode.systemPrompt}

### CHARACTER BIBLE (ล็อกตัวละครตายตัว — ห้ามสลับตัวละครเด็ดขาด!)
- เคสปัจจุบัน: ${activePersona.titleTH}
- ผู้ป่วย/ผู้เสียชีวิต: ${activePersona.patientRoleTH}
- ผู้พูด (บทบาทของ AI): ${activePersona.speakerRoleTH}
- กฎเฉพาะเคส: ${personaRule}

### ระดับความยาก (${activeDifficulty.badge})
${diffRule}
${pacingDirective}

[Clinical Knowledge]
${(window.CLINICAL_KNOWLEDGE_BASE || '').slice(0, 1600)}${sugRule}

Conversation History:
${historyText}
Bereaved Relative (Start with [EMOTION]):`;

                let rawReply = '';
                if (appsScriptUrl) {
                    const res = await callAppsScript({ action: 'callGemini', prompt: learnerText, systemInstruction: fullPrompt });
                    if (res?.status === 'success' && res.text) rawReply = res.text;
                }
                if (!rawReply) {
                    await new Promise(r => setTimeout(r, 450));
                    rawReply = generateOfflineRelativeReply(learnerText, selectedMode, turnCount, activePersona, activeDifficulty);
                }

                const parsed = parseAiResponse(rawReply);
                const reachedEnd = Boolean(
                    parsed.readyToEvaluate ||
                    shouldWrapUpNow ||
                    (turnCount >= targetTurns && parsed.emotion === 'CALM') ||
                    turnCount >= 6
                );
                const finalEmotion = reachedEnd ? 'CALM' : parsed.emotion;
                const nextMeta = EMOTION_PHYSICS[finalEmotion] || EMOTION_PHYSICS.SAD;

                setRelativeEmotion(finalEmotion);
                if (reachedEnd) {
                    setSessionReadyToEnd(true);
                    setAiCoachTip(isEn
                        ? 'Conversation reached natural closure! Tap "Evaluate & Claim Card" below.'
                        : 'จบบทสนทนาอย่างสมบูรณ์และเป็นธรรมชาติแล้วค่ะ กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ด้านล่างได้เลยค่ะ');
                } else if (parsed.coachTip) {
                    setAiCoachTip(parsed.coachTip);
                }

                setMessages(prev => [...prev, {
                    id: `ai-${Date.now()}`, sender: 'ai', emotion: finalEmotion,
                    actionCue: parsed.actionCue || '',
                    speakerName: selectedMode.relativeName, text: parsed.text
                }]);
                setTimeline(prev => [...prev, {
                    id: `tl-${Date.now()}`, userText: learnerText, aiText: parsed.text, emotion: finalEmotion,
                    trust: nextMeta.trust, tension: nextMeta.tension, deltaTrust: nextMeta.trust - prevTrust,
                    silenceHeld: heldSilenceThisTurn, snapshotBeforeTurn: preTurnSnapshot,
                    drillIndexBeforeTurn: drillIndex, emotionBeforeTurn: relativeEmotion
                }]);
                setSmartSuggestions((!reachedEnd && activeDifficulty.showSuggestions) ? parsed.suggestions : []);
                setIsAiTyping(false);

                speakText(parsed.text, selectedMode, finalEmotion, activePersona);
            };

            useEffect(() => {
                sendLearnerMsgRef.current = handleSendLearnerMessage;
            });

            const handleRewindToTurn = (turnIdx) => {
                const target = timeline[turnIdx];
                if (!target) return;
                stopAiVoice();
                stopMicCompletely();
                setMessages(target.snapshotBeforeTurn || []);
                setTimeline(prev => prev.slice(0, turnIdx));
                setRelativeEmotion(target.emotionBeforeTurn || 'CONFUSED');
                setDrillIndex(target.drillIndexBeforeTurn || 0);
                setSessionReadyToEnd(false);
                setShowHistoryDrawer(false);
                setChatInput(target.userText || '');
                showToast(isEn ? 'Rewound to selected turn—try refining your phrase.' : 'ย้อนกลับไปรอบที่เลือกแล้ว ลองเกลาคำพูดใหม่ได้เลยค่ะ', 'info');
            };

            // ตรวจจังหวะความเร็วการพูด (Vocal Pace Monitor)
            const analyzeVocalPace = useCallback((spokenText, durationSec) => {
                const txt = String(spokenText || '').trim();
                if (!txt || durationSec < 1.2) return;
                if (isEn) {
                    const wps = txt.split(/\s+/).length / durationSec;
                    if (wps > 3.1) setPaceFeedback({ status: 'fast', text: 'Speaking pace was slightly fast — try slowing down gently.' });
                    else setPaceFeedback({ status: 'good', text: 'Calm, empathetic speaking pace ✓' });
                } else {
                    const cps = txt.replace(/\s+/g, '').length / durationSec;
                    if (cps > 15.5) setPaceFeedback({ status: 'fast', text: 'จังหวะการพูดค่อนข้างเร็ว ลองผ่อนความเร็วลงอีกนิดเพื่อช่วยญาติซึมซับข้อมูลนะคะ' });
                    else setPaceFeedback({ status: 'good', text: 'จังหวะการพูดนุ่มนวลและกำลังพอดี ✓' });
                }
            }, [isEn]);

            const startSpeechRecognition = useCallback((isHoldMode) => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast(isEn ? 'Speech recognition not supported on this browser.' : 'เบราว์เซอร์นี้ไม่รองรับการรับเสียง กรุณาพิมพ์ข้อความแทนค่ะ', 'error');
                    return;
                }
                stopAiVoice();
                stopMicCompletely();
                try {
                    const rec = new SR();
                    rec.lang = isEn ? 'en-US' : 'th-TH';
                    rec.continuous = Boolean(isHoldMode);
                    rec.interimResults = true;
                    pttStartRef.current = Date.now();
                    pttTranscriptRef.current = '';

                    rec.onresult = (ev) => {
                        let out = '';
                        for (let i = 0; i < ev.results.length; i++) out += ev.results[i][0].transcript;
                        pttTranscriptRef.current = out.trim();
                        setChatInput(out);
                    };
                    rec.onerror = () => {
                        setIsListening(false);
                        setIsPttHolding(false);
                    };
                    rec.onend = () => {
                        setIsListening(false);
                        setIsPttHolding(false);
                        const dur = (Date.now() - pttStartRef.current) / 1000;
                        const finalSpoken = pttTranscriptRef.current.trim();
                        if (finalSpoken) {
                            analyzeVocalPace(finalSpoken, dur);
                            if (isHoldMode && pttAutoSendRef.current && finalSpoken.length >= 4 && typeof sendLearnerMsgRef.current === 'function') {
                                sendLearnerMsgRef.current(null, finalSpoken);
                            }
                        }
                    };
                    recRef.current = rec;
                    rec.start();
                    setIsListening(true);
                    if (isHoldMode) setIsPttHolding(true);
                } catch (_) {
                    setIsListening(false);
                    setIsPttHolding(false);
                }
            }, [analyzeVocalPace, isEn, showToast, stopAiVoice, stopMicCompletely]);

            const handleToggleMic = () => {
                if (isListening) {
                    try { recRef.current?.stop(); } catch (_) { stopMicCompletely(); }
                    return;
                }
                startSpeechRecognition(false);
            };

            const handlePttDown = (e) => {
                if (isAiTyping || sessionReadyToEnd) return;
                if (e && e.preventDefault) e.preventDefault();
                startSpeechRecognition(true);
            };

            const handlePttUp = () => {
                if (!isPttHolding) return;
                setIsPttHolding(false);
                try { recRef.current?.stop(); } catch (_) { stopMicCompletely(); }
            };

            // AI Clinical Supervisor ประเมินผล 5 แกนจากบทสนทนาจริง (Gemini AI + Local Fallback)
            const handleEvaluateSession = async () => {
                stopAiVoice();
                stopMicCompletely();
                setIsEvaluating(true);

                const fallbackEval = evaluateConversation5Axis(messages, timeline, isEn ? 'en' : 'th');
                let finalResult = fallbackEval;

                if (appsScriptUrl && messages.some(m => m.sender === 'user')) {
                    const transcript = messages
                        .map((m, idx) => `${idx + 1}. ${m.sender === 'user' ? 'ผู้เรียน (TC)' : 'ญาติผู้ป่วย'}: ${m.text}${m.silenceHeld ? ' [เว้นความเงียบ ≥2.5 วิ]' : ''}`)
                        .join('\n');

                    const supervisorPrompt = isEn
                        ? `You are a senior Clinical Organ Donation Communication Supervisor evaluating a learner's conversation in "${activePersona.titleEN}" (${activeDifficulty.badge}).
Therapeutic silence (>=2.5s) count: ${fallbackEval.silenceCount}.
Flagged harsh words: ${fallbackEval.triggersFound.map(t => t.flagged).join(', ') || 'None'}.
Analyze the ACTUAL conversation below and return ONLY valid JSON with no extra text:
{
  "radar": { "setting": 0-100, "empathy": 0-100, "clarity": 0-100, "vocal": 0-100, "dignity": 0-100 },
  "supervisorSummary": "2-sentence supportive clinical supervisor feedback",
  "goldenMoment": { "quote": "exact best learner quote", "reason": "why it built trust" },
  "turningPoint": { "quote": "1 learner phrase that can be softened/improved", "betterPhrase": "softer clinical alternative", "reason": "brief clinical rationale" },
  "strengths": ["strength 1", "strength 2"],
  "improvements": ["actionable tip 1", "actionable tip 2"]
}`
                        : `คุณคือ "อาจารย์พยาบาลและผู้เชี่ยวชาญการสื่อสารรับบริจาคอวัยวะ (AI Clinical Supervisor)"
กำลังประเมินบทสนทนาจริงของผู้เรียนในเคส "${activePersona.titleTH}" (ระดับ ${activeDifficulty.badge})
ข้อมูลเสริม: เว้นความเงียบเยียวยา ≥2.5 วิ จำนวน ${fallbackEval.silenceCount} ครั้ง | คำที่อาจกระทบใจที่ตรวจพบ: ${fallbackEval.triggersFound.map(t => t.flagged).join(', ') || 'ไม่มี'}
อ่านบทสนทนาจริงอย่างละเอียด ให้คะแนนตามเนื้อหาจริง (ไม่ดูแค่คำซ้ำ) แล้วตอบกลับเป็น JSON เท่านั้นตามโครงสร้างนี้:
{
  "radar": { "setting": 40-100, "empathy": 40-100, "clarity": 40-100, "vocal": 40-100, "dignity": 40-100 },
  "supervisorSummary": "สรุปภาพรวมจากอาจารย์ผู้ประเมิน 2 ประโยคอย่างอบอุ่นและตรงประเด็น",
  "goldenMoment": { "quote": "ยกประโยคจริงของผู้เรียนที่ทำได้ดีที่สุด 1 ประโยค", "reason": "เหตุผลว่าทำไมประโยคนี้ช่วยเยียวยาใจและสร้างความไว้วางใจ" },
  "turningPoint": { "quote": "ยกประโยคจริงของผู้เรียน 1 จุดที่ยังปรับให้ละมุนหรือชัดเจนขึ้นได้", "betterPhrase": "เสนอประโยคทางเลือกที่นุ่มนวลและตรงหลัก SPIKES/Decoupling มากขึ้น", "reason": "เหตุผลทางคลินิกสั้นๆ" },
  "strengths": ["จุดแข็งข้อที่ 1", "จุดแข็งข้อที่ 2"],
  "improvements": ["คำแนะนำพัฒนาต่อข้อที่ 1", "คำแนะนำพัฒนาต่อข้อที่ 2"]
}`;

                    const aiRes = await callAppsScript({
                        action: 'callGemini',
                        prompt: `บทสนทนาจริง:\n${transcript}`,
                        systemInstruction: supervisorPrompt
                    });
                    if (aiRes?.status === 'success' && aiRes.text) {
                        const parsedSup = parseAiSupervisorJson(aiRes.text, fallbackEval, isEn ? 'en' : 'th');
                        if (parsedSup) finalResult = parsedSup;
                    }
                }

                setEvalResult(finalResult);
                setIsEvaluating(false);
                setPhase('debrief');
                window.scrollTo({ top: 0, behavior: 'smooth' });

                if (isAdminPreview || !learner?.id) return;

                const radarObj = {};
                finalResult.radar.forEach(r => { radarObj[r.key] = r.value; });
                const prevHist = Array.isArray(learner.skillLabHistory) ? learner.skillLabHistory : [];
                const nextEntry = {
                    at: new Date().toISOString(),
                    personaId: activePersona.id,
                    difficulty: activeDifficulty.id,
                    score: finalResult.score,
                    radar: finalResult.radar
                };
                const nextBest = Math.max(Number(learner.skillLabBestScore || 0), finalResult.score);
                const updatedLearner = {
                    ...learner,
                    skillLabPassed: true,
                    skillLabBestScore: nextBest,
                    skillLabLatestRadar: radarObj,
                    skillLabHistory: [...prevHist.slice(-9), nextEntry]
                };
                setLearner(updatedLearner);

                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: updatedLearner }));
                } catch (_) {}

                if (fbDb) {
                    try {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(learner.id)),

                                skillLabPassed: true,
                                skillLabBestScore: nextBest,
                                skillLabLatestRadar: radarObj,
                                skillLabHistory: updatedLearner.skillLabHistory

                        if (typeof CORE.buildAnonTelemetryId === 'function' && typeof CORE.buildExecutiveTelemetryPayload === 'function') {
                            const anonId = CORE.buildAnonTelemetryId(learner.id);
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId),
                                CORE.buildExecutiveTelemetryPayload(updatedLearner),
                                { merge: true }

                    } catch (err) {
                        console.warn('Save Skill Lab cloud warning:', err);
                    }

                for (let i = messages.length - 1; i >= 0; i--) {

                return null;

                const combined = messages.filter(m => m.sender === 'user').map(m => m.text || '').join(' ');
                const list = GUIDED_PRINCIPLES[isEn ? 'en' : 'th'];
                return new Set(list.filter(p => p.pattern.test(combined)).map(p => p.id));
            }, [messages, isEn]);

            const activeEmotionMeta = EMOTION_PHYSICS[phase === 'negotiating' ? relativeEmotion : 'CALM'] || EMOTION_PHYSICS.CONFUSED;
            const learnerTurnCount = useMemo(() => messages.filter(m => m.sender === 'user').length, [messages]);
            const targetTurnsDisplay = trainingTrack === 'micro_drill' ? 3 : (activeDifficulty.id === 'hard' ? 5 : 4);

            // ============================================================================
            // 6. RENDER PHASES (SETUP -> BRIEFING -> 3D NEGOTIATING -> 5-AXIS DEBRIEF)
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe overflow-x-hidden">
                    {phase !== 'negotiating' && <><div className="spatial-aura" /><div className="spatial-grid" /></>}

                    {/* FULLSCREEN 3D HOLOGRAM CANVAS (ACTIVE DURING NEGOTIATING) */}
                    {phase === 'negotiating' && (
                        <div className="fixed inset-0 z-0 bg-[#020612]">
                            <ThreeHologramStage emotionKey={relativeEmotion} isSpeaking={isSpeaking} />
                            <div className="absolute inset-0 pointer-events-none bg-gradient-to-b from-[#020612]/80 via-transparent to-[#020612]/95" />
                        </div>
                    )}

                    {/* ==================== PHASE 1: SETUP LOBBY ==================== */}
                    {phase === 'setup' && (
                        <div className="relative z-10 flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-5 sm:py-8 space-y-6">
                            <header className="flex flex-wrap items-center justify-between gap-3">
                                <div className="flex items-center gap-2.5">
                                    <a href="./index.html" className="spatial-soft w-10 h-10 rounded-xl flex items-center justify-center text-primary-adaptive" title="กลับห้องเรียน">
                                        <Icon name="ArrowLeft" size={18} />
                                    </a>
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">STEP 03 • RJCLOUD.ORGAN 2.0 • 3D SKILL LAB</span>
                                        <h1 className="font-display font-extrabold text-lg sm:text-2xl text-primary-adaptive leading-tight">
                                            AI Skill Lab 3 มิติ (จำลองญาติผู้เสียชีวิต)
                                        </h1>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2">
                                    <div className="inline-flex p-1 rounded-xl spatial-soft text-xs font-bold">
                                        <button type="button" onClick={() => setLangId('th')} className={`px-3 py-1.5 rounded-lg ${langId === 'th' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>ไทย</button>
                                        <button type="button" onClick={() => setLangId('en')} className={`px-3 py-1.5 rounded-lg ${langId === 'en' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>EN</button>

                                    <button

                                        onClick={() => setTheme(t => (t === 'dark' ? 'light' : 'dark'))}
                                        className="spatial-soft w-10 h-10 rounded-xl flex items-center justify-center text-primary-adaptive"
                                        title="สลับโหมดมืด/สว่าง"
                                    >
                                        <Icon name={theme === 'dark' ? 'Sun' : 'Moon'} size={16} className={theme === 'dark' ? 'text-amber-300' : 'text-indigo-600'} />
                                    </button>
                                </div>
                            </header>

                            {/* 1. เลือกสถานการณ์จำลอง 4 เคส (ล็อก Character Bible) */}
                            <section className="space-y-3">

                                    <h2 className="font-display font-bold text-sm text-primary-adaptive">2. {isEn ? 'Training Mode' : 'รูปแบบการฝึก'}</h2>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[
                                            { id: 'roleplay', title: isEn ? 'Full AI Roleplay' : 'โต้ตอบ AI อิสระ', sub: isEn ? '4–5 turns + Auto-Close' : '4–5 รอบ จบเป็นธรรมชาติ' },
                                            { id: 'micro_drill', title: isEn ? '3-Stage Drill' : 'ฝึกทีละขั้น 3 ด่าน', sub: isEn ? 'Guided step-by-step' : 'มีไกด์คำพูดทีละจังหวะ' }
                                        ].map(m => (
                                            <button

                            {/* บรีฟเคสก่อนเข้าห้อง & ปุ่มเปิดแฟ้มเคสหน้าห้อง */}
                            <section className="spatial-card rounded-[1.75rem] p-5 sm:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-prism-400/35">
