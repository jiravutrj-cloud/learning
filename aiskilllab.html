    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        function prepareNaturalSpeech(rawText, lang = 'th') {

        function pickBestBrowserVoice(lang = 'th') {
            if (typeof CORE.pickNaturalBrowserVoice === 'function') return CORE.pickNaturalBrowserVoice(lang);
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const prefix = lang === 'en' ? 'en' : 'th';
            const matches = voices.filter(v => String(v.lang || '').toLowerCase().startsWith(prefix));
            return matches.find(v => /premwadee|kanya|google|natural|samantha|aria|narisa/i.test(v.name || '')) || matches[0] || null;

        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            if (typeof CORE.pcm16ToWavBlob === 'function') {
                const blob = CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                return blob && blob.size > 0 ? URL.createObjectURL(blob) : '';
            }
            let rate = sampleRate || 24000;
            const bin = window.atob(base64PCM);
            const rawBytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) rawBytes[i] = bin.charCodeAt(i);

            // แกะเฉพาะก้อน 'data' เพื่อตัดก้อน Metadata ท้ายไฟล์ WAV ออก 100%
            let offsetBytes = 0;
            let byteLength = rawBytes.length;
            if (
                rawBytes.length >= 44 &&
                rawBytes[0] === 0x52 && rawBytes[1] === 0x49 && rawBytes[2] === 0x46 && rawBytes[3] === 0x46 &&
                rawBytes[8] === 0x57 && rawBytes[9] === 0x41 && rawBytes[10] === 0x56 && rawBytes[11] === 0x45
            ) {
                const hdrView = new DataView(rawBytes.buffer, rawBytes.byteOffset, rawBytes.byteLength);
                let pos = 12;
                let foundData = false;
                while (pos + 8 <= rawBytes.length) {
                    const id = String.fromCharCode(rawBytes[pos], rawBytes[pos + 1], rawBytes[pos + 2], rawBytes[pos + 3]);
                    const sz = hdrView.getUint32(pos + 4, true);
                    if (id === 'fmt ' && pos + 16 <= rawBytes.length) {
                        const wr = hdrView.getUint32(pos + 12, true);
                        if (wr >= 8000 && wr <= 96000) rate = wr;
                    } else if (id === 'data') {
                        offsetBytes = pos + 8;
                        byteLength = Math.min(sz, rawBytes.length - offsetBytes);
                        foundData = true;
                        break;
                    }
                    const step = 8 + sz + (sz % 2);
                    if (step <= 8) break;
                    pos += step;
                }
                if (!foundData) {
                    offsetBytes = 44;
                    byteLength = Math.max(0, rawBytes.length - 44);
                }
            }

            const count = Math.floor(byteLength / 2);
            if (count <= 0) return '';
            const inView = new DataView(rawBytes.buffer, rawBytes.byteOffset + offsetBytes, count * 2);
            const samples = new Float32Array(count);
            for (let i = 0; i < count; i++) samples[i] = inView.getInt16(i * 2, true) / 32768;

            const frameSize = Math.max(128, Math.round(rate * 0.02));
            const numFrames = Math.floor(count / frameSize);
            let endFrame = numFrames - 1;
            while (endFrame > 12) {
                let sumSq = 0, zc = 0, prev = samples[endFrame * frameSize];
                for (let j = 0; j < frameSize; j++) {
                    const s = samples[endFrame * frameSize + j];
                    sumSq += s * s;
                    if ((s >= 0 && prev < 0) || (s < 0 && prev >= 0)) zc++;
                    prev = s;
                }
                if (Math.sqrt(sumSq / frameSize) < 0.016 || zc / frameSize > 0.22) endFrame--;
                else break;
            }

            const kept = Math.min(count, Math.max(Math.min(count, Math.round(rate * 0.25)), (endFrame + 1) * frameSize));
            const pad = Math.round(rate * 0.045);
            const outBytes = (kept + pad) * 2;
            const fadeIn = Math.min(Math.round(rate * 0.012), Math.floor(kept * 0.1));
            const fadeOut = Math.min(Math.round(rate * 0.075), Math.floor(kept * 0.22));

            const buf = new ArrayBuffer(44 + outBytes);
            const v = new DataView(buf);
            const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            ws(0, 'RIFF'); v.setUint32(4, 36 + outBytes, true); ws(8, 'WAVE'); ws(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
            v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, outBytes, true);

            for (let i = 0; i < kept; i++) {
                let s = samples[i];
                if (i < fadeIn) s *= i / fadeIn;
                else if (i >= kept - fadeOut) s *= 0.5 * (1 + Math.cos(Math.PI * ((i - (kept - fadeOut)) / fadeOut)));
                v.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, s)) * 32767), true);
            }
            return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
        }

        function splitIntoVoiceSegments(text, personaObj, lang, emoMeta) {
            const raw = String(text || '').trim();
            if (!raw) return [];
            const isEn = lang === 'en';
            const primaryVoice = personaObj?.voiceCast?.primary || 'Sulafat';
            const secondaryVoice = personaObj?.voiceCast?.secondary || 'Kore';
            const baseStyle = isEn ? emoMeta.ttsStyleEN : emoMeta.ttsStyleTH;

            // แยกเสียง 2 ตัวละครสำหรับเคส 3 (ภรรยา + คุณแม่)
            if (personaObj?.id === 'conflict') {
                const regex = /\[(ภรรยา|คุณแม่|แม่|Wife|Mother)\]\s*:?\s*([\s\S]*?)(?=\[(?:ภรรยา|คุณแม่|แม่|Wife|Mother)\]|$)/gi;
                const segments = [];
                let m;
                while ((m = regex.exec(raw)) !== null) {
                    const who = String(m[1] || '').trim();
                    const spoken = prepareNaturalSpeech(m[2], lang);
                    if (!spoken) continue;
                    const isMother = /แม่|mother/i.test(who);
                    segments.push({
                        speakerLabel: isMother ? (isEn ? 'Mother' : 'คุณแม่') : (isEn ? 'Wife' : 'ภรรยา'),
                        voiceName: isMother ? secondaryVoice : primaryVoice,
                        pitchShift: isMother ? 0.88 : 1.05,
                        styleHint: isMother
                            ? (isEn
                                ? 'Speak as a deeply grieving, protective older mother with a firm, resonant, emotional voice.'
                                : 'พูดภาษาไทยด้วยน้ำเสียงคุณแม่วัยกลางคนที่ทุ้มหนักแน่น โศกเศร้าและหวงแหนลูกชายอย่างเป็นธรรมชาติ')
                            : baseStyle,
                        text: spoken
                    });
                }
                if (segments.length > 0) return segments;
            }

            const clean = prepareNaturalSpeech(raw, lang);
            if (!clean) return [];
            return [{
                speakerLabel: isEn ? 'Relative' : (personaObj?.speakerRoleTH?.split(' ')[0] || 'ญาติ'),
                voiceName: primaryVoice,
                pitchShift: 1.02,
                styleHint: baseStyle,
                text: clean
            }];
        }

        function playGentleKnockSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                [0, 0.24].forEach((offset) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    const t = ctx.currentTime + offset;
                    osc.frequency.setValueAtTime(165, t);
                    osc.frequency.exponentialRampToValueAtTime(62, t + 0.09);
                    gain.gain.setValueAtTime(0.001, t);
                    gain.gain.linearRampToValueAtTime(0.18, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.12);
                });
            } catch (_) {}
        }

        function detectCustomSelfIntro(text, isEn = false) {
            const input = String(text || '').trim();
            if (!input) return '';
            if (isEn) {
                const m = input.match(/(?:call me|my name is|i am|i'm)\s+((?:Dr\.|Nurse|Mr\.|Ms\.)?\s*[A-Za-z]{2,18})/i);
                if (m && m[1]) {
                    const cand = m[1].trim();
                    if (!/^(the|a|an|here|sorry|clinical|coordinator|nurse|doctor|very|truly|so)$/i.test(cand)) {
                        return cand;
                    }
                }
                return '';
            }
            const callMe = input.match(/เรียก(?:ผม|ดิฉัน|หนู|ฉัน)?ว่า\s*([ก-๙a-zA-Z0-9\.]{2,20})/);
            if (callMe && callMe[1]) {
                const raw = callMe[1].replace(/(?:นะ|ค่ะ|ครับ|นะคะ|นะครับ|ได้เลย|ก็ได้).*$/, '').trim();
                if (raw.length >= 2) {
                    return /^(คุณ|พี่|น้อง|หมอ|อาจารย์|พยาบาล|พว\.|นพ\.|พญ\.)/.test(raw) ? raw : `คุณ${raw}`;
                }
            }
            const named = input.match(/(?:ผม|ดิฉัน|หนู|ฉัน|กระผม)\s*(?:ชื่อ(?:เล่น)?(?:ว่า)?|คือ)\s*([ก-๙a-zA-Z0-9\.]{2,22})/);
            if (named && named[1]) {
                const raw = named[1].replace(/(?:นะ|ค่ะ|ครับ|นะคะ|นะครับ|เป็น|จาก|อยู่).*$/, '').trim();
                const isGeneric = /^(พยาบาล|ผู้ประสานงาน|เจ้าหน้าที่|บุคลากร|หมอ|แพทย์|ทีม|คนดูแล|ตัวแทน)/.test(raw) && raw.length >= 6;
                if (raw.length >= 2 && !isGeneric) {
                    return /^(คุณ|พี่|น้อง|หมอ|อาจารย์|พยาบาล|พว\.|นพ\.|พญ\.)/.test(raw) ? raw : `คุณ${raw}`;
                }
            }
            const roleNamed = input.match(/(?:ผม|ดิฉัน|หนู|ฉัน)?\s*((?:พี่|หมอ|พว\.|นพ\.|พญ\.|อาจารย์)[ก-๙a-zA-Z]{2,14})(?:\s|ค่ะ|ครับ|นะ|$)/);
            if (roleNamed && roleNamed[1]) {
                const raw = roleNamed[1].trim();
                if (!/^(พี่น้อง|พี่ชาย|พี่สาว|หมอแจ้ง|หมอบอก|หมอตรวจ|หมอวินิจฉัย|หมอเวร)/.test(raw)) {
                    return raw;
                }
            }
            return '';
        }

        function parseAiResponse(rawText) {
            const text = String(rawText || '').trim();
            const readyToEvaluate = /\[(READY_TO_EVALUATE|CONVERSATION_END|END_SESSION)\]/i.test(text);
            let decision = null;
            const decMatch = text.match(/\[DECISION\s*:\s*(CONSENT|DECLINE|DEFER_HOME)\]/i);
            if (decMatch && decMatch[1]) {
                decision = decMatch[1].toUpperCase();
            }

            const suggestions = [];
            const sugRegex = /\[SUGGESTION\s*\d+\]\s*([^\n]+)/gi;
            let match;
            while ((match = sugRegex.exec(text)) !== null) {
                if (match[1]?.trim()) suggestions.push(match[1].trim());
            }
            let coachTip = '';
            const tipMatch = text.match(/\[COACH_TIP\]\s*([^\n]+)/i);
            if (tipMatch && tipMatch[1]) coachTip = tipMatch[1].trim();

            let actionCue = '';
            const actionMatch = text.match(/\[ACTION\]\s*([^\n]+)/i);
            if (actionMatch && actionMatch[1]) actionCue = actionMatch[1].trim();

            let cleaned = text
                .replace(/\[(READY_TO_EVALUATE|CONVERSATION_END|END_SESSION)\]/gi, '')
                .replace(/\[DECISION\s*:\s*(CONSENT|DECLINE|DEFER_HOME)\]/gi, '')
                .replace(/\[ACTION\]\s*[^\n]+/gi, '')
                .replace(/\[SUGGESTION\s*\d+\]\s*[^\n]+/gi, '')
                .replace(/\[COACH_TIP\]\s*[^\n]+/gi, '')
                .trim();

            let emotion = 'SAD';
            const emoMatch = cleaned.match(/^\[(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]\s*/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                cleaned = cleaned.replace(emoMatch[0], '').trim();
            }
            if (!/^\[(ภรรยา|คุณแม่|แม่|Wife|Mother)/i.test(cleaned)) {
                cleaned = cleaned.replace(/^\[[^\]]{1,25}\]\s*/, '').trim();
            }

            return {
                emotion: EMOTION_PHYSICS[emotion] ? emotion : 'SAD',
                actionCue,
                text: cleaned || '...',
                coachTip,
                suggestions: readyToEvaluate ? [] : suggestions.slice(0, 2),
                decision,
                readyToEvaluate
            };
        }

        function evaluateConversation5Axis(messages, timeline, lang = 'th', decisionOutcome = null) {
            const isEn = lang === 'en';
            const userTurns = messages.filter(m => m.sender === 'user');
            const combined = userTurns.map(m => m.text || '').join(' ');
            const principles = GUIDED_PRINCIPLES[isEn ? 'en' : 'th'];
            const triggersFound = detectTriggerPhrases(combined, isEn ? 'en' : 'th');
            const silenceCount = timeline.filter(t => t.silenceHeld).length;
            const lastEmotion = timeline[timeline.length - 1]?.emotion || 'CONFUSED';

            const hit = (id) => principles.find(p => p.id === id)?.pattern?.test(combined) || false;
            const baseTurnBonus = Math.min(18, userTurns.length * 4);

            const setting = Math.min(100, (hit('setting') ? 76 : 56) + Math.min(20, userTurns.length * 4));
            const empathy = Math.min(100, (hit('empathy') ? 78 : 58) + (lastEmotion === 'CALM' ? 14 : 6) - triggersFound.length * 8);
            const clarity = Math.min(100, (hit('clarity') ? 78 : 56) + baseTurnBonus);
            const vocal = Math.min(100, 68 + Math.min(24, silenceCount * 12) + (lastEmotion === 'CALM' ? 8 : 0));
            const dignity = Math.min(100, (hit('dignity') ? 80 : 58) + (lastEmotion === 'CALM' ? 14 : 4) - triggersFound.length * 6);

            const clamp = (n) => Math.max(40, Math.min(100, Math.round(n)));
            const radar = [
                { key: 'setting', label: isEn ? 'Setting & Role' : 'ห้องรับรอง & บทบาท', value: clamp(setting) },
                { key: 'empathy', label: isEn ? 'Empathy' : 'รับรู้อารมณ์ร่วม', value: clamp(empathy) },
                { key: 'clarity', label: isEn ? 'Clinical Clarity' : 'ข้อมูลภาวะสมองตาย', value: clamp(clarity) },
                { key: 'vocal', label: isEn ? 'Vocal & Silence' : 'น้ำเสียง & ความเงียบ', value: clamp(vocal) },
                { key: 'dignity', label: isEn ? 'Dignity & Pace' : 'ไม่เร่งรัด & เกียรติร่าง', value: clamp(dignity) }
            ];
            const score = Math.round(radar.reduce((s, r) => s + r.value, 0) / radar.length);

            const strengths = [];
            const improvements = [];
            radar.forEach(r => {
                if (r.value >= 80) strengths.push(`${r.label} (${r.value}/100)`);
                else improvements.push(isEn ? `Strengthen ${r.label} (${r.value}/100)` : `เสริมทักษะด้าน ${r.label} (${r.value}/100)`);
            });

            const bestTurn = [...timeline].sort((a, b) => (b.deltaTrust || 0) - (a.deltaTrust || 0))[0];
            const goldenQuote = bestTurn?.userText || userTurns[userTurns.length - 1]?.text || '';
            const turningTurn = timeline.find(t => detectTriggerPhrases(t.userText, isEn ? 'en' : 'th').length > 0) || timeline[0];

            return {
                source: 'local',
                score,
                radar,
                decision: decisionOutcome,
                triggersFound,
                silenceCount,
                supervisorSummary: isEn
                    ? 'You maintained compassionate presence and guided the family calmly through a delicate clinical moment.'
                    : 'คุณสามารถประคับประคองอารมณ์ของครอบครัวและถ่ายทอดข้อมูลสำคัญได้อย่างสุภาพเป็นระบบค่ะ',
                goldenMoment: goldenQuote ? {
                    quote: goldenQuote,
                    reason: isEn
                        ? 'This response helped lower emotional tension and build trust with the relative.'
                        : 'ประโยคนี้ช่วยลดความตึงเครียดทางอารมณ์และสร้างความไว้วางใจให้ญาติเปิดใจรับฟังได้ดีขึ้นค่ะ'
                } : null,
                turningPoint: triggersFound.length > 0 ? {
                    quote: turningTurn?.userText || triggersFound[0].flagged,
                    betterPhrase: triggersFound[0].softer,
                    reason: triggersFound[0].reason
                } : (turningTurn && score < 90 ? {
                    quote: turningTurn.userText,
                    betterPhrase: isEn
                        ? 'I hear how painful and sudden this is. Please take all the quiet time your family needs—there is no rush at all.'
                        : 'เข้าใจความรู้สึกหนักใจของครอบครัวมากค่ะ ไม่ต้องรีบตัดสินใจเลยนะคะ ขอให้ครอบครัวได้ใช้เวลาปรึกษากันอย่างเต็มที่ค่ะ',
                    reason: isEn
                        ? 'Adding explicit emotional validation before clinical facts softens the impact even further.'
                        : 'การสะท้อนอารมณ์และย้ำว่าไม่เร่งรัดก่อนเข้าสู่รายละเอียดจะช่วยให้ญาติอุ่นใจขึ้นอีกขั้นค่ะ'
                } : null),
                strengths: strengths.length ? strengths : [isEn ? 'Completed full compassionate practice' : 'กล้าสื่อสารและประคับประคองบทสนทนาจนจบ'],
                improvements: improvements.length ? improvements : [isEn ? 'Maintain this calm, respectful tone in real ICU cases' : 'รักษาน้ำเสียงที่นุ่มนวลและจังหวะเงียบอย่างนี้ในเคสหน้างานจริงค่ะ']
            };
        }

        function parseAiSupervisorJson(rawText, fallbackEval, lang = 'th') {
            try {
                const cleaned = String(rawText || '')
                    .replace(/```json\s*/gi, '')
                    .replace(/```\s*/g, '')
                    .trim();
                const start = cleaned.indexOf('{');
                const end = cleaned.lastIndexOf('}');
                if (start < 0 || end <= start) return null;
                const parsed = JSON.parse(cleaned.slice(start, end + 1));
                const r = parsed?.radar;
                if (!r || typeof r !== 'object') return null;

                const isEn = lang === 'en';
                const clamp = (v, fb) => {
                    const n = Number(v);

        function ThreeHologramStage({ emotionKey, isSpeaking }) {
            const mountRef = useRef(null);
            const liveRef = useRef({ emotionKey, isSpeaking });
            useEffect(() => { liveRef.current = { emotionKey, isSpeaking }; }, [emotionKey, isSpeaking]);

            useEffect(() => {
                const container = mountRef.current;
                const THREE = window.THREE;
                if (!container || !THREE) return;

                const width = Math.max(1, container.clientWidth || window.innerWidth);
                const height = Math.max(1, container.clientHeight || window.innerHeight);

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(48, width / height, 0.1, 100);
                camera.position.set(0, 0.2, width < 640 ? 7.2 : 5.8);

                let renderer;
                try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' }); }
                catch (_) { return; }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(width, height);
                renderer.setClearColor(0x000000, 0);
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const c = document.createElement('canvas');
                c.width = 64; c.height = 64;
                const g = c.getContext('2d');
                const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.28, 'rgba(255,255,255,0.82)');
                grad.addColorStop(0.68, 'rgba(255,255,255,0.18)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                g.fillStyle = grad;
                g.fillRect(0, 0, 64, 64);
                const tex = new THREE.CanvasTexture(c);

                const root = new THREE.Group();
                scene.add(root);

                const COUNT = 1800;
                const basePos = new Float32Array(COUNT * 3);
                const pos = new Float32Array(COUNT * 3);
                const cols = new Float32Array(COUNT * 3);
                const seeds = new Float32Array(COUNT);
                const golden = Math.PI * (3 - Math.sqrt(5));

                for (let i = 0; i < COUNT; i++) {
                    const y = 1 - (i / (COUNT - 1)) * 2;
                    const r = Math.sqrt(Math.max(0, 1 - y * y));
                    const theta = golden * i;
                    const rad = 1.56 + (i % 7 === 0 ? 0.46 : 0) + (Math.random() - 0.5) * 0.14;
                    basePos[i * 3] = Math.cos(theta) * r * rad;
                    basePos[i * 3 + 1] = y * rad;
                    basePos[i * 3 + 2] = Math.sin(theta) * r * rad;
                    pos[i * 3] = basePos[i * 3];
                    pos[i * 3 + 1] = basePos[i * 3 + 1];
                    pos[i * 3 + 2] = basePos[i * 3 + 2];
                    seeds[i] = Math.random() * Math.PI * 2;
                }

                const pGeo = new THREE.BufferGeometry();
                pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                pGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
                const pMat = new THREE.PointsMaterial({
                    size: 0.086, map: tex, vertexColors: true,
                    transparent: true, opacity: 0.92, depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                root.add(new THREE.Points(pGeo, pMat));

                const coreGeo = new THREE.IcosahedronGeometry(0.9, 2);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.14, blending: THREE.AdditiveBlending });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                root.add(coreMesh);

                const ringGeo = new THREE.TorusGeometry(2.22, 0.011, 16, 140);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI * 0.42;
                root.add(ring);

                const outerRingGeo = new THREE.TorusGeometry(2.58, 0.007, 12, 140);
                const outerRingMat = new THREE.MeshBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending });
                const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
                outerRing.rotation.x = Math.PI * 0.56;
                outerRing.rotation.y = Math.PI * 0.2;
                root.add(outerRing);

                // รองรับการหมุนมุมกล้อง 3 มิติแบบ Ultra-Smooth Damped Inertia ทั้งเมาส์และสัมผัส
                let dragging = false, lastX = 0, lastY = 0;
                let targetRotY = 0, targetRotX = 0, smoothRotY = 0, smoothRotX = 0;
                const startDrag = (x, y) => { dragging = true; lastX = x; lastY = y; };
                const moveDrag = (x, y) => {
                    if (!dragging) return;
                    targetRotY += (x - lastX) * 0.0055;
                    targetRotX = Math.max(-0.55, Math.min(0.55, targetRotX + (y - lastY) * 0.0042));
                    lastX = x; lastY = y;
                };
                const endDrag = () => { dragging = false; };

                const onMouseDown = (e) => startDrag(e.clientX, e.clientY);
                const onMouseMove = (e) => moveDrag(e.clientX, e.clientY);
                const onTouchStart = (e) => { if (e.touches[0]) startDrag(e.touches[0].clientX, e.touches[0].clientY); };
                const onTouchMove = (e) => { if (e.touches[0]) moveDrag(e.touches[0].clientX, e.touches[0].clientY); };

                renderer.domElement.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', endDrag);
                renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: true });
                window.addEventListener('touchmove', onTouchMove, { passive: true });
                window.addEventListener('touchend', endDrag);

                const onResize = () => {
                    if (!container) return;
                    const w = Math.max(1, container.clientWidth || window.innerWidth);
                    const h = Math.max(1, container.clientHeight || window.innerHeight);
                    camera.aspect = w / h;
                    camera.position.z = w < 640 ? 7.2 : 5.8;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', onResize);

                const c1 = new THREE.Color(0x38bdf8), c2 = new THREE.Color(0x818cf8);
                const t1 = new THREE.Color(), t2 = new THREE.Color(), tmp = new THREE.Color();

                // สะสมเฟสแบบต่อเนื่อง (Phase Integration) เพื่อไม่ให้กระตุกหรือกระโดดเวลาเปลี่ยนอารมณ์
                let breathPhase = 0, wavePhase = 0, colorPhase = 0;
                let smoothSpeed = 0.9, smoothSpeak = 0, autoYaw = 0;
                let last = performance.now(), rafId = null;

                const animate = (now) => {
                    rafId = requestAnimationFrame(animate);
                    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
                    last = now;

                    const { emotionKey: ek, isSpeaking: speaking } = liveRef.current;
                    const meta = EMOTION_PHYSICS[ek] || EMOTION_PHYSICS.CONFUSED;

                    // Frame-rate independent exponential damping (Ultra Smooth)
                    const dampColor = 1 - Math.exp(-dt * 2.2);
                    const dampSpeed = 1 - Math.exp(-dt * 2.4);
                    const dampSpeak = 1 - Math.exp(-dt * 3.8);
                    const dampDrag = 1 - Math.exp(-dt * 6.5);

                    t1.setHex(meta.primaryHex);
                    t2.setHex(meta.secondaryHex);
                    c1.lerp(t1, dampColor);
                    c2.lerp(t2, dampColor);

                    smoothSpeed += (meta.speed - smoothSpeed) * dampSpeed;
                    smoothSpeak += ((speaking ? 1 : 0) - smoothSpeak) * dampSpeak;
                    smoothRotX += (targetRotX - smoothRotX) * dampDrag;
                    smoothRotY += (targetRotY - smoothRotY) * dampDrag;

                    breathPhase += dt * (0.72 + smoothSpeed * 0.28);
                    wavePhase += dt * (0.65 + smoothSpeed * 0.42 + smoothSpeak * 0.65);
                    colorPhase += dt * 0.36;
                    autoYaw += dt * (0.055 + smoothSpeak * 0.035);

                    const pAttr = pGeo.attributes.position;
                    const cAttr = pGeo.attributes.color;
                    const pArr = pAttr.array;
                    const cArr = cAttr.array;

                    const speakRipple = smoothSpeak * (0.028 + 0.02 * Math.sin(wavePhase * 2.8) + 0.011 * Math.cos(wavePhase * 4.3));
                    const breath = 1 + Math.sin(breathPhase) * 0.026 + speakRipple;
                    const waveAmp = 0.026 + smoothSpeak * 0.028;

                    for (let i = 0; i < COUNT; i++) {
                        const i3 = i * 3;
                        const bx = basePos[i3], by = basePos[i3 + 1], bz = basePos[i3 + 2];
                        const sd = seeds[i];
                        const wave = Math.sin(wavePhase + by * 1.25 + bx * 0.72 + sd * 0.15) * waveAmp;
                        const flow = Math.cos(breathPhase * 0.85 + bz * 1.1 - bx * 0.55) * 0.014;
                        const sc = breath + wave + flow;
                        pArr[i3] = bx * sc;
                        pArr[i3 + 1] = by * sc;
                        pArr[i3 + 2] = bz * sc;

                        const mix = 0.5 + 0.5 * Math.sin(colorPhase + by * 0.85 + sd * 0.22);
                        tmp.copy(c1).lerp(c2, mix);
                        cArr[i3] = tmp.r;
                        cArr[i3 + 1] = tmp.g;
                        cArr[i3 + 2] = tmp.b;
                    }
                    pAttr.needsUpdate = true;
                    cAttr.needsUpdate = true;

                    coreMat.color.copy(c1);
                    coreMat.opacity = 0.12 + smoothSpeak * 0.07;
                    ringMat.color.copy(c2);
                    ringMat.opacity = 0.24 + smoothSpeak * 0.14;
                    outerRingMat.color.copy(c1);

                    root.rotation.y = autoYaw + smoothRotY;
                    root.rotation.x = smoothRotX + Math.sin(breathPhase * 0.5) * 0.035;
                    coreMesh.rotation.y = -autoYaw * 1.15;
                    coreMesh.scale.setScalar(1 + speakRipple * 1.2);
                    ring.rotation.z += dt * (0.048 + smoothSpeak * 0.075);
                    outerRing.rotation.z -= dt * (0.032 + smoothSpeak * 0.045);
                    root.position.y = 0.65 + Math.sin(breathPhase * 0.7) * 0.045;

                    renderer.render(scene, camera);
                };
                rafId = requestAnimationFrame(animate);

                return () => {
                    cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', onResize);
                    renderer.domElement.removeEventListener('mousedown', onMouseDown);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', endDrag);
                    renderer.domElement.removeEventListener('touchstart', onTouchStart);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('touchend', endDrag);
                    pGeo.dispose(); pMat.dispose(); coreGeo.dispose(); coreMat.dispose();
                    ringGeo.dispose(); ringMat.dispose(); outerRingGeo.dispose(); outerRingMat.dispose();
                    tex.dispose(); renderer.dispose();
                };
            }, []);

            return <div ref={mountRef} className="w-full h-full" />;
        }

        function FiveAxisRadarSVG({ radar, theme }) {
            const isDark = theme !== 'light';
            const size = 250, cx = size / 2, cy = size / 2, maxR = 78;
            const pt = (idx, ratio) => {
                const angle = (Math.PI * 2 * idx) / radar.length - Math.PI / 2;
                return [cx + Math.cos(angle) * maxR * ratio, cy + Math.sin(angle) * maxR * ratio];
            };
            const dataPts = radar.map((r, i) => pt(i, (r.value || 0) / 100));
            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full max-w-[270px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.52" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.25" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={radar.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.28)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {radar.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.12)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => <circle key={i} cx={x} cy={y} r="4" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.5" />)}
                    {radar.map((r, i) => {
                        const [lx, ly] = pt(i, 1.32);
                        return (
                            <g key={r.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.2" fontFamily="Anuphan, Sarabun, sans-serif" fontWeight="700">{r.label}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">{r.value}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        }
