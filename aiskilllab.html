                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setIsSpeaking(false);
                setActiveSpeakerBadge('');
            }, []);

            const stopMicCompletely = useCallback(() => {
                if (recRef.current) { try { recRef.current.abort(); } catch (_) {} recRef.current = null; }
                setIsListening(false);
                setIsPttHolding(false);
            }, []);

            useEffect(() => () => {
                stopAiVoice();
                stopMicCompletely();
            }, [stopAiVoice, stopMicCompletely]);

            const callAppsScript = useCallback(async (payload, timeoutMs = 18000) => {
                if (!appsScriptUrl) return { status: 'offline' };
                const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
                const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (_) {} }, timeoutMs) : null;
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                        signal: ctrl ? ctrl.signal : undefined
                    });
                    const txt = await res.text();
                    try { return JSON.parse(txt); }
                    catch (_) { return { status: 'error', raw: txt }; }
                } catch (err) {
                    return { status: 'error', message: err?.name === 'AbortError' ? 'timeout' : err?.message };
                } finally {
                    if (timer) clearTimeout(timer);
                }
            }, [appsScriptUrl]);

            // เสียง AI ญาติผู้เสียชีวิต (แยกเสียงตัวละคร + เล่น 2 เสียงสลับกันจริงในเคส 3 + ตัด WAV Metadata)
            const speakText = useCallback(async (text, modeObj, emoKey = 'SAD', personaObj = activePersona) => {
                stopAiVoice();
                const sessionId = speechSessionRef.current;
                const emoMeta = EMOTION_PHYSICS[emoKey] || EMOTION_PHYSICS.SAD;
                const segments = splitIntoVoiceSegments(text, personaObj, modeObj.language, emoMeta);
                if (segments.length === 0) return;

                setIsSpeaking(true);

                const playSingleUrl = (url) => new Promise((resolve) => {
                    if (speechSessionRef.current !== sessionId || !url) return resolve(false);
                    if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} }
                    audioUrlRef.current = url;
                    const audio = new Audio(url);
                    audioRef.current = audio;
                    audio.onended = () => resolve(true);
                    audio.onerror = () => resolve(false);
                    audio.play().catch(() => resolve(false));
                });

                const playSingleBrowser = (seg) => new Promise((resolve) => {
                    if (speechSessionRef.current !== sessionId || !('speechSynthesis' in window)) return resolve();
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(seg.text);
                        utter.lang = modeObj.language === 'en' ? 'en-US' : 'th-TH';
                        utter.rate = 0.95;
                        utter.pitch = seg.pitchShift || 1.02;
                        const best = pickBestBrowserVoice(modeObj.language);
                        if (best) utter.voice = best;
                        utter.onend = () => resolve();
                        utter.onerror = () => resolve();
                        window.speechSynthesis.speak(utter);
                    } catch (_) {
                        resolve();
                    }
                });

                for (let i = 0; i < segments.length; i++) {
                    if (speechSessionRef.current !== sessionId) return;
                    const seg = segments[i];
                    setActiveSpeakerBadge(`${seg.speakerLabel} (${seg.voiceName})`);

                    let playedCloud = false;
                    if (appsScriptUrl) {
                        const res = await callAppsScript({
                            action: 'callGeminiTTS',
                            text: seg.text,
                            voiceName: seg.voiceName || 'Sulafat',
                            languageCode: modeObj.language === 'en' ? 'en-US' : 'th-TH',
                            style: seg.styleHint
                        }, 18000);
                        if (speechSessionRef.current !== sessionId) return;
                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const url = pcm16ToWavUrl(res.inlineData.data, rate);
                            if (url) playedCloud = await playSingleUrl(url);
                        }
                    }

                    if (!playedCloud && speechSessionRef.current === sessionId) {
                        await playSingleBrowser(seg);
                    }
                }

                if (speechSessionRef.current === sessionId) {
                    setIsSpeaking(false);
                    setActiveSpeakerBadge('');
                }
            }, [activePersona, appsScriptUrl, callAppsScript, stopAiVoice]);

            // ขั้นที่ 1: เปิดแฟ้มเคสหน้าห้องให้คำปรึกษา
            const handleOpenCaseBriefing = () => {
                stopAiVoice();
                stopMicCompletely();
                setPhase('briefing');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // ขั้นที่ 2: เคาะประตูและเดินเข้าห้องให้คำปรึกษา 3 มิติ
            const handleKnockAndEnterRoom = () => {
                playGentleKnockSound();
                stopAiVoice();
                stopMicCompletely();
                const defaultAddr = extractDefaultAddressName(learner, isEn);
                const rawOpening = isEn ? activePersona.openingEN : activePersona.openingTH;
                const openingText = isEn
                    ? rawOpening.replace(/^Hello\.\.\./, `Hello ${defaultAddr}...`)
                    : rawOpening
                        .replace(/^สวัสดีค่ะ\.\.\./, `สวัสดีค่ะ${defaultAddr}...`)
                        .replace(/คุณเจ้าหน้าที่/g, defaultAddr);
                const openingAction = isEn ? activePersona.openingActionEN : activePersona.openingActionTH;
                const openingEmo = activePersona.openingEmotion || 'CONFUSED';
                const initCoach = trainingTrack === 'micro_drill'
                    ? GUIDED_DRILLS[isEn ? 'en' : 'th'][0].prompt
                    : (isEn
                        ? `Case: ${activePersona.titleEN} (${activeDifficulty.badge}) — Start gently by introducing yourself and validating emotion.`
                        : `เคส: ${activePersona.titleTH} (${activeDifficulty.badge}) — เริ่มต้นด้วยการแนะนำตัวและรับฟังความรู้สึกของญาติก่อนให้ข้อมูลค่ะ`);

                const initSuggestions = trainingTrack === 'micro_drill'
                    ? GUIDED_DRILLS[isEn ? 'en' : 'th'][0].suggestions
                    : (activeDifficulty.showSuggestions ? GUIDED_DRILLS[isEn ? 'en' : 'th'][0].suggestions : []);

                setCustomAddressName('');
                setFinalDecision(null);
                setRelativeEmotion(openingEmo);
                setMessages([{
                    id: `open-${Date.now()}`, sender: 'ai', emotion: openingEmo,
                    actionCue: openingAction,
                    speakerName: selectedMode.relativeName, text: openingText
                }]);
                setTimeline([]);
                setAiCoachTip(initCoach);
                setSmartSuggestions(initSuggestions);
                setShowSuggestionsPanel(true);
                setDrillIndex(0);
                setSessionReadyToEnd(false);
                setTriggerWarning(null);
                setPaceFeedback(null);
                setEvalResult(null);
                setDecompressionSec(0);
                setDecompressionDone(false);
                setChatInput('');
                setPhase('negotiating');

                setTimeout(() => {
                    speakText(openingText, selectedMode, openingEmo, activePersona);
                }, 420);
            };

            // ส่งคำพูดของผู้เรียน (รองรับกดแนวทางคำพูดส่งทันที, PTT และพิมพ์เอง)
            const handleSendLearnerMessage = async (e, overrideText = null) => {
                if (e) e.preventDefault();
                const learnerText = String(overrideText ?? chatInput).trim();
                if (!learnerText || isAiTyping) return;

                stopAiVoice();
                stopMicCompletely();

                // ตรวจจับว่าผู้เรียนแนะนำตัวด้วยชื่อหรือสรรพนามอื่นหรือไม่
                const introducedName = detectCustomSelfIntro(learnerText, isEn);
                const effectiveAddressName = introducedName || learnerAddressName;
                if (introducedName && introducedName !== customAddressName) {
                    setCustomAddressName(introducedName);
                }

                const heldSilenceThisTurn = silenceElapsed >= 2.5;
                const prevTrust = EMOTION_PHYSICS[relativeEmotion]?.trust || 45;
                const preTurnSnapshot = [...messages];

                const hits = detectTriggerPhrases(learnerText, isEn ? 'en' : 'th');
                setTriggerWarning(hits.length > 0 ? hits[0] : null);

                const nextMessages = [
                    ...messages,
                    { id: `u-${Date.now()}`, sender: 'user', text: learnerText, silenceHeld: heldSilenceThisTurn }
                ];
                setMessages(nextMessages);
                setChatInput('');

                // โหมดฝึกทีละขั้น Micro-Drill 4 ด่าน (ให้ข้อมูลครบจนญาติตัดสินใจ)
                if (trainingTrack === 'micro_drill') {
                    const drills = GUIDED_DRILLS[isEn ? 'en' : 'th'];
                    const nextIdx = drillIndex + 1;
                    if (nextIdx < drills.length) {
                        const stageRepliesTH = [
                            { emo: 'SAD', act: 'สูดลมหายใจช้าๆ สีหน้าอ่อนลงเล็กน้อยแต่ยังมีแววสับสน', text: `ขอบคุณ${effectiveAddressName}ที่รับฟังอย่างอ่อนโยนนะคะ... แต่หนูยังไม่แน่ใจเรื่องภาวะสมองตายและขั้นตอนหลังจากนี้เลยค่ะ` },
                            { emo: 'HESITANT', act: 'พยักหน้ารับช้าๆ ครุ่นคิดด้วยความหนักใจก่อนเงยหน้าถาม', text: `เข้าใจชัดเจนขึ้นมากเลยค่ะ${effectiveAddressName}... แต่อยากขอถามตรงๆ นะคะ เรื่องการบริจาคอวัยวะมีขั้นตอนโปร่งใสยังไง และครอบครัวเราสามารถกลับไปปรึกษาตัดสินใจที่บ้านก่อนได้ไหมคะ?` },
                            { emo: 'CALM', act: 'คลายความตึงเครียดที่ไหล่ลง ซับน้ำตาเบาๆ และมองด้วยความไว้วางใจ', text: `ขอบคุณ${effectiveAddressName}มากจริงๆ นะคะที่อธิบายครบถ้วนและไม่เร่งรัดครอบครัวเราเลย ตอนนี้พวกเราสบายใจแล้วค่ะ ขอให้ครอบครัวได้สรุปความตั้งใจสุดท้ายให้${effectiveAddressName}ทราบนะคะ` }
                        ];
                        const stageRepliesEN = [
                            { emo: 'SAD', act: 'Takes a slow breath and looks up cautiously.', text: `Thank you for listening so gently, ${effectiveAddressName}... Could you help clarify brain death and what this really means?` },
                            { emo: 'HESITANT', act: 'Nods slowly, weighing the options carefully.', text: `That is much clearer, ${effectiveAddressName}... How does organ donation work transparently, and could our family go home to decide first?` },
                            { emo: 'CALM', act: 'Relaxes her posture with quiet relief.', text: `Thank you for answering every question with zero pressure, ${effectiveAddressName}. Our family feels calm and ready to share our decision.` }
                        ];
                        const pick = (isEn ? stageRepliesEN : stageRepliesTH)[Math.min(nextIdx - 1, 2)];
                        setDrillIndex(nextIdx);
                        setRelativeEmotion(pick.emo);
                        setAiCoachTip(drills[nextIdx].prompt);
                        setSmartSuggestions(drills[nextIdx].suggestions);
                        setMessages([...nextMessages, { id: `ai-d-${Date.now()}`, sender: 'ai', emotion: pick.emo, actionCue: pick.act, speakerName: selectedMode.relativeName, text: pick.text }]);
                        setTimeline(prev => [...prev, {
                            id: `tl-${Date.now()}`, userText: learnerText, aiText: pick.text, emotion: pick.emo,
                            trust: EMOTION_PHYSICS[pick.emo]?.trust || 64, tension: EMOTION_PHYSICS[pick.emo]?.tension || 48,
                            deltaTrust: (EMOTION_PHYSICS[pick.emo]?.trust || 64) - prevTrust, silenceHeld: heldSilenceThisTurn,
                            snapshotBeforeTurn: preTurnSnapshot, drillIndexBeforeTurn: drillIndex, emotionBeforeTurn: relativeEmotion
                        }]);
                        speakText(pick.text, selectedMode, pick.emo, activePersona);
                    } else {
                        const allText = nextMessages.filter(m => m.sender === 'user').map(m => m.text || '').join(' ');
                        const drillDecision = /กลับไป|ที่บ้าน|go home/i.test(allText) ? 'DEFER_HOME' : 'CONSENT';
                        const closingAction = isEn ? 'Wipes a tear softly and nods with quiet relief.' : 'ซับน้ำตาเบาๆ คลายความเกร็งที่ไหล่และพยักหน้าด้วยความซาบซึ้งใจ';
                        const closingLine = drillDecision === 'DEFER_HOME'
                            ? (isEn
                                ? `Thank you so much, ${effectiveAddressName}. Knowing we have zero pressure means everything—we will go home to decide together as a family and call you right back.`
                                : `ขอบคุณ${effectiveAddressName}มากจริงๆ นะคะที่ไม่เร่งรัดและดูแลจิตใจครอบครัวเราอย่างอ่อนโยน พวกเราขอกลับไปปรึกษาและตัดสินใจที่บ้านก่อน แล้วจะรีบติดต่อกลับมาแจ้งนะคะ`)
                            : (isEn
                                ? `Thank you so much, ${effectiveAddressName}. We feel completely at peace now and have decided to consent to organ donation so our loved one's kindness continues.`
                                : `ขอบคุณ${effectiveAddressName}มากจริงๆ นะคะที่รับฟังและดูแลจิตใจครอบครัวเราอย่างอ่อนโยน ตอนนี้ครอบครัวเรามั่นใจและตัดสินใจยินยอมบริจาคอวัยวะเพื่อส่งต่อชีวิตใหม่แล้วค่ะ`);
                        setFinalDecision(drillDecision);
                        setRelativeEmotion('CALM');
                        setSessionReadyToEnd(true);
                        setSmartSuggestions([]);
                        setAiCoachTip(isEn
                            ? 'All 4 stages complete! Tap "Evaluate & Claim Card" below.'
                            : 'ฝึกครบทั้ง 4 ด่านและได้รับผลการตัดสินใจจากญาติแล้วค่ะ กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ด้านล่างได้เลยค่ะ');
                        setMessages([...nextMessages, { id: `ai-final-${Date.now()}`, sender: 'ai', emotion: 'CALM', actionCue: closingAction, speakerName: selectedMode.relativeName, text: closingLine }]);
                        setTimeline(prev => [...prev, {
                            id: `tl-${Date.now()}`, userText: learnerText, aiText: closingLine, emotion: 'CALM',
                            trust: 92, tension: 16, deltaTrust: 92 - prevTrust, silenceHeld: heldSilenceThisTurn,
                            snapshotBeforeTurn: preTurnSnapshot, drillIndexBeforeTurn: drillIndex, emotionBeforeTurn: relativeEmotion
                        }]);
                        speakText(closingLine, selectedMode, 'CALM', activePersona);
                    }
                    return;
                }

                // โหมด Roleplay อิสระ (Character Bible Lock + เรียกชื่อผู้เรียน + 5–7 รอบจนญาติประกาศการตัดสินใจ 1 ใน 3 รูปแบบ)
                setIsAiTyping(true);
                const turnCount = nextMessages.filter(m => m.sender === 'user').length;
                const minTurnsBeforeDecision = 5;
                const targetTurns = activeDifficulty.id === 'hard' ? 7 : 6;

                const historyText = nextMessages
                    .slice(-12)
                    .map(m => `${m.sender === 'user' ? `Clinical Communicator (${effectiveAddressName})` : 'Bereaved Relative'}: ${m.text}`)
                    .join('\n');

                const combinedLearnerText = nextMessages.filter(m => m.sender === 'user').map(m => m.text || '').join(' ');
                const currentPrinciples = GUIDED_PRINCIPLES[isEn ? 'en' : 'th'];
                const coveredList = currentPrinciples.filter(p => p.pattern.test(combinedLearnerText)).map(p => p.label);
                const shouldWrapUpNow = turnCount >= targetTurns;

                const personaRule = isEn ? activePersona.promptHintEN : activePersona.promptHintTH;
                const diffRule = isEn ? activeDifficulty.aiPromptRuleEN : activeDifficulty.aiPromptRuleTH;

                const pacingDirective = shouldWrapUpNow
                    ? (isEn
                        ? `\n### FINAL DECISION STAGE (Turn ${turnCount}/${targetTurns}): You now have full information. Clearly announce ONE realistic decision: [DECISION:CONSENT] (if empathetic & clear), [DECISION:DECLINE] (if rushed/harsh/unresolved), or [DECISION:DEFER_HOME] (if you asked about going home to decide first and the learner respected that). Address the learner as "${effectiveAddressName}", close warmly with NO new open-ended questions, and output [READY_TO_EVALUATE].`
                        : `\n### ขั้นประกาศผลการตัดสินใจของญาติ (รอบที่ ${turnCount}/${targetTurns}): ตอนนี้คุณได้รับข้อมูลครบถ้วนแล้ว ให้ญาติประกาศการตัดสินใจที่ชัดเจน 1 ใน 3 รูปแบบ: [DECISION:CONSENT] ยินยอมบริจาคอวัยวะ (หากผู้เรียนสื่อสารดี ครบถ้วน อ่อนโยน), [DECISION:DECLINE] ไม่ยินยอมบริจาค (หากผู้เรียนเร่งรัด ใช้คำกระทบใจ หรือยังคลายกังวลไม่ได้), หรือ [DECISION:DEFER_HOME] ขอกลับไปตัดสินใจที่บ้านก่อน (หากได้ถามผู้เรียนแล้วเรื่องกลับไปตัดสินใจที่บ้านและผู้เรียนให้เวลาอย่างสุภาพ) เรียกผู้เรียนว่า "${effectiveAddressName}" และใส่แท็ก [DECISION:...] คู่กับ [READY_TO_EVALUATE]`)
                    : turnCount === minTurnsBeforeDecision - 1
                        ? (isEn
                            ? `\n### DECISION PREPARATION (Turn ${turnCount}/${targetTurns}): Do NOT end the conversation yet! If the learner has given good information, ask one final thoughtful question—specifically asking whether your family can go home to talk and decide first (if not asked yet), or asking about dignified goodbye time. Address the learner as "${effectiveAddressName}".`
                            : `\n### ช่วงก่อนตัดสินใจ (รอบที่ ${turnCount}/${targetTurns}): ห้ามจบบทสนทนาในรอบนี้เด็ดขาด! หากผู้เรียนอธิบายเรื่องภาวะสมองตายและการบริจาคอวัยวะแล้ว ให้ถามคำถามสำคัญก่อนตัดสินใจ เช่น "ครอบครัวเราสามารถกลับไปปรึกษาและตัดสินใจที่บ้านก่อนได้ไหมคะ?" หรือถามเรื่องเวลาอำลาท่านอย่างเป็นส่วนตัว โดยเรียกผู้เรียนว่า "${effectiveAddressName}"`)
                        : (isEn
                            ? `\n### ONGOING DIALOGUE (Turn ${turnCount}/${targetTurns}): Do NOT output [READY_TO_EVALUATE] before Turn ${minTurnsBeforeDecision}! Learner addressed: [${coveredList.join(', ') || 'None'}]. Advance naturally from emotional reaction -> brain death clarity -> organ donation details (ODC transparency, zero cost, body dignity). Always address learner as "${effectiveAddressName}".`
                            : `\n### ความคืบหน้าการสนทนา (รอบที่ ${turnCount}/${targetTurns}): ห้ามใส่ [READY_TO_EVALUATE] และห้ามจบบทสนทนาก่อนรอบที่ ${minTurnsBeforeDecision} เด็ดขาด! ประเด็นที่ผู้เรียนอธิบายไปแล้ว: [${coveredList.join(', ') || 'ยังไม่มี'}] ให้เดินเรื่องต่อจากอารมณ์ความกังวล -> ความเข้าใจภาวะสมองตาย -> ซักถามรายละเอียดการบริจาคอวัยวะ (ODC/ไม่มีค่าใช้จ่าย/การตกแต่งร่าง) และเรียกผู้เรียนว่า "${effectiveAddressName}" เสมอ`);

                const sugRule = (!shouldWrapUpNow && activeDifficulty.showSuggestions)
                    ? (isEn
                        ? `\n\n[SMART SUGGESTIONS]\nAdd 2 empathetic next-turn suggestions:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`
                        : `\n\n[SMART SUGGESTIONS]\nต่อท้ายด้วยแนวทางคำพูดที่เหมาะสมสำหรับผู้เรียน 2 ข้อ:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`)
                    : '\n\n(Do NOT output [SUGGESTION] lines.)';

                const fullPrompt = `${selectedMode.systemPrompt}

### [LEARNER_ADDRESS] (ชื่อที่ใช้เรียกผู้เรียนในรอบนี้)
- เรียกผู้เรียนว่า: "${effectiveAddressName}" (ห้ามเรียกว่า "คุณเจ้าหน้าที่" เด็ดขาด เว้นแต่ผู้เรียนแนะนำตัวเองแบบอื่น)

### CHARACTER BIBLE (ล็อกตัวละครตายตัว — ห้ามสลับตัวละครเด็ดขาด!)
- เคสปัจจุบัน: ${activePersona.titleTH}
- ผู้ป่วย/ผู้เสียชีวิต: ${activePersona.patientRoleTH}
- ผู้พูด (บทบาทของ AI): ${activePersona.speakerRoleTH}
- กฎเฉพาะเคส: ${personaRule}

### ระดับความยาก (${activeDifficulty.badge})
${diffRule}
${pacingDirective}

[Clinical Knowledge]
${(window.CLINICAL_KNOWLEDGE_BASE || '').slice(0, 1600)}${sugRule}

Conversation History:
${historyText}
Bereaved Relative (Start with [EMOTION]):`;

                let rawReply = '';
                if (appsScriptUrl) {
                    const res = await callAppsScript({ action: 'callGemini', prompt: learnerText, systemInstruction: fullPrompt }, 20000);
                    if (res?.status === 'success' && res.text) rawReply = res.text;
                }
                if (!rawReply) {
                    await new Promise(r => setTimeout(r, 420));
                    rawReply = generateOfflineRelativeReply(learnerText, selectedMode, turnCount, activePersona, activeDifficulty, effectiveAddressName, preTurnSnapshot);
                }

                const parsed = parseAiResponse(rawReply);
                const aiExplicitlyDecided = Boolean(parsed.decision && turnCount >= minTurnsBeforeDecision);
                const reachedEnd = Boolean(
                    aiExplicitlyDecided ||
                    (parsed.readyToEvaluate && turnCount >= minTurnsBeforeDecision) ||
                    shouldWrapUpNow ||
                    turnCount >= 8
                );

                let resolvedDecision = parsed.decision;
                if (reachedEnd && !resolvedDecision) {
                    const rt = parsed.text || '';
                    if (/ไม่ยินยอม|ไม่บริจาค|decline/i.test(rt)) resolvedDecision = 'DECLINE';
                    else if (/กลับไป.*บ้าน|ตัดสินใจที่บ้าน|go home|defer/i.test(rt)) resolvedDecision = 'DEFER_HOME';
                    else resolvedDecision = 'CONSENT';
                }
                if (resolvedDecision) setFinalDecision(resolvedDecision);

                const finalEmotion = reachedEnd && resolvedDecision !== 'DECLINE' ? 'CALM' : parsed.emotion;
                const nextMeta = EMOTION_PHYSICS[finalEmotion] || EMOTION_PHYSICS.SAD;

                setRelativeEmotion(finalEmotion);
                if (reachedEnd) {
                    setSessionReadyToEnd(true);
                    const decInfo = DECISION_META[resolvedDecision || 'CONSENT'];
                    setAiCoachTip(isEn
                        ? `${decInfo.badgeEN} — Tap "Evaluate & Claim Card" below.`
                        : `${decInfo.badgeTH} — กดปุ่ม “ประเมินผลและรับการ์ดสมรรถนะ” ด้านล่างได้เลยค่ะ`);
                } else if (parsed.coachTip) {
                    setAiCoachTip(parsed.coachTip);
                }

                setMessages(prev => [...prev, {
                    id: `ai-${Date.now()}`, sender: 'ai', emotion: finalEmotion,
                    actionCue: parsed.actionCue || '',
                    decision: resolvedDecision || null,
                    speakerName: selectedMode.relativeName, text: parsed.text
                }]);
                setTimeline(prev => [...prev, {
                    id: `tl-${Date.now()}`, userText: learnerText, aiText: parsed.text, emotion: finalEmotion,
                    trust: nextMeta.trust, tension: nextMeta.tension, deltaTrust: nextMeta.trust - prevTrust,
                    silenceHeld: heldSilenceThisTurn, snapshotBeforeTurn: preTurnSnapshot,
                    drillIndexBeforeTurn: drillIndex, emotionBeforeTurn: relativeEmotion
                }]);
                setSmartSuggestions((!reachedEnd && activeDifficulty.showSuggestions) ? (parsed.suggestions.length > 0 ? parsed.suggestions : GUIDED_DRILLS[isEn ? 'en' : 'th'][Math.min(turnCount, 3)].suggestions) : []);
                setIsAiTyping(false);

                speakText(parsed.text, selectedMode, finalEmotion, activePersona);
            };
            sendLearnerMsgRef.current = handleSendLearnerMessage;

            // ย้อนเวลาแก้ไขคำพูดในรอบก่อนหน้า (Time-Rewind)
            const handleRewindToTurn = (turnIdx) => {
                const target = timeline[turnIdx];
                if (!target) return;
                stopAiVoice();
                stopMicCompletely();
                setMessages(target.snapshotBeforeTurn || []);
                setTimeline(prev => prev.slice(0, turnIdx));
                setRelativeEmotion(target.emotionBeforeTurn || 'CONFUSED');
                setDrillIndex(target.drillIndexBeforeTurn || 0);
                setSessionReadyToEnd(false);
                setFinalDecision(null);
                setChatInput(target.userText || '');
                setShowHistoryDrawer(false);
                showToast(isEn ? `Rewound to turn ${turnIdx + 1} — edit and resend.` : `ย้อนเวลากลับไปยังรอบที่ ${turnIdx + 1} แล้ว ปรับคำพูดแล้วส่งใหม่ได้เลยค่ะ`, 'info');
            };

            // ตรวจจังหวะความเร็วการพูด (Vocal Pace Monitor)
            const analyzeVocalPace = useCallback((spokenText, durationSec) => {
                const txt = String(spokenText || '').trim();
                if (!txt || durationSec < 1.2) return;
                if (isEn) {
                    const wps = txt.split(/\s+/).length / durationSec;
                    if (wps > 3.1) setPaceFeedback({ status: 'fast', text: 'Speaking pace was slightly fast — try slowing down gently.' });
                    else setPaceFeedback({ status: 'good', text: 'Calm, empathetic speaking pace ✓' });
                } else {
                    const cps = txt.replace(/\s+/g, '').length / durationSec;
                    if (cps > 15.5) setPaceFeedback({ status: 'fast', text: 'จังหวะการพูดค่อนข้างเร็ว ลองผ่อนความเร็วลงอีกนิดเพื่อช่วยญาติซึมซับข้อมูลนะคะ' });
                    else setPaceFeedback({ status: 'good', text: 'จังหวะการพูดนุ่มนวลและกำลังพอดี ✓' });
                }
            }, [isEn]);

            const startSpeechRecognition = useCallback((isHoldMode) => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast(isEn ? 'Speech recognition not supported on this browser.' : 'เบราว์เซอร์นี้ไม่รองรับการรับเสียง กรุณาพิมพ์ข้อความแทนค่ะ', 'error');
                    return;
                }
                stopAiVoice();
                stopMicCompletely();
                try {
                    const rec = new SR();
                    rec.lang = isEn ? 'en-US' : 'th-TH';
                    rec.continuous = Boolean(isHoldMode);
                    rec.interimResults = true;
                    pttStartRef.current = Date.now();
                    pttTranscriptRef.current = '';

                    rec.onresult = (ev) => {
                        let out = '';
                        for (let i = 0; i < ev.results.length; i++) out += ev.results[i][0].transcript;
                        pttTranscriptRef.current = out.trim();
                        setChatInput(out);
                    };
                    rec.onerror = () => {
                        setIsListening(false);
                        setIsPttHolding(false);
                    };
                    rec.onend = () => {
                        setIsListening(false);
                        setIsPttHolding(false);
                        const dur = (Date.now() - pttStartRef.current) / 1000;
                        const finalSpoken = pttTranscriptRef.current.trim();
                        if (finalSpoken) {
                            analyzeVocalPace(finalSpoken, dur);
                            if (isHoldMode && pttAutoSendRef.current && finalSpoken.length >= 4 && typeof sendLearnerMsgRef.current === 'function') {
                                sendLearnerMsgRef.current(null, finalSpoken);
                            }
                        }
                    };
                    recRef.current = rec;
                    rec.start();
                    setIsListening(true);
                    if (isHoldMode) setIsPttHolding(true);
                } catch (_) {
                    setIsListening(false);
                    setIsPttHolding(false);
                }
            }, [analyzeVocalPace, isEn, showToast, stopAiVoice, stopMicCompletely]);

            const handleToggleMic = () => {
                if (isListening) {
                    try { recRef.current?.stop(); } catch (_) { stopMicCompletely(); }
                    return;
                }
                startSpeechRecognition(false);
            };

            const handlePttDown = (e) => {
                if (isAiTyping || sessionReadyToEnd) return;
                if (e && e.preventDefault) e.preventDefault();
                startSpeechRecognition(true);
            };

            const handlePttUp = () => {
                if (!isPttHolding) return;
                setIsPttHolding(false);
                try { recRef.current?.stop(); } catch (_) { stopMicCompletely(); }
            };

            // AI Clinical Supervisor ประเมินผล 5 แกนจากบทสนทนาจริง (ป้องกันหน้าค้าง 100% ด้วย Timeout + Background Cloud Save)
            const finishWithEvalResult = useCallback((resultObj) => {
                setEvalResult(resultObj);
                setIsEvaluating(false);
                setPhase('debrief');
                window.scrollTo({ top: 0, behavior: 'smooth' });

                if (isAdminPreview || !learner?.id) return;

                const radarObj = {};
                (resultObj.radar || []).forEach(r => { radarObj[r.key] = r.value; });
                const prevHist = Array.isArray(learner.skillLabHistory) ? learner.skillLabHistory : [];
                const nextEntry = {
                    at: new Date().toISOString(),
                    personaId: activePersona.id,
                    difficulty: activeDifficulty.id,
                    decision: resultObj.decision || null,
                    score: resultObj.score,
                    radar: resultObj.radar
                };
                const nextBest = Math.max(Number(learner.skillLabBestScore || 0), resultObj.score);
                const updatedLearner = {
                    ...learner,
                    skillLabPassed: true,
                    skillLabBestScore: nextBest,
                    skillLabLatestRadar: radarObj,
                    skillLabHistory: [...prevHist.slice(-9), nextEntry]
                };
                setLearner(updatedLearner);

                try {
                    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...raw, user: updatedLearner }));
                } catch (_) {}

                if (fbDb) {
                    (async () => {
                        try {
                            await setDoc(
                                doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(learner.id)),
                                {
                                    skillLabPassed: true,
                                    skillLabBestScore: nextBest,
                                    skillLabLatestRadar: radarObj,
                                    skillLabHistory: updatedLearner.skillLabHistory
                                },
                                { merge: true }
                            );
                            if (typeof CORE.buildAnonTelemetryId === 'function' && typeof CORE.buildExecutiveTelemetryPayload === 'function') {
                                const anonId = CORE.buildAnonTelemetryId(learner.id);
                                await setDoc(
                                    doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId),
                                    CORE.buildExecutiveTelemetryPayload(updatedLearner),
                                    { merge: true }
                                );
                            }
                            showToast('บันทึกผลฝึก AI Skill Lab และปลดล็อก Post-test เรียบร้อยแล้วค่ะ ✓');
                        } catch (err) {
                            console.warn('Save Skill Lab cloud warning:', err);
                        }
                    })();
                }
            }, [activeDifficulty.id, activePersona.id, isAdminPreview, learner, showToast]);

            const handleEvaluateSession = async () => {
                if (isEvaluating) return;
                stopAiVoice();
                stopMicCompletely();
                evalAbortRef.current = false;
                setIsEvaluating(true);

                const fallbackEval = evaluateConversation5Axis(messages, timeline, isEn ? 'en' : 'th', finalDecision);
                let finalResult = fallbackEval;

                try {
                    if (appsScriptUrl && messages.some(m => m.sender === 'user')) {
                        const transcript = messages
                            .map((m, idx) => `${idx + 1}. ${m.sender === 'user' ? `ผู้เรียน (${learnerAddressName})` : 'ญาติผู้ป่วย'}: ${m.text}${m.silenceHeld ? ' [เว้นความเงียบ ≥2.5 วิ]' : ''}`)
                            .join('\n');

                        const decisionLabel = finalDecision && DECISION_META[finalDecision]
                            ? DECISION_META[finalDecision].shortTH
                            : 'กำลังประเมินจากบทสนทนา';

                        const supervisorPrompt = isEn
                            ? `You are a senior Clinical Organ Donation Communication Supervisor evaluating ${learnerAddressName}'s conversation in "${activePersona.titleEN}" (${activeDifficulty.badge}).
Family outcome: ${decisionLabel}. Therapeutic silence (>=2.5s): ${fallbackEval.silenceCount}. Flagged harsh words: ${fallbackEval.triggersFound.map(t => t.flagged).join(', ') || 'None'}.
Return ONLY valid JSON with no markdown or extra text:
{
  "radar": { "setting": 40-100, "empathy": 40-100, "clarity": 40-100, "vocal": 40-100, "dignity": 40-100 },
  "supervisorSummary": "2-sentence supportive clinical supervisor feedback",
  "goldenMoment": { "quote": "exact best learner quote", "reason": "why it built trust" },
  "turningPoint": { "quote": "1 learner phrase that can be improved", "betterPhrase": "softer clinical alternative", "reason": "brief clinical rationale" },
  "strengths": ["strength 1", "strength 2"],
  "improvements": ["actionable tip 1", "actionable tip 2"]
}`
                            : `คุณคือ "อาจารย์พยาบาลและผู้เชี่ยวชาญการสื่อสารรับบริจาคอวัยวะ (AI Clinical Supervisor)"
กำลังประเมินบทสนทนาจริงของ${learnerAddressName} ในเคส "${activePersona.titleTH}" (ระดับ ${activeDifficulty.badge})
ผลการตัดสินใจของญาติ: ${decisionLabel} | เว้นความเงียบ ≥2.5 วิ: ${fallbackEval.silenceCount} ครั้ง | คำกระทบใจ: ${fallbackEval.triggersFound.map(t => t.flagged).join(', ') || 'ไม่มี'}
อ่านบทสนทนาจริงอย่างละเอียดแล้วตอบกลับเป็น JSON เท่านั้น:
{
  "radar": { "setting": 40-100, "empathy": 40-100, "clarity": 40-100, "vocal": 40-100, "dignity": 40-100 },
  "supervisorSummary": "สรุปภาพรวมจากอาจารย์ผู้ประเมิน 2 ประโยคอย่างอบอุ่นและตรงประเด็น",
  "goldenMoment": { "quote": "ยกประโยคจริงของผู้เรียนที่ทำได้ดีที่สุด 1 ประโยค", "reason": "เหตุผลว่าทำไมประโยคนี้ช่วยเยียวยาใจและสร้างความไว้วางใจ" },
  "turningPoint": { "quote": "ยกประโยคจริงของผู้เรียน 1 จุดที่ปรับให้ละมุนหรือชัดเจนขึ้นได้", "betterPhrase": "เสนอประโยคทางเลือกที่นุ่มนวลและตรงหลัก SPIKES/Decoupling มากขึ้น", "reason": "เหตุผลทางคลินิกสั้นๆ" },
  "strengths": ["จุดแข็งข้อที่ 1", "จุดแข็งข้อที่ 2"],
  "improvements": ["คำแนะนำพัฒนาต่อข้อที่ 1", "คำแนะนำพัฒนาต่อข้อที่ 2"]
}`;

                        const aiRes = await Promise.race([
                            callAppsScript({
                                action: 'callGemini',
                                prompt: `บทสนทนาจริง:\n${transcript}`,
                                systemInstruction: supervisorPrompt
                            }, 11500),
                            new Promise(resolve => setTimeout(() => resolve({ status: 'timeout' }), 12000))
                        ]);

                        if (!evalAbortRef.current && aiRes?.status === 'success' && aiRes.text) {
                            const parsedSup = parseAiSupervisorJson(aiRes.text, fallbackEval, isEn ? 'en' : 'th');
                            if (parsedSup) finalResult = { ...parsedSup, decision: finalDecision };
                        }
                    }
                } catch (err) {
                    console.warn('AI Supervisor evaluation fallback:', err);
                } finally {
                    if (!evalAbortRef.current) {
                        finishWithEvalResult(finalResult);
                    }
                }
            };

            const handleSkipEvalWait = () => {
                evalAbortRef.current = true;
                const instantEval = evaluateConversation5Axis(messages, timeline, isEn ? 'en' : 'th', finalDecision);
                finishWithEvalResult(instantEval);
            };

            const latestAiMessage = useMemo(() => {
                for (let i = messages.length - 1; i >= 0; i--) {
                    if (messages[i].sender === 'ai') return messages[i];
                }
                return null;
            }, [messages]);

            const coveredPrinciplesSet = useMemo(() => {
                const combined = messages.filter(m => m.sender === 'user').map(m => m.text || '').join(' ');
                const list = GUIDED_PRINCIPLES[isEn ? 'en' : 'th'];
                return new Set(list.filter(p => p.pattern.test(combined)).map(p => p.id));
            }, [messages, isEn]);

            const activeEmotionMeta = EMOTION_PHYSICS[phase === 'negotiating' ? relativeEmotion : 'CALM'] || EMOTION_PHYSICS.CONFUSED;
            const learnerTurnCount = useMemo(() => messages.filter(m => m.sender === 'user').length, [messages]);
            const targetTurnsDisplay = trainingTrack === 'micro_drill' ? 4 : (activeDifficulty.id === 'hard' ? 7 : 6);

            // ============================================================================
            // 6. RENDER PHASES (SETUP -> BRIEFING -> 3D NEGOTIATING -> 5-AXIS DEBRIEF)
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe overflow-x-hidden">
                    {phase !== 'negotiating' && <><div className="spatial-aura" /><div className="spatial-grid" /></>}

                    {/* FULLSCREEN 3D HOLOGRAM CANVAS (ACTIVE DURING NEGOTIATING) */}
                    {phase === 'negotiating' && (
                        <div className="fixed inset-0 z-0 bg-[#020612]">
                            <ThreeHologramStage emotionKey={relativeEmotion} isSpeaking={isSpeaking} />
                            <div className="absolute inset-0 pointer-events-none bg-gradient-to-b from-[#020612]/80 via-transparent to-[#020612]/95" />
                        </div>
                    )}

                    {/* ==================== PHASE 1: SETUP LOBBY ==================== */}
                    {phase === 'setup' && (
                        <div className="relative z-10 flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-5 sm:py-8 space-y-6">
                            <header className="flex flex-wrap items-center justify-between gap-3">
                                <div className="flex items-center gap-2.5">
                                    <a href="./index.html" className="spatial-soft w-10 h-10 rounded-xl flex items-center justify-center text-primary-adaptive" title="กลับห้องเรียน">
                                        <Icon name="ArrowLeft" size={18} />
                                    </a>
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">STEP 03 • RJCLOUD.ORGAN 2.0 • 3D SKILL LAB</span>
                                        <h1 className="font-display font-extrabold text-lg sm:text-2xl text-primary-adaptive leading-tight">
                                            AI Skill Lab 3 มิติ (จำลองญาติผู้เสียชีวิต)
                                        </h1>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2">
                                    <div className="inline-flex p-1 rounded-xl spatial-soft text-xs font-bold">
                                        <button type="button" onClick={() => setLangId('th')} className={`px-3 py-1.5 rounded-lg ${langId === 'th' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>ไทย</button>
                                        <button type="button" onClick={() => setLangId('en')} className={`px-3 py-1.5 rounded-lg ${langId === 'en' ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'text-secondary-adaptive'}`}>EN</button>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => setTheme(t => (t === 'dark' ? 'light' : 'dark'))}
                                        className="spatial-soft w-10 h-10 rounded-xl flex items-center justify-center text-primary-adaptive"
                                        title="สลับโหมดมืด/สว่าง"
                                    >
                                        <Icon name={theme === 'dark' ? 'Sun' : 'Moon'} size={16} className={theme === 'dark' ? 'text-amber-300' : 'text-indigo-600'} />
                                    </button>
                                </div>
                            </header>

                            {/* 1. เลือกสถานการณ์จำลอง 4 เคส (ล็อก Character Bible) */}
                            <section className="space-y-3">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                    <h2 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">
                                        1. {isEn ? 'Select Clinical Scenario (Locked Characters)' : 'เลือกสถานการณ์จำลอง (ล็อกตัวละครชัดเจนไม่สับสน)'}
                                    </h2>
                                    <button type="button" onClick={() => setShowVimeoModal(true)} className="text-xs font-bold text-prism-adaptive hover:underline inline-flex items-center gap-1">
                                        <Icon name="PlayCircle" size={15} /> {isEn ? 'Watch Reference Video' : 'ดูวิดีโอตัวอย่างประกอบเคส'}
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {SKILL_LAB_PERSONAS.map(p => {
                                        const active = personaId === p.id;
                                        return (
                                            <button
                                                key={p.id}
                                                type="button"
                                                onClick={() => setPersonaId(p.id)}
                                                className={`spatial-card text-left rounded-[1.5rem] p-4 sm:p-5 transition-all space-y-2.5 ${
                                                    active ? 'border-aurora-400 ring-2 ring-aurora-400/35' : 'opacity-90 hover:opacity-100'
                                                }`}
                                            >
                                                <div className="flex items-start justify-between gap-2">
                                                    <div className="flex items-center gap-2.5">
                                                        <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: `${p.accent}22`, color: p.accent }}>
                                                            <Icon name={p.icon} size={20} />
                                                        </div>
                                                        <div>
                                                            <span className="font-mono text-[10px] font-bold uppercase" style={{ color: p.accent }}>{isEn ? p.tagEN : p.tagTH}</span>
                                                            <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive leading-snug">{isEn ? p.titleEN : p.titleTH}</h3>
                                                        </div>
                                                    </div>
                                                    {active && <Icon name="CheckCircle2" size={19} className="text-accent-adaptive shrink-0" />}
                                                </div>
                                                <p className="text-xs text-secondary-adaptive leading-relaxed">{isEn ? p.descEN : p.descTH}</p>
                                                <div className="spatial-soft rounded-xl px-3 py-2 text-[11px] text-secondary-adaptive space-y-0.5">
                                                    <p><b className="text-primary-adaptive">ผู้ป่วย:</b> {p.patientRoleTH}</p>
                                                    <p><b className="text-prism-adaptive">คู่สนทนา (AI):</b> {p.speakerRoleTH}</p>
                                                    {p.voiceCast && (
                                                        <p className="text-accent-adaptive font-semibold">🎙️ {isEn ? p.voiceCast.labelEN : p.voiceCast.labelTH}</p>
                                                    )}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>

                            {/* 2 & 3. เลือกรูปแบบการฝึก & ระดับความท้าทาย */}
                            <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5 space-y-3">
                                    <h2 className="font-display font-bold text-sm text-primary-adaptive">2. {isEn ? 'Training Mode' : 'รูปแบบการฝึก'}</h2>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[
                                            { id: 'roleplay', title: isEn ? 'Full AI Roleplay' : 'โต้ตอบ AI อิสระ', sub: isEn ? '5–7 turns until decision' : '5–7 รอบ จนญาติตัดสินใจ' },
                                            { id: 'micro_drill', title: isEn ? '4-Stage Drill' : 'ฝึกทีละขั้น 4 ด่าน', sub: isEn ? 'Guided step-by-step' : 'มีไกด์คำพูดทีละจังหวะ' }
                                        ].map(m => (
                                            <button
                                                key={m.id}
                                                type="button"
                                                onClick={() => setTrainingTrack(m.id)}
                                                className={`p-3 rounded-2xl border text-left transition-all ${
                                                    trainingTrack === m.id ? 'bg-aurora-500/20 border-aurora-400 text-primary-adaptive' : 'spatial-soft text-secondary-adaptive'
                                                }`}
                                            >
                                                <span className="font-display font-bold text-xs block">{m.title}</span>
                                                <span className="text-[11px] text-muted-adaptive block mt-0.5">{m.sub}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5 space-y-3">

                                                        checked={pttAutoSend}
                                                        onChange={e => setPttAutoSend(e.target.checked)}
                                                        className="w-3.5 h-3.5 accent-emerald-400"
                                                    />
                                                    <span>{isEn ? 'Auto-send on release' : 'ส่งอัตโนมัติเมื่อปล่อยปุ่ม'}</span>
                                                </label>
                                            </div>

                                            <form onSubmit={handleSendLearnerMessage} className="flex items-center gap-2">
                                                <button
                                                    type="button"
                                                    onClick={handleToggleMic}
                                                    aria-label="แตะเปิด/ปิดไมโครโฟน"
                                                    title={isEn ? 'Tap to toggle mic' : 'แตะเพื่อเปิด/ปิดไมค์'}
                                                    className={`touch-target w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 transition-all ${
                                                        isListening && !isPttHolding ? 'bg-rose-500 text-white animate-pulse' : 'bg-white/10 hover:bg-white/20 text-cyan-200 border border-white/15'
                                                    }`}
                                                >
                                                    <Icon name={isListening ? 'MicOff' : 'Mic'} size={18} />
                                                </button>
                                                <input
                                                    type="text"
                                                    value={chatInput}
                                                    onChange={e => setChatInput(e.target.value)}
                                                    disabled={isAiTyping}
                                                    placeholder={isListening
                                                        ? (isEn ? 'Listening...' : 'กำลังฟังเสียงพูดของคุณ...')
                                                        : (isEn ? 'Or type gently to the relative...' : 'หรือพิมพ์ข้อความสื่อสารกับญาติอย่างอ่อนโยน...')}
                                                    className="touch-target flex-1 px-4 py-2.5 rounded-2xl bg-slate-950/70 border border-white/20 text-white placeholder-sky-200/50 text-sm focus:outline-none focus:border-cyan-300"
                                                />
                                                <button
                                                    type="submit"
                                                    disabled={!chatInput.trim() || isAiTyping}
                                                    className="rjc2-pill-btn touch-target px-4 sm:px-5 rounded-2xl font-display font-bold text-xs sm:text-sm disabled:opacity-40 shrink-0"
                                                >
                                                    {isAiTyping ? '...' : (isEn ? 'Send' : 'ส่ง')}
                                                </button>
                                            </form>
                                        </div>
                                    </>
                                )}
                            </section>
                        </div>
                    )}

                    {/* ==================== LOADING OVERLAY: AI CLINICAL SUPERVISOR ANALYZING ==================== */}
                    {isEvaluating && (
                        <div className="fixed inset-0 z-[65] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="holo-obsidian-card max-w-sm w-full rounded-[2rem] p-6 text-center space-y-4 border-prism-400/45 text-white">
                                <div className="w-12 h-12 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mx-auto" />
                                <div className="space-y-1.5">
                                    <p className="font-display font-bold text-base text-white">
                                        {isEn ? 'AI Clinical Supervisor is reviewing your dialogue...' : 'อาจารย์ AI กำลังอ่านบทสนทนาจริงและวิเคราะห์เรดาร์ 5 แกน...'}
                                    </p>
                                    <p className="text-xs text-sky-200/80">
                                        {isEn ? 'Identifying your Golden Moment and Turning Point coaching tips' : 'กำลังคัดเลือกประโยคทองที่ทำได้ดีและข้อแนะนำเฉพาะบุคคล (ไม่เกิน 12 วินาที)'}
                                    </p>
                                </div>
                                <button
                                    type="button"
                                    onClick={handleSkipEvalWait}
                                    className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 text-xs font-bold text-cyan-200 transition-all"
                                >
                                    {isEn ? 'Show Instant Summary Now →' : 'แสดงผลสรุปทันที →'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ==================== PHASE 3: 5-AXIS EMPATHY RADAR DEBRIEF (AI CLINICAL SUPERVISOR) ==================== */}
                    {phase === 'debrief' && evalResult && (
                        <div className="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-5">
                            <div className="spatial-card rounded-[2rem] p-5 sm:p-8 space-y-6 border-aurora-400/40">
                                <div className="flex flex-wrap items-start justify-between gap-3">
                                    <div>
                                        <div className="flex flex-wrap items-center gap-2">
                                            <span className="px-3 py-1 rounded-full bg-aurora-500/20 text-accent-adaptive font-mono text-[11px] font-bold">
                                                {evalResult.source === 'gemini_supervisor'
                                                    ? 'AI CLINICAL SUPERVISOR • GEMINI REAL DIALOGUE REVIEW'
                                                    : 'AI SKILL LAB COMPLETE • 5-AXIS COMPETENCY CARD'}
                                            </span>
                                            {evalResult.decision && DECISION_META[evalResult.decision] && (
                                                <span className={`px-3 py-1 rounded-full border font-mono text-[11px] font-bold ${DECISION_META[evalResult.decision].cls}`}>
                                                    {isEn ? DECISION_META[evalResult.decision].badgeEN : DECISION_META[evalResult.decision].badgeTH}
                                                </span>
                                            )}
                                        </div>
                                        <h1 className="font-display text-xl sm:text-2xl font-extrabold text-primary-adaptive mt-2">
                                            ผลการประเมินทักษะการสื่อสารกับญาติผู้เสียชีวิต
                                        </h1>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive mt-0.5">
                                            {isEn ? activePersona.titleEN : activePersona.titleTH} • {activeDifficulty.badge}
                                        </p>
                                    </div>
                                    <div className="spatial-soft px-5 py-3 rounded-2xl text-center">
                                        <span className="font-mono text-[10px] font-bold text-muted-adaptive block">EMPATHY INDEX</span>
                                        <span className="font-mono text-3xl font-extrabold text-accent-adaptive">{evalResult.score}</span>
                                        <span className="font-mono text-xs text-muted-adaptive"> / 100</span>
                                    </div>
                                </div>

                                {evalResult.supervisorSummary && (
                                    <div className="spatial-soft rounded-2xl p-4 border-prism-400/35 text-xs sm:text-sm text-primary-adaptive leading-relaxed">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive block mb-1">SUPERVISOR OVERVIEW</span>
                                        {evalResult.supervisorSummary}
                                    </div>
                                )}

                                {/* ประโยคทองที่ทำได้ดี (Golden Moment) & จุดพลิกผันที่ควรเกลา (Turning Point Coach) */}
                                {(evalResult.goldenMoment || evalResult.turningPoint) && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {evalResult.goldenMoment && (
                                            <div className="p-4 rounded-2xl bg-aurora-500/10 border border-aurora-400/40 space-y-1.5">
                                                <p className="font-display font-bold text-xs sm:text-sm text-accent-adaptive flex items-center gap-1.5">
                                                    <Icon name="Award" size={16} /> ประโยคทองที่ทำได้ดี (Golden Moment)
                                                </p>
                                                <p className="text-xs sm:text-sm font-bold text-primary-adaptive italic leading-relaxed">
                                                    “{evalResult.goldenMoment.quote}”
                                                </p>
                                                <p className="text-xs text-secondary-adaptive leading-relaxed">{evalResult.goldenMoment.reason}</p>
                                            </div>
                                        )}
                                        {evalResult.turningPoint && (
                                            <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-400/40 space-y-1.5">
                                                <p className="font-display font-bold text-xs sm:text-sm text-amber-400 flex items-center gap-1.5">
                                                    <Icon name="Sparkles" size={16} /> จุดที่เกลาให้นุ่มนวลขึ้นได้ (Turning Point)
                                                </p>
                                                {evalResult.turningPoint.quote && (
                                                    <p className="text-xs text-muted-adaptive line-through">“{evalResult.turningPoint.quote}”</p>
                                                )}
                                                <p className="text-xs sm:text-sm font-bold text-primary-adaptive leading-relaxed">
                                                    คำแนะนำ: “{evalResult.turningPoint.betterPhrase}”
                                                </p>
                                                <p className="text-xs text-secondary-adaptive leading-relaxed">{evalResult.turningPoint.reason}</p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">
                                    <div className="md:col-span-5 spatial-soft rounded-3xl p-4">
                                        <FiveAxisRadarSVG radar={evalResult.radar} theme={theme} />
                                    </div>
                                    <div className="md:col-span-7 space-y-3">
                                        <div className="spatial-soft rounded-2xl p-4 space-y-1.5">
                                            <p className="font-display font-bold text-sm text-accent-adaptive flex items-center gap-1.5">
                                                <Icon name="CheckCircle2" size={16} /> จุดแข็งที่ทำได้ดีมาก
                                            </p>
                                            <ul className="text-xs sm:text-sm text-primary-adaptive space-y-1">
                                                {evalResult.strengths.map((s, i) => <li key={i}>• {s}</li>)}
                                            </ul>
                                        </div>

                                        <div className="spatial-soft rounded-2xl p-4 space-y-1.5">
                                            <p className="font-display font-bold text-sm text-prism-adaptive flex items-center gap-1.5">
                                                <Icon name="Sparkles" size={16} /> ข้อเสนอแนะเพื่อพัฒนาต่อ
                                            </p>
                                            <ul className="text-xs sm:text-sm text-secondary-adaptive space-y-1">
                                                {evalResult.improvements.map((s, i) => <li key={i}>• {s}</li>)}
                                            </ul>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <div className="spatial-soft p-3 rounded-2xl">
                                                <span className="text-muted-adaptive block">เว้นจังหวะเงียบ ≥ 2.5 วิ</span>
                                                <span className="font-mono font-extrabold text-accent-adaptive text-base">{evalResult.silenceCount} ครั้ง</span>
                                            </div>
                                            <div className="spatial-soft p-3 rounded-2xl">
                                                <span className="text-muted-adaptive block">คำกระทบใจที่ตรวจพบ</span>
                                                <span className={`font-mono font-extrabold text-base ${evalResult.triggersFound.length > 0 ? 'text-amber-400' : 'text-accent-adaptive'}`}>
                                                    {evalResult.triggersFound.length} คำ
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* โหมดพักใจ 15 วินาที (Emotional Decompression) */}
                                <div className="spatial-soft rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-prism-400/30">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-11 h-11 rounded-full bg-gradient-to-br from-aurora-400/30 to-prism-400/30 border border-prism-300/50 flex items-center justify-center shrink-0 ${decompressionSec > 0 ? 'breathe-orb' : ''}`}>
                                            <Icon name="Wind" size={20} className="text-prism-adaptive" />
                                        </div>
                                        <div>
                                            <p className="font-display font-bold text-sm text-primary-adaptive">
                                                {decompressionSec > 0
                                                    ? `กำลังหายใจเข้าลึกๆ ช้าๆ... (${decompressionSec} วินาที)`
                                                    : decompressionDone
                                                        ? 'พักใจเรียบร้อยแล้วค่ะ ขอบคุณที่ทุ่มเทดูแลจิตใจครอบครัวผู้ป่วยนะคะ ✓'
                                                        : 'โหมดพักใจ 15 วินาทีหลังเคสสูญเสีย (Emotional Decompression)'}
                                            </p>
                                            <p className="text-xs text-muted-adaptive">ผ่อนคลายความตึงเครียดทางอารมณ์ก่อนกลับไปทำแบบทดสอบ Post-test ค่ะ</p>
                                        </div>
                                    </div>
                                    {decompressionSec === 0 && !decompressionDone && (
                                        <button type="button" onClick={() => setDecompressionSec(15)} className="touch-target spatial-soft px-4 py-2 rounded-xl text-xs font-bold text-prism-adaptive shrink-0">
                                            เริ่มพักใจ 15 วิ
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                    <button
                                        type="button"
                                        onClick={() => setPhase('setup')}
                                        className="touch-target spatial-soft py-3.5 rounded-2xl text-primary-adaptive font-display font-bold text-sm"
                                    >
                                        ฝึกสถานการณ์อื่นเพิ่มเติม
                                    </button>
                                    <a
                                        href="./index.html"
                                        className="rjc2-pill-btn touch-target py-3.5 rounded-2xl font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <span>บันทึกผลแล้ว กลับห้องเรียนเพื่อสอบ Post-test →</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== MODAL: TIME-REWIND HISTORY DRAWER ==================== */}
                    {showHistoryDrawer && (
                        <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="spatial-card w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-5 space-y-4 max-h-[82dvh] flex flex-col">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">TIME-REWIND • CONVERSATION LOG</span>
                                        <h3 className="font-display font-bold text-base text-primary-adaptive">ย้อนเวลาแก้ไขคำพูดในรอบก่อนหน้า</h3>
                                    </div>
                                    <button type="button" onClick={() => setShowHistoryDrawer(false)} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                                    {timeline.length === 0 ? (
                                        <p className="text-center text-xs text-muted-adaptive py-8">ยังไม่มีประวัติรอบสนทนาค่ะ</p>
                                    ) : timeline.map((t, idx) => (
                                        <div key={t.id} className="spatial-soft p-3.5 rounded-2xl space-y-2 text-xs">
                                            <div className="flex items-center justify-between">
                                                <span className="font-mono font-bold text-accent-adaptive">รอบที่ {idx + 1} • Trust {t.trust}%</span>
                                                <button
                                                    type="button"
                                                    onClick={() => handleRewindToTurn(idx)}
                                                    className="px-2.5 py-1 rounded-lg bg-prism-500/20 text-prism-adaptive font-bold text-[11px]"
                                                >
                                                    ↺ ย้อนไปแก้รอบนี้
                                                </button>
                                            </div>
                                            <p className="text-primary-adaptive"><b>คุณ:</b> {t.userText}</p>
                                            <p className="text-secondary-adaptive"><b>ญาติ:</b> {t.aiText}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== MODAL: REFERENCE VIMEO VIDEO ==================== */}
                    {showVimeoModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="spatial-card w-full max-w-3xl rounded-[2rem] p-4 sm:p-5 space-y-3">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">วิดีโอตัวอย่างการสื่อสารกับญาติผู้เสียชีวิต</h3>
                                    <button type="button" onClick={() => setShowVimeoModal(false)} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>
                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-black">
                                    <iframe src={VIMEO_EMBED_URL} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen; picture-in-picture" allowFullScreen title="Skill Lab Reference Video" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Banner */}
                    {toast.visible && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[70] w-[92vw] max-w-md pointer-events-none">
                            <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-xl text-xs sm:text-sm font-bold text-white text-center ${
                                toast.type === 'error' ? 'bg-rose-700/95 border-rose-400/60' : toast.type === 'info' ? 'bg-sky-700/95 border-sky-400/60' : 'bg-emerald-700/95 border-emerald-400/60'
                            }`}>
                                {toast.text}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
