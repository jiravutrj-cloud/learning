        /**
         * แปลง PCM16 Base64 จาก Gemini Neural TTS เป็น WAV Blob URL
         */
        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryStr = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

        /**
         * แยก Tag อารมณ์และ Smart Suggestions ออกจากคำตอบของ AI Relative
         */
        function parseAiResponse(rawText) {
            const text = String(rawText || '').trim();
            const suggestions = [];
            const sugRegex = /\[SUGGESTION\s*\d+\]\s*([^\n]+)/gi;
            let match;
            while ((match = sugRegex.exec(text)) !== null) {
                if (match[1]?.trim()) suggestions.push(match[1].trim());
            }

            let cleaned = text.replace(/\[SUGGESTION\s*\d+\]\s*[^\n]+/gi, '').trim();
            let emotion = 'SAD';
            const emoMatch = cleaned.match(/^\[(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]\s*/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                cleaned = cleaned.replace(emoMatch[0], '').trim();
            }
            // ทำความสะอาด Tag ชื่อที่อาจหลงเหลือ
            cleaned = cleaned.replace(/^\[[^\]]{1,25}\]\s*/, '').trim();

            return {
                emotion: EMOTION_META[emotion] ? emotion : 'SAD',
                text: cleaned || '...',
                suggestions: suggestions.slice(0, 2)
            };
        }

[SUGGESTION 1] ได้แน่นอนค่ะ ไม่ต้องรีบตัดสินใจเลยนะคะ ทีมศัลยแพทย์จะดูแลผ่าตัดและตกแต่งร่างอย่างประณีตให้เกียรติสูงสุด ดิฉันขอให้เวลาครอบครัวปรึกษากันในห้องรับรองนี้ก่อนค่ะ
[SUGGESTION 2] เข้าใจความกังวลเลยค่ะ ไม่ว่าจะตัดสินใจอย่างไรทีมจะดูแลอย่างเต็มที่เสมอ ขอเชิญครอบครัวคุยกันตามสบาย หากมีคำถามเพิ่มเติมเรียกดิฉันได้ตลอดนะคะ`;
            }
            if (msg.match(/เครื่องช่วยหายใจ|สมองตาย|ก้านสมอง|ถาวร|หยุดทำงาน/)) {
                return `[SAD] แสดงว่าที่เห็นหน้าอกขยับและตัวอุ่นอยู่ เป็นเพราะเครื่องช่วยหายใจกับยาใช่ไหมคะ... หมายความว่าเขาจะไม่ฟื้นกลับมาคุยกับพวกเราอีกแล้วจริงๆ เหรอคะ...
[SUGGESTION 1] ดิฉันเสียใจด้วยจริงๆ ค่ะ ใช่ค่ะ เครื่องช่วยหายใจและยาช่วยพยุงชั่วคราว แต่ก้านสมองหยุดทำงานถาวรแล้ว ขอให้ครอบครัวค่อยๆ ทำใจในห้องรับรองนี้ได้เลยนะคะ ดิฉันอยู่ตรงนี้คอยรับฟังค่ะ
[SUGGESTION 2] เข้าใจความเจ็บปวดของครอบครัวมากค่ะ ตอนนี้ไม่ต้องรีบอะไรเลยนะคะ หากมีส่วนไหนที่ยังสงสัยเกี่ยวกับผลตรวจ ดิฉันยินดีค่อยๆ อธิบายให้ชัดเจนค่ะ`;

            if (turnCount <= 1) {
                return `[ANGRY] แต่เมื่อกี้เข้าไปจับมือ ตัวเขายังอุ่นอยู่เลยนะคะ หน้าจอก็ยังมีชีพจรเต้นอยู่ จะบอกว่าสมองตายได้ยังไงคะ หมอตรวจแน่ใจแล้วเหรอคะ?
[SUGGESTION 1] ดิฉันเข้าใจความรู้สึกเลยค่ะ การเห็นตัวอุ่นและชีพจรเต้นทำให้ทำใจเชื่อได้ยากมาก แต่ชีพจรและลมหายใจเกิดจากเครื่องช่วยหายใจกับยาที่พยุงไว้ชั่วคราว ส่วนสมองได้รับการตรวจยืนยันตามเกณฑ์แล้วว่าหยุดทำงานถาวรค่ะ

[SUGGESTION 2] ขอให้ครอบครัวพักหายใจก่อนได้เลยค่ะ ต้องการเวลาอยู่ด้วยกันเงียบๆ สักครู่ หรือให้ดิฉันเล่าขั้นตอนต่อไปให้ฟังก่อนดีคะ`;

        /**
         * ประเมินผล 2 มิติ (ความถูกต้องของข้อมูล + การรับรู้อารมณ์ร่วม) แบบครบถ้วน
         */
        function evaluateDualDimensions(chatLog, mode) {
            const isEn = mode.language === 'en';
            const userTexts = chatLog
                .filter(m => m.sender === 'user')
                .map(m => m.text || '')
                .join(' ')
                .toLowerCase();

            let infoScore = 58;
            let empathyScore = 58;
            const infoFeedback = [];
            const empathyFeedback = [];

            // มิติที่ 1: ความถูกต้องของข้อมูล (Clinical & Setting Accuracy)
            if (userTexts.match(/แนะนำ|พยาบาล|ผู้ประสาน|ห้องรับรอง|ห้องส่วนตัว|เงียบ|name|nurse|coordinator|private room|quiet room/)) {
                infoScore += 14;
                infoFeedback.push(isEn
                    ? 'Introduced clinical role clearly and honored the private consultation room setting.'
                    : 'แนะนำบทบาทผู้ให้ข้อมูลชัดเจนและสื่อสารสอดคล้องกับบริบทห้องรับรองที่เป็นส่วนตัว');
            } else {
                infoFeedback.push(isEn
                    ? 'Remember to clearly introduce your role and acknowledge the private consultation room.'
                    : 'ควรแนะนำชื่อ-บทบาทผู้ให้ข้อมูลอย่างชัดเจนและใช้ประโยชน์จากบรรยากาศห้องรับรอง');
            }

            if (userTexts.match(/สมองตาย|ก้านสมอง|เครื่องช่วยหายใจ|ยาพยุง|ถาวร|หยุดทำงาน|brain death|brainstem|ventilator|medication|permanent/)) {
                infoScore += 18;
                infoFeedback.push(isEn
                    ? 'Accurately explained ventilator/medication support vs. irreversible brain death.'
                    : 'อธิบายความแตกต่างระหว่างเครื่องช่วยหายใจ/ยาพยุงชีพกับภาวะสมองตายถาวรได้ถูกต้องตามหลักวิชาการ');
            } else {
                infoFeedback.push(isEn
                    ? 'Clarify that the ventilator maintains circulation temporarily while brain death is irreversible.'
                    : 'ควรให้ข้อมูลให้ชัดเจนขึ้นว่าเครื่องช่วยหายใจช่วยพยุงชั่วคราว แต่ก้านสมองหยุดทำงานถาวรแล้ว');
            }

            if (userTexts.match(/ประณีต|ให้เกียรติ|เย็บแผล|ตกแต่ง|ไม่รีบ|ปรึกษา|ตัดสินใจ|dignity|respect|neatly|peaceful|no rush|time|decide/)) {
                infoScore += 10;
                infoFeedback.push(isEn
                    ? 'Reassured respectful body care and supported non-coercive family decision-making.'
                    : 'ให้ข้อมูลเรื่องการดูแลเกียรติร่างผู้เสียชีวิตและการเปิดโอกาสให้ครอบครัวตัดสินใจโดยไม่กดดัน');
            } else {
                infoFeedback.push(isEn
                    ? 'Include reassurance of respectful surgical care and zero-pressure decision time.'
                    : 'ควรเสริมข้อมูลเรื่องการดูแลร่างอย่างประณีตและให้เวลาครอบครัวปรึกษากันโดยไม่เร่งรัด');
            }

            // มิติที่ 2: การรับรู้อารมณ์ร่วม (Emotional Resonance & Empathy)
            if (userTexts.match(/เสียใจ|เข้าใจ|ตกใจ|เจ็บปวด|สับสน|ทำใจยาก|ห่วง|sorry|understand|heartbreaking|overwhelming|painful|hard|confusing/)) {
                empathyScore += 22;
                empathyFeedback.push(isEn
                    ? 'Recognized and validated the relative’s shock, sorrow, and disbelief with warmth.'
                    : 'รับรู้และสะท้อนอารมณ์ช็อก โศกเศร้า และความสับสนของญาติผู้เสียชีวิตได้อย่างเข้าอกเข้าใจ');
            } else {
                empathyFeedback.push(isEn
                    ? 'Acknowledge and validate the relative’s emotional pain before explaining clinical details.'
                    : 'ควรรับรู้และสะท้อนอารมณ์เสียใจหรือความตื่นตระหนกของญาติก่อนอธิบายข้อมูลทางการแพทย์');
            }

            if (userTexts.match(/ค่อยๆ|รับฟัง|อยู่ตรงนี้|สบายใจ|ไม่กดดัน|ไม่เร่ง|gently|listen|here with you|calm|take your time|support/)) {
                empathyScore += 14;
                empathyFeedback.push(isEn
                    ? 'Maintained an unhurried, gentle pace that helped the relative feel emotionally safe.'
                    : 'ใช้จังหวะการสื่อสารที่อ่อนโยน ไม่เร่งรัด และสร้างพื้นที่ปลอดภัยทางอารมณ์ให้ญาติ');
            } else {
                empathyFeedback.push(isEn
                    ? 'Slow down the pacing and explicitly reassure the relative that you are listening.'
                    : 'ควรใช้ถ้อยคำที่แสดงความพร้อมรับฟังและไม่เร่งรัด เพื่อให้ญาติรู้สึกปลอดภัยทางใจมากขึ้น');
            }

            infoScore = Math.min(98, Math.max(45, infoScore));
            empathyScore = Math.min(98, Math.max(45, empathyScore));
            const totalScore = Math.round((infoScore + empathyScore) / 2);
            const passed = totalScore >= 60;

            return {
                totalScore,
                infoScore,
                empathyScore,
                passed,
                infoFeedback,
                empathyFeedback,
                summaryText: isEn
                    ? `Evaluation Complete: Overall ${totalScore}/100 (Clinical Info ${infoScore}/100 • Emotional Empathy ${empathyScore}/100).`
                    : `สรุปผลประเมิน: คะแนนรวม ${totalScore}/100 (ความถูกต้องของข้อมูล ${infoScore}/100 • การรับรู้อารมณ์ร่วม ${empathyScore}/100)`
            };
        }

        class LabErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, err: null };
            }
            static getDerivedStateFromError(err) {
                return { hasError: true, err };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6 bg-obsidian-950 text-slate-100">
                            <div className="lab-glass max-w-md w-full rounded-3xl p-6 text-center space-y-4 border-rose-500/40">
                                <h2 className="font-display font-bold text-lg text-rose-300">พบข้อผิดพลาดใน AI Skill Lab</h2>
                                <p className="text-xs font-mono text-rose-200 bg-obsidian-900 p-3 rounded-xl overflow-auto">
                                    {String(this.state.err?.message || this.state.err)}
                                </p>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="touch-target w-full py-3 rounded-2xl bg-biotech-500 text-slate-950 font-display font-bold text-sm"
                                >
                                    รีเฟรชหน้าห้องฝึก

        // ============================================================================
        // 5. MAIN AI SKILL LAB APPLICATION
        // ============================================================================
        function AiSkillLabApp() {
            // โหลดข้อมูลผู้เรียนจาก localStorage (หากไม่มีให้เข้าใช้งานในโหมดทดลองได้ทันที)
            const [user, setUser] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                    if (saved?.user) return saved.user;
                } catch (_) {}
                return {
                    id: 'guest_learner',
                    license: 'GUEST-2027',
                    name: 'ผู้เรียน rjcloud.organ',
                    position: 'พยาบาลผู้ประสานงาน / บุคลากรทางการแพทย์',
                    hospital: 'เครือข่าย rjcloud.organ'
                };
            });

            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [isCloudReady, setIsCloudReady] = useState(false);

            // Screen & Training States
            const [selectedMode, setSelectedMode] = useState(null); // LAB_MODES[0] | LAB_MODES[1]
            const [trainingTrack, setTrainingTrack] = useState('full_sim'); // micro_drill | full_sim
            const [phase, setPhase] = useState('menu'); // menu | video_intro | negotiating | evaluating | debrief
            const [drillIndex, setDrillIndex] = useState(0);
            const [showGuideBanner, setShowGuideBanner] = useState(true);
            const [showHoloExpandedMobile, setShowHoloExpandedMobile] = useState(false);
            const [showVideoModal, setShowVideoModal] = useState(false);

            // Conversation & Emotion States
            const [messages, setMessages] = useState([]);
            const [relativeEmotion, setRelativeEmotion] = useState('CONFUSED');
            const [smartSuggestions, setSmartSuggestions] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const [evalResult, setEvalResult] = useState(null);

            // Voice & Microphone States (ปิดสนิททุก MediaStreamTrack เมื่อหยุด)
            const [voiceEnabled, setVoiceEnabled] = useState(true);
            const [voiceFirstMode, setVoiceFirstMode] = useState(false);
            const [isAiSpeaking, setIsAiSpeaking] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [micLevel, setMicLevel] = useState(0);

            // Toast & Confirm Modal
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });
            const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', confirmText: 'ยืนยัน', onConfirm: null });

            // Refs for clean async & resource cleanup
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const speechRecRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const audioCtxRef = useRef(null);
            const vadRafRef = useRef(null);
            const chatEndRef = useRef(null);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text: String(text), type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3500);
            }, []);

            // แจ้ง Error Guard ว่า Mount สำเร็จแล้ว
            useEffect(() => {
                const el = document.getElementById('lab-root');
                if (el) el.dataset.mounted = 'true';
            }, []);

            // เชื่อมต่อ Firebase (Anonymous Auth + ดึง appsScriptUrl ส่วนกลางจาก settings)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let unsubSettings = null;

                signInAnonymously(fbAuth).catch(err => console.warn('Anon auth warning:', err));

                const unsubAuth = onAuthStateChanged(fbAuth, (fbUser) => {
                    if (!fbUser) return;
                    setIsCloudReady(true);
                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (snap) => {
                            if (snap.exists() && snap.data()?.appsScriptUrl) {
                                setAppsScriptUrl(snap.data().appsScriptUrl);
                            }
                        },
                        () => {}
                    );
                });

                return () => {
                    unsubAuth();
                    if (unsubSettings) unsubSettings();
                };
            }, []);

            // หยุดเสียง AI และคืน Memory ของ Blob URL อย่างสะอาด
            const stopAiVoice = useCallback(() => {
                if (audioRef.current) {
                    try { audioRef.current.pause(); } catch (_) {}
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsAiSpeaking(false);
            }, []);

            // ปิดไมโครโฟน VAD + SpeechRecognition + MediaStreamTrack สนิท 100%
            const stopMicCompletely = useCallback(() => {
                if (vadRafRef.current) {
                    cancelAnimationFrame(vadRafRef.current);
                    vadRafRef.current = null;
                }
                if (speechRecRef.current) {
                    try { speechRecRef.current.onend = null; speechRecRef.current.abort(); } catch (_) {}
                    speechRecRef.current = null;
                }
                if (mediaStreamRef.current) {
                    mediaStreamRef.current.getTracks().forEach(track => {
                        try { track.stop(); } catch (_) {}
                    });
                    mediaStreamRef.current = null;
                }
                if (audioCtxRef.current) {
                    try { audioCtxRef.current.close(); } catch (_) {}
                    audioCtxRef.current = null;
                }
                setIsListening(false);
                setMicLevel(0);
            }, []);

            // คืนทรัพยากรเสียงและไมโครโฟนเมื่อออกจากหน้า
            useEffect(() => {
                return () => {
                    stopAiVoice();
                    stopMicCompletely();
                };
            }, [stopAiVoice, stopMicCompletely]);

            // เลื่อนแชทลงล่างสุดอัตโนมัติ
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isAiTyping]);

            // เรียก Google Apps Script Proxy
            const callAppsScript = useCallback(async (payload) => {
                if (!appsScriptUrl) return { status: 'offline' };
                try {
                    const res = await fetch(appsScriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    return await res.json();
                } catch (err) {
                    return { status: 'error', message: err.message };
                }
            }, [appsScriptUrl]);

            // สังเคราะห์เสียงพากย์ของญาติผู้เสียชีวิต (Gemini Neural TTS -> Fallback Web Speech API)
            const speakRelativeText = useCallback(async (text, mode, onDone = null) => {
                stopAiVoice();
                if (!voiceEnabled || !text) {
                    if (onDone) onDone();
                    return;
                }

                const cleanText = String(text).replace(/[*#[\]]/g, '').trim();
                if (!cleanText) {
                    if (onDone) onDone();
                    return;
                }

                setIsAiSpeaking(true);

                // ลองเรียก Gemini Neural TTS ผ่าน Apps Script ก่อน
                if (appsScriptUrl) {
                    const ttsRes = await callAppsScript({
                        action: 'callGeminiTTS',
                        text: cleanText,
                        voiceName: mode?.voiceName || 'Aoede'
                    });
                    if (ttsRes?.status === 'success' && ttsRes.inlineData?.data) {
                        try {
                            const rate = parseInt(ttsRes.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const wavUrl = pcm16ToWavUrl(ttsRes.inlineData.data, rate);
                            audioUrlRef.current = wavUrl;
                            const audio = new Audio(wavUrl);
                            audioRef.current = audio;
                            audio.onended = () => {
                                stopAiVoice();
                                if (onDone) onDone();
                            };
                            audio.onerror = () => {
                                stopAiVoice();
                                if (onDone) onDone();
                            };
                            await audio.play();
                            return;
                        } catch (err) {
                            console.warn('Audio playback error, falling back to browser speech:', err);
                            stopAiVoice();
                        }
                    }
                }

                // Fallback: ใช้ Web Speech API ของเครื่องผู้ใช้
                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = mode?.language === 'en' ? 'en-US' : 'th-TH';
                        utter.rate = 0.98;
                        utter.onend = () => {
                            setIsAiSpeaking(false);
                            if (onDone) onDone();
                        };
                        utter.onerror = () => {
                            setIsAiSpeaking(false);
                            if (onDone) onDone();
                        };
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }

                setIsAiSpeaking(false);
                if (onDone) onDone();
            }, [voiceEnabled, appsScriptUrl, callAppsScript, stopAiVoice]);

            // เริ่มต้นรับเสียงพูดจากไมโครโฟน (SpeechRecognition + Visual Volume Meter)
            const toggleMicrophone = async () => {
                if (isListening) {
                    stopMicCompletely();
                    return;
                }

                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง กรุณาพิมพ์ข้อความในช่องด้านล่างค่ะ', 'error');
                    return;
                }

                stopAiVoice();

                try {
                    // เปิดไมค์เพื่อวัดระดับคลื่นเสียง (Visual Meter) และปิดสนิทใน stopMicCompletely
                    if (navigator.mediaDevices?.getUserMedia) {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: { echoCancellation: true, noiseSuppression: true }
                        });
                        mediaStreamRef.current = stream;
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) {
                            const ctx = new AudioCtx();
                            audioCtxRef.current = ctx;
                            const src = ctx.createMediaStreamSource(stream);
                            const analyser = ctx.createAnalyser();
                            analyser.fftSize = 256;
                            src.connect(analyser);
                            const dataArr = new Uint8Array(analyser.frequencyBinCount);
                            const updateMeter = () => {
                                analyser.getByteFrequencyData(dataArr);
                                const avg = dataArr.reduce((a, b) => a + b, 0) / dataArr.length;
                                setMicLevel(Math.min(100, Math.round(avg * 1.4)));
                                vadRafRef.current = requestAnimationFrame(updateMeter);
                            };
                            updateMeter();
                        }
                    }

                    const rec = new SR();
                    rec.lang = selectedMode?.language === 'en' ? 'en-US' : 'th-TH';
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onresult = (event) => {
                        let transcript = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            transcript += event.results[i][0].transcript;
                        }
                        setChatInput(transcript);
                    };
                    rec.onerror = () => {
                        stopMicCompletely();
                    };
                    rec.onend = () => {
                        stopMicCompletely();
                    };
                    speechRecRef.current = rec;
                    rec.start();
                    setIsListening(true);
                } catch (err) {
                    console.warn('Mic permission denied or error:', err);
                    stopMicCompletely();
                    showToast('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตสิทธิ์ไมค์บนเบราว์เซอร์ค่ะ', 'error');
                }
            };

            // เข้าสู่ฉากการสนทนาในห้องรับรอง (ทั้งแบบฝึกย่อย 3 ด่าน และแบบจำลองเต็มรูปแบบ)
            const enterConsultationRoom = useCallback((mode, track) => {
                stopAiVoice();
                stopMicCompletely();

                const isEn = mode.language === 'en';
                setSelectedMode(mode);
                setTrainingTrack(track);
                setPhase('negotiating');
                setEvalResult(null);
                setDrillIndex(0);
                setShowGuideBanner(true);

                if (track === 'micro_drill') {
                    const drills = GUIDED_DRILLS[isEn ? 'en' : 'th'];
                    const first = drills[0];
                    setRelativeEmotion(first.emotion);
                    setMessages([
                        {
                            id: `ctx-${Date.now()}`,
                            sender: 'system',
                            title: first.stepTitle,
                            text: first.context
                        },
                        {
                            id: `ai-open-${Date.now() + 1}`,
                            sender: 'ai',
                            emotion: first.emotion,
                            speakerName: mode.relativeName,
                            text: first.relativeLine,
                            revealed: true
                        }
                    ]);
                    setSmartSuggestions([
                        first.sampleReply,
                        isEn
                            ? 'Hello, I am a coordinator on the care team. I am truly sorry for your distress—let us talk calmly in this private room.'
                            : 'สวัสดีค่ะ ดิฉันเป็นเจ้าหน้าที่ผู้ประสานงานดูแลครอบครัวค่ะ เข้าใจความกังวลใจอย่างมากเลยนะคะ ขอเชิญคุยกันอย่างสบายใจในห้องรับรองนี้ค่ะ'
                    ]);
                    speakRelativeText(first.relativeLine, mode);
                    return;
                }

                // โหมดจำลองสถานการณ์เต็มรูปแบบ (Full Simulation)
                setRelativeEmotion(mode.openingEmotion || 'CONFUSED');
                const openId = `ai-open-${Date.now()}`;
                setMessages([
                    {
                        id: `ctx-${Date.now()}`,
                        sender: 'system',
                        title: isEn ? 'Consultation Room Briefing' : 'บริบทห้องรับรองผู้เสียชีวิต',
                        text: mode.briefingText
                    },
                    {
                        id: openId,
                        sender: 'ai',
                        emotion: mode.openingEmotion || 'CONFUSED',
                        speakerName: mode.relativeName,
                        text: mode.openingLine,
                        revealed: !voiceFirstMode
                    }
                ]);

                setSmartSuggestions(isEn ? [
                    "Hello, my name is Nurse Joy, a clinical coordinator on the care team. I am so sorry for what happened—thank you for coming into this quiet room.",
                    "I know this must feel overwhelming. Before I share the medical update, may I ask what the doctors have explained to you so far?"
                ] : [
                    'สวัสดีค่ะ ดิฉันชื่อพยาบาลใจดี เป็นพยาบาลผู้ประสานงานจากทีมดูแลค่ะ ขอแสดงความเสียใจกับเหตุการณ์ที่เกิดขึ้นนะคะ ยินดีที่ได้คุยกันในห้องรับรองที่เป็นส่วนตัวนี้ค่ะ',
                    'เข้าใจเลยค่ะว่าตอนนี้ครอบครัวกำลังตกใจและเป็นห่วงมาก ก่อนอื่นขออนุญาตถามเพื่อความเข้าใจตรงกันว่า คุณหมอได้แจ้งอาการให้ทราบบ้างแล้วหรือยังคะ'
                ]);

                speakRelativeText(mode.openingLine, mode, () => {
                    setMessages(prev => prev.map(m => (m.id === openId ? { ...m, revealed: true } : m)));
                });
            }, [stopAiVoice, stopMicCompletely, speakRelativeText, voiceFirstMode]);

            // เริ่มต้นจากหน้าเมนู (ดูวิดีโอ Vimeo 1248608457 ก่อนเข้าห้องสนทนา หรือเริ่มฝึกย่อยทันที)
            const handleSelectMode = (mode, track) => {
                stopAiVoice();
                stopMicCompletely();
                setSelectedMode(mode);
                setTrainingTrack(track);
                setMessages([]);
                setEvalResult(null);
                if (track === 'full_sim') {
                    setPhase('video_intro');
                } else {
                    enterConsultationRoom(mode, track);
                }
            };

            // ส่งคำพูดของผู้เรียน (บทบาทผู้ให้ข้อมูลญาติ) ไปยัง AI (บทบาทญาติผู้เสียชีวิต)
            const handleSendMessage = async (e, presetReply = null) => {
                if (e) e.preventDefault();
                if (!selectedMode || phase !== 'negotiating' || isAiTyping) return;

                const learnerText = String(presetReply ?? chatInput).trim();
                if (!learnerText) return;

                stopAiVoice();
                if (isListening) stopMicCompletely();

                setChatInput('');
                setSmartSuggestions([]);

                const userMsgObj = {
                    id: `u-${Date.now()}`,
                    sender: 'user',
                    speakerName: selectedMode.language === 'en' ? 'You (Communicator)' : 'คุณ (ผู้ให้ข้อมูลญาติ)',
                    text: learnerText
                };

                const nextMessages = [...messages, userMsgObj];
                setMessages(nextMessages);

                // --- กรณีอยู่ในโหมดฝึกย่อย 3 ด่าน (Guided Micro-Drill) ---
                if (trainingTrack === 'micro_drill') {
                    const drills = GUIDED_DRILLS[selectedMode.language === 'en' ? 'en' : 'th'];
                    const curDrill = drills[drillIndex];
                    const nextIdx = drillIndex + 1;
                    const hasNext = nextIdx < drills.length;

                    const coachMsg = {
                        id: `coach-${Date.now()}`,
                        sender: 'system',
                        title: selectedMode.language === 'en' ? `Completed ${curDrill.stepTitle}` : `ผ่านการซ้อม ${curDrill.stepTitle}`,
                        text: selectedMode.language === 'en'
                            ? `Key points practiced: ${curDrill.checkpoints.join(' • ')}`
                            : `จุดสำคัญที่ฝึกในด่านนี้: ${curDrill.checkpoints.join(' • ')}`
                    };

                    if (hasNext) {
                        const nextDrill = drills[nextIdx];
                        setDrillIndex(nextIdx);
                        setRelativeEmotion(nextDrill.emotion);
                        const aiNextMsg = {
                            id: `ai-drill-${Date.now() + 1}`,
                            sender: 'ai',
                            emotion: nextDrill.emotion,
                            speakerName: selectedMode.relativeName,
                            text: nextDrill.relativeLine,
                            revealed: true
                        };
                        setMessages([...nextMessages, coachMsg, {
                            id: `ctx-next-${Date.now()}`,
                            sender: 'system',
                            title: nextDrill.stepTitle,
                            text: nextDrill.context
                        }, aiNextMsg]);
                        setSmartSuggestions([
                            nextDrill.sampleReply,
                            selectedMode.language === 'en'
                                ? 'I hear how deeply painful this is. Please take your time and ask me anything.'
                                : 'ดิฉันเข้าใจความรู้สึกของครอบครัวอย่างมากเลยค่ะ ไม่ต้องรีบนะคะ ค่อยๆ สอบถามได้ทุกเรื่องเลยค่ะ'
                        ]);
                        speakRelativeText(nextDrill.relativeLine, selectedMode);
                    } else {
                        setMessages([...nextMessages, coachMsg, {
                            id: `drill-done-${Date.now() + 1}`,
                            sender: 'system',
                            title: selectedMode.language === 'en' ? 'All 3 Drills Completed!' : 'ฝึกปฏิบัติย่อยครบทั้ง 3 ด่านแล้วค่ะ 🎉',
                            text: selectedMode.language === 'en'
                                ? 'Tap "Evaluate 2 Dimensions" above to review your Information Accuracy & Emotional Empathy scores, or switch to Full Consultation Room Simulation.'
                                : 'สามารถกดปุ่ม "จบ & ประเมินผล" ด้านบนเพื่อดูคะแนน 2 มิติ (ข้อมูลถูกต้อง + การรับรู้อารมณ์ร่วม) หรือลองเข้าสู่สถานการณ์จำลองเต็มรูปแบบต่อได้เลยค่ะ'
                        }]);
                    }
                    return;
                }

                // --- กรณีอยู่ในโหมดสถานการณ์จำลองเต็มรูปแบบ (Full Simulation) ---
                setIsAiTyping(true);
                const turnCount = nextMessages.filter(m => m.sender === 'user').length;
                const historyText = nextMessages
                    .filter(m => m.sender !== 'system')
                    .slice(-10)
                    .map(m => `${m.sender === 'user' ? 'Clinical Communicator' : 'Bereaved Relative'}: ${m.text}`)
                    .join('\n');

                const clinicalKnowledge = window.CLINICAL_KNOWLEDGE_BASE || '';
                const suggestionRule = selectedMode.language === 'en'
                    ? `\n\n[SMART SUGGESTIONS]\nAt the end of your response, add 2 short empathetic next-turn suggestions for the learner:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`
                    : `\n\n[SMART SUGGESTIONS]\nต่อท้ายคำตอบของคุณด้วยแนวทางคำพูดที่เหมาะสมสำหรับผู้เรียน (ผู้ให้ข้อมูลญาติ) 2 ข้อ:\n[SUGGESTION 1] ...\n[SUGGESTION 2] ...`;

                const fullSystemPrompt = `${selectedMode.systemPrompt}\n\n[Reference Clinical Knowledge]\n${clinicalKnowledge}${suggestionRule}\n\nConversation History:\n${historyText}\nClinical Communicator: ${learnerText}\nBereaved Relative (Start with [EMOTION]):`;

                let rawAiReply = '';
                if (appsScriptUrl) {
                    const res = await callAppsScript({
                        action: 'callGemini',
                        prompt: learnerText,
                        systemInstruction: fullSystemPrompt
                    });
                    if (res?.status === 'success' && res.text) {
                        rawAiReply = res.text;
                    } else {
                        showToast('กำลังใช้โหมดสนทนาจำลองสำรอง (รอการเชื่อมต่อ Gemini API)', 'info');
                    }
                }

                if (!rawAiReply) {
                    await new Promise(r => setTimeout(r, 600));
                    rawAiReply = generateOfflineRelativeReply(learnerText, selectedMode, turnCount);
                }

                const parsed = parseAiResponse(rawAiReply);
                const replyId = `ai-${Date.now()}`;
                setRelativeEmotion(parsed.emotion);
                setMessages(prev => [...prev, {
                    id: replyId,
                    sender: 'ai',
                    emotion: parsed.emotion,
                    speakerName: selectedMode.relativeName,
                    text: parsed.text,
                    revealed: !voiceFirstMode
                }]);
                setSmartSuggestions(parsed.suggestions);
                setIsAiTyping(false);

                speakRelativeText(parsed.text, selectedMode, () => {
                    setMessages(prev => prev.map(m => (m.id === replyId ? { ...m, revealed: true } : m)));
                });
            };

            // จบการฝึกและประเมินผล 2 มิติ พร้อมบันทึกลง Cloud/Local
            const handleEvaluateSession = async () => {
                if (!selectedMode) return;
                const learnerTurns = messages.filter(m => m.sender === 'user').length;
                if (learnerTurns === 0) {
                    showToast('กรุณาสื่อสารให้ข้อมูลญาติอย่างน้อย 1 ข้อความก่อนประเมินผลค่ะ', 'error');
                    return;
                }

                stopAiVoice();
                stopMicCompletely();
                setPhase('evaluating');

                // คำนวณคะแนน 2 มิติจากบทสนทนาจริง
                const localEval = evaluateDualDimensions(messages, selectedMode);
                let aiCoachingNote = '';

                if (appsScriptUrl) {
                    const transcript = messages
                        .filter(m => m.sender !== 'system')
                        .map(m => `${m.sender === 'user' ? 'ผู้ให้ข้อมูลญาติ (ผู้เรียน)' : 'ญาติผู้เสียชีวิต (AI)'}: ${m.text}`)
                        .join('\n');

                    const evalPrompt = selectedMode.language === 'en'
                        ? `Review this consultation-room conversation between a Clinical Communicator (learner) and a Bereaved Relative (AI). Provide 3 concise bullet points covering: (1) Clinical information accuracy, (2) Emotional empathy & resonance, and (3) One improved sample sentence.\n\nTranscript:\n${transcript}`
                        : `ช่วยวิเคราะห์บทสนทนาในห้องรับรองระหว่าง "ผู้ให้ข้อมูลญาติ (ผู้เรียน)" กับ "ญาติผู้เสียชีวิต (AI)" ด้านล่างนี้ โดยสรุปสั้นกระชับ 3 ข้อ: (1) จุดเด่น/จุดปรับปรุงด้านความถูกต้องของข้อมูล (2) การรับรู้อารมณ์ร่วมกับญาติ (3) ตัวอย่างประโยคที่แนะนำให้นำไปใช้จริง\n\nบทสนทนา:\n${transcript}`;

                    const res = await callAppsScript({ action: 'callGemini', prompt: evalPrompt });
                    if (res?.status === 'success' && res.text) {
                        aiCoachingNote = res.text;
                    }
                } else {
                    await new Promise(r => setTimeout(r, 500));
                }

                const finalResult = {
                    ...localEval,
                    aiCoachingNote,
                    track: trainingTrack,
                    language: selectedMode.language,
                    timestamp: new Date().toISOString()
                };

                setEvalResult(finalResult);
                setPhase('debrief');

                // บันทึกประวัติคะแนนลง localStorage และ Firestore (ถ้าเชื่อมต่อแล้วและไม่ใช่ guest)
                try {
                    const historyItem = {
                        score: finalResult.totalScore,
                        infoScore: finalResult.infoScore,
                        empathyScore: finalResult.empathyScore,
                        passed: finalResult.passed,
                        mode: selectedMode.id,
                        track: trainingTrack,
                        timestamp: finalResult.timestamp
                    };

                    const nextHistory = [...(Array.isArray(user.skillLabHistory) ? user.skillLabHistory : []), historyItem];
                    const nextUser = {
                        ...user,
                        skillLabPassed: Boolean(user.skillLabPassed || finalResult.passed),
                        skillLabHistory: nextHistory
                    };
                    setUser(nextUser);

                    const rawSaved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...rawSaved, user: nextUser }));

                    if (isCloudReady && fbDb && nextUser.id && !String(nextUser.id).startsWith('guest_') && !String(nextUser.id).startsWith('demo_')) {
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)),
                            { skillLabPassed: nextUser.skillLabPassed, skillLabHistory: nextHistory },
                            { merge: true }
                        );
                        const bestScore = Math.max(...nextHistory.map(h => h.score || 0));
                        await setDoc(
                            doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'leaderboard', String(nextUser.id)),
                            { name: nextUser.name, hospital: nextUser.hospital || '-', score: bestScore, updatedAt: finalResult.timestamp },
                            { merge: true }
                        );
                    }
                    showToast('บันทึกผลการประเมินทักษะเรียบร้อยแล้วค่ะ');
                } catch (err) {
                    console.warn('Save evaluation warning:', err);
                }
            };

            const handleConfirmExitToMenu = () => {
                if (phase === 'negotiating' && messages.some(m => m.sender === 'user')) {
                    setConfirmDialog({
                        open: true,
                        title: 'ออกจากห้องจำลองสถานการณ์?',
                        message: 'หากกลับหน้าเมนูตอนนี้ บทสนทนาที่ยังไม่ได้กดประเมินผลจะไม่ถูกบันทึกคะแนนค่ะ',
                        confirmText: 'กลับหน้าเมนู',
                        onConfirm: () => {
                            stopAiVoice();
                            stopMicCompletely();
                            setSelectedMode(null);
                            setPhase('menu');
                        }
                    });
                } else {
                    stopAiVoice();
                    stopMicCompletely();
                    setSelectedMode(null);
                    setPhase('menu');
                }
            };

            const isEn = selectedMode?.language === 'en';
            const emotionInfo = EMOTION_META[relativeEmotion] || EMOTION_META.CONFUSED;
            const currentDrill = trainingTrack === 'micro_drill'
                ? (GUIDED_DRILLS[isEn ? 'en' : 'th']?.[drillIndex] || GUIDED_DRILLS.th[0])
                : null;

            // ============================================================================
            // 6. RENDER VIEWS
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col text-slate-100">
                    <div className="lab-backdrop" />
                    <div className="lab-grid" />

                    {/* ==================== TOP HEADER ==================== */}

                                    </button>
                                    <a
                                        href="./index.html#dashboard"
                                        className="touch-target sm:w-auto py-3.5 px-5 rounded-2xl bg-obsidian-800 hover:bg-obsidian-700 border border-slate-700 text-slate-200 font-display font-bold text-sm flex items-center justify-center gap-2"
                                    >
                                        <Icon name="Home" size={17} /> {isEn ? 'Dashboard' : 'กลับห้องเรียน'}
                                    </a>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* ==================== VIMEO SCENARIO VIDEO MODAL (ดูซ้ำระหว่างสนทนา) ==================== */}
                    {showVideoModal && (
                        <div className="fixed inset-0 z-[105] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6">
                            <div className="w-full max-w-3xl lab-glass rounded-[1.75rem] p-4 sm:p-6 border-cyber-400/30 space-y-3.5">
                                <div className="flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2">
                                        <span className="px-2.5 py-1 rounded-full bg-cyber-500/15 border border-cyber-400/30 text-cyber-300 font-mono text-[10px] font-bold">
                                            VIMEO #{SCENARIO_VIMEO_ID}
                                        </span>
                                        <h3 className="font-display font-bold text-sm sm:text-base text-white">
                                            {isEn ? 'Scenario Reference Video' : 'วิดีโอสถานการณ์จำลองประกอบการฝึก'}
                                        </h3>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => setShowVideoModal(false)}
                                        aria-label="ปิดวิดีโอ"
                                        className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/15 text-slate-200 flex items-center justify-center"
                                    >
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-white/10">
                                    <iframe
                                        src={SCENARIO_VIMEO_EMBED_URL}
                                        className="absolute inset-0 w-full h-full border-0"
                                        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
                                        allowFullScreen
                                        title="Scenario Reference Video"
                                    />
                                </div>

                                <div className="flex items-center justify-between gap-2 text-xs text-slate-400">
                                    <a
                                        href={SCENARIO_VIMEO_SHARE_URL}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="text-cyber-300 hover:underline inline-flex items-center gap-1 font-bold"
                                    >
                                        เปิดบน Vimeo <Icon name="ExternalLink" size={12} />
                                    </a>
                                    <button
                                        type="button"
                                        onClick={() => setShowVideoModal(false)}
                                        className="px-4 py-2 rounded-xl bg-biotech-500 hover:bg-biotech-400 text-slate-950 font-display font-bold text-xs"
                                    >
                                        กลับไปสนทนาต่อ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <ConfirmModal dialog={confirmDialog} onClose={() => setConfirmDialog(p => ({ ...p, open: false }))} />
                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
