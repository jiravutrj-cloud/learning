      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#030712' : '#f8fafc');
        } catch (_) {}
      })();
    </script>

        // 3. PROCEDURAL AMBIENT SOUNDSCAPE ENGINE (WEB AUDIO API)
        // ============================================================================
        class AmbientSoundscapeEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.filter = null;
                this.oscs = [];
                this.active = false;
            }

            start(emotionKey = 'CONFUSED') {
                if (this.active) {
                    this.updateEmotion(emotionKey);
                    return;
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                try {
                    const ctx = new AudioCtx();
                    const master = ctx.createGain();
                    master.gain.setValueAtTime(0.0001, ctx.currentTime);
                    master.gain.exponentialRampToValueAtTime(0.045, ctx.currentTime + 1.8);

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(420, ctx.currentTime);
                    filter.Q.setValueAtTime(1.2, ctx.currentTime);

                    const lfo = ctx.createOscillator();
                    const lfoGain = ctx.createGain();
                    lfo.frequency.setValueAtTime(0.14, ctx.currentTime);
                    lfoGain.gain.setValueAtTime(90, ctx.currentTime);
                    lfo.connect(lfoGain);
                    lfoGain.connect(filter.frequency);
                    lfo.start();

                    filter.connect(master);
                    master.connect(ctx.destination);

                    const freqs = (EMOTION_PHYSICS[emotionKey] || EMOTION_PHYSICS.CONFUSED).droneFreqs;
                    const oscs = freqs.map((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = idx === 0 ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime);
                        g.gain.setValueAtTime(idx === 0 ? 0.5 : 0.22, ctx.currentTime);
                        osc.connect(g);
                        g.connect(filter);
                        osc.start();
                        return osc;
                    });

                    this.ctx = ctx;
                    this.masterGain = master;
                    this.filter = filter;
                    this.oscs = [...oscs, lfo];
                    this.active = true;
                } catch (err) {
                    console.warn('Soundscape start warning:', err);
                }
            }

            updateEmotion(emotionKey) {
                if (!this.active || !this.ctx) return;
                const meta = EMOTION_PHYSICS[emotionKey] || EMOTION_PHYSICS.CONFUSED;
                const now = this.ctx.currentTime;
                meta.droneFreqs.forEach((f, idx) => {
                    if (this.oscs[idx]) {
                        try {
                            this.oscs[idx].frequency.exponentialRampToValueAtTime(Math.max(40, f), now + 1.4);
                        } catch (_) {}
                    }
                });
                if (this.filter) {
                    const targetCutoff = emotionKey === 'CALM' ? 540 : emotionKey === 'ANGRY' ? 320 : 420;
                    try {
                        this.filter.frequency.exponentialRampToValueAtTime(targetCutoff, now + 1.4);
                    } catch (_) {}
                }
            }

            playChime() {
                if (!this.active || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.35);
                    g.gain.setValueAtTime(0.001, now);
                    g.gain.exponentialRampToValueAtTime(0.06, now + 0.06);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 1.15);
                } catch (_) {}
            }

            stop() {
                if (!this.active) return;
                this.active = false;
                try {
                    if (this.masterGain && this.ctx) {
                        this.masterGain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.35);
                    }
                    setTimeout(() => {
                        this.oscs.forEach(o => { try { o.stop(); } catch (_) {} });
                        if (this.ctx) { try { this.ctx.close(); } catch (_) {} }
                        this.oscs = [];
                        this.ctx = null;
                        this.masterGain = null;
                    }, 400);
                } catch (_) {}
            }
        }

                };
                const particleTex = createGlowSpriteTexture();

                const rootGroup = new THREE.Group();
                scene.add(rootGroup);

                // 1) แกนอนุภาคพลังงานหลัก 2,400 จุด
                const PARTICLE_COUNT = 2400;
                const basePositions = new Float32Array(PARTICLE_COUNT * 3);
                const positions = new Float32Array(PARTICLE_COUNT * 3);
                const colors = new Float32Array(PARTICLE_COUNT * 3);
                const seeds = new Float32Array(PARTICLE_COUNT);

                const goldenAngle = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const y = 1 - (i / (PARTICLE_COUNT - 1)) * 2;
                    const radiusAtY = Math.sqrt(Math.max(0, 1 - y * y));
                    const theta = goldenAngle * i;
                    const shellRadius = 1.48 + (i % 7 === 0 ? 0.42 : 0) + (Math.random() - 0.5) * 0.16;

                    const bx = Math.cos(theta) * radiusAtY * shellRadius;
                    const by = y * shellRadius;
                    const bz = Math.sin(theta) * radiusAtY * shellRadius;

                    basePositions[i * 3] = bx;
                    basePositions[i * 3 + 1] = by;
                    basePositions[i * 3 + 2] = bz;
                    positions[i * 3] = bx;
                    positions[i * 3 + 1] = by;
                    positions[i * 3 + 2] = bz;
                    seeds[i] = Math.random() * Math.PI * 2;

                    colors[i * 3] = 0.2;
                    colors[i * 3 + 1] = 0.85;
                    colors[i * 3 + 2] = 0.85;
                }

                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const particleMat = new THREE.PointsMaterial({
                    size: 0.085,
                    map: particleTex,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.92,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                const particleCloud = new THREE.Points(particleGeo, particleMat);
                rootGroup.add(particleCloud);

                // 2) แกนผลึกภายใน (ลดความเข้มเส้นเพื่อความนุ่มนวลสบายตา)
                const coreGeo = new THREE.IcosahedronGeometry(0.88, 2);
                const coreMat = new THREE.MeshBasicMaterial({
                    color: 0x38bdf8,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.14,
                    blending: THREE.AdditiveBlending
                });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                rootGroup.add(coreMesh);

                // 3) วงแหวนโฮโลแกรมรอบนอก 2 ชั้น
                const ringGeo1 = new THREE.TorusGeometry(2.18, 0.011, 12, 120);
                const ringMat1 = new THREE.MeshBasicMaterial({
                    color: 0x22d3ee,
                    transparent: true,
                    opacity: 0.28,
                    blending: THREE.AdditiveBlending
                });
                const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
                ring1.rotation.x = Math.PI * 0.42;
                rootGroup.add(ring1);

                const ringGeo2 = new THREE.TorusGeometry(2.52, 0.008, 12, 120);
                const ringMat2 = new THREE.MeshBasicMaterial({
                    color: 0x34d399,
                    transparent: true,
                    opacity: 0.18,
                    blending: THREE.AdditiveBlending
                });
                const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
                ring2.rotation.x = -Math.PI * 0.34;
                ring2.rotation.y = Math.PI * 0.2;
                rootGroup.add(ring2);

                // 4) ฝุ่นดาวรอบพื้นที่จำลอง
                const STAR_COUNT = 320;
                const starPos = new Float32Array(STAR_COUNT * 3);
                for (let i = 0; i < STAR_COUNT; i++) {
                    starPos[i * 3] = (Math.random() - 0.5) * 18;
                    starPos[i * 3 + 1] = (Math.random() - 0.5) * 14;
                    starPos[i * 3 + 2] = -2 - Math.random() * 12;
                }
                const starGeo = new THREE.BufferGeometry();
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({
                    size: 0.06,
                    map: particleTex,
                    color: 0x94a3b8,
                    transparent: true,
                    opacity: 0.45,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                const starField = new THREE.Points(starGeo, starMat);
                scene.add(starField);

                // Interactive Mouse & Touch Drag Orbit
                let isDragging = false;
                let lastX = 0, lastY = 0;
                let targetRotX = 0.08, targetRotY = 0;
                let curRotX = 0.08, curRotY = 0;

                const onPointerDown = (x, y) => {
                    if (!stateRef.current.interactive) return;
                    isDragging = true;
                    lastX = x;
                    lastY = y;
                };
                const onPointerMove = (x, y) => {
                    if (!isDragging || !stateRef.current.interactive) return;
                    const dx = x - lastX;
                    const dy = y - lastY;
                    lastX = x;
                    lastY = y;
                    targetRotY += dx * 0.007;
                    targetRotX = Math.max(-0.9, Math.min(0.9, targetRotX + dy * 0.006));
                };
                const onPointerUp = () => { isDragging = false; };

                const handleMouseDown = (e) => onPointerDown(e.clientX, e.clientY);
                const handleMouseMove = (e) => onPointerMove(e.clientX, e.clientY);
                const handleTouchStart = (e) => { if (e.touches[0]) onPointerDown(e.touches[0].clientX, e.touches[0].clientY); };
                const handleTouchMove = (e) => { if (e.touches[0]) onPointerMove(e.touches[0].clientX, e.touches[0].clientY); };

                const domEl = renderer.domElement;
                domEl.addEventListener('mousedown', handleMouseDown);
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', onPointerUp);
                domEl.addEventListener('touchstart', handleTouchStart, { passive: true });
                window.addEventListener('touchmove', handleTouchMove, { passive: true });
                window.addEventListener('touchend', onPointerUp);

                const handleResize = () => {
                    if (!container) return;
                    const w = Math.max(1, container.clientWidth || window.innerWidth);
                    const h = Math.max(1, container.clientHeight || window.innerHeight);
                    camera.aspect = w / h;
                    camera.position.z = w < 640 ? 7.4 : 6.1;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                handleResize();
                window.addEventListener('resize', handleResize);

                const curColor1 = new THREE.Color(0x38bdf8);
                const curColor2 = new THREE.Color(0x818cf8);
                const targetColor1 = new THREE.Color(0x38bdf8);
                const targetColor2 = new THREE.Color(0x818cf8);
                const tmpColor = new THREE.Color();

                let curTurb = 0.08;
                let curSpread = 1.02;
                let curPulse = 0.75;
                let curRotSpeed = 0.06;
                let curEnergy = 0;
                let elapsed = 0;
                let lastTime = performance.now();

                const animate = (now) => {
                    rafId = requestAnimationFrame(animate);
                    const dt = Math.min(0.05, (now - lastTime) / 1000);
                    lastTime = now;
                    elapsed += dt;

                    const { emotionKey: ek, isAiSpeaking: speaking, isAiTyping: typing, micLevel: mic } = stateRef.current;
                    const meta = EMOTION_PHYSICS[ek] || EMOTION_PHYSICS.CONFUSED;

                    // ปรับเปลี่ยนสีและพารามิเตอร์แบบ Smooth Damping ไม่กระตุก
                    const damp = Math.min(1, dt * 1.4);
                    targetColor1.setHex(meta.primaryHex);
                    targetColor2.setHex(meta.secondaryHex);
                    curColor1.lerp(targetColor1, damp);
                    curColor2.lerp(targetColor2, damp);

                    curTurb += (meta.turbulence - curTurb) * damp;
                    curSpread += (meta.spread - curSpread) * damp;
                    curPulse += (meta.pulseSpeed - curPulse) * damp;
                    curRotSpeed += (meta.rotSpeed - curRotSpeed) * damp;

                    // คลื่นตอบสนองเสียงพูดแบบหายใจนุ่มๆ แทนการเต้นกระชากเร็ว
                    const voiceTarget = speaking
                        ? (0.055 + Math.sin(elapsed * 2.1) * 0.022 + Math.cos(elapsed * 1.3) * 0.012)
                        : typing
                            ? 0.03
                            : 0;
                    const micTarget = Math.min(0.08, (mic || 0) / 1100);
                    const targetEnergy = voiceTarget + micTarget;
                    curEnergy += (targetEnergy - curEnergy) * Math.min(1, dt * 2.4);

                    const posAttr = particleGeo.attributes.position;
                    const colAttr = particleGeo.attributes.color;
                    const breath = 1 + Math.sin(elapsed * curPulse) * 0.024 + curEnergy * 0.45;

                    // คลื่นอนุภาคแบบไหลต่อเนื่อง (Coherent Fluid Wave) ลดอาการสั่นระริกและอาการเวียนหัว
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        const i3 = i * 3;
                        const bx = basePositions[i3];
                        const by = basePositions[i3 + 1];
                        const bz = basePositions[i3 + 2];
                        const s = seeds[i];

                        const coherentWave = Math.sin(elapsed * 0.65 + by * 1.35 + bx * 0.85) * (curTurb * 0.28 + curEnergy * 0.16);
                        const gentleDrift = Math.cos(elapsed * 0.45 + bz * 1.1 + s * 0.15) * (curTurb * 0.08);
                        const scale = curSpread * breath + coherentWave;

                        posAttr.array[i3] = bx * scale + gentleDrift * 0.25;
                        posAttr.array[i3 + 1] = by * scale + Math.sin(elapsed * 0.5 + bx * 0.9) * 0.022;
                        posAttr.array[i3 + 2] = bz * scale;

                        const mixRatio = 0.5 + 0.5 * Math.sin(elapsed * 0.35 + by * 0.9 + s * 0.2);
                        tmpColor.copy(curColor1).lerp(curColor2, mixRatio);
                        colAttr.array[i3] = tmpColor.r;
                        colAttr.array[i3 + 1] = tmpColor.g;
                        colAttr.array[i3 + 2] = tmpColor.b;
                    }
                    posAttr.needsUpdate = true;
                    colAttr.needsUpdate = true;

                    coreMat.color.copy(curColor1);
                    coreMat.opacity = 0.12 + curEnergy * 0.55;
                    const coreScale = 0.94 + Math.sin(elapsed * curPulse) * 0.025 + curEnergy * 0.38;
                    coreMesh.scale.setScalar(coreScale);
                    coreMesh.rotation.y -= dt * (curRotSpeed * 0.75);
                    coreMesh.rotation.x += dt * 0.035;

                    ringMat1.color.copy(curColor2);
                    ringMat2.color.copy(curColor1);
                    ring1.rotation.z += dt * (0.065 + curRotSpeed * 0.4);
                    ring2.rotation.z -= dt * (0.045 + curRotSpeed * 0.3);
                    ring1.scale.setScalar(1 + curEnergy * 0.25);
                    ring2.scale.setScalar(1 + curEnergy * 0.32);

                    if (!isDragging) targetRotY += dt * curRotSpeed * 0.5;
                    curRotX += (targetRotX - curRotX) * 0.055;
                    curRotY += (targetRotY - curRotY) * 0.055;
                    rootGroup.rotation.x = curRotX;
                    rootGroup.rotation.y = curRotY;
                    rootGroup.position.y = Math.sin(elapsed * 0.38) * 0.035 + 0.24;

                    starField.rotation.y += dt * 0.008;

                    renderer.render(scene, camera);
                };

                rafId = requestAnimationFrame(animate);

                return () => {
                    cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', handleResize);
                    domEl.removeEventListener('mousedown', handleMouseDown);
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', onPointerUp);
                    domEl.removeEventListener('touchstart', handleTouchStart);
                    window.removeEventListener('touchmove', handleTouchMove);
                    window.removeEventListener('touchend', onPointerUp);
                    particleGeo.dispose();
                    particleMat.dispose();
                    coreGeo.dispose();
                    coreMat.dispose();
                    ringGeo1.dispose();
                    ringMat1.dispose();
                    ringGeo2.dispose();
                    ringMat2.dispose();
                    starGeo.dispose();
                    starMat.dispose();
                    particleTex.dispose();
                    renderer.dispose();
                };
            }, []);

            return <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />;
        }

        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

        function parseAiResponse(rawText) {
            const text = String(rawText || '').trim();
            const suggestions = [];
            const sugRegex = /\[SUGGESTION\s*\d+\]\s*([^\n]+)/gi;
            let match;
            while ((match = sugRegex.exec(text)) !== null) {
                if (match[1]?.trim()) suggestions.push(match[1].trim());
            }
            let coachTip = '';
            const tipMatch = text.match(/\[COACH_TIP\]\s*([^\n]+)/i);
            if (tipMatch && tipMatch[1]) coachTip = tipMatch[1].trim();

            let cleaned = text
                .replace(/\[SUGGESTION\s*\d+\]\s*[^\n]+/gi, '')
                .replace(/\[COACH_TIP\]\s*[^\n]+/gi, '')
                .trim();

            let emotion = 'SAD';
            const emoMatch = cleaned.match(/^\[(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]\s*/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                cleaned = cleaned.replace(emoMatch[0], '').trim();
            }
            cleaned = cleaned.replace(/^\[[^\]]{1,25}\]\s*/, '').trim();

            return {
                emotion: EMOTION_PHYSICS[emotion] ? emotion : 'SAD',
                text: cleaned || '...',
                coachTip,
                suggestions: suggestions.slice(0, 2)
            };
        }

        /**
         * ตรวจจับคำที่อาจกระทบจิตใจญาติ (AI Trigger-Word & Phrasing Polisher)
         */
        function detectTriggerPhrases(text, lang = 'th') {
            const raw = String(text || '').trim();
            if (!raw) return [];
            const rules = TRIGGER_PHRASE_DICTIONARY.filter(r => r.lang === lang);
            const hits = [];
            rules.forEach(rule => {
                const match = raw.match(rule.pattern);
                if (match) {
                    hits.push({
                        ...rule,
                        matchedWord: match[0]
                    });
                }
            });
            return hits;
        }

        /**
         * วิเคราะห์การใช้ภาษาถนอมใจตลอดทั้งบทสนทนาสำหรับหน้าสรุปผล (Debrief)
         */
        function analyzeLanguagePolish(chatLog, lang = 'th') {
            const userMsgs = (chatLog || []).filter(m => m.sender === 'user');
            const findings = [];
            userMsgs.forEach((m, idx) => {
                const hits = detectTriggerPhrases(m.text, lang);
                hits.forEach(h => {
                    findings.push({
                        turnNumber: idx + 1,
                        originalText: m.text,
                        matchedWord: h.matchedWord,
                        flagged: h.flagged,
                        softer: h.softer,
                        reason: h.reason
                    });
                });
            });
            return {
                clean: findings.length === 0,
                count: findings.length,
                findings
            };
        }

         * ประเมินสมรรถนะ 5 มิติ (สำหรับ Radar Chart, 3D Skill Card และหน้าผู้บริหาร)
         */
        function evaluateFiveDimensions(chatLog, mode, silenceBonusCount, vocalCalmAvg) {
            const isEn = mode.language === 'en';
            const userMsgs = chatLog.filter(m => m.sender === 'user');
            const userTexts = userMsgs.map(m => m.text || '').join(' ').toLowerCase();
            const languagePolish = analyzeLanguagePolish(chatLog, isEn ? 'en' : 'th');

            const setting = Math.min(98, 66 + (userTexts.match(/แนะนำ|ชื่อ|พยาบาล|เจ้าหน้าที่|ผู้ประสาน|ส่วนตัว|เงียบ|พื้นที่|name|nurse|coordinator|staff|private|quiet/) ? 26 : 6) + (userMsgs.length >= 2 ? 4 : 0));
            const empathyBase = 64 + (userTexts.match(/เสียใจ|เข้าใจ|ตกใจ|เจ็บปวด|สับสน|ทำใจยาก|ห่วง|sorry|understand|heartbreaking|overwhelming|painful/) ? 24 : 6) + (userTexts.match(/ค่อยๆ|รับฟัง|อยู่ตรงนี้|สบายใจ|gently|listen|here with you|calm/) ? 8 : 0);
            const empathy = Math.max(52, Math.min(98, empathyBase - Math.min(10, languagePolish.count * 4)));
            const clarity = Math.min(98, 64 + (userTexts.match(/สมองตาย|ก้านสมอง|เครื่องช่วยหายใจ|ยาพยุง|ถาวร|หยุดทำงาน|สภากาชาด|odc|ทานบารมี|brain death|brainstem|ventilator|medication|permanent|red cross|transparent/) ? 28 : 6) + (userMsgs.length >= 2 ? 4 : 0));
            const vocal = Math.min(98, Math.max(66, Math.round((vocalCalmAvg || 82) + Math.min(14, silenceBonusCount * 7))));
            const dignity = Math.min(98, 66 + (userTexts.match(/ประณีต|ให้เกียรติ|เย็บแผล|ตกแต่ง|ไม่รีบ|ปรึกษา|ตัดสินใจ|ไม่ฝืน|dignity|respect|neatly|peaceful|no rush|time|decide|never force/) ? 26 : 8));

            const infoScore = Math.round((setting + clarity + dignity) / 3);
            const empathyScore = Math.round((empathy + vocal) / 2);
            const totalScore = Math.round((setting + empathy + clarity + vocal + dignity) / 5);
            const passed = totalScore >= 60;

            const rank = totalScore >= 90
                ? 'MASTER COORDINATOR'
                : totalScore >= 80
                    ? 'EMPATHY SPECIALIST'
                    : totalScore >= 70
                        ? 'CLINICAL COMMUNICATOR'
                        : 'RISING PRACTITIONER';

            const infoFeedback = [
                setting >= 85
                    ? (isEn ? 'Established calm private presence and clear clinical role.' : 'เปิดบทบาทผู้ให้ข้อมูลและสร้างพื้นที่ปลอดภัยที่เป็นส่วนตัวได้ดีมาก')
                    : (isEn ? 'Tip: Introduce your name & role explicitly at the start.' : 'คำแนะนำ: เริ่มต้นด้วยการแนะนำชื่อ-บทบาทของคุณอย่างชัดเจนและอบอุ่น'),
                clarity >= 85
                    ? (isEn ? 'Delivered accurate, reassuring clinical and ethical facts clearly.' : 'ให้ข้อมูลทางการแพทย์และข้อเท็จจริงได้ชัดเจน ตรงประเด็น และน่าเชื่อถือ')
                    : (isEn ? 'Tip: Clarify clinical facts (ventilator/brain death, ODC fairness, or dignified care) gently.' : 'คำแนะนำ: อธิบายข้อเท็จจริงให้ชัดเจนขึ้น เช่น เครื่องช่วยหายใจกับสมองตาย, ความโปร่งใส ODC หรือการดูแลตกแต่งร่าง')
            ];

            const empathyFeedback = [
                empathy >= 85
                    ? (isEn ? 'Validated grief and shock with genuine warmth.' : 'รับรู้และสะท้อนความเสียใจ-ความสับสนของญาติได้อย่างอบอุ่น')
                    : (isEn ? 'Tip: Reflect the relative’s grief before sharing clinical facts.' : 'คำแนะนำ: สะท้อนความเสียใจของญาติก่อนอธิบายข้อมูลทางการแพทย์'),
                silenceBonusCount > 0
                    ? (isEn ? `Used Therapeutic Silence (${silenceBonusCount}×) to hold emotional space.` : `ใช้จังหวะหยุดเงียบเพื่อเยียวยา (Therapeutic Silence) ได้ยอดเยี่ยม ${silenceBonusCount} ครั้ง`)
                    : (isEn ? 'Tip: Pause 2.5 seconds after emotional moments before speaking.' : 'คำแนะนำ: ลองเว้นจังหวะเงียบ 2.5 วินาทีหลังญาติระบายอารมณ์ เพื่อรับโบนัส Therapeutic Silence')
            ];

            return {
                totalScore,
                infoScore,
                empathyScore,
                passed,
                rank,
                silenceBonusCount,
                languagePolish,
                radar: [
                    { key: 'setting', labelTH: 'พื้นที่ส่วนตัว & บทบาท', labelEN: 'Setting & Role', value: setting },
                    { key: 'empathy', labelTH: 'รับรู้อารมณ์ร่วม', labelEN: 'Empathy', value: empathy },
                    { key: 'clarity', labelTH: 'ข้อมูลสมองตาย', labelEN: 'Clinical Facts', value: clarity },
                    { key: 'vocal', labelTH: 'น้ำเสียง & ความเงียบ', labelEN: 'Vocal & Silence', value: vocal },
                    { key: 'dignity', labelTH: 'ไม่เร่งรัด & เกียรติร่าง', labelEN: 'Dignity', value: dignity }
                ],
                infoFeedback,
                empathyFeedback
            };
        }

        // ============================================================================
        // 6. DEBRIEF VISUALIZATION: 5-AXIS RADAR, TIMELINE + TIME-REWIND, 3D HOLO CARD
        // ============================================================================
        function FiveAxisRadarSVG({ radar, isEn }) {
            const size = 240;
            const cx = size / 2;
            const cy = size / 2;
            const maxR = 76;
            const levels = [0.25, 0.5, 0.75, 1];

            const getPoint = (idx, ratio) => {
                const angle = (Math.PI * 2 * idx) / radar.length - Math.PI / 2;
                return [cx + Math.cos(angle) * maxR * ratio, cy + Math.sin(angle) * maxR * ratio];
            };

            const dataPoints = radar.map((item, i) => getPoint(i, (item.value || 0) / 100));
            const polyStr = dataPoints.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full max-w-[250px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="radarFillSkillLab" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.52" />
                            <stop offset="100%" stopColor="#22d3ee" stopOpacity="0.28" />
                        </linearGradient>
                    </defs>
                    {levels.map((lv, li) => {
                        const pts = radar.map((_, i) => getPoint(i, lv).join(',')).join(' ');
                        return <polygon key={li} points={pts} fill="none" stroke="rgba(148,163,184,0.22)" strokeWidth="1" />;
                    })}
                    {radar.map((_, i) => {
                        const [x, y] = getPoint(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(148,163,184,0.2)" strokeWidth="1" />;
                    })}
                    <polygon points={polyStr} fill="url(#radarFillSkillLab)" stroke="#34d399" strokeWidth="2" />
                    {dataPoints.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.6" fill="#67e8f9" stroke="#030712" strokeWidth="1.5" />
                    ))}
                    {radar.map((item, i) => {
                        const [lx, ly] = getPoint(i, 1.32);
                        return (
                            <g key={item.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill="#cbd5e1" fontSize="9.5" fontFamily="Sarabun, sans-serif" fontWeight="700">
                                    {isEn ? item.labelEN : item.labelTH}
                                </text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill="#6ee7b7" fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">
                                    {item.value}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

        function HolographicSkillCard({ evalResult, user, isEn, onExportPng }) {
            const cardRef = useRef(null);
            const [tilt, setTilt] = useState({ rx: 0, ry: 0, mx: 50, my: 50 });

            const applyCoords = (clientX, clientY) => {
                const el = cardRef.current;
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const px = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const py = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
                setTilt({
                    rx: (0.5 - py) * 18,
                    ry: (px - 0.5) * 20,
                    mx: Math.round(px * 100),
                    my: Math.round(py * 100)
                });
            };

            useEffect(() => {
                const onOrient = (e) => {
                    if (typeof e.beta !== 'number' || typeof e.gamma !== 'number') return;
                    const rx = Math.max(-12, Math.min(12, (e.beta - 45) * 0.25));
                    const ry = Math.max(-14, Math.min(14, e.gamma * 0.35));
                    setTilt({ rx, ry, mx: 50 + ry * 2.5, my: 50 - rx * 2.5 });
                };
                window.addEventListener('deviceorientation', onOrient);
                return () => window.removeEventListener('deviceorientation', onOrient);
            }, []);

            return (
                <div className="holo-card-wrapper w-full">
                    <div
                        ref={cardRef}
                        onMouseMove={(e) => applyCoords(e.clientX, e.clientY)}
                        onMouseLeave={() => setTilt({ rx: 0, ry: 0, mx: 50, my: 50 })}
                        onTouchMove={(e) => { if (e.touches[0]) applyCoords(e.touches[0].clientX, e.touches[0].clientY); }}
                        onTouchEnd={() => setTilt({ rx: 0, ry: 0, mx: 50, my: 50 })}
                        style={{
                            transform: `rotateX(${tilt.rx.toFixed(2)}deg) rotateY(${tilt.ry.toFixed(2)}deg)`,
                            '--mx': `${tilt.mx}%`,
                            '--my': `${tilt.my}%`
                        }}
                        className="holo-card-surface keep-dark relative rounded-[2rem] overflow-hidden border border-aurora-400/40 bg-gradient-to-br from-[#0b1730] via-[#071124] to-[#041d22] p-5 sm:p-6 shadow-[0_30px_70px_-15px_rgba(16,185,129,0.28)]"
                    >
                        <div className="absolute inset-0 holo-foil-overlay" />
                        <div
                            className="absolute inset-0 opacity-20 pointer-events-none"
                            style={{
                                backgroundImage: 'repeating-linear-gradient(125deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 1px, transparent 1px, transparent 10px)'
                            }}
                        />

                        <div className="relative z-10 space-y-4">
                            <div className="flex items-start justify-between gap-2">
                                <div>
                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-aurora-500/20 border border-aurora-400/40 text-aurora-200 font-mono text-[10px] font-bold">
                                        <Icon name="Sparkles" size={11} /> AI SKILL LAB COMPETENCY CARD
                                    </span>
                                    <h3 className="font-display font-extrabold text-lg sm:text-xl text-white mt-1.5">
                                        {evalResult.rank}
                                    </h3>
                                    <p className="text-xs text-slate-300 truncate">{user?.name} • {user?.hospital}</p>
                                </div>
                                <div className="text-right px-3.5 py-2 rounded-2xl bg-void-950/70 border border-white/15 shrink-0">
                                    <p className="font-mono text-[9px] text-slate-400 uppercase">Empathy Index</p>
                                    <p className="font-mono text-3xl font-extrabold text-aurora-300 leading-none mt-0.5">
                                        {evalResult.totalScore}
                                    </p>
                                </div>
                            </div>

                            <div className="py-1">
                                <FiveAxisRadarSVG radar={evalResult.radar} isEn={isEn} />
                            </div>

                            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-white/10">
                                <div className="text-[10px] font-mono text-slate-400">
                                    <span>rjcloud.organ • AI SKILL LAB</span>
                                    <span className="block text-prism-300">
                                        {isEn ? 'Tilt card with mouse/finger' : 'เลื่อนเมาส์หรือเอียงมือถือเพื่อชมแสงโฮโลแกรม'}
                                    </span>
                                </div>
                                <button
                                    type="button"
                                    onClick={onExportPng}
                                    className="px-3.5 py-2 rounded-xl bg-aurora-500 hover:bg-aurora-400 text-void-950 font-display font-bold text-xs flex items-center gap-1.5 shadow-lg active:scale-95"
                                >
                                    <Icon name="Download" size={14} /> {isEn ? 'Save PNG' : 'บันทึกการ์ด PNG'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function EmotionalJourneyTimeline({ timeline, selectedIdx, onSelectIdx, onRewindToTurn, onPlayMasterVoice, isEn }) {
            if (!timeline || timeline.length === 0) return null;

            const W = 560, H = 160, padX = 34, padY = 22;
            const stepX = timeline.length > 1 ? (W - padX * 2) / (timeline.length - 1) : 0;
            const toY = (val) => padY + ((100 - Math.max(0, Math.min(100, val))) / 100) * (H - padY * 2);

            const buildPath = (key) => timeline.map((pt, i) => {
                const x = timeline.length > 1 ? padX + i * stepX : W / 2;
                const y = toY(pt[key]);
                return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
            }).join(' ');

            const selectedPoint = timeline[selectedIdx] || timeline[timeline.length - 1];
            const emo = EMOTION_PHYSICS[selectedPoint.emotion] || EMOTION_PHYSICS.CONFUSED;

            return (
                <div className="vision-glass rounded-[1.75rem] p-4 sm:p-6 space-y-4 border-prism-400/25">
                    <div className="flex flex-wrap items-center justify-between gap-2">

                            <span className="font-mono text-[10px] font-bold text-prism-300 uppercase">
                                AFFECTIVE TIMELINE & TIME-REWIND ENGINE
                            </span>
                            <h3 className="font-display font-bold text-base sm:text-lg text-white">
                                {isEn ? 'Emotional Journey & Turning Points' : 'เส้นทางอารมณ์ญาติ & จุดเปลี่ยนสำคัญ'}
                            </h3>
                        </div>
                        <div className="flex items-center gap-3 text-[11px] font-bold">
                            <span className="flex items-center gap-1.5 text-aurora-300">
                                <span className="w-2.5 h-2.5 rounded-full bg-aurora-400" /> {isEn ? 'Trust' : 'ความไว้วางใจ'}
                            </span>
                            <span className="flex items-center gap-1.5 text-rose-300">
                                <span className="w-2.5 h-2.5 rounded-full bg-rose-400" /> {isEn ? 'Tension' : 'ความตึงเครียด'}
                            </span>
                        </div>
                    </div>

                    <div className="w-full rounded-2xl bg-void-950/70 border border-white/10 p-2 overflow-hidden">
                        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block">
                            {[25, 50, 75].map(v => (
                                <line key={v} x1={padX} y1={toY(v)} x2={W - padX} y2={toY(v)} stroke="rgba(148,163,184,0.12)" strokeDasharray="4 4" />
                            ))}
                            <path d={buildPath('tension')} fill="none" stroke="#fb7185" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                            <path d={buildPath('trust')} fill="none" stroke="#34d399" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />

                            {timeline.map((pt, i) => {
                                const x = timeline.length > 1 ? padX + i * stepX : W / 2;
                                const yTrust = toY(pt.trust);
                                const isSel = i === selectedIdx;
                                return (
                                    <g key={pt.id} onClick={() => onSelectIdx(i)} className="cursor-pointer">
                                        {isSel && <circle cx={x} cy={yTrust} r="12" fill="rgba(52,211,153,0.22)" />}
                                        <circle
                                            cx={x}
                                            cy={yTrust}
                                            r={isSel ? 6.5 : 5}
                                            fill={pt.deltaTrust >= 0 ? '#34d399' : '#fb7185'}
                                            stroke="#030712"
                                            strokeWidth="2"
                                        />
                                        <text x={x} y={H - 5} textAnchor="middle" fill={isSel ? '#6ee7b7' : '#94a3b8'} fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">
                                            T{i + 1}
                                        </text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>

                    <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10 space-y-3">
                        <div className="flex flex-wrap items-center justify-between gap-2">

                                    {isEn ? emo.labelEN : emo.labelTH}
                                </span>
                                <span className={`font-mono text-xs font-bold ${selectedPoint.deltaTrust >= 0 ? 'text-aurora-300' : 'text-rose-300'}`}>
                                    Trust {selectedPoint.deltaTrust >= 0 ? `+${selectedPoint.deltaTrust}` : selectedPoint.deltaTrust}%
                                </span>
                            </div>
                        </div>

                        <div className="space-y-2 text-xs sm:text-sm">
                            <div className="p-3 rounded-xl bg-aurora-500/10 border border-aurora-400/20">
                                <p className="text-[10px] font-bold text-aurora-300 mb-0.5">{isEn ? 'What you said:' : 'คำพูดของคุณในจังหวะนี้:'}</p>

                            </button>
                            <button
                                type="button"
                                onClick={() => onPlayMasterVoice(getMasterExampleForEmotion(selectedPoint.emotion, isEn))}
                                className="touch-target flex-1 py-2.5 px-4 rounded-xl bg-prism-500/20 hover:bg-prism-500/30 border border-prism-400/40 text-prism-200 font-display font-bold text-xs flex items-center justify-center gap-1.5 transition-colors"
                            >
                                <Icon name="Volume2" size={15} />
                                {isEn ? 'Hear Master Coordinator Phrase' : 'ฟังแนวทางเสียง Master Coordinator'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function downloadHolographicCardPng(evalResult, user, isEn) {
            const canvas = document.createElement('canvas');
            const W = 1200, H = 760;
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#030712');
            bg.addColorStop(0.5, '#09162e');
            bg.addColorStop(1, '#042429');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            const g1 = ctx.createRadialGradient(260, 180, 20, 260, 180, 420);
            g1.addColorStop(0, 'rgba(16, 185, 129, 0.28)');
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, W, H);

            const g2 = ctx.createRadialGradient(940, 560, 20, 940, 560, 400);
            g2.addColorStop(0, 'rgba(34, 211, 238, 0.25)');
            g2.addColorStop(1, 'transparent');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(52, 211, 153, 0.55)';
            ctx.lineWidth = 4;
            ctx.strokeRect(28, 28, W - 56, H - 56);

            ctx.fillStyle = '#6ee7b7';
            ctx.font = '700 20px "JetBrains Mono", monospace';
            ctx.fillText('RJCLOUD.ORGAN • AI SKILL LAB', 76, 98);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 46px "Prompt", sans-serif';
            ctx.fillText(evalResult.rank, 76, 166);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '600 28px "Sarabun", sans-serif';
            ctx.fillText(user?.name || 'Clinical Communicator', 76, 224);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 22px "Sarabun", sans-serif';
            ctx.fillText(user?.hospital || 'rjcloud.organ Network', 76, 262);

            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.fillRect(76, 310, 430, 150);
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 2;
            ctx.strokeRect(76, 310, 430, 150);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 18px "JetBrains Mono", monospace';
            ctx.fillText('OVERALL EMPATHY INDEX', 106, 355);

            ctx.fillStyle = '#34d399';
            ctx.font = '800 72px "JetBrains Mono", monospace';
            ctx.fillText(`${evalResult.totalScore}`, 106, 434);
            ctx.fillStyle = '#64748b';
            ctx.font = '700 28px "JetBrains Mono", monospace';
            ctx.fillText('/100', 228, 434);

            ctx.font = '600 21px "Sarabun", sans-serif';
            evalResult.radar.forEach((r, idx) => {
                const y = 515 + idx * 38;
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText(isEn ? r.labelEN : r.labelTH, 76, y);
                ctx.fillStyle = '#67e8f9';
                ctx.font = '700 21px "JetBrains Mono", monospace';
                ctx.fillText(`${r.value}/100`, 390, y);
                ctx.font = '600 21px "Sarabun", sans-serif';
            });

            const rcx = 860, rcy = 385, maxR = 195;
            const pt = (idx, ratio) => {
                const a = (Math.PI * 2 * idx) / evalResult.radar.length - Math.PI / 2;
                return [rcx + Math.cos(a) * maxR * ratio, rcy + Math.sin(a) * maxR * ratio];
            };

            [0.25, 0.5, 0.75, 1].forEach(lv => {
                ctx.beginPath();
                evalResult.radar.forEach((_, i) => {
                    const [x, y] = pt(i, lv);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.strokeStyle = 'rgba(148,163,184,0.28)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            ctx.beginPath();
            evalResult.radar.forEach((item, i) => {
                const [x, y] = pt(i, item.value / 100);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.34)';
            ctx.fill();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            ctx.textAlign = 'center';
            evalResult.radar.forEach((item, i) => {
                const [x, y] = pt(i, item.value / 100);
                ctx.beginPath();
                ctx.arc(x, y, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#67e8f9';
                ctx.fill();

                const [lx, ly] = pt(i, 1.24);
                ctx.fillStyle = '#e2e8f0';
                ctx.font = '700 18px "Sarabun", sans-serif';
                ctx.fillText(isEn ? item.labelEN : item.labelTH, lx, ly);
            });

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png', 1.0);
            link.download = `AI_SkillLab_Card_${evalResult.totalScore}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
