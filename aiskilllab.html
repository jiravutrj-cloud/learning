    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        const src = String(ev.filename || (ev.target && ev.target.src) || '');

        const root = document.getElementById('skilllab-root');
        if (root && !root.dataset.mounted && ev.message) {
          const safeMsg = String(ev.message || 'Unknown error').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            function mountHologram3D(container, initialState) {
                const THREE = window.THREE;

                let renderer = null;
                try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
                catch (_) { return { update() {}, destroy() {} }; }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

                    for (let i = 0; i < cnt; i++) {
                        const piv = new THREE.Group();
                        piv.rotation.y = (i / cnt) * Math.PI * 2 + ring * 0.3;
                        const mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: ring === 0 ? 0.34 : 0.22, wireframe: ring === 1 });

                        petals.push({ mesh: m, mat, ring, idx: i });
                    }
                }
                const lotusCoreMat = new THREE.MeshBasicMaterial({ color: 0x6ee7b7, transparent: true, opacity: 0.78 });

        function prepareSpeechText(raw, isEn = false) {
            let s = String(raw || '')
                .replace(/\[(ภรรยา|คุณแม่|Wife|Mother|EMOTION|ACTION|COACH|OUTCOME)[^\]]*\]\s*:?/gi, '')
                .replace(/[*#_]/g, ' ')
                .replace(/\s{2,}/g, ' ')
                .trim();
            if (!isEn && typeof CORE.prepareNaturalThaiSpeech === 'function') s = CORE.prepareNaturalThaiSpeech(s);
            return s;
        }

        function pcmToWavBlobSafe(base64PCM, sampleRate = 24000) {
            try {
                if (typeof CORE.pcm16ToWavBlob === 'function') return CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                const bin = window.atob(base64PCM);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const off = (bytes.length > 44 && bytes[0] === 0x52 && bytes[1] === 0x49) ? 44 : 0;
                const pcmLen = Math.max(0, bytes.length - off);
                const buf = new ArrayBuffer(44 + pcmLen);
                const v = new DataView(buf);
                const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
                ws(0, 'RIFF'); v.setUint32(4, 36 + pcmLen, true); ws(8, 'WAVE'); ws(12, 'fmt ');
                v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
                v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
                v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, pcmLen, true);
                new Uint8Array(buf, 44).set(bytes.subarray(off));
                return new Blob([buf], { type: 'audio/wav' });
            } catch (_) { return null; }
        }

        function splitSpeechIntoNaturalChunks(rawText, isEn = false, maxChars = 185) {
            const clean = prepareSpeechText(rawText, isEn);
            if (!clean) return [];
            if (clean.length <= maxChars) return [clean];
            const marked = clean.replace(/([.!?。\n]|ค่ะ|ครับ)\s+/g, '$1\u0001');
            const pieces = marked.split('\u0001').map(s => s.trim()).filter(Boolean);
            const chunks = [];
            let buf = '';
            pieces.forEach((p) => {
                if ((buf + ' ' + p).trim().length <= maxChars) buf = (buf ? `${buf} ${p}` : p).trim();
                else { if (buf) chunks.push(buf); buf = p.trim(); }
            });
            if (buf) chunks.push(buf);
            return chunks.filter(Boolean);
        }

        async function fetchStudioTtsBlob({ appsScriptUrl, text, voiceName, languageCode, style, signal, cacheKey = '' }) {
            if (cacheKey && typeof CORE.getCachedAudio === 'function') {
                try { const hit = await CORE.getCachedAudio(cacheKey); if (hit && hit.size > 0) return hit; } catch (_) {}
            }
            if (!appsScriptUrl || !navigator.onLine) return null;
            for (let attempt = 0; attempt < 2; attempt++) {
                if (signal && signal.aborted) return null;
                const ctrl = new AbortController();
                const onExtAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onExtAbort, { once: true });
                const tm = setTimeout(() => ctrl.abort(), 45000);
                try {
                    const rawRes = await fetch(appsScriptUrl, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'callGeminiTTS', text, voiceName: voiceName || 'Sulafat', languageCode: languageCode || 'th-TH', style }),
                        signal: ctrl.signal
                    });
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onExtAbort);
                    if (signal && signal.aborted) return null;
                    const res = JSON.parse((await rawRes.text()) || '{}');
                    if (res?.status === 'success' && res.inlineData?.data) {
                        const matchRate = String(res.inlineData.mimeType || '').match(/rate=(\d+)/);
                        const blob = pcmToWavBlobSafe(res.inlineData.data, parseInt(matchRate ? matchRate[1] : '24000', 10));
                        if (blob && blob.size > 0) {
                            if (cacheKey && typeof CORE.setCachedAudio === 'function') CORE.setCachedAudio(cacheKey, blob).catch(() => {});
                            return blob;
                        }
                    }
                } catch (_) {
                    clearTimeout(tm);
                    if (signal) signal.removeEventListener('abort', onExtAbort);
                }
                if (attempt === 0 && !(signal && signal.aborted)) await new Promise(r => setTimeout(r, 1100));
            }
            return null;
        }

        async function callGeminiText(appsScriptUrl, prompt, systemInstruction, timeoutMs = 18000) {
            if (!appsScriptUrl || !navigator.onLine) return null;
            const ctrl = new AbortController();
            const tm = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const rawRes = await fetch(appsScriptUrl, {
                    method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'callGemini', prompt, systemInstruction }),
                    signal: ctrl.signal
                });
                clearTimeout(tm);
                const res = JSON.parse((await rawRes.text()) || '{}');
                return res?.status === 'success' && res.text ? res.text : null;
            } catch (_) { clearTimeout(tm); return null; }
        }

        function FiveAxisRadarSVG({ radarArr, theme }) {
            const isDark = theme === 'dark';
            const axes = SL.RADAR_AXES || [
                { key: 'setting', shortTH: 'ห้องรับรอง' },
                { key: 'empathy', shortTH: 'อารมณ์ร่วม' },
                { key: 'clarity', shortTH: 'ข้อมูลคลินิก' },
                { key: 'vocal', shortTH: 'ความเงียบ 2.5 วิ' },
                { key: 'dignity', shortTH: 'ให้เกียรติร่าง' }
            ];
            const valMap = {};
            (radarArr || []).forEach(r => { if (r && r.key) valMap[r.key] = Number(r.value || 0); });
            const w = 300, h = 250, cx = w / 2, cy = h / 2, maxR = 72;
            const pt = (i, ratio) => {
                const a = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
                return [cx + Math.cos(a) * maxR * ratio, cy + Math.sin(a) * maxR * ratio];
            };
            const dataPts = axes.map((ax, i) => pt(i, Math.max(0, Math.min(100, valMap[ax.key] || 0)) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[300px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="labRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.48" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.22" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={axes.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {axes.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.2)' : 'rgba(15,58,125,0.14)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#labRadarFill)" stroke="#34d399" strokeWidth="2.4" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.8" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.5" />
                    ))}
                    {axes.map((ax, i) => {
                        const [lx, ly] = pt(i, 1.35);
                        return (
                            <g key={ax.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.5" fontWeight="700">{ax.shortTH}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10.5" fontFamily="JetBrains Mono, monospace" fontWeight="700">{valMap[ax.key] || 0}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

                }
                const onOn = () => setIsOnline(true);
                const onOff = () => setIsOnline(false);
                window.addEventListener('online', onOn);
                window.addEventListener('offline', onOff);
                return () => { window.removeEventListener('online', onOn); window.removeEventListener('offline', onOff); };
            }, []);

            // Firebase Auth + Settings Sync
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) return;
                let active = true;
                let unsubSettings = null;
                const unsubAuth = onAuthStateChanged(fbAuth, async (fbUser) => {
                    if (!active) return;
                    if (!fbUser && !isAdminPreview) {
                        try { await signInAnonymously(fbAuth); } catch (_) {}
                        return;
                    }
                    if (unsubSettings) unsubSettings();
                    unsubSettings = onSnapshot(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'), (snap) => {
                        if (snap.exists() && snap.data()?.appsScriptUrl) setAppsScriptUrl(snap.data().appsScriptUrl);
                    }, () => {});
                });
                return () => { active = false; unsubAuth(); if (unsubSettings) unsubSettings(); };
            }, [isAdminPreview]);

            // 15s Calm Breather Countdown
            useEffect(() => {
                if (calmSeconds <= 0) return;
                const t = setTimeout(() => setCalmSeconds(s => Math.max(0, s - 1)), 1000);
                return () => clearTimeout(t);
            }, [calmSeconds]);

            // Mount Three.js 3D Hologram in Phase 3 (Consultation Room)
            useEffect(() => {
                if (phase !== 'negotiating' || !stageContainerRef.current || typeof SL.mountHologram3D !== 'function') return;
                const ctrl = SL.mountHologram3D(stageContainerRef.current, {
                    style: holoStyle, emotion: currentEmotion, trust: trustScore, isSpeaking, activeSpeaker: activeSpeakerKey
                });
                holoControllerRef.current = ctrl;
                return () => {
                    try { ctrl.destroy(); } catch (_) {}
                    holoControllerRef.current = null;
                };
            }, [phase]);

            useEffect(() => {
                if (holoControllerRef.current) {
                    holoControllerRef.current.update({
                        style: holoStyle, emotion: currentEmotion, trust: trustScore, isSpeaking, activeSpeaker: activeSpeakerKey
                    });
                }
            }, [holoStyle, currentEmotion, trustScore, isSpeaking, activeSpeakerKey]);

            // Sync Room Ambient Audio
            useEffect(() => {
                if (SL.SoundFX) SL.SoundFX.setAmbient(phase === 'negotiating' && ambientOn);
                return () => { if (SL.SoundFX) SL.SoundFX.setAmbient(false); };
            }, [phase, ambientOn]);

            // Cleanup RAM-only recorded clips on unmount
            const recordedClipsRef = useRef([]);
            useEffect(() => { recordedClipsRef.current = recordedVoiceClips; }, [recordedVoiceClips]);
            useEffect(() => () => {
                recordedClipsRef.current.forEach(c => { if (c?.audioUrl) { try { URL.revokeObjectURL(c.audioUrl); } catch (_) {} } });
            }, []);

            // ============================================================================
            // 6. STUDIO 24kHz AI VOICE CONTROLLERS (AUTO-PLAY + REPLAY • NO SUBTITLES)
            // ============================================================================
            const unlockMobileAudio = useCallback(() => {
                try {
                    if (!sharedAudioRef.current) {
                        const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', ''); a.preload = 'auto';
                        sharedAudioRef.current = a;
                    }
                    const a = sharedAudioRef.current;
                    if (a.paused && !a.src) {
                        a.muted = true; a.src = SILENT_UNLOCK_WAV;
                        const p = a.play();
                        if (p && typeof p.then === 'function') p.then(() => { try { a.pause(); a.currentTime = 0; } catch (_) {} a.muted = false; }).catch(() => { a.muted = false; });
                        else a.muted = false;
                    }
                } catch (_) {}
            }, []);

            const stopAiVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (voiceAbortRef.current) { try { voiceAbortRef.current.abort(); } catch (_) {} voiceAbortRef.current = null; }
                setAudioBlockedRetry(null);
                if (sharedAudioRef.current) {
                    try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {}
                }
                if (activeAudioUrlRef.current) { try { URL.revokeObjectURL(activeAudioUrlRef.current); } catch (_) {} activeAudioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setIsSpeaking(false);
                setVoiceStatus({ phase: 'idle', chunkIdx: 0, totalChunks: 0 });
            }, []);

            const stopGuideVoice = useCallback(() => {
                guideSessionRef.current += 1;
                if (guideAbortRef.current) { try { guideAbortRef.current.abort(); } catch (_) {} guideAbortRef.current = null; }
                if (sharedAudioRef.current) {
                    try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {}
                }
                if (guideAudioUrlRef.current) { try { URL.revokeObjectURL(guideAudioUrlRef.current); } catch (_) {} guideAudioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setGuideVoiceState({ activeKey: '', status: 'idle' });
            }, []);

            useEffect(() => () => { stopAiVoice(); stopGuideVoice(); }, [stopAiVoice, stopGuideVoice]);

            const playGuideVoice = useCallback(async (key, rawText, cacheKeyBase = '', options = {}) => {
                const { silentFail = false } = options || {};
                if (guideVoiceState.activeKey === key && guideVoiceState.status !== 'idle') {
                    stopGuideVoice();
                    return;
                }
                unlockMobileAudio();
                stopAiVoice();
                stopGuideVoice();

                const sid = guideSessionRef.current;
                const chunks = splitSpeechIntoNaturalChunks(rawText, false, 185);
                if (chunks.length === 0) return;

                const ctrl = new AbortController();
                guideAbortRef.current = ctrl;
                if (!sharedAudioRef.current) {
                    const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', '');
                    sharedAudioRef.current = a;
                }
                const style = 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ เป็นมิตรเหมือนอาจารย์ผู้ช่วยดูแลผู้เรียน';

                setGuideVoiceState({ activeKey: key, status: 'loading' });
                let currentPromise = fetchStudioTtsBlob({
                    appsScriptUrl, text: chunks[0], voiceName: 'Sulafat', languageCode: 'th-TH', style,
                    signal: ctrl.signal, cacheKey: cacheKeyBase ? `${cacheKeyBase}_c0` : ''
                });
                let playedAny = false;

                for (let i = 0; i < chunks.length; i++) {
                    if (guideSessionRef.current !== sid || ctrl.signal.aborted) return;
                    setGuideVoiceState({ activeKey: key, status: 'loading' });
                    const blob = await currentPromise;
                    if (guideSessionRef.current !== sid || ctrl.signal.aborted) return;

                    currentPromise = (i + 1 < chunks.length)
                        ? fetchStudioTtsBlob({
                            appsScriptUrl, text: chunks[i + 1], voiceName: 'Sulafat', languageCode: 'th-TH', style,
                            signal: ctrl.signal, cacheKey: cacheKeyBase ? `${cacheKeyBase}_c${i + 1}` : ''
                        })
                        : null;

                    if (!blob || blob.size === 0) {
                        if (!playedAny && !silentFail) {
                            showToast(navigator.onLine ? 'เซิร์ฟเวอร์เสียง AI กำลังใช้งานหนาแน่น กรุณากดฟังใหม่อีกครั้งค่ะ' : 'ขณะนี้ออฟไลน์และยังไม่มีไฟล์เสียง AI แคชไว้ในเครื่องค่ะ', 'info');
                        }
                        break;
                    }
                    playedAny = true;
                    setGuideVoiceState({ activeKey: key, status: 'speaking' });
                    if (guideAudioUrlRef.current) { try { URL.revokeObjectURL(guideAudioUrlRef.current); } catch (_) {} }
                    const url = URL.createObjectURL(blob);
                    guideAudioUrlRef.current = url;

                    const ok = await new Promise((resolve) => {
                        const a = sharedAudioRef.current;
                        a.muted = false; a.src = url;
                        a.onended = () => resolve(true);
                        a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });
                    if (!ok || guideSessionRef.current !== sid) break;
                }
                if (guideSessionRef.current === sid) stopGuideVoice();
            }, [guideVoiceState, stopGuideVoice, unlockMobileAudio, stopAiVoice, appsScriptUrl, showToast]);

            // เสียง AI แนะนำอัตโนมัติ + ปุ่มฟังย้อนหลังครบทุกขั้นตอนใน AI Skill Lab (Lobby, Briefing, Result)
            const phaseVoiceGuide = useMemo(() => {
                if (phase === 'lobby') {
                    return {
                        key: 'skilllab_guide_lobby',
                        text: 'ยินดีต้อนรับสู่ห้องฝึกสื่อสารสามมิติ เอไอสกิลแล็บ ค่ะ ท่านสามารถทดลองหมุนดูตัวอย่างโฮโลแกรมทั้งหกสไตล์ เลือกรูปแบบการฝึก และเลือกสถานการณ์คลินิกที่ต้องการ แล้วกดปุ่มเปิดแฟ้มส่งเวรด้านล่างได้เลยค่ะ'
                    };
                }
                if (phase === 'briefing') {
                    return {
                        key: 'skilllab_guide_briefing',
                        text: 'ขั้นตอนอ่านแฟ้มส่งเวรไอซียูค่ะ กรุณาอ่านข้อมูลผู้ป่วย ประเมินระดับความมั่นใจก่อนฝึกทั้งสามข้อ จากนั้นกดเคาะประตูเพื่อเข้าห้องให้คำปรึกษาค่ะ'
                    };
                }
                if (phase === 'result') {
                    return {
                        key: 'skilllab_guide_result',
                        text: 'เสร็จสิ้นการฝึกสื่อสารแล้วค่ะ สามารถดูคะแนนเรดาร์ห้าแกน อ่านประโยคทองและจุดที่ควรเกลา ฟังเสียงตัวเองย้อนหลัง และบันทึกความมั่นใจหลังฝึกเพื่อกลับสู่ห้องเรียนหลักได้เลยค่ะ'
                    };
                }
                return null;
            }, [phase]);

            useEffect(() => {
                if (!phaseVoiceGuide || isAdminPreview) return;
                if (autoPlayedPhasesRef.current.has(phaseVoiceGuide.key)) return;
                autoPlayedPhasesRef.current.add(phaseVoiceGuide.key);
                const tm = setTimeout(() => {
                    playGuideVoice(phaseVoiceGuide.key, phaseVoiceGuide.text, phaseVoiceGuide.key, { silentFail: true });
                }, 480);
                return () => clearTimeout(tm);
            }, [phaseVoiceGuide, isAdminPreview, playGuideVoice]);

            const handleReplayPhaseGuide = useCallback(() => {
                if (!phaseVoiceGuide) return;
                playGuideVoice(phaseVoiceGuide.key, phaseVoiceGuide.text, phaseVoiceGuide.key, { silentFail: false });
            }, [phaseVoiceGuide, playGuideVoice]);

            const handleSpeakAdvisor = useCallback(() => {
                const text = advisorReply || activeRec.speech;
                playGuideVoice('lab_advisor_voice', text, advisorReply ? '' : `lab_adv_hq_${advisorGoalId}`, { silentFail: false });
            }, [advisorReply, activeRec.speech, advisorGoalId, playGuideVoice]);

            const speakRelativeSegments = useCallback(async (rawText, emoKey, targetPersonaId) => {
                if (!voiceEnabled) {
                    silenceAnchorRef.current = Date.now();
                    silenceCountedRef.current = false;
                    return;
                }
                stopGuideVoice();
                stopAiVoice();
                const sid = voiceSessionRef.current;
                const rawSegments = SL.splitDualSpeakerSegments(rawText, targetPersonaId, isEn ? 'en' : 'th');
                if (rawSegments.length === 0) return;

                const playQueue = [];
                rawSegments.forEach((seg) => {
                    splitSpeechIntoNaturalChunks(seg.text, isEn, 185).forEach((chunkText) => {
                        playQueue.push({ speaker: seg.speaker, label: seg.label, voiceName: seg.voiceName || 'Sulafat', text: chunkText });
                    });
                });
                if (playQueue.length === 0) return;

                const emoMeta = EMOTIONS[emoKey] || EMOTIONS.CONFUSED || {};
                const ttsStyle = isEn ? emoMeta.ttsStyleEN : emoMeta.ttsStyleTH;
                const langCode = isEn ? 'en-US' : 'th-TH';

                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;
                if (!sharedAudioRef.current) {
                    const a = new Audio(); a.playsInline = true; a.setAttribute('playsinline', '');
                    sharedAudioRef.current = a;
                }

                setVoiceStatus({ phase: 'loading', chunkIdx: 1, totalChunks: playQueue.length });
                let currentPromise = fetchStudioTtsBlob({
                    appsScriptUrl, text: playQueue[0].text, voiceName: playQueue[0].voiceName, languageCode: langCode, style: ttsStyle, signal: ctrl.signal
                });
                let playedAny = false;

                for (let i = 0; i < playQueue.length; i++) {
                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                    const item = playQueue[i];
                    setActiveSpeakerBadge(item.label || 'ญาติผู้ป่วย');
                    setActiveSpeakerKey(item.speaker === 'mother' ? 'mother' : 'wife');
                    setIsSpeaking(false);
                    setVoiceStatus({ phase: 'loading', chunkIdx: i + 1, totalChunks: playQueue.length });

                    const blob = await currentPromise;
                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;

                    currentPromise = (i + 1 < playQueue.length)
                        ? fetchStudioTtsBlob({
                            appsScriptUrl, text: playQueue[i + 1].text, voiceName: playQueue[i + 1].voiceName, languageCode: langCode, style: ttsStyle, signal: ctrl.signal
                        })
                        : null;

                    if (!blob || blob.size === 0) {
                        if (!playedAny) showToast(navigator.onLine ? 'เซิร์ฟเวอร์เสียง AI กำลังใช้งานหนาแน่น แตะ “ฟังเสียงญาติซ้ำ” ได้เลยค่ะ' : 'ขณะนี้ออฟไลน์ (กดดูประวัติสนทนาได้ค่ะ)', 'info');
                        break;
                    }

                    if (activeAudioUrlRef.current) { try { URL.revokeObjectURL(activeAudioUrlRef.current); } catch (_) {} }
                    const wavUrl = URL.createObjectURL(blob);
                    activeAudioUrlRef.current = wavUrl;
                    playedAny = true;
                    setIsSpeaking(true);
                    setVoiceStatus({ phase: 'speaking', chunkIdx: i + 1, totalChunks: playQueue.length });

                    const outcome = await new Promise((resolve) => {
                        const a = sharedAudioRef.current;
                        a.muted = false; a.src = wavUrl;
                        a.onended = () => resolve('ok');
                        a.onerror = () => resolve('err');
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.then === 'function') {
                            p.catch((err) => resolve(err && (err.name === 'NotAllowedError' || /notallowed|autoplay|interact/i.test(String(err.message || ''))) ? 'blocked' : 'err'));
                        }
                    });

                    if (outcome === 'blocked' && voiceSessionRef.current === sid) {
                        setIsSpeaking(false);
                        setVoiceStatus({ phase: 'idle', chunkIdx: 0, totalChunks: 0 });
                        setAudioBlockedRetry({ rawText, emoKey, targetPersonaId });
                        return;
                    }
                    if (outcome !== 'ok' || voiceSessionRef.current !== sid) break;
                }

                if (voiceSessionRef.current === sid) {
                    setIsSpeaking(false);
                    setVoiceStatus({ phase: 'idle', chunkIdx: 0, totalChunks: 0 });
                    silenceAnchorRef.current = Date.now();
                    silenceCountedRef.current = false;
                }
            }, [voiceEnabled, stopGuideVoice, stopAiVoice, isEn, appsScriptUrl, EMOTIONS, showToast]);

            // ============================================================================
            // 7. ADVISOR, BRIEFING, CONVERSATION, MICRO-DRILL & EVALUATION HANDLERS
            // ============================================================================
            const handleApplyRec = () => {
                stopGuideVoice();
                if (activeRec.mode) setModeId(activeRec.mode);
                if (activeRec.difficulty) setDifficultyId(activeRec.difficulty);
                if (activeRec.personaId) setPersonaId(activeRec.personaId);
                if (activeRec.holoStyle) setHoloStyle(activeRec.holoStyle);
                showToast('ตั้งค่าห้องฝึกตามที่ AI แนะนำเรียบร้อยแล้วค่ะ กดเตรียมเข้าห้องได้เลย!');
            };

            const handleAskAdvisor = async (e, presetQ = null) => {
                if (e) e.preventDefault();
                const q = String(presetQ !== null ? presetQ : advisorQuestion).trim();
                if (!q || advisorAsking) return;
                setAdvisorQuestion('');
                setAdvisorAsking(true);
                const localReply = SL.answerAdvisorQuestion(q);
                const aiText = await callGeminiText(
                    appsScriptUrl,
                    `คำถามผู้เรียนเกี่ยวกับ AI Skill Lab: ${q}`,
                    'คุณคือ AI Lab Advisor ของ rjcloud.organ 2.0 ตอบสั้น กระชับ อบอุ่น 3-4 บรรทัดภาษาไทย',
                    12000
                );
                setAdvisorReply(aiText || localReply);
                setAdvisorAsking(false);
            };

            const handleKnockAndEnter = () => {
                unlockMobileAudio();
                stopGuideVoice();
                stopAiVoice();
                if (SL.SoundFX) SL.SoundFX.playDoorKnock();

                summarySyncedSessionRef.current = false;
                setPostEffSaved(false);
                setEvalResult(null);
                setSilenceCount(0);
                setTriggerTotal(0);
                setUsedCurveballIds([]);
                setActiveCurveball(null);
                setUnlockedBarrierIds([]);
                setLastTrustDelta(0);
                setPaceHint('');
                setLearnerCallName(String(user?.name || '').replace(/^(พว\.|นพ\.|พญ\.)/, '').trim());
                setRecordedVoiceClips(prev => {
                    prev.forEach(c => { if (c?.audioUrl) { try { URL.revokeObjectURL(c.audioUrl); } catch (_) {} } });
                    return [];
                });
                setShowSuggestions(difficultyId === 'normal');

                if (selectedMode.isDrill && DRILL_STAGES.length > 0) {
                    const firstStage = DRILL_STAGES[0];
                    setDrillStageIdx(0);
                    setDrillResults([]);
                    setLatestDrillFeedback(null);
                    setPersonaId(firstStage.personaId);
                    setCurrentEmotion(firstStage.emotion);
                    setCurrentActionCue(firstStage.actionTH);
                    setTrustScore(40);
                    setActiveSpeakerBadge(firstStage.badgeTH);
                    setMessages([{ id: Date.now(), role: 'relative', text: firstStage.promptTH, emotion: firstStage.emotion, actionCue: firstStage.actionTH }]);
                    setPhase('negotiating');
                    setTimeout(() => speakRelativeSegments(firstStage.promptTH, firstStage.emotion, firstStage.personaId), 420);
                    return;
                }

                const openEmo = activePersona.openingEmotion || 'CONFUSED';
                const openText = isEn ? activePersona.openingEN : activePersona.openingTH;
                const openAct = isEn ? activePersona.openingActionEN : activePersona.openingActionTH;
                setCurrentEmotion(openEmo);
                setCurrentActionCue(openAct || '');
                setCoachHint('');
                setTrustScore((EMOTIONS[openEmo] && EMOTIONS[openEmo].baseTrust) || 38);
                setActiveSpeakerBadge(activePersona.speakerRoleTH || 'ญาติผู้ป่วย');
                if (personaId === 'conflict') setHoloStyle('dual');

                setMessages([{ id: Date.now(), role: 'relative', text: openText, emotion: openEmo, actionCue: openAct }]);
                setPhase('negotiating');
                setTimeout(() => speakRelativeSegments(openText, openEmo, personaId), 420);
            };

            const persistSkillLabSession = useCallback(async (finalEval, allMsgs, extraEff = null) => {
                const preAvg = Number(((Number(preEff.explainBrainDeath) + Number(preEff.handleEmotion) + Number(preEff.gentleApproach)) / 3).toFixed(2));
                const postAvg = extraEff
                    ? Number(((Number(extraEff.explainBrainDeath) + Number(extraEff.handleEmotion) + Number(extraEff.gentleApproach)) / 3).toFixed(2))
                    : null;
                const vocalScores = recordedClipsRef.current.map(c => Number(c.calmScore || 0)).filter(n => n > 0);
                const avgVocalCalm = vocalScores.length ? Math.round(vocalScores.reduce((a, b) => a + b, 0) / vocalScores.length) : null;

                const entry = {
                    at: new Date().toISOString(), modeId, personaId, difficultyId, outcome: sessionOutcome,
                    score: finalEval.score, radar: finalEval.radar, trustScore,
                    barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal, avgVocalCalm,
                    preSelfEfficacyAvg: preAvg, postSelfEfficacyAvg: postAvg,
                    blindTranscript: SL.buildBlindTranscript(allMsgs, user?.name)
                };

                const prevHist = Array.isArray(user?.skillLabHistory) ? user.skillLabHistory : [];
                const nextHist = extraEff && prevHist.length > 0 && prevHist[prevHist.length - 1]?.modeId === modeId && prevHist[prevHist.length - 1]?.personaId === personaId
                    ? [...prevHist.slice(0, -1), { ...prevHist[prevHist.length - 1], postSelfEfficacyAvg: postAvg }]
                    : [...prevHist.slice(-14), entry];

                const bestScore = Math.max(Number(user?.skillLabBestScore || 0), Number(finalEval.score || 0));
                const hadLabBefore = Boolean(user?.skillLabPassed || prevHist.length > 0);
                const updatedUser = {
                    ...user,
                    skillLabPassed: true,
                    skillLabBestScore: bestScore,
                    skillLabLatestRadar: finalEval.radarMap,
                    skillLabHistory: nextHist,
                    preSelfEfficacyAvg: preAvg,
                    ...(postAvg !== null ? { postSelfEfficacyAvg: postAvg } : {})
                };

                setUser(updatedUser);
                if (isAdminPreview || !updatedUser?.id || updatedUser.id === 'guest_lab') return;

                saveLearnerLocally(updatedUser);
                if (!fbDb) return;

                try {
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(updatedUser.id)), updatedUser, { merge: true });
                    await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', buildAnonTelemetryId(updatedUser.id)), {
                        regionId: resolveRegionId(updatedUser.department),
                        status: updatedUser.status === 'ผ่าน' ? 'ผ่าน' : 'กำลังเรียน',
                        progress: Number(updatedUser.progress || 0),
                        hasLab: true,
                        skillLabBestScore: bestScore,
                        radar: finalEval.radarMap,
                        preSelfEfficacyAvg: preAvg,
                        ...(postAvg !== null ? { postSelfEfficacyAvg: postAvg } : {}),
                        updatedAt: new Date().toISOString()
                    }, { merge: true });

                    const summaryUpdates = {};
                    if (!summarySyncedSessionRef.current) {
                        summarySyncedSessionRef.current = true;
                        if (!hadLabBefore) summaryUpdates.labUsers = increment(1);
                        summaryUpdates.skillScoreSum = increment(Number(finalEval.score || 0));
                        summaryUpdates.skillScoreCount = increment(1);
                        summaryUpdates.preEffSum = increment(preAvg);
                        summaryUpdates.preEffCount = increment(1);
                    }
                    if (postAvg !== null && extraEff) {
                        summaryUpdates.postEffSum = increment(postAvg);
                        summaryUpdates.postEffCount = increment(1);
                    }
                    if (Object.keys(summaryUpdates).length > 0) {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_summary', 'global'), { ...summaryUpdates, updatedAt: new Date().toISOString() }, { merge: true });
                    }
                } catch (err) { console.warn('SkillLab cloud save warning:', err); }
            }, [preEff, modeId, personaId, difficultyId, sessionOutcome, trustScore, unlockedBarrierIds.length, silenceCount, triggerTotal, user, isAdminPreview]);

            const handleFinishAndEvaluate = useCallback(async (overrideMessages = null) => {
                stopAiVoice();
                const allMsgs = Array.isArray(overrideMessages) ? overrideMessages : messages;
                setPhase('evaluating');

                const fallback = SL.evaluateConversationFallback({
                    messages: allMsgs, barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal, finalTrust: trustScore
                });
                const supPrompt = SL.buildSupervisorEvaluationPrompt({
                    messages: allMsgs, personaTitle: activePersona.titleTH, barriersUnlocked: unlockedBarrierIds.length, silenceCount, triggerTotal, finalTrust: trustScore
                });
                const rawJson = await callGeminiText(appsScriptUrl, supPrompt, 'ตอบเป็น JSON ล้วนเท่านั้นสำหรับประเมิน 5 แกนทางคลินิก', 16000);
                const finalEval = rawJson ? SL.parseSupervisorJson(rawJson, fallback) : fallback;

                setEvalResult(finalEval);
                setPhase('result');
                await persistSkillLabSession(finalEval, allMsgs, null);
            }, [stopAiVoice, messages, unlockedBarrierIds.length, silenceCount, triggerTotal, trustScore, activePersona.titleTH, appsScriptUrl, persistSkillLabSession]);

            const handleSendUserMsg = useCallback(async (rawOverride = null) => {
                const text = String(rawOverride !== null ? rawOverride : userInput).trim();
                if (!text || isThinking) return;

                unlockMobileAudio();
                stopAiVoice();
                setUserInput('');
                setActiveCurveball(null);

                let usedSilence = false;
                if (silenceAnchorRef.current > 0 && !silenceCountedRef.current) {
                    if (Date.now() - silenceAnchorRef.current >= 2500) {
                        usedSilence = true;
                        silenceCountedRef.current = true;
                        setSilenceCount(c => c + 1);
                        if (SL.SoundFX) SL.SoundFX.playChime([523.25, 659.25]);
                        showToast('เว้นความเงียบเยียวยา (Therapeutic Silence ≥ 2.5 วิ) ได้เยี่ยมมากค่ะ ✓');
                    }
                }

                const hits = SL.detectTriggerPhrases(text, isEn ? 'en' : 'th');
                if (hits.length > 0) setTriggerTotal(t => t + hits.length);
                const introduced = SL.extractIntroducedLearnerName(text);
                if (introduced) setLearnerCallName(introduced);

                const nextMessages = [...messages, { id: Date.now(), role: 'user', text, usedSilence, triggerCount: hits.length }];
                setMessages(nextMessages);

                if (selectedMode.isDrill && DRILL_STAGES[drillStageIdx]) {
                    const res = SL.evaluateMicroDrillAnswer(DRILL_STAGES[drillStageIdx], text, hits, usedSilence);
                    setDrillResults(prev => [...prev, res]);
                    setLatestDrillFeedback(res);
                    if (res.passed) {
                        setCurrentEmotion('CALM');
                        setTrustScore(s => Math.min(96, s + 16));
                        if (SL.SoundFX) SL.SoundFX.playChime([587.33, 783.99]);
                    } else {
                        setCurrentEmotion('HESITANT');
                    }
                    return;
                }

                const barrierEval = SL.evaluateBarriersUnlocked(personaId, text, unlockedBarrierIds);
                setUnlockedBarrierIds(barrierEval.unlockedIds);
                if (barrierEval.newlyUnlocked.length > 0) {
                    if (SL.SoundFX) SL.SoundFX.playChime([523.25, 659.25, 783.99]);
                    showToast(`ปลดล็อกปมในใจ: ${barrierEval.newlyUnlocked[0].titleTH} (${barrierEval.unlockedIds.length}/3)`);
                }

                const nextTurnNum = userTurnCount + 1;
                if (difficultyId === 'hard' && !isEn && personaId !== 'sbar_doctor') {
                    const cb = SL.pickHardCurveball(nextTurnNum, usedCurveballIds);
                    if (cb) {
                        setUsedCurveballIds(p => [...p, cb.id]);
                        setActiveCurveball(cb);
                        if (cb.type === 'phone' && SL.SoundFX) SL.SoundFX.playPhoneBuzz();
                        setCurrentEmotion(cb.emotion);
                        setCurrentActionCue(cb.actionTH);
                        setCoachHint(cb.coachHintTH);
                        setMessages([...nextMessages, { id: Date.now() + 1, role: 'relative', text: cb.speechTH, emotion: cb.emotion, actionCue: cb.actionTH }]);
                        speakRelativeSegments(cb.speechTH, cb.emotion, personaId);
                        return;
                    }
                }

                setIsThinking(true);
                setThinkingCue(SL.pickLatencyMaskCue(personaId, isEn));
                if (SL.SoundFX) SL.SoundFX.playThinkingCue();

                const callName = introduced || learnerCallName || 'คุณพยาบาล';
                const transcriptForPrompt = nextMessages.slice(-10).map(m => `${m.role === 'user' ? `ผู้เรียน(${callName})` : 'คู่สนทนา'}: ${m.text}`).join('\n');
                const sysPrompt = personaId === 'sbar_doctor'
                    ? `คุณคือ นพ.ภาคิน แพทย์เวร ICU ที่กำลังรับรายงานส่งเวรแบบ SBAR จากพยาบาลชื่อ "${callName}"\n${activePersona.promptHintTH}\nตอบสั้นกระชับสมจริง 2–3 ประโยค ขึ้นต้นด้วยแท็ก [EMOTION: CONFUSED|HESITANT|CALM] [ACTION: ภาษากายสั้นๆ] และหากรายงานครบ S-B-A-R แล้วให้ต่อท้ายด้วย [OUTCOME: CONSENT]`
                    : `คุณกำลังสวมบทบาทในห้องให้คำปรึกษาเรื่องการรับบริจาคอวัยวะ (ห้ามหลุดบทบาท AI)\n${activePersona.promptHintTH}\nเรียกผู้เรียนว่า "${callName}" | ภาษา: ${isEn ? 'English' : 'ภาษาไทยสุภาพสมจริง'}\nรอบที่ ${nextTurnNum}/${selectedMode.maxTurns} | ปมที่คลายได้แล้ว ${barrierEval.unlockedIds.length}/3 | คำกระทบใจรอบนี้: ${hits.length}\nตอบ 2–3 ประโยคสมจริง ขึ้นต้นด้วยแท็ก [EMOTION: SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] [ACTION: ภาษากายสั้นๆ] [COACH: คำแนะนำสั้น 1 บรรทัด] และหากถึงรอบที่ ${selectedMode.maxTurns} หรือพร้อมสรุปให้ใส่ [OUTCOME: CONSENT|CONSULT|DECLINE]`;

                const rawAi = await callGeminiText(appsScriptUrl, transcriptForPrompt, sysPrompt, 16000);
                setIsThinking(false);
                setThinkingCue('');

                const parsed = SL.parseRelativeResponse(
                    rawAi || buildOfflineRelativeReply(personaId, nextTurnNum, barrierEval.unlockedIds.length, hits.length, isEn),
                    currentEmotion
                );
                const inertia = SL.computeInertiaTrust({
                    prevTrust: trustScore, aiEmotion: parsed.emotion, newlyUnlockedCount: barrierEval.newlyUnlocked.length,
                    totalUnlockedCount: barrierEval.unlockedIds.length, triggerCount: hits.length, usedSilence, difficulty: difficultyId, userText: text
                });

                setTrustScore(inertia.trust);
                setLastTrustDelta(inertia.delta);
                setCurrentEmotion(inertia.emotion);
                if (parsed.actionCue) setCurrentActionCue(parsed.actionCue);
                if (parsed.coachHint && difficultyId === 'normal') setCoachHint(parsed.coachHint);
                if (parsed.outcome) setSessionOutcome(parsed.outcome);

                setMessages([...nextMessages, { id: Date.now() + 2, role: 'relative', text: parsed.speech, emotion: inertia.emotion, actionCue: parsed.actionCue }]);
                speakRelativeSegments(parsed.speech, inertia.emotion, personaId);
            }, [
                userInput, isThinking, unlockMobileAudio, stopAiVoice, isEn, messages, selectedMode, drillStageIdx,
                DRILL_STAGES, personaId, unlockedBarrierIds, userTurnCount, difficultyId, usedCurveballIds,
                learnerCallName, activePersona.promptHintTH, appsScriptUrl, currentEmotion, trustScore, speakRelativeSegments, showToast
            ]);

            const handleNextDrillStage = () => {
                if (drillStageIdx + 1 >= DRILL_STAGES.length) { handleFinishAndEvaluate(messages); return; }
                const nextIdx = drillStageIdx + 1;
                const st = DRILL_STAGES[nextIdx];
                setDrillStageIdx(nextIdx);
                setLatestDrillFeedback(null);
                setPersonaId(st.personaId);
                setCurrentEmotion(st.emotion);
                setCurrentActionCue(st.actionTH);
                setActiveSpeakerBadge(st.badgeTH);
                setMessages(prev => [...prev, { id: Date.now(), role: 'relative', text: st.promptTH, emotion: st.emotion, actionCue: st.actionTH }]);
                speakRelativeSegments(st.promptTH, st.emotion, st.personaId);
            };

            // ============================================================================
            // 8. MICROPHONE + CLIENT-SIDE VOCAL TONE MONITOR & RAM REPLAY
            // ============================================================================
            const stopMicAndAnalyze = useCallback(async (shouldAutoSend = false) => {
                setIsListening(false);
                if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch (_) {} recognitionRef.current = null; }
                const rec = vocalRecorderRef.current;
                vocalRecorderRef.current = null;
                let clipMeta = null;
                if (rec && rec.isActive()) clipMeta = await rec.stop();
                setLiveVocalMetric(null);

                const spokenText = latestFinalTranscriptRef.current.trim();
                const elapsedSec = Math.max(1, (Date.now() - voiceStartTsRef.current) / 1000);
                setPaceHint(spokenText.length > 0 && spokenText.length / elapsedSec > 18 ? 'จังหวะการพูดค่อนข้างเร็ว ลองผ่อนความเร็วลงอีกนิดเพื่อให้ญาติฟังสบายขึ้นนะคะ' : '');

                if (clipMeta) {
                    setRecordedVoiceClips(prev => [...prev, { id: Date.now(), turn: userTurnCount + 1, transcript: spokenText || '(บันทึกเสียงพูด)', ...clipMeta }]);
                }
                if (shouldAutoSend && autoSendVoice && spokenText) {
                    latestFinalTranscriptRef.current = '';
                    handleSendUserMsg(spokenText);
                }
            }, [autoSendVoice, userTurnCount, handleSendUserMsg]);

            const handleToggleMic = async () => {
                if (isListening) { await stopMicAndAnalyze(true); return; }
                unlockMobileAudio();
                stopAiVoice();
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast('เบราว์เซอร์นี้ไม่รองรับไมค์แปลงเสียง (แนะนำเปิดใน Safari/Chrome หรือพิมพ์/แตะคำพูดด้านล่างค่ะ)', 'info'); return; }

                latestFinalTranscriptRef.current = '';
                voiceStartTsRef.current = Date.now();
                setIsListening(true);
                if (typeof SL.createVocalToneRecorder === 'function') {
                    const rec = SL.createVocalToneRecorder();
                    vocalRecorderRef.current = rec;
                    rec.start((metric) => setLiveVocalMetric(metric)).catch(() => {});
                }
                try {
                    const sr = new SpeechRec();
                    sr.lang = isEn ? 'en-US' : 'th-TH';
                    sr.continuous = true; sr.interimResults = true;
                    sr.onresult = (ev) => {
                        let finalStr = '', interimStr = '';
                        for (let i = 0; i < ev.results.length; i++) {
                            if (ev.results[i].isFinal) finalStr += ev.results[i][0].transcript;
                            else interimStr += ev.results[i][0].transcript;
                        }
                        const combined = (finalStr + ' ' + interimStr).trim();
                        latestFinalTranscriptRef.current = combined;
                        setUserInput(combined);
                    };
                    sr.onerror = () => stopMicAndAnalyze(false);
                    sr.onend = () => { if (recognitionRef.current === sr) stopMicAndAnalyze(true); };
                    recognitionRef.current = sr;
                    sr.start();
                } catch (_) {
                    stopMicAndAnalyze(false);
                    showToast('ไม่สามารถเปิดไมโครโฟนได้ กรุณาอนุญาตสิทธิ์ไมโครโฟนบนเบราว์เซอร์ค่ะ', 'error');
                }
            };

            const curEmoMeta = EMOTIONS[currentEmotion] || EMOTIONS.CONFUSED || { colorHex: '#38bdf8', labelTH: 'สับสน', labelEN: 'Confused' };
            const preEffAvg = ((Number(preEff.explainBrainDeath) + Number(preEff.handleEmotion) + Number(preEff.gentleApproach)) / 3).toFixed(2);
            const postEffAvg = ((Number(postEff.explainBrainDeath) + Number(postEff.handleEmotion) + Number(postEff.gentleApproach)) / 3).toFixed(2);
            const isAnyVoiceActive = guideVoiceState.status !== 'idle' || voiceStatus.phase !== 'idle' || isThinking;

            // ============================================================================
            // 9. RENDER PHASES
            // ============================================================================
            return (
                <div className={`min-h-dvh relative flex flex-col pt-safe pb-safe ${phase === 'negotiating' ? 'holo-stage-bg' : ''}`}>
                    {phase !== 'negotiating' && (<><div className="spatial-aura" /><div className="spatial-grid" /></>)}

                    {/* แถบไฟแอมเบียนด้านบนสุดขณะ AI แนะนำหรือคู่สนทนาพูด (ไร้ซับไตเติลกวนสายตา) */}
                    {isAnyVoiceActive && (
                        <div className="fixed top-0 left-0 right-0 z-50 pointer-events-none" aria-hidden="true">
                            <div className="rjc-ambient-bar" />
                        </div>
                    )}

                    {/* LINE / In-App Browser Auto-Detector Banner */}
                    {inAppInfo.isInApp && phase !== 'negotiating' && (
                        <div className="relative z-40 bg-amber-500/20 border-b border-amber-400/45 px-3.5 py-2.5 text-xs">
                            <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
                                <span className="text-amber-200 font-bold">⚠️ เปิดจากในแอป {inAppInfo.appName} อาจบล็อกไมค์และเสียง AI — แนะนำเปิดใน Safari / Chrome ค่ะ</span>
                                <div className="flex gap-1.5">
                                    <a href={inAppInfo.externalUrl} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-full bg-amber-400 text-void-950 font-display font-extrabold text-[11px]">เปิดใน Safari / Chrome</a>
                                    <button type="button" onClick={() => { copyTextSafe(window.location.href); showToast('คัดลอกลิงก์ห้องฝึกแล้วค่ะ'); }} className="px-3 py-1.5 rounded-full bg-white/15 text-white font-bold text-[11px]">คัดลอกลิงก์</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================== PHASE 1: LOBBY + LIVE 3D HOLOGRAM PREVIEW ==================== */}
                    {phase === 'lobby' && (
                        <div className="relative z-10 flex-1 flex flex-col">
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-5xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <a href={dashboardReturnHref} onClick={persistLearnerBeforeReturn} aria-label="กลับห้องเรียนหลัก" className="w-9 h-9 rounded-xl spatial-soft text-primary-adaptive flex items-center justify-center shrink-0">
                                            <Icon name="ArrowLeft" size={18} />
                                        </a>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                AI Skill Lab <span className="text-accent-adaptive">3D</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                                {user.name} • {!isOnline ? 'โหมดออฟไลน์ ICU' : 'Studio 24kHz Voice • 6 Clinical Cases'}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        {phaseVoiceGuide && (
                                            <StepVoiceButton activeKey={guideVoiceState.activeKey} targetKey={phaseVoiceGuide.key} status={guideVoiceState.status} onToggle={handleReplayPhaseGuide} />
                                        )}
                                        <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                                    </div>
                                </div>
                            </header>

                            <main className="max-w-5xl w-full mx-auto px-3.5 sm:px-6 py-5 space-y-5 pb-12">
                                {/* AI Lab Advisor v3 Card (No Subtitle Banner) */}
                                <section className="spatial-card rounded-[1.75rem] overflow-hidden border-aurora-400/40">
                                    <div className="p-4 sm:p-5 space-y-3.5">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div className="flex items-center gap-2.5">
                                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shrink-0">
                                                    <Icon name="Sparkles" size={20} />
                                                </div>
                                                <div>
                                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">AI LAB ADVISOR v3 • STUDIO AI VOICE</span>
                                                    <h2 className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive">ผู้ช่วยเลือกเคสและวางแผนการฝึกเฉพาะคุณ</h2>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-1.5 shrink-0">
                                                <StepVoiceButton activeKey={guideVoiceState.activeKey} targetKey="lab_advisor_voice" status={guideVoiceState.status} onToggle={handleSpeakAdvisor} />
                                                <button type="button" onClick={() => setAdvisorExpanded(v => !v)} className="spatial-soft w-8 h-8 rounded-xl text-secondary-adaptive flex items-center justify-center">
                                                    <Icon name={advisorExpanded ? 'ChevronUp' : 'ChevronDown'} size={16} />
                                                </button>
                                            </div>
                                        </div>

                                        {advisorExpanded && (
                                            <div className="space-y-3">
                                                <div className="flex flex-wrap gap-1.5">
                                                    {ADVISOR_GOALS.map(g => (
                                                        <button key={g.id} type="button" onClick={() => { stopGuideVoice(); setAdvisorGoalId(g.id); setAdvisorReply(''); }} className={`px-3 py-1.5 rounded-full text-xs font-bold inline-flex items-center gap-1 ${advisorGoalId === g.id ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-extrabold' : 'spatial-soft text-secondary-adaptive'}`}>
                                                            <Icon name={g.icon} size={13} /> {g.label}
                                                        </button>
                                                    ))}
                                                </div>

                                                <div className="spatial-soft rounded-2xl p-3.5 sm:p-4 space-y-2 text-xs">
                                                    <p className="font-display font-bold text-sm text-accent-adaptive">{activeRec.headline}</p>
                                                    <p className="text-secondary-adaptive leading-relaxed">{activeRec.reason}</p>
                                                    <p className="text-prism-adaptive font-semibold">💡 {activeRec.tip}</p>
                                                    <div className="pt-1">
                                                        <button type="button" onClick={handleApplyRec} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs">
                                                            เลือกตามที่ AI แนะนำทันที ✓
                                                        </button>

                                                <div className="flex flex-wrap gap-1.5">

                                                            {qq}

                                                        {advisorReply}
                                                    </div>
                                                )}

                                                <form onSubmit={handleAskAdvisor} className="flex gap-2">
                                                    <input value={advisorQuestion} onChange={e => setAdvisorQuestion(e.target.value)} disabled={advisorAsking} placeholder="ถาม AI Lab Advisor เช่น เคสเด็กหรือส่งเวร SBAR ฝึกยังไง..." className="touch-target spatial-input flex-1 px-3.5 py-2 rounded-xl text-xs" />
                                                    <button type="submit" disabled={!advisorQuestion.trim() || advisorAsking} className="touch-target px-4 rounded-xl bg-prism-500 text-void-950 font-bold text-xs">{advisorAsking ? '...' : 'ถาม'}</button>

                                </section>

                                {/* 1. เวทีตัวอย่าง Hologram 3 มิติสด (ให้ผู้เรียนเลือกดูและหมุนก่อนเข้าห้องฝึก) */}

                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">LIVE 3D HOLOGRAM PREVIEW • 6 STYLES</span>
                                            <h2 className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive">ตัวอย่าง Hologram 3 มิติสด (แตะสลับรูปแบบและลากหมุนดูก่อนเข้าห้อง)</h2>
                                        </div>

                                {/* 2. เลือกรูปแบบ & ระดับความยาก */}
                                <section className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                        {MODES.map(m => (
                                            <button key={m.id} type="button" onClick={() => setModeId(m.id)} className={`w-full text-left p-3 rounded-2xl border transition-all ${modeId === m.id ? 'bg-aurora-500/20 border-aurora-400' : 'spatial-soft'}`}>
                                                <p className="font-display font-bold text-sm text-primary-adaptive flex items-center gap-1.5">
                                                    <Icon name={m.icon} size={15} className="text-accent-adaptive" /> {m.labelTH}
                                                </p>
                                                <p className="text-xs text-muted-adaptive mt-0.5">{m.descTH}</p>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-2.5">
                                        <p className="font-mono text-[10px] font-bold text-amber-400 uppercase">2. ระดับความยาก (DIFFICULTY)</p>
                                        {DIFFICULTIES.map(d => (
                                            <button key={d.id} type="button" onClick={() => setDifficultyId(d.id)} className={`w-full text-left p-3 rounded-2xl border transition-all ${difficultyId === d.id ? 'bg-amber-500/20 border-amber-400' : 'spatial-soft'}`}>
                                                <p className="font-display font-bold text-sm text-primary-adaptive">{d.labelTH}</p>
                                                <p className="text-xs text-muted-adaptive mt-0.5">{d.descTH}</p>
                                            </button>
                                        ))}

                                        {/* เหรียญตราสมรรถนะคลินิก */}
                                        <div className="pt-2 space-y-1.5">
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase block">
                                                CLINICAL MASTERY BADGES ({clinicalBadges.filter(b => b.earned).length}/{clinicalBadges.length})
                                            </span>
                                            <div className="flex flex-wrap gap-1.5">
