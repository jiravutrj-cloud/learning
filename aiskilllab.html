    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        const LIQUID_ORB_VERT = [
            'uniform float uTime;',
            'uniform float uSpeak;',
            'uniform float uTension;',
            'varying vec3 vNormal;',
            'varying vec3 vViewPos;',
            'varying float vDisp;',
            'void main() {',
            '  vec3 p = position;',
            '  float freq = 2.0 + uTension * 1.35;',
            '  float w1 = sin(p.x * freq + uTime * 1.3) * cos(p.y * freq - uTime * 1.05);',
            '  float w2 = sin(p.z * (freq * 1.2) - uTime * 1.55) * cos(p.x * 1.55 + uTime * 0.85);',
            '  float w3 = cos((p.y + p.z) * 3.0 + uTime * 2.1) * 0.42;',
            '  float disp = (w1 * 0.55 + w2 * 0.45 + w3 * 0.35) * (0.08 + uSpeak * 0.085 + uTension * 0.04);',
            '  vec3 displaced = p + normal * disp;',
            '  vDisp = disp;',
            '  vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);',
            '  vNormal = normalize(normalMatrix * normal);',
            '  vViewPos = -mvPosition.xyz;',
            '  gl_Position = projectionMatrix * mvPosition;',
            '}'
        ].join('\n');

            'uniform vec3 uColor1;',
            'uniform vec3 uColor2;',
            'uniform float uTime;',
            'uniform float uSpeak;',
            'varying vec3 vNormal;',
            'varying vec3 vViewPos;',
            'varying float vDisp;',
            'void main() {',
            '  vec3 N = normalize(vNormal);',
            '  vec3 V = normalize(vViewPos);',
            '  float ndotv = clamp(dot(N, V), 0.0, 1.0);',
            '  float fresnel = pow(1.0 - ndotv, 2.3);',
            '  float swirl = 0.5 + 0.5 * sin(vDisp * 12.0 + N.y * 2.3 + uTime * 0.7);',
            '  vec3 baseCol = mix(uColor1, uColor2, swirl);',
            '  vec3 pearlescent = mix(baseCol, vec3(0.95, 0.99, 1.0), fresnel * 0.82);',
            '  float coreGlow = pow(ndotv, 1.7) * (0.32 + uSpeak * 0.22);',
            '  vec3 finalCol = pearlescent + baseCol * coreGlow;',
            '  float alpha = clamp(0.28 + fresnel * 0.74 + coreGlow * 0.34, 0.22, 0.95);',
            '  gl_FragColor = vec4(finalCol, alpha);',
            '}'
        ].join('\n');

        // 2. HELPERS: NAME EXTRACTION, TRIGGER WORDS, AUDIO DSP, VOICE SEGMENTS & EVAL

        function extractDefaultAddressName(learnerObj, isEn) {
            const raw = String(learnerObj?.name || '').trim();
            if (!raw || /demo|preview|ทดสอบ/i.test(raw)) {
                return isEn ? 'Nurse' : 'ผู้เรียน';
            }
            // ตัดคำนำหน้าชื่อภาษาไทยออกเพื่อให้เรียก "คุณ[ชื่อต้น]" ได้อย่างเป็นธรรมชาติ
            const cleaned = raw
                .replace(/^(พว\.|นพ\.|พญ\.|ทพ\.|ภก\.|ดร\.|รศ\.|ผศ\.|ศ\.|นาย|นางสาว|นาง|ว่าที่\s*ร\.ต\.|คุณ)\s*/i, '')
                .replace(/\(.*?\)/g, '')
                .trim();
            const firstToken = cleaned.split(/\s+/)[0] || cleaned;
            if (!firstToken) return isEn ? 'Nurse' : 'ผู้เรียน';
            return isEn ? firstToken : `คุณ${firstToken}`;
        }

        function detectSelfIntroName(text, isEn) {
            const s = String(text || '').trim();
            if (!s) return null;
            if (isEn) {
                const m = s.match(/(?:my name is|i am|i'm|call me)\s+([A-Za-z][A-Za-z.\s]{1,22})/i);
                if (m && m[1]) {
                    const candidate = m[1].trim().split(/[,.!?]/)[0].trim();
                    if (candidate && !/nurse|doctor|coordinator|here|sorry/i.test(candidate)) return candidate;
                }
                return null;
            }
            const patterns = [
                /(?:เรียก(?:ดิฉัน|ผม|หนู|ฉัน)?ว่า|เรียกว่า)\s*([ก-๙A-Za-z0-9]{2,18})/,
                /(?:ดิฉัน|ผม|ฉัน|หนู|กระผม)\s*ชื่อ\s*([ก-๙A-Za-z0-9]{2,18})/,
                /(?:ชื่อ)\s*(หมอ[ก-๙]{1,14}|พี่[ก-๙]{1,14}|พยาบาล[ก-๙]{1,14}|คุณ[ก-๙]{1,14}|[ก-๙]{2,14})/
            ];
            for (const rx of patterns) {
                const m = s.match(rx);
                if (m && m[1]) {
                    const token = m[1].replace(/(ค่ะ|ครับ|นะคะ|นะครับ|นะ|เอง)$/, '').trim();
                    if (token && token.length >= 2 && !/ผู้ประสานงาน|เจ้าหน้าที่|โรงพยาบาล/.test(token)) {
                        if (/^(หมอ|พี่|คุณ|อาจารย์|พยาบาล)/.test(token)) return token;
                        return `คุณ${token}`;
                    }
                }
            }
            return null;
        }

        function detectTriggerPhrases(text, lang = 'th') {

        function playGentleKnockSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                [0, 0.24].forEach((offset) => {
                    const t = ctx.currentTime + offset;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(165, t);
                    osc.frequency.exponentialRampToValueAtTime(58, t + 0.085);
                    gain.gain.setValueAtTime(0.0001, t);
                    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.12);
                });
            } catch (_) {}
        }

        }

        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            if (typeof CORE.pcm16ToWavBlob === 'function') {
                const blob = CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                return blob && blob.size > 0 ? URL.createObjectURL(blob) : '';
            }
            const bin = window.atob(base64PCM);
            const raw = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
            let offset = 0, byteLen = raw.length, rate = sampleRate;
            if (raw.length >= 44 && raw[0] === 0x52 && raw[1] === 0x49 && raw[2] === 0x46 && raw[3] === 0x46) {
                const hv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
                let pos = 12;
                while (pos + 8 <= raw.length) {
                    const id = String.fromCharCode(raw[pos], raw[pos + 1], raw[pos + 2], raw[pos + 3]);
                    const sz = hv.getUint32(pos + 4, true);
                    if (id === 'fmt ' && pos + 16 <= raw.length) {
                        const r = hv.getUint32(pos + 12, true);
                        if (r >= 8000 && r <= 96000) rate = r;
                    } else if (id === 'data') {
                        offset = pos + 8;
                        byteLen = Math.min(sz, raw.length - offset);
                        break;
                    }
                    const step = 8 + sz + (sz % 2);
                    if (step <= 8) break;
                    pos += step;
                }
            }
            const count = Math.floor(byteLen / 2);
            if (count <= 0) return '';
            const iv = new DataView(raw.buffer, raw.byteOffset + offset, count * 2);
            const samples = new Float32Array(count);
            for (let i = 0; i < count; i++) samples[i] = iv.getInt16(i * 2, true) / 32768;
            const frameSize = Math.max(128, Math.round(rate * 0.02));
            let endFrame = Math.floor(count / frameSize) - 1;
            while (endFrame > 12) {
                let sumSq = 0, zc = 0, prev = samples[endFrame * frameSize];
                for (let j = 0; j < frameSize; j++) {
                    const s = samples[endFrame * frameSize + j];
                    sumSq += s * s;
                    if ((s >= 0 && prev < 0) || (s < 0 && prev >= 0)) zc++;
                    prev = s;
                }
                if (Math.sqrt(sumSq / frameSize) < 0.016 || zc / frameSize > 0.22) endFrame--;
                else break;
            }
            const kept = Math.min(count, Math.max(Math.round(rate * 0.25), (endFrame + 1) * frameSize));
            const pad = Math.round(rate * 0.045);
            const outBytes = (kept + pad) * 2;
            const fadeOut = Math.min(Math.round(rate * 0.075), Math.floor(kept * 0.22));
            const buf = new ArrayBuffer(44 + outBytes);
            const v = new DataView(buf);
            const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            ws(0, 'RIFF'); v.setUint32(4, 36 + outBytes, true); ws(8, 'WAVE'); ws(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
            v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, outBytes, true);
            for (let i = 0; i < kept; i++) {
                let s = samples[i];
                if (i >= kept - fadeOut) s *= 0.5 * (1 + Math.cos(Math.PI * ((i - (kept - fadeOut)) / fadeOut)));
                v.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, s)) * 32767), true);
            }
            return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
        }

        // แยกข้อความ 2 เสียงจริงในเคสความขัดแย้ง ([ภรรยา]: ... [คุณแม่]: ...)
        function splitIntoVoiceSegments(rawText, persona, isEn) {
            const clean = String(rawText || '').replace(/\[ACTION\][^\n]*/gi, '').trim();
            if (persona.id === 'conflict' && persona.dualVoices) {
                const rx = /\[(ภรรยา[^\]]*|คุณแม่[^\]]*|แม่[^\]]*|Wife[^\]]*|Mother[^\]]*)\]:?\s*([\s\S]*?)(?=\[(?:ภรรยา|คุณแม่|แม่|Wife|Mother)|$)/gi;
                const segs = [];
                let m;
                while ((m = rx.exec(clean)) !== null) {
                    const spkRaw = m[1].trim();
                    const body = m[2].trim();
                    if (!body) continue;
                    const isMother = /แม่|mother/i.test(spkRaw);
                    segs.push({
                        speakerLabel: isMother ? (isEn ? 'Mother' : 'คุณแม่') : (isEn ? 'Wife' : 'ภรรยา'),
                        voiceName: isMother ? persona.dualVoices.mother : persona.dualVoices.wife,
                        text: body
                    });
                }
                if (segs.length > 0) return segs;
            }
            return [{
                speakerLabel: isEn ? 'Relative' : (persona.speakerRoleTH || 'ญาติผู้ป่วย'),
                voiceName: persona.voiceName || 'Sulafat',
                text: clean
            }];
        }

        // แยก [EMOTION:...], [ACTION]... และ [DECISION:...] จากคำตอบของ AI
        function parseAiRelativeResponse(rawText, fallbackEmotion) {
            let text = String(rawText || '').trim();
            let emotion = fallbackEmotion || 'CONFUSED';
            let action = '';
            let decision = null;

            const emoMatch = text.match(/\[EMOTION:\s*(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\s*\]/i);
            if (emoMatch) {
                emotion = emoMatch[1].toUpperCase();
                text = text.replace(emoMatch[0], '').trim();
            }

            const decMatch = text.match(/\[DECISION:\s*(CONSENT|DECLINE|DEFER_HOME)\s*\]/i);
            if (decMatch) {
                decision = decMatch[1].toUpperCase();
                text = text.replace(decMatch[0], '').trim();
            }

            const actMatch = text.match(/\[ACTION\]\s*:?\s*([^\n\[]+)/i);
            if (actMatch) {
                action = actMatch[1].trim().replace(/\]$/, '').trim();
                text = text.replace(actMatch[0], '').trim();
            }

            return { text: text.trim(), emotion, action, decision };
        }

                    ];

                    return [
                        'เข้าใจความกังวลของคุณเลยค่ะ ขอยืนยันตรงไปตรงมาว่าการจัดสรรอวัยวะดูแลโดยระบบคอมพิวเตอร์ของสภากาชาดไทย (ODC) โปร่งใสไม่มีการซื้อขาย และไม่มีค่าใช้จ่ายเพิ่มเติมกับครอบครัวค่ะ',

                return [
                    'เข้าใจเลยค่ะที่เห็นหน้าอกยังขยับแล้วทำให้สับสน จริงๆ เป็นการทำงานของเครื่องช่วยหายใจที่ช่วยพยุงออกซิเจนไว้ค่ะ แต่ก้านสมองหยุดทำงานอย่างถาวรแล้วตามผลตรวจของแพทย์ 3 ท่านค่ะ',
                    'ความกังวลของครอบครัวเป็นเรื่องที่เข้าใจได้มากเลยค่ะ ตามหลักศาสนาการเสียสละเพื่อต่อชีวิตเพื่อนมนุษย์ถือเป็นทานบารมีอันยิ่งใหญ่ และทีมแพทย์จะดูแลตกแต่งร่างให้เรียบร้อยสมบูรณ์ที่สุดค่ะ'
                ];
            }
            if (decisionRequested || turnCount >= 3) {
                return [
                    'เข้าใจมากเลยค่ะที่อยากปรึกษาคนในบ้านก่อน ครอบครัวมีสิทธิ์ตัดสินใจได้อย่างอิสระเลยค่ะ แต่ขออนุญาตเรียนแจ้งกรอบเวลาทางการแพทย์อย่างนุ่มนวลว่าเครื่องพยุงชีพช่วยคงสภาพอวัยวะได้ในระยะเวลาจำกัด หากสะดวกคุยทางโทรศัพท์กับญาติที่บ้านที่นี่ หรือให้ดิฉันช่วยอธิบายเพิ่มเติม ยินดีมากเลยค่ะ',
                    'ไม่ว่าจะตัดสินใจยินยอมหรือไม่ยินยอม ทีมแพทย์และพยาบาลเคารพการตัดสินใจของครอบครัวอย่างเต็มที่ค่ะ ไม่มีการเร่งรัดใดๆ และเราจะดูแลร่างของท่านให้สมเกียรติที่สุดค่ะ'
                ];
            }
            return [
                'หากครอบครัวพร้อมรับฟัง ดิฉันขออนุญาตเล่าทางเลือกเรื่องการบริจาคอวัยวะเพื่อส่งต่อชีวิตใหม่ให้ผู้ป่วยที่รอคอย โดยไม่มีค่าใช้จ่ายและทีมผ่าตัดจะตกแต่งร่างอย่างประณีตสมเกียรติที่สุดค่ะ',
                'ขอให้ครอบครัวค่อยๆ ใช้เวลาปรึกษากันอย่างเต็มที่นะคะ มีข้อกังวลเรื่องพิธีกรรม เวลา หรือขั้นตอนไหน อยากให้ดิฉันช่วยอธิบายเพิ่มเติมไหมคะ?'
            ];
        }

        // สร้างคำตอบสำรองแบบสมจริง (กรณีออฟไลน์/Apps Script ไม่ตอบ) ให้ครบ 5–7 รอบและจบด้วย 1 ใน 3 การตัดสินใจ
        function generateOfflineRelativeReply({ persona, learnerText, turnNumber, maxTurns, addressName, isEn }) {
            const lower = String(learnerText || '').toLowerCase();
            const hasEmpathy = /เสียใจ|เข้าใจ|หนักใจ|รับฟัง|เคารพ|เป็นกำลังใจ|sorry|understand|gentle|respect/i.test(lower);
            const hasFacts = /สมองตาย|เครื่องช่วยหายใจ|ก้านสมอง|สภากาชาด|odc|ไม่มีค่าใช้จ่าย|ตกแต่งร่าง|โปร่งใส|ventilator|brain|red cross|no cost|dignity/i.test(lower);
            const hasTrigger = detectTriggerPhrases(learnerText, isEn ? 'en' : 'th').length > 0;
            const asksHomeTime = turnNumber === maxTurns - 2;
            const isFinalTurn = turnNumber >= maxTurns - 1;

            if (isEn) {
                if (isFinalTurn) {
                    if (hasTrigger) {
                        return {
                            emotion: 'ANGRY',
                            decision: 'DECLINE',
                            action: 'Steps back slightly and folds arms tightly',
                            text: `${addressName}, I feel too pressured right now. Our family has decided not to proceed with organ donation. Please let us grieve in peace.`
                        };
                    }
                    if (hasEmpathy && hasFacts) {
                        return {
                            emotion: 'CALM',
                            decision: 'CONSENT',
                            action: 'Takes a slow, steadying breath and nods softly with gentle tears',
                            text: `Thank you, ${addressName}, for explaining everything so kindly and never rushing us. We trust your team and consent to donate organs so others may live.`
                        };
                    }
                    return {
                        emotion: 'HESITANT',
                        decision: 'DEFER_HOME',
                        action: 'Looks down thoughtfully and holds their phone',
                        text: `Thank you, ${addressName}. We still need to talk with our elders at home before making a final decision. May we call you back shortly?`
                    };
                }
                if (asksHomeTime) {
                    return {
                        emotion: 'HESITANT',
                        decision: null,
                        action: 'Glances toward the door, rubbing hands nervously',
                        text: `Thank you for explaining, ${addressName}. This is such a huge choice... Would it be possible for us to go home and discuss this with the rest of our family first?`
                    };
                }
                return {
                    emotion: hasTrigger ? 'ANGRY' : (hasEmpathy ? 'SAD' : 'CONFUSED'),
                    decision: null,
                    action: hasTrigger ? 'Frowns and tenses shoulders' : 'Wipes tears gently while listening closely',
                    text: hasTrigger
                        ? `Please wait, ${addressName}... hearing those words hurts so much. Can you please slow down and explain clearly?`
                        : `I hear what you are saying, ${addressName}... Could you also reassure us about how his/her body will be cared for and whether there are any extra costs?`
                };
            }

            // ภาษาไทย: กรณีเคส 3 ใช้ 2 ตัวละครสลับกันพูดเสมอ
            const prefixConflict = (wifeText, motherText) => `[ภรรยา]: ${wifeText} [คุณแม่]: ${motherText}`;

            if (isFinalTurn) {
                if (hasTrigger) {
                    return {
                        emotion: 'ANGRY',
                        decision: 'DECLINE',
                        action: 'ถอยตัวพิงพนักเก้าอี้ สีหน้าตึงเครียดและกอดอกแน่น',
                        text: persona.id === 'conflict'
                            ? prefixConflict(`หนูว่าตอนนี้คุณแม่ไม่ไหวจริงๆ ค่ะ${addressName}...`, `แม่ตัดสินใจแล้วนะคะ${addressName} แม่ไม่ยินยอมบริจาคอวัยวะค่ะ ขอให้ลูกแม่ได้พักอย่างสงบเถอะนะคะ`)
                            : `ขอโทษนะคะ${addressName} ฟังแล้วใจมันยิ่งบีบไปหมด ตอนนี้ครอบครัวเราขอตัดสินใจไม่ยินยอมบริจาคอวัยวะนะคะ อยากขออยู่กับท่านเงียบๆ ค่ะ`
                    };
                }
                if (hasEmpathy && hasFacts) {
                    return {
                        emotion: 'CALM',
                        decision: 'CONSENT',
                        action: 'สูดลมหายใจลึก คลายไหล่ลง และพยักหน้าช้าๆ ด้วยแววตาที่สงบและซาบซึ้ง',
                        text: persona.id === 'conflict'
                            ? prefixConflict(`ขอบคุณ${addressName}มากนะคะที่รับฟังทั้งสองฝ่ายอย่างอ่อนโยน`, `แม่เข้าใจแล้วล่ะลูก... ในเมื่อทีมแพทย์จะดูแลร่างลูกแม่ให้เรียบร้อยและช่วยต่อชีวิตคนอื่นได้จริง แม่กับภรรยาขอตัดสินใจยินยอมบริจาคอวัยวะเพื่อเป็นบุญครั้งสุดท้ายให้ต้นนะคะ`)
                            : `ขอบคุณ${addressName}มากเลยนะคะที่รับฟังและอธิบายทุกอย่างชัดเจนโดยไม่เร่งรัดเลย ตอนนี้ครอบครัวสบายใจขึ้นมากค่ะ เราขอตัดสินใจยินยอมบริจาคอวัยวะเพื่อส่งต่อชีวิตใหม่ให้ผู้อื่นนะคะ`
                    };
                }
                return {
                    emotion: 'HESITANT',
                    decision: 'DEFER_HOME',
                    action: 'ก้มมองโทรศัพท์ในมืออย่างครุ่นคิดและถอนหายใจเบาๆ',
                    text: persona.id === 'conflict'
                        ? prefixConflict(`ขอบคุณ${addressName}ที่ให้ข้อมูลครบถ้วนนะคะ`, `เรื่องนี้ใหญ่มาก แม่กับภรรยาขออนุญาตกลับไปปรึกษาญาติผู้ใหญ่ที่บ้านก่อนตัดสินใจนะคะ${addressName}`)
                        : `ขอบคุณ${addressName}มากนะคะที่อธิบายให้อย่างสุภาพ แต่เรื่องนี้ใหญ่เกินกว่าจะตัดสินใจคนเดียว หนูขออนุญาตกลับไปปรึกษาครอบครัวที่บ้านก่อนแล้วจะรีบแจ้งกลับนะคะ`
                };
            }

            if (asksHomeTime) {
                return {
                    emotion: 'HESITANT',
                    decision: null,
                    action: 'เงยหน้ามองอย่างลังเล กำมือแน่นแล้วเอ่ยถามเบาๆ',
                    text: persona.id === 'conflict'
                        ? prefixConflict(`ข้อมูลที่${addressName}อธิบายช่วยให้เข้าใจขึ้นมากเลยค่ะ`, `แต่แม่ยังตัดสินใจตอนนี้ไม่ได้จริงๆ... ${addressName}คะ พวกเราสามารถขอกลับไปปรึกษาและตัดสินใจที่บ้านก่อนได้ไหมคะ?`)
                        : `ขอบคุณ${addressName}นะคะที่ค่อยๆ อธิบายให้ฟัง ใจหนูเริ่มสงบลงบ้างแล้วค่ะ แต่เรื่องนี้สำคัญมาก หนูสามารถขอกลับไปปรึกษาและตัดสินใจที่บ้านก่อนได้ไหมคะ?`
                };
            }

            if (turnNumber === 1) {
                return {
                    emotion: hasTrigger ? 'ANGRY' : (hasEmpathy ? 'SAD' : 'CONFUSED'),
                    decision: null,
                    action: hasTrigger ? 'ชะงักและขมวดคิ้ว สีหน้าตึงเครียดขึ้นทันที' : 'ก้มหน้าซับน้ำตาอย่างช้าๆ ก่อนเงยหน้าสบตา',
                    text: persona.id === 'conflict'
                        ? prefixConflict(`ขอบคุณ${addressName}ที่รับฟังนะคะ จริงๆ พี่ต้นเคยพูดไว้ว่าอยากช่วยคนอื่น`, `แต่แม่กลัวว่าถ้าบริจาคแล้วร่างลูกแม่จะไม่เรียบร้อย แล้วจะทำพิธีทางศาสนาได้เหมือนเดิมไหมคะ${addressName}?`)
                        : `ค่ะ${addressName}... หนูพอเข้าใจขึ้นบ้างแล้ว แต่ยังกังวลอยู่อีกเรื่องค่ะ ถ้าสมมติครอบครัวตัดสินใจบริจาคจริง ร่างของท่านจะยังเรียบร้อยเหมือนเดิมไหมคะ แล้วเราจะมีค่าใช้จ่ายอะไรเพิ่มหรือเปล่า?`
                };
            }

            return {
                emotion: hasEmpathy ? 'HESITANT' : 'CONFUSED',
                decision: null,
                action: 'พยักหน้าช้าๆ สีหน้าผ่อนคลายลงเล็กน้อยแต่ยังมีคำถามคาใจ',
                text: persona.id === 'conflict'
                    ? prefixConflict(`ฟัง${addressName}อธิบายแล้วสบายใจเรื่องความโปร่งใสขึ้นเยอะเลยค่ะ`, `แล้วเรื่องการจัดสรรอวัยวะล่ะคะ${addressName} แม่จะมั่นใจได้ยังไงว่าอวัยวะลูกแม่จะไปช่วยคนที่จำเป็นจริงๆ?`)
                    : `ฟัง${addressName}อธิบายแล้วรู้สึกเบาใจขึ้นมากเลยค่ะ แต่อยากถามให้แน่ใจอีกนิดว่า อวัยวะที่บริจาคจะถูกนำไปจัดสรรให้ใคร และขั้นตอนทั้งหมดโปร่งใสตรวจสอบได้ใช่ไหมคะ?`
            };
        }

        // ประเมินผล 5 แกนระดับเครื่อง (Fallback ทันใจและเป็นฐานคะแนนให้ AI Clinical Supervisor)
        function evaluateConversation5Axis(history, silenceHits, triggerCount, finalEmotion, isEn) {
            const learnerMsgs = history.filter(m => m.role === 'learner');
            const joined = learnerMsgs.map(m => m.text).join(' ');
            const msgCount = learnerMsgs.length || 1;

            const hasSetting = /สวัสดี|พยาบาล|ผู้ประสานงาน|ห้องส่วนตัว|เงียบ|แนะนำ|ชื่อ|hello|coordinator|private|quiet/i.test(joined);
            const hasEmpathy = /เสียใจ|เข้าใจ|หนักใจ|รับฟัง|เจ็บปวด|อยู่ข้าง|เป็นกำลังใจ|sorry|understand|listen|hear you|feel/i.test(joined);
            const hasClarity = /สมองตาย|เครื่องช่วยหายใจ|ก้านสมอง|แพทย์|3 ท่าน|สภากาชาด|odc|ไม่มีค่าใช้จ่าย|โปร่งใส|brain death|ventilator|transparent|no cost/i.test(joined);
            const hasDignity = /ไม่เร่งรัด|ค่อยๆ|เวลา|เคารพ|ตกแต่งร่าง|เรียบร้อย|สมเกียรติ|พิธีกรรม|no rush|time|respect|dignity|ceremony/i.test(joined);

            const setting = Math.min(98, Math.max(58, (hasSetting ? 84 : 66) + Math.min(10, msgCount * 2)));
            const empathy = Math.min(98, Math.max(55, (hasEmpathy ? 85 : 64) + (finalEmotion === 'CALM' ? 9 : 0) - triggerCount * 7));
            const clarity = Math.min(98, Math.max(56, (hasClarity ? 86 : 65) + Math.min(8, Math.floor(joined.length / 80) * 2)));
            const vocal = Math.min(98, Math.max(60, 74 + Math.min(18, silenceHits * 6) - triggerCount * 5));
            const dignity = Math.min(98, Math.max(55, (hasDignity ? 87 : 66) - triggerCount * 9));

            const radar = [
                { key: 'setting', value: setting },
                { key: 'empathy', value: empathy },
                { key: 'clarity', value: clarity },
                { key: 'vocal', value: vocal },
                { key: 'dignity', value: dignity }
            ];
            const overallScore = Math.round(radar.reduce((s, r) => s + r.value, 0) / radar.length);

            const goldenMsg = learnerMsgs.find(m => /เสียใจ|เข้าใจ|เคารพ|ไม่เร่งรัด|sorry|understand|respect/i.test(m.text)) || learnerMsgs[0];
            const turningMsg = learnerMsgs.find(m => detectTriggerPhrases(m.text, isEn ? 'en' : 'th').length > 0) || learnerMsgs[learnerMsgs.length - 1];

            return {
                overallScore,
                radar,
                summary: isEn
                    ? `You completed ${msgCount} turns with ${silenceHits} therapeutic silence pauses. Keep centering emotional empathy and zero-pressure pacing.`
                    : `คุณสื่อสารได้อย่างสุภาพครบ ${msgCount} รอบ และใช้จังหวะเงียบเยียวยา ${silenceHits} ครั้ง จุดแข็งคือการประคับประคองอารมณ์และการให้ข้อมูลที่โปร่งใสค่ะ`,
                goldenMoment: goldenMsg
                    ? { quote: goldenMsg.text.slice(0, 140), reason: isEn ? 'Built immediate psychological safety.' : 'ช่วยลดความตึงเครียดและสร้างพื้นที่ปลอดภัยทางใจให้ญาติได้ดีมากค่ะ' }
                    : null,
                turningPoint: turningMsg
                    ? {
                        quote: turningMsg.text.slice(0, 120),
                        suggestion: isEn
                            ? 'Pause 2.5 seconds after emotional waves and affirm family autonomy before giving next facts.'
                            : 'ลองเว้นจังหวะเงียบ 2.5 วินาทีหลังญาติสะท้อนอารมณ์ และเน้นย้ำว่าทีมเคารพทุกการตัดสินใจโดยไม่เร่งรัด จะยิ่งนุ่มนวลขึ้นค่ะ'
                    }
                    : null,
                evaluatedByAi: false
            };
        }

        // ============================================================================
        // 3. SHARED UI PRIMITIVES & 6-STYLE ULTRA-SMOOTH 3D HOLOGRAM STAGE
        // ============================================================================
        class LabErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, err: null }; }
            static getDerivedStateFromError(err) { return { hasError: true, err }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-dvh flex items-center justify-center p-6 bg-[#020612] text-white">
                            <div className="holo-obsidian-card max-w-md w-full rounded-3xl p-6 text-center space-y-4 border-rose-500/40">
                                <h2 className="font-display font-bold text-lg text-rose-400">พบข้อผิดพลาดชั่วคราวในห้อง AI Skill Lab</h2>
                                <p className="text-xs font-mono bg-rose-500/10 text-rose-300 p-3 rounded-xl overflow-auto">{String(this.state.err?.message || this.state.err)}</p>
                                <button type="button" onClick={() => window.location.reload()} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-bold text-sm">โหลดหน้าใหม่</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function Icon({ name, size = 18, className = '' }) {
            const Comp = LucideIcons[name] || LucideIcons.Sparkles;
            return Comp ? <Comp size={size} className={className} /> : null;
        }

        function ThemeToggleButton({ theme, onToggle }) {
            const isDark = theme === 'dark';
            return (
                <button
                    type="button"
                    onClick={onToggle}
                    aria-label="สลับโหมดมืดหรือสว่าง"
                    className="spatial-soft px-2.5 sm:px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 text-primary-adaptive shrink-0"
                >
                    <Icon name={isDark ? 'Sun' : 'Moon'} size={15} className={isDark ? 'text-amber-300' : 'text-indigo-600'} />
                    <span className="hidden sm:inline">{isDark ? 'โหมดสว่าง' : 'โหมดมืด'}</span>
                </button>
            );
        }

        function ToastBanner({ toast }) {
            if (!toast.visible) return null;
            return (
                <div className="fixed top-[calc(1rem+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 z-[150] w-[92vw] max-w-md pointer-events-none">
                    <div className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-2xl flex items-center gap-2.5 text-xs sm:text-sm font-bold text-white ${
                        toast.type === 'error' ? 'bg-rose-700/95 border-rose-400/60'
                            : toast.type === 'info' ? 'bg-sky-700/95 border-sky-400/60'
                                : 'bg-emerald-700/95 border-emerald-400/60'
                    }`}>
                        <Icon name={toast.type === 'error' ? 'AlertCircle' : toast.type === 'info' ? 'Sparkles' : 'CheckCircle2'} size={17} className="shrink-0" />
                        <span>{toast.text}</span>
                    </div>
                </div>
            );
        }

        function FiveAxisRadarSVG({ radar, isEn, theme }) {
            const isDark = theme === 'dark';
            const size = 250, cx = size / 2, cy = size / 2, maxR = 76;
            const valMap = {};
            (radar || []).forEach(r => { valMap[r.key] = Number(r.value || 0); });
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / RADAR_AXES.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const dataPts = RADAR_AXES.map((a, i) => pt(i, (valMap[a.key] || 0) / 100));

            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full max-w-[260px] mx-auto overflow-visible">
                    <defs>

        function ThreeHologramStage({ emotionKey, isSpeaking, styleId = 'particles', activeSpeaker = 'wife', compact = false }) {
            const mountRef = useRef(null);
            const liveRef = useRef({ emotionKey, isSpeaking, styleId, activeSpeaker, compact });
            useEffect(() => {
                liveRef.current = { emotionKey, isSpeaking, styleId, activeSpeaker, compact };
            }, [emotionKey, isSpeaking, styleId, activeSpeaker, compact]);

            useEffect(() => {
                const container = mountRef.current;
                const THREE = window.THREE;
                if (!container || !THREE) return;

                const width = Math.max(1, container.clientWidth || window.innerWidth);
                const height = Math.max(1, container.clientHeight || window.innerHeight);

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(compact ? 44 : 48, width / height, 0.1, 100);
                const resolveCamZ = (w) => (compact ? (w < 480 ? 6.2 : 5.4) : (w < 640 ? 7.2 : 5.8));
                camera.position.set(0, compact ? 0.08 : 0.2, resolveCamZ(width));

                let renderer;
                try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' }); }
                catch (_) { return; }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(width, height);
                renderer.setClearColor(0x000000, 0);
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const c = document.createElement('canvas');
                c.width = 64; c.height = 64;
                const g = c.getContext('2d');
                const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.28, 'rgba(255,255,255,0.82)');
                grad.addColorStop(0.68, 'rgba(255,255,255,0.18)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                g.fillStyle = grad;
                g.fillRect(0, 0, 64, 64);
                const tex = new THREE.CanvasTexture(c);

                const disposables = [];
                const track = (obj) => { disposables.push(obj); return obj; };

                const createLiquidMat = () => track(new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    blending: THREE.NormalBlending,
                    uniforms: {
                        uTime: { value: 0 },
                        uSpeak: { value: 0 },
                        uTension: { value: 0.5 },
                        uColor1: { value: new THREE.Color(0x38bdf8) },
                        uColor2: { value: new THREE.Color(0x818cf8) }
                    },
                    vertexShader: LIQUID_ORB_VERT,
                    fragmentShader: LIQUID_ORB_FRAG
                }));

                const stageRoot = new THREE.Group();
                scene.add(stageRoot);

                // ==================== STYLE 01: PARTICLE CORE (แกนอนุภาค) ====================
                const particlesGroup = new THREE.Group();
                stageRoot.add(particlesGroup);

                const COUNT = compact ? 1100 : 1800;
                const basePos = new Float32Array(COUNT * 3);
                const pos = new Float32Array(COUNT * 3);
                const cols = new Float32Array(COUNT * 3);
                const seeds = new Float32Array(COUNT);
                const golden = Math.PI * (3 - Math.sqrt(5));

                for (let i = 0; i < COUNT; i++) {
                    const y = 1 - (i / (COUNT - 1)) * 2;
                    const r = Math.sqrt(Math.max(0, 1 - y * y));
                    const theta = golden * i;
                    const rad = 1.56 + (i % 7 === 0 ? 0.46 : 0) + (Math.random() - 0.5) * 0.14;
                    basePos[i * 3] = Math.cos(theta) * r * rad;
                    basePos[i * 3 + 1] = y * rad;
                    basePos[i * 3 + 2] = Math.sin(theta) * r * rad;
                    pos[i * 3] = basePos[i * 3];
                    pos[i * 3 + 1] = basePos[i * 3 + 1];
                    pos[i * 3 + 2] = basePos[i * 3 + 2];
                    seeds[i] = Math.random() * Math.PI * 2;
                }

                const pGeo = track(new THREE.BufferGeometry());
                pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                pGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
                const pMat = track(new THREE.PointsMaterial({
                    size: 0.086, map: tex, vertexColors: true,
                    transparent: true, opacity: 0.92, depthWrite: false,
                    blending: THREE.AdditiveBlending
                }));
                particlesGroup.add(new THREE.Points(pGeo, pMat));

                const coreMat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.14, blending: THREE.AdditiveBlending }));
                const coreMesh = new THREE.Mesh(track(new THREE.IcosahedronGeometry(0.9, 2)), coreMat);
                particlesGroup.add(coreMesh);

                const ringMat = track(new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
                const ring = new THREE.Mesh(track(new THREE.TorusGeometry(2.22, 0.011, 16, 128)), ringMat);
                ring.rotation.x = Math.PI * 0.42;
                particlesGroup.add(ring);

                const outerRingMat = track(new THREE.MeshBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending }));
                const outerRing = new THREE.Mesh(track(new THREE.TorusGeometry(2.58, 0.007, 12, 128)), outerRingMat);
                outerRing.rotation.x = Math.PI * 0.56;
                outerRing.rotation.y = Math.PI * 0.2;
                particlesGroup.add(outerRing);

                // ==================== STYLE 02: LIQUID AURORA ORB (ลูกแก้วออร่า) ====================
                const liquidGroup = new THREE.Group();
                liquidGroup.visible = false;
                stageRoot.add(liquidGroup);

                const liquidOrbMat = createLiquidMat();
                const liquidOrb = new THREE.Mesh(track(new THREE.SphereGeometry(1.42, 64, 64)), liquidOrbMat);
                liquidGroup.add(liquidOrb);

                const innerCoreMat = track(new THREE.MeshBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
                const innerCore = new THREE.Mesh(track(new THREE.SphereGeometry(0.86, 32, 32)), innerCoreMat);
                liquidGroup.add(innerCore);

                const mistCount = 130;
                const mistPos = new Float32Array(mistCount * 3);
                const mistBase = new Float32Array(mistCount * 3);
                for (let i = 0; i < mistCount; i++) {
                    const th = Math.random() * Math.PI * 2;
                    const ph = Math.acos(2 * Math.random() - 1);
                    const rad = 1.75 + Math.random() * 0.85;
                    mistBase[i * 3] = Math.sin(ph) * Math.cos(th) * rad;
                    mistBase[i * 3 + 1] = Math.cos(ph) * rad;
                    mistBase[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * rad;
                    mistPos[i * 3] = mistBase[i * 3];
                    mistPos[i * 3 + 1] = mistBase[i * 3 + 1];
                    mistPos[i * 3 + 2] = mistBase[i * 3 + 2];
                }
                const mistGeo = track(new THREE.BufferGeometry());
                mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
                const mistMat = track(new THREE.PointsMaterial({ size: 0.14, map: tex, color: 0x67e8f9, transparent: true, opacity: 0.65, depthWrite: false, blending: THREE.AdditiveBlending }));
                liquidGroup.add(new THREE.Points(mistGeo, mistMat));

                // ==================== STYLE 03: BREATHING SILK WAVES (คลื่นไหมแสง) ====================
                const silkGroup = new THREE.Group();
                silkGroup.visible = false;
                stageRoot.add(silkGroup);

                const SILK_LINES = 20, SILK_PTS = 96;
                const silkItems = [];
                for (let l = 0; l < SILK_LINES; l++) {
                    const arr = new Float32Array(SILK_PTS * 3);
                    const geo = track(new THREE.BufferGeometry());
                    geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
                    const t = l / (SILK_LINES - 1);
                    const mat = track(new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.18 + Math.sin(t * Math.PI) * 0.64, blending: THREE.AdditiveBlending, depthWrite: false }));
                    silkGroup.add(new THREE.Line(geo, mat));
                    silkItems.push({ geo, mat, t, phaseOffset: l * 0.28 });
                }

                // ==================== STYLE 04: LUMINOUS LOTUS (ดอกบัวแสง) ====================
                const lotusGroup = new THREE.Group();
                lotusGroup.visible = false;
                stageRoot.add(lotusGroup);

                const buildPetalGeo = (w, h) => {
                    const geo = track(new THREE.PlaneGeometry(w, h, 8, 14));
                    const pa = geo.attributes.position;
                    for (let i = 0; i < pa.count; i++) {
                        const x = pa.getX(i), y = pa.getY(i) + h * 0.5;
                        const ny = y / h, taper = Math.sin(ny * Math.PI);
                        pa.setXYZ(i, x * (0.25 + taper * 0.92), y, Math.pow(Math.abs(x / (w * 0.5)), 2) * 0.24 * taper + taper * 0.22);
                    }
                    geo.computeVertexNormals();
                    return geo;
                };

                const lotusPetals = [];
                [
                    { count: 6, w: 0.55, h: 1.25, baseTilt: 0.18, openTilt: 0.68 },
                    { count: 9, w: 0.68, h: 1.56, baseTilt: 0.28, openTilt: 1.02 },
                    { count: 12, w: 0.78, h: 1.8, baseTilt: 0.36, openTilt: 1.32 }
                ].forEach((ly, li) => {
                    const petalGeo = buildPetalGeo(ly.w, ly.h);
                    const edgeGeo = track(new THREE.EdgesGeometry(petalGeo, 25));
                    for (let k = 0; k < ly.count; k++) {
                        const pivot = new THREE.Group();
                        pivot.rotation.y = (k / ly.count) * Math.PI * 2 + li * 0.35;
                        const holder = new THREE.Group();
                        const mat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.22 + (2 - li) * 0.08, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
                        const rimMat = track(new THREE.LineBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.38, blending: THREE.AdditiveBlending }));
                        holder.add(new THREE.Mesh(petalGeo, mat));
                        holder.add(new THREE.LineSegments(edgeGeo, rimMat));
                        pivot.add(holder);
                        lotusGroup.add(pivot);
                        lotusPetals.push({ holder, mat, rimMat, layerIdx: li, baseTilt: ly.baseTilt, openTilt: ly.openTilt, seed: k * 0.7 + li * 1.9 });
                    }
                });

                const lotusCoreMat = track(new THREE.MeshBasicMaterial({ color: 0xa7f3d0, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending }));
                const lotusCore = new THREE.Mesh(track(new THREE.SphereGeometry(0.34, 24, 24)), lotusCoreMat);
                lotusCore.position.y = 0.38;
                lotusGroup.add(lotusCore);

                const pollenCount = 80;
                const pollenPos = new Float32Array(pollenCount * 3);
                for (let i = 0; i < pollenCount; i++) {
                    const a = Math.random() * Math.PI * 2, r = 0.2 + Math.random() * 1.35;
                    pollenPos[i * 3] = Math.cos(a) * r;
                    pollenPos[i * 3 + 1] = Math.random() * 2.4;
                    pollenPos[i * 3 + 2] = Math.sin(a) * r;
                }
                const pollenGeo = track(new THREE.BufferGeometry());
                pollenGeo.setAttribute('position', new THREE.BufferAttribute(pollenPos, 3));
                const pollenMat = track(new THREE.PointsMaterial({ size: 0.13, map: tex, color: 0x6ee7b7, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
                lotusGroup.add(new THREE.Points(pollenGeo, pollenMat));

                // ==================== STYLE 05: DUAL-CORE VOICES (ดวงแสงคู่ 2 เสียง) ====================
                const dualGroup = new THREE.Group();
                dualGroup.visible = false;
                stageRoot.add(dualGroup);

                const wifeMat = createLiquidMat();
                const wifeOrb = new THREE.Mesh(track(new THREE.SphereGeometry(0.88, 48, 48)), wifeMat);
                dualGroup.add(wifeOrb);

                const motherMat = createLiquidMat();
                const motherOrb = new THREE.Mesh(track(new THREE.SphereGeometry(0.94, 48, 48)), motherMat);
                dualGroup.add(motherOrb);

                const bridgeLines = [];
                const BRIDGE_PTS = 44;
                for (let b = 0; b < 7; b++) {
                    const arr = new Float32Array(BRIDGE_PTS * 3);
                    const geo = track(new THREE.BufferGeometry());
                    geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
                    const mat = track(new THREE.LineBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending }));
                    dualGroup.add(new THREE.Line(geo, mat));
                    bridgeLines.push({ geo, mat, idx: b });
                }

                const unityRingMat = track(new THREE.MeshBasicMaterial({ color: 0x6ee7b7, transparent: true, opacity: 0.24, blending: THREE.AdditiveBlending }));
                const unityRing = new THREE.Mesh(track(new THREE.TorusGeometry(2.3, 0.012, 14, 110)), unityRingMat);
                unityRing.rotation.x = Math.PI * 0.44;
                dualGroup.add(unityRing);

                // ==================== STYLE 06: SLANTED 3D AUDIO VISUALIZER (คลื่นเสียงแนวเฉียง) ====================
                const slantedGroup = new THREE.Group();
                slantedGroup.visible = false;
                stageRoot.add(slantedGroup);

                const slantedPlane = new THREE.Group();
                slantedPlane.rotation.set(0.18, -0.34, -0.24);
                slantedGroup.add(slantedPlane);

                const EQ_BARS = 44, EQ_SPAN = 5.4;
                const eqBarGeo = track(new THREE.BoxGeometry(0.072, 1.0, 0.072));
                const eqCapGeo = track(new THREE.BoxGeometry(0.082, 0.042, 0.082));
                const eqBars = [];

                for (let i = 0; i < EQ_BARS; i++) {
                    const u = i / (EQ_BARS - 1);
                    const x = (u - 0.5) * EQ_SPAN;
                    const barMat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false }));
                    const upperMesh = new THREE.Mesh(eqBarGeo, barMat);
                    upperMesh.position.set(x, 0.08, 0);
                    slantedPlane.add(upperMesh);

                    const reflMat = track(new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false }));
                    const lowerMesh = new THREE.Mesh(eqBarGeo, reflMat);
                    lowerMesh.position.set(x, -0.08, 0);
                    slantedPlane.add(lowerMesh);

                    const capMat = track(new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.96, blending: THREE.AdditiveBlending, depthWrite: false }));
                    const capMesh = new THREE.Mesh(eqCapGeo, capMat);
                    capMesh.position.set(x, 0.2, 0);
                    slantedPlane.add(capMesh);

                    eqBars.push({ u, x, upperMesh, lowerMesh, capMesh, barMat, reflMat, capMat, heightVal: 0.14, peakVal: 0.22, seed: Math.random() * Math.PI * 2 });
                }

                const baseBeamMat = track(new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.62, blending: THREE.AdditiveBlending, depthWrite: false }));
                slantedPlane.add(new THREE.Mesh(track(new THREE.BoxGeometry(EQ_SPAN + 0.55, 0.024, 0.036)), baseBeamMat));

                const backRailMat = track(new THREE.MeshBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false }));
                const backRail = new THREE.Mesh(track(new THREE.BoxGeometry(EQ_SPAN + 0.95, 0.01, 0.01)), backRailMat);
                backRail.position.set(0, 0, -0.35);
                slantedPlane.add(backRail);

                const eqSparkCount = 72;
                const eqSparkPos = new Float32Array(eqSparkCount * 3);
                const eqSparkSpeed = new Float32Array(eqSparkCount);
                for (let i = 0; i < eqSparkCount; i++) {
                    eqSparkPos[i * 3] = (Math.random() - 0.5) * (EQ_SPAN + 0.8);
                    eqSparkPos[i * 3 + 1] = (Math.random() - 0.5) * 2.2;
                    eqSparkPos[i * 3 + 2] = (Math.random() - 0.5) * 0.9;
                    eqSparkSpeed[i] = 0.28 + Math.random() * 0.55;
                }
                const eqSparkGeo = track(new THREE.BufferGeometry());
                eqSparkGeo.setAttribute('position', new THREE.BufferAttribute(eqSparkPos, 3));
                const eqSparkMat = track(new THREE.PointsMaterial({ size: 0.11, map: tex, color: 0x67e8f9, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending, depthWrite: false }));
                slantedPlane.add(new THREE.Points(eqSparkGeo, eqSparkMat));

                const styleGroups = {
                    particles: particlesGroup,
                    liquid: liquidGroup,
                    silk: silkGroup,
                    lotus: lotusGroup,
                    dual: dualGroup,
                    slanted_eq: slantedGroup
                };

                // Ultra-Smooth Orbit Drag Controls (Mouse & Touch)
                let dragging = false, lastX = 0, lastY = 0;
                let targetRotY = 0, targetRotX = 0, smoothRotY = 0, smoothRotX = 0;
                const startDrag = (x, y) => { dragging = true; lastX = x; lastY = y; };
                const moveDrag = (x, y) => {
                    if (!dragging) return;
                    targetRotY += (x - lastX) * 0.0055;
                    targetRotX = Math.max(-0.55, Math.min(0.55, targetRotX + (y - lastY) * 0.0042));
                    lastX = x; lastY = y;
                };
                const endDrag = () => { dragging = false; };

                const onMouseDown = (e) => startDrag(e.clientX, e.clientY);
                const onMouseMove = (e) => moveDrag(e.clientX, e.clientY);
                const onTouchStart = (e) => { if (e.touches[0]) startDrag(e.touches[0].clientX, e.touches[0].clientY); };
                const onTouchMove = (e) => { if (e.touches[0]) moveDrag(e.touches[0].clientX, e.touches[0].clientY); };

                renderer.domElement.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', endDrag);
                renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: true });
                window.addEventListener('touchmove', onTouchMove, { passive: true });
                window.addEventListener('touchend', endDrag);

                const onResize = () => {
                    if (!container) return;
                    const w = Math.max(1, container.clientWidth || window.innerWidth);
                    const h = Math.max(1, container.clientHeight || window.innerHeight);
                    camera.aspect = w / h;
                    camera.position.z = resolveCamZ(w);
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', onResize);

                const c1 = new THREE.Color(0x38bdf8), c2 = new THREE.Color(0x818cf8);
                const t1 = new THREE.Color(), t2 = new THREE.Color(), tmp = new THREE.Color();
                const whiteCol = new THREE.Color(0xffffff);
                const bloomMap = { SHOCK: 0.18, CONFUSED: 0.42, ANGRY: 0.12, SAD: 0.52, HESITANT: 0.64, CALM: 1.0 };

                // Phase Integration + Exponential Damping Loop
                let breathPhase = 0, wavePhase = 0, colorPhase = 0;
                let smoothSpeed = 0.9, smoothSpeak = 0, smoothBloom = 0.45, smoothTension = 0.65, smoothWifeFocus = 1, autoYaw = 0;
                let last = performance.now(), rafId = null;

                const animate = (now) => {
                    rafId = requestAnimationFrame(animate);
                    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
                    last = now;

                    const { emotionKey: ek, isSpeaking: speaking, styleId: activeStyle, activeSpeaker: spk, compact: isCompact } = liveRef.current;
                    const meta = EMOTION_PHYSICS[ek] || EMOTION_PHYSICS.CONFUSED;
                    const targetBloom = bloomMap[ek] ?? 0.45;
                    const targetTension = Math.max(0.08, Math.min(1, (meta.tension || 60) / 100));

                    Object.keys(styleGroups).forEach((k) => { styleGroups[k].visible = (k === activeStyle); });

                    const dampColor = 1 - Math.exp(-dt * 2.2);
                    const dampVal = 1 - Math.exp(-dt * 2.8);
                    const dampSpeak = 1 - Math.exp(-dt * 4.2);
                    const dampDrag = 1 - Math.exp(-dt * 6.5);

                    t1.setHex(meta.primaryHex);
                    t2.setHex(meta.secondaryHex);
                    c1.lerp(t1, dampColor);
                    c2.lerp(t2, dampColor);

                    smoothSpeed += (meta.speed - smoothSpeed) * dampVal;
                    smoothSpeak += ((speaking ? 1 : 0) - smoothSpeak) * dampSpeak;
                    smoothBloom += (targetBloom - smoothBloom) * dampVal;
                    smoothTension += (targetTension - smoothTension) * dampVal;
                    smoothWifeFocus += ((spk === 'mother' ? 0 : 1) - smoothWifeFocus) * dampVal;
                    smoothRotX += (targetRotX - smoothRotX) * dampDrag;
                    smoothRotY += (targetRotY - smoothRotY) * dampDrag;

                    breathPhase += dt * (0.72 + smoothSpeed * 0.28);
                    wavePhase += dt * (0.68 + smoothSpeed * 0.45 + smoothSpeak * 0.72);
                    colorPhase += dt * 0.36;
                    autoYaw += dt * (0.055 + smoothSpeak * 0.035);

                    stageRoot.position.y = (isCompact ? 0.04 : 0.62) + Math.sin(breathPhase * 0.7) * 0.04;
                    stageRoot.rotation.x = smoothRotX;
                    stageRoot.rotation.y = smoothRotY;

                    if (particlesGroup.visible) {
                        const pArr = pGeo.attributes.position.array;
                        const cArr = pGeo.attributes.color.array;
                        const speakRipple = smoothSpeak * (0.028 + 0.02 * Math.sin(wavePhase * 2.8) + 0.011 * Math.cos(wavePhase * 4.3));
                        const breath = 1 + Math.sin(breathPhase) * 0.026 + speakRipple;
                        const waveAmp = 0.026 + smoothSpeak * 0.028;

                        for (let i = 0; i < COUNT; i++) {
                            const i3 = i * 3;
                            const bx = basePos[i3], by = basePos[i3 + 1], bz = basePos[i3 + 2];
                            const sd = seeds[i];
                            const sc = breath + Math.sin(wavePhase + by * 1.25 + bx * 0.72 + sd * 0.15) * waveAmp + Math.cos(breathPhase * 0.85 + bz * 1.1 - bx * 0.55) * 0.014;
                            pArr[i3] = bx * sc; pArr[i3 + 1] = by * sc; pArr[i3 + 2] = bz * sc;
                            tmp.copy(c1).lerp(c2, 0.5 + 0.5 * Math.sin(colorPhase + by * 0.85 + sd * 0.22));
                            cArr[i3] = tmp.r; cArr[i3 + 1] = tmp.g; cArr[i3 + 2] = tmp.b;
                        }
                        pGeo.attributes.position.needsUpdate = true;

                        coreMat.color.copy(c1);

                        outerRingMat.color.copy(c1);

                        coreMesh.rotation.y = -autoYaw * 1.15;

                        liquidOrbMat.uniforms.uSpeak.value = smoothSpeak;
                        liquidOrbMat.uniforms.uTension.value = smoothTension;
                        liquidOrbMat.uniforms.uColor1.value.copy(c1);
                        liquidOrbMat.uniforms.uColor2.value.copy(c2);
                        innerCoreMat.color.copy(c1);
                        innerCore.scale.setScalar(1 + Math.sin(breathPhase * 1.3) * 0.05 + smoothSpeak * 0.08 * Math.sin(wavePhase * 3.2));
                        liquidOrb.rotation.y = wavePhase * 0.12;
                        mistMat.color.copy(c2);
                        const mArr = mistGeo.attributes.position.array;
                        for (let i = 0; i < mistCount; i++) {
                            const i3 = i * 3;
                            const d = 1 + Math.sin(wavePhase * 0.65 + i * 0.4) * 0.06 + smoothSpeak * 0.05;
                            mArr[i3] = mistBase[i3] * d;
                            mArr[i3 + 1] = mistBase[i3 + 1] * d + Math.sin(breathPhase + i) * 0.045;
                            mArr[i3 + 2] = mistBase[i3 + 2] * d;
                        }
                        mistGeo.attributes.position.needsUpdate = true;
                        liquidGroup.rotation.y = autoYaw * 0.7;
                    }

                    if (silkGroup.visible) {
                        silkItems.forEach((item) => {
                            const arr = item.geo.attributes.position.array;
                            const spreadY = (item.t - 0.5) * 1.55;
                            const spreadZ = (item.t - 0.5) * 1.15;
                            const amp = 0.2 + smoothSpeak * (0.4 + 0.16 * Math.sin(wavePhase * 2.2 + item.phaseOffset)) + smoothTension * 0.11;
                            for (let j = 0; j < SILK_PTS; j++) {
                                const u = j / (SILK_PTS - 1), env = Math.sin(u * Math.PI);
                                arr[j * 3] = (u - 0.5) * 6.0;
                                arr[j * 3 + 1] = spreadY * (0.5 + env * 0.68) + Math.sin(u * 6.6 - wavePhase * 1.5 + item.phaseOffset) * amp * env + Math.cos(u * 11.2 + wavePhase * 1.05) * (amp * 0.24) * env;
                                arr[j * 3 + 2] = spreadZ * env + Math.cos(u * 5.0 + wavePhase * 1.1 + item.phaseOffset) * 0.42 * env;
                            }
                            item.geo.attributes.position.needsUpdate = true;
                            tmp.copy(c1).lerp(c2, item.t);

                    if (lotusGroup.visible) {

                        lotusCoreMat.color.copy(c1).lerp(whiteCol, 0.45);

                    if (dualGroup.visible) {
                        const separation = 1.0 + smoothTension * 0.7;
                        const orbitAngle = wavePhase * 0.14;
                        const wx = -Math.cos(orbitAngle) * separation, wz = -Math.sin(orbitAngle) * separation * 0.42;
                        const mx = Math.cos(orbitAngle) * separation, mz = Math.sin(orbitAngle) * separation * 0.42;
                        const wSpeak = smoothSpeak * smoothWifeFocus, mSpeak = smoothSpeak * (1 - smoothWifeFocus);

                        wifeOrb.position.set(wx, Math.sin(breathPhase * 1.1) * 0.08, wz);
                        wifeOrb.scale.setScalar(0.86 + wSpeak * 0.24);
                        wifeMat.uniforms.uTime.value = wavePhase;
                        wifeMat.uniforms.uSpeak.value = wSpeak;
                        wifeMat.uniforms.uTension.value = smoothTension * 0.65;
                        wifeMat.uniforms.uColor1.value.setHex(0x38bdf8).lerp(c1, 0.35);
                        wifeMat.uniforms.uColor2.value.setHex(0x6ee7b7);

                        motherOrb.position.set(mx, Math.cos(breathPhase * 0.95) * 0.08, mz);
                        motherOrb.scale.setScalar(0.86 + mSpeak * 0.24);
                        motherMat.uniforms.uTime.value = wavePhase * 1.05 + 1.4;
                        motherMat.uniforms.uSpeak.value = mSpeak;
                        motherMat.uniforms.uTension.value = smoothTension;
                        motherMat.uniforms.uColor1.value.setHex(0xf43f5e).lerp(c1, (1 - smoothTension) * 0.7);
                        motherMat.uniforms.uColor2.value.setHex(0xfbbf24).lerp(c2, (1 - smoothTension) * 0.7);

                        bridgeLines.forEach((b) => {
                            const arr = b.geo.attributes.position.array;
                            const arcSpread = (b.idx - 3) * 0.17;
                            for (let j = 0; j < BRIDGE_PTS; j++) {
                                const u = j / (BRIDGE_PTS - 1), env = Math.sin(u * Math.PI);
                                arr[j * 3] = wx + (mx - wx) * u;
                                arr[j * 3 + 1] = (wifeOrb.position.y * (1 - u) + motherOrb.position.y * u) + arcSpread * env + Math.sin(u * 6.8 + wavePhase * 1.9 + b.idx) * (0.07 + smoothSpeak * 0.08) * env;
                                arr[j * 3 + 2] = wz + (mz - wz) * u + Math.cos(u * 4.8 - wavePhase * 1.3 + b.idx) * 0.2 * env;
                            }
                            b.geo.attributes.position.needsUpdate = true;
                            b.mat.color.copy(c1);
                            b.mat.opacity = 0.18 + (1 - smoothTension) * 0.55;
                        });
                        unityRingMat.color.copy(c2);
                        unityRingMat.opacity = 0.16 + (1 - smoothTension) * 0.35;
                        unityRing.rotation.z += dt * 0.075;
                    }

                    if (slantedGroup.visible) {
                        const eqDampRise = 1 - Math.exp(-dt * 12.0);
                        const eqDampFall = 1 - Math.exp(-dt * 5.2);
                        const beatPulse = 0.55 + 0.45 * Math.pow(Math.max(0, Math.sin(wavePhase * 2.65)), 2);

                        slantedPlane.rotation.z = -0.24 + Math.sin(breathPhase * 0.65) * 0.018;
                        slantedPlane.rotation.y = -0.34 + Math.cos(breathPhase * 0.5) * 0.045;
                        slantedPlane.rotation.x = 0.18 + Math.sin(breathPhase * 0.45) * 0.025;

                        baseBeamMat.color.copy(c1).lerp(whiteCol, 0.25);
                        baseBeamMat.opacity = 0.45 + smoothSpeak * 0.4;
                        backRailMat.color.copy(c2);

                        for (let i = 0; i < EQ_BARS; i++) {
                            const b = eqBars[i];
                            const centerBell = Math.pow(Math.sin(b.u * Math.PI), 0.78);
                            const formant1 = Math.abs(Math.sin(b.u * 10.5 - wavePhase * 2.9 + b.seed * 0.35));
                            const formant2 = Math.abs(Math.cos(b.u * 19.0 + wavePhase * 3.8 + b.seed * 0.6));
                            const subBass = Math.exp(-Math.pow((b.u - 0.28) * 4.2, 2)) * beatPulse;
                            const vocalMid = Math.exp(-Math.pow((b.u - 0.56) * 4.8, 2)) * formant1;
                            const breathIdle = (0.1 + 0.08 * Math.sin(breathPhase * 1.4 + b.u * 5.0)) * (0.45 + centerBell * 0.55);

                            const speakEnergy = (0.18 + (formant1 * 0.56 + formant2 * 0.34 + subBass * 0.65 + vocalMid * 0.42) * (0.78 + smoothTension * 0.38)) * (0.35 + centerBell * 1.15);
                            const targetH = breathIdle * (1 - smoothSpeak) + speakEnergy * smoothSpeak;

                            b.heightVal += (targetH - b.heightVal) * (targetH > b.heightVal ? eqDampRise : eqDampFall);
                            const peakTarget = b.heightVal + 0.065;
                            if (peakTarget > b.peakVal) b.peakVal = peakTarget;
                            else b.peakVal = Math.max(peakTarget, b.peakVal - dt * (0.42 + (1 - smoothSpeak) * 0.25));

                            const hClamped = Math.max(0.06, Math.min(2.15, b.heightVal));
                            b.upperMesh.scale.y = hClamped;
                            b.upperMesh.position.y = 0.03 + hClamped * 0.5;

                            const reflH = hClamped * 0.52;
                            b.lowerMesh.scale.y = reflH;
                            b.lowerMesh.position.y = -0.03 - reflH * 0.5;
                            b.capMesh.position.y = 0.05 + Math.min(2.3, b.peakVal);

                            tmp.copy(c1).lerp(c2, b.u);
                            b.barMat.color.copy(tmp).lerp(whiteCol, Math.min(0.45, hClamped * 0.2));
                            b.reflMat.color.copy(tmp);
                            b.reflMat.opacity = 0.16 + Math.min(0.28, hClamped * 0.14);
                            b.capMat.color.copy(tmp).lerp(whiteCol, 0.72);
                        }

                        eqSparkMat.color.copy(c2).lerp(whiteCol, 0.35);
                        eqSparkMat.opacity = 0.35 + smoothSpeak * 0.48;
                        const sArr = eqSparkGeo.attributes.position.array;
                        for (let i = 0; i < eqSparkCount; i++) {
                            const i3 = i * 3;
                            sArr[i3 + 1] += dt * eqSparkSpeed[i] * (0.35 + smoothSpeak * 1.15);
                            if (sArr[i3 + 1] > 1.85) {
                                sArr[i3 + 1] = -0.45;
                                sArr[i3] = (Math.random() - 0.5) * (EQ_SPAN + 0.5);
                            }
                        }
                        eqSparkGeo.attributes.position.needsUpdate = true;
                    }

                    renderer.render(scene, camera);
                };
                rafId = requestAnimationFrame(animate);

                return () => {
                    cancelAnimationFrame(rafId);
                    window.removeEventListener('resize', onResize);
                    renderer.domElement.removeEventListener('mousedown', onMouseDown);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', endDrag);
                    renderer.domElement.removeEventListener('touchstart', onTouchStart);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('touchend', endDrag);
                    disposables.forEach((d) => { try { if (d && typeof d.dispose === 'function') d.dispose(); } catch (_) {} });
                    tex.dispose();
                    renderer.dispose();
                };
            }, [compact]);

            return <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />;
        }

                        const rawRes = await fetch(appsScriptUrl, {

                            <div className="holo-obsidian-card max-w-md w-full rounded-[2rem] p-6 text-center space-y-4 text-white border-cyan-400/40">
                                <span className="font-mono text-[10px] font-bold text-cyan-300 uppercase">MINDFUL DECOMPRESSION</span>
                                <h3 className="font-display font-extrabold text-lg">พักหายใจ 15 วินาทีเพื่อดูแลใจตนเอง</h3>
                                <p className="text-xs text-sky-100/85 leading-relaxed">
                                    การสื่อสารเรื่องความสูญเสียใช้พลังใจสูงมาก ค่อยๆ สูดลมหายใจเข้าลึกๆ 4 วินาที กลั้น 2 วินาที แล้วผ่อนออกยาวๆ 6 วินาทีนะคะ
                                </p>
                                <div className="w-24 h-24 rounded-full bg-gradient-to-br from-emerald-400/25 to-cyan-400/25 border-2 border-cyan-300/60 flex items-center justify-center mx-auto">
                                    <span className="font-mono text-3xl font-extrabold text-emerald-300">{decompressSec}s</span>
                                </div>
                                <button type="button" onClick={() => setShowDecompressModal(false)} className="rjc2-pill-btn touch-target w-full py-3 rounded-full font-display font-extrabold text-sm">
                                    {decompressSec > 0 ? 'ปิดหน้าต่างพักใจ' : 'รู้สึกผ่อนคลายขึ้นแล้ว ✓'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Vimeo Reference Video Modal */}
                    {showVimeoModal && (
                        <div className="fixed inset-0 z-[130] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="spatial-card max-w-3xl w-full rounded-[2rem] p-4 sm:p-5 space-y-3">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-display font-bold text-sm sm:text-base text-primary-adaptive">วิดีโอตัวอย่างการสื่อสารกับญาติผู้เสียชีวิต</h3>
                                    <button type="button" onClick={() => setShowVimeoModal(false)} className="spatial-soft w-9 h-9 rounded-xl flex items-center justify-center text-primary-adaptive">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>
                                <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-black">
                                    <iframe src={VIMEO_EMBED_URL} className="absolute inset-0 w-full h-full border-0" allow="autoplay; fullscreen" allowFullScreen title="Simulation Reference" />
                                </div>
                            </div>
                        </div>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('lab-root'));
        root.render(<LabErrorBoundary><AiSkillLabApp /></LabErrorBoundary>);
    </script>
</body>
</html>
