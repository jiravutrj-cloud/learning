                            analyserRef.current = an;
                            ampBufRef.current = new Uint8Array(an.fftSize);
                        }
                    } catch (_) {}
                }
                if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume().catch(() => {});
                }
                return sharedAudioRef.current;
            }, []);

            const stopAllAiVoice = useCallback(() => {
                voiceSessionRef.current += 1;
                if (voiceAbortRef.current) { try { voiceAbortRef.current.abort(); } catch (_) {} voiceAbortRef.current = null; }
                if (sharedAudioRef.current) {
                    try { sharedAudioRef.current.onended = null; sharedAudioRef.current.onerror = null; sharedAudioRef.current.pause(); } catch (_) {}
                }
                if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} audioUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setVoicePhase('idle');
            }, []);
            useEffect(() => () => stopAllAiVoice(), [stopAllAiVoice]);

            const playRelativeSegments = useCallback(async (fullText, personaIdForVoice, emotionId, lang = 'th') => {
                stopAllAiVoice();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;
                const personaObj = personas.find(p => p.id === personaIdForVoice) || activePersona;
                const segments = SL.splitDualSpeakerSegments(fullText, personaObj);
                const emoStyle = EMOTIONS_DATA[emotionId]?.style || '';
                const langCode = lang === 'en' ? 'en-US' : 'th-TH';

                setLatestCaption(fullText);
                setVoicePhase('loading');
                const a = ensureSharedAudioWithAnalyser();

                for (let i = 0; i < segments.length; i++) {
                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                    const seg = segments[i];
                    setActiveSpeakerKey(seg.speakerKey);
                    setActiveSpeakerBadge(seg.badgeTH);

                    const blob = await fetchStudioTtsBlob({
                        appsScriptUrl,
                        text: seg.text,
                        voiceName: seg.voiceName || 'Sulafat',
                        languageCode: langCode,
                        style: emoStyle,
                        signal: ctrl.signal
                    });
                    if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                    if (!blob || blob.size === 0) continue;

                    setVoicePhase('speaking');
                    if (audioUrlRef.current) { try { URL.revokeObjectURL(audioUrlRef.current); } catch (_) {} }
                    const url = URL.createObjectURL(blob);
                    audioUrlRef.current = url;
                    await new Promise(resolve => {
                        a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                        try { a.load(); } catch (_) {}
                        const p = a.play();
                        if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                    });
                }
                if (voiceSessionRef.current === sid) setVoicePhase('idle');
            }, [stopAllAiVoice, personas, activePersona, appsScriptUrl, ensureSharedAudioWithAnalyser]);

            const playStepGuide = useCallback(async (cacheKey, text) => {
                if (voicePhase !== 'idle') { stopAllAiVoice(); return; }
                stopAllAiVoice();
                const sid = voiceSessionRef.current;
                const ctrl = new AbortController();
                voiceAbortRef.current = ctrl;
                setVoicePhase('loading');
                const a = ensureSharedAudioWithAnalyser();
                const blob = await fetchStudioTtsBlob({
                    appsScriptUrl, text, voiceName: 'Sulafat', languageCode: 'th-TH',
                    style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่อบอุ่น นุ่มนวล คมชัดระดับสตูดิโอ', cacheKey, signal: ctrl.signal
                });
                if (voiceSessionRef.current !== sid || ctrl.signal.aborted) return;
                if (!blob) { setVoicePhase('idle'); showToast('ไม่สามารถเชื่อมต่อเสียง AI สตูดิโอได้ชั่วคราวค่ะ', 'info'); return; }
                setVoicePhase('speaking');
                const url = URL.createObjectURL(blob);
                audioUrlRef.current = url;
                await new Promise(resolve => {
                    a.muted = false; a.src = url; a.onended = () => resolve(true); a.onerror = () => resolve(false);
                    try { a.load(); } catch (_) {}
                    const p = a.play();
                    if (p && typeof p.catch === 'function') p.catch(() => resolve(false));
                });
                if (voiceSessionRef.current === sid) setVoicePhase('idle');
            }, [voicePhase, stopAllAiVoice, ensureSharedAudioWithAnalyser, appsScriptUrl, showToast]);

            // Mount & Sync 2,800-Particle Warm Friendly Anime Stage
            useEffect(() => {
                if ((phase !== 'negotiating' && phase !== 'micro_drill') || !stageContainerRef.current) return;
                const ctrl = mountParticleAnime2800(stageContainerRef.current, {
                    personaId: effectivePersonaId,
                    emotion: currentEmotion,
                    trust: trustScore,
                    isSpeaking: voicePhase === 'speaking',
                    activeSpeaker: activeSpeakerKey,
                    getAudioAmplitude: getLiveAudioAmplitude
                });
                particleCtrlRef.current = ctrl;
                return () => {
                    ctrl.destroy();
                    particleCtrlRef.current = null;
                };
            }, [phase]);

            useEffect(() => {
                if (!particleCtrlRef.current) return;
                particleCtrlRef.current.update({
                    personaId: effectivePersonaId,
                    emotion: currentEmotion,
                    trust: trustScore,
                    isSpeaking: voicePhase === 'speaking',
                    activeSpeaker: activeSpeakerKey,
                    getAudioAmplitude: getLiveAudioAmplitude
                });
            }, [effectivePersonaId, currentEmotion, trustScore, voicePhase, activeSpeakerKey, getLiveAudioAmplitude]);

            // ============================================================================
            // 7. CONSULTATION, MICRO-DRILL, SILENCE 2.5s, MIC & EVALUATION HANDLERS
            // ============================================================================
            const handleApplyRec = () => {
                setSelectedPersonaId(activeRec.personaId);
                setModeId(activeRec.modeId);
                setDifficultyId(activeRec.difficultyId);
                showToast(`เลือกเคสที่ AI แนะนำแล้ว: ${activeRec.headline}`);
            };

            const handleEnterBriefingOrDrill = () => {
                stopAllAiVoice();
                setParticleMode('anime');
                setLearnerVoiceClips([]);
                setHintBanner('');
                if (selectedMode.isDrill) {
                    const st0 = drillStages[0] || MICRO_DRILL_STAGES[0];
                    setDrillIdx(0);
                    setDrillResults([]);
                    setCurrentDrillFeedback(null);
                    setCurrentEmotion(st0.emotion || 'CONFUSED');
                    setActiveSpeakerKey('primary');
                    setActiveSpeakerBadge(st0.badgeTH);
                    setCurrentActionCue(st0.actionTH);
                    setLatestCaption(st0.promptTH);
                    setInputText('');
                    setPhase('micro_drill');
                    setTimeout(() => playRelativeSegments(st0.promptTH, st0.personaId, st0.emotion, 'th'), 320);
                } else {
                    setPhase('briefing');
                }
            };

            const handleStartConsultation = () => {
                stopAllAiVoice();
                setParticleMode('anime');
                const isEn = selectedMode.lang === 'en';
                const openingSpeech = isEn ? (activePersona.openingEN || activePersona.openingTH) : activePersona.openingTH;
                const initEmo = activePersona.openingEmotion || 'CONFUSED';
                setMessages([{ role: 'ai', text: openingSpeech, emotion: initEmo, at: Date.now() }]);
                setCurrentEmotion(initEmo);
                setTrustScore(42);
                setUnlockedBarrierIds([]);
                setSilenceCount(0);
                setTriggerTotal(0);
                setActiveSpeakerKey('primary');
                setActiveSpeakerBadge(activePersona.speakerRoleTH);
                setCurrentActionCue(activePersona.openingActionTH);
                setLatestCaption(openingSpeech);
                setHintBanner('');
                setInputText('');
                setPhase('negotiating');
                setTimeout(() => playRelativeSegments(openingSpeech, activePersona.id, initEmo, selectedMode.lang), 320);
            };

            const handleTherapeuticSilence = () => {
                if (silenceTimer > 0) return;
                setSilenceTimer(3);
                const iv = setInterval(() => {
                    setSilenceTimer(prev => {
                        if (prev <= 1) {
                            clearInterval(iv);
                            setSilenceCount(c => c + 1);
                            setTrustScore(t => Math.min(100, t + 6));
                            showToast('✓ ใช้ความเงียบเยียวยา 2.5 วินาทีสำเร็จ! (+6 ความไว้วางใจ)');
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 900);
            };

            const handleToggleMic = async () => {
                if (isRecordingMic) {
                    setIsRecordingMic(false);
                    if (speechRecRef.current) { try { speechRecRef.current.stop(); } catch (_) {} }
                    if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') { try { mediaRecRef.current.stop(); } catch (_) {} }
                    return;
                }
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { showToast('เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง สามารถพิมพ์ข้อความโต้ตอบได้ทันทีค่ะ', 'info'); return; }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micChunksRef.current = [];
                    micStartTsRef.current = Date.now();
                    const mr = new MediaRecorder(stream);
                    mr.ondataavailable = (ev) => { if (ev.data.size > 0) micChunksRef.current.push(ev.data); };
                    mr.onstop = () => {
                        stream.getTracks().forEach(t => t.stop());
                        const blob = new Blob(micChunksRef.current, { type: 'audio/webm' });
                        const dur = Math.max(1, Math.round((Date.now() - micStartTsRef.current) / 1000));
                        setLearnerVoiceClips(prev => [...prev.slice(-4), { audioUrl: URL.createObjectURL(blob), durationSec: dur }]);
                    };
                    mr.start();
                    mediaRecRef.current = mr;

                    const rec = new SR();
                    rec.lang = selectedMode.lang === 'en' ? 'en-US' : 'th-TH';
                    rec.interimResults = false;
                    rec.onresult = (ev) => {
                        const transcript = ev.results?.[0]?.[0]?.transcript || '';
                        if (transcript) setInputText(prev => (prev ? `${prev} ${transcript}` : transcript));
                    };
                    rec.onerror = () => setIsRecordingMic(false);
                    rec.onend = () => {
                        setIsRecordingMic(false);
                        if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') { try { mediaRecRef.current.stop(); } catch (_) {} }
                    };
                    speechRecRef.current = rec;
                    rec.start();
                    setIsRecordingMic(true);
                    showToast('🎙️ กำลังรับเสียงพูดของท่าน (บันทึกเฉพาะใน RAM เพื่อฟังย้อนหลัง • PDPA 100%)', 'info');
                } catch (_) {
                    showToast('ไม่ได้รับสิทธิ์ไมโครโฟน สามารถพิมพ์หรือแตะปุ่มแนวทางคำพูดแทนได้ค่ะ', 'error');
                }
            };

            const handleSendMessage = async (e, overrideText = null) => {
                if (e) e.preventDefault();
                const txt = String(overrideText ?? inputText).trim();
                if (!txt || isAiThinking) return;
                setInputText('');

                if (phase === 'micro_drill') {
                    const st = drillStages[drillIdx];
                    const fb = SL.evaluateMicroDrillAnswer(st, txt);
                    setCurrentDrillFeedback(fb);
                    setDrillResults(prev => [...prev, { stageId: st.id, score: fb.score, answer: txt }]);
                    setCurrentEmotion(fb.passed ? 'CALM' : 'HESITANT');
                    return;
                }

                stopAllAiVoice();
                const triggers = SL.detectTriggerPhrases(txt);
                const nextTriggerTotal = triggerTotal + triggers.length;
                if (triggers.length > 0) {
                    setTriggerTotal(nextTriggerTotal);
                    showToast(`⚠️ พบคำที่อาจกระทบจิตใจ (${triggers.join(', ')}) แนะนำเลี่ยงใช้ในห้องรับรองจริงค่ะ`, 'error');
                }

                const nextMessages = [...messages, { role: 'user', text: txt, at: Date.now() }];
                setMessages(nextMessages);
                const learnerTexts = nextMessages.filter(m => m.role === 'user').map(m => m.text);
                const nextUnlocked = SL.evaluateBarriersUnlocked(activePersona.id, learnerTexts);
                setUnlockedBarrierIds(nextUnlocked);
                setIsAiThinking(true);

                let replyText = '';
                let nextEmo = triggers.length > 0 ? 'ANGRY' : (nextUnlocked.length >= 3 ? 'CALM' : (nextUnlocked.length >= 2 ? 'HESITANT' : (nextUnlocked.length >= 1 ? 'SAD' : currentEmotion)));
                let nextTrust = Math.max(10, Math.min(100, trustScore + (triggers.length > 0 ? -15 : (nextUnlocked.length > unlockedBarrierIds.length ? 16 : 6))));

                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const convoHistory = nextMessages.slice(-6).map(m => `${m.role === 'user' ? 'ผู้เข้าฝึก' : 'คู่สนทนา'}: ${m.text}`).join('\n');
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `เคส: ${activePersona.titleTH}\nบทบาทของคุณ: ${activePersona.speakerRoleTH}\nประวัติสนทนา:\n${convoHistory}\n\nให้ตอบกลับในบทบาทคู่สนทนา 2-3 ประโยคภาษา${selectedMode.lang === 'en' ? 'อังกฤษ' : 'ไทย'}อย่างเป็นธรรมชาติ โดยขึ้นต้นด้วยแท็กอารมณ์ [EMOTION:SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM] ตามอารมณ์ที่สมจริง (หากเคส 3 ให้ตอบสลับ [ภรรยา]: ... [คุณแม่]: ...)`,
                                systemInstruction: 'คุณคือคู่สนทนาในห้องฝึกสื่อสาร AI Skill Lab 3D โรงพยาบาลราชวิถี ตอบสมจริงตามหลักจิตวิทยาและคลินิก ไม่ใช้ Markdown'
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const d = JSON.parse((await rawRes.text()) || '{}');
                        if (d?.status === 'success' && d.text) {
                            const raw = String(d.text).replace(/[*#]/g, '').trim();
                            const m = raw.match(/\[EMOTION:(SHOCK|CONFUSED|ANGRY|SAD|HESITANT|CALM)\]/i);
                            if (m) nextEmo = m[1].toUpperCase();
                            replyText = raw.replace(/\[EMOTION:[^\]]+\]/gi, '').trim();
                        }
                    } catch (_) {}
                }

                if (!replyText) {
                    if (triggers.length > 0) {
                        replyText = 'ทำไมพูดกับครอบครัวแบบนี้ล่ะคะ... พวกเรากำลังเสียใจมาก อย่ามาเร่งรัดหรือพูดแบบนี้เลยค่ะ';
                    } else if (nextUnlocked.length >= 3) {
                        replyText = activePersona.id === 'sbar_doctor'
                            ? 'รับทราบครับ รายงาน SBAR ชัดเจนครบถ้วนมาก ผมสั่งสารน้ำและ DDAVP ให้เดี๋ยวนี้ แล้วประสานทีม TC/ODC ได้เลยครับ'
                            : 'ขอบคุณมากนะคะที่อธิบายอย่างอ่อนโยนและให้เกียรติครอบครัวขนาดนี้ ตอนนี้ใจสงบและวางใจขึ้นมากแล้วค่ะ';
                    } else if (nextUnlocked.length >= 1) {
                        replyText = activePersona.id === 'sbar_doctor'
                            ? 'เข้าใจสถานการณ์แล้วครับ ช่วยประเมินผลแล็บกับแผนการรักษาที่ต้องการเสนอเพิ่มเติมอีกนิดครับ'
                            : 'พอเข้าใจขึ้นบ้างแล้วค่ะ... แต่ในใจยังห่วงและอยากขอเวลาทำความเข้าใจอีกนิดนะคะ';
                    } else {
                        replyText = 'ยังสับสนและทำใจยากมากเลยค่ะ ช่วยค่อยๆ อธิบายให้ครอบครัวสบายใจกว่านี้ได้ไหมคะ?';
                    }
                }

                setCurrentEmotion(nextEmo);
                setTrustScore(nextTrust);
                setMessages(prev => [...prev, { role: 'ai', text: replyText, emotion: nextEmo, at: Date.now() }]);
                setIsAiThinking(false);
                playRelativeSegments(replyText, activePersona.id, nextEmo, selectedMode.lang);
            };

            const handleNextDrillStage = () => {
                stopAllAiVoice();
                setCurrentDrillFeedback(null);
                if (drillIdx + 1 < drillStages.length) {
                    const nextIdx = drillIdx + 1;
                    const st = drillStages[nextIdx];
                    setDrillIdx(nextIdx);
                    setCurrentEmotion(st.emotion);
                    setActiveSpeakerBadge(st.badgeTH);
                    setCurrentActionCue(st.actionTH);
                    setLatestCaption(st.promptTH);
                    setTimeout(() => playRelativeSegments(st.promptTH, st.personaId, st.emotion, 'th'), 280);
                } else {
                    const avg = drillResults.length > 0 ? Math.round(drillResults.reduce((s, x) => s + x.score, 0) / drillResults.length) : 85;
                    setEvalResult({
                        score: avg,
                        radar: RADAR_AXES_FAMILY.map((a, i) => ({ key: a.key, labelTH: a.labelTH, value: Math.min(98, avg + (i % 2 === 0 ? 2 : -2)) })),
                        summary: `ซ้อม Micro-Drill ครบทั้ง ${drillStages.length} ด่านคำถามหนักสำเร็จด้วยคะแนนเฉลี่ย ${avg}/100 ค่ะ`,
                        goldenMoment: drillResults[0]?.answer || 'ตอบคำถามหนักได้อย่างสุภาพและเป็นระบบ',
                        turningPoint: 'ลองนำทักษะที่ฝึกใน 4 ด่านนี้ไปซ้อมจริงในโหมด Roleplay เต็มรูปแบบต่อได้เลยค่ะ'
                    });
                    setPhase('result');
                }
            };

            const handleFinishAndEvaluate = () => {
                stopAllAiVoice();
                const res = SL.evaluateConversationFallback({
                    personaId: activePersona.id,
                    messages,
                    unlockedIds: unlockedBarrierIds,
                    silenceCount,
                    triggerTotal
                });
                setEvalResult(res);
                setPhase('result');
            };

            const handleReturnToDashboard = async () => {
                stopAllAiVoice();
                const preAvg = Number(((preEff.e1 + preEff.e2 + preEff.e3) / 3).toFixed(2));
                const postAvg = Number(((postEff.e1 + postEff.e2 + postEff.e3) / 3).toFixed(2));
                const score = Number(evalResult?.score || 85);
                const prevHist = Array.isArray(user?.skillLabHistory) ? user.skillLabHistory : [];
                const blindTranscript = messages.map((m, idx) => ({ turn: idx + 1, role: m.role === 'user' ? 'LEARNER' : 'RELATIVE', text: m.text }));
                const newEntry = {
                    at: new Date().toISOString(),
                    personaId: effectivePersonaId,
                    difficultyId,
                    score,
                    silenceCount,
                    triggerTotal,
                    radar: evalResult?.radar || [],
                    preSelfEfficacyAvg: preAvg,
                    postSelfEfficacyAvg: postAvg,
                    blindTranscript
                };
                const nextBest = Math.max(Number(user?.skillLabBestScore || 0), score);
                const nextUser = {
                    ...user,
                    skillLabPassed: true,
                    skillLabBestScore: nextBest,
                    preSelfEfficacyAvg: preAvg,
                    postSelfEfficacyAvg: postAvg,
                    skillLabHistory: [...prevHist, newEntry].slice(-15)
                };
                setUser(nextUser);
                saveLearnerSessionSafe(nextUser);

                if (!isAdminPreview && fbDb && nextUser?.id) {
                    try {
                        await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users', String(nextUser.id)), nextUser, { merge: true });
                        if (typeof CORE.buildAnonTelemetryId === 'function' && typeof CORE.buildExecutiveTelemetryPayload === 'function') {
                            const anonId = CORE.buildAnonTelemetryId(nextUser.id);
                            await setDoc(doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'executive_telemetry', anonId), CORE.buildExecutiveTelemetryPayload(nextUser), { merge: true });
                        }
                    } catch (_) {}
                }
                showToast('บันทึกผล AI Skill Lab ขึ้น Cloud เรียบร้อย กำลังกลับห้องเรียนหลักค่ะ');
                setTimeout(() => { window.location.href = './index.html?return=dashboard'; }, 600);
            };

            const handleDownloadDebriefPng = () => {
                const ok = SL.downloadDebriefCardPng({ user, persona: activePersona, evalResult });
                showToast(ok ? 'ดาวน์โหลดใบสรุปผล AI Skill Lab (PNG) เรียบร้อยค่ะ' : 'ไม่สามารถสร้างภาพได้ในขณะนี้ค่ะ', ok ? 'success' : 'error');
            };

            // ============================================================================
            // 8. RENDER PHASES
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" />
                    <div className="spatial-grid" />
                    {voicePhase !== 'idle' && (
                        <div className="fixed top-0 left-0 right-0 z-50 pointer-events-none"><div className="rjc-ambient-bar" /></div>
                    )}

                    {/* ==================== PHASE 1: LOBBY (ADAPTIVE BENTO GRID มืด/สว่าง) ==================== */}
                    {phase === 'lobby' && (
                        <>
                            <header className="sticky top-0 z-30 spatial-header">
                                <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2.5 min-w-0">
                                        <a href="./index.html?return=dashboard" onClick={() => { if (user?.id) saveLearnerSessionSafe(user); }} className="w-9 h-9 rounded-xl spatial-soft text-primary-adaptive flex items-center justify-center shrink-0">
                                            <Icon name="ArrowLeft" size={18} />
                                        </a>
                                        <div className="min-w-0">
                                            <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                                AI Skill Lab <span className="text-accent-adaptive">3D</span> <span className="font-mono text-[10px] text-prism-adaptive">2.8K PARTICLE</span>
                                            </span>
                                            <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                                {user.name} • {learnerProfession}
                                            </span>
                                        </div>

                                        <button type="button" onClick={() => setHintBanner('')} className="text-white/60 hover:text-white font-bold">✕</button>
                                    </div>
                                )}

                                {/* Micro-Drill Feedback Card */}
                                {phase === 'micro_drill' && currentDrillFeedback && (
                                    <div className="stage-hud-glass rounded-2xl p-4 space-y-2.5 border-emerald-400/50 pointer-events-auto text-xs">
                                        <div className="flex items-center justify-between">
                                            <span className="font-mono font-bold text-emerald-300">ผลประเมินด่าน {drillIdx + 1}/{drillStages.length}: {currentDrillFeedback.score}/100</span>
                                            <button type="button" onClick={handleNextDrillStage} className="rjc2-pill-btn px-4 py-1.5 rounded-full font-display font-extrabold text-xs">
                                                {drillIdx + 1 < drillStages.length ? 'ไปด่านถัดไป →' : 'ดูสรุปผล Micro-Drill →'}
                                            </button>
                                        </div>
                                        <p className="text-sky-100">{currentDrillFeedback.feedbackTH}</p>
                                        <div className="p-2.5 rounded-xl bg-white/10 text-emerald-200">
                                            <b>แนวทางตัวอย่าง:</b> “{drillStages[drillIdx]?.modelAnswerTH}”
                                        </div>
                                    </div>
                                )}

                                {/* Input Dock */}
                                <div className="stage-hud-glass rounded-[1.5rem] p-3 sm:p-3.5 space-y-2.5 pointer-events-auto">
                                    {phase === 'negotiating' && difficultyId === 'normal' && (
                                        <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                                            {quickReplies.map((qr, qi) => (
                                                <button key={qi} type="button" disabled={isAiThinking} onClick={() => handleSendMessage(null, qr)} className="shrink-0 px-3 py-1.5 rounded-xl bg-white/[0.08] hover:bg-white/[0.15] border border-sky-200/20 text-[11px] text-sky-100 text-left max-w-[260px] truncate">
                                                    ✦ {qr}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <form onSubmit={handleSendMessage} className="flex items-center gap-2">
                                        {phase === 'negotiating' && (
                                            <button type="button" onClick={handleTherapeuticSilence} disabled={silenceTimer > 0} className="touch-target px-3 rounded-xl bg-white/[0.08] border border-emerald-300/35 text-emerald-200 text-xs font-bold shrink-0" title="เว้นความเงียบเยียวยา 2.5 วินาที">
                                                {silenceTimer > 0 ? `⏳ ${silenceTimer}s` : '🤫 เงียบ 2.5s'}
                                            </button>
                                        )}
                                        <button type="button" onClick={handleToggleMic} className={`touch-target w-11 rounded-xl border flex items-center justify-center shrink-0 ${isRecordingMic ? 'bg-rose-600 border-rose-300 text-white animate-pulse' : 'bg-white/[0.08] border-sky-200/25 text-sky-100'}`} title="พูดผ่านไมโครโฟน">
                                            <Icon name={isRecordingMic ? 'MicOff' : 'Mic'} size={18} />
                                        </button>
                                        <input
                                            type="text"
                                            value={inputText}
                                            onChange={e => setInputText(e.target.value)}
                                            disabled={isAiThinking || (phase === 'micro_drill' && Boolean(currentDrillFeedback))}
                                            placeholder={selectedMode.lang === 'en' ? 'Type or speak your empathetic response...' : 'พิมพ์หรือกดไมค์เพื่อสื่อสารกับคู่สนทนา...'}
                                            className="touch-target flex-1 px-3.5 py-2 rounded-xl text-sm bg-white/[0.09] border border-sky-200/25 text-white placeholder:text-slate-400 focus:outline-none focus:border-cyan-300"
                                        />
                                        <button type="submit" disabled={!inputText.trim() || isAiThinking} className="rjc2-pill-btn touch-target px-4 sm:px-5 rounded-xl font-display font-extrabold text-xs sm:text-sm shrink-0 disabled:opacity-45">
                                            {isAiThinking ? '...' : 'ส่ง →'}
                                        </button>
                                    </form>
                                </div>
                            </div>

                            {/* Chat History Modal */}
                            {showHistoryModal && (
                                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                                    <div className="stage-hud-glass w-full max-w-lg max-h-[80vh] rounded-[1.75rem] p-5 flex flex-col gap-3">
                                        <div className="flex items-center justify-between border-b border-white/15 pb-2.5">
                                            <h3 className="font-display font-bold text-base">ประวัติบทสนทนา ({messages.length} ข้อความ)</h3>
                                            <button type="button" onClick={() => setShowHistoryModal(false)} className="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center">✕</button>
                                        </div>
                                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 text-xs pr-1">
                                            {messages.map((m, i) => (
                                                <div key={i} className={`p-3 rounded-2xl ${m.role === 'user' ? 'bg-emerald-500/20 border border-emerald-400/35 ml-6' : 'bg-white/10 border border-white/15 mr-6'}`}>
                                                    <span className="font-mono text-[10px] font-bold block mb-1 text-cyan-300">{m.role === 'user' ? 'ท่าน (ผู้เข้าฝึก)' : activePersona.speakerRoleTH}</span>
                                                    <p className="leading-relaxed text-slate-100">{m.text}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ==================== PHASE 5: ADAPTIVE BENTO GRID 5-AXIS RADAR RESULT ==================== */}
                    {phase === 'result' && evalResult && (
                        <main className="relative z-10 max-w-5xl w-full mx-auto px-3.5 sm:px-6 py-6 sm:py-8 space-y-4 flex-1">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <div>
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">AI CLINICAL SUPERVISOR DEBRIEF REPORT</span>
                                    <h1 className="font-display font-extrabold text-xl sm:text-2xl text-primary-adaptive">
                                        {selectedMode.isDrill ? 'สรุปผลการฝึก Micro-Drill 4 ด่านคำถามหนัก' : activePersona.titleTH}
                                    </h1>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="px-3 py-1 rounded-full bg-aurora-500/20 border border-aurora-400/40 text-accent-adaptive font-mono text-xs font-bold">
                                        {difficultyId.toUpperCase()} MODE
                                    </span>
                                    <ThemeToggleButton theme={theme} onToggle={toggleTheme} compact />
                                </div>
                            </div>

                            <section className="grid grid-cols-1 md:grid-cols-12 gap-4 items-stretch">
                                <div className="md:col-span-5 spatial-card rounded-[1.75rem] p-5 sm:p-6 flex flex-col justify-between gap-4 border-aurora-400/40">
                                    <div>
                                        <p className="text-[11px] text-muted-adaptive font-mono uppercase">
                                            {effectivePersonaId === 'sbar_doctor' ? 'SBAR ICU CLINICAL HANDOFF INDEX' : 'EMPATHY & CLINICAL COMMUNICATION INDEX'}
                                        </p>
                                        <div className="flex items-baseline gap-2 mt-2">
                                            <span className="font-mono text-5xl sm:text-6xl font-extrabold text-accent-adaptive">{evalResult.score}</span>
                                            <span className="font-mono text-xl text-muted-adaptive">/100</span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-secondary-adaptive leading-relaxed mt-3">{evalResult.summary}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div className="spatial-soft rounded-xl p-2.5">
                                            <span className="font-mono text-[9.5px] text-muted-adaptive block">ความเงียบ 2.5 วิ</span>
                                            <span className="font-mono font-bold text-prism-adaptive">{silenceCount} ครั้ง</span>
                                        </div>
                                        <div className="spatial-soft rounded-xl p-2.5">
                                            <span className="font-mono text-[9.5px] text-muted-adaptive block">ปมที่คลายได้</span>
                                            <span className="font-mono font-bold text-accent-adaptive">{selectedMode.isDrill ? `${drillResults.length}/${drillStages.length} ด่าน` : `${unlockedBarrierIds.length}/3 ข้อ`}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="md:col-span-7 spatial-card rounded-[1.75rem] p-4 sm:p-5 flex flex-col justify-center">
                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase mb-1">5-AXIS CLINICAL COMPETENCY RADAR</span>
                                    <FiveAxisRadarSVG radarArr={evalResult.radar} theme={theme} personaId={effectivePersonaId} />
                                </div>

                                <div className="md:col-span-6 spatial-card rounded-[1.75rem] p-5 bg-aurora-500/10 border-aurora-400/40 space-y-1.5 text-xs">
                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">★ ประโยคทองที่ทำได้ดีเยี่ยม (GOLDEN MOMENT)</span>
                                    <p className="text-primary-adaptive text-sm leading-relaxed">{evalResult.goldenMoment}</p>
                                </div>
                                <div className="md:col-span-6 spatial-card rounded-[1.75rem] p-5 bg-prism-500/10 border-prism-400/40 space-y-1.5 text-xs">
                                    <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">✦ จุดควรเกลาเพิ่มความเชี่ยวชาญ (TURNING POINT)</span>
                                    <p className="text-primary-adaptive text-sm leading-relaxed">{evalResult.turningPoint}</p>
                                </div>

                                <div className="md:col-span-12 spatial-card rounded-[1.75rem] p-5 space-y-4">
                                    {learnerVoiceClips.length > 0 && (
                                        <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">🎙️ ฟังเสียงตัวเองย้อนหลัง (Self-Reflection • เก็บเฉพาะใน RAM • PDPA 100%)</span>
                                            <div className="flex flex-wrap gap-2">
                                                {learnerVoiceClips.map((c, ci) => c.audioUrl && (
                                                    <div key={ci} className="spatial-soft px-3 py-2 rounded-xl flex items-center gap-2">
                                                        <span className="font-mono font-bold text-accent-adaptive">รอบ {ci + 1} ({c.durationSec}s)</span>
                                                        <audio controls src={c.audioUrl} className="h-7 max-w-[180px]" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="spatial-soft rounded-2xl p-4 space-y-2 text-xs">
                                        <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">POST-PRACTICE SELF-EFFICACY (ประเมินความมั่นใจหลังฝึก • R2R)</span>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                                            {(SL.SELF_EFFICACY_ITEMS || []).map(it => (
                                                <div key={it.key} className="space-y-1">
                                                    <p className="text-secondary-adaptive">{it.labelTH}</p>
                                                    <div className="flex gap-1">
                                                        {[1, 2, 3, 4, 5].map(n => (
                                                            <button key={n} type="button" onClick={() => setPostEff(p => ({ ...p, [it.key]: n }))} className={`flex-1 py-1 rounded-lg font-mono font-bold ${postEff[it.key] === n ? 'bg-amber-400 text-void-950' : 'spatial-soft text-secondary-adaptive'}`}>{n}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
                                        <button type="button" onClick={handleDownloadDebriefPng} className="spatial-soft touch-target py-3.5 px-4 rounded-full font-display font-bold text-xs sm:text-sm text-prism-adaptive border-prism-400/45 inline-flex items-center justify-center gap-1.5">
                                            <Icon name="Download" size={15} /> บันทึกใบสรุปผล (PNG)
                                        </button>
                                        <button type="button" onClick={() => { stopAllAiVoice(); setPhase('lobby'); }} className="spatial-soft touch-target py-3.5 rounded-full font-display font-bold text-xs sm:text-sm text-primary-adaptive">
                                            ← ฝึกเคสใหม่อีกครั้ง
                                        </button>
                                        <button type="button" onClick={handleReturnToDashboard} className="rjc2-pill-btn touch-target py-3.5 rounded-full font-display font-extrabold text-xs sm:text-sm">
                                            บันทึกผล &amp; กลับห้องเรียนหลัก →
                                        </button>
                                    </div>
                                </div>
                            </section>
                        </main>
                    )}

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('skilllab-root'));
        root.render(<SkillLabErrorBoundary><SkillLabApp /></SkillLabErrorBoundary>);
    </script>

    <!-- โหลด Babel ท้ายสุดพร้อม CDN สำรองป้องกันหน้าหมุนค้าง -->
    <script
        src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
        onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js';s.onload=function(){if(window.Babel&&window.Babel.transformScriptTags)window.Babel.transformScriptTags();};document.body.appendChild(s);})();"
    ></script>
</body>
</html>
