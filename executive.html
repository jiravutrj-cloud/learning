    <!-- ซิงค์โหมดมืด/สว่างทันทีจาก localStorage ป้องกันจอกระพริบ -->
    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        /**

        function sanitizeToStatsOnly(raw) {

                ? raw.domains

            const hist = Array.isArray(raw.skillLabHistory) ? raw.skillLabHistory : [];

            const bestLabScore = typeof raw.skillLabBestScore === 'number'
                ? Number(raw.skillLabBestScore)
                : (lastScore > 0 ? lastScore : null);

            return {
                regionId: raw.regionId || resolveRegionId(raw.department),
                status: raw.status === 'ผ่าน' ? 'ผ่าน' : 'กำลังเรียน',
                progress: Number(raw.progress || 0),
                hasLab: Boolean(raw.hasLab || raw.skillLabPassed || hist.length > 0 || radar),
                skillLabBestScore: bestLabScore,
                radar,
                domains,
                satisfactionScore: (typeof raw.satisfactionScore === 'number' && raw.satisfactionScore > 0)
                    ? Number(raw.satisfactionScore)
                    : null
            };
        }

        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            if (typeof CORE.pcm16ToWavBlob === 'function') {
                const blob = CORE.pcm16ToWavBlob(base64PCM, sampleRate);
                return blob && blob.size > 0 ? URL.createObjectURL(blob) : '';
            }
            const binaryString = window.atob(base64PCM);
            const rawBytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) rawBytes[i] = binaryString.charCodeAt(i);

            let offsetBytes = 0;
            if (rawBytes.length > 44 && rawBytes[0] === 0x52 && rawBytes[1] === 0x49 && rawBytes[2] === 0x46 && rawBytes[3] === 0x46) {
                offsetBytes = 44;
            }
            const sampleCount = Math.floor((rawBytes.length - offsetBytes) / 2);
            if (sampleCount <= 0) return '';

            const inView = new DataView(rawBytes.buffer, rawBytes.byteOffset + offsetBytes, sampleCount * 2);
            const samples = new Float32Array(sampleCount);
            for (let i = 0; i < sampleCount; i++) samples[i] = inView.getInt16(i * 2, true) / 32768;

            // ตัดเสียงซ่าท้ายคลิป (Anti-Hiss DSP) + Smooth Cosine Fade-out + เติมความเงียบ 45ms
            const frameSize = Math.max(128, Math.round(sampleRate * 0.02));
            const numFrames = Math.floor(sampleCount / frameSize);
            const frameRms = new Float32Array(numFrames);
            const frameZcr = new Float32Array(numFrames);
            for (let f = 0; f < numFrames; f++) {
                const start = f * frameSize;
                let sumSq = 0, zc = 0, prev = samples[start];
                for (let j = 0; j < frameSize; j++) {
                    const s = samples[start + j];
                    sumSq += s * s;
                    if ((s >= 0 && prev < 0) || (s < 0 && prev >= 0)) zc++;
                    prev = s;
                }
                frameRms[f] = Math.sqrt(sumSq / frameSize);
                frameZcr[f] = zc / frameSize;
            }

            let endFrame = numFrames - 1;
            while (endFrame > 12 && (frameRms[endFrame] < 0.016 || frameZcr[endFrame] > 0.22)) {
                endFrame--;
            }

            const lookbackStart = Math.max(12, endFrame - Math.round(1.6 / 0.02));
            let silentRun = 0;
            for (let f = lookbackStart; f <= endFrame; f++) {
                if (frameRms[f] < 0.015) {
                    silentRun++;
                } else {
                    if (silentRun >= 5) {
                        let tailZcrSum = 0, tailCount = 0;
                        for (let k = f; k <= endFrame; k++) { tailZcrSum += frameZcr[k]; tailCount++; }
                        if (tailCount > 0 && tailZcrSum / tailCount > 0.21) {
                            endFrame = Math.max(12, f - silentRun - 1);
                            break;
                        }
                    }
                    silentRun = 0;
                }
            }

            const keptSamples = Math.min(sampleCount, Math.max(Math.min(sampleCount, Math.round(sampleRate * 0.25)), (endFrame + 1) * frameSize));
            const padZeroSamples = Math.round(sampleRate * 0.045);
            const outBytesLen = (keptSamples + padZeroSamples) * 2;
            const fadeInLen = Math.min(Math.round(sampleRate * 0.012), Math.floor(keptSamples * 0.1));
            const fadeOutLen = Math.min(Math.round(sampleRate * 0.075), Math.floor(keptSamples * 0.22));

            const buffer = new ArrayBuffer(44 + outBytesLen);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + outBytesLen, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, outBytesLen, true);

            for (let i = 0; i < keptSamples; i++) {
                let s = samples[i];
                if (i < fadeInLen) s *= i / fadeInLen;
                else if (i >= keptSamples - fadeOutLen) {
                    const t = (i - (keptSamples - fadeOutLen)) / fadeOutLen;
                    s *= 0.5 * (1 + Math.cos(Math.PI * t));
                }
                view.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, s)) * 32767), true);
            }
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

            };

            const regPts = RADAR_AXES.map((a, i) => pt(i, (regionRadar[a.key] || 0) / 100));
            const natPts = RADAR_AXES.map((a, i) => pt(i, (nationalRadar[a.key] || 0) / 100));

        // ============================================================================

                    unsubFallback = onSnapshot(

                return () => {

            // ใช้ข้อมูลจาก executive_telemetry เป็นหลัก (หากยังว่างช่วงเปลี่ยนผ่านใช้ข้อมูลที่ตัด PII ออกแล้ว)
            const activeStatsRows = useMemo(
                () => (telemetryStats.length > 0 ? telemetryStats : fallbackStats),

            // 2. Real-Time Analytics Engine (เฉพาะข้อมูลสถิติไม่ระบุตัวตน 100%)
            const analytics = useMemo(() => {
                const sourceRows = activeStatsRows;

                const makeEmptyAccumulator = () => ({
                    radarSum: { setting: 0, empathy: 0, clarity: 0, vocal: 0, dignity: 0 },
                    radarCount: 0,
                    domainSum: { policy_ethics: 0, brain_death_donor: 0, procurement_transplant: 0, family_communication: 0 },
                    domainCount: { policy_ethics: 0, brain_death_donor: 0, procurement_transplant: 0, family_communication: 0 }
                });

                const natAcc = makeEmptyAccumulator();
                const statsMap = {};
                BASE_REGIONS.forEach(r => {
                    statsMap[r.id] = {
                        ...r,
                        users: 0,
                        learning: 0,
                        lab: 0,
                        passed: 0,
                        acc: makeEmptyAccumulator()
                    };
                });

                let totalLearning = 0;
                let totalLab = 0;
                let totalPassed = 0;
                let unmappedCount = 0;
                let csatSum = 0;
                let csatCount = 0;
                let skillScoreSum = 0;
                let skillScoreCount = 0;

                const accumulateMetrics = (acc, row) => {
                    if (row.radar) {
                        RADAR_AXES.forEach(a => {
                            acc.radarSum[a.key] += Number(row.radar[a.key] || 0);
                        });
                        acc.radarCount += 1;
                    }
                    if (Array.isArray(row.domains)) {
                        row.domains.forEach(d => {
                            if (d?.id && typeof d.percent === 'number' && acc.domainSum[d.id] !== undefined) {
                                acc.domainSum[d.id] += d.percent;
                                acc.domainCount[d.id] += 1;
                            }
                        });
                    }
                };

                sourceRows.forEach(row => {
                    const isPassed = row.status === 'ผ่าน';
                    const isLearning = !isPassed;

                    if (isPassed) totalPassed++;
                    if (isLearning) totalLearning++;
                    if (row.hasLab) {
                        totalLab++;
                        if (typeof row.skillLabBestScore === 'number' && row.skillLabBestScore > 0) {
                            skillScoreSum += row.skillLabBestScore;
                            skillScoreCount++;
                        }
                    }

                    if (typeof row.satisfactionScore === 'number' && row.satisfactionScore > 0) {
                        csatSum += row.satisfactionScore;
                        csatCount++;
                    }

                    accumulateMetrics(natAcc, row);

                    const regId = row.regionId;
                    if (statsMap[regId]) {
                        statsMap[regId].users += 1;
                        if (isLearning) statsMap[regId].learning += 1;
                        if (row.hasLab) statsMap[regId].lab += 1;
                        if (isPassed) statsMap[regId].passed += 1;
                        accumulateMetrics(statsMap[regId].acc, row);
                    } else {
                        unmappedCount += 1;
                    }
                });

                const finalizeRadar = (acc) => {
                    const out = {};
                    RADAR_AXES.forEach(a => {
                        out[a.key] = acc.radarCount > 0 ? Math.round(acc.radarSum[a.key] / acc.radarCount) : 0;
                    });
                    return out;
                };

                const finalizeDomains = (acc) => {
                    return DOMAIN_LIST.map(d => ({
                        ...d,
                        avg: acc.domainCount[d.id] > 0 ? Math.round(acc.domainSum[d.id] / acc.domainCount[d.id]) : 0
                    }));
                };

                const hasNationalRadar = natAcc.radarCount > 0;
                const hasNationalDomains = DOMAIN_LIST.some(d => natAcc.domainCount[d.id] > 0);
                const nationalRadar = finalizeRadar(natAcc);
                const nationalDomains = finalizeDomains(natAcc);
                const nationalWeakestDomain = [...nationalDomains].sort((a, b) => a.avg - b.avg)[0];
                const nationalWeakestAxis = RADAR_AXES
                    .map(a => ({ ...a, avg: nationalRadar[a.key] }))
                    .sort((a, b) => a.avg - b.avg)[0];

                const regionList = Object.values(statsMap).map(r => {
                    const radar = finalizeRadar(r.acc);
                    const domains = finalizeDomains(r.acc);
                    const hasRadarData = r.acc.radarCount > 0;
                    const hasDomainData = DOMAIN_LIST.some(d => r.acc.domainCount[d.id] > 0);

                    const weakestDomain = [...domains].sort((a, b) => a.avg - b.avg)[0];
                    const weakestAxis = RADAR_AXES
                        .map(a => ({ ...a, avg: radar[a.key] }))
                        .sort((a, b) => a.avg - b.avg)[0];
                    const avgEmpathy = hasRadarData
                        ? Math.round(RADAR_AXES.reduce((s, a) => s + (radar[a.key] || 0), 0) / RADAR_AXES.length)
                        : 0;
                    const passPct = r.users > 0 ? Math.round((r.passed / r.users) * 100) : 0;

                    return {
                        ...r,
                        radar,
                        domains,
                        hasRadarData,
                        hasDomainData,
                        weakestDomain,
                        weakestAxis,
                        avgEmpathy,
                        passPct
                    };
                });

                const regionalOnly = regionList.filter(r => r.id !== 'BKK');
                const sortedByUsers = [...regionalOnly].sort((a, b) => b.users - a.users);
                const maxRegion = sortedByUsers[0] || { name: '-', users: 0, passed: 0 };
                const minRegion = sortedByUsers[sortedByUsers.length - 1] || maxRegion;

                const totalUsers = sourceRows.length;
                const passRate = totalUsers > 0 ? Math.round((totalPassed / totalUsers) * 100) : 0;
                const avgCsat = csatCount > 0 ? (csatSum / csatCount).toFixed(1) : '0.0';
                const avgSkillScore = skillScoreCount > 0
                    ? Math.round(skillScoreSum / skillScoreCount)
                    : (hasNationalRadar ? Math.round(RADAR_AXES.reduce((s, a) => s + nationalRadar[a.key], 0) / RADAR_AXES.length) : 0);

                return {
                    total: { users: totalUsers, learning: totalLearning, lab: totalLab, passed: totalPassed, unmapped: unmappedCount },
                    regionList,
                    maxRegion,
                    minRegion,
                    passRate,
                    avgCsat,
                    csatCount,
                    avgSkillScore,
                    hasNationalRadar,
                    hasNationalDomains,
                    nationalRadar,
                    nationalDomains,
                    nationalWeakestDomain,
                    nationalWeakestAxis
                };
            }, [activeStatsRows]);

            const activeRegion = useMemo(
                () => analytics.regionList.find(r => r.id === activeRegionId) || analytics.regionList[0],
                [analytics.regionList, activeRegionId]
            );

            // 3. Auto-updating Executive Policy Briefing
            const executiveBrief = useMemo(() => {
                if (analytics.total.users === 0) {
                    const emptyInsight = `📊 rjcloud.organ — AI Executive Policy Brief (สถิติไม่ระบุตัวตน PDPA-Safe):

• ระบบเชื่อมต่อฐานข้อมูลสถิติกลางเรียบร้อยแล้วค่ะ (ไม่มีการนำข้อมูลส่วนบุคคลมาประมวลผล)
• จำนวนผู้เรียนในฐานข้อมูลสถิติขณะนี้: 0 ราย
• ทันทีที่มีผู้เรียนเข้าเรียนและประเมินผล สถิติทั้ง 13 เขตสุขภาพจะอัปเดตขึ้นที่นี่อัตโนมัติค่ะ`;
                    const emptySpeech = 'สวัสดีค่ะท่านผู้บริหาร ระบบแดชบอร์ดผู้บริหาร อาร์เจคลาวด์ดอทออร์แกน พร้อมแสดงผลสถิติแบบไม่ระบุตัวตนตามนโยบายพีดีพีเอแล้วค่ะ';
                    return { insightText: emptyInsight, speechText: emptySpeech };
                }

                const gapText = analytics.hasNationalDomains || analytics.hasNationalRadar
                    ? `\n\n[2] AI Clinical Gap Alert (หัวข้อที่ควรจัดอบรมเสริมด่วน):${analytics.hasNationalDomains ? `\n• หมวดวิชาการที่อ่อนที่สุด: "${analytics.nationalWeakestDomain.nameTH}" (เฉลี่ย ${analytics.nationalWeakestDomain.avg}%)` : ''}${analytics.hasNationalRadar ? `\n• ทักษะสื่อสาร 5 แกนที่ควรพัฒนาที่สุด: "${analytics.nationalWeakestAxis.labelTH}" (เฉลี่ย ${analytics.nationalWeakestAxis.avg}/100)` : ''}`
                    : '';

                const insightText = `📊 rjcloud.organ — AI Executive Policy Brief (สถิติไม่ระบุตัวตน PDPA-Safe):

[1] ภาพรวมบุคลากรระดับประเทศ:
• บุคลากรทั้งหมด ${analytics.total.users.toLocaleString()} ราย | สอบผ่าน Post-test ≥80% แล้ว ${analytics.total.passed.toLocaleString()} ราย (${analytics.passRate}%)
• ดัชนี Empathy เฉลี่ย (AI Skill Lab): ${analytics.avgSkillScore}/100 | CSAT เฉลี่ย: ${analytics.avgCsat}/5.0${gapText}

[3] มิติความเหลื่อมล้ำเชิงพื้นที่ (13 เขตสุขภาพ):
• เขตนำร่องสูงสุด: ${analytics.maxRegion.name} (${analytics.maxRegion.users} ราย)
• พื้นที่ควรเร่งสนับสนุน: ${analytics.minRegion.name} (${analytics.minRegion.users} ราย)`;

                const speechText = `สวัสดีค่ะท่านผู้บริหาร จากสถิติภาพรวมล่าสุดของระบบ อาร์เจคลาวด์ดอทออร์แกน ขณะนี้มีบุคลากรทั้งหมด ${analytics.total.users} ท่าน สอบผ่านรับประกาศนียบัตรแล้ว ${analytics.total.passed} ท่าน คิดเป็นร้อยละ ${analytics.passRate} คะแนนทักษะสื่อสารสามมิติเฉลี่ย ${analytics.avgSkillScore} เต็มร้อย และความพึงพอใจเฉลี่ย ${analytics.avgCsat} เต็มห้าค่ะ`;

                return { insightText, speechText };
            }, [analytics]);

            useEffect(() => {
                setMessages(prev => {
                    const initMsg = { id: 'brief-live', role: 'ai', text: executiveBrief.insightText };
                    if (prev.length === 0) return [initMsg];
                    return [initMsg, ...prev.slice(1)];
                });
            }, [executiveBrief.insightText]);

            // 4. Speech Recognition Setup
            useEffect(() => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return;
                const rec = new SR();
                rec.continuous = false;
                rec.interimResults = true;
                rec.lang = 'th-TH';
                rec.onresult = (e) => {
                    let transcript = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) transcript += e.results[i][0].transcript;
                    setChatInput(transcript);
                };
                rec.onend = () => setIsListening(false);
                rec.onerror = () => setIsListening(false);
                recRef.current = rec;
                return () => { try { rec.abort(); } catch (_) {} };
            }, []);

            const stopVoice = useCallback(() => {
                if (audioRef.current) {
                    try { audioRef.current.pause(); } catch (_) {}
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {

                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsSpeaking(false);
            }, []);

            useEffect(() => () => stopVoice(), [stopVoice]);

            // 5. Voice Synthesis (Natural Thai Executive Voice + Anti-Hiss DSP)
            const playPolicyVoice = async (textToSpeak) => {
                if (isSpeaking) { stopVoice(); return; }
                const cleanText = prepareNaturalThaiSpeechSafe(textToSpeak);
                if (!cleanText) return;
                setIsSpeaking(true);

                if (appsScriptUrl) {
                    try {
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST',
                            redirect: 'follow',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGeminiTTS',
                                text: cleanText,
                                voiceName: 'Sulafat',
                                languageCode: 'th-TH',
                                style: 'พูดภาษาไทยด้วยน้ำเสียงผู้หญิงที่สุภาพ ชัดถ้อยชัดคำ อบอุ่นและเป็นธรรมชาติเหมือนผู้รายงานสรุปนโยบายการแพทย์ ไม่แข็งเป็นหุ่นยนต์'
                            })
                        });
                        const txt = await rawRes.text();
                        const res = JSON.parse(txt || '{}');

                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const url = pcm16ToWavUrl(res.inlineData.data, rate);
                            if (url) {
                                audioUrlRef.current = url;
                                const audio = new Audio(url);
                                audioRef.current = audio;
                                audio.onended = () => stopVoice();
                                audio.onerror = () => stopVoice();
                                await audio.play();
                                return;
                            }
                        }
                    } catch (_) {}
                }

                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = 'th-TH';
                        utter.rate = 0.96;
                        utter.pitch = 1.02;
                        const best = pickBestThaiVoiceSafe();
                        if (best) utter.voice = best;
                        utter.onend = () => setIsSpeaking(false);
                        utter.onerror = () => setIsSpeaking(false);
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}

                                                        <p className="text-[10px] text-violet-400">AI Lab</p>
                                                        <p className="font-mono text-sm font-extrabold text-violet-400">{activeRegion.lab}</p>
                                                    </div>
                                                    <div className="spatial-soft p-2 rounded-xl">
                                                        <p className="text-[10px] text-accent-adaptive">ผ่าน</p>
                                                        <p className="font-mono text-sm font-extrabold text-accent-adaptive">{activeRegion.passed}</p>
                                                    </div>
                                                </div>

                                                <div className="spatial-soft rounded-2xl p-3.5 space-y-2">
                                                    <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">
                                                        4-DOMAIN CLINICAL MASTERY ({activeRegion.id})
                                                    </p>
                                                    {activeRegion.domains.map(d => (
                                                        <div key={d.id} className="space-y-1">
                                                            <div className="flex justify-between text-[11px] font-bold">
                                                                <span className="text-secondary-adaptive truncate">{d.shortName}</span>
                                                                <span className="font-mono" style={{ color: d.color }}>{d.avg}%</span>
                                                            </div>
                                                            <div className="w-full h-1.5 rounded-full bg-slate-500/20 overflow-hidden">
                                                                <div className="h-full rounded-full" style={{ width: `${d.avg}%`, backgroundColor: d.color }} />
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                <div className="p-3 rounded-2xl bg-aurora-500/10 border border-aurora-400/30 text-[11px] text-primary-adaptive leading-relaxed">
                                                    {activeRegion.hasDomainData || activeRegion.hasRadarData ? (
                                                        <>
                                                            <b className="text-accent-adaptive">AI แนะนำสำหรับ {activeRegion.name}:</b>{' '}
                                                            {activeRegion.hasDomainData && <>เสริมเรื่อง <b>{activeRegion.weakestDomain.shortName}</b> ({activeRegion.weakestDomain.avg}%)</>}
                                                            {activeRegion.hasDomainData && activeRegion.hasRadarData && ' และ'}
                                                            {activeRegion.hasRadarData && <>ฝึก <b>{activeRegion.weakestAxis.labelTH}</b> ({activeRegion.weakestAxis.avg}/100)</>}
                                                        </>
                                                    ) : (
                                                        <span className="text-secondary-adaptive">
                                                            <b className="text-accent-adaptive">สถิติ {activeRegion.name}:</b> บุคลากรทั้งหมด <b className="font-mono">{activeRegion.users}</b> ราย • ผ่านเกณฑ์ <b className="font-mono">{activeRegion.passed}</b> ราย ({activeRegion.passPct}%) • AI Lab <b className="font-mono">{activeRegion.lab}</b> ราย
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </section>

                            {/* RIGHT (5 COLS): EXECUTIVE AI CHAT */}
                            <section className={`lg:col-span-5 ${mobileTab === 'ai' || mobileTab === 'overview' ? 'block' : 'hidden'} lg:block`}>
                                <div className="spatial-card rounded-[1.75rem] flex flex-col h-[580px] lg:h-[760px] overflow-hidden border-prism-400/25">
                                    <div className="p-4 sm:p-5 border-b border-white/10 flex items-center justify-between gap-2 shrink-0">
                                        <div className="flex items-center gap-3 min-w-0">
                                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-aurora-400 to-prism-400 text-void-950 flex items-center justify-center shadow-lg shrink-0">
                                                <Icon name="Cpu" size={20} />
                                            </div>
                                            <div className="min-w-0">
                                                <h2 className="font-display font-bold text-sm sm:text-base text-primary-adaptive truncate">
                                                    AI วิเคราะห์เชิงนโยบาย
                                                </h2>
                                                <p className="text-[11px] text-accent-adaptive font-semibold flex items-center gap-1.5">
                                                    <span className="w-1.5 h-1.5 rounded-full bg-aurora-400 animate-pulse" />
                                                    วิเคราะห์สถิติ 13 เขต • PDPA Zero-PII
                                                </p>
                                            </div>
                                        </div>

                                        <button
                                            type="button"
                                            onClick={() => playPolicyVoice(messages[messages.length - 1]?.text || executiveBrief.speechText)}
                                            className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shrink-0 ${
                                                isSpeaking
                                                    ? 'bg-rose-500 text-white'
                                                    : 'spatial-soft text-accent-adaptive'
                                            }`}
                                        >
                                            <Icon name={isSpeaking ? 'VolumeX' : 'Volume2'} size={15} />
                                            {isSpeaking ? 'หยุด' : 'ฟังสรุป'}
                                        </button>
                                    </div>

                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
                                        {isLoadingCloud && (
                                            <div className="text-center py-6 text-xs text-muted-adaptive">กำลังซิงค์สถิติไม่ระบุตัวตนจาก Cloud...</div>
                                        )}

                                        {messages.map((m) => (
                                            <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[92%] p-3.5 rounded-2xl text-xs sm:text-sm leading-relaxed whitespace-pre-line ${
                                                    m.role === 'user'
                                                        ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 font-bold rounded-br-sm'
                                                        : 'spatial-soft text-primary-adaptive rounded-bl-sm'
                                                }`}>
                                                    {m.text}
                                                </div>
                                            </div>
                                        ))}

                                        {isAiThinking && (
                                            <div className="flex justify-start">
                                                <div className="spatial-soft px-4 py-3 rounded-2xl text-xs font-bold text-prism-adaptive flex items-center gap-2">
                                                    <span className="w-2 h-2 rounded-full bg-prism-400 animate-bounce" />
                                                    AI กำลังวิเคราะห์สถิติ 13 เขตสุขภาพ...
                                                </div>
                                            </div>
                                        )}
                                        <div ref={chatEndRef} />
                                    </div>

                                    <div className="p-3 sm:p-4 border-t border-white/10 space-y-2.5 shrink-0">
                                        <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                                            {quickPrompts.map((qp, idx) => (
                                                <button
                                                    key={idx}
                                                    type="button"
                                                    onClick={() => handleSendQuestion(null, qp)}
                                                    className="spatial-soft shrink-0 px-3 py-1.5 rounded-full text-[11px] font-bold text-secondary-adaptive hover:text-accent-adaptive transition-colors"
                                                >
                                                    {qp}
                                                </button>
                                            ))}
                                        </div>

                                        <form onSubmit={handleSendQuestion} className="flex items-center gap-2">
                                            <input
                                                type="text"
                                                value={chatInput}
                                                onChange={e => setChatInput(e.target.value)}
                                                placeholder={isListening ? 'กำลังรับเสียงพูด...' : 'ถามข้อมูลสถิติ จุดอ่อนรายเขต หรือนโยบาย...'}
                                                disabled={isAiThinking}
                                                className="touch-target spatial-input flex-1 px-4 py-2.5 rounded-2xl text-sm"
                                            />
                                            <button
                                                type="button"
                                                onClick={toggleMic}
                                                aria-label="สั่งงานด้วยเสียง"
                                                className={`touch-target w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 transition-all ${
                                                    isListening
                                                        ? 'bg-rose-500 text-white shadow-md animate-pulse'
                                                        : 'spatial-soft text-accent-adaptive'
                                                }`}
                                            >
                                                <Icon name="Mic" size={18} />
                                            </button>
                                            <button
                                                type="submit"
                                                disabled={!chatInput.trim() || isAiThinking}
                                                aria-label="ส่งคำถาม"
                                                className="touch-target w-11 h-11 rounded-2xl bg-gradient-to-r from-aurora-400 to-prism-400 disabled:opacity-40 text-void-950 flex items-center justify-center shrink-0 shadow-md"
                                            >
                                                <Icon name="Send" size={18} />
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </main>

                    {/* Smartphone Bottom Dock */}
                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 spatial-dock px-3 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] no-print">
                        <div className="grid grid-cols-3 gap-1.5 max-w-md mx-auto">
                            {[
                                { id: 'overview', label: 'ภาพรวม KPI', icon: 'LayoutDashboard' },
                                { id: 'regions', label: 'แผนที่ & เรดาร์', icon: 'MapPin' },
                                { id: 'ai', label: 'ถาม AI', icon: 'Cpu' }
                            ].map(item => {
                                const active = mobileTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => { setMobileTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[11px] font-bold transition-all active:scale-95 ${
                                            active
                                                ? 'bg-gradient-to-r from-aurora-400 to-prism-400 text-void-950 shadow-sm'
                                                : 'text-secondary-adaptive'
                                        }`}
                                    >
                                        <Icon name={item.icon} size={18} />
                                        <span>{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('executive-root'));
        root.render(<ExecutiveErrorBoundary><ExecutiveApp /></ExecutiveErrorBoundary>);
    </script>
</body>
</html>
