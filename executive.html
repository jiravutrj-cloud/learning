        // ============================================================================

        function Icon({ name, size = 20, className = "", strokeWidth = 2 }) {

        /**
         * แปลงสังกัดของผู้เรียนให้ตรงกับรหัสเขตสุขภาพ (รองรับข้อมูลไม่ตรง Pattern โดยไม่ตัดออกจากยอดรวม)
         */
        function resolveRegionId(department = '') {
            const d = String(department || '').trim();
            if (d.startsWith('เขตสุขภาพที่')) {
                const num = d.replace(/[^0-9]/g, '');
                if (num && Number(num) >= 1 && Number(num) <= 12) return `R${num}`;
            }
            if (['กรมการแพทย์', 'สำนักการแพทย์ กรุงเทพฯ', 'สำนักอนามัย กรุงเทพฯ', 'กรุงเทพมหานคร'].some(k => d.includes(k))) {
                return 'BKK';
            }
            return 'OTHER';
        }

        /**
         * แปลง PCM16 base64 จาก Gemini TTS เป็น Blob URL (พร้อมให้ caller สั่ง revokeObjectURL ได้)
         */
        function pcm16ToWavUrl(base64PCM, sampleRate = 24000) {
            const binaryString = window.atob(base64PCM);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const buffer = new ArrayBuffer(44 + bytes.length);
            const view = new DataView(buffer);
            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, bytes.length, true);
            new Uint8Array(buffer, 44).set(bytes);
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }

        /**
         * ระบบตอบคำถามเชิงนโยบายอัจฉริยะจากข้อมูลจริงบนเครื่อง (ทำงานเมื่อยังไม่เชื่อมต่อ Apps Script / Gemini API)
         */
        function generateLocalExecutiveAnswer(question, analytics) {
            const q = question.toLowerCase();
            const { total, regionList, maxRegion, minRegion, avgCsat, csatCount, avgSkillScore, passRate } = analytics;

            if (q.includes('เขต') || q.includes('พื้นที่') || q.includes('น้อยสุด') || q.includes('มากสุด') || q.includes('เหลื่อมล้ำ')) {
                const bottom3 = [...regionList].filter(r => r.id !== 'BKK').sort((a, b) => a.users - b.users).slice(0, 3);
                return `จากการวิเคราะห์ความครอบคลุมรายพื้นที่ (Geo-Equity) ปัจจุบันพบว่า:\n\n• เขตนำร่องสูงสุด: ${maxRegion.name} (${maxRegion.users} ราย | สอบผ่าน ${maxRegion.passed} ราย)\n• เขตที่ควรเร่งสนับสนุนเชิงรุก 3 อันดับแรก:\n${bottom3.map((r, i) => `  ${i + 1}. ${r.name} (${r.desc}) — ${r.users} ราย`).join('\n')}\n\nข้อเสนอแนะเชิงนโยบาย: ควรจัดกิจกรรมอบรมแบบ Hybrid และส่งมอบสิทธิ์ Masterclass เพื่อเข้าฝึก AI Skill Lab ให้ทีม ICU ใน 3 เขตดังกล่าวก่อน เพื่อลดคอขวดการเจรจาในภูมิภาคค่ะ`;
            }

            if (q.includes('พึงพอใจ') || q.includes('csat') || q.includes('ดาว') || q.includes('ประเมิน')) {
                return `ข้อมูลความพึงพอใจของผู้เรียน (CSAT) ล่าสุด:\n• คะแนนเฉลี่ย: ${avgCsat} / 5.0 (จากผู้ประเมิน ${csatCount.toLocaleString()} ราย)\n• คะแนนทักษะการเจรจา AI Skill Lab เฉลี่ย: ${avgSkillScore}/100 คะแนน\n\nภาพรวมสะท้อนว่าบุคลากรพึงพอใจกับความสะดวกในการเรียนบนสมาร์ทโฟนและการรับประกาศนียบัตรแบบทันทีในระบบ rjcloud.organ ค่ะ`;
            }

            if (q.includes('สรุป') || q.includes('ภาพรวม') || q.includes('ผ่าน') || q.includes('จำนวน') || q.includes('กี่คน')) {
                return `สรุปตัวชี้วัดหลักระดับชาติ (rjcloud.organ 2027):\n• บุคลากรในระบบทั้งหมด: ${total.users.toLocaleString()} ราย\n• กำลังศึกษาอยู่: ${total.learning.toLocaleString()} ราย\n• ผ่านการฝึก AI Skill Lab: ${total.lab.toLocaleString()} ราย (คะแนนเฉลี่ย ${avgSkillScore}/100)\n• สอบผ่านรับประกาศนียบัตรแล้ว: ${total.passed.toLocaleString()} ราย (อัตราสำเร็จ ${passRate}%)\n• คะแนนความพึงพอใจเฉลี่ย: ${avgCsat} / 5.0 ค่ะ`;
            }

            return `ฟ้าได้วิเคราะห์ข้อมูลล่าสุดของ rjcloud.organ แล้วค่ะ ขณะนี้มีบุคลากรเข้าร่วม ${total.users.toLocaleString()} ราย สอบผ่านแล้ว ${total.passed.toLocaleString()} ราย (${passRate}%) โดยมี ${maxRegion.name} เป็นพื้นที่นำร่องสูงสุด (${maxRegion.users} ราย) และ ${minRegion.name} เป็นพื้นที่เฝ้าระวัง (${minRegion.users} ราย)\n\nท่ามกลางผู้ป่วยรออวัยวะสะสมระดับชาติกว่า 8,019 ราย ขอเสนอให้เร่งขยายทีมพยาบาลผู้ประสานงานในเขตที่ยังมีบุคลากรต่ำกว่าเกณฑ์ และติดตามผลคะแนนเจรจาผ่าน AI Skill Lab อย่างต่อเนื่องค่ะ (หมายเหตุ: หากต้องการให้ Gemini AI ตอบเชิงลึกแบบอิสระ สามารถวาง Apps Script URL ของ rjcloud.organ@gmail.com ใน data.js ได้เลยค่ะ)`;
        }

                        {/* Stylized Thailand Polygon Silhouette (Soft Clinical Tint) */}
                        <path
                            d="M 22,12 L 36,9 L 44,18 L 58,20 L 79,19 L 87,32 L 87,49 L 76,53 L 64,56 L 62,64 L 54,64 L 48,59 L 41,62 L 37,70 L 36,78 L 44,86 L 47,94 L 38,96 L 31,88 L 26,76 L 28,62 L 26,48 L 22,36 L 19,22 Z"
                            fill="rgba(16, 185, 129, 0.08)"
                            stroke="rgba(5, 150, 105, 0.25)"
                            strokeWidth="0.6"
                            strokeLinejoin="round"
                        />

                        {/* Connection Lines from Central Hub (BKK 47,55) to all 12 Health Regions */}
                        {regions.map(r => r.id !== 'BKK' && (
                            <line
                                key={`conn-${r.id}`}
                                x1="47"
                                y1="55"
                                x2={r.x}
                                y2={r.y}
                                stroke={activeRegion?.id === r.id ? '#059669' : '#94a3b8'}
                                strokeWidth={activeRegion?.id === r.id ? '0.65' : '0.3'}
                                strokeOpacity={activeRegion?.id === r.id ? '0.9' : '0.45'}
                                strokeDasharray="1.2 1.4"

                    </svg>

                    {/* Interactive Region Pins (Large 44px touch targets for smartphones) */}
                    {regions.map(r => {
                        const isSelected = activeRegion?.id === r.id;
                        const isHub = r.id === 'BKK';
                        const hasActivity = r.users > 0;
                        return (
                            <button
                                key={r.id}
                                type="button"

                                className={`absolute -translate-x-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center rounded-full focus:outline-none transition-transform duration-200 ${
                                    isSelected ? 'z-30 scale-125' : 'z-20 hover:scale-110 active:scale-95'
                                }`}
                            >
                                {(isSelected || isHub) && (
                                    <span className={`absolute w-8 h-8 rounded-full map-pulse ${isHub ? 'bg-clinical-400' : 'bg-medical-400'}`} />
                                )}
                                <span
                                    className={`relative flex items-center justify-center rounded-full border-2 border-white shadow-md font-mono font-bold transition-all ${
                                        isSelected
                                            ? 'w-7 h-7 bg-slate-900 text-white text-[10px] ring-4 ring-clinical-500/30'
                                            : isHub
                                                ? 'w-6 h-6 bg-gradient-to-br from-clinical-500 to-teal-600 text-white text-[9px]'
                                                : hasActivity
                                                    ? 'w-5 h-5 bg-gradient-to-br from-medical-500 to-clinical-500 text-white text-[8px]'
                                                    : 'w-4 h-4 bg-slate-300 text-slate-600 text-[8px]'
                                    }`}
                                >

                        );
                    })}

                    {/* Legend */}
                    <div className="absolute bottom-3 left-3 z-20 flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-white/85 backdrop-blur-md border border-slate-200/70 text-[10px] font-bold text-slate-600">
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-clinical-600" /> ส่วนกลาง/กทม.</span>
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-medical-500" /> เขตสุขภาพ 1–12</span>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 4. MAIN EXECUTIVE DASHBOARD APPLICATION
        // ============================================================================
        function ExecutiveApp() {
            const [cloudUsers, setCloudUsers] = useState([]);
            const [useDemoData, setUseDemoData] = useState(!isCloudConfigured);
            const [appsScriptUrl, setAppsScriptUrl] = useState(CONFIG.appsScriptUrl || '');
            const [isLoadingCloud, setIsLoadingCloud] = useState(isCloudConfigured);

            // Mobile-first Tabs: overview | regions | ai
            const [mobileTab, setMobileTab] = useState('overview');
            const [regionViewMode, setRegionViewMode] = useState('map'); // map | list
            const [activeRegionId, setActiveRegionId] = useState('BKK');

            // AI Policy Chat & Audio States
            const [messages, setMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isAiThinking, setIsAiThinking] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [toast, setToast] = useState({ visible: false, text: '', type: 'success' });

            const recRef = useRef(null);
            const audioRef = useRef(null);
            const audioUrlRef = useRef(null);
            const chatEndRef = useRef(null);

            const showToast = useCallback((text, type = 'success') => {
                setToast({ visible: true, text, type });
                setTimeout(() => setToast(p => ({ ...p, visible: false })), 3200);
            }, []);

            // Clean up audio & speech on unmount
            const stopVoice = useCallback(() => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current = null;
                }
                if (audioUrlRef.current) {
                    URL.revokeObjectURL(audioUrlRef.current);
                    audioUrlRef.current = null;
                }
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (_) {}
                }
                setIsSpeaking(false);
            }, []);

            useEffect(() => () => stopVoice(), [stopVoice]);

            // 1. Firebase Real-time Sync (พร้อม Unsubscribe สะอาดป้องกัน Memory Leak)
            useEffect(() => {
                if (!isCloudConfigured || !fbAuth || !fbDb) {
                    setIsLoadingCloud(false);
                    return;
                }

                let unsubUsers = null;
                let unsubSettings = null;

                signInAnonymously(fbAuth).catch(err => {
                    console.warn('Anon auth warning:', err);
                    setIsLoadingCloud(false);
                });

                const unsubAuth = onAuthStateChanged(fbAuth, (fbUser) => {
                    if (!fbUser) return;
                    unsubUsers = onSnapshot(
                        collection(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_users'),
                        (snap) => {
                            const arr = [];
                            snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                            setCloudUsers(arr);
                            setIsLoadingCloud(false);
                            // ถ้ามีข้อมูลจริงใน Cloud ให้สลับมาแสดงข้อมูลจริงอัตโนมัติ
                            if (arr.length > 0) setUseDemoData(false);
                        },
                        (err) => {
                            console.warn('Executive users snapshot error:', err);
                            setIsLoadingCloud(false);
                        }
                    );

                    unsubSettings = onSnapshot(
                        doc(fbDb, 'artifacts', CONFIG.appId, 'public', 'data', 'elearning_config', 'settings'),
                        (docSnap) => {
                            if (docSnap.exists() && docSnap.data()?.appsScriptUrl) {
                                setAppsScriptUrl(docSnap.data().appsScriptUrl);
                            }
                        },
                        () => {}
                    );
                });

                return () => {
                    unsubAuth();
                    if (unsubUsers) unsubUsers();
                    if (unsubSettings) unsubSettings();
                };
            }, []);

            // 2. คำนวณสถิติรวมทั้งประเทศและรายเขต (นับครบทุกคน ไม่ตกหล่น!)
            const analytics = useMemo(() => {
                const sourceUsers = useDemoData ? DEMO_USERS_SEED : cloudUsers;

                const statsMap = {};
                BASE_REGIONS.forEach(r => {
                    statsMap[r.id] = { ...r, users: 0, learning: 0, lab: 0, passed: 0 };
                });

                let totalLearning = 0;
                let totalLab = 0;
                let totalPassed = 0;
                let unmappedCount = 0;
                let csatSum = 0;
                let csatCount = 0;
                let skillScoreSum = 0;
                let skillScoreCount = 0;

                sourceUsers.forEach(u => {
                    const isPassed = u.status === 'ผ่าน';
                    const isLearning = !isPassed;
                    const history = Array.isArray(u.skillLabHistory) ? u.skillLabHistory : [];
                    const hasLab = history.length > 0;

                    if (isPassed) totalPassed++;
                    if (isLearning) totalLearning++;
                    if (hasLab) {
                        totalLab++;
                        history.forEach(item => {
                            if (typeof item?.score === 'number') {
                                skillScoreSum += item.score;
                                skillScoreCount++;
                            }
                        });
                    }

                    if (typeof u.satisfactionScore === 'number' && u.satisfactionScore > 0) {
                        csatSum += u.satisfactionScore;
                        csatCount++;
                    }

                    const regId = resolveRegionId(u.department);
                    if (statsMap[regId]) {
                        statsMap[regId].users += 1;
                        if (isLearning) statsMap[regId].learning += 1;
                        if (hasLab) statsMap[regId].lab += 1;
                        if (isPassed) statsMap[regId].passed += 1;
                    } else {
                        unmappedCount += 1;
                    }
                });

                const regionList = Object.values(statsMap);
                const regionalOnly = regionList.filter(r => r.id !== 'BKK');
                const sortedByUsers = [...regionalOnly].sort((a, b) => b.users - a.users);
                const maxRegion = sortedByUsers[0] || { name: 'รอข้อมูล', users: 0, passed: 0 };
                const minRegion = sortedByUsers[sortedByUsers.length - 1] || maxRegion;

                const totalUsers = sourceUsers.length;
                const passRate = totalUsers > 0 ? Math.round((totalPassed / totalUsers) * 100) : 0;
                const avgCsat = csatCount > 0 ? (csatSum / csatCount).toFixed(1) : '0.0';
                const avgSkillScore = skillScoreCount > 0 ? Math.round(skillScoreSum / skillScoreCount) : 0;

                return {
                    total: {
                        users: totalUsers,
                        learning: totalLearning,
                        lab: totalLab,
                        passed: totalPassed,
                        unmapped: unmappedCount
                    },
                    regionList,
                    maxRegion,
                    minRegion,
                    passRate,
                    avgCsat,
                    csatCount,
                    avgSkillScore
                };
            }, [cloudUsers, useDemoData]);

            const activeRegion = useMemo(
                () => analytics.regionList.find(r => r.id === activeRegionId) || analytics.regionList[0],
                [analytics.regionList, activeRegionId]
            );

            // 3. สร้างรายงานสรุปอัตโนมัติและอัปเดตทันทีเมื่อข้อมูลจริงเปลี่ยน (แก้บั๊กค้าง 0 ราย)
            const executiveBrief = useMemo(() => {
                const tplInsight = window.AI_INSIGHT_TEXT ||
                    `📊 rjcloud.organ — AI Policy Intelligence Report (2027):\n• บุคลากรทั้งหมด {{USERS}} ราย | ผ่านเกณฑ์ {{PASSED}} ราย\n• ความพึงพอใจเฉลี่ย {{CSAT}}/5.0\n• พื้นที่นำร่อง: {{MAX_REG_NAME}} ({{MAX_REG_USERS}} ราย)\n• พื้นที่เฝ้าระวัง: {{MIN_REG_NAME}} ({{MIN_REG_USERS}} ราย)`;

                const tplSpeech = window.POLICY_SPEECH ||
                    `สวัสดีค่ะท่านผู้บริหาร ขณะนี้มีบุคลากรในระบบ {{USERS}} ท่าน สอบผ่านแล้ว {{PASSED}} ท่าน คะแนนความพึงพอใจเฉลี่ย {{CSAT}} เต็ม 5 และพื้นที่นำร่องสูงสุดคือ {{MAX_REG_NAME}} ค่ะ`;

                const replaceTokens = (str) => str
                    .replace(/{{USERS}}/g, analytics.total.users.toLocaleString())
                    .replace(/{{PASSED}}/g, analytics.total.passed.toLocaleString())
                    .replace(/{{CSAT}}/g, analytics.avgCsat)
                    .replace(/{{MAX_REG_NAME}}/g, analytics.maxRegion.name)
                    .replace(/{{MAX_REG_USERS}}/g, analytics.maxRegion.users.toLocaleString())
                    .replace(/{{MIN_REG_NAME}}/g, analytics.minRegion.name)
                    .replace(/{{MIN_REG_USERS}}/g, analytics.minRegion.users.toLocaleString());

                return {
                    insightText: replaceTokens(tplInsight),
                    speechText: replaceTokens(tplSpeech)
                };
            }, [analytics]);

            useEffect(() => {
                setMessages(prev => {
                    const initialMsg = { id: 'brief-init', role: 'ai', text: executiveBrief.insightText };
                    if (prev.length === 0) return [initialMsg];
                    return [initialMsg, ...prev.slice(1)];
                });
            }, [executiveBrief.insightText]);

            // 4. ตั้งค่าระบบสั่งงานด้วยเสียง (Speech Recognition)
            useEffect(() => {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) return;
                const recognition = new SR();
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.lang = 'th-TH';
                recognition.onresult = (e) => {
                    let transcript = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) {
                        transcript += e.results[i][0].transcript;
                    }
                    setChatInput(transcript);
                };
                recognition.onend = () => setIsListening(false);
                recognition.onerror = () => setIsListening(false);
                recRef.current = recognition;
                return () => {
                    try { recognition.abort(); } catch (_) {}
                };
            }, []);

            // 5. เล่นเสียงรายงาน (Gemini TTS -> Fallback Web Speech API th-TH)
            const playPolicyVoice = async (textToSpeak) => {
                if (isSpeaking) {
                    stopVoice();
                    return;
                }
                const cleanText = String(textToSpeak || '').replace(/[*#📊•]/g, '').trim();
                if (!cleanText) return;

                setIsSpeaking(true);

                // ลองเรียก Gemini TTS ผ่าน Apps Script ก่อนถ้ามีการตั้งค่า URL แล้ว
                if (appsScriptUrl) {
                    try {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'callGeminiTTS', text: cleanText, voiceName: 'Aoede' })
                        }).then(r => r.json());

                        if (res?.status === 'success' && res.inlineData?.data) {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const url = pcm16ToWavUrl(res.inlineData.data, rate);
                            audioUrlRef.current = url;
                            const audio = new Audio(url);
                            audioRef.current = audio;
                            audio.onended = () => stopVoice();
                            audio.onerror = () => stopVoice();
                            await audio.play();
                            return;
                        }
                    } catch (err) {
                        console.warn('Gemini TTS fallback to browser speech:', err);
                    }
                }

                // Fallback: ใช้เสียงภาษาไทยในเครื่องสมาร์ทโฟน/เบราว์เซอร์ (Web Speech API)
                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance(cleanText);
                        utter.lang = 'th-TH';
                        utter.rate = 1.02;
                        utter.onend = () => setIsSpeaking(false);
                        utter.onerror = () => setIsSpeaking(false);
                        window.speechSynthesis.speak(utter);
                        return;
                    } catch (_) {}
                }

                setIsSpeaking(false);
                showToast('อุปกรณ์นี้ไม่รองรับการอ่านเสียงอัตโนมัติค่ะ', 'error');
            };

            // 6. ส่งคำถามผู้บริหารไปยัง AI พร้อมแนบ "ข้อมูลสถิติจริงแบบ Real-time" ใน Prompt!
            const handleSendQuestion = async (e, presetText = null) => {
                if (e) e.preventDefault();
                const userQ = (presetText ?? chatInput).trim();
                if (!userQ || isAiThinking) return;

                stopVoice();
                if (isListening) {
                    try { recRef.current?.stop(); } catch (_) {}
                    setIsListening(false);
                }

                setChatInput('');
                setMessages(prev => [...prev, { id: Date.now(), role: 'user', text: userQ }]);
                setIsAiThinking(true);
                setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 80);

                // แนบข้อมูลจริงทั้งหมดเข้าไปใน System Instruction เพื่อป้องกัน AI เดาตัวเลข
                const liveSnapshotJson = JSON.stringify({
                    platform: 'rjcloud.organ 2027',
                    dataMode: useDemoData ? 'Demo Simulation' : 'Live Production Firestore',
                    nationalTotals: analytics.total,
                    passRatePercent: analytics.passRate,
                    csatAverageOutOf5: analytics.avgCsat,
                    csatRespondents: analytics.csatCount,
                    avgSkillLabScore: analytics.avgSkillScore,
                    topRegion: { name: analytics.maxRegion.name, users: analytics.maxRegion.users, passed: analytics.maxRegion.passed },
                    lowestRegion: { name: analytics.minRegion.name, users: analytics.minRegion.users, passed: analytics.minRegion.passed },
                    allRegions: analytics.regionList.map(r => ({
                        id: r.id,
                        name: r.name,
                        users: r.users,
                        learning: r.learning,
                        skillLab: r.lab,
                        passed: r.passed
                    }))
                });

                const systemInstruction = `คุณคือ "Fah Executive Intelligence" ผู้ช่วยวิเคราะห์ข้อมูลเชิงนโยบายของแพลตฟอร์ม rjcloud.organ (2027)
ใช้ข้อมูลสถิติจริงด้านล่างนี้ในการตอบคำถามผู้บริหารอย่างแม่นยำ ห้ามแต่งตัวเลขขึ้นเอง:
${liveSnapshotJson}

แนวทางการตอบ:
1. ตอบเป็นภาษาไทยที่สุภาพ กระชับ เฉียบขาด และมีวิสัยทัศน์เชิงนโยบายสาธารณสุข
2. อ้างอิงตัวเลขจากข้อมูลจริงข้างต้น และบริบทผู้ป่วยรออวัยวะสะสมระดับชาติ (8,019 ราย) เมื่อเกี่ยวข้อง
3. จัดย่อหน้าหรือหัวข้อย่อยให้อ่านง่ายบนหน้าจอสมาร์ทโฟน`;

                let answerText = '';

                if (appsScriptUrl) {
                    try {
                        const res = await fetch(appsScriptUrl, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: userQ,
                                systemInstruction
                            })
                        }).then(r => r.json());

                        if (res?.status === 'success' && res.text) {
                            answerText = res.text;
                        }
                    } catch (err) {
                        console.warn('Gemini call failed, using local analytics engine:', err);
                    }
                }

                if (!answerText) {
                    await new Promise(r => setTimeout(r, 450));
                    answerText = generateLocalExecutiveAnswer(userQ, analytics);
                }

                setMessages(prev => [...prev, { id: Date.now() + 1, role: 'ai', text: answerText }]);
                setIsAiThinking(false);
                setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
            };

            const toggleMic = () => {
                if (!recRef.current) {
                    showToast('เบราว์เซอร์นี้ไม่รองรับการสั่งงานด้วยเสียงค่ะ', 'error');
                    return;
                }
                if (isListening) {
                    recRef.current.stop();
                    setIsListening(false);
                } else {
                    setChatInput('');
                    try {
                        recRef.current.start();
                        setIsListening(true);
                    } catch (_) {
                        setIsListening(false);
                    }
                }
            };

            const quickPrompts = [
                'สรุปภาพรวมบุคลากรทั้งหมด',
                'เขตสุขภาพไหนควรเร่งสนับสนุน?',
                'ผลความพึงพอใจ (CSAT) เป็นอย่างไร?'
            ];

            // ============================================================================
            // 5. RENDER UI (PEARL CLINICAL GLASS 2027 — LIGHT & 100% SMARTPHONE READY)
            // ============================================================================
            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-dock-safe lg:pb-10">
                    <div className="aura-canvas" />
                    <div className="aura-grid" />

                    {/* Top App Header */}
                    <header className="sticky top-0 z-30 backdrop-blur-xl bg-white/82 border-b border-slate-200/70 no-print">
                        <div className="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <a
                                    href="./index.html"
                                    aria-label="กลับหน้าหลัก"
                                    className="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center shrink-0 transition-colors"
                                >
                                    <Icon name="ArrowLeft" size={18} />
                                </a>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5">
                                        <span className="font-display font-extrabold text-sm sm:text-base text-slate-900 truncate">
                                            Executive Intelligence
                                        </span>
                                        <span className={`px-2 py-0.5 rounded-full text-[9px] font-mono font-bold shrink-0 ${
                                            useDemoData
                                                ? 'bg-amber-100 text-amber-800'
                                                : 'bg-clinical-100 text-clinical-700'
                                        }`}>
                                            {useDemoData ? 'DEMO' : 'LIVE'}
                                        </span>
                                    </div>
                                    <p className="text-[10px] font-mono text-slate-500 truncate">
                                        rjcloud.organ • National Metrics 2027
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                                <button
                                    type="button"
                                    onClick={() => {
                                        if (!isCloudConfigured && useDemoData) {
                                            showToast('กรุณาวางค่า Firebase ของ rjcloud.organ@gmail.com ใน data.js เพื่อดูข้อมูลจริงค่ะ', 'error');
                                            return;
                                        }
                                        setUseDemoData(v => !v);
                                    }}
                                    className="px-3 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200/80 text-slate-700 font-bold text-[11px] flex items-center gap-1.5 transition-colors shadow-sm"
                                >
                                    <Icon name="Database" size={14} className="text-clinical-600" />
                                    <span className="hidden sm:inline">{useDemoData ? 'ข้อมูลตัวอย่าง' : 'ข้อมูลจริง'}</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => playPolicyVoice(executiveBrief.speechText)}
                                    className={`px-3 py-2 rounded-xl font-bold text-[11px] flex items-center gap-1.5 transition-all shadow-sm ${
                                        isSpeaking
                                            ? 'bg-rose-500 text-white'
                                            : 'bg-clinical-600 hover:bg-clinical-700 text-white'
                                    }`}
                                >
                                    <Icon name={isSpeaking ? 'Square' : 'Volume2'} size={14} />
                                    <span className="hidden sm:inline">{isSpeaking ? 'หยุดเสียง' : 'ฟังรายงาน'}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Grid */}
                    <main className="relative z-10 flex-1 w-full max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 pt-4 md:pt-6 space-y-5">
                        {/* SECTION A: KPI BENTO STRIP (แสดงบนมือถือเมื่ออยู่แท็บ overview และแสดงตลอดบน Desktop) */}
                        <section className={`${mobileTab === 'overview' ? 'block' : 'hidden'} lg:block space-y-4`}>
                            {/* National Hero Banner */}
                            <div className="bento-glass rounded-[1.75rem] p-5 sm:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>

                                            {analytics.passRate}%

                                <div className="bento-glass rounded-[1.5rem] p-4 sm:p-5">

                                        <div className="w-8 h-8 rounded-xl bg-clinical-50 text-clinical-600 flex items-center justify-center">
                                            <Icon name="Award" size={16} />
                                        </div>

                                    <p className="font-mono text-2xl sm:text-3xl font-extrabold text-clinical-700">
                                        {analytics.total.passed.toLocaleString()}

                                    <p className="text-[11px] text-clinical-600 font-semibold mt-1">

                                </div>

                                <div className="bento-glass rounded-[1.5rem] p-4 sm:p-5">

                                >
                                    <div>
                                        <p className="text-[11px] font-bold text-clinical-600">เขตสุขภาพนำร่องสูงสุด</p>
                                        <p className="font-display font-bold text-base text-slate-900 mt-0.5">{analytics.maxRegion.name}</p>
                                        <p className="text-xs text-slate-500">{analytics.maxRegion.users} ราย • สอบผ่าน {analytics.maxRegion.passed} ราย</p>
                                    </div>
                                    <Icon name="ChevronRight" size={18} className="text-slate-400" />
                                </button>
                                <button
                                    type="button"
                                    onClick={() => { setActiveRegionId(analytics.minRegion.id); setMobileTab('regions'); }}
                                    className="bento-glass rounded-2xl p-4 text-left flex items-center justify-between active:scale-[0.99]"
                                >
                                    <div>
                                        <p className="text-[11px] font-bold text-amber-600">พื้นที่ควรเร่งสนับสนุน</p>
                                        <p className="font-display font-bold text-base text-slate-900 mt-0.5">{analytics.minRegion.name}</p>
                                        <p className="text-xs text-slate-500">{analytics.minRegion.users} ราย • สอบผ่าน {analytics.minRegion.passed} ราย</p>
                                    </div>
                                    <Icon name="ChevronRight" size={18} className="text-slate-400" />
                                </button>
                            </div>
                        </section>

                        {/* SECTION B: WORKSPACE SPLIT (Desktop: Map 7 cols + AI 5 cols | Mobile: Tabbed) */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                            {/* LEFT/TOP: REGIONAL MAP & BREAKDOWN */}
                            <section className={`lg:col-span-7 ${mobileTab === 'regions' ? 'block' : 'hidden'} lg:block space-y-4`}>
                                <div className="bento-glass rounded-[1.75rem] p-4 sm:p-6 space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <h2 className="font-display font-bold text-base sm:text-lg text-slate-900 flex items-center gap-2">
                                                <Icon name="MapPin" size={18} className="text-clinical-600" />
                                                แผนที่เครือข่าย 13 เขตสุขภาพ
                                            </h2>
                                            <p className="text-xs text-slate-500">แตะที่จุดเขตสุขภาพเพื่อดูรายละเอียดเชิงลึก</p>
                                        </div>

                                        {/* Switch Map / List View (ดีมากสำหรับจอมือถือเล็ก) */}
                                        <div className="inline-flex p-1 rounded-xl bg-slate-100 border border-slate-200/70">
                                            <button
                                                type="button"
                                                onClick={() => setRegionViewMode('map')}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                                    regionViewMode === 'map' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'
                                                }`}
                                            >
                                                แผนที่
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setRegionViewMode('list')}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                                    regionViewMode === 'list' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'
                                                }`}
                                            >
                                                ตารางจัดอันดับ
                                            </button>
                                        </div>
                                    </div>

                                    {regionViewMode === 'map' ? (
                                        <>
                                            <ThailandNetworkMap
                                                regions={analytics.regionList}
                                                activeRegion={activeRegion}
                                                onSelectRegion={(r) => setActiveRegionId(r.id)}
                                            />

                                            {/* Selected Region Inspector Card (ชัดเจน อ่านง่ายบนมือถือ ไม่โดนขอบจอตัด) */}
                                            {activeRegion && (
                                                <div className="p-4 sm:p-5 rounded-2xl bg-white/95 border border-clinical-200/80 shadow-sm space-y-3">
                                                    <div className="flex items-start justify-between gap-2">
                                                        <div>
                                                            <div className="flex items-center gap-2">
                                                                <span className="px-2 py-0.5 rounded-md bg-clinical-100 text-clinical-700 font-mono text-[10px] font-bold">
                                                                    {activeRegion.id}
                                                                </span>
                                                                <h3 className="font-display font-bold text-base text-slate-900">{activeRegion.name}</h3>
                                                            </div>
                                                            <p className="text-xs text-slate-500 mt-0.5">{activeRegion.desc}</p>
                                                        </div>
                                                        <span className="font-mono text-xs font-bold text-clinical-700 bg-clinical-50 px-2.5 py-1 rounded-full">
                                                            ผ่าน {activeRegion.users > 0 ? Math.round((activeRegion.passed / activeRegion.users) * 100) : 0}%
                                                        </span>
                                                    </div>

                                                    <div className="grid grid-cols-4 gap-2 text-center">
                                                        <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                                                            <p className="text-[10px] font-bold text-slate-400">ทั้งหมด</p>
                                                            <p className="font-mono text-base font-extrabold text-slate-900">{activeRegion.users}</p>
                                                        </div>
                                                        <div className="p-2.5 rounded-xl bg-amber-50/70 border border-amber-100">
                                                            <p className="text-[10px] font-bold text-amber-600">กำลังเรียน</p>
                                                            <p className="font-mono text-base font-extrabold text-amber-700">{activeRegion.learning}</p>
                                                        </div>
                                                        <div className="p-2.5 rounded-xl bg-violet-50/70 border border-violet-100">
                                                            <p className="text-[10px] font-bold text-violet-600">Skill Lab</p>
                                                            <p className="font-mono text-base font-extrabold text-violet-700">{activeRegion.lab}</p>
                                                        </div>
                                                        <div className="p-2.5 rounded-xl bg-clinical-50 border border-clinical-100">
                                                            <p className="text-[10px] font-bold text-clinical-600">ผ่านเกณฑ์</p>
                                                            <p className="font-mono text-base font-extrabold text-clinical-700">{activeRegion.passed}</p>

                                                    </div>
                                                </div>
                                            )}

                                    ) : (
                                        <div className="space-y-2.5 max-h-[580px] overflow-y-auto custom-scrollbar pr-1">

                                                    const pct = analytics.total.users > 0 ? Math.round((r.users / analytics.total.users) * 100) : 0;

                                                        >
                                                            <div className="flex items-center justify-between gap-2 mb-1.5">
                                                                <div className="flex items-center gap-2 min-w-0">
                                                                    <span className="w-6 h-6 rounded-lg bg-slate-100 font-mono text-xs font-bold text-slate-600 flex items-center justify-center shrink-0">
                                                                        {idx + 1}
                                                                    </span>
                                                                    <span className="font-display font-bold text-sm text-slate-900 truncate">{r.name}</span>

                                                                <span className="font-mono text-xs font-extrabold text-clinical-700 shrink-0">

                                                            </div>
                                                        </button>

                                                    <span className="font-mono font-bold text-slate-800">{analytics.total.unmapped} ราย</span>
                                                </div>

                            </section>

                                    {/* AI Header */}
                                    <div className="p-4 sm:p-5 border-b border-slate-200/70 bg-white/75 flex items-center justify-between gap-2 shrink-0">

                                                <h2 className="font-display font-bold text-sm sm:text-base text-slate-900 truncate">

                                                    <span className="w-1.5 h-1.5 rounded-full bg-clinical-500 animate-pulse" />
                                                    วิเคราะห์จากข้อมูลจริง ({analytics.total.users} ราย)
                                                </p>
                                            </div>
                                        </div>

                                        <button
                                            type="button"
                                            onClick={() => playPolicyVoice(messages[messages.length - 1]?.text || executiveBrief.speechText)}
                                            className={`touch-target px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shrink-0 ${
                                                isSpeaking
                                                    ? 'bg-rose-500 text-white'
                                                    : 'bg-clinical-50 hover:bg-clinical-100 text-clinical-700 border border-clinical-200/70'
                                            }`}
                                        >
                                            <Icon name={isSpeaking ? 'VolumeX' : 'Volume2'} size={15} />
                                            {isSpeaking ? 'หยุด' : 'ฟังสรุป'}
                                        </button>
                                    </div>

                                    {/* Chat Feed */}
                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3 bg-slate-50/40">
                                        {isLoadingCloud && (
                                            <div className="text-center py-6 text-xs text-slate-400">กำลังซิงค์ข้อมูลล่าสุดจาก Cloud...</div>
                                        )}

                                        {messages.map((m) => (
                                            <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[92%] p-3.5 rounded-2xl text-xs sm:text-sm leading-relaxed whitespace-pre-line shadow-sm ${
                                                    m.role === 'user'
                                                        ? 'bg-gradient-to-r from-clinical-600 to-teal-600 text-white rounded-br-sm font-medium'
                                                        : 'bg-white border border-slate-200/80 text-slate-800 rounded-bl-sm'
                                                }`}>
                                                    {m.text}
                                                </div>
                                            </div>
                                        ))}

                                        {isAiThinking && (
                                            <div className="flex justify-start">
                                                <div className="px-4 py-3 rounded-2xl bg-white border border-slate-200/80 text-xs font-semibold text-clinical-700 flex items-center gap-2">
                                                    <span className="w-2 h-2 rounded-full bg-clinical-500 animate-bounce" />
                                                    กำลังวิเคราะห์ข้อมูลเชิงนโยบาย...
                                                </div>
                                            </div>
                                        )}
                                        <div ref={chatEndRef} />
                                    </div>

                                    {/* Quick Prompts & Input */}
                                    <div className="p-3 sm:p-4 border-t border-slate-200/70 bg-white/90 space-y-2.5 shrink-0">
                                        <div className="flex gap-1.5 overflow-x-auto custom-scrollbar pb-1">
                                            {quickPrompts.map((qp, idx) => (
                                                <button
                                                    key={idx}
                                                    type="button"
                                                    onClick={() => handleSendQuestion(null, qp)}
                                                    className="shrink-0 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-clinical-50 hover:text-clinical-700 border border-slate-200/70 text-[11px] font-bold text-slate-600 transition-colors"
                                                >
                                                    {qp}
                                                </button>
                                            ))}
                                        </div>

                                        <form onSubmit={handleSendQuestion} className="flex items-center gap-2">
                                            <input
                                                type="text"
                                                value={chatInput}
                                                onChange={e => setChatInput(e.target.value)}
                                                placeholder={isListening ? 'กำลังรับเสียงพูด...' : 'ถามข้อมูลนโยบายหรือสถิติ...'}
                                                disabled={isAiThinking}
                                                className="touch-target flex-1 px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-clinical-500 focus:bg-white"
                                            />
                                            <button
                                                type="button"
                                                onClick={toggleMic}
                                                aria-label="สั่งงานด้วยเสียง"
                                                className={`touch-target w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 transition-all ${
                                                    isListening
                                                        ? 'bg-rose-500 text-white shadow-md animate-pulse'
                                                        : 'bg-slate-100 hover:bg-slate-200 text-slate-600'
                                                }`}
                                            >
                                                <Icon name="Mic" size={18} />
                                            </button>
                                            <button
                                                type="submit"
                                                disabled={!chatInput.trim() || isAiThinking}
                                                aria-label="ส่งคำถาม"
                                                className="touch-target w-11 h-11 rounded-2xl bg-clinical-600 hover:bg-clinical-700 disabled:bg-slate-200 disabled:text-slate-400 text-white flex items-center justify-center shrink-0 shadow-sm transition-colors"
                                            >
                                                <Icon name="Send" size={18} />
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </main>

                    {/* Smartphone Bottom Dock (3 แท็บกดถนัดมือเดียว) */}
                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/92 backdrop-blur-2xl border-t border-slate-200/80 px-3 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] shadow-[0_-8px_30px_rgba(15,23,42,0.08)] no-print">
                        <div className="grid grid-cols-3 gap-1.5 max-w-md mx-auto">
                            {[
                                { id: 'overview', label: 'ภาพรวม KPI', icon: 'LayoutDashboard' },
                                { id: 'regions', label: 'แผนที่ 13 เขต', icon: 'MapPin' },
                                { id: 'ai', label: 'ถาม Fah AI', icon: 'Cpu' }
                            ].map(item => {
                                const active = mobileTab === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        type="button"
                                        onClick={() => { setMobileTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className={`touch-target flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-[11px] font-bold transition-all active:scale-95 ${
                                            active
                                                ? 'bg-clinical-600 text-white shadow-sm'
                                                : 'text-slate-600 hover:bg-slate-100'
                                        }`}
                                    >
                                        <Icon name={item.icon} size={18} />
                                        <span>{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('executive-root'));
        root.render(<ExecutiveApp />);
    </script>
</body>
</html>
