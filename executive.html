    <script>
      (function () {
        try {
          const key = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.storageKey) || 'rjcloud_theme';
          const def = (window.RJCLOUD_CONFIG && window.RJCLOUD_CONFIG.theme && window.RJCLOUD_CONFIG.theme.defaultMode) || 'dark';
          const saved = localStorage.getItem(key) || def;
          const mode = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#020612' : '#edf6fd');
        } catch (_) {}
      })();
    </script>

        function resolveRegionId(department = '') {
            if (typeof CORE.resolveRegionId === 'function') return CORE.resolveRegionId(department);

            if (d.startsWith('เขตสุขภาพที่')) {

         */
        function sanitizeToStatsOnly(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const hist = Array.isArray(raw.skillLabHistory) ? raw.skillLabHistory : [];
            const latestHist = hist.length > 0 ? hist[hist.length - 1] : null;
            let radar = null;
            if (raw.radar && typeof raw.radar === 'object') {
                radar = raw.radar;
            } else if (raw.skillLabLatestRadar && typeof raw.skillLabLatestRadar === 'object') {
                radar = raw.skillLabLatestRadar;
            } else if (latestHist && Array.isArray(latestHist.radar) && latestHist.radar.length > 0) {
                radar = {};
                latestHist.radar.forEach(item => { if (item?.key) radar[item.key] = Number(item.value || 0); });
            }

            const domains = Array.isArray(raw.domains)
                ? raw.domains
                : (Array.isArray(raw.aiRoadmap?.domains) ? raw.aiRoadmap.domains.map(d => ({ id: d.id, percent: Number(d.percent || 0) })) : []);

            const bestLabScore = typeof raw.skillLabBestScore === 'number'
                ? raw.skillLabBestScore
                : (hist.length > 0 ? Math.max(...hist.map(h => Number(h.score || 0))) : null);

            return {
                regionId: raw.regionId || resolveRegionId(raw.department),
                status: raw.status === 'ผ่าน' ? 'ผ่าน' : 'กำลังเรียน',

                    const hasLab = i < Math.round(count * 0.8);
                    const base = 74 + ((rIdx * 3 + i * 2) % 21);
                    rows.push({
                        regionId: r.id,
                        status: passed ? 'ผ่าน' : 'กำลังเรียน',
                        progress: passed ? 95 : 55,
                        hasLab,
                        skillLabBestScore: hasLab ? base : null,
                        radar: hasLab ? {
                            setting: Math.min(98, base + 4),
                            empathy: Math.min(98, base + 2),
                            clarity: Math.min(98, base - 3),
                            vocal: Math.min(98, base - 6),
                            dignity: Math.min(98, base + 5)
                        } : null,
                        domains: [
                            { id: 'policy_ethics', percent: Math.min(98, base + 3) },
                            { id: 'brain_death_donor', percent: Math.min(98, base - 4) },
                            { id: 'procurement_transplant', percent: Math.min(98, base - 2) },
                            { id: 'family_communication', percent: Math.min(98, base + 1) }

                        susScore: passed ? (82 + (i % 12)) : null,
                        preSelfEfficacyAvg: hasLab ? Number((2.8 + ((i % 4) * 0.2)).toFixed(2)) : null,

        function copyTextSafe(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = String(text || '');
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (ok) return true;
            } catch (_) {}
            try {
                if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                    navigator.clipboard.writeText(String(text || '')).catch(() => {});
                    return true;
                }
            } catch (_) {}
            return false;
        }

        function FiveAxisRadarSVG({ radarObj, theme }) {
            const isDark = theme === 'dark';
            const w = 290, h = 248, cx = w / 2, cy = h / 2, maxR = 68;
            const pt = (idx, ratio) => {
                const ang = (Math.PI * 2 * idx) / RADAR_AXES.length - Math.PI / 2;
                return [cx + Math.cos(ang) * maxR * ratio, cy + Math.sin(ang) * maxR * ratio];
            };
            const dataPts = RADAR_AXES.map((a, i) => pt(i, Math.max(0, Math.min(100, Number(radarObj?.[a.key] || 0))) / 100));

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full max-w-[290px] mx-auto overflow-visible">
                    <defs>
                        <linearGradient id="execRadarFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#34d399" stopOpacity="0.48" />
                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.22" />
                        </linearGradient>
                    </defs>
                    {[0.25, 0.5, 0.75, 1].map((lv, li) => (
                        <polygon key={li} points={RADAR_AXES.map((_, i) => pt(i, lv).join(',')).join(' ')} fill="none" stroke={isDark ? 'rgba(147,197,253,0.22)' : 'rgba(15,58,125,0.16)'} strokeWidth="1" />
                    ))}
                    {RADAR_AXES.map((_, i) => {
                        const [x, y] = pt(i, 1);
                        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={isDark ? 'rgba(147,197,253,0.2)' : 'rgba(15,58,125,0.14)'} strokeWidth="1" />;
                    })}
                    <polygon points={dataPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')} fill="url(#execRadarFill)" stroke="#34d399" strokeWidth="2.3" />
                    {dataPts.map(([x, y], i) => (
                        <circle key={i} cx={x} cy={y} r="3.6" fill="#34d399" stroke={isDark ? '#020612' : '#ffffff'} strokeWidth="1.5" />
                    ))}
                    {RADAR_AXES.map((a, i) => {
                        const [lx, ly] = pt(i, 1.38);
                        return (
                            <g key={a.key}>
                                <text x={lx} y={ly - 4} textAnchor="middle" fill={isDark ? '#dbeafe' : '#284366'} fontSize="9.2" fontWeight="700">{a.shortTH}</text>
                                <text x={lx} y={ly + 9} textAnchor="middle" fill={isDark ? '#6ee7b7' : '#047857'} fontSize="10" fontFamily="JetBrains Mono, monospace" fontWeight="700">
                                    {Number(radarObj?.[a.key] || 0)}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        }

                    const emptyDomains = DOMAIN_LIST.map(d => ({ ...d, avg: 0 }));
                    const regionList = BASE_REGIONS.map(r => {
                        const users = Number(g[`region_${r.id}`] || 0);
                        const passed = Number(g[`region_${r.id}_passed`] || 0);
                        return {
                            ...r,
                            users,
                            learning: Math.max(0, users - passed),
                            lab: 0,
                            passed,
                            radar: emptyRadar,
                            domains: emptyDomains,
                            hasRadarData: false,
                            hasDomainData: false,
                            weakestDomain: emptyDomains[0],
                            weakestAxis: { ...RADAR_AXES[0], avg: 0 },
                            avgEmpathy: 0,
                            passPct: users > 0 ? Math.round((passed / users) * 100) : 0
                        };
                    });

                    const regionalOnly = regionList.filter(r => r.id !== 'BKK');
                    const sortedByUsers = [...regionalOnly].sort((a, b) => b.users - a.users);
                    return {
                        total: { users: totalUsers, learning: totalLearning, lab: totalLab, passed: totalPassed, unmapped: unmappedCount },
                        regionList,
                        maxRegion: sortedByUsers[0] || { name: '-', users: 0, passed: 0 },
                        minRegion: sortedByUsers[sortedByUsers.length - 1] || { name: '-', users: 0, passed: 0 },
                        passRate: totalUsers > 0 ? Math.round((totalPassed / totalUsers) * 100) : 0,
                        avgCsat: csatCount > 0 ? (csatSum / csatCount).toFixed(1) : '0.0',
                        csatCount,
                        avgSkillScore: skillScoreCount > 0 ? Math.round(skillScoreSum / skillScoreCount) : 0,
                        hasNationalRadar: false,
                        hasNationalDomains: false,
                        nationalRadar: emptyRadar,
                        nationalDomains: emptyDomains,
                        nationalWeakestDomain: emptyDomains[0],
                        nationalWeakestAxis: { ...RADAR_AXES[0], avg: 0 },
                        ...buildSusMeta(Number(g.susSum || 0), Number(g.susCount || 0)),
                        ...buildEffMeta(Number(g.preEffSum || 0), Number(g.preEffCount || 0), Number(g.postEffSum || 0), Number(g.postEffCount || 0))
                    };
                }

                const makeAcc = () => ({
                    radarSum: { setting: 0, empathy: 0, clarity: 0, vocal: 0, dignity: 0 },
                    radarCount: 0,
                    domainSum: { policy_ethics: 0, brain_death_donor: 0, procurement_transplant: 0, family_communication: 0 },
                    domainCount: { policy_ethics: 0, brain_death_donor: 0, procurement_transplant: 0, family_communication: 0 }
                });
                const natAcc = makeAcc();
                const statsMap = {};
                BASE_REGIONS.forEach(r => { statsMap[r.id] = { ...r, users: 0, learning: 0, lab: 0, passed: 0, acc: makeAcc() }; });

                let totalLearning = 0, totalLab = 0, totalPassed = 0, unmappedCount = 0;
                let csatSum = 0, csatCount = 0, susSum = 0, susCount = 0;
                let preEffSum = 0, preEffCount = 0, postEffSum = 0, postEffCount = 0;
                let skillScoreSum = 0, skillScoreCount = 0;

                const accumulate = (acc, row) => {
                    if (row.radar) {
                        RADAR_AXES.forEach(a => { acc.radarSum[a.key] += Number(row.radar[a.key] || 0); });
                        acc.radarCount += 1;
                    }
                    if (Array.isArray(row.domains)) {
                        row.domains.forEach(d => {
                            if (d?.id && typeof d.percent === 'number' && acc.domainSum[d.id] !== undefined) {
                                acc.domainSum[d.id] += d.percent;
                                acc.domainCount[d.id] += 1;
                            }
                        });
                    }
                };

                activeStatsRows.forEach(row => {
                    const isPassed = row.status === 'ผ่าน';
                    if (isPassed) totalPassed++; else totalLearning++;
                    if (row.hasLab) {
                        totalLab++;
                        if (typeof row.skillLabBestScore === 'number' && row.skillLabBestScore > 0) {
                            skillScoreSum += row.skillLabBestScore;
                            skillScoreCount++;
                        }
                    }
                    if (typeof row.satisfactionScore === 'number' && row.satisfactionScore > 0) { csatSum += row.satisfactionScore; csatCount++; }
                    if (typeof row.susScore === 'number' && row.susScore >= 0) { susSum += row.susScore; susCount++; }
                    if (typeof row.preSelfEfficacyAvg === 'number' && row.preSelfEfficacyAvg > 0) { preEffSum += row.preSelfEfficacyAvg; preEffCount++; }
                    if (typeof row.postSelfEfficacyAvg === 'number' && row.postSelfEfficacyAvg > 0) { postEffSum += row.postSelfEfficacyAvg; postEffCount++; }

                    accumulate(natAcc, row);
                    if (statsMap[row.regionId]) {
                        statsMap[row.regionId].users += 1;
                        if (!isPassed) statsMap[row.regionId].learning += 1;
                        if (row.hasLab) statsMap[row.regionId].lab += 1;
                        if (isPassed) statsMap[row.regionId].passed += 1;
                        accumulate(statsMap[row.regionId].acc, row);
                    } else {
                        unmappedCount += 1;
                    }
                });

                const finRadar = (acc) => {
                    const out = {};
                    RADAR_AXES.forEach(a => { out[a.key] = acc.radarCount > 0 ? Math.round(acc.radarSum[a.key] / acc.radarCount) : 0; });
                    return out;
                };
                const finDomains = (acc) => DOMAIN_LIST.map(d => ({ ...d, avg: acc.domainCount[d.id] > 0 ? Math.round(acc.domainSum[d.id] / acc.domainCount[d.id]) : 0 }));

                const hasNationalRadar = natAcc.radarCount > 0;
                const hasNationalDomains = DOMAIN_LIST.some(d => natAcc.domainCount[d.id] > 0);
                const nationalRadar = finRadar(natAcc);
                const nationalDomains = finDomains(natAcc);
                const nationalWeakestDomain = [...nationalDomains].sort((a, b) => a.avg - b.avg)[0];
                const nationalWeakestAxis = RADAR_AXES.map(a => ({ ...a, avg: nationalRadar[a.key] })).sort((a, b) => a.avg - b.avg)[0];

                const regionList = Object.values(statsMap).map(r => {
                    const radar = finRadar(r.acc);
                    const domains = finDomains(r.acc);
                    const hasRadarData = r.acc.radarCount > 0;
                    const hasDomainData = DOMAIN_LIST.some(d => r.acc.domainCount[d.id] > 0);
                    return {
                        ...r,
                        radar,
                        domains,
                        hasRadarData,
                        hasDomainData,
                        weakestDomain: [...domains].sort((a, b) => a.avg - b.avg)[0],
                        weakestAxis: RADAR_AXES.map(a => ({ ...a, avg: radar[a.key] })).sort((a, b) => a.avg - b.avg)[0],
                        avgEmpathy: hasRadarData ? Math.round(RADAR_AXES.reduce((s, a) => s + (radar[a.key] || 0), 0) / RADAR_AXES.length) : 0,
                        passPct: r.users > 0 ? Math.round((r.passed / r.users) * 100) : 0
                    };
                });

                const regionalOnly = regionList.filter(r => r.id !== 'BKK');
                const sortedByUsers = [...regionalOnly].sort((a, b) => b.users - a.users);
                const totalUsers = activeStatsRows.length;

                return {
                    total: { users: totalUsers, learning: totalLearning, lab: totalLab, passed: totalPassed, unmapped: unmappedCount },
                    regionList,
                    maxRegion: sortedByUsers[0] || { name: '-', users: 0, passed: 0 },
                    minRegion: sortedByUsers[sortedByUsers.length - 1] || { name: '-', users: 0, passed: 0 },
                    passRate: totalUsers > 0 ? Math.round((totalPassed / totalUsers) * 100) : 0,
                    avgCsat: csatCount > 0 ? (csatSum / csatCount).toFixed(1) : '0.0',
                    csatCount,
                    avgSkillScore: skillScoreCount > 0
                        ? Math.round(skillScoreSum / skillScoreCount)
                        : (hasNationalRadar ? Math.round(RADAR_AXES.reduce((s, a) => s + nationalRadar[a.key], 0) / RADAR_AXES.length) : 0),
                    hasNationalRadar,
                    hasNationalDomains,
                    nationalRadar,
                    nationalDomains,
                    nationalWeakestDomain,
                    nationalWeakestAxis,
                    ...buildSusMeta(susSum, susCount),
                    ...buildEffMeta(preEffSum, preEffCount, postEffSum, postEffCount)
                };
            }, [isEcoSummaryMode, globalSummaryDoc, activeStatsRows]);

            const activeRegion = useMemo(
                () => analytics.regionList.find(r => r.id === selectedRegionId) || analytics.regionList[analytics.regionList.length - 1],
                [analytics.regionList, selectedRegionId]
            );
            const maxRegionUsers = useMemo(
                () => Math.max(1, ...analytics.regionList.map(r => r.users || 0)),
                [analytics.regionList]
            );

            // 3. AI Executive Policy Brief & TTS Readout
            const stopVoice = useCallback(() => {
                if (ttsAudioRef.current) { try { ttsAudioRef.current.pause(); } catch (_) {} ttsAudioRef.current = null; }
                if (ttsUrlRef.current) { try { URL.revokeObjectURL(ttsUrlRef.current); } catch (_) {} ttsUrlRef.current = null; }
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (_) {} }
                setIsSpeaking(false);
            }, []);
            useEffect(() => () => stopVoice(), [stopVoice]);

            const handleSpeakExecutiveSummary = async (textToRead) => {
                if (isSpeaking) { stopVoice(); return; }
                const clean = String(textToRead || '').replace(/[*#•📊]/g, ' ').replace(/\s{2,}/g, ' ').trim();
                if (!clean) return;
                setIsSpeaking(true);

                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 16000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST',
                            redirect: 'follow',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGeminiTTS',
                                text: clean.slice(0, 700),
                                voiceName: 'Sulafat',
                                languageCode: 'th-TH',
                                style: 'พูดภาษาไทยด้วยน้ำเสียงสุภาพ มั่นใจ เป็นทางการระดับผู้บริหารสาธารณสุข'
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const res = JSON.parse((await rawRes.text()) || '{}');
                        if (res?.status === 'success' && res.inlineData?.data && typeof CORE.pcm16ToWavBlob === 'function') {
                            const rate = parseInt(res.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] ?? '24000', 10);
                            const blob = CORE.pcm16ToWavBlob(res.inlineData.data, rate);
                            if (blob && blob.size > 0) {
                                const url = URL.createObjectURL(blob);
                                ttsUrlRef.current = url;
                                const a = new Audio(url);
                                ttsAudioRef.current = a;
                                a.onended = () => stopVoice();
                                a.onerror = () => stopVoice();
                                a.play().catch(() => stopVoice());
                                return;
                            }
                        }
                    } catch (_) {}
                }

                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(clean.slice(0, 700));
                    u.lang = 'th-TH';
                    u.rate = 0.96;
                    u.onend = () => stopVoice();
                    u.onerror = () => stopVoice();
                    window.speechSynthesis.speak(u);
                } else {
                    stopVoice();
                }
            };

            const handleAskExecutiveAi = async (e, presetQ = null) => {
                if (e) e.preventDefault();
                const q = String(presetQ ?? aiQuestion).trim();
                if (!q || aiBusy) return;
                stopVoice();
                setAiQuestion('');
                setAiBusy(true);

                const statsPayload = {
                    totalUsers: analytics.total.users,
                    passedUsers: analytics.total.passed,
                    passRatePercent: analytics.passRate,
                    labUsers: analytics.total.lab,
                    csatAverageOutOf5: analytics.avgCsat,
                    csatRespondents: analytics.csatCount,
                    avgEmpathyIndex: analytics.avgSkillScore,
                    susUsabilityScoreOutOf100: analytics.avgSusNum,
                    susGrade: analytics.susGrade,
                    preToPostSelfEfficacy: analytics.avgPreEff && analytics.avgPostEff
                        ? { pre: analytics.avgPreEff, post: analytics.avgPostEff, gain: analytics.effGain, n: analytics.effPairedCount }
                        : null,
                    quotaMode: isEcoSummaryMode ? 'Eco 1-Read Summary (executive_summary/global)' : 'Deep Telemetry (executive_telemetry)',
                    nationalFiveAxisRadar: analytics.hasNationalRadar ? analytics.nationalRadar : null,
                    nationalClinicalDomains: analytics.hasNationalDomains ? analytics.nationalDomains.map(d => ({ name: d.shortName, avg: d.avg })) : null,
                    topRegion: { name: analytics.maxRegion.name, users: analytics.maxRegion.users },
                    lowestRegion: { name: analytics.minRegion.name, users: analytics.minRegion.users }
                };

                let reply = '';
                if (appsScriptUrl && navigator.onLine) {
                    try {
                        const ctrl = new AbortController();
                        const tm = setTimeout(() => ctrl.abort(), 14000);
                        const rawRes = await fetch(appsScriptUrl, {
                            method: 'POST',
                            redirect: 'follow',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'callGemini',
                                prompt: `คำถามผู้บริหาร: ${q}\nข้อมูลสถิติไม่ระบุตัวตน (Zero-PII):\n${JSON.stringify(statsPayload)}`,
                                systemInstruction: 'คุณคือ AI ที่ปรึกษาเชิงนโยบายด้านการรับบริจาคและปลูกถ่ายอวัยวะ (Organ Transplantation Center of Rajavithi Hospital) ตอบเป็นภาษาไทยที่กระชับ มีตัวเลขชัดเจน เป็นข้อๆ อ่านง่ายสำหรับผู้บริหารระดับกระทรวง และห้ามระบุชื่อบุคคลใดๆ (PDPA Zero-PII)'
                            }),
                            signal: ctrl.signal
                        });
                        clearTimeout(tm);
                        const res = JSON.parse((await rawRes.text()) || '{}');
                        if (res?.status === 'success' && res.text) reply = res.text;
                    } catch (_) {}
                }
                if (!reply) reply = generateLocalExecutiveAnswer(q, analytics, activeRegion);
                setAiAnswer(reply);
                setAiBusy(false);
            };

            const quickPrompts = [
                'จุดอ่อนและหัวข้อที่ควรจัดอบรมเสริมคืออะไร?',
                'สรุปผลวิจัย R2R (SUS และความมั่นใจก่อน-หลังฝึก)',
                'เขตสุขภาพไหนควรเร่งสนับสนุนเชิงรุก?',
                'สรุปภาพรวมบุคลากรและดัชนี Empathy'
            ];

            const policyBriefText = useMemo(() => {
                const r2rLine = (analytics.avgSusNum !== null || analytics.effGain !== null)
                    ? `\n• ตัวชี้วัดวิจัย R2R: SUS ${analytics.avgSusNum !== null ? `${analytics.avgSusNum}/100 (${analytics.susGrade})` : 'รอข้อมูล'} | ความมั่นใจก่อน→หลังฝึก ${analytics.avgPreEff && analytics.avgPostEff ? `${analytics.avgPreEff}→${analytics.avgPostEff}/5` : 'รอข้อมูล'}`
                    : '';
                const gapText = (analytics.hasNationalDomains || analytics.hasNationalRadar)
                    ? `\n\n[2] จุดอ่อนทางคลินิกและทักษะที่ควรเสริม:\n• หมวดความรู้ที่ควรเร่งเสริม: ${analytics.nationalWeakestDomain.shortName} (${analytics.nationalWeakestDomain.avg}%)\n• แกนสื่อสาร AI Skill Lab ที่ควรเน้น: ${analytics.nationalWeakestAxis.labelTH} (${analytics.nationalWeakestAxis.avg}/100)`
                    : '';
                return `📊 rjcloud.organ 2.0 — Executive Policy Brief (PDPA Zero-PII):\n\n[1] ภาพรวมบุคลากรระดับประเทศ:\n• บุคลากรทั้งหมด ${analytics.total.users.toLocaleString()} ราย | สอบผ่าน Post-test ≥80% แล้ว ${analytics.total.passed.toLocaleString()} ราย (${analytics.passRate}%)\n• ดัชนี Empathy เฉลี่ย (AI Skill Lab): ${analytics.avgSkillScore}/100 | CSAT เฉลี่ย: ${analytics.avgCsat}/5.0${r2rLine}${gapText}\n\n[3] มิติความเหลื่อมล้ำเชิงพื้นที่ (13 เขตสุขภาพ):\n• เขตนำร่องสูงสุด: ${analytics.maxRegion.name} (${analytics.maxRegion.users} ราย)\n• พื้นที่ควรเร่งสนับสนุน: ${analytics.minRegion.name} (${analytics.minRegion.users} ราย)`;
            }, [analytics]);

            return (
                <div className="min-h-dvh relative flex flex-col pt-safe pb-safe">
                    <div className="spatial-aura" /><div className="spatial-grid" />

                    {/* Top Header */}
                    <header className="sticky top-0 z-30 spatial-header">
                        <div className="max-w-7xl mx-auto px-3.5 sm:px-6 h-14 md:h-16 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <a href="./index.html" aria-label="กลับหน้าหลัก" className="w-9 h-9 rounded-xl spatial-soft text-primary-adaptive flex items-center justify-center shrink-0">
                                    <Icon name="ArrowLeft" size={18} />
                                </a>
                                <div className="min-w-0">
                                    <span className="font-display font-extrabold text-sm sm:text-base text-primary-adaptive block leading-none truncate">
                                        rjcloud<span className="text-accent-adaptive">.organ</span> <span className="font-mono text-[10px] text-prism-adaptive">2.0</span>
                                    </span>
                                    <span className="text-[10px] font-mono text-muted-adaptive block truncate">
                                        National 13-Region Executive Dashboard • PDPA Zero-PII
                                    </span>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                                <span className="hidden md:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-aurora-500/15 border border-aurora-400/35 text-accent-adaptive font-mono text-[10px] font-bold">
                                    <Icon name="ShieldCheck" size={13} /> ZERO-PII PROTECTED
                                </span>
                                <ThemeToggleButton theme={theme} onToggle={toggleTheme} />
                            </div>
                        </div>
                    </header>

                    {/* Main Dashboard Content */}
                    <main className="relative z-10 max-w-7xl w-full mx-auto px-3.5 sm:px-6 py-5 sm:py-7 space-y-5">
                        {isLoadingCloud ? (
                            <div className="spatial-card rounded-[2rem] p-12 text-center space-y-3">
                                <div className="w-10 h-10 border-4 border-aurora-400 border-t-transparent rounded-full animate-spin mx-auto" />
                                <p className="font-display font-bold text-sm text-primary-adaptive">กำลังเชื่อมต่อข้อมูลสถิติ 13 เขตสุขภาพ (PDPA Zero-PII)...</p>
                            </div>
                        ) : (
                            <>
                                {/* 1. KPI Summary Strip */}
                                <section className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase block">TOTAL LEARNERS</span>
                                        <p className="font-mono text-2xl sm:text-3xl font-extrabold text-primary-adaptive mt-1">{analytics.total.users.toLocaleString()}</p>
                                        <p className="text-[11px] text-secondary-adaptive mt-1">กำลังเรียน <b>{analytics.total.learning.toLocaleString()}</b> ราย</p>
                                    </div>
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase block">CERTIFIED (≥80%)</span>
                                        <p className="font-mono text-2xl sm:text-3xl font-extrabold text-accent-adaptive mt-1">{analytics.total.passed.toLocaleString()}</p>
                                        <p className="text-[11px] text-secondary-adaptive mt-1">อัตราผ่าน <b>{analytics.passRate}%</b></p>
                                    </div>
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-violet-400 uppercase block">AI SKILL LAB EMPATHY</span>
                                        <p className="font-mono text-2xl sm:text-3xl font-extrabold text-violet-400 mt-1">{analytics.avgSkillScore}<span className="text-sm text-muted-adaptive">/100</span></p>
                                        <p className="text-[11px] text-secondary-adaptive mt-1">ผ่านฝึก 3 มิติ <b>{analytics.total.lab.toLocaleString()}</b> ราย</p>
                                    </div>
                                    <div className="spatial-card rounded-[1.5rem] p-4 sm:p-5">
                                        <span className="font-mono text-[10px] font-bold text-amber-400 uppercase block">CNEU CSAT SCORE</span>
                                        <p className="font-mono text-2xl sm:text-3xl font-extrabold text-amber-400 mt-1">{analytics.avgCsat}<span className="text-sm text-muted-adaptive">/5.0</span></p>
                                        <p className="text-[11px] text-secondary-adaptive mt-1">จากผู้ประเมิน <b>{analytics.csatCount.toLocaleString()}</b> ราย</p>
                                    </div>
                                </section>

                                {/* 2. Zero-Cost Scalability Guard + National R2R Research Metrics (SUS & Self-Efficacy) */}
                                <section className="spatial-card rounded-[1.75rem] p-4 sm:p-5 border-prism-400/35 space-y-3.5">
                                    <div className="flex flex-wrap items-center justify-between gap-2.5">
                                        <span className={`px-3 py-1 rounded-full font-mono text-[10px] font-bold inline-flex items-center gap-1.5 ${
                                            isEcoSummaryMode
                                                ? 'bg-aurora-500/20 text-accent-adaptive border border-aurora-400/40'
                                                : 'bg-prism-500/20 text-prism-adaptive border border-prism-400/40'
                                        }`}>
                                            <Icon name={isEcoSummaryMode ? 'Zap' : 'Microscope'} size={13} />
                                            {isEcoSummaryMode
                                                ? 'ECO 1-READ MODE • ประหยัดโควต้า Firebase ฟรี >99%'
                                                : (isAdminPreview ? 'PREVIEW MODE • ข้อมูลตัวอย่าง 13 เขต' : 'DEEP TELEMETRY MODE • เรดาร์ 5 แกน & 4 หมวดคลินิก')}
                                        </span>

                                        <div className="flex items-center gap-2">
                                            {isEcoSummaryMode ? (
                                                <button
                                                    type="button"
                                                    onClick={() => setDeepTelemetryEnabled(true)}
                                                    className="rjc2-pill-btn px-4 py-1.5 rounded-full font-display font-extrabold text-xs inline-flex items-center gap-1.5"
                                                >
                                                    <Icon name="Radar" size={14} /> โหลดเรดาร์ 5 แกน &amp; เจาะลึกรายเขต
                                                </button>
                                            ) : (
                                                globalSummaryDoc && (
                                                    <button
                                                        type="button"
                                                        onClick={() => setDeepTelemetryEnabled(false)}
                                                        className="spatial-soft px-3.5 py-1.5 rounded-full text-xs font-bold text-accent-adaptive inline-flex items-center gap-1.5"
                                                    >
                                                        <Icon name="Zap" size={14} /> สลับกลับโหมดประหยัด (1 Read)
                                                    </button>
                                                )
                                            )}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                                        <div className="spatial-soft rounded-2xl p-3.5 space-y-1">
                                            <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase block">SYSTEM USABILITY SCALE (SUS • R2R)</span>
                                            <div className="flex items-baseline gap-1.5">
                                                <span className="font-mono text-2xl font-extrabold text-primary-adaptive">
                                                    {analytics.avgSusNum !== null ? analytics.avgSusNum : '-'}
                                                </span>
                                                <span className="font-mono text-xs text-muted-adaptive">/100</span>
                                            </div>
                                            <p className="text-[11px] font-bold text-accent-adaptive">
                                                {analytics.susCount > 0 ? `${analytics.susGrade} (n=${analytics.susCount})` : 'รอข้อมูลจากแบบประเมินขั้นที่ 5'}
                                            </p>
                                        </div>

                                        <div className="spatial-soft rounded-2xl p-3.5 space-y-1">
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase block">PRE → POST SELF-EFFICACY (AI LAB)</span>
                                            <p className="font-mono text-2xl font-extrabold text-accent-adaptive">
                                                {analytics.avgPreEff !== null && analytics.avgPostEff !== null
                                                    ? `${analytics.avgPreEff} → ${analytics.avgPostEff}`
                                                    : '-'}
                                            </p>
                                            <p className="text-[11px] font-bold text-secondary-adaptive">
                                                {analytics.effGain !== null
                                                    ? `ความมั่นใจเพิ่ม ${Number(analytics.effGain) >= 0 ? `+${analytics.effGain}` : analytics.effGain} / 5 (n=${analytics.effPairedCount})`
                                                    : 'รอข้อมูลจากห้องฝึก AI Skill Lab 3D'}
                                            </p>
                                        </div>

                                        <div className="spatial-soft rounded-2xl p-3.5 space-y-1">
                                            <span className="font-mono text-[10px] font-bold text-amber-400 uppercase block">FIREBASE READ EFFICIENCY</span>
                                            <p className="font-mono text-2xl font-extrabold text-amber-400">
                                                {isEcoSummaryMode ? '1 Read' : `${activeStatsRows.length} Docs`}
                                            </p>
                                            <p className="text-[11px] text-muted-adaptive leading-snug">
                                                {isEcoSummaryMode
                                                    ? 'อ่านจาก executive_summary/global ใบเดียว รองรับผู้เรียนหลักหมื่นฟรี'
                                                    : (isLoadingDeep ? 'กำลังโหลดข้อมูลเจาะลึกรายเขต...' : 'กำลังแสดงผลสถิติเจาะลึกครบ 5 แกน & 4 หมวด')}
                                            </p>
                                        </div>
                                    </div>
                                </section>

                                {/* 3. 13 Health Regions Interactive Matrix + Selected Region Deep Dive */}
                                <section className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                    <div className="lg:col-span-7 spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5">
                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">THAILAND 13 HEALTH REGIONS COVERAGE</span>
                                                <h2 className="font-display font-extrabold text-base sm:text-lg text-primary-adaptive">สถิติบุคลากรแยกตาม 13 เขตสุขภาพ</h2>
                                            </div>
                                            <span className="text-[11px] text-muted-adaptive">แตะเขตสุขภาพเพื่อเจาะลึก</span>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            {analytics.regionList.map(r => {
                                                const active = activeRegion && activeRegion.id === r.id;
                                                const barW = Math.max(4, Math.round((r.users / maxRegionUsers) * 100));
                                                return (
                                                    <button
                                                        key={r.id}
                                                        type="button"
                                                        onClick={() => setSelectedRegionId(r.id)}
                                                        className={`text-left p-3 rounded-2xl border transition-all space-y-1.5 ${
                                                            active
                                                                ? 'bg-aurora-500/20 border-aurora-400 shadow-md'
                                                                : 'spatial-soft hover:border-prism-400/50'
                                                        }`}
                                                    >
                                                        <div className="flex items-center justify-between gap-2">
                                                            <span className="font-display font-bold text-xs sm:text-sm text-primary-adaptive truncate">{r.name}</span>
                                                            <span className="font-mono text-xs font-extrabold text-accent-adaptive shrink-0">{r.users} ราย</span>
                                                        </div>
                                                        <div className="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
                                                            <div className="h-full rounded-full bg-gradient-to-r from-aurora-400 to-prism-400" style={{ width: `${r.users > 0 ? barW : 0}%` }} />
                                                        </div>
                                                        <div className="flex items-center justify-between text-[10px] text-muted-adaptive">
                                                            <span className="truncate">{r.area}</span>
                                                            <span className="font-mono font-bold text-prism-adaptive shrink-0">ผ่าน {r.passPct}%</span>
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Selected Region Detail + 5-Axis Radar */}
                                    <div className="lg:col-span-5 spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-4">
                                        {activeRegion && (
                                            <>
                                                <div>
                                                    <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">REGIONAL COMPETENCY RADAR</span>
                                                    <h3 className="font-display font-extrabold text-lg text-primary-adaptive">{activeRegion.name}</h3>
                                                    <p className="text-xs text-muted-adaptive mt-0.5">{activeRegion.provinces}</p>
                                                </div>

                                                <div className="grid grid-cols-3 gap-2 text-center text-xs">
                                                    <div className="spatial-soft p-2.5 rounded-xl">
                                                        <span className="text-[10px] text-muted-adaptive block">ทั้งหมด</span>
                                                        <span className="font-mono text-base font-extrabold text-primary-adaptive">{activeRegion.users}</span>
                                                    </div>
                                                    <div className="spatial-soft p-2.5 rounded-xl">
                                                        <span className="text-[10px] text-muted-adaptive block">สอบผ่าน</span>
                                                        <span className="font-mono text-base font-extrabold text-accent-adaptive">{activeRegion.passed}</span>
                                                    </div>
                                                    <div className="spatial-soft p-2.5 rounded-xl">
                                                        <span className="text-[10px] text-muted-adaptive block">Empathy</span>
                                                        <span className="font-mono text-base font-extrabold text-prism-adaptive">{activeRegion.avgEmpathy || '-'}</span>
                                                    </div>
                                                </div>

                                                {activeRegion.hasRadarData ? (
                                                    <div className="spatial-soft rounded-2xl p-3">
                                                        <FiveAxisRadarSVG radarObj={activeRegion.radar} theme={theme} />
                                                    </div>
                                                ) : (
                                                    <div className="spatial-soft rounded-2xl p-5 text-center space-y-2 text-xs">
                                                        <p className="text-secondary-adaptive">
                                                            {isEcoSummaryMode
                                                                ? 'ขณะนี้อยู่ในโหมดประหยัด 1 Read เพื่อรักษาโควต้า Firebase ฟรี'
                                                                : 'ยังไม่มีผลเรดาร์ AI Skill Lab ในเขตสุขภาพนี้'}
                                                        </p>
                                                        {isEcoSummaryMode && (
                                                            <button type="button" onClick={() => setDeepTelemetryEnabled(true)} className="rjc2-pill-btn px-4 py-2 rounded-full font-display font-extrabold text-xs">
                                                                โหลดเรดาร์ 5 แกนรายเขต →
                                                            </button>
                                                        )}
                                                    </div>
                                                )}

                                                {activeRegion.hasDomainData && (
                                                    <div className="space-y-2 text-xs">
                                                        <p className="font-mono text-[10px] font-bold text-prism-adaptive uppercase">คะแนนเฉลี่ย 4 หมวดคลินิกในเขตนี้</p>
                                                        {activeRegion.domains.map(d => (
                                                            <div key={d.id} className="space-y-1">
                                                                <div className="flex justify-between font-bold">
                                                                    <span className="text-secondary-adaptive">{d.shortName}</span>
                                                                    <span className="font-mono" style={{ color: d.color }}>{d.avg}%</span>
                                                                </div>
                                                                <div className="h-1.5 rounded-full bg-white/10 overflow-hidden">
                                                                    <div className="h-full rounded-full" style={{ width: `${d.avg}%`, backgroundColor: d.color }} />
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                <div className="p-3 rounded-2xl bg-aurora-500/10 border border-aurora-400/30 text-[11px] text-primary-adaptive leading-relaxed">
                                                    {activeRegion.hasDomainData || activeRegion.hasRadarData ? (
                                                        <>
                                                            <b className="text-accent-adaptive">AI แนะนำสำหรับ {activeRegion.name}:</b>{' '}
                                                            {activeRegion.hasDomainData && <>เสริมเรื่อง <b>{activeRegion.weakestDomain.shortName}</b> ({activeRegion.weakestDomain.avg}%)</>}
                                                            {activeRegion.hasDomainData && activeRegion.hasRadarData && ' และ'}
                                                            {activeRegion.hasRadarData && <>ฝึก <b>{activeRegion.weakestAxis.labelTH}</b> ({activeRegion.weakestAxis.avg}/100)</>}
                                                        </>
                                                    ) : (
                                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                                            <span className="text-secondary-adaptive">
                                                                <b className="text-accent-adaptive">สถิติ {activeRegion.name}:</b> บุคลากรทั้งหมด <b className="font-mono">{activeRegion.users}</b> ราย • ผ่านเกณฑ์ <b className="font-mono">{activeRegion.passed}</b> ราย ({activeRegion.passPct}%)
                                                            </span>
                                                            {isEcoSummaryMode && (
                                                                <button
                                                                    type="button"
                                                                    onClick={() => setDeepTelemetryEnabled(true)}
                                                                    className="px-2.5 py-1 rounded-lg bg-prism-500/20 text-prism-adaptive font-bold text-[10px] hover:bg-prism-500/30 shrink-0"
                                                                >
                                                                    โหลดเรดาร์ 5 แกน →
                                                                </button>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </section>

                                {/* 4. AI Executive Policy Brief & Interactive Q&A */}
                                <section className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                                    <div className="lg:col-span-5 spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3">
                                        <div className="flex items-center justify-between gap-2">
                                            <div>
                                                <span className="font-mono text-[10px] font-bold text-amber-400 uppercase">AUTO POLICY BRIEF</span>
                                                <h3 className="font-display font-extrabold text-base text-primary-adaptive">รายงานสรุปผู้บริหารพร้อมส่งต่อ</h3>
                                            </div>
                                            <div className="flex items-center gap-1.5">
                                                <button
                                                    type="button"
                                                    onClick={() => handleSpeakExecutiveSummary(aiAnswer || policyBriefText)}
                                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold inline-flex items-center gap-1 ${isSpeaking ? 'bg-rose-500 text-white' : 'spatial-soft text-prism-adaptive'}`}
                                                >
                                                    <Icon name={isSpeaking ? 'Square' : 'Volume2'} size={14} /> {isSpeaking ? 'หยุด' : 'ฟังสรุป'}
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => { copyTextSafe(aiAnswer || policyBriefText); showToast('คัดลอกรายงาน Policy Brief เรียบร้อยค่ะ'); }}
                                                    className="spatial-soft px-3 py-1.5 rounded-xl text-xs font-bold text-accent-adaptive inline-flex items-center gap-1"
                                                >
                                                    <Icon name="Copy" size={14} /> คัดลอก
                                                </button>
                                            </div>
                                        </div>
                                        <pre className="spatial-soft p-3.5 rounded-2xl text-xs text-secondary-adaptive whitespace-pre-wrap font-sans leading-relaxed">
                                            {policyBriefText}
                                        </pre>
                                    </div>

                                    <div className="lg:col-span-7 spatial-card rounded-[1.75rem] p-4 sm:p-5 space-y-3.5">
                                        <div>
                                            <span className="font-mono text-[10px] font-bold text-accent-adaptive uppercase">AI EXECUTIVE POLICY ANALYST</span>
                                            <h3 className="font-display font-extrabold text-base text-primary-adaptive">ถาม AI วิเคราะห์นโยบายและผลวิจัย R2R</h3>
                                        </div>

                                        <div className="flex flex-wrap gap-1.5">
                                            {quickPrompts.map((qp, i) => (
                                                <button key={i} type="button" disabled={aiBusy} onClick={() => handleAskExecutiveAi(null, qp)} className="spatial-soft px-3 py-1.5 rounded-full text-xs font-bold text-prism-adaptive hover:border-prism-400">
                                                    {qp}
                                                </button>
                                            ))}
                                        </div>

                                        {aiAnswer && (
                                            <div className="p-4 rounded-2xl bg-aurora-500/10 border border-aurora-400/35 text-xs sm:text-sm text-primary-adaptive whitespace-pre-line leading-relaxed">
                                                {aiAnswer}
                                            </div>
                                        )}

                                        <form onSubmit={(e) => handleAskExecutiveAi(e)} className="flex items-center gap-2">
                                            <input
                                                type="text"
                                                value={aiQuestion}
                                                onChange={e => setAiQuestion(e.target.value)}
                                                disabled={aiBusy}
                                                placeholder="พิมพ์คำถามเชิงนโยบาย เช่น เขตไหนควรเร่งสนับสนุน หรือสรุปค่า SUS..."
                                                className="touch-target spatial-input flex-1 px-4 py-2.5 rounded-2xl text-sm"
                                            />
                                            <button type="submit" disabled={!aiQuestion.trim() || aiBusy} className="rjc2-pill-btn touch-target px-5 rounded-2xl font-display font-extrabold text-xs shrink-0 disabled:opacity-40">
                                                {aiBusy ? 'กำลังวิเคราะห์...' : 'ถาม AI'}
                                            </button>
                                        </form>
                                    </div>
                                </section>
                            </>
                        )}
                    </main>

                    <ToastBanner toast={toast} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('executive-root'));
        root.render(<ExecutiveErrorBoundary><ExecutiveApp /></ExecutiveErrorBoundary>);
    </script>
</body>
</html>
